<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eldoria v0.19.5</title><style>html,body{margin:0;height:100%;background:#090c0f;color:#eee;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spinner{width:34px;height:34px;border:3px solid #333;border-top-color:#d6b66f;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spinner"></div><div id="s">Cargando Eldoria v0.19.5…</div></div><script>(async()=>{try{const files=['d0.txt','r1.txt','r2.txt','r3.txt','r4.txt','r5a.txt','r5b.txt','r6a.txt','r6b.txt'];let b64='';for(const file of files){const r=await fetch(file,{cache:'no-store'});if(!r.ok)throw new Error('No se pudo cargar '+file);b64+=(await r.text()).trim();}const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Navegador sin descompresión web');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('s').textContent='No se pudo cargar Eldoria v0.19.5. Recarga la página.';console.error(e);}})();</script></body></html>
