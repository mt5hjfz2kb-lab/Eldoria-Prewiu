<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eldoria · Prueba 4X</title><style>
:root{--gold:#d6b66f;--rift:#b335ff;--ink:#ece6d8;--muted:#a9aaa2;--ok:#7fb078}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080d0f;color:var(--ink);font-family:Georgia,serif;overflow:hidden}button,select,textarea{font:inherit;color:inherit}.app{height:100%;max-width:900px;margin:auto;position:relative;background:#0d1517;overflow:hidden}.top{height:72px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0a1013ee;border-bottom:1px solid #d6b66f44;z-index:20;position:relative}.crest{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);font-size:27px;clip-path:polygon(50% 0,92% 20%,84% 83%,50% 100%,16% 83%,8% 20%)}.title b{display:block;font-size:15px}.title small{font:9px Arial;color:var(--muted)}.power{margin-left:auto;text-align:right}.power b{color:#f0d693}.power small{display:block;font:8px Arial;color:#aaa}.map{position:absolute;inset:72px 0 0;background:radial-gradient(circle at 78% 25%,#74217d4b,transparent 22%),radial-gradient(circle at 20% 80%,#254d3347,transparent 26%),linear-gradient(145deg,#182421,#0e1718 55%,#181423)}.map:before{content:'';position:absolute;inset:-25%;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:44px 44px;transform:rotate(-8deg)}.riftzone{position:absolute;right:4%;top:7%;width:38%;height:47%;border-radius:50%;background:radial-gradient(ellipse,#a62bd34b,#4b165b2a 55%,transparent 73%);animation:pulse 2.6s infinite alternate}.riftzone.expanded{width:48%;height:58%;right:-2%;top:2%;background:radial-gradient(ellipse,#bc32ed66,#5e1d7338 56%,transparent 74%)}@keyframes pulse{to{transform:scale(1.035);filter:brightness(1.2)}}.server{position:absolute;z-index:8;right:10px;top:10px;background:#071012e8;border:1px solid #ffffff20;padding:8px 10px;font:9px Arial;line-height:1.5}.server b{color:var(--gold)}.server .c{color:#d49cff}.server .t{color:#a9d3b6}.tag{position:absolute;z-index:8;left:10px;top:10px;background:#071012e8;border-left:3px solid var(--gold);padding:8px 10px}.tag small{display:block;font:8px Arial;color:var(--gold);letter-spacing:.14em}.tag b{font-size:16px}.node{position:absolute;z-index:8;transform:translate(-50%,-50%);min-width:80px;padding:6px;border-radius:6px;border:1px solid #ffffff2b;background:#0e1819e8;text-align:center;cursor:pointer;box-shadow:0 6px 16px #0008}.node span{font-size:26px;display:block}.node b{font:9px Arial;display:block;margin-top:2px}.node small{font:7px Arial;color:#aaa;display:block;margin-top:2px}.node.home{border-color:var(--gold);box-shadow:0 0 24px #d6b66f44}.node.rival{border-color:#c05d5d99}.node.res{border-color:#72a88d99}.node.breach{border-color:#c05cffaa;box-shadow:0 0 25px #a234d955}.node.you{border-color:#7cb476;box-shadow:0 0 22px #7cb47655}.node.poi{border-color:#a68bd299}.road{position:absolute;height:2px;background:linear-gradient(90deg,#8b7c5c33,#d0ba7c88,#8b7c5c33);transform-origin:left center;z-index:3}.march{position:absolute;z-index:20;font-size:24px;filter:drop-shadow(0 3px 3px #000);transition:left 1.4s ease,top 1.4s ease}.goal{position:absolute;z-index:9;right:8px;bottom:8px;width:min(330px,58%);background:#071012eb;border-left:3px solid var(--gold);padding:9px 10px;font:9px Arial}.goal strong{display:block;color:#f0d693}.dots{display:flex;gap:5px;margin-top:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#323b3b}.dots i.on{background:var(--ok);box-shadow:0 0 8px #7fb078}.legend{position:absolute;z-index:9;left:8px;bottom:8px;background:#071012e5;border:1px solid #ffffff18;padding:7px 9px;font:8px Arial;color:#aaa}.overlay{position:fixed;inset:0;background:#020405c8;backdrop-filter:blur(5px);z-index:50;display:grid;place-items:center;padding:16px}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#20282d,#0e1317);border:1px solid #d6b66f66;padding:23px;box-shadow:0 28px 80px #000}.modal h2{text-align:center;color:var(--gold);font-weight:normal;margin:0 0 18px}.modal p{font:13px/1.5 Arial;color:#c9c8bf}.icon{text-align:center;font-size:60px;color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.grid div{background:#0a1013;border:1px solid #ffffff14;padding:9px}.grid small{font:8px Arial;color:#999;display:block}.grid b{display:block;color:#e4d09d;margin-top:4px}.btn{width:100%;padding:12px;margin-top:10px;border:1px solid #e0c781;background:linear-gradient(#ae8c4b,#684e24);font:bold 11px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn.alt{background:#171e22}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.survey label{display:block;margin-top:10px;font:11px Arial}.survey select,.survey textarea{width:100%;margin-top:4px;padding:8px;background:#0a1013;border:1px solid #ffffff20}.survey textarea{min-height:65px}.toast{position:fixed;z-index:80;left:50%;bottom:18px;transform:translateX(-50%);background:#0a1114;border:1px solid #d6b66f66;padding:9px 14px;font:11px Arial;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.complete{text-align:center}.complete .sig{font-size:65px;color:#ca68ff;text-shadow:0 0 26px #ad35ea}@media(max-width:600px){.top{height:68px}.map{inset:68px 0 0}.server{font-size:7px;max-width:158px}.tag{max-width:158px}.tag b{font-size:13px}.node{min-width:66px;padding:5px}.node span{font-size:22px}.node b{font-size:7px}.node small{font-size:6px}.goal{width:57%;font-size:8px}.legend{font-size:7px}.choice{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="top"><div class="crest">♜</div><div class="title"><b>ELDORIA</b><small>Prueba de mundo 4X · v0.18</small></div><div class="power"><b>⚔ 7.820</b><small>PODER TOTAL</small></div></header><section class="map" id="map"></section></main><div id="modal"></div><div class="toast" id="toast"></div><script>
const S=JSON.parse(localStorage.getItem('eldoria-world4x')||'null')||{g:false,c:false,b:false,cor:34,trend:'Equilibrio',owner:'Cuervos de Ceniza',answers:{}};const N={home:[47,68,'home','♜','Bastión de Valoria','TU REINO'],r1:[18,25,'rival','♜','Serah del Velo','Poder 6.120 · [VIG]'],r2:[80,77,'rival','♜','Orik Ceniza','Poder 4.850 · [CUER]'],r3:[73,18,'rival','♜','Vael Thorn','Poder 7.340 · [UMB]'],forest:[27,59,'res','♠','Bosque seguro','+180 madera'],quarry:[62,53,'res','◆','Cantera disputada','Ocupada · Cuervos de Ceniza'],monster:[36,28,'poi','♞','Bestia de ceniza','PvE · Poder 1.900'],breach:[84,38,'breach','✦','Zona de la Brecha','Riesgo alto · recompensa rara'],fort:[54,17,'poi','♛','Fortaleza del Umbral','Clan Umbra']};const $=s=>document.querySelector(s);function save(){localStorage.setItem('eldoria-world4x',JSON.stringify(S))}function road(a,b){let A=N[a],B=N[b],dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `<i class="road" style="left:${A[0]}%;top:${A[1]}%;width:${l}%;transform:rotate(${ang}deg)"></i>`}function goal(){return !S.g?'Envía una marcha al <b>Bosque seguro</b>.':!S.c?'Ahora prueba la <b>Cantera disputada</b>.':!S.b?'Decide qué hacer con la <b>Zona de la Brecha</b>.':'<b>Prueba completada.</b> Toca La Brecha para responder la encuesta.'}function render(){let nodes=Object.entries(N).map(([id,n])=>`<button class="node ${n[2]} ${id==='quarry'&&S.owner==='Valoria'?'you':''}" data-id="${id}" style="left:${n[0]}%;top:${n[1]}%"><span>${n[3]}</span><b>${id==='quarry'&&S.owner==='Valoria'?'Cantera de Valoria':n[4]}</b><small>${id==='quarry'&&S.owner==='Valoria'?'Bajo tu control · +120 piedra':n[5]}</small></button>`).join('');$('#map').innerHTML=`<div class="riftzone ${S.b&&S.trend==='Explotación'?'expanded':''}"></div><div class="tag"><small>MAPA GLOBAL · PROTOTIPO</small><b>Tierras de Valoria</b></div><div class="server"><b>MADUREZ I</b> · Edad de La Brecha II<br><span class="c">Corrupción ${S.cor}%</span> · <span class="t">${S.trend}</span></div>${road('home','forest')}${road('home','quarry')}${road('home','breach')}${road('home','monster')}${nodes}<div class="legend"><b>Simulación</b><br>Las otras ciudades no son jugadores reales.</div><div class="goal"><strong>OBJETIVO</strong>${goal()}<div class="dots"><i class="${S.g?'on':''}"></i><i class="${S.c?'on':''}"></i><i class="${S.b?'on':''}"></i></div></div>`;document.querySelectorAll('.node').forEach(x=>x.onclick=()=>inspect(x.dataset.id))}function modal(title,html){$('#modal').innerHTML=`<div class="overlay"><section class="modal"><h2>${title}</h2>${html}</section></div>`}function closeModal(){ $('#modal').innerHTML='' }function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1900)}function march(id,cb){closeModal();let m=document.createElement('div'),h=N.home,n=N[id];m.className='march';m.textContent='⚑';m.style.left=h[0]+'%';m.style.top=h[1]+'%';$('#map').append(m);requestAnimationFrame(()=>requestAnimationFrame(()=>{m.style.left=n[0]+'%';m.style.top=n[1]+'%'}));setTimeout(()=>{m.remove();cb()},1550)}function inspect(id){if(id==='home')return modal('Bastión de Valoria','<div class="icon">♜</div><p>Tu reino existe físicamente dentro de un mundo mayor. Desde aquí parten tus marchas.</p><button class="btn alt" onclick="closeModal()">Cerrar</button>');if(id==='forest')return modal('Bosque seguro',`<div class="icon">♠</div><p>Recurso cercano. Riesgo bajo y recompensa modesta.</p><div class="grid"><div><small>DISTANCIA</small><b>00:08</b></div><div><small>RECOMPENSA</small><b>+180 madera</b></div></div><button class="btn" ${S.g?'disabled':''} onclick="march('forest',()=>{S.g=true;save();render();toast('+180 madera')})">${S.g?'Ya recolectado':'Enviar marcha'}</button>`);if(id==='quarry')return quarry();if(id==='breach')return S.b?survey():breach();if(id==='monster')return modal('Bestia de ceniza','<div class="icon">♞</div><p>Objetivo PvE del mapa. En el juego final enviarías una expedición con Poder de Expedición, no con todo tu Poder Total.</p><div class="grid"><div><small>RECOMENDADO</small><b>1.900</b></div><div><small>TU MARCHA</small><b>3.120</b></div></div><button class="btn alt" onclick="closeModal()">Cerrar</button>');if(id==='fort')return modal('Fortaleza del Umbral','<div class="icon">♛</div><p>Territorio controlado por el clan <b>Umbra</b>. Representa la futura guerra territorial entre clanes.</p><button class="btn alt" onclick="closeModal()">Cerrar</button>');let n=N[id];modal(n[4],`<div class="icon">♜</div><p>Otro reino del servidor. En el juego final podrás inspeccionar clan, marchas y protección.</p><div class="grid"><div><small>PODER TOTAL</small><b>${n[5].match(/[\d.]+/)?.[0]}</b></div><div><small>ESTADO</small><b>Activo</b></div></div><p><b>Más Poder no significará victoria automática.</b></p><button class="btn alt" onclick="closeModal()">Cerrar</button>`)}function quarry(){if(S.owner==='Valoria')return modal('Cantera de Valoria','<div class="icon">◆</div><p>Tus tropas han expulsado a la marcha rival. El nodo ha cambiado de dueño.</p><button class="btn alt" onclick="closeModal()">Cerrar</button>');modal('Cantera disputada','<div class="icon">◆</div><p>Una marcha de <b>Cuervos de Ceniza</b> ocupa este recurso. Puedes dejarla o disputar el nodo.</p><div class="grid"><div><small>RIVAL · MARCHA</small><b>2.350</b></div><div><small>TU EXPEDICIÓN</small><b>3.120</b></div></div><button class="btn" onclick="march(\'quarry\',()=>{S.c=true;S.owner=\'Valoria\';save();render();modal(\'Victoria en la cantera\',\'<div class=icon>⚔</div><p>La marcha rival se retira. <b>El mapa cambia de control.</b> Este conflicto conecta ejército, economía y mundo.</p><button class=btn onclick=closeModal()>Volver al mapa</button>\')})">Disputar el nodo</button><button class="btn alt" onclick="closeModal()">Ignorar</button>') }function breach(){modal('Zona de la Brecha',`<div class="icon">✦</div><p>La corrupción altera esta región. Tu decisión simula cómo una comunidad podría cambiar el estado de su servidor.</p><div class="grid"><div><small>CORRUPCIÓN</small><b>${S.cor}%</b></div><div><small>TENDENCIA</small><b>${S.trend}</b></div></div><div class="choice"><button class="btn alt" onclick="resolveB('Contención',-6)">Contener<br><small>−6% · segura</small></button><button class="btn" onclick="resolveB('Explotación',9)">Explotar<br><small>+9% · rara</small></button></div>`)}function resolveB(t,d){S.b=true;S.trend=t;S.cor=Math.max(0,Math.min(100,S.cor+d));save();closeModal();render();setTimeout(()=>modal('El mundo ha cambiado',`<div class="complete"><div class="sig">✦</div><h3>${t}</h3><p>${t==='Explotación'?'La corrupción se expande y los recursos raros aumentan.':'La corrupción retrocede y las rutas se estabilizan.'}</p><p><b>Este cambio pertenece a este servidor simulado.</b></p></div><button class="btn" onclick="closeModal();render();setTimeout(survey,250)">Ver mapa cambiado</button>`),250)}function survey(){modal('Prueba de mundo 4X','<div class="complete"><div class="sig">◈</div><h3>Tu reino ya no está solo.</h3><p>Has recolectado, disputado un recurso y cambiado el estado del mundo.</p></div><div class="survey"><label>¿El mapa te da más motivos para mejorar tu ciudad?<select id="a1"><option>—</option><option>Sí</option><option>Algo</option><option>No</option></select></label><label>¿Te apetecería explorar más?<select id="a2"><option>—</option><option>Sí</option><option>Quizá</option><option>No</option></select></label><label>¿Disputarías recursos a otros jugadores?<select id="a3"><option>—</option><option>Sí</option><option>Depende</option><option>No</option></select></label><label>¿Qué te interesó más?<textarea id="a4"></textarea></label></div><button class="btn" onclick="S.answers={motive:a1.value,explore:a2.value,pvp:a3.value,best:a4.value};save();closeModal();toast(\'Gracias · respuesta guardada en este dispositivo\')">Guardar</button>')}render();setTimeout(()=>modal('Eldoria · mundo 4X','<div class="icon">◈</div><p>Esta prueba complementaria busca saber si tu reino se siente más importante cuando existe dentro de un mundo con otros reinos, recursos, amenazas y La Brecha.</p><p>No hay jugadores reales ni PvP online todavía.</p><button class="btn" onclick="closeModal()">Entrar al mapa</button>'),250);
</script></body></html>
