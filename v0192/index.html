<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eldoria v0.19.2</title>
<style>html,body{margin:0;height:100%;background:#090c0f;color:#eee;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spinner{width:34px;height:34px;border:3px solid #333;border-top-color:#d6b66f;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="box"><div class="spinner"></div><div id="s">Cargando Eldoria v0.19.2…</div></div>
<script>
(async()=>{
  try{
    let b64='';
    for(let i=0;i<8;i++){
      const r=await fetch(`p${i}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`No se pudo cargar p${i}.txt`);
      b64+=(await r.text()).trim();
    }
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no soporta descompresión web.');
    const ds=new DecompressionStream('gzip');
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    const hotfix=`<style>
.chapter-list[hidden]{display:none!important}
@media(max-width:680px){
.modal{padding:20px 18px 24px;max-height:94dvh;overscroll-behavior:contain}.modal h2{margin:0 28px 18px;font-size:21px;line-height:1.25}.modal h3{line-height:1.3}.modal p{font-size:13px;line-height:1.65;margin:12px 0}.modal .primary,.modal .secondary{margin-top:14px;padding:14px 12px;line-height:1.35}.dialogue,.hero-sheet{gap:14px}
.quest-panel{top:88px;width:min(300px,82vw);max-width:none;padding:12px 13px;max-height:calc(100dvh - 180px);overflow:auto}.quest-panel p{font-size:11px;line-height:1.5;margin-bottom:10px}.chapter-toggle{padding:9px 10px;font-size:9px}.chapter-list{gap:8px;max-height:42dvh;margin-top:10px}.chapter-mission{padding:8px 9px;gap:8px;font-size:9px;line-height:1.4}
.hero-hall-compact{gap:14px}.hero-unit{padding:12px}.hero-stats{gap:7px;margin-top:11px}.hero-skill-box{margin-top:10px;padding:10px;line-height:1.45}.hero-actions{gap:8px;margin-top:10px}.resonance-panel{margin-top:16px;padding:12px}.card-collection{gap:12px}.card-decision{padding:16px 13px;gap:16px}.card-lore p{line-height:1.65}
.overlay:has(#duel-root){padding:0;place-items:stretch}.modal:has(#duel-root){width:100vw;max-width:none;height:100dvh;max-height:100dvh;padding:12px 12px 18px;border-left:0;border-right:0;overflow-y:auto}.modal:has(#duel-root) h2{margin-bottom:10px;font-size:18px}.duel-header{grid-template-columns:52px 1fr 52px;gap:7px;margin-bottom:8px}.duel-header>div{padding:6px 4px}.duel-header b{font-size:19px}.duel-header p{font-size:8px!important;line-height:1.25!important}.duel-header strong{font-size:8px}.duel-layout{display:flex;flex-direction:column;gap:10px;align-items:stretch}.duel-board{width:min(86vw,330px,43dvh);height:auto;aspect-ratio:1;margin:0 auto;padding:5px;gap:3px;flex:none}.duel-cell{padding:2px;overflow:hidden}.duel-cell .relic-card{width:100%;height:100%;padding:0;border-width:1px;display:block;overflow:hidden}.duel-cell .card-rarity,.duel-cell .relic-card h3,.duel-cell .relic-card>small{display:none!important}.duel-cell .card-illustration{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52%;height:52%;margin:0}.duel-cell .card-illustration strong{font-size:clamp(20px,7vw,30px)}.duel-cell .side{width:17px;height:17px;font-size:8px;line-height:1;border-radius:5px;background:#05080bef;box-shadow:0 0 5px #000}.duel-cell .side.north{top:3px}.duel-cell .side.south{bottom:3px}.duel-cell .side.east{right:3px}.duel-cell .side.west{left:3px}.rift-sigil{font-size:28px}.rift-sigil small{font-size:8px}.duel-hand{width:100%;min-width:0}.duel-hand>small{margin:0 0 6px;text-align:center}.duel-hand>div{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 7px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.duel-hand-card{flex:0 0 72px;scroll-snap-align:center}.duel-hand-card .relic-card{width:72px;height:102px;padding:17px 5px 6px}.duel-hand-card .card-rarity{font-size:5px;top:5px;letter-spacing:.08em}.duel-hand-card .card-illustration{width:42px;height:52px;margin-top:2px}.duel-hand-card .card-illustration strong{font-size:27px}.duel-hand-card .relic-card h3{font-size:7px;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duel-hand-card .relic-card>small{display:none}.duel-hand-card .side{width:15px;height:15px;font-size:7px;border-radius:4px}.duel-hand-card .side.north{top:14px}.duel-hand-card .side.south{bottom:19px}.duel-hand-card .side.east{right:2px}.duel-hand-card .side.west{left:2px}.duel-help{min-height:0;margin:8px 0 0!important;padding:8px 10px!important;font-size:10px!important;line-height:1.4!important}
}
@media(max-width:390px){.modal{padding-left:14px;padding-right:14px}.duel-board{width:min(84vw,300px,41dvh)}.duel-hand-card{flex-basis:66px}.duel-hand-card .relic-card{width:66px;height:96px}.duel-cell .side{width:16px;height:16px;font-size:7px}}
</style>`;
    html=html.replace('</head>',hotfix+'</head>');
    html=html.replace('</body>',`<script>
(function(){
  function apply(open){
    const list=document.getElementById('chapter-list');
    const btn=document.getElementById('chapter-toggle');
    if(!list||!btn)return;
    list.dataset.manualOpen=open?'1':'0';
    list.hidden=!open;
    list.style.setProperty('display',open?'grid':'none','important');
    const sp=btn.querySelector('span'); if(sp) sp.textContent=open?'⌃':'⌄';
  }
  setTimeout(()=>apply(false),150);
  document.addEventListener('click',function(e){
    const btn=e.target.closest&&e.target.closest('#chapter-toggle');
    if(!btn)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const list=document.getElementById('chapter-list');
    const open=!(list&&list.dataset.manualOpen==='1');
    apply(open);
  },true);
})();
<\/script></body>`);
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('s').textContent='No se pudo cargar Eldoria v0.19.2. Recarga la página.';
    console.error(e);
  }
})();
</script></body></html>
