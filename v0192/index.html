<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eldoria v0.19.2</title>
<style>html,body{margin:0;height:100%;background:#090c0f;color:#eee;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.spinner{width:34px;height:34px;border:3px solid #333;border-top-color:#d6b66f;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="box"><div class="spinner"></div><div id="s">Cargando Eldoria v0.19.2…</div></div>
<script>
(async()=>{
  try{
    let b64='';
    for(let i=0;i<8;i++){
      const r=await fetch(`p${i}.txt`,{cache:'no-store'});
      if(!r.ok) throw new Error(`No se pudo cargar p${i}.txt`);
      b64+=(await r.text()).trim();
    }
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no soporta descompresión web.');
    const ds=new DecompressionStream('gzip');
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();

    /* Estado y lógica de capítulo */
    html=html.replace('heroTutorialSeen:false, chapterPanelOpen:false, minorBattleDone:false, continueIntent: null,','heroTutorialSeen:false, chapterPanelOpen:false, chapterStartedSeen:false, chapterRewardClaimed:false, minorBattleDone:false, continueIntent: null,');
    html=html.replace("{id:'fortress',title:'Fortaleza Sepultada',copy:'Completa el asalto final.',done:()=>state.thirdVictory}","{id:'fortress',title:'Fortaleza Sepultada',copy:'Derrota al Avatar y reclama su reliquia.',done:()=>state.thirdRewardClaimed}");
    html=html.replace("$('#intro-next').onclick=()=>{if(!last)return showIntro(step+1);state.profile.name=(($('#intro-name')?.value||'').trim()||'Guardián').slice(0,18);state.introSeen=true;state.talked=true;state.stage=1;closeModal();render();toast('Capítulo I: mejora el Granero marcado.');};","$('#intro-next').onclick=()=>{if(!last)return showIntro(step+1);state.profile.name=(($('#intro-name')?.value||'').trim()||'Guardián').slice(0,18);state.introSeen=true;state.talked=true;state.stage=1;closeModal();render();setTimeout(showChapterStart,180);};");
    html=html.replace('  function talkAldric(){',`  function showChapterStart(){
    if(state.chapterStartedSeen)return;
    state.chapterStartedSeen=true; save();
    openModal('Capítulo I · Las Cenizas de Valoria',\`<div class="chapter-ceremony"><small>COMIENZA EL CAPÍTULO</small><span>♜</span><h3>Las Cenizas de Valoria</h3><p>Reconstruye el bastión, descubre qué ocurre fuera de sus murallas y reúne fuerza suficiente para responder a La Brecha.</p><div class="chapter-reward-preview"><b>RECOMPENSA DEL CAPÍTULO</b><small>Cofre de Valoria · recursos + 1 Esencia Heroica</small></div></div><button id="chapter-start-go" class="primary">Comenzar</button>\`);
    modal.querySelector('.close')?.remove();
    $('#chapter-start-go').onclick=()=>{closeModal();toast('Primera misión: mejora el Granero marcado.');};
  }
  function showChapterComplete(){
    if(state.chapterRewardClaimed)return showContinuationHook();
    openModal('Capítulo I completado',\`<div class="chapter-ceremony complete"><small>CAPÍTULO COMPLETADO</small><span>✦</span><h3>Las Cenizas de Valoria</h3><p>Valoria vuelve a respirar. La victoria no ha cerrado La Brecha: ha revelado que el mundo es mucho mayor de lo que parecía.</p><div class="chapter-reward-box"><b>COFRE DE VALORIA</b><span>+200 comida · +200 madera<br>+150 piedra · +100 hierro<br>+1 Esencia Heroica</span></div></div><button id="chapter-reward" class="primary">Recoger recompensa</button>\`);
    modal.querySelector('.close')?.remove();
    $('#chapter-reward').onclick=()=>{state.resources.food+=200;state.resources.wood+=200;state.resources.stone+=150;state.resources.iron+=100;state.heroEssence=(state.heroEssence||0)+1;state.chapterRewardClaimed=true;save();resourceFeedback({food:200,wood:200,stone:150,iron:100},1);closeModal();burst();toast('Capítulo I completado · recompensa recibida.');setTimeout(showContinuationHook,500);};
  }
  function talkAldric(){`);
    html=html.replace("setTimeout(()=>showCardAcquisition(['rations','crown'],'TESORO DEL TRONO',()=>{showKingdom();toast('Nueva reliquia: abre Héroes para equiparla.');if(state.duelUnlocked&&!state.duelIntroSeen)setTimeout(showDuelUnlock,550);}),450);","setTimeout(()=>showCardAcquisition(['rations','crown'],'TESORO DEL TRONO',()=>{showKingdom();toast('Nueva reliquia recuperada.');setTimeout(showChapterComplete,450);}),450);");

    /* CSS de usabilidad móvil */
    html=html.replace('</head>',`<style>
      .chapter-list[hidden]{display:none!important}
      .chapter-ceremony{text-align:center;padding:8px 2px}.chapter-ceremony>small{font:700 9px Arial;letter-spacing:.2em;color:var(--gold)}.chapter-ceremony>span{display:block;font-size:58px;color:var(--gold);margin:14px 0 6px}.chapter-ceremony h3{margin:0 0 10px}.chapter-ceremony p{max-width:390px;margin:0 auto}.chapter-reward-preview,.chapter-reward-box{margin:18px auto 0;padding:12px;border:1px solid #d6b66f55;background:#17130b}.chapter-reward-preview b,.chapter-reward-box b{display:block;color:var(--gold);font:700 10px Arial;letter-spacing:.12em}.chapter-reward-preview small,.chapter-reward-box span{display:block;margin-top:6px;font:10px/1.5 Arial;color:#d7d1c3}
      @media(max-width:560px){
        .quest-panel{top:84px;left:8px;width:min(205px,56vw);padding:7px 8px;border-left-width:2px;box-shadow:0 5px 15px #0007}
        .quest-kicker{font-size:7px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .quest-panel strong{font-size:12px;margin:3px 0 5px;line-height:1.15}#quest-copy{display:none}.quest-progress{height:2px}
        .chapter-toggle{margin-top:6px!important;padding:6px 7px!important;font-size:8px!important;white-space:nowrap}
        .chapter-list:not([hidden]){position:fixed!important;left:10px!important;right:10px!important;bottom:86px!important;top:auto!important;width:auto!important;max-height:34dvh!important;overflow:auto!important;background:#10161bf5!important;border:1px solid #d6b66f55!important;box-shadow:0 12px 40px #000d!important;padding:8px!important;z-index:49!important;margin:0!important;display:grid!important;gap:5px!important}
        .chapter-mission{padding:6px 7px!important;min-height:0!important;font-size:8px!important}.chapter-mission b{font-size:9px!important}.chapter-mission small{font-size:7px!important;line-height:1.2!important}
        .modal:has(#claim){padding-bottom:12px}.modal:has(#claim) .reward-card{width:min(210px,62vw)!important;min-height:255px!important;padding:12px!important}.modal:has(#claim) .reward-card span{font-size:52px!important;margin:16px 0!important}.modal:has(#claim) .reward-card strong{font-size:16px!important}.modal:has(#claim) .reward-reveal-stage p{font-size:11px!important;line-height:1.35!important;margin:8px 0!important}#claim{position:sticky!important;bottom:0!important;z-index:60!important;margin-top:10px!important;box-shadow:0 -10px 25px #101419}
        .duel-cell .relic-card{position:relative!important}.duel-cell .side{position:absolute!important;width:18px!important;height:18px!important;font-size:9px!important;line-height:1!important;border-radius:4px!important;padding:0!important;margin:0!important;display:grid!important;place-items:center!important}
        .duel-cell .side.north{top:2px!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important}.duel-cell .side.south{bottom:2px!important;left:50%!important;right:auto!important;top:auto!important;transform:translateX(-50%)!important}.duel-cell .side.west{left:2px!important;top:50%!important;right:auto!important;bottom:auto!important;transform:translateY(-50%)!important}.duel-cell .side.east{right:2px!important;top:50%!important;left:auto!important;bottom:auto!important;transform:translateY(-50%)!important}.duel-cell .card-illustration{width:40%!important;height:40%!important}
      }
      @media(max-width:390px){.duel-cell .side{width:16px!important;height:16px!important;font-size:8px!important}.quest-panel{width:min(190px,54vw)}}
    </style></head>`);

    /* Plegado robusto del panel de misiones */
    html=html.replace('</body>',`<script>
      (function(){
        function apply(open){const list=document.getElementById('chapter-list');const btn=document.getElementById('chapter-toggle');if(!list||!btn)return;list.dataset.manualOpen=open?'1':'0';list.hidden=!open;list.style.setProperty('display',open?'grid':'none','important');const sp=btn.querySelector('span');if(sp)sp.textContent=open?'⌃':'⌄';}
        setTimeout(()=>apply(false),150);
        document.addEventListener('click',function(e){const btn=e.target.closest&&e.target.closest('#chapter-toggle');if(!btn)return;e.preventDefault();e.stopImmediatePropagation();const list=document.getElementById('chapter-list');apply(!(list&&list.dataset.manualOpen==='1'));},true);
      })();
    <\/script></body>`);

    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('s').textContent='No se pudo cargar Eldoria v0.19.2. Recarga la página.';
    console.error(e);
  }
})();
</script></body></html>
