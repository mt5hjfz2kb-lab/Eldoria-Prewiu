name: "[LEGACY] Valoria interface source audit"

on:
  workflow_dispatch:

jobs:
  certified-tower:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify and stage exact certified TowerWallRock
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $p = Join-Path $env:USERPROFILE 'Downloads\Eldoria_Module_TowerWallRock_50K.glb'
          if (-not (Test-Path $p)) { throw "Missing certified tower: $p" }
          $hash = (Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '18785f7ba607cef1e7dcee45684d65c3166dc47b0f73b4bc4fb3d295c6f53a6a') { throw "Tower SHA mismatch: $hash" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\interface-audit" | Out-Null
          Copy-Item $p "$env:RUNNER_TEMP\interface-audit\TowerWallRock.glb"
          @{source=(Split-Path $p -Leaf);sha256=$hash;bytes=(Get-Item $p).Length} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\interface-audit\identity.json"
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-certified-tower-interface-audit
          path: ${{ runner.temp }}/interface-audit/*
