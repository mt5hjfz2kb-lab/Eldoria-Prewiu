name: Eldoria 14B three-condition selective memory diagnostic
on:
  push:
    branches: [diagnostic/valoria-ai-eyes-brain-20261015]
    paths:
      - 'tools/art-direction/director-control/brain_memory_epistemic_v2.py'
      - 'tools/art-direction/director-control/brain_memory_selective_ab.py'
      - 'tools/art-direction/director-control/selective_memory.py'
      - 'tools/art-direction/director-control/memory_regression_gate.py'
      - '.github/workflows/eldoria-brain-memory-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-exclusive-native-windows-free-text-director
  cancel-in-progress: false
jobs:
  paired-memory:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 100
    steps:
      - name: Locate already installed Git from GitHub Desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\\app\\git\\cmd\\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'PREINSTALLED_GITHUB_DESKTOP_GIT_NOT_FOUND'}
            $folder=Split-Path $git
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
          git --version
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/director-control
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: valoria-spatial-grounded-art-director-4b-8b
          run-id: 38701710879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-spatial
      - name: Run read-only three-condition Qwen diagnosis and preserve complete responses
        shell: powershell
        timeout-minutes: 95
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-memory-selective-ab'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $root=Join-Path $env:RUNNER_TEMP 'eldoria-spatial'
          $geo=Get-ChildItem $root -Recurse -Filter spatial-grounding.json | Select-Object -First 1
          if(-not $geo){throw 'REAL_SPATIAL_GROUNDING_NOT_FOUND'}
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          if(-not (Test-Path $exe)){
            $exe=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {Join-Path $_.FullName 'AppData/Local/Programs/Ollama/ollama.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $exe){throw 'INSTALLED_OLLAMA_NOT_FOUND'}
          $models=Join-Path $env:USERPROFILE '.ollama/models'
          if(-not (Test-Path $models)){
            $models=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {Join-Path $_.FullName '.ollama/models'} | Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if($models){$env:OLLAMA_MODELS=$models}
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $env:OLLAMA_NUM_PARALLEL='1'
          $env:OLLAMA_MAX_LOADED_MODELS='1'
          $server=$null
          try {
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process -FilePath $exe -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'ollama-stdout.log') -RedirectStandardError (Join-Path $out 'ollama-stderr.log')
              for($i=0;$i -lt 40;$i++){try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}}
            }
            if(-not $ready){throw 'OLLAMA_NOT_RESPONDING_SAME_STEP'}
            $tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 20
            if('qwen3:14b' -notin @($tags.models | ForEach-Object {$_.name})){throw 'EXISTING_QWEN14B_NOT_FOUND_NO_DOWNLOAD'}
            $cs=Get-CimInstance Win32_ComputerSystem
            $gpu=$null
            try{$gpu=(& nvidia-smi --query-gpu=name,memory.total,memory.free --format=csv,noheader,nounits 2>$null | Select-Object -First 1)}catch{}
            @{physical_ram_bytes=$cs.TotalPhysicalMemory;gpu_inventory=$gpu;model='qwen3:14b';observed_utc=(Get-Date).ToUniversalTime().ToString('o')} |
              ConvertTo-Json -Depth 4 | Out-File (Join-Path $out 'windows-hardware.json') -Encoding utf8
            python tools/art-direction/director-control/brain_memory_selective_ab.py --grounding $geo.FullName --out (Join-Path $out 'predeclared.json') --dry-run
            if($LASTEXITCODE -ne 0){throw 'THREE_ARM_PROTOCOL_INVALID'}
            python tools/art-direction/director-control/brain_memory_selective_ab.py --grounding $geo.FullName --out (Join-Path $out 'three-arm.json')
            if($LASTEXITCODE -ne 0){throw 'THREE_ARM_ERROR_OR_SELECTIVE_REGRESSION'}
          } finally {
            if($server){try{Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}catch{}}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-qwen14b-memory-selective-three-arm-v1
          path: ${{ runner.temp }}/eldoria-memory-selective-ab/
          if-no-files-found: warn
