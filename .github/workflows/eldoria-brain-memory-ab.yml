name: Eldoria 14B memory A-B diagnostic
on:
  push:
    branches: [diagnostic/valoria-ai-eyes-brain-20261015]
    paths:
      - 'tools/art-direction/director-control/brain_memory_ab.py'
      - 'tools/art-direction/director-control/memory_regression_gate.py'
      - '.github/workflows/eldoria-brain-memory-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-memory:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 100
    steps:
      - name: Locate already installed Git from GitHub Desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\\app\\git\\cmd\\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'PREINSTALLED_GITHUB_DESKTOP_GIT_NOT_FOUND'}
            $folder=Split-Path $git
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
          git --version
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/director-control
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: valoria-spatial-grounded-art-director-4b-8b
          run-id: 38701710879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-spatial
      - name: Verify benchmark offline tests
        shell: powershell
        run: |
          python -m unittest discover -s tools/art-direction/director-control -p test_brain_memory_ab.py -v
          if($LASTEXITCODE -ne 0){throw 'BRAIN_BENCHMARK_TESTS_FAILED'}
          python -m unittest discover -s tools/art-direction/director-control -p test_memory_regression_gate.py -v
          if($LASTEXITCODE -ne 0){throw 'MEMORY_GATE_TESTS_FAILED'}
      - name: Start previously installed Ollama if needed
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          if(-not (Test-Path $exe)){
            $exe=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {Join-Path $_.FullName 'AppData/Local/Programs/Ollama/ollama.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $exe){throw 'INSTALLED_OLLAMA_NOT_FOUND'}
          $models=Join-Path $env:USERPROFILE '.ollama/models'
          if(-not (Test-Path $models)){
            $models=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {Join-Path $_.FullName '.ollama/models'} | Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if($models){$env:OLLAMA_MODELS=$models}
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $ready=$false
          try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
          if(-not $ready){
            $log=Join-Path $env:RUNNER_TEMP 'eldoria-ollama-memory'
            New-Item -ItemType Directory -Force -Path $log | Out-Null
            Start-Process -FilePath $exe -ArgumentList 'serve' -WindowStyle Hidden -RedirectStandardOutput (Join-Path $log 'stdout.log') -RedirectStandardError (Join-Path $log 'stderr.log') | Out-Null
            for($i=0;$i -lt 40;$i++){try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}}
          }
          if(-not $ready){throw 'OLLAMA_NOT_RESPONDING'}
          $tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 20
          if('qwen3:14b' -notin @($tags.models | ForEach-Object {$_.name})){throw 'EXISTING_QWEN14B_NOT_FOUND_NO_DOWNLOAD'}
      - name: Run read-only 14B paired reasoning
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'eldoria-spatial'
          $geo=Get-ChildItem $root -Recurse -Filter spatial-grounding.json | Select-Object -First 1
          if(-not $geo){throw 'REAL_SPATIAL_GROUNDING_NOT_FOUND'}
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-memory-ab'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python tools/art-direction/director-control/brain_memory_ab.py --grounding $geo.FullName --out (Join-Path $out 'paired.json') --model qwen3:14b
          if($LASTEXITCODE -ne 0){throw 'QWEN_AB_EXECUTION_FAILED'}
          python tools/art-direction/director-control/memory_regression_gate.py --input (Join-Path $out 'paired.json') --out (Join-Path $out 'gate.json')
          if($LASTEXITCODE -ne 0){throw 'MEMORY_REGRESSION_DETECTED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-qwen14b-memory-ab
          path: ${{ runner.temp }}/eldoria-memory-ab/
          if-no-files-found: warn
