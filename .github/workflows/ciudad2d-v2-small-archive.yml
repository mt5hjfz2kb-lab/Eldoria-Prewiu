name: Ciudad2D - recuperar 11 capturas Unity V2 como control autentico
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['.github/workflows/ciudad2d-v2-small-archive.yml']
permissions:
  contents: read
  actions: read
jobs:
  extract-original-unity-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Fetch existing exact SHA Unity run artifact, never rerun Unity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/14337998938/zip" \
            -o /tmp/ciudad2d-v2-original-source.zip
          test "$(wc -c </tmp/ciudad2d-v2-original-source.zip)" -gt 100000000
      - name: Extract exact original 11 Unity PNG SHA-verified and readonly provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          zp=Path('/tmp/ciudad2d-v2-original-source.zip')
          output=Path('/tmp/ciudad2d-premium-v2-native')
          output.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(zp) as z:
              matches=[n for n in z.namelist() if n.endswith('Ciudad2DPremiumPlayableV2Evidence/evidence.json')]
              assert len(matches)==1, 'Expected unique Unity V2 native manifest'
              root=matches[0].rsplit('/',1)[0]+'/'
              source=json.loads(z.read(matches[0]).decode('utf-8-sig'))
              assert source['engine']=='Unity' and source['mode']=='Editor_RenderTexture'
              assert len(source['captures'])==11 and len(source['four_premium_candidates'])==4
              assert source['gameplay_modified'] is False and source['main_modified'] is False
              assert source['art_approved'] is False
              for item in source['captures']:
                  data=z.read(root+item['file'])
                  assert hashlib.sha256(data).hexdigest()==item['sha256']
                  assert len(data)>8000
                  (output/item['file']).write_bytes(data)
              (output/'evidence.json').write_text(json.dumps(source,ensure_ascii=False,indent=2)+'\n')
              (output/'provenance.json').write_text(json.dumps({
                  'source_run':44105205248,
                  'source_artifact':14337998938,
                  'source_commit':'747b24ffe5c47b9f1070c06d2285fbb0aaf1dbe0',
                  'artifact_zip_sha256':hashlib.sha256(zp.read_bytes()).hexdigest(),
                  'original_captures':11,'native_Unity_Editor_RenderTexture':True,
                  'not_a_new_Unity_run':True,'art_approved':False
              },indent=2)+'\n')
          print('CIUDAD2D_PREMIUM_V2_11_REAL_UNITY_FRAME_SHA_ARCHIVE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-premium-v2-original-11-${{ github.run_id }}
          path: /tmp/ciudad2d-premium-v2-native/
          retention-days: 14
          if-no-files-found: error
