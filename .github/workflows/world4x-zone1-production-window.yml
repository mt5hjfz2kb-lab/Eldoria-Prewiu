name: '[WORLD4X] Queued ground continuation / no Valoria mutation'
on:
  workflow_dispatch:
  push:
    branches: [prototype/world4x-zone1-zoom-reference-20261013]
    paths: ['docs/world4x-zone1/PC_ART_REQUEST.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: world4x-zone1-owner-queued-art
  cancel-in-progress: false
jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record queue ticket without claiming or cancelling Work resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,base64,datetime
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          request=json.load(open('docs/world4x-zone1/PC_ART_REQUEST.json'))
          assert request['mode'] in ['resume_ground','native_pair']
          def api(path,data=None,method=None):
              req=urllib.request.Request(base+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          queued=[]
          for status in ['in_progress','queued','waiting','pending']:
              queued += [{'id':r['id'],'status':r['status'],'created_at':r['created_at']} for r in api('/actions/runs?branch=construction%2Fvaloria-master-plan-layers-20261016&status='+status+'&per_page=50').get('workflow_runs',[])]
          for attempt in range(3):
              file=api('/contents/pipeline/active-workstreams.json?ref=main');r=json.loads(base64.b64decode(file['content']))
              me='world4x-zone1-isolated-reference-prototype-20261013';own=next(x for x in r['active'] if x['id']==me)
              assert own['owner']=='chatgpt-world4x-production-20261018' and own['status']=='active'
              assert me in r['owner_production_pause']['authorized_workstream_ids']
              own.setdefault('coordination',{})['queue_delegation']={'authorization':'Owner explicitly permits PC resources respecting Work queue; live continuation18-10-2026.','mode':request['mode'],'run_id':os.environ['GITHUB_RUN_ID'],'preceding_work_jobs':queued,'transfer_valoria_lease':False,'cancel_other_jobs':False,'policy':'Append one job to the existing single Windows runner queue; on start refuse if older Work job still queued or Unity/Blender occupied. Do not wait for a permanently idle queue.','scope':'Only isolated World4X source/capture/host checks; no Valoria, UI, saves, settings, packages or publication changes.'}
              own['phase']='BOUNDED_UNIT_QUEUED_AFTER_WORK'
              own['next']='Finish requested exact-source unit, preserve files and inspect genuine evidence. Technical checks do not approve art.'
              r['updated_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              try:
                  api('/contents/pipeline/active-workstreams.json',{'message':'coordination(world4x): append bounded owner-authorized queue ticket; preserve Work [skip ci]','branch':'main','sha':file['sha'],'content':base64.b64encode((json.dumps(r,indent=2,ensure_ascii=False)+'\n').encode()).decode()},'PUT');break
              except urllib.error.HTTPError as e:
                  if e.code!=409 or attempt==2:raise
          print(json.dumps({'preceding_work_jobs':queued,'windows_lease_transferred':False}))
          PY
  ground-art:
    needs: coordinate
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 28
    steps:
      - name: Recover installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: world4x-production-source
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: world4x-production-main-readonly
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Recheck delegation, older Work queue and native processes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE/world4x-production-main-readonly/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $own=@($r.active|Where-Object {$_.id -eq 'world4x-zone1-isolated-reference-prototype-20261013' -and $_.owner -eq 'chatgpt-world4x-production-20261018' -and $_.status -eq 'active'})
          if($own.Count -ne 1 -or $own[0].coordination.queue_delegation.run_id -ne "$env:GITHUB_RUN_ID"){throw 'Current queued delegation absent'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native tools occupied: no process interrupted'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $base="https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $ours=Invoke-RestMethod "$base/actions/runs/$env:GITHUB_RUN_ID" -Headers $headers
          $queued=Invoke-RestMethod "$base/actions/runs?branch=construction%2Fvaloria-master-plan-layers-20261016&status=queued&per_page=50" -Headers $headers
          if(@($queued.workflow_runs|Where-Object {[datetime]$_.created_at -lt [datetime]$ours.created_at}).Count){throw 'An older Work job has priority; no native process started'}
      - name: Execute exact saved source unit
        working-directory: world4x-production-source
        shell: powershell
        run: |
          $request=Get-Content docs/world4x-zone1/PC_ART_REQUEST.json -Raw|ConvertFrom-Json
          $out=Join-Path (Get-Location) "docs/world4x-zone1/evidence/ground-finish-$env:GITHUB_RUN_ID"
          if($request.mode -eq 'resume_ground'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender not found'}
            # Reuse the genuine already-recorded Qwen plan: no unnecessary model/server start.
            & $blender -b -t 4 --python-exit-code 1 --python tools/world4x-zone1/production/resume_ground_finish.py -- --out $out
            if($LASTEXITCODE -ne 0){throw 'Source continuation failed; preserve partial evidence'}
          }elseif($request.mode -eq 'native_pair'){
            if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity missing'}
            foreach($pair in @(@($request.before,$request.before_sha256),@($request.after,$request.after_sha256))){
              if(-not $pair[0].StartsWith('docs/world4x-zone1/evidence/')){throw 'Input outside own evidence scope'}
              if((Get-FileHash $pair[0] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pair[1]){throw 'Exact input hash mismatch'}
            }
            $env:ELDORIA_ZONEONE_GROUND_BEFORE=Join-Path (Get-Location) $request.before
            $env:ELDORIA_ZONEONE_GROUND_AFTER=Join-Path (Get-Location) $request.after
            $env:ELDORIA_ZONEONE_CAPTURE_OUT=$out
            $log=Join-Path $env:RUNNER_TEMP "world4x-native-$env:GITHUB_RUN_ID.log"
            $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/world4x-production-source/Unity",'-executeMethod','Eldoria.World4XPrototype.ZoneOneNativeCandidate.Build','-logFile',$log)
            $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
            if(-not $p.WaitForExit(1200000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Own isolated Unity timed out'}
            New-Item -ItemType Directory -Force $out|Out-Null
            Copy-Item $log (Join-Path $out 'unity.log')
            if($p.ExitCode -ne 0){Get-Content $log -Tail 80;throw 'Native comparison failed'}
          }else{throw 'Unsupported bounded mode'}
      - name: Preserve genuine outputs in own branch
        if: always()
        working-directory: world4x-production-source
        shell: powershell
        run: |
          $dest="docs/world4x-zone1/evidence/ground-finish-$env:GITHUB_RUN_ID"
          if(Test-Path $dest){
            Get-ChildItem $dest -Filter '*.blend1'|Remove-Item
            & git config user.name 'Eldoria World4X source workshop'
            & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            & git add -f -- $dest
            $generated='Unity/Assets/Eldoria/ArtTests/World4XZone1/NativeValidated'
            if(Test-Path $generated){& git add -f -- $generated}
            & git diff --cached --quiet
            if($LASTEXITCODE -ne 0){
              & git commit -m "art(world4x): retain actual source and native evidence $env:GITHUB_RUN_ID [skip ci]"
              if($LASTEXITCODE -ne 0){throw 'Evidence commit failed'}
              & git pull --rebase origin prototype/world4x-zone1-zoom-reference-20261013
              if($LASTEXITCODE -ne 0){throw 'Concurrent conflict; no force push'}
              & git push origin HEAD:prototype/world4x-zone1-zoom-reference-20261013
              if($LASTEXITCODE -ne 0){throw 'Evidence push failed; artifact remains'}
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world4x-ground-finish-${{ github.run_id }}
          path: |
            world4x-production-source/docs/world4x-zone1/evidence/ground-finish-${{ github.run_id }}/
            world4x-production-source/Unity/Assets/Eldoria/ArtTests/World4XZone1/NativeValidated/
            ${{ runner.temp }}/world4x-native-${{ github.run_id }}.log
          retention-days: 30
