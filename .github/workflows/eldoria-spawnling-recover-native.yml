name: Eldoria Spawnling recover verified native Unity commit
on:
  push:
    branches: ['art/spawnling-bastion2-finish-20261021']
    paths:
      - 'tools/spawnling-bastion2/recover-native-request.json'
permissions:
  contents: write
concurrency:
  group: spawnling-b2-windows-scene-owner
  cancel-in-progress: false
jobs:
  recover:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 18
    env:
      GITHUB_WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Locate existing Git; never run Unity or fetch another large project
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $apps=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $candidate=Get-ChildItem $apps -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Existing Git executable missing'}
            $dir=Split-Path $candidate
            $env:PATH="$dir;$env:PATH"
          }
          git --version
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count -gt 0){throw 'Windows Unity/Blender busy, no interruption allowed'}
      - name: Recover unchanged genuine Unity tested commit and preserve all dirty changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'spawnling-native-worktree'
          if(-not(Test-Path (Join-Path $root '.git'))){throw 'Previously generated isolated Unity workspace is missing, cannot recover without rerun'}
          Set-Location $root
          git -c core.longpaths=true status --short --untracked-files=no | Select-Object -First 30
          $local=(git rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or -not $local.StartsWith('1682d87')){throw ('Expected true Unity I-II tested local commit not found; HEAD='+$local)}
          $subject=(git show -s --format=%s HEAD).Trim()
          if($subject -ne 'feat(spawnling): actual Bastion II enemy visual integrated with I-II QA'){throw 'Local commit is not the proven native 40-test delivery'}
          $files=@(git diff-tree --no-commit-id --name-only -r HEAD)
          foreach($path in @(
            'Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity',
            'docs/evidence/spawnling-bastion2/native-integration.json',
            'docs/evidence/spawnling-bastion2/native-full-i-ii-result.json',
            'docs/evidence/spawnling-bastion2/after-local-900x1600.png',
            'docs/evidence/spawnling-bastion2/after-region-1600x900.png')){
              if($files -notcontains $path){throw ('Proven local commit lacks '+$path)}
          }
          $e=Get-Content 'docs/evidence/spawnling-bastion2/native-integration.json' -Raw|ConvertFrom-Json
          if($e.status -ne 'SCENE_INTEGRATED_NATIVE_GAMEPLAY_PROBE_REQUIRED' -or -not $e.hotspot_preserved -or -not $e.gameplay_unchanged -or $e.visual_colliders -ne 0 -or -not $e.actual_unity_pixels_changed){
            throw 'Original Unity art review evidence is not sound'
          }
          $game=Get-Content 'docs/evidence/spawnling-bastion2/native-full-i-ii-result.json' -Raw|ConvertFrom-Json
          if($game.status -ne 'INTEGRATION_PASS_ART_REVIEW_REQUIRED' -or @($game.checks).Count -lt 40){throw 'Original I-II and exact save replay not certified'}
          $scene=(Get-FileHash 'Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($scene -ne $e.scene_sha_after){throw 'Saved Unity scene changed after the exact native proof'}
          if(-not $env:GITHUB_WRITE_TOKEN){throw 'GitHub write token missing'}
          $creds=[Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GITHUB_WRITE_TOKEN))
          $env:GIT_CONFIG_COUNT='2'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$creds
          $env:GIT_CONFIG_KEY_1='core.longpaths'
          $env:GIT_CONFIG_VALUE_1='true'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $staged=(git diff --cached --name-only)
          if($staged){throw 'Unexpected staged differences beyond the original native commit'}
          $dirty=@(git diff --name-only)
          if($dirty.Count -gt 0){
            git stash push -m ('spawnling-native-preserved-dirty-'+$env:GITHUB_RUN_ID)
            if($LASTEXITCODE -ne 0){throw 'Refuse to rebase until tracked dirty files are safely stashed'}
            Write-Host ('ORIGINAL_NONCOMMITTED_EDITOR_CHANGES_STASHED count='+$dirty.Count)
          }
          git fetch --no-tags origin art/spawnling-bastion2-finish-20261021
          if($LASTEXITCODE -ne 0){throw 'Failed to resolve latest feature branch'}
          git rebase origin/art/spawnling-bastion2-finish-20261021
          if($LASTEXITCODE -ne 0){throw 'Recovery rebase refused to overwrite concurrent changes; leave recoverable local objects unchanged'}
          $after=(git rev-parse HEAD).Trim()
          if($after -eq $local){throw 'Expected verified Unity commit to be transplanted on latest feature branch'}
          $out=(git show -s --format=%s HEAD).Trim()
          if($out -ne $subject){throw 'Recovered commit content identity changed unexpectedly'}
          git push origin 'HEAD:refs/heads/art/spawnling-bastion2-finish-20261021'
          if($LASTEXITCODE -ne 0){throw 'Git push failed; preserve original commit and safe stash for recovery'}
          $remote=(git ls-remote origin refs/heads/art/spawnling-bastion2-finish-20261021)
          if($LASTEXITCODE -ne 0 -or -not ($remote -match [regex]::Escape($after))){throw 'Remote recovered head not matching local verified native commit'}
          Write-Host ('SPAWNLING_B2_NATIVE_COMMIT_PROMOTED_TO_FEATURE_BRANCH='+$after)
          Write-Host 'SPAWNLING_B2_REAL_UNITY_VISUAL_AND_40_PLAY_SAVE_CHECKS_VERIFIED'
