name: "[PRODUCTION] Valoria Production Art Starter Source v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/valoria-production-art-starter-run-request.json'
      - 'docs/evidence/valoria-premium-square-metre-v1/family-mesh-spec.json'
      - '.github/workflows/valoria-production-art-starter-source-v1.yml'
      - 'tools/author-premium-square-metre.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: valoria-production-art-starter-source-v1
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: request
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          p='pipeline/valoria-production-art-starter-run-request.json'
          d=json.load(open(p))
          print(json.dumps(d,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('enabled='+('true' if d.get('enabled') else 'false')+'\n')
              f.write('mesh_source='+('true' if d.get('mode')=='authored_mesh_family' else 'false')+'\n')
              f.write('surface_source='+('true' if d.get('mode')=='authored_surface_maps' else 'false')+'\n')
              f.write('source_dir='+d.get('source_dir','')+'\n')
              f.write('evidence_dir='+d.get('evidence_dir','')+'\n')
          PY
      - name: Skip parked request
        if: steps.request.outputs.enabled != 'true'
        run: echo "Starter source request parked."
      - name: Install Blender and validated headless libraries
        if: steps.request.outputs.enabled == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=4 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends blender python3-numpy xvfb libegl1 libgl1 libglx-mesa0 ca-certificates
          blender --version
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' || true
      - name: Build authored source
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.mesh_source != 'true' && steps.request.outputs.surface_source != 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b --python tools/valoria-production-art-starter/build_starter_family_v1.py
          test -s art-source/valoria/production/starter-family/Valoria_StarterFamily_v1.blend
          for f in Valoria_MainGate_v1 Valoria_WallSegment_v1 Valoria_Tower_v1 Valoria_CivicHouse_v1 Valoria_Workshop_v1; do
            test -s "Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/StarterFamily/${f}.glb"
            test -s "art-source/valoria/production/starter-family/${f}.production-art.json"
            test -s "pipeline/evidence/valoria-production-art-starter-previews/${f}.png"
          done
          node tools/check-production-art-source.mjs
      - name: Persist reproducible source and GLBs
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.mesh_source != 'true' && steps.request.outputs.surface_source != 'true'
        shell: bash
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add art-source/valoria/production/starter-family
          git add Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/StarterFamily
          git add pipeline/production-art-source-audit.json
          if git diff --cached --quiet; then
            echo "No generated source changes to persist."
          else
            git commit -m "Persist Valoria production art starter source"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.mesh_source != 'true' && steps.request.outputs.surface_source != 'true'
        with:
          name: valoria-production-art-starter-source-v1
          path: |
            art-source/valoria/production/starter-family/*
            Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/StarterFamily/*.glb
            pipeline/production-art-source-audit.json
            pipeline/evidence/valoria-production-art-starter-previews/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Author persistent Golden surface maps in Blender
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.surface_source == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          node tools/plan-art-production.mjs
          node tools/validate-blender-professional-authoring.mjs
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b --python-exit-code 1 --python tools/author-golden-surface-maps.py
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/surface-v2/texture-manifest.json
          test -s Unity/Assets/Eldoria/ArtTests/GoldenSurfaceV2/Textures/stone_albedo.png
          test -s Unity/Assets/Eldoria/ArtTests/GoldenSurfaceV2/Textures/rock_normal.png
          test -s Unity/Assets/Eldoria/ArtTests/GoldenSurfaceV2/Textures/ground_ao.png

      - name: Persist Golden surface maps
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.surface_source == 'true'
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add art-source/valoria/lookdev/golden-slice-v1/surface-v2
          git add Unity/Assets/Eldoria/ArtTests/GoldenSurfaceV2/Textures
          git add docs/evidence/valoria-golden-lookdev-slice-v1/surface-v2
          if git diff --cached --quiet; then
            echo "No Golden surface map changes to persist."
          else
            git commit -m "Persist Blender-authored Golden surface maps"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload Golden surface map evidence
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.surface_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-surface-v2-source
          path: |
            art-source/valoria/lookdev/golden-slice-v1/surface-v2/*
            Unity/Assets/Eldoria/ArtTests/GoldenSurfaceV2/Textures/*
            docs/evidence/valoria-golden-lookdev-slice-v1/surface-v2/*
          if-no-files-found: error
          retention-days: 30

      - name: Validate route and build editable mesh family source
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.mesh_source == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          node tools/plan-art-production.mjs
          node tools/validate-blender-professional-authoring.mjs
          AUTHOR_SCRIPT=$(python3 - <<'PY'
          import json
          req=json.load(open('pipeline/valoria-production-art-starter-run-request.json'))
          request_id=req.get('request_id','')
          mesh_spec=req.get('mesh_spec','')
          bounded = request_id.startswith('valoria-premium-square-metre-v1') or 'valoria-premium-square-metre-v1/' in mesh_spec
          print('tools/author-premium-square-metre.py' if bounded else 'tools/author-environment-family.py')
          PY
          )
          echo "Authoring with ${AUTHOR_SCRIPT}"
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b --python-exit-code 1 --python "${AUTHOR_SCRIPT}"
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('pipeline/valoria-production-art-starter-run-request.json'))
          r=json.load(open(pathlib.Path(d['evidence_dir'])/'source-report.json'))
          for key in ['source','export']:
              p=pathlib.Path(r[key])
              if not p.is_file() or p.stat().st_size<10000:raise SystemExit('Source artifact missing: '+str(p))
          for p in r['preview_evidence']:
              if not pathlib.Path(p).is_file():raise SystemExit('Preview missing: '+p)
          PY
      - name: Persist isolated family source and evidence
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.mesh_source == 'true'
        run: |
          python3 - <<'PY'
          import json,subprocess
          d=json.load(open('pipeline/valoria-production-art-starter-run-request.json'))
          paths=[d['source_dir'],d['evidence_dir']]
          if not paths[0].startswith('art-source/valoria/production/') or not paths[1].startswith('docs/evidence/'):
              raise SystemExit('Invalid generic source output scope')
          subprocess.run(['git','config','user.name','Eldoria Art Bot'],check=True)
          subprocess.run(['git','config','user.email','actions@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',*paths],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
              subprocess.run(['git','commit','-m','Persist isolated editable family source: '+d['request_id']],check=True)
              subprocess.run(['git','pull','rebase','origin','main'],check=False)
              subprocess.run(['git','pull','--rebase','origin','main'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Upload isolated source evidence
        if: steps.request.outputs.enabled == 'true' && steps.request.outputs.mesh_source == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: authored-environment-family-source
          path: |
            ${{ steps.request.outputs.source_dir }}/*
            ${{ steps.request.outputs.evidence_dir }}/*
          if-no-files-found: error
          retention-days: 30

# trigger-refresh: premium-square-metre-v1-validated-headless-runtime
