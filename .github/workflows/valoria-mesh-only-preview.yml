name: Valoria mesh-only Blender preview
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths:
      - 'tools/valoria_mesh_only_preview.py'
      - '.github/workflows/valoria-mesh-only-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-blender-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Render independent GLB families (no SHARP assets)
        env:
          VALORIA_PROOF_OUTPUT: ${{ runner.temp }}/valoria-mesh-proof.png
        run: blender -b -noaudio --python tools/valoria_mesh_only_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-mesh-only-preview
          path: |
            ${{ runner.temp }}/valoria-mesh-proof.png
            ${{ runner.temp }}/valoria-mesh-proof.json
      - name: Save low-resolution visual-review thumbnail on isolated branch
        if: success()
        env:
          OUTPUT_IMAGE: ${{ runner.temp }}/valoria-mesh-proof.png
        shell: bash
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os, base64
          source=Image.open(os.environ['OUTPUT_IMAGE']).convert('RGB')
          source.thumbnail((420,300))
          dest=Path('docs/evidence/valoria-mesh-only-prototype')
          dest.mkdir(parents=True,exist_ok=True)
          jpg=dest/'preview.jpg'
          source.save(jpg,quality=52,optimize=True)
          (dest/'preview.jpg.base64.txt').write_text(base64.b64encode(jpg.read_bytes()).decode())
          print('Preview bytes',jpg.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/valoria-mesh-only-prototype/
          git commit -m "Store isolated low-res Blender visual proof for direct review"
          git push
