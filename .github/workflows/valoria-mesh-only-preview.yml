name: Valoria mesh-only Blender preview
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths:
      - 'tools/valoria_mesh_only_preview.py'
      - '.github/workflows/valoria-mesh-only-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-valoria-blender-preview
  cancel-in-progress: true
jobs:
  isolated-blender-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source Blender
        run: |
          # Ubuntu image has apt indexes; avoid unbounded update hangs on mirrors.
          timeout 150 sudo apt-get update -qq
          timeout 220 sudo apt-get install -y blender python3-numpy
      - name: Render independent GLB families (no SHARP assets)
        env:
          VALORIA_PROOF_OUTPUT: ${{ runner.temp }}/valoria-mesh-proof.png
        run: |
          blender -b -noaudio --python tools/valoria_mesh_only_preview.py
          test -s "${{ runner.temp }}/valoria-mesh-proof.png"
          test -s "docs/evidence/valoria-mesh-only-prototype/preview.jpg.base64.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-mesh-only-preview
          path: |
            ${{ runner.temp }}/valoria-mesh-proof.png
            ${{ runner.temp }}/valoria-mesh-proof.json
            Unity/Assets/Eldoria/ProductionSlice/Experimental/ValoriaMeshOnlyWorld.glb
      - name: Save low-resolution visual-review thumbnail on isolated branch
        if: success()
        env:
          OUTPUT_IMAGE: ${{ runner.temp }}/valoria-mesh-proof.png
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/valoria-mesh-only-prototype/ Unity/Assets/Eldoria/ProductionSlice/Experimental/ValoriaMeshOnlyWorld.glb
          git commit -m "Store isolated low-res Blender visual proof for direct review"
          git push
