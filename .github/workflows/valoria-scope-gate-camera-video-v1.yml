name: "[R&D] Valoria SCoPE Gate Camera Video v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-scope-gate-camera-video-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --quiet "gradio_client>=1.4" pillow
      - name: Generate camera-controlled Gate video
        env:
          OUT_DIR: /tmp/scope-proof
        run: python tools/valoria-scope-space-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-scope-gate-camera-video-v1
          path: /tmp/scope-proof
          if-no-files-found: error
          retention-days: 30
