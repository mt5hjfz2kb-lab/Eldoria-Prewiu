name: Issue200 Academy C03 transfer to real Bastion V
on:
  push:
    branches: [research/bastion-i-25d-studio-200]
    paths: ['.github/workflows/bastion-i-studio-200-academy-bastion.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: issue200-academy-bastion-v
  cancel-in-progress: false
env:
  REPO: ${{ github.repository }}
  BASE_SHA: f27f4774e32efc5ad046478a07747eead4256c3e
jobs:
  produce:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Execute Academy C03 measured Bastion V native comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify source, actual prior renders and Academy practice
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/46135662486" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/runs/46135880172" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/artifacts/15259492182" --jq .digest)" = sha256:0367c23584c7138d738f48e55d9e506bf2ee2885042b7660dc7e2f8c8cd99a76
          test "$(gh api "repos/$REPO/actions/artifacts/15238712971" --jq .digest)" = sha256:f6e5395e26eb36966ddff9af1c0ff4331b5900400d6252970679671b409d449a
          test "$(gh api "repos/$REPO/git/ref/heads/experiment/valoria-ciudad-region-unificada-20261121" --jq .object.sha)" = "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/studio/academy" "$RUNNER_TEMP/academy-plan"
          cd "$RUNNER_TEMP/studio"
          for f in studio.py economics.py rates-20261125.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/openai-development-studio/$f?ref=9fbdb203269b951a252de58d7a0357d71a841480" > "$f"
          done
          for f in guard.py cases.json academy/context.py academy/curriculum.json academy/techniques.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/studio-v3/art-learning/$f?ref=a4fd12c985d4f17f9ce76f3e73b1f379bb26254f" > "$f"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/academy-bastion-director.py?ref=9897d07bdc7e53dacd26e43f9b8ad900bff85762" > director.py
          python3 -m pip install --quiet pillow
          python3 -m py_compile director.py
          for f in Issue200AcademyPlacement.cs Issue200AcademySolver.cs Issue200AcademyBastionProof.cs; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/$f?ref=c0c128bfdde2998206e5c3f0ce3a1314d0d95d02" > "$RUNNER_TEMP/academy-plan/$f"
          done
      - uses: actions/download-artifact@v4
        with:
          name: issue200-studio-academy-clearance
          run-id: 46135662486
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/academy
      - uses: actions/download-artifact@v4
        with:
          name: issue200-cycle-spatial-audit
          run-id: 46083090248
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Academy-trained director defines actual bounded intervention
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          python3 -u director.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-academy-bastion-plan
          path: ${{ runner.temp }}/academy-plan
          if-no-files-found: error
          retention-days: 30
  reserve:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Narrow resource-only reservation under the existing Studio holder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/coordinate-academy-bastion.py?ref=14e5d1d863e9308622dbf023f0ab0afe48fab218" > "$RUNNER_TEMP/coordinate.py"
          python3 "$RUNNER_TEMP/coordinate.py" reserve
  native-proof:
    needs: reserve
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    concurrency:
      group: eldoria-modular25d-exclusive-unity-native
      cancel-in-progress: false
    steps:
      - name: Check live resource ownership, installed Unity and actual idle processes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $api="https://api.github.com/repos/$env:REPO/"
          $m=Invoke-RestMethod -Headers $h -Uri ($api+'contents/pipeline/active-workstreams.json?ref=main')
          $b=Invoke-RestMethod -Headers $h -Uri ($api+'git/blobs/'+$m.sha)
          if($b.sha -ne $m.sha){throw 'Registry mismatch'}
          $reg=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($b.content -replace '\s',''))) | ConvertFrom-Json
          $held=@($reg.active|Where-Object{@($_.resources) -contains 'windows-runner-heavy'})
          if($held.Count -ne 1 -or $held[0].id -ne 'eldoria-valoria-modular25d-bastion1-20261119' -or $held[0].owner -ne 'chatgpt-corona-brecha-commercial-20261126' -or $held[0].ownership_revision -ne 33 -or $held[0].issue200_academy_bastion_v.run_id -ne [long]$env:GITHUB_RUN_ID -or $reg.resource_rotation.current_run_id -ne [long]$env:GITHUB_RUN_ID -or $reg.resource_rotation.status -ne 'issue200_academy_bastion_v'){throw 'Native reservation not ours'}
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){throw 'Existing native process; no interruption allowed'}
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity missing'}
          if((Get-Item $env:RUNNER_TEMP).PSDrive.Free -lt 12GB){throw 'Insufficient scratch disk; no other cache cleanup'}
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $dir=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd'} | Where-Object {Test-Path (Join-Path $_ 'git.exe')} | Select-Object -First 1
            if(-not $dir){throw 'Installed Git missing'}
            $env:PATH="$dir;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          Write-Host 'ISSUE200_EXCLUSIVE_PC_IDLE_PASS'
      - uses: actions/download-artifact@v4
        with:
          name: issue200-academy-bastion-plan
          path: ${{ runner.temp }}/issue200-cycle-source-${{ github.run_id }}
      - name: Materialize exact game sources only in unique scratch project
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ("issue200-native-"+$env:GITHUB_RUN_ID)
          if(Test-Path $root){throw 'Scratch already exists'}
          git init -q $root
          git -C $root remote add origin "https://github.com/$env:REPO.git"
          $paths=@('/Unity/Assets/Experimentos/ValoriaModular25D/','/Unity/Assets/Experimentos/ValoriaModular25D.meta','/Unity/Assets/Experimentos.meta','/Unity/Assets/Eldoria/','/Unity/Assets/Eldoria.meta','/Unity/Assets/EmaceArt/Slavic World Free/Meshes/','/Unity/Assets/EmaceArt/Slavic World Free/Materials/','/Unity/Assets/EmaceArt/Slavic World Free/Texture/','/Unity/Assets/EmaceArt/Slavic World Free/URP_Support/','/Unity/Assets/EmaceArt/Slavic World Free/Prefabs/Village/Building/Shed/','/Unity/Assets/Holotna/','/Unity/Assets/Holotna.meta','/Unity/Assets/StreamingAssets/','/Unity/Assets/StreamingAssets.meta','/Unity/Assets/Plugins/','/Unity/Assets/Plugins.meta','/Unity/Assets/DefaultVolumeProfile.asset','/Unity/Assets/UniversalRenderPipelineGlobalSettings.asset','/Unity/Packages/','/Unity/ProjectSettings/')
          git -C $root sparse-checkout set --no-cone @paths
          if($LASTEXITCODE){throw 'Sparse checkout setup failed'}
          git -C $root config http.version HTTP/1.1
          git -C $root config core.autocrlf false
          git -C $root fetch --no-tags --depth=1 --filter=blob:none origin $env:BASE_SHA
          if($LASTEXITCODE){throw 'Source fetch failed'}
          $ok=$false
          for($i=1;$i -le 3;$i++){git -C $root checkout -q --detach $env:BASE_SHA; if($LASTEXITCODE -eq 0){$ok=$true;break}; Start-Sleep -Seconds (4*$i)}
          if(-not $ok -or (git -C $root rev-parse HEAD).Trim() -ne $env:BASE_SHA){throw 'Exact source checkout failed'}
          $project=Join-Path $root 'Unity'
          $inputDir=Join-Path $env:RUNNER_TEMP ("issue200-cycle-source-"+$env:GITHUB_RUN_ID)
          $prefix=Join-Path $project 'Assets/Experimentos/ValoriaModular25D'
          $world=Join-Path $prefix 'Scripts/Modular25DWorld.cs'
          $src=[IO.File]::ReadAllText($world).Replace("`r`n","`n")
          $changes=@(
            @('        Transform millWorkYard, garrisonYard, grainYard, quarryYard;', "        readonly Issue200AcademyPlacement academyPlacement = new Issue200AcademyPlacement();`n        Transform millWorkYard, garrisonYard, grainYard, quarryYard;"),
            @('            RecoveredPropsPlaced++;', "            academyPlacement.Register(visual);`n            RecoveredPropsPlaced++;"),
            @('            quarryYard.gameObject.SetActive(StoneworksRenderer.gameObject.activeSelf);', "            quarryYard.gameObject.SetActive(StoneworksRenderer.gameObject.activeSelf);`n            academyPlacement.Apply(DisplayedBastionLevel==5 && GranaryRenderer.gameObject.activeSelf);")
          )
          foreach($pair in $changes){
            if($src.IndexOf($pair[0]) -lt 0 -or $src.IndexOf($pair[0]) -ne $src.LastIndexOf($pair[0])){throw ('Source contract mismatch: '+$pair[0])}
            $src=$src.Replace($pair[0],$pair[1])
          }
          [IO.File]::WriteAllText($world,$src,(New-Object Text.UTF8Encoding($false)))
          foreach($name in @('Issue200AcademyPlacement.cs','Issue200AcademySolver.cs','Issue200AcademyBastionProof.cs')){
            $sub=if($name -eq 'Issue200AcademyPlacement.cs'){'Scripts'}else{'Editor'}
            $dest=Join-Path $prefix "$sub/$name"
            if(Test-Path $dest){throw 'Scratch path already exists'}
            Copy-Item (Join-Path $inputDir $name) $dest
            if((Get-FileHash $dest -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $inputDir $name) -Algorithm SHA256).Hash){throw 'Source byte mismatch'}
          }
          $changed=@(git -C $root diff --name-only)
          if($changed.Count -ne 1 -or $changed[0] -ne 'Unity/Assets/Experimentos/ValoriaModular25D/Scripts/Modular25DWorld.cs'){throw 'Unexpected tracked source changes'}
          Write-Host 'ACADEMY_PLACEMENT_SCRATCH_SOURCE_READY'
          "ISSUE200_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE200_PROOF_OUT=$(Join-Path $env:RUNNER_TEMP ('issue200-proof-'+$env:GITHUB_RUN_ID))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE200_PROOF_ASSETS=$inputDir"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE200_BASE_SHA=$env:BASE_SHA"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Render matched real Unity baseline and candidate with moving actors and camera
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){throw 'Native process appeared; no interruption'}
          New-Item -ItemType Directory -Force $env:ISSUE200_PROOF_OUT|Out-Null
          Copy-Item (Join-Path $env:ISSUE200_PROOF_ASSETS 'parameters.json') $env:ISSUE200_PROOF_OUT
          Copy-Item (Join-Path $env:ISSUE200_PROOF_ASSETS 'academy-settings.json') $env:ISSUE200_PROOF_OUT
          $log=Join-Path $env:ISSUE200_PROOF_OUT 'unity.log'
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',$env:ISSUE200_PROJECT,'-executeMethod','Eldoria.Experimentos.ValoriaModular25D.Editor.Issue200AcademyBastionProof.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(3000000)){Stop-Process -Id $p.Id -Force;throw 'Own Unity scratch capture timed out'}
          if($p.ExitCode){Get-Content $log -Tail 120;throw ('Unity capture failed '+$p.ExitCode)}
          foreach($v in @('baseline','candidate')){
            $manifest=Join-Path $env:ISSUE200_PROOF_OUT "$v/evidence.json"
            if(-not(Test-Path $manifest)){throw 'Missing genuine capture manifest'}
            $e=Get-Content $manifest -Raw|ConvertFrom-Json
            if($e.engine -ne 'Unity' -or $e.engineVersion -ne '6000.3.23f1' -or $e.sourceSha -ne $env:BASE_SHA -or $e.sourceFrames -ne 39 -or $e.progressionStagesCaptured -ne 5 -or -not $e.gatewayBuild -or -not $e.savedAndReloaded){throw 'Native proof incomplete'}
            foreach($f in $e.frames){
              $p=Join-Path $env:ISSUE200_PROOF_OUT "$v/$($f.file)"
              if(-not(Test-Path $p) -or (Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() -ne $f.sha256){throw 'Native frame hash mismatch'}
            }
          }
          $runtime=Join-Path $env:ISSUE200_PROOF_OUT 'runtime-source'
          New-Item -ItemType Directory -Force $runtime|Out-Null
          $prefix=Join-Path $env:ISSUE200_PROJECT 'Assets/Experimentos/ValoriaModular25D'
          foreach($rel in @('Scripts/Modular25DWorld.cs','Scripts/Issue200AcademyPlacement.cs','Scripts/Issue200AcademyPlacement.cs.meta','Resources/Issue200AcademyLayout.json','Resources/Issue200AcademyLayout.json.meta')){
            $p=Join-Path $prefix $rel
            if(-not(Test-Path $p)){throw ('Missing runtime delivery '+$rel)}
            $dest=Join-Path $runtime $rel
            New-Item -ItemType Directory -Force (Split-Path $dest)|Out-Null
            Copy-Item $p $dest
          }
          Write-Host 'ISSUE200_REAL_MATCHED_CAMERA_RENDER_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-academy-bastion-native
          path: ${{ runner.temp }}/issue200-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
  return-resource:
    needs: [reserve,native-proof]
    if: always() && needs.reserve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Return only own completed temporary native resource to canonical Bastion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/coordinate-academy-bastion.py?ref=14e5d1d863e9308622dbf023f0ab0afe48fab218" > "$RUNNER_TEMP/coordinate.py"
          python3 "$RUNNER_TEMP/coordinate.py" return
  evidence:
    needs: native-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue200-academy-bastion-native
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@v4
        with:
          name: issue200-academy-bastion-plan
          path: ${{ runner.temp }}/production
      - name: Load independent native auditor
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio"
          cd "$RUNNER_TEMP/studio"
          for f in studio.py economics.py rates-20261125.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/openai-development-studio/$f?ref=9fbdb203269b951a252de58d7a0357d71a841480" > "$f"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/evaluate-academy-bastion.py?ref=de3f16d1e8c452c62b789c1118c4dc5d195d352f" > evaluate.py
          python3 -m pip install --quiet pillow imageio-ffmpeg
          python3 -m py_compile evaluate.py
      - name: Verify actual paired render hashes and evaluate stage V blind
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          python3 -u evaluate.py
      - name: Actual pan and zoom comparison
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/academy-delivery"
          ffmpeg_bin=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$ffmpeg_bin" -loglevel error -framerate 12 -i "$RUNNER_TEMP/native/baseline/motion-%03d.png" -framerate 12 -i "$RUNNER_TEMP/native/candidate/motion-%03d.png" -filter_complex hstack=inputs=2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/academy-delivery/bastion-v-pan-zoom.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-academy-bastion-audit
          path: ${{ runner.temp }}/academy-delivery
          if-no-files-found: warn
          retention-days: 30
