name: Ciudad2D - archivar Cantera premium con fuente alfa sombra y suelo
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-quality/pending_quarry_premium.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-quarry-premium-source-ubuntu
  cancel-in-progress: false
jobs:
  quarry-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-quality/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Cantera.png.meta
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Terreno_Organico.png
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/
            /Unity/Assets/Experimentos/Ciudad2D/QA/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Preserve exact quarry source, alpha, smoke and crane QA
        run: python tools/ciudad2d-quality/import_quarry_premium_v1.py
      - name: Preserve review assets even if commit later fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-quarry-original-and-alpha-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1*.png
            Unity/Assets/Experimentos/Ciudad2D/QA/Cantera_Premium_V1_*
          if-no-files-found: warn
          retention-days: 21
      - name: Commit only new non-gameplay candidate assets, delete one-time URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-quality/pending_quarry_premium.json
          git add --sparse -- \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1_Source.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1_Source.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1_Mask.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1_Mask.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1_Shadow.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cantera_Premium_V1_Shadow.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/QA/Cantera_Premium_V1_Manifest.json \
            Unity/Assets/Experimentos/Ciudad2D/QA/Cantera_Premium_V1_black_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/Cantera_Premium_V1_grey_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/Cantera_Premium_V1_green_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/Cantera_Premium_V1_terrain_OFFLINE_NOT_UNITY.jpg
          git diff --cached --quiet && { echo 'No validated candidate'; exit 1; }
          git commit -m 'art(city2d): preserve quarry premium RGBA source and separate shadow with QA'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
