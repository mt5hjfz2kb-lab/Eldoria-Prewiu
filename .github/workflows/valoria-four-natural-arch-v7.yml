name: "[ART ARCH V7] Four fitted stones with natural CC0 photo, no false joints"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-four-natural-arch-v7.yml'
      - 'tools/valoria-modular-fortress/physical_radial_stone_photo_clean_v7.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-four-real-clean-stone-v7
  cancel-in-progress: false
jobs:
  photostone-four:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Installed Blender and Git
        shell: powershell
        id: native
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git absent'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender absent'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-four-physical-arch-stones-38900855113
          run-id: 38900855113
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/arch-before-checkers
      - uses: actions/download-artifact@v4
        with:
          name: valoria-cc0-real-stone-materials-38823501643
          run-id: 38823501643
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/natural-CC0-stone
      - name: Blender genuine photo albedo and normal versus false stone grid A-B
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'arch-before-checkers\eldoria-four-physical-arch-v6\glb'
          $maps=Join-Path $env:RUNNER_TEMP 'natural-CC0-stone'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-four-naturally-cut-wedges-v7'
          if(-not(Test-Path (Join-Path $src 'arch_keystone_major.glb'))){throw 'Physical arch source missing'}
          if(-not(Test-Path (Join-Path $maps 'rock_3_diffuse.jpg'))){throw 'CC0 interior natural stone absent'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/physical_radial_stone_photo_clean_v7.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned art code not found'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-real-arch-stone-v7.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'valoria-v7-stone-stdout.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-v7-stone-stderr.log'
          $proc=Start-Process -FilePath "${{ steps.native.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$maps,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 90 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Blender stone V7 did not finish: $($proc.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 4){throw "Expected 4 single $folder images/models, got $count"}
          }
      - name: Preserve actual candidate GLBs and A-B images, art still needs independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-four-natural-limestone-arches-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-four-naturally-cut-wedges-v7/**
            ${{ runner.temp }}/valoria-v7-stone-stdout.log
            ${{ runner.temp }}/valoria-v7-stone-stderr.log
          retention-days: 30
          if-no-files-found: warn
