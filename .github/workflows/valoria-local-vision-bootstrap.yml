name: Eldoria free local vision agent bootstrap
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths: ['.github/workflows/valoria-local-vision-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: eldoria-art-windows-agent
  cancel-in-progress: true
jobs:
  ollama-model:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 50
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          $git = Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop/app-*/resources/app/git/cmd/git.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($git) { Split-Path $git.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Load official free Ollama portable locally with no installer UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ollama=(Get-Command ollama.exe -ErrorAction SilentlyContinue).Source
          foreach ($loc in @("$env:LOCALAPPDATA/Programs/Ollama/ollama.exe","$env:ProgramFiles/Ollama/ollama.exe")) {
            if (-not $ollama -and (Test-Path $loc)) { $ollama=$loc }
          }
          if (-not $ollama) {
            $target="$env:LOCALAPPDATA/Eldoria/OllamaPortable"
            $exe=Get-ChildItem $target -Filter ollama.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) { $ollama=$exe.FullName }
            else {
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              $archive="$env:RUNNER_TEMP/ollama-windows-amd64.zip"
              $ProgressPreference='SilentlyContinue'
              Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip" -OutFile $archive -UseBasicParsing -TimeoutSec 1500
              if ((Get-Item $archive).Length -lt 10000000) { throw "Official portable Ollama archive is unexpectedly small" }
              Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
              $exe=Get-ChildItem $target -Filter ollama.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $exe) { throw "Portable Ollama executable missing after archive extraction" }
              $ollama=$exe.FullName
            }
          }
          "ELDORIA_OLLAMA=$ollama" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $ollama --version
      - name: Download free vision model and verify local HTTP inference
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $health=$false
          try {$null=Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 3;$health=$true} catch {}
          if (-not $health) {
            Start-Process -FilePath $env:ELDORIA_OLLAMA -ArgumentList 'serve' -WindowStyle Hidden
            Start-Sleep -Seconds 5
          }
          $tags=Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 15
          if (-not (@($tags.models.name) -contains 'hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M')) {
            & $env:ELDORIA_OLLAMA pull hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M
            if ($LASTEXITCODE -ne 0) { throw "Free Qwen3-VL vision model download failed" }
          }
          $body=@{model="hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M";stream=$false;messages=@(@{role="user";content="Reply only with the word READY."})}|ConvertTo-Json -Depth 6
          $result=Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/chat" -Method Post -ContentType "application/json" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 180
          if (-not $result.message.content) { throw "Local language model produced empty output" }
          "ELDORIA_LOCAL_MODEL_PASS model=hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-local-vision-bootstrap
          path: ${{ runner.temp }}/eldoria-local-vision-boot.log
          if-no-files-found: ignore
