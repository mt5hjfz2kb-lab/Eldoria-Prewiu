name: Eldoria MCP transport introspection
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths: ['.github/workflows/valoria-mcp-transport-introspection.yml','tools/art-rd/blender_mcp_transport_introspection.py']
permissions:
  contents: read
jobs:
  transport:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          $git = Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop/app-*/resources/app/git/cmd/git.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($git) { Split-Path $git.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Introspect actual Blender MCP transport without network exposure
        shell: powershell
        run: |
          $b="C:\Program Files\Blender Foundation\Blender 5.2\blender.exe"
          & $b -b --python tools/art-rd/blender_mcp_transport_introspection.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\eldoria-mcp-introspection.log"
          if ($LASTEXITCODE -ne 0) { throw "Introspection script failed" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\eldoria-mcp-introspection.log" -Pattern "ELDORIA_INTROSPECTION_PASS" -Quiet)) { throw "No source proof" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-mcp-transport-introspection
          path: ${{ runner.temp }}/eldoria-mcp-introspection.log
