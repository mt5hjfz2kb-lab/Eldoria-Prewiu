name: Aldric approved-model recovery (one-shot)
on:
  push:
    branches: [feature/aldric-city-roaming-20261028]
    paths: ['.github/workflows/aldric-city-source-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aldric-city-model-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Find Git from GitHub Desktop if needed
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $candidate=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Git unavailable'}
            $dir=Split-Path $candidate
            Add-Content $env:GITHUB_PATH $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            tools/aldric-city
            Unity/Assets/StreamingAssets
          sparse-checkout-cone-mode: true
      - name: Locate only the approved original or its named delivery archives
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $name='SirAldric_Approved_RiggedAnimated_v1.glb'
          $want='c28a65b6040225256ae047d8fd773849771895ac378041e0882f279517e78c8b'
          $dest=Join-Path $env:GITHUB_WORKSPACE ('Unity/Assets/StreamingAssets/Eldoria/Aldric/'+$name)
          $roots=@((Join-Path $env:USERPROFILE 'Downloads'),(Join-Path $env:USERPROFILE 'Documents/Eldoria'),
            (Join-Path $env:USERPROFILE 'Desktop/Eldoria'),(Join-Path $env:USERPROFILE 'Documents/Unity'),
            (Join-Path $env:USERPROFILE 'Documents/Blender'),'D:\Eldoria','C:\Eldoria') | Select-Object -Unique
          $names=@($name,'Eldoria_Aldric_Rig_Animaciones_20261027.zip',
            'ELDORIA_PR122_ALDRIC_MODELO_EXACTO_PARA_UNITY.zip',
            'Eldoria_Aldric_Paseos_Valoria_Modelo_Real_y_Unity_20261028.zip',
            'Eldoria_Aldric_Paseando_Valoria_Integracion_Preparada_20261028.zip')
          $candidates=@()
          if(Test-Path $dest){$candidates+=,$dest}
          if($env:ELDORIA_ALDRIC_SOURCE_FILE -and (Test-Path $env:ELDORIA_ALDRIC_SOURCE_FILE)){
            $candidates+=,$env:ELDORIA_ALDRIC_SOURCE_FILE
          }
          foreach($root in $roots){
            if(-not(Test-Path $root)){continue}
            foreach($candidateName in $names){
              $candidates+=@(Get-ChildItem -LiteralPath $root -Recurse -Filter $candidateName -File -ErrorAction SilentlyContinue |
                Select-Object -First 10 | ForEach-Object {$_.FullName})
            }
          }
          Add-Type -AssemblyName System.IO.Compression
          $found=$false
          foreach($candidate in ($candidates | Select-Object -Unique)){
            $bytes=$null
            try {
              if([IO.Path]::GetExtension($candidate).ToLowerInvariant() -eq '.zip'){
                $zip=[IO.Compression.ZipFile]::OpenRead($candidate)
                try {
                  $entry=$zip.Entries | Where-Object {$_.Name -eq $name -and $_.Length -eq 10140372} | Select-Object -First 1
                  if(-not $entry){continue}
                  $stream=$entry.Open()
                  try{$memory=New-Object IO.MemoryStream;$stream.CopyTo($memory);$bytes=$memory.ToArray();$memory.Dispose()}
                  finally{$stream.Dispose()}
                } finally {$zip.Dispose()}
              } elseif((Get-Item -LiteralPath $candidate).Length -eq 10140372){
                $bytes=[IO.File]::ReadAllBytes($candidate)
              }
              if(-not $bytes -or $bytes.Length -ne 10140372){continue}
              $sha=[Security.Cryptography.SHA256]::Create()
              try {$actual=([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-','').ToLowerInvariant()}
              finally {$sha.Dispose()}
              if($actual -ne $want){continue}
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              [IO.File]::WriteAllBytes($dest,$bytes)
              $found=$true;break
            } catch { Write-Host 'Inaccessible named candidate skipped' }
          }
          if(-not $found){throw 'ALDRIC_APPROVED_SOURCE_NOT_PRESENT_ON_WINDOWS_RUNNER'}
          Write-Host 'ALDRIC_SOURCE_IDENTITY_VERIFIED'
      - name: Verify and commit exact binary to PR122 only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python tools/aldric-city/verify_approved_glb.py
          if($LASTEXITCODE -ne 0){throw 'Source verification failed'}
          $target='Unity/Assets/StreamingAssets/Eldoria/Aldric/SirAldric_Approved_RiggedAnimated_v1.glb'
          $tracked=@(& git ls-tree -r --name-only HEAD -- $target)
          if($tracked.Count -eq 0){
            git add -- $target
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'art(aldric): add original approved 26-joint animated GLB'
            if($LASTEXITCODE -ne 0){throw 'Failed to create exact source commit'}
            git push origin HEAD:refs/heads/feature/aldric-city-roaming-20261028
            if($LASTEXITCODE -ne 0){throw 'PR122 moved; no force-push permitted'}
          }
          Write-Host 'ALDRIC_EXACT_MODEL_IN_PR122_AND_SOURCE_PASS (Unity QA still required)'
