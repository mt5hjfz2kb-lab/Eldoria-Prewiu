name: World4X Region 1 canonical candidate source and PlayMode QA

on:
  push:
    branches: [feature/world4x-region1-canon-20261022]
    paths:
      - 'Unity/Assets/Eldoria/World4XCanon/**'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs.meta'
      - 'docs/evidence/world4x-canon-20261022/authoring/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Unity/Assets/Eldoria/World4XCanon/**'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs.meta'

permissions:
  contents: read
  actions: read

concurrency:
  group: world4x-canon-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  canon-source:
    if: github.event_name == 'push' || github.event.pull_request.number == 100
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/visual-reference/world-map
            docs/visual-reference/ELDORIA_WORLD_MAP_CANON_20261022.md
            Unity/Assets/Eldoria/World4XCanon
            Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs
      - name: Assert frozen owner PNG reference binaries
        shell: bash
        run: |
          set -euo pipefail
          echo 'bb053cf3099a202eff472a53207169dfba522b93c0c5b7bff0fed05b96438fd9  docs/visual-reference/world-map/01_vista_cercana.png' | sha256sum -c -
          echo '82a38cf89e9a8ad249739496de4c972a8008df29ec4efc946c3a22273f88f316  docs/visual-reference/world-map/02_vista_regional.png' | sha256sum -c -
          echo '68cd5b898cf3675db537b7ddceb8082befe955895864079a0ac26bdf4fb37144  docs/visual-reference/world-map/03_vista_panoramica.png' | sha256sum -c -
          test -f Unity/Assets/Eldoria/World4XCanon/RegionOneCanonicalLandscape.cs
          test -f Unity/Assets/Eldoria/World4XCanon/Editor/RegionOneCanonicalCapture.cs
          test -f Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs
          grep -q 'RegionOneCanonicalLandscape' Unity/Assets/Eldoria/World4XCanon/RegionOneCanonicalLandscape.cs
          echo 'SOURCE_CANON_BLOBS_AND_FILES_PASS (not a Unity compile)'

  unity-source-playmode:
    needs: canon-source
    if: github.event_name == 'push' && vars.UNITY_RUNNER_READY == 'true' && !contains(github.event.head_commit.message, 'blender-interactive(world4x):')
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 50
    steps:
      - name: Find installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          path: world4x-source
          clean: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/**
            /tools/workstream-lease/**
            /pipeline/active-workstreams.json
            /docs/evidence/world4x-canon-20261022/authoring/**
      - uses: actions/checkout@v4
        with:
          ref: main
          path: world4x-live
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pipeline/active-workstreams.json
            /tools/art-knowledge/**
            /tools/art-direction/**
            /pipeline/art-knowledge/**
            /pipeline/art-production-requests/eldoria-world-region-1-canon-20261022.json
            /docs/visual-reference/world-map/**
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lease-check and real Unity preflight
        shell: powershell
        run: |
          node world4x-source/tools/workstream-lease/check.mjs world4x-source/pipeline/active-workstreams.json world4x-live/pipeline/active-workstreams.json eldoria-world-region-1-canon-20261022
          if($LASTEXITCODE){throw 'World4X owner scope or Windows lease no longer current'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Existing Unity or Blender job active: no concurrent overwrite'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity missing'}
          $version=& $env:UNITY_EDITOR_PATH -version
          if($version -notmatch '6000\.3\.23f1'){throw "Unexpected Unity version: $version"}
      - name: Author editable Blender composition from original references
        env:
          ELDORIA_DIRECT_SCULPT: ${{ contains(github.event.head_commit.message, 'blender-sculpt(world4x):') }}
        if: contains(github.event.head_commit.message, 'blender-author(world4x):') || contains(github.event.head_commit.message, 'blender-sculpt(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another heavy process is active'}
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $blender){$blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if(-not $blender){throw 'Installed Blender not found'}
          & $blender --version
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $helpers=Join-Path $env:GITHUB_WORKSPACE 'world4x-source/docs/evidence/world4x-canon-20261022/authoring'
          $refs=Join-Path $env:GITHUB_WORKSPACE 'world4x-live/docs/visual-reference/world-map'
          if($env:ELDORIA_DIRECT_SCULPT -eq 'true'){
            & $blender --background --python-exit-code 1 --python "$helpers/sculpt_region.py" -- $out "$helpers/sources/region1-blockout-b.blend" "$helpers/blender-cameras-input.json"
          }else{
            & $blender --background --python-exit-code 1 --python "$helpers/author_region.py" -- $out $refs "$helpers/blender-cameras-input.json"
          }
          if($LASTEXITCODE){throw 'Blender authoring failed'}
          if(-not(Test-Path "$out/eldoria-region1-author.blend")){throw 'Editable Blender source missing'}
          if(-not(Test-Path "$out/RegionOneBlenderWorld.glb")){throw 'Blender export missing'}
          if($env:ELDORIA_DIRECT_SCULPT -eq 'true'){
            $destination=Join-Path $env:GITHUB_WORKSPACE 'world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Blender'
            foreach($file in @('RegionOneBlenderWorld.glb','RegionOneBlenderQueries.bytes','blender-authoring-manifest.json')){
              Copy-Item (Join-Path $out $file) (Join-Path $destination $file) -Force
            }
            Write-Host 'Actual native tests consume the freshly sculpted Blender export; artifact hashes identify these generated inputs.'
          }
      - name: Recover the last valid editable ribera source
        if: contains(github.event.head_commit.message, 'ribera-finish(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40014366595
          name: region1-canon-native-40014366595
          path: ${{ runner.temp }}/ribera-pinned-source
      - name: Finish existing ribera surfaces and banks in Blender
        if: contains(github.event.head_commit.message, 'ribera-finish(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another heavy process is active'}
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender missing'}
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $source=Join-Path $env:RUNNER_TEMP 'ribera-pinned-source/region1-authoring-40014366595/Eldoria_Ribera_Finished.blend'
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/extend_living_sector.py -- $out $source
          if($LASTEXITCODE){throw 'Ribera finishing failed'}
          $dest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Pilot'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$out/RiberaPilot.glb" "$dest/RiberaPilot.glb" -Force
          Copy-Item "$out/LivingSectorLayout.json" "$dest/LivingSectorLayout.json" -Force
          'ELDORIA_RIBERA_PILOT=1' >> $env:GITHUB_ENV
      - name: Author bounded ribera pilot in Blender
        if: contains(github.event.head_commit.message, 'hybrid-pilot(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another heavy process is active'}
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender missing'}
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/author_patch.py -- $out
          if($LASTEXITCODE){throw 'Ribera authoring failed'}
          $dest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Pilot'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$out/RiberaPilot.glb" "$dest/RiberaPilot.glb"
          'ELDORIA_RIBERA_PILOT=1' >> $env:GITHUB_ENV
      - name: Recover certified AI for the full-region production candidate
        if: contains(github.event.head_commit.message, 'region-production(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40024930128
          name: region1-canon-native-40024930128
          path: ${{ runner.temp }}/region-ai-source
      - name: Extend certified AI into one authored continental mesh
        if: contains(github.event.head_commit.message, 'region-production(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Heavy process conflict'}
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender unavailable'}
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $source=Join-Path $env:RUNNER_TEMP 'region-ai-source/region1-authoring-40024930128/Eldoria_Ribera_Finished.blend'
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/build_region_from_ai.py -- $out $source
          if($LASTEXITCODE){throw 'Continental Blender authoring failed'}
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/build_resource_library.py -- $out $source
          if($LASTEXITCODE){throw 'Reusable resource Blender authoring failed'}
          $dest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Blender'
          foreach($file in @('RegionOneBlenderWorld.glb','RegionOneBlenderQueries.bytes','production-region.json','RegionOneResources.glb','RegionOneResourceImpostors.png')){Copy-Item (Join-Path $out $file) (Join-Path $dest $file) -Force}
      - name: Actual Editor import + integrated source gate
        if: "!contains(github.event.head_commit.message, 'author-retry(world4x):') && !contains(github.event.head_commit.message, 'blender-author(world4x):')"
        shell: powershell
        run: |
          $project=Join-Path $env:GITHUB_WORKSPACE 'world4x-source/Unity'
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-region1-canon-unity-source.log'
          $env:ELDORIA_REGION1_SOURCE_EVIDENCE=Join-Path $env:RUNNER_TEMP 'eldoria-region1-source-gate.json'
          $args=@('-batchmode','-quit','-projectPath',('"' + $project + '"'),'-executeMethod','Eldoria.World4XCanon.Editor.RegionOneCanonicalSourceGate.Validate','-logFile',('"' + $log + '"'))
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1800000)){ & taskkill.exe /PID $p.Id /T /F | Out-Null; throw 'Unity source gate timeout' }
          if(Test-Path $log){Get-Content $log -Tail 90}
          if($p.ExitCode -ne 0){throw "Unity import/source gate failed: $($p.ExitCode)"}
          if(-not(Test-Path "$env:RUNNER_TEMP/eldoria-region1-source-gate.json")){throw 'Source gate did not execute'}
      - name: Actual integrated scene PlayMode test
        if: "!contains(github.event.head_commit.message, 'author-retry(world4x):') && !contains(github.event.head_commit.message, 'blender-author(world4x):')"
        shell: powershell
        run: |
          $project=Join-Path $env:GITHUB_WORKSPACE 'world4x-source/Unity'
          $env:VALORIA_GAMEPLAY_PROBE='1'
          $env:ELDORIA_REGION1_CAPTURE_OUT=Join-Path $env:RUNNER_TEMP "region1-canon-captures-$env:GITHUB_RUN_ID"
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-region1-canon-playmode.log'
          $xml=Join-Path $env:RUNNER_TEMP 'eldoria-region1-canon-tests.xml'
          $args=@('-batchmode','-projectPath',('"' + $project + '"'),'-runTests','-testPlatform','PlayMode','-testFilter','Eldoria.Tests.RegionOneCanonIntegratedAcceptanceTests;Eldoria.Tests.ReferenceUiArtPassTests;Eldoria.Tests.RoyalV3ManagementIntegrationTests;Eldoria.Tests.RoyalGoldV3IntegratedAcceptanceTests;Eldoria.Tests.SpawnlingAnimatedV4Tests','-testResults',('"' + $xml + '"'),'-logFile',('"' + $log + '"'))
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1800000)){ & taskkill.exe /PID $p.Id /T /F | Out-Null; throw 'Unity PlayMode test timeout' }
          if(Test-Path $log){Get-Content $log -Tail 90}
          if(Test-Path $xml){
            [xml]$diagnostic=Get-Content $xml -Raw
            foreach($failure in @($diagnostic.SelectNodes('//test-case[@result!="Passed"]'))){
              Write-Host ("NUNIT_RESULT "+$failure.name+" => "+$failure.result)
              if($failure.failure){Write-Host ("NUNIT_FAILURE "+$failure.failure.message.InnerText)}
            }
          }
          if($p.ExitCode -ne 0){throw "Integrated PlayMode test failed: $($p.ExitCode)"}
          if(-not(Test-Path $xml)){throw 'Missing actual Unity PlayMode result'}
          [xml]$result=Get-Content $xml -Raw
          $nodes=@($result.SelectNodes('//test-case'))
          if($nodes.Count -lt 18){throw "Expected at least 18 integrated, progression, UI and combat cases, got $($nodes.Count)"}
          if(@($nodes|Where-Object {$_.result -ne 'Passed'}).Count){throw 'Unity PlayMode contains failed or ignored tests'}
          $captures=@(Get-ChildItem $env:ELDORIA_REGION1_CAPTURE_OUT -Filter '*-unity.png')
          if($captures.Count -ne 14){throw "Missing actual clean-world and blockout PNGs: expected fourteen genuine Unity captures, got $($captures.Count)"}
          if($env:ELDORIA_RIBERA_PILOT -eq '1' -and (Test-Path "$project/Assets/Eldoria/World4XCanon/Resources/World4X/Pilot/LivingSectorLayout.json")){
            $living=Join-Path $env:ELDORIA_REGION1_CAPTURE_OUT 'ribera-pilot/living-sector'
            $proof=Get-Content "$living/capacity.json" -Raw | ConvertFrom-Json
            if(-not $proof.fullSizeNavigation -or -not $proof.originalSaveUntouched -or $proof.testMarkerScale -ne 1 -or $proof.duplicateCount -ne 0){throw 'Living sector proof incomplete'}
            if(@(Get-ChildItem $living -Filter '*.png').Count -ne 12){throw 'Missing living sector camera captures'}
          }
          Write-Host "REGION1_CANON_INTEGRATED_PLAYMODE_PASS cases=$($nodes.Count) captures=$($captures.Count) CLEAN_WORLD_AND_BLOCKOUT (NOT art/mobile QA)"
      - name: Recover exact already verified Unity authoring snapshot
        if: contains(github.event.head_commit.message, 'author-retry(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39831626822
          name: region1-canon-native-39831626822
          path: ${{ runner.temp }}/region1-author-source-${{ github.run_id }}
      - name: Verify recovered source identity without rerunning unchanged Unity
        if: contains(github.event.head_commit.message, 'author-retry(world4x):')
        shell: powershell
        run: |
          git -C world4x-source fetch --depth=1 origin b277320e35d0268d556fe2d540ae07d5535629a3
          if($LASTEXITCODE){throw 'Cannot verify pinned original terrain source'}
          git -C world4x-source diff --exit-code b277320e35d0268d556fe2d540ae07d5535629a3 HEAD -- Unity/
          if($LASTEXITCODE){throw 'Unity changed: cached captures cannot certify this source'}
          $capture=Join-Path $env:RUNNER_TEMP "region1-author-source-$env:GITHUB_RUN_ID/region1-canon-captures-39831626822"
          if(-not(Test-Path "$capture/terrain-source.json")){throw 'Measured source mesh missing'}
          "ELDORIA_REGION1_ARTIST_CAPTURE=$capture" >> $env:GITHUB_ENV
      - name: Upload logs and measured tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region1-canon-native-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/eldoria-region1-canon-unity-source.log
            ${{ runner.temp }}/eldoria-region1-canon-playmode.log
            ${{ runner.temp }}/eldoria-region1-canon-tests.xml
            ${{ runner.temp }}/eldoria-region1-source-gate.json
            ${{ runner.temp }}/region1-canon-captures-*/**
            ${{ runner.temp }}/region1-authoring-${{ github.run_id }}/**
            ${{ runner.temp }}/region1-authoring-${{ github.run_id }}/*.cycle-feedback.json
            ${{ runner.temp }}/region1-ollama-${{ github.run_id }}.*


  blender-interactive:
    needs: canon-source
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'blender-interactive(world4x):')
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15
    steps:
      - name: Find installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          path: world4x-source
          persist-credentials: false
          sparse-checkout: |
            docs/evidence/world4x-canon-20261022/authoring/interactive
            tools/workstream-lease
            pipeline
      - uses: actions/checkout@v4
        with:
          ref: main
          path: world4x-live
          persist-credentials: false
          sparse-checkout: pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live ownership before touching the retained Blender session
        shell: powershell
        run: |
          node world4x-source/tools/workstream-lease/check.mjs world4x-source/pipeline/active-workstreams.json world4x-live/pipeline/active-workstreams.json eldoria-world-region-1-canon-20261022
          if($LASTEXITCODE){throw 'Live workstream lease mismatch'}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39930695744
          name: region1-canon-native-39930695744
          path: ${{ runner.temp }}/interactive-source
      - name: Send this observed decision to the persistent local BlenderMCP session
        shell: powershell
        run: '& world4x-source/docs/evidence/world4x-canon-20261022/authoring/interactive/relay.ps1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region1-interactive-${{ github.run_id }}
          path: ${{ env.ELDORIA_INTERACTIVE_OUT }}/**
          if-no-files-found: error
