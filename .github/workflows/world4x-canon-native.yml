name: World4X Region 1 canonical candidate source and PlayMode QA

on:
  push:
    branches: [feature/world4x-region1-canon-20261022]
    paths:
      - 'Unity/Assets/Eldoria/World4XCanon/**'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs.meta'
      - 'docs/evidence/world4x-canon-20261022/authoring/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Unity/Assets/Eldoria/World4XCanon/**'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs'
      - 'Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs.meta'

permissions:
  contents: read
  actions: read

concurrency:
  group: world4x-canon-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  canon-source:
    if: github.event_name == 'push' || github.event.pull_request.number == 100
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/visual-reference/world-map
            docs/visual-reference/ELDORIA_WORLD_MAP_CANON_20261022.md
            Unity/Assets/Eldoria/World4XCanon
            Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs
            docs/evidence/world4x-canon-20261022/authoring/build_region_from_ai.py
            docs/evidence/world4x-canon-20261022/authoring/approved_breach_ground.py
            docs/evidence/world4x-canon-20261022/authoring/build_resource_library.py
            docs/evidence/world4x-canon-20261022/authoring/refine_geological_lookdev.py
      - name: Check Blender authoring syntax before reserving Windows editor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile docs/evidence/world4x-canon-20261022/authoring/approved_breach_ground.py docs/evidence/world4x-canon-20261022/authoring/build_region_from_ai.py docs/evidence/world4x-canon-20261022/authoring/build_resource_library.py docs/evidence/world4x-canon-20261022/authoring/refine_geological_lookdev.py
          echo 'WORLD4X_BLENDER_AUTHORING_SYNTAX_PASS'
      - name: Assert frozen owner PNG reference binaries
        shell: bash
        run: |
          set -euo pipefail
          echo 'bb053cf3099a202eff472a53207169dfba522b93c0c5b7bff0fed05b96438fd9  docs/visual-reference/world-map/01_vista_cercana.png' | sha256sum -c -
          echo '82a38cf89e9a8ad249739496de4c972a8008df29ec4efc946c3a22273f88f316  docs/visual-reference/world-map/02_vista_regional.png' | sha256sum -c -
          echo '68cd5b898cf3675db537b7ddceb8082befe955895864079a0ac26bdf4fb37144  docs/visual-reference/world-map/03_vista_panoramica.png' | sha256sum -c -
          test -f Unity/Assets/Eldoria/World4XCanon/RegionOneCanonicalLandscape.cs
          test -f Unity/Assets/Eldoria/World4XCanon/Editor/RegionOneCanonicalCapture.cs
          test -f Unity/Assets/Eldoria/Tests/PlayMode/RegionOneCanonIntegratedAcceptanceTests.cs
          grep -q 'RegionOneCanonicalLandscape' Unity/Assets/Eldoria/World4XCanon/RegionOneCanonicalLandscape.cs
          echo 'SOURCE_CANON_BLOBS_AND_FILES_PASS (not a Unity compile)'

  unity-source-playmode:
    permissions:
      contents: write
      actions: read
    needs: canon-source
    if: github.event_name == 'push' && vars.UNITY_RUNNER_READY == 'true' && !contains(github.event.head_commit.message, 'blender-interactive(world4x):') && !contains(github.event.head_commit.message, 'evidence-recovery(world4x):')
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 50
    steps:
      - name: Find installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          path: world4x-source
          clean: false
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/**
            /tools/workstream-lease/**
            /pipeline/active-workstreams.json
            /docs/evidence/world4x-canon-20261022/authoring/**
            /ArtSource/World4X/RockBoar_v1/RockBoar_Optimizado_49800.glb
            /ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Near.glb
            /ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Far.glb
      - uses: actions/checkout@v4
        with:
          ref: main
          path: world4x-live
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pipeline/active-workstreams.json
            /tools/art-knowledge/**
            /tools/art-direction/**
            /pipeline/art-knowledge/**
            /pipeline/art-production-requests/eldoria-world-region-1-canon-20261022.json
            /docs/visual-reference/world-map/**
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lease-check and real Unity preflight
        shell: powershell
        run: |
          node world4x-source/tools/workstream-lease/check.mjs world4x-source/pipeline/active-workstreams.json world4x-live/pipeline/active-workstreams.json eldoria-world-region-1-canon-20261022
          if($LASTEXITCODE){throw 'World4X owner scope or Windows lease no longer current'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Existing Unity or Blender job active: no concurrent overwrite'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity missing'}
          $version=& $env:UNITY_EDITOR_PATH -version
          if($version -notmatch '6000\.3\.23f1'){throw "Unexpected Unity version: $version"}
      - name: Author editable Blender composition from original references
        env:
          ELDORIA_DIRECT_SCULPT: ${{ contains(github.event.head_commit.message, 'blender-sculpt(world4x):') }}
        if: contains(github.event.head_commit.message, 'blender-author(world4x):') || contains(github.event.head_commit.message, 'blender-sculpt(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another heavy process is active'}
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $blender){$blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if(-not $blender){throw 'Installed Blender not found'}
          & $blender --version
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $helpers=Join-Path $env:GITHUB_WORKSPACE 'world4x-source/docs/evidence/world4x-canon-20261022/authoring'
          $refs=Join-Path $env:GITHUB_WORKSPACE 'world4x-live/docs/visual-reference/world-map'
          if($env:ELDORIA_DIRECT_SCULPT -eq 'true'){
            & $blender --background --python-exit-code 1 --python "$helpers/sculpt_region.py" -- $out "$helpers/sources/region1-blockout-b.blend" "$helpers/blender-cameras-input.json"
          }else{
            & $blender --background --python-exit-code 1 --python "$helpers/author_region.py" -- $out $refs "$helpers/blender-cameras-input.json"
          }
          if($LASTEXITCODE){throw 'Blender authoring failed'}
          if(-not(Test-Path "$out/eldoria-region1-author.blend")){throw 'Editable Blender source missing'}
          if(-not(Test-Path "$out/RegionOneBlenderWorld.glb")){throw 'Blender export missing'}
          if($env:ELDORIA_DIRECT_SCULPT -eq 'true'){
            $destination=Join-Path $env:GITHUB_WORKSPACE 'world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Blender'
            foreach($file in @('RegionOneBlenderWorld.glb','RegionOneBlenderQueries.bytes','blender-authoring-manifest.json')){
              Copy-Item (Join-Path $out $file) (Join-Path $destination $file) -Force
            }
            Write-Host 'Actual native tests consume the freshly sculpted Blender export; artifact hashes identify these generated inputs.'
          }
      - name: Recover the last valid editable ribera source
        if: contains(github.event.head_commit.message, 'ribera-finish(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40014366595
          name: region1-canon-native-40014366595
          path: ${{ runner.temp }}/ribera-pinned-source
      - name: Finish existing ribera surfaces and banks in Blender
        if: contains(github.event.head_commit.message, 'ribera-finish(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another heavy process is active'}
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender missing'}
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $source=Join-Path $env:RUNNER_TEMP 'ribera-pinned-source/region1-authoring-40014366595/Eldoria_Ribera_Finished.blend'
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/extend_living_sector.py -- $out $source
          if($LASTEXITCODE){throw 'Ribera finishing failed'}
          $dest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Pilot'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$out/RiberaPilot.glb" "$dest/RiberaPilot.glb" -Force
          Copy-Item "$out/LivingSectorLayout.json" "$dest/LivingSectorLayout.json" -Force
          'ELDORIA_RIBERA_PILOT=1' >> $env:GITHUB_ENV
      - name: Author bounded ribera pilot in Blender
        if: contains(github.event.head_commit.message, 'hybrid-pilot(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another heavy process is active'}
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender missing'}
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/author_patch.py -- $out
          if($LASTEXITCODE){throw 'Ribera authoring failed'}
          $dest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Pilot'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$out/RiberaPilot.glb" "$dest/RiberaPilot.glb"
          'ELDORIA_RIBERA_PILOT=1' >> $env:GITHUB_ENV
      - name: Recover certified AI for the full-region production candidate
        if: contains(github.event.head_commit.message, 'region-production(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40024930128
          name: region1-canon-native-40024930128
          path: ${{ runner.temp }}/region-ai-source
      - name: Extend certified AI into one authored continental mesh
        if: contains(github.event.head_commit.message, 'region-production(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Heavy process conflict'}
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender unavailable'}
          $out=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $source=Join-Path $env:RUNNER_TEMP 'region-ai-source/region1-authoring-40024930128/Eldoria_Ribera_Finished.blend'
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/build_region_from_ai.py -- $out $source
          if($LASTEXITCODE){throw 'Continental Blender authoring failed'}
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/build_resource_library.py -- $out $source
          if($LASTEXITCODE){throw 'Reusable resource Blender authoring failed'}
          $dest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Blender'
          foreach($file in @('RegionOneBlenderWorld.glb','RegionOneBlenderQueries.bytes','production-region.json','RegionOneResources.glb','RegionOneResourceImpostors.png','RegionOneGrassDetail.png')){Copy-Item (Join-Path $out $file) (Join-Path $dest $file) -Force}
      - name: Stage existing Tripo boar and engendro with an actual Blender far LOD
        if: contains(github.event.head_commit.message, 'region-production(world4x):')
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Heavy process conflict'}
          $root='world4x-source/ArtSource/World4X'
          $out='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Creatures'
          New-Item -ItemType Directory -Force $out | Out-Null
          $boar="$root/RockBoar_v1/RockBoar_Optimizado_49800.glb"
          $spawnNear="$root/Spawnling_v1/Finished/Spawnling_B2_Near.glb"
          $spawnFar="$root/Spawnling_v1/Finished/Spawnling_B2_Far.glb"
          foreach($source in @($boar,$spawnNear,$spawnFar)){if(-not(Test-Path $source)){throw "Protected Tripo original missing: $source"}}
          Copy-Item -LiteralPath $boar -Destination "$out/RockBoarNear.glb" -Force
          Copy-Item -LiteralPath $spawnNear -Destination "$out/SpawnlingNear.glb" -Force
          Copy-Item -LiteralPath $spawnFar -Destination "$out/SpawnlingFar.glb" -Force
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Blender needed to create a far boar LOD from original Tripo'}
          $outEditable=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/make_boar_far_lod.py -- $boar "$out/RockBoarFar.glb" "$outEditable/RockBoar_Far_LOD.blend"
          if($LASTEXITCODE){throw 'Tripo boar far LOD production failed'}
          foreach($file in @('RockBoarNear.glb','RockBoarFar.glb','SpawnlingNear.glb','SpawnlingFar.glb')){
            if(-not(Test-Path "$out/$file") -or (Get-Item "$out/$file").Length -lt 100000){throw "Missing actual Tripo LOD: $file"}
          }
          Write-Host 'REGION1_TRIPO_ORIGINALS_REUSED 4 real GLBs / 2 immutable original families / zero API credits'
      - name: Recover exact preview-authored Blender assets for same-scene Unity recheck
        if: contains(github.event.head_commit.message, 'region-recheck(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40193549354
          name: region1-canon-native-40193549354
          path: ${{ runner.temp }}/region1-recheck-source
      - name: Verify pinned original art and recheck exact pre-PlayMode source
        if: contains(github.event.head_commit.message, 'region-recheck(world4x):')
        shell: powershell
        run: |
          $origin=Join-Path $env:RUNNER_TEMP 'region1-recheck-source/region1-authoring-40193549354'
          $destination=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $unityDest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Blender'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $verified=[ordered]@{
            'RegionOneBlenderWorld.glb'='1d9c2466767c3fbabdf3a238e5cace2b372c945e01458521d9ca0c6a2f8e98e7'
            'RegionOneBlenderQueries.bytes'='4a57aa0fd5b4401fa1aeac6062c26bc142731348e63ff752dbb2c6c63ca33068'
            'production-region.json'='a4ce659d62d2f8aa7ac70cbc573f77ae75774091ab145938cc8b49bb872cba99'
            'RegionOneResources.glb'='fc1943706c6f5e6d3780b6c997ec9d6a9b03761938673bb1f10da6ddd9b9193d'
            'RegionOneResourceImpostors.png'='7364fa79733f763fbd8b1fbf63c648b432f40d20f3ddf4e0b0eec9ddc5576ea0'
            'RegionOneGrassDetail.png'='4428879cb0f76f7ccb400b77f3c194b3c1398ba8bacd57226f71819306dc15c8'
          }
          foreach($pair in $verified.GetEnumerator()){
            $source=Join-Path $origin $pair.Key
            if(-not(Test-Path $source)){throw "Pinned run 40193549354 missing source $($pair.Key)"}
            if((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pair.Value){
              throw "Original real Blender output changed: $($pair.Key)"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $destination $pair.Key)
            Copy-Item -LiteralPath $source -Destination (Join-Path $unityDest $pair.Key) -Force
          }
          foreach($name in @('Eldoria_Region1_Production.blend','Eldoria_Resource_Library.blend',
            'RockBoar_Far_LOD.blend','retained-core-integrity.json')){
            $source=Join-Path $origin $name
            if(-not(Test-Path $source)){throw "Pinned editable source or integrity proof absent: $name"}
            Copy-Item -LiteralPath $source -Destination (Join-Path $destination $name)
          }
          $creatureDest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Creatures'
          New-Item -ItemType Directory -Path $creatureDest -Force | Out-Null
          $rock='world4x-source/ArtSource/World4X/RockBoar_v1/RockBoar_Optimizado_49800.glb'
          $spawnNear='world4x-source/ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Near.glb'
          $spawnFar='world4x-source/ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Far.glb'
          foreach($f in @($rock,$spawnNear,$spawnFar)){if(-not(Test-Path $f)){throw "Protected Tripo original missing: $f"}}
          Copy-Item $rock "$creatureDest/RockBoarNear.glb" -Force
          Copy-Item $spawnNear "$creatureDest/SpawnlingNear.glb" -Force
          Copy-Item $spawnFar "$creatureDest/SpawnlingFar.glb" -Force
          $blender=Get-ChildItem 'C:/Program Files/Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender required for original boar far LOD'}
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/make_boar_far_lod.py -- $rock "$creatureDest/RockBoarFar.glb" "$destination/RockBoar_Far_LOD.blend"
          if($LASTEXITCODE){throw 'Original boar far LOD rebuild did not succeed'}
          & $blender --background --python-exit-code 1 --python world4x-source/docs/evidence/world4x-canon-20261022/authoring/refine_geological_lookdev.py -- "$destination/Eldoria_Region1_Production.blend" $destination
          if($LASTEXITCODE){throw 'Reviewed source-preserving look development failed'}
          foreach($name in @('RegionOneBlenderWorld.glb','RegionOneGrassDetail.png','RegionOneResources.glb','RegionOneResourceImpostors.png')){
            Copy-Item (Join-Path $destination $name) (Join-Path $unityDest $name) -Force
          }
          Write-Host 'REGION1_PINNED_SOURCE_6_INPUT_HASHES_PASS reviewed_lookdev_export=1 art_approved=false repeat_native_playmode_required=1'
      - name: Recover preserved editable art without reauthoring it
        if: contains(github.event.head_commit.message, 'region-imported(world4x):')
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40202342770
          name: region1-canon-native-40202342770
          path: ${{ runner.temp }}/region1-preserved-source
      - name: Require exact pinned Blender output before fresh Unity verification
        if: contains(github.event.head_commit.message, 'region-imported(world4x):')
        shell: powershell
        run: |
          $origin=Join-Path $env:RUNNER_TEMP 'region1-preserved-source/region1-authoring-40202342770'
          $destination=Join-Path $env:RUNNER_TEMP "region1-authoring-$env:GITHUB_RUN_ID"
          $unityDest='world4x-source/Unity/Assets/Eldoria/World4XCanon/Resources/World4X/Blender'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $measured=[ordered]@{}
          $verified=[ordered]@{
            'RegionOneBlenderWorld.glb'='8e1ba54bdf1708b3b725ab06d9084329ff3d41864277fbe91fbd8132dd4e38b6'
            'RegionOneBlenderQueries.bytes'='4a57aa0fd5b4401fa1aeac6062c26bc142731348e63ff752dbb2c6c63ca33068'
            'production-region.json'='a4ce659d62d2f8aa7ac70cbc573f77ae75774091ab145938cc8b49bb872cba99'
            'RegionOneResources.glb'='d3a993a2389875e621e8e883d99dacf8017649c13e9ccfac01902066ea8ac37a'
            'RegionOneResourceImpostors.png'='1c5af8246f599c120126b56602a7452318f51f31b702b1fb17cafb79c826b0a3'
            'RegionOneGrassDetail.png'='e66b6872b03c9631cf06d18457290d724bf283d53e1a7ab9e3c502e6029af5dc'
          }
          foreach($name in @('RegionOneBlenderWorld.glb','RegionOneBlenderQueries.bytes','production-region.json','RegionOneResources.glb','RegionOneResourceImpostors.png','RegionOneGrassDetail.png')){
            $saved=Join-Path $origin $name
            $current=Join-Path $unityDest $name
            if(-not(Test-Path $saved)){throw "Pinned preserved art missing: $name"}
            $expected=$verified[$name]
            if((Get-FileHash $saved -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw "Pinned Blender binary changed: $name"}
            Copy-Item -LiteralPath $saved -Destination $current -Force
            $actual=(Get-FileHash $current -Algorithm SHA256).Hash.ToLowerInvariant()
            if($expected -ne $actual){throw "Imported binary copy mismatch: $name"}
            $measured[$name]=$actual
          }
          foreach($name in @('Eldoria_Region1_Production.blend','Eldoria_Resource_Library.blend','RockBoar_Far_LOD.blend','retained-core-integrity.json')){
            if(-not(Test-Path (Join-Path $origin $name))){throw "Missing preserved editable source: $name"}
          }
          Copy-Item -Path "$origin/*" -Destination $destination -Recurse -Force
          @{source_run=40202342770;source_gate_passed=$true;previous_runtime_certified=$false;exact_imported_binary_sha256=$measured;blender_reauthored=$false;fresh_unity_tests_required=$true} |
            ConvertTo-Json -Depth 6 | Set-Content (Join-Path $destination 'imported-art-identity.json') -Encoding UTF8
          Write-Host 'REGION1_PRESERVED_EDITABLE_ART_AND_SIX_PINNED_IMPORTED_BINARIES_IDENTICAL fresh_Unity_required=true'
      - name: Recover reviewed approved resource assets from actual BlenderMCP edit
        if: contains(github.event.head_commit.message, 'region-imported(world4x):')
        uses: actions/download-artifact@v4
        with:
