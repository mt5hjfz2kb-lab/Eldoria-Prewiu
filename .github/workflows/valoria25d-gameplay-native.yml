name: Valoria25D - Unity real gateway PlayMode and isolated WebGL candidate
on:
  push:
    branches: [integration/valoria-25d-playable-20261117]
    paths: ['tools/valoria-25d/native_qa_request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria25d-single-native-proof
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      authorized: ${{ steps.lease.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/valoria-25d/native_qa_request.json
            /Unity/Assets/Valoria25D/Runtime/
            /Unity/Assets/Valoria25D/Editor/
            /Unity/Assets/Valoria25D/QA/GatewayProof/
            /Unity/Assets/Valoria25D/Scenes/
      - name: Check integration request and source-level acceptance gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('tools/valoria-25d/native_qa_request.json')
          j=json.loads(p.read_text())
          assert j['schema']==1
          assert j['branch']=='integration/valoria-25d-playable-20261117'
          assert j['main_base']=='904ff183ffb9053f68b9c0f359b2e9d3d40ce805'
          assert j['no_main_change'] and j['no_art_change'] and j['qa_saves_only']
          root=pathlib.Path('Unity/Assets/Valoria25D')
          for path in ['Runtime/City25DPlayableController.cs',
                       'Runtime/City25DActionCatalog.cs',
                       'Runtime/City25DMinimalHud.cs',
                       'Runtime/City2DStateBridge.cs',
                       'Editor/City25DGameplaySceneBuilder.cs',
                       'Editor/City25DCandidateBuild.cs',
                       'QA/GatewayProof/City25DLiveGatewayPlayModeProof.cs',
                       'QA/GatewayProof/Valoria25D.PlayModeProof.asmdef',
                       'Scenes/Valoria25D_PremiumV6_Source.unity']:
              assert (root/path).is_file(),path
          gateway=(root/'Runtime/City25DPlayableController.cs').read_text()
          assert 'SliceBoot.OpenCity25DGateway()' in gateway
          assert 'gateway.Execute(command)' in gateway
          assert 'bridge.BindGateway(gateway)' in gateway
          assert 'SetDemoBastionLevel' not in gateway
          scene=(root/'Editor/City25DGameplaySceneBuilder.cs').read_text()
          assert 'City25DPlayableController' in scene
          assert 'UnityEngine.Object.DestroyImmediate(demo.gameObject)' in scene
          candidate=(root/'Editor/City25DCandidateBuild.cs').read_text()
          assert 'BuildPipeline.BuildPlayer' in candidate
          assert 'new[]{scene}' in candidate
          tests=(root/'QA/GatewayProof/City25DLiveGatewayPlayModeProof.cs').read_text()
          for marker in ['Sawmill_RealWallet','Bastion_Canonical',
                         'Barracks_Recruit','ChapterThree_Real','LockedOrUnfunded',
                         'SameCommandId','ActualPlayablePremiumV6']:
              assert marker in tests, marker
          print('VALORIA25D_NATIVE_SOURCE_GATES_PASS no_economy_changes true')
          PY
      - name: Check original Windows runner lease without changing main
        id: lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          def gh(path):
              u='https://api.github.com/repos/'+repo+'/'+path
              req=urllib.request.Request(u,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=50) as h:return json.load(h)
          file=gh('contents/pipeline/active-workstreams.json?ref=main')
          if file.get('content'):
              data=base64.b64decode(file['content'])
          else:
              blob=gh('git/blobs/'+file['sha'])
              assert blob.get('sha')==file['sha'] and blob['encoding']=='base64'
              data=base64.b64decode(blob['content'])
          registry=json.loads(data)
          holders=[x for x in registry.get('active',[])
                   if 'windows-runner-heavy' in x.get('resources',[])]
          valid=len(holders)==1 and holders[0].get('id')=='eldoria-city2d-illustrated-proof-20261116' and holders[0].get('owner')=='chatgpt-eldoria-city2d-priority-20261116' and holders[0].get('ownership_state')=='claimed' and registry.get('resource_rotation',{}).get('current_workstream')==holders[0].get('id')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+str(valid).lower()+'\n')
          print('VALORIA25D_LEASE_CONTINUATION_AUTHORIZED' if valid else
                'VALORIA25D_WINDOWS_RUNNER_NOT_AUTHORIZED; skip safely')
          PY

  unity-native:
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    steps:
      - name: Confirm lease, no active Unity work and sufficient disk
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json'}
          $api='https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/'
          $entry=Invoke-RestMethod -Uri ($api+'contents/pipeline/active-workstreams.json?ref=main') -Headers $h
          $encoded=$entry.content
          if(-not $encoded){
            $blob=Invoke-RestMethod -Uri ($api+'git/blobs/'+$entry.sha) -Headers $h
            if($blob.sha -ne $entry.sha -or $blob.encoding -ne 'base64'){throw 'Lease SHA mismatch'}
            $encoded=$blob.content
          }
          $registry=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -replace '\s',''))) | ConvertFrom-Json
          $holders=@($registry.active | Where-Object { @($_.resources) -contains 'windows-runner-heavy' })
          if($holders.Count -ne 1 -or
             $holders[0].id -ne 'eldoria-city2d-illustrated-proof-20261116' -or
             $holders[0].owner -ne 'chatgpt-eldoria-city2d-priority-20261116' -or
             $holders[0].ownership_state -ne 'claimed' -or
             $registry.resource_rotation.current_workstream -ne $holders[0].id){
            throw 'PC lease no longer belongs to this owner: leave it untouched'
          }
          if(@(Get-Process Unity,UnityShaderCompiler,UnityPackageManager,blender -ErrorAction SilentlyContinue).Count){
            throw 'Another native task is active: do not interrupt the shared PC'
          }
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){
            throw 'Unity 6000.3 editor not installed'
          }
          $module=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/WebGLSupport'
          if(-not(Test-Path $module)){throw 'WebGL player build module unavailable'}
          $disk=(Get-Item $env:RUNNER_TEMP).PSDrive
          if($disk.Free -lt 12GB){throw 'Free disk below 12 GiB, do not trigger large Unity build'}
          Write-Host ('VALORIA25D_SAFE_NATIVE_PREFLIGHT_PASS free_gib='+[math]::Round($disk.Free/1GB,2))

      - name: Ensure existing Git is available (no installs)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $home="$env:LOCALAPPDATA/GitHubDesktop"
            $git=Get-ChildItem $home -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'No Git; refuse full checkout'}
            Add-Content $env:GITHUB_PATH (Split-Path $git)
            $env:PATH="$(Split-Path $git);$env:PATH"
          }
          git --version

      - name: Create isolated SHA-pinned sparse Unity checkout, do not touch main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$'){throw 'Not a real pinned SHA'}
          $dest=Join-Path $env:RUNNER_TEMP ("valoria25d-gameplay-"+$env:GITHUB_RUN_ID)
          if(Test-Path $dest){throw 'Scratch folder already exists'}
          git init -q $dest
          if($LASTEXITCODE){throw 'git init failed'}
          git -C $dest remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $paths=@('/Unity/Assets/Valoria25D/','/Unity/Assets/Eldoria/Scripts/',
                   '/Unity/Packages/','/Unity/ProjectSettings/')
          git -C $dest sparse-checkout set --no-cone @paths
          if($LASTEXITCODE){throw 'Sparse patterns failed'}
          git -C $dest fetch --no-tags --depth=1 --filter=blob:none origin $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Pinned fetch failed'}
          git -C $dest checkout -q --detach $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Pinned checkout failed'}
          if((& git -C $dest rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){
            throw 'Source SHA is not exact'
          }
          "VALORIA25D_NATIVE_SOURCE=$dest" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ('VALORIA25D_PINNED_INTEGRATION_SHA='+$env:GITHUB_SHA)
          Write-Host ('VALORIA25D_COPY_MB='+[math]::Round((
            Get-ChildItem (Join-Path $dest 'Unity/Assets/Valoria25D') -File -Recurse |
              Measure-Object Length -Sum).Sum/1MB,1))

      - name: Create gameplay Unity scene from original V6 without editing source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:VALORIA25D_NATIVE_SOURCE 'Unity'
          $log=Join-Path $env:RUNNER_TEMP 'valoria25d-scene-build.log'
          $args=@('-batchmode','-quit','-buildTarget','WebGL',
            '-projectPath',$project,
            '-executeMethod','Eldoria.Valoria25D.Editor.City25DGameplaySceneBuilder.Build',
            '-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1200000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Scene construction Unity process timed out'
          }
          if($p.ExitCode -ne 0){
            if(Test-Path $log){Get-Content $log -Tail 230}
            throw ('Unity scene construction failed '+$p.ExitCode)
          }
          $scene=Join-Path $project 'Assets/Valoria25D/Scenes/Valoria25D_Gameplay.unity'
          if(-not(Test-Path $scene)){throw 'Unity did not produce a real gameplay scene'}
          $expected='VALORIA25D_SCENE_BUILT_ONE_ROOT_SIX_PLOTS_FOUR_PREMIUM_SHADOWS'
          if(-not(Select-String -Path $log -Pattern $expected -SimpleMatch -Quiet)){
            Get-Content $log -Tail 150
            throw 'Unity did not certify visual source and unique root'
          }
          Write-Host 'VALORIA25D_SCENE_CREATED_IN_UNITY_REAL'

      - name: Execute actual Unity PlayMode and gateway tests with isolated QA save
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:VALORIA25D_NATIVE_SOURCE 'Unity'
          $log=Join-Path $env:RUNNER_TEMP 'valoria25d-playmode.log'
          $result=Join-Path $env:RUNNER_TEMP 'valoria25d-playmode-results.xml'
          $proof=Join-Path $env:RUNNER_TEMP 'valoria25d-native-proof'
          New-Item -ItemType Directory -Force -Path $proof | Out-Null
          $env:VALORIA25D_EVIDENCE_DIR=$proof
          $args=@('-batchmode','-runTests','-testPlatform','PlayMode',
            '-testFilter','Eldoria.Valoria25D.PlayModeProof.City25DLiveGatewayPlayModeProof',
            '-testResults',$result,
            '-projectPath',$project,'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1200000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Unity PlayMode timed out'
          }
          if(Test-Path $log){
            Get-Content $log -Tail 100
          }
          if($p.ExitCode -ne 0){throw ('Unity PlayMode process failed '+$p.ExitCode)}
          if(-not(Test-Path $result)){throw 'No original NUnit XML result'}
          [xml]$xml=Get-Content $result
          $testRun=$xml.'test-run'
          if($null -eq $testRun){throw 'Not a valid Unity test-run NUnit XML'}
          $total=[int]$testRun.total
          $passed=[int]$testRun.passed
          $failed=[int]$testRun.failed
          if($failed -ne 0 -or $total -lt 7 -or $passed -lt 7){
            Write-Host ('VALORIA25D_REAL_TESTS_FAILED total='+$total+' passed='+$passed+' failed='+$failed)
            throw 'PlayMode acceptance gate failed'
          }
          Write-Host ('VALORIA25D_TRUE_PLAYMODE_PASS total='+$total+' passed='+$passed+' failed='+$failed)
          $shot=Join-Path $proof 'Valoria25D_Bastion1_CANONICAL_SAVE_Unity_RenderTexture_390x844.png'
          if(-not(Test-Path $shot)){throw 'Authentic Unity PlayMode camera screenshot missing'}
          $hash=Get-FileHash -Algorithm SHA256 $shot
          Write-Host ('VALORIA25D_REAL_UNITY_FRAME_SHA256='+$hash.Hash.ToLowerInvariant())

      - name: Compile isolated playable WebGL candidate from proven scene
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:VALORIA25D_NATIVE_SOURCE 'Unity'
          $log=Join-Path $env:RUNNER_TEMP 'valoria25d-webgl.log'
          $args=@('-batchmode','-quit','-buildTarget','WebGL','-projectPath',$project,
            '-executeMethod','Eldoria.Valoria25D.Editor.City25DCandidateBuild.WebGL',
            '-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1200000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'WebGL candidate build timed out'
          }
          if($p.ExitCode -ne 0){
            if(Test-Path $log){Get-Content $log -Tail 220}
            throw ('Unity WebGL build failed '+$p.ExitCode)
          }
          $web=Join-Path $project 'Valoria25D_CandidateWebGL'
          if(-not(Test-Path (Join-Path $web 'index.html'))){throw 'No compiled candidate HTML'}
          if(-not(Test-Path (Join-Path $web 'integration_manifest.json'))){
            throw 'No truthful source manifest in Unity candidate'
          }
          $wasm=@(Get-ChildItem (Join-Path $web 'Build') -Filter '*.wasm' -File)
          $data=@(Get-ChildItem (Join-Path $web 'Build') -Filter '*.data' -File)
          $loader=@(Get-ChildItem (Join-Path $web 'Build') -Filter '*.loader.js' -File)
          if($wasm.Count -ne 1 -or $data.Count -ne 1 -or $loader.Count -ne 1){
            throw 'Incomplete real WebAssembly payload'
          }
          Write-Host ('VALORIA25D_REAL_UNITY_WEBGL_BUILD_SUCCESS build_bytes='+
            (Get-ChildItem $web -File -Recurse|Measure-Object Length -Sum).Sum)
      - name: Keep exact gameplay scene, PlayMode results and Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria25d-native-proof-${{ github.run_id }}
          path: |
            ${{ env.VALORIA25D_NATIVE_SOURCE }}/Unity/Assets/Valoria25D/Scenes/Valoria25D_Gameplay.unity
            ${{ runner.temp }}/valoria25d-playmode-results.xml
            ${{ runner.temp }}/valoria25d-scene-build.log
            ${{ runner.temp }}/valoria25d-playmode.log
            ${{ runner.temp }}/valoria25d-webgl.log
            ${{ runner.temp }}/valoria25d-native-proof/
          if-no-files-found: warn
          retention-days: 14
      - name: Keep independent candidate player files if genuine build passed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: valoria25d-real-webgl-candidate-${{ github.run_id }}
          path: ${{ env.VALORIA25D_NATIVE_SOURCE }}/Unity/Valoria25D_CandidateWebGL/**
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
