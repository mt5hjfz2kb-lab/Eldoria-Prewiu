name: Eldoria private beta native325 immutable draft archive
on:
  push:
    branches:
      - feature/eldoria-private-beta-i-v-20261107
    paths:
      - .github/workflows/eldoria-private-beta-freeze.yml
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/eldoria-private-beta-freeze.yml'
      - 'tools/eldoria-private-beta/**'
      - 'pipeline/eldoria-private-beta/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: eldoria-beta-freeze-native325
  cancel-in-progress: false
jobs:
  freeze:
    name: Verify exact web bytes and store only as draft
    if: ${{ github.repository == 'mt5hjfz2kb-lab/Eldoria-Prewiu' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            pipeline/eldoria-private-beta
          persist-credentials: false
      - name: Unit tests of strict freeze manifest
        run: node --test tools/eldoria-private-beta/verify-freeze.test.mjs
      - name: Prove upstream GitHub artifact before downloading
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/13583674142 > /tmp/beta-artifact.json
          node --input-type=module -e '
            import fs from "node:fs";
            const a=JSON.parse(fs.readFileSync("/tmp/beta-artifact.json","utf8"));
            const m=JSON.parse(fs.readFileSync("pipeline/eldoria-private-beta/native325-freeze.json","utf8"));
            if(a.id!==m.artifact_id || a.workflow_run?.id!==m.artifact_run_id ||
              a.workflow_run?.head_sha!==m.artifact_workflow_head_sha ||
              a.name!==m.artifact_name || a.digest!==m.artifact_zip_digest ||
              a.expired!==false)throw Error("Upstream Actions package identity invalid or expired");
            console.log("BETA_UPSTREAM_ARTIFACT_EXACT_MATCH",a.id,a.digest);
          '
      - uses: actions/download-artifact@v4
        with:
          run-id: 42397405907
          name: eldoria-pr163-web-preview-42397405907
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eldoria-native325-artifact
      - name: Verify byte-identical native325 ZIP
        id: package
        env:
          BETA_FREEZE_RECEIPT: ${{ runner.temp }}/beta-native325-verify.json
        run: |
          node tools/eldoria-private-beta/verify-freeze.mjs \
            pipeline/eldoria-private-beta/native325-freeze.json \
            "${{ runner.temp }}/eldoria-native325-artifact"
      - name: Freeze in private DRAFT release, never publish publicly
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=eldoria-beta-native325-frozen-20261107
          ASSET="${{ runner.temp }}/Eldoria-Beta-1-native325-exact.zip"
          cp "$ZIP_PATH" "$ASSET"
          echo "Validating copy after transferring:"
          echo "fb1292b3d9ce4d6096d69fa18b417bc0a8cc6016f100defb3deaf29fbdb95771  $ASSET" | sha256sum -c -
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            test "$DRAFT" = "true" || { echo "Refusing non-draft existing release"; exit 1; }
            printf 'Existing DRAFT found; will not replace or reupload without independent exact-asset check.\n'
            exit 1
          fi
          {
            echo '## ELDORIA BETA 1 — ARCHIVO CONGELADO / SIN PUBLICACIÓN'
            echo 'NO PUBLICAR, NO ENVIAR A TESTERS. Almacenamiento privado como draft de GitHub Release.'
            echo 'Version WebGL native325-fb1292b3d9ce, artifact 13583674142, SHA256 interior fb1292b3d9ce4d6096d69fa18b417bc0a8cc6016f100defb3deaf29fbdb95771.'
            echo 'QA alojada, pruebas móviles, telemetría Unity y hosting privado permanecen PENDIENTES.'
          } > "${{ runner.temp }}/draft-notes.md"
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Eldoria Beta 1 native325 · copia congelada · NO PUBLICAR" \
            --notes-file "${{ runner.temp }}/draft-notes.md"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          echo 'BETA_ARCHIVED_AS_DRAFT_ONLY_PASS'
