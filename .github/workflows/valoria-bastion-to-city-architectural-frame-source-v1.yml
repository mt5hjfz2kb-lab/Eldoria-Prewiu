name: "[PRODUCTION] Valoria Bastion-to-City Architectural Frame Source v1"
on:
  push:
    branches: [main]
    paths:
      - pipeline/valoria-bastion-to-city-architectural-frame-source-v1-request.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valoria-bastion-to-city-architectural-frame-source-v1
  cancel-in-progress: true
jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libegl1 libgl1-mesa-dri
          blender --version | head -2
      - name: Author complete architectural frame and source review
        shell: bash
        run: |
          OUT="art-source/valoria/production/bastion-to-city-architectural-frame-v1"
          EVID="pipeline/evidence/valoria-bastion-to-city-architectural-frame-v1/source"
          mkdir -p "$OUT" "$EVID" "Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/BastionToCityArchitecturalFrameV1"
          blender -b --python tools/blender_valoria_bastion_to_city_architectural_frame_v1.py -- --output-dir "$OUT" --evidence-dir "$EVID" --report "$EVID/source-report.json"
          cp "$OUT/Valoria_BastionToCityArchitecturalFrame_v1.glb" "Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/BastionToCityArchitecturalFrameV1/"
          cat "$EVID/source-report.json"
      - name: Commit authored source
        shell: bash
        run: |
          git config user.name "eldoria-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add art-source/valoria/production/bastion-to-city-architectural-frame-v1 pipeline/evidence/valoria-bastion-to-city-architectural-frame-v1/source Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/BastionToCityArchitecturalFrameV1
          if git diff --cached --quiet; then echo "No source changes"; else git commit -m "Author Bastion-to-City architectural frame source"; git push origin HEAD:main; fi
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-bastion-to-city-architectural-frame-source-v1
          path: |
            art-source/valoria/production/bastion-to-city-architectural-frame-v1/*
            pipeline/evidence/valoria-bastion-to-city-architectural-frame-v1/source/*
          retention-days: 30
