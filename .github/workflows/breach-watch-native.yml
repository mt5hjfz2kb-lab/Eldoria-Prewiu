name: Vigilia de la Brecha genuine Unity first screen
on:
  push:
    branches: [feature/forja-oscura-native-proof-20261107]
    paths: [tools/breach-watch/native-request.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  alternative-unity-licensing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether an alternative hosted Unity runner can be licensed legally
        shell: bash
        env:
          UNITY_LICENSE_CANDIDATE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL_CANDIDATE: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_CANDIDATE: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE_CANDIDATE" ] &&
             [ -n "$UNITY_EMAIL_CANDIDATE" ] &&
             [ -n "$UNITY_PASSWORD_CANDIDATE" ]; then
            echo 'VIGILIA_ALTERNATE_HOSTED_UNITY_LICENSE_INPUTS_AVAILABLE'
          else
            echo 'VIGILIA_ALTERNATE_HOSTED_UNITY_NOT_CONFIGURED'
            echo 'No secret content or account identity is printed or retained.'
          fi
  export-reference-for-design-qa:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vigilia-design-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Eldoria/BreachWatch/Resources/**
            /docs/evidence/valoria-reference-clean/chapter2-city-built.png
            /docs/evidence/valoria-reference-clean/integration-city-art.png
          persist-credentials: false
      - name: Validate actual approved separate medallions
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/OwnerReference')
          data=json.loads((root/'source-manifest.json').read_text())
          assert len(data['sprites'])==5
          for item in data['sprites']:
              p=root/(item['name']+'.png')
              assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
          context=data['context_frame']
          assert hashlib.sha256((root/'carved_context.png').read_bytes()).hexdigest()==context['sha256']
          print('VERIFIED_APPROVED_REFERENCE_SEPARATE_SPRITES',len(data['sprites'])+1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vigilia-independent-visual-resources-${{ github.run_id }}
          path: |
            Unity/Assets/Eldoria/BreachWatch/Resources/**
            docs/evidence/valoria-reference-clean/chapter2-city-built.png
            docs/evidence/valoria-reference-clean/integration-city-art.png
          if-no-files-found: error
          retention-days: 7
  evaluate-cc0-resource-icons:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vigilia-resource-research]')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Inspect real AnnoMotion resource-icon package, source and CC0 text
        shell: bash
        run: |
          python3 - <<'PY'
          import io,os,pathlib,urllib.request,json,hashlib,zipfile
          url='https://annomotion.studio/packs/fantasy-rpg-item-icons/download'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'breachwatch-resource-review'
          out.mkdir(exist_ok=True)
          req=urllib.request.Request(url,headers={'User-Agent':'Eldoria-breachwatch-resource-inspection'})
          with urllib.request.urlopen(req,timeout=50) as response:
              raw=response.read(19_000_000)
          assert raw[:4]==b'PK\x03\x04' and 100_000<len(raw)<19_000_000
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              info=z.infolist()
              assert len(info)<250 and sum(x.file_size for x in info)<230_000_000
              for i in info:
                  p=pathlib.PurePosixPath(i.filename.replace('\\','/'))
                  assert not p.is_absolute() and '..' not in p.parts
              paths=[i.filename for i in info]
              texts={p:z.read(p).decode('utf-8','replace')[:4000] for p in paths if p.lower().endswith(('.txt','.md'))}
          (out/'source.zip').write_bytes(raw)
          (out/'inventory.json').write_text(json.dumps({
            'origin':url,'sha256':hashlib.sha256(raw).hexdigest(),
            'paths':paths,'license_documents':texts,'no_game_changes':True
          },ensure_ascii=False,indent=2))
          print('BREACHWATCH_RESOURCE_INSPECTED',len(paths),hashlib.sha256(raw).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: breachwatch-resource-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/breachwatch-resource-review/**
          retention-days: 7
          if-no-files-found: error
  commit-verified-cc0-art:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[breach-art-import]') || contains(github.event.head_commit.message, '[vigilia-import-resources]') || contains(github.event.head_commit.message, '[vigilia-owner-reference]') || contains(github.event.head_commit.message, '[vigilia-context-frame]') || contains(github.event.head_commit.message, '[vigilia-premium-art]') || contains(github.event.head_commit.message, '[vigilia-premium-surfaces]') || contains(github.event.head_commit.message, '[vigilia-owner-gold-border]') || contains(github.event.head_commit.message, '[vigilia-owner-utilities]') || contains(github.event.head_commit.message, '[vigilia-owner-controls]') || contains(github.event.head_commit.message, '[vigilia-owner-close]') || contains(github.event.head_commit.message, '[vigilia-owner-rift]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/breach-watch/**
            /Unity/Assets/Eldoria/BreachWatch/**
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bounded raster PSD reader
        run: python -m pip install --disable-pip-version-check --quiet Pillow==12.3.0
      - name: Generate only verified CC0 painted components
        if: contains(github.event.head_commit.message, '[breach-art-import]')
        run: python tools/breach-watch/import_cc0_donor.py
      - name: Generate only exact SHA and CC0 verified real resource icons
        if: contains(github.event.head_commit.message, '[vigilia-import-resources]')
        run: python tools/breach-watch/import_resource_icons.py
      - name: Extract five independently selectable medallions from the approved user concept
        if: contains(github.event.head_commit.message, '[vigilia-owner-reference]')
        run: python tools/breach-watch/import_reference_medallions.py
      - name: Extract owner-selected empty carved contextual art as a native nine-slice
        if: contains(github.event.head_commit.message, '[vigilia-context-frame]')
        run: python tools/breach-watch/import_reference_context.py
      - name: Create refined independent sculpted medallions from approved reference
        if: contains(github.event.head_commit.message, '[vigilia-premium-art]')
        run: python tools/breach-watch/polish_owner_medallions.py
      - name: Author original dark basalt, burgundy metal and gilded portrait surfaces
        if: contains(github.event.head_commit.message, '[vigilia-premium-surfaces]')
        run: python tools/breach-watch/author_premium_surfaces.py
      - name: Build transparent nine-slice from exact owner-approved gold border
        if: contains(github.event.head_commit.message, '[vigilia-owner-gold-border]')
        run: python tools/breach-watch/author_owner_approved_gold_border.py
      - name: Isolate three owner-approved original gold utility medallions
        if: contains(github.event.head_commit.message, '[vigilia-owner-utilities]')
        run: python tools/breach-watch/import_owner_utilities.py
      - name: Import separately extracted owner reference profile, resources and CTA as dynamic UI assets
        if: contains(github.event.head_commit.message, '[vigilia-owner-controls]')
        run: python tools/breach-watch/import_owner_controls.py
      - name: Import singular authentic owner-reference circular close X
        if: contains(github.event.head_commit.message, '[vigilia-owner-close]')
        run: python tools/breach-watch/import_owner_close.py
      - name: Extract one authentic orange crack and bronze lines from owner reference
        if: contains(github.event.head_commit.message, '[vigilia-owner-rift]')
        run: python tools/breach-watch/import_owner_rift.py
      - name: Paint source-faithful single dark material from approved empty panel
        if: contains(github.event.head_commit.message, '[vigilia-premium-surfaces]')
        run: python tools/breach-watch/author_material_from_owner_reference.py
      - name: Protect canonical workstream ownership and source HEAD before push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/contents/pipeline/active-workstreams.json?ref=main'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          import base64
          with urllib.request.urlopen(request,timeout=20) as response:
              raw=json.load(response)
          encoded=raw.get('content')
          if raw.get('encoding')!='base64' or not encoded:
              blob_sha=raw.get('sha','')
              if len(blob_sha)!=40 or any(c not in '0123456789abcdef' for c in blob_sha):
                  raise SystemExit('Large registry identity invalid; refuse artwork write')
              blob_url='https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/git/blobs/'+blob_sha
              blob_request=urllib.request.Request(blob_url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(blob_request,timeout=30) as response:
                  blob=json.load(response)
              if blob.get('sha')!=blob_sha or blob.get('encoding')!='base64' or not blob.get('content'):
                  raise SystemExit('Large registry immutable blob mismatch')
              encoded=blob['content']
          reg=json.loads(base64.b64decode(encoded))
          item=next((x for x in reg['active'] if x.get('id')=='eldoria-forja-oscura-visual-proof-20261107'),None)
          assert item and isinstance(item.get('owner'),str) and item['owner'] and item['ownership_state']=='claimed'
          assert any('BreachWatch/**' in x for x in item.get('scope',[]))
          print('BREACHWATCH_ART_CLAIM_PASS',item['ownership_revision'])
          PY
          remote=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "BREACHWATCH_ART_IMPORT_HEAD_CHANGED: refusing stale push"
            exit 1
          fi
      - name: Commit standalone licence-checked artwork only to the existing PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Eldoria Artwork CI"
          git config user.email "artwork-ci@users.noreply.github.com"
          git add Unity/Assets/Eldoria/BreachWatch/Resources Unity/Assets/Eldoria/BreachWatch/Resources.meta
          if git diff --cached --quiet; then
            echo "BREACHWATCH_ART_ALREADY_AT_EXACT_SOURCE"
          else
            git commit -m 'art(breach-watch): integrate licence-pinned original independent UI illustrations'
            git push origin HEAD:"$GITHUB_REF"
          fi
      - name: Preserve independent original art asset candidate for inspection
        uses: actions/upload-artifact@v4
        with:
          name: breachwatch-art-sprites-${{ github.run_id }}
          path: |
            Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/**
          retention-days: 30
          if-no-files-found: error
  discover-cc0-donor:
    # Original source audited and pinned; do not download the 8MB pack on every proof.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[breach-donor-review]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download and inventory isolated CC0 dark fantasy panel candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,urllib.request,zipfile
          u='https://annomotion.studio/public/packs/dark-fantasy-ui-hud-kit/download'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'breachwatch-cc0-donor'
          out.mkdir(exist_ok=True)
          req=urllib.request.Request(u,headers={'User-Agent':'Eldoria-art-research/1.0'})
          with urllib.request.urlopen(req,timeout=40) as response:
              assert response.headers.get('Content-Type','').split(';')[0] in ('application/zip','application/octet-stream')
              data=response.read(20*1024*1024+1)
          assert 10000<len(data)<20*1024*1024, 'Donor download size invalid'
          (out/'source.zip').write_bytes(data)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              entries=z.infolist()
              assert 1<=len(entries)<=600
              assert sum(i.file_size for i in entries)<180*1024*1024
              for i in entries:
                  n=pathlib.PurePosixPath(i.filename.replace('\\','/'))
                  assert not n.is_absolute() and '..' not in n.parts, 'unsafe archive name'
              listing=[{'path':i.filename,'bytes':i.file_size} for i in entries]
          manifest={'source_url':u,'source_license_claim':'CC0 1.0 on publisher page; verify license inside archive before promotion',
             'source_sha256':hashlib.sha256(data).hexdigest(),'entries':listing,
             'not_used_in_game':True,'art_approved':False}
          (out/'inventory.json').write_text(json.dumps(manifest,indent=2))
          print('BREACHWATCH_CC0_ART_RESEARCH_ONLY '+manifest['source_sha256']+' entries='+str(len(listing)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: breachwatch-cc0-donor-research-${{ github.run_id }}
          path: ${{ runner.temp }}/breachwatch-cc0-donor/**
          if-no-files-found: error
          retention-days: 7
  approved-art-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Eldoria/BreachWatch/**
            /tools/breach-watch/source/**
          persist-credentials: false
      - name: Check all four independent CC0 sprites, hashes and unique Unity GUIDs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          folder=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt')
          manifest=json.loads((folder/'source-manifest.json').read_text())
          assert manifest['license']=='CC0 1.0 in archive'
          assert manifest['archive_sha256']=='f089903c2a515c1737344772c538e2bc2d8a153e219096d9118f74db5bf47d76'
          assert 'CC0 1.0' in (folder/'LICENSE_CC0_SOURCE.txt').read_text()
          assert len(manifest['sprites'])==4
          assert folder.parent.with_suffix('.meta').exists()
          assert folder.with_suffix('.meta').exists()
          guids=[]
          for art in manifest['sprites']:
              name=art['name']
              png=folder/(name+'.png')
              raw=png.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==art['sha256'],name
              assert raw[:8]==bytes([137,80,78,71,13,10,26,10]) and raw[25]==6,name
              assert struct.unpack('>II',raw[16:24])==tuple(art['size']),name
              meta=(folder/(name+'.png.meta')).read_text()
              assert 'textureType: 8' in meta and 'spriteMode: 1' in meta,name
              guid=[line[6:] for line in meta.splitlines() if line.startswith('guid: ')]
              assert len(guid)==1 and len(guid[0])==32 and guid[0] not in guids,name
              guids.extend(guid)
          resourceFolder=folder/'ResourceIcons'
          resources=json.loads((resourceFolder/'manifest.json').read_text())
          assert resources['license']=='CC0 1.0'
          assert resources['source_sha256']=='20f324feb652b2a5959c634a95c694512d21193d346d2204bddd0e0d350bbe75'
          assert 'CC0 1.0' in (resourceFolder/'LICENSE_CC0_RESOURCE_SOURCE.txt').read_text()
          assert (folder/'ResourceIcons.meta').is_file()
          assert sorted(r['name'] for r in resources['sources'])==['food','stone','wood']
          for item in resources['sources']:
              name=item['name']
              png=resourceFolder/(name+'.png')
              raw=png.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==item['sha256'],name
              assert raw[:8]==bytes([137,80,78,71,13,10,26,10]) and raw[25]==6,name
              assert struct.unpack('>II',raw[16:24])==(256,256),name
              meta=(resourceFolder/(name+'.png.meta')).read_text()
              assert 'textureType: 8' in meta and 'spriteMode: 1' in meta,name
              guid=[line[6:] for line in meta.splitlines() if line.startswith('guid: ')]
              assert guid==[item['guid']] and guid[0] not in guids,name
              guids.extend(guid)
          print('BREACHWATCH_CC0_SOURCE_HASH_METADATA_PASS '+str(len(guids))+' ORIGINAL UI SPRITES')
          PY
      - name: Verify five distinct new medallions are actual captures from approved concept
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,struct,pathlib
          folder=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/OwnerReference')
          m=json.loads((folder/'source-manifest.json').read_text())
          assert m['sha256']=='dff461d5e4c7d3de7ec6ccb641f7e372aee4f324310ca0b25ea630dfcb157437'
          assert not m['art_approved'] and len(m['sprites'])==5
          assert sorted(v['name'] for v in m['sprites'])==['castle','helm','provisions','raven','swords']
          assert (folder.parent/'OwnerReference.meta').exists()
          seen=set()
          for art in m['sprites']:
              name=art['name']
              p=folder/(name+'.png')
              raw=p.read_bytes()
              assert raw[:8]==bytes([137,80,78,71,13,10,26,10]) and raw[25]==6,name
              assert struct.unpack('>II',raw[16:24])==(160,160)
              assert hashlib.sha256(raw).hexdigest()==art['sha256'],name
              meta=(folder/(name+'.png.meta')).read_text()
              assert 'textureType: 8' in meta and 'spriteMode: 1' in meta
              assert 'guid: '+art['guid'] in meta and art['guid'] not in seen
              seen.add(art['guid'])
          # Each child of the new Canvas is independently rendered; no
          # screenshot of a fake building, player name or prices is baked into
          # the reference panel.
          panel=m['context_frame']
          assert panel['source_sha256']=='7a0d2377c969d75677e9493a776a9615f984eb72590f6a9d33d18fdca5120d49'
          assert panel['name']=='carved_context'
          assert panel['not_native_screenshot'] and panel['dimensions']==[256,398]
          p=folder/'carved_context.png'
          raw=p.read_bytes()
          assert raw[:8]==bytes([137,80,78,71,13,10,26,10])
          assert struct.unpack('>II',raw[16:24])==(256,398)
          assert hashlib.sha256(raw).hexdigest()==panel['sha256']
          meta=(folder/'carved_context.png.meta').read_text()
          assert 'guid: '+panel['guid'] in meta
          assert 'spriteBorder: {x: 39, y: 34, z: 34, w: 57}' in meta
          print('BREACHWATCH_OWNER_APPROVED_REFERENCE_SPRITES_AND_FRAME_PASS')
          PY
      - name: Certify owner's separately extracted golden-lion identity crest
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          root=Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/OwnerReference')
          p=root/'lion_crest.png'
          provenance=json.loads((root/'lion_crest-provenance.json').read_text())
          raw=p.read_bytes()
          assert provenance['sourceType']=='User-provided original image'
          assert provenance['usage'].startswith('Only the small independent player crest')
          assert provenance['currentArtApproval']=='pending native Unity visual evaluation'
          assert raw[:8]==bytes([137,80,78,71,13,10,26,10])
          assert struct.unpack('>II',raw[16:24])==(56,56)
          assert hashlib.sha256(raw).hexdigest()==provenance['sha256']
          meta=(root/'lion_crest.png.meta').read_text()
          assert 'guid: '+provenance['unity_guid'] in meta
          assert 'textureType: 8' in meta and 'spriteMode: 1' in meta
          src=Path('Unity/Assets/Eldoria/BreachWatch/Runtime/BreachWatchHud.cs').read_text()
          assert 'VigiliaArt/OwnerReference/lion_crest' not in src
          assert 'VigiliaArt/CleanRoom/profile' in src
          print('BREACHWATCH_OWNER_APPROVED_SMALL_LION_CRESTRUN_IMAGE_PASS')
          PY
      - name: Verify authentic owner orange/gold Breach source and absence of generic X glyph
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,struct,base64
          root=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/OwnerControls')
          proof=json.loads((root/'breach_signal_provenance.json').read_text())
          source=pathlib.Path('tools/breach-watch/source/owner-rift-separator.webp.b64')
          assert hashlib.sha256(base64.b64decode(source.read_text().strip(),validate=True)).hexdigest()==proof['source_sha256']
          assert proof['size']==[198,50] and proof['source_is_not_gameplay']
          p=root/'breach_signal.png'
          data=p.read_bytes()
          assert data[:8]==bytes([137,80,78,71,13,10,26,10])
          assert struct.unpack('>II',data[16:24])==(198,50)
          assert hashlib.sha256(data).hexdigest()==proof['png_sha256']
          meta=(root/'breach_signal.png.meta').read_text()
          assert 'guid: '+proof['guid'] in meta and 'spriteMode: 1' in meta
          hud=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Runtime/BreachWatchHud.cs').read_text()
          assert 'VigiliaArt/OwnerControls/breach_signal' in hud
          assert 'BreachWatchRiftSeparator' not in hud
          assert not pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Runtime/BreachWatchRiftSeparator.cs').exists()
          print('VIGILIA_SINGLE_AUTHENTIC_OWNER_RIFT_PASS')
          PY
      - name: Verify exactly one owner-derived gold X and no extra close decorations
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,struct
          root=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/OwnerControls')
          original=pathlib.Path('tools/breach-watch/source/owner-close-button.webp.b64')
          proof=json.loads((root/'close_medallion_provenance.json').read_text())
          import base64
          data=base64.b64decode(original.read_text().strip(),validate=True)
          assert hashlib.sha256(data).hexdigest()==proof['source_sha256']
          assert proof['size']==[64,64] and proof['transparent_hit_region_required']
          dest=root/'close_medallion.png'
          raw=dest.read_bytes()
          assert raw[:8]==bytes([137,80,78,71,13,10,26,10])
          assert struct.unpack('>II',raw[16:24])==(64,64)
          assert hashlib.sha256(raw).hexdigest()==proof['png_sha256']
          meta=(root/'close_medallion.png.meta').read_text()
          assert 'guid: '+proof['guid'] in meta and 'spriteMode: 1' in meta
          src=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Runtime/BreachWatchHud.cs').read_text()
          assert 'VigiliaArt/OwnerControls/close_medallion' in src
          assert 'BuildButton(panel,"Close selected building"' not in src
          print('VIGILIA_SINGLE_ORIGINAL_ROUND_CLOSE_PASS')
          PY
      - name: Certify three text-free owner-source premium controls and live data ownership
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,struct,pathlib
          folder=pathlib.Path('Unity/Assets/Eldoria/BreachWatch/Resources/VigiliaArt/OwnerControls')
          meta=(folder.parent/'OwnerControls.meta')
          assert meta.is_file()
          data=json.loads((folder/'manifest.json').read_text())
          assert data['art_approved'] is False
          assert len(data['controls'])==3
          expected={'profile_bar','resource_capsule','upgrade_button'}
