name: "[EXPERIMENT] Asset Library Reprocessing Pass v1"

on:
  push:
    branches: [visual-proof/asset-library-reprocessing-pass-v1]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Presentation/AssetLibraryReprocessingPassV1.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/AssetLibraryReprocessingPassV1Gate.cs'
      - 'pipeline/art-production-request.json'
      - 'Unity/Assets/Eldoria/Resources/Valoria/HeroBastionGenerated/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eldoria-asset-library-reprocessing-v1-dedicated
  cancel-in-progress: true

jobs:
  capture:
    env:
      GITHUB_TOKEN: ${{ github.token }}
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Verify persisted Hero Bastion or recover certified fallback
        shell: powershell
        run: |
          $expected='afb6cee6ae572b0879650f18285b32798e263c17359a158ffe2bdd03fb62ad5c'
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\HeroBastionGenerated"
          $copied=Join-Path $dest 'Valoria_HeroBastion_v1.glb'
          if(Test-Path $copied){
            $actual=(Get-FileHash $copied -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -ne $expected){throw "Persisted Hero Bastion SHA mismatch: $actual"}
            Write-Host "PERSISTED_HERO_BASTION_PASS sha256=$actual bytes=$((Get-Item $copied).Length)"
          } else {
            $artifactId=11143009723
            $root="$env:RUNNER_TEMP\asset-library-hero-bastion-source"
            $zip="$root.zip"
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -Headers $headers -OutFile $zip -MaximumRedirection 10
            New-Item -ItemType Directory -Force $root | Out-Null
            Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
            $matches=@()
            foreach($file in Get-ChildItem $root -Recurse -File -Filter '*.glb'){
              $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if($sha -eq $expected){$matches += $file}
            }
            if($matches.Count -ne 1){throw "Expected exactly one certified Hero Bastion GLB; found $($matches.Count)"}
            New-Item -ItemType Directory -Force $dest | Out-Null
            Copy-Item $matches[0].FullName $copied -Force
            if((Get-FileHash $copied -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'Hero Bastion staged SHA mismatch'}
            Write-Host "CERTIFIED_HERO_BASTION_FALLBACK_RECOVERED sha256=$expected bytes=$((Get-Item $copied).Length)"
          }
      - name: Verify Unity
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }
      - name: Capture real Valoria asset-library reprocessing proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\AssetLibraryReprocessingCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-AssetLibraryReprocessingV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.AssetLibraryReprocessingPassV1Gate.Capture','-logFile',$log)
          $process=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(15)
          while(-not $process.HasExited -and (Get-Date) -lt $deadline){ Start-Sleep -Seconds 2; $process.Refresh() }
          if(-not $process.HasExited){ & taskkill.exe /PID $process.Id /T /F | Out-Null; if(Test-Path $log){Get-Content $log -Tail 220}; throw 'Asset reprocessing capture timed out.' }
          $process.Refresh()
          if($process.ExitCode -ne 0){ if(Test-Path $log){Get-Content $log -Tail 260}; throw "Asset reprocessing gate failed: $($process.ExitCode)" }
          $expected=@(
            'before-19.png','before-12.png','before-9.png','before-mobile-390x844.png',
            'after-19.png','after-12.png','after-9.png','after-mobile-390x844.png','evidence.json'
          )
          foreach($name in $expected){
            $p=Join-Path $folder $name
            if(-not (Test-Path $p)){ throw "Missing asset reprocessing evidence: $name" }
            if($name.EndsWith('.png') -and (Get-Item $p).Length -lt 10000){ throw "Empty capture: $name" }
          }
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-library-reprocessing-v1-${{ github.run_id }}
          path: |
            Unity/AssetLibraryReprocessingCaptures/*
            ${{ runner.temp }}/Eldoria-AssetLibraryReprocessingV1.log
          if-no-files-found: warn
          retention-days: 30
