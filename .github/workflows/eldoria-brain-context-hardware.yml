name: Eldoria Qwen14B real context and hardware diagnostic
on:
  push:
    branches: [diagnostic/valoria-ai-eyes-brain-20261015]
    paths:
      - '.github/workflows/eldoria-brain-context-hardware.yml'
      - 'tools/art-direction/director-control/context_hardware_probe.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-exclusive-native-windows-free-text-director
  cancel-in-progress: false
jobs:
  context-hardware:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    steps:
      - name: Locate installed Git from GitHub Desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\\app\\git\\cmd\\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'PREINSTALLED_GITHUB_DESKTOP_GIT_NOT_FOUND'}
            $folder=Split-Path $git
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
          git --version
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/director-control
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: valoria-spatial-grounded-art-director-4b-8b
          run-id: 38701710879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-spatial
      - uses: actions/download-artifact@v4
        with:
          name: valoria-eyes-brain-4b-8b-original-unchanged
          run-id: 38699407600
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-vision
      - name: Read-only real 4K vs 12K inference with resource evidence
        shell: powershell
        timeout-minutes: 58
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-context-hardware'
          New-Item -Path $out -ItemType Directory -Force | Out-Null
          $s=Join-Path $env:RUNNER_TEMP 'eldoria-spatial'
          $v=Join-Path $env:RUNNER_TEMP 'eldoria-vision'
          $geo=Join-Path $s 'spatial-grounding.json'
          $vision=Join-Path $v 'diagnosis-8b.json'
          $director=Join-Path $s 'grounded-director-8b.json'
          foreach($file in @($geo,$vision,$director)){if(-not (Test-Path $file)){throw "MISSING_AUTHENTIC_CONTEXT: $file"}}
          python -m py_compile tools/art-direction/director-control/context_hardware_probe.py
          if($LASTEXITCODE -ne 0){throw 'CONTEXT_PROBE_SOURCE_INVALID'}
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          if(-not (Test-Path $exe)){
            $exe=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {Join-Path $_.FullName 'AppData/Local/Programs/Ollama/ollama.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $exe){throw 'INSTALLED_OLLAMA_NOT_FOUND'}
          $models=Join-Path $env:USERPROFILE '.ollama/models'
          if(-not (Test-Path $models)){
            $models=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue | ForEach-Object {Join-Path $_.FullName '.ollama/models'} | Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if($models){$env:OLLAMA_MODELS=$models}
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $env:OLLAMA_NUM_PARALLEL='1'
          $env:OLLAMA_MAX_LOADED_MODELS='1'
          $server=$null
          try{
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process -FilePath $exe -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'ollama-stdout.log') -RedirectStandardError (Join-Path $out 'ollama-stderr.log')
              for($i=0;$i -lt 40;$i++){try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}}
            }
            if(-not $ready){throw 'LOCAL_OLLAMA_NOT_RESPONDING'}
            $tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 20
            if('qwen3:14b' -notin @($tags.models | ForEach-Object {$_.name})){throw 'QWEN14B_NOT_INSTALLED_NO_DOWNLOAD'}
            $cs=Get-CimInstance Win32_ComputerSystem
            $gpuBefore=$null
            try{$gpuBefore=(& nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv,noheader,nounits 2>$null | Select-Object -First 1)}catch{}
            @{physical_ram_bytes=$cs.TotalPhysicalMemory;gpu_before=$gpuBefore;observed_utc=(Get-Date).ToUniversalTime().ToString('o')} |
              ConvertTo-Json -Depth 5 | Out-File (Join-Path $out 'hardware-before.json') -Encoding utf8
            python tools/art-direction/director-control/context_hardware_probe.py --grounding $geo --vision $vision --director $director --out (Join-Path $out 'context-probe.json') --model qwen3:14b
            if($LASTEXITCODE -ne 0){throw 'CONTEXT_PROBE_INFERENCE_FAILED'}
            try{Invoke-RestMethod 'http://127.0.0.1:11434/api/ps' -TimeoutSec 15 | ConvertTo-Json -Depth 10 | Out-File (Join-Path $out 'ollama-loaded-models.json') -Encoding utf8}catch{}
            try{(& nvidia-smi --query-gpu=name,memory.total,memory.used,memory.free --format=csv,noheader,nounits 2>$null) | Out-File (Join-Path $out 'gpu-after.csv') -Encoding utf8}catch{}
          } finally{
            if($server){try{Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}catch{}}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-qwen14b-authentic-context-hardware
          path: ${{ runner.temp }}/eldoria-context-hardware/
          if-no-files-found: warn
          retention-days: 30
