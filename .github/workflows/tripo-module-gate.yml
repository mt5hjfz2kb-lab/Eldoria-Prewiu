name: "[LEGACY] Tripo 50K small-module gate"

on:
  workflow_dispatch:

concurrency:
  group: eldoria-tripo-module-50k
  cancel-in-progress: true

jobs:
  tripo-module-gate:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
      - name: Stage exact owner-supplied 50K module
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $target = "$env:GITHUB_WORKSPACE/Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/Eldoria_Module_TowerWallRock_50K.glb"
          $expected = '18785f7ba607cef1e7dcee45684d65c3166dc47b0f73b4bc4fb3d295c6f53a6a'
          $candidate = Join-Path (Join-Path $env:USERPROFILE 'Downloads') 'Eldoria_Module_TowerWallRock_50K.glb'
          if (-not (Test-Path $candidate)) { throw "Exact 50K module not found in runner Downloads: $candidate" }
          $actual = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "50K module SHA mismatch: $actual" }
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          Copy-Item $candidate $target -Force
          Write-Host "Verified exact 50K module staged: $actual"
      - name: Verify Unity 6.3.23f1
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }
      - name: Execute isolated 50K module gate
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $folder = "$env:GITHUB_WORKSPACE/Unity/TripoModuleReviewCaptures"
          $log = "$env:RUNNER_TEMP/Eldoria-TripoModule50K.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $args = @("-batchmode","-quit","-projectPath","$env:GITHUB_WORKSPACE/Unity","-executeMethod","Eldoria.EditorTools.TripoModuleReview.Capture","-logFile",$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(420000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw 'Tripo 50K module gate timed out.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 220 }
            throw "Tripo 50K module gate failed: $($process.ExitCode)"
          }
          foreach ($name in @('strategic.png','city.png','detail.png','oblique.png','metrics.json')) {
            $file = Join-Path $folder $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 100) { throw "Missing gate evidence: $name" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-tripo-module-50k-${{ github.sha }}
          path: |
            Unity/TripoModuleReviewCaptures/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/TripoModuleReview.unity
            ${{ runner.temp }}/Eldoria-TripoModule50K.log
          if-no-files-found: warn
