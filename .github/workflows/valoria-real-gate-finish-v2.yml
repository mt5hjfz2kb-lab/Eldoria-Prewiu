name: "[ART GATE FINISH] Forged handles and warm aged-oak CC0 single door"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-real-gate-finish-v2.yml'
      - 'tools/valoria-modular-fortress/finish_real_castle_door_v2.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-gate-single-professional-art-finish
  cancel-in-progress: false
jobs:
  finish-actual-independent-oak-gate:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 60
    steps:
      - name: Use installed Git + Blender only
        shell: powershell
        id: bins
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing Git'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Installed Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-one-authentic-gate-38858438155
          run-id: 38858438155
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/real-oak-gate-source
      - name: Finish exactly one hinge-linked double wooden gate in native Blender
        shell: powershell
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'real-oak-gate-source\eldoria-cc0-real-gate-ab\glb\reinforced_oak_gate.glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-single-oak-gate-v2'
          if(-not(Test-Path $source)){throw "One genuine Poly Haven source missing: $source"}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/finish_real_castle_door_v2.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned gate artist script missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-real-gate-finish-v2.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-real-gate-finish-v2.stdout'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-real-gate-finish-v2.stderr'
          $proc=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$source,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Gate finishing Blender error $($proc.ExitCode)"}
          foreach($x in @('glb\reinforced_oak_gate.glb','before\reinforced_oak_gate.png','after\reinforced_oak_gate.png','after\reinforced_oak_gate_rear.png','reports\finished_gate_v2.json')){
            if(-not(Test-Path (Join-Path $out $x))){throw "Missing result: $x"}
          }
      - name: Archive independent finished gate and reference images, no Unity changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-single-gate-art-finish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-single-oak-gate-v2/**
            ${{ runner.temp }}/eldoria-real-gate-finish-v2.stdout
            ${{ runner.temp }}/eldoria-real-gate-finish-v2.stderr
          if-no-files-found: warn
          retention-days: 30
