name: Studio academy - source study and practical Blender lab
on:
  push:
    branches: [research/bastion-i-25d-studio-200]
    paths: ['.github/workflows/studio-art-academy.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: issue200-art-academy
  cancel-in-progress: false
jobs:
  train:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Execute studio academy source study and real practical exercises'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify learning baseline and install isolated practice environment
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/46129541166" --jq .conclusion)" = success
          test "$(gh api "repos/$REPO/actions/artifacts/15257152793" --jq .digest)" = sha256:cc8b1a3c0eb3a6180bcc3b633106b11c55931beaebcdd23bf29cecfba38b7407
          mkdir -p "$RUNNER_TEMP/studio" "$RUNNER_TEMP/academy-results"
          cd "$RUNNER_TEMP/studio"
          for f in studio.py economics.py rates-20261125.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/openai-development-studio/$f?ref=9fbdb203269b951a252de58d7a0357d71a841480" > "$f"
          done
          for f in curriculum.json study.py render_lab.py; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/studio-v3/art-learning/academy/$f?ref=98b8d1ba4fbab6d10bff06deb5cd49a80e30ed46" > "$f"
          done
          python3 -m pip install --quiet pillow beautifulsoup4
          python3 -m py_compile study.py render_lab.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender > "$RUNNER_TEMP/academy-results/blender-install.log" 2>&1
          blender --version | head -4
      - uses: actions/download-artifact@v4
        with:
          name: issue200-art-protected-local-repair
          run-id: 46129541166
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Read sources, tutor, pre-study and post-study production assignments
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 -c 'import json,os; from pathlib import Path; from decimal import Decimal; assert Decimal(json.loads((Path(os.environ["RUNNER_TEMP"])/"prior/summary.json").read_text())["estimated_total_usd"]) == Decimal("1.7987913")'
          cd "$RUNNER_TEMP/studio"
          python3 -u study.py study
      - name: Actual isolated CPU Blender renders from student decisions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          blender -b -t 4 --python-exit-code 1 --python render_lab.py -- "$RUNNER_TEMP/academy-results" > "$RUNNER_TEMP/academy-results/blender-render.log" 2>&1 || { tail -100 "$RUNNER_TEMP/academy-results/blender-render.log"; exit 1; }
          grep 'ACADEMY_BLENDER_' "$RUNNER_TEMP/academy-results/blender-render.log"
      - name: Independent blinded practical evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          python3 -u study.py judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-studio-academy-results
          path: ${{ runner.temp }}/academy-results
          if-no-files-found: warn
          retention-days: 30
