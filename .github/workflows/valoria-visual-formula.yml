name: Valoria Visual Formula gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaVisualFormulaGate.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/VisualWorld.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs'
      - 'Unity/Assets/Eldoria/Resources/WorldInventory/**'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaKit.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaGroundKit.cs'
      - 'Unity/Assets/Eldoria/Resources/Valoria/**'
      - 'docs/VALORIA_VISUAL_FORMULA_v1.md'

permissions:
  contents: read

concurrency:
  group: eldoria-valoria-visual-formula
  cancel-in-progress: true

jobs:
  formula-gate:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify Unity
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }

      - name: Stage CC0 Poly Haven Surface Cell PBR
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\SurfaceCellExternal"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $headers=@{'User-Agent'='Eldoria-SurfaceCell/1.0'}
          function Get-Urls($node) {
            if ($null -eq $node) { return }
            if ($node -is [string]) { if ($node.StartsWith('https://')) { $node }; return }
            if ($node -is [System.Collections.IDictionary]) { foreach($v in $node.Values) { Get-Urls $v }; return }
            if ($node.PSObject -and $node.PSObject.Properties) { foreach($p in $node.PSObject.Properties) { Get-Urls $p.Value } }
          }
          $assets=@(
            [pscustomobject]@{Id='stone_block_wall';Prefix='stone'},
            [pscustomobject]@{Id='cobblestone_floor_001';Prefix='cobble'},
            [pscustomobject]@{Id='dirt';Prefix='dirt'}
          )
          foreach($asset in $assets) {
            $files=Invoke-RestMethod -Headers $headers -Uri ('https://api.polyhaven.com/files/'+$asset.Id)
            $urls=@(Get-Urls $files | Select-Object -Unique)
            $specs=@(
              [pscustomobject]@{Key='diff';Pattern='_diff_1k\.(jpg|png)        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\VisualFormulaCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-VisualFormula.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaVisualFormulaGate.Capture','-logFile',$log)
          $process=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(15)
          while(-not $process.HasExited -and (Get-Date) -lt $deadline){
            Start-Sleep -Seconds 2
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if(Test-Path $log){Get-Content $log -Tail 220}
            throw 'Visual Formula capture timed out after 15 minutes.'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { if(Test-Path $log){Get-Content $log -Tail 220}; throw "Visual Formula gate failed: $($process.ExitCode)" }
          $expected=@(
            'valoria-before-19.png','valoria-before-12.png','valoria-before-9.png','valoria-before-mobile.png','valoria-west-before-12.png','valoria-west-before-mobile.png','valoria-after-19.png','valoria-after-12.png','valoria-after-9.png','valoria-after-mobile.png','valoria-west-after-12.png','valoria-west-after-mobile.png','valoria-wedge-evidence.json','valoria-wedge-metrics.json',
            'terrain-citywide-overview-before-19.png','terrain-citywide-overview-before-12.png','terrain-citywide-overview-before-9.png','terrain-citywide-west-before-12.png','terrain-citywide-west-before-9.png','terrain-citywide-east-before-12.png','terrain-citywide-upper-before-12.png','terrain-citywide-mobile-before.png',
