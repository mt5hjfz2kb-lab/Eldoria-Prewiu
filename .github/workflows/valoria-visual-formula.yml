            $p=Join-Path $folder $name
            if(-not (Test-Path $p)){ throw "Missing Visual Formula evidence: $name" }
            if($name.EndsWith('.png') -and (Get-Item $p).Length -lt 10000){ throw "Empty Visual Formula capture: $name" }
