name: Valoria Visual Formula gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-visual-formula.yml'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaVisualFormulaGate.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/VisualWorld.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaWorldFrameMountainTerrainV1.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs'
      - 'Unity/Assets/Eldoria/Resources/WorldInventory/**'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaKit.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaGroundKit.cs'
      - 'Unity/Assets/Eldoria/Resources/Valoria/**'
      - 'docs/VALORIA_VISUAL_FORMULA_v1.md'

permissions:
  contents: read

concurrency:
  group: eldoria-valoria-visual-formula
  cancel-in-progress: true

jobs:
  formula-gate:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify Unity
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }

      - name: Stage Kenney Castle Kit CC0
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\CoherentKitProof"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $base='https://raw.githubusercontent.com/Hidencod/tge-assets/main/packs/castle-kit'
          $files=@(
            'gate.glb',
            'wall.glb',
            'tower-square.glb',
            'tower-square-top-roof-high-windows.glb',
            'ground-hills.glb',
            'rocks-large.glb'
          )
          foreach($name in $files) {
            $out=Join-Path $dest $name
            Invoke-WebRequest -Headers @{'User-Agent'='Eldoria-VisualFormula/1.0'} -Uri ($base+'/'+$name) -OutFile $out
            if ((Get-Item $out).Length -lt 8000) { throw "Downloaded Castle Kit model too small: $name" }
          }
          Set-Content -Path (Join-Path $dest 'SOURCE.txt') -Value 'Kenney Castle Kit via Hidencod/tge-assets mirror. CC0-1.0. Gate-only visual proof staging.' -Encoding UTF8

      - name: Locate Blender
        id: blender
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $candidate = (Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if (-not $candidate) {
            $roots = @(
              'C:\Program Files\Blender Foundation',
              "$env:LOCALAPPDATA\Programs\Blender Foundation",
              "$env:LOCALAPPDATA\Microsoft\WindowsApps"
            )
            foreach ($root in $roots) {
              if ($candidate) { break }
              if (Test-Path $root) {
                $candidate = Get-ChildItem $root -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if (-not $candidate -or -not (Test-Path $candidate)) { throw 'Blender executable not found on Unity runner.' }
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2

      - name: Reproject Castle Kit UVs for tileable PBR
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\CoherentKitProof"
          $log="$env:RUNNER_TEMP\Eldoria-CoherentCastle-UV.log"
          $err="$env:RUNNER_TEMP\Eldoria-CoherentCastle-UV-error.log"
          $args=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\castle_kit_uv_rewrap.py",'--','--input-dir',$dest)
          $p=Start-Process -FilePath "${{ steps.blender.outputs.path }}" -ArgumentList $args -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          if ($p.ExitCode -ne 0) {
            if(Test-Path $log){Get-Content $log -Tail 200}
            if(Test-Path $err){Get-Content $err -Tail 200}
            throw "Castle Kit UV rewrap failed: $($p.ExitCode)"
          }
          Get-Content $log -Tail 80

      - name: Stage existing Slavic World prefabs
        shell: powershell
        run: |
          $root="$env:GITHUB_WORKSPACE\Unity\Assets\EmaceArt\Slavic World Free\Prefabs"
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\SlavicCoherentProof"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $items=@(
            @{src='Town\Building\EA03_Town_House_Comp_01a_PRE.prefab'; dst='house-a.prefab'},
            @{src='Town\Building\EA03_Town_House_Comp_02a_PRE.prefab'; dst='house-b.prefab'},
            @{src='Town\Administrative\EA03_Town_Building_Administrative _01a_PRE.prefab'; dst='administrative.prefab'},
            @{src='Village\Building\Shed\EA03_Village_OutBuilding_Shed_03b_PRE.prefab'; dst='shed.prefab'},
            @{src='Environment\Road\EA03_Environment_Road_Cobble_01a_PRE.prefab'; dst='cobble.prefab'},
            @{src='Environment\Rock\EA03_Environment_Rock_Flat_04c_PRE.prefab'; dst='rock.prefab'},
            @{src='Nature\Tree\EA03_Nature_Tree_02b_PRE.prefab'; dst='tree.prefab'}
          )
          foreach($item in $items) {
            $source=Join-Path $root $item.src
            if(-not (Test-Path $source)){ throw "Missing Slavic source prefab: $source" }
            Copy-Item $source (Join-Path $dest $item.dst) -Force
          }
          Set-Content -Path (Join-Path $dest 'SOURCE.txt') -Value 'Gate-only copies of already imported EmaceArt Slavic World Free prefabs.' -Encoding UTF8

      - name: Stage CC0 Poly Haven Surface Cell PBR
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\SurfaceCellExternal"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $headers=@{'User-Agent'='Eldoria-SurfaceCell/1.0'}
          $assets=@(
            @{ id='stone_block_wall'; prefix='stone' },
            @{ id='cobblestone_floor_001'; prefix='cobble' },
            @{ id='dirt'; prefix='dirt' }
          )
          foreach($asset in $assets){
            $payload=Invoke-RestMethod -Headers $headers -Uri ("https://api.polyhaven.com/files/"+$asset.id)
            $json=$payload | ConvertTo-Json -Depth 50
            $urls=[regex]::Matches($json,'https://[^"]+') | ForEach-Object { $_.Value.Replace('\u0026','&') } | Select-Object -Unique
            $patterns=@(
              @{ key='diff'; rx='_diff_1k\.(jpg|png)(\?|$)' },
              @{ key='normal'; rx='_nor_gl_1k\.(jpg|png)(\?|$)' },
              @{ key='ao'; rx='_ao_1k\.(jpg|png)(\?|$)' }
            )
            foreach($map in $patterns){
              $url=$urls | Where-Object { $_ -match $map.rx } | Select-Object -First 1
              if(-not $url){
                if($map.key -eq 'ao'){ continue }
                throw "Missing Poly Haven $($map.key) 1K map for $($asset.id)"
              }
              $ext=[IO.Path]::GetExtension(([uri]$url).AbsolutePath)
              $out=Join-Path $dest ($asset.prefix+'_'+$map.key+$ext)
              Invoke-WebRequest -Headers $headers -Uri $url -OutFile $out
              if((Get-Item $out).Length -lt 10000){ throw "Downloaded PBR map is unexpectedly small: $out" }
            }
          }
          @'
          Poly Haven Surface Cell proof
          Assets: stone_block_wall, cobblestone_floor_001, dirt
          License: CC0
          Source: https://polyhaven.com
          Retrieved only for automated visual validation; not yet promoted to production.
          '@ | Set-Content (Join-Path $dest 'SOURCE.txt') -Encoding UTF8

      - name: Capture canonical visual formula scene
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\VisualFormulaCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-VisualFormula.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaVisualFormulaGate.Capture','-logFile',$log)
          $process=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(15)
          while(-not $process.HasExited -and (Get-Date) -lt $deadline){
            Start-Sleep -Seconds 2
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if(Test-Path $log){Get-Content $log -Tail 220}
            throw 'Visual Formula capture timed out after 15 minutes.'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { if(Test-Path $log){Get-Content $log -Tail 220}; throw "Visual Formula gate failed: $($process.ExitCode)" }
          $expected=@(
            'valoria-before-19.png','valoria-before-12.png','valoria-before-9.png','valoria-before-mobile.png','valoria-west-before-12.png','valoria-west-before-mobile.png','valoria-after-19.png','valoria-after-12.png','valoria-after-9.png','valoria-after-mobile.png','valoria-west-after-12.png','valoria-west-after-mobile.png','valoria-wedge-evidence.json','valoria-wedge-metrics.json',
            'terrain-citywide-overview-before-19.png','terrain-citywide-overview-before-12.png','terrain-citywide-overview-before-9.png','terrain-citywide-west-before-12.png','terrain-citywide-west-before-9.png','terrain-citywide-east-before-12.png','terrain-citywide-upper-before-12.png','terrain-citywide-mobile-before.png',
            'terrain-citywide-overview-after-19.png','terrain-citywide-overview-after-12.png','terrain-citywide-overview-after-9.png','terrain-citywide-west-after-12.png','terrain-citywide-west-after-9.png','terrain-citywide-east-after-12.png','terrain-citywide-upper-after-12.png','terrain-citywide-mobile-after.png','terrain-citywide-evidence.json',
            'surface-cell-before-19.png','surface-cell-before-12.png','surface-cell-before-9.png','surface-cell-before-mobile.png','surface-cell-focus-before-12.png','surface-cell-focus-before-9.png',
            'surface-cell-after-19.png','surface-cell-after-12.png','surface-cell-after-9.png','surface-cell-after-mobile.png','surface-cell-focus-after-12.png','surface-cell-focus-after-9.png','surface-cell-evidence.json','surface-cell-metrics.json',
            'production-cell-before-19.png','production-cell-before-12.png','production-cell-before-9.png','production-cell-before-mobile.png','production-cell-focus-before-12.png','production-cell-focus-before-9.png',
            'production-cell-after-19.png','production-cell-after-12.png','production-cell-after-9.png','production-cell-after-mobile.png','production-cell-focus-after-12.png','production-cell-focus-after-9.png','production-cell-evidence.json','production-cell-metrics.json',
            'formula-overview-19.png','formula-overview-12.png','formula-overview-mobile.png',
            'formula-sawmill-12.png','formula-sawmill-9.png',
            'formula-barracks-12.png','formula-barracks-9.png',
            'formula-bastion-12.png','formula-bastion-9.png',
            'formula-metrics.json','formula-materials.json'
          )
          foreach($name in $expected){
            $p=Join-Path $folder $name
            if(-not (Test-Path $p)){ throw "Missing Visual Formula evidence: $name" }
            if($name.EndsWith('.png') -and (Get-Item $p).Length -lt 10000){ throw "Empty Visual Formula capture: $name" }
          }
          Get-Content (Join-Path $folder 'formula-metrics.json')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-visual-formula-${{ github.run_id }}
          path: |
            Unity/VisualFormulaCaptures/*
            ${{ runner.temp }}/Eldoria-VisualFormula.log
          if-no-files-found: warn
          retention-days: 14
