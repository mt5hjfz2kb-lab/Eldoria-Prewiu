name: Eldoria Blender MCP true loopback TCP proof
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths: ['.github/workflows/valoria-mcp-tcp-proof.yml','tools/art-rd/blender_mcp_tcp_proof.py']
permissions:
  contents: read
jobs:
  tcp-proof:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          $git = Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop/app-*/resources/app/git/cmd/git.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($git) { Split-Path $git.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Validate real loopback TCP and Blender geometry edit
        shell: powershell
        run: |
          $b="C:\Program Files\Blender Foundation\Blender 5.2\blender.exe"
          & $b -b --python tools/art-rd/blender_mcp_tcp_proof.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\eldoria-mcp-tcp-proof.log"
          if ($LASTEXITCODE -ne 0) { throw "TCP Blender MCP failed" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\eldoria-mcp-tcp-proof.log" -Pattern "ELDORIA_TCP_SCENE_EDIT_PASS" -Quiet)) { throw "Missing TCP evidence" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-blender-tcp-proof
          path: ${{ runner.temp }}/eldoria-mcp-tcp-proof.log
