name: Studio V3 PR198 profile no-spend artifact replay
on:
  push:
    branches: [pilot/eldoria-studio-v3-autonomous-execution-20261126]
    paths: ['.github/workflows/studio-v3-profile-replay-20261127.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-v3-pr198-profile-replay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install browser and selector parser
        run: |
          python3 -m pip install --quiet pillow playwright==1.55.0 tinycss2 cssselect2
          python3 -m playwright install chromium
      - name: Render and verify paid source artifacts with zero additional API calls
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/studio-v3/rankings-premium/profile-replay-20261127.py "$RUNNER_TEMP/profile-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-replay-evidence
          path: ${{ runner.temp }}/profile-replay
          if-no-files-found: warn
          retention-days: 14
      - name: Check game files unchanged
        if: always()
        run: git diff --exit-code
