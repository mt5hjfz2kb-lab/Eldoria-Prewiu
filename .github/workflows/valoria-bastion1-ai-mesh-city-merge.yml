name: Bastion I verified Qwen8B sculpture into latest grass city
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths: ['.github/workflows/valoria-bastion1-ai-mesh-city-merge.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion1-verified-qwen-full-city
  cancel-in-progress: false
jobs:
  merge-verified-qwen-cliff:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/valoria-real-ai-merge
      TARGET: 'Valoria natural playable hilltop and rock scarps'
    steps:
      - uses: actions/checkout@v4
      - name: Recover completed material city, original AI decision and passed frustum evidence
        run: |
          mkdir -p "$ROOT/source" "$ROOT/artist" "$ROOT/frustum" "$ROOT/verified"
          gh run download 38398380999 --repo "${{ github.repository }}" --name bastion1-player-integration-38398380999 --dir "$ROOT/source"
          gh run download 38399110675 --repo "${{ github.repository }}" --name bastion1-genuine-qwen-artist-38399110675 --dir "$ROOT/artist"
          gh run download 38401480696 --repo "${{ github.repository }}" --name bastion1-original-qwen8b-verified-frustum-38401480696 --dir "$ROOT/frustum"
          git fetch --no-tags --depth=1 origin 3deec3b03c3aa23ed6b091fb3a9eddc7518fe745
          for f in artist_plan_validation.py visibility_metrics.py; do
            git show "3deec3b03c3aa23ed6b091fb3a9eddc7518fe745:tools/art-direction/ai-authoring/$f" > "tools/art-direction/ai-authoring/$f"
          done
      - name: Verify original Qwen coordinates and completed source hashes
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,os,shutil
          r=pathlib.Path(os.environ['ROOT']);art=r/'artist'
          plan=json.loads((art/'model/artist-plan.json').read_bytes())
          inf=json.loads((art/'model/artist-inference.json').read_bytes())
          raw=(art/'model/artist-response-raw.txt').read_bytes()
          assert inf['model']=='qwen3-vl:8b-instruct' and inf['system_role']=='system'
          assert inf['direction']['planned_actions']==plan==json.loads(raw)['planned_actions']
          assert inf['attempt_history'][-1]['raw_response_sha256']==hashlib.sha256(raw).hexdigest()
          proof=list((r/'source').rglob('cc0-integration-proof.json'))
          glb=list((r/'source').rglob('Bastion1ReferenceAssembly.glb'))
          assert len(proof)==len(glb)==1
          p=json.loads(proof[0].read_text());assert p['geometry_unchanged']
          assert hashlib.sha256(glb[0].read_bytes()).hexdigest()==p['output_glb_sha256']
          frame=json.loads((r/'frustum/ab/comparison.json').read_text())
          assert frame['player_frustum']['vertical_extent']==52 and frame['player_frustum']['horizontal_extent']==74.88
          assert frame['camera_visibility']['changed_fraction']>=.001
          shutil.copyfile(glb[0],r/'verified/source.glb')
          print('ORIGINAL_QWEN8B_COORDINATES_AND_LATEST_GRASS_SOURCE_VERIFIED')
          PY
      - name: Install free Blender and repair execution target bookkeeping without re-inference
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          SHA=$(sha256sum "$ROOT/artist/terrain-source.blend" | cut -d' ' -f1)
          blender -b --python-exit-code 1 --python tools/art-direction/ai-authoring/execute_artist_plan.py -- \
            --source "$ROOT/artist/terrain-source.blend" --plan "$ROOT/artist/model/artist-plan.json" \
            --out "$ROOT/repaired" --transport direct --expected-source-sha256 "$SHA" --freeze-protected-bastion-cells
          python3 - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['ROOT'])
          old=json.loads((r/'artist/result/artist-execution.json').read_text())
          new=json.loads((r/'repaired/artist-execution.json').read_text())
          assert old['source_mesh_sha256']==new['source_mesh_sha256']
          assert old['plan_sha256']==new['plan_sha256'], 'never alter the model-selected coordinates'
          assert new['executed_actions'][0]['source_plateau_mask_enabled']
          assert new['executed_actions'][0]['model_parameters_modified'] is False
          assert new['executed_actions'][0]['preserved_read_only_vertices']>0
          assert new['executed_actions'][0]['target']==os.environ['TARGET']
          assert 500<new['executed_actions'][0]['changed_vertices']<1758
          print('ORIGINAL_AI_VECTOR_FIELD_WITH_READONLY_PLATEAU_SCOPE_PROOF',new['result_mesh_sha256'])
          PY
      - name: Verify NEW scope-masked sculpture on the exact Unity-equivalent frustum
        run: |
          blender -b --python-exit-code 1 --python tools/art-direction/ai-authoring/render_artist_ab.py -- \
            --before "$ROOT/artist/terrain-source.blend" --after "$ROOT/repaired/artist-output.blend" \
            --target "$TARGET" --player-camera --out "$ROOT/masked-ab"
          python3 - <<'PYVERIFY'
          import os,pathlib,json
          r=pathlib.Path(os.environ['ROOT'])
          m=json.loads((r/'masked-ab/comparison.json').read_text())
          assert m['camera_visibility']['changed_fraction']>=.001
          assert m['player_frustum']['vertical_extent']==52
          print('SCOPE_MASKED_QWEN_GEOMETRY_VISIBLE_NOT_ART_APPROVED',m['camera_visibility'])
          PYVERIFY
      - name: Reconstruct full grass city and verify its terrain matches the original artist input
        run: |
          cat > "$ROOT/import.py" <<'PY'
          import bpy,os,pathlib
          from mathutils import Vector
          r=pathlib.Path(os.environ['ROOT']);target=os.environ['TARGET']
          bpy.ops.wm.open_mainfile(filepath=str(r/'artist/terrain-source.blend'))
          o=bpy.data.objects[target];before=[o.matrix_world@v.co for v in o.data.vertices]
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=str(r/'verified/source.glb'))
          o=bpy.data.objects[target]
          assert len(o.data.vertices)==12601 and len(o.data.polygons)==23296
          assert len(before)==len(o.data.vertices)
          maximum=max((a-o.matrix_world@v.co).length for a,v in zip(before,o.data.vertices))
          assert maximum<.0001,('Latest palette city changed artist source geometry',maximum)
          assert len(bpy.data.objects)>40
          bpy.ops.wm.save_as_mainfile(filepath=str(r/'verified/full-city.blend'))
          print('FULL_CURRENT_GRASS_CITY_MATCHES_AI_SOURCE_GEOMETRY',maximum)
          PY
          blender -b --python-exit-code 1 --python "$ROOT/import.py"
      - name: Merge only genuine model-authored terrain; preserve current materials, roads and parcels
        run: |
          SOURCE_SHA=$(sha256sum "$ROOT/verified/full-city.blend" | cut -d' ' -f1)
          ARTIST_SHA=$(sha256sum "$ROOT/repaired/artist-output.blend" | cut -d' ' -f1)
          blender -b --python-exit-code 1 --python tools/valoria-bastion1-assembly/apply_qwen_artist_mesh.py -- \
            --source "$ROOT/verified/full-city.blend" --artist "$ROOT/repaired/artist-output.blend" \
            --plan "$ROOT/artist/model/artist-plan.json" --out "$ROOT/merged" \
            --source-sha256 "$SOURCE_SHA" --artist-sha256 "$ARTIST_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-qwen8b-current-grass-city-${{ github.run_id }}
          path: |
            /tmp/valoria-real-ai-merge/merged/**
            /tmp/valoria-real-ai-merge/repaired/**
            /tmp/valoria-real-ai-merge/artist/model/**
            /tmp/valoria-real-ai-merge/frustum/ab/**
            /tmp/valoria-real-ai-merge/masked-ab/**
          retention-days: 14
