name: Bastion I verified Qwen sculpt into full playable city
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths: ['.github/workflows/valoria-bastion1-ai-mesh-city-merge.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion1-verified-qwen-full-city
  cancel-in-progress: true
jobs:
  merge-verified-qwen-cliff:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: /tmp/valoria-real-ai-merge
      SOURCE_RUN: '38356683511'
      SOURCE_SHA: '245a963f7c7eb9ee30e4de9e9cffd13f632eb82d'
      ARTIST_RUN: '38375937914'
      TARGET_MESH: 'Valoria natural playable hilltop and rock scarps'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/valoria-bastion1-assembly/apply_qwen_artist_mesh.py
          sparse-checkout-cone-mode: false
      - name: Authenticate unchanged 4B Qwen source, model, geometry, and visible Blender render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/source" "$ROOT/artist" "$ROOT/verified"
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" \
            --name "bastion1-player-integration-$SOURCE_RUN" --dir "$ROOT/source"
          gh run download "$ARTIST_RUN" --repo "${{ github.repository }}" \
            --name "bastion1-genuine-qwen-artist-$ARTIST_RUN" --dir "$ROOT/artist"
          python3 - <<'PY'
          import os,json,hashlib,pathlib,struct
          root=pathlib.Path(os.environ['ROOT'])
          files=list((root/'source').rglob('Bastion1ReferenceAssembly.glb'))
          assert len(files)==1,files
          source=files[0].read_bytes()
          prov=json.loads((root/'artist/input-provenance.json').read_text())
          assert prov['source_run']==int(os.environ['SOURCE_RUN'])
          assert prov['source_sha']==os.environ['SOURCE_SHA']
          assert hashlib.sha256(source).hexdigest()==prov['glb_sha256']
          assert source[:4]==b'glTF' and struct.unpack('<I',source[8:12])[0]==len(source)
          plan_path=root/'artist/model/artist-plan.json'
          plan_raw=plan_path.read_bytes()
          plan=json.loads(plan_raw)
          inf=json.loads((root/'artist/model/artist-inference.json').read_text())
          raw=(root/'artist/model/artist-response-raw.txt').read_bytes()
          assert inf['model']=='qwen3-vl:4b-instruct' and inf['system_role']=='system'
          assert inf['direction']['planned_actions']==plan and inf['self_approval'] is False
          assert 1<=len(plan)<=2 and all(op['target']==os.environ['TARGET_MESH'] and
              op['type'] in {'sculpt_region','sculpt_path','reprofile_crest'} for op in plan)
          assert inf['attempt_history'][-1]['raw_response_sha256']==hashlib.sha256(raw).hexdigest()
          exec_proof=json.loads((root/'artist/result/artist-execution.json').read_text())
          assert exec_proof['plan_sha256']==hashlib.sha256(plan_raw).hexdigest()
          assert exec_proof['source_mesh_sha256']!=exec_proof['result_mesh_sha256']
          assert len(exec_proof['executed_actions'])==len(plan)
          for name in ('artist-output.blend','artist-output.glb'):
            assert (root/'artist/result'/name).is_file(),name
          edited=root/'artist/result/artist-output.blend'
          assert hashlib.sha256(edited.read_bytes()).hexdigest()==exec_proof['result_blend_sha256']
          cmp=json.loads((root/'artist/ab/comparison.json').read_text())
          stats=cmp['camera_visibility']
          assert cmp['target']==os.environ['TARGET_MESH']
          assert 'Blender clay A/B' in cmp['scope']
          assert stats['camera_visibility_gate']=='REVIEW_REQUIRED',stats
          assert stats['changed_fraction']>=0.001 and stats['changed_pixels']>=308,stats
          assert cmp['source_file_sha256']==hashlib.sha256((root/'artist/terrain-source.blend').read_bytes()).hexdigest()
          assert cmp['result_file_sha256']==hashlib.sha256(edited.read_bytes()).hexdigest()
          for step in ('before','after'):
            img=root/'artist/ab'/f'{step}-blender-clay.png'
            assert hashlib.sha256(img.read_bytes()).hexdigest()==cmp[f'{step}_image_sha256']
          print('AUTHENTIC_QWEN4B_ORIGINAL_RENDER_IS_VISIBLE_STUDY_ONLY',json.dumps(
            {'artist_run':int(os.environ['ARTIST_RUN']),
             'source_run':int(os.environ['SOURCE_RUN']),
             'model_plan_sha256':hashlib.sha256(plan_raw).hexdigest(),
             'changed_camera_fraction':stats['changed_fraction'],
             'not_unity_or_art_approved':True}))
          (root/'verified/source.glb').write_bytes(source)
          PY
      - name: Install free open-source Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -2
      - name: Reconstruct immutable full scene from exact source GLB
        shell: bash
        run: |
          cat > "$ROOT/import.py" <<'PY'
          import bpy,os,pathlib,json
          root=pathlib.Path(os.environ['ROOT'])
          bpy.ops.object.select_all(action='SELECT');bpy.ops.object.delete(use_global=False)
          bpy.ops.import_scene.gltf(filepath=str(root/'verified/source.glb'))
          o=bpy.data.objects.get('Valoria natural playable hilltop and rock scarps')
          if not o or o.type!='MESH' or len(o.data.vertices)!=json.loads((root/'artist/inspect/mesh-context.json').read_text())['vertices']:
           raise ValueError('Unexpected source geometry, do not replace scene')
          if len(bpy.data.objects)<40:raise ValueError('Architecture missing')
          bpy.ops.wm.save_as_mainfile(filepath=str(root/'verified/full-city.blend'))
          print('WHOLE_VALORIA_CITY_IMMUTABLE_SOURCE',len(bpy.data.objects))
          PY
          blender -b --python-exit-code 1 --python "$ROOT/import.py"
      - name: Apply Qwen-selected sculpt while protecting player parcels, materials and UVs
        shell: bash
        run: |
          set -euo pipefail
          # Technical rejection of the prior merge: mesh.materials.clear()
          # collapsed face material indexes, dropping the stone PBR cliff
          # material despite preserving object names. Patch only this isolated
          # run's execution copy; the source gets updated after verified QA.
          python3 - <<'PY'
          import pathlib
          f=pathlib.Path('tools/valoria-bastion1-assembly/apply_qwen_artist_mesh.py')
          s=f.read_text()
          old='mesh.materials.clear()\nfor material in old_mats:mesh.materials.append(material)\noriginal.data=mesh'
          new='saved_material_indices=[poly.material_index for poly in mesh.polygons]\nmesh.materials.clear()\nfor material in old_mats:mesh.materials.append(material)\nfor poly,slot in zip(mesh.polygons,saved_material_indices):poly.material_index=slot\noriginal.data=mesh'
          if old in s:
           f.write_text(s.replace(old,new))
           print('RESTORE_PER_FACE_PBR_SLOTS_IN_GENUINE_QWEN_MERGE')
          elif new in s:
           print('PBR_PER_FACE_SLOTS_ALREADY_PRESERVED_IN_AUTHORING_SOURCE')
          else:
           raise ValueError('Unknown terrain material preservation logic; refuse silent unsafe merge')
          PY
          SOURCE_SHA=$(sha256sum "$ROOT/verified/full-city.blend" | cut -d' ' -f1)
          ARTIST_SHA=$(sha256sum "$ROOT/artist/result/artist-output.blend" | cut -d' ' -f1)
          blender -b --python-exit-code 1 --python tools/valoria-bastion1-assembly/apply_qwen_artist_mesh.py -- \
            --source "$ROOT/verified/full-city.blend" \
            --artist "$ROOT/artist/result/artist-output.blend" \
            --plan "$ROOT/artist/model/artist-plan.json" \
            --source-sha256 "$SOURCE_SHA" --artist-sha256 "$ARTIST_SHA" --out "$ROOT/merged"
          python3 - <<'PY'
          import json,os,pathlib,hashlib,struct
          root=pathlib.Path(os.environ['ROOT'])
          p=json.loads((root/'merged/integration-proof.json').read_text())
          assert p['original_qwen_operation_types']==[op['type'] for op in json.loads((root/'artist/model/artist-plan.json').read_text())]
          assert p['changed_vertices']>=20 and p['protected_cell_changes']==0
          assert p['visual_art_approved'] is False and p['gameplay_qa'] is False
          data=(root/'merged/Bastion1QwenScene.glb').read_bytes()
          assert data[:4]==b'glTF' and struct.unpack('<I',data[8:12])[0]==len(data)
          assert hashlib.sha256(data).hexdigest()==p['edited_glb_sha256']
          import struct
          chunk=struct.unpack_from('<I',data,12)[0]
          gltf=json.loads(data[20:20+chunk])
          terrain_nodes=[n for n in gltf['nodes'] if n.get('name')=='Valoria natural playable hilltop and rock scarps']
          assert len(terrain_nodes)==1,terrain_nodes
          mesh=gltf['meshes'][terrain_nodes[0]['mesh']]
          names={gltf['materials'][x['material']]['name'] for x in mesh['primitives']}
          required={'PROTOTYPE terrace earth olive grass','Valoria schist dark fractured cliff','Valoria forested valley ground'}
          assert required.issubset(names),('Missing actual PBR terrain surface',required-names)
          assert len(mesh['primitives'])>=3,('Sculpt collapsed PBR face slots',len(mesh['primitives']))
          assert any(im.get('name')=='Valoria stratified native stone albedo' for im in gltf.get('images',[])),'Textured cliff was dropped'
          print('QWEN_AUTHORED_FULL_CITY_PBR_TERRAIN_PASS',len(mesh['primitives']),names)
          print('QWEN_EDIT_APPLIED_TO_FULL_CITY_NOT_PROMOTED',json.dumps(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-qwen-full-city-${{ github.run_id }}
          path: |
            /tmp/valoria-real-ai-merge/merged/Bastion1QwenScene.blend
            /tmp/valoria-real-ai-merge/merged/Bastion1QwenScene.glb
            /tmp/valoria-real-ai-merge/merged/integration-proof.json
            /tmp/valoria-real-ai-merge/artist/model/artist-plan.json
            /tmp/valoria-real-ai-merge/artist/model/artist-inference.json
            /tmp/valoria-real-ai-merge/artist/result/artist-execution.json
            /tmp/valoria-real-ai-merge/artist/input-provenance.json
          if-no-files-found: warn
          retention-days: 30
