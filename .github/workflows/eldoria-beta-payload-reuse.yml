name: Eldoria owner lazy world staging — preserve live Pages, no deployment
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-payload-reuse.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-owner-lazy-stage
  cancel-in-progress: false
jobs:
  stage-unpublished-owner-route:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - name: Compile delivery preparation and verify bounded forward reconstruction
        run: |
          python3 -m py_compile tools/eldoria-private-beta/stage_lazy_profile_owner_site.py
          python3 tools/eldoria-private-beta/test_lazy_profile_reconstruction.py
      - name: Download existing complete owner Pages without changing it
        uses: actions/download-artifact@v4
        with:
          run-id: 43006294342
          name: github-pages
          github-token: ${{ github.token }}
          path: existing-pages
      - name: Download exact fresh native profiled candidate
        uses: actions/download-artifact@v4
        with:
          run-id: 43140354002
          name: mobile16-full-lazy-owner-only-site-not-iphone-pass
          github-token: ${{ github.token }}
          path: candidate
      - name: Download actual two-arm Apple GPU QA
        uses: actions/download-artifact@v4
        with:
          run-id: 43140354002
          name: mobile16-full-lazy-desktop-apple-gpu-not-iphone-certificate
          github-token: ${{ github.token }}
          path: actual-mac
      - name: Preserve every live byte and stage exact small-frame owner route
        run: |
          python3 tools/eldoria-private-beta/stage_lazy_profile_owner_site.py --pages existing-pages/artifact.tar --candidate candidate --mac actual-mac --output site --transport tools/eldoria-private-beta/iphone_ab/copyadd_transport.js
      - name: Verify all 31 actual native parts through real browser HTTP streaming
        run: node --max-old-space-size=3072 tools/eldoria-private-beta/verify_lazy_profile_http.mjs site
      - name: Retain unpublished complete owner site
        uses: actions/upload-artifact@v4
        with:
          name: mobile16-unpublished-preserved-owner-site
          path: site/
          compression-level: 0
          retention-days: 14
      - name: Retain staging and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile16-owner-staging-proof-no-publication
          path: |
            site/beta-lazy-world-owner-proof.json
            actual-mac/**/report.json
          retention-days: 14
