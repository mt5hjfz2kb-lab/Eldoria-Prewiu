name: Eldoria P0 — direct transport compiled-byte browser verification
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-copyadd-p0.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-p0-copyadd-verified-no-pages-mutation
  cancel-in-progress: false
jobs:
  direct-browser:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 42785047968
          name: beta10-clock-copyadd-owner-only-site
          github-token: ${{ github.token }}
          path: site
      - uses: actions/download-artifact@v4
        with:
          run-id: 42812046053
          name: eldoria-immediate-entry-canvas-ab-not-iphone
          github-token: ${{ github.token }}
          path: browser-proof
      - name: Recreate current wrapper then remove browser reconstruction, exact engine unchanged
        run: |
          python3 tools/eldoria-private-beta/iphone_ab/stage_stable_canvas.py site tools/eldoria-private-beta/iphone_ab/stable_canvas.js browser-proof/evidence/canvas-shell-proof.json
          python3 tools/eldoria-private-beta/iphone_ab/stage_direct_control.py site
          node --check site/beta-iphone-clock-direct/play.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual Mac WebKit entry, nickname, persistence and reload; not physical iPhone
        run: |
          npm install --prefix "$RUNNER_TEMP/direct-webkit" --no-save playwright@1.55.0
          "$RUNNER_TEMP/direct-webkit/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/direct-webkit/node_modules"
          node tools/eldoria-private-beta/qa_static_server.cjs site 18975 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          QA_ENGINE=webkit QA_ENTRY=1 QA_EARLY_ENTRY=1 QA_SKIP_PREFLIGHT=1 QA_EXPECT_ORIGIN=http://127.0.0.1:18975 QA_URL='http://127.0.0.1:18975/beta-iphone-clock-direct/?eldoria_diag=1' QA_REVISION=native325-mobile12-minimal-world-clock-qa QA_OUT=evidence/direct node tools/eldoria-private-beta/qa_webkit_residency.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-direct-transport-browser-proof-not-iphone
          path: |
            evidence/
            server.log
            site/beta-iphone-clock-direct/direct-control-proof.json
            site/beta-iphone-clock-direct/play.js
            site/beta-iphone-clock-direct/build-manifest.json
          retention-days: 14
