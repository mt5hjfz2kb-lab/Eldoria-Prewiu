name: Eldoria P0 — live direct transport entry and persistence
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-copyadd-p0.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-p0-copyadd-verified-no-pages-mutation
  cancel-in-progress: false
jobs:
  direct-browser:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual Mac WebKit entry, nickname, persistence and reload; not physical iPhone
        run: |
          npm install --prefix "$RUNNER_TEMP/direct-webkit" --no-save playwright@1.55.0
          "$RUNNER_TEMP/direct-webkit/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/direct-webkit/node_modules"
          QA_ENGINE=webkit QA_ENTRY=1 QA_EARLY_ENTRY=1 QA_SKIP_PREFLIGHT=1 QA_EXPECT_ORIGIN=https://mt5hjfz2kb-lab.github.io QA_URL='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-iphone-clock-direct/?transport=direct-r1&eldoria_diag=1' QA_REVISION=native325-mobile12-minimal-world-clock-qa QA_OUT=evidence/direct node tools/eldoria-private-beta/qa_webkit_residency.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-direct-transport-live-proof-not-iphone
          path: |
            evidence/
          retention-days: 14
