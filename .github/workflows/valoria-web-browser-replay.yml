name: '[VALORIA] Exact WebGL browser evidence replay'
on:
  push:
    branches: [main]
    paths: ['.github/workflows/valoria-web-browser-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-web-browser-replay-exact
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/valoria-reference-clean/
            /docs/evidence/valoria-reference-clean/environment-city-wide-after.png
      - uses: actions/download-artifact@v4
        with:
          name: valoria-integrated-web-playtest-39223329742
          run-id: 39223329742
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: unity-raw
      - name: Check browser test syntax without opening Unity
        run: node --check tools/valoria-reference-clean/playtest_web.cjs
      - name: Verify exact existing integrated build transport
        run: |
          python3 tools/valoria-reference-clean/prepare_web.py unity-raw prepared-site native139 2210c14593f142ef144be6d628df7e873512e218 39223329742
          node tools/valoria-reference-clean/check-web-transport.cjs prepared-site/dist/play.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: valoria-exact-browser-evidence-39223329742
          run-id: 39223329742
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior-evidence
      - name: Install existing Chromium tool and video frame extraction
        run: |
          npm install --prefix "$RUNNER_TEMP/valoria-web-qa" --no-save --ignore-scripts playwright@1.55.0
          "$RUNNER_TEMP/valoria-web-qa/node_modules/.bin/playwright" install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | head -n 1
      - name: Diagnose prior world-pan interception from real video evidence
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path("prior-evidence")
          reports=list(root.rglob("report.json"))
          if not reports: raise SystemExit("Original Chromium failure evidence missing")
          data=json.loads(reports[0].read_text())
          print("PRIOR_STATUS",data.get("status"),"FAILURES",data.get("failures",[])[:2])
          print("PRIOR_RUNTIME_ERRORS",json.dumps(data.get("runtime_errors",[])[-12:],ensure_ascii=False))
          print("PRIOR_NETWORK_FAILURES",json.dumps(data.get("network_failures",[])[-6:]))
          print("PRIOR_LAST_STATE",json.dumps(data.get("last_state",{}),ensure_ascii=False)[:1100])
          for name in ("actions.ndjson","telemetry.ndjson","browser-console.ndjson"):
              files=list(root.rglob(name))
              if files:
                  raw=files[0].read_text().splitlines()
                  if name=="telemetry.ndjson":
                      states=[]
                      for line in raw[-10:]:
                          try:
                              item=json.loads(line);state=item.get("state",{})
                              states.append({"t":item.get("elapsed_s"),"sequence":item.get("sequence"),
                              "width":state.get("width"),"height":state.get("height"),"narrative":state.get("narrative")})
                          except Exception: pass
                      print("PRIOR_TELEMETRY_COUNT",len(raw),"LAST",json.dumps(states))
                  elif name=="actions.ndjson":
                      print("PRIOR_ACTIONS",json.dumps([{"t":json.loads(x).get("elapsed_s"),
                      "label":json.loads(x).get("label")} for x in raw[-8:]]))
                  else: print("PRIOR_CONSOLE_COUNT",len(raw),"LAST",json.dumps(raw[-5:])[:1200])
          for f in root.rglob("*.webm"):
              p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration",
              "-of","default=noprint_wrappers=1:nokey=1",str(f)],capture_output=True,text=True)
              print("PRIOR_VIDEO",f.name,f.stat().st_size,"duration",p.stdout.strip(),"probe_error",p.stderr[:300])
          PY
      - name: Play exact WebGL with real input and normal clock, extract real video frames
        env:
          VALORIA_WEB_ROOT: ${{ github.workspace }}/prepared-site/dist
          VALORIA_PLAYTEST_OUT: ${{ github.workspace }}/web-visible-controls-evidence
          VALORIA_SOURCE_SHA: 2210c14593f142ef144be6d628df7e873512e218
          VALORIA_PLAYTEST_TIMEOUT_SECONDS: '1100'
          VALORIA_WEB_LOAD_TIMEOUT_SECONDS: '180'
        run: NODE_PATH="$RUNNER_TEMP/valoria-web-qa/node_modules" node tools/valoria-reference-clean/playtest_web.cjs
      - name: Bind exact bytes to passed game, saves, video and screenshot evidence
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          report=pathlib.Path('web-visible-controls-evidence/report.json')
          state=json.loads(report.read_text())
          assert state['status']=='PASS' and state['checks']['exact_save_reload']['pass']
          assert state['screenshots'] and all(not s['extraction_pending'] for s in state['screenshots'])
          assert state.get('video') and state.get('dialogue_clip')
          f=pathlib.Path('prepared-site/unity-output-verification.json')
          proof=json.loads(f.read_text())
          proof['browser_runtime_qa']=True
          proof['browser_scope']=state['scope']
          proof['tested_manifest_sha256']=state['build']['manifest_sha256']
          proof['browser_report_sha256']=hashlib.sha256(report.read_bytes()).hexdigest()
          f.write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-exact-browser-evidence-${{ github.run_id }}
          path: web-visible-controls-evidence/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: valoria-verified-private-site-${{ github.run_id }}
          path: prepared-site/**
          if-no-files-found: error
