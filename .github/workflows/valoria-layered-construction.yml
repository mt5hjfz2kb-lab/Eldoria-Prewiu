name: "[VALORIA] Exclusive layered master-plan ABC / actual Unity"
on:
  push:
    branches:
      - construction/valoria-master-plan-layers-20261016
    paths:
      - "Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/**"
      - "Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Layout/**"
      - "tools/valoria-layered-construction/verify-source.mjs"
      - ".github/workflows/valoria-layered-construction.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-layered-master-plan-20261016
  cancel-in-progress: false
jobs:
  source-master:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify 22 source footprints and actual approved reference
        shell: bash
        run: |
          node tools/valoria-layered-construction/verify-source.mjs
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('docs/evidence/valoria-layered-construction-20261016/source-topology-gate.json','utf8'));
          if(e.status!=='SOURCE_TOPOLOGY_PASS'||e.verified_footprints!==22||
            e.bridge_geometry_certified||e.canonical_sharp_gameplay_certified)throw Error('Bad source authority');
          const b=fs.readFileSync('Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaLayeredMasterSceneBuilder.cs','utf8');
          for(const s of ['BuildGroundAndExistingZones','BuildCirculationAndBridge','BuildGateAndMassing',
              'CheckRouteRaycasts','EditorSceneManager.SaveScene','GREYBOX / SUPPORT / TEMPORARY'])
            if(!b.includes(s))throw Error('Missing layer '+s);
          console.log('VALORIA_LAYERED_STATIC_PASS');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-layered-plan-${{ github.run_id }}
          path: docs/evidence/valoria-layered-construction-20261016/*
          if-no-files-found: error
  native-unity:
    needs: source-master
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    defaults:
      run:
        working-directory: valoria-layered-source
    steps:
      - name: Recover installed GitHub Desktop git.exe
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $g=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Existing GitHub Desktop Git not found'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-layered-source
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-layered-live-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exclusive Windows lease and reference before launching Unity
        shell: powershell
        run: |
          $reg=Get-Content "$env:GITHUB_WORKSPACE/valoria-layered-live-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $own=@($reg.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016'})
          $other=@($reg.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'})
          if($own.Count -ne 1){throw 'Exclusive layered Valoria claim absent'}
          if($other.Count){throw 'Incompatible Windows claim'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count -gt 0){throw 'PC busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity editor missing'}
          $hash=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Reference mismatch'}
          Write-Host 'VALORIA_EXCLUSIVE_WINDOWS_GATE_PASS'
      - name: Build exact isolated Unity .unity scene and native screenshots
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria-layered-native-build.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",
            '-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaLayeredMasterSceneBuilder.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(3000000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Native layered builder timed out'
          }
          Get-Content $log -Tail 140
          Copy-Item $log docs/evidence/valoria-layered-construction-20261016/native-unity.log
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_LAYERED_MASTER_ABC_COMPLETE' -Quiet)){
            throw "Unity layered scene failed exit=$($p.ExitCode)"
          }
      - name: Assert real Unity file and six images plus physical raycasts
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016'
          $scene='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABC.unity'
          if(-not(Test-Path $scene)){throw 'Missing saved Unity scene'}
          foreach($f in @('first-native-gate.json','master-home-19.png','master-home-12.png','master-home-9.png','master-portrait-12.png','master-west-pan-12.png','master-east-pan-12.png')){
            if(-not(Test-Path "$dir/$f")){throw "Missing native image/evidence $f"}
          }
          $v=Get-Content "$dir/first-native-gate.json" -Raw|ConvertFrom-Json
          if($v.footprints -ne 22 -or $v.stairs -ne 12 -or $v.raycasts_passed -ne 19 -or $v.is_canonical -or
            $v.art_status -ne 'NOT_APPROVED'){throw 'Native topological gate fails'}
          if([math]::Abs($v.bridge_deck_top-$v.bank_top) -gt .001){throw 'Bridge-banking discontinuity'}
          Write-Host 'VALORIA_LAYERED_NATIVE_TECH_PASS (not ART_APPROVED)'
      - name: Restore only six previously hash-pinned GLBs from archived isolated experiment
        uses: actions/download-artifact@v4
        with:
          run-id: 38965212132
          name: valoria63-clean-sources-38965212132
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/valoria-layered-source
      - name: Copy selected immutable source files into OWN isolated staging folder
        shell: powershell
        run: |
          $src='Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Sources'
          $dst='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Sources'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          foreach($id in @('tower_square_short','wall_panel_crenellated_4m','arch_complete_major',
            'portcullis_large','reinforced_oak_gate','banner_royal_blue')){
            if(-not(Test-Path "$src/$id.glb")){throw "Missing archived source $id"}
            Copy-Item "$src/$id.glb" "$dst/$id.glb" -Force
          }
          Write-Host 'VALORIA_LAYER_D_SELECTED_SOURCE_READY: six existing GLBs'
      - name: Import and assemble modular lower gate on preserved ABC scene (Unity real)
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria-layered-modular-D.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",
            '-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaModularGateLayerD.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Layer D Unity import timeout'
          }
          Get-Content $log -Tail 120
          Copy-Item $log docs/evidence/valoria-layered-construction-20261016/native-layer-D.log
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_LAYERED_AUTHENTIC_GATE_D_COMPLETE' -Quiet)){
            throw "Real gate layer D failed exit=$($p.ExitCode)"
          }
      - name: Validate saved D ensemble prefab and real A/B captures
        shell: powershell
        run: |
          $root='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          $dir='docs/evidence/valoria-layered-construction-20261016'
          foreach($f in @("$root/Valoria_MasterPlan_Layers_ABCD.unity",
            "$root/GeneratedD/LowerGate_Real6_Modular.prefab","$dir/lower-gate-D-evidence.json",
            "$dir/master-gate-D-home-12.png","$dir/master-gate-D-home-19.png","$dir/master-gate-D-portrait-12.png")){
            if(-not(Test-Path $f)){throw "Missing real layer D output $f"}
          }
          $d=Get-Content "$dir/lower-gate-D-evidence.json" -Raw|ConvertFrom-Json
          if($d.genuine_glb_types -ne 6 -or $d.module_instances -ne 11 -or $d.full_scene_visual_pass -or $d.is_canonical){
            throw 'Layer D claimed unverified art or incorrect actual modules'
          }
          Write-Host 'VALORIA_LAYER_D_REAL_SOURCE_TECH_PASS; ART_QUALITY_NOT_APPROVED'
      - name: Stage only 3 existing hash-pinned bridge GLBs into isolated model folder
        shell: powershell
        run: |
          $src='Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Sources'
          $dst='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Sources'
          foreach($id in @('bridge_span_4m','arch_bridge_support','stone_slab_cap')){
            if(-not(Test-Path "$src/$id.glb")){throw "Missing original source $id"}
            Copy-Item "$src/$id.glb" "$dst/$id.glb" -Force
          }
          Write-Host 'VALORIA_BRIDGE_THREE_ARCHIVED_GLB_SHA_PINNED_INPUTS'
      - name: Reopen scene ABCD and build authentic modular bridge E without gameplay changes
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria-bridge-E.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",
            '-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaAuthenticBridgeLayerE.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Bridge E import timed out'
          }
          Get-Content $log -Tail 100
          Copy-Item $log docs/evidence/valoria-layered-construction-20261016/native-bridge-E.log
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_LAYERED_REAL_BRIDGE_E_COMPLETE' -Quiet)){
            throw "Actual Unity bridge layer E failed exit=$($p.ExitCode)"
          }
      - name: Verify authentic bridge prefab, continuity and official before-after images
        shell: powershell
        run: |
          $root='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          $ev='docs/evidence/valoria-layered-construction-20261016'
          foreach($p in @("$root/Valoria_MasterPlan_Layers_ABCDE.unity",
            "$root/GeneratedE/RealBridge_3SourceTypes.prefab","$ev/real-bridge-E-evidence.json",
            "$ev/master-bridge-E-home-12.png","$ev/master-bridge-E-home-19.png","$ev/master-bridge-E-portrait-12.png")){
            if(-not(Test-Path $p)){throw "Missing native E deliverable: $p"}
          }
          $d=Get-Content "$ev/real-bridge-E-evidence.json" -Raw|ConvertFrom-Json
          if($d.sources -ne 3 -or $d.instances -ne 14 -or -not $d.original_colliders_preserved -or
             $d.art_approved -or [math]::Abs($d.collision_deck_top-$d.shore_top) -gt .001){
            throw 'Bridge E source/geometry/authority gate red'
          }
          Write-Host 'VALORIA_REAL_BRIDGE_E_TECH_PASS (visual independent review required)'
      - name: Persist new isolated scene and evidence to own branch only
        shell: powershell
        run: |
          git config user.name 'Valoria layered native builder'
          git config user.email 'valoria-layered@users.noreply.github.com'
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Generated/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedD/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedE/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABC.unity
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABCD.unity
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABCDE.unity
          git add -f -- docs/evidence/valoria-layered-construction-20261016/
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence: native Valoria master-plan ABC with physical route checks'
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch change: preserve artifact, never force push'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-layered-native-${{ github.run_id }}
          path: |
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Generated/**
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedD/**
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedE/**
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABC.unity
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABCD.unity
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABCDE.unity
            valoria-layered-source/docs/evidence/valoria-layered-construction-20261016/**
          if-no-files-found: warn
