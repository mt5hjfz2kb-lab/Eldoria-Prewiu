name: "[ART ARCH V5] Four individual actual stone arris chisel A-B"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-four-stone-arrises-v5.yml'
      - 'tools/valoria-modular-fortress/four_arch_stones_visible_erosion_v5.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-four-arch-arrises-single-worker
  cancel-in-progress: false
jobs:
  native-sculpt:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Find installed Git and Blender
        shell: powershell
        id: bins
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing installed git'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $blender=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Missing installed Blender'}
          "exe=$blender" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-four-bold-hand-dressed-arch-v4-38888410182
          run-id: 38888410182
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/four-chiselled-v4
      - name: Boolean sculpt on each distinct arch asset and export matched PNG + GLB
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'four-chiselled-v4\eldoria-four-dovelas-chisel-v4\glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-four-stone-arrises-v5'
          if(-not(Test-Path (Join-Path $src 'arch_keystone_major.glb'))){throw 'Four source stone GLBs absent'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/four_arch_stones_visible_erosion_v5.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned script absent'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-four-arrises-v5.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-four-arrises-v5.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-four-arrises-v5.err'
          $process=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0){throw "Actual stone sculpt error $($process.ExitCode)"}
          foreach($folder in @('before','after','glb')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 4){throw "Four pairs expected in $folder, got $count"}
          }
      - name: Store four independent A-B pairs and inspection manifests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-four-real-chiseled-arrises-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-four-stone-arrises-v5/**
            ${{ runner.temp }}/eldoria-four-arrises-v5.log
            ${{ runner.temp }}/eldoria-four-arrises-v5.err
          if-no-files-found: warn
          retention-days: 30
