name: Ciudad2D - importar Archivo como candidato aislado
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-ai/pending_archivo_url.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-ai-archivo-ubuntu-only
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-ai/
            /Unity/Assets/Experimentos/Ciudad2D/ArtBible/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Cuartel.png.meta
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Preserve original SHA, generate real alpha and quarantine, without changing gameplay
        run: python tools/ciudad2d-ai/import_archivo.py
      - name: Preserve offline QA proof separately from native Unity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-archivo-unapproved-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/archivo_cartografos/v1/
            Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Archivo_Cartografos_RGBA.png
          if-no-files-found: warn
          retention-days: 14
      - name: Commit new third candidate to isolated branch, remove temporary signed URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-ai/pending_archivo_url.json
          git add --sparse -A -- Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/archivo_cartografos/v1/ Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Archivo_Cartografos_RGBA.png Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Archivo_Cartografos_RGBA.png.meta
          git diff --cached --quiet && { echo 'No verified source'; exit 1; }
          git commit -m 'art(city2d): archive third conceptual Archivo source and RGBA, art unapproved'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
