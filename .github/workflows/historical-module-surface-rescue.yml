name: Historical Valoria surface rescue diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-module-surface-rescue.yml'
      - 'pipeline/historical-module-rescue.json'
      - 'tools/tripo_module_blender.py'

permissions:
  contents: read

concurrency:
  group: eldoria-historical-surface-rescue
  cancel-in-progress: true

jobs:
  rescue-surface:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Locate Blender
        id: blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $candidate){
            $root='C:\Program Files\Blender Foundation'
            if(Test-Path $root){
              $candidate=Get-ChildItem $root -Recurse -Filter blender.exe -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if(-not $candidate){throw 'Blender not found'}
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2

      - name: Diagnose present certified historical modules
        shell: powershell
        run: |
          $registry=Get-Content "$env:GITHUB_WORKSPACE\pipeline\historical-module-rescue.json" -Raw | ConvertFrom-Json
          $downloads=Join-Path $env:USERPROFILE 'Downloads'
          $out="$env:RUNNER_TEMP\historical-surface-rescue"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files=@(Get-ChildItem $downloads -File -Filter '*.glb' -ErrorAction SilentlyContinue)
          $count=0
          foreach($family in $registry.families){
            $expected=([string]$family.optimized_sha256).ToLowerInvariant()
            $match=$null
            $sourceKind='downloads'
            foreach($file in $files){
              $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if($sha -eq $expected){$match=$file;break}
            }

            if($null -eq $match -and $null -ne $family.recovery_source -and [int64]$family.recovery_source.artifact_id -gt 0){
              $artifactId=[int64]$family.recovery_source.artifact_id
              $recoverRoot=Join-Path $env:RUNNER_TEMP ("recover-"+(([string]$family.family) -replace '[^A-Za-z0-9_-]','_'))
              $zip="$recoverRoot.zip"
              Remove-Item $recoverRoot -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              $headers=@{
                Authorization="Bearer $env:GITHUB_TOKEN"
                Accept="application/vnd.github+json"
                "X-GitHub-Api-Version"="2022-11-28"
              }
              $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip"
              Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $zip -MaximumRedirection 10
              New-Item -ItemType Directory -Force $recoverRoot | Out-Null
              Expand-Archive -LiteralPath $zip -DestinationPath $recoverRoot -Force
              $candidates=@(Get-ChildItem $recoverRoot -Recurse -File -Filter '*.glb' -ErrorAction SilentlyContinue)
              foreach($candidate in $candidates){
                $sha=(Get-FileHash $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                if($sha -eq $expected){$match=$candidate;break}
              }
              $sourceKind='historical_artifact'
            }

            if($null -eq $match){
              Write-Host "RESCUE_MISSING $($family.family) | expected_sha256 $expected"
              continue
            }

            $safe=([string]$family.family) -replace '[^A-Za-z0-9_-]','_'
            $report=Join-Path $out "$safe.json"
            $stdout=Join-Path $out "$safe.log"
            $stderr=Join-Path $out "$safe.err.log"
            $args=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\tripo_module_blender.py",'--','--input',$match.FullName,'--report',$report,'--diagnostic-only')
            $p=Start-Process -FilePath "${{ steps.blender.outputs.path }}" -ArgumentList $args -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if($p.ExitCode -ne 0){
              if(Test-Path $stdout){Get-Content $stdout -Tail 120}
              if(Test-Path $stderr){Get-Content $stderr -Tail 120}
              throw "Surface rescue diagnostic failed for $($family.family): $($p.ExitCode)"
            }
            if(-not (Test-Path $report)){throw "Missing report for $($family.family)"}
            Write-Host "RESCUE_SURFACE $($family.family) | source=$sourceKind | $($match.Name) | sha256 $expected"
            Get-Content $report
            $count++
          }
          if($count -eq 0){throw 'No certified historical modules are currently available by exact SHA.'}
          "RESCUE_COUNT=$count" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-surface-rescue-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-surface-rescue/*
          if-no-files-found: warn
          retention-days: 14
