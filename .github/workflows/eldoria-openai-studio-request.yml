name: Eldoria Studio - reusable bounded mission request
on:
  push:
    branches: [pilot/eldoria-openai-development-studio-20261125]
    paths:
      - 'tools/openai-development-studio/requests/*.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-studio-reusable-request
  cancel-in-progress: false
jobs:
  review:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Verify request safety without credentials
        run: |
          python3 tools/openai-development-studio/request_gate.py --self-test
          python3 tools/openai-development-studio/mission_packet.py --self-test
          python3 tools/openai-development-studio/budget_guard.py --self-test
      - name: Verify immutable request, recover exact native evidence
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/openai-development-studio/request_gate.py --out /tmp/studio-request-packet
      - name: Preserve provenance and dry-run plan (no API calls)
        uses: actions/upload-artifact@v4
        with:
          name: studio-request-packet-${{ github.run_id }}
          path: /tmp/studio-request-packet/
          retention-days: 14
          if-no-files-found: error
      - name: Execute only explicitly reserved first-attempt request
        if: steps.gate.outputs.live == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELDORIA_AUTH_EVENT: ${{ steps.gate.outputs.request_id }}
          STUDIO_REQUEST_ID: ${{ steps.gate.outputs.request_id }}
        run: python3 tools/openai-development-studio/mission_packet.py --packet /tmp/studio-request-packet/packet.json --out /tmp/studio-request-result --live --authorization "$STUDIO_REQUEST_ID"
      - name: Preserve role reports and cost reservations
        if: always() && steps.gate.outputs.live == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: studio-request-result-${{ github.run_id }}
          path: /tmp/studio-request-result/
          retention-days: 14
          if-no-files-found: warn
