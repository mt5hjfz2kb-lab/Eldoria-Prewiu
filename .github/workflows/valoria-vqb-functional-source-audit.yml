name: "[EXPERIMENT] Valoria VQB Functional Source Audit"

on:
  push:
    branches: [visual-proof/valoria-visual-quality-breakthrough-v1]
    paths:
      - "tools/valoria-visual-quality-breakthrough/functional_source_audit.py"
      - ".github/workflows/valoria-vqb-functional-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Audit functional building sources
        shell: bash
        env:
          ELDORIA_FUNCTIONAL_AUDIT: ${{ github.workspace }}/pipeline/evidence/valoria-vqb-functional-source-audit.json
        run: |
          blender -b --python tools/valoria-visual-quality-breakthrough/functional_source_audit.py
          test -s pipeline/evidence/valoria-vqb-functional-source-audit.json
          cat pipeline/evidence/valoria-vqb-functional-source-audit.json
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: valoria-vqb-functional-source-audit-${{ github.run_id }}
          path: pipeline/evidence/valoria-vqb-functional-source-audit.json
          if-no-files-found: error
      - name: Persist functional audit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p pipeline/evidence
          cat > pipeline/evidence/valoria-vqb-functional-source-audit-run.json <<EOF
          {"run_id":"${{ github.run_id }}","source_sha":"${{ github.sha }}","job_status":"${{ job.status }}","artifact_id":"${{ steps.upload.outputs.artifact-id }}"}
          EOF
          git config user.name "eldoria-ci"
          git config user.email "actions@github.com"
          git add pipeline/evidence/valoria-vqb-functional-source-audit-run.json
          if [ -f pipeline/evidence/valoria-vqb-functional-source-audit.json ]; then git add pipeline/evidence/valoria-vqb-functional-source-audit.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: record functional source audit ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
