name: Studio - PR195 bounded art and production benchmark
on:
  push:
    branches: [pilot/eldoria-openai-development-studio-20261125]
    paths:
      - '.github/workflows/eldoria-openai-studio-senda-benchmark.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-senda-pr195-art-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.run_attempt == 1 && github.event.before == 'e400d40f69d4479e4ff8a551edab66c17a3fdccd' && github.event.head_commit.message == 'Run owner-authorized PR195 Studio benchmark once'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Verify existing Studio and native baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd tools/openai-development-studio
          python3 test_economics_v2.py
          python3 mission_packet.py --self-test
          gh run download 43732245691 --repo "$GITHUB_REPOSITORY" --name senda-brecha-native-3d-cb0193132fc6ed67c19f616f7fa9facf1155b79e --dir /tmp/senda-native-baseline
          python3 prepare_senda_benchmark.py /tmp/senda-native-baseline /tmp/senda-packet
          python3 mission_packet.py --packet /tmp/senda-packet/packet.json
      - name: Five roles, fixed scope, separate pre-reserved 1.45 USD
        id: live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELDORIA_AUTH_EVENT: senda-pr195-art-benchmark-v1
        run: |
          set -eu
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/senda-start
          cd tools/openai-development-studio
          cp senda-benchmark-budget.json budget-cycle.json
          python3 mission_packet.py --packet /tmp/senda-packet/packet.json --out /tmp/senda-result --live --authorization senda-pr195-art-benchmark-v1
      - name: Cost receipt even on failure
        if: always() && steps.live.outcome != 'skipped'
        env:
          LIVE_STATUS: ${{ steps.live.outcome }}
        run: |
          mkdir -p /tmp/senda-economics
          python3 tools/openai-development-studio/intervention_report.py collect --root /tmp/senda-result --run "$GITHUB_RUN_ID" --request senda-pr195-art-benchmark-v1 --started "$(cat /tmp/senda-start)" --finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --source-run 43732245691 --status "$LIVE_STATUS" --out "/tmp/senda-economics/run-$GITHUB_RUN_ID.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-studio-benchmark-${{ github.run_id }}
          path: |
            /tmp/senda-result/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-studio-economics-${{ github.run_id }}
          path: /tmp/senda-economics/
          retention-days: 30
          if-no-files-found: warn
