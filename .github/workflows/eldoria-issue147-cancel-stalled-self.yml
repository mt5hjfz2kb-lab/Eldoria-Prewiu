name: Eldoria Issue147 safety cleanup - own stalled preflight only
on:
  push:
    branches: [experiment/eldoria-unity-cli-win-pilot-20261102]
    paths: ['.github/workflows/eldoria-issue147-cancel-stalled-self.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel-stalled-self:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Guard identity and cancel only own stalled archive download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GH_REPO']; token=os.environ['GH_TOKEN']; runid=41474821703
          base='https://api.github.com/repos/'+repo
          def call(path,method='GET'):
              req=urllib.request.Request(base+path,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'eldoria-own-checkout-mitigation'})
              with urllib.request.urlopen(req,timeout=20) as res:
                  body=res.read().decode()
              return json.loads(body) if body else {}
          run=call('/actions/runs/'+str(runid))
          if run.get('head_branch')!='experiment/eldoria-unity-cli-win-pilot-20261102' or run.get('name')!='Eldoria Issue147 Windows preflight (read-only)':
              raise RuntimeError('Refuse to cancel run with unexpected ownership')
          jobs=call('/actions/runs/'+str(runid)+'/jobs?per_page=30').get('jobs',[])
          if not jobs or not any(j.get('status')=='in_progress' and any(s.get('name')=='Run actions/checkout@v4' and s.get('status')=='in_progress' for s in j.get('steps',[])) for j in jobs):
              print('No stalled OWN checkout active; no cancellation required')
          else:
              call('/actions/runs/'+str(runid)+'/cancel',method='POST')
              print('Requested cancellation of OUR OWN stalled archive checkout; Unity work untouched')
          PY
