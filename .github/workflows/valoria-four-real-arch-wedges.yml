name: "[ART ARCH 6] Four actual radial voussoir and keystone stones"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-four-real-arch-wedges.yml'
      - 'tools/valoria-modular-fortress/four_true_radial_stones.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-four-real-wedges-CC0
  cancel-in-progress: false
jobs:
  carve-four-real-arch-wedges:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 80
    steps:
      - name: Installed Blender and Git
        shell: powershell
        id: programs
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing Git'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-five-masonry-pbr-38822723551
          run-id: 38822723551
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/major-wedge-v4
      - uses: actions/download-artifact@v4
        with:
          name: valoria-twelve-limestone-cc0-38825364463
          run-id: 38825364463
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/minor-wedge-v4
      - uses: actions/download-artifact@v4
        with:
          name: valoria-3-real-medieval-wall-pbr-38860976002
          run-id: 38860976002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/stone-photo-CC0
      - name: Generate true four limestone trapezoid voussoirs and review PNGs
        shell: powershell
        run: |
          $major=Join-Path $env:RUNNER_TEMP 'major-wedge-v4\eldoria-five-masonry-ab\glb'
          $minor=Join-Path $env:RUNNER_TEMP 'minor-wedge-v4\eldoria-twelve-limestone\glb'
          $maps=Join-Path $env:RUNNER_TEMP 'stone-photo-CC0'
          $dest=Join-Path $env:RUNNER_TEMP 'eldoria-four-real-radial-wedges'
          foreach($p in @((Join-Path $major 'arch_keystone_major.glb'),(Join-Path $minor 'arch_voussoir_minor.glb'),(Join-Path $maps 'medieval_blocks_03_diffuse.jpg'))){
            if(-not(Test-Path $p)){throw "Missing pinned geometric/material source $p"}
          }
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/four_true_radial_stones.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned source missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-true-four-arch.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-four-true-arch.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-four-true-arch.err'
          $proc=Start-Process -FilePath "${{ steps.programs.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$major,$minor,$maps,$dest) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 95 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Radial wedge sculpt failed $($proc.ExitCode)"}
          foreach($sub in @('glb','before','after')){
            if((Get-ChildItem (Join-Path $dest $sub) -File).Count -ne 4){throw "Expected four $sub, not found"}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-four-true-arch-wedges-${{ github.run_id }}
          if: always()
          path: |
            ${{ runner.temp }}/eldoria-four-real-radial-wedges/**
            ${{ runner.temp }}/eldoria-four-true-arch.log
            ${{ runner.temp }}/eldoria-four-true-arch.err
          if-no-files-found: warn
          retention-days: 30
