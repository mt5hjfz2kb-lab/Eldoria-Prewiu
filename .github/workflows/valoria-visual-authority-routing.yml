name: Valoria visual authority routing

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/visual-authority-routing-v1.json'
      - 'pipeline/active-workstreams.json'
      - '.github/workflows/valoria-visual-authority-routing.yml'
      - 'tools/check-valoria-visual-authority-routing.mjs'
      - 'AGENTS.md'
      - 'references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg'
      - 'docs/VALORIA_VISUAL_REFERENCE_CANON_20261020.md'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/SlicePresenter.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/VisualWorld.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaBenchmarkCapture.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaFirstPlayableCitySliceV1.cs'
      - '.github/workflows/unity-slice.yml'
      - '.github/workflows/valoria-first-playable-city-slice-v1.yml'
  pull_request:
    paths:
      - 'pipeline/visual-authority-routing-v1.json'
      - 'pipeline/active-workstreams.json'
      - '.github/workflows/valoria-visual-authority-routing.yml'
      - 'tools/check-valoria-visual-authority-routing.mjs'
      - 'AGENTS.md'
      - 'references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg'
      - 'docs/VALORIA_VISUAL_REFERENCE_CANON_20261020.md'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/SlicePresenter.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/VisualWorld.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaBenchmarkCapture.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaFirstPlayableCitySliceV1.cs'
      - '.github/workflows/unity-slice.yml'
      - '.github/workflows/valoria-first-playable-city-slice-v1.yml'
  workflow_dispatch:

jobs:
  authority-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipeline/development-baseline.json
            /pipeline/visual-authority-routing-v1.json
            /pipeline/active-workstreams.json
            /pipeline/unity-publish-request.json
            /tools/check-valoria-visual-authority-routing.mjs
            /references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
            /Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity
            /Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/ValoriaIntegratedWorld.cs.meta
            /Unity/ProjectSettings/EditorBuildSettings.asset
            /Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Editor/ValoriaIntegratedWebBuild.cs
            /.github/workflows/valoria-reference-clean.yml
            /Unity/Assets/Eldoria/Scripts/Presentation/ValoriaCanonicalRuntimeGuard.cs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical vs legacy Valoria routing
        run: node tools/check-valoria-visual-authority-routing.mjs
