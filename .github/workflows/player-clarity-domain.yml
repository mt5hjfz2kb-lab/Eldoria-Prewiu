name: Eldoria Player Clarity - advanced exact-source domain proof
on:
  push:
    branches:
      - feature/player-clarity-first-login-map-signage-20261105
    paths:
      - 'tools/player-clarity/**'
      - 'Unity/Assets/Eldoria/PlayerClarity/**'
      - 'Unity/Assets/Eldoria/Scripts/Domain/PlayerIdentityPolicy.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/ResourceNodeTierPolicy.cs'
      - '.github/workflows/player-clarity-domain.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/player-clarity/**'
      - 'Unity/Assets/Eldoria/PlayerClarity/**'
      - 'Unity/Assets/Eldoria/Scripts/Domain/PlayerIdentityPolicy.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/ResourceNodeTierPolicy.cs'
      - '.github/workflows/player-clarity-domain.yml'
permissions:
  contents: read
concurrency:
  group: player-clarity-advanced-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advanced-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/player-clarity
            Unity/Assets/Eldoria/PlayerClarity
            Unity/Assets/Eldoria/Scripts/Domain
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile genuine C# identity, tier, placement and cooldown policies
        run: dotnet run --project tools/player-clarity/Probe.csproj --configuration Release
