name: "[R&D] Valoria Open-Source Image-to-3D Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-open-source-image-to-3d-capability-v1.yml"

permissions:
  contents: read

jobs:
  preview-target-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/valoria-open-source-image-to-3d-capability-v1.yml
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-gate.png
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-bridge.png
            art-source/valoria/lookdev/golden-slice-v1/camera-first-depth-shell-v1/gate-front.png
            art-source/valoria/lookdev/golden-slice-v1/camera-first-depth-shell-v1/gate-back.png
          sparse-checkout-cone-mode: false

      - name: Package canonical isolated inputs for visual selection
        run: |
          set -eux
          mkdir -p /tmp/i2d-target-preview
          cp art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png /tmp/i2d-target-preview/
          cp art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-gate.png /tmp/i2d-target-preview/
          cp art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-bridge.png /tmp/i2d-target-preview/
          cp art-source/valoria/lookdev/golden-slice-v1/camera-first-depth-shell-v1/gate-front.png /tmp/i2d-target-preview/
          cp art-source/valoria/lookdev/golden-slice-v1/camera-first-depth-shell-v1/gate-back.png /tmp/i2d-target-preview/
          sha256sum /tmp/i2d-target-preview/* > /tmp/i2d-target-preview/SHA256SUMS.txt
          file /tmp/i2d-target-preview/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-i2d-canonical-input-preview
          path: /tmp/i2d-target-preview
          retention-days: 7
