name: "[R&D] Valoria Open-Source Image-to-3D Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-open-source-image-to-3d-capability-v1.yml"

permissions:
  contents: read

jobs:
  trellis2-gate-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png
          sparse-checkout-cone-mode: false

      - name: Install client tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" pillow requests

      - name: Prepare isolated canonical gate input
        run: |
          mkdir -p /tmp/trellis2/input /tmp/trellis2/output /tmp/trellis2/evidence
          python - <<'PY'
          from PIL import Image
          src="art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png"
          im=Image.open(src).convert("RGBA")
          # Preserve exact same tested gate crop as the InstantMesh proof.
          box=(189,54,574,324)
          crop=im.crop(box)
          # TRELLIS works best with alpha/object isolation; keep crop unchanged except square padding.
          w,h=crop.size
          side=max(w,h)
          canvas=Image.new("RGBA",(side,side),(255,255,255,0))
          canvas.alpha_composite(crop,((side-w)//2,(side-h)//2))
          canvas=canvas.resize((768,768),Image.Resampling.LANCZOS)
          out="/tmp/trellis2/input/eldoria-gate-crop.png"
          canvas.save(out)
          open("/tmp/trellis2/evidence/input-spec.txt","w").write(
              f"source={src}\nsource_size={im.size}\ncrop_box={box}\nprepared={canvas.size}\ncredits=0\nunity_touched=false\n"
          )
          PY
          sha256sum /tmp/trellis2/input/eldoria-gate-crop.png | tee /tmp/trellis2/evidence/input.sha256

      - name: Probe and run TRELLIS.2 public Space
        id: trellis2
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/trellis2/evidence/trellis2.log
          import os, json, shutil, traceback, inspect
          from gradio_client import Client, handle_file

          client=Client("microsoft/TRELLIS.2", verbose=True)
          api=client.view_api(return_format="dict")
          print("API",api)
          endpoints=(api or {}).get("named_endpoints",{})
          print("ENDPOINTS",list(endpoints))

          def pick(fragment):
              for ep in endpoints:
                  if fragment.lower() in ep.lower():
                      return ep
              return None

          # Start a session if the Space exposes one.
          ep=pick("start_session")
          if ep:
              try:
                  print("START",ep,client.predict(api_name=ep))
              except Exception as e:
                  print("START_ERROR",repr(e))

          # Preprocess/upload.
          image_path="/tmp/trellis2/input/eldoria-gate-crop.png"
          prep_ep=pick("preprocess")
          prepared=handle_file(image_path)
          if prep_ep:
              try:
                  out=client.predict(image_prompt=handle_file(image_path), api_name=prep_ep)
              except Exception:
                  try:
                      out=client.predict(image=handle_file(image_path), api_name=prep_ep)
                  except Exception:
                      out=client.predict(handle_file(image_path), api_name=prep_ep)
              print("PREPROCESS_RESULT",repr(out))
              prepared=out if out is not None else prepared

          gen_ep=pick("image_to_3d") or pick("generate")
          if not gen_ep:
              raise SystemExit("No TRELLIS.2 generation endpoint advertised")

          spec=endpoints[gen_ep]
          params=spec.get("parameters",[])
          print("GEN_PARAMS",[(p.get("parameter_name"),p.get("parameter_default")) for p in params])
          kwargs={}
          for p in params:
              n=p.get("parameter_name")
              default=p.get("parameter_default")
              if n in ("image_prompt","image","input_image"):
                  kwargs[n]=handle_file(image_path)
              elif n=="seed":
                  kwargs[n]=42
              elif n=="resolution":
                  kwargs[n]=512
              elif n=="randomize_seed":
                  kwargs[n]=False
              elif n and default is not None:
                  kwargs[n]=default
          print("GEN_CALL",gen_ep,kwargs)
          result=client.predict(api_name=gen_ep, **kwargs)
          print("GEN_RESULT",repr(result))

          # Extract GLB. In Gradio, server-side State may be retained in this Client session,
          # but if an explicit state value is returned we pass it back.
          extract_ep=pick("extract_glb") or pick("extract")
          if not extract_ep:
              raise SystemExit("No TRELLIS.2 GLB extraction endpoint advertised")
          espec=endpoints[extract_ep]
          eparams=espec.get("parameters",[])
          print("EXTRACT_PARAMS",[(p.get("parameter_name"),p.get("parameter_default")) for p in eparams])
          ekw={}
          state_candidates=[]
          if isinstance(result,(list,tuple)):
              state_candidates=list(result)
          else:
              state_candidates=[result]
          for p in eparams:
              n=p.get("parameter_name")
              default=p.get("parameter_default")
              if n in ("decimation_target","mesh_simplify","simplify"):
                  ekw[n]=0.8 if n=="mesh_simplify" or n=="simplify" else 200000
              elif n=="texture_size":
                  ekw[n]=1024
              elif n in ("output_buf","state","model"):
                  # Try first non-file/non-string generation result as explicit state.
                  cand=next((x for x in state_candidates if not isinstance(x,(str,int,float,bool,type(None)))),None)
                  if cand is not None: ekw[n]=cand
              elif n and default is not None:
                  ekw[n]=default
          print("EXTRACT_CALL",extract_ep,ekw)
          extracted=client.predict(api_name=extract_ep, **ekw)
          print("EXTRACT_RESULT",repr(extracted))

          candidates=[]
          def walk(x):
              if isinstance(x,str): candidates.append(x)
              elif isinstance(x,(list,tuple)):
                  for v in x: walk(v)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
          walk(extracted)
          copied=[]
          for p in candidates:
              if os.path.isfile(p):
                  ext=os.path.splitext(p)[1].lower()
                  if ext in (".glb",".gltf",".obj",".ply"):
                      dst="/tmp/trellis2/output/trellis2"+ext
                      shutil.copy2(p,dst); copied.append(dst)
          print("COPIED",copied)
          if not any(p.endswith(".glb") for p in copied):
              raise SystemExit("TRELLIS.2 did not return a local GLB")
          PY

      - name: Require TRELLIS.2 mesh
        run: |
          test "${{ steps.trellis2.outcome }}" = "success"
          test -s /tmp/trellis2/output/trellis2.glb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-trellis2-gate-capability-v1
          path: |
            /tmp/trellis2/evidence
            /tmp/trellis2/output
            /tmp/trellis2/input/eldoria-gate-crop.png
          retention-days: 14
