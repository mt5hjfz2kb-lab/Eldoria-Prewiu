name: "[R&D] Valoria Open-Source Image-to-3D Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-open-source-image-to-3d-capability-v1.yml"

permissions:
  contents: read

jobs:
  eldoria-gate-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/valoria-open-source-image-to-3d-capability-v1.yml
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png
          sparse-checkout-cone-mode: false

      - name: Install clients and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libglx0 libx11-6
          python -m pip install "gradio_client>=1.10,<2" pillow
          blender --version

      - name: Prepare isolated canonical gate input
        run: |
          mkdir -p /tmp/i2d/input /tmp/i2d/output /tmp/i2d/evidence
          python - <<'PY'
          from PIL import Image, ImageOps
          src="art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png"
          im=Image.open(src).convert("RGB")
          w,h=im.size
          # Canonical gate mass: twin towers + arch + immediate side masonry.
          # Deliberately excludes most bridge/cliff/road so image-to-3D does not fuse terrain into the asset.
          box=(int(w*0.27), int(h*0.10), int(w*0.82), int(h*0.60))
          crop=im.crop(box)
          # Add neutral margin for background-removal model.
          side=max(crop.size)
          canvas=Image.new("RGB",(side,side),(238,238,234))
          x=(side-crop.width)//2; y=(side-crop.height)//2
          canvas.paste(crop,(x,y))
          canvas=canvas.resize((768,768),Image.Resampling.LANCZOS)
          canvas.save("/tmp/i2d/input/eldoria-gate-crop.png")
          open("/tmp/i2d/evidence/input-spec.txt","w").write(
              f"source={src}\nsource_size={w}x{h}\ncrop_box={box}\nprepared=768x768\ncredits=0\nunity_touched=false\n"
          )
          PY
          file /tmp/i2d/input/eldoria-gate-crop.png
          sha256sum /tmp/i2d/input/eldoria-gate-crop.png | tee /tmp/i2d/evidence/input.sha256

      - name: Generate free InstantMesh geometry
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/i2d/evidence/instantmesh.log
          import os, shutil
          from gradio_client import Client, handle_file
          client=Client("TencentARC/InstantMesh", verbose=True)
          endpoints=(client.view_api(return_format="dict") or {}).get("named_endpoints",{})
          required=("/preprocess","/generate_mvs","/make3d")
          if not all(ep in endpoints for ep in required):
              raise SystemExit("Required InstantMesh chain unavailable: "+repr(list(endpoints)))
          processed=client.predict(
              input_image=handle_file("/tmp/i2d/input/eldoria-gate-crop.png"),
              do_remove_background=True,
              api_name="/preprocess"
          )
          print("PREPROCESSED",repr(processed))
          mvs=client.predict(
              input_image=handle_file(processed) if isinstance(processed,str) else processed,
              sample_steps=75,
              sample_seed=42,
              api_name="/generate_mvs"
          )
          print("MVS",repr(mvs))
          result=client.predict(api_name="/make3d")
          print("RESULT",repr(result))
          candidates=[]
          def walk(x):
              if isinstance(x,str): candidates.append(x)
              elif isinstance(x,(list,tuple)):
                  for v in x: walk(v)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
          walk(result)
          found={}
          for p in candidates:
              if os.path.isfile(p):
                  ext=os.path.splitext(p)[1].lower()
                  if ext in (".glb",".obj") and ext not in found:
                      dst="/tmp/i2d/output/instantmesh"+ext
                      shutil.copy2(p,dst); found[ext]=dst
          print("COPIED",found)
          if ".glb" not in found:
              raise SystemExit("InstantMesh did not return GLB")
          PY
          test -s /tmp/i2d/output/instantmesh.glb

      - name: Render generated mesh evidence
        run: |
          cat > /tmp/i2d/render_mesh.py <<'PY'
          import bpy, os, math
          from mathutils import Vector
          glb="/tmp/i2d/output/instantmesh.glb"
          ev="/tmp/i2d/evidence"
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=glb)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH" and not o.hide_render]
          if not meshes: raise RuntimeError("No mesh imported")
          pts=[]
          for o in meshes:
              for c in o.bound_box: pts.append(o.matrix_world @ Vector(c))
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene
          sc.render.engine="BLENDER_EEVEE"
          sc.render.resolution_x=1000; sc.render.resolution_y=1000; sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(0.055,0.055,0.055)
          # ground
          bpy.ops.mesh.primitive_plane_add(size=span*3, location=(center.x,center.y,mn.z-span*0.015))
          g=bpy.context.object
          gm=bpy.data.materials.new("Ground"); gm.diffuse_color=(0.16,0.16,0.16,1); g.data.materials.append(gm)
          # lighting
          bpy.ops.object.light_add(type="SUN", location=center+Vector((span, -span, span)))
          sun=bpy.context.object; sun.data.energy=2.5; sun.rotation_euler=(math.radians(35),0,math.radians(135))
          bpy.ops.object.light_add(type="AREA", location=center+Vector((-span*0.7,-span*0.9,span*0.8)))
          area=bpy.context.object; area.data.energy=700; area.data.size=span
          def track(o,t):
              o.rotation_euler=(t-o.location).to_track_quat("-Z","Y").to_euler()
          bpy.ops.object.camera_add()
          cam=bpy.context.object; cam.data.lens=58; sc.camera=cam
          views=[
            ("front",Vector((0,-1.8,0.18))),
            ("three-quarter",Vector((1.2,-1.45,0.35))),
            ("back",Vector((0,1.8,0.18))),
            ("side",Vector((1.8,0,0.18)))
          ]
          for name,v in views:
              cam.location=center+v*span
              track(cam,center+Vector((0,0,dims.z*0.05)))
              sc.render.filepath=os.path.join(ev,f"mesh-{name}.png")
              bpy.ops.render.render(write_still=True)
          tris=sum(sum(max(0,len(p.vertices)-2) for p in o.data.polygons) for o in meshes)
          with open(os.path.join(ev,"mesh-report.txt"),"w") as f:
              f.write(f"meshes={len(meshes)}\ntriangles_approx={tris}\nbounds={tuple(dims)}\nsource=InstantMesh public Space\ncredits=0\n")
          PY
          blender -b --python /tmp/i2d/render_mesh.py
          test -s /tmp/i2d/evidence/mesh-front.png
          test -s /tmp/i2d/evidence/mesh-three-quarter.png
          test -s /tmp/i2d/evidence/mesh-back.png
          test -s /tmp/i2d/evidence/mesh-side.png

      - name: Package proof
        run: |
          cp /tmp/i2d/input/eldoria-gate-crop.png /tmp/i2d/evidence/
          cp /tmp/i2d/output/instantmesh.glb /tmp/i2d/evidence/
          ls -lh /tmp/i2d/evidence

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-instantmesh-gate-capability-v1
          path: /tmp/i2d/evidence
          retention-days: 14
