name: "[PRODUCTION] Valoria Defensive Skin v1"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/valoria-production-art-defensive-skin-v1-request.json']
permissions: {contents: write}
concurrency: {group: valoria-production-art-defensive-skin-v1, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - run: |
          blender -b --python tools/valoria-production-art-starter/build_defensive_skin_v1.py
          test -s art-source/valoria/production/defensive-skin-v1/Valoria_DefensiveSkin_v1.blend
          for f in Valoria_MainGate_SkinV1 Valoria_WallSegment_SkinV1 Valoria_Tower_SkinV1; do test -s "Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/DefensiveSkinV1/$f.glb"; test -s "pipeline/evidence/valoria-production-art-defensive-skin-v1/$f.png"; done
      - run: |
          git config user.name "Eldoria Art Bot";git config user.email "actions@users.noreply.github.com"
          git add art-source/valoria/production/defensive-skin-v1 Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/DefensiveSkinV1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Valoria defensive skin v1";git fetch origin main;git rebase origin/main;git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-production-art-defensive-skin-v1
          path: |
            art-source/valoria/production/defensive-skin-v1/**
            Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/DefensiveSkinV1/*.glb
            pipeline/evidence/valoria-production-art-defensive-skin-v1/*.png
          if-no-files-found: error
