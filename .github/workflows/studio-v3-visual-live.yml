name: Studio V3 Senda visual live comparison
on:
  push:
    branches: [pilot/eldoria-studio-v3-autonomous-execution-20261126]
    paths:
      - 'tools/studio-v3/live-requests/senda-visual-paired-20261126.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-v3-senda-visual-once
  cancel-in-progress: false
jobs:
  visual-comparison:
    if: github.run_attempt == 1 && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/studio-v3
            tools/openai-development-studio
          fetch-depth: 2
      - name: Fetch pinned V2 client
        run: git fetch --no-tags --depth=1 origin 1657b2caa6b1a955319538ce3a8b2906398599b3
      - name: Recover and hash-verify original calibration archives
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/studio-v3/visual-live/dispatch.py --prepare "$RUNNER_TEMP/v3-visual-calibration"
          node tools/studio-v3/visual-live/host.mjs --verify-input "$RUNNER_TEMP/v3-visual-calibration"
      - name: Verify immutable grant, exact CI and active ownership without API key
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/studio-v3/visual-live/dispatch.py --preflight "$RUNNER_TEMP/v3-visual-calibration"
      - name: Materialize pinned actual game and install isolated Chromium
        run: |
          set -euo pipefail
          python3 tools/studio-v3/visual-benchmark/materialize.py "$RUNNER_TEMP/v3-visual-web"
          mkdir -p "$RUNNER_TEMP/v3-visual-node"
          npm install --no-save --prefix "$RUNNER_TEMP/v3-visual-node" playwright@1.55.0
          "$RUNNER_TEMP/v3-visual-node/node_modules/.bin/playwright" install chromium
      - name: Real producer, complementary roles, actual rendering and two blind judges
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
          NODE_PATH: ${{ runner.temp }}/v3-visual-node/node_modules
        run: |
          set -euo pipefail
          env -u OPENAI_API_KEY -u GH_TOKEN python3 -m http.server 8773 --bind 127.0.0.1 --directory "$RUNNER_TEMP/v3-visual-web" > /tmp/v3-live-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node tools/studio-v3/visual-live/host.mjs --live "$RUNNER_TEMP/v3-visual-calibration" "$RUNNER_TEMP/v3-visual-web" "$RUNNER_TEMP/v3-visual-live"
      - name: Preserve exact candidates, all captures, role receipts and cost ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v3-senda-visual-live
          path: ${{ runner.temp }}/v3-visual-live
          if-no-files-found: warn
          retention-days: 14
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
