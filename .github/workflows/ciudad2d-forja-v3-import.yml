name: Ciudad2D — Forja V3 arte RGBA sin sustituir originales
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-ai/pending_forja_v3_url.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-forja-v3-art-only
  cancel-in-progress: false
jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-ai/
            /Unity/Assets/Experimentos/Ciudad2D/ArtBible/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Cuartel.png.meta
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Verify actual input image hash and preserve RGBA without overwriting
        run: python tools/ciudad2d-ai/import_forja_v3.py
      - name: Preserve reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-forja-v3-source-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/
            Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/Forja_Guardia_RGBA_v3.png
          retention-days: 14
          if-no-files-found: warn
      - name: Git commit only isolated art and delete one-time URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-ai/pending_forja_v3_url.json
          git add --sparse -A -- Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/ Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/Forja_Guardia_RGBA_v3.png Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/Forja_Guardia_RGBA_v3.png.meta
          git diff --cached --quiet && { echo 'No new asset generated'; exit 1; }
          git commit -m 'art(city2d): archive source-exact Forja V3 premium sprite, unapproved'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
