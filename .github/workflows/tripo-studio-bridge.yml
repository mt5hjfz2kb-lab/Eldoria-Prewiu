name: Tripo Studio local bridge

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/tripo-studio-request.json'
  workflow_dispatch:

concurrency:
  group: eldoria-tripo-studio-bridge
  cancel-in-progress: true

jobs:
  bridge:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 5

    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: npm ci

      - name: Probe already-open Tripo Studio session
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $request = Get-Content "$env:GITHUB_WORKSPACE\pipeline\tripo-studio-request.json" -Raw | ConvertFrom-Json
          if (-not [bool]$request.enabled) {
            Write-Host "Bridge request disabled."
            exit 0
          }
          $mode = [string]$request.mode
          if ($mode -notin @('probe','stage_upload')) {
            throw "Unsupported safe bridge mode: $mode"
          }
          if ($mode -eq 'stage_upload' -and [bool]$request.allow_credit_spend) {
            throw "stage_upload cannot run with allow_credit_spend=true."
          }

          $runtimeRequestPath = "$env:RUNNER_TEMP\tripo-studio-request-runtime.json"
          if ($mode -eq 'stage_upload' -and -not [string]::IsNullOrWhiteSpace([string]$request.upload_base64_glob)) {
            $glob = Join-Path $env:GITHUB_WORKSPACE ([string]$request.upload_base64_glob)
            $parts = @(Get-ChildItem $glob -File -ErrorAction SilentlyContinue | Sort-Object Name)
            if ($parts.Count -eq 0) { throw "No exact-input base64 parts found for: $glob" }
            $chunks = foreach ($part in $parts) { (Get-Content $part.FullName -Raw).Trim() }
            $b64 = $chunks -join ''
            $bytes = [Convert]::FromBase64String($b64)
            $fileName = [string]$request.upload_file_name
            if ([string]::IsNullOrWhiteSpace($fileName)) { $fileName = 'tripo-exact-input.jpeg' }
            $dest = Join-Path $env:RUNNER_TEMP $fileName
            [IO.File]::WriteAllBytes($dest,$bytes)
            $sha = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = ([string]$request.upload_sha256).ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($expected) -or $sha -ne $expected) {
              throw "Exact Tripo input SHA mismatch. expected=$expected actual=$sha"
            }
            $request | Add-Member -NotePropertyName upload_path -NotePropertyValue $dest -Force
            Write-Host "EXACT_TRIPO_INPUT_OK: $fileName | $($bytes.Length) bytes | sha256 $sha"
          }

          $request | ConvertTo-Json -Depth 10 | Set-Content $runtimeRequestPath
          node tools/tripo-studio-bridge.mjs $runtimeRequestPath "$env:RUNNER_TEMP\tripo-studio-probe.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-tripo-studio-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/tripo-studio-probe.json
          if-no-files-found: warn
