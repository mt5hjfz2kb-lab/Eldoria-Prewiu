name: Tripo Studio local bridge

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/tripo-studio-request.json'
  workflow_dispatch:

concurrency:
  group: eldoria-tripo-studio-bridge
  cancel-in-progress: true

jobs:
  bridge:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15

    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: npm ci

      - name: Probe already-open Tripo Studio session
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $request = Get-Content "$env:GITHUB_WORKSPACE\pipeline\tripo-studio-request.json" -Raw | ConvertFrom-Json
          if (-not [bool]$request.enabled) {
            Write-Host "Bridge request disabled."
            exit 0
          }
          $mode = [string]$request.mode
          if ($mode -notin @('probe','stage_upload','generate','generate_staged','watch','export_probe','export_glb')) {
            throw "Unsupported bridge mode: $mode"
          }
          if ($mode -eq 'stage_upload' -and [bool]$request.allow_credit_spend) {
            throw "stage_upload cannot run with allow_credit_spend=true."
          }

          $runtimeRequestPath = "$env:RUNNER_TEMP\tripo-studio-request-runtime.json"
          if ($mode -in @('stage_upload','generate')) {
            $expected = ([string]$request.upload_sha256).ToLowerInvariant()
            $resolved = $null
            $transport = ([string]$request.input_transport).Trim().ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($transport)) { $transport = 'auto' }
            if ($transport -notin @('auto','repo_exact_input','runner_fallback')) {
              throw "Unsupported input_transport: $transport"
            }
            if ($transport -eq 'repo_exact_input' -and [string]::IsNullOrWhiteSpace([string]$request.upload_base64_glob)) {
              throw "repo_exact_input requires upload_base64_glob. Refusing runner search/manual fallback."
            }

            # Canonical exact-input route for ChatGPT-approved references: reconstruct repository base64 parts first.
            if (-not [string]::IsNullOrWhiteSpace([string]$request.upload_base64_glob)) {
              $glob = Join-Path $env:GITHUB_WORKSPACE ([string]$request.upload_base64_glob)
              $parts = @(Get-ChildItem $glob -File -ErrorAction SilentlyContinue | Sort-Object Name)
              if ($parts.Count -eq 0) { throw "No exact-input base64 parts found for: $glob" }
              $chunks = foreach ($part in $parts) { (Get-Content $part.FullName -Raw).Trim() }
              $b64 = $chunks -join ''
              try { $bytes = [Convert]::FromBase64String($b64) }
              catch { throw "Exact-input base64 decode failed before Tripo: $($_.Exception.Message)" }
              $fileName = [string]$request.upload_file_name
              if ([string]::IsNullOrWhiteSpace($fileName)) { $fileName = 'tripo-exact-input.jpeg' }
              $dest = Join-Path $env:RUNNER_TEMP $fileName
              [IO.File]::WriteAllBytes($dest,$bytes)
              $resolved = $dest
              Write-Host "EXACT_TRIPO_INPUT_RECONSTRUCTED: parts=$($parts.Count) | path=$dest"
            }

            if ($transport -eq 'repo_exact_input' -and -not $resolved) {
              throw "Repository exact-input did not reconstruct. Refusing Downloads/Desktop fallback."
            }

            # Downloads/Desktop discovery is fallback only when no repository exact-input resolved.
            if (-not $resolved -and $transport -ne 'repo_exact_input' -and [bool]$request.search_downloads_for_sha -and -not [string]::IsNullOrWhiteSpace($expected)) {
              $expectedBytes = [int64]$request.upload_size_bytes
              $roots = @(
                (Join-Path $env:USERPROFILE 'Downloads'),
                (Join-Path $env:USERPROFILE 'Desktop'),
                (Join-Path $env:USERPROFILE 'Pictures'),
                (Join-Path $env:USERPROFILE 'OneDrive'),
                (Join-Path $env:USERPROFILE 'iCloudPhotos'),
                (Join-Path $env:USERPROFILE 'iCloudDrive')
              ) | Select-Object -Unique
              foreach ($root in $roots) {
                if ($resolved) { break }
                if (-not (Test-Path $root)) { continue }
                $candidates = @(Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.Extension.ToLowerInvariant() -in @('.jpg','.jpeg','.png','.webp') -and
                    ($expectedBytes -le 0 -or $_.Length -eq $expectedBytes)
                  })
                foreach ($candidate in $candidates) {
                  $sha = (Get-FileHash $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($sha -eq $expected) {
                    $resolved = $candidate.FullName
                    Write-Host "EXACT_TRIPO_INPUT_FOUND: $($candidate.FullName) | $($candidate.Length) bytes | sha256 $sha"
                    break
                  }
                }
              }
            }

            if (-not $resolved -and $transport -ne 'repo_exact_input' -and -not [string]::IsNullOrWhiteSpace([string]$request.visual_sample_dhash)) {
              Add-Type -AssemblyName System.Drawing
              $targetHash = [Convert]::ToUInt64(([string]$request.visual_sample_dhash),16)
              $targetW = [int]$request.visual_width
              $targetH = [int]$request.visual_height
              function Get-HammingDistance([UInt64]$a,[UInt64]$b) {
                $x = $a -bxor $b
                $n = 0
                while ($x -ne 0) { $n += [int]($x -band 1); $x = $x -shr 1 }
                return $n
              }
              function Get-SampleDHash([string]$path) {
                $bmp = $null
                try {
                  $bmp = [System.Drawing.Bitmap]::FromFile($path)
                  if ($targetW -gt 0 -and $targetH -gt 0 -and ($bmp.Width -ne $targetW -or $bmp.Height -ne $targetH)) { return $null }
                  [UInt64]$v = 0
                  for ($yi=0; $yi -lt 8; $yi++) {
                    $y = [int][Math]::Round($yi*($bmp.Height-1)/7.0)
                    for ($xi=0; $xi -lt 8; $xi++) {
                      $x1 = [int][Math]::Round($xi*($bmp.Width-1)/8.0)
                      $x2 = [int][Math]::Round(($xi+1)*($bmp.Width-1)/8.0)
                      $p1=$bmp.GetPixel($x1,$y); $p2=$bmp.GetPixel($x2,$y)
                      $l1=299*$p1.R+587*$p1.G+114*$p1.B
                      $l2=299*$p2.R+587*$p2.G+114*$p2.B
                      $v = ($v -shl 1)
                      if ($l1 -gt $l2) { $v = $v -bor [UInt64]1 }
                    }
                  }
                  return $v
                } catch { return $null }
                finally { if ($bmp) { $bmp.Dispose() } }
              }

              $matches = @()
              foreach ($root in $roots) {
                if (-not (Test-Path $root)) { continue }
                $visualCandidates = @(Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.Extension.ToLowerInvariant() -in @('.jpg','.jpeg','.png','.bmp') })
                foreach ($candidate in $visualCandidates) {
                  $h = Get-SampleDHash $candidate.FullName
                  if ($null -eq $h) { continue }
                  $distance = Get-HammingDistance $targetHash $h
                  if ($distance -le 4) {
                    $matches += [pscustomobject]@{File=$candidate;Distance=$distance;Hash=('{0:x16}' -f $h)}
                    Write-Host "VISUAL_MATCH_CANDIDATE: distance=$distance | $($candidate.FullName)"
                  }
                }
              }
              if ($matches.Count -eq 1) {
                $candidate=$matches[0].File
                $ext=$candidate.Extension.ToLowerInvariant()
                $evidence=Join-Path $env:RUNNER_TEMP ("tripo-visual-match-candidate"+$ext)
                Copy-Item $candidate.FullName $evidence -Force
                @(
                  "candidate_path=$($candidate.FullName)",
                  "candidate_bytes=$($candidate.Length)",
                  "candidate_dhash=$($matches[0].Hash)",
                  "hamming_distance=$($matches[0].Distance)",
                  "expected_source_sha256=$expected"
                ) | Set-Content "$env:RUNNER_TEMP\tripo-visual-match-report.txt"
                throw "A single visual-match candidate was found and exported for review. It was NOT uploaded to Tripo."
              } elseif ($matches.Count -gt 1) {
                throw "Multiple visual-match candidates found ($($matches.Count)); none was uploaded to Tripo."
              }
            }


            if (-not $resolved -and $transport -ne 'repo_exact_input' -and -not [string]::IsNullOrWhiteSpace([string]$request.upload_path)) {
              $resolved = [string]$request.upload_path
            }

            $renderSvg = [string]$request.render_svg_path
            if (-not [string]::IsNullOrWhiteSpace($renderSvg)) {
              $svgResolved = if ([IO.Path]::IsPathRooted($renderSvg)) { $renderSvg } else { Join-Path $env:GITHUB_WORKSPACE $renderSvg }
              if (-not (Test-Path $svgResolved)) { throw "SVG render source not found: $svgResolved" }
              $svgSha = (Get-FileHash $svgResolved -Algorithm SHA256).Hash.ToLowerInvariant()
              $expectedSvg = ([string]$request.render_svg_sha256).ToLowerInvariant()
              if (-not [string]::IsNullOrWhiteSpace($expectedSvg) -and $svgSha -ne $expectedSvg) {
                throw "SVG render source SHA mismatch. expected=$expectedSvg actual=$svgSha"
              }
              $request | Add-Member -NotePropertyName render_svg_path -NotePropertyValue $svgResolved -Force
              $request | Add-Member -NotePropertyName upload_path -NotePropertyValue "" -Force
              Write-Host "TRIPO_RENDER_SVG_OK: $svgResolved | sha256 $svgSha"
            } else {
              if (-not $resolved -or -not (Test-Path $resolved)) {
                throw "Exact Tripo input image not found on runner. No upload or credit-spend action was attempted."
              }
              $actual = (Get-FileHash $resolved -Algorithm SHA256).Hash.ToLowerInvariant()
              if ([string]::IsNullOrWhiteSpace($expected) -or $actual -ne $expected) {
                throw "Exact Tripo input SHA mismatch. expected=$expected actual=$actual"
              }
              $size = (Get-Item $resolved).Length
              if ([int64]$request.upload_size_bytes -ne $size) {
                throw "Exact Tripo input size mismatch. expected=$($request.upload_size_bytes) actual=$size"
              }
              $request | Add-Member -NotePropertyName upload_path -NotePropertyValue $resolved -Force
              @(
                "asset_name=$([string]$request.asset_name)",
                "file_name=$([IO.Path]::GetFileName($resolved))",
                "bytes=$size",
                "sha256=$actual",
                "mode=$mode",
                "allow_credit_spend=$([bool]$request.allow_credit_spend)"
              ) | Set-Content "$env:RUNNER_TEMP\tripo-exact-input-identity.txt"
              Write-Host "EXACT_TRIPO_INPUT_OK: $resolved | $size bytes | sha256 $actual"
            }
          }

          $request | ConvertTo-Json -Depth 10 | Set-Content $runtimeRequestPath
          node tools/tripo-studio-bridge.mjs $runtimeRequestPath "$env:RUNNER_TEMP\tripo-studio-probe.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-tripo-studio-bridge-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tripo-studio-probe.json
            ${{ runner.temp }}/tripo-studio-before-upload.png
            ${{ runner.temp }}/tripo-studio-after-upload.png
            ${{ runner.temp }}/tripo-upload-verification.json
            ${{ runner.temp }}/tripo-flow-state.json
            ${{ runner.temp }}/tripo-rendered-input.png
            ${{ runner.temp }}/tripo-studio-after-generate.png
            ${{ runner.temp }}/tripo-studio-probe.png
            ${{ runner.temp }}/tripo-studio-after-watch.png
            ${{ runner.temp }}/tripo-studio-export-options.png
            ${{ runner.temp }}/tripo-studio-after-export.png
            ${{ runner.temp }}/tripo-studio-error.png
            ${{ runner.temp }}/tripo-visual-match-candidate.*
            ${{ runner.temp }}/tripo-visual-match-report.txt
            ${{ runner.temp }}/tripo-exact-input-identity.txt
          if-no-files-found: warn
