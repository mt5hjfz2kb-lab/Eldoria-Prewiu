name: Eldoria current disk space snapshot
on:
  push:
    branches: [maintenance/eldoria-runner-disk-audit-20261114]
    paths: [.github/workflows/eldoria-current-storage-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 10
    steps:
      - name: Measure current physical disk, runner and Eldoria repository workspaces (read-only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $drive=[IO.DriveInfo]::new('C')
          [double]$gib=1024*1024*1024
          Write-Host ("CURRENT_DISK_C totalGiB={0:N2} usedGiB={1:N2} freeGiB={2:N2}" -f ($drive.TotalSize/$gib),(($drive.TotalSize-$drive.AvailableFreeSpace)/$gib),($drive.AvailableFreeSpace/$gib))
          $root='C:\actions-runner-eldoria\_work'
          $project=Join-Path $root 'Eldoria-Prewiu\Eldoria-Prewiu'
          $deadline=[datetime]::UtcNow.AddMinutes(8)
          function Get-TreeSize {
            param([string]$Path,[string]$Category)
            [long]$bytes=0;[long]$files=0;[long]$errors=0;[long]$links=0
            $stack=New-Object 'System.Collections.Generic.Stack[string]'
            $stack.Push($Path)
            [bool]$partial=$false
            while($stack.Count -gt 0){
              if([datetime]::UtcNow -ge $deadline){$partial=$true;break}
              $next=$stack.Pop()
              try {
                foreach($f in ([IO.DirectoryInfo]::new($next)).EnumerateFileSystemInfos()){
                  try{
                    if($f.Attributes -band [IO.FileAttributes]::ReparsePoint){$links++;continue}
                    if($f -is [IO.DirectoryInfo]){$stack.Push($f.FullName)}
                    else{$bytes+=[long]$f.Length;$files++}
                  }catch{$errors++}
                }
              }catch{$errors++}
            }
            Write-Host ("CURRENT_STORAGE category={0} GiB={1:N3} files={2} errors={3} linksSkipped={4} partial={5}" -f $Category,($bytes/$gib),$files,$errors,$links,$partial)
          }
          Get-TreeSize -Path $project -Category 'eldoria-repository-and-builds'
          Get-TreeSize -Path $root -Category 'complete-actions-workdir'
          Write-Host ("CURRENT_DISK_C_AFTER freeGiB={0:N2}" -f ($drive.AvailableFreeSpace/$gib))
