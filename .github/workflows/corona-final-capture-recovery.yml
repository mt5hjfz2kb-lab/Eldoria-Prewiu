name: Corona exact-player visual capture recovery
on:
  push:
    branches: [candidate/corona-final-capture-recovery-20261126]
    paths: ['.github/workflows/corona-final-capture-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  capture-exact-player:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == '746fc259aacc1ffe3ff74c563c950feb504b4f04' && github.event.head_commit.message == 'QA recovery: reuse exact compiled player and real Council reset for final scoring' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/corona-art-iteration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 41c124f4b9ef10cd9b4a9d87562a7d2727b730b6
          path: harness
          sparse-checkout: tools/valoria-modular25d
          persist-credentials: false
      - name: Verify exact compiled source and download its player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45842935818" --jq .head_sha)" = "41c124f4b9ef10cd9b4a9d87562a7d2727b730b6"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45842935818/jobs" --jq '.jobs[] | select(.name=="unity") | .conclusion' | grep -x success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45842935818/artifacts" --jq '.artifacts[] | select(.id==15132786548 and .name=="valoria-region1-webgl" and .expired==false) | .id' | grep -x 15132786548
          gh run download 45842935818 --repo "$GITHUB_REPOSITORY" --name valoria-region1-webgl --dir player
      - name: Traverse full original I-V journey with real scroll reset
        env:
          VALORIA_DPR: '1'
          VALORIA_EVIDENCE: evidence
          VALORIA_TEST_REGION: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright==1.56.0 Pillow==11.3.0
          python3 -m playwright install ffmpeg
          python3 tools/corona-art-iteration/recover_council_journey.py harness/tools/valoria-modular25d/journey-browser.py recovery-journey.py
          python3 harness/tools/valoria-modular25d/journey-serve.py player 8824 &
          python3 -u recovery-journey.py 'http://127.0.0.1:8824/index.html?journey-qa'
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('evidence')
          j=json.loads((p/'journey.json').read_text())
          assert j['last']['level']==5 and j['last']['stoneworks']==1
          assert j['viewport']==[390,844]
          (p/'capture-source.json').write_text(json.dumps({'player_source_sha':'41c124f4b9ef10cd9b4a9d87562a7d2727b730b6','player_run':45842935818,'player_artifact':15132786548,'harness_run':int(os.environ['GITHUB_RUN_ID']),'harness_sha':os.environ['GITHUB_SHA'],'dpr':1,'art_approved':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-ciudad-region-recorrido
          path: evidence/
          if-no-files-found: warn
      - name: Assemble actual before/after pairs with player source, not harness SHA
        env:
          GH_TOKEN: ${{ github.token }}
          VALORIA_DPR: '1'
        run: |
          set -euo pipefail
          gh run download 45638738009 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir baseline
          GITHUB_SHA=41c124f4b9ef10cd9b4a9d87562a7d2727b730b6 python3 harness/tools/valoria-modular25d/corona-ab-evidence.py baseline evidence ui
          python3 harness/tools/valoria-modular25d/world-art-ab.py baseline evidence spatial --baseline-sha 5ef2aee67cf8fde57ba2fc4b3d929b517ee67944 --candidate-sha 41c124f4b9ef10cd9b4a9d87562a7d2727b730b6
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-corona-before-after-dpr1
          path: ui/
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-world-city-spatial-before-after
          path: spatial/
  review-exact-player:
    needs: capture-exact-player
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/corona-art-iteration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1657b2caa6b1a955319538ce3a8b2906398599b3
          path: studio-source
          sparse-checkout: tools/openai-development-studio
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: recovery-ciudad-region-recorrido
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: recovery-corona-before-after-dpr1
          path: ui
      - name: Verify and retrieve completed independent baseline, native and auxiliary proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          gh run download 45638738009 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir baseline
          gh run download 45837717094 --repo "$GITHUB_REPOSITORY" --name corona-auxiliary-original --dir aux-base
          gh run download 45844755669 --repo "$GITHUB_REPOSITORY" --name corona-final-auxiliary-real-ab --dir aux-evidence
          gh run download 45842935818 --repo "$GITHUB_REPOSITORY" --name region1-cameras-and-routes --dir native
          gh run download 45844200241 --repo "$GITHUB_REPOSITORY" --name corona-original-weight-calibrated-scorecard --dir resume
          gh run download 45812100129 --repo "$GITHUB_REPOSITORY" --name corona-agent-art-plan --dir references
          python3 -m py_compile tools/corona-art-iteration/recovered_final_calibrated_review.py
      - name: Execute only the original seven unspent final-review reservations
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 tools/corona-art-iteration/recovered_final_calibrated_review.py --ui ui --baseline baseline --candidate candidate --aux aux-evidence/aux --aux-base aux-base --aux-after aux-evidence/aux-after --native native --references references --rubric tools/corona-art-iteration/calibrated-rubric-20261124.json --studio studio-source/tools/openai-development-studio --out final-calibrated --resume resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-final-exact-revision-calibrated-scorecard
          path: final-calibrated/
          if-no-files-found: warn
