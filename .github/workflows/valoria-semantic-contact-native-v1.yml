name: "[VALORIA] Isolated gate contact correction in real SHARP player camera"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-semantic-contact-native-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaSharpSemanticContactRepairV1.cs'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-exclusive-semantic-contact-v1
  cancel-in-progress: false
jobs:
  native-unity:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    defaults:
      run:
        working-directory: valoria-semantic-contact-v1
    steps:
      - name: Resolve existing GitHub Desktop Git
        working-directory: .
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Installed GitHub Desktop git.exe missing'}
            Add-Content $env:GITHUB_PATH (Split-Path $git)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-semantic-contact-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-semantic-contact-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Exclusive runner lease and reference gate
        shell: powershell
        run: |
          $reg=Get-Content "$env:GITHUB_WORKSPACE/valoria-semantic-contact-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $id='valoria-master-plan-layered-construction-20261016'
          $own=@($reg.active|Where-Object {$_.id -eq $id})
          $other=@($reg.active|Where-Object {$_.id -ne $id -and $_.resources -contains 'windows-runner-heavy'})
          if($own.Count -ne 1 -or $other.Count){throw 'Invalid or contested Windows ownership'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'PC busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Actual Unity 6000.3.23f1 unavailable'}
          $hash=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Art authority changed'}
      - name: Native Unity targeted gate-only selection fix using REAL player camera
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria-real-sharp-semantic-contact.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-semantic-contact-v1/Unity",
            '-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaSharpSemanticContactRepairV1.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2700000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Unity semantic collider diagnostic timed out'
          }
          Get-Content $log -Tail 120
          $ev='docs/evidence/valoria-layered-construction-20261016/semantic-contact-v1'
          New-Item -ItemType Directory -Force -Path $ev | Out-Null
          Copy-Item $log "$ev/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_SHARP_PHYSICAL_SEMANTIC_CORRECTION_COMPLETE' -Quiet)){
             throw "Native contact repair failed exit=$($p.ExitCode)"
          }
      - name: Validate actual scene saved, 7 collider hits, 6 viewport frames and unchanged camera
        shell: powershell
        run: |
          $e='docs/evidence/valoria-layered-construction-20261016/semantic-contact-v1'
          $scene='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_SemanticContact_IsolatedV1.unity'
          if(-not(Test-Path $scene)){throw 'Missing actual trial Unity scene'}
          foreach($n in @('native-semantic-contacts.json','semantic-v1-player-home.png',
            'semantic-v1-player-pan-left.png','semantic-v1-player-pan-right.png',
            'semantic-v1-player-zoom-in.png','semantic-v1-player-zoom-out.png','semantic-v1-player-portrait.png')){
              if(-not(Test-Path "$e/$n")){throw "No native evidence $n"}
          }
          $d=Get-Content "$e/native-semantic-contacts.json" -Raw|ConvertFrom-Json
          if($d.home_matches -ne 7 -or $d.home_required -ne 7 -or
            $d.pan_zoom_matches -ne $d.pan_zoom_required -or -not $d.reference_camera_unmodified -or
            -not $d.only_existing_hotspot_extended -or $d.canonical_modified){
            throw 'Semantic or authority constraints fail'
          }
          Write-Host "VALORIA_SHARP_SEMANTIC_TECH_PASS, gameplay and visual still pending"
      - name: Commit trial Unity scene and actual captures only to exclusive source branch
        shell: powershell
        run: |
          git config user.name 'Valoria spatial contact worker'
          git config user.email 'valoria-physical-semantic@users.noreply.github.com'
          git add -f -- docs/evidence/valoria-layered-construction-20261016/semantic-contact-v1/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_SemanticContact_IsolatedV1.unity
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): native SHARP seven-click physical contacts in isolated new scene'
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch advanced: preserve artifact, never force push'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-semantic-contact-native-${{ github.run_id }}
          path: |
            valoria-semantic-contact-v1/docs/evidence/valoria-layered-construction-20261016/semantic-contact-v1/**
            valoria-semantic-contact-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_SemanticContact_IsolatedV1.unity
          if-no-files-found: warn
          retention-days: 30
