name: "[PRODUCTION] Valoria Secondary Support Form Replacement v1"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/valoria-secondary-support-form-replacement-v1-request.json
concurrency:
  group: valoria-secondary-support-form-replacement-v1
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 45
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { ref: main, clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Capture matched BEFORE AFTER secondary support evidence
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaSecondarySupportFormReplacementV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaSecondarySupportFormReplacementV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaSecondarySupportFormReplacementGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(34)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'secondary support replacement gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "secondary support replacement gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - name: Focused gameplay tests
        shell: powershell
        run: |
          $xml="$env:RUNNER_TEMP\SecondarySupportReplacement-PlayMode.xml"
          $log="$env:RUNNER_TEMP\SecondarySupportReplacement-PlayMode.log"
          $filter='Eldoria.Tests.ReferenceUiArtPassTests;OwnerHudMatchesReferenceMobileBudgets;ValoriaProgressionContractGatesCuartelVisualAndInteraction'
          $args=@('-batchmode','-nographics','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-runTests','-testPlatform','PlayMode','-testFilter',$filter,'-testResults',$xml,'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(600000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'secondary support replacement tests timed out'}
          if($p.ExitCode -ne 0){Get-Content $log -Tail 220;throw "secondary support replacement tests failed $($p.ExitCode)"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-secondary-support-form-replacement-v1
          path: Unity/ValoriaSecondarySupportFormReplacementV1Captures/*
          if-no-files-found: warn
          retention-days: 30
