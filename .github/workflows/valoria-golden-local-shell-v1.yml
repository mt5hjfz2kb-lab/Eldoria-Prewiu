name: "[PRODUCTION] Golden Primary Forms Reauthor v1"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/golden-local-shell-v1-request.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: valoria-golden-primary-forms-v1
  cancel-in-progress: true

jobs:
  author:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    steps:
      - name: Prepare clean source02 workspace
        id: prepare
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            $env:PATH="$dir;$env:PATH"
          }
          $work=Join-Path $env:RUNNER_TEMP ("golden_source02_"+$env:GITHUB_RUN_ID)
          if(Test-Path $work){Remove-Item -Recurse -Force $work}
          git clone --depth 1 --branch main https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git $work
          if($LASTEXITCODE -ne 0){throw "Fresh clone failed $LASTEXITCODE"}
          "workdir=$work" >> $env:GITHUB_OUTPUT
      - name: Validate professional route
        shell: powershell
        working-directory: ${{ steps.prepare.outputs.workdir }}
        run: |
          node tools/plan-art-production.mjs
          node tools/validate-blender-professional-authoring.mjs
      - name: Resolve Blender
        id: blender
        shell: powershell
        run: |
          $cmd=Get-Command blender.exe -ErrorAction SilentlyContinue
          if($cmd){$exe=$cmd.Source}
          if(-not $exe){
            $found=Get-ChildItem "$env:ProgramFiles\Blender Foundation" -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if($found){$exe=$found.FullName}
          }
          if(-not $exe){throw 'Blender executable unavailable'}
          & $exe --version
          "exe=$exe" >> $env:GITHUB_OUTPUT
      - name: Author Golden primary forms source02
        shell: powershell
        working-directory: ${{ steps.prepare.outputs.workdir }}
        run: |
          & "${{ steps.blender.outputs.exe }}" -b --python-exit-code 1 --python tools/author-golden-primary-forms-source02.py
          if($LASTEXITCODE -ne 0){throw "Blender authoring failed $LASTEXITCODE"}
          $required=@(
            'art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/source02/GoldenPrimaryFormsV1_source02.glb',
            'art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/source02/GoldenPrimaryFormsV1_source02.blend',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source-report.json',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source02-clay-silhouette.png',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source02-lit-three-quarter.png',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source02-official-proxy.png'
          )
          foreach($p in $required){if(-not(Test-Path $p)){throw "Missing source02 evidence: $p"}}
      - name: Persist clean source02 review evidence
        shell: powershell
        working-directory: ${{ steps.prepare.outputs.workdir }}
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02
          if(-not (git diff --cached --quiet)){
            git commit -m "Persist Golden primary forms source02 evidence"
            git pull --rebase origin main
            if($LASTEXITCODE -ne 0){throw "Rebase before evidence push failed $LASTEXITCODE"}
            git push origin HEAD:main
            if($LASTEXITCODE -ne 0){throw "Evidence push failed $LASTEXITCODE"}
          }
      - name: Record clean source02 run status
        if: always()
        shell: powershell
        working-directory: ${{ steps.prepare.outputs.workdir }}
        run: |
          $dir='docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $status=@{
            run_id=$env:GITHUB_RUN_ID
            run_attempt=$env:GITHUB_RUN_ATTEMPT
            head_sha=$env:GITHUB_SHA
            runner=$env:RUNNER_NAME
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $dir 'run-status.json') -Value $status
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$dir/run-status.json"
          if(-not (git diff --cached --quiet)){
            git commit -m "Record Golden primary forms source02 run status"
            git pull --rebase origin main
            if($LASTEXITCODE -eq 0){git push origin HEAD:main}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-primary-forms-v1-source02-review
          path: |
            ${{ steps.prepare.outputs.workdir }}/art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/source02/*
            ${{ steps.prepare.outputs.workdir }}/docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/*
          if-no-files-found: error
          retention-days: 30
