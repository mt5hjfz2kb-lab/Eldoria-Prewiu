name: "[PRODUCTION] Golden Primary Forms Reauthor v1"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/golden-local-shell-v1-request.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: valoria-golden-primary-forms-v1
  cancel-in-progress: true

jobs:
  author:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'};$dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Validate professional route
        shell: powershell
        run: |
          node tools/plan-art-production.mjs
          node tools/validate-blender-professional-authoring.mjs
      - name: Resolve Blender
        id: blender
        shell: powershell
        run: |
          $cmd=Get-Command blender.exe -ErrorAction SilentlyContinue
          if($cmd){$exe=$cmd.Source}
          if(-not $exe){
            $found=Get-ChildItem "$env:ProgramFiles\Blender Foundation" -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if($found){$exe=$found.FullName}
          }
          if(-not $exe){throw 'Blender executable unavailable on claimed Windows runner'}
          & $exe --version
          "exe=$exe" >> $env:GITHUB_OUTPUT
      - name: Author Golden primary forms
        shell: powershell
        run: |
          & "${{ steps.blender.outputs.exe }}" -b --python-exit-code 1 --python tools/author-golden-primary-forms-v1.py
          if($LASTEXITCODE -ne 0){throw "Blender authoring failed $LASTEXITCODE"}
          $required=@(
            'art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.glb',
            'art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.blend',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source-report.json',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-clay-silhouette.png',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-lit-three-quarter.png',
            'docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-official-proxy.png'
          )
          foreach($p in $required){if(-not(Test-Path $p)){throw "Missing evidence: $p"}}
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-primary-forms-v1-review
          path: |
            art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/*
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/*
          if-no-files-found: error
          retention-days: 30
