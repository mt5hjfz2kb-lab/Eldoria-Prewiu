name: "[PRODUCTION] Golden Primary Forms Reauthor v1"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/golden-local-shell-v1-request.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: valoria-golden-primary-forms-v1
  cancel-in-progress: true

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate professional route
        run: |
          node tools/plan-art-production.mjs
          node tools/validate-blender-professional-authoring.mjs
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Author Golden primary forms
        run: |
          blender -b --python-exit-code 1 --python tools/author-golden-primary-forms-v1.py
          test -s art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.glb
          test -s art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.blend
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source-report.json
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-clay-silhouette.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-lit-three-quarter.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-official-proxy.png
      - name: Persist isolated evidence
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1
          if ! git diff --cached --quiet; then
            git commit -m "Persist Golden primary forms evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-primary-forms-v1-source
          path: |
            art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/*
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/*
          if-no-files-found: error
          retention-days: 30
