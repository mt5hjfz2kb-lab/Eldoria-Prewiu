name: "[PRODUCTION] Golden Primary Forms Minimal Proof"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/golden-local-shell-v1-request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: valoria-golden-primary-forms-minimal-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Generate Golden primary forms evidence
        run: |
          blender -b --python-exit-code 1 --python tools/author-golden-primary-forms-v1.py

      - name: Verify evidence
        run: |
          test -s art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.glb
          test -s art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.blend
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source-report.json
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-clay-silhouette.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-lit-three-quarter.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-official-proxy.png
          echo "Golden Primary Forms evidence generated successfully."

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-primary-forms-minimal-proof
          path: |
            art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.glb
            art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/GoldenPrimaryFormsV1.blend
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source-report.json
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-clay-silhouette.png
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-lit-three-quarter.png
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/primary-official-proxy.png
          if-no-files-found: error
          retention-days: 30
