name: "[EXPERIMENT] Valoria Compact Footprint Reframe v1"
on:
  push:
    branches: ['visual-proof/valoria-compact-footprint-reframe-v1']
    paths:
      - 'pipeline/art-production-request.json'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaCompactFootprintReframeGate.cs'
  workflow_dispatch:
  pull_request:
    branches: ['main']
    paths:
      - 'pipeline/art-production-request.json'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaCompactFootprintReframeGate.cs'

permissions:
  contents: write
concurrency:
  group: valoria-compact-footprint-reframe-v1
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'};$dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: {clean: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Toolchain Automation v2 route
        shell: powershell
        run: |
          node tools/plan-art-production.mjs pipeline/art-production-request.json "$env:RUNNER_TEMP\art-production-plan.json"
          $p=Get-Content "$env:RUNNER_TEMP\art-production-plan.json" | ConvertFrom-Json
          if($p.profile -ne 'environment_composition'){throw 'profile must be environment_composition'}
          if($p.geometry_gap_proven){throw 'geometry_gap_proven must be false'}
          if($p.tripo_allowed){throw 'Tripo must be disabled'}
          if($p.authorized_credit_cost -ne 0){throw 'authorized credit cost must be zero'}
      - name: Capture matched BEFORE AFTER
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaCompactFootprintReframeCaptures";$log="$env:RUNNER_TEMP\Valoria-CompactFootprint-v1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-refreshImportMode','InProcess','-job-worker-count','1','-executeMethod','Eldoria.EditorTools.ValoriaCompactFootprintReframeGate.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 500};throw "Compact footprint gate failed: $($p.ExitCode)"}
          foreach($n in @('before-19.png','before-12.png','before-9.png','before-mobile.png','after-19.png','after-12.png','after-9.png','after-mobile.png','evidence.json')){$f=Join-Path $folder $n;if(-not(Test-Path $f)){throw "Missing $n"}}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: valoria-compact-footprint-reframe-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaCompactFootprintReframeCaptures/*
            ${{ runner.temp }}/art-production-plan.json
            ${{ runner.temp }}/Valoria-CompactFootprint-v1.log
          if-no-files-found: warn
          retention-days: 14

      - name: Persist run pointer
        if: always()
        shell: powershell
        run: |
          $doc="$env:GITHUB_WORKSPACE\docs\VALORIA_COMPACT_FOOTPRINT_REFRAME_V1_RUN_POINTER.md"
          $evidence="$env:GITHUB_WORKSPACE\Unity\ValoriaCompactFootprintReframeCaptures\evidence.json"
          $status=if(Test-Path $evidence){Get-Content $evidence -Raw}else{'evidence unavailable'}
          @"
# VALORIA COMPACT FOOTPRINT REFRAME v1 — RUN POINTER

Run: `${env:GITHUB_RUN_ID}`
Artifact: `${{ steps.upload.outputs.artifact-id }}`
Commit: `${env:GITHUB_SHA}`

## Evidence

```json
$status
```
"@ | Set-Content -Path $doc -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VALORIA_COMPACT_FOOTPRINT_REFRAME_V1_RUN_POINTER.md
          if(-not (git diff --cached --quiet)){git commit -m "ci: record compact footprint proof run [skip ci]";git push}
