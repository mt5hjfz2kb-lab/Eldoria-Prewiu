name: "[ART FOLIAGE V5] Five genuinely denser shrubs and grasses CC0"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-five-cc0-bushes-grasses.yml'
      - 'tools/valoria-modular-fortress/art_direct_five_vegetation_v5.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-five-real-leaf-plants-not-scene
  cancel-in-progress: false
jobs:
  bush-and-grass-artist-finishing:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 95
    steps:
      - name: Find installed PC Git and Blender
        id: bin
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git unavailable'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-12-independent-blender-v4-38819524063
          run-id: 38819524063
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/plant_cc0_source
      - name: Actual CC0 plant geometry and 10 matched A-B renders
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'plant_cc0_source\eldoria-individual-cc0-v4\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-five-real-olive-foliage'
          foreach($file in @('shrub_1.glb','shrub_2.glb','shrub_3.glb','grass_tuft_1.glb','grass_tuft_2.glb')){
            if(-not(Test-Path (Join-Path $src $file))){throw "Missing CC0 leaf source $file"}
          }
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/art_direct_five_vegetation_v5.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned source unavailable'}
          $script=Join-Path $env:RUNNER_TEMP 'valoria-five-plant-art.py'
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'valoria-five-plants.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-five-plants.err'
          $p=Start-Process -FilePath "${{ steps.bin.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 45 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "CC0 plants sculpt failure $($p.ExitCode)"}
          foreach($fld in @('glb','before','after')){
            if((Get-ChildItem (Join-Path $out $fld) -File).Count -ne 5){throw "Need 5 true $fld candidates"}
          }
      - name: Preserve artist A-B and licensed CC0 models pending human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-five-true-vegetation-v5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-five-real-olive-foliage/**
            ${{ runner.temp }}/valoria-five-plants.log
            ${{ runner.temp }}/valoria-five-plants.err
          retention-days: 30
          if-no-files-found: warn
