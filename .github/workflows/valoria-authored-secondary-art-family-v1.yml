name: "[EXPERIMENT] Valoria Authored Secondary Art Family v1"

on:
  push:
    branches: [visual-proof/valoria-authored-secondary-art-family-v1]
    paths:
      - "tools/valoria-authored-secondary-art-family/**"
      - ".github/workflows/valoria-authored-secondary-art-family-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valoria-authored-secondary-art-family-v1
  cancel-in-progress: true

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Toolchain Automation v2 route
        shell: bash
        run: node tools/plan-art-production.mjs pipeline/art-production-request.json "$RUNNER_TEMP/valoria-authored-secondary-route.json"
      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build authored proof family
        shell: bash
        env:
          ELDORIA_AUTHORED_FAMILY_DIR: ${{ github.workspace }}/pipeline/candidates/valoria-authored-secondary-art-family-v1
          ELDORIA_AUTHORED_FAMILY_REPORT: ${{ github.workspace }}/pipeline/evidence/valoria-authored-secondary-art-family-v1.json
          ELDORIA_CANONICAL_SAWMILL: ${{ github.workspace }}/Unity/Assets/Eldoria/Resources/Valoria/Valoria_Aserradero_AP2_v1.glb
        run: |
          rm -rf pipeline/candidates/valoria-authored-secondary-art-family-v1
          rm -f pipeline/evidence/valoria-authored-secondary-art-family-v1.json
          mkdir -p pipeline/candidates/valoria-authored-secondary-art-family-v1 pipeline/evidence
          set -o pipefail
          blender -b --python tools/valoria-authored-secondary-art-family/build_family.py | tee "$RUNNER_TEMP/valoria-authored-secondary-blender.log"
          grep -q "VALORIA_AUTHORED_SECONDARY_FAMILY=PASS" "$RUNNER_TEMP/valoria-authored-secondary-blender.log"
          test -s pipeline/evidence/valoria-authored-secondary-art-family-v1.json
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/Valoria_Authored_Aserradero_v1.glb
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/Valoria_Authored_Wall_v1.glb
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/Valoria_Authored_Gate_v1.glb
          python3 - <<'PY'
          import json
          p='pipeline/evidence/valoria-authored-secondary-art-family-v1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('schema_version')==2,d
          a=d['assets'][0]
          assert a['file']=='Valoria_Authored_Aserradero_v1.glb',a
          assert a['triangles']==49800,a
          assert len(a.get('materials',[]))>=3,a
          assert a.get('semantic_face_counts'),a
          print('AUTHORED_FAMILY_EVIDENCE=PASS')
          PY
          cat pipeline/evidence/valoria-authored-secondary-art-family-v1.json
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: valoria-authored-secondary-art-family-v1-${{ github.run_id }}
          path: |
            pipeline/evidence/valoria-authored-secondary-art-family-v1.json
            pipeline/candidates/valoria-authored-secondary-art-family-v1/*.glb
          if-no-files-found: error
      - name: Persist authored proof family
        shell: bash
        run: |
          git config user.name "eldoria-ci"
          git config user.email "actions@github.com"
          git add -A pipeline/evidence/valoria-authored-secondary-art-family-v1.json pipeline/candidates/valoria-authored-secondary-art-family-v1
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist authored secondary family ${{ github.run_id }}"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
