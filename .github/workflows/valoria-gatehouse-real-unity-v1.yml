name: Valoria gatehouse exact GLB Unity visual proof V1
on:
  push:
    branches:
      - integration/valoria-gatehouse-unity-v1-20261011
    paths:
      - '.github/workflows/valoria-gatehouse-real-unity-v1.yml'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaGatehouseRealUnityV1.cs'
      - 'tools/art-rd/valoria_visual_slice_environment_v2.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: valoria-gatehouse-real-unity-v1
  cancel-in-progress: false
jobs:
  capture:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Find Git executable
        shell: powershell
        run: |
          $gitPath = Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Recurse -Filter git.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $gitPath) { throw 'git.exe unavailable' }
          Add-Content $env:GITHUB_PATH (Split-Path $gitPath)
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/valoria-gatehouse-unity-v1-20261011
          clean: false
      - name: Produce original organic landscape using installed Blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $candidate){
            $roots=@('C:\Program Files\Blender Foundation',"$env:LOCALAPPDATA\Programs\Blender Foundation")
            foreach($root in $roots){
              if($candidate){break}
              if(Test-Path $root){
                $candidate=Get-ChildItem $root -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if(-not $candidate){throw 'Blender unavailable on Windows runner'}
          $out="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ValoriaGatehouseV1\valoria_visual_slice_environment_v2.glb"
          $report="$env:RUNNER_TEMP\ValoriaEnvironmentBlenderV2.json"
          $log="$env:RUNNER_TEMP\ValoriaEnvironmentBlenderV2.log"
          $ErrorActionPreference='Continue'
          & $candidate -b --python "$env:GITHUB_WORKSPACE\tools\art-rd\valoria_visual_slice_environment_v2.py" -- --output $out --report $report *> $log
          if($LASTEXITCODE -ne 0){if(Test-Path $log){Get-Content $log -Tail 160};throw "Blender failed $LASTEXITCODE"}
          if(-not (Test-Path $out)){throw 'Blender GLB missing'}
          Get-Content $report
      - name: Render exact Blender gatehouse in Unity
        shell: powershell
        run: |
          $log="$env:RUNNER_TEMP\\ValoriaGatehouseRealUnityV1.log"
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaGatehouseRealUnityV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1800000)){& taskkill.exe /PID $p.Id /T /F | Out-Null; throw 'Unity gatehouse capture timeout'}
          if(Test-Path $log){Get-Content $log -Tail 120}
          if($p.ExitCode -ne 0){throw "Unity gatehouse capture failed $($p.ExitCode)"}
          if(-not (Test-Path "$env:GITHUB_WORKSPACE\\Unity\\ValoriaGatehouseRealUnityV1Captures\\unity-strategic-1280x720.png")){throw 'Real Unity strategic screenshot missing'}
      - name: Preserve generated Unity scene in isolated branch
        shell: powershell
        continue-on-error: true
        run: |
          git config user.name "eldoria-art-ci"
          git config user.email "eldoria-art-ci@users.noreply.github.com"
          git add Unity/Assets/Eldoria/ArtTests/ValoriaGatehouseV1/ValoriaVisualSliceV1.unity Unity/Assets/Eldoria/ArtTests/ValoriaGatehouseV1/valoria_visual_slice_environment_v2.glb
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "art(unity): persist regenerated Valoria vertical slice scene [skip ci]"
            git push origin HEAD:integration/valoria-gatehouse-unity-v1-20261011
          }
      - name: Preserve artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-gatehouse-real-unity-v1
          path: |
            Unity/ValoriaGatehouseRealUnityV1Captures/*
            Unity/Assets/Eldoria/ArtTests/ValoriaGatehouseV1/ValoriaVisualSliceV1.unity
            Unity/Assets/Eldoria/ArtTests/ValoriaGatehouseV1/valoria_visual_slice_environment_v2.glb
          retention-days: 30
          if-no-files-found: warn
