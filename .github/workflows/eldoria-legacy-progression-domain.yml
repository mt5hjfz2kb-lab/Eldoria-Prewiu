name: Eldoria legacy progression domain
on:
  pull_request:
    paths:
      - 'Unity/Assets/Eldoria/LegacyProgression/**'
      - 'tools/legacy-progression/**'
      - '.github/workflows/eldoria-legacy-progression-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            Unity/Assets/Eldoria/LegacyProgression
            Unity/Assets/Eldoria/Scripts/Domain
            Unity/Assets/Eldoria/Scripts/Application
            tools/legacy-progression
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tools/legacy-progression/Smoke.csproj --configuration Release
      - name: Verify canonical integration in disposable source copy
        run: python3 tools/legacy-progression/integration/prepare.py
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: eldoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            tools/legacy-progression
      - name: Verify isolated PostgreSQL schema and permissions
        env:
          PGPASSWORD: local-test-only
        run: psql -h localhost -U postgres -d eldoria_test -v ON_ERROR_STOP=1 -f tools/legacy-progression/server/test.sql
