name: Eldoria actual public18 earned continuation in isolated Windows Edge
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths:
      - '.github/workflows/eldoria-beta-earned-reopen-windows.yml'
      - 'tools/eldoria-private-beta/qa_public_earned_windows.cjs'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: eldoria-earned-windows-browser-single-session
  cancel-in-progress: false
jobs:
  reopen:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Require exact browser reservation and no Unity before checkout
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $meta=Invoke-RestMethod -Headers $headers -Uri "$api/contents/pipeline/active-workstreams.json?ref=main"
          $encoded=$meta.content
          if(-not $encoded){$blob=Invoke-RestMethod -Headers $headers -Uri "$api/git/blobs/$($meta.sha)";if($blob.sha -ne $meta.sha){throw 'Registry blob identity mismatch'};$encoded=$blob.content}
          if(-not $encoded){throw 'Registry bytes unavailable'}
          $registry=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))|ConvertFrom-Json
          $holders=@($registry.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($holders.Count -ne 1){throw 'No single Windows reservation'}
          $owner=$holders[0]
          if($owner.id -ne 'eldoria-private-beta-i-v-20261107' -or $owner.owner -ne 'chatgpt-central-art-execution-20261111' -or $owner.ownership_revision -ne 59 -or $owner.ownership_state -ne 'claimed' -or $owner.write_scope_released -ne $false){throw 'Browser reservation is stale'}
          $pr=Invoke-RestMethod -Headers $headers -Uri "$api/pulls/179"
          if($pr.head.sha -ne $env:GITHUB_SHA){throw 'Requested PR179 source changed'}
          $editors=@(Get-Process -Name Unity,UnityShaderCompiler -ErrorAction SilentlyContinue)
          if($editors.Count){throw 'Existing Unity process must finish; never interrupt it'}
          Write-Host 'EXACT_PR179_BROWSER_LEASE59_VERIFIED; NO_UNITY_EDITOR_INVOKED'
      - name: Resolve installed Git before scoped checkout; refuse repository archive fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Installed Git unavailable; refuse large archive fallback'}
            $gitDir=Split-Path $git -Parent
            $gitDir|Out-File $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH="$gitDir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          path: reopen-tools
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - name: Verify immutable candidate and earned checkpoint artifacts
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $b=Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/13958304643"
          if($b.workflow_run.id -ne 43245541625 -or $b.digest -ne 'sha256:9a30b683538e70e9ca71056d8c586fb977d4f5c08f6bcf478bbc4ba030164c22' -or $b.expired){throw 'Earned checkpoint artifact differs'}
      - uses: actions/download-artifact@v4
        with:
          run-id: 43245541625
          name: candidate17-earned-save-compatibility-not-physical-iphone
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eldoria-earned-reopen-${{ github.run_id }}/state
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact browser driver without changing or downloading a browser
        shell: powershell
        env:
          NODE_PATH: ${{ runner.temp }}/eldoria-earned-reopen-node-${{ github.run_id }}/node_modules
        run: |
          $ErrorActionPreference='Stop'
          $prefix=Split-Path $env:NODE_PATH -Parent
          npm install --prefix $prefix --no-save playwright@1.55.0
          if($LASTEXITCODE -ne 0){throw 'Browser driver installation failed'}
          node --check reopen-tools/tools/eldoria-private-beta/qa_public_earned_windows.cjs
          if($LASTEXITCODE -ne 0){throw 'Browser probe syntax failed'}
      - name: Recheck live reservation immediately before browser launch
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $meta=Invoke-RestMethod -Headers $headers -Uri "$api/contents/pipeline/active-workstreams.json?ref=main"
          $encoded=$meta.content
          if(-not $encoded){$blob=Invoke-RestMethod -Headers $headers -Uri "$api/git/blobs/$($meta.sha)";if($blob.sha -ne $meta.sha){throw 'Registry blob identity mismatch'};$encoded=$blob.content}
          if(-not $encoded){throw 'Registry bytes unavailable'}
          $registry=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))|ConvertFrom-Json
          $holders=@($registry.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($holders.Count -ne 1){throw 'No single Windows reservation'}
          $owner=$holders[0]
          if($owner.id -ne 'eldoria-private-beta-i-v-20261107' -or $owner.owner -ne 'chatgpt-central-art-execution-20261111' -or $owner.ownership_revision -ne 59 -or $owner.ownership_state -ne 'claimed' -or $owner.write_scope_released -ne $false){throw 'Browser reservation is stale'}
          $pr=Invoke-RestMethod -Headers $headers -Uri "$api/pulls/179"
          if($pr.head.sha -ne $env:GITHUB_SHA){throw 'Requested PR179 source changed'}
          $editors=@(Get-Process -Name Unity,UnityShaderCompiler -ErrorAction SilentlyContinue)
          if($editors.Count){throw 'Existing Unity process must finish; never interrupt it'}
          Write-Host 'EXACT_PR179_BROWSER_LEASE59_VERIFIED; NO_UNITY_EDITOR_INVOKED'
      - name: Open actual public route with immutable earned checkpoint in fresh Edge
        shell: powershell
        env:
          NODE_PATH: ${{ runner.temp }}/eldoria-earned-reopen-node-${{ github.run_id }}/node_modules
          ELDORIA_QA_ROOT: ${{ runner.temp }}/eldoria-earned-reopen-${{ github.run_id }}
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@((Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'),(Join-Path $env:ProgramFiles 'Microsoft/Edge/Application/msedge.exe'))
          $edge=@($candidates|Where-Object {Test-Path $_ -PathType Leaf}|Select-Object -First 1)
          if($edge.Count -ne 1){throw 'Existing Edge executable unavailable; no personal profile is used'}
          $env:ELDORIA_QA_EDGE=$edge[0]
          node reopen-tools/tools/eldoria-private-beta/qa_public_earned_windows.cjs
          if($LASTEXITCODE -ne 0){throw 'Actual earned browser reopen failed; inspect genuine report and screenshot'}
      - name: Preserve original browser proof and errors without publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public18-earned-continuation-windows-not-iphone
          path: ${{ runner.temp }}/eldoria-earned-reopen-${{ github.run_id }}/browser-proof/
          if-no-files-found: warn
          retention-days: 14
