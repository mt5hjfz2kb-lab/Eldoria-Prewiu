name: Eldoria authorized orchestration proof
on:
  push:
    branches: [ops/dg-orchestration-recovery-20261008]
    paths:
      - 'tools/eldoria-authorized-orchestration.mjs'
      - 'tests/orchestration/authorized-state.test.mjs'
      - '.github/workflows/eldoria-authorized-orchestration-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise authorization correction QA and reporting states
        run: node --test tests/orchestration/authorized-state.test.mjs
