name: "[ART RADIAL V6] Four true voussoir / keystone photo-PBR blocks"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-four-actual-arch-v6.yml'
      - 'tools/valoria-modular-fortress/physical_radial_arch_wedges_v6.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-four-true-arch-wedges-v6
  cancel-in-progress: false
jobs:
  stone-artist-four:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 80
    steps:
      - name: Check installed local Git and Blender
        shell: powershell
        id: bins
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Installed Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Installed Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-four-bold-hand-dressed-arch-v4-38888410182
          run-id: 38888410182
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/four-original-stone-arched
      - name: Blender native sculpture 4 photo-stone wedges + 8 equal-camera images
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'four-original-stone-arched\eldoria-four-dovelas-chisel-v4\glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-four-physical-arch-v6'
          if(-not(Test-Path (Join-Path $base 'arch_voussoir_minor.glb'))){throw "Original photo-PBR source stones missing $base"}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/physical_radial_arch_wedges_v6.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned true radial script missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-four-physical-wedges-v6.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-four-physical-wedges-v6.stdout'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-four-physical-wedges-v6.stderr'
          $proc=Start-Process -FilePath "${{ steps.bins.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$base,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Physical arch sculptures failed $($proc.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 4){throw "Exactly four independent $folder results required, found $count"}
          }
          $report=Get-Content (Join-Path $out 'reports\four_real_fitted_radial_stones_v6.json') -Raw|ConvertFrom-Json
          if($report.items.Count -ne 4 -or @($report.items|Where-Object {$_.technical -ne 'PASS_PENDING_ART'}).Count -ne 0){throw 'Four geometries incomplete'}
      - name: Preserve individual GLBs, actual images, provenance and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-four-physical-arch-stones-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-four-physical-arch-v6/**
            ${{ runner.temp }}/eldoria-four-physical-wedges-v6.stdout
            ${{ runner.temp }}/eldoria-four-physical-wedges-v6.stderr
          retention-days: 30
          if-no-files-found: warn
