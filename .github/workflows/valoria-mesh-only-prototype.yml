name: Valoria mesh-only prototype source gate
on:
  push:
    branches:
      - prototype/valoria-bastion1-no-sharp-20261010
  workflow_dispatch:
jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independently authored GLB sources and isolated proof
        shell: python
        run: |
          from pathlib import Path
          s=Path("Unity/Assets/Eldoria/Scripts/Editor/ValoriaMeshOnlyBastionOneProof.cs").read_text()
          assert "Gsplat" not in s and ".ply" not in s and "SHARP" not in s.replace("SHARP assets loaded","").replace("SHARP PLY, SHARP splats, SHARP-generated textures","").replace("UNLICENSED_SOURCE_FREE__MESH_ONLY_GEOMETRY","")
          assert 'static readonly Family[] Families' in s and 'EditorSceneManager.SaveScene' in s
          for name in ["Bastion","Bridge","LowerGate","Road","Stair","Wall","RockTerrain"]:
              assert any(Path("art-source/valoria/production").glob(f"*-family-v1/{name}FamilyV1.blend")), name+" Blender source absent"
              assert any(Path("art-source/valoria/production").glob(f"*-family-v1/{name}FamilyV1.glb")), name+" exported GLB absent"
          print("PASS mesh-only authoring source preflight; runtime Unity visual validation still required")
