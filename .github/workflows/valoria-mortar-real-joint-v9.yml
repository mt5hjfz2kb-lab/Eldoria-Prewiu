name: "[ART MORTAR V9] True narrow physically recessed lime grout module"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-mortar-real-joint-v9.yml'
      - 'tools/valoria-modular-fortress/true_thin_lime_mortar_v9.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-real-2cm-CC0-lime-mortar
  cancel-in-progress: false
jobs:
  create-real-reusable-grout:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    steps:
      - name: Locate existing Blender and Git
        id: deps
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing git'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-real-dark-lime-mortar-cc0-38894488570
          run-id: 38894488570
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/old_not_true_mortar
      - name: Sculpt functional lime seam at actual 26mm instead of 380mm masonry plate
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'old_not_true_mortar\eldoria-mortar-lime-v8\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-true-lime-seam-v9'
          if(-not(Test-Path (Join-Path $src 'mortar_joint_recess.glb'))){throw 'Previous original missing'}
          if(-not(Test-Path (Join-Path $env:RUNNER_TEMP 'old_not_true_mortar\eldoria-mortar-lime-v8\atlas\real_photo_lime_mortar_aged_muted_1k.png'))){throw 'CC0 photo atlas missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/true_thin_lime_mortar_v9.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned artist code missing'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-lime-seam-v9.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-lime-seam-v9.stdout'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-lime-seam-v9.stderr'
          $proc=Start-Process -FilePath "${{ steps.deps.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 65 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "True lime seam Blender $($proc.ExitCode)"}
          foreach($file in @('glb\mortar_joint_recess.glb','before\mortar_joint_recess.png','after\mortar_joint_recess.png','after\mortar_joint_recess_macro.png','reports\mortar_geometry_redefinition_v9.json')){
            if(-not(Test-Path (Join-Path $out $file))){throw "Missing standalone $file"}
          }
      - name: Preserve visual evidence; not approved for Unity yet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-real-corrected-2cm-mortar-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-true-lime-seam-v9/**
            ${{ runner.temp }}/eldoria-lime-seam-v9.stdout
            ${{ runner.temp }}/eldoria-lime-seam-v9.stderr
          if-no-files-found: warn
          retention-days: 30
