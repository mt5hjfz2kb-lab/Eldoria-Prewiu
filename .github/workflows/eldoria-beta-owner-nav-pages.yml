name: Eldoria P0 verified owner-only Pages delivery
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-owner-nav-preview-20261113
  cancel-in-progress: false
jobs:
  publish-owner-preview:
    runs-on: macos-15
    timeout-minutes: 70
    environment:
      name: github-pages
      url: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1
    env:
      EXPECTED_SOURCE: d0b21fd5708c5070d1bd62dc6c6a98399c549051
      BUILD_RUN: '43653390105'
      BUILD_WORKFLOW_SHA: cf105a3e407b24c8ffd7cf3a2e7fb3fd1ae834b9
      BROWSER_RUN: 43659627661
      BROWSER_SHA: f03ac3c3083ab3e24d46b19ba58cb26c48a9c155
      PREVIOUS_SOURCE: d0b21fd5708c5070d1bd62dc6c6a98399c549051
      STAGE_SHA: 14c64284f2aef341c1787a1d815e54b369e15efc
      GH_TOKEN: ${{ github.token }}
      MSAA_RUN: '43661585648'
      MSAA_SHA: 557fc6b2c50e34b4570855868f6e1ea61b5e81c1
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.STAGE_SHA }}
        fetch-depth: 20
        filter: blob:none
        sparse-checkout: |-
          tools
          pipeline
          .github/workflows
          AGENTS.md
        persist-credentials: false
        sparse-checkout-cone-mode: false
    - name: Verify frozen runtime and staging tests
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$STAGE_SHA"
        git cat-file -e "$EXPECTED_SOURCE^{commit}"
        git diff --exit-code "$EXPECTED_SOURCE" HEAD -- Unity/
        python3 -m unittest discover -s tools/eldoria-private-beta -p test_integrated_owner_stage.py
        python3 -m unittest discover -s tools/eldoria-private-beta -p test_restore_published_owner_snapshot.py
        node tools/check-repository-architecture.mjs --tracked-tree
        node tools/check-workflow-governance.mjs
        node tools/check-workflow-quarantine.mjs

        node tools/eldoria-private-beta/test-world-phase-diagnostic.cjs
        python3 -m unittest discover -s tools/eldoria-private-beta -p test_patch_world_diagnostic.py
    - name: Require exact native, compiled package and browser success
      run: |
        python3 - <<'END'
        import json,os,urllib.request
        base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
        def get(path):
         req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
         return json.load(urllib.request.urlopen(req,timeout=30))
        for run,sha,names in [(os.environ['BUILD_RUN'],os.environ['BUILD_WORKFLOW_SHA'],['preflight','build','package-owner']),
         (os.environ['BROWSER_RUN'],os.environ['BROWSER_SHA'],['public-world-entry']),
         (os.environ['MSAA_RUN'],os.environ['MSAA_SHA'],['same-build-msaa'])]:
         data=get('actions/runs/'+run)
         assert data['conclusion']=='success' and data['head_sha']==sha,(run,'exact source/result')
         jobs=get('actions/runs/'+run+'/jobs?per_page=100')['jobs']
         assert all(any(j['name']==name and j['conclusion']=='success' for j in jobs) for name in names)
        print('EXACT_NATIVE_BUILD_AND_REAL_BROWSER_GATES_PASS_NOT_PHYSICAL_IPHONE')
        END
    - name: Restore already verified durable beta21 snapshot and reject a changed public certificate
      run: |
        set -euo pipefail
        curl --retry 4 --retry-delay 3 -fsSL https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/integrated-owner-stage-proof.json -o current-proof.json
        mkdir -p verified-archive previous-pages
        gh release download archive-pages-before-world-diagnostic-21d4 --pattern artifact.tar --dir verified-archive
        cp verified-archive/artifact.tar previous-pages/artifact.tar
        python3 - <<'END'
        import hashlib,json,pathlib,tarfile
        root=pathlib.Path('site');root.mkdir()
        proof=pathlib.Path('current-proof.json')
        def digest(p):
         with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
        proofhash='f4bc2c0ca3768f62992a66a7ef3fbe299ee2b561354c1b899847432fa62895fa'
        archivehash='7d053452b9739828310936e1b5e2ce759029fa8f458b24dfeada82d86673208e'
        assert digest(proof)==proofhash,'Concurrent public replacement: refuse'
        a=pathlib.Path('previous-pages/artifact.tar');assert digest(a)==archivehash
        p=json.loads(proof.read_text());assert p['source_sha']=='d0b21fd5708c5070d1bd62dc6c6a98399c549051'
        rows=dict(p['preserved_fingerprints']);rows.update({'beta-integrated-vigilia/'+k:v for k,v in p['candidate_fingerprints'].items()})
        rows['integrated-owner-stage-proof.json']={'sha256':proofhash,'bytes':proof.stat().st_size}
        assert sum(x['bytes'] for x in rows.values())==p['combined_bytes']
        with tarfile.open(a) as t:
         members=t.getmembers();assert len(members)==len(rows) and {m.name for m in members}==set(rows)
         for m in members:
          assert m.isfile() and '..' not in pathlib.PurePosixPath(m.name).parts and not m.name.startswith('/')
          assert m.size==rows[m.name]['bytes']
          dest=root/m.name;dest.parent.mkdir(parents=True,exist_ok=True)
          with t.extractfile(m) as src,dest.open('xb') as out:
           while chunk:=src.read(1024*1024):out.write(chunk)
          assert digest(dest)==rows[m.name]['sha256'],m.name
        pathlib.Path('previous-pages/artifact.tar.recovery.json').write_text(json.dumps({'status':'FULL_ARCHIVE_RECOVERED_BYTE_IDENTICAL','archive_sha256':archivehash,'publication_inventory_sha256':proofhash,'files':len(rows),'bytes':p['combined_bytes'],'public_certificate_still_exact':True},indent=2))
        print('DURABLE_ARCHIVE_ALL_FILES_VERIFIED',len(rows))
        END
    - name: Durably archive recovered current site before replacement
      run: |
        set -euo pipefail
        TAG=archive-pages-before-world-diagnostic-21d4
        shasum -a 256 previous-pages/artifact.tar > previous-pages-sha256.txt
        cat > previous-pages-note.md <<'END'
        Complete owner beta21 Pages snapshot, exact publication certificate f4bc2c0ca3768f62992a66a7ef3fbe299ee2b561354c1b899847432fa62895fa. Rollback before local diagnostic 21d4. Physical iPhone world entry remains failed; not a tester release.
        END
        if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
         gh release create "$TAG" --draft --target "$GITHUB_SHA" --title 'Verified beta21 Pages before diagnostic 21d4' --notes-file previous-pages-note.md
        fi
        if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq artifact.tar; then
         gh release upload "$TAG" previous-pages/artifact.tar
        fi
        mkdir -p verified-archive
        if [ ! -f verified-archive/artifact.tar ]; then gh release download "$TAG" --pattern artifact.tar --dir verified-archive; fi
        cmp previous-pages/artifact.tar verified-archive/artifact.tar
    - name: Patch only local world diagnostic and certify unchanged native bytes
      run: python3 tools/eldoria-private-beta/patch_world_diagnostic.py site
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Prove actual Unity world phases and recovery before deployment
      env:
        QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-world-ocr
        QA_EXPECT_SOURCE: d0b21fd5708c5070d1bd62dc6c6a98399c549051
        QA_REQUIRE_CONSTRUCTION: '1'
        QA_REQUIRE_WORLD_JOURNAL: '1'
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/world-qa-node" --no-save playwright@1.55.0
        "$RUNNER_TEMP/world-qa-node/node_modules/.bin/playwright" install webkit
        swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
        export NODE_PATH="$RUNNER_TEMP/world-qa-node/node_modules"
        node tools/eldoria-private-beta/qa_static_server.cjs site 18765 > local-server.log 2>&1 &
        SERVER_PID=$!
        trap 'kill "$SERVER_PID"' EXIT
        QA_URL='http://127.0.0.1:18765/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_p0_world_msaa_off=1' \
         QA_OUT=diagnostic-browser node tools/eldoria-private-beta/qa_world_entry_public.cjs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: world-diagnostic-21d4-proof
        path: |-
          site/integrated-owner-stage-proof.json
          previous-pages-sha256.txt
          previous-pages/artifact.tar.recovery.json
          diagnostic-browser
          local-server.log
        retention-days: 60
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
        retention-days: 7
    - name: Recheck live source ownership and exact staging governance before deployment
      run: |
        python3 - <<'END'
        import base64,json,os,urllib.request
        base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
        def get(path):
         req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
         return json.load(urllib.request.urlopen(req,timeout=30))
        item=get('contents/pipeline/active-workstreams.json?ref=main')
        if item.get('encoding')!='base64' or not item.get('content'):
         item=get('git/blobs/'+item['sha'])
        registry=json.loads(base64.b64decode(item['content']))
        stream=next(x for x in registry['active'] if x['id']=='eldoria-private-beta-i-v-20261107')
        assert stream['owner']=='chatgpt-world-p0-continuation-9df36d17'
        assert stream['ownership_revision']==80 and stream['ownership_state']=='claimed'
        assert stream['branch']=='fix/eldoria-world-first-entry-p0-20261114'
        checks=get('commits/'+os.environ['STAGE_SHA']+'/check-runs?per_page=100')['check_runs']
        for name in ['metadata','ownership','rights','audit']:
         selected=[x for x in checks if x['name']==name]
         assert selected and any(x['status']=='completed' and x['conclusion']=='success' for x in selected),(name,'not certified')
        publication_checks=get('commits/'+os.environ['GITHUB_SHA']+'/check-runs?per_page=100')['check_runs']
        for name in ['architecture','quarantine','governance']:
         selected=[x for x in publication_checks if x['name']==name]
         assert selected and all(x['status']=='completed' and x['conclusion']=='success' for x in selected),(name,'publication commit not certified')
        print('LIVE_SOURCE_OWNERSHIP_AND_EXACT_GOVERNANCE_PASS')
        END
    - name: Deploy only the verified owner candidate
      uses: actions/deploy-pages@v4
      id: deploy
    - name: Verify actual public candidate and every protected file
      run: |
        python3 - <<'END'
        import json,pathlib,urllib.request,hashlib,concurrent.futures,time,os
        proof=json.loads(pathlib.Path('site/integrated-owner-stage-proof.json').read_text())
        base='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/'
        for attempt in range(20):
         try:
          with urllib.request.urlopen(base+'beta-integrated-vigilia/release-identity.json?p0_identity='+str(attempt),timeout=30) as r:j=json.load(r)
          assert j['source_sha']==os.environ['EXPECTED_SOURCE']
          assert j['owner_only'] and not j['release_for_external_testers']
          break
         except Exception:
          if attempt==19:raise
          time.sleep(6)
        rows=dict(proof['preserved_fingerprints'])
        publication_proof=pathlib.Path('site/integrated-owner-stage-proof.json')
        rows['integrated-owner-stage-proof.json']={'bytes':publication_proof.stat().st_size,'sha256':hashlib.sha256(publication_proof.read_bytes()).hexdigest()}
        rows.update({'beta-integrated-vigilia/'+k:v for k,v in proof['candidate_fingerprints'].items()})
        def verify(item):
         name,row=item
         with urllib.request.urlopen(base+name+'?p0_verified='+row['sha256'],timeout=90) as r:
          h=hashlib.sha256();size=0
          while chunk:=r.read(1024*1024):h.update(chunk);size+=len(chunk)
         assert h.hexdigest()==row['sha256'] and size==row['bytes'],name
        with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(verify,rows.items()))
        print('ALL_PUBLIC_CANDIDATE_AND_PROTECTED_FILES_BYTE_VERIFIED',len(rows))
        END
  verify-public-player:
    needs: publish-owner-preview
    runs-on: macos-15
    timeout-minutes: 35
    env:
      STAGE_SHA: 14c64284f2aef341c1787a1d815e54b369e15efc
      QA_EXPECT_SOURCE: d0b21fd5708c5070d1bd62dc6c6a98399c549051
      QA_URL: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_profile=1&eldoria_p0_world_msaa_off=1
      QA_REQUIRE_CONSTRUCTION: '1'
      QA_REQUIRE_WORLD_JOURNAL: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.STAGE_SHA }}
        sparse-checkout: |-
          tools/eldoria-private-beta
          tools/art-direction/ai-authoring
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify real public reload, saved construction and world zooms
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/world-qa-node" --no-save playwright@1.55.0
        "$RUNNER_TEMP/world-qa-node/node_modules/.bin/playwright" install webkit
        swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
        export NODE_PATH="$RUNNER_TEMP/world-qa-node/node_modules"
        failed=0
        QA_ENGINE=webkit QA_ENTRY=1 QA_EARLY_ENTRY=1 QA_EARLY_NO_SCREENSHOT=1 QA_RESIZE_STRESS=1 \
         QA_SKIP_PREFLIGHT=1 QA_LAZY_WORLD=1 QA_EXPECT_VIGILIA=1 QA_EXPECT_ORIGIN=https://mt5hjfz2kb-lab.github.io \
         QA_REVISION=integrated-mobile21-owner-qa QA_OUT=public-world-evidence/candidate \
         node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
        QA_OUT=public-world-evidence/world-entry node tools/eldoria-private-beta/qa_world_entry_public.cjs || failed=1
        if [ "$failed" != 0 ]; then exit 1;fi

        grep -F 'ELDORIA_P0_WORLD_CAMERA_MSAA_OPTIN_DISABLED only_world=1' public-world-evidence/world-entry/console.log
      env:
        QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-world-ocr
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: world-p0-public-browser-proof
        path: public-world-evidence
        retention-days: 30
'on':
  push:
    branches:
    - main
    paths:
    - tools/eldoria-private-beta/world-p0-publish-request.txt
