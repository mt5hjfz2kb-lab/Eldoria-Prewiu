name: Eldoria P0 verified owner-only Pages delivery
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-owner-nav-preview-20261113
  cancel-in-progress: false
jobs:
  publish-owner-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_p0_world_msaa_off=1&eldoria_p0_entry_msaa_off=1&eldoria_p0_static_mesh_cpu=1&build=world21e2
    env:
      EXPECTED_SOURCE: 05e1846f0213c6320850505bc054110c53934f55
      BUILD_RUN: '43739391559'
      BUILD_WORKFLOW_SHA: 79c74ce6bb26c4903f19686b900851a508957bce
      BROWSER_RUN: '43744175007'
      BROWSER_SHA: 668b3a33ce3bf7d9965a82c48f7f53c79c107f8b
      PREVIOUS_SOURCE: ca5e1c3d52a58d8c6d9c9a9114d2d35445a18029
      STAGE_SHA: 668b3a33ce3bf7d9965a82c48f7f53c79c107f8b
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.STAGE_SHA }}
        fetch-depth: 20
        filter: blob:none
        sparse-checkout: |-
          tools
          pipeline
          .github/workflows
          AGENTS.md
        persist-credentials: false
        sparse-checkout-cone-mode: false
    - name: Verify frozen runtime and staging tests
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$STAGE_SHA"
        git fetch --no-tags --depth=1 origin "$EXPECTED_SOURCE"
        git cat-file -e "$EXPECTED_SOURCE^{commit}"
        git diff --exit-code "$EXPECTED_SOURCE" HEAD -- Unity/
        python3 -m unittest discover -s tools/eldoria-private-beta -p test_integrated_owner_stage.py
        python3 -m unittest discover -s tools/eldoria-private-beta -p test_restore_published_owner_snapshot.py
        node tools/check-repository-architecture.mjs --tracked-tree
        node tools/check-workflow-governance.mjs
        node tools/check-workflow-quarantine.mjs
    - name: Require exact native, compiled package and browser success
      run: |
        python3 - <<'END'
        import json,os,urllib.request
        base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
        def get(path):
         req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
         return json.load(urllib.request.urlopen(req,timeout=30))
        for run,sha,names in [(os.environ['BUILD_RUN'],os.environ['BUILD_WORKFLOW_SHA'],['preflight','build','package-owner']),
         (os.environ['BROWSER_RUN'],os.environ['BROWSER_SHA'],['native-static-mesh'])]:
         data=get('actions/runs/'+run)
         assert data['conclusion']=='success' and data['head_sha']==sha,(run,'exact source/result')
         jobs=get('actions/runs/'+run+'/jobs?per_page=100')['jobs']
         assert all(any(j['name']==name and j['conclusion']=='success' for j in jobs) for name in names)
        print('EXACT_NATIVE_BUILD_AND_REAL_BROWSER_GATES_PASS_NOT_PHYSICAL_IPHONE')
        END
    - uses: actions/download-artifact@v4
      with:
        run-id: ${{ env.BUILD_RUN }}
        name: world-p0-mobile21-owner-site
        github-token: ${{ github.token }}
        path: candidate
    - uses: actions/download-artifact@v4
      with:
        run-id: ${{ env.BROWSER_RUN }}
        name: world-p0-native-static-mesh-comparison
        github-token: ${{ github.token }}
        path: browser
    - name: Require measured native CPU residency reduction and both real saved-game variants
      run: |
        set -euo pipefail
        python3 tools/eldoria-private-beta/verify_static_mesh_residency_trial.py browser --native
        mkdir stage-browser
        cp -R browser/early-residency stage-browser/candidate
        cp -R browser/candidate stage-browser/world-entry
        python3 tools/eldoria-private-beta/install_static_mesh_journal.py candidate "$BUILD_RUN"
    - name: Recover every current public byte from certified publication inventory
      run: |
        set -euo pipefail
        curl --retry 4 --retry-delay 3 --retry-all-errors -fsSL https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/integrated-owner-stage-proof.json -o current-proof.json
        python3 - <<'END'
        import os,sys,subprocess
        from types import SimpleNamespace
        sys.path.insert(0,'tools/eldoria-private-beta')
        from restore_published_owner_snapshot import restore
        def fetch(url,dest):
         assert not dest.exists(),'Refuse overwriting existing recovery input'
         subprocess.run(['curl','--retry','4','--retry-delay','2','--retry-all-errors','-fsSL','--max-time','180','-o',str(dest),url],check=True)
        restore(SimpleNamespace(proof='current-proof.json',proof_sha256='93fb983f2e422ec775e7425cd260a492f144fa73172015f219089676ed7642f5',source=os.environ['PREVIOUS_SOURCE'],origin='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu',output='previous-live',archive='previous-pages/artifact.tar'),downloader=fetch)
        END
    - name: Stage exact candidate while preserving all other routes and saves
      run: |
        set -euo pipefail
        python3 - <<'END'
        import json,os,pathlib
        p=pathlib.Path('candidate/release-identity.json');j=json.loads(p.read_text())
        assert j['source_sha']==os.environ['EXPECTED_SOURCE'] and str(j['native_run'])==os.environ['BUILD_RUN']
        assert j['native_journey_verified'] and j['native_destination_captures_verified']
        assert not j['physical_mobile_tested'] and not j['release_for_external_testers']
        pathlib.Path('pinned-candidate.json').write_bytes(p.read_bytes())
        END
        BUNDLE=$(python3 -c 'import json;print(json.load(open("pinned-candidate.json"))["candidate_bundle_sha256"])')
        DATA=$(python3 -c 'import json;print(json.load(open("pinned-candidate.json"))["delivered_data_sha256"])')
        python3 tools/eldoria-private-beta/stage_integrated_owner_site.py \
         --pages previous-pages/artifact.tar --candidate candidate --browser stage-browser \
         --output site --work stage-work --replace-source "$PREVIOUS_SOURCE" \
         --expected-source-sha "$EXPECTED_SOURCE" --expected-bundle-sha256 "$BUNDLE" \
         --expected-data-sha256 "$DATA" --native-run "$BUILD_RUN" --full-certificate-run "$BUILD_RUN" \
         --require-world-entry
    - name: Durably archive recovered current site before replacement
      run: |
        set -euo pipefail
        TAG=archive-pages-before-world-static-mesh-21e2
        sha256sum previous-pages/artifact.tar > previous-pages-sha256.txt
        cat > previous-pages-note.md <<'END'
        Complete owner21e1 Pages snapshot recovered from publication43714355086. All146public files were SHA256-verified against certificate93fb983f2e422ec775e7425cd260a492f144fa73172015f219089676ed7642f5. This archive is the rollback for the world-entry P0 owner candidate, not a tester release.
        END
        if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
         gh release create "$TAG" --draft --target "$GITHUB_SHA" --title 'Verified complete Pages snapshot before world P0' --notes-file previous-pages-note.md
        fi
        if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq artifact.tar; then
         gh release upload "$TAG" previous-pages/artifact.tar
        fi
        mkdir -p verified-archive
        gh release download "$TAG" --pattern artifact.tar --dir verified-archive
        cmp previous-pages/artifact.tar verified-archive/artifact.tar
    - uses: actions/upload-artifact@v4
      with:
        name: world-p0-owner-publication-proof
        path: |-
          site/integrated-owner-stage-proof.json
          pinned-candidate.json
          previous-pages-sha256.txt
          previous-pages/artifact.tar.recovery.json
          browser/comparison.json
        retention-days: 60
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
        retention-days: 7
    - name: Recheck live source ownership and exact staging governance before deployment
      run: |
        python3 - <<'END'
        import base64,json,os,urllib.request
        base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'
        def get(path):
         req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
         return json.load(urllib.request.urlopen(req,timeout=30))
        item=get('contents/pipeline/active-workstreams.json?ref=main')
        if item.get('encoding')!='base64' or not item.get('content'):
         item=get('git/blobs/'+item['sha'])
        registry=json.loads(base64.b64decode(item['content']))
        stream=next(x for x in registry['active'] if x['id']=='eldoria-private-beta-i-v-20261107')
        assert stream['owner']=='chatgpt-world-p0-continuation-9df36d17'
        assert stream['ownership_revision']==85 and stream['ownership_state']=='claimed'
        assert stream['branch']=='fix/eldoria-world-first-entry-p0-20261114'
        checks=get('commits/'+os.environ['STAGE_SHA']+'/check-runs?per_page=100')['check_runs']
        for name in ['metadata','ownership','rights','audit']:
         selected=[x for x in checks if x['name']==name]
         assert selected and any(x['status']=='completed' and x['conclusion']=='success' for x in selected),(name,'not certified')
        publication_checks=get('commits/'+os.environ['GITHUB_SHA']+'/check-runs?per_page=100')['check_runs']
        for name in ['architecture','quarantine','governance']:
         selected=[x for x in publication_checks if x['name']==name]
         assert selected and all(x['status']=='completed' and x['conclusion']=='success' for x in selected),(name,'publication commit not certified')
        import hashlib
        with urllib.request.urlopen('https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/integrated-owner-stage-proof.json?before_21e2',timeout=60) as r: live=r.read()
        assert hashlib.sha256(live).hexdigest()=='93fb983f2e422ec775e7425cd260a492f144fa73172015f219089676ed7642f5','Concurrent public replacement: refuse'
        print('LIVE_SOURCE_OWNERSHIP_AND_EXACT_GOVERNANCE_PASS')
        END
    - name: Deploy only the verified owner candidate
      uses: actions/deploy-pages@v4
      id: deploy
    - name: Verify actual public candidate and every protected file
      run: |
        python3 - <<'END'
        import json,pathlib,urllib.request,hashlib,concurrent.futures,time,os
        proof=json.loads(pathlib.Path('site/integrated-owner-stage-proof.json').read_text())
        base='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/'
        for attempt in range(20):
         try:
          with urllib.request.urlopen(base+'beta-integrated-vigilia/release-identity.json?p0_identity='+str(attempt),timeout=30) as r:j=json.load(r)
          assert j['source_sha']==os.environ['EXPECTED_SOURCE']
          assert j['owner_only'] and not j['release_for_external_testers']
          break
         except Exception:
          if attempt==19:raise
          time.sleep(6)
        rows=dict(proof['preserved_fingerprints'])
        publication_proof=pathlib.Path('site/integrated-owner-stage-proof.json')
        rows['integrated-owner-stage-proof.json']={'bytes':publication_proof.stat().st_size,'sha256':hashlib.sha256(publication_proof.read_bytes()).hexdigest()}
        rows.update({'beta-integrated-vigilia/'+k:v for k,v in proof['candidate_fingerprints'].items()})
        def verify(item):
         name,row=item
         with urllib.request.urlopen(base+name+'?p0_verified='+row['sha256'],timeout=90) as r:
          h=hashlib.sha256();size=0
          while chunk:=r.read(1024*1024):h.update(chunk);size+=len(chunk)
         assert h.hexdigest()==row['sha256'] and size==row['bytes'],name
        with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(verify,rows.items()))
        print('ALL_PUBLIC_CANDIDATE_AND_PROTECTED_FILES_BYTE_VERIFIED',len(rows))
        END
  verify-public-player:
    needs: publish-owner-preview
    runs-on: macos-15
    timeout-minutes: 35
    env:
      STAGE_SHA: 668b3a33ce3bf7d9965a82c48f7f53c79c107f8b
      QA_EXPECT_SOURCE: 05e1846f0213c6320850505bc054110c53934f55
      QA_URL: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_profile=1&eldoria_p0_world_msaa_off=1&eldoria_p0_entry_msaa_off=1&eldoria_p0_static_mesh_cpu=1
      QA_REQUIRE_CONSTRUCTION: '1'
      QA_REQUIRE_WORLD_JOURNAL: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.STAGE_SHA }}
        sparse-checkout: |-
          tools/eldoria-private-beta
          tools/art-direction/ai-authoring
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify real public reload, saved construction and world zooms
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/world-qa-node" --no-save playwright@1.55.0
        "$RUNNER_TEMP/world-qa-node/node_modules/.bin/playwright" install webkit
        swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
        export NODE_PATH="$RUNNER_TEMP/world-qa-node/node_modules"
        failed=0
        QA_ENGINE=webkit QA_ENTRY=1 QA_EARLY_ENTRY=1 QA_EARLY_NO_SCREENSHOT=1 QA_RESIZE_STRESS=1 \
         QA_SKIP_PREFLIGHT=1 QA_LAZY_WORLD=1 QA_EXPECT_VIGILIA=1 QA_EXPECT_ORIGIN=https://mt5hjfz2kb-lab.github.io \
         QA_REVISION=integrated-mobile21-owner-qa QA_OUT=public-world-evidence/candidate \
         node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
        QA_OUT=public-world-evidence/world-entry node tools/eldoria-private-beta/qa_world_entry_public.cjs || failed=1
        if [ "$failed" != 0 ]; then exit 1;fi

        grep -F 'ELDORIA_P0_WORLD_CAMERA_MSAA_OPTIN_DISABLED only_world=1' public-world-evidence/world-entry/console.log

        grep -F 'ELDORIA_P0_ENTRY_RENDER_BUDGET_PREPARED retired=' public-world-evidence/world-entry/console.log
        grep -F 'ELDORIA_P0_STATIC_MESH_CPU_RETIRED count=4' public-world-evidence/world-entry/console.log
      env:
        QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-world-ocr
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: world-p0-public-browser-proof
        path: public-world-evidence
        retention-days: 30
'on':
  push:
    branches:
    - main
    paths:
    - tools/eldoria-private-beta/world-p0-publish-request.txt
