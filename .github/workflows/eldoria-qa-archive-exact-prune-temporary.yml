name: "[TEMP] Eldoria remove six unneeded old visual QA reports"
on:
  push:
    branches: [cost/artifact-retention-references-20261104]

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact historical report identity before deletion
        uses: actions/github-script@v7
        with:
          script: |
            const expected=[
              {id:13188711798,run_id:41546241907,size:1073686},
              {id:13187685035,run_id:41542981276,size:1070399},
              {id:13183944636,run_id:41538510580,size:1110444},
              {id:13182380967,run_id:41530419766,size:1116730},
              {id:13149827912,run_id:41463585286,size:1068175},
              {id:13149150016,run_id:41459715373,size:1085661}
            ];
            const cutoff='2026-11-03T00:00:00Z';
            const manifestPaths=[
              'pipeline/active-workstreams.json','pipeline/playtest-delivery.json',
              'pipeline/unity-publish-request.json',
              'pipeline/android-updater-release-request.json'
            ];
            for(const path of manifestPaths){
              const res=await github.rest.repos.getContent({...context.repo,path,ref:'main'});
              if(!res.data.content)throw Error('Missing protected manifest: '+path);
              const text=Buffer.from(res.data.content.replace(/\s/g,''),'base64').toString('utf8');
              const numbers=new Set();
              const collect=x=>{
                if(Array.isArray(x))for(const y of x)collect(y);
                else if(x&&typeof x==='object')for(const y of Object.values(x))collect(y);
                else if(Number.isInteger(x))numbers.add(x);
              };
              collect(JSON.parse(text));
              for(const item of expected)
                if(numbers.has(item.id))throw Error('Artifact ID protected by '+path+': '+item.id);
            }
            const pending=[],alreadyGone=[];
            for(const item of expected){
              let data;
              try{
                data=(await github.rest.actions.getArtifact({
                  ...context.repo,artifact_id:item.id})).data;
              }catch(err){
                if(err.status===404){alreadyGone.push(item.id);continue;}
                throw err;
              }
              const name='eldoria-visual-qa-'+item.run_id;
              if(data.name!==name ||
                 data.workflow_run?.id!==item.run_id ||
                 data.size_in_bytes!==item.size ||
                 data.expired || !(data.created_at<cutoff))
                throw Error('Exact legacy visual QA report metadata mismatch: '+item.id);
              pending.push(item);
            }
            if(pending.length>6)throw Error('Unsafe unexpected deletion size');
            let deleted=0,bytes=0;
            for(const item of pending){
              await github.rest.actions.deleteArtifact({
                ...context.repo,artifact_id:item.id
              });
              deleted++;bytes+=item.size;
              core.info('ELDORIA_SAFE_DELETION id='+item.id+' bytes='+item.size);
            }
            core.info('ELDORIA_QA_PRUNE_RESULT='+JSON.stringify({
              deleted,deleted_bytes:bytes,already_gone:alreadyGone,
              class:'historical-visual-qa-report-only',protected_refs_unchanged:true
            }));
            await core.summary.addRaw('### Eldoria controlled visual QA cleanup\n' +
              'Exact old QA reports removed: **'+deleted+'**, bytes freed: **'+bytes+
              '**. Reference images and Unity certificates untouched.').write();
