name: "[R&D] Valoria Hi3DGen Gate Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-hi3dgen-gate-capability-v1.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-gate.png
          sparse-checkout-cone-mode: false

      - name: Install client tools and Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libglx0 libx11-6
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" pillow requests numpy

      - name: Prepare isolated semantic gate input
        run: |
          mkdir -p /tmp/hi3dgen/input /tmp/hi3dgen/output /tmp/hi3dgen/evidence
          python - <<'PY'
          from PIL import Image, ImageChops
          src="art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-gate.png"
          im=Image.open(src).convert("RGBA")

          # Trim transparent or near-white empty margins without altering the gate pixels.
          alpha=im.getchannel("A")
          bbox=alpha.getbbox()
          if bbox is None:
              # Fallback for opaque semantic layers: derive bbox from difference vs top-left background.
              bg=Image.new("RGBA",im.size,im.getpixel((0,0)))
              diff=ImageChops.difference(im,bg).convert("L")
              bbox=diff.point(lambda p: 255 if p>6 else 0).getbbox()
          if bbox is None:
              bbox=(0,0,im.width,im.height)

          crop=im.crop(bbox)
          w,h=crop.size
          side=max(w,h)
          canvas=Image.new("RGBA",(side,side),(255,255,255,0))
          canvas.alpha_composite(crop,((side-w)//2,(side-h)//2))
          canvas=canvas.resize((768,768),Image.Resampling.LANCZOS)
          out="/tmp/hi3dgen/input/eldoria-gate-semantic.png"
          canvas.save(out)
          open("/tmp/hi3dgen/evidence/input-spec.txt","w").write(
              f"source={src}\nsource_size={im.size}\ntrim_bbox={bbox}\ntrim_size={crop.size}\nprepared={canvas.size}\ncredits=0\nunity_touched=false\ninput_kind=semantic_gate\n"
          )
          PY
          sha256sum /tmp/hi3dgen/input/eldoria-gate-semantic.png | tee /tmp/hi3dgen/evidence/input.sha256

      - name: Generate Hi3DGen gate mesh
        id: hi3dgen
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/hi3dgen/evidence/hi3dgen.log
          import os, shutil
          from gradio_client import Client, handle_file
          client=Client("Stable-X/Hi3DGen", verbose=True)
          api=client.view_api(return_format="dict")
          print("API",api)

          image="/tmp/hi3dgen/input/eldoria-gate-semantic.png"
          # generate_3d preprocesses the image internally in the Space code.
          # Pass the original file object directly; do not pass a downloaded path string.
          result=client.predict(
              image=handle_file(image),
              seed=42,
              ss_guidance_strength=3,
              ss_sampling_steps=50,
              slat_guidance_strength=3.0,
              slat_sampling_steps=6,
              api_name="/generate_3d"
          )
          print("RESULT",repr(result))

          candidates=[]
          def walk(x):
              if isinstance(x,str): candidates.append(x)
              elif isinstance(x,(list,tuple)):
                  for v in x: walk(v)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
          walk(result)

          copied=[]
          for p in candidates:
              if os.path.isfile(p):
                  ext=os.path.splitext(p)[1].lower()
                  if ext in (".glb",".gltf",".obj",".ply",".stl"):
                      dst="/tmp/hi3dgen/output/hi3dgen"+ext
                      shutil.copy2(p,dst)
                      copied.append(dst)
          print("COPIED",copied)
          if not copied:
              raise SystemExit("Hi3DGen returned no local mesh file")
          PY

      - name: Require Hi3DGen mesh
        run: |
          test "${{ steps.hi3dgen.outcome }}" = "success"
          test -n "$(find /tmp/hi3dgen/output -maxdepth 1 -type f \( -name '*.glb' -o -name '*.gltf' -o -name '*.obj' -o -name '*.ply' -o -name '*.stl' \) -print -quit)"

      - name: Render multi-angle clay evidence
        run: |
          cat > /tmp/hi3dgen/render.py <<'PY'
          import bpy, os, math
          from mathutils import Vector
          root="/tmp/hi3dgen/output"; ev="/tmp/hi3dgen/evidence"
          bpy.ops.wm.read_factory_settings(use_empty=True)
          files=[os.path.join(root,f) for f in os.listdir(root) if f.lower().endswith((".glb",".gltf",".obj",".ply",".stl"))]
          if not files: raise RuntimeError("no mesh")
          p=files[0]
          if p.lower().endswith((".glb",".gltf")): bpy.ops.import_scene.gltf(filepath=p)
          elif p.lower().endswith(".obj"): bpy.ops.wm.obj_import(filepath=p)
          elif p.lower().endswith(".ply"): bpy.ops.wm.ply_import(filepath=p)
          elif p.lower().endswith(".stl"): bpy.ops.wm.stl_import(filepath=p)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("no mesh objects")
          pts=[]; tris=0
          for o in meshes:
              for c in o.bound_box: pts.append(o.matrix_world @ Vector(c))
              tris+=sum(max(0,len(poly.vertices)-2) for poly in o.data.polygons)
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5; dims=mx-mn; span=max(dims)
          mat=bpy.data.materials.new("Clay"); mat.diffuse_color=(0.72,0.72,0.72,1)
          for o in meshes:
              o.data.materials.clear(); o.data.materials.append(mat)
          sc=bpy.context.scene; sc.render.engine="BLENDER_EEVEE"; sc.render.resolution_x=1000; sc.render.resolution_y=1000; sc.render.resolution_percentage=100
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(0.035,0.035,0.035)
          bpy.ops.mesh.primitive_plane_add(size=span*4, location=(center.x,center.y,mn.z-0.02*span))
          g=bpy.context.object; gm=bpy.data.materials.new("Ground"); gm.diffuse_color=(0.18,0.18,0.18,1); g.data.materials.append(gm)
          bpy.ops.object.light_add(type='SUN', location=(0,0,span)); bpy.context.object.data.energy=2.2; bpy.context.object.rotation_euler=(math.radians(35),0,math.radians(135))
          bpy.ops.object.light_add(type='AREA', location=(center.x-span,center.y-span,mx.z+span))
          a=bpy.context.object; a.data.energy=1000; a.data.size=span
          def look(o,t):
              o.rotation_euler=(t-o.location).to_track_quat('-Z','Y').to_euler()
          bpy.ops.object.camera_add(); cam=bpy.context.object; sc.camera=cam; cam.data.lens=55
          views=[("front",Vector((0,-1.7,0.35))),("three-quarter",Vector((1.3,-1.3,0.55))),("side",Vector((1.7,0,0.35))),("back",Vector((0,1.7,0.35)))]
          for name,v in views:
              cam.location=center+v*span; look(cam,center); sc.render.filepath=os.path.join(ev,f"mesh-{name}.png"); bpy.ops.render.render(write_still=True)
          with open(os.path.join(ev,"mesh-report.txt"),"w") as f:
              f.write(f"source=Hi3DGen\nmeshes={len(meshes)}\ntriangles_approx={tris}\nbounds={tuple(dims)}\n")
          PY
          blender -b --python /tmp/hi3dgen/render.py
          test -s /tmp/hi3dgen/evidence/mesh-three-quarter.png
          test -s /tmp/hi3dgen/evidence/mesh-front.png

      - name: Record proof
        run: |
          {
            echo "zero_spend=true"
            echo "unity_touched=false"
            echo "hi3dgen_outcome=${{ steps.hi3dgen.outcome }}"
            find /tmp/hi3dgen/output -maxdepth 1 -type f -printf 'output=%f bytes=%s\n' || true
          } | tee /tmp/hi3dgen/evidence/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-hi3dgen-gate-capability-v1
          path: |
            /tmp/hi3dgen/evidence
            /tmp/hi3dgen/output
            /tmp/hi3dgen/input/eldoria-gate-semantic.png
          retention-days: 14
