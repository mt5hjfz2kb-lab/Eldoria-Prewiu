name: Tier V reference production
on:
  push:
    branches: [feature/tier5-six-reference-models-20261029]
    paths: ['.github/workflows/tier5-reference-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-tier5-reference-production
  cancel-in-progress: false
jobs:
  source:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Generate or recover one exact approved reference
        id: source
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $script=Join-Path $env:RUNNER_TEMP 'tier5-run-one.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/run_one.ps1' -OutFile $script
          $request=Join-Path $env:RUNNER_TEMP 'tier5-selected-request.json'
          @{asset='granero-v';iteration=1;credit_limit=30;submit_authorized=$true;reference_url='https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/ArtSource/Tier5ReferenceProduction/references/granero-v.jpeg';reference_sha256='220b02d3e0e4dc265c433f4dc42a98002e811590b1611777be3bdfb43a991278'} | ConvertTo-Json | Set-Content $request
          & $script -RequestPath $request
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granero-v-image-r1-source-${{ github.run_id }}
          path: ${{ steps.source.outputs.source_dir }}/*
      - name: Recover detailed Lyra eligibility result without new processing
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $env:TRIPO_CLIENT_APP='codex'
          $env:TRIPO_DISTRIBUTION_CHANNEL='codex_plugin'
          $out=Join-Path $env:USERPROFILE 'EldoriaArtSource\Tier5ReferenceProduction\lyra-image-r1'
          $tripo=Get-Command tripo.cmd -ErrorAction Stop
          & $tripo.Source task get 63e1ea4c-a3dc-495b-9d38-5d30879f6e6e --json | Set-Content (Join-Path $out 'rig-eligibility-detail.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyra-rig-detail-${{ github.run_id }}
          path: ~/EldoriaArtSource/Tier5ReferenceProduction/lyra-image-r1/rig-eligibility-detail.json
  review:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: granero-v-image-r1-source-${{ github.run_id }}
          path: source
      - name: Prepare Blender source review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/render_asset.py' -o render_asset.py
      - name: Render source before artistic approval
        run: |
          blender -b -t 4 --python-exit-code 1 --python render_asset.py -- source/raw.glb review building > blender-render.log 2>&1 || { tail -80 blender-render.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granero-v-image-r1-review-${{ github.run_id }}
          path: |
            review/*
            blender-render.log
