name: Tier V reference production
on:
  push:
    branches: [feature/tier5-six-reference-models-20261029]
    paths: ['.github/workflows/tier5-reference-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-tier5-reference-production
  cancel-in-progress: false
jobs:
  finish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cantera-v-image-r1-source-40865697654
          run-id: 40865697654
          github-token: ${{ github.token }}
          path: source
      - name: Install Blender with its Python GLB dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/render_asset.py' -o render_asset.py
      - name: Optimize visually reviewed Quarry V using canonical Eldoria processor
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/finish_asset.py' -o finish_asset.py
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/dc4bea2f466fc356ef293da1ec041d651e618313/tools/tripo_module_blender.py' -o canonical.py
          blender -b -t 4 --python-exit-code 1 --python finish_asset.py -- source/raw.glb finished 25000 canonical.py > blender-finish.log 2>&1 || { tail -80 blender-finish.log; exit 1; }
          blender -b -t 4 --python-exit-code 1 --python render_asset.py -- finished/optimized.glb finished/review building > blender-render.log 2>&1 || { tail -60 blender-render.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantera-v-image-r1-finished-${{ github.run_id }}
          path: |
            finished/**
            blender-render.log
            blender-finish.log

