name: Tier V reference production
on:
  push:
    branches: [feature/tier5-six-reference-models-20261029]
    paths: ['.github/workflows/tier5-reference-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-tier5-reference-production
  cancel-in-progress: false
jobs:
  render-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyra-image-r1-source-40856011953
          run-id: 40856011953
          github-token: ${{ github.token }}
          path: source
      - name: Install Blender with its Python GLB dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/render_asset.py' -o render_asset.py
      - name: Render preserved source from eight angles
        run: |
          blender -b -t 4 --python-exit-code 1 --python render_asset.py -- source/raw.glb review character > blender-render.log 2>&1 || { tail -60 blender-render.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyra-image-r1-review-${{ github.run_id }}
          path: |
            review/*
            blender-render.log

# Render retry uses existing raw model, no Tripo call.
