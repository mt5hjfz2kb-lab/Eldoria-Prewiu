name: Tier V reference production
on:
  push:
    branches: [feature/tier5-six-reference-models-20261029]
    paths: ['.github/workflows/tier5-reference-production.yml']
permissions:
  contents: read
concurrency:
  group: eldoria-tier5-reference-production
  cancel-in-progress: false
jobs:
  lyra-image-r1:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 6
    steps:
      - name: Submit exactly one image-based Lyra task with persistent duplicate guard
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:USERPROFILE 'EldoriaArtSource\Tier5ReferenceProduction\lyra-image-r1'
          New-Item -ItemType Directory -Force $out | Out-Null
          $tripo=Get-Command tripo.cmd -ErrorAction SilentlyContinue
          if (-not $tripo) { $tripo=Get-Command tripo -ErrorAction Stop }
          $ref=Join-Path $out 'reference.jpeg'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/ArtSource/Tier5ReferenceProduction/references/lyra.jpeg' -OutFile $ref
          if ((Get-FileHash $ref -Algorithm SHA256).Hash.ToLowerInvariant() -ne '120a8e277cf8e25479fb13db4a41400d38605e50e5a0c4a393685701b93a8ca3') { throw 'Reference hash mismatch' }
          $result=Join-Path $out 'submission.json'
          if (Test-Path $result) { Get-Content $result; Write-Host 'EXISTING_SUBMISSION_REUSED_NO_NEW_CHARGE'; exit 0 }
          $lock=Join-Path $out 'SUBMISSION_STARTED.lock'
          if (Test-Path $lock) { throw 'Previous submission ambiguous. Recover CLI history; never resubmit.' }
          $doctor=(& $tripo.Source doctor --json | Out-String) | ConvertFrom-Json
          if (-not $doctor.ok) { throw 'CLI authentication not ready' }
          $bal=(& $tripo.Source balance --json | Out-String) | ConvertFrom-Json
          if ([double]$bal.balance -lt 30) { throw 'Insufficient prepaid credits. No purchase.' }
          $bal | ConvertTo-Json | Set-Content (Join-Path $out 'balance-before.json')
          $args=@('make',$ref,'--model','v3.1-20260211','-p','face_limit=85000','-p','texture=true','-p','pbr=true','-p','texture_quality=standard','-p','geometry_quality=standard','-p','texture_alignment=original_image','-p','orientation=align_image','--name','eldoria-lyra-reference-r1-20261029','--no-wait','--json','--yes','--quiet','--no-open','-o',$out)
          $args | ConvertTo-Json | Set-Content (Join-Path $out 'configuration.json')
          'Owner authorized image-based Lyra production. H3.1 standard image+texture:30 credits, official developers.tripo3d.ai/en/models/v3-1. One candidate, no premium options, no automatic retries.' | Set-Content (Join-Path $out 'authorization.txt')
          [IO.File]::WriteAllText($lock,[DateTime]::UtcNow.ToString('o'))
          $json=(& $tripo.Source @args | Out-String).Trim()
          $exitCode=$LASTEXITCODE
          $json | Set-Content $result
          Write-Host $json
          if ($exitCode -ne 0) { throw ('Submission failed or uncertain; no retry. Exit '+$exitCode) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyra-image-r1-submission-${{ github.run_id }}
          path: ~\EldoriaArtSource\Tier5ReferenceProduction\lyra-image-r1\*
