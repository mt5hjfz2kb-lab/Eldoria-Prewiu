name: Tier V reference production
on:
  push:
    branches: [feature/tier5-six-reference-models-20261029]
    paths: ['.github/workflows/tier5-reference-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-tier5-reference-production
  cancel-in-progress: false
jobs:
  source:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Generate or recover one exact approved reference
        id: source
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $script=Join-Path $env:RUNNER_TEMP 'tier5-run-one.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/run_one.ps1' -OutFile $script
          $request=Join-Path $env:RUNNER_TEMP 'tier5-selected-request.json'
          @{asset='cantera-v';iteration=1;credit_limit=30;submit_authorized=$true;reference_url='https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/ArtSource/Tier5ReferenceProduction/references/cantera-v.jpeg';reference_sha256='c049d7be471cf54ee2b15daa40288f6e71c024e35a8f06d69bf1373785f54d90'} | ConvertTo-Json | Set-Content $request
          & $script -RequestPath $request
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantera-v-image-r1-source-${{ github.run_id }}
          path: ${{ steps.source.outputs.source_dir }}/*
  review:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cantera-v-image-r1-source-${{ github.run_id }}
          path: source
      - name: Prepare Blender source review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/${{ github.sha }}/tools/tier5-reference-production/render_asset.py' -o render_asset.py
      - name: Render source before artistic approval
        run: |
          blender -b -t 4 --python-exit-code 1 --python render_asset.py -- source/raw.glb review building > blender-render.log 2>&1 || { tail -80 blender-render.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cantera-v-image-r1-review-${{ github.run_id }}
          path: |
            review/*
            blender-render.log
