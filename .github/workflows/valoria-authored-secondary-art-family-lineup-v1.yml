name: "[EXPERIMENT] Valoria Authored Secondary Family Lineup"

on:
  push:
    branches: [visual-proof/valoria-authored-secondary-art-family-v1]
    paths:
      - "Unity/Assets/Eldoria/Scripts/Editor/ValoriaAuthoredSecondaryArtFamilyLineupGateV1.cs"
      - ".github/workflows/valoria-authored-secondary-art-family-lineup-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valoria-authored-secondary-family-lineup
  cancel-in-progress: true

jobs:
  lineup:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage both authored candidate families
        shell: powershell
        run: |
          $src="$env:GITHUB_WORKSPACE\pipeline\candidates\valoria-authored-secondary-art-family-v1"
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\ASFCandidates"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*.glb" $dest -Force
          if((Get-ChildItem $dest -Filter '*.glb').Count -lt 6){throw 'Expected six ASF candidate GLBs'}
      - name: Capture normalized A/B lineup
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaAuthoredSecondaryArtFamilyLineupV1"
          $log="$env:RUNNER_TEMP\ValoriaAuthoredSecondaryArtFamilyLineupV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaAuthoredSecondaryArtFamilyLineupGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1100000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'ASF lineup timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "ASF lineup failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-authored-secondary-family-lineup-${{ github.run_id }}
          path: |
            Unity/ValoriaAuthoredSecondaryArtFamilyLineupV1/*
            ${{ runner.temp }}/ValoriaAuthoredSecondaryArtFamilyLineupV1.log
          if-no-files-found: warn
          retention-days: 30
