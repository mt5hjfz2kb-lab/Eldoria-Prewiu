name: "[LEGACY] Historical Valoria module rescue inventory"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 10
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Inventory certified historical GLBs by exact SHA
        shell: powershell
        run: |
          $registry = Get-Content "$env:GITHUB_WORKSPACE\pipeline\historical-module-rescue.json" -Raw | ConvertFrom-Json
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          if (-not (Test-Path $downloads)) { throw "Downloads not found: $downloads" }
          $files = @(Get-ChildItem $downloads -File -Filter '*.glb' -ErrorAction SilentlyContinue)
          $hashed = @()
          foreach($file in $files){
            $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashed += [pscustomobject]@{ name=$file.Name; path=$file.FullName; bytes=$file.Length; sha256=$sha; last_write=$file.LastWriteTime.ToString('o') }
          }
          $found=@()
          foreach($family in $registry.families){
            $expected=([string]$family.optimized_sha256).ToLowerInvariant()
            $match=@($hashed | Where-Object { $_.sha256 -eq $expected })
            $found += [pscustomobject]@{
              family=[string]$family.family
              expected_sha256=$expected
              rescue_priority=[string]$family.rescue_priority
              target_profile=[string]$family.target_profile
              present=($match.Count -eq 1)
              file_name=if($match.Count -eq 1){$match[0].name}else{''}
              bytes=if($match.Count -eq 1){$match[0].bytes}else{0}
              last_write=if($match.Count -eq 1){$match[0].last_write}else{''}
              ambiguous=($match.Count -gt 1)
              matches=$match.Count
            }
          }
          $out=[pscustomobject]@{
            schema_version=1
            scanned_glb_count=$files.Count
            certified_family_count=$registry.families.Count
            found_count=@($found | Where-Object {$_.present}).Count
            families=$found
          }
          $path="$env:RUNNER_TEMP\historical-module-rescue-inventory.json"
          $out | ConvertTo-Json -Depth 8 | Set-Content $path
          Get-Content $path

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-module-rescue-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/historical-module-rescue-inventory.json
          if-no-files-found: warn
          retention-days: 14
