name: Eldoria real same-PC Ollama Qwen and Blender artistic cycle
on:
  push:
    branches:
      - validation/artist-windows-pc-bridge-20261014
    paths:
      - '.github/workflows/eldoria-artist-complete-pc-local-qwen-blender-cycle.yml'
permissions:
  contents: read
concurrency:
  group: eldoria-single-native-windows-qwen-blender-art-cycle
  cancel-in-progress: false
jobs:
  original-qwen-and-blender-in-same-windows-pc:
    if: github.ref == 'refs/heads/validation/artist-windows-pc-bridge-20261014'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 42
    steps:
      - name: Locate GitHub Desktop Git without installing software
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $exe=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $exe) { throw 'GitHub Desktop Git unavailable' }
            $folder=Split-Path $exe
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
          git --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tools/art-direction/full-studio
            Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1
            references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
          sparse-checkout-cone-mode: false
      - name: Qwen 4B reads original reference and original inherited source and physically authors Blender on the PC
        timeout-minutes: 34
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & tools/art-direction/full-studio/pc_local_qwen_blender_cycle.ps1 `
            -Source 'Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb' `
            -Reference 'references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg' `
            -Out (Join-Path $env:RUNNER_TEMP 'eldoria-native-qwen-blender-new-art') `
            -Model 'qwen3-vl:4b-instruct'
          if (-not $?) { throw 'Same-PC authentic artist cycle failed' }
      - name: Preserve original Qwen JSON, real Blender source, GLB, matched screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-same-PC-original-Qwen-and-real-Blender-artwork
          path: |
            ${{ runner.temp }}/eldoria-native-qwen-blender-new-art/
          if-no-files-found: warn
          retention-days: 14
