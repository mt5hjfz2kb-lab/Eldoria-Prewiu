name: "[BASTION I] Original playable scene Unity-only environment A/B"
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths:
      - '.github/workflows/valoria-bastion1-unity-environment-review.yml'
      - 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/Bastion1UnityEnvironmentReview.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-bastion1-visual-unity-environment-ab
  cancel-in-progress: false
jobs:
  guard-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no new geometry is authored and gameplay is protected
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/Bastion1UnityEnvironmentReview.cs").read_text()
          for x in ('ProductionSlice/Runtime/Valoria.unity','Bastion1UnityEnvironmentCandidate.unity','CaptureThree(camera,"before"','CaptureThree(camera,"after"','GetComponentsByMissingSymbol'):
            if x == 'GetComponentsByMissingSymbol':
              assert x not in s
            else: assert x in s
          assert 'new Mesh(' not in s and 'CreatePrimitive(' not in s
          assert 'ArtTests/Bastion1Assembly/GeneratedUnityEnvironment' in s
          print("BASTION_ENV_REUSE_ONLY_SOURCE_CHECK_PASS")
          PY
  unity-native-environment-ab:
    needs: guard-source
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 85
    steps:
      - name: Expose existing Git before checkout
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $found=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $found){throw 'GitHub Desktop Git unavailable; refusing REST ZIP checkout'}
            $dir=Split-Path $found
            $env:PATH="$dir;$env:PATH"
            Add-Content $env:GITHUB_PATH $dir
          }
          & git.exe --version
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Ensure Blender and other Unity processes are not active
        shell: powershell
        run: |
          $blender=@(Get-Process blender -ErrorAction SilentlyContinue)
          $unity=@(Get-Process Unity -ErrorAction SilentlyContinue)
          if($blender.Count -gt 0 -or $unity.Count -gt 0){
            throw "Cannot overlap owner work: Blender $($blender.Count), Unity $($unity.Count)"
          }
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw "No configured native Unity executable"}
          Write-Host 'BASTION_ENVIRONMENT_NO_OVERLAP_PASS'
      - name: Recover exact prior playable Unity scene with generated materials
        uses: actions/download-artifact@v4
        with:
          run-id: 38419031491
          name: bastion1-player-integration-38419031491
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old_game_scene
      - name: Stage same original scene without replacing gameplay scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'old_game_scene'
          $files=@(Get-ChildItem -LiteralPath $root -Recurse -Filter 'Valoria.unity' -File |
            Where-Object { $_.FullName.Replace('\','/') -match '/ProductionSlice/Runtime/Valoria\.unity$' })
          if($files.Count -ne 1){throw "Expected exactly one original playable scene, found $($files.Count)"}
          $unityRoot=$files[0].FullName -replace '[\\/]Assets[\\/]Eldoria[\\/]ProductionSlice[\\/]Runtime[\\/]Valoria\.unity$',''
          $src=Join-Path $unityRoot 'Assets/Eldoria'
          $target=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria'
          foreach($relative in @(
            'ArtTests/Bastion1Assembly/Generated',
            'ArtTests/Bastion1Assembly/GeneratedNormals',
            'ArtTests/Bastion1Assembly/Bastion1ReferenceAssembly.unity',
            'ProductionSlice/Runtime/Valoria.unity'
          )){
            $from=Join-Path $src $relative
            $to=Join-Path $target $relative
            if(-not(Test-Path $from)){throw "Missing historical playable source $relative"}
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            if(Test-Path $to){Remove-Item -LiteralPath $to -Recurse -Force}
            Copy-Item -LiteralPath $from -Destination $to -Recurse -Force
            if(Test-Path ($from+'.meta')){Copy-Item -LiteralPath ($from+'.meta') -Destination ($to+'.meta') -Force}
          }
          Write-Host 'BASTION_ENVIRONMENT_RECOVERED_IMMUTABLE_GAMEPLAY'
      - name: Render genuine Unity native same-camera lighting and terrain before/after
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'bastion1-unity-environment-ab.log'
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',"$env:GITHUB_WORKSPACE/Unity",
            '-executeMethod','Eldoria.EditorTools.Bastion1UnityEnvironmentReview.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          Get-Content $log -Tail 110 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/Bastion1UnityEnvironmentAB" | Out-Null
          Copy-Item -LiteralPath $log -Destination "$env:GITHUB_WORKSPACE/Bastion1UnityEnvironmentAB/Unity.log" -Force
          if($p.ExitCode -ne 0){throw "Unity lighting/terrain A/B failure exit=$($p.ExitCode)"}
          $d=Join-Path $env:GITHUB_WORKSPACE 'Unity/Bastion1UnityEnvironmentAB'
          foreach($name in @('before-landscape.png','after-landscape.png',
            'before-mobile.png','after-mobile.png','before-portrait.png',
            'after-portrait.png','review.json')){
            if(-not(Test-Path (Join-Path $d $name))){throw "Missing actual Unity evidence $name"}
          }
          Copy-Item "$d/*" -Destination "$env:GITHUB_WORKSPACE/Bastion1UnityEnvironmentAB" -Force
          Write-Host 'BASTION_UNITY_ENVIRONMENT_A_B_COMPLETE visual_art_approval=false release=false'
      - name: Upload isolated genuine A/B only, never public promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bastion1-unity-environment-ab-${{ github.run_id }}
          path: |
            Bastion1UnityEnvironmentAB/**
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Bastion1UnityEnvironmentCandidate.unity*
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedUnityEnvironment/**
          if-no-files-found: warn
          retention-days: 14
