name: Studio - Corona pinned final visual comparison
on:
  push:
    branches: [pilot/eldoria-openai-development-studio-20261125]
    paths: ['.github/workflows/eldoria-openai-studio-corona-ab.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-corona-owner-final-ab-once
  cancel-in-progress: false
jobs:
  evidence:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == '157874b590e1a75758856a19f1ca00ac751444db' && github.event.head_commit.message == 'Corona Studio: pin remaining budget to actual final A/B evidence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Wait for the actual pinned Unity and mobile workflow, no paid API calls
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: '45802472999'
          TARGET_SHA: '91b8de9874aed87219d733efa6e8e0aa56207f1e'
        run: |
          set -euo pipefail
          export GH_REPO="$GITHUB_REPOSITORY"
          for attempt in $(seq 1 320); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET_RUN")
            test "$(jq -r .head_sha <<< "$status")" = "$TARGET_SHA"
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/valoria-ciudad-region-unificada-20261121" --jq .object.sha)
            test "$current" = "$TARGET_SHA"
            if test "$(jq -r .status <<< "$status")" = completed; then
              test "$(jq -r .conclusion <<< "$status")" = success
              exit 0
            fi
            sleep 30
          done
          echo 'Pinned candidate did not complete within the bounded evidence window. No paid calls.'
          exit 1
      - name: Download original and candidate verified screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45638738009 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir before
          gh run download 45802472999 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir after
          gh run download 45802472999 --repo "$GITHUB_REPOSITORY" --name corona-before-after-dpr1 --dir ab
      - uses: actions/upload-artifact@v4
        with:
          name: corona-actual-ab-input
          path: |
            before/*.png
            after/*.png
            after/journey.json
            ab/manifest.json
          retention-days: 14
  review:
    needs: evidence
    strategy:
      fail-fast: false
      matrix:
        group: [hud, management, narrative]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/openai-development-studio
      - uses: actions/download-artifact@v4
        with:
          name: corona-actual-ab-input
          path: evidence
      - name: Verify new owner allocation, exact live leases and source evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          cd tools/openai-development-studio
          python3 budget_guard.py --self-test
          python3 mission_packet.py --self-test
          python3 - <<'PY'
          import base64,json,subprocess,os,datetime
          from decimal import Decimal as D
          import budget_guard
          def gh(p):return json.loads(subprocess.check_output(['gh','api',p],timeout=60))
          repo=os.environ['GITHUB_REPOSITORY']
          meta=gh(f'repos/{repo}/contents/pipeline/active-workstreams.json?ref=main')
          blob=gh(f'repos/{repo}/git/blobs/{meta["sha"]}')
          assert blob['sha']==meta['sha']
          reg=json.loads(base64.b64decode(blob['content']))
          studio=next(a for a in reg['active'] if a['id']=='eldoria-openai-development-studio-20261125')
          assert studio['owner']=='chatgpt-corona-brecha-commercial-20261126' and studio['ownership_revision']==18 and studio['phase']=='CORONA_UI_AGENT_MISSION'
          assert gh(f'repos/{repo}/git/ref/heads/pilot/eldoria-openai-development-studio-20261125')['object']['sha']==os.environ['GITHUB_SHA']
          assert gh(f'repos/{repo}/git/ref/heads/experiment/valoria-ciudad-region-unificada-20261121')['object']['sha']=='91b8de9874aed87219d733efa6e8e0aa56207f1e'
          ledger=json.load(open('corona-owner-five-budget.json'))
          day=datetime.datetime.now(datetime.timezone.utc).date()
          check=budget_guard.validate(ledger,day)
          assert D(check['cap_usd'])==D('5') and D(check['reserved_usd'])==D('4.90')
          ident='corona-ab-'+os.environ['GROUP']+'-20261126'
          budget_guard.authorize(ledger,day,ident,ident,1,D('.70'))
          PY
          python3 prepare_corona_ab.py "$GROUP" ../../evidence/before ../../evidence/after ../../evidence/ab /tmp/corona-packet
          python3 mission_packet.py --packet /tmp/corona-packet/packet.json
      - uses: actions/upload-artifact@v4
        with:
          name: corona-ab-packet-${{ matrix.group }}
          path: /tmp/corona-packet/
      - name: Run independent paid visual review of actual candidate
        id: live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELDORIA_AUTH_EVENT: corona-ab-${{ matrix.group }}-20261126
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/corona-start
          cd tools/openai-development-studio
          cp corona-owner-five-budget.json budget-cycle.json
          python3 - <<'PY'
          import os,studio,mission_packet
          studio.MAX_OUTPUT=2300
          original=studio.make_payload
          def high_detail(*args,**kwargs):
              payload,manifest=original(*args,**kwargs)
              for entry in payload.get('input',[]):
                  for item in entry.get('content',[]):
                      if item.get('type')=='input_image':item['detail']='high'
              return payload,manifest
          studio.make_payload=high_detail
          mission_packet.execute('/tmp/corona-packet/packet.json','/tmp/corona-result',True,os.environ['ELDORIA_AUTH_EVENT'])
          PY
      - name: Record usage
        if: always() && steps.live.outcome != 'skipped'
        env:
          LIVE_STATUS: ${{ steps.live.outcome }}
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p /tmp/corona-economics
          python3 tools/openai-development-studio/intervention_report.py collect --root /tmp/corona-result --run "$GITHUB_RUN_ID" --request "corona-ab-$GROUP-20261126" --started "$(cat /tmp/corona-start)" --finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --source-run 45802472999 --status "$LIVE_STATUS" --out "/tmp/corona-economics/$GROUP.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-ab-result-${{ matrix.group }}
          path: /tmp/corona-result/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-ab-economics-${{ matrix.group }}
          path: /tmp/corona-economics/
          retention-days: 30
          if-no-files-found: warn
