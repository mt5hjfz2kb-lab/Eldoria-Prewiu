          gh run download 45812100129 --repo "$GITHUB_REPOSITORY" --name corona-agent-art-plan --dir references
          gh run download 45823822067 --repo "$GITHUB_REPOSITORY" --name corona-agent-material-production --dir artist
          python3 -m py_compile tools/corona-art-iteration/spatial_visual_review.py
      - name: Three independent spatial and corrected UI audits, nonduplicated 0.40 USD reservation
