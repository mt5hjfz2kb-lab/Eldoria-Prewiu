name: "[PROMOTE] Certified Hero Bastion for Asset Reprocessing"

on:
  push:
    branches: [visual-proof/asset-library-reprocessing-pass-v1]
    paths:
      - '.github/workflows/promote-asset-reprocessing-hero-bastion.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: eldoria-promote-asset-reprocessing-hero-bastion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-proof/asset-library-reprocessing-pass-v1
          fetch-depth: 0

      - name: Recover exact certified optimized Hero Bastion
        shell: bash
        run: |
          set -euo pipefail
          artifact_id=11143009723
          expected=afb6cee6ae572b0879650f18285b32798e263c17359a158ffe2bdd03fb62ad5c
          tmp="$RUNNER_TEMP/hero-bastion"
          rm -rf "$tmp" "$tmp.zip"
          mkdir -p "$tmp"
          curl -fsSL             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             -o "$tmp.zip"
          unzip -q "$tmp.zip" -d "$tmp"
          mapfile -t matches < <(find "$tmp" -type f -name '*.glb' -print0 | while IFS= read -r -d '' f; do
            sha=$(sha256sum "$f" | awk '{print $1}')
            if [[ "$sha" == "$expected" ]]; then printf '%s\n' "$f"; fi
          done)
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected one certified GLB; found ${#matches[@]}" >&2
            exit 1
          fi
          dest="Unity/Assets/Eldoria/Resources/Valoria/HeroBastionGenerated"
          mkdir -p "$dest"
          cp "${matches[0]}" "$dest/Valoria_HeroBastion_v1.glb"
          actual=$(sha256sum "$dest/Valoria_HeroBastion_v1.glb" | awk '{print $1}')
          test "$actual" = "$expected"
          bytes=$(stat -c%s "$dest/Valoria_HeroBastion_v1.glb")
          test "$bytes" = "13257704"
          echo "PROMOTION_SOURCE_PASS sha256=$actual bytes=$bytes"

      - name: Commit exact production bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eldoria-art-bot"
          git config user.email "eldoria-art-bot@users.noreply.github.com"
          git add Unity/Assets/Eldoria/Resources/Valoria/HeroBastionGenerated/Valoria_HeroBastion_v1.glb
          if git diff --cached --quiet; then
            echo "Exact Hero Bastion is already promoted."
            exit 0
          fi
          git commit -m "art: promote certified Hero Bastion for asset reprocessing"
          git push origin HEAD:visual-proof/asset-library-reprocessing-pass-v1
