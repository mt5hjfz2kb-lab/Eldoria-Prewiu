name: Eldoria Coordinator v1 (read-only)
# Ronda 1 line D: one owner-approved published mobile QA execution; zero Windows/Unity runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/active-workstreams.json
      - tools/eldoria-coordinator-v1.cjs
      - tests/eldoria-coordinator-v1.test.cjs
      - .github/workflows/eldoria-coordinator-v1.yml
  workflow_run:
    workflows: ['[PRODUCTION] Valoria First Playable City Slice v1']
    types: [completed]
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
concurrency:
  group: eldoria-coordinator-readonly
  cancel-in-progress: true
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run coordinator regression tests
        run: node --test tests/eldoria-coordinator-v1.test.cjs
      - name: Evaluate handoff gates without side effects
        run: node tools/eldoria-coordinator-v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-coordinator-v1-report
          path: pipeline/reports/coordinator-v1-latest.json
          retention-days: 14

  authorize-mobile-qa:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'ops(qa-mobile): dispatch authorized round1 published probe'
    needs: triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            pipeline/active-workstreams.json
      - name: Verify canonical R1 QA D claim and zero resource conflict
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            [.active[] | select(.id=="eldoria-r1-mobile-independent-qa" and .owner=="chat-dg-r1-mobile-qa-20261008" and .status=="active" and .paid_credits==0 and (.resources|length)==0)] | length == 1
          ' pipeline/active-workstreams.json
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
  mobile-published-qa:
    needs: authorize-mobile-qa
    if: needs.authorize-mobile-qa.outputs.authorized == 'true'
    uses: ./.github/workflows/unity-webgl-startup.yml
    permissions:
      contents: read
  mobile-qa-independent-report:
    if: always() && needs.authorize-mobile-qa.outputs.authorized == 'true'
    needs: [authorize-mobile-qa, mobile-published-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.mobile-published-qa.result == 'success'
        with:
          name: eldoria-webgl-startup-evidence
          path: qa-evidence
      - name: Independently verify evidence and send DG result
        uses: actions/github-script@v7
        env:
          QA_RESULT: ${{ needs.mobile-published-qa.result }}
        with:
          script: |
            const fs=require('fs');
            const {owner,repo}=context.repo;
            const marker='<!-- eldoria-r1-mobile-qa-'+context.runId+' -->';
            const runs=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:23,per_page:100});
            if(runs.some(x=>(x.body||'').includes(marker)))return;
            let status='BLOCKED',summary='Independent published probe did not finish successfully; inspect job and artifact before correction.';
            if(process.env.QA_RESULT==='success'){
              const p=JSON.parse(fs.readFileSync('qa-evidence/report.json','utf8'));
              const ok=p.failure===null && Array.isArray(p.runtimeErrors) && p.runtimeErrors.length===0 && p.coverage?.fullBastionIToIIPass===true && p.checks?.navigationGatherPersistencePass===true && Array.isArray(p.fullFlows) && p.fullFlows.length>=2 && p.fullFlows.every(x=>x.pass===true && x.persistencePass===true && x.resetPass===true);
              if(ok){status='PASS_MOBILE_PUBLISHED_TECH';summary='Real published unity-owner URL passed independent landscape+portrait mobile-emulation progression, World gathering, interaction, persistent reload and reset, zero fatal runtime errors. Not physical iPhone or visual acceptance of M07.'}
              else{summary='QA workflow green but independent evidence checks rejected published gameplay report.'}
            }
            const body=[marker,'### D13 — QA móvil independiente / Ronda 1','**Resultado:** '+status,'**Run:** https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,'**SHA de ejecución:** '+context.sha,'**Artefacto:** eldoria-webgl-startup-evidence','**Verificación:** '+summary,'**Propiedad:** M07 y M11 intactos. No se declara aceptación visual de M07 ni publicación nueva.'].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});
            if(status!=='PASS_MOBILE_PUBLISHED_TECH')core.setFailed(summary);

  r2b-production-intake:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.event.head_commit.message == 'ops(m16): verify real R2-B production evidence intake')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent canonical M03 tests
        run: node --test tests/m03/certify.test.mjs
      - name: Receive actual Unity production and independent Unity QA; report accurately to DG
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const run=context.payload.workflow_run || (await github.rest.actions.getWorkflowRun({owner,repo,run_id:37838898425})).data;
            const marker='<!-- eldoria-r2b-unity-intake-'+run.id+' -->';
            const existing=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:23,per_page:100});
            if(existing.some(x=>(x.body||'').includes(marker)))return;
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
            const primary=artifacts.find(x=>x.name==='valoria-first-playable-city-slice-v1'&&!x.expired);
            const candidates=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,per_page:100});
            const ui=candidates.find(x=>x.name==='UI Progression Certification (fast)'&&x.head_sha===run.head_sha&&x.conclusion==='success');
            const targetSource='6e0e12396a98b04333b595fff704afa3e849c30a';
            const isR2B=run.head_sha===targetSource;
            const technical=run.conclusion==='success'&&!!primary&&!!ui&&isR2B;
            const verdict=technical?'PASS_UNITY_PRODUCTION_AND_INDEPENDENT_TECH_QA__WEBGL_PENDING':'BLOCKED_UNVERIFIED_R2B_SOURCE_OR_EVIDENCE';
            const body=[
              marker,'### R2-B — Coordinador M16 → Unity producción → QA independiente → Dirección General',
              '**Estado:** '+verdict,
              '**Producción:** '+run.html_url,
              '**SHA origen:** '+run.head_sha,
              '**Artifact producción:** '+(primary?primary.id:'AUSENTE'),
              '**Unity UI certificación mismo SHA:** '+(ui?ui.html_url:'NO DEMOSTRADA'),
              '**Control M03:** suite independiente ejecutada en este workflow',
              '**NO CERRAR R2-B:** aún se requieren candidato WebGL aislado, ambas decisiones clicables, persistencia, revisión visual y EXP-CAM-01/EXP-BLD-02. No alterar publicación estable.',
              '**M04:** ante fallo clasificable, conservar bloqueo/owner y tramitar corrección autorizada; no repetir SHA determinísticamente fallido.'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});
            if(!technical)core.setFailed(verdict);
