name: Eldoria Coordinator v1 (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/active-workstreams.json
      - tools/eldoria-coordinator-v1.cjs
      - tests/eldoria-coordinator-v1.test.cjs
      - .github/workflows/eldoria-coordinator-v1.yml
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
concurrency:
  group: eldoria-coordinator-readonly
  cancel-in-progress: true
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run coordinator regression tests
        run: node --test tests/eldoria-coordinator-v1.test.cjs
      - name: Evaluate handoff gates without side effects
        run: node tools/eldoria-coordinator-v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-coordinator-v1-report
          path: pipeline/reports/coordinator-v1-latest.json
          retention-days: 14
