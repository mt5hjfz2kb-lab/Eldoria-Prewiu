name: One-shot Tripo runner bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tripo-runner-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eldoria-tripo-runner-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15
    steps:
      - name: Bootstrap dedicated Tripo runner
        shell: powershell
        env:
          ELDORIA_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\eldoria-actions-tripo'
          $runnerName = 'Eldoria-Tripo'
          $runnerVersion = '2.337.0'
          $zip = Join-Path $env:RUNNER_TEMP "actions-runner-win-x64-$runnerVersion.zip"

          Write-Host "TRIPO_RUNNER_BOOTSTRAP=START"

          # Reuse GitHub Desktop's authenticated credential without ever printing it.
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git/GitHub Desktop credential path unavailable.' }
            $git = Get-Item $candidate
          }

          $gitExe = if ($git -is [System.Management.Automation.CommandInfo] -and $git.Path) { $git.Path }
                    elseif ($git.PSObject.Properties.Name -contains 'FullName') { $git.FullName }
                    else { [string]$git }
          if (-not (Test-Path $gitExe)) { throw "Resolved git executable not found: $gitExe" }
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo.FileName = $gitExe
          $proc.StartInfo.Arguments = 'credential fill'
          $proc.StartInfo.UseShellExecute = $false
          $proc.StartInfo.CreateNoWindow = $true
          $proc.StartInfo.RedirectStandardInput = $true
          $proc.StartInfo.RedirectStandardOutput = $true
          $proc.StartInfo.RedirectStandardError = $true
          [void]$proc.Start()
          $proc.StandardInput.WriteLine('protocol=https')
          $proc.StandardInput.WriteLine('host=github.com')
          $proc.StandardInput.WriteLine('')
          $proc.StandardInput.Close()
          $credentialText = $proc.StandardOutput.ReadToEnd()
          $credentialError = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          if ($proc.ExitCode -ne 0) { throw 'Git credential fill failed without exposing credential output.' }
          $passwordLine = $credentialText -split "`r?`n" | Where-Object { $_ -like 'password=*' } | Select-Object -First 1
          if (-not $passwordLine) { throw 'GitHub Desktop credential was not available to this runner user.' }
          $githubToken = $passwordLine.Substring('password='.Length)
          if ([string]::IsNullOrWhiteSpace($githubToken)) { throw 'GitHub credential returned an empty token.' }

          $headers = @{
            Authorization = "Bearer $githubToken"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Eldoria-Tripo-Runner-Bootstrap'
          }
          $registration = Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$env:ELDORIA_REPO/actions/runners/registration-token"
          $githubToken = $null
          if (-not $registration.token) { throw 'GitHub did not return a runner registration token.' }

          if (-not (Test-Path $root)) {
            New-Item -ItemType Directory -Path $root -Force | Out-Null
          }

          $config = Join-Path $root 'config.cmd'
          if (-not (Test-Path $config)) {
            Invoke-WebRequest -Uri "https://github.com/actions/runner/releases/download/v$runnerVersion/actions-runner-win-x64-$runnerVersion.zip" -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          }

          Push-Location $root
          try {
            if (Test-Path '.runner') {
              Write-Host 'Existing dedicated runner configuration found; preserving it.'
            } else {
              & .\config.cmd --url "https://github.com/$env:ELDORIA_REPO" --token $registration.token --name $runnerName --labels 'tripo-local' --work '_work' --unattended --replace
              if ($LASTEXITCODE -ne 0) { throw "Runner config failed with exit code $LASTEXITCODE." }
            }
          } finally {
            $registration.token = $null
            Pop-Location
          }

          # GitHub Runner cleans child processes carrying RUNNER_TRACKING_ID at job end.
          # Clear it for the dedicated runner so it survives this bootstrap job.
          $launcher = Join-Path $root 'start-tripo-runner.ps1'
          @'
          $env:RUNNER_TRACKING_ID = ''
          Set-Location 'C:\eldoria-actions-tripo'
          while ($true) {
            & .\run.cmd
            Start-Sleep -Seconds 5
          }
          '@ | Set-Content -Path $launcher -Encoding UTF8

          $existing = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like '*start-tripo-runner.ps1*' }
          if (-not $existing) {
            $oldTracking = $env:RUNNER_TRACKING_ID
            $env:RUNNER_TRACKING_ID = ''
            Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$launcher) -WindowStyle Hidden
            $env:RUNNER_TRACKING_ID = $oldTracking
            Start-Sleep -Seconds 4
          }

          Write-Host "TRIPO_RUNNER_BOOTSTRAP=PASS"
          Write-Host "TRIPO_RUNNER_NAME=$runnerName"
          Write-Host "TRIPO_RUNNER_LABEL=tripo-local"

  verify:
    needs: bootstrap
    runs-on: [self-hosted, windows, tripo-local]
    timeout-minutes: 5
    steps:
      - name: Verify dedicated runner accepts work
        shell: powershell
        run: |
          Write-Host "TRIPO_DEDICATED_RUNNER=ONLINE"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
