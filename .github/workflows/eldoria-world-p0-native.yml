name: Eldoria P0 real Unity world-entry and streaming proof
on:
  push:
    branches: [fix/eldoria-world-first-entry-p0-20261114]
    paths: [tools/eldoria-private-beta/world-p0-request.txt]
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-world-p0-exclusive-unity
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta/world-p0-request.txt
          sparse-checkout-cone-mode: false
      - name: Verify exclusive live CAS before touching Windows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA']
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers=h)
              return json.load(urllib.request.urlopen(req,timeout=30))
          lines=open('tools/eldoria-private-beta/world-p0-request.txt').read().strip().splitlines()
          assert lines==['state=FIRST_WORLD_ENTRY_NATIVE_ONLY',
                         'owner=chatgpt-eldoria-world-entry-p0-20261114',
                         'revision=79','testers_allowed=false','attempt=6']
          assert get('git/ref/heads/fix/eldoria-world-first-entry-p0-20261114')['object']['sha']==sha
          item=get('contents/pipeline/active-workstreams.json?ref=main')
          b=item.get('content')
          if item.get('encoding')!='base64' or not b:
              blob=get('git/blobs/'+item['sha'])
              assert blob.get('sha')==item['sha'] and blob.get('encoding')=='base64'
              b=blob['content']
          j=json.loads(base64.b64decode(b))
          w=next(x for x in j['active'] if x['id']=='eldoria-private-beta-i-v-20261107')
          holders=[x for x in j['active'] if 'windows-runner-heavy' in x.get('resources',[])]
          assert len(holders)==1 and holders[0]['id']==w['id']
          assert w['owner']=='chatgpt-eldoria-world-entry-p0-20261114'
          assert w['branch']=='fix/eldoria-world-first-entry-p0-20261114'
          assert w['ownership_revision']==79 and w['ownership_state']=='claimed'
          print('P0_EXACT_CURRENT_SOURCE_LIVE_LEASE_VERIFIED',sha)
          PY
  native:
    needs: preflight
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 150
    steps:
      - name: Verify installed Git, disk safety and no existing Unity or Blender
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Another owner runs Unity or Blender'}
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity Editor not installed'}
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'No installed Git; archive fallback forbidden'}
            $dir=Split-Path $git;$env:PATH="$dir;$env:PATH";Add-Content $env:GITHUB_PATH $dir
          }
          $free=(Get-PSDrive C).Free/1GB
          Write-Host ('P0_FREE_BEFORE_GIB='+[Math]::Round($free,2))
          if($free -lt 36){throw 'Too little free disk for isolated Unity; preserve all sources'}
      - name: Sparse partial clone exact current project to owned disposable path
        shell: powershell
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('eldoria-world-p0-'+$env:GITHUB_RUN_ID)
          if(Test-Path $root){throw 'Run-owned project already exists; refuse overwrite'}
          & git init -q $root
          if($LASTEXITCODE){throw 'git init failed'}
          & git -C $root config core.longpaths true
          & git -C $root remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          & git -C $root sparse-checkout set --no-cone '/Unity/' '/tools/eldoria-private-beta/'
          if($LASTEXITCODE){throw 'sparse init failed'}
          & git -C $root fetch --no-tags --depth=1 --filter=blob:none origin $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'exact partial fetch failed'}
          & git -C $root checkout --detach FETCH_HEAD
          if($LASTEXITCODE){throw 'exact source checkout failed'}
          if((& git -C $root rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'source mismatch'}
          $project=Join-Path $root 'Unity'
          if(-not(Test-Path (Join-Path $project 'Assets/Eldoria/BetaMemoryProbe/Tests/PlayMode/LazyRegionStartupTests.cs'))){throw 'real gameplay test missing'}
          if((Get-PSDrive C).Free/1GB -lt 24){throw 'Unity Library space gate failed; no cleanup of other projects'}
          Add-Content $env:GITHUB_ENV ('ELDORIA_P0_SRC='+$root)
          Add-Content $env:GITHUB_ENV ('ELDORIA_P0_PROJECT='+$project)
          New-Item -ItemType Directory -Force -Path 'world-p0-results'|Out-Null
          Set-Content -Path 'world-p0-results/source.txt' -Value $env:GITHUB_SHA
      - name: Restore only exact SHA-audited Bastion III art or explicitly run logical-only diagnostics
        shell: powershell
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            throw 'Another native editor is running'
          }
          $auditPath=Join-Path $env:ELDORIA_P0_SRC 'tools/eldoria-private-beta/native/existing-input-audit.json'
          $audit=Get-Content -LiteralPath $auditPath -Raw | ConvertFrom-Json
          if($audit.base -ne '948ffa9837168a0b68dab80be76b66350422b23a'){
            throw 'Original Bastion III source provenance differs'
          }
          $prefix='Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Resources/BastionIII/'
          $art=@($audit.files|Where-Object {$_.path.StartsWith($prefix)})
          if($art.Count -ne 51 -or ($art|Measure-Object bytes -Sum).Sum -ne 108788643){
            throw 'Original 51-file native asset inventory has changed'
          }
          $origins=@('beta-structural-source-42505611257-1','valoria-layered-source')
          $copies=New-Object 'System.Collections.Generic.List[object]'
          $missing=New-Object 'System.Collections.Generic.List[string]'
          foreach($item in $art){
            $rel=[string]$item.path
            if($rel.Contains('..') -or $rel.Contains(':') -or $rel.EndsWith('.cs') -or
                $rel.EndsWith('.dll') -or $rel.EndsWith('.exe')){
              throw 'Unapproved input in original asset manifest'
            }
            $dest=Join-Path $env:ELDORIA_P0_SRC $rel
            if(Test-Path -LiteralPath $dest){
              if((Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash -ne $item.sha256){
                throw ('Protected source asset differs from audit: '+$rel)
              }
              continue
            }
            $from=$null
            foreach($name in $origins){
              $candidate=Join-Path (Join-Path $env:GITHUB_WORKSPACE $name) $rel
              if((Test-Path -LiteralPath $candidate -PathType Leaf) -and
                 -not ((Get-Item -LiteralPath $candidate).Attributes -band [IO.FileAttributes]::ReparsePoint) -and
                 (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash -eq $item.sha256){
                $from=$candidate;break
              }
            }
            if(-not $from){$missing.Add($rel);continue}
            $copies.Add(@{source=$from;dest=$dest;sha256=$item.sha256;path=$rel})
          }
          if($missing.Count){
            # This is a diagnostic-only fallback. It never substitutes or
            # changes source artwork, scene, gameplay, or player build files.
            # The published candidate MUST retain its full original art.
            'ELDORIA_WORLD_P0_LOGIC_ONLY_MISSING_ART=1' | Add-Content $env:GITHUB_ENV
            @('status=INCOMPLETE_ORIGINAL_BASTION_III_ART_NOT_CERTIFIED',
              ('missing_files='+$missing.Count),'logical_qa_only=true',
              'production_build_allowed=false') |
              Set-Content 'world-p0-results/missing-native-art.txt'
            Write-Host ('MISSING_ORIGINAL_BASTION_III_ART='+$missing.Count+
              ' NO_RELEASE_OR_ART_CERTIFICATION; RUN_LOGICAL_PROBE_ONLY')
          }else{
            foreach($item in $copies){
              New-Item -ItemType Directory -Force (Split-Path $item.dest)|Out-Null
              Copy-Item -LiteralPath $item.source -Destination $item.dest
              if((Get-FileHash -LiteralPath $item.dest -Algorithm SHA256).Hash -ne $item.sha256){
                throw ('Copied art failed exact checksum '+$item.path)
              }
            }
            Write-Host ('WORLD_P0_ALL_ORIGINAL_ART_VERIFIED files='+$art.Count+' restored='+$copies.Count)
          }
      - name: Execute genuine Unity full-world first entry and 12 re-entry PlayMode
        shell: powershell
        timeout-minutes: 95
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unexpected Editor process; cannot overlap'}
          $xml=Join-Path $env:GITHUB_WORKSPACE 'world-p0-results/test-results.xml'
          # On a brand-new 16 GB checkout Unity first imports the project and
          # may exit normally without entering NUnit. The previous run
          # 43626491653 exited 0 after importing but emitted NO test XML.
          # A cold-import success cannot be reported as gameplay success.
          # Never pass -quit to the Test Runner (the existing canonical
          # run_lazy_world_playmode.ps1 intentionally omits it).
          $log=$null
          for($attempt=1;$attempt -le 2;$attempt++){
            if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
              throw 'Unexpected Editor process on rerun; preserve logs'
            }
            $log=Join-Path $env:GITHUB_WORKSPACE ('world-p0-results/editor-attempt-'+$attempt+'.log')
            $args=@('-batchmode','-force-d3d11','-projectPath',('"'+$env:ELDORIA_P0_PROJECT+'"'),
              '-runTests','-testPlatform','PlayMode',
              '-testFilter','Eldoria.BetaMemory.Tests.LazyRegionStartupTests',
              '-testResults',('"'+$xml+'"'),'-logFile',('"'+$log+'"'))
            $proc=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
            if(-not $proc.WaitForExit(5400000)){throw 'Own Unity test timed out; preserve logs'}
            if($proc.ExitCode -ne 0){
              Get-Content -LiteralPath $log -Tail 80
              throw ('Unity Editor failed with exit '+$proc.ExitCode)
            }
            if(Test-Path -LiteralPath $xml){break}
            if($attempt -eq 1){
              Write-Host 'COLD_IMPORT_FINISHED_WITHOUT_NUNIT_XML_RETRY_SAME_EXACT_PROJECT'
              continue
            }
            throw 'Unity did not execute the real PlayMode test after warm retry'
          }
          [xml]$result=Get-Content -LiteralPath $xml -Raw
          $node=$result.'test-run'
          $cases=@($result.SelectNodes('//test-case')|Where-Object {
            $_.GetAttribute('fullname').EndsWith('.RealWorldStartsOnFirstEligibleEntryWithoutSecondGatewayOrNewHUD')
          })
          if($node.result -ne 'Passed' -or [int]$node.total -ne 1 -or
             [int]$node.passed -ne 1 -or [int]$node.failed -ne 0 -or
             [int]$node.skipped -ne 0 -or $cases.Count -ne 1 -or
             $cases[0].GetAttribute('result') -ne 'Passed'){
            throw 'Exact Unity full-region playable fixture did not pass'
          }
          if(-not(Select-String -Path $log -Pattern 'ELDORIA_WORLD_STREAMING_VISUALS' -SimpleMatch -Quiet)){throw 'Missing stream bound proof'}
          if(-not(Select-String $log -Pattern 'ELDORIA_LAZY_REAL_WORLD_NATIVE_12_REENTRY_CYCLES_COMPLETE' -SimpleMatch -Quiet)){throw 'Repeated world navigation not proven'}
          if($env:ELDORIA_WORLD_P0_LOGIC_ONLY_MISSING_ART -eq '1'){
            if(-not(Select-String -Path $log -Pattern 'ELDORIA_WORLD_P0_LOGIC_PROBE_MISSING_BASTION_ART_COUNT=' -SimpleMatch -Quiet)){
              throw 'Missing-art logic-only proof marker absent'
            }
            Write-Host ('ELDORIA_WORLD_P0_LOGIC_ONLY_NATIVE_PASS_NOT_RELEASABLE '+$env:GITHUB_SHA)
          }else{
            Write-Host ('ELDORIA_WORLD_P0_REAL_UNITY_PASS_ORIGINAL_ART '+$env:GITHUB_SHA)
          }
      - name: Upload truthful native log and XML even when the proof fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-p0-native-proof
          path: world-p0-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Safely reclaim ONLY this owned run's regenerable Library after upload
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ELDORIA_P0_SRC){Write-Host 'NO_OWNED_PROJECT_SKIP';exit 0}
          $src=$env:ELDORIA_P0_SRC
          $expected=Join-Path $env:RUNNER_TEMP ('eldoria-world-p0-'+$env:GITHUB_RUN_ID)
          if($src -ne $expected){throw 'Source outside owned workspace'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){Write-Host 'EDITOR_BUSY_SKIP_LIBRARY';exit 0}
          if((& git -C $src rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Unrecognized source; preserve'}
          $library=Join-Path $src 'Unity/Library'
          if(-not(Test-Path $library)){exit 0}
          $item=Get-Item $library -Force
          if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Reparse point in Library; preserve'}
          $empty=Join-Path $src 'world-p0-empty-owned'
          if(Test-Path $empty){throw 'Cleanup marker exists; preserve'}
          New-Item -ItemType Directory -Path $empty|Out-Null
          & robocopy.exe $empty $library /MIR /XJ /R:1 /W:1 | Out-Null
          if($LASTEXITCODE -ge 8){throw 'Safe Library reclaim failed'}
          Remove-Item $library -Recurse -Force
          Remove-Item $empty -Force
          Write-Host ('P0_GENERATED_CACHE_RECLAIMED_FREE_GIB='+[Math]::Round((Get-PSDrive C).Free/1GB,2))
          # Robocopy 1..7 means a successful copy/deletion but sets LASTEXITCODE
          # nonzero. The explicit success return prevents false CI failure
          # after all guarded cleanup operations have completed.
          exit 0
