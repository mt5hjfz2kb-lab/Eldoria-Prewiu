name: Valoria isolated preview subpath
on:
  push:
    branches: [integration/valoria-v3-unity-lookdev-20261012]
    paths: [.github/workflows/valoria-isolated-pages-subpath.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-main
  cancel-in-progress: false
jobs:
  preserve-stable-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}valoria-experimental/
    steps:
      - name: Checkout EXACT unmodified stable main contents
        uses: actions/checkout@v4
        with:
          ref: main
          path: publication
          persist-credentials: false
      - name: Restore confirmed successful V5 WebGL preview
        uses: actions/download-artifact@v4
        with:
          run-id: 38266957384
          name: eldoria-compact-experimental-webgl-38266957384
          github-token: ${{ github.token }}
          path: publication/valoria-experimental
      - name: Verify stable integrity and isolated Unity browser content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('publication')
          experimental=root/'valoria-experimental'
          files=[p for p in experimental.rglob('*') if p.is_file()]
          assert (experimental/'index.html').is_file()
          assert len(list(experimental.rglob('*.data.unityweb')))==1
          assert len(list(experimental.rglob('*.wasm.unityweb')))==1
          size=sum(f.stat().st_size for f in files)
          assert 0<size<650000000, f'Unexpected preview size {size}'
          changed=subprocess.run(['git','-C',str(root),'status','--porcelain','--untracked-files=no'],capture_output=True,text=True,check=True).stdout
          assert not changed, 'Stable tracked source changed: '+changed
          assert (root/'playtest'/'index.html').is_file(), 'Stable playtest missing'
          assert (root/'tester-v0265'/'index.html').is_file(), 'Frozen tester missing'
          assert (root/'unity-owner').exists() or (root/'pipeline'/'unity-publish-request.json').is_file(), 'Stable publication source missing'
          print('VALORIA_STABLE_SOURCE_UNMODIFIED')
          print(f'VALORIA_ISOLATED_BROWSER_SIZE={size}')
          PY
      - name: Remove checkout Git internals from published site
        shell: bash
        run: rm -rf publication/.git
      - name: Prepare Pages artifact preserving all original stable source files
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication/
      - name: Deploy stable content PLUS isolated experimental directory
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live experimental and stable endpoints
        shell: bash
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,time
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          for path,expected in [('valoria-experimental/index.html',b'unity'),('playtest/index.html',b'html'),('tester-v0265/index.html',b'html')]:
            for attempt in range(5):
              try:
                with urllib.request.urlopen(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                  data=r.read()
                if expected not in data.lower(): raise ValueError('unexpected page contents')
                print('LIVE_VERIFIED',base+path,len(data))
                break
              except Exception:
                if attempt==4: raise
                time.sleep(8)
          PY
