name: Valoria legacy GLB audit (isolated Ubuntu)
on:
  push:
    branches:
      - audit/valoria-legacy-glb-20261013
    paths:
      - 'tools/valoria-legacy-glb-audit/**'
      - '.github/workflows/valoria-legacy-glb-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-camera-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Free open-source CPU tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb python3-numpy
          python3 -m pip install --user pillow
          blender --version | head -n 2
      - name: Verify exact 26 legacy SHA and stage frozen Hero V3 family
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/valoria-legacy-glb-audit/stage_inputs.py
      - name: Render source GLBs at identical direction and lighting (NOT UNITY)
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 2 --python tools/valoria-legacy-glb-audit/render_assets.py -- audit-output
      - name: Verify all real imported images and fail closed
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path("audit-output")
          data=json.loads((root/"audit-result.json").read_text())["assets"]
          success=[a for a in data if a["status"]=="RENDERED_UNITY_NOT_TESTED" and
             (root/"renders"/a["pbr"]).is_file() and (root/"renders"/a["clay"]).is_file() ]
          print("TRUE IMPORT + PBR + CLAY PASS",len(success),"/",len(data),flush=True)
          if len(success)!=36: sys.exit(1)
          PY
      - name: Generate 36-piece proof sheets
        if: always()
        shell: bash
        run: |
          if test -f audit-output/audit-result.json; then
            python3 tools/valoria-legacy-glb-audit/contact_sheets.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-legacy-36-glb-cpu-visual-audit
          path: audit-output/
          retention-days: 14
          if-no-files-found: warn
