name: "[PILOT] Valoria reference-first isolated Unity captures"
on:
  push:
    branches: [prototype/reference-first-zero-budget-visual-pilot-20261015]
    paths:
      - '.github/workflows/eldoria-reference-first-zero-budget-pilot.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ReferenceFirstPilot/Editor/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eldoria-reference-first-unity-pilot
  cancel-in-progress: false

jobs:
  real-unity-lookdev:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: reference-first-isolated-checkout
    steps:
      - name: Expose already installed Git from GitHub Desktop when necessary
        shell: powershell
        working-directory: .
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Previously installed Git not found' }
            $gitDir = Split-Path $candidate
            $env:PATH = "$gitDir;$env:PATH"
            Add-Content $env:GITHUB_PATH $gitDir
          }
      - name: Fetch pilot in its OWN checkout, never touch other Windows checkout files
        uses: actions/checkout@v4
        with:
          path: reference-first-isolated-checkout
          clean: true
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            Unity/Assets
            Unity/Packages
            Unity/ProjectSettings
            docs/evidence/reference-first-zero-budget-visual-pilot-20261015
            art-source/valoria/production/bastion-family-v1/BastionFamilyV1.glb
            art-source/valoria/production/lower-gate-family-v1/LowerGateFamilyV1.glb
          persist-credentials: true
      - name: Verify required Unity source without modifying or cleaning shared checkout
        shell: powershell
        run: |
          $v='Unity/ProjectSettings/ProjectVersion.txt'
          if (-not (Test-Path $v)) { throw "Isolated checkout lacks $v" }
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'Unity editor not available' }
          $version = Get-Content $v -Raw
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version in project: $version" }
          if (-not (Test-Path 'Unity/Assets/Eldoria/ArtTests/OriginalHero/valoria_hero_fragment.fbx')) { throw 'OriginalHero source absent' }
          if (-not (Test-Path 'Unity/Assets/Eldoria/ArtTests/ReferenceFirstPilot/Editor/ReferenceFirstPilotCapture.cs')) { throw 'Pilot source absent' }
          git status --short
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          Write-Host $version
      - name: Stage existing fortress/gate GLB sources only inside isolated Unity pilot
        shell: powershell
        run: |
          $dst='Unity/Assets/Eldoria/ArtTests/ReferenceFirstPilot/V3/Imported'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item 'art-source/valoria/production/bastion-family-v1/BastionFamilyV1.glb' "$dst/BastionFamilyV1.glb" -Force
          Copy-Item 'art-source/valoria/production/lower-gate-family-v1/LowerGateFamilyV1.glb' "$dst/LowerGateFamilyV1.glb" -Force
          foreach($asset in @('BastionFamilyV1.glb','LowerGateFamilyV1.glb')) {
            if((Get-Item "$dst/$asset").Length -lt 100000) { throw "Authored existing asset missing or truncated: $asset" }
          }
      - name: Capture two genuine Unity frames from existing reusable assets
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'reference-first-pilot-unity.log'
          $out = Join-Path (Get-Location) 'artifacts/reference-first-composition-v3'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          $unityProject = Join-Path (Get-Location) 'Unity'
          $unityArgs = @('-batchmode','-force-d3d11','-quit','-projectPath',$unityProject,'-executeMethod','Eldoria.EditorTools.ReferenceFirstPilot.ReferenceFirstCompositionV3Capture.Capture','-logFile',$log)
          $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $unityArgs -PassThru
          if (-not $p.WaitForExit(1800000)) {
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw 'Own Unity capture timed out'
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 220 }
            throw "Unity failed with exit code $($p.ExitCode)"
          }
          if (-not (Select-String -Path $log -Pattern 'REFERENCE_FIRST_V3_RENDERED:' -Quiet)) {
            Get-Content $log -Tail 180
            throw 'No genuine render completion marker'
          }
          $frames = @(Get-ChildItem $out -Filter '*.png')
          if ($frames.Count -ne 2) { throw "Expected 2 PNGs, found $($frames.Count)" }
          foreach ($png in $frames) { if ($png.Length -lt 80000) { throw "Suspiciously small Unity render: $($png.Name)" } }
          $manifest = Get-Content (Join-Path $out 'render-manifest-v3.json') -Raw | ConvertFrom-Json
          if ($manifest.artApproved -ne $false) { throw 'Pilot must remain explicitly UNAPPROVED' }
          if ($manifest.architectureInstances -lt 20 -or $manifest.forestInstances -lt 35 -or $manifest.rockInstances -lt 20) { throw 'Real source reuse count below V2 minimum' }
          Get-Content (Join-Path $out 'render-manifest-v3.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-first-real-unity-${{ github.run_id }}
          path: |
            reference-first-isolated-checkout/artifacts/reference-first-pilot/**
            reference-first-isolated-checkout/Unity/Assets/Eldoria/ArtTests/ReferenceFirstPilot/V2/ReferenceFirstCompositionV3.unity
            ${{ runner.temp }}/reference-first-pilot-unity.log
          retention-days: 14
          if-no-files-found: warn

# Source retry checkpoint after resolving CS0234 namespace shadowing.

  # Archive externally inspected PNGs in Git with an Ubuntu clean checkout.
  # The PC only renders and uploads; it NEVER rebases/pushes a Unity working tree.
  archive-evidence:
    needs: real-unity-lookdev
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/reference-first-zero-budget-visual-pilot-20261015
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            docs/evidence/reference-first-zero-budget-visual-pilot-20261015
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: reference-first-real-unity-${{ github.run_id }}
          path: proof
      - name: Check actual Unity PNG size and manifest, preserve only evidence
        shell: bash
        run: |
          set -euo pipefail
          dst=docs/evidence/reference-first-zero-budget-visual-pilot-20261015
          mkdir -p "$dst"
          for name in 05-reference-restart-overview.png 06-reference-restart-close.png render-manifest-v3.json; do
            path=$(find proof -type f -name "$name" -print -quit)
            test -n "$path" || { echo "Missing original Unity evidence: $name"; exit 1; }
            cp "$path" "$dst/$name"
          done
          python3 - <<'PY'
          import struct, pathlib, json
          root=pathlib.Path('docs/evidence/reference-first-zero-budget-visual-pilot-20261015')
          for name in ('05-reference-restart-overview.png','06-reference-restart-close.png'):
              data=(root/name).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n' and len(data)>80000, name
              assert struct.unpack('>II', data[16:24]) == (1536,1024), name
          e=json.loads((root/'render-manifest-v3.json').read_text())
          assert e['artApproved'] is False and e['productionModified'] is False
          assert e['architectureInstances']>=20 and e['forestInstances']>=35
          print('REAL_UNITY_V3_EVIDENCE_VERIFIED_NOT_ART_APPROVED')
          PY
      - name: Commit only exact visual evidence to pilot branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/evidence/reference-first-zero-budget-visual-pilot-20261015/05-reference-restart-overview.png docs/evidence/reference-first-zero-budget-visual-pilot-20261015/06-reference-restart-close.png docs/evidence/reference-first-zero-budget-visual-pilot-20261015/render-manifest-v3.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'evidence: native Unity V3 canonical-reference structural composition [skip ci]'
          git fetch origin prototype/reference-first-zero-budget-visual-pilot-20261015
          git rebase origin/prototype/reference-first-zero-budget-visual-pilot-20261015
          git push origin HEAD:prototype/reference-first-zero-budget-visual-pilot-20261015
