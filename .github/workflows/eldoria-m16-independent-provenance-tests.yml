name: Eldoria M16 independent provenance tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/eldoria-coordinator-v1.cjs'
      - 'tests/eldoria-coordinator-v1.test.cjs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/SlicePresenter.cs'
      - 'tests/eldoria-gameplay-touch-release.test.cjs'
      - '.github/workflows/eldoria-m16-independent-provenance-tests.yml'
      - 'qa/eldoria-gameplay-camera-experience-probe.cjs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/EldoriaWebGLTouchActionPostprocess.cs'
      - 'tests/eldoria-unity-webgl-touch-action.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Unity real WebGL generated HTML touch interception fix
        run: node --test tests/eldoria-unity-webgl-touch-action.test.cjs
      - name: Check Unity mobile rapid swipe vs building tap source regression
        run: node --test tests/eldoria-gameplay-touch-release.test.cjs
      - name: Independently test M16 coordinator including negative provenance cases
        run: node --test tests/eldoria-coordinator-v1.test.cjs
      - name: Verify fail-closed current M07 without handoff
        shell: bash
        run: |
          set -euo pipefail
          node tools/eldoria-coordinator-v1.cjs > /tmp/m16-report.json
          jq -e '.verdict == "BLOCKED_NO_HANDOFF" and ([.checks[].passed] | all | not)' /tmp/m16-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-m16-independent-provenance-proof
          path: pipeline/reports/coordinator-v1-latest.json
          retention-days: 14

  playable-camera-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing browser QA tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: D09 actual Unity published candidate touch/camera experience
        id: touch
        continue-on-error: true
        run: node qa/eldoria-gameplay-camera-experience-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-d09-real-gameplay-camera-experience
          path: eldoria-gameplay-camera-experience/
          if-no-files-found: warn
      - name: Report playable experience defect to existing DG Issue 23
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const {owner,repo}=context.repo;
            const marker='<!-- eldoria-d09-real-game-camera-'+context.runId+' -->';
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:23,per_page:100});
            if(comments.some(c=>(c.body||'').includes(marker)))return;
            let status='BLOCKED_NO_RUNTIME_EVIDENCE',details='missing probe report';
            try{const r=JSON.parse(fs.readFileSync('eldoria-gameplay-camera-experience/report.json'));
              status=r.all_gestures_observed?'BOUNDED_TOUCH_MOTION_PASS_ONLY':'BLOCKED_TOUCH_INPUT_NOT_INDEPENDENTLY_VERIFIED';
              details=r.scenarios.map(x=>x.label+' '+x.finding+' pan='+x.pan_event_count+' axis_delta='+x.observed_axis_delta+' mouse_events='+x.mouse_pan_event_count+(x.error||'')).join('; ');
            }catch(e){details=String(e);}
            const body=[marker,'### D09/D13 — Prueba Unity WebGL real de cámara móvil',
              'Build existente R2-B: 6e0e12396a98b04333b595fff704afa3e849c30a',
              'Run: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              'Veredicto: '+status,'Evidencia: '+details,
              'No evalúa todavía fuente Unity corregida 5922520. Propietario R2-B conserva el código; compilación nueva y UX visual + retest pendientes. No cierre o publicación estable.'].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});
            if(status!=='BOUNDED_TOUCH_MOTION_PASS_ONLY')core.setFailed('Mobile camera input was not certified; repair/probe diagnosis and new Unity build required');
