name: Eldoria Issue147 Windows preflight (read-only)
on:
  push:
    branches: [experiment/eldoria-unity-cli-win-pilot-20261102]
    paths:
      - '.github/workflows/eldoria-unity-cli-windows-safe-pilot.yml'
      - 'tools/unity-cli-windows-pilot/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-cli-windows-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-preflight:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: issue147-preflight-${{ github.run_id }}
          persist-credentials: false
          clean: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/unity-cli-windows-pilot/preflight.ps1
      - name: Inspect editor presence and active tools without changing anything
        shell: pwsh
        run: '& "${{ github.workspace }}/issue147-preflight-${{ github.run_id }}/tools/unity-cli-windows-pilot/preflight.ps1"'
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue147-win-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/eldoria-cli-preflight-${{ github.run_id }}/
          retention-days: 14
          if-no-files-found: warn
