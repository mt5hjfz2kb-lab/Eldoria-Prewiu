name: '[ELDORIA] Bastion III isolated native verification'
on:
  workflow_dispatch:
  push:
    branches: [feature/bastion-iii-canonical-20261027]
    paths: ['tools/bastion-iii/native-request.json']
permissions:
  contents: read
concurrency:
  group: bastion-iii-native
  cancel-in-progress: true
jobs:
  native:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 60
    env:
      VALORIA_GAMEPLAY_PROBE: '1'
    steps:
      - name: Recover installed Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Installed Git executable unavailable; do not fall back to a full repository archive'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
          git --version
          if($LASTEXITCODE){throw 'Git executable verification failed'}
      - uses: actions/checkout@v4
        timeout-minutes: 20
        with:
          sparse-checkout: |
            Unity
            tools
            pipeline
            docs/bastion-iii
          path: bastion-iii-source
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: bastion-iii-live
          sparse-checkout: pipeline
      - name: Verify live resource lease and idle tools
        shell: powershell
        working-directory: bastion-iii-source
        run: |
          node tools/workstream-lease/check.mjs pipeline/active-workstreams.json ../bastion-iii-live/pipeline/active-workstreams.json valoria-master-plan-layered-construction-20261016
          if($LASTEXITCODE){throw 'Stale or conflicting lease'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native tools occupied; do not interrupt'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity editor unavailable'}
      - name: Restore exact missing source files in the isolated checkout
        shell: powershell
        working-directory: bastion-iii-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source=(Get-Location).Path
          $tracked=@(& git ls-tree -r --name-only HEAD -- Unity tools/bastion-iii)
          $missing=@($tracked | Where-Object {-not(Test-Path -LiteralPath (Join-Path $source $_))})
          if($missing.Count){
            & git checkout --ignore-skip-worktree-bits HEAD -- Unity tools/bastion-iii
            $missing=@($tracked | Where-Object {-not(Test-Path -LiteralPath (Join-Path $source $_))})
          }
          if($missing.Count -gt 64){throw "Unexpected incomplete checkout: $($missing.Count) files"}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'User-Agent'='Eldoria-BastionIII-exact-recovery'}
          foreach($file in $missing){
            $expected=(& git rev-parse "HEAD:$file").Trim()
            $escaped=($file -split '/' | ForEach-Object {[Uri]::EscapeDataString($_)}) -join '/'
            $url="https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/contents/$($escaped)?ref=$env:GITHUB_SHA"
            $blob=Invoke-RestMethod -Uri $url -Headers $headers
            if($blob.sha -ne $expected -or $blob.encoding -ne 'base64'){throw "Wrong exact source: $file"}
            $dest=Join-Path $source $file
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String($blob.content))
            if((& git hash-object -- $dest).Trim() -ne $expected){throw "Recovered source hash mismatch: $file"}
          }
          exit 0
      - name: Author zero-cost frontier candidates in Blender
        shell: powershell
        working-directory: bastion-iii-source
        run: |
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $blender){$blender=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if(-not $blender){throw 'Installed Blender unavailable'}
          & $blender --background --python tools/bastion-iii/author-frontier.py
          if($LASTEXITCODE){throw 'Frontier authoring failed'}
      - name: Compile and test exact isolated candidate
        shell: powershell
        working-directory: bastion-iii-source
        run: |
          $project=Join-Path (Get-Location) 'Unity'
          $evidence=Join-Path (Get-Location) 'docs/bastion-iii/native'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $project 'UserSettings') | Out-Null
          '{"name":"Assets","type":"asset","roots":[],"includes":[],"excludes":[],"options":{"types":false,"properties":false,"extended":false,"dependencies":false}}' | Set-Content (Join-Path $project 'UserSettings/Search.index') -Encoding UTF8
          $bakeArgs=@('-batchmode','-force-d3d11','-projectPath',('"'+$project+'"'),'-executeMethod','Eldoria.ReferenceClean.Editor.BastionIIIArtBake.Build','-logFile',('"'+(Join-Path $evidence 'granary-bake.log')+'"'))
          $bake=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $bakeArgs -Wait -PassThru
          if($bake.ExitCode -ne 0){throw 'Build-safe granary extraction failed'}
          foreach($platform in @('EditMode','PlayMode')){
            $xml=Join-Path $evidence "$platform.xml"
            $log=Join-Path $evidence "$platform.log"
            $args=@('-batchmode','-force-d3d11','-projectPath',('"'+$project+'"'),'-runTests','-testPlatform',$platform,'-testResults',('"'+$xml+'"'),'-logFile',('"'+$log+'"'))
            $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
            if($p.ExitCode -ne 0){throw "Unity $platform exit $($p.ExitCode)"}
            if(-not(Test-Path $xml)){throw "Missing $platform test results"}
            [xml]$results=Get-Content $xml
            if($results.'test-run'.result -ne 'Passed'){throw "Unity $platform tests failed"}
          }
          $proofLog=Join-Path $evidence 'runtime-proof.log'
          $proofArgs=@('-batchmode','-force-d3d11','-projectPath',('"'+$project+'"'),'-executeMethod','Eldoria.ReferenceClean.Editor.BastionIIINativeProof.Capture','-logFile',('"'+$proofLog+'"'))
          $proof=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $proofArgs -Wait -PassThru
          if($proof.ExitCode -ne 0 -or -not(Test-Path (Join-Path $evidence 'functional-checks.txt'))){throw 'Actual integrated III proof failed'}
          @{source=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;art_approved=$false;physical_mobile_tested=$false} | ConvertTo-Json | Set-Content (Join-Path $evidence 'provenance.json') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion-iii-native-${{ github.run_id }}
          path: |
            bastion-iii-source/docs/bastion-iii/native
            bastion-iii-source/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Resources/BastionIII
          if-no-files-found: warn
