name: Bastion I genuine Qwen finishing and road clearance Unity review
on:
  workflow_dispatch:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths:
      - 'tools/valoria-bastion1-assembly/**'
      - 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/**'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/SlicePresenter.cs'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaParcelPresentation.cs'
      - '.github/workflows/valoria-bastion1-player-scene-integration.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-bastion1-player-integration
  cancel-in-progress: false
jobs:
  assemble-and-capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    steps:
      - name: Expose installed Git
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $candidate=Get-ChildItem "${env:LOCALAPPDATA}\GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git missing'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Restore glTFast package shaders required for native Unity imports
        shell: powershell
        run: |
          # A prior candidate build quarantined glTFast's ShaderGraphs in runner
          # temp, and this self-hosted runner preserves Library between checkouts.
          # Restore original files BEFORE the native editor imports any GLB.
          $packageRoot=Join-Path $env:GITHUB_WORKSPACE 'Unity/Library/PackageCache'
          $stash=Join-Path $env:RUNNER_TEMP 'Bastion1-UnusedGltfShaderGraphs'
          $pkgs=@(Get-ChildItem -LiteralPath $packageRoot -Directory -Filter 'com.unity.cloud.gltfast@*' -ErrorAction SilentlyContinue)
          if($pkgs.Count -lt 1){Write-Host 'BASTION1_PACKAGE_CACHE_COLD Unity Package Manager will resolve the declared glTFast dependency'}
          # The previous action moved package-owned ShaderGraphs into an
          # ephemeral temp directory, now cleaned. Invalidate only the extracted
          # glTFast cache if incomplete, so Unity 6000.3 re-resolves 6.14.1
          # from the unchanged manifest on its next native editor run.
          $refreshed=0
          foreach($pkg in $pkgs){
            $shaderFolder=Join-Path $pkg.FullName 'Runtime/Shader'
            if(Test-Path $stash){
              New-Item -ItemType Directory -Force $shaderFolder | Out-Null
              foreach($f in @(Get-ChildItem -LiteralPath $stash -Filter 'glTF-*.shadergraph' -File)){
                $destination=Join-Path $shaderFolder $f.Name
                if(-not (Test-Path $destination)){Copy-Item -LiteralPath $f.FullName -Destination $destination -Force}
                if((Test-Path "$($f.FullName).meta") -and -not (Test-Path "$destination.meta")){
                  Copy-Item -LiteralPath "$($f.FullName).meta" -Destination "$destination.meta" -Force
                }
              }
            }
            $matching=@(Get-ChildItem -LiteralPath $shaderFolder -Filter 'glTF-pbrMetallicRoughness*.shadergraph' -File -ErrorAction SilentlyContinue)
            if($matching.Count -lt 1){
              Write-Warning "Cached $($pkg.Name) incomplete, forcing Unity Package Manager re-resolution"
              Remove-Item -LiteralPath $pkg.FullName -Recurse -Force
              $refreshed++
            }else{
              Write-Host "BASTION1_NATIVE_GLTF_MATERIALS_RESTORED $($pkg.Name) graph_count=$($matching.Count)"
            }
          }
          if($refreshed -gt 0){
            Write-Host "BASTION1_PACKAGE_CACHE_REPAIR_REQUESTED count=$refreshed package=com.unity.cloud.gltfast"
          }
      - name: Locate existing Blender and stage exact committed modules
        shell: powershell
        run: |
          $installedBlenders=@(Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe)
          $candidate=$installedBlenders | Where-Object {$_.FullName -match 'Blender 4\.0'} | Select-Object -First 1 -ExpandProperty FullName
          if(-not $candidate){$candidate=$installedBlenders | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if(-not $candidate){throw 'Existing Blender not found'}
          Add-Content $env:GITHUB_ENV "BASTION_BLENDER=$candidate"
          $sourceInputDirectory=Join-Path $env:RUNNER_TEMP 'Bastion1ReferenceInputs'
          Add-Content $env:GITHUB_ENV "BASTION_INPUTS=$sourceInputDirectory"
          $blenderPython=Get-ChildItem (Split-Path $candidate) -Recurse -Filter python.exe | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blenderPython){throw 'Bundled Blender Python missing'}
          Add-Content $env:GITHUB_ENV "BASTION_PYTHON=$blenderPython"
          # Consume completed sources; do not restage or reconstruct the city.
      - name: Clean disposable PR51 gallery staging from this Windows checkout
        shell: powershell
        run: |
          & git.exe reset --hard HEAD
          if($LASTEXITCODE -ne 0){throw 'Temporary runner checkout reset failed'}
          $path='Unity/Assets/Eldoria/AssetLibrarySelectionV1'
          $tracked=@(& git.exe ls-tree -r --name-only HEAD -- $path)
          if($LASTEXITCODE -ne 0 -or $tracked.Count -gt 0){throw 'Selected library belongs to committed source; refuse cleanup'}
          $absolute=Join-Path $env:GITHUB_WORKSPACE $path
          if(Test-Path $absolute){Remove-Item -LiteralPath $absolute -Recurse -Force}
          if(Test-Path ($absolute+'.meta')){Remove-Item -LiteralPath ($absolute+'.meta') -Force}
          if(Test-Path $absolute){throw 'Disposable selected library code remains'}
          Write-Host 'BASTION1_RESTORED_ISOLATED_UNITY_WORKSPACE PR51_sources_unchanged=true'
      - name: Stage existing authored construction states and barracks
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE/Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedSource"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $sawmill="$env:GITHUB_WORKSPACE/art-source/valoria/production/sawmill-family-v1"
          foreach($state in 0..2){
            $name="SawmillState${state}V1"
            Copy-Item "$sawmill/state${state}/$name.glb" "$dest/$name.glb" -Force
            & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py "$dest/$name.glb"
            if($LASTEXITCODE -ne 0){throw "Sawmill state ${state} material staging failed"}
          }
          $barracks="$env:GITHUB_WORKSPACE/Unity/Assets/Eldoria/Resources/Valoria/Valoria_Cuartel_AP2_v1.glb"
          Copy-Item $barracks "$dest/Valoria_Cuartel_AP2_v1.glb" -Force
          & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py "$dest/Valoria_Cuartel_AP2_v1.glb"
          if($LASTEXITCODE -ne 0){throw 'Barracks material staging failed'}
          Copy-Item "$env:GITHUB_WORKSPACE/art-source/valoria/production/road-family-v1/RoadFamilyV1.glb" "$dest/RoadFamilyV1.glb" -Force
          & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py "$dest/RoadFamilyV1.glb"
          if($LASTEXITCODE -ne 0){throw 'Existing authored road bindings failed'}
      - name: Fetch exact previously verified Unity image as immutable scenery baseline
        uses: actions/download-artifact@v4
        with:
          name: bastion1-unity-review-frames-38439416004
          run-id: 38439416004
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/Bastion1PreviousUnity
      - name: Reuse actual previous engine frame after locating artifact structure
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'Bastion1PreviousUnity'
          $images=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'bastion1-player-initial.png')
          $candidates=@($images | Where-Object {$_.FullName.ToLowerInvariant().Contains('after')})
          if($candidates.Count -ne 1){
            $images | ForEach-Object {Write-Host $_.FullName}
            throw 'Expected one real Unity after frame in the existing artifact'
          }
          $source=$candidates[0].DirectoryName
          $before=Join-Path $env:GITHUB_WORKSPACE 'Bastion1MaterialAB/before'
          New-Item -ItemType Directory -Force $before | Out-Null
          Copy-Item (Join-Path $source '*') $before -Force
          if(-not (Test-Path (Join-Path $before 'bastion1-player-initial.png'))){throw 'Engine frame missing after copy'}
          Write-Host 'BASTION1_REUSED_PREVIOUS_UNITY_FRAME run=38439416004'
      - name: Recover immutable genuinely authored mountain from completed Blender replay
        uses: actions/download-artifact@v4
        with:
          name: bastion1-qwen-mountain-replay-38438668388
          run-id: 38438668388
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/Bastion1QwenMountain
      - name: Stage exact Qwen-authored mountain while preserving all player structures
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'Bastion1QwenMountain'
          $src=Join-Path $root 'edited-mountain/Bastion1MountainQwen.glb'
          $expected='8d85a68cff7b3bf4584afc832741f3a14b01266c27e8f87542fbcf84f3faeb80'
          if((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'Actual Qwen mountain geometry hash changed'}
          $proof=Get-Content (Join-Path $root 'edited-mountain/mountain-execution-proof.json') -Raw | ConvertFrom-Json
          if($proof.source_glb_sha256 -ne '9cf0fa48e93df288ed8b86409102c413e9fc22339f1126a79d4ec3f728fd18b1'){throw 'Frozen artist source identity changed'}
          if($proof.output_glb_sha256 -ne $expected -or $proof.edited_mountain_vertices -ne 5432){throw 'Edited mountain does not match Blender run 38438668388'}
          if($proof.plan_sha256 -ne '7e2a5478c8b77000db078d3f12793f00061bbd391f150fb4a8e3b98900fe142d'){throw 'Qwen visual decision changed'}
          if($proof.other_mesh_coordinates_preserved -ne $true -or $proof.architecture_and_ground_unchanged -ne $true -or $proof.source_water_meshes_unchanged -ne $true -or $proof.ai_parameters_modified -ne $false){throw 'Artist invariants violated'}
          $dest=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedSource/Bastion1ReferenceAssembly.glb'
          Copy-Item $src $dest -Force
          & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py $dest
          if($LASTEXITCODE -ne 0){throw 'Qwen mountain material binding staging failed'}
          Copy-Item (Join-Path $root 'edited-mountain/mountain-execution-proof.json') "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/qwen-integration-proof.json" -Force
          Write-Host "BASTION1_QWEN_MOUNTAIN_NATIVE_INPUT artist_run=38438668388 sha=$expected"
      - name: Restore last validated Blender mountain and cliff finish as SAME-CAMERA baseline
        shell: powershell
        run: |
          $src=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedSource/Bastion1ReferenceAssembly.glb'
          $out=Join-Path $env:RUNNER_TEMP 'Bastion1ReprofiledMountain.glb'
          & $env:BASTION_BLENDER -b --python-exit-code 1 --python tools/valoria-bastion1-assembly/reprofile_distant_mountain.py -- $src $out
          if($LASTEXITCODE -ne 0){throw 'Existing mountain Blender edit failed'}
          $proof=Get-Content ([System.IO.Path]::ChangeExtension($out,'.proof.json')) -Raw | ConvertFrom-Json
          if($proof.changed_vertices -lt 300 -or $proof.max_delta_m -lt 8 -or $proof.other_mesh_geometry_modified){throw 'Mountain scope validation failed'}
          Copy-Item $out $src -Force
          & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py $src
          if($LASTEXITCODE -ne 0){throw 'Edited mountain GLB material check failed'}
          Copy-Item ([System.IO.Path]::ChangeExtension($out,'.proof.json')) "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/distant-mountain-proof.json" -Force
          Write-Host 'BASTION1_DISTANT_MOUNTAIN_ONLY_EDITED_UNITY_NEXT'
      - name: Compose courtyard perimeter and secondary paths on verified baseline
        shell: powershell
        run: |
          $src=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedSource/Bastion1ReferenceAssembly.glb'
          $out=Join-Path $env:RUNNER_TEMP 'Bastion1CourtyardCandidate.glb'
          & $env:BASTION_BLENDER -b --python-exit-code 1 --python tools/valoria-bastion1-assembly/compose_bastion_courtyard.py -- $src $out
          if($LASTEXITCODE -ne 0){throw 'Courtyard Blender composition failed'}
          $proof=Get-Content ([System.IO.Path]::ChangeExtension($out,'.proof.json')) -Raw | ConvertFrom-Json
          if($proof.secondary_paths -ne 0 -or $proof.ground_islands -ne 0 -or $proof.new_resource_nodes -ne 0 -or $proof.reused_bushes -ne 12 -or $proof.existing_mesh_coordinates_modified){throw 'Courtyard gameplay/art constraints failed'}
          Copy-Item $out $src -Force
          & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py $src
          if($LASTEXITCODE -ne 0){throw 'Courtyard material bindings failed'}
          Copy-Item ([System.IO.Path]::ChangeExtension($out,'.proof.json')) "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/courtyard-composition-proof.json" -Force
          Write-Host 'BASTION1_COURTYARD_COMPOSED_NATIVE_UNITY_NEXT'

      - name: Recover actual Qwen 4B medieval architectural proposal
        uses: actions/download-artifact@v4
        with:
          name: bastion1-qwen-architecture-proposal-38475192811
          run-id: 38475192811
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/Bastion1QwenGuardProposal
      - name: Verify original AI composition and evidence before building
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'Bastion1QwenGuardProposal'
          $plan=Join-Path $base 'qwen-architecture-proposal.json'
          $inf=Join-Path $base 'inference-proof.json'
          if(-not (Test-Path $plan) -or -not (Test-Path $inf)){throw 'Missing original local Qwen inference'}
          $digest=(Get-FileHash $plan -Algorithm SHA256).Hash.ToLowerInvariant()
          if($digest -ne '96feeed43029b41ecb82db196c4fdd6ec7e937ad9ec7d884d2d7f0f8dbac87bb'){throw 'Qwen proposal content mismatch'}
          $p=Get-Content $plan -Raw | ConvertFrom-Json
          $i=Get-Content $inf -Raw | ConvertFrom-Json
          if($i.model -ne 'qwen3-vl:4b-instruct' -or $i.done -ne $true -or $i.duration_s -le 0){throw 'Qwen not genuinely executed'}
          if(-not $p.concept -or -not $p.site -or -not $p.why_player_camera -or -not $p.composition -or @($p.functional_risks).Count -lt 1){throw 'Invalid composition decision'}
          if(-not (@($p.existing_assets) -contains 'defensive_props') -or -not (@($p.existing_assets) -contains 'stone_path_platform')){throw 'AI selected unverified props'}
          if($p.site -notmatch 'x[~= ]*-20' -or $p.site -notmatch 'y[~= ]*-12'){throw 'AI site differs from documented west-wall option'}
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/Bastion1MaterialAB" | Out-Null
          Copy-Item $plan "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/qwen-guard-plan.json"
          Copy-Item $inf "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/qwen-guard-inference.json"
          Add-Content $env:GITHUB_ENV "BASTION_GUARD_PLAN=$plan"
          Write-Host "QWEN_REAL_ART_PROPOSAL_CONFIRMED run=38475192811 sha=$digest"
      - name: Capture exact native Unity BEFORE from current verified source
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'Bastion1-Unity-SameCamera-Before.log'
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',"$env:GITHUB_WORKSPACE/Unity",'-executeMethod','Eldoria.EditorTools.Bastion1ReferenceCapture.Capture','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(900000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'BEFORE Unity timed out'}
          if($p.ExitCode -ne 0){Get-Content $log -Tail 100;throw 'BEFORE native Unity failed'}
          $before=Join-Path $env:GITHUB_WORKSPACE 'Bastion1MaterialAB/before'
          Copy-Item "$env:GITHUB_WORKSPACE/Unity/Bastion1ReferenceCaptures/*" $before -Force
          if(-not (Test-Path (Join-Path $before 'bastion1-player-initial.png'))){throw 'Real before camera frame missing'}
          Write-Host 'BASTION1_NATIVE_SAME_CAMERA_BEFORE_CAPTURED'
      # ART V4: native soil albedo plus visibly scaled reused selected bush meshes.

      - name: Build AI-selected medieval west-wall focal group in Blender
        shell: powershell
        run: |
          $src=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedSource/Bastion1ReferenceAssembly.glb'
          $out=Join-Path $env:RUNNER_TEMP 'Bastion1GuardProposalCandidate.glb'
          & $env:BASTION_BLENDER -b --python-exit-code 1 --python tools/valoria-bastion1-assembly/compose_bastion_guard_station.py -- $src $env:BASTION_GUARD_PLAN $out
          if($LASTEXITCODE -ne 0){throw 'AI-directed Blender composition failed'}
          $proof=Get-Content ([System.IO.Path]::ChangeExtension($out,'.proof.json')) -Raw | ConvertFrom-Json
          if($proof.ai_proposal_sha256 -ne '96feeed43029b41ecb82db196c4fdd6ec7e937ad9ec7d884d2d7f0f8dbac87bb' -or $proof.existing_source_meshes_modified -ne $false -or $proof.road_clearance_m -lt 9 -or $proof.new_resource_nodes -ne 0 -or $proof.reused_prop_meshes -lt 1 -or $proof.reused_paving_meshes -lt 1){throw 'AI-directed candidate violates no-obstruction/reuse contract'}
          Copy-Item $out $src -Force
          & $env:BASTION_PYTHON tools/valoria-bastion1-assembly/materials.py $src
          if($LASTEXITCODE -ne 0){throw 'Architectural materials invalid'}
          Copy-Item ([System.IO.Path]::ChangeExtension($out,'.proof.json')) "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/qwen-guard-blender-proof.json"
          Write-Host "QWEN_COMPOSITION_BLENDER_EXECUTED deterministic_geometry=true qwen_decided_concept=true"
      - name: Capture real Unity AFTER and preserve playable candidate
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'Bastion1-Unity-After.log'
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',"$env:GITHUB_WORKSPACE/Unity",'-executeMethod','Eldoria.EditorTools.Bastion1ReferenceCapture.Capture','-logFile',$log)
          $process=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $process.WaitForExit(900000)){& taskkill.exe /PID $process.Id /T /F | Out-Null;throw 'Own AFTER process timed out'}
          if($process.ExitCode -ne 0){Get-Content $log -Tail 120;throw 'Unity CC0 AFTER failed'}
          if(-not (Select-String -Path $log -Pattern 'BASTION1_REFERENCE_CAPTURE_COMPLETE' -Quiet)){throw 'AFTER capture missing'}
          $after=Join-Path $env:GITHUB_WORKSPACE 'Bastion1MaterialAB/after'
          New-Item -ItemType Directory -Force $after | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/Unity/Bastion1ReferenceCaptures/*" $after -Force
      - name: Independently measure identical Unity camera A/B without declaring artistic approval
        shell: powershell
        run: |
          $before=Join-Path $env:GITHUB_WORKSPACE 'Bastion1MaterialAB/before/bastion1-player-initial.png'
          $after=Join-Path $env:GITHUB_WORKSPACE 'Bastion1MaterialAB/after/bastion1-player-initial.png'
          $decoder=Join-Path $env:RUNNER_TEMP 'bastion1-unity-pixel-diff.mjs'
          & git.exe fetch --no-tags --depth=1 origin 3deec3b03c3aa23ed6b091fb3a9eddc7518fe745
          & git.exe show '3deec3b03c3aa23ed6b091fb3a9eddc7518fe745:tools/art-direction/ai-authoring/unity_pixel_diff.mjs' | Set-Content -LiteralPath $decoder -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'Pinned independent Unity diff unavailable'}
          $script=Join-Path $env:RUNNER_TEMP 'bastion1-compare.mjs'
          @'
          import fs from 'node:fs';
          import {measureUnityVisualChange} from './bastion1-unity-pixel-diff.mjs';
          const [before,after,out]=process.argv.slice(2);
          const proof=measureUnityVisualChange(fs.readFileSync(before),fs.readFileSync(after));
          fs.writeFileSync(out,JSON.stringify(proof,null,2));
          console.log('BASTION1_NATIVE_UNITY_MATCHED_AB',JSON.stringify(proof));
          if(proof.gate!=='INDEPENDENT_REVIEW_REQUIRED')process.exitCode=2;
          '@ | Set-Content -LiteralPath $script -Encoding utf8
          & node $script $before $after "$env:GITHUB_WORKSPACE/Bastion1MaterialAB/native-unity-ab.json"
          if($LASTEXITCODE -ne 0){throw 'Authentic Unity matched-camera change not visible enough; reject candidate'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-unity-review-frames-${{ github.run_id }}
          path: |
            Bastion1MaterialAB/**
            ${{ runner.temp }}/Bastion1-Unity-Before.log
            ${{ runner.temp }}/Bastion1-Unity-After.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-player-integration-${{ github.run_id }}
          path: |
            Bastion1ReferenceSource/**
            Bastion1MaterialAB/**
            ${{ runner.temp }}/Bastion1-Unity-After.log
            ${{ runner.temp }}/Bastion1-MaterialMerge.log
            Unity/Bastion1ReferenceCaptures/**
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Generated/**
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedNormals/**
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Bastion1ReferenceAssembly.unity*
            Unity/Assets/Eldoria/ProductionSlice/Runtime/Valoria.unity*
            ${{ runner.temp }}/Bastion1-Unity-Before.log
            ${{ runner.temp }}/Bastion1-Blender.*
            ${{ runner.temp }}/Bastion1-Unity.log
            ${{ runner.temp }}/Bastion1-WebGL.log
          retention-days: 14
          if-no-files-found: warn
