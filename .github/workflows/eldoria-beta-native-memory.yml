name: Eldoria conservative exact texture candidate verification
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-native-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - name: Temporary serialization headroom
        run: |
          sudo fallocate -l 8G /tmp/eldoria-beta-dedup.swap
          sudo chmod 600 /tmp/eldoria-beta-dedup.swap
          sudo mkswap /tmp/eldoria-beta-dedup.swap
          sudo swapon /tmp/eldoria-beta-dedup.swap
      - uses: actions/download-artifact@v4
        with:
          run-id: 42473140363
          name: beta-structural-webgl-unverified
          github-token: ${{ github.token }}
          path: build
      - run: python -m pip install UnityPy==1.25.4 lz4==4.4.5 Brotli==1.2.1
      - name: Inventory data entries and serialized payload without editing
        run: |
          python -u - <<'PY'
          import pathlib,gzip,struct,json,hashlib,collections
          import UnityPy
          p=pathlib.Path('build/Build/ValoriaWebPlaytest.data.unityweb')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1397b7df824aa9b587a4283bd1c91d87db5fa33f32008b21726a457568fcf2dc'
          raw=gzip.decompress(p.read_bytes());end=struct.unpack_from('<I',raw,16)[0];pos=20;entries=[]
          while pos<end:
            offset,size,n=struct.unpack_from('<III',raw,pos);pos+=12
            name=raw[pos:pos+n].decode();pos+=n
            entries.append({'name':name,'offset':offset,'bytes':size})
            if name=='data.unity3d':pathlib.Path('bundle').write_bytes(raw[offset:offset+size])
          del raw
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/data-entries.json').write_text(json.dumps(entries,indent=2))
          print('ENTRIES',json.dumps(entries),flush=True)
          PY
      - name: Verify conservative exact architecture texture aliasing
        run: |
          python -u tools/eldoria-private-beta/deduplicate_exact_textures.py --source bundle --destination deduplicated --expected-sha256 ac6f3c50f236dc35e04b7ed3aafa1b4a8b40dd4238f63b700ab5440ae5fd2ce9
          cp deduplicated/integrity.json evidence/dedup-integrity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-webgl-payload-audit
          path: evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: deduplicated-bundle-unverified
          path: deduplicated/
          compression-level: 0
