name: Eldoria compact terrain native parity and WebGL
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-native-memory.yml', 'tools/eldoria-private-beta/native/run_structural.ps1']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
  statuses: write
concurrency:
  group: eldoria-beta-native-warm-preserved
  cancel-in-progress: false
env:
  EXPECTED_LEASE_REVISION: '12'
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      native_available: ${{ steps.lease.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: beta-tools
          sparse-checkout: tools/eldoria-private-beta/native
          persist-credentials: false
      - name: Parse PowerShell without starting Unity
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          Get-ChildItem "$pwd/beta-tools/tools/eldoria-private-beta/native/*.ps1"|ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List;throw 'PowerShell parser errors'}
          }
      - name: Check current ownership without occupying Windows
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/pipeline/active-workstreams.json?ref=main" --jq .content | base64 -d > registry.json
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > pulls.json
          python - <<'PY'
          import json,os
          active=json.load(open('registry.json'))['active']
          holders=[x for x in active if 'windows-runner-heavy' in x.get('resources',[])]
          own=next(x for x in active if x['id']=='eldoria-private-beta-i-v-20261107')
          prs=[x for x in json.load(open('pulls.json')) if 'Workstream-ID: eldoria-private-beta-i-v-20261107' in (x.get('body') or '')]
          if len(prs)!=1 or prs[0]['number']!=179: raise RuntimeError('Canonical PR179 ownership mismatch')
          valid=own['owner']=='chatgpt-beta-pages-20261107' and str(own['ownership_revision'])==os.environ['EXPECTED_LEASE_REVISION'] and len(holders)==1 and holders[0]['id']==own['id']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('available='+str(valid).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('PowerShell syntax checked. Native Unity '+('authorized for this exact lease.' if valid else 'NOT RUN: resource lease is not available to this revision. No gameplay/build certification.')+'\n')
          print({'native_available':valid,'holders':[x['id'] for x in holders]})
          PY
  native:
    needs: preflight
    if: needs.preflight.outputs.native_available == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 170
    steps:
      - name: Recover installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: beta-structural-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/eldoria-private-beta/native/
            /Unity/Assets/Eldoria/World4XCanon/RegionOneBlenderLandscape.cs
            /Unity/Assets/Eldoria/World4XCanon/RegionOneCanonicalLandscape.cs
            /Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/ValoriaIntegratedWorld.cs
            /Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Editor/ValoriaIntegrationBuild.cs
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: beta-structural-live
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Recheck fresh lease and protect every existing project
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content beta-structural-live/pipeline/active-workstreams.json -Raw|ConvertFrom-Json
          $holders=@($r.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($holders.Count -ne 1 -or $holders[0].id -ne 'eldoria-private-beta-i-v-20261107' -or $holders[0].owner -ne 'chatgpt-beta-pages-20261107' -or $holders[0].ownership_revision -ne [int]$env:EXPECTED_LEASE_REVISION){throw 'Structural startup lease changed'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native tools busy; do not interrupt'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity unavailable'}
          $folder="beta-structural-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if(Test-Path $folder){throw 'Isolated project already exists; refuse replacement'}
          $drive=Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0,1))
          if($drive.Free -lt 8GB){throw 'Insufficient isolated import headroom; preserve other projects'}
      - name: Verify exact already-imported source without checkout or reset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cache=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source'
          if(-not(Test-Path (Join-Path $cache '.git'))){throw 'Warm source cache unavailable'}
          $head=(git -C $cache rev-parse HEAD).Trim()
          if($head -ne '948ffa9837168a0b68dab80be76b66350422b23a'){throw "Warm source is a different commit: $head"}
          $pending=@(git -C $cache status --porcelain -- Unity)
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect warm source'}
          $out=Join-Path $env:GITHUB_WORKSPACE "beta-structural-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $out|Out-Null
          $files=@(git -C $cache ls-files --modified --others --exclude-standard -- Unity)
          if($LASTEXITCODE -ne 0){throw 'Cannot inventory existing pending inputs'}
          $inventory=@()
          foreach($file in $files){
            $full=Join-Path $cache $file
            if(Test-Path $full -PathType Leaf){$inventory+=@{path=$file;bytes=(Get-Item $full).Length;sha256=(Get-FileHash $full -Algorithm SHA256).Hash}}
          }
          $utf8=New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Join-Path $out 'existing-input-audit.json'),(@{base=$head;status=$pending;files=$inventory}|ConvertTo-Json -Depth 8),$utf8)
          $diff=git -C $cache diff -- Unity
          [IO.File]::WriteAllLines((Join-Path $out 'existing-tracked-metadata.diff'),[string[]]$diff,$utf8)
          # Native attempt 2: retain observed Editor Search diagnostics separately from player errors.
          # The following wrapper verifies every existing input against the committed audit before any mutation.
          Write-Host 'Recorded current inputs; strict reviewed hash inventory gate follows in wrapper.'

          if(Test-Path (Join-Path $cache 'Unity/Assets/EldoriaBetaMemoryProbe')){throw 'An existing probe must be preserved'}
          Add-Content $env:GITHUB_ENV "BETA_SOURCE=$cache"
      - name: Original versus staged native startup, canonical journey, then WebGL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          & ./beta-structural-tools/tools/eldoria-private-beta/native/run_warm_structural.ps1 -Source "$env:BETA_SOURCE" -Tools beta-structural-tools -Evidence "beta-structural-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -WebOutput "beta-structural-webgl-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-structural-native-evidence
          path: beta-structural-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beta-structural-webgl-unverified
          path: beta-structural-webgl-${{ github.run_id }}-${{ github.run_attempt }}/
          compression-level: 0
          retention-days: 14
