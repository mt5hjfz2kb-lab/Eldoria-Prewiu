name: Eldoria isolated native startup memory diagnosis
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-native-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-beta-native-memory
  cancel-in-progress: false
jobs:
  memory:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    steps:
      - name: Recover installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: beta-probe-tools
          sparse-checkout: tools/eldoria-private-beta/native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: beta-probe-live
          sparse-checkout: pipeline/active-workstreams.json
          persist-credentials: false
      - name: Verify fresh exclusive lease and idle native tools
        shell: powershell
        run: |
          $r=Get-Content beta-probe-live/pipeline/active-workstreams.json -Raw|ConvertFrom-Json
          $holders=@($r.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($holders.Count -ne 1 -or $holders[0].id -ne 'eldoria-private-beta-i-v-20261107' -or $holders[0].owner -ne 'chatgpt-beta-pages-20261107' -or $holders[0].ownership_revision -ne 3){throw 'Memory probe lease changed'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native tools busy; no interference'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity unavailable'}
      - uses: actions/checkout@v4
        with:
          ref: 948ffa9837168a0b68dab80be76b66350422b23a
          path: valoria-layered-source
          clean: false
          persist-credentials: false
      - name: Install isolated probe and sample original startup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source/Unity'
          $probe=Join-Path $project 'Assets/EldoriaBetaMemoryProbe'
          if(Test-Path $probe){throw 'Probe directory already exists; refuse overwrite'}
          New-Item -ItemType Directory -Force (Join-Path $probe 'Editor')|Out-Null
          Copy-Item beta-probe-tools/tools/eldoria-private-beta/native/MemoryProbe.cs (Join-Path $probe 'Editor/MemoryProbe.cs')
          $env:ELDORIA_MEMORY_OUT=Join-Path $env:GITHUB_WORKSPACE 'beta-memory-evidence'
          New-Item -ItemType Directory -Force $env:ELDORIA_MEMORY_OUT|Out-Null
          $env:ELDORIA_MEMORY_SOURCE='948ffa9837168a0b68dab80be76b66350422b23a'
          $env:VALORIA_GAMEPLAY_PROBE='1'
          $log=Join-Path $env:ELDORIA_MEMORY_OUT 'unity.log'
          try {
            $args=@('-batchmode','-force-d3d11','-buildTarget','Win64','-projectPath',('"'+$project+'"'),'-executeMethod','EldoriaBetaMemoryProbe.Run','-logFile',('"'+$log+'"'))
            $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
            $p.WaitForExit()
            if($p.ExitCode -ne 0){throw "Native memory probe failed $($p.ExitCode)"}
            if(-not(Test-Path (Join-Path $env:ELDORIA_MEMORY_OUT 'complete.txt'))){throw 'Missing completion evidence'}
          } finally {
            if(-not(Get-Process Unity -ErrorAction SilentlyContinue)){
              Remove-Item $probe -Recurse -Force
              if(Test-Path ($probe+'.meta')){Remove-Item ($probe+'.meta') -Force}
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-native-startup-memory
          path: beta-memory-evidence/
          retention-days: 14
