name: Eldoria preserved WebGL payload audit
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-native-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 42473140363
          name: beta-structural-webgl-unverified
          github-token: ${{ github.token }}
          path: build
      - run: python -m pip install UnityPy==1.25.4 lz4==4.4.5 Brotli==1.2.1
      - name: Inventory data entries and serialized payload without editing
        run: |
          python -u - <<'PY'
          import pathlib,gzip,struct,json,hashlib,collections
          import UnityPy
          p=pathlib.Path('build/Build/ValoriaWebPlaytest.data.unityweb')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1397b7df824aa9b587a4283bd1c91d87db5fa33f32008b21726a457568fcf2dc'
          raw=gzip.decompress(p.read_bytes());end=struct.unpack_from('<I',raw,16)[0];pos=20;entries=[]
          while pos<end:
            offset,size,n=struct.unpack_from('<III',raw,pos);pos+=12
            name=raw[pos:pos+n].decode();pos+=n
            entries.append({'name':name,'offset':offset,'bytes':size})
            if name=='data.unity3d':pathlib.Path('bundle').write_bytes(raw[offset:offset+size])
          del raw
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/data-entries.json').write_text(json.dumps(entries,indent=2))
          print('ENTRIES',json.dumps(entries),flush=True)
          env=UnityPy.load('bundle');totals=collections.Counter();largest=[];textures=[]
          for obj in env.objects:
            size=len(obj.get_raw_data());totals[obj.type.name]+=size
            if size>1000000:largest.append({'type':obj.type.name,'id':obj.path_id,'file':obj.assets_file.name,'bytes':size})
            if obj.type.name=='Texture2D':
              t=obj.read_typetree()
              textures.append({'name':t.get('m_Name'),'width':t.get('m_Width'),'height':t.get('m_Height'),'format':t.get('m_TextureFormat'),'bytes':size,'stream':t.get('m_StreamData'),'readable':t.get('m_IsReadable')})
          pathlib.Path('evidence/bundle-audit.json').write_text(json.dumps({'types':dict(totals),'largest':sorted(largest,key=lambda x:-x['bytes'])[:80],'textures':textures},indent=2))
          print('TYPES',dict(totals),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-webgl-payload-audit
          path: evidence/
