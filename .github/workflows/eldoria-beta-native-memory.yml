name: Eldoria exact texture duplicate reference audit
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-native-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 42473140363
          name: beta-structural-webgl-unverified
          github-token: ${{ github.token }}
          path: build
      - run: python -m pip install UnityPy==1.25.4 lz4==4.4.5 Brotli==1.2.1
      - name: Inventory data entries and serialized payload without editing
        run: |
          python -u - <<'PY'
          import pathlib,gzip,struct,json,hashlib,collections
          import UnityPy
          p=pathlib.Path('build/Build/ValoriaWebPlaytest.data.unityweb')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1397b7df824aa9b587a4283bd1c91d87db5fa33f32008b21726a457568fcf2dc'
          raw=gzip.decompress(p.read_bytes());end=struct.unpack_from('<I',raw,16)[0];pos=20;entries=[]
          while pos<end:
            offset,size,n=struct.unpack_from('<III',raw,pos);pos+=12
            name=raw[pos:pos+n].decode();pos+=n
            entries.append({'name':name,'offset':offset,'bytes':size})
            if name=='data.unity3d':pathlib.Path('bundle').write_bytes(raw[offset:offset+size])
          del raw
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/data-entries.json').write_text(json.dumps(entries,indent=2))
          print('ENTRIES',json.dumps(entries),flush=True)
          import UnityPy,hashlib,json,collections,pathlib,struct
          from UnityPy.classes.PPtr import PPtr
          env=UnityPy.load('bundle')
          groups=collections.defaultdict(list)
          for o in env.objects:
           if o.type.name!='Texture2D':continue
           t=o.read_typetree()
           if t.get('m_IsReadable',True) or t.get('m_StreamData',{}).get('size',0):continue
           raw=o.get_raw_data();groups[(o.assets_file.name,hashlib.sha256(raw).hexdigest())].append((o.path_id,len(raw),t['m_Name']))
          groups={k:v for k,v in groups.items() if len(v)>1}
          ids={p for v in groups.values() for p,_,_ in v}
          unknown=[];refs=0;duplicate_refs=0
          def walk(t):
           if isinstance(t,dict):
            if 'm_FileID' in t and 'm_PathID' in t:
             yield t
            else:
             for v in t.values():yield from walk(v)
           elif isinstance(t,(list,tuple)):
            for v in t:yield from walk(v)
          for o in env.objects:
           try:
            node=o._get_typetree_node()
            if not any(n.m_Type.startswith('PPtr<') for n in node.traverse()):continue
            t=o.read_typetree()
           except Exception as e:
            raw=o.get_raw_data();possible=[p for p in ids if struct.pack('<q',p) in raw]
            unknown.append({'type':o.type.name,'id':o.path_id,'file':o.assets_file.name,'reason':str(e)[:180],'possible_duplicate_ids':possible});continue
           for p in walk(t):
            if not p['m_PathID']:continue
            refs+=1
            try:
             target=PPtr(m_FileID=p['m_FileID'],m_PathID=p['m_PathID'],assetsfile=o.assets_file).deref()
             if target.type.name=='Texture2D' and (target.assets_file.name,hashlib.sha256(target.get_raw_data()).hexdigest()) in groups:duplicate_refs+=1
            except (FileNotFoundError,KeyError):pass
          result={'groups':[{'file':k[0],'raw_sha256':k[1],'objects':v} for k,v in groups.items()],'duplicate_serialized_bytes':sum((len(v)-1)*v[0][1] for v in groups.values()),'removed_objects_if_all_safe':sum(len(v)-1 for v in groups.values()),'unknown':unknown,'references_scanned':refs,'duplicate_references':duplicate_refs}
          pathlib.Path('evidence/duplicate-audit.json').write_text(json.dumps(result,indent=2))
          print({k:v for k,v in result.items() if k not in ('groups','unknown')},'unknown',len(unknown),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-webgl-payload-audit
          path: evidence/
