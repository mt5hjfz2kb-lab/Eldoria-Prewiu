name: Eldoria preserve exact candidate portable transfer
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-native-memory.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const a=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:42481377084})).data.artifacts.find(x=>x.name==='mobile-candidate-site');
            if(a.id!==13618096453||a.digest!=='sha256:44c18cfae54e77d702f0f9439c6345252ea8502c982b970e8be9f17e64aa8090')throw Error('Unexpected candidate');
      - uses: actions/download-artifact@v4
        with:
          run-id: 42481377084
          name: mobile-candidate-site
          github-token: ${{ github.token }}
          path: site
      - name: Preserve exact files in bounded transfer pieces
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('site');identity=json.loads((root/'release-identity.json').read_text())
          assert identity['candidate_bundle_sha256']=='e5299e7293f4e2ed5a5bed30c9c87d3141a7594401d3cdb965761cba9a834faa'
          paths=sorted(p for p in root.rglob('*') if p.is_file())
          inventory=[{'path':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in paths]
          with zipfile.ZipFile('candidate.zip','w',zipfile.ZIP_STORED) as z:
            for p in paths:z.write(p,str(p.relative_to(root)))
          raw=pathlib.Path('candidate.zip').read_bytes();parts=[]
          for n,offset in enumerate(range(0,len(raw),300000000)):
            directory=pathlib.Path('transfer')/str(n);directory.mkdir(parents=True)
            piece=raw[offset:offset+300000000];(directory/'piece.bin').write_bytes(piece)
            parts.append({'index':n,'bytes':len(piece),'sha256':hashlib.sha256(piece).hexdigest()})
          assert len(parts)==2
          proof={'archive_sha256':hashlib.sha256(raw).hexdigest(),'archive_bytes':len(raw),'parts':parts,'files':inventory,'runtime_verified':False}
          for n in range(2):(pathlib.Path('transfer')/str(n)/'inventory.json').write_text(json.dumps(proof,indent=2))
          print(json.dumps({k:v for k,v in proof.items() if k!='files'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-transfer-0
          path: transfer/0/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-transfer-1
          path: transfer/1/
          compression-level: 0
