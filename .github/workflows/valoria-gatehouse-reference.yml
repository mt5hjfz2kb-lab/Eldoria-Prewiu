name: Valoria gatehouse reference Blender render
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths:
      - 'tools/art-rd/valoria_gatehouse_reference.py'
      - '.github/workflows/valoria-gatehouse-reference.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Author and render Valoria reference gate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/valoria-gatehouse-reference"
          export ELDORIA_GATE_REFERENCE_OUTPUT="$RUNNER_TEMP/valoria-gatehouse-reference"
          export ELDORIA_FORTIFICATION_OUTPUT="$RUNNER_TEMP/valoria-fortification-temp"
          blender -b --python tools/art-rd/valoria_gatehouse_reference.py > "$RUNNER_TEMP/gatehouse-out.log" 2> "$RUNNER_TEMP/gatehouse-err.log" || { tail -100 "$RUNNER_TEMP/gatehouse-err.log"; tail -30 "$RUNNER_TEMP/gatehouse-out.log"; exit 1; }
          grep -q ELDORIA_GATE_REFERENCE_PASS "$RUNNER_TEMP/gatehouse-out.log"
          test -s "$ELDORIA_GATE_REFERENCE_OUTPUT/valoria_gate_reference.glb"
          test -s "$ELDORIA_GATE_REFERENCE_OUTPUT/valoria_gate_reference.blend"
      - name: Preserve source GLB and validation images on art branch
        if: success()
        shell: bash
        run: |
          destination="art-source/valoria/production/gatehouse-reference"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/valoria-gatehouse-reference/"{valoria_gate_reference.glb,valoria_gate_reference.blend,gate_reference_hero.png,gate_reference_mobile.png,gate_reference_assembled.png,gate_before_same_camera.png,gate_reference_manifest.json} "$destination/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$destination"
          if ! git diff --cached --quiet; then
            git commit -m "art: preserve Valoria gatehouse source and review renders"
            git push origin "HEAD:prototype/valoria-bastion1-no-sharp-20261010"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-gatehouse-reference
          path: |
            ${{ runner.temp }}/valoria-gatehouse-reference/
            ${{ runner.temp }}/gatehouse-out.log
            ${{ runner.temp }}/gatehouse-err.log
          retention-days: 14
