name: Studio March blind independent art measurement
on:
  push:
    branches: [candidate/corona-march-studio-native-review-20261126]
    paths: ['.github/workflows/corona-march-studio-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == '0a31a5f5f00a7e4d3ec583d07c7c78adaeb6e643' && github.event.head_commit.message == 'Studio: blinded two-reviewer scoring of exact native March art pilot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/corona-art-iteration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1657b2caa6b1a955319538ce3a8b2906398599b3
          path: studio-source
          sparse-checkout: tools/openai-development-studio
          persist-credentials: false
      - name: Retrieve native evidence only after actual targeted Unity capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 130); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45867113963" --jq .status)
            if [ "$status" = completed ]; then break; fi
            sleep 30
          done
          test "$status" = completed
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45867113963" --jq .conclusion)" = success
          python3 -m pip install --quiet Pillow==11.3.0
          gh run download 45867113963 --repo "$GITHUB_REPOSITORY" --name march-studio-native-evidence --dir native
          gh run download 45866050061 --repo "$GITHUB_REPOSITORY" --name corona-march-original-studio-art --dir artist
          gh run download 45812100129 --repo "$GITHUB_REPOSITORY" --name corona-agent-art-plan --dir refs
          python3 -m py_compile tools/corona-art-iteration/march_studio_blind_review.py
      - name: Two independent blind native A-B evaluations using original 7 weighted criteria
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/corona-art-iteration/march_studio_blind_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-march-studio-blind-scorecard
          path: review/
          if-no-files-found: warn
