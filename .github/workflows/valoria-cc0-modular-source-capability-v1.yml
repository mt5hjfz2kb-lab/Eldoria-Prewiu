name: "[R&D] Valoria CC0 Modular Source Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-cc0-modular-source-capability-v1.yml"
      - "tools/valoria-cc0-modular-source-capability-v1/**"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip
          blender --version

      - name: Fetch Poly Haven CC0 source package
        run: |
          mkdir -p /tmp/cc0-proof/source /tmp/cc0-proof/evidence
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          api="https://api.polyhaven.com/files/modular_fort_01"
          req=urllib.request.Request(api,headers={"User-Agent":"EldoriaResearch/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=json.load(r)
          open("/tmp/cc0-proof/files.json","w").write(json.dumps(data,indent=2))
          candidates=[]
          def walk(x,path=""):
              if isinstance(x,dict):
                  if isinstance(x.get("url"),str):
                      u=x["url"]
                      candidates.append((path,u,x.get("size",0)))
                  for k,v in x.items():
                      walk(v, path+"/"+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+f"/{i}")
          walk(data)
          def score(item):
              p,u,size=item
              s=0
              low=(p+" "+u).lower()
              if "1k" in low: s+=100
              elif "2k" in low: s+=70
              elif "4k" in low: s+=20
              if ".blend" in low: s+=60
              if ".gltf" in low or ".glb" in low: s+=50
              if ".zip" in low: s+=20
              if "blend" in low: s+=20
              if "gltf" in low: s+=15
              return s
          candidates=sorted(candidates,key=score,reverse=True)
          with open("/tmp/cc0-proof/candidates.txt","w") as f:
              for p,u,size in candidates[:80]:
                  f.write(f"{score((p,u,size)):03d} {p} {size} {u}\n")
          chosen=None
          for item in candidates:
              low=(item[0]+" "+item[1]).lower()
              if ("1k" in low or "2k" in low) and any(ext in low for ext in [".blend",".gltf",".glb",".zip"]):
                  chosen=item; break
          if not chosen:
              for item in candidates:
                  low=(item[0]+" "+item[1]).lower()
                  if any(ext in low for ext in [".blend",".gltf",".glb",".zip"]):
                      chosen=item; break
          if not chosen:
              raise SystemExit("No downloadable 3D candidate found")
          p,u,size=chosen
          print("CHOSEN",p,u,size)
          out="/tmp/cc0-proof/source/package"+os.path.splitext(urllib.parse.urlparse(u).path)[1]
          def download(url,dst):
              os.makedirs(os.path.dirname(dst),exist_ok=True)
              req=urllib.request.Request(url,headers={"User-Agent":"EldoriaResearch/1.0"})
              with urllib.request.urlopen(req,timeout=180) as r, open(dst,"wb") as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
          download(u,out)
          # Poly Haven source files reference their declared include files relatively.
          # Fetch only the includes belonging to the chosen 1k/2k package.
          node=data
          for key in [k for k in p.split("/") if k]:
              node=node[key]
          includes=node.get("include",{}) if isinstance(node,dict) else {}
          def fetch_includes(x,rel=""):
              if isinstance(x,dict):
                  if isinstance(x.get("url"),str):
                      name=os.path.basename(urllib.parse.urlparse(x["url"]).path)
                      download(x["url"],os.path.join("/tmp/cc0-proof/source",rel,name))
                  for k,v in x.items():
                      if k not in ("url","size","md5","sha1"):
                          fetch_includes(v, os.path.join(rel,k) if k not in ("include",) else rel)
              elif isinstance(x,list):
                  for v in x: fetch_includes(v,rel)
          # Blend references //textures/<file>; flatten include texture assets there.
          def fetch_flat(x):
              if isinstance(x,dict):
                  if isinstance(x.get("url"),str):
                      url=x["url"]; name=os.path.basename(urllib.parse.urlparse(url).path)
                      download(url,os.path.join("/tmp/cc0-proof/source/textures",name))
                  for v in x.values(): fetch_flat(v)
              elif isinstance(x,list):
                  for v in x: fetch_flat(v)
          fetch_flat(includes)
          open("/tmp/cc0-proof/chosen.txt","w").write(f"{p}\n{u}\n{os.path.getsize(out)}\n")
          print("DOWNLOADED",out,os.path.getsize(out),"INCLUDES",len(os.listdir("/tmp/cc0-proof/source/textures")) if os.path.isdir("/tmp/cc0-proof/source/textures") else 0)
          PY
          cat /tmp/cc0-proof/chosen.txt
          head -40 /tmp/cc0-proof/candidates.txt
          file /tmp/cc0-proof/source/package*

      - name: Prepare source
        run: |
          set -eux
          pkg=$(find /tmp/cc0-proof/source -maxdepth 1 -type f -name 'package*' | head -1)
          case "$pkg" in
            *.zip)
              unzip -q "$pkg" -d /tmp/cc0-proof/source/unpacked
              ;;
          esac
          find /tmp/cc0-proof/source -maxdepth 5 -type f | head -80

      - name: Render isolated source evidence
        run: |
          cat > /tmp/cc0-proof/render.py <<'PY'
          import bpy, os, math
          from mathutils import Vector

          root="/tmp/cc0-proof/source"
          ev="/tmp/cc0-proof/evidence"
          os.makedirs(ev,exist_ok=True)
          blends=[]; models=[]
          for dp,ds,fs in os.walk(root):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  if fn.lower().endswith(".blend"): blends.append(p)
                  elif fn.lower().endswith((".gltf",".glb")): models.append(p)
          if blends:
              bpy.ops.wm.open_mainfile(filepath=blends[0])
          else:
              bpy.ops.wm.read_factory_settings(use_empty=True)
              if not models: raise RuntimeError("No blend/gltf/glb found")
              p=models[0]
              if p.lower().endswith(".glb") or p.lower().endswith(".gltf"):
                  bpy.ops.import_scene.gltf(filepath=p)

          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH" and not o.hide_render]
          if not meshes: raise RuntimeError("No renderable meshes")
          pts=[]
          for o in meshes:
              for c in o.bound_box:
                  pts.append(o.matrix_world @ Vector(c))
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5
          dims=mx-mn
          span=max(dims.x,dims.y,dims.z)
          print("BOUNDS",tuple(mn),tuple(mx),"SPAN",span,"MESHES",len(meshes))

          sc=bpy.context.scene
          sc.render.engine="BLENDER_EEVEE"
          sc.render.resolution_x=1200
          sc.render.resolution_y=900
          sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          sc.render.film_transparent=False
          sc.world.color=(0.04,0.04,0.04)

          # neutral ground
          bpy.ops.mesh.primitive_plane_add(size=span*3, location=(center.x,center.y,mn.z-0.02*span))
          ground=bpy.context.object
          mat=bpy.data.materials.new("NeutralGround")
          mat.diffuse_color=(0.12,0.12,0.12,1)
          ground.data.materials.append(mat)

          bpy.ops.object.light_add(type='SUN', location=(center.x,center.y,mx.z+span))
          sun=bpy.context.object
          sun.rotation_euler=(math.radians(35),0,math.radians(135))
          sun.data.energy=2.0
          bpy.ops.object.light_add(type='AREA', location=(center.x-span*0.6,center.y-span*0.8,mx.z+span*0.7))
          area=bpy.context.object
          area.data.energy=900
          area.data.shape='DISK'
          area.data.size=span
          def track(o,target):
              d=target-o.location
              o.rotation_euler=d.to_track_quat('-Z','Y').to_euler()

          bpy.ops.object.camera_add()
          cam=bpy.context.object
          sc.camera=cam
          cam.data.lens=55

          views=[
              ("three-quarter", Vector((1.15,-1.25,0.82))),
              ("front", Vector((0,-1.55,0.55))),
              ("side", Vector((1.55,0,0.55))),
          ]
          for name,v in views:
              cam.location=center+v*span
              track(cam,center+Vector((0,0,dims.z*0.05)))
              sc.render.filepath=os.path.join(ev,name+".png")
              bpy.ops.render.render(write_still=True)

          # report
          tris=0
          for o in meshes:
              me=o.data
              tris+=sum(max(0,len(p.vertices)-2) for p in me.polygons)
          mats=sum(len(o.data.materials) for o in meshes)
          with open(os.path.join(ev,"report.txt"),"w") as f:
              f.write(f"source=Poly Haven Modular Fort 01\nlicense=CC0 1.0\nmeshes={len(meshes)}\ntriangles_approx={tris}\nmaterial_slots={mats}\nbounds={tuple(dims)}\n")
          PY
          blender -b --python /tmp/cc0-proof/render.py
          test -s /tmp/cc0-proof/evidence/report.txt
          test -s /tmp/cc0-proof/evidence/three-quarter.png
          test -s /tmp/cc0-proof/evidence/front.png
          test -s /tmp/cc0-proof/evidence/side.png

      - name: Package evidence
        run: |
          cp /tmp/cc0-proof/chosen.txt /tmp/cc0-proof/evidence/
          cp /tmp/cc0-proof/candidates.txt /tmp/cc0-proof/evidence/
          cp /tmp/cc0-proof/files.json /tmp/cc0-proof/evidence/
          ls -lh /tmp/cc0-proof/evidence

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-cc0-modular-source-capability-v1
          path: /tmp/cc0-proof/evidence
          retention-days: 30
