name: Valoria stop superseded WebGL builds
on:
  push:
    branches: [integration/valoria-v3-unity-lookdev-20261012]
    paths: [.github/workflows/valoria-discard-stale-builds.yml]
permissions:
  contents: read
  actions: write
jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel exact superseded WebGL runs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          runs=[38281548058]
          for run in runs:
            url=f'https://api.github.com/repos/{repo}/actions/runs/{run}'
            headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:
              data=json.load(response)
            if data['head_branch']!='integration/valoria-v3-unity-lookdev-20261012' or data['name']!='Eldoria compact experimental WebGL':
              raise RuntimeError('Refusing to cancel unrecognized job')
            if data['status']=='completed':
              print('ALREADY_FINISHED',run)
              continue
            req=urllib.request.Request(url+'/cancel',headers=headers,method='POST',data=b'')
            try:
              with urllib.request.urlopen(req) as response: print('STALE_CANCEL_REQUESTED',run,response.status)
            except urllib.error.HTTPError as e:
              print('CANCEL_REJECTED',run,e.code,e.read().decode()[:150])
          PY
