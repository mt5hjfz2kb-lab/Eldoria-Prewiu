name: "[BREAKTHROUGH] Clean scene blockout and comparative capture"
on:
  push:
    branches: [experiment/valoria-scene-method-breakthrough-20261016]
    paths:
      - 'Unity/Assets/Eldoria/ArtTests/SceneBreakthrough/Editor/**'
      - 'Unity/Assets/Eldoria/ArtTests/SceneBreakthrough/SceneCamera.cs'
      - 'tools/valoria-scene-breakthrough/**'
      - '.github/workflows/valoria-scene-breakthrough.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: eldoria-scene-breakthrough
  cancel-in-progress: false
jobs:
  capture:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ github.workspace }}/breakthrough-work
    steps:
      - name: Expose installed Git
        working-directory: ${{ github.workspace }}
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $candidate=Get-ChildItem "${env:LOCALAPPDATA}\GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git missing'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          clean: false
          path: breakthrough-work
          fetch-depth: 1
      - name: Verify own scope and no existing Unity or Blender process
        shell: powershell
        run: |
          if(Get-Process Unity,blender -ErrorAction SilentlyContinue){throw 'Runner has an active Unity/Blender process; no overlap permitted'}
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity editor unavailable'}
          $hash=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Reference mismatch'}
          node tools/eldoria-agent-preflight.mjs
      - uses: actions/download-artifact@v4
        with:
          run-id: 38877895047
          name: valoria-one-full-medium-pine-38877895047
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/breakthrough-pine
      - uses: actions/download-artifact@v4
        with:
          run-id: 38826318218
          name: valoria-real-rock-02-palette-38826318218
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/breakthrough-cliff
      - name: Stage exact existing art without changing sources
        shell: powershell
        run: |
          $python=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter python.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $python){throw 'Existing Blender Python unavailable'}
          & $python tools/valoria-scene-breakthrough/stage.py
          if($LASTEXITCODE -ne 0){throw 'Immutable source staging failed'}
      - name: Construct and capture clean isolated scene
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'Breakthrough-Unity.log'
          $arguments=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/breakthrough-work/Unity",'-executeMethod','Eldoria.Breakthrough.SceneCapture.Hybrid','-logFile',$log)
          $process=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $arguments -PassThru
          if(-not $process.WaitForExit(900000)){& taskkill.exe /PID $process.Id /T /F | Out-Null;throw 'Own Unity process timed out'}
          if($process.ExitCode -ne 0){Get-Content $log -Tail 120;throw "Unity exit $($process.ExitCode)"}
          if(-not(Select-String -Path $log -Pattern 'BREAKTHROUGH_CAPTURE_COMPLETE' -Quiet)){Get-Content $log -Tail 120;throw 'Completion absent'}
      - name: Persist exact experimental scene and review frames in own branch
        shell: powershell
        run: |
          git config user.name "Eldoria scene experiment"
          git config user.email "scene-experiment@users.noreply.github.com"
          git add -f -- Unity/Assets/Eldoria/ArtTests/SceneBreakthrough docs/evidence/valoria-scene-breakthrough-20261016
          if(git diff --cached --quiet){exit 0}
          git commit -m "evidence: real clean-scene Unity blockout and native camera suite"
          git push origin HEAD:experiment/valoria-scene-method-breakthrough-20261016
          if($LASTEXITCODE -ne 0){throw 'Evidence push failed; artifact retained'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-breakthrough-${{ github.run_id }}
          path: |
            breakthrough-work/Unity/Assets/Eldoria/ArtTests/SceneBreakthrough/**
            breakthrough-work/docs/evidence/valoria-scene-breakthrough-20261016/**
            ${{ runner.temp }}/Breakthrough-Unity.log
          retention-days: 30
