name: Valoria isolated clean scene breakthrough
on:
  push:
    branches: [experiment/valoria-scene-breakthrough-20261016]
    paths:
      - 'Unity/Assets/Eldoria/ArtTests/SceneBreakthrough/**'
      - 'tools/valoria-scene-breakthrough/run.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-scene-breakthrough
  cancel-in-progress: false
jobs:
  native-capture:
    if: ${{ false }} # Duplicate session retired; existing queued run still requires cancellation.
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Expose installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          path: breakthrough-source
          clean: false
          persist-credentials: false
      - name: Exclusive editor check and frozen reference
        shell: powershell
        working-directory: breakthrough-source
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count -gt 0){throw 'Shared PC occupied; refuse overlap'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity installation missing'}
          $hash=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower()
          if($hash -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Reference mismatch'}
          git sparse-checkout disable
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Source mismatch'}
          Write-Host "VERIFIED_WINDOWS_UNITY $env:UNITY_EDITOR_PATH"
      - name: Capture isolated complete composition
        shell: powershell
        working-directory: breakthrough-source
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'Breakthrough-Unity.log'
          $project=Join-Path (Get-Location) 'Unity'
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',$project,'-executeMethod','Eldoria.Breakthrough.BreakthroughCapture.Capture','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(1800000)){& taskkill.exe /PID $p.Id /T /F;throw 'Own editor timed out'}
          if($p.ExitCode -ne 0){Get-Content $log -Tail 160;throw "Unity exit $($p.ExitCode)"}
          if(-not(Select-String $log -Pattern 'BREAKTHROUGH_CAPTURE_COMPLETE' -Quiet)){Get-Content $log -Tail 160;throw 'No capture completion'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-scene-breakthrough-${{ github.run_id }}
          path: |
            breakthrough-source/Unity/SceneBreakthroughCaptures/**
            breakthrough-source/Unity/Assets/Eldoria/ArtTests/SceneBreakthrough/**
            ${{ runner.temp }}/Breakthrough-Unity.log
          retention-days: 30
