name: "[PRODUCTION] Valoria First Playable City Slice v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-first-playable-city-slice-v1.json"
      - "Unity/Assets/Eldoria/Scripts/Editor/ValoriaFirstPlayableCitySliceV1.cs"
      - "Unity/Assets/Eldoria/Scripts/Presentation/ValoriaParcelPresentation.cs"
      - "tools/valoria-parcel-splat-states.py"
      - "pipeline/valoria-parcel-regions-v1.json"
      - "pipeline/art-production-requests/valoria-bastion-i-ii-progression-v1.json"
      - "pipeline/art-production-requests/valoria-bastion-i-ii-presentation-parity-correction-v1.json"
      - "Unity/Assets/Eldoria/Scripts/Domain/GameState.cs"
      - "Unity/Assets/Eldoria/Scripts/Application/LocalGateway.cs"
      - "Unity/Assets/Eldoria/Scripts/Presentation/SlicePresenter.cs"
      - "Unity/Assets/Eldoria/Scripts/Presentation/ReferenceUiArtPass.cs"
      - "Unity/Assets/Eldoria/Tests/EditMode/SliceCoreTests.cs"
      - "Unity/Assets/Eldoria/Tests/PlayMode/ParcelProgressionRuntimeTests.cs"
      - "Unity/Assets/Eldoria/Tests/PlayMode/ReferenceUiArtPassTests.cs"
  workflow_dispatch:
concurrency:
  group: valoria-first-playable-city-slice-v1
  cancel-in-progress: true
jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      capture_required: ${{ steps.gate.outputs.capture_required }}
      parcels_required: ${{ steps.gate.outputs.parcels_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            docs/evidence/valoria-visual-authority-reset-v1
            docs/evidence/valoria-real-game-state-v1
      - name: Decide capture versus reviewed metadata closure
        id: gate
        shell: python
        run: |
          import json, os
          cfg=json.load(open('pipeline/valoria-first-playable-city-slice-v1.json'))
          if cfg.get('status') == 'completed':
              review=json.load(open(cfg['evidence']))
              required_count=8 if cfg.get('runtime_parcels_enabled',False) else 6
              assert len(review['criteria']) == required_count and all(v == 'PASS' for v in review['criteria'].values()), 'Complete direct review missing'
              assert review['reference_authority_sha256'] == cfg['visual_authority']['source_sha256'], 'Reviewed reference mismatch'
          bastion_path='pipeline/art-production-requests/valoria-bastion-i-ii-progression-v1.json'
          parity_path='pipeline/art-production-requests/valoria-bastion-i-ii-presentation-parity-correction-v1.json'
          bastion_active=False
          if os.path.exists(bastion_path):
              bastion=json.load(open(bastion_path))
              bastion_active=bastion.get('status')=='ACTIVE'
          parity_active=False
          if os.path.exists(parity_path):
              parity=json.load(open(parity_path))
              parity_active=parity.get('status')=='ACTIVE'
          required = "${{ github.event_name }}" == 'workflow_dispatch' or cfg.get('status') != 'completed' or bastion_active or parity_active
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('capture_required='+str(required).lower()+'\n')
              out.write('parcels_required='+str(required and cfg.get('runtime_parcels_enabled',False)).lower()+'\n')
          print('Capture required:', required)
  parcel-source:
    needs: request
    if: needs.request.outputs.parcels_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/valoria-parcel-splat-states.py
            pipeline/valoria-first-playable-city-slice-v1.json
            pipeline/valoria-parcel-regions-v1.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - name: Download locked source and separate runtime parcel layers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request, zipfile, subprocess
          cfg=json.load(open('pipeline/valoria-first-playable-city-slice-v1.json'))
          artifact=cfg['visual_authority']['source_artifact_id']
          req=urllib.request.Request(f'https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/{artifact}/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          subprocess.run(['curl','-fsSL','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],req.full_url,'-o','source.zip'],check=True)
          with zipfile.ZipFile('source.zip') as z:z.extractall('sharp-source')
          regions=json.load(open(cfg['parcel_manifest']))
          ground=regions['ground']
          artifact=ground['artifact_id']
          subprocess.run(['curl','-fsSL','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],f'https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/{artifact}/zip','-o','ground.zip'],check=True)
          with zipfile.ZipFile('ground.zip') as z:z.extractall('sharp-ground')
          lineage=json.load(open('sharp-ground/source-authority.json'))
          assert lineage['inference_backend']=='local' and lineage['checkpoint_sha256']==ground['checkpoint_sha256'], 'Local checkpoint lineage mismatch'
          assert lineage['parcel_ground_input']['sha256']==ground['input_sha256'], 'Ground source input mismatch'
          assert lineage['authority_sha256']==cfg['visual_authority']['source_sha256'], 'Visual authority mismatch'
          subprocess.run(['python','tools/valoria-parcel-splat-states.py','sharp-source/sharp-1.ply','sharp-ground/sharp-1.ply','parcel-source','--manifest',cfg['parcel_manifest']],check=True)
          import shutil
          shutil.copy2('sharp-ground/source-authority.json','parcel-source/ground-source-authority.json')
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-runtime-parcel-source
          path: parcel-source/*
          retention-days: 30
  capture:
    needs: [request, parcel-source]
    if: always() && needs.request.result == 'success' && vars.UNITY_RUNNER_READY == 'true' && needs.request.outputs.capture_required == 'true' && (needs.parcel-source.result == 'success' || needs.parcel-source.result == 'skipped')
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage approved production families and canonical reference
        shell: powershell
        run: |
          $dst="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ProductionSlice"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $assets=@{
            "BridgeFamilyV1.glb"="art-source\valoria\production\bridge-family-v1\BridgeFamilyV1.glb"
            "LowerGateFamilyV1.glb"="art-source\valoria\production\lower-gate-family-v1\LowerGateFamilyV1.glb"
            "RoadFamilyV1.glb"="art-source\valoria\production\road-family-v1\RoadFamilyV1.glb"
            "StairFamilyV1.glb"="art-source\valoria\production\stair-family-v1\StairFamilyV1.glb"
            "WallFamilyV1.glb"="art-source\valoria\production\wall-family-v1\WallFamilyV1.glb"
            "BastionFamilyV1.glb"="art-source\valoria\production\bastion-family-v1\BastionFamilyV1.glb"
            "RockTerrainFamilyV1.glb"="art-source\valoria\production\rock-terrain-family-v1\RockTerrainFamilyV1.glb"
          }
          foreach($name in $assets.Keys){
            $src=Join-Path $env:GITHUB_WORKSPACE $assets[$name]
            if(-not (Test-Path $src)){throw "Approved family missing: $src"}
            Copy-Item $src (Join-Path $dst $name) -Force
          }
          $ref=Join-Path $env:GITHUB_WORKSPACE "references\VALORIA_APPROVED_VISUAL_REFERENCE.jpg"
          if(-not (Test-Path $ref)){throw "Canonical reference missing"}
          Copy-Item $ref (Join-Path $dst "VALORIA_APPROVED_VISUAL_REFERENCE.jpg") -Force
      - name: Download clean SHARP source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cfg=Get-Content "$env:GITHUB_WORKSPACE\pipeline\valoria-first-playable-city-slice-v1.json" -Raw | ConvertFrom-Json
          if($cfg.visual_authority.superseded -or -not $cfg.visual_authority.source_artifact_id){throw "VISUAL_AUTHORITY_MISMATCH: correct source artifact not configured"}
          $authority=Get-Content "$env:GITHUB_WORKSPACE\pipeline\valoria-visual-authority-v1.json" -Raw | ConvertFrom-Json
          $dst="$env:GITHUB_WORKSPACE\Unity\SharpGaussianSource"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst | Out-Null
          $zip=Join-Path $env:RUNNER_TEMP "sharp-clean.zip"
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28" }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/$($cfg.visual_authority.source_artifact_id)/zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          if(-not (Test-Path (Join-Path $dst "sharp-1.ply"))){throw "Clean SHARP PLY missing"}
          $meta=Get-Content (Join-Path $dst 'source-authority.json') -Raw | ConvertFrom-Json
          if($meta.authority_sha256 -ne $authority.authority_sha256 -or $meta.clean_input_sha256 -ne $authority.clean_input_sha256){throw "VISUAL_AUTHORITY_MISMATCH: source lineage differs"}
          if((Get-FileHash (Join-Path $dst 'sharp-1.ply') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.ply_sha256){throw 'SHARP PLY fingerprint mismatch'}
          Copy-Item (Join-Path $dst 'canonical-target.png') "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ProductionSlice\VALORIA_SHARP_CLEAN_REFERENCE.png" -Force
      - uses: actions/download-artifact@v4
        if: needs.request.outputs.parcels_required == 'true'
        with:
          name: valoria-runtime-parcel-source
          path: Unity/SharpParcelSource
      - name: Capture first playable city slice
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaFirstPlayableCitySliceV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaFirstPlayableCitySliceV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(60)
          $heartbeat=Get-Date
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){
            Start-Sleep 3;$p.Refresh()
            if(((Get-Date)-$heartbeat).TotalSeconds -ge 30){Write-Host "Unity correction capture running; PID=$($p.Id) elapsed=$([int]((Get-Date)-$p.StartTime).TotalSeconds)s";if(Test-Path $log){Get-Content $log -Tail 3};$heartbeat=Get-Date}
          }
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Production slice timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 800};throw "Production slice failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'production-slice-evidence.json')
      - name: Verify real parcel player UI in PlayMode
        if: needs.request.outputs.parcels_required == 'true'
        shell: powershell
        run: |
          $log="$env:RUNNER_TEMP\ValoriaParcelPlayMode.log"
          $result="$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures\parcel-playmode.xml"
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-runTests','-testPlatform','PlayMode','-testFilter','Eldoria.Tests.ParcelProgressionRuntimeTests','-testResults',$result,'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          Copy-Item $log "$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures\parcel-playmode.log" -Force
          if($p.ExitCode -ne 0){Get-Content $log -Tail 100;throw 'Runtime parcel PlayMode failed'}
          if(-not(Test-Path $result)){throw 'Missing runtime PlayMode XML'}
          [xml]$tests=Get-Content $result
          if([int]$tests.'test-run'.failed -gt 0 -or [int]$tests.'test-run'.passed -lt 1){throw 'Runtime parcel tests not PASS'}
      - name: Verify presentation parity UI in PlayMode
        if: needs.request.outputs.parcels_required == 'true'
        shell: powershell
        run: |
          $log="$env:RUNNER_TEMP\ValoriaPresentationParity.log"
          $result="$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures\presentation-parity-playmode.xml"
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-runTests','-testPlatform','PlayMode','-testFilter','Eldoria.Tests.ReferenceUiArtPassTests','-testResults',$result,'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          Copy-Item $log "$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures\presentation-parity-playmode.log" -Force
          if($p.ExitCode -ne 0){Get-Content $log -Tail 160;throw 'Presentation parity PlayMode failed'}
          if(-not(Test-Path $result)){throw 'Missing presentation parity PlayMode XML'}
          [xml]$tests=Get-Content $result
          if([int]$tests.'test-run'.failed -gt 0 -or [int]$tests.'test-run'.passed -lt 1){throw 'Presentation parity PlayMode tests not PASS'}
      - name: Verify Bastion I-II domain progression in EditMode
        if: needs.request.outputs.parcels_required == 'true'
        shell: powershell
        run: |
          $log="$env:RUNNER_TEMP\ValoriaBastionEditMode.log"
          $result="$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures\bastion-editmode.xml"
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-runTests','-testPlatform','EditMode','-testFilter','Eldoria.Tests.SliceCoreTests','-testResults',$result,'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          Copy-Item $log "$env:GITHUB_WORKSPACE\Unity\ValoriaFirstPlayableCitySliceV1Captures\bastion-editmode.log" -Force
          if($p.ExitCode -ne 0){Get-Content $log -Tail 120;throw 'Bastion EditMode tests failed'}
          if(-not(Test-Path $result)){throw 'Missing Bastion EditMode XML'}
          [xml]$tests=Get-Content $result
          if([int]$tests.'test-run'.failed -gt 0 -or [int]$tests.'test-run'.passed -lt 1){throw 'Bastion EditMode tests not PASS'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-first-playable-city-slice-v1
          path: |
            Unity/ValoriaFirstPlayableCitySliceV1Captures/*
            Unity/Assets/Eldoria/ProductionSlice/**
          if-no-files-found: warn
          retention-days: 30


