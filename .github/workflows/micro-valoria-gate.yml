name: Micro-Valoria isolated composition gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/micro-valoria-gate.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ImageTo3D/Editor/MicroValoriaReview.cs'
  workflow_dispatch:

concurrency:
  group: eldoria-micro-valoria
  cancel-in-progress: true

jobs:
  micro-valoria:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
      - name: Retrieve certified Module 3 Unity artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module3-500a031407bc1a554dbeb3f9fd561e865ccdc973
          run-id: 36334704739
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-module3
      - name: Retrieve certified GateStreetRiseRock MV1 artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-gate-street-3230d85d94949d4084941c234d59d73b2cdaa553
          run-id: 36346961014
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-gate-mv1

      - name: Stage the three certified GLB families
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $sourceDir = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source"
          New-Item -ItemType Directory -Force $sourceDir | Out-Null
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          $tower = Join-Path $downloads 'Eldoria_Module_TowerWallRock_50K.glb'
          if (-not (Test-Path $tower)) { throw "Certified Module 1 is missing: $tower" }
          $towerSha = (Get-FileHash $tower -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($towerSha -ne '18785f7ba607cef1e7dcee45684d65c3166dc47b0f73b4bc4fb3d295c6f53a6a') {
            throw "Module 1 SHA mismatch: $towerSha"
          }
          Copy-Item $tower (Join-Path $sourceDir 'Eldoria_Module_TowerWallRock_50K.glb')
          $module3 = @(Get-ChildItem "$env:RUNNER_TEMP\certified-module3" -Recurse -File -Filter 'Eldoria_Module_TerraceStairRock_50K.glb')
          if ($module3.Count -ne 1) { throw "Certified Module 3 artifact contains $($module3.Count) matching GLBs." }
          $terraceSha = (Get-FileHash $module3[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($terraceSha -ne '83fce93daeb5bb455ab89bb195c39f617b3ea69ff9bf29f938ae4744caff3e5e') {
            throw "Certified terrace artifact SHA mismatch: $terraceSha"
          }
          Copy-Item $module3[0].FullName (Join-Path $sourceDir 'Eldoria_Module_TerraceStairRock_50K.glb')

          $gate = @(Get-ChildItem "$env:RUNNER_TEMP\certified-gate-mv1" -Recurse -File -Filter 'Eldoria_Module_GateStreetRiseRock_50K.glb')
          if ($gate.Count -ne 1) { throw "Certified MV1 artifact contains $($gate.Count) matching GLBs." }
          $gateSha = (Get-FileHash $gate[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gateSha -ne '9d1a97ea385d557b77779eef7a7b65f8027bfc79a56b26081abc6b62f25a8302') {
            throw "GateStreetRiseRock MV1 optimized SHA mismatch: $gateSha"
          }
          Copy-Item $gate[0].FullName (Join-Path $sourceDir 'Eldoria_Module_GateStreetRiseRock_50K.glb')

          @{
            tower = @{ name = (Split-Path $tower -Leaf); sha256 = $towerSha }
            terrace = @{ name = $module3[0].Name; sha256 = $terraceSha }
            gate = @{ name = $gate[0].Name; sha256 = $gateSha; source_sha256 = '4d1c19978302643003600b0da5ed2f0ef14f7256c85da03077d36fa9f13e294e' }
          } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\micro-valoria-sources.json"
          Get-Content "$env:RUNNER_TEMP\micro-valoria-sources.json"
      - name: Execute isolated Unity gate
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found.' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }
          $folder = "$env:GITHUB_WORKSPACE\Unity\MicroValoriaReviewCaptures"
          $log = "$env:RUNNER_TEMP\Eldoria-MicroValoria.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args = @('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.MicroValoriaReview.Capture','-logFile',$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(600000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 180 }
            throw 'Micro-Valoria gate timed out.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw "Micro-Valoria gate failed: $($process.ExitCode)"
          }
          foreach ($name in @('strategic.png','city.png','detail.png','oblique.png','metrics.json')) {
            $file = Join-Path $folder $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 10000 -and $name -ne 'metrics.json') {
              throw "Missing/empty capture: $name"
            }
          }
          Get-Content (Join-Path $folder 'metrics.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-micro-valoria-${{ github.sha }}
          path: |
            Unity/MicroValoriaReviewCaptures/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/MicroValoriaReview.unity
            ${{ runner.temp }}/micro-valoria-sources.json
            ${{ runner.temp }}/Eldoria-MicroValoria.log
          if-no-files-found: warn
