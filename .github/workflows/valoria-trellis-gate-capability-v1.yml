name: "[R&D] Valoria TRELLIS Gate Capability v1"

on:
  workflow_dispatch:

# Quarantined R&D/capability workflow: manual-only. Production use requires canonical planner/fallback routing plus explicit owner dispatch.
permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/valoria-trellis-space-proof.py
            docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-depth-shell-v1/gate-back.png
            docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-depth-shell-v1/gate-front.png
          sparse-checkout-cone-mode: false
      - name: Install client and Blender
        run: |
          python -m pip install --quiet "gradio_client>=1.4" pillow
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Generate Gate with TRELLIS ZeroGPU
        env:
          OUT_DIR: /tmp/trellis-proof
        run: python tools/valoria-trellis-space-proof.py
      - name: Render GLB evidence
        run: |
          cat > /tmp/trellis-proof/render.py <<'PY'
          import bpy, os, math, json
          from mathutils import Vector
          root="/tmp/trellis-proof"; model=os.path.join(root,"trellis-gate.glb")
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=model)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("No mesh")
          pts=[o.matrix_world@Vector(c) for o in meshes for c in o.bound_box]
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          ctr=(mn+mx)*.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene; sc.render.engine="BLENDER_EEVEE"; sc.render.resolution_x=900; sc.render.resolution_y=900; sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(.035,.04,.05)
          bpy.ops.mesh.primitive_plane_add(size=span*3,location=(ctr.x,ctr.y,mn.z-span*.015))
          gm=bpy.data.materials.new("ground"); gm.diffuse_color=(.12,.12,.12,1); bpy.context.object.data.materials.append(gm)
          bpy.ops.object.light_add(type="SUN"); bpy.context.object.rotation_euler=(math.radians(35),0,math.radians(135)); bpy.context.object.data.energy=2.2
          bpy.ops.object.light_add(type="AREA",location=ctr+Vector((-span*.7,-span*.9,span*1.1))); bpy.context.object.data.energy=1000; bpy.context.object.data.size=span
          bpy.ops.object.camera_add(); cam=bpy.context.object; sc.camera=cam; cam.data.lens=55
          for name,v in {"front":(0,-1.7,.45),"three-quarter":(1.15,-1.35,.72),"side":(1.7,0,.45)}.items():
              cam.location=ctr+Vector(v)*span; cam.rotation_euler=(ctr-cam.location).to_track_quat("-Z","Y").to_euler()
              sc.render.filepath=os.path.join(root,name+".png"); bpy.ops.render.render(write_still=True)
          tris=sum(sum(max(0,len(p.vertices)-2) for p in o.data.polygons) for o in meshes)
          open(os.path.join(root,"mesh-report.json"),"w").write(json.dumps({"meshes":len(meshes),"triangles_approx":tris,"bounds":list(dims)},indent=2))
          PY
          blender -b --python /tmp/trellis-proof/render.py
          test -s /tmp/trellis-proof/front.png
          test -s /tmp/trellis-proof/three-quarter.png
          test -s /tmp/trellis-proof/side.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-trellis-gate-capability-v1
          path: /tmp/trellis-proof
          if-no-files-found: error
          retention-days: 30
