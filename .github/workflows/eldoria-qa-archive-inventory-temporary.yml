name: "[TEMP] Eldoria expired-value visual A/B inventory"
on:
  push:
    branches: [cost/artifact-retention-references-20261104]

permissions:
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: List only unneeded historical visual-QA reports; delete nothing
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff='2026-11-03T00:00:00Z';
            const prefix='eldoria-visual-qa-';
            const maxPages=120, perPage=100;
            let visited=0, examined=0, firstTotal=null, count=0, bytes=0, samples=[],lastCreated=null;
            for(let page=1;page<=maxPages;page++){
              const out=await github.rest.actions.listArtifactsForRepo({
                ...context.repo,per_page:perPage,page
              });
              const a=out.data.artifacts||[];
              if(firstTotal===null)firstTotal=out.data.total_count;
              if(!a.length)break;
              visited++;examined+=a.length;
              lastCreated=a[a.length-1].created_at;
              for(const item of a){
                if(item.expired || !item.name.startsWith(prefix) || !(item.created_at<cutoff))
                  continue;
                if(!/^eldoria-visual-qa-[0-9]+$/.test(item.name))continue;
                if(item.workflow_run && !item.workflow_run.id)continue;
                count++;bytes+=item.size_in_bytes||0;
                if(samples.length<80)samples.push({
                  id:item.id,name:item.name,size_bytes:item.size_in_bytes,
                  created_at:item.created_at,run_id:item.workflow_run?.id
                });
              }
              if(page%30===0)core.info('Inventory progress pages='+page+' inspected='+examined);
            }
            const out={mode:'DRY_RUN_NO_DELETION',cutoff,prefix,pages:visited,
              inspected:examined,repo_total_reported:firstTotal,
              newest_page_last_created_at:lastCreated,eligible_count:count,
              eligible_bytes:bytes,samples};
            core.info('ELDORIA_VISUAL_QA_INVENTORY='+JSON.stringify(out));
            await core.summary.addRaw('### Eldoria visual QA archive inventory (dry run)\n' +
              '- **No deletions**; scanned '+visited+' pages / '+examined+' artifacts.\n' +
              '- Eligible exact-name historical QA reports: **'+count+'** ('+
              (bytes/1048576).toFixed(2)+' MiB).\n' +
              '- More records may exist after the scanned pages.').write();
