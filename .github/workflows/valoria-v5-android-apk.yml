name: Eldoria Valoria V5 Android experimental APK
on:
  push:
    branches: [experiment/valoria-v5-android-apk-20261012]
    paths:
      - .github/workflows/valoria-v5-android-apk.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-valoria-v5-android-apk
  cancel-in-progress: false
jobs:
  apk:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 90
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'GIT_MISSING'}
            Add-Content $env:GITHUB_PATH (Split-Path $git)
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore exact V5 first-zone Unity scene and dependencies
        uses: actions/download-artifact@v4
        with:
          run-id: 38261014419
          name: valoria-first-zone-v5-38261014419
          github-token: ${{ github.token }}
          path: v5-scene-artifact
      - name: Stage V5 generated scene
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $matches=@(Get-ChildItem v5-scene-artifact -Recurse -File -Filter ValoriaFortification.unity)
          if($matches.Count -ne 1){throw "V5_SCENE_NOT_UNIQUE count=$($matches.Count)"}
          $from=$matches[0].Directory.FullName
          $to=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/Experimental/ValoriaFinishV1'
          New-Item -ItemType Directory -Force $to | Out-Null
          Copy-Item (Join-Path $from '*') $to -Recurse -Force
          if(@(Get-ChildItem (Join-Path $to 'Generated') -Filter '*.asset').Count -lt 8){throw 'V5_DEPENDENCIES_MISSING'}
          Write-Host 'EXACT_V5_SCENE_STAGED'
      - name: Check or install official Unity Android support
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH_MISSING'}
          $editorDir=Split-Path $env:UNITY_EDITOR_PATH
          $android=Join-Path $editorDir 'Data/PlaybackEngines/AndroidPlayer'
          $required=@($android,(Join-Path $android 'SDK'),(Join-Path $android 'NDK'),(Join-Path $android 'OpenJDK'))
          $missing=@($required | Where-Object {-not (Test-Path $_)})
          if($missing.Count -gt 0){
            Write-Host "INSTALL_ANDROID_SUPPORT missing=$($missing -join ';')"
            $cliPaths=@("$env:USERPROFILE\.unity\bin\unity.exe","$env:LOCALAPPDATA\Programs\Unity\bin\unity.exe","$env:LOCALAPPDATA\Unity\bin\unity.exe")
            $installer=$cliPaths | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $installer){$c=Get-Command unity.exe -ErrorAction SilentlyContinue; if($c -and $c.Source -ne $env:UNITY_EDITOR_PATH){$installer=$c.Source}}
            if(-not $installer){throw 'ANDROID_MODULE_MISSING_AND_INSTALLER_UNAVAILABLE'}
            & $installer install-modules -e 6000.3.23f1 -m android --cm --format human
            if($LASTEXITCODE -ne 0){throw "ANDROID_MODULE_INSTALL_FAILED $LASTEXITCODE"}
            $missing=@($required | Where-Object {-not (Test-Path $_)})
            if($missing.Count -gt 0){throw "ANDROID_MODULE_STILL_MISSING $($missing -join ';')"}
          }
          Write-Host 'UNITY_ANDROID_SDK_NDK_OPENJDK_READY'
      - name: Build experimental Valoria V5 APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'ValoriaV5Android.log'
          $project=Join-Path $env:GITHUB_WORKSPACE 'Unity'
          $args=@('-batchmode','-nographics','-quit','-projectPath',$project,'-buildTarget','Android','-executeMethod','Eldoria.EditorTools.ValoriaV5AndroidCandidate.Build','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(4200000)){& taskkill.exe /PID $p.Id /T /F | Out-Null; throw 'ANDROID_BUILD_TIMEOUT'}
          $p.Refresh()
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 130}; throw "ANDROID_BUILD_FAILED $($p.ExitCode)"}
          $apk=Join-Path $project 'Builds/Android/Eldoria-Valoria-V5-Test.apk'
          if(-not (Test-Path $apk)){throw 'APK_OUTPUT_MISSING'}
          $identity=@{source_sha=$env:GITHUB_SHA;v5_unity_source_run=38261014419;apk_sha256=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant();bytes=(Get-Item $apk).Length;device_qa='PENDING';paid_credits=0}
          $identity | ConvertTo-Json | Set-Content (Join-Path $project 'Builds/Android/build-result.json')
          Write-Host "VALORIA_APK_BUILT bytes=$($identity.bytes)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eldoria-valoria-v5-android-apk-${{ github.run_id }}
          path: Unity/Builds/Android/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-valoria-v5-android-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ValoriaV5Android.log
          retention-days: 7
          if-no-files-found: ignore
