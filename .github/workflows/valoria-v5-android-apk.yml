name: Eldoria Valoria V5 Android experimental APK
on:
  push:
    branches: [experiment/valoria-v5-android-apk-20261012]
    paths:
      - .github/workflows/valoria-v5-android-apk.yml
      - Unity/Assets/Eldoria/Scripts/Editor/ValoriaV5AndroidCandidate.cs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-valoria-v5-android-apk
  cancel-in-progress: false
jobs:
  apk:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 90
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'GIT_MISSING'}
            Add-Content $env:GITHUB_PATH (Split-Path $git)
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore exact V5 first-zone Unity scene and dependencies
        uses: actions/download-artifact@v4
        with:
          run-id: 38261014419
          name: valoria-first-zone-v5-38261014419
          github-token: ${{ github.token }}
          path: v5-scene-artifact
      - name: Stage V5 generated scene
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $matches=@(Get-ChildItem v5-scene-artifact -Recurse -File -Filter ValoriaFortification.unity)
          if($matches.Count -ne 1){throw "V5_SCENE_NOT_UNIQUE count=$($matches.Count)"}
          $from=$matches[0].Directory.FullName
          $to=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/Experimental/ValoriaFinishV1'
          New-Item -ItemType Directory -Force $to | Out-Null
          Copy-Item (Join-Path $from '*') $to -Recurse -Force
          if(@(Get-ChildItem (Join-Path $to 'Generated') -Filter '*.asset').Count -lt 8){throw 'V5_DEPENDENCIES_MISSING'}
          Write-Host 'EXACT_V5_SCENE_STAGED'
      - name: Repair serialized preview-script GUIDs in staged V5 scene only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scene='Unity/Assets/Eldoria/Experimental/ValoriaFinishV1/ValoriaFortification.unity'
          $anchorMeta='Unity/Assets/Eldoria/Scripts/Experimental/ValoriaFirstZoneAnchor.cs.meta'
          $controlsMeta='Unity/Assets/Eldoria/Scripts/Experimental/ValoriaFirstZonePreviewControls.cs.meta'
          $anchorGuid=[regex]::Match((Get-Content $anchorMeta -Raw),'(?m)^guid:\s*([a-f0-9]{32})').Groups[1].Value
          $controlsGuid=[regex]::Match((Get-Content $controlsMeta -Raw),'(?m)^guid:\s*([a-f0-9]{32})').Groups[1].Value
          if($anchorGuid.Length -ne 32 -or $controlsGuid.Length -ne 32){throw 'SCRIPT_META_GUIDS_INVALID'}
          $text=[IO.File]::ReadAllText((Resolve-Path $scene))
          $docs=[regex]::Split($text,'(?=--- !u!)')
          $anchors=0;$cameras=0
          for($i=0;$i -lt $docs.Length;$i++){
            $target=''
            if($docs[$i] -match '(?m)^\s*instanceId:'){ $target=$anchorGuid; $anchors++ }
            elseif($docs[$i] -match '(?m)^\s*panUnitsPerPixel:'){ $target=$controlsGuid; $cameras++ }
            if($target -ne ''){
              $docs[$i]=[regex]::Replace($docs[$i],'(m_Script: \{fileID: 11500000, guid: )[0-9a-f]{32}',('$1'+$target))
            }
          }
          if($anchors -lt 8 -or $cameras -ne 1){throw "SERIALIZED_ANCHORS_OR_TOUCH_CAMERA_MISSING anchors=$anchors cameras=$cameras"}
          [IO.File]::WriteAllText((Resolve-Path $scene),[string]::Concat($docs))
          Write-Host "STAGED_V5_SCRIPT_GUIDS_REPAIRED anchors=$anchors cameras=$cameras"
      - name: Check or install official Unity Android support
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH_MISSING'}
          $editorDir=Split-Path $env:UNITY_EDITOR_PATH
          $android=Join-Path $editorDir 'Data/PlaybackEngines/AndroidPlayer'
          $required=@($android,(Join-Path $android 'SDK'),(Join-Path $android 'NDK'),(Join-Path $android 'OpenJDK'))
          $missing=@($required | Where-Object {-not (Test-Path $_)})
          if($missing.Count -gt 0){
            Write-Host "INSTALL_ANDROID_SUPPORT missing=$($missing -join ';')"
            $cliPaths=@("$env:USERPROFILE\.unity\bin\unity.exe","$env:LOCALAPPDATA\Programs\Unity\bin\unity.exe","$env:LOCALAPPDATA\Unity\bin\unity.exe")
            $installer=$cliPaths | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $installer){$c=Get-Command unity.exe -ErrorAction SilentlyContinue; if($c -and $c.Source -ne $env:UNITY_EDITOR_PATH){$installer=$c.Source}}
            if(-not $installer){throw 'ANDROID_MODULE_MISSING_AND_INSTALLER_UNAVAILABLE'}
            & $installer install-modules -e 6000.3.23f1 -m android --cm --accept-eula --format human
            if($LASTEXITCODE -ne 0){throw "ANDROID_MODULE_INSTALL_FAILED $LASTEXITCODE"}
            $missing=@($required | Where-Object {-not (Test-Path $_)})
            if($missing.Count -gt 0){throw "ANDROID_MODULE_STILL_MISSING $($missing -join ';')"}
          }
          Write-Host 'UNITY_ANDROID_SDK_NDK_OPENJDK_READY'
      - name: Audit Android payload sources and isolate unused source GLBs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets'
          $report=Join-Path $env:GITHUB_WORKSPACE 'android-payload-audit.txt'
          $lines=@('Valoria V5 APK payload investigation; audit only; original assets retained')
          foreach($dir in @(Get-ChildItem $root -Directory)){
            $files=@(Get-ChildItem $dir.FullName -File -Recurse -ErrorAction SilentlyContinue)
            $sum=($files | Measure-Object Length -Sum).Sum
            $lines+=("$($dir.Name): $sum bytes ($($files.Count) files)")
          }
          $stream=Join-Path $root 'StreamingAssets'
          if(Test-Path $stream){
            foreach($dir in @(Get-ChildItem $stream -Directory)){
              $size=(Get-ChildItem $dir.FullName -Recurse -File | Measure-Object Length -Sum).Sum
              $lines+=("StreamingAssets/$($dir.Name): $size bytes")
            }
          }
          $lines | Set-Content $report
          $lines | ForEach-Object { Write-Host $_ }
          # Original V3 GLBs are source-only: the V5 scene contains generated .asset meshes.
          # Temporarily move only the verified known art-trial source family away
          # from StreamingAssets. The workflow restores it in a finalizer after Unity.
          $source=Join-Path $stream 'ValoriaFamilyV3'
          $stash=Join-Path $env:RUNNER_TEMP 'ValoriaFamilyV3-Android-stash'
          if(Test-Path $source){
            if(Test-Path $stash){throw 'ANDROID_ART_STASH_ALREADY_EXISTS'}
            Move-Item $source $stash
            Write-Host 'NONRUNTIME_ART_SOURCE_ISOLATED_FOR_PACKAGING'
          }
      - name: Build experimental Valoria V5 APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'ValoriaV5Android.log'
          $project=Join-Path $env:GITHUB_WORKSPACE 'Unity'
          $args=@('-batchmode','-nographics','-quit','-projectPath',$project,'-buildTarget','Android','-executeMethod','Eldoria.EditorTools.ValoriaV5AndroidCandidate.Build','-logFile',$log)
          try {
            $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
            if(-not $p.WaitForExit(4200000)){& taskkill.exe /PID $p.Id /T /F | Out-Null; throw 'ANDROID_BUILD_TIMEOUT'}
            $p.Refresh()
            if($p.ExitCode -ne 0){if(Test-Path $log){Select-String -Path $log -Pattern 'error','Error','exception','Exception','fail','FAIL','Gradle','shader' | Select-Object -Last 180 | ForEach-Object { Write-Host $_.Line }; Get-Content $log -Tail 45}; throw "ANDROID_BUILD_FAILED $($p.ExitCode)"}
          } finally {
            $stash=Join-Path $env:RUNNER_TEMP 'ValoriaFamilyV3-Android-stash'
            $restore=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/StreamingAssets/ValoriaFamilyV3'
            if(Test-Path $stash){
              if(Test-Path $restore){throw 'RESTORE_REFUSED_TARGET_ALREADY_EXISTS'}
              Move-Item $stash $restore
              Write-Host 'NONRUNTIME_ART_SOURCE_RESTORED'
            }
          }
          $apk=Join-Path $project 'Builds/Android/Eldoria-Valoria-V5-Test.apk'
          if(-not (Test-Path $apk)){throw 'APK_OUTPUT_MISSING'}
          $identity=@{source_sha=$env:GITHUB_SHA;v5_unity_source_run=38261014419;apk_sha256=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant();bytes=(Get-Item $apk).Length;device_qa='PENDING';paid_credits=0}
          $identity | ConvertTo-Json | Set-Content (Join-Path $project 'Builds/Android/build-result.json')
          Write-Host "VALORIA_APK_BUILT bytes=$($identity.bytes)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eldoria-valoria-v5-android-apk-${{ github.run_id }}
          path: Unity/Builds/Android/*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-valoria-v5-android-size-audit-${{ github.run_id }}
          path: android-payload-audit.txt
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-valoria-v5-android-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ValoriaV5Android.log
          retention-days: 7
          if-no-files-found: ignore
