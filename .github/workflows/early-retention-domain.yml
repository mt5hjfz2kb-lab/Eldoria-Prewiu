name: Early Retention domain contract (Ubuntu zero-Unity)
on:
  pull_request:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Domain/EarlyRetentionRules.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/GameState.cs'
      - 'Unity/Assets/Eldoria/Scripts/Application/LocalGateway.cs'
      - 'tools/early-retention/**'
      - 'Unity/Assets/Eldoria/Resources/EldoriaRetention/**'
      - 'Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV2/Runtime/RoyalGoldV3EarlyRetentionScreens.cs'
      - '.github/workflows/early-retention-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Unity/Assets/Eldoria/Scripts/Domain
            Unity/Assets/Eldoria/Scripts/Application
            tools/early-retention
            Unity/Assets/Eldoria/Resources/EldoriaRetention
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile real Eldoria domain and enforce rewards/time/unlocks
        run: dotnet run --project tools/early-retention/Smoke.csproj --configuration Release

      - name: Verify both original painted illustration textures without Unity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, struct, zlib
          root=pathlib.Path("Unity/Assets/Eldoria/Resources/EldoriaRetention")
          hashes=[]
          for stem in ("vigilants-illustration","scouts-illustration"):
              f=root/(stem+".png")
              content=f.read_bytes()
              assert content[:8]==b"\x89PNG\r\n\x1a\n",f"Invalid PNG: {stem}"
              pos=8; chunks={}; dimensions=None
              while pos<len(content):
                  size=struct.unpack_from(">I",content,pos)[0]
                  tag=content[pos+4:pos+8]; data=content[pos+8:pos+8+size]
                  assert (zlib.crc32(tag+data)&0xffffffff)==struct.unpack_from(">I",content,pos+8+size)[0],f"Bad PNG CRC {stem}"
                  chunks.setdefault(tag,[]).append(data)
                  if tag==b"IHDR": dimensions=struct.unpack_from(">IIBBBBB",data)
                  pos+=size+12
                  if tag==b"IEND": break
              assert dimensions==(640,640,8,3,0,0,0),f"Unexpected artwork texture layout: {stem} {dimensions}"
              pixels=zlib.decompress(b"".join(chunks[b"IDAT"]))
              assert len(pixels)==640*641, f"Invalid scanline length for {stem}"
              # With a 3:3:2 indexed mobile palette, 12+ distinct color indices
              # is sufficient to reject an accidentally solid asset. Do not
              # demand 50+ shades from this intentionally compact art format.
              colors={pixels[i] for i in range(1,len(pixels)) if i%641}
              assert len(colors)>12, f"Unexpected flat illustration {stem} ({len(colors)} colors)"
              assert f.with_suffix(".png.meta").is_file(),f"Missing Unity importer settings: {stem}"
              hashes.append(hashlib.sha256(content).hexdigest())
              print(f"{stem}: PNG 640x640, palette, CRC, importer and pixel variety PASS")
          assert hashes[0]!=hashes[1],"Both activities cannot display the same illustration"
          # Real painterly references are our primary mobile-safe backgrounds.
          # Exact hashes protect the approved art from accidental replacement.
          expected={
            "vigilants-painterly":"c3eb70f297234c817777010847d54696fe35b18f4020dd1d2bce347b45da5e3e",
            "scouts-painterly":"a1fd378bdadb61b19bde8655ca23597c3e59d2bc86a521c425f6991663c2698c"}
          for stem,wanted in expected.items():
              f=root/(stem+".jpg")
              content=f.read_bytes()
              assert content.startswith(b"\xff\xd8") and content.endswith(b"\xff\xd9"),f"Corrupt original JPEG {stem}"
              assert len(content)>60000,f"Unexpectedly low-detail scenery {stem}"
              assert hashlib.sha256(content).hexdigest()==wanted,f"Painterly visual SHA drift {stem}"
              assert f.with_suffix(".jpg.meta").is_file(),f"Missing Unity importer for {stem}"
              print(f"{stem}: original painterly JPEG + Unity importer + SHA PASS")
          PY
      - name: Keep genuine illustrated backgrounds for visual review
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-retention-paintings-${{ github.sha }}
          path: |
            Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-illustration.png
            Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-illustration.png
            Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-painterly.jpg
            Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-painterly.jpg
          retention-days: 14
