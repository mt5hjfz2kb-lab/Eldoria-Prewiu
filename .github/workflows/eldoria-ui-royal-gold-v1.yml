name: Royal Gold UI independent checks
on:
  push:
    branches: ['ui/eldoria-royal-gold-v1-20261018']
    paths:
      - '.github/workflows/eldoria-ui-royal-gold-v1.yml'
      - 'tools/eldoria-ui-royal-gold-v1/**'
      - 'Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/**'
permissions:
  contents: write
concurrency:
  group: royal-gold-independent-linux
  cancel-in-progress: false
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            Unity/Assets/Eldoria/UI
            Unity/Assets/Eldoria/Scripts/Domain
            Unity/Assets/Eldoria/Scripts/Application
            tools/eldoria-ui-royal-gold-v1
            docs/ui-royal-gold-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install Pillow==11.1.0
      - name: Preserve recovered art and materialize authored UI
        run: |
          set -euo pipefail
          python tools/eldoria-ui-royal-gold-v1/art_inventory.py
          python tools/eldoria-ui-royal-gold-v1/materialize.py
      - name: Test unchanged baseline contracts
        env:
          ROYAL_CONTRACT_LABEL: UI_BRANCH_BASELINE
        run: |
          set -euo pipefail
          dotnet run --project tools/eldoria-ui-royal-gold-v1/Tests/AdapterTests.csproj --configuration Release | tee docs/ui-royal-gold-v1/adapter-test-output.txt
          cp docs/ui-royal-gold-v1/adapter-tests.json docs/ui-royal-gold-v1/adapter-tests-baseline.json
          dotnet run --project tools/eldoria-ui-royal-gold-v1/Tests/TimingTests.csproj --configuration Release | tee docs/ui-royal-gold-v1/timing-test-output.txt
          cp docs/ui-royal-gold-v1/timing-tests.json docs/ui-royal-gold-v1/timing-tests-baseline.json
      - name: Test four pinned Valoria contract files without full repository fetch
        timeout-minutes: 4
        env:
          ROYAL_CONTRACT_LABEL: 773f4f24c09445bf4fe9f16d6f8d98949ac5ae6f
        run: |
          set -euo pipefail
          python tools/eldoria-ui-royal-gold-v1/read_contracts.py
          contracts="$RUNNER_TEMP/royal-contracts/Scripts"
          dotnet run --project tools/eldoria-ui-royal-gold-v1/Tests/AdapterTests.csproj --configuration Release --property:ContractsRoot="$contracts" | tee docs/ui-royal-gold-v1/adapter-valoria-output.txt
          cp docs/ui-royal-gold-v1/adapter-tests.json docs/ui-royal-gold-v1/adapter-tests-valoria.json
          dotnet run --project tools/eldoria-ui-royal-gold-v1/Tests/TimingTests.csproj --configuration Release --property:ContractsRoot="$contracts" | tee docs/ui-royal-gold-v1/timing-valoria-output.txt
          cp docs/ui-royal-gold-v1/timing-tests.json docs/ui-royal-gold-v1/timing-tests-valoria.json
          printf '%s\n' "$ROYAL_CONTRACT_LABEL" > docs/ui-royal-gold-v1/validated-valoria-contract.sha
          git diff --exit-code -- Unity/Assets/Eldoria/Scripts
      - name: Preserve only UI outputs on the exact input head
        if: success()
        env:
          UI_BRANCH: ui/eldoria-royal-gold-v1-20261018
        run: |
          set -euo pipefail
          git config user.name 'Eldoria Royal Gold UI builder'
          git config user.email 'royal-ui@users.noreply.github.com'
          git add Unity/Assets/Eldoria/UI Unity/Assets/Eldoria/UI.meta docs/ui-royal-gold-v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(ui): preserve native-test candidate and measured dual-contract checks [skip ci]'
          git fetch origin "$UI_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            git format-patch -1 --stdout > docs/ui-royal-gold-v1/uncommitted-output.patch
            echo 'SOURCE_MOVED: output retained as artifact; no overwrite or automatic merge.'
          else
            git push origin "HEAD:refs/heads/$UI_BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: royal-ui-independent-${{ github.run_id }}
          path: |
            docs/ui-royal-gold-v1
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1
          if-no-files-found: error
