name: "[ART WALL V5] Hand-laid 4m stone courses with correct side UV"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-handlaid-wall4m-v5.yml'
      - 'tools/valoria-modular-fortress/stone_course_wall_v5.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-single-4m-wall-stones-v5
  cancel-in-progress: false
jobs:
  rebuild-one-artisan-wall:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 90
    steps:
      - name: Locate native Blender and Git
        id: local
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-real-medieval-masonry-4m-38861363176
          run-id: 38861363176
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/wall4m-old-real-cc0
      - uses: actions/download-artifact@v4
        with:
          name: valoria-3-real-medieval-wall-pbr-38860976002
          run-id: 38860976002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/real-medieval-map
      - name: Model individual stone courses and verify distinct real UVs in Blender
        shell: powershell
        run: |
          $old=Join-Path $env:RUNNER_TEMP 'wall4m-old-real-cc0\eldoria-4m-photo-wall-trial\glb\wall_panel_regular_4m.glb'
          $photo=Join-Path $env:RUNNER_TEMP 'real-medieval-map'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-handlaid-wall4m-v5'
          if(-not(Test-Path $old)){throw "Original wall candidate missing $old"}
          if(-not(Test-Path (Join-Path $photo 'medieval_blocks_03_diffuse.jpg'))){throw "CC0 stone image missing"}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/stone_course_wall_v5.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned art generator unavailable'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-stone-wall-v5.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $stdout=Join-Path $env:RUNNER_TEMP 'eldoria-stone-wall-v5.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'eldoria-stone-wall-v5.err'
          $process=Start-Process -FilePath "${{ steps.local.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$old,$photo,$out) -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout -Tail 110 -ErrorAction SilentlyContinue
          Get-Content $stderr -Tail 50 -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0){throw "Wall V5 Blender failed $($process.ExitCode)"}
          foreach($required in @('before\wall_panel_regular_4m.png','after\wall_panel_regular_4m.png','glb\wall_panel_regular_4m.glb','reports\stone_course_v5.json')){
            if(-not(Test-Path (Join-Path $out $required))){throw "No real independent result: $required"}
          }
          $j=Get-Content (Join-Path $out 'reports\stone_course_v5.json') -Raw|ConvertFrom-Json
          if($j.stone_count -lt 55 -or $j.uv_stone_count -ne $j.stone_count){throw 'Stones missing or stretched UV warning'}
      - name: Archive true individual modular stone wall with photographs and source tracing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-real-individual-4m-wall-v5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-handlaid-wall4m-v5/**
            ${{ runner.temp }}/eldoria-stone-wall-v5.log
            ${{ runner.temp }}/eldoria-stone-wall-v5.err
          if-no-files-found: warn
          retention-days: 30
