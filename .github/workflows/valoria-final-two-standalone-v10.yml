name: "[ART FLOOR6 FINAL TWO] Independent lime and physically transmissive water A-B"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-final-two-standalone-v10.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-last-two-assets-lime-water-v10
  cancel-in-progress: false
jobs:
  wait-for-windows-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Fail closed until other active runs release shared heavy machine
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,time,json,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?status=in_progress&per_page=40'
          own=int(os.environ['GITHUB_RUN_ID'])
          for i in range(25):
            req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'User-Agent':'Eldoria-isolated-art-leasing'})
            with urllib.request.urlopen(req,timeout=40) as resp:
              runs=json.load(resp)['workflow_runs']
            others=[(v['id'],v['name']) for v in runs if v['id']!=own]
            print('Windows-resource-preflight',i,'other-active-jobs',others,flush=True)
            if not others:
              print('Lease idle; native Windows artistic test may start',flush=True)
              break
            time.sleep(24)
          else:
            raise RuntimeError('Owner runner never idled within 10min; no Blender launched')
          PY
  isolated-native-blender:
    needs: wait-for-windows-lease
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Find installed Windows native Git and Blender
        shell: powershell
        id: bins
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git unavailable'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Native Blender unavailable'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-real-corrected-2cm-mortar-38895731036
          run-id: 38895731036
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/mortar_v9
      - uses: actions/download-artifact@v4
        with:
          name: valoria-one-natural-water-v9-38897442996
          run-id: 38897442996
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/water_v9
      - name: Independent test 1 — lime grain CC0, stone seam, paired macro views
        shell: powershell
        continue-on-error: true
        run: |
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/true_lime_mortar_v10_staged.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned lime artisan code missing'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-lime-v10.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $src=Join-Path $env:RUNNER_TEMP 'mortar_v9\valoria-true-lime-seam-v9\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-lime-finegrain-v10'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-lime-v10.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-lime-v10.err'
          if(-not(Test-Path (Join-Path $src 'mortar_joint_recess.glb'))){throw 'Unmodified true V9 mortar missing'}
          $p=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 65 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Physical mortar test failed $($p.ExitCode)"}
      - name: Independent test 2 — physical blue-water transmission and studio-only bed
        shell: powershell
        continue-on-error: true
        run: |
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/water_true_transmission_v10_staged.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned water shading artist code missing'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-water-v10.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $src=Join-Path $env:RUNNER_TEMP 'water_v9\valoria-river-water-v9\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-water-transmission-v10'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-water-v10.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-water-v10.err'
          if(-not(Test-Path (Join-Path $src 'river_water_tile.glb'))){throw 'Unmodified stochastic V9 water missing'}
          $p=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 65 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Physical translucent water test failed $($p.ExitCode)"}
      - name: Fail closed if either true independent model is incomplete
        shell: powershell
        run: |
          foreach($p in @(
            (Join-Path $env:RUNNER_TEMP 'valoria-lime-finegrain-v10\glb\mortar_joint_recess.glb'),
            (Join-Path $env:RUNNER_TEMP 'valoria-water-transmission-v10\glb\river_water_tile.glb'))){
            if(-not(Test-Path $p)){throw "Real Blender candidate missing: $p"}
          }
      - name: Preserve real GLB, same-camera A-B, logs; never auto art-approve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-two-isolated-materials-final-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-lime-finegrain-v10/**
            ${{ runner.temp }}/valoria-water-transmission-v10/**
            ${{ runner.temp }}/valoria-lime-v10.log
            ${{ runner.temp }}/valoria-lime-v10.err
            ${{ runner.temp }}/valoria-water-v10.log
            ${{ runner.temp }}/valoria-water-v10.err
          if-no-files-found: warn
          retention-days: 30
