name: "[EXPERIMENT] Golden Cell new artistic base"

on:
  push:
    branches: ['visual-proof/golden-cell-new-base-v1']
    paths:
      - 'Unity/Assets/Eldoria/ArtTests/GoldenCellNewBase/**'
      - '.github/workflows/golden-cell-new-base.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'blockout or final'
        required: true
        default: 'blockout'
        type: choice
        options: [blockout, final]

permissions:
  contents: read

concurrency:
  group: golden-cell-new-base
  cancel-in-progress: true

jobs:
  golden-cell:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Verify Unity
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }

      - name: Stage Golden Cell CC0 PBR materials
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\GoldenCellExternal"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $headers=@{'User-Agent'='Eldoria-GoldenCell/1.0'}
          $assets=@(
            @{ id='castle_wall_slates'; prefix='stone' },
            @{ id='wood_planks'; prefix='wood' },
            @{ id='roof_slates_03'; prefix='roof' },
            @{ id='cobblestone_floor_001'; prefix='ground' },
            @{ id='mossy_rock'; prefix='mossrock' },
            @{ id='rusty_metal_sheet'; prefix='metal' },
            @{ id='medieval_wall_01'; prefix='plaster' }
          )
          foreach($asset in $assets){
            $payload=Invoke-RestMethod -Headers $headers -Uri ("https://api.polyhaven.com/files/"+$asset.id)
            $json=$payload | ConvertTo-Json -Depth 50
            $urls=[regex]::Matches($json,'https://[^"]+') | ForEach-Object { $_.Value.Replace('\u0026','&') } | Select-Object -Unique
            $patterns=@(
              @{ key='diff'; rx='_diff_1k\.(jpg|png)(\?|$)' },
              @{ key='normal'; rx='_nor_gl_1k\.(jpg|png)(\?|$)' },
              @{ key='ao'; rx='_ao_1k\.(jpg|png)(\?|$)' }
            )
            foreach($map in $patterns){
              $url=$urls | Where-Object { $_ -match $map.rx } | Select-Object -First 1
              if(-not $url){ if($map.key -eq 'ao'){ continue }; throw "Missing $($map.key) map for $($asset.id)" }
              $ext=[IO.Path]::GetExtension(([uri]$url).AbsolutePath)
              $out=Join-Path $dest ($asset.prefix+'_'+$map.key+$ext)
              Invoke-WebRequest -Headers $headers -Uri $url -OutFile $out
              if((Get-Item $out).Length -lt 10000){ throw "Downloaded map too small: $out" }
            }
          }
          @'
          Eldoria Golden Cell experimental PBR set.
          Source: Poly Haven.
          License: CC0.
          Assets: castle_wall_slates, wood_planks, roof_slates_03, cobblestone_floor_001, mossy_rock, rusty_metal_sheet, medieval_wall_01.
          Experimental branch only; not promoted to production.
          '@ | Set-Content (Join-Path $dest 'SOURCE.txt') -Encoding UTF8

      - name: Stage Golden Cell CC0 hero fort
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\GoldenCellHero"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $headers=@{'User-Agent'='Eldoria-GoldenCell/1.0'}
          $payload=Invoke-RestMethod -Headers $headers -Uri "https://api.polyhaven.com/files/modular_fort_01"

          $node=$null
          if($payload.gltf.'1k' -and $payload.gltf.'1k'.gltf){ $node=$payload.gltf.'1k'.gltf }
          elseif($payload.gltf){
            foreach($resProp in $payload.gltf.PSObject.Properties){
              if($resProp.Value.gltf){ $node=$resProp.Value.gltf; break }
            }
          }
          if(-not $node -or -not $node.url){ throw "Poly Haven modular_fort_01 glTF node not found." }

          $mainUri=[uri]$node.url
          $mainName=[IO.Path]::GetFileName($mainUri.AbsolutePath)
          if([string]::IsNullOrWhiteSpace($mainName)){ $mainName='modular_fort_01.gltf' }
          Invoke-WebRequest -Headers $headers -Uri $node.url -OutFile (Join-Path $dest $mainName)

          $downloaded=@($node.url)
          if($node.include){
            foreach($prop in $node.include.PSObject.Properties){
              $relative=$prop.Name
              $fileInfo=$prop.Value
              if(-not $fileInfo.url){ continue }
              $out=Join-Path $dest $relative
              $parent=Split-Path $out -Parent
              if($parent -and -not (Test-Path $parent)){ New-Item -ItemType Directory -Force -Path $parent | Out-Null }
              Invoke-WebRequest -Headers $headers -Uri $fileInfo.url -OutFile $out
              if((Get-Item $out).Length -lt 128){ throw "Downloaded include too small: $relative" }
              $downloaded += $fileInfo.url
            }
          }

          $downloaded | Set-Content (Join-Path $dest 'SOURCE_URLS.txt') -Encoding UTF8
          $gltf=Get-ChildItem $dest -Filter '*.gltf' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $gltf){ throw "Poly Haven modular_fort_01 glTF file missing after staging." }
          if((Get-ChildItem $dest -Recurse -File | Measure-Object).Count -lt 2){
            throw "Hero fort staging has no dependent files."
          }

          @'
          Golden Cell hero architecture proof
          Asset: modular_fort_01
          Source: Poly Haven
          License: CC0
          glTF + API-declared include dependencies staged preserving relative paths.
          Experimental branch only
          '@ | Set-Content (Join-Path $dest 'SOURCE.txt') -Encoding UTF8

      - name: Capture Golden Cell
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\GoldenCellCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-GoldenCell.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $phase="${{ github.event.inputs.phase }}"
          if([string]::IsNullOrWhiteSpace($phase)){ $phase='final' }
          $method=if($phase -eq 'final'){'Eldoria.EditorTools.GoldenCellNewBaseGate.CaptureFinal'}else{'Eldoria.EditorTools.GoldenCellNewBaseGate.CaptureBlockout'}
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod',$method,'-logFile',$log)
          $process=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(15)
          while(-not $process.HasExited -and (Get-Date) -lt $deadline){ Start-Sleep -Seconds 2; $process.Refresh() }
          if(-not $process.HasExited){ & taskkill.exe /PID $process.Id /T /F | Out-Null; if(Test-Path $log){Get-Content $log -Tail 250}; throw 'Golden Cell timed out.' }
          $process.Refresh()
          if($process.ExitCode -ne 0){ if(Test-Path $log){Get-Content $log -Tail 300}; throw "Golden Cell failed: $($process.ExitCode)" }
          if($phase -eq 'final'){
            $expected=@('before-19.png','before-12.png','before-9.png','before-mobile.png','after-19.png','after-12.png','after-9.png','after-mobile.png','final-evidence.json')
          } else {
            $expected=@('before-19.png','before-12.png','before-9.png','before-mobile.png','blockout-19.png','blockout-12.png','blockout-9.png','blockout-mobile.png','blockout-evidence.json')
          }
          foreach($name in $expected){
            $p=Join-Path $folder $name
            if(-not (Test-Path $p)){throw "Missing Golden Cell output: $name"}
            if($name.EndsWith('.png') -and (Get-Item $p).Length -lt 10000){throw "Empty capture: $name"}
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-cell-new-base-${{ github.run_id }}
          path: |
            Unity/GoldenCellCaptures/*
            ${{ runner.temp }}/Eldoria-GoldenCell.log
          if-no-files-found: warn
          retention-days: 14
