name: Valoria interface v1 six-family review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-module-interface-gate.yml'
      - 'tools/valoria_interface_blender.py'
      - 'Unity/Assets/Eldoria/ArtTests/ImageTo3D/Editor/MicroValoriaInterfaceReview.cs'
  workflow_dispatch:

concurrency:
  group: eldoria-interface-v1
  cancel-in-progress: true

jobs:
  interface-v1:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
      - name: Retrieve certified Module 3 Unity artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module3-500a031407bc1a554dbeb3f9fd561e865ccdc973
          run-id: 36334704739
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-module3
      - name: Retrieve certified GateStreetRiseRock MV1 artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-gate-street-3230d85d94949d4084941c234d59d73b2cdaa553
          run-id: 36346961014
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-gate-mv1

      - name: Retrieve certified residential artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module-residential-terrace-rock-v1-final-f31b114737f6a5ac1ee53bad281989c0b5856f29
          run-id: 36353236508
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-residential
      - name: Retrieve certified street artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module-street-landing-transition-v1-final-da75ec34bdfe5f3e4d8bf08a909f1ac3dd3d1cae
          run-id: 36355160385
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-street
      - name: Retrieve certified seam artifact
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module-rock-terrain-seam-filler-v1-5207b408de9ae7f74ff51a87b70502ac4ea6f711
          run-id: 36356423039
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-seam
      - name: Stage six certified GLB families
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $sourceDir = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source"
          New-Item -ItemType Directory -Force $sourceDir | Out-Null
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          $tower = Join-Path $downloads 'Eldoria_Module_TowerWallRock_50K.glb'
          if (-not (Test-Path $tower)) { throw "Certified Module 1 is missing: $tower" }
          $towerSha = (Get-FileHash $tower -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($towerSha -ne '18785f7ba607cef1e7dcee45684d65c3166dc47b0f73b4bc4fb3d295c6f53a6a') {
            throw "Module 1 SHA mismatch: $towerSha"
          }
          Copy-Item $tower (Join-Path $sourceDir 'Eldoria_Module_TowerWallRock_50K.glb')
          $module3 = @(Get-ChildItem "$env:RUNNER_TEMP\certified-module3" -Recurse -File -Filter 'Eldoria_Module_TerraceStairRock_50K.glb')
          if ($module3.Count -ne 1) { throw "Certified Module 3 artifact contains $($module3.Count) matching GLBs." }
          $terraceSha = (Get-FileHash $module3[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($terraceSha -ne '83fce93daeb5bb455ab89bb195c39f617b3ea69ff9bf29f938ae4744caff3e5e') {
            throw "Certified terrace artifact SHA mismatch: $terraceSha"
          }
          Copy-Item $module3[0].FullName (Join-Path $sourceDir 'Eldoria_Module_TerraceStairRock_50K.glb')

          $gate = @(Get-ChildItem "$env:RUNNER_TEMP\certified-gate-mv1" -Recurse -File -Filter 'Eldoria_Module_GateStreetRiseRock_50K.glb')
          if ($gate.Count -ne 1) { throw "Certified MV1 artifact contains $($gate.Count) matching GLBs." }
          $gateSha = (Get-FileHash $gate[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gateSha -ne '9d1a97ea385d557b77779eef7a7b65f8027bfc79a56b26081abc6b62f25a8302') {
            throw "GateStreetRiseRock MV1 optimized SHA mismatch: $gateSha"
          }
          Copy-Item $gate[0].FullName (Join-Path $sourceDir 'Eldoria_Module_GateStreetRiseRock_50K.glb')

          $file = @(Get-ChildItem "$env:RUNNER_TEMP\certified-residential" -Recurse -File -Filter 'Eldoria_Module_UnderReview_50K.glb')
          if ($file.Count -ne 1) { throw "Certified residential artifact contains $($file.Count) matching GLBs." }
          $sha = (Get-FileHash $file[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '2ca694f547b54989305328045b60d28b53da45da94cffbd63a27b9fc698dc458') { throw "Certified residential SHA mismatch: $sha" }
          Copy-Item $file[0].FullName (Join-Path $sourceDir 'Eldoria_Module_ResidentialTerraceRock_50K.glb')
          $file = @(Get-ChildItem "$env:RUNNER_TEMP\certified-street" -Recurse -File -Filter 'Eldoria_Module_UnderReview_50K.glb')
          if ($file.Count -ne 1) { throw "Certified street artifact contains $($file.Count) matching GLBs." }
          $sha = (Get-FileHash $file[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'ef367d9f0f671cd29e1b02e2d36a2dfdea3acd6e789087e4da5fb5e087e81b01') { throw "Certified street SHA mismatch: $sha" }
          Copy-Item $file[0].FullName (Join-Path $sourceDir 'Eldoria_Module_StreetLandingTransition_50K.glb')
          $file = @(Get-ChildItem "$env:RUNNER_TEMP\certified-seam" -Recurse -File -Filter 'Eldoria_Module_UnderReview_50K.glb')
          if ($file.Count -ne 1) { throw "Certified seam artifact contains $($file.Count) matching GLBs." }
          $sha = (Get-FileHash $file[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '2676e11fbfde6781996117b191a8a88b534b36ad6901409283bfdea22a51af6d') { throw "Certified seam SHA mismatch: $sha" }
          Copy-Item $file[0].FullName (Join-Path $sourceDir 'Eldoria_Module_RockTerrainSeamFiller_50K.glb')
          @{
            tower = @{ name = (Split-Path $tower -Leaf); sha256 = $towerSha }
            terrace = @{ name = $module3[0].Name; sha256 = $terraceSha }
            gate = @{ name = $gate[0].Name; sha256 = $gateSha; source_sha256 = '4d1c19978302643003600b0da5ed2f0ef14f7256c85da03077d36fa9f13e294e' }
            residential = @{ name = 'Eldoria_Module_ResidentialTerraceRock_50K.glb'; sha256 = '2ca694f547b54989305328045b60d28b53da45da94cffbd63a27b9fc698dc458' }
            street = @{ name = 'Eldoria_Module_StreetLandingTransition_50K.glb'; sha256 = 'ef367d9f0f671cd29e1b02e2d36a2dfdea3acd6e789087e4da5fb5e087e81b01' }
            seam = @{ name = 'Eldoria_Module_RockTerrainSeamFiller_50K.glb'; sha256 = '2676e11fbfde6781996117b191a8a88b534b36ad6901409283bfdea22a51af6d' }
          } | ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP\micro-valoria-sources.json"
          Get-Content "$env:RUNNER_TEMP\micro-valoria-sources.json"
      - name: Locate Blender
        id: blender
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $candidate = (Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if (-not $candidate) {
            foreach ($root in @('C:\Program Files\Blender Foundation', "$env:LOCALAPPDATA\Programs\Blender Foundation")) {
              if ($candidate) { break }
              if (Test-Path $root) {
                $candidate = Get-ChildItem $root -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if (-not $candidate -or -not (Test-Path $candidate)) { throw 'Blender not found.' }
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2
      - name: Adapt six interfaces without remodelling source geometry
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $sourceDir = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source"
          $reportDir = "$env:GITHUB_WORKSPACE\Unity\InterfaceV1Reports"
          New-Item -ItemType Directory -Force $reportDir | Out-Null
          $families = @(
            @('TowerWallRock','TowerWallRock'),
            @('TerraceStairRock','TerraceStairRock'),
            @('GateStreetRiseRock','GateStreetRiseRock_MV1'),
            @('ResidentialTerraceRock','ResidentialTerraceRock'),
            @('StreetLandingTransition','StreetLandingTransition'),
            @('RockTerrainSeamFiller','RockTerrainSeamFiller')
          )
          foreach ($f in $families) {
            $inputGlb = Join-Path $sourceDir "Eldoria_Module_$($f[0])_50K.glb"
            $outputGlb = Join-Path $sourceDir "Eldoria_Module_$($f[0])_InterfaceV1.glb"
            $report = Join-Path $reportDir "$($f[0]).json"
            & '${{ steps.blender.outputs.path }}' -b --python "$env:GITHUB_WORKSPACE\tools\valoria_interface_blender.py" -- --input $inputGlb --output $outputGlb --report $report --family $f[1]
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $outputGlb)) { throw "Blender interface adaptation failed for $($f[0])" }
            Get-Content $report
          }
      - name: Execute isolated Unity gate
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found.' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }
          $folder = "$env:GITHUB_WORKSPACE\Unity\MicroValoriaInterfaceReviewCaptures"
          $log = "$env:RUNNER_TEMP\Eldoria-InterfaceV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args = @('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.MicroValoriaInterfaceReview.Capture','-logFile',$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(600000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 180 }
            throw 'Micro-Valoria gate timed out.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw "Micro-Valoria gate failed: $($process.ExitCode)"
          }
          foreach ($name in @('strategic.png','city.png','detail.png','oblique.png','metrics.json')) {
            $file = Join-Path $folder $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 10000 -and $name -ne 'metrics.json') {
              throw "Missing/empty capture: $name"
            }
          }
          Get-Content (Join-Path $folder 'metrics.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-interface-v1-${{ github.sha }}
          path: |
            Unity/MicroValoriaInterfaceReviewCaptures/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/MicroValoriaInterfaceReview.unity
            Unity/InterfaceV1Reports/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/*_InterfaceV1.glb
            ${{ runner.temp }}/micro-valoria-sources.json
            ${{ runner.temp }}/Eldoria-InterfaceV1.log
          if-no-files-found: warn
