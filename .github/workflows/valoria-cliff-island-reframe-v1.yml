name: "[EXPERIMENT] Valoria Cliff Island Reframe v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaCliffIslandReframeV1.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaCliffIslandReframeGateV1.cs'
      - 'pipeline/valoria-cliff-island-reframe-v1-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-cliff-island-reframe-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage selected Kiara 3 CC0 backplate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\BackplateCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $payload=Invoke-RestMethod -Uri 'https://api.polyhaven.com/files/kiara_3_morning' -Headers @{'User-Agent'='Eldoria-Valoria-Convergence/1.0'}
          $json=$payload | ConvertTo-Json -Depth 100 -Compress
          $all=[regex]::Matches($json,'https://[^"]+?\.jpg(?:\?[^"]*)?') | ForEach-Object { $_.Value.Replace('\u0026','&').Replace('\/','/') } | Select-Object -Unique
          $urls=@($all | Where-Object { $_ -match 'backplate|backplates' -and $_ -match 'pretty|jpg_pretty|JPG' } | Select-Object -Unique)
          if($urls.Count -lt 2){$urls=@($all | Where-Object { $_ -notmatch 'Tonemapped|thumbnail|thumb|preview|colorchart' } | Select-Object -Unique)}
          if($urls.Count -lt 2){throw 'Could not resolve Kiara 3 backplate index 1.'}
          $dst=Join-Path $dir 'kiara3_1.jpg'
          Invoke-WebRequest -Uri $urls[1] -OutFile $dst -UseBasicParsing
          if((Get-Item $dst).Length -lt 150000){throw 'Selected backplate unexpectedly small.'}
      - name: Capture cliff-island reframe
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaCliffIslandReframeV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaCliffIslandReframeV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaCliffIslandReframeGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(22)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-cliff-island-reframe-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaCliffIslandReframeV1Captures/*
            ${{ runner.temp }}/ValoriaCliffIslandReframeV1.log
          if-no-files-found: warn
          retention-days: 30
