name: Prepare or publish exact Eldoria playtest
on:
  push:
    branches: [main]
    paths:
      - pipeline/playtest-delivery.json
      - tools/delivery/**
      - .github/workflows/eldoria-itch-delivery.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to the configured restricted itch.io project
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-external-playtest
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_publish: ${{ steps.promotion.outputs.should_publish }}
      should_configure_pc: ${{ steps.promotion.outputs.should_configure_pc }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/delivery
            tools/closeout
            pipeline/playtest-delivery.json
          sparse-checkout-cone-mode: false
      - name: Resolve explicit promotion request
        id: promotion
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('pipeline/playtest-delivery.json','utf8'));
            let requested = context.eventName === 'workflow_dispatch' && String(context.payload.inputs?.publish) === 'true';
            if (context.eventName === 'push' && cfg.promotion_request) {
              const old = await github.rest.repos.getContent({...context.repo,path:'pipeline/playtest-delivery.json',ref:context.payload.before});
              const previous = JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));
              requested = JSON.stringify(previous.promotion_request) !== JSON.stringify(cfg.promotion_request);
            }
            if (requested) {
              const p = cfg.promotion_request;
              if (!cfg.publish_enabled || !cfg.restricted_project_confirmed || !p?.id ||
                  p.target !== cfg.target || p.artifact_sha256 !== cfg.candidate.artifact_sha256 ||
                  p.revision !== cfg.candidate.revision) throw Error('Explicit promotion does not match verified candidate/destination');
            }
            let configurePC=false;
            if (context.eventName === 'push' && cfg.pc_request?.id) {
              const old=await github.rest.repos.getContent({...context.repo,path:'pipeline/playtest-delivery.json',ref:context.payload.before});
              const previous=JSON.parse(Buffer.from(old.data.content,'base64').toString('utf8'));
              configurePC=JSON.stringify(previous.pc_request)!==JSON.stringify(cfg.pc_request);
              if(configurePC && (cfg.pc_request.artifact_sha256!==cfg.candidate.artifact_sha256 || cfg.pc_request.revision!==cfg.candidate.revision))
                throw Error('PC request does not match QA-approved candidate');
            }
            core.setOutput('should_configure_pc',String(configurePC));
            core.setOutput('should_publish',String(requested));
      - name: Verify upstream QA and exact artifact, then download
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const c = require('./pipeline/playtest-delivery.json').candidate;
            const qa = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:c.qa_run})).data;
            if (qa.status !== 'completed' || qa.conclusion !== 'success' || qa.head_sha !== c.qa_source_sha || qa.head_branch !== 'main' || qa.path !== '.github/workflows/valoria-windows-chromium-qa.yml') throw Error('Pinned QA identity/status mismatch');
            const a = (await github.rest.actions.getArtifact({...context.repo,artifact_id:c.artifact_id})).data;
            if (a.expired || a.name !== c.artifact_name || a.workflow_run.id !== c.qa_run || a.digest !== 'sha256:'+c.artifact_sha256) throw Error('Artifact provenance mismatch');
            const native = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:c.native_run})).data;
            if (native.head_sha !== c.source_sha || native.head_branch !== 'main') throw Error('Native source mismatch');
            const bytes = await github.rest.actions.downloadArtifact({...context.repo,artifact_id:c.artifact_id,archive_format:'zip'});
            fs.writeFileSync('candidate.zip',Buffer.from(bytes.data));
      - name: Check original Unity hashes and adapt HTML5 transport
        run: python3 tools/delivery/prepare.py candidate.zip delivery-output
      - name: Verify decoded transport hashes and single-allocation Unity loading
        run: |
          node --check delivery-output/dist/play.js
          node tools/delivery/test-exact-decoded-transport.mjs delivery-output/dist
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-external-playtest-${{ github.run_id }}
          path: |
            delivery-output/*.zip
            delivery-output/identity.json
          retention-days: 90
      - name: Report delivery boundary
        run: echo 'Package verified. This job does not certify publication or physical mobile play.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: needs.prepare.outputs.should_publish == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    environment: eldoria-playtest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipeline/playtest-delivery.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: eldoria-external-playtest-${{ github.run_id }}
          path: package
      - name: Require configured restricted destination and credential
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,re
          c=json.load(open('pipeline/playtest-delivery.json'))
          assert c['publish_enabled'] is True and c['restricted_project_confirmed'] is True, 'Account/privacy setup incomplete'
          assert re.fullmatch(r'[a-z0-9][a-z0-9-]*/[a-z0-9][a-z0-9-]*',c['target'] or ''), 'Invalid project target'
          assert os.environ.get('BUTLER_API_KEY'), 'Missing environment secret BUTLER_API_KEY'
          PY
      - name: Install official stable Butler
        run: |
          curl --fail --location --retry 2 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          butler-bin/butler version
      - name: Upload verified package to existing restricted project
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,subprocess,hashlib,time
          from pathlib import Path
          c=json.load(open('pipeline/playtest-delivery.json'))
          r=json.load(open('package/identity.json'))
          p=Path('package')/('Eldoria-'+c['candidate']['revision']+'-itch.zip')
          assert r['candidate']==c['candidate'] and hashlib.sha256(p.read_bytes()).hexdigest()==r['zip_sha256']
          delivery_version=c['candidate']['revision']+'-'+r['zip_sha256'][:12]
          subprocess.run(['butler-bin/butler','push',str(p),c['target']+':web','--userversion',delivery_version],check=True)
          for attempt in range(4):
              result=subprocess.run(['butler-bin/butler','status',c['target']+':web'],capture_output=True,text=True,check=True)
              print(result.stdout)
              if 'No channel' not in result.stdout+result.stderr and delivery_version in result.stdout and '•' not in result.stdout:
                  break
              if attempt==3:
                  raise RuntimeError('Upload returned success but remote channel/version is not confirmed')
              time.sleep(10)

          PY
          echo 'Upload accepted; verify restricted hosted page, load and save before marking delivered. No automatic claim of hosted PASS.' >> "$GITHUB_STEP_SUMMARY"

  remote_status:
    runs-on: ubuntu-latest
    environment: eldoria-playtest
    timeout-minutes: 5
    steps:
      - name: Inspect remote channel without uploading
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl --fail --location --retry 2 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o butler.zip
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          butler-bin/butler status --show-all-files chrismad/eldoria-pruebas

  configure_pc:
    if: needs.prepare.outputs.should_configure_pc == 'true'
    needs: prepare
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 8
    steps:
      - name: Recover existing GitHub Desktop Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' |
              Sort-Object Name -Descending | ForEach-Object {
                Join-Path $_.FullName 'resources/app/git/cmd/git.exe'
              } | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Existing PC Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          path: eldoria-delivery-setup
          sparse-checkout: tools/delivery
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: eldoria-external-playtest-${{ github.run_id }}
          path: eldoria-delivery-setup/package
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signed Tailscale and stage verified game without opening network access
        shell: powershell
        working-directory: eldoria-delivery-setup
        run: |
          & tools/delivery/setup-pc.ps1 -Package package
          if($LASTEXITCODE){throw 'PC setup failed'}
