name: V3 management domain smoke (no Unity/Windows lease)
on:
  push:
    branches: [feature/ui-v3-management-completion-20261021]
  pull_request:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Application/LocalGateway.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/GameState.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/PlayerIdentityPolicy.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/ResourceNodeTierPolicy.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/RenewablePopulationPolicy.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/EldoriaV41Contracts.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/EarlyRetentionRules.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/SliceContentProfiles.cs'
      - 'tools/ui-v3-domain-smoke/**'
      - '.github/workflows/ui-v3-domain-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Eldoria/Scripts/Domain/GameState.cs
            /Unity/Assets/Eldoria/Scripts/Domain/PlayerIdentityPolicy.cs
            /Unity/Assets/Eldoria/Scripts/Domain/ResourceNodeTierPolicy.cs
            /Unity/Assets/Eldoria/Scripts/Domain/RenewablePopulationPolicy.cs
            /Unity/Assets/Eldoria/Scripts/Domain/EconomyProductionV2.cs
            /Unity/Assets/Eldoria/Scripts/Domain/EldoriaV41Contracts.cs
            /Unity/Assets/Eldoria/Scripts/Domain/EarlyRetentionRules.cs
            /Unity/Assets/Eldoria/Scripts/Domain/NarrativeCoherenceRules.cs
            /Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV2/Runtime/RoyalGoldV3ContextHud.cs
            /tools/ui-v3-domain-smoke/verify-construction-anchor.mjs
            /Unity/Assets/Eldoria/Scripts/Domain/SliceContentProfiles.cs
            /Unity/Assets/Eldoria/Scripts/Domain/PlayerIdentityPolicy.cs
            /Unity/Assets/Eldoria/Scripts/Domain/ResourceNodeTierPolicy.cs
            /Unity/Assets/Eldoria/Scripts/Domain/RenewablePopulationPolicy.cs
            /Unity/Assets/Eldoria/Scripts/Application/LocalGateway.cs
            /tools/ui-v3-domain-smoke/Smoke.csproj
            /tools/ui-v3-domain-smoke/Program.cs
      - name: Check real building-timer source geometry contract without Unity
        run: node tools/ui-v3-domain-smoke/verify-construction-anchor.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile authoritative Unity domain and exercise offline contracts
        run: dotnet run --project tools/ui-v3-domain-smoke/Smoke.csproj --configuration Release

  supersede-unstarted-native-candidates:
    # A workflow marked in_progress may still have its sole native job queued
    # with no runner. Preserve all executions that have actually started.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 120 && github.event.pull_request.head.ref == 'feature/eldoria-early-retention-20261028' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Supersede only old native jobs with no runner and no started steps
        uses: actions/github-script@v7
        with:
          script: |
            const branch='feature/eldoria-early-retention-20261028';
            const head=context.payload.pull_request.head.sha;
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:120})).data;
            if(pr.head.sha!==head || pr.head.ref!==branch) {
              core.info('Candidate already superseded; leave queue to its current owner');return;
            }
            const raw=(await github.rest.repos.getContent({...context.repo,path:'pipeline/active-workstreams.json',ref:'main'})).data;
            const registry=JSON.parse(Buffer.from(raw.content,'base64').toString('utf8'));
            const holders=registry.active.filter(w=>w.resources?.includes('windows-runner-heavy'));
            if(holders.length!==1 || holders[0].id!=='eldoria-early-retention-systems-20261028' ||
               holders[0].owner!=='codex-pr120-exact-visual-pr122-20261028' || holders[0].ownership_revision!==6 || holders[0].ownership_state!=='claimed')
              throw Error('Do not manage another workstream native queue');
            const nativePaths=new Set(['.github/workflows/ui-progression-cert.yml','.github/workflows/early-retention-native.yml']);
            const batches=await Promise.all([...nativePaths].map(workflow_id=>
              github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:workflow_id.split('/').pop(),branch,per_page:30})));
            const runs=batches.flatMap(r=>r.data.workflow_runs);
            const neverStarted=jobs=>jobs.length===1 && jobs.every(j=>j.status==='queued' && !j.runner_id && !j.runner_name && (j.steps||[]).length===0);
            for(const run of runs) {
              if(!nativePaths.has(run.path) || run.head_sha===head || run.status==='completed')continue;
              // A CI-only head may not request a new native-art capture.
              // Preserve its latest capture unless a real replacement exists.
              if(!runs.some(next=>next.path===run.path && next.head_sha===head &&
                (next.status!=='completed' || next.conclusion==='success')))continue;
              const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id})).data.jobs;
              if(!neverStarted(jobs)) {core.info('Preserve started or pending execution '+run.id);continue;}
              // Re-read directly before cancellation; never infer job state from
              // the run's in_progress label, its age or its source commit alone.
              const latestPr=(await github.rest.pulls.get({...context.repo,pull_number:120})).data;
              if(latestPr.head.sha!==head) {core.info('Head moved; stop queue cleanup');return;}
              const current=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id})).data.jobs;
              if(!neverStarted(current)) {core.info('Runner started; preserve '+run.id);continue;}
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
              core.info('ELDORIA_UNSTARTED_SUPERSEDED_NATIVE_CANCELLED '+run.id+' old-source='+run.head_sha);
            }

  supersede-unstarted-pr136-consolidation-candidates:
    # Only this consolidation's explicitly identified obsolete candidates.
    # Never cancel a Windows job after it acquires a runner or starts a step.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 136 && github.event.pull_request.head.ref == 'fix/player-feedback-context-ui-20261030' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Preserve running Unity and retire only own superseded unstarted candidates
        uses: actions/github-script@v7
        with:
          script: |
            const branch='fix/player-feedback-context-ui-20261030',head=context.payload.pull_request.head.sha;
            const ownHeads=new Set(['6744fb6984320fdcf2ef3cb8067830fe95d38ea1',
              '2d16dd5d268e25e278f7cb6ae86fc0fd53bb83ff','99041df3127fd89766d56c7b9c2496325721a088',
              '61d0724c202a6bdaa970340d2fcfd4693b54bbc8','1aa97d9bd9d68fe196a50862f6cece49ea7244bd',
              '17dfeb3e37bcb4615acfbe60e26e9099cfd9cfc9','f1d73d68789faf9aa7d85c38500b4568dcc943fc','39f2b9bb5bb9f1a19450fa41967d97dae268f373','e37efca1eff0ca13d9b2b51c3173a67212fa427a','f5573cf82b1fb4ca997d76a2994a03ca79535b43','21b0ea0e4622d92137fb608c6c904497187a07e9','c09cb6382b0637dae58110c5f5998ed0a7237c6d','44bd1e72c3c428d2cf85bf817f7fab61d1b0f3e2','d2fb6d21b9fc9fcee171643ef6c1b001a1e3d312','e8196c0c9b0240ac044607c63dee094c97d72957','22a7d3704acf958fea7e51b1bf0ce1c811f56afe','c1a1f2f5267b84109bcad91068d43c19eee0033c','51f2440c00ef51c00a1643661818637d6ddbb769','8cf57d483c83d691d255c562d21859e326e66d92']);
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:136})).data;
            if(pr.head.sha!==head||pr.head.ref!==branch)return;
            const raw=(await github.rest.repos.getContent({...context.repo,path:'pipeline/active-workstreams.json',ref:'main'})).data;
            const registry=JSON.parse(Buffer.from(raw.content,'base64').toString('utf8'));
            const holders=registry.active.filter(w=>w.resources?.includes('windows-runner-heavy'));
            if(holders.length!==1||holders[0].id!=='valoria-master-plan-layered-construction-20261016'||
              holders[0].owner!=='codex-eldoria-pr136-consolidation-20261104'||holders[0].ownership_revision<140||
              holders[0].ownership_state!=='claimed'||!holders[0].phase.startsWith('PR136_'))
              throw Error('Preserve foreign or unverified native ownership');
            const neverStarted=jobs=>jobs.filter(j=>j.name==='certify').length===1&&jobs.every(j=>
              j.name==='certify'?(j.status==='queued'&&!j.runner_id&&!j.runner_name&&(j.steps||[]).length===0):
              (j.name==='shared_scope'&&j.status==='completed'&&j.conclusion==='success'));
            // Local safety contracts: no active runner, started step, unknown job or missing native job can pass.
            const queued={name:'certify',status:'queued',steps:[]};
            const shared={name:'shared_scope',status:'completed',conclusion:'success'};
            if(!neverStarted([shared,queued])||neverStarted([shared,{...queued,runner_id:1}])||
              neverStarted([shared,{...queued,steps:[{status:'in_progress'}]}])||
              neverStarted([shared,{...queued,status:'in_progress'}])||neverStarted([shared])||
              neverStarted([shared,queued,{name:'foreign',status:'queued'}]))throw Error('Queue safety contract failed');
            const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'ui-progression-cert.yml',branch,per_page:40})).data.workflow_runs;
            if(!runs.some(r=>r.head_sha===head&&r.event==='push'&&(r.status!=='completed'||r.conclusion==='success'))){
              core.info('No exact replacement push certification; preserve all existing candidates');return;
            }
            for(const run of runs){
              if(run.path!=='.github/workflows/ui-progression-cert.yml'||run.head_sha===head||
                !ownHeads.has(run.head_sha)||run.status==='completed')continue;
              const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id})).data.jobs;
              if(!neverStarted(jobs)){core.info('Preserve started or unverified execution '+run.id);continue;}
              const latest=(await github.rest.pulls.get({...context.repo,pull_number:136})).data;
              if(latest.head.sha!==head)return;
              const fresh=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id})).data.jobs;
              if(!neverStarted(fresh)){core.info('Runner started; preserve '+run.id);continue;}
              await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});
              core.info('OWN_SUPERSEDED_NATIVE_CANCEL_REQUESTED '+run.id+' source='+run.head_sha);
              // GitHub's ordinary cancel preserves jobs guarded by always().
              // Use the documented fallback ONLY if that request did not stop
              // this own obsolete job and it still has never acquired a runner.
              await new Promise(resolve=>setTimeout(resolve,15000));
              const after=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:run.id})).data;
              if(after.status==='completed')continue;
              const ownerNow=(await github.rest.pulls.get({...context.repo,pull_number:136})).data;
              if(ownerNow.head.sha!==head)return;
              const leaseNow=(await github.rest.repos.getContent({...context.repo,path:'pipeline/active-workstreams.json',ref:'main'})).data;
              const holdersNow=JSON.parse(Buffer.from(leaseNow.content,'base64').toString('utf8')).active
                .filter(w=>w.resources?.includes('windows-runner-heavy'));
              if(holdersNow.length!==1||holdersNow[0].owner!==holders[0].owner||
                holdersNow[0].id!==holders[0].id||holdersNow[0].ownership_revision!==holders[0].ownership_revision||
                holdersNow[0].ownership_state!=='claimed')return;
              const remaining=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id})).data.jobs;
              if(!neverStarted(remaining)){core.info('Preserve job that started after cancel request '+run.id);continue;}
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',
                {...context.repo,run_id:run.id});
              core.info('OWN_SUPERSEDED_NEVER_STARTED_FORCE_CANCEL_REQUESTED '+run.id);
            }
