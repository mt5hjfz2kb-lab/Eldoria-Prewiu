name: '[ELDORIA] Preserve native Bastion III evidence for visual review'
on:
  push:
    branches: [feature/bastion-iii-canonical-20261027]
    paths: ['.github/workflows/bastion-iii-evidence-review.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: bastion-iii-native17-evidence
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            .github/workflows/bastion-iii-evidence-review.yml
            docs/bastion-iii/evidence/native17
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download certified native artifact, not a substitute render
        uses: actions/download-artifact@v4
        with:
          run-id: 40564560872
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          name: bastion-iii-native-40564560872
          github-token: ${{ github.token }}
          path: downloaded
      - name: Extract exact screenshot previews and A/B pixel evidence
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          import json, shutil
          base=Path('downloaded/docs/bastion-iii/native')
          out=Path('docs/bastion-iii/evidence/native17')
          out.mkdir(parents=True,exist_ok=True)
          names=[
           'A-bastion-II-horizontal','B-bastion-III-site-horizontal',
           'C-granary-level1-horizontal','D-granary-level2-horizontal',
           'E-granary-level3-horizontal','sawmill-level2-horizontal',
           'sawmill-level3-horizontal','barracks-level2-horizontal',
           'barracks-level3-horizontal','hunt-wolf-horizontal',
           'fissure-valoria-horizontal','fissure-A-open-horizontal',
           'fissure-B-scar-horizontal','ui-lyra-contact-vertical',
           'ui-unique-manuscript-chest-vertical','ui-granary-level3-horizontal',
           'ui-recruited-hero-composition-vertical'
          ]
          for name in names:
           f=base/(name+'.png')
           if not f.is_file(): raise RuntimeError('Missing authentic Unity screenshot '+str(f))
           with Image.open(f) as im:
            im=im.convert('RGB'); im.thumbnail((1000,900))
            im.save(out/(name+'.jpg'),quality=82,optimize=True)
          checks=base/'functional-checks.txt'
          if not checks.is_file(): raise RuntimeError('Exact native 17 proof checks missing')
          shutil.copy2(checks,out/'functional-checks.txt')
          pairs=[
           ('A-bastion-II-horizontal','B-bastion-III-site-horizontal'),
           ('C-granary-level1-horizontal','D-granary-level2-horizontal'),
           ('D-granary-level2-horizontal','E-granary-level3-horizontal'),
           ('sawmill-level2-horizontal','sawmill-level3-horizontal'),
           ('barracks-level2-horizontal','barracks-level3-horizontal')]
          results={}
          for a,b in pairs:
           with Image.open(base/(a+'.png')) as p,Image.open(base/(b+'.png')) as q:
            p=p.convert('RGB');q=q.convert('RGB')
            if p.size!=q.size: raise RuntimeError('Changed framing in '+a+' -> '+b)
            delta=ImageChops.difference(p,q)
            count=sum(1 for r,g,bv in delta.getdata() if max(r,g,bv)>=12)
            results[a+' -> '+b]={'changed_pixels_rgb_delta_ge12':count,'size':list(p.size)}
          (out/'ab-pixel-differences.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          (out/'README.md').write_text(
           '# Bastión III: evidencia visual nativa revisión 17\n\n'
           'Capturas JPG reducidas sin retoques artísticos, procedentes EXCLUSIVAMENTE '
           'del artefacto original [40564560872](https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/40564560872) '
           'del commit Unity `464abe1ae4f203971bd2d8349414245cf172dd92`. '
           'Las capturas PNG exactas y el paquete completo permanecen en el artefacto GitHub.\n\n'
           'Este archivo solo facilita inspección independiente: **no equivale a ART_APPROVED**.\n',
           encoding='utf-8')
          print('ARTIFACT_NATIVE17_EVIDENCE_EXTRACTED',len(names),results)
          PY
      - name: Commit only read-only visual evidence
        run: |
          git config user.name 'Eldoria visual evidence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/bastion-iii/evidence/native17
          git diff --cached --quiet && exit 0
          git commit -m 'docs(bastion-iii): preserve actual native17 art captures and pixel evidence'
          git push origin HEAD:feature/bastion-iii-canonical-20261027
