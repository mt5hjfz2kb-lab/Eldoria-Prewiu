name: Valoria V3 Unity lookdev compile probe
on:
  push:
    branches:
      - integration/valoria-v3-unity-lookdev-20261012
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Experimental/ValoriaFamilyLookdev.cs'
      - '.github/workflows/valoria-v3-unity-lookdev-probe.yml'
permissions:
  contents: read
concurrency:
  group: eldoria-valoria-v3-unity-probe
  cancel-in-progress: true
jobs:
  unity-compile:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $candidate=Get-ChildItem "${env:LOCALAPPDATA}\GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git missing' }
            Add-Content $env:GITHUB_PATH (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Run Unity import and compile
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw "Unity missing at UNITY_EDITOR_PATH" }
          $log=Join-Path $env:RUNNER_TEMP 'ValoriaV3-Unity-compile.log'
          $args=@('-batchmode','-nographics','-quit','-projectPath',"${env:GITHUB_WORKSPACE}\Unity",'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(600000)) { & taskkill.exe /PID $p.Id /T /F | Out-Null; throw 'Unity compile timed out' }
          if ($p.ExitCode -ne 0) { if(Test-Path $log){Get-Content $log -Tail 180}; throw "Unity failed $($p.ExitCode)" }
          if(Test-Path $log){Get-Content $log -Tail 60}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-v3-unity-compile-${{ github.run_id }}
          path: ${{ runner.temp }}/ValoriaV3-Unity-compile.log
          if-no-files-found: warn
          retention-days: 7
