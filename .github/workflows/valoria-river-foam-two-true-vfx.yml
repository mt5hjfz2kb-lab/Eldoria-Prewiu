name: "[ART WATER FLOOR6] Alpha whitewater spray and dark refractive river tile"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-river-foam-two-true-vfx.yml'
      - 'tools/valoria-modular-fortress/photofoam_and_river_dark_v8.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-two-genuine-river-vfx-assets
  cancel-in-progress: false
jobs:
  two-water-vfx-assets:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 80
    steps:
      - name: Use native Blender and installed Git
        id: deps
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-three-foam-mortar-stair-craft-38876079513
          run-id: 38876079513
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/older_foam_technical
      - uses: actions/download-artifact@v4
        with:
          name: valoria-three-natural-corrections-v3-38872475510
          run-id: 38872475510
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/older_river_technical
      - name: Blender alpha texturing single foamy river edge plus water IOR133
        shell: powershell
        run: |
          $foam=Join-Path $env:RUNNER_TEMP 'older_foam_technical\eldoria-three-craft-floor6\glb\river_foam_line.glb'
          $water=Join-Path $env:RUNNER_TEMP 'older_river_technical\valoria-3-natural-art-v3\glb\river_water_tile.glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-two-true-water-vfx'
          foreach($file in @($foam,$water)){if(-not(Test-Path $file)){throw "Water VFX source not found: $file"}}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/photofoam_and_river_dark_v8.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned river code missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-two-water-and-foam.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-two-river-vfx.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-two-river-vfx.err'
          $p=Start-Process -FilePath "${{ steps.deps.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$foam,$water,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 90 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Water and foam asset repair failed: $($p.ExitCode)"}
          foreach($folder in @('before','after','glb')){
            $cnt=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($cnt -ne 2){throw "Expected 2 VFX files in $folder, got $cnt"}
          }
      - name: Archive two real CC0-compatible repeatable water GLBs and true A-B images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-two-water-vfx-artist-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-two-true-water-vfx/**
            ${{ runner.temp }}/eldoria-two-river-vfx.log
            ${{ runner.temp }}/eldoria-two-river-vfx.err
          if-no-files-found: warn
          retention-days: 30
