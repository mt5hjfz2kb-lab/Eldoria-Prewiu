name: Corona original rubric calibrated agent measurement
on:
  push:
    branches: [candidate/corona-calibrated-rubric-20261126]
    paths: ['.github/workflows/corona-calibrated-rubric.yml']
permissions:
  contents: read
  actions: read
jobs:
  calibrated-art-review:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == '82d220f3a2dd47e65ea7f60a8832ab311ec6eb64' && github.event.head_commit.message == 'Studio: resume six remaining rubric evaluations, preserve completed HUD receipt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/corona-art-iteration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1657b2caa6b1a955319538ce3a8b2906398599b3
          path: studio-source
          sparse-checkout: tools/openai-development-studio
          persist-credentials: false
      - name: Retrieve original verified capture artifacts and references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          gh run download 45638738009 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir baseline
          gh run download 45824434222 --repo "$GITHUB_REPOSITORY" --name corona-before-after-dpr1 --dir ui
          gh run download 45824434222 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir candidate
          gh run download 45837717094 --repo "$GITHUB_REPOSITORY" --name corona-auxiliary-real-ab --dir aux
          gh run download 45837717094 --repo "$GITHUB_REPOSITORY" --name corona-auxiliary-original --dir aux-base
          gh run download 45837717094 --repo "$GITHUB_REPOSITORY" --name corona-auxiliary-corona --dir aux-after
          gh run download 45834241279 --repo "$GITHUB_REPOSITORY" --name region1-cameras-and-routes --dir native
          gh run download 45812100129 --repo "$GITHUB_REPOSITORY" --name corona-agent-art-plan --dir references
          gh run download 45843367417 --repo "$GITHUB_REPOSITORY" --name corona-original-weight-calibrated-scorecard --dir resume
          python3 -m py_compile tools/corona-art-iteration/calibrated_review.py
      - name: Recover HUD receipt and execute six unspent reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 tools/corona-art-iteration/calibrated_review.py --ui ui --baseline baseline --candidate candidate --aux aux --aux-base aux-base --aux-after aux-after --native native --references references --rubric tools/corona-art-iteration/calibrated-rubric-20261124.json --studio studio-source/tools/openai-development-studio --out calibrated --resume resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-original-weight-calibrated-scorecard
          path: calibrated/
          if-no-files-found: warn
