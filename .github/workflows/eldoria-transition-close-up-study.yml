name: "[PILOT] Real Unity close detail A rock seam and D rock wall"
on:
  push:
    branches: [prototype/reference-first-zero-budget-visual-pilot-20261015]
    paths: [.github/workflows/eldoria-transition-close-up-study.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eldoria-reference-first-transition-close-study
  cancel-in-progress: false

jobs:
  windows-native-ab:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    defaults:
      run:
        working-directory: reference-first-donor-checkout
    steps:
      - name: Find already installed Git
        shell: powershell
        working-directory: .
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $git = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $git) { throw 'GitHub Desktop Git missing' }
            $d=Split-Path $git
            Add-Content $env:GITHUB_PATH $d
            $env:PATH="$d;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          path: reference-first-donor-checkout
          clean: false
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            Unity/Assets
            Unity/Packages
            Unity/ProjectSettings
            docs/evidence/reference-first-zero-budget-visual-pilot-20261015
      - name: Check the four exact existing GLBs
        shell: powershell
        run: |
          $sources=@(
            'Unity/Assets/Eldoria/Resources/Valoria/Rescued/RockTerrainSeamFiller.glb',
            'Unity/Assets/Eldoria/Resources/Valoria/Rescued/StreetLandingTransition.glb',
            'Unity/Assets/Eldoria/Resources/Valoria/Rescued/TerraceStairRock.glb',
            'Unity/Assets/Eldoria/Resources/Valoria/StoneArchitectureKit_v1/RockToWallTransition.glb'
          )
          foreach ($source in $sources) {
            if (-not (Test-Path $source)) { throw "Missing real source: $source" }
            if ((Get-Item $source).Length -lt 1000000) { throw "Truncated source: $source" }
          }
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'Unity editor not installed' }
          if ((Get-Content 'Unity/ProjectSettings/ProjectVersion.txt' -Raw) -notmatch '6000\.3\.23f1') {
            throw 'Project editor version mismatch'
          }
          if (-not (Test-Path 'Unity/Assets/Eldoria/ArtTests/ReferenceFirstPilot/Editor/ReferenceFirstTransitionDonorCloseStudy.cs')) {
            throw 'Missing isolated A/B capturer'
          }
      - name: Render four original donor meshes, unchanged, inside real Unity
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'transition-close-study-unity.log'
          $out=Join-Path (Get-Location) 'artifacts/reference-first-transition-close-study'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',(Join-Path (Get-Location) 'Unity'),'-executeMethod','Eldoria.EditorTools.ReferenceFirstPilot.ReferenceFirstTransitionDonorCloseStudy.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(1500000)) {
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw 'Own Unity donor preview timed out'
          }
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'REFERENCE_FIRST_TRANSITION_CLOSE_STUDY_RENDERED:' -Quiet)) {
            if (Test-Path $log) { Get-Content $log -Tail 220 }
            throw "Genuine donor A/B failed $($p.ExitCode)"
          }
          $png=@(Get-ChildItem $out -Filter '*.png')
          if ($png.Count -ne 2) { throw "Expected two PNGs, found $($png.Count)" }
          $m=Get-Content (Join-Path $out 'transition-donor-manifest.json') -Raw | ConvertFrom-Json
          if ($m.artApproved -ne $false -or $m.productionModified -ne $false) { throw 'Evidence must remain unapproved and isolated' }
          if ($m.renderers.Count -ne 4 -or @($m.renderers | Where-Object { $_ -lt 1 }).Count -gt 0) { throw 'Missing native geometry' }
          Get-Content (Join-Path $out 'transition-donor-manifest.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-transition-close-study-native-ab-${{ github.run_id }}
          path: |
            reference-first-donor-checkout/artifacts/reference-first-transition-close-study/**
            ${{ runner.temp }}/transition-close-study-unity.log
          retention-days: 14
          if-no-files-found: warn

  archive-proof:
    needs: windows-native-ab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/reference-first-zero-budget-visual-pilot-20261015
          filter: blob:none
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/evidence/reference-first-zero-budget-visual-pilot-20261015
      - uses: actions/download-artifact@v4
        with:
          name: valoria-transition-close-study-native-ab-${{ github.run_id }}
          path: proof
      - name: Preserve two original real Unity PNG and audit manifest
        shell: bash
        run: |
          set -euo pipefail
          dst=docs/evidence/reference-first-zero-budget-visual-pilot-20261015/transition-close-study
          mkdir -p "$dst"
          for name in 39-seam-filler-detail.png 40-rock-to-wall-detail.png transition-donor-manifest.json; do
            src=$(find proof -type f -name "$name" -print -quit)
            test -n "$src" || { echo "Missing proof: $name"; exit 1; }
            cp "$src" "$dst/$name"
          done
          python3 - <<'PY'
          import pathlib,json,struct
          p=pathlib.Path('docs/evidence/reference-first-zero-budget-visual-pilot-20261015/transition-close-study')
          for n in ['39-seam-filler-detail.png','40-rock-to-wall-detail.png']:
              raw=(p/n).read_bytes()
              assert len(raw)>60000 and raw[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',raw[16:24])==(1536,1024)
          j=json.loads((p/'transition-donor-manifest.json').read_text())
          assert j['artApproved'] is False and len(j['renderers'])==4 and all(n>0 for n in j['renderers'])
          assert len(j['originalShaderNames'])==4 and len(j['originalMaterialSlotCounts'])==4
          assert j['allRendererMaterialsReplacedInSceneOnly'] is False and len(j['materialPolicy'])==4
          print('AUTHENTIC_TRANSITION_CLOSE_STUDY_SAVED_ART_NOT_APPROVED')
          PY
      - name: Commit only independent donor evidence to pilot branch
        shell: bash
        run: |
          set -euo pipefail
          git add docs/evidence/reference-first-zero-budget-visual-pilot-20261015/transition-close-study
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'evidence: Unity two zoomed donor close-ups, no art approval [skip ci] [skip ci]'
          git fetch origin prototype/reference-first-zero-budget-visual-pilot-20261015
          git rebase origin/prototype/reference-first-zero-budget-visual-pilot-20261015
          git push origin HEAD:prototype/reference-first-zero-budget-visual-pilot-20261015
