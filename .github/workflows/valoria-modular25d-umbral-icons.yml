name: Valoria Umbral II — original resource and navigation icon atlas
on:
  push:
    branches: [experiment/valoria-modular25d-ui-umbral-20261120]
    paths: ['tools/valoria-modular25d/umbral-icons-request.json']
permissions:
  contents: write
concurrency:
  group: valoria-umbral2-six-original-gameplay-icons
  cancel-in-progress: false
jobs:
  original-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/
            /docs/valoria-modular-25d/
            /tools/valoria-modular25d/
      - name: Check source authority in same exclusive rev7 branch
        env:
          GH_TOKEN: ${{github.token}}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,base64,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert os.environ['GITHUB_REF_NAME']=='experiment/valoria-modular25d-ui-umbral-20261120'
          def gh(endpoint):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=35) as f:return json.load(f)
          m=gh('contents/pipeline/active-workstreams.json?ref=main')
          blob=gh('git/blobs/'+m['sha'])
          assert blob['sha']==m['sha'] and blob['encoding']=='base64'
          state=json.loads(base64.b64decode(blob['content']))
          owned=[z for z in state['active'] if z.get('id')=='eldoria-valoria-modular25d-bastion1-20261119']
          assert len(owned)==1
          a=owned[0]
          assert a.get('owner')=='chatgpt-valoria-umbral-commercial-ui-and-continuation-20261120'
          assert a.get('ownership_revision')==7 and a.get('ownership_state')=='claimed'
          assert a.get('branch')==os.environ['GITHUB_REF_NAME']
          print('EXCLUSIVE_UMBRAL2_GAMEPLAY_ART_OWNER_REV7_PASS')
          PY
      - name: Convert source palette to exact pixel-matched RGBA binary texture
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow==11.3.0
          python3 -m py_compile tools/valoria-modular25d/build_umbral_icon_atlas.py
          python3 tools/valoria-modular25d/build_umbral_icon_atlas.py
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          proof=json.loads(Path('docs/valoria-modular-25d/UMBRAL_II_GAMEPLAY_ICONS_SOURCE.json').read_text())
          p=Path(proof['packed_file'])
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==proof['packed_rgba_sha256']
          with Image.open(p) as image:
              image.load()
              assert list(image.size)==[144,96] and image.mode=='RGBA'
          meta=p.with_suffix(p.suffix+'.meta').read_text()
          assert 'guid: '+proof['textasset_guid'] in meta
          assert proof['cells_row_major_top_down']==['wood','stone','food','hammer','city','task']
          print('ORIGINAL_ICON_ATLAS_SHA256_AND_LAYOUT_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: umbral2-original-gameplay-icons-${{github.run_id}}
          path: |
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/UmbralII/umbral_gameplay_icons_png.bytes
            docs/valoria-modular-25d/UMBRAL_II_GAMEPLAY_ICONS_SOURCE.json
          retention-days: 14
      - name: Push only source verified binary TextAsset and proof
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=experiment/valoria-modular25d-ui-umbral-20261120
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo SOURCE_HEAD_CHANGED_NO_PUSH; exit 1; }
          git config user.name 'Eldoria original gameplay UI art'
          git config user.email 'eldoria-ui-icons@users.noreply.github.com'
          git add -- \
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/UmbralII/umbral_gameplay_icons_png.bytes \
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/UmbralII/umbral_gameplay_icons_png.bytes.meta \
            docs/valoria-modular-25d/UMBRAL_II_GAMEPLAY_ICONS_SOURCE.json
          git diff --cached --check
          git diff --cached --quiet && { echo ICONS_ALREADY_RECORDED; exit 0; }
          git commit -m 'art(umbral2): six original resource and action icon atlas with source proof'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo ICON_ATLAS_SOURCE_COMMITTED
