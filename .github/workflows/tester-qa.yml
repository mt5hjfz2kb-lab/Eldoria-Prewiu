name: Validate Closed Tester Build

on:
  push:
    branches: [work/testers-v0265]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: eldoria-closed-tester-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changed.outputs.required }}
    steps:
      - name: Decide whether frozen web inputs changed (fail open to full QA)
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            // Keep the workflow/check present for required-check compatibility.
            // Unknown paths or an incomplete comparison always run the full suite.
            function needsWebQA(file) {
              const relevant = p => {
                if (p === '.github/workflows/tester-qa.yml') return true;
                if (/^(Unity|ArtSource|docs|pipeline|references)\//.test(p)) return false;
                if (/^\.github\/workflows\//.test(p)) return false;
                if (['AGENTS.md', 'SESSION_HANDOFF.md', 'PROJECT_STATE.md',
                     'tools/ELDORIA_AGENT_SESSION_BOOTSTRAP.md'].includes(p)) return false;
                // Exact allowlist: observability/documentation validators cannot change frozen web gameplay.
                // The unknown-path fallback and this workflow's self-change still require full QA.
                if (['tools/work-status/report.mjs', 'tools/work-status/report.test.mjs',
                     'tools/check-documentation-governance.mjs',
                     'tools/check-documentation-governance.test.mjs'].includes(p)) return false;
                return true;
              };
              return relevant(file.filename) ||
                Boolean(file.previous_filename && relevant(file.previous_filename));
            }
            let required = true;
            if (context.eventName === 'pull_request') {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo, pull_number: context.issue.number, per_page: 100
                });
                const pr = await github.rest.pulls.get({
                  ...context.repo, pull_number: context.issue.number
                });
                const sameHead = pr.data.head.sha === context.payload.pull_request.head.sha;
                required = !sameHead || files.length >= 3000 ||
                  files.length !== pr.data.changed_files || files.some(needsWebQA);
              } catch (error) {
                core.warning('Changed-file lookup failed; running all web checks.');
              }
            }
            core.setOutput('required', String(required));
            core.info(required ? 'Full frozen-web QA required.' :
              'Unity/art/documentation/read-only operations changes: frozen-web QA is not applicable.');
  tester-qa:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep all web sources, tests, tools and fixtures. Native Unity and
          # archived native/art evidence are not inputs to this frozen-web job.
          # A full checkout consumed 16 minutes of its 32-minute budget.
          sparse-checkout: |
            /*
            !/Unity/
            !/docs/evidence/
          sparse-checkout-cone-mode: false
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax contracts
        run: |
          node --check tester-v0265/tester-layer.js
          node --check tester-v0265/tester-config.js
      - name: Serve frozen tester snapshot
        run: python3 -m http.server 4173 >/tmp/eldoria-http.log 2>&1 &
      - name: Closed tester layer E2E
        run: node qa/e2e-tester-build.js
      - name: Alias current v0.32 game for legacy QA paths
        run: |
          rm -rf playtest
          cp -R v0220 playtest
          # The frozen build intentionally has no QA-only fixture boot. The disposable
          # test alias must restore named preset scenarios BEFORE its main game scripts.
          python3 - <<'PY'
          from pathlib import Path
          page=Path('playtest/index.html')
          data=page.read_text('utf8')
          assert '<head>' in data
          boot='<head><script src="js/qa-fixtures.js"></script><script src="../qa/closed-tester-preset-boot.js"></script>'
          page.write_text(data.replace('<head>',boot,1),'utf8')
          PY
      - name: Fast coherent-state behavior preflight before the expensive full suite
        run: timeout 60s node qa/e2e-behavior-regression.js
      - name: Fast Codex and Relicario game-state preflight
        run: timeout 35s node qa/e2e-codex-chest.js
      - name: Current v0.32 targeted regression
        run: timeout 300s npm run qa:targeted
      - name: Current v0.32 full regression
        run: timeout 480s npm run qa:regression
      - name: Current v0.32 uninterrupted fresh-save Arc I
        run: timeout 900s npm run qa:arc1
