name: "[PRODUCTION] Valoria Coherent Family v1"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/valoria-production-art-coherent-family-v1-request.json']
permissions: { contents: write }
concurrency:
  group: valoria-production-art-coherent-family-v1
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Build coherent family
        run: |
          blender -b --python tools/valoria-production-art-starter/build_coherent_family_v1.py
          test -s art-source/valoria/production/coherent-family-v1/Valoria_CoherentFamily_v1.blend
          for f in Valoria_MainGate_CohV1 Valoria_WallSegment_CohV1 Valoria_Tower_CohV1 Valoria_CivicHouse_CohV1 Valoria_Workshop_CohV1; do
            test -s "Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/$f.glb"
            test -s "pipeline/evidence/valoria-production-art-coherent-family-v1/$f.png"
          done
      - name: Persist coherent family
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add art-source/valoria/production/coherent-family-v1 Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist coherent Valoria family C5"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-production-art-coherent-family-v1
          path: |
            art-source/valoria/production/coherent-family-v1/**
            Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/*.glb
            pipeline/evidence/valoria-production-art-coherent-family-v1/*.png
          if-no-files-found: error
          retention-days: 30
