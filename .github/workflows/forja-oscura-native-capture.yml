name: Forja Oscura Unity native A-B evidence
on:
  push:
    branches: [feature/forja-oscura-native-proof-20261107]
    paths: [tools/forja-oscura/native-request.txt]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-forja-native-evidence
  # Only a deliberately marked recovery push can stop a stuck earlier
  # Forja-only checkout; never cancels another PR or normal native evidence.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, '[forja-recover-stuck]') }}
jobs:
  owner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.lease.outputs.authorized }}
      revision: ${{ steps.lease.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/forja-oscura
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: canonical-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify isolated art ZIP
        run: python3 tools/forja-oscura/reconstruct.py
      - name: Refuse shared Windows without an exclusive live claim
        id: lease
        run: |
          node <<'JS'
          const fs=require('fs');
          const reg=JSON.parse(fs.readFileSync('canonical-main/pipeline/active-workstreams.json'));
          const id='eldoria-forja-oscura-visual-proof-20261107';
          const own='codex-forja-498cad9fd409';
          const branch='feature/forja-oscura-native-proof-20261107';
          const owners=reg.active.filter(x=>x.resources?.includes('windows-runner-heavy')&&x.ownership_state==='claimed');
          const w=reg.active.find(x=>x.id===id);
          const valid=w&&owners.length===1&&owners[0].id===id&&w.owner===own&&
            w.branch===branch&&w.status==='active'&&w.ownership_state==='claimed';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'authorized='+(valid?'true':'false')+'\nrevision='+(valid?w.ownership_revision:0)+'\n');
          console.log(valid?'FORJA_EXCLUSIVE_CLAIM_PASS':
            'FORJA_OWNER_NOT_RELEASED_OR_NOT_CLAIMED: skipping Windows. Never invade another PR.');
          JS
  native:
    needs: owner-preflight
    if: needs.owner-preflight.outputs.authorized == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 150
    steps:
      - name: Recover already installed GitHub Desktop Git before ANY Windows checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources/app/git/cmd/git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $g){throw 'Installed Git is not discoverable in GitHub Desktop'}
            $folder=Split-Path $g
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
          Write-Host "FORJA_GIT_INSTALLED_PATH_PASS $(& git --version)"
      # This artifact was produced by a successful Ubuntu source/metadata
      # gate at 64b7933; PR173 changes no Unity files outside VisualKit.
      # Downloading 6.5MB avoids fetching the 15GB repo a second time.
      - name: Restore exact 41 PNG and owned VisualKit code from CI artifact
        uses: actions/download-artifact@v4
        with:
          name: forja-production-sprites-64b7933eda02fe41b4936a4fe23df08b08784541
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          run-id: 42382183072
          github-token: ${{ github.token }}
          path: forja-kit-source
      # Both earlier native runs failed before Unity: Git was not available
      # on the Windows PATH. The first checkout used a 27GB REST archive;
      # the next one removed the reusable folder and left no .git checkout.
      # Use isolated, verified MinGit; never modify the runner global config.
      - name: Inventory only the owned Windows runner workspaces and Git HEADs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $rows=@()
          foreach($candidate in @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Directory -Force)){
            $path=$candidate.FullName
            $v=Test-Path (Join-Path $path 'Unity/ProjectSettings/ProjectVersion.txt')
            $g=Test-Path (Join-Path $path '.git')
            $sha='no-git'
            if($g){
              try { $sha=((& git -C $path rev-parse HEAD 2>$null).Trim()) }
              catch { $sha='unreadable' }
            }
            $rows+=@{directory=$candidate.Name;unityProject=$v;git=$g;sha=$sha}
            Write-Host "FORJA_CACHE_DIR name=$($candidate.Name) unity=$v git=$g head=$sha"
          }
          $out=Join-Path $env:GITHUB_WORKSPACE 'forja-cache-inventory.json'
          $rows | ConvertTo-Json -Depth 3 | Set-Content -Path $out -Encoding UTF8
          # Git probes for historical caches can leave LASTEXITCODE=1 even
          # when caught. This inventory is non-authoritative; the real
          # source-integrity checks run separately before opening Unity.
          $global:LASTEXITCODE=0
      - name: Preserve cache inventory before attempting another Git checkout
        uses: actions/upload-artifact@v4
        with:
          name: forja-cache-inventory-${{ github.run_id }}
          path: forja-cache-inventory.json
          retention-days: 7
      # actions/checkout 'filter' OVERRIDES sparse-checkout: the previous
      # workflow inadvertently requested all ~10GB of historical Unity art.
      # Use Git partial fetch + explicit non-cone sparse patterns. The only
      # excluded directories are retained, old historical render revisions.
      # This is NOT a second Unity project; the exact PR commit is fetched.
      - name: Fetch exact PR Unity source without historical candidate art
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:GITHUB_WORKSPACE 'forja-thin-native-source-42408083695'
          # Reuse only our completed disposable project, retaining imported Library.
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Editor occupied before owned-cache reuse'}
          if(-not(Test-Path (Join-Path $base '.git'))){throw 'Verified owned Forja cache missing'}
          $oldHead=((& git -C $base rev-parse HEAD).Trim())
          if($oldHead -ne '308d5b198bf075d7985ad57c4612d28587094dea'){throw 'Owned source changed; inspect before reusing'}
          $remote=((& git -C $base remote get-url origin).Trim())
          if($remote -ne 'https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git'){throw 'Unexpected cache origin'}
          & git -C $base diff --binary | Set-Content (Join-Path $env:RUNNER_TEMP 'forja-prior-import-changes.patch')
          foreach($rel in @('Unity/ForjaNativeEvidence','docs/evidence/valoria-reference-clean')){
            $old=Join-Path $base $rel
            if(Test-Path $old){Move-Item $old ($old+'-before-'+$env:GITHUB_RUN_ID)}
          }
          & git -C $base config core.sparseCheckout true
          & git -C $base config core.sparseCheckoutCone false
          $patterns=@('/Unity/**','/tools/forja-oscura/**')
          # GeneratedEntryV1–17 are historical 300MB+ art candidates.
          for($i=1;$i -le 17;$i++){
            $patterns+= ('!/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV'+$i+'/**')
          }
          # Retain the latest authored integration asset revision 39138751241.
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39131782550/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39132144937/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39132392803/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39132807199/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39133202399/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39136444844/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39137079921/**'
          $patterns+= '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-39138143327/**'
          $info=Join-Path $base '.git/info/sparse-checkout'
          [IO.File]::WriteAllLines($info,[string[]]$patterns,
             (New-Object System.Text.UTF8Encoding($false)))
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GH_TOKEN))
          & git -C $base -c ("http.extraheader=AUTHORIZATION: basic "+$auth) fetch --no-tags --depth=1 --filter=blob:none origin $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Git partial fetch failed before Unity; no game modified'}
          & git -C $base -c ("http.extraheader=AUTHORIZATION: basic "+$auth) checkout --force FETCH_HEAD
          if($LASTEXITCODE){throw 'Scoped partial checkout failed before Unity'}
          $head=((& git -C $base rev-parse HEAD).Trim())
          if($head -ne $env:GITHUB_SHA){throw "Thin source drift: $head expected=$env:GITHUB_SHA"}
          $ver=Join-Path $base 'Unity/ProjectSettings/ProjectVersion.txt'
          $scene=Join-Path $base 'Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity'
          if(-not(Test-Path $ver) -or -not(Test-Path $scene)){throw 'Canonical Unity version or city scene missing from thin checkout'}
          Add-Content -Path $env:GITHUB_ENV -Value ("FORJA_THIN_SOURCE="+$base)
          Write-Host "FORJA_THIN_EXACT_COMMIT_SOURCE_READY $head (historical generated copies excluded; no production asset edited)"
          $global:LASTEXITCODE=0

      - name: Confirm checkout is precisely the Forja workflow commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:FORJA_THIN_SOURCE
          $head=((& git -C $base rev-parse HEAD).Trim())
          if($head -ne $env:GITHUB_SHA){throw "Forja source SHA mismatch: $head expected=$env:GITHUB_SHA"}
          if(-not(Test-Path (Join-Path $base 'Unity/ProjectSettings/ProjectVersion.txt'))){throw 'Real Unity project not present'}
          if(-not(Test-Path (Join-Path $base 'Unity/Assets/Eldoria/VisualKit/Editor/ForjaOscuraNativeEvidence.cs'))){throw 'Forja native entry missing'}
          if(-not(Test-Path (Join-Path $env:GITHUB_WORKSPACE 'forja-kit-source/Unity/Assets/Eldoria/VisualKit/Editor/ForjaOscuraNativeEvidence.cs'))){throw 'Verified art artifact missing'}
          Write-Host "FORJA_EXACT_COMMIT_CHECKOUT_PASS head=$head"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck live ownership AND process exclusivity before Unity starts
        shell: powershell
        env:
          LEASE_REVISION: ${{ needs.owner-preflight.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $url='https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/contents/pipeline/active-workstreams.json?ref=main'
          $hdr=@{'Accept'='application/vnd.github+json';'User-Agent'='Eldoria-Forja-Native';'Authorization'="Bearer $env:GH_TOKEN"}
          $raw=Invoke-RestMethod -Uri $url -Headers $hdr
          if(-not $raw.content){throw 'Cannot read live canonical registry from main'}
          $json=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($raw.content -replace '\s','')))
          $r=$json | ConvertFrom-Json
          $o=@($r.active | Where-Object { $_.resources -contains 'windows-runner-heavy' -and $_.ownership_state -eq 'claimed' })
          if($o.Count -ne 1 -or $o[0].id -ne 'eldoria-forja-oscura-visual-proof-20261107' -or
             $o[0].owner -ne 'codex-forja-498cad9fd409' -or
             [string]$o[0].ownership_revision -ne $env:LEASE_REVISION){throw 'Forja exclusive lease changed'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Shared native editor occupied'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity Editor not installed'}
          $v=& $env:UNITY_EDITOR_PATH -version
          if($v -notmatch '6000\.3\.23f1'){throw "Unity version mismatch: $v"}
      - name: Reassemble exact 42 visual resources and 7 C-sharp inputs
        shell: powershell
        run: |
          python (Join-Path $env:FORJA_THIN_SOURCE 'tools/forja-oscura/reconstruct.py')
          if($LASTEXITCODE){throw 'Forja original archived sources are corrupt'}
          python (Join-Path $env:FORJA_THIN_SOURCE 'tools/forja-oscura/verify-production.py')
          if($LASTEXITCODE){throw 'First-party Unity visual assets invalid'}
          if(Test-Path (Join-Path $env:FORJA_THIN_SOURCE 'Unity/Assets/EldoriaVisualKit')){throw 'Legacy duplicate kit path detected'}
          if(-not(Test-Path (Join-Path $env:FORJA_THIN_SOURCE 'Unity/Assets/Eldoria/VisualKit/Editor/ForjaOscuraNativeEvidence.cs'))){throw 'Native A-B entry missing'}
      - name: Capture genuine Unity player HUD before and after
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proj=Join-Path $env:FORJA_THIN_SOURCE 'Unity'
          $log=Join-Path $env:RUNNER_TEMP 'forja-native.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',('"'+$proj+'"'),
                  '-executeMethod','Eldoria.VisualKit.Editor.ForjaOscuraNativeEvidence.CaptureBatch',
                  '-logFile',('"'+$log+'"'))
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $end=(Get-Date).AddMinutes(42)
          while(-not $p.HasExited -and (Get-Date) -lt $end){ Start-Sleep 4; $p.Refresh() }
          if(-not $p.HasExited){ Stop-Process -Id $p.Id -Force; throw 'Own Forja Unity process timed out' }
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 120};throw "Unity failed exit $($p.ExitCode)"}
          $dir=Join-Path $proj 'ForjaNativeEvidence'
          $report=Join-Path $dir 'ForjaNativeEvidence.json'
          if(-not(Test-Path $report)){throw 'Native A-B report missing'}
          $j=Get-Content $report -Raw | ConvertFrom-Json
          if($j.screenshotCount -ne 8 -or $j.orientationsWithDifference -ne 4 -or
             $j.status -ne 'UNITY_NATIVE_CAPTURED_VISUAL_REVIEW_PENDING'){throw 'Native A-B proof incomplete'}
          Get-ChildItem $dir -Filter *.png | ForEach-Object { if($_.Length -lt 4096){throw "PNG too small: $($_.Name)"} }
          Write-Host 'FORJA_REAL_UNITY_8_PNG_CAPTURE_PASS; ART_APPROVED still false'
      - name: Build offline A-B viewer only from verified native screenshots
        shell: powershell
        run: |
          python (Join-Path $env:FORJA_THIN_SOURCE 'tools/forja-oscura/build-review.py') (Join-Path $env:FORJA_THIN_SOURCE 'Unity/ForjaNativeEvidence')
          if($LASTEXITCODE){throw 'Native review page could not verify eight captured Unity PNG files'}
      - name: Preserve native log and eight images for independent visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-oscura-native-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.FORJA_THIN_SOURCE }}/Unity/ForjaNativeEvidence/
            ${{ env.FORJA_THIN_SOURCE }}/docs/evidence/valoria-reference-clean/native-*.png
            ${{ runner.temp }}/forja-native.log
            ${{ runner.temp }}/forja-prior-import-changes.patch
          if-no-files-found: warn
          retention-days: 21
