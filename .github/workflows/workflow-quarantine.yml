name: Workflow quarantine guard

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/workflow-quarantine-v1.json'
      - 'tools/check-workflow-quarantine.mjs'
      - '.github/workflows/**'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
    paths:
      - 'pipeline/workflow-quarantine-v1.json'
      - 'tools/check-workflow-quarantine.mjs'
      - '.github/workflows/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Protect canonical brain and quarantine noncanonical R&D
        run: node tools/check-workflow-quarantine.mjs
