name: "[ART ROCK FLOOR6] Two real scanned small boulder GLBs locked camera A/B"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-two-rock-scans-blender.yml'
      - 'tools/valoria-modular-fortress/two_photogrammetry_rock_ab.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-two-scanned-rocks-Blender
  cancel-in-progress: false
jobs:
  import-two-genuine-stone-scans:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Use existing native Git Blender
        shell: powershell
        id: bins
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git missing'}
            $d=Split-Path $g;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Installed Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/old-rock-modules-v3
      - uses: actions/download-artifact@v4
        with:
          name: valoria-two-real-stone-photogrammetry-38873735693
          run-id: 38873735693
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/rock-scans-true-cc0
      - name: Native Blender import actual CC0 rock meshes and compare two distinct single assets
        shell: powershell
        run: |
          $old=Join-Path $env:RUNNER_TEMP 'old-rock-modules-v3\eldoria-upgrade63\glb'
          $cc0=Join-Path $env:RUNNER_TEMP 'rock-scans-true-cc0'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-two-scanned-rocks'
          foreach($f in @((Join-Path $old 'cliff_stone_chip.glb'),(Join-Path $cc0 'rock_07\rock_07_1k.gltf'),(Join-Path $cc0 'boulder_01\boulder_01_1k.gltf'))){
            if(-not(Test-Path $f)){throw "Immutable source missing $f"}
          }
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/two_photogrammetry_rock_ab.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'No pinned script'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-two-real-scanned-rocks.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'real-rocks.log'
          $err=Join-Path $env:RUNNER_TEMP 'real-rocks.err'
          $proc=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$old,$cc0,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 125 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 55 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Original-to-true-photogrammetry Blender import failed $($proc.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            if((Get-ChildItem (Join-Path $out $folder) -File).Count -ne 2){throw "Missing 2 $folder outputs"}
          }
      - name: Retain genuine licensed CC0 GLBs, A/B, hashes, and current approval status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-two-true-rock-upgrades-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-two-scanned-rocks/**
            ${{ runner.temp }}/real-rocks.log
            ${{ runner.temp }}/real-rocks.err
          if-no-files-found: warn
          retention-days: 30
