name: Forja Oscura first-party kit CI
on:
  push:
    branches: [feature/forja-oscura-native-proof-20261107]
    paths:
      - "tools/forja-oscura/**"
      - "Unity/Assets/Eldoria/VisualKit/**"
      - ".github/workflows/forja-oscura-asset-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/forja-oscura/**"
      - "Unity/Assets/Eldoria/VisualKit/**"
      - ".github/workflows/forja-oscura-asset-integrity.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forja-kit-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-art-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/forja-oscura
            Unity/Assets/Eldoria/VisualKit
          persist-credentials: false
      - name: Preserve original kit integrity
        run: python3 tools/forja-oscura/reconstruct.py
      - name: Inspect first-party PNGs, real C-sharp sources, asmdefs, and unique Unity GUIDs
        run: python3 tools/forja-oscura/verify-production.py
      - name: Confirm exact original kit without adding a duplicate Unity root
        run: |
          test -f Unity/Assets/Eldoria/VisualKit/Runtime/ForjaOscuraLiveHudSkin.cs
          test -f Unity/Assets/Eldoria/VisualKit/Resources/ForjaOscura/Icons/nav_reino.png
          test ! -e Unity/Assets/EldoriaVisualKit
          echo 'FORJA_KIT_INTEGRITY_PASS; not a Unity runtime or artistic approval.'
  check-csharp-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/forja-oscura
            Unity/Assets/Eldoria/VisualKit
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Parse five actual Unity C-sharp sources with Roslyn
        run: dotnet run --project tools/forja-oscura/SyntaxAudit.csproj -c Release -- Unity/Assets/Eldoria/VisualKit
      - name: Report exact verification limits
        run: echo 'FORJA_CSHARP_SYNTAX_PASS; Unity API compile, native A-B captures and visual acceptance still untested.'

  api-contract-proof:
    needs: verify-art-source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/forja-oscura
            Unity/Assets/Eldoria/VisualKit
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/Components/RoyalHUD.cs
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/Components/BottomNavigation.cs
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV2/Runtime/RoyalGoldV2Hud.cs
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV2/Runtime/RoyalGoldV3ContextHud.cs
            Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/ValoriaIntegratedWorld.cs
            Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Editor/ValoriaIntegrationBuild.cs
            Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/ValoriaReferenceCleanGameplay.cs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Compare skin API assumptions to actual RoyalHUD and Unity native capture
        run: python3 tools/forja-oscura/check-upstream-api.py
      - name: Distinguish source compatibility from real Unity native proof
        run: echo "FORJA_SOURCE_API_PASS; does NOT imply Unity compile, screenshot, input or ART approval."

  compile-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/forja-oscura
            Unity/Assets/Eldoria/VisualKit
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: C-sharp semantic compile against a bounded UI API stub
        run: dotnet build tools/forja-oscura/CompileContract.csproj --configuration Release --nologo
      - name: Do not confuse stub types with Unity Editor binaries
        run: echo 'FORJA_CSHARP_STUB_TYPECHECK_PASS. NOT Unity compile, real interaction or native screenshot.'

  review-html-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/forja-oscura
          persist-credentials: false
      - name: Verify offline native-review HTML generator with TEMPORARY FAKE fixtures
        run: python3 tools/forja-oscura/build-review.py --selftest
      - name: Do not publish temporary fixture as native proof
        run: echo 'FORJA_REVIEW_VIEWER_TEST_PASS; native screenshot remains pending.'

  hosted-unity-license-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Detect whether a ZERO-EXTRA-COST hosted Unity test is already activated
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          if [[ -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" && ( -n "$UNITY_LICENSE" || -n "$UNITY_SERIAL" ) ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'FORJA_HOSTED_EDITOR_ACTIVATION_AVAILABLE; credentials are NOT printed.'
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'FORJA_HOSTED_EDITOR_NOT_ACTIVATED: no compatible Unity license credentials configured.'
          fi

  hosted-unity-compile:
    needs: hosted-unity-license-preflight
    if: needs.hosted-unity-license-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Unity/Packages/**
            Unity/ProjectSettings/**
            Unity/Assets/**/*.cs
            Unity/Assets/**/*.cs.meta
            Unity/Assets/**/*.asmdef
            Unity/Assets/**/*.asmdef.meta
            Unity/Assets/Eldoria/VisualKit/Resources/ForjaOscura/**
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check Unity project version and isolated visual kit
        shell: bash
        run: |
          test -f Unity/ProjectSettings/ProjectVersion.txt
          grep -q '6000.3.23f1' Unity/ProjectSettings/ProjectVersion.txt
          test -f Unity/Assets/Eldoria/VisualKit/Runtime/ForjaOscuraLiveHudSkin.cs
          echo 'FORJA_HOSTED_EDITOR_SOURCE_READY'
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: Unity
          unityVersion: 6000.3.23f1
          testMode: editmode
          artifactsPath: forja-editor-test-results
      - name: Preserve real hosted Editor results if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forja-linux-editor-compilation-${{ github.sha }}-${{ github.run_id }}
          path: forja-editor-test-results
          if-no-files-found: warn
          retention-days: 14

  all-editor-sources-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/forja-oscura
            Unity/Assets/Eldoria/VisualKit
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Type-check all five actual Forja C-sharp sources against strict bounded Editor stubs
        run: dotnet build tools/forja-oscura/EditorContract.csproj --configuration Release --nologo
      - name: Semantic compilation against STUBS only, NOT Unity certification
        run: echo 'FORJA_FIVE_SOURCE_TYPECHECK_PASS; Unity Editor and actual rendering remain untested.'

  premium-art-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/forja-oscura
          persist-credentials: false
      - name: Generate nine independent RGBA 9-slice textures from reproducible artwork code
        run: node tools/forja-oscura/build-premium-sprites.js "$RUNNER_TEMP/forja-premium-art"
      - name: Confirm exact bit depth, alpha and PNG completeness
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])/"forja-premium-art"
          m=json.loads((folder/"manifest.json").read_text())
          assert m["status"]=="ART_CANDIDATE_NON_NATIVE" and len(m["pieces"])==9
          for piece in m["pieces"]:
            png=(folder/piece["filename"]).read_bytes()
            assert png[:8]==bytes([137,80,78,71,13,10,26,10])
            assert png[24]==8 and png[25]==6, (piece["filename"],"not RGBA")
          print("FORJA_PREMIUM_RGBA_PREVIEW_PASS (NOT Unity or ART_APPROVED)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: forja-premium-nine-slice-review-${{ github.sha }}
          path: ${{ runner.temp }}/forja-premium-art/
          retention-days: 21
