name: "[ART PINE FLOOR6] Full same-family canopy medium Quaternius tree"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-pine-medium-from-tall.yml'
      - 'tools/valoria-modular-fortress/same_family_medium_dense_pine.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-pine-medium-real-full-cc0
  cancel-in-progress: false
jobs:
  medium-pine-donor-reference:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    steps:
      - name: Installed Git and Blender
        id: bins
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-three-dense-conifers-38823354618
          run-id: 38823354618
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/true_same_family_trees
      - name: Actual native Blender copy of fuller pine trunk and needle branches
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'true_same_family_trees\eldoria-real-dense-pines\glb'
          $dst=Join-Path $env:RUNNER_TEMP 'eldoria-one-full-medium-pine'
          if(-not(Test-Path (Join-Path $src 'pine_tall.glb'))){throw 'Tall CC0 donor model absent'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/same_family_medium_dense_pine.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Version-pinned tree code missing'}
          $script=Join-Path $env:RUNNER_TEMP 'eldoria-fuller-medium-pine.py'
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-fuller-medium-pine.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-fuller-medium-pine.err'
          $p=Start-Process -FilePath "${{ steps.bins.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$src,$dst) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 45 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Medium real-pine transplant failed: $($p.ExitCode)"}
          foreach($file in @('glb\pine_medium.glb','before\pine_medium.png','after\pine_medium.png','reports\medium_with_full_tall_branches.json')){
            if(-not(Test-Path (Join-Path $dst $file))){throw "Missing $file"}
          }
      - name: Preserve single tree GLB and matched screenshots; no instant approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-one-full-medium-pine-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-one-full-medium-pine/**
            ${{ runner.temp }}/eldoria-fuller-medium-pine.log
            ${{ runner.temp }}/eldoria-fuller-medium-pine.err
          if-no-files-found: warn
          retention-days: 30
