name: Eldoria identical-host Apple GPU control versus reused routes and controlled heap experiment
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-entry-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  same-host-memory:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 42493894120
          name: mobile6-candidate-site
          github-token: ${{ github.token }}
          path: qa-sites/control
      - uses: actions/download-artifact@v4
        with:
          run-id: 42519214500
          name: mobile9-candidate-site
          github-token: ${{ github.token }}
          path: qa-sites/candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run both builds through the same host and transport
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_SKIP_PREFLIGHT: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/same-host-qa" --no-save playwright@1.55.0
          "$RUNNER_TEMP/same-host-qa/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/same-host-qa/node_modules"
          node tools/eldoria-private-beta/qa_static_server.cjs qa-sites 18765 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          failed=0
          QA_URL='http://127.0.0.1:18765/candidate/?eldoria_diag=1&eldoria_profile=1' QA_REVISION=native325-mobile9-routes QA_OUT=evidence/candidate node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
          QA_URL='http://127.0.0.1:18765/candidate/?eldoria_diag=1&eldoria_profile=1' QA_REVISION=native325-mobile9-routes QA_VARIANT=preallocated-640 QA_OUT=evidence/heap640 node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
          QA_URL='http://127.0.0.1:18765/control/?eldoria_diag=1&eldoria_profile=1' QA_REVISION=native325-mobile6-cubemap QA_OUT=evidence/control node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile9-reversed-order-heap640-not-physical-iphone
          path: |
            evidence/
            server.log
          retention-days: 14
