name: Eldoria mobile5 Apple engine diagnosis
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-entry-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-beta-entry-qa
  cancel-in-progress: false
jobs:
  apple-engine:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: webkit
            variant: s3tc-disabled
            version: 1.55.0
          - engine: webkit
            variant: unchanged
            version: 1.65.0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/beta-browser-deps" --no-save playwright@${{ matrix.version }}
          "$RUNNER_TEMP/beta-browser-deps/node_modules/.bin/playwright" install ${{ matrix.engine }}
      - name: Measure unchanged published candidate
        env:
          QA_ENGINE: ${{ matrix.engine }}
          QA_VARIANT: ${{ matrix.variant }}
          QA_OUT: engine-evidence
          QA_SKIP_PREFLIGHT: '1'
        run: |
          export NODE_PATH="$RUNNER_TEMP/beta-browser-deps/node_modules"
          node tools/eldoria-private-beta/qa_webkit_residency.cjs
      - name: Preserve Apple GPU crash evidence
        if: always()
        run: |
          mkdir -p engine-evidence/os
          sleep 10
          /usr/bin/log show --last 10m --style compact --predicate '(process CONTAINS "WebKit" OR process CONTAINS "MiniBrowser" OR eventMessage CONTAINS "GPUProcess" OR eventMessage CONTAINS "invalid message" OR eventMessage CONTAINS "memorystatus")' > engine-evidence/os/webkit-system.log 2>&1 || true
          python3 - <<'PY'
          import pathlib, shutil
          out=pathlib.Path('engine-evidence/os')
          for root in [pathlib.Path.home()/'Library/Logs/DiagnosticReports',pathlib.Path('/Library/Logs/DiagnosticReports')]:
              if root.exists():
                  for f in root.glob('*'):
                      if f.is_file() and any(x in f.name for x in ['WebKit','MiniBrowser','GPU']):
                          shutil.copy2(f,out/f.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile5-macos-${{ matrix.engine }}-${{ matrix.variant }}-${{ matrix.version }}
          path: engine-evidence/
          retention-days: 14
