name: Eldoria compact terrain index parity and allocations
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-entry-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            Unity/Assets/Eldoria/World4XCanon
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const a=(await github.rest.actions.getArtifact({...context.repo,artifact_id:13623230011})).data;
            if(a.digest!=='sha256:417f15c01f3c65f81a61e7fd88b3bd52a91b7c07eba5bed37b7b9192294047ee'||a.workflow_run.id!==42493894120)throw Error('Parent artifact changed');
      - uses: actions/download-artifact@v4
        with:
          run-id: 42493894120
          name: mobile6-candidate-site
          github-token: ${{ github.token }}
          path: parent-site
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Extract real terrain and exact production algorithm
        run: |
          python -m pip install UnityPy==1.25.4 lz4==4.4.5
          python tools/eldoria-private-beta/native/compact-index/prepare.py parent-site
      - name: Verify every vertex and adversarial cases; measure allocations
        working-directory: tools/eldoria-private-beta/native/compact-index
        run: |
          dotnet --version
          dotnet run --configuration Release --project CompactIndexTest.csproj -- queries.gz "$GITHUB_WORKSPACE/Unity/Assets/Eldoria/World4XCanon/RegionOneBlenderLandscape.cs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-terrain-index-evidence
          path: |
            tools/eldoria-private-beta/native/compact-index/compact-index-results.json
            tools/eldoria-private-beta/native/compact-index/provenance.json
          retention-days: 90
