name: Eldoria public saved-game world-entry regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/eldoria-private-beta/qa_world_entry_public.cjs'
      - '.github/workflows/eldoria-beta-entry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-public-world-entry-regression
  cancel-in-progress: false
jobs:
  public-world-entry:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise actual public saved-game world entry and return
        env:
          QA_EXPECT_SOURCE: a2e956e11bc837a081c3eab1eb05c8ff094f4e05
          QA_URL: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_profile=1
          QA_REQUIRE_CONSTRUCTION: '1'
          QA_OUT: public-world-evidence
          QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-world-ocr
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/world-qa-node" --no-save playwright@1.55.0
          "$RUNNER_TEMP/world-qa-node/node_modules/.bin/playwright" install webkit
          swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
          export NODE_PATH="$RUNNER_TEMP/world-qa-node/node_modules"
          node tools/eldoria-private-beta/qa_world_entry_public.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-world-entry-evidence
          path: public-world-evidence
          retention-days: 30
