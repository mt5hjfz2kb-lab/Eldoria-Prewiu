name: Eldoria P0 actual browser world-entry comparison
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-world-p0-browser
  cancel-in-progress: false
jobs:
  public-world-entry:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          tools/eldoria-private-beta
          tools/art-direction/ai-authoring
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        run-id: 43653390105
        name: world-p0-mobile21-owner-site
        github-token: ${{ github.token }}
        path: qa-site/candidate
    - uses: actions/download-artifact@v4
      with:
        run-id: 43653390105
        name: world-p0-reconciled-native-proof
        github-token: ${{ github.token }}
        path: exact-native-proof
    - name: Retain exact reconciled native proof and published-UI provenance
      run: |
        python3 - <<'END'
        import pathlib,shutil,json
        source=pathlib.Path('exact-native-proof');out=pathlib.Path('world-evidence/native-build')
        identity=json.loads(pathlib.Path('qa-site/candidate/release-identity.json').read_text())
        provenance=json.loads((source/'provenance.json').read_text(encoding='utf-8-sig'))
        assert provenance['source']==identity['source_sha']=='d0b21fd5708c5070d1bd62dc6c6a98399c549051'
        assert provenance['workflow']=='cf105a3e407b24c8ffd7cf3a2e7fb3fd1ae834b9'
        shutil.copytree(source,out)
        END
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Compare real earned saved-game world entries in desktop WebKit
      env:
        QA_EXPECT_SOURCE: d0b21fd5708c5070d1bd62dc6c6a98399c549051
        QA_URL: http://127.0.0.1:18765/candidate/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_profile=1
        QA_REQUIRE_CONSTRUCTION: '1'
        QA_OUT: world-evidence/world-entry
        QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-world-ocr
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/world-qa-node" --no-save playwright@1.55.0
        "$RUNNER_TEMP/world-qa-node/node_modules/.bin/playwright" install webkit
        swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
        export NODE_PATH="$RUNNER_TEMP/world-qa-node/node_modules"
        mkdir -p world-evidence
        node tools/eldoria-private-beta/qa_static_server.cjs qa-site 18765 >world-evidence/server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS -o /dev/null http://127.0.0.1:18765/candidate/release-identity.json; then break;fi
          sleep 1
        done
        failed=0
        QA_ENGINE=webkit QA_ENTRY=1 QA_EARLY_ENTRY=1 QA_EARLY_NO_SCREENSHOT=1 QA_RESIZE_STRESS=1 \
         QA_SKIP_PREFLIGHT=1 QA_LAZY_WORLD=1 QA_EXPECT_VIGILIA=1 QA_EXPECT_ORIGIN=http://127.0.0.1:18765 \
         QA_REVISION=integrated-mobile21-owner-qa QA_OUT=world-evidence/candidate \
         node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
        QA_EXPECT_SOURCE=90465a9a910b89a8a8b74e4b33a9bbc88578e00e \
          QA_URL='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_profile=1' \
          QA_OUT=world-evidence/control19 node tools/eldoria-private-beta/qa_world_entry_public.cjs || failed=1
        node tools/eldoria-private-beta/qa_world_entry_public.cjs || failed=1
        python3 - <<'END'
        import json,pathlib,re
        root=pathlib.Path('world-evidence');rows=[]
        for name in ('control19','world-entry'):
         p=root/name/'report.json'
         if not p.exists():continue
         d=json.loads(p.read_text());rss=[];gpu=[]
         for entry in d.get('worldEntries',[]):
          for sample in entry.get('samples',[]):
           web_total=gpu_total=0
           for line in sample.get('processes',[]):
            m=re.match(r'\s*\d+\s+\d+\s+(\d+)\s+(.*)',line)
            if not m:continue
            if 'WebContent' in m.group(2):web_total+=int(m.group(1))
            elif 'GPU' in m.group(2):gpu_total+=int(m.group(1))
           if web_total:rss.append(web_total)
           if gpu_total:gpu.append(gpu_total)
         rows.append(dict(name=name,source=d.get('source'),passed=d.get('passed'),worldEntryAndReentryVerified=d.get('worldEntryAndReentryVerified'),peakSampledWebContentTotalKiB=max(rss) if rss else None,peakSampledGpuTotalKiB=max(gpu) if gpu else None,failure=d.get('failure')))
        (root/'comparison.json').write_text(json.dumps(dict(scope='DESKTOP_WEBKIT_NOT_PHYSICAL_IPHONE',rows=rows),indent=2))
        print(json.dumps(rows))
        END
        if [ "$failed" != 0 ]; then exit 1;fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: world-p0-reconciled-native-proof
        path: exact-native-proof
        retention-days: 30
        run-id: 43653390105
    needs: route
    if: needs.route.outputs.mode == 'comparison'
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: tools/eldoria-private-beta/world-p0-browser-request.txt
        sparse-checkout-cone-mode: false
    - id: mode
      name: Read explicit QA mode
      run: |
        python3 - <<'END'
        import os,pathlib
        lines=pathlib.Path('tools/eldoria-private-beta/world-p0-browser-request.txt').read_text().splitlines()
        modes=[x.split('=',1)[1] for x in lines if x.startswith('mode=')]
        assert len(modes)==1 and modes[0] in ['control','comparison']
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('mode='+modes[0]+'\n')
        END
  published-control:
    needs: route
    if: needs.route.outputs.mode == 'control'
    runs-on: macos-15
    timeout-minutes: 25
    env:
      QA_EXPECT_SOURCE: 90465a9a910b89a8a8b74e4b33a9bbc88578e00e
      QA_URL: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_p0_lazy_world=1&eldoria_diag=1&eldoria_profile=1
      QA_REQUIRE_CONSTRUCTION: '1'
      QA_OUT: control-evidence/control19
      QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-world-ocr
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |-
          tools/eldoria-private-beta
          tools/art-direction/ai-authoring
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify actual unobstructed wheel and saved city return on published control
      run: |
        set -euo pipefail
        npm install --prefix "$RUNNER_TEMP/world-qa-node" --no-save playwright@1.55.0
        "$RUNNER_TEMP/world-qa-node/node_modules/.bin/playwright" install webkit
        swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
        export NODE_PATH="$RUNNER_TEMP/world-qa-node/node_modules"
        node tools/eldoria-private-beta/qa_world_entry_public.cjs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: world-p0-published-control-proof
        path: control-evidence
        retention-days: 30
'on':
  push:
    branches:
    - fix/eldoria-world-first-entry-p0-20261114
    paths:
    - tools/eldoria-private-beta/world-p0-browser-request.txt
