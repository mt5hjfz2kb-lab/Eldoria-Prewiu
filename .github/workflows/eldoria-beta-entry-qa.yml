name: Eldoria beta real entry and reload QA
# Device scale 3; production wrapper caps Unity rendering at 1.5; rendered-frame readback and visible restored nickname OCR.
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-entry-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-entry-qa
  cancel-in-progress: true
jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - name: Wait for exact independently validated candidate
        uses: actions/github-script@v7
        with:
          script: |
            for(let n=0;n<120;n++){
              const r=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:42421746562})).data;
              if(r.head_sha!=='a202f0d8516b336d2d027645b777245d8ad4ca00')throw Error('Unexpected source');
              if(r.status==='completed'){
                if(r.conclusion!=='success')throw Error('Candidate baseline QA did not pass');
                return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw Error('Candidate completion timeout');
      - uses: actions/download-artifact@v4
        with:
          run-id: 42421746562
          name: mobile-candidate-site
          github-token: ${{ github.token }}
          path: site/mobile
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
          sudo apt-get install -y tesseract-ocr
          python -m pip install Pillow==13.0.0
      - name: Start exact candidate
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/entry-server.log 2>&1 &
          for n in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/mobile/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Enter nickname using real UI and verify persisted state after sustained play
        timeout-minutes: 10
        run: |
          node --check tools/eldoria-private-beta/qa_entry.cjs
          node tools/eldoria-private-beta/qa_entry.cjs
          python tools/eldoria-private-beta/verify_entry_name.py qa-entry/03-reloaded.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-entry-evidence
          path: qa-entry/
          retention-days: 14
