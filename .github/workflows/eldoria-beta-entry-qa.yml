name: Eldoria beta19 actual post-nickname interaction diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'tools/eldoria-private-beta/qa_postnickname.cjs'
      - '.github/workflows/eldoria-beta-entry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-postnickname-public-diagnostic
  cancel-in-progress: false
jobs:
  public-interaction:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe actual public post-name interactions without changing player or deployment
        env:
          QA_OCR_EXECUTABLE: ${{ runner.temp }}/eldoria-postnick-ocr
        run: |
          npm install --prefix "$RUNNER_TEMP/postnick-node" --no-save playwright@1.55.0
          "$RUNNER_TEMP/postnick-node/node_modules/.bin/playwright" install webkit
          swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$QA_OCR_EXECUTABLE"
          export NODE_PATH="$RUNNER_TEMP/postnick-node/node_modules"
          node --check tools/eldoria-private-beta/qa_postnickname.cjs
          node tools/eldoria-private-beta/qa_postnickname.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta19-postnickname-diagnostic
          path: postnickname-evidence/
          retention-days: 30
