name: "[ART V4] 12 CC0 nature assets individual Blender finishing"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-cc0-individual-v4.yml'
      - 'tools/valoria-modular-fortress/finish_cc0_individual_v4.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-cc0-native-individual-v4
  cancel-in-progress: false
jobs:
  finish-individual:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 95
    steps:
      - name: Expose installed Git and Blender 5.2
        shell: powershell
        id: software
        run: |
          if (-not(Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $git=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git unavailable'}
            $dir=Split-Path $git
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
          $blender=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Installed Blender unavailable'}
          "blender=$blender" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          & $blender --version | Select-Object -First 2
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-cc0-13-independent-ab-38815831008
          run-id: 38815831008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/cc0-ab-pinned-input
      - name: Independently finish 12 donor assets and create 24 Blender PNGs
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'cc0-ab-pinned-input\eldoria-cc0-ab13\glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-individual-cc0-v4'
          $script=Join-Path $env:RUNNER_TEMP 'eldoria-finish-cc0-v4-pinned.py'
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/finish_cc0_individual_v4.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned script absent'}
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          if(-not(Test-Path (Join-Path $src 'pine_small.glb'))){throw "Missing donor source GLB at $src"}
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-cc0-v4.stdout.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-cc0-v4.stderr.log'
          $proc=Start-Process -FilePath "${{ steps.software.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 45 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Asset Blender upgrade exit code $($proc.ExitCode)"}
          $glbs=(Get-ChildItem (Join-Path $out 'glb') -Filter '*.glb').Count
          $before=(Get-ChildItem (Join-Path $out 'before') -Filter '*.png').Count
          $after=(Get-ChildItem (Join-Path $out 'after') -Filter '*.png').Count
          if($glbs -ne 12 -or $before -ne 12 -or $after -ne 12){throw "Expected 12 + 12 + 12, got $glbs + $before + $after"}
          Get-Content (Join-Path $out 'reports\v4_individual_manifest.json') -TotalCount 20
      - name: Archive all individual A/B, sources and exact hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-12-independent-blender-v4-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-individual-cc0-v4/**
            ${{ runner.temp }}/eldoria-cc0-v4.stdout.log
            ${{ runner.temp }}/eldoria-cc0-v4.stderr.log
          retention-days: 30
          if-no-files-found: warn
