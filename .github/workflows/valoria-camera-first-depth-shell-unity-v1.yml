name: "[PROOF] Valoria Camera-First 2.5D Depth Shell Unity v1"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/camera-first-depth-shell-unity-v1-request.json'
  workflow_dispatch:

concurrency:
  group: valoria-camera-first-depth-shell-unity-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: false
          fetch-depth: 2
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Verify depth-shell source
        shell: powershell
        run: |
          $base="art-source\valoria\lookdev\golden-slice-v1\camera-first-depth-shell-v1"
          @('far-environment','cliff-ground-shore','vegetation-mid','gate-back','gate-front','bridge-back','bridge-front','vegetation-foreground') | ForEach-Object {
            $p=Join-Path $base ($_.ToString()+'.png')
            if(-not (Test-Path $p)){throw "Missing $p"}
          }
      - name: Capture 2.5D depth-shell Unity proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaCameraFirstDepthShellGateV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaCameraFirstDepthShellGateV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaCameraFirstDepthShellGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(32)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw '2.5D depth-shell proof timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "2.5D depth-shell proof failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-camera-first-depth-shell-unity-v1
          path: Unity/ValoriaCameraFirstDepthShellGateV1Captures/*
          if-no-files-found: warn
          retention-days: 30
