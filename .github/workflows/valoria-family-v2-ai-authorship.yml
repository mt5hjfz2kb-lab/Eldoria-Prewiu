name: Valoria family canonical AI artist and Blender workshop
on:
  push:
    branches: [art/valoria-asset-family-v2-ai-authorship-20261011]
    paths: ['pipeline/valoria-family-quality-request.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-family-art-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artist-workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Read exact source lineage request
        run: |
          python3 - <<'PY'
          import json,os
          p=json.load(open('pipeline/valoria-family-quality-request.json'))
          assert p['enabled'] and p['paid_credits']==0
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('SOURCE_RUN='+str(p['source_run'])+'\nSOURCE_ARTIFACT='+p['source_artifact']+'\n')
            f.write('ARTIST_RUN='+str(p.get('reuse_artist_run',0))+'\n')
            f.write('RESUME_ARTIST_RUN='+str(p.get('resume_artist_run',0))+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: art-source/valoria/production/asset-family-v2
      - name: Restore validated partial artist decisions without repeating accepted inference
        if: env.RESUME_ARTIST_RUN != '0' && env.ARTIST_RUN == '0'
        uses: actions/download-artifact@v4
        with:
          name: valoria-family-quality-genuine-artist-directions
          run-id: ${{ env.RESUME_ARTIST_RUN }}
          github-token: ${{ github.token }}
          path: art-source/valoria/production/asset-family-v2
      - name: Recover established free Qwen runtime
        if: env.ARTIST_RUN == '0'
        run: |
          git fetch --no-tags origin refs/heads/ops/valoria-art-brain-runtime-recovery-20261011:refs/remotes/origin/ops/valoria-art-brain-runtime-recovery-20261011
          git show origin/ops/valoria-art-brain-runtime-recovery-20261011:tools/valoria-art-brain/start_local_qwen_ci.sh > "$RUNNER_TEMP/start-qwen.sh"
          sed -i 's/export OLLAMA_KEEP_ALIVE=0/export OLLAMA_KEEP_ALIVE=10m/' "$RUNNER_TEMP/start-qwen.sh"
          sed -i '/^trap /d' "$RUNNER_TEMP/start-qwen.sh"
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-numpy
          sed -i 's/qwen2.5vl:3b/qwen3-vl:4b-instruct/g' "$RUNNER_TEMP/start-qwen.sh"
          python3 -m py_compile tools/art-rd/valoria_family_v2_1_qwen_art_director.py tools/art-rd/valoria_family_quality_author.py
          bash "$RUNNER_TEMP/start-qwen.sh"
      - name: External artist directs seven substantial designs before mesh construction
        if: env.ARTIST_RUN == '0'
        run: |
          python3 tools/art-rd/valoria_family_v2_1_qwen_art_director.py || { tail -100 "$RUNNER_TEMP/ollama-server.log"; exit 1; }
      - name: Preserve real artistic inference separately before production
        if: always() && env.ARTIST_RUN == '0'
        uses: actions/upload-artifact@v4
        with:
          name: valoria-family-quality-genuine-artist-directions
          path: |
            art-source/valoria/production/asset-family-v2/qwen-family-quality-*.json
            art-source/valoria/production/asset-family-v2/*-artist-input-*.jpg
      - name: Reuse exact successful artistic decisions for safe workshop repair
        if: env.ARTIST_RUN != '0'
        uses: actions/download-artifact@v4
        with:
          name: valoria-family-quality-genuine-artist-directions
          run-id: ${{ env.ARTIST_RUN }}
          github-token: ${{ github.token }}
          path: art-source/valoria/production/asset-family-v2
      - name: Validate genuine complete external plans before Blender
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('art-source/valoria/production/asset-family-v2/qwen-family-quality-directions.json'))
          assert len(p['plans'])==7 and not p.get('TEST_FIXTURE_NON_AUTHORITATIVE')
          PY
      - name: Install exact Blender workshop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-numpy
          curl -fL --retry 2 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
          curl -fL --retry 2 https://raw.githubusercontent.com/ahujasid/blender-mcp/7a0373ec9199183cb460068c4f96aed9c579fb4f/addon.py -o /tmp/eldoria-blender-mcp.py
          echo 'eb0facf69781a30e69792532087d8d41c6a14fcd323353250abe7988ee297fa5  /tmp/eldoria-blender-mcp.py' | sha256sum -c -
      - name: Portable image PBR surfaces
        run: python3 tools/art-rd/valoria_family_quality_surfaces.py
      - name: Real AI-designed architecture and geology through BlenderMCP
        run: blender -b --python-exit-code 1 -t 4 --python tools/art-rd/valoria_family_quality_author.py
      - name: Exact reimport assembly and structural preflight
        run: |
          blender -b --python-exit-code 1 -t 4 --python tools/art-rd/valoria_family_quality_assemble.py
          blender -b --python-exit-code 1 -t 4 --python tools/art-rd/valoria_family_quality_verify.py
          python3 tools/art-rd/audit_glb.py art-source/valoria/production/asset-family-v2/quality-v3/*/*.glb > art-source/valoria/production/asset-family-v2/quality-v3/glb-preflight.json
      - name: Preserve unreviewed real-source candidate on the isolated artistic branch
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, hashlib
          from PIL import Image
          base=pathlib.Path('art-source/valoria/production/asset-family-v2')
          p=json.load(open(base/'quality-v3/glb-preflight.json'))
          assert p['structural_pass'] and len(p['assets'])==21
          assert all(not a['errors'] and not a['warnings'] for a in p['assets'])
          proof={'assets':{},'renders':{},'authority':'unreviewed real-source candidate; independent art review required'}
          for folder in (base/'quality-v3').iterdir():
            if folder.is_dir() and (folder/'evidence.json').exists():
              name=folder.name
              proof['assets'][name]={'blend_sha256':hashlib.sha256((folder/(name+'.blend')).read_bytes()).hexdigest(),'glb_sha256':hashlib.sha256((folder/(name+'.glb')).read_bytes()).hexdigest(),'evidence':json.load(open(folder/'evidence.json'))}
          for png in list((base/'quality-v3').rglob('*.png'))+[pathlib.Path('art-source/valoria/production/first-hero-gate-v1/quality-v3/after-hero-matched.png')]:
            jpg=png.with_suffix('.jpg')
            with Image.open(png) as im:
              im=im.convert('RGB')
              for quality in (94,90,86):
                im.save(jpg,quality=quality)
                if jpg.stat().st_size<650000:break
              assert jpg.stat().st_size<750000,'Preview must remain retrievable through repository contents API'
            proof['renders'][str(jpg)]={'png_sha256':hashlib.sha256(png.read_bytes()).hexdigest(),'jpeg_sha256':hashlib.sha256(jpg.read_bytes()).hexdigest(),'width':im.width,'height':im.height,'bytes':jpg.stat().st_size}
          (base/'quality-v3/candidate-proof.json').write_text(json.dumps(proof,indent=2))
          files=[f for f in (base/'quality-v3').rglob('*') if f.is_file() and not f.name.startswith('.') and f.suffix in ('.blend','.glb','.png','.jpg','.json') and f.stat().st_size<95*1024*1024]
          files += [pathlib.Path('art-source/valoria/production/first-hero-gate-v1/quality-v3/after-hero-matched.jpg')]
          files += list(base.glob('qwen-family-quality-*.json'))+list(base.glob('*-artist-input-*.jpg'))+list((base/'quality-textures').glob('*.png'))
          subprocess.run(['git','add','-f',*[str(f) for f in files]],check=True)
          subprocess.run(['git','config','user.name','Codex Art Workshop'],check=True)
          subprocess.run(['git','config','user.email','art-workshop@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','art: preserve genuine artist source candidate and exact export captures; visual review pending'],check=True)
          subprocess.run(['git','push','origin','HEAD:art/valoria-asset-family-v2-ai-authorship-20261011'],check=True)
          PY
      - name: Preserve editable family, actual renders and inference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-family-quality-v3-editable-sources-renders
          path: |
            art-source/valoria/production/asset-family-v2/quality-v3/
            art-source/valoria/production/asset-family-v2/quality-textures/
            art-source/valoria/production/asset-family-v2/qwen-family-quality-*.json
            art-source/valoria/production/asset-family-v2/*-artist-input-*.jpg
          retention-days: 30

