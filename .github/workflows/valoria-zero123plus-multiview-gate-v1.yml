name: "[R&D] Valoria Zero123Plus Multiview Gate v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-zero123plus-multiview-gate-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --quiet "gradio_client>=1.4" pillow
      - name: Generate consistent Gate multiviews
        env:
          OUT_DIR: /tmp/zero123plus-mv
        run: python tools/valoria-zero123plus-multiview-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-zero123plus-multiview-gate-v1
          path: /tmp/zero123plus-mv
          if-no-files-found: error
          retention-days: 30
