name: "Eldoria CC0 · Director V5 physical city and environment review"
on:
  push:
    branches: [experiment/eldoria-cc0-art-system-20261116]
    paths:
      - "tools/cc0-art-system/director_v5_scene_refine.py"
      - ".github/workflows/cc0-director-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-cc0-v5-real-art-ubuntu
  cancel-in-progress: false
jobs:
  visual-five-levels:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools/cc0-art-system/
      - name: Recover pinned real, author-owned Blender V4 geometry, no vendor packs
        uses: actions/download-artifact@v4
        with:
          name: eldoria-cc0-director-v4-actual-models
          run-id: 43870376065
          github-token: ${{ github.token }}
          path: .
      - name: Source and script sanity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/cc0-art-system/director_v5_scene_refine.py
          for level in 1 2 3 4 5; do
            test -s "Unity/Assets/Art_Reboot/CC0System/DirectorV4/DirectorV4_ValoriaStage$level.glb"
          done
      - name: Install Blender 4 and exact free Python dependencies on hosted Ubuntu
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -2
      - name: Generate 5 actual original 3D models, an editable source and 3 real Blender renders
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 4 --python-exit-code 1 --python tools/cc0-art-system/director_v5_scene_refine.py 2>&1 | tee "$RUNNER_TEMP/eldoria-v5-real-art.log"
          grep -q ELDORIA_DIRECTOR_V5_REAL_ART_PASS "$RUNNER_TEMP/eldoria-v5-real-art.log"
      - name: Verify physical models, photos and transparent provenance (not art approval)
        shell: bash
        run: |
          python3 - <<'PY'
          import struct,json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          a=Path('Unity/Assets/Art_Reboot/CC0System/DirectorV5')
          p=Path('docs/cc0-art-system/previews/director-v5')
          evidence=json.loads((p/'director-v5-evidence.json').read_text())
          assert evidence['real_blender_render'] and evidence['owned_original_source']
          assert not evidence['native_unity_verified'] and not evidence['art_approved']
          assert not evidence['third_party_source_imported'] and not evidence['iphone_verified']
          assert len(evidence['evidence']['levels'])==5
          for stage in range(1,6):
            file=a/('DirectorV5_Stage'+str(stage)+'.glb')
            b=file.read_bytes()
            assert len(b)>500000 and b[:4]==b'glTF'
            assert struct.unpack_from('<I',b,8)[0]==len(b)
            n=struct.unpack_from('<I',b,12)[0]
            j=json.loads(b[20:20+n])
            assert len(j.get('meshes',[]))>800
            assert len(j.get('images',[]))>=8
            print('V5_REAL_GLTF_VERIFIED',stage,len(j['meshes']),len(j['images']))
          blend=a/'DirectorV5_Source.blend'
          assert blend.read_bytes().startswith(b'BLENDER') and blend.stat().st_size>3000000
          pictures={
              'DirectorV5_BastionI_1600x900.png':(1600,900),
              'DirectorV5_BastionV_1600x900.png':(1600,900),
              'DirectorV5_BastionV_Portrait_720x1200.png':(720,1200)}
          for name,expected in pictures.items():
              img=Image.open(p/name).convert('RGB')
              assert img.size==expected and (p/name).stat().st_size>100000
              s=ImageStat.Stat(img)
              assert min(s.mean)>30
              print('V5_REAL_BLENDER_RENDER_VERIFIED',name,img.size,[round(x,1) for x in s.mean])
          A=Image.open(p/'DirectorV5_BastionI_1600x900.png').convert('RGB')
          B=Image.open(p/'DirectorV5_BastionV_1600x900.png').convert('RGB')
          # Assess same-camera progress in the central keep, not just global sky/forest.
          roi=(380,80,1120,810)
          change=sum(ImageStat.Stat(ImageChops.difference(A.crop(roi),B.crop(roi))).mean)/3
          assert change>6.0,('Progression is still visually weak in actual camera',change)
          print('V5_REAL_BASTION_PROGRESSION_VERIFIED',round(change,2))
          PY
      - name: Persist inspectible outputs even if visual QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-cc0-director-v5-real-3d
          path: |
            Unity/Assets/Art_Reboot/CC0System/DirectorV5/
            docs/cc0-art-system/previews/director-v5/
          retention-days: 30
          if-no-files-found: warn
      - name: Assert experiment never edited main or Windows runner
        run: |
          git diff --exit-code
          echo "ELDORIA_V5_ISOLATED_SOURCE_PASS — NO game merge or actual iPhone certification"
