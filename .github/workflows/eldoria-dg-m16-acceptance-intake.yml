name: Eldoria DG M16 acceptance intake
on:
  workflow_run:
    workflows: ["M16 Pilot A to B (GitHub hosted)"]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: eldoria-dg-m16-intake-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RESULT: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Verify upstream jobs and exact artifact then report to Directorate
        shell: bash
        run: |
          set -euo pipefail
          marker="ELDORIA_DG_M16_INTAKE_RUN_$RUN_ID"
          if gh api "repos/$GH_REPO/issues/23/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then echo ALREADY_RECORDED; exit 0; fi
          mkdir -p evidence
          verdict=BLOCKED
          details='Upstream failure or independent proof unavailable.'
          if [[ "$RESULT" == success ]]; then
            jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100")
            a=$(jq -r '[.jobs[] | select(.name=="A - validate M16-A and emit handoff" and .conclusion=="success")] | length' <<<"$jobs")
            b=$(jq -r '[.jobs[] | select(.name=="B - verify A output and run M03 checks" and .conclusion=="success")] | length' <<<"$jobs")
            if [[ "$a" == 1 && "$b" == 1 ]] && gh run download "$RUN_ID" -R "$GH_REPO" -n m16-pilot-handoff -D evidence; then
              if (cd evidence && sha256sum -c source-sha.sha256) && [[ "$(cat evidence/source-sha.txt)" == "$SOURCE_SHA" ]] && [[ "$(cat evidence/run-id.txt)" == "$RUN_ID" ]]; then
                verdict=E2E_COORDINATOR_CHAIN_PASS
                details='Authentic owner-authorized dispatch, upstream A test, exact SHA/run artifact, downstream independent B test. No Unity, model API or auto-merge.'
              fi
            fi
          fi
          body=$(printf '### DG — entrega automática de cadena M16\n\n%s\n\n**Veredicto:** %s\n**Workflow:** https://github.com/%s/actions/runs/%s\n**SHA:** %s\n\n%s\n\nEsta prueba valida el encadenamiento GitHub autorizado; no demuestra que se hayan activado 15 agentes ni notificación instantánea de ChatGPT.' "$marker" "$verdict" "$GH_REPO" "$RUN_ID" "$SOURCE_SHA" "$details")
          gh api "repos/$GH_REPO/issues/23/comments" -f body="$body" >/dev/null
          echo "RECORDED_$verdict"
