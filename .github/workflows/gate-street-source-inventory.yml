name: GateStreetRiseRock source inventory
# MV1 inventory trigger 2026-09-27

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gate-street-source-inventory.yml'

jobs:
  inventory:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 3
    steps:
      - name: Identify recent GLB without processing it
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          $cutoff = (Get-Date).AddHours(-4)
          $recent = @(Get-ChildItem $downloads -File -Filter '*.glb' |
            Where-Object { $_.LastWriteTime -ge $cutoff } |
            Sort-Object LastWriteTime -Descending)
          Write-Host 'Recent GLB files (newest first):'
          foreach ($file in $recent) {
            $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host ("{0} | {1} bytes | {2:o} | sha256 {3}" -f $file.Name, $file.Length, $file.LastWriteTime, $sha)
          }
          if ($recent.Count -eq 0) { throw 'No GLB in the last four hours of Downloads.' }
