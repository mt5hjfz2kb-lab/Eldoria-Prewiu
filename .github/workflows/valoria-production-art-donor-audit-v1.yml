name: "[RESEARCH] Valoria Production Art Donor Audit v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/valoria-production-art-donor-audit-request.json'

permissions:
  contents: write

concurrency:
  group: valoria-production-art-donor-audit-v1
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Audit certified donor GLBs
        run: |
          blender -b --python tools/valoria-production-art-starter/audit_donor_glbs_v1.py
          test -s pipeline/evidence/valoria-production-art-donor-audit-v1.json
      - name: Persist audit
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/evidence/valoria-production-art-donor-audit-v1.json
          if git diff --cached --quiet; then echo "No donor audit changes."; else git commit -m "Persist Valoria production donor audit"; git push origin HEAD:main; fi
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-production-art-donor-audit-v1
          path: pipeline/evidence/valoria-production-art-donor-audit-v1.json
          if-no-files-found: error
          retention-days: 30
