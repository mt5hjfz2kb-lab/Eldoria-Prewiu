name: "[VALORIA63] Native Unity clean-scene build"
on:
  push:
    branches: [experiment/valoria-63-clean-composition-20261016]
    paths: ['tools/valoria63-clean-scene/native-request.txt']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 80
    steps:
      - name: Restore GitHub Desktop Git before checkout
        shell: powershell
        run: |
          $base=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
          $git=Get-ChildItem $base -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $git){throw 'GitHub Desktop Git missing'}
          Add-Content $env:GITHUB_PATH (Split-Path $git)
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria63-live-claim
          sparse-checkout: pipeline/active-workstreams.json
          persist-credentials: false
      - name: Check resource claim and Unity availability
        shell: powershell
        run: |
          $state=Get-Content valoria63-live-claim/pipeline/active-workstreams.json -Raw | ConvertFrom-Json
          $owners=@($state.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($owners.Count -ne 1 -or $owners[0].id -ne 'valoria63-clean-modular-assembly-20261016'){throw 'No exclusive runner lease'}
          if(Get-Process Unity -ErrorAction SilentlyContinue){throw 'Unity already active'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity Editor not found'}
      - uses: actions/download-artifact@v4
        with:
          run-id: 38954736752
          name: valoria63-clean-sources-38954736752
          github-token: ${{ github.token }}
          path: .
      - name: Build clean scene in native Unity
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria63-native.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/Unity",'-executeMethod','Eldoria.Valoria63.Editor.Valoria63CleanSceneBuilder.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          Get-Content $log -Tail 120
          New-Item -ItemType Directory -Force docs/evidence/valoria63-clean-scene-20261016 | Out-Null
          Copy-Item $log docs/evidence/valoria63-clean-scene-20261016/native.log
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA63_CLEAN_SCENE_COMPLETE' -Quiet)){throw 'Native Unity build failed'}
      - name: Reopen saved native scene in a FRESH Unity process and validate persistence
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria63-native-reopen.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/Unity",'-executeMethod','Eldoria.Valoria63.Editor.Valoria63CleanSceneBuilder.Validate','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          New-Item -ItemType Directory -Force docs/evidence/valoria63-clean-scene-20261016 | Out-Null
          if(Test-Path $log){Copy-Item $log docs/evidence/valoria63-clean-scene-20261016/native-reopen.log;Get-Content $log -Tail 100}
          if($p.ExitCode -ne 0 -or -not(Test-Path $log) -or -not(Select-String $log -Pattern 'VALORIA63_CLEAN_SCENE_REOPEN_VALIDATED' -Quiet)){throw 'Saved scene failed independent reopening/mesh+material+collision validation'}
      - name: Require genuine saved scene, source coverage and Unity PNG evidence
        shell: powershell
        run: |
          $dir='docs/evidence/valoria63-clean-scene-20261016'
          foreach($f in @('assembly-evidence.json','valoria63-clean-landscape.png','valoria63-clean-wide.png','valoria63-clean-portrait.png')){
            if(-not(Test-Path "$dir/$f")){throw "Missing required real Unity evidence $f"}
          }
          $saved='Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_BastionI_Modular63_Clean.unity'
          if(-not(Test-Path $saved)){throw 'Real Unity .unity scene not saved'}
          $report=Get-Content "$dir/assembly-evidence.json" -Raw|ConvertFrom-Json
          if($report.source_count -ne 63 -or $report.distinct_sources -ne 63 -or $report.module_instances -lt 120 -or $report.art_approved){
            throw '63-source coverage, native composition or art honesty gate failed'
          }
          Write-Host "VALORIA63_NATIVE_PERSISTENCE_AND_CAPTURE_PASS instances=$($report.module_instances)"
      - name: Build gate art-direction microtest from real modular assets
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria-gate-art-microtest.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/Unity",'-executeMethod','Eldoria.Valoria63.Editor.Valoria63CleanSceneBuilder.BuildGateQualityMicrotest','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          if(Test-Path $log){Copy-Item $log docs/evidence/valoria63-clean-scene-20261016/gate-microtest-native.log;Get-Content $log -Tail 100}
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_GATE_MICROTEST_SAVED' -Quiet)){throw 'Art-direction microtest failed to build'}
          foreach($file in @('gate-microtest-evidence.json','valoria-gate-microtest-wide.png','valoria-gate-microtest-detail.png')){
            if(-not(Test-Path "docs/evidence/valoria63-clean-scene-20261016/$file")){throw "Missing real microtest $file"}
          }
          if(-not(Test-Path 'Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_Gate_ArtDirection_Microtest.unity')){throw 'Microtest scene missing'}
      - name: Commit isolated scene and screenshots
        shell: powershell
        run: |
          git config user.name 'Valoria63 scene automation'
          git config user.email 'valoria63@users.noreply.github.com'
          git add -f Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Generated
          git add -f Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_BastionI_Modular63_Clean.unity
          git add -f Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_BastionI_Modular63_Clean.unity.meta
          git add -f Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_Gate_ArtDirection_Microtest.unity
          git add -f Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_Gate_ArtDirection_Microtest.unity.meta
          git add -f docs/evidence/valoria63-clean-scene-20261016
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'Nothing to persist: native scene/captures already tracked or missing'}
          git commit -m 'build: native Valoria clean scene plus reopen and screenshots'
          if($LASTEXITCODE -ne 0){throw 'Unable to commit native scene and evidence'}
          git push origin HEAD:experiment/valoria-63-clean-composition-20261016
          if($LASTEXITCODE -ne 0){throw 'Remote branch moved; preserve artifacts and reconcile before retry'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria63-native-result-${{ github.run_id }}
          path: |
            docs/evidence/valoria63-clean-scene-20261016/**
            Unity/Assets/Eldoria/ArtTests/Valoria63CleanScene/Valoria_BastionI_Modular63_Clean.unity
          if-no-files-found: warn
