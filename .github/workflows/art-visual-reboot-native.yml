name: "Visual reboot · isolated URP import and camera evidence"
on:
  push:
    branches: [art/visual-reboot]
    paths: [Unity/Assets/Art_Reboot/**, .github/workflows/art-visual-reboot-native.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: visual-reboot-native
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Unity/Assets/Art_Reboot/Phase1/Source~
      - name: Validate Windows script before queueing native work
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          foreach($script in @('native_capture.ps1','check_lease.ps1','test_lease.ps1')){
            [System.Management.Automation.Language.Parser]::ParseFile("$pwd/Unity/Assets/Art_Reboot/Phase1/Source~/$script",[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | Format-List;throw 'PowerShell parse failed'}
          }
      - name: Run Windows lease fixtures using actual PowerShell script
        shell: pwsh
        run: ./Unity/Assets/Art_Reboot/Phase1/Source~/test_lease.ps1
      - name: Reject foreign and stale lease fixtures
        run: python3 Unity/Assets/Art_Reboot/Phase1/Source~/test_lease.py
  lease:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-reboot-native]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Unity/Assets/Art_Reboot/Phase1/Source~
      - name: Require sole live Windows reservation and exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Unity/Assets/Art_Reboot/Phase1/Source~/check_lease.py
  native:
    needs: lease
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 45
    steps:
      - name: Refuse busy PC or insufficient disk before checkout
        shell: powershell
        run: |
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'PC busy'}
          if((Get-PSDrive C).Free -lt 20GB){throw 'Insufficient scratch space'}
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $git)
          }
      - uses: actions/checkout@v4
        with:
          path: visual-reboot-source
          clean: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Unity/Assets/Art_Reboot/**
            Unity/Assets/Art_Reboot.meta
            Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity*
            Unity/Assets/Eldoria/Content/EldoriaMobileURP.asset*
            Unity/Assets/Eldoria/Content/EldoriaForwardRenderer.asset*
            Unity/Assets/UniversalRenderPipelineGlobalSettings.asset*
            Unity/ProjectSettings/**
            Unity/Packages/manifest.json
      - name: Recheck live ownership immediately before launching Unity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: '& "$pwd/visual-reboot-source/Unity/Assets/Art_Reboot/Phase1/Source~/check_lease.ps1"'
      - name: Import and render in an isolated temporary project
        shell: powershell
        run: |
          & "$pwd/visual-reboot-source/Unity/Assets/Art_Reboot/Phase1/Source~/native_capture.ps1" -SourceRoot "$pwd/visual-reboot-source" -OutputRoot "$pwd/visual-reboot-evidence-$env:GITHUB_RUN_ID"
      - name: Save genuine Unity scene, revised volume and original screenshots to isolated source
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $source="$pwd/visual-reboot-source"
          $branchArt=Join-Path $source 'Unity/Assets/Art_Reboot/Phase1'
          $proof=Join-Path $pwd ("visual-reboot-evidence-"+$env:GITHUB_RUN_ID)
          $from=Join-Path $proof 'ImportedArtReboot/Phase1'
          foreach($rel in @(
            'Scenes/Eldoria_Visual_Sandbox.unity',
            'Materials/Reboot_Dusk.asset','Materials/Reboot_URP.asset',
            'Materials/Reboot_Emission.mat','Materials/Reboot_Corruption.mat',
            'Materials/Reboot_LowMist.mat','Materials/Reboot_ArcaneParticles.mat',
            'Materials/Reboot_LowMist_0.asset','Materials/Reboot_LowMist_1.asset'
          )){
            $a=Join-Path $from $rel; $z=Join-Path $branchArt $rel
            if(-not(Test-Path -LiteralPath $a)){throw "Missing generated Unity asset: $rel"}
            Copy-Item -LiteralPath $a -Destination $z -Force
            if(Test-Path -LiteralPath ($a+'.meta')){
              Copy-Item -LiteralPath ($a+'.meta') -Destination ($z+'.meta') -Force
            }
          }
          $evidence=Join-Path $branchArt ("Source~/Evidence/native-"+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          foreach($rel in @(
            'unity-1100x1250.png','unity-390x844.png',
            'unity-1600x900.png','unity-844x390.png',
            'capture.json','native-proof.json','model-world-bounds.txt'
          )){
            $a=Join-Path $proof $rel
            if(-not(Test-Path -LiteralPath $a)){throw "Missing true Unity evidence: $rel"}
            Copy-Item -LiteralPath $a -Destination (Join-Path $evidence $rel) -Force
          }
          $pngHashes=Get-Content -LiteralPath (Join-Path $proof 'native-proof.json') -Raw | ConvertFrom-Json
          $manifest=@{
            phase='Phase1 owner art revision';native_run=$env:GITHUB_RUN_ID
            source_sha=$env:GITHUB_SHA
            note='True native Unity rendered captures; artistic approval and real iPhone performance not asserted'
            art_approved=$false;physical_iphone_tested=$false
            png_hashes=$pngHashes.screenshots
          }
          ($manifest|ConvertTo-Json -Depth 8) | Set-Content -LiteralPath (Join-Path $branchArt 'Evidence/phase1_revision_run.json')
          Push-Location $source
          try{
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- Unity/Assets/Art_Reboot/Phase1
            git diff --cached --quiet
            if($LASTEXITCODE -ne 0){
              git commit -m "art: persist reviewed Phase1 URP scene and genuine native screenshots [phase1-provisional]"
              if($LASTEXITCODE -ne 0){throw 'Commit failed'}
              git push origin HEAD:art/visual-reboot
              if($LASTEXITCODE -ne 0){throw 'Non-fast-forward or GitHub write rejected; evidence remains in artifact'}
            }
          }finally{Pop-Location}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reboot-native-${{ github.run_id }}
          path: visual-reboot-evidence-${{ github.run_id }}/**
          if-no-files-found: warn
          retention-days: 14
