name: "Visual reboot · hero geometry preparation"
on:
  push:
    branches: [art/visual-reboot]
    paths:
      - .github/workflows/art-visual-reboot-blender.yml
      - Unity/Assets/Art_Reboot/Phase1/Source~/author_hero.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-reboot-blender
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Unity/Assets/Art_Reboot
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
      - name: Build isolated hero and silhouette evidence
        run: |
          set -euo pipefail
          python3 Unity/Assets/Art_Reboot/Phase1/Source~/HeroReview/silhouettes.py
          blender -b -t 4 --python Unity/Assets/Art_Reboot/Phase1/Source~/author_hero.py -- --skip-render 2>&1 | tee "$RUNNER_TEMP/hero.log"
          if grep -qE 'Traceback|Error: Python' "$RUNNER_TEMP/hero.log"; then exit 1; fi
          grep -q HERO_GEOMETRY_COMPLETE "$RUNNER_TEMP/hero.log"
          blender -b -t 4 --python Unity/Assets/Art_Reboot/Phase1/Source~/verify_hero.py 2>&1 | tee "$RUNNER_TEMP/hero-verify.log"
          grep -q HERO_FBX_PASS "$RUNNER_TEMP/hero-verify.log"
      - name: Persist hero without changing pilot scene
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Unity/Assets/Art_Reboot/Phase1/Models/Reboot_Hero.fbx Unity/Assets/Art_Reboot/Phase1/Textures/Hero_Atlas_256.png Unity/Assets/Art_Reboot/Phase1/Source~/HeroReview
          git diff --cached --quiet && exit 0
          git commit -m 'art: generated Casa de la Campana hero source; Unity capture pending'
          git push origin HEAD:art/visual-reboot
