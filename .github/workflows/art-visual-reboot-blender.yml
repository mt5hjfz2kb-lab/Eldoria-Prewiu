name: "Visual reboot · approved hero family preparation"
on:
  push:
    branches: [art/visual-reboot]
    paths:
      - .github/workflows/art-visual-reboot-blender.yml
      - Unity/Assets/Art_Reboot/Phase1/Source~/author_family.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-reboot-blender
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Unity/Assets/Art_Reboot
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
      - name: Derive family without rewriting approved hero
        run: |
          set -euo pipefail
          for mode in ruin corrupt environment; do
            blender -b -t 4 --python Unity/Assets/Art_Reboot/Phase1/Source~/author_family.py -- --$mode --skip-render 2>&1 | tee "$RUNNER_TEMP/$mode.log"
            if grep -qE 'Traceback|Error: Python' "$RUNNER_TEMP/$mode.log"; then exit 1; fi
            grep -q FAMILY_GEOMETRY_COMPLETE "$RUNNER_TEMP/$mode.log"
          done
          blender -b -t 4 --python Unity/Assets/Art_Reboot/Phase1/Source~/verify_family.py 2>&1 | tee "$RUNNER_TEMP/family-verify.log"
          grep -q FAMILY_FBX_PASS "$RUNNER_TEMP/family-verify.log"
      - name: Persist derived family only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Unity/Assets/Art_Reboot/Phase1/Models/Reboot_Ruin.fbx Unity/Assets/Art_Reboot/Phase1/Models/Reboot_Corrupt.fbx Unity/Assets/Art_Reboot/Phase1/Models/Reboot_Environment.fbx Unity/Assets/Art_Reboot/Phase1/Source~/Family
          git diff --cached --quiet && exit 0
          git commit -m 'art: generated approved hero ruin, corruption and clearing; Unity capture pending'
          git push origin HEAD:art/visual-reboot
