name: "Visual reboot · approved hero family preparation"
on:
  push:
    branches: [art/visual-reboot]
    paths:
      - .github/workflows/art-visual-reboot-blender.yml
      - Unity/Assets/Art_Reboot/Phase1/Source~/author_environment_v2.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-reboot-blender
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Unity/Assets/Art_Reboot
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
      - name: Build environment and additive dressing preserving approved buildings
        run: |
          set -euo pipefail
          blender -b -t 4 --python Unity/Assets/Art_Reboot/Phase1/Source~/author_environment_v2.py -- --skip-render 2>&1 | tee "$RUNNER_TEMP/environment.log"
          if grep -qE 'Traceback|Error: Python' "$RUNNER_TEMP/environment.log"; then exit 1; fi
          grep -q ENVIRONMENT_GEOMETRY_COMPLETE "$RUNNER_TEMP/environment.log"
          blender -b -t 4 --python Unity/Assets/Art_Reboot/Phase1/Source~/verify_environment_v2.py 2>&1 | tee "$RUNNER_TEMP/verify.log"
          grep -q ENVIRONMENT_FBX_PASS "$RUNNER_TEMP/verify.log"
      - name: Persist derived family only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Unity/Assets/Art_Reboot/Phase1/Models/Reboot_EnvironmentV2.fbx Unity/Assets/Art_Reboot/Phase1/Source~/EnvironmentReview
          git diff --cached --quiet && exit 0
          git commit -m 'art: generated village environment and additive dressing; approved buildings preserved; Unity capture pending'
          git push origin HEAD:art/visual-reboot
