name: "Visual reboot · regenerate isolated Phase1 Blender source"
on:
  push:
    branches: [art/visual-reboot]
    paths:
      - ".github/workflows/art-visual-reboot-blender.yml"
      - "Unity/Assets/Art_Reboot/Phase1/Source~/author_pilot.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-reboot-blender
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Unity/Assets/Art_Reboot/**
      - name: Verify original authoring script parses before Blender
        run: python3 -m py_compile Unity/Assets/Art_Reboot/Phase1/Source~/author_pilot.py
      - name: Install free Blender without using the shared Windows PC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version | head -n 2
      - name: Rebuild original mesh, source, palette and geometry evidence
        run: |
          set -euo pipefail
          cd Unity/Assets/Art_Reboot/Phase1/Source~
          blender -b -t 4 --python author_pilot.py -- --skip-render
      - name: Validate generated binaries are present and source limits held
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("Unity/Assets/Art_Reboot/Phase1")
          data=json.loads((root/"Evidence/geometry.json").read_text())
          assert data["mesh_objects"]==4, data
          assert 22000<data["triangles"]<100000, data
          for p in ["Models/Reboot_Pilot.fbx","Textures/Reboot_Atlas_256.png","Source~/Reboot_Pilot.glb","Source~/Reboot_Pilot.blend"]:
              f=root/p
              assert f.is_file() and f.stat().st_size>1000, str(f)
              print(str(f),f.stat().st_size)
          print("BLENDER_GEOMETRY_PASS",data["triangles"])
          PY
      - name: Commit regenerated authored assets only to experimental branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unity/Assets/Art_Reboot/Phase1/Models/Reboot_Pilot.fbx \
            Unity/Assets/Art_Reboot/Phase1/Textures/Reboot_Atlas_256.png \
            Unity/Assets/Art_Reboot/Phase1/Source~/Reboot_Pilot.glb \
            Unity/Assets/Art_Reboot/Phase1/Source~/Reboot_Pilot.blend \
            Unity/Assets/Art_Reboot/Phase1/Evidence/geometry.json
          if git diff --cached --quiet; then
            echo "Identical Blender generated assets"; exit 0
          fi
          git commit -m "art: generated Phase1 dusk revision original FBX/Blend/GLB/atlas [blender verified]"
          git push origin HEAD:art/visual-reboot
