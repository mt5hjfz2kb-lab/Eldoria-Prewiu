name: Eldoria consolidated hybrid artist comparable workshop
on:
  push:
    branches:
      - diagnostic/valoria-ai-eyes-brain-20261015
    paths:
      - 'pipeline/artist-hybrid-trial-request.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-exclusive-native-windows-free-text-director
  cancel-in-progress: false
jobs:
  original-qwen-artist-verified-tower-copy:
    if: ${{ !contains(github.event.head_commit.message, '[no-art-run]') }}
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 48
    steps:
      - name: Verify no other active Windows runner job
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {...context.repo, status:'in_progress', per_page:100});
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                {...context.repo, run_id:run.id});
              if (jobs.some(j => j.status === 'in_progress' &&
                  (j.labels || []).some(l => /windows|unity-6000/i.test(l))))
                throw new Error('OTHER_WINDOWS_JOB_ACTIVE: '+run.id);
            }
      - name: Use installed GitHub Desktop Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'PREINSTALLED_DESKTOP_GIT_MISSING'}
            $folder=Split-Path $git;$env:PATH="$folder;$env:PATH";Add-Content $env:GITHUB_PATH $folder
          }
          git --version
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: studio
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tools/art-direction/full-studio
            tools/art-direction/gpt6-tower-eval-20261015
            tools/art-direction/director-control
            pipeline/artist-hybrid-trial-request.json
            Unity/Assets/EmaceArt/Slavic World Free/Texture/EA03_FREE_Slavica.png
            tools/art-direction/VALORIA_LOCAL_ARTIST_SYSTEM_PROMPT.md
            tools/art-direction/ARTIST_LEARNING_JOURNAL.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: e5fc3715356378abc9a5d472071499c738f5e8ed
          path: frozen
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb
            references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
          sparse-checkout-cone-mode: false
      - name: Read bounded hybrid request
        id: request
        shell: powershell
        run: |
          $r=Get-Content 'studio/pipeline/artist-hybrid-trial-request.json' -Raw | ConvertFrom-Json
          if(-not $r.enabled){throw 'REQUEST_DISABLED'}
          "mode=$($r.mode)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Recover exact shared observation pack, never regenerate between directors
        if: steps.request.outputs.mode == 'compare'
        uses: actions/download-artifact@v4
        with:
          name: eldoria-hybrid-workshop-evidence
          run-id: 38786948113
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/eldoria-hybrid-prepared-${{ github.run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict source + local model preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='frozen/Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb'
          if((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e7592eaaf10824dadf6a272551518456c1dc054fdbd24f769fae90d0b4b76869'){throw 'FROZEN_SOURCE_SHA_MISMATCH'}
          $b=Get-Command blender.exe -ErrorAction SilentlyContinue
          if($b){$exe=$b.Source}else{$exe=Get-ChildItem (Join-Path $env:ProgramFiles 'Blender Foundation') -File -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName}
          if(-not $exe){throw 'INSTALLED_BLENDER_NOT_FOUND'}
          "ELDORIA_BLENDER_BIN=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          python -m pip install --disable-pip-version-check --quiet pillow
          if($LASTEXITCODE -ne 0){throw 'FREE_IMAGE_DEPENDENCY_MISSING'}
          python -m py_compile studio/tools/art-direction/full-studio/artist_loop.py studio/tools/art-direction/full-studio/artist_capabilities_v1.py studio/tools/art-direction/full-studio/blender_toolbox.py
          if($LASTEXITCODE -ne 0){throw 'CURRENT_ARTIST_CODE_INVALID'}
      - name: Observe actual source with VL8B then let text-only Qwen14B author Blender geometry on frozen copy
        shell: powershell
        timeout-minutes: 40
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('eldoria-hybrid-'+$env:GITHUB_RUN_ID)
          "ELDORIA_HYBRID_OUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
          if(-not (Test-Path $exe)){
            $exe=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {Join-Path $_.FullName 'AppData/Local/Programs/Ollama/ollama.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $exe){throw 'PREINSTALLED_OLLAMA_MISSING'}
          $models=Join-Path $env:USERPROFILE '.ollama/models'
          if(-not (Test-Path $models)){
            $models=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {Join-Path $_.FullName '.ollama/models'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if($models){$env:OLLAMA_MODELS=$models}
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $env:OLLAMA_NUM_PARALLEL='1';$env:OLLAMA_MAX_LOADED_MODELS='1'
          $env:ELDORIA_ARTIST_NUM_CTX='16384'
          $server=$null
          try{
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process -FilePath $exe -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'ollama-stdout.log') -RedirectStandardError (Join-Path $out 'ollama-stderr.log')
              for($i=0;$i -lt 45;$i++){try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}}
            }
            if(-not $ready){throw 'LOCAL_OLLAMA_UNAVAILABLE'}
            $available=@((Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 20).models|ForEach-Object {$_.name})
            foreach($needed in @('qwen3:14b','qwen3-vl:8b-instruct-q4_K_M')){if($needed -notin $available){throw "INSTALLED_MODEL_MISSING: $needed"}}
            $src='frozen/Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb'
            $request=Get-Content 'studio/pipeline/artist-hybrid-trial-request.json' -Raw | ConvertFrom-Json
            if(-not $request.enabled){throw 'REQUEST_DISABLED'}
            $script='studio/tools/art-direction/full-studio/hybrid_trial.py'
            $review='studio/tools/art-direction/full-studio/tests/valoria_tower_hero_review.json'
            $reference='frozen/references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg'
            $argv=@($script,'prepare','--source',$src,
              '--atlas','studio/Unity/Assets/EmaceArt/Slavic World Free/Texture/EA03_FREE_Slavica.png',
              '--reference',$reference,'--review',$review,'--blender',$env:ELDORIA_BLENDER_BIN,
              '--out',(Join-Path $out 'pack'))
            if($request.mode -eq 'prepare'){
              & python @argv
              if($LASTEXITCODE -ne 0){throw 'EXACT_HYBRID_CONTEXT_PREPARATION_FAILED'}
            }
            if($request.mode -eq 'compare'){
              python $script compare --max-plan-attempts 1 --workshop frame --pack (Join-Path $env:RUNNER_TEMP ('eldoria-hybrid-prepared-'+$env:GITHUB_RUN_ID+'/pack')) --reference $reference --review $review --blender $env:ELDORIA_BLENDER_BIN --external-plan 'studio/tools/art-direction/full-studio/hybrid-external-plan.json' --external-context-sha256 $request.external_context_sha256 --out (Join-Path $out 'comparison')
              if($LASTEXITCODE -ne 0){throw 'COMPARISON_EXECUTION_FAILED'}
            }
            if((Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e7592eaaf10824dadf6a272551518456c1dc054fdbd24f769fae90d0b4b76869'){throw 'FROZEN_SOURCE_CHANGED'}
          }finally{
            if($server){try{Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}catch{}}
          }
      - name: Preserve true model requests, geometry, original A/B and rejection reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-hybrid-workshop-evidence
          path: ${{ env.ELDORIA_HYBRID_OUT }}/
          if-no-files-found: warn
          retention-days: 30
