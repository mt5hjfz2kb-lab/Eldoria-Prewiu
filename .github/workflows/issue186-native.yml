name: Issue 186 Unity native art evidence (exclusive Windows)
on:
  push:
    branches: [feature/issue186-reward-attention-guidance-20261111]
    paths: [tools/reward-experience/native-request.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue186-native-art
  cancel-in-progress: false

jobs:
  exclusive-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless Issue186 owns the exact Windows CAS lease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          hdr={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
               "Accept":"application/vnd.github+json","User-Agent":"issue186-native-preflight"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=hdr),timeout=30) as r:return json.load(r)
          p=get(f"https://api.github.com/repos/{repo}/contents/pipeline/active-workstreams.json?ref=main")
          b64=p.get("content")
          if p.get("encoding")!="base64" or not b64:
              blob=get(f"https://api.github.com/repos/{repo}/git/blobs/{p['sha']}")
              if blob.get("sha")!=p["sha"] or blob.get("encoding")!="base64":raise SystemExit("Registry blob mismatch")
              b64=blob.get("content")
          if not b64:raise SystemExit("CAS registry unreadable")
          d=json.loads(base64.b64decode(b64))
          hs=[x for x in d["active"] if "windows-runner-heavy" in x.get("resources",[])]
          if len(hs)!=1 or hs[0].get("id")!="eldoria-issue186-reward-attention-guidance-20261111" or hs[0].get("owner")!="chatgpt-central-resource-art-20261111" or hs[0].get("ownership_state")!="claimed":
              raise SystemExit("Another workstream owns Windows. Refuse native run.")
          pr=get(f"https://api.github.com/repos/{repo}/git/ref/heads/feature/issue186-reward-attention-guidance-20261111")
          if pr["object"]["sha"]!=os.environ["GITHUB_SHA"]:raise SystemExit("PR HEAD changed after dispatch")
          print("ISSUE186_CAS_LEASE_PASS")
          PY

  native:
    needs: exclusive-preflight
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    env:
      OUT: ${{ github.workspace }}\issue186-native-${{ github.run_id }}
    steps:
      - name: Verify installed Unity and idle computer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:UNITY_EDITOR_PATH -or -not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity Editor not installed'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unity/Blender process already running. Refuse overlap.'}
      - name: Resolve already installed Git before checkout; forbid archive fallback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources/app/git/cmd/git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $git){throw 'Installed Git unavailable; refuse full 26GB archive fallback'}
            $dir=Split-Path $git
            $env:PATH="$dir;$env:PATH"
            Add-Content $env:GITHUB_PATH $dir
          }
          git --version
          if($LASTEXITCODE){throw 'Installed Git failed; refuse archive fallback'}
      - name: Fetch pinned Unity-only source and retain owned import cache
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native tools busy before checkout'}
          $src=Join-Path $env:GITHUB_WORKSPACE 'issue186-source'
          if(Test-Path -LiteralPath $src){
            $item=Get-Item -LiteralPath $src -Force
            if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Refuse reparse-point source'}
            if(-not(Test-Path -LiteralPath (Join-Path $src '.git') -PathType Container)){throw 'Owned source is not an existing Git worktree'}
            if((Get-Item -LiteralPath (Join-Path $src '.git') -Force).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Refuse redirected Git metadata'}
            $origin=(& git -C $src remote get-url origin).Trim()
            if($LASTEXITCODE -or $origin -notin @('https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu','https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git')){throw 'Owned checkout origin mismatch'}
          }else{
            New-Item -ItemType Directory -Path $src|Out-Null
            & git -C $src init
            if($LASTEXITCODE){throw 'Cannot initialize isolated source'}
            & git -C $src remote add origin 'https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu'
            if($LASTEXITCODE){throw 'Cannot set isolated origin'}
          }
          # actions/checkout filter overrides sparse-checkout. Configure both
          # in Git itself; never clean Unity/Library or any other warm project.
          & git -C $src config remote.origin.promisor true
          & git -C $src config remote.origin.partialclonefilter blob:none
          & git -C $src sparse-checkout init --no-cone
          if($LASTEXITCODE){throw 'Cannot initialize real sparse checkout'}
          $patterns=@(
            '/Unity/**'
            '!/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV*/**'
            '!/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Generated-391*/**'
          )
          & git -C $src sparse-checkout set --no-cone @patterns
          if($LASTEXITCODE){throw 'Cannot set Unity-only source membership'}
          & git -C $src fetch --no-tags --depth=1 --filter=blob:none origin $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Pinned partial fetch failed; refuse archive fallback'}
          & git -C $src checkout --force --detach FETCH_HEAD
          if($LASTEXITCODE){throw 'Pinned checkout failed'}
          $actual=(& git -C $src rev-parse HEAD).Trim()
          if($LASTEXITCODE -or $actual -ne $env:GITHUB_SHA){throw 'Exact native source mismatch'}
          Write-Host "ISSUE186_PINNED_UNITY_ONLY_SOURCE=$actual; NO_GIT_CLEAN; LIBRARY_PRESERVED"
      - name: Recheck exact SHA and Windows lease before Editor
        shell: powershell
        working-directory: issue186-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Source is not exact requested HEAD'}
          $hdr=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'User-Agent'='issue186-native-leaserecheck'}
          $repo='mt5hjfz2kb-lab/Eldoria-Prewiu'
          $p=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/contents/pipeline/active-workstreams.json?ref=main" -Headers $hdr
          $b64=[string]$p.content
          if($p.encoding -ne 'base64' -or [string]::IsNullOrWhiteSpace($b64)){
            $blob=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/blobs/$($p.sha)" -Headers $hdr
            if($blob.sha -ne $p.sha -or $blob.encoding -ne 'base64'){throw 'CAS blob mismatch'}
            $b64=[string]$blob.content
          }
          if([string]::IsNullOrWhiteSpace($b64)){throw 'CAS data unavailable'}
          $d=([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64)))|ConvertFrom-Json
          $holders=@($d.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($holders.Count -ne 1 -or $holders[0].id -ne 'eldoria-issue186-reward-attention-guidance-20261111' -or $holders[0].owner -ne 'chatgpt-central-resource-art-20261111'){throw 'Issue186 lost Windows lease'}
          $pr=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/feature/issue186-reward-attention-guidance-20261111" -Headers $hdr
          if($pr.object.sha -ne $env:GITHUB_SHA){throw 'Ref changed; refuse old native test'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native editor still active from another workstream'}
      - name: Import actual sprites and render four sizes in Unity
        shell: powershell
        working-directory: issue186-source
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          $unityProject=Join-Path (Get-Location).Path 'Unity'
          $log=Join-Path $env:OUT 'unity-editor.log'
          # Unity 6000.3 recommends -quit even if the executeMethod
          # cannot start after a script compilation failure. This prevents
          # holding the exclusive Windows runner until a timeout.
          $args='-batchmode -quit -force-d3d11 -projectPath "'+$unityProject+
            '" -executeMethod Eldoria.Issue186Art.Editor.Issue186NativeEvidence.Capture -logFile "'+$log+'"'
          $process=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          $proof=Join-Path $unityProject 'Issue186NativeEvidence'
          if(Test-Path $proof){Copy-Item (Join-Path $proof '*') $env:OUT -Force -Recurse}
          if($process.ExitCode -ne 0){
            if(Test-Path $log){Get-Content $log -Tail 130}
            throw "Unity import/capture failed with exit $($process.ExitCode)"
          }
          $file=Join-Path $env:OUT 'report.json'
          if(-not(Test-Path $file)){throw 'No actual Unity proof report'}
          $r=Get-Content $file -Raw|ConvertFrom-Json
          if($r.status -ne 'UNITY_ISOLATED_IMPORT_PASS_ART_REVIEW_PENDING' -or
            $r.allResourcesImported -ne $true -or $r.realImportedSprites -ne 16 -or
            $r.captures -ne 4 -or $r.pointerRaycastHits -ne 4 -or
            $r.artApproved -ne $false -or $r.actualCityTested -ne $false){
            throw 'Native proof status did not match acceptance contract'
          }
          foreach($shot in @($r.images)){
            if($shot.actualResourceSprites -ne 12 -or $shot.visiblePixels -ne $true -or
               $shot.indicatorReady -ne $true -or $shot.newIndicatorReady -ne $true -or
               $shot.firstUsePointer -ne $true -or $shot.firstUseCompleted -ne $false -or
               $shot.pointerLeavesCtaCenterClear -ne $true -or $shot.realUiClick -ne $true -or
               $shot.blockedUiClickRejected -ne $true -or $shot.noOverlappingCards -ne $true){
              throw 'One mobile/desktop render is missing required content'
            }
            $p=Join-Path $env:OUT $shot.file
            if(-not(Test-Path $p)){throw "Missing authentic PNG $p"}
            if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $shot.sha256){
              throw 'Tampered native Unity screenshot'
            }
          }
          Write-Host 'ISSUE186_NATIVE_FOUR_VIEWPORTS_AND_POINTER_PASS'
      - name: Preserve actual Unity screenshots and error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue186-native-${{ github.sha }}
          path: ${{ github.workspace }}\issue186-native-${{ github.run_id }}\
          retention-days: 30
          if-no-files-found: warn
