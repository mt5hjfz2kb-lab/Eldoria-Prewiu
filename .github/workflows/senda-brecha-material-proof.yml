name: Senda | verified portal contour and material transfer
on:
  push:
    branches: [feature/senda-brecha-lane-event-20261115]
    paths: ['tools/senda-brecha/material/portal-request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: senda-portal-material-transfer
  cancel-in-progress: false
jobs:
  prepare:
    if: github.run_attempt == 1 && github.event.before == 'fa444bfad5f2754281343d599eeda090e77db2b8' && github.event.head_commit.message == 'Prepare verified Valoria portal contour once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/senda-brecha/material
      - name: Recover actual generated PNG and create physical extrusion outline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45718046144 --jq '.conclusion' | grep -x success
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/15070712509 --jq '.name' | grep -x senda-portal-result-45718046144
          gh run download 45718046144 --repo "$GITHUB_REPOSITORY" --name senda-portal-result-45718046144 --dir /tmp/senda-portal
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          python3 tools/senda-brecha/material/prepare_portal_mesh.py /tmp/senda-portal/candidate.png /tmp/senda-portal-out
      - uses: actions/upload-artifact@v4
        with:
          name: verified-senda-portal
          path: /tmp/senda-portal-out/
          if-no-files-found: error
  archive:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/senda-brecha-lane-event-20261115
          fetch-depth: 1
          sparse-checkout: |
            tools/senda-brecha
      - uses: actions/download-artifact@v4
        with:
          name: verified-senda-portal
          path: /tmp/senda-portal-out
      - name: Commit only exact portal texture and contour to existing PR
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dir=tools/senda-brecha/visual-3d/art
          mkdir -p "$dir"
          for n in senda-valoria-portal.png senda-valoria-portal.mesh.json; do
            test ! -e "$dir/$n"
            cp "/tmp/senda-portal-out/$n" "$dir/$n"
            git add "$dir/$n"
          done
          test "$(git diff --cached --name-only | wc -l)" = 2
          git config user.name 'eldoria-studio-material'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive verified Valoria portal texture and physical contour"
          git push origin HEAD:refs/heads/feature/senda-brecha-lane-event-20261115
