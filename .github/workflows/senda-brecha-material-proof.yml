name: Senda | verified one-time slate material transfer
on:
  push:
    branches: [feature/senda-brecha-lane-event-20261115]
    paths: ['tools/senda-brecha/material/request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: senda-slate-material-transfer
  cancel-in-progress: false
jobs:
  prepare:
    if: github.run_attempt == 1 && github.event.before == '914c3b7acf8b3e200ea2ad4c874636109ef9493f' && github.event.head_commit.message == 'Prepare verified Studio slate material once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/senda-brecha/material
      - name: Recover verified generated material, repair periodic edges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45707395248 --jq '.conclusion' | grep -x success
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/15065212591 --jq '.name' | grep -x senda-polish-result-45707395248
          gh run download 45707395248 --repo "$GITHUB_REPOSITORY" --name senda-polish-result-45707395248 --dir /tmp/studio-slate
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
          python3 tools/senda-brecha/material/prepare_slate_material.py /tmp/studio-slate/candidate.png /tmp/senda-material
      - uses: actions/upload-artifact@v4
        with:
          name: verified-senda-slate
          path: /tmp/senda-material/
          if-no-files-found: error
  archive:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/senda-brecha-lane-event-20261115
          fetch-depth: 1
          sparse-checkout: |
            tools/senda-brecha
      - uses: actions/download-artifact@v4
        with:
          name: verified-senda-slate
          path: /tmp/senda-material
      - name: Commit only exact material and provenance on PR195 branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dir=tools/senda-brecha/visual-3d/art
          mkdir -p "$dir"
          for n in senda-worn-slate.png senda-worn-slate.provenance.json; do
            test ! -e "$dir/$n"
            cp "/tmp/senda-material/$n" "$dir/$n"
            git add "$dir/$n"
          done
          test "$(git diff --cached --name-only | wc -l)" = 2
          git config user.name 'eldoria-studio-material'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive verified Studio slate surface candidate"
          git push origin HEAD:refs/heads/feature/senda-brecha-lane-event-20261115
