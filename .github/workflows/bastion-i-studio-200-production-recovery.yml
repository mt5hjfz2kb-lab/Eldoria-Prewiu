name: Bastion I issue 200 - recover alpha and finish modular assets
on:
  push:
    branches: [research/bastion-i-25d-studio-200]
    paths: ['.github/workflows/bastion-i-studio-200-production-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion-i-research-200
  cancel-in-progress: false
jobs:
  production:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Recover issue200 assets without repaying existing sprites'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Recover immutable source and verify prior closed receipts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio" "$RUNNER_TEMP/production"
          cd "$RUNNER_TEMP/studio"
          for f in studio.py economics.py generate_candidate.py rates-20261125.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/openai-development-studio/$f?ref=9fbdb203269b951a252de58d7a0357d71a841480" > "$f"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/recover-modular-assets.py?ref=eb5bf2c3190bd3b3103caa5dc587475cd9c6a48f" > mission.py
          python3 -m pip install --quiet pillow numpy
          python3 -m py_compile mission.py
          test "$(gh api "repos/$REPO/actions/runs/46031689984" --jq .conclusion)" = failure
          test "$(gh api "repos/$REPO/actions/artifacts/15213768972" --jq .digest)" = sha256:24136c6f64dbd2556677582ed5b1e3b3a46b45cf2e611074a59d7e20f00c1488
          test "$(gh api "repos/$REPO/actions/artifacts/15212529521" --jq .digest)" = sha256:c170f4d7c01546dd40adf4dedee4dd1957d67f299974fdbe3b24ef2cc1ec93da
      - uses: actions/download-artifact@v4
        with:
          name: issue200-artist-delivery
          run-id: 46028941144
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/concepts
      - uses: actions/download-artifact@v4
        with:
          name: issue200-modular-production-assets
          run-id: 46031689984
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/production
      - name: Recover prior sawmill; pay only for missing meadow and review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          python3 -u mission.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-modular-production-completed
          path: ${{ runner.temp }}/production
          if-no-files-found: warn
          retention-days: 14
