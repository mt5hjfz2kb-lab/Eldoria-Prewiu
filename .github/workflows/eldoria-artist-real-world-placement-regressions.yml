name: Eldoria real Qwen tower architecture placement independent QA
on:
  push:
    branches: [validation/eldoria-artist-placement-real-failure-gates-20261014]
    paths:
      - 'tools/art-direction/full-studio/architectural_world_placement_gate.py'
      - 'tools/art-direction/full-studio/tests/test_architectural_world_placement_gate.py'
      - '.github/workflows/eldoria-artist-real-world-placement-regressions.yml'
permissions:
  contents: read
jobs:
  source-geometry-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/full-studio
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify real Qwen failed object examples and good objects without Blender
        run: |
          python -m py_compile tools/art-direction/full-studio/architectural_world_placement_gate.py
          python -m unittest discover -s tools/art-direction/full-studio/tests -p 'test_architectural_world_placement_gate.py' -v
      - name: Guarantee NO art automatic approval or PC resource consumption
        run: echo 'OFFLINE_ONLY no Ollama Blender Windows Unity model authoring or game publication'
