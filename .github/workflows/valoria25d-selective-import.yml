name: Valoria 2.5D Gameplay - selective immutable V6 art import
on:
  push:
    branches: [integration/valoria-25d-playable-20261117]
    paths: [tools/valoria-25d/import_request.json]
permissions:
  contents: write
concurrency:
  group: valoria25d-selective-import
  cancel-in-progress: false
jobs:
  import-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/valoria-25d/
            /Unity/Assets/Valoria25D/
            /.github/workflows/valoria25d-selective-import.yml
      - name: Verify origin main SHA and exact source branch identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('tools/valoria-25d/import_request.json').read_text())
          assert x['schema']==1 and x['art_sha']=='10dbc197d48ea8517c6a3dd6c22f1a2abf75d508'
          assert x['base_main_sha']=='904ff183ffb9053f68b9c0f359b2e9d3d40ce805'
          assert x['no_main_edit'] and x['no_art_edit']
          PY
      - name: Fetch one exact art commit without checkout or merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 --filter=blob:none origin 10dbc197d48ea8517c6a3dd6c22f1a2abf75d508
          git cat-file -t 10dbc197d48ea8517c6a3dd6c22f1a2abf75d508 | grep -qx commit
      - name: Select only V6 scene, its actual GUID assets, nine runtime components
        shell: bash
        run: python3 tools/valoria-25d/import_premium_v6.py
      - name: Commit selectively imported assets only to new integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q -- tools/valoria-25d/import_request.json
          git add --sparse -- Unity/Assets/Valoria25D/ tools/valoria-25d/selected_assets_manifest.json
          git diff --cached --quiet && { echo 'No selected source imported'; exit 1; }
          git commit -m 'art(valoria25d): selectively import source-verified V6 premium scene and referenced runtime assets'
          for i in $(seq 1 8); do
            if git push origin HEAD:refs/heads/integration/valoria-25d-playable-20261117; then
              echo "VALORIA25D_SOURCE_IMPORT_COMMIT=$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch --no-tags origin integration/valoria-25d-playable-20261117
            git rebase FETCH_HEAD
            sleep 1
          done
          echo 'Concurrent updates prevented safe commit'; exit 1
