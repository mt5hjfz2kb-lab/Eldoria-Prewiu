name: Valoria 2.5D - selective premium scene import from art to integration
on:
  push:
    branches: [integration/valoria-25d-playable-20261117]
    paths: ['tools/valoria25d/import_request.json']
permissions:
  contents: write
concurrency:
  group: valoria25d-selective-source-import
  cancel-in-progress: false
jobs:
  selective-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/valoria25d/
            /Unity/Assets/Experimentos/
      - name: Recover immutable art source at exact SHA, no branch merges
        uses: actions/checkout@v4
        with:
          ref: 10dbc197d48ea8517c6a3dd6c22f1a2abf75d508
          path: art-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Experimentos.meta
            /Unity/Assets/Experimentos/Ciudad2D.meta
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/
            /Unity/Assets/Experimentos/Ciudad2D/Scripts/
            /Unity/Assets/Experimentos/Ciudad2D/QA/ArchivedScenes/
      - name: Verify exact art source, destination and owner intent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C art-source rev-parse HEAD)" = "10dbc197d48ea8517c6a3dd6c22f1a2abf75d508"
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('tools/valoria25d/import_request.json').read_text())
          assert x['schema']==1 and x['source']=='10dbc197d48ea8517c6a3dd6c22f1a2abf75d508'
          assert x['target']=='integration/valoria-25d-playable-20261117'
          assert x['no_main_changes'] and x['no_art_changes'] and x['no_qa_history'] and x['no_gateway_or_domain_copies']
          PY
      - name: Copy only serialized Unity scene dependencies by GUID
        shell: bash
        run: python3 tools/valoria25d/selective_import.py
      - name: Stage only new integration files, preserve main and art branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f Unity/Assets/Experimentos/Ciudad2D/ tools/valoria25d/SELECTIVE_IMPORT_MANIFEST.json
          git diff --cached --name-only | tee /tmp/valoria25d_files.txt
          if grep -E '(^Unity/Assets/Eldoria/Scripts/(Domain|Application)/|^Unity/Assets/Experimentos/Ciudad2D/(QA|Scripts/Editor)/|^Unity/Assets/Experimentos/Ciudad2D/Sprites/(AIPilot|Retina)/.*NOT_USED)' /tmp/valoria25d_files.txt; then
            echo "Forbidden assets staged"; exit 1
          fi
          test "$(grep -c '^Unity/Assets/Experimentos/Ciudad2D/' /tmp/valoria25d_files.txt)" -gt 30
          git commit -m 'art(integration): selectively import Premium V6 scene, live sprites and read-only city adapters'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/integration/valoria-25d-playable-20261117; then
              echo "VALORIA25D_IMPORT_COMMIT=$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch --no-tags origin integration/valoria-25d-playable-20261117
            git rebase FETCH_HEAD
          done
          exit 1
