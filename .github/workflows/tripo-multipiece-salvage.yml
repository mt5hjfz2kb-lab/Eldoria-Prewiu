name: Tripo multipiece salvage

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/tripo-salvage-request.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: eldoria-tripo-salvage
  cancel-in-progress: true

jobs:
  salvage:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "$env:LOCALAPPDATA\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
      - name: Read salvage request
        id: req
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE\pipeline\tripo-salvage-request.json" -Raw | ConvertFrom-Json
          "enabled=$(([bool]$r.enabled).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not [bool]$r.enabled) { Write-Host 'SALVAGE_DISABLED'; exit 0 }
          "artifact_id=$([long]$r.certified_artifact.id)" >> $env:GITHUB_OUTPUT
      - name: Download certified multipiece artifact
        if: steps.req.outputs.enabled == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\stone-certified.zip"
          $root="$env:RUNNER_TEMP\stone-certified"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null
          gh api -H "Accept: application/vnd.github+json" "/repos/$env:GITHUB_REPOSITORY/actions/artifacts/${{ steps.req.outputs.artifact_id }}/zip" > $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force
      - name: Locate Blender
        if: steps.req.outputs.enabled == 'true'
        id: blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if (-not $candidate) {
            foreach($root in @('C:\Program Files\Blender Foundation',"$env:LOCALAPPDATA\Programs\Blender Foundation")) {
              if($candidate){break}
              if(Test-Path $root){$candidate=Get-ChildItem $root -Recurse -Filter blender.exe -ErrorAction SilentlyContinue|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName}
            }
          }
          if(-not $candidate){throw 'Blender not found.'}
          "path=$candidate" >> $env:GITHUB_OUTPUT
      - name: Deterministic disconnected-residue salvage
        if: steps.req.outputs.enabled == 'true'
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE\pipeline\tripo-salvage-request.json" -Raw | ConvertFrom-Json
          $artifact="$env:RUNNER_TEMP\stone-certified"
          $outDir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\MultiPiece"
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $reports="$env:RUNNER_TEMP\stone-salvage-reports"
          New-Item -ItemType Directory -Force $reports | Out-Null
          foreach($piece in @($r.pieces)) {
            $matches=@(Get-ChildItem $artifact -Recurse -File -Filter ([string]$piece.source_file))
            if($matches.Count -ne 1){throw "Expected one artifact source for $($piece.source_file), found $($matches.Count)"}
            $sha=(Get-FileHash $matches[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne ([string]$piece.source_sha256).ToLowerInvariant()){throw "Source SHA mismatch for $($piece.source_file)"}
            $dest=Join-Path $outDir ([string]$piece.output_file)
            $report=Join-Path $reports (([IO.Path]::GetFileNameWithoutExtension([string]$piece.output_file))+'.json')
            $args=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\tripo_piece_salvage.py",'--','--input',$matches[0].FullName,'--output',$dest,'--report',$report,'--min-component-ratio',[string]$piece.min_component_ratio,'--min-component-triangles',[string]$piece.min_component_triangles)
            $proc=Start-Process -FilePath '${{ steps.blender.outputs.path }}' -ArgumentList $args -Wait -PassThru
            if($proc.ExitCode -ne 0){throw "Salvage failed for $($piece.source_file)"}
            Get-Content $report
          }
      - name: Execute isolated Unity salvage visual gate
        if: steps.req.outputs.enabled == 'true'
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\TripoMultipieceReviewCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-TripoSalvage.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.TripoMultipieceReview.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(540000)){& taskkill.exe /PID $p.Id /T /F|Out-Null; throw 'Salvage Unity gate timed out.'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 240};throw "Salvage Unity gate failed: $($p.ExitCode)"}
          Get-Content "$folder\metrics.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.req.outputs.enabled == 'true'
        with:
          name: tripo-salvage-${{ github.run_id }}
          path: |
            Unity/TripoMultipieceReviewCaptures/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/MultiPiece/*.glb
            ${{ runner.temp }}/stone-salvage-reports/*.json
            ${{ runner.temp }}/Eldoria-TripoSalvage.log
          if-no-files-found: warn
