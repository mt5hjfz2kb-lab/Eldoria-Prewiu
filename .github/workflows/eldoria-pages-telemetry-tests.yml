name: Eldoria Pages + Supabase tester telemetry QA (zero Unity)
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths:
      - 'tools/eldoria-private-beta/pages/**'
      - 'tools/eldoria-private-beta/native/ux/ValoriaIntegratedWorld.cs.txt'
      - '.github/workflows/eldoria-pages-telemetry-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/eldoria-private-beta/pages/**'
      - 'tools/eldoria-private-beta/native/ux/ValoriaIntegratedWorld.cs.txt'
      - '.github/workflows/eldoria-pages-telemetry-tests.yml'
permissions:
  contents: read
concurrency:
  group: eldoria-pages-supabase-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    name: Validate opt-in event contract, CORS, source binding and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta/pages
            tools/eldoria-private-beta/native/ux/ValoriaIntegratedWorld.cs.txt
            tools/eldoria-private-beta/supabase/index.mjs
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact GitHub Pages QA Edge source without Unity or paid services
        run: |
          node --check tools/eldoria-private-beta/pages/edge-mobile16-qa.mjs
          node --check tools/eldoria-private-beta/pages/edge-function.mjs
          node --check tools/eldoria-private-beta/pages/client.mjs
          node --check tools/eldoria-private-beta/pages/signal-parser.mjs
          node --check tools/eldoria-private-beta/pages/pilot-bootstrap.mjs
          node --test tools/eldoria-private-beta/pages/*.test.mjs

      - name: Verify actual Supabase QA receipt from GitHub-hosted runner (no privileged credentials)
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {randomUUID} from 'node:crypto';
          const legacy=fs.readFileSync('tools/eldoria-private-beta/supabase/index.mjs','utf8');
          const publicKey=legacy.match(/const PUBLIC_KEY="(sb_publishable_[^"]+)"/)?.[1];
          if(!publicKey)throw Error('Existing public Supabase key not found in historical source');
          const event={
            client_event_id:randomUUID(),tester_id:randomUUID(),session_id:randomUUID(),
            event_name:'session_start',device_type:'other',elapsed_ms:0,
            payload:{stage_code:'pages_qa_smoke'},consent_given:true
          };
          const response=await fetch('https://eavaxwpxxcrwibooiimb.supabase.co/functions/v1/eldoria-pages-events-qa',{
            method:'POST',headers:{Origin:'https://mt5hjfz2kb-lab.github.io','apikey':publicKey,'Content-Type':'application/json'},
            body:JSON.stringify(event),redirect:'error'
          });
          if(response.status!==202)throw Error('Supabase QA edge did not persist event, status '+response.status+': '+(await response.text()).slice(0,120));
          console.log('ELDORIA_PAGES_SUPABASE_REAL_QA_202',event.client_event_id);
          JS

      - name: Verify dedicated current Mobile16 QA transport without claiming a Unity journey
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {randomUUID,createHash} from 'node:crypto';
          const client=fs.readFileSync('tools/eldoria-private-beta/pages/client.mjs','utf8');
          const key=client.match(/export const PUBLISHABLE='([^']+)'/)?.[1];
          if(!key)throw Error('Existing public client key missing');
          const source=fs.readFileSync('tools/eldoria-private-beta/pages/edge-mobile16-qa.mjs','utf8');
          const event={client_event_id:randomUUID(),tester_id:randomUUID(),session_id:randomUUID(),
            event_name:'world_opened',device_type:'other',elapsed_ms:0,
            payload:{reason_code:'TRANSPORT_FIXTURE_NOT_UNITY'},consent_given:true};
          const origin='https://mt5hjfz2kb-lab.github.io';
          const checks=[];
          async function send(label,body,expected,requestOrigin=origin){
            const r=await fetch('https://eavaxwpxxcrwibooiimb.supabase.co/functions/v1/eldoria-mobile16-events-qa',{
              method:'POST',headers:{Origin:requestOrigin,apikey:key,'Content-Type':'application/json'},
              body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(20000)});
            checks.push({case:label,status:r.status,expected});
            if(r.status!==expected)throw Error('Mobile16 QA transport '+label+' status '+r.status);
          }
          await send('no_consent',{...event,consent_given:false},422);
          await send('spoofed_source',{...event,source_sha:'forged'},422);
          await send('wrong_origin',event,403,'https://example.invalid');
          await send('accepted',event,202);
          await send('same_uuid_retry',event,202);
          fs.writeFileSync('mobile16-qa-transport.json',JSON.stringify({
            synthetic_transport_only:true,not_unity_journey:true,source_sha:process.env.GITHUB_SHA,
            edge_source_sha256:createHash('sha256').update(source).digest('hex'),event,checks
          },null,2));
          console.log('ELDORIA_MOBILE16_QA_REAL_202_AND_REJECTIONS',event.client_event_id);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile16-qa-transport-${{ github.sha }}
          path: mobile16-qa-transport.json
          if-no-files-found: warn
