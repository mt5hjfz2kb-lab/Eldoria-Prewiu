name: "[ART FIRE FLOOR6] Two real emissive translucent flames on CC0 props"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-flame-two-v7.yml'
      - 'tools/valoria-modular-fortress/flame_rebuild_two_v7.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-two-fire-props-only-v7
  cancel-in-progress: false
jobs:
  fire-two-standalone-assets:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    steps:
      - name: Locate native Git and Blender
        id: binaries
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Local Git absent'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender absent'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-four-weak-art-recovery-38870740573
          run-id: 38870740573
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/torches-before
      - name: Model translucent real fire tongues, preserve 2 props and compare camera
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'torches-before\eldoria-four-art-recovery\glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-two-fire-props-repair'
          foreach($asset in @('torch_wall','brazier_pedestal')){
            if(-not(Test-Path (Join-Path $src "$asset.glb"))){throw "Source $asset missing"}
          }
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/flame_rebuild_two_v7.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned code unavailable'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-two-actual-flames-v7.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-fire-v7.stdout'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-fire-v7.stderr'
          $p=Start-Process -FilePath "${{ steps.binaries.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 65 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Two game flame assets failed: $($p.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 2){throw "Expected 2 fire results in $folder, got $count"}
          }
      - name: Archive real separate flame GLBs, A-B images, without Unity approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-two-emissive-actual-fires-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-two-fire-props-repair/**
            ${{ runner.temp }}/eldoria-fire-v7.stdout
            ${{ runner.temp }}/eldoria-fire-v7.stderr
          if-no-files-found: warn
          retention-days: 30
