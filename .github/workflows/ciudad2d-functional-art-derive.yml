name: Ciudad2D - generar candidato Cuartel entrenamiento aislado
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths:
      - Unity/Assets/Experimentos/Ciudad2D/QA/derive_training_targets_v1.py
permissions:
  contents: write
concurrency:
  group: ciudad2d-functional-art-ubuntu
  cancel-in-progress: false
jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Experimentos/Ciudad2D/QA/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact generation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pillow==11.3.0 opencv-python-headless==4.13.0.92
      - name: Generate independently versioned RGBA target, contact shadow and alpha QA
        shell: bash
        run: |
          set -euo pipefail
          python Unity/Assets/Experimentos/Ciudad2D/QA/derive_training_targets_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('Unity/Assets/Experimentos/Ciudad2D/QA')
          m=json.loads((r/'CuartelEntrenamientoV1_Manifest.json').read_text())
          assert m['schema']==1 and m['Unity']=='PENDING'
          assert m['main_modified'] is False and m['gameplay_modified'] is False
          assert m['separate_alpha'] and m['no_square_platform']
          print('CUARTEL_TRAINING_NOT_ART_ACCEPTED_SHA_VERIFIED')
          PY
      - name: Commit only new candidate assets and QA, never touch originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cuartel_Entrenamiento_RecorteV1*.png Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Cuartel_Entrenamiento_RecorteV1*.meta Unity/Assets/Experimentos/Ciudad2D/QA/CuartelEntrenamientoV1*
          git diff --cached --quiet && { echo 'No new candidate'; exit 1; }
          git commit -m 'art(ciudad2d): archive isolated warm-shadow Cuartel training targets and four matte QA backgrounds'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
