name: Bastion I replay validated Qwen backdrop in Blender
on:
  workflow_dispatch:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths:
      - '.github/workflows/valoria-bastion1-qwen-finishing.yml'
      - 'tools/valoria-bastion1-finishing/backdrop_author.py'
      - 'tools/valoria-bastion1-finishing/backdrop_execute.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion1-qwen-finishing
  cancel-in-progress: false
jobs:
  genuine-artist-mountain:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      ART_ROOT: /tmp/bastion1-mountain-artist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reuse exact prior Qwen artistic plan and source without repeated inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ART_ROOT"
          gh run download 38433446558 --repo "${{ github.repository }}" --name bastion1-genuine-qwen-mountain-38433446558 --dir "$ART_ROOT"
          python3 - <<'PY'
          import os,pathlib,hashlib,json
          root=pathlib.Path(os.environ["ART_ROOT"])
          plan=root/"mountain-plan.json"
          proof=json.loads((root/"mountain-inference-proof.json").read_text())
          raw=root/f"raw-mountain-attempt-{proof['attempt']}.json"
          assert hashlib.sha256(plan.read_bytes()).hexdigest()==proof["plan_sha256"]
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==proof["raw_sha256"]
          assert json.loads(json.loads(raw.read_text())["message"]["content"])==json.loads(plan.read_text())
          assert hashlib.sha256((root/"source.glb").read_bytes()).hexdigest()=="9cf0fa48e93df288ed8b86409102c413e9fc22339f1126a79d4ec3f728fd18b1"
          assert proof["model"]=="qwen3-vl:8b-instruct" and proof["parameters_modified"] is False
          print("EXACT_QWEN_PRIOR_PLAN_AND_GLTF_REUSED inference_run=38433446558 no_new_inference=True sha="+proof["plan_sha256"])
          PY
      - name: Install Blender including its missing NumPy import dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          blender --version | head -2
          blender -b --python-expr 'import numpy as np; print("BLENDER_NUMPY_READY",np.__version__)' | grep BLENDER_NUMPY_READY
      - name: Execute original artist plan unchanged in Blender on existing mountain and water
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python tools/valoria-bastion1-finishing/backdrop_execute.py -- --root "$ART_ROOT"
          python3 - <<'PY'
          import os,pathlib,json,hashlib
          root=pathlib.Path(os.environ["ART_ROOT"])
          output=root/"edited-mountain"/"Bastion1MountainQwen.glb"
          p=json.loads((root/"edited-mountain"/"mountain-execution-proof.json").read_text())
          assert output.exists() and output.stat().st_size>1000000
          assert hashlib.sha256(output.read_bytes()).hexdigest()==p["output_glb_sha256"]
          assert p["other_mesh_coordinates_preserved"] and p["architecture_and_ground_unchanged"]
          assert p["ai_parameters_modified"] is False
          print("BLENDER_MOUNTAIN_EDITORIAL_EXECUTION_PASS",json.dumps(p))
          PY
      - name: Preserve editable .blend, source GLB and genuine artist evidence for separate Unity A/B
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-qwen-mountain-replay-${{ github.run_id }}
          path: |
            /tmp/bastion1-mountain-artist/mountain-plan.json
            /tmp/bastion1-mountain-artist/mountain-inference-proof.json
            /tmp/bastion1-mountain-artist/raw-mountain-attempt-*.json
            /tmp/bastion1-mountain-artist/mountain-reject-*.txt
            /tmp/bastion1-mountain-artist/edited-mountain/**
            /tmp/bastion1-mountain-artist/source.glb
            /tmp/bastion1-mountain-artist/*-vision.jpg
          retention-days: 14
