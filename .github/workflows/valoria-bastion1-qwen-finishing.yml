name: Bastion I genuine Qwen8B rock and turf finishing
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths: ['.github/workflows/valoria-bastion1-qwen-finishing.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion1-qwen-finishing
  cancel-in-progress: false
jobs:
  author-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      FINISH: /tmp/bastion1-qwen-finish
    steps:
      - uses: actions/checkout@v4
      - name: Recover completed genuine finishing without repeating inference or geometry
        run: |
          mkdir -p "$FINISH"
          gh run download 38406612333 --repo "${{ github.repository }}" --name bastion1-genuine-qwen-finishing-38406612333 --dir "$FINISH"
      - name: Transfer original artist RGB factors lost by the exporter
        run: python3 tools/valoria-bastion1-finishing/fix_exported_factors.py --root "$FINISH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-genuine-qwen-finishing-${{ github.run_id }}
          path: |
            /tmp/bastion1-qwen-finish/factor-corrected/**
            /tmp/bastion1-qwen-finish/edited/*.blend
            /tmp/bastion1-qwen-finish/*proof.json
            /tmp/bastion1-qwen-finish/source-provenance.json
            /tmp/bastion1-qwen-finish/artist-plan.json
            /tmp/bastion1-qwen-finish/raw-attempt-*.json
            /tmp/bastion1-qwen-finish/reject-attempt-*.txt
            /tmp/bastion1-qwen-finish/*-vision.jpg
          retention-days: 14
