name: Release stale Pages runner occupancy
# bootstrap-priority-refresh-static
# bootstrap-priority-refresh-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stale-pages-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale in-progress Pages runs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100
            });
            const stale = runs.filter(r =>
              (r.path === '.github/workflows/pages.yml' && r.status === 'in_progress' && r.head_sha !== context.sha) ||
              (r.path === '.github/workflows/ui-progression-cert.yml' && (r.status === 'queued' || r.status === 'in_progress'))
            );
            core.info(`Found ${stale.length} stale/blocking run(s).`);
            for (const run of stale) {
              core.info(`Cancelling blocking run ${run.id} (${run.name}) at ${run.head_sha}.`);
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
            }
