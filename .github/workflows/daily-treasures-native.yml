).Groups[1].Value)
          }
          if($guids[0] -eq $guids[1]){throw 'Both art frames accidentally share a Unity GUID'}
          Write-Host 'DAILY_TREASURE_AUTHORED_PNG_BYTES_AND_IMPORTERS_PASS'
      - name: Capture calendar, closed chest and real paid opened chest at four sizes
        working-directory: daily-source
