name: Tesoros de Valoria — native component proof (exclusive lease only)
on:
  workflow_dispatch:
  push:
    branches: [feature/eldoria-daily-treasures-20261108]
    paths: [tools/daily-treasures/native-request.txt]
permissions:
  contents: read
concurrency:
  group: eldoria-daily-treasures-native
  cancel-in-progress: false
jobs:
  exclusive-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Refuse Windows execution while another workstream holds it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Eldoria-daily-treasure-owner'}
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/pipeline/active-workstreams.json?ref=main'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as f: raw=json.load(f)
          data=json.loads(base64.b64decode(raw['content']))
          current=[x for x in data['active'] if 'windows-runner-heavy' in x.get('resources',[])]
          assert len(current)==1 and current[0]['id']=='eldoria-daily-treasures-20261108', 'Native Unity reserved for a different Eldoria owner'
          assert current[0].get('ownership_state')=='claimed' and current[0].get('owner')=='chatgpt-daily-treasures-20261108'
          print('DAILY_EXCLUSIVE_NATIVE_LEASE_PASS',current[0].get('ownership_revision'))
          PY
  native:
    needs: exclusive-lease
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    env:
      OUT: ${{ github.workspace }}\daily-native-${{ github.run_id }}
    steps:
      - name: Verify executable and no Unity or Blender process is occupied
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unity or Blender already in use; do not interrupt'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Correct Unity editor not installed'}
      - uses: actions/checkout@v4
        with:
          path: daily-source
          clean: false
          lfs: false
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            Unity
      - name: Verify exact branch SHA and exclusive current ownership a second time
        working-directory: daily-source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Source SHA changed'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'User-Agent'='Eldoria-daily-native'}
          $blob=Invoke-RestMethod -Uri 'https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/contents/pipeline/active-workstreams.json?ref=main' -Headers $headers
          $reg=([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($blob.content)))|ConvertFrom-Json
          $owners=@($reg.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($owners.Count -ne 1 -or $owners[0].id -ne 'eldoria-daily-treasures-20261108' -or $owners[0].owner -ne 'chatgpt-daily-treasures-20261108'){throw 'Unity resource ownership changed'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'A native process is already active'}
      - name: Verify original authored chest PNGs and Unity import metadata before using the Editor
        working-directory: daily-source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir='Unity/Assets/Eldoria/DailyTreasures/Resources/DailyTreasureArt'
          $expected=@{
            'treasure_closed_512.png'='313c17d35dcb6f44129a143fabc0448e5a20bc3fb7d00f700394bb73b2d0a0dd'
            'treasure_opened_512.png'='a75afb45b6183d0a8d7e2841c82ef13b812d08fb7620f90c849e679f24429ccb'
          }
          $guids=@()
          foreach($entry in $expected.GetEnumerator()){
            $png=Join-Path $dir $entry.Key
            if(-not (Test-Path $png)){throw "Approved art PNG not imported: $png"}
            $sha=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -ne $entry.Value){throw "Artwork bytes differ from reviewed source: $png"}
            $meta=$png+'.meta'
            if(-not (Test-Path $meta)){throw "Missing stable Unity sprite importer: $meta"}
            $info=Get-Content $meta -Raw
            if(-not ($info -match 'textureType: 8') -or -not ($info -match 'spriteMode: 1')){
              throw "Source image must be a single Unity Sprite: $meta"
            }
            if(-not ($info -match '(?m)^guid: ([0-9a-f]{32})
        shell: powershell
        timeout-minutes: 50
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force $env:OUT|Out-Null
          $log=Join-Path $env:OUT 'native.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',(Join-Path (Get-Location).Path 'Unity'),
            '-executeMethod','Eldoria.DailyTreasures.Editor.DailyTreasureNativeEvidence.Capture','-logFile',$log)
          $process=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          $src=Join-Path (Get-Location).Path 'Unity/DailyTreasureNativeEvidence'
          if(Test-Path $src){Copy-Item (Join-Path $src '*') $env:OUT -Force -Recurse}
          if($process.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 100};throw "Unity exit $($process.ExitCode)"}
          $path=Join-Path $env:OUT 'report.json'
          if(-not(Test-Path $path)){throw 'Missing real native report'}
          $report=Get-Content $path -Raw|ConvertFrom-Json
          if($report.status -ne 'NATIVE_COMPONENT_RENDERED_WITH_AUTHORED_SPRITES_ART_REVIEW_PENDING' -or
             $report.authoredSpritesImported -ne $true){throw 'Illustrated chest sprites not imported in Unity. Fallback cannot count as premium art proof.'}
          if($report.images -ne 12 -or $report.realGatewayClaims -ne 4 -or
             $report.graphicalPointerHits -ne 4){throw 'Real Unity component/pointer proof incomplete'}
          if(@(Get-ChildItem $env:OUT -Filter '*.png').Count -ne 12){throw 'Missing original Unity PNGs'}
          Write-Host 'DAILY_NATIVE_COMPONENT_PASS; separate city/gameplay/art/device validation REQUIRED'
      - name: Preserve original Unity screenshots and error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-treasures-native-${{ github.sha }}
          path: ${{ github.workspace }}\daily-native-${{ github.run_id }}\
          retention-days: 30
          if-no-files-found: warn
