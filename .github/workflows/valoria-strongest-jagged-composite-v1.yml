name: "[EXPERIMENT] Valoria Strongest Jagged Composite v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaStrongestJaggedCompositeGateV1.cs'
      - 'pipeline/valoria-strongest-jagged-composite-v1-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-strongest-jagged-composite-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage verified CC0 jagged-peaks backplate
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\SkyCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dst=Join-Path $dir 'jagged_peaks_valley.jpg'
          $sources=@(
            'https://web.archive.org/web/20170703112122id_/https://images.unsplash.com/photo-1484383364429-7ae3d3e9a125',
            'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Jagged_peaks_over_a_valley_%28Unsplash%29.jpg/1280px-Jagged_peaks_over_a_valley_%28Unsplash%29.jpg',
            'https://upload.wikimedia.org/wikipedia/commons/2/2e/Jagged_peaks_over_a_valley_%28Unsplash%29.jpg'
          )
          $headers=@{'User-Agent'='Eldoria-Valoria-Convergence/1.0 (CC0 asset validation)'}
          $ok=$false
          foreach($url in $sources){
            for($attempt=1;$attempt -le 2;$attempt++){
              try{
                Remove-Item $dst -Force -ErrorAction SilentlyContinue
                Write-Host "Jagged Peaks source=$url attempt=$attempt"
                Invoke-WebRequest -Uri $url -Headers $headers -OutFile $dst -UseBasicParsing -TimeoutSec 90
                if(Test-Path $dst){
                  $bytes=(Get-Item $dst).Length
                  Write-Host "Jagged Peaks bytes=$bytes"
                  if($bytes -gt 250000){$ok=$true;break}
                }
              } catch {
                Write-Warning $_.Exception.Message
                Start-Sleep -Seconds (2*$attempt)
              }
            }
            if($ok){break}
          }
          if(-not $ok){
            Write-Host 'Jagged Peaks transports unavailable; falling back to Poly Haven Kiara 7 Late-Afternoon CC0 backplate.'
            $api=Invoke-RestMethod -Uri 'https://api.polyhaven.com/files/kiara_7_late-afternoon' -Headers $headers
            $json=$api | ConvertTo-Json -Depth 50
            $urls=[regex]::Matches($json,'https://[^"]+\\.jpg[^"]*') | ForEach-Object { $_.Value.Replace('\\u0026','&') } | Select-Object -Unique
            $url=$urls | Where-Object { $_ -match 'Backplates|backplate|jpg_pretty' } | Select-Object -First 1
            if(-not $url){$url=$urls | Select-Object -First 1}
            if(-not $url){throw 'No CC0 mountain-valley JPG could be resolved from Poly Haven.'}
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $dst -UseBasicParsing -TimeoutSec 90
            if(-not (Test-Path $dst) -or (Get-Item $dst).Length -lt 250000){throw 'Poly Haven fallback image invalid.'}
          }
      - name: Capture integrated strongest jagged composite
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaStrongestJaggedCompositeV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaStrongestJaggedCompositeV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaStrongestJaggedCompositeGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(24)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-strongest-jagged-composite-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaStrongestJaggedCompositeV1Captures/*
            ${{ runner.temp }}/ValoriaStrongestJaggedCompositeV1.log
          if-no-files-found: warn
          retention-days: 30
