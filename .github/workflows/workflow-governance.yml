name: Workflow governance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/check-workflow-governance.mjs'
      - 'AGENTS.md'
      - 'docs/ELDORIA_DEVELOPMENT_PIPELINE_V2.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/check-workflow-governance.mjs'

permissions:
  contents: read

concurrency:
  group: eldoria-workflow-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Enforce workflow governance
        run: node tools/check-workflow-governance.mjs
