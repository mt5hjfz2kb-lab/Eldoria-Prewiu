name: "[ART SCULPT] Three highest-potential Valoria ashlar assets"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-ashlar-3-uplift.yml'
      - 'tools/valoria-modular-fortress/sculpt_three_ashlars.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-ashlar-three-isolated-sculpt
  cancel-in-progress: false
jobs:
  sculpt-and-photograph:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 60
    steps:
      - name: Confirm installed Blender and Git
        shell: powershell
        id: exes
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'No Git'}
            $dir=Split-Path $git
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/valoria-ashlar-source63
      - name: Sculpt and render 3 individual limestone modules
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'valoria-ashlar-source63\eldoria-upgrade63\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-ashlar-three-sculpt'
          if(-not(Test-Path (Join-Path $src 'stone_ashlar_01.glb'))){throw 'Missing unmodified 63-asset original'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/sculpt_three_ashlars.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned sculpt script unavailable'}
          $script=Join-Path $env:RUNNER_TEMP 'valoria-three-ashlars.py'
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'valoria-three-ashlars.stdout.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-three-ashlars.stderr.log'
          $proc=Start-Process -FilePath "${{ steps.exes.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Blender sculpt exit $($proc.ExitCode)"}
          $glbs=(Get-ChildItem (Join-Path $out 'glb') -Filter '*.glb').Count
          $before=(Get-ChildItem (Join-Path $out 'before') -Filter '*.png').Count
          $after=(Get-ChildItem (Join-Path $out 'after') -Filter '*.png').Count
          if($glbs -ne 3 -or $before -ne 3 -or $after -ne 3){throw "Wrong 3+3+3 output $glbs $before $after"}
      - name: Preserve three sculpt candidates with truthful pending-art status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-three-stones-sculpted-blender-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-ashlar-three-sculpt/**
            ${{ runner.temp }}/valoria-three-ashlars.stdout.log
            ${{ runner.temp }}/valoria-three-ashlars.stderr.log
          retention-days: 30
          if-no-files-found: warn
