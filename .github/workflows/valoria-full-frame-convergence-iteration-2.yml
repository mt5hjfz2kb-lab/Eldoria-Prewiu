name: "[EXPERIMENT] Valoria Full-Frame Convergence Iteration 2"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaFullFrameConvergenceIteration2.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaFullFrameConvergenceGateV2.cs'
      - 'pipeline/valoria-full-frame-convergence-iteration-2-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-full-frame-convergence-iteration-2
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore canonical Unity source while preserving Library cache
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
          $dirty = git status --porcelain --untracked-files=all -- Unity/Assets Unity/Packages Unity/ProjectSettings
          if($dirty){ Write-Host $dirty; throw 'Unity source cleanup did not converge to canonical Git state.' }
      - name: Capture full-frame iteration 2
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaFullFrameConvergenceIteration2Captures"
          $log="$env:RUNNER_TEMP\ValoriaFullFrameConvergenceIteration2.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaFullFrameConvergenceGateV2.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(20)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 280};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
          Get-Content (Join-Path $folder 'before-metrics.json')
          Get-Content (Join-Path $folder 'after-metrics.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-full-frame-convergence-iteration-2-${{ github.run_id }}
          path: |
            Unity/ValoriaFullFrameConvergenceIteration2Captures/*
            ${{ runner.temp }}/ValoriaFullFrameConvergenceIteration2.log
          if-no-files-found: warn
          retention-days: 30
