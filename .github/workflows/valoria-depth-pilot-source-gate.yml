name: Valoria depth pilot - isolated immutable V6 source and C-sharp syntax
on:
  push:
    branches:
      - art/valoria-25d-profundidad-piloto
    paths:
      - 'Unity/Assets/Experimentos/Ciudad2DDepthPilot/**'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DDepthSkyMotion.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DGroundedActivity.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/Editor/City2DDepthPilotEvidence.cs'
      - 'tools/valoria-depth-pilot/**'
      - 'docs/valoria-depth-pilot/**'
      - '.github/workflows/valoria-depth-pilot-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valoria-depth-pilot-source-only
  cancel-in-progress: false
jobs:
  read-only-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Experimentos/Ciudad2DDepthPilot/
            /Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DDepthSkyMotion.cs
            /Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DGroundedActivity.cs
            /Unity/Assets/Experimentos/Ciudad2D/Scripts/Editor/City2DDepthPilotEvidence.cs
            /Unity/Assets/Experimentos/Ciudad2D/QA/ArchivedScenes/Experimento_Ciudad2D_PremiumV6_44133747143.unity
            /tools/valoria-depth-pilot/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned read-only C-sharp parser
        run: python -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.5
      - name: Validate V6 exact bytes, source confinement and syntax
        run: python tools/valoria-depth-pilot/verify.py --source
      - name: Deliberately do not run Unity or acquire Windows
        run: |
          echo 'SOURCE_GATE_ONLY: no Unity compile, no rendered frame, no art approval'
          echo 'Exclusive Windows lease and in-progress integration remain untouched.'
