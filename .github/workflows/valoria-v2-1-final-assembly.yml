name: Valoria V2.1 composition with real Hero V3
on:
  push:
    branches: [art/valoria-asset-family-v2-ai-authorship-20261011]
    paths: ['.github/workflows/valoria-v2-1-final-assembly.yml','tools/art-rd/valoria_asset_family_v2_1_assemble.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Wait for AI-led seven-asset second pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          blender_run=38174276796
          test -n "$blender_run" && test "$blender_run" != "null"
          echo "BLENDER_RUN_ID=$blender_run" >> "$GITHUB_ENV"
          echo "Waiting for latest Blender second pass: $blender_run"
          for i in $(seq 1 75); do
            state=$(gh api "repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/$blender_run" --jq '.status+" "+(.conclusion//"pending")')
            echo "BlenderMCP: $state"
            if [[ "$state" == 'completed success' ]]; then exit 0; fi
            if [[ "$state" == completed* ]]; then exit 1; fi
            sleep 60
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-family-v2-1-real-qwen-mcp-second-art-pass
          run-id: ${{ env.BLENDER_RUN_ID }}
          github-token: ${{ github.token }}
          path: art-source/valoria/production/asset-family-v2
      - name: Install free Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy python3-pil
      - name: Actual V3 plus all seven AI-edited assets in one real scene
        run: blender -b --python-exit-code 1 -t 4 --python tools/art-rd/valoria_asset_family_v2_1_assemble.py
      - name: Assert both real matched scenes exist
        run: |
          ROOT=art-source/valoria/production/asset-family-v2
          test -s "$ROOT/assembled-v2-1.blend"
          test -s "$ROOT/assembled-v2-1-hero.png"
          test -s "$ROOT/assembled-v2-1-strategic.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-v2-1-composition-real-v3-all-seven
          path: |
            art-source/valoria/production/asset-family-v2/assembled-v2-1.blend
            art-source/valoria/production/asset-family-v2/assembled-v2-1-hero.png
            art-source/valoria/production/asset-family-v2/assembled-v2-1-strategic.png
            art-source/valoria/production/asset-family-v2/assembled-v2-1-report.json
          retention-days: 30
