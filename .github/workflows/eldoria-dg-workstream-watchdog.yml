name: Eldoria DG workstream watchdog
on:
  push:
    branches: [main]
    paths:
      - 'tools/eldoria-workstream-watchdog.mjs'
      - 'tests/eldoria-dg-accountability-watchdog.test.mjs'
      - 'pipeline/active-workstreams.json'
      - '.github/workflows/eldoria-dg-workstream-watchdog.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: eldoria-dg-workstream-watchdog
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DG accountability, department ownership and runner safety
        run: node --test tests/eldoria-dg-accountability-watchdog.test.mjs
      - name: Detect abandoned or blocked workstreams
        run: node tools/eldoria-workstream-watchdog.mjs > watchdog-report.json
      - name: Run existing M16 dependency coordinator on the SAME persistent DG schedule
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/eldoria-coordinator-v1.test.cjs
          node tools/eldoria-coordinator-v1.cjs > m16-dependency-report.json
          jq -e '.schema_version==1 and (.verdict=="BLOCKED_NO_HANDOFF" or .verdict=="READY_FOR_QA_HANDOFF_REVIEW")' m16-dependency-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-dg-workstream-watchdog
          path: |
            watchdog-report.json
            m16-dependency-report.json
      - name: Report new findings to existing Directorate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -e '.schema_version==1 and .kind=="READ_ONLY_DG_TRIAGE" and (.findings|type=="array")' watchdog-report.json >/dev/null
          # Paginate once to a file: grep -q against a live pipeline can SIGPIPE gh
          # under pipefail and inadvertently post duplicate BLOCKED/STALE alerts.
          comments_file="$(mktemp)"
          trap 'rm -f "$comments_file"' EXIT
          gh api "repos/$GH_REPO/issues/23/comments?per_page=100" --paginate --jq '.[].body' > "$comments_file"
          jq -c '.findings[]' watchdog-report.json | while IFS= read -r finding; do
            id=$(jq -r '.id' <<<"$finding")
            status=$(jq -r '.status' <<<"$finding")
            marker="ELDORIA_DG_WATCHDOG_${id}_${status}"
            if grep -Fq -- "$marker" "$comments_file"; then continue; fi
            body=$(printf '### DG — vigilancia automática de workstream\n\n%s\n\nEstado: **%s**\nWorkstream: `%s`\n\nEste aviso es solo detección, NO es prueba de cierre ni permiso para crear una misión, reintentar indefinidamente o gastar créditos. Dirección General debe reconciliar el estado real y actuar bajo la autorización existente.' "$marker" "$status" "$id")
            gh api "repos/$GH_REPO/issues/23/comments" -f body="$body" >/dev/null
          done
