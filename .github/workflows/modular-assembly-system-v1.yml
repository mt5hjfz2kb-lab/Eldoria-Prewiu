name: "[EXPERIMENT] Valoria Modular Assembly System v1"

on:
  push:
    branches: ['visual-proof/modular-assembly-system-v1']
    paths:
      - 'Unity/Assets/Eldoria/ArtTests/ModularAssemblySystem/**'
      - '.github/workflows/modular-assembly-system-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: modular-assembly-system-v1
  cancel-in-progress: true

jobs:
  proof:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Recover exact optimized Hero Bastion
        shell: powershell
        run: |
          $artifactId=11143009723
          $expected='afb6cee6ae572b0879650f18285b32798e263c17359a158ffe2bdd03fb62ad5c'
          $root="$env:RUNNER_TEMP\modular-assembly-source"; $zip="$root.zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -Headers $headers -OutFile $zip -MaximumRedirection 10
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $matches=@()
          foreach($file in Get-ChildItem $root -Recurse -File -Filter '*.glb'){
            $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -eq $expected){$matches += $file}
          }
          if($matches.Count -ne 1){throw "Expected one Hero Bastion GLB; found $($matches.Count)"}
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\HeroBastionGenerated"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $matches[0].FullName (Join-Path $dest 'Valoria_HeroBastion_v1.glb') -Force

      - name: Verify Unity
        shell: powershell
        run: |
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH not found'}
          $version=& $env:UNITY_EDITOR_PATH -version
          if($version -notmatch '6000\.3\.23f1'){throw "Wrong Unity version: $version"}

      - name: Capture Modular Assembly System
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ModularAssemblySystemCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-ModularAssemblySystem.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ModularAssemblySystemGate.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(18)
          while(-not $p.HasExited -and (Get-Date) -lt $deadline){Start-Sleep -Seconds 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;if(Test-Path $log){Get-Content $log -Tail 300};throw 'Proof timed out.'}
          $p.Refresh()
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "Proof failed: $($p.ExitCode)"}
          $expected=@('baseline-19.png','baseline-12.png','baseline-9.png','baseline-mobile.png','assembly-19.png','assembly-12.png','assembly-9.png','assembly-mobile.png','modular-assembly-evidence.json')
          foreach($name in $expected){
            $path=Join-Path $folder $name
            if(-not(Test-Path $path)){throw "Missing output: $name"}
            if($name.EndsWith('.png') -and (Get-Item $path).Length -lt 10000){throw "Empty capture: $name"}
          }
          $variants=Get-ChildItem $folder -Filter 'variant-*.png'
          if($variants.Count -lt 5){throw "Expected 5 variant captures; found $($variants.Count)"}
          Get-Content (Join-Path $folder 'modular-assembly-evidence.json')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-assembly-system-v1-${{ github.run_id }}
          path: |
            Unity/ModularAssemblySystemCaptures/*
            ${{ runner.temp }}/Eldoria-ModularAssemblySystem.log
          if-no-files-found: warn
          retention-days: 14
