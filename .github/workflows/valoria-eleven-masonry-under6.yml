name: "[ART QUALITY TOWERS] Eleven cropped CC0 stone tower wall masonry modules"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-eleven-masonry-under6.yml'
      - 'tools/valoria-modular-fortress/eleven_architecture_pbr_stone.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-eleven-independent-architectural-stones
  cancel-in-progress: false
jobs:
  photo-stone-eleven:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 130
    steps:
      - name: Discover local installed Git and Blender
        shell: powershell
        id: native
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'No Blender'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/arch-original-63
      - uses: actions/download-artifact@v4
        with:
          name: valoria-3-real-medieval-wall-pbr-38860976002
          run-id: 38860976002
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/arch-masonry-cc0
      - name: Individual Blender 11 assets, 22 native captures, valid GLBs and source hashes
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'arch-original-63\eldoria-upgrade63\glb'
          $maps=Join-Path $env:RUNNER_TEMP 'arch-masonry-cc0'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-eleven-architecture-pbr'
          if(-not(Test-Path (Join-Path $base 'tower_square_tall.glb'))){throw 'Baseline tall tower missing'}
          if(-not(Test-Path (Join-Path $maps 'medieval_blocks_03_diffuse.jpg'))){throw 'Official stone imagery missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/eleven_architecture_pbr_stone.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned artist process missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-eleven-architecture.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-eleven-architecture.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-eleven-architecture.err'
          $proc=Start-Process -FilePath "${{ steps.native.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$base,$maps,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 150 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "11 native photo masonry assets failure $($proc.ExitCode)"}
          foreach($f in @('glb','before','after')){
            $n=(Get-ChildItem (Join-Path $out $f) -File).Count
            if($n -ne 11){throw "Expected 11 $f, got $n"}
          }
      - name: Archive original and PBR-improved models without artistic automatic approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-eleven-under6-masonry-a-b-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-eleven-architecture-pbr/**
            ${{ runner.temp }}/eldoria-eleven-architecture.log
            ${{ runner.temp }}/eldoria-eleven-architecture.err
          if-no-files-found: warn
          retention-days: 30
