name: "[EXPERIMENT] Valoria Master Visual Rebuild v2"

on:
  workflow_dispatch:
  push:
    branches: ['visual-proof/valoria-master-visual-rebuild-v2']
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaMasterVisualRebuildV2Gate.cs'
      - 'pipeline/art-production-request.json'
      - '.github/workflows/valoria-master-visual-rebuild-v2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: valoria-master-visual-rebuild-v2
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: {clean: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Toolchain Automation v2 route
        shell: powershell
        run: |
          node tools/plan-art-production.mjs pipeline/art-production-request.json "$env:RUNNER_TEMP\master-rebuild-plan.json"
          $p=Get-Content "$env:RUNNER_TEMP\master-rebuild-plan.json" | ConvertFrom-Json
          if($p.profile -ne 'environment_composition' -or $p.tripo_allowed -or $p.authorized_credit_cost -ne 0){throw 'Invalid rebuild route'}
      - name: Recover certified Hero Bastion existing asset
        shell: powershell
        run: |
          $artifactId=11143009723
          $expected='afb6cee6ae572b0879650f18285b32798e263c17359a158ffe2bdd03fb62ad5c'
          $root="$env:RUNNER_TEMP\hero-bastion-rebuild-source";$zip="$root.zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue;Remove-Item $zip -Force -ErrorAction SilentlyContinue
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -Headers $headers -OutFile $zip -MaximumRedirection 10
          New-Item -ItemType Directory -Force $root | Out-Null;Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $match=$null
          foreach($file in Get-ChildItem $root -Recurse -File -Filter '*.glb'){
            $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -eq $expected){$match=$file;break}
          }
          if(-not $match){throw 'Certified Hero Bastion artifact missing'}
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\HeroBastionGenerated"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $match.FullName (Join-Path $dest 'Valoria_HeroBastion_v1.glb') -Force
      - name: Capture current compact baseline vs blank-canvas rebuild
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaMasterVisualRebuildV2Captures";$log="$env:RUNNER_TEMP\Valoria-Master-Rebuild-v2.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-refreshImportMode','InProcess','-job-worker-count','1','-executeMethod','Eldoria.EditorTools.ValoriaMasterVisualRebuildV2Gate.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(22)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep -Seconds 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;if(Test-Path $log){Get-Content $log -Tail 350};throw 'Master rebuild gate timed out'}
          $p.Refresh();if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 450};throw "Master rebuild gate failed: $($p.ExitCode)"}
          foreach($n in @('before-19.png','before-12.png','before-9.png','before-mobile.png','after-19.png','after-12.png','after-9.png','after-mobile.png','evidence.json')){if(-not(Test-Path (Join-Path $folder $n))){throw "Missing $n"}}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-master-visual-rebuild-v2-${{ github.run_id }}
          path: |
            Unity/ValoriaMasterVisualRebuildV2Captures/*
            ${{ runner.temp }}/master-rebuild-plan.json
            ${{ runner.temp }}/Valoria-Master-Rebuild-v2.log
          if-no-files-found: warn
          retention-days: 14
