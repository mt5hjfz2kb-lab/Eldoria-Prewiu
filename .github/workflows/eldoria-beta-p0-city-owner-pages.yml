name: Vigilia nickname repair — preserve all other published routes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-p0-city-owner-pages.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-pages-p0-owner-recovery-archive-20261113
  cancel-in-progress: false
jobs:
  main-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the normal main Unity gate for the exact integrated game tree
        uses: actions/github-script@v7
        with:
          script: |
            const expected='da87e7d2b0ba03b3a9e6b8a521e1efbb38f286af';
            const deadline=Date.now()+85*60*1000;
            while(Date.now()<deadline){
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'unity-slice.yml',head_sha:expected,per_page:100})).data.workflow_runs;
              const run=runs.find(r=>r.head_sha===expected&&r.head_branch==='main'&&r.event==='push');
              if(run?.status==='completed'){
                if(run.conclusion!=='success')throw Error('Main source/editor gate failed: '+run.id);
                core.info('Exact main source/editor gate passed: '+run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw Error('Exact main gate did not complete; publication withheld');
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - name: Require the completed immutable stage and its actual browser proof
        uses: actions/github-script@v7
        with:
          script: |
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:43437420122})).data;
            if(run.head_sha!=='d0413956ab4e95c430682356f9794cac816a1492')throw Error('Wrong stage source');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:run.id,per_page:100})).data.jobs;
            for(const name of ['stage','staged-webkit'])if(!jobs.some(j=>j.name===name&&j.status==='completed'&&j.conclusion==='success'))throw Error('Stage/browser proof incomplete');
            for(const [id,name,digest] of [
              [14044505500,'integrated-verified-owner-stage','7d205893eac790f21949c01a2fd9c31b01fdd545f29bba3f63369e1584bb3639'],
              [14044105646,'integrated-owner-stage-proof','f6c504c6645f1fb03c7b005ea1dee5633e1a107595a79e39e982a575428bbf38'],
              [14045760494,'integrated-final-route-webkit','f3f31342047c28588e9e7c7ee737484366ea616f349c7c4f30939012d545cd08']]){
              const a=(await github.rest.actions.getArtifact({...context.repo,artifact_id:id})).data;
              if(a.expired||a.name!==name||a.digest!=='sha256:'+digest||a.workflow_run.id!==run.id)throw Error('Artifact identity changed');
            }
      - uses: actions/download-artifact@v4
        with:
          run-id: 43437420122
          name: integrated-verified-owner-stage
          github-token: ${{ github.token }}
          path: site
      - uses: actions/download-artifact@v4
        with:
          run-id: 43437420122
          name: integrated-owner-stage-proof
          github-token: ${{ github.token }}
          path: proof
      - name: Verify unchanged game tree and every file in the already tested site
        run: |
          git merge-base --is-ancestor a2e956e11bc837a081c3eab1eb05c8ff094f4e05 HEAD
          git diff --exit-code a2e956e11bc837a081c3eab1eb05c8ff094f4e05 HEAD -- Unity/
          python3 - <<'PYCODE'
          import json,pathlib,hashlib
          root=pathlib.Path('site'); proof=pathlib.Path('proof/integrated-owner-stage-proof.json')
          assert (root/proof.name).read_bytes()==proof.read_bytes()
          d=json.loads(proof.read_text())
          assert d['source_sha']=='a2e956e11bc837a081c3eab1eb05c8ff094f4e05'
          assert d['bundle_sha256']=='384f029c5dba1aa46b0cd1d324eb77dec73d5b833b83049b7bf0f68fffe9392c'
          expected=dict(d['preserved_fingerprints'])
          expected.update({d['candidate_route']+'/'+k:v for k,v in d['candidate_fingerprints'].items()})
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual==set(expected)|{proof.name}
          for name,v in expected.items():
              p=root/name; assert not p.is_symlink() and p.stat().st_size==v['bytes'],name
              with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==v['sha256'],name
          assert sum(p.stat().st_size for p in root.rglob('*') if p.is_file())==d['combined_bytes']<980000000
          print('EXACT_PREVIOUSLY_WEBKIT_TESTED_STAGE_REUSED_WITH_ALL_FILE_HASHES')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-verified-owner-stage
          path: site/
          include-hidden-files: true
          compression-level: 0
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-owner-stage-proof
          path: proof/integrated-owner-stage-proof.json
          retention-days: 90
  staged-webkit:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 43437420122
          name: integrated-final-route-webkit
          github-token: ${{ github.token }}
          path: browser
      - name: Reuse completed actual WebKit and construction proof for the identical stage
        run: |
          python3 - <<'PYCODE'
          import json,pathlib
          root=pathlib.Path('browser')
          d=json.loads((root/'report.json').read_text())
          assert d['passed'] and not d['errors']
          assert d['identity']['source_sha']=='a2e956e11bc837a081c3eab1eb05c8ff094f4e05'
          assert d['identity']['candidate_bundle_sha256']=='384f029c5dba1aa46b0cd1d324eb77dec73d5b833b83049b7bf0f68fffe9392c'
          assert d['entry']['reloaded']
          q=json.loads((root/'construction/report.json').read_text())
          assert q['source']==d['identity']['source_sha'] and q['passed'] and not q['errors']
          assert q['nicknameReloadVerified'] and q['constructionVerified'] and q['constructionReloadVerified'] and q['storyInk']['passed']
          print('REUSED_EXACT_IMMUTABLE_STAGE_BROWSER_PROOF_43437420122_NOT_NEW_BROWSER_RUN')
          PYCODE
  archive:
    needs: staged-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 43338146206
          name: github-pages
          github-token: ${{ github.token }}
          path: original-pages
      - uses: actions/download-artifact@v4
        with:
          name: integrated-owner-stage-proof
          path: proof
      - name: Retain and re-download the complete original site before any deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mt5hjfz2kb-lab/Eldoria-Prewiu
        run: |
          set -euo pipefail
          tag='archive-pages-before-nickname-repair-20261113'
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('original-pages/artifact.tar');d=json.load(open('proof/integrated-owner-stage-proof.json'))
          assert p.stat().st_size==d['original_pages_tar_bytes']
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==d['original_pages_tar_sha256']
          pathlib.Path('archive-notes.md').write_text('Complete original published Pages snapshot from run 43338146206, before nickname repair. Retains the original beta19 and every unrelated route for exact rollback. The tag anchors this archive operation on current main; the attached tar is the original published snapshot. Archive only; no new game release or device certification.\nSHA256: '+d['original_pages_tar_sha256']+'\n')
          PY
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --draft --title 'Archived Pages snapshot before nickname repair' --notes-file archive-notes.md
          fi
          mkdir recovered
          if ! gh release download "$tag" --pattern artifact.tar --dir recovered; then
            gh release upload "$tag" original-pages/artifact.tar
            gh release download "$tag" --pattern artifact.tar --dir recovered
          fi
          cmp original-pages/artifact.tar recovered/artifact.tar
          sha256sum recovered/artifact.tar > archive-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-durable-archive-verification
          path: archive-verified.txt
          retention-days: 90
  publish:
    needs: [main-source-tests, stage, staged-webkit, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integrated-verified-owner-stage
          path: site
      - name: Check current deployment and stable identities before replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/mt5hjfz2kb-lab/Eldoria-Prewiu/deployments?environment=github-pages&per_page=10' > current-deployment.json
          python3 -c "import json,os; d=[x for x in json.load(open('current-deployment.json')) if x['sha']!=os.environ['GITHUB_SHA']]; assert d and d[0]['sha']=='c9088d95d20c8a5cec9585dec56f20683bc0b12a', 'Published deployment changed; restage latest snapshot'"
          python3 - <<'PY'
          import json,urllib.request,pathlib,hashlib
          base='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/'
          proof=json.load(open('site/integrated-owner-stage-proof.json'))
          for route in proof['stable_routes_preserved']:
              for name in ('release-identity.json','build-manifest.json','index.html'):
                  path=route+'/'+name
                  with urllib.request.urlopen(base+path,timeout=60) as r: raw=r.read()
                  assert hashlib.sha256(raw).hexdigest()==proof['preserved_fingerprints'][path]['sha256'],path
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 21
      - uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verify live candidate, unchanged stable identities and staged file proof
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          base='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=60) as r:return r.read()
          proof=json.load(open('site/integrated-owner-stage-proof.json'))
          assert get('integrated-owner-stage-proof.json')==open('site/integrated-owner-stage-proof.json','rb').read()
          for route in proof['stable_routes_preserved']:
              for name in ('release-identity.json','build-manifest.json','index.html'):
                  path=route+'/'+name
                  assert hashlib.sha256(get(path)).hexdigest()==proof['preserved_fingerprints'][path]['sha256'],path
          identity=json.loads(get('beta-integrated-vigilia/release-identity.json'))
          assert identity['source_sha']==proof['source_sha'] and identity['candidate_bundle_sha256']==proof['bundle_sha256']
          assert not identity['release_for_external_testers'] and not identity['physical_mobile_tested']
          print('LIVE_VIGILIA_AND_UNCHANGED_BETA18_VERIFIED_NOT_PHYSICAL_IPHONE')
          PY
  public-webkit:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/art-direction/ai-authoring
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the deployed public route with actual WebKit and reload
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_EARLY_ENTRY: '1'
          QA_EARLY_NO_SCREENSHOT: '1'
          QA_RESIZE_STRESS: '1'
          QA_SKIP_PREFLIGHT: '1'
          QA_LAZY_WORLD: '1'
          QA_EXPECT_VIGILIA: '1'
          QA_REVISION: integrated-mobile19-owner-qa
          QA_EXPECT_ORIGIN: https://mt5hjfz2kb-lab.github.io
          QA_URL: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_diag=1&eldoria_profile=1&eldoria_p0_lazy_world=1
          QA_OUT: public-webkit-proof
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/integrated-browser-qa" --no-save playwright@1.55.0
          "$RUNNER_TEMP/integrated-browser-qa/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/integrated-browser-qa/node_modules"
          node tools/eldoria-private-beta/qa_webkit_residency.cjs
          swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$RUNNER_TEMP/eldoria-release-ocr"
          QA_EXPECT_SOURCE=a2e956e11bc837a081c3eab1eb05c8ff094f4e05 QA_REQUIRE_CONSTRUCTION=1 \
            QA_OCR_EXECUTABLE="$RUNNER_TEMP/eldoria-release-ocr" QA_OUT="$QA_OUT/construction" \
            node tools/eldoria-private-beta/qa_postnickname.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-public-webkit
          path: public-webkit-proof
          retention-days: 21
