name: Vigilia nickname repair — preserve all other published routes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-p0-city-owner-pages.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-pages-p0-owner-recovery-repair-20261113
  cancel-in-progress: false
jobs:
  main-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the normal main Unity gate for the exact integrated game tree
        uses: actions/github-script@v7
        with:
          script: |
            const expected='da87e7d2b0ba03b3a9e6b8a521e1efbb38f286af';
            const deadline=Date.now()+85*60*1000;
            while(Date.now()<deadline){
              const runs=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'unity-slice.yml',head_sha:expected,per_page:100})).data.workflow_runs;
              const run=runs.find(r=>r.head_sha===expected&&r.head_branch==='main'&&r.event==='push');
              if(run?.status==='completed'){
                if(run.conclusion!=='success')throw Error('Main source/editor gate failed: '+run.id);
                core.info('Exact main source/editor gate passed: '+run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw Error('Exact main gate did not complete; publication withheld');
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/art-direction/ai-authoring
          persist-credentials: false
      - name: Require exact completed native, browser and full gameplay certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='mt5hjfz2kb-lab/Eldoria-Prewiu'
          source='a2e956e11bc837a081c3eab1eb05c8ff094f4e05'
          git merge-base --is-ancestor "$source" HEAD
          git diff --exit-code "$source" HEAD -- Unity/
          for run in 43428539668 43433023729; do
            gh api "repos/$repo/actions/runs/$run" > "run-$run.json"
          done
          gh api "repos/$repo/actions/runs/43429097245" > actual-construction-run.json
          gh api "repos/$repo/actions/artifacts/13997924580" > previous-artifact.json
          python3 - <<'PY'
          import json
          for run in (43428539668,43433023729):
              d=json.load(open(f'run-{run}.json'))
              assert d['head_sha']=='a2e956e11bc837a081c3eab1eb05c8ff094f4e05'
              assert d['status']=='completed' and d['conclusion']=='success'
          gate=json.load(open('actual-construction-run.json'))
          assert gate['head_sha']=='6baf11c083e8fce926e1e2d13415b93f4d474dc1'
          assert gate['status']=='completed' and gate['conclusion']=='success'
          a=json.load(open('previous-artifact.json'))
          assert a['id']==13997924580 and not a['expired'] and a['name']=='github-pages'
          assert a['digest']=='sha256:2ebc8658bf2866de1883eaf41437d908be86bc1246a67cab03b5ac83728cd7ac'
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 43338146206
          name: github-pages
          github-token: ${{ github.token }}
          path: original-pages
      - uses: actions/download-artifact@v4
        with:
          run-id: 43428539668
          name: integrated-mobile19-owner-site-a2e956e11bc837a081c3eab1eb05c8ff094f4e05
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          run-id: 43428539668
          name: integrated-desktop-webkit-a2e956e11bc837a081c3eab1eb05c8ff094f4e05
          github-token: ${{ github.token }}
          path: browser
      - name: Verify exact payload and preserve stable routes before staging
        run: |
          python3 -m unittest discover -s tools/eldoria-private-beta -p test_integrated_owner_stage.py
          python3 tools/eldoria-private-beta/stage_integrated_owner_site.py --pages original-pages/artifact.tar --candidate candidate --browser browser --output site --work stage-work --replace-source fb8727d3ac45e31e61ab8ba244fa395477eff16e
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-verified-owner-stage
          path: site/
          include-hidden-files: true
          compression-level: 0
          retention-days: 21
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-owner-stage-proof
          path: site/integrated-owner-stage-proof.json
          retention-days: 90
  staged-webkit:
    needs: stage
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/art-direction/ai-authoring
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: integrated-verified-owner-stage
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exact final route through actual WebKit before publication
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_EARLY_ENTRY: '1'
          QA_EARLY_NO_SCREENSHOT: '1'
          QA_RESIZE_STRESS: '1'
          QA_SKIP_PREFLIGHT: '1'
          QA_LAZY_WORLD: '1'
          QA_EXPECT_VIGILIA: '1'
          QA_REVISION: integrated-mobile19-owner-qa
          QA_EXPECT_ORIGIN: http://127.0.0.1:18765
          QA_URL: http://127.0.0.1:18765/beta-integrated-vigilia/?eldoria_diag=1&eldoria_profile=1&eldoria_p0_lazy_world=1
          QA_OUT: staged-webkit-proof
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/integrated-browser-qa" --no-save playwright@1.55.0
          "$RUNNER_TEMP/integrated-browser-qa/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/integrated-browser-qa/node_modules"
          node tools/eldoria-private-beta/qa_static_server.cjs site 18765 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS -o /dev/null http://127.0.0.1:18765/beta-integrated-vigilia/release-identity.json; then break; fi
            sleep 1
          done
          node tools/eldoria-private-beta/qa_webkit_residency.cjs
          swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$RUNNER_TEMP/eldoria-release-ocr"
          QA_EXPECT_SOURCE=a2e956e11bc837a081c3eab1eb05c8ff094f4e05 QA_REQUIRE_CONSTRUCTION=1 \
            QA_OCR_EXECUTABLE="$RUNNER_TEMP/eldoria-release-ocr" QA_OUT="$QA_OUT/construction" \
            node tools/eldoria-private-beta/qa_postnickname.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-final-route-webkit
          path: staged-webkit-proof
          retention-days: 21
  archive:
    needs: staged-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 43338146206
          name: github-pages
          github-token: ${{ github.token }}
          path: original-pages
      - uses: actions/download-artifact@v4
        with:
          name: integrated-owner-stage-proof
          path: proof
      - name: Retain and re-download the complete original site before any deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mt5hjfz2kb-lab/Eldoria-Prewiu
        run: |
          set -euo pipefail
          tag='archive-pages-before-nickname-repair-20261113'
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('original-pages/artifact.tar');d=json.load(open('proof/integrated-owner-stage-proof.json'))
          assert p.stat().st_size==d['original_pages_tar_bytes']
          with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()==d['original_pages_tar_sha256']
          pathlib.Path('archive-notes.md').write_text('Complete original published Pages snapshot from run 43338146206, before nickname repair. Retains the original beta19 and every unrelated route for exact rollback. Archive only; no new game release or device certification.\nSHA256: '+d['original_pages_tar_sha256']+'\n')
          PY
          if ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --draft --target c9088d95d20c8a5cec9585dec56f20683bc0b12a --title 'Archived Pages snapshot before nickname repair' --notes-file archive-notes.md
          fi
          mkdir recovered
          if ! gh release download "$tag" --pattern artifact.tar --dir recovered; then
            gh release upload "$tag" original-pages/artifact.tar
            gh release download "$tag" --pattern artifact.tar --dir recovered
          fi
          cmp original-pages/artifact.tar recovered/artifact.tar
          sha256sum recovered/artifact.tar > archive-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-durable-archive-verification
          path: archive-verified.txt
          retention-days: 90
  publish:
    needs: [main-source-tests, stage, staged-webkit, archive]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integrated-verified-owner-stage
          path: site
      - name: Check current deployment and stable identities before replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/mt5hjfz2kb-lab/Eldoria-Prewiu/deployments?environment=github-pages&per_page=10' > current-deployment.json
          python3 -c "import json,os; d=[x for x in json.load(open('current-deployment.json')) if x['sha']!=os.environ['GITHUB_SHA']]; assert d and d[0]['sha']=='c9088d95d20c8a5cec9585dec56f20683bc0b12a', 'Published deployment changed; restage latest snapshot'"
          python3 - <<'PY'
          import json,urllib.request,pathlib,hashlib
          base='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/'
          proof=json.load(open('site/integrated-owner-stage-proof.json'))
          for route in proof['stable_routes_preserved']:
              for name in ('release-identity.json','build-manifest.json','index.html'):
                  path=route+'/'+name
                  with urllib.request.urlopen(base+path,timeout=60) as r: raw=r.read()
                  assert hashlib.sha256(raw).hexdigest()==proof['preserved_fingerprints'][path]['sha256'],path
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 21
      - uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verify live candidate, unchanged stable identities and staged file proof
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          base='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/'
          def get(path):
              with urllib.request.urlopen(base+path,timeout=60) as r:return r.read()
          proof=json.load(open('site/integrated-owner-stage-proof.json'))
          assert get('integrated-owner-stage-proof.json')==open('site/integrated-owner-stage-proof.json','rb').read()
          for route in proof['stable_routes_preserved']:
              for name in ('release-identity.json','build-manifest.json','index.html'):
                  path=route+'/'+name
                  assert hashlib.sha256(get(path)).hexdigest()==proof['preserved_fingerprints'][path]['sha256'],path
          identity=json.loads(get('beta-integrated-vigilia/release-identity.json'))
          assert identity['source_sha']==proof['source_sha'] and identity['candidate_bundle_sha256']==proof['bundle_sha256']
          assert not identity['release_for_external_testers'] and not identity['physical_mobile_tested']
          print('LIVE_VIGILIA_AND_UNCHANGED_BETA18_VERIFIED_NOT_PHYSICAL_IPHONE')
          PY
  public-webkit:
    needs: publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/art-direction/ai-authoring
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the deployed public route with actual WebKit and reload
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_EARLY_ENTRY: '1'
          QA_EARLY_NO_SCREENSHOT: '1'
          QA_RESIZE_STRESS: '1'
          QA_SKIP_PREFLIGHT: '1'
          QA_LAZY_WORLD: '1'
          QA_EXPECT_VIGILIA: '1'
          QA_REVISION: integrated-mobile19-owner-qa
          QA_EXPECT_ORIGIN: https://mt5hjfz2kb-lab.github.io
          QA_URL: https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-integrated-vigilia/?eldoria_diag=1&eldoria_profile=1&eldoria_p0_lazy_world=1
          QA_OUT: public-webkit-proof
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/integrated-browser-qa" --no-save playwright@1.55.0
          "$RUNNER_TEMP/integrated-browser-qa/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/integrated-browser-qa/node_modules"
          node tools/eldoria-private-beta/qa_webkit_residency.cjs
          swiftc tools/eldoria-private-beta/actual_ui_ocr.swift -o "$RUNNER_TEMP/eldoria-release-ocr"
          QA_EXPECT_SOURCE=a2e956e11bc837a081c3eab1eb05c8ff094f4e05 QA_REQUIRE_CONSTRUCTION=1 \
            QA_OCR_EXECUTABLE="$RUNNER_TEMP/eldoria-release-ocr" QA_OUT="$QA_OUT/construction" \
            node tools/eldoria-private-beta/qa_postnickname.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-public-webkit
          path: public-webkit-proof
          retention-days: 21
