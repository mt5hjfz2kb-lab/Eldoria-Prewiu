name: Studio - geological Breach landmark
on:
  push:
    branches: [pilot/eldoria-openai-development-studio-20261125]
    paths: ['tools/openai-development-studio/senda-landmark-closeout.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-senda-landmark-production
  cancel-in-progress: false
jobs:
  benchmark:
    if: ${{ false }} # paid mission closed
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Verify actual evidence and cumulative authorized ceiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd tools/openai-development-studio
          python3 test_economics_v2.py
          python3 - <<'PY'
          import json,datetime
          from decimal import Decimal as D
          import budget_guard
          a=json.load(open('senda-benchmark-budget.json'));b=json.load(open('senda-portal-budget.json'))
          for x in (a,b): budget_guard.validate(x,datetime.datetime.now(datetime.timezone.utc).date())
          assert all(r['status']!='authorized_once' for r in a['reservations'])
          assert sum(D(r['reserve_usd']) for x in (a,b) for r in x['reservations'])<=D('10.00')
          PY
          gh run download 45718667425 --repo "$GITHUB_REPOSITORY" --name senda-brecha-web3d-1bdff784ff961ddfe76a48cd82b9b991e1695e52 --dir /tmp/senda-portal-baseline
          python3 prepare_senda_landmark.py /tmp/senda-portal-baseline /tmp/senda-packet
          python3 mission_packet.py --packet /tmp/senda-packet/packet.json
      - name: Five agents with bounded portal production reservation
        id: live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELDORIA_AUTH_EVENT: senda-breach-landmark-v1
        run: |
          set -eu
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/senda-start
          cd tools/openai-development-studio
          cp senda-portal-budget.json budget-cycle.json
          python3 - <<'PY'
          import studio,mission_packet
          studio.MAX_OUTPUT=2200
          mission_packet.execute("/tmp/senda-packet/packet.json","/tmp/senda-landmark-result",True,"senda-breach-landmark-v1")
          PY
      - name: Record measured usage even on partial failure
        if: always() && steps.live.outcome != 'skipped'
        env:
          LIVE_STATUS: ${{ steps.live.outcome }}
        run: |
          mkdir -p /tmp/senda-economics
          python3 tools/openai-development-studio/intervention_report.py collect --root /tmp/senda-landmark-result --run "$GITHUB_RUN_ID" --request senda-breach-landmark-v1 --started "$(cat /tmp/senda-start)" --finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --source-run 45718667425 --status "$LIVE_STATUS" --out "/tmp/senda-economics/run-$GITHUB_RUN_ID.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-landmark-result-${{ github.run_id }}
          path: /tmp/senda-landmark-result/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-landmark-economics-${{ github.run_id }}
          path: /tmp/senda-economics/
          retention-days: 30
          if-no-files-found: warn

  archive:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Archive exact usage without API access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/senda-receipts
          gh run download 45771904456 --repo "$GITHUB_REPOSITORY" --name senda-landmark-economics-45771904456 --dir /tmp/senda-receipts
          python3 - <<'PY'
          import json
          from decimal import Decimal as D
          from pathlib import Path
          r=json.loads(Path('/tmp/senda-receipts/run-45771904456.json').read_text())
          assert r['calls_recorded']==5 and r['estimate_complete'] and r['billed_usd'] is None
          assert D(r['estimated_known_usd'])==D('.07791050')
          PY
          python3 tools/openai-development-studio/publish_receipts.py /tmp/senda-receipts
