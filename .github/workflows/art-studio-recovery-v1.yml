name: '[EXPERIMENT] Eldoria isolated art studio rock recovery V1'
on:
  push:
    branches: [art/valoria-studio-recovery-rocks-v1-20261011]
    paths: ['tools/art-studio-recovery/**', 'pipeline/art-studio-recovery-v1.json', '.github/workflows/art-studio-recovery-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-art-studio-rocks-v1
  cancel-in-progress: false
jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Existing canonical art planner and governance
        run: |
          mkdir -p art-source/valoria/production/studio-rocks-v1
          node tools/check-art-production-governance.mjs
          node tools/plan-art-production.mjs pipeline/art-production-requests/valoria-studio-recovery-rocks-v1-20261011.json art-source/valoria/production/studio-rocks-v1/plan.json
      - name: Free Blender isolated from the shared Windows runner
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy libarchive13 zstd curl
      - name: Existing library audit and real donor renders
        run: blender -b --threads 4 --python tools/art-studio-recovery/probe_donors.py
      - name: Reuse the proven CC0 scanned donor; verify exact historical source
        run: |
          curl -L --fail --retry 2 -A "EldoriaResearch/1.0" 'https://opengameart.org/sites/default/files/Free%20-%20Photogrammetric%20Rock.7z' -o /tmp/eldoria-rock.7z
          echo 'f33dbb5b2a2315a2fba5e5db09fabf799094fe8b5c437486ba52546e4486138d  /tmp/eldoria-rock.7z' | sha256sum -c -
          python3 tools/art-studio-recovery/extract_cc0.py /tmp/eldoria-rock.7z /tmp/eldoria-rock-source
      - name: Real donor production; identical Blender cameras and lighting
        run: |
          blender -b --python-exit-code 1 --threads 4 --python tools/art-studio-recovery/produce_rock_study.py
          python3 tools/art-rd/audit_glb.py art-source/valoria/production/studio-rocks-v1/ValoriaEnvironmentCandidate.glb > art-source/valoria/production/studio-rocks-v1/glb-audit.json
      - name: Existing free Ollama Qwen3-VL decision transport; no cloud inference
        env:
          OLLAMA_NO_CLOUD: 'true'
          OLLAMA_MODELS: /tmp/eldoria-ollama-models
        run: |
          mkdir -p /tmp/eldoria-ollama
          curl -L --fail --retry 2 https://github.com/ollama/ollama/releases/download/v0.40.3/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/eldoria-ollama --exclude='lib/ollama/cuda*' --exclude='lib/ollama/vulkan*'
          export LD_LIBRARY_PATH=/tmp/eldoria-ollama/lib/ollama
          /tmp/eldoria-ollama/bin/ollama serve > /tmp/ollama-studio.log 2>&1 &
          studio_ollama_pid=$!
          trap 'kill "$studio_ollama_pid" 2>/dev/null || true' EXIT
          sleep 3
          /tmp/eldoria-ollama/bin/ollama pull hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M
          python3 tools/art-studio-recovery/review_with_local_vision.py
      - name: Real BlenderMCP allowlisted geological contact correction
        run: |
          curl -L --fail https://raw.githubusercontent.com/ahujasid/blender-mcp/7a0373ec9199183cb460068c4f96aed9c579fb4f/addon.py -o /tmp/eldoria-blender-mcp.py
          blender -b --python-exit-code 1 --threads 4 --python tools/art-studio-recovery/mcp_repair_contacts.py
          test -s art-source/valoria/production/studio-rocks-v1/mcp-contact-report.json
          python3 tools/art-rd/audit_glb.py art-source/valoria/production/studio-rocks-v1/ValoriaEnvironmentCandidate.glb > art-source/valoria/production/studio-rocks-v1/glb-audit.json
      - name: Preserve real source and evidence on THIS branch only
        if: always()
        run: |
          git config user.name eldoria-art-studio
          git config user.email eldoria-art-studio@users.noreply.github.com
          git add art-source/valoria/production/studio-rocks-v1/
          if ! git diff --cached --quiet; then
            git commit -m 'art: preserve isolated real Blender source, exports and visual decisions [skip ci]'
            git push origin HEAD:art/valoria-studio-recovery-rocks-v1-20261011
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-art-studio-rocks-v1
          path: art-source/valoria/production/studio-rocks-v1/
          retention-days: 30
          if-no-files-found: error
