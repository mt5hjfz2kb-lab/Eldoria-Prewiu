name: "[EXPERIMENT] Valoria World Frame / Mountain Terrain v1"
# canonical baseline rerun after convergence-baseline cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-world-frame-mountain-terrain-v1.yml'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaWorldFrameMountainTerrainV1.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaWorldFrameMountainTerrainGateV1.cs'

permissions:
  contents: read
  actions: write

concurrency:
  group: valoria-world-frame-mountain-terrain-v1
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Release older World Frame v1 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} --jq '.workflow_id')
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow_id/runs?per_page=20"             --jq '.workflow_runs[] | select((.status=="in_progress" or .status=="queued" or .status=="pending") and (.id != '${GITHUB_RUN_ID}')) | .id' |
          while read -r run; do
            [ -z "$run" ] && continue
            gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/$run/cancel || true
          done

  capture:
    needs: preflight
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore canonical Unity source while preserving Library cache
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
          $dirty = git status --porcelain --untracked-files=all -- Unity/Assets Unity/Packages Unity/ProjectSettings
          if($dirty){ Write-Host $dirty; throw 'Unity source cleanup did not converge to canonical Git state.' }
      - name: Capture World Frame v1 proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaWorldFrameMountainTerrainV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaWorldFrameMountainTerrainV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaWorldFrameMountainTerrainGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(20)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 260};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
          Get-Content (Join-Path $folder 'before-metrics.json')
          Get-Content (Join-Path $folder 'after-metrics.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-world-frame-mountain-terrain-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaWorldFrameMountainTerrainV1Captures/*
            ${{ runner.temp }}/ValoriaWorldFrameMountainTerrainV1.log
          if-no-files-found: warn
          retention-days: 30
