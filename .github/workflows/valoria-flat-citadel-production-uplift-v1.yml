name: "[EXPERIMENT] Valoria Flat Citadel Production Uplift v1"

on:
  push:
    branches: [visual-proof/valoria-flat-citadel-production-uplift-v1]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaFlatCitadelProductionUpliftV1.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaFlatCitadelProductionUpliftGateV1.cs'
      - 'docs/VALORIA_FLAT_CITADEL_PRODUCTION_UPLIFT_V1_RESULT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valoria-flat-citadel-production-uplift-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage shared CC0 PBR surface maps
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\SurfaceCellExternal"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $headers=@{'User-Agent'='Eldoria-FlatCitadel-Uplift/1.0'}
          foreach($asset in @(@{id='dirt';prefix='dirt'},@{id='stone_block_wall';prefix='stone'},@{id='rock_boulder_dry';prefix='rock'})){
            $payload=Invoke-RestMethod -Headers $headers -Uri ("https://api.polyhaven.com/files/"+$asset.id)
            $json=$payload | ConvertTo-Json -Depth 50
            $urls=[regex]::Matches($json,'https://[^"]+') | ForEach-Object { $_.Value.Replace('\u0026','&') } | Select-Object -Unique
            foreach($map in @(@{key='diff';rx='_diff_1k[.](jpg|png)([?]|$)'},@{key='normal';rx='_nor_gl_1k[.](jpg|png)([?]|$)'})){
              $url=$urls | Where-Object { $_ -match $map.rx } | Select-Object -First 1
              if(-not $url){if($map.key -eq 'normal' -and $asset.prefix -eq 'dirt'){continue};throw "Missing map $($asset.id) $($map.key)"}
              $ext=[IO.Path]::GetExtension(([uri]$url).AbsolutePath)
              $out=Join-Path $dest ($asset.prefix+'_'+$map.key+$ext)
              Invoke-WebRequest -Headers $headers -Uri $url -OutFile $out
              if((Get-Item $out).Length -lt 10000){throw "PBR map too small: $out"}
            }
          }
      - name: Capture production uplift complete frame
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaFlatCitadelProductionUpliftV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaFlatCitadelProductionUpliftV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaFlatCitadelProductionUpliftGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(29)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-flat-citadel-production-uplift-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaFlatCitadelProductionUpliftV1Captures/*
            ${{ runner.temp }}/ValoriaFlatCitadelProductionUpliftV1.log
          if-no-files-found: warn
          retention-days: 30
