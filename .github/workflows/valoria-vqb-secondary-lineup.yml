name: "[EXPERIMENT] Valoria VQB Secondary Library Lineup"

on:
  push:
    branches: [visual-proof/valoria-visual-quality-breakthrough-v1]
    paths:
      - "Unity/Assets/Eldoria/Scripts/Editor/ValoriaVqbSecondaryLineupGate.cs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Capture normalized secondary library lineup
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaVqbSecondaryLineupCaptures"
          $log="$env:RUNNER_TEMP\ValoriaVqbSecondaryLineup.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaVqbSecondaryLineupGate.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(19)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Lineup gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 300};throw "Lineup gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-vqb-secondary-lineup-${{ github.run_id }}
          path: |
            Unity/ValoriaVqbSecondaryLineupCaptures/*
            ${{ runner.temp }}/ValoriaVqbSecondaryLineup.log
          if-no-files-found: warn
          retention-days: 30
      - name: Persist lineup run receipt
        if: always()
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\pipeline\evidence";New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $receipt=@{run_id="${{ github.run_id }}";artifact_id="${{ steps.upload.outputs.artifact-id }}";source_sha="${{ github.sha }}";job_status="${{ job.status }}"} | ConvertTo-Json
          Set-Content -Path (Join-Path $dir "valoria-vqb-secondary-lineup-run.json") -Value $receipt -Encoding utf8
          git config user.name "eldoria-ci";git config user.email "actions@github.com"
          git add pipeline/evidence/valoria-vqb-secondary-lineup-run.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m "chore: record secondary lineup ${{ github.run_id }}";git push origin HEAD:${{ github.ref_name }}}
