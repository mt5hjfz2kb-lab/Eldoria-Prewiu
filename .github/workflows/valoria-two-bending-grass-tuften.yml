name: "[ART GRASS FLOOR6] Two physically bending varied green grass tufts"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-two-bending-grass-tuften.yml'
      - 'tools/valoria-modular-fortress/bend_two_grass_tufts_v6.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-two-true-green-grass-shapes
  cancel-in-progress: false
jobs:
  two-living-grass:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    steps:
      - name: Installed Windows Git and Blender
        id: exe
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-12-independent-blender-v4-38819524063
          run-id: 38819524063
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/healthy_original_green_grass
      - name: Native Blender 2 adaptive asymmetric realistic grass tuft blades
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'healthy_original_green_grass\eldoria-individual-cc0-v4\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-two-bent-grass-tuften'
          if(-not(Test-Path (Join-Path $src 'grass_tuft_1.glb'))){throw 'Healthy green real Quaternius source missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/bend_two_grass_tufts_v6.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned physical grass leaves source missing'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-two-curved-grasses.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'valoria-two-grasses.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-two-grasses.err'
          $proc=Start-Process -FilePath "${{ steps.exe.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 90 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 55 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Two real curved living grass models failed $($proc.ExitCode)"}
          foreach($fld in @('before','after','glb')){
            $count=(Get-ChildItem (Join-Path $out $fld) -File).Count
            if($count -ne 2){throw "Expected two independent $fld results"}
          }
      - name: Store actual 3D grass before-and-after and GLBs for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-two-real-bending-grass-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-two-bent-grass-tuften/**
            ${{ runner.temp }}/valoria-two-grasses.log
            ${{ runner.temp }}/valoria-two-grasses.err
          if-no-files-found: warn
          retention-days: 30
