name: Eldoria Vigilants B10 authentic multiplane bake
on:
  push:
    branches: [art/vigilants-multiplane-b10-20261103]
    paths:
      - 'tools/vigilants-depth/bake_layers.py'
      - '.github/workflows/vigilants-depth-bake.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small open-source offline image preparation dependency
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Bake only approved real-world layers
        run: python tools/vigilants-depth/bake_layers.py
      - name: Audit original source and generated picture planes
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('Unity/Assets/Eldoria/Resources/EldoriaRetention/DepthB10')
          m=json.loads((root/'layer_index.json').read_text())
          assert m['original_preserved'] and len(m['layers'])==6
          assert len(set(item['sha256'] for item in m['layers']))==6
          for item in m['layers']:
              path=root/(item['name']+'.png')
              assert path.with_suffix('.png.meta').exists()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
              print(item['name'], item['bytes'], item['pixel_bbox'])
          print('ELDORIA_VIGILANTS_ALPHA_SOURCE_AUDIT_PASS')
          PY
      - name: Commit generated PNGs and import metadata on the isolated art branch only
        env:
          ART_BRANCH: art/vigilants-multiplane-b10-20261103
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/$ART_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unity/Assets/Eldoria/Resources/EldoriaRetention/DepthB10
          if ! git diff --cached --quiet; then
            git commit -m "art(vigilants): bake six cropped 2.5D layers from original approved source"
            # The isolated art branch may have advanced while the offline
            # bake was running. Rebase only these generated assets; never
            # force-push, rewrite main or overwrite another artist's changes.
            git fetch origin "$ART_BRANCH"
            git rebase "origin/$ART_BRANCH"
            git push origin "HEAD:$ART_BRANCH"
          fi
          test -f Unity/Assets/Eldoria/Resources/EldoriaRetention/DepthB10/layer_index.json
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-vigilants-B10-authored-depth-${{ github.sha }}
          path: |
            Unity/Assets/Eldoria/Resources/EldoriaRetention/DepthB10/
          retention-days: 21
