name: Studio V3 PR198 premium atelier
on:
  push:
    branches: [pilot/eldoria-studio-v3-autonomous-execution-20261126]
    paths:
      - 'tools/studio-v3/rankings-premium/atelier/**'
      - '.github/workflows/studio-v3-rankings-atelier.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: pr198-premium-atelier
  cancel-in-progress: false
jobs:
  produce:
    if: github.event.head_commit.message != 'Prepare PR198 native atelier input and read-only Windows probe' && github.event.head_commit.message != 'Render PR198 atelier native from verified original assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/studio-v3/rankings-premium
            tools/openai-development-studio
          fetch-depth: 2
      - name: Verify frozen PR and source contracts
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/studio-v3/rankings-premium/materialize.py "$RUNNER_TEMP/pr198-source"
          python3 -m py_compile tools/studio-v3/rankings-premium/atelier/produce.py
      - name: Rehearse without paid calls
        if: github.event.head_commit.message != 'Launch PR198 atelier with certified zero-spend recovery and supported director'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/studio-v3/rankings-premium/atelier/produce.py --fixture "$RUNNER_TEMP/pr198-source" "$RUNNER_TEMP/pr198-atelier"
      - name: Verify immutable grant before paid production
        if: github.event.head_commit.message == 'Launch PR198 atelier with certified zero-spend recovery and supported director'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/studio-v3/rankings-premium/atelier/produce.py --gate
      - name: Actual director, painter, asset auditor and native technical artist
        if: github.event.head_commit.message == 'Launch PR198 atelier with certified zero-spend recovery and supported director'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/studio-v3/rankings-premium/atelier/produce.py --live "$RUNNER_TEMP/pr198-source" "$RUNNER_TEMP/pr198-atelier"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr198-atelier-art
          path: ${{ runner.temp }}/pr198-atelier
          if-no-files-found: warn
          retention-days: 14

  native-input:
    if: github.event.head_commit.message == 'Prepare PR198 native atelier input and read-only Windows probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/studio-v3/rankings-premium
            tools/openai-development-studio
      - name: Verify actual role receipts and correct specific asset defects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/studio-v3/rankings-premium/atelier/native_input.py "$RUNNER_TEMP/atelier-native-input"
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-native-input
          path: ${{ runner.temp }}/atelier-native-input
          if-no-files-found: error
          retention-days: 7
  pc-probe:
    if: github.event.head_commit.message == 'Prepare PR198 native atelier input and read-only Windows probe'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 5
    steps:
      - name: Read-only installed PC process probe
        shell: powershell
        run: |
          $names=@('Unity','blender','UnityShaderCompiler','UnityPackageManager','UnityCrashHandler64')
          $rows=@(foreach($n in $names){[pscustomobject]@{name=$n;count=@(Get-Process -Name $n -ErrorAction SilentlyContinue).Count}})
          $report=[ordered]@{idle=(@($rows|Where-Object {$_.count -gt 0}).Count -eq 0);editor_exists=[bool]($env:UNITY_EDITOR_PATH -and (Test-Path $env:UNITY_EDITOR_PATH));processes=$rows;read_only=$true}
          Write-Host ('ATELIER_PC_PROBE '+($report|ConvertTo-Json -Depth 6 -Compress))
