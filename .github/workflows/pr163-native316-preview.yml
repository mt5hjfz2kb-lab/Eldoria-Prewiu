name: '[QA] PR163 native317 critical frames'
on:
  push:
    branches: [qa/pr163-webgl-evidence-20261107]
    paths: ['.github/workflows/pr163-native316-preview.yml']
permissions:
  contents: write
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/pr163-native317-preview.yml
            /docs/evidence/pr163-native317-20261107/
      - uses: actions/download-artifact@v4
        with:
          run-id: 42315556449
          name: valoria-royal-gold-v2-review-42315556449
          github-token: ${{ github.token }}
          path: native317-source
      - name: Copy only unchanged real native screenshots and evidence IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil,hashlib
          root=Path('native317-source')
          files=sorted(root.rglob('integration-context-engendro-*.png'))
          if len(files)<2: raise SystemExit('Genuine native317 Engendro phone images not found in artifact')
          out=Path('docs/evidence/pr163-native317-20261107')
          out.mkdir(parents=True,exist_ok=True)
          manifest={'native_run':42315556449,'head_sha':'4fdb95fdea71c05b28a6e2e28147fddcb0719c24',
          'artifact':'valoria-royal-gold-v2-review-42315556449',
          'quality_approved':False,'screenshots':[]}
          for p in files:
           dest=out/p.name
           shutil.copyfile(p,dest)
           manifest['screenshots'].append({'name':p.name,'bytes':dest.stat().st_size,
            'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()})
          reports=list(root.rglob('integration-result.json'))
          if reports:
           report=json.loads(reports[0].read_text(encoding='utf-8-sig'))
           manifest['native_result_status']=report.get('status')
           manifest['native_result_errors']=report.get('error')
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(manifest,ensure_ascii=False)[:3500])
          PY
          git config user.name 'eldoria-qa-bot'
          git config user.email 'qa-bot@users.noreply.github.com'
          git add docs/evidence/pr163-native317-20261107/
          git diff --cached --quiet && exit 1
          git commit -m 'docs(qa): preserve exact native317 real Engendro phone captures [skip ci]'
          git push origin HEAD:qa/pr163-webgl-evidence-20261107
