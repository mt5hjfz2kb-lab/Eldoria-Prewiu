name: "[R&D] Valoria Isometric CityBuilder Gate Source v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-isometric-citybuilder-gate-source-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip python3-numpy
      - name: Fetch CC0 CityBuildingKit gate source
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygate/src /tmp/citygate/evidence
          curl -L --fail --retry 3 -A "EldoriaResearch/1.0"             -o /tmp/citygate/source.zip             "https://opengameart.org/sites/default/files/Medieval_CityBridge%2BGate_sprites%20and%20source_0.zip"
          unzip -q /tmp/citygate/source.zip -d /tmp/citygate/src
          find /tmp/citygate/src -type f | sort | tee /tmp/citygate/evidence/files.txt
      - name: Render source evidence
        run: |
          cat > /tmp/citygate/render.py <<'PY'
          import bpy, os, glob, math, json
          from mathutils import Vector
          root="/tmp/citygate/src"; ev="/tmp/citygate/evidence"
          blends=glob.glob(root+"/**/*.blend",recursive=True)
          if not blends: raise RuntimeError("No blend source in archive")
          def score(p):
              n=os.path.basename(p).lower()
              return (50 if "gate" in n else 0)+(20 if "bridge" in n else 0)-len(n)/100
          src=sorted(blends,key=score,reverse=True)[0]
          print("CHOSEN",src)
          bpy.ops.wm.open_mainfile(filepath=src)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH" and not o.hide_render]
          if not meshes: raise RuntimeError("No meshes")
          pts=[o.matrix_world@Vector(c) for o in meshes for c in o.bound_box]
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          ctr=(mn+mx)*.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene
          # clear old lights/cameras only
          for o in list(sc.objects):
              if o.type in ("LIGHT","CAMERA"): bpy.data.objects.remove(o,do_unlink=True)
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.use_nodes=True
          bg=sc.world.node_tree.nodes.get("Background")
          bg.inputs["Color"].default_value=(0.03,0.035,0.05,1); bg.inputs["Strength"].default_value=.45
          sc.render.engine="BLENDER_EEVEE"
          sc.render.resolution_x=1200; sc.render.resolution_y=900; sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          # neutral three-point light
          for loc,en,size,col in [
              (ctr+Vector((-span*.9,-span*1.0,span*1.4)),1700,span*1.1,(1.0,.78,.58)),
              (ctr+Vector((span*.8,span*.4,span*.7)),800,span,(.45,.6,1.0)),
              (ctr+Vector((0,span*.9,span*1.2)),900,span*.9,(.55,.68,1.0))]:
              bpy.ops.object.light_add(type="AREA",location=loc)
              L=bpy.context.object; L.data.energy=en; L.data.size=size; L.data.color=col
              L.rotation_euler=(ctr-L.location).to_track_quat("-Z","Y").to_euler()
          bpy.ops.object.camera_add(); cam=bpy.context.object; sc.camera=cam; cam.data.lens=58
          views={"front":(0,-1.7,.35),"three-quarter":(1.05,-1.45,.65),"side":(1.7,0,.35),"isometric":(1.05,-1.05,1.0)}
          for name,v in views.items():
              cam.location=ctr+Vector(v)*span
              cam.rotation_euler=(ctr-cam.location).to_track_quat("-Z","Y").to_euler()
              sc.render.filepath=os.path.join(ev,name+".png")
              bpy.ops.render.render(write_still=True)
          tris=sum(sum(max(0,len(p.vertices)-2) for p in o.data.polygons) for o in meshes)
          mats=sum(len(o.data.materials) for o in meshes)
          open(os.path.join(ev,"report.json"),"w").write(json.dumps({
              "source":"OpenGameArt Castle Gate and Drawbridge / City Building Game Art",
              "license":"CC0",
              "blend":src,"meshes":len(meshes),"triangles_approx":tris,"material_slots":mats,"bounds":list(dims),"paid_credits":0
          },indent=2))
          PY
          blender -b --python /tmp/citygate/render.py
          test -s /tmp/citygate/evidence/front.png
          test -s /tmp/citygate/evidence/three-quarter.png
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-isometric-citybuilder-gate-source-v1
          path: /tmp/citygate/evidence
          if-no-files-found: error
          retention-days: 30
