name: "[TEMP] Persist Certified Hero Bastion"

on:
  push:
    branches:
      - visual-proof/asset-library-reprocessing-pass-v1
    paths:
      - '.github/workflows/persist-certified-hero-bastion.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate; Add-Content -Path $env:GITHUB_PATH -Value $dir; $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Recover exact certified GLB
        shell: powershell
        run: |
          $artifactId=11143009723
          $expected='afb6cee6ae572b0879650f18285b32798e263c17359a158ffe2bdd03fb62ad5c'
          $expectedBytes=13257704
          $root="$env:RUNNER_TEMP\hero-bastion-persist"
          $zip="$root.zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -Headers $headers -OutFile $zip -MaximumRedirection 10
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $match=$null
          foreach($file in Get-ChildItem $root -Recurse -File -Filter '*.glb'){
            $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -eq $expected){$match=$file;break}
          }
          if($null -eq $match){throw 'Certified Hero Bastion GLB not found in artifact'}
          if($match.Length -ne $expectedBytes){throw "Byte mismatch $($match.Length)"}
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\HeroBastionGenerated"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $target=Join-Path $dest 'Valoria_HeroBastion_v1.glb'
          Copy-Item $match.FullName $target -Force
          if((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw 'Persisted GLB SHA mismatch'}
          Write-Host "PERSIST_SOURCE_OK sha=$expected bytes=$expectedBytes"
      - name: Import once to generate Unity meta
        shell: powershell
        run: |
          $log="$env:RUNNER_TEMP\HeroBastionPersistImport.log"
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(12)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Unity import timed out'}
          if($p.ExitCode -ne 0){Get-Content $log -Tail 200;throw "Unity import failed $($p.ExitCode)"}
          $meta="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\HeroBastionGenerated\Valoria_HeroBastion_v1.glb.meta"
          if(-not(Test-Path $meta)){throw 'Unity did not generate GLB meta'}
      - name: Commit recovered production asset
        shell: powershell
        run: |
          git config user.name "Eldoria Art Pipeline"
          git config user.email "actions@eldoria.local"
          git add -- "Unity/Assets/Resources/Valoria/HeroBastionGenerated/Valoria_HeroBastion_v1.glb" "Unity/Assets/Resources/Valoria/HeroBastionGenerated/Valoria_HeroBastion_v1.glb.meta"
          if(git diff --cached --quiet){Write-Host 'Asset already tracked'; exit 0}
          git commit -m "art: persist certified Hero Bastion v1 from historical artifact"
          git push origin HEAD:visual-proof/asset-library-reprocessing-pass-v1
