name: Historical Surface Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-surface-rescue.yml'
      - 'tools/tripo_module_blender.py'
      - 'pipeline/historical-surface-rescue.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eldoria-historical-surface-rescue
  cancel-in-progress: true

jobs:
  seam-filler-rock:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Fetch exact certified SeamFiller artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactId='10943977319'
          $expected='2676e11fbfde6781996117b191a8a88b534b36ad6901409283bfdea22a51af6d'
          $zip="$env:RUNNER_TEMP\seam-filler-certified.zip"
          $out="$env:RUNNER_TEMP\seam-filler-certified"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifactId/zip" -OutFile $zip -MaximumRedirection 5
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $matches=@()
          foreach($f in Get-ChildItem $out -Recurse -File -Filter '*.glb'){
            $sha=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "GLB $($f.FullName) sha256=$sha bytes=$($f.Length)"
            if($sha -eq $expected){$matches += $f}
          }
          if($matches.Count -ne 1){ throw "Expected exactly one certified SeamFiller GLB, found $($matches.Count)" }
          $src="$env:RUNNER_TEMP\RockTerrainSeamFiller-certified.glb"
          Copy-Item $matches[0].FullName $src -Force
          "RESCUE_INPUT=$src" | Out-File $env:GITHUB_ENV -Append

      - name: Locate Blender
        id: blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $candidate){
            $candidate=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if(-not $candidate){throw 'Blender not found'}
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2

      - name: Apply zero-credit rock Surface v1 rescue
        shell: powershell
        run: |
          $output="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\Eldoria_Module_UnderReview_50K.glb"
          $report="$env:RUNNER_TEMP\seam-filler-surface-rescue.json"
          $stdout="$env:RUNNER_TEMP\seam-filler-surface-rescue.log"
          $stderr="$env:RUNNER_TEMP\seam-filler-surface-rescue-error.log"
          New-Item -ItemType Directory -Force (Split-Path $output) | Out-Null
          $args=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\tripo_module_blender.py",'--','--input',$env:RESCUE_INPUT,'--output',$output,'--report',$report,'--target-tris','49800','--min-tris','49800','--max-tris','49800','--surface-rescue-profile','rock')
          $p=Start-Process -FilePath '${{ steps.blender.outputs.path }}' -ArgumentList $args -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if($p.ExitCode -ne 0){
            if(Test-Path $stdout){Get-Content $stdout -Tail 220}
            if(Test-Path $stderr){Get-Content $stderr -Tail 220}
            throw "Surface rescue failed: $($p.ExitCode)"
          }
          $sha=(Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RESCUED_OUTPUT sha256=$sha bytes=$((Get-Item $output).Length)"
          Get-Content $report

      - name: Configure isolated material-preserving review
        shell: powershell
        run: |
          @{
            module_label='RockTerrainSeamFiller Surface v1 rescue'
            unity_yaw_degrees=0
            visual_acceptance='Support-only rock/terrain seam. Judge textured captures for coherent Eldoria rock value/roughness and preservation of the certified silhouette. No traversal or production promotion claim.'
          } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\Unity\TripoModuleReviewConfig.json"

      - name: Verify Unity
        shell: powershell
        run: |
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH not found'}

      - name: Render isolated rescue review
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\TripoGenericModuleReviewCaptures"
          $log="$env:RUNNER_TEMP\seam-filler-unity-review.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.TripoGenericModuleReview.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(360000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            if(Test-Path $log){Get-Content $log -Tail 220}
            throw 'Unity rescue review timed out'
          }
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 220}; throw "Unity rescue review failed: $($p.ExitCode)"}
          $textured=@('strategic-textured.png','city-textured.png','detail-textured.png')
          foreach($name in $textured){
            $p2=Join-Path $folder $name
            if(-not (Test-Path $p2) -or (Get-Item $p2).Length -lt 10000){throw "Missing/empty textured rescue capture: $name"}
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seam-filler-surface-v1-rescue-${{ github.run_id }}
          path: |
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/Eldoria_Module_UnderReview_50K.glb
            Unity/TripoGenericModuleReviewCaptures/*
            ${{ runner.temp }}/seam-filler-surface-rescue.json
            ${{ runner.temp }}/seam-filler-surface-rescue.log
            ${{ runner.temp }}/seam-filler-surface-rescue-error.log
            ${{ runner.temp }}/seam-filler-unity-review.log
          if-no-files-found: warn
          retention-days: 30
