name: Historical Surface Rescue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-surface-rescue.yml'
      - 'pipeline/historical-module-rescue.json'
      - 'tools/tripo_module_blender.py'
      - 'tools/valoria_hero_surface_prototype.py'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaVisualFormulaGate.cs'

permissions:
  contents: write
  actions: read

concurrency:
  group: eldoria-historical-surface-rescue
  cancel-in-progress: true

jobs:
  production-district:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Recover exact certified district modules
        shell: powershell
        run: |
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
          $root="$env:RUNNER_TEMP\valoria-production-rescue-source"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $root | Out-Null

          function Recover-Certified([string]$name,[int64]$artifactId,[string]$expected) {
            $zip=Join-Path $root "$name.zip"
            $out=Join-Path $root $name
            Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -OutFile $zip -MaximumRedirection 10
            Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
            $matches=@()
            foreach($file in Get-ChildItem $out -Recurse -File -Filter '*.glb'){
              $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if($sha -eq $expected.ToLowerInvariant()){$matches += $file}
            }
            if($matches.Count -ne 1){ throw "$name expected exactly one certified SHA match; found $($matches.Count)" }
            $target=Join-Path $root "$name-certified.glb"
            Copy-Item $matches[0].FullName $target -Force
            Write-Host "RESCUE_SOURCE $name | artifact=$artifactId | sha256=$expected | bytes=$((Get-Item $target).Length)"
            return $target
          }

          $res=Recover-Certified 'ResidentialTerraceRock' 10943072790 '2ca694f547b54989305328045b60d28b53da45da94cffbd63a27b9fc698dc458'
          $seam=Recover-Certified 'RockTerrainSeamFiller' 10943977319 '2676e11fbfde6781996117b191a8a88b534b36ad6901409283bfdea22a51af6d'
          $stair=Recover-Certified 'TerraceStairRock' 10936719852 '83fce93daeb5bb455ab89bb195c39f617b3ea69ff9bf29f938ae4744caff3e5e'

          "RES_INPUT=$res" | Out-File $env:GITHUB_ENV -Append
          "SEAM_INPUT=$seam" | Out-File $env:GITHUB_ENV -Append
          "STAIR_INPUT=$stair" | Out-File $env:GITHUB_ENV -Append

      - name: Locate Blender
        id: blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $candidate){
            $candidate=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if(-not $candidate){throw 'Blender not found'}
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2

      - name: Apply zero-credit Surface v1 rescue
        shell: powershell
        run: |
          $target="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\ValoriaRescueDistrict"
          New-Item -ItemType Directory -Force $target | Out-Null

          function Run-HeroSurface([string]$sourcePath,[string]$name,[string]$profile='hero') {
            $output=Join-Path $target "$name.glb"
            $report=Join-Path $env:RUNNER_TEMP "$name-surface-report.json"
            $stdout=Join-Path $env:RUNNER_TEMP "$name-surface.log"
            $stderr=Join-Path $env:RUNNER_TEMP "$name-surface-error.log"
            $blenderArgs=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\valoria_hero_surface_prototype.py",'--','--input',$sourcePath,'--output',$output,'--report',$report,'--profile',$profile)
            $p=Start-Process -FilePath "${{ steps.blender.outputs.path }}" -ArgumentList $blenderArgs -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if($p.ExitCode -ne 0){
              if(Test-Path $stdout){Get-Content $stdout -Tail 180}
              if(Test-Path $stderr){Get-Content $stderr -Tail 180}
              throw "$name semantic Surface v1 rescue failed: $($p.ExitCode)"
            }
            Get-Content $report
          }

          Run-HeroSurface $env:RES_INPUT 'ResidentialTerraceRock' 'residential'
          Run-HeroSurface $env:STAIR_INPUT 'TerraceStairRock'

          $seamOut=Join-Path $target 'RockTerrainSeamFiller.glb'
          $seamReport=Join-Path $env:RUNNER_TEMP 'RockTerrainSeamFiller-surface-report.json'
          $seamStdout=Join-Path $env:RUNNER_TEMP 'RockTerrainSeamFiller-surface.log'
          $seamStderr=Join-Path $env:RUNNER_TEMP 'RockTerrainSeamFiller-surface-error.log'
          $seamArgs=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\tripo_module_blender.py",'--','--input',$env:SEAM_INPUT,'--output',$seamOut,'--report',$seamReport,'--target-tris','49800','--min-tris','49800','--max-tris','49800','--surface-rescue-profile','rock')
          $p=Start-Process -FilePath "${{ steps.blender.outputs.path }}" -ArgumentList $seamArgs -PassThru -Wait -RedirectStandardOutput $seamStdout -RedirectStandardError $seamStderr
          if($p.ExitCode -ne 0){
            if(Test-Path $seamStdout){Get-Content $seamStdout -Tail 180}
            if(Test-Path $seamStderr){Get-Content $seamStderr -Tail 180}
            throw "RockTerrainSeamFiller Surface v1 rescue failed: $($p.ExitCode)"
          }
          Get-Content $seamReport

      - name: Verify Unity
        shell: powershell
        run: |
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH not found'}
          $version=& $env:UNITY_EDITOR_PATH -version
          if($version -notmatch '6000\.3\.23f1'){throw "Wrong Unity version: $version"}

      - name: Capture first production rescue district
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\VisualFormulaCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-ProductionRescueDistrict.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaVisualFormulaGate.CaptureRescueDistrict','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(18)
          while(-not $p.HasExited -and (Get-Date) -lt $deadline){Start-Sleep -Seconds 2;$p.Refresh()}
          if(-not $p.HasExited){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            if(Test-Path $log){Get-Content $log -Tail 260}
            throw 'Production rescue district capture timed out'
          }
          $p.Refresh()
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 260};throw "Production rescue district capture failed: $($p.ExitCode)"}
          $expected=@('production-district-19.png','production-district-12.png','production-district-9.png','production-district-mobile.png','production-district-metrics.json','production-district-evidence.json')
          foreach($name in $expected){
            $file=Join-Path $folder $name
            if(-not(Test-Path $file)){throw "Missing production district evidence: $name"}
            if($name.EndsWith('.png') -and (Get-Item $file).Length -lt 10000){throw "Empty production district capture: $name"}
          }
          Get-Content (Join-Path $folder 'production-district-metrics.json')
          Get-Content (Join-Path $folder 'production-district-evidence.json')

      - name: Promote validated rescue assets to production resources
        shell: powershell
        run: |
          $source="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\ValoriaRescueDistrict"
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\Rescued"
          New-Item -ItemType Directory -Force $dest | Out-Null

          foreach($name in @('ResidentialTerraceRock','RockTerrainSeamFiller')){
            $glb=Join-Path $source "$name.glb"
            if(-not(Test-Path $glb)){throw "Validated rescue source missing: $glb"}
            Copy-Item $glb (Join-Path $dest "$name.glb") -Force
            $meta="$glb.meta"
            if(Test-Path $meta){Copy-Item $meta (Join-Path $dest "$name.glb.meta") -Force}
          }

          git config user.name "eldoria-art-runner"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          $remote=(git rev-parse origin/main).Trim()
          if($remote -ne $env:GITHUB_SHA){
            throw "main advanced during rescue promotion ($remote != $env:GITHUB_SHA); refusing to overwrite concurrent work"
          }
          git add Unity/Assets/Eldoria/Resources/Valoria/Rescued
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){
            Write-Host "Production rescue assets already match main; no promotion commit needed."
          } else {
            git commit -m "Art production: promote rescued district assets"
            git push origin HEAD:main
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-production-rescue-district-${{ github.run_id }}
          path: |
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/ValoriaRescueDistrict/*
            Unity/VisualFormulaCaptures/*
            ${{ runner.temp }}/*-surface-report.json
            ${{ runner.temp }}/*-surface.log
            ${{ runner.temp }}/*-surface-error.log
            ${{ runner.temp }}/Eldoria-ProductionRescueDistrict.log
          if-no-files-found: warn
          retention-days: 30
