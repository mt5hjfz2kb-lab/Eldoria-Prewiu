name: Daily treasures domain
on:
  pull_request:
    paths:
      - "Unity/Assets/Eldoria/Scripts/Domain/DailyTreasureRules.cs"
      - "Unity/Assets/Eldoria/Scripts/Domain/GameState.cs"
      - "Unity/Assets/Eldoria/Scripts/Application/LocalGateway.cs"
      - "Unity/Assets/Eldoria/DailyTreasures/**"
      - "tools/daily-treasures/**"
      - ".github/workflows/daily-treasures-domain.yml"
      - ".github/workflows/daily-treasures-native.yml"
      - "Unity/Packages/manifest.json"
  push:
    branches:
      - feature/eldoria-daily-treasures-20261108
permissions:
  contents: read
  pull-requests: read
jobs:
  pure-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Packages/manifest.json
            /Unity/Assets/Eldoria/Scripts/Domain/
            /Unity/Assets/Eldoria/Scripts/Application/
            /Unity/Assets/Eldoria/DailyTreasures/
            /Unity/Assets/Eldoria/HeroesUI/HeroesApprovedDestination.cs
            /Unity/Assets/Eldoria/Resources/EldoriaV41/heroes-hall-illustrated-v2.jpg
            /Unity/Assets/Eldoria/Resources/EldoriaV41/heroes-hall-illustrated-v2.jpg.meta
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-painterly-v2.png
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-painterly-v2.png.meta
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-painterly-v2.png
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-painterly-v2.png.meta
            /Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV2/Runtime/RoyalGoldV3EarlyRetentionScreens.cs
            /tools/daily-treasures/
            /tools/march-capacity/
            /tools/early-retention/
            /tools/ui-v3-domain-smoke/
            /.github/workflows/daily-treasures-native.yml
            /.github/workflows/daily-treasures-domain.yml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Inventory canonical source art identities for Lyra, never generated portraits
        shell: bash
        run: |
          git ls-files Unity/Assets/Eldoria |
            grep -Ei 'lyra|hero.{0,40}(portrait|master)|portrait.{0,40}hero' |
            head -100 || true
      - name: Prove the pre-Unity ceremony art source gate rejects duplicates and fictional loot
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 tools/daily-treasures/preflight_ceremony_art.py --selftest
          python3 tools/daily-treasures/preview_ceremony_art.py --selftest
          # Do not run a non-existent production manifest here: until genuine
          # event-specific artworks exist, ART_APPROVED remains false.
      - name: Verify built-in Unity Audio module required by actual chest audio
        run: node tools/daily-treasures/check-audio-module.mjs
      - name: Compile and test original C# reward rules (no Unity mocks)
        run: dotnet run --project tools/daily-treasures/Tests.csproj --configuration Release
      - name: Compile and test the real authoritative LocalGateway (no Unity)
        run: dotnet run --project tools/daily-treasures/Gateway.Tests.csproj --configuration Release
      # The owned Gateway.Tests suite above now executes real three-scout
      # reservations, a rejected fourth march and exactly-once offline troop
      # returns on a story-valid player. The separate, foreign-owned
      # march-capacity smoke has an obsolete pre-introduction Scout fixture
      # and must be corrected by its owner, NOT bypassed through old unlocks.
      - name: Preserve the exact original early-retention and V3 management domain contracts
        shell: bash
        run: |
          # These two source-only projects are owned by OTHER workstreams.
          # Never edit their .csproj to hide the new DailyTreasureState.
          # They must still build with the exact same source list as main.
          dotnet run --project tools/early-retention/Smoke.csproj --configuration Release
          dotnet run --project tools/ui-v3-domain-smoke/Smoke.csproj --configuration Release
      - name: Check actual OWNER_I_II economic impact of seven-day and fourteen-day rewards
        run: dotnet run --project tools/daily-treasures/EconomyCandidate.csproj --configuration Release
      - name: Parse original Unity UI, gameplay and chest C# syntax without Unity
        run: dotnet run --project tools/daily-treasures/SyntaxAudit.csproj --configuration Release
      - name: Verify actual current Vigilia PR173 Canvas contract without borrowing Windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/daily-treasures/check-vigilia-compat.mjs
      - name: Enforce the exact dark forged-iron and burgundy visual language of Eldoria/Vigilia
        run: node tools/daily-treasures/check-visual-identity.mjs
      - name: Enforce Unity 6 editor-only art capture assembly and safe Android/WebGL gameplay DLL
        run: node tools/daily-treasures/check-assembly-isolation.mjs
      - name: Check actual calendar placement arithmetic on eight mobile and desktop geometries
        run: node tools/daily-treasures/layout-smoke.mjs
      - name: Check category-specific illustrated milestones use real Eldoria scenic sources
        run: node tools/daily-treasures/check-scenic-art.mjs
      - name: Enforce authoritative save and non-paying mailbox wiring
        run: node tools/daily-treasures/check-integration.mjs

      - name: Validate artwork importer and immutable PNG manifest without transferring private assets
        shell: bash
        run: |
          python - <<'PY'
          import ast,json
          from pathlib import Path
          importer=Path('tools/daily-treasures/import_chest_art.py')
          tree=ast.parse(importer.read_text(encoding='utf-8'))
          assigned=next(n for n in tree.body if isinstance(n,ast.Assign)
                        and any(isinstance(t,ast.Name) and t.id=='EXPECTED' for t in n.targets))
          declared=ast.literal_eval(assigned.value)
          manifest=json.loads(Path('Unity/Assets/Eldoria/DailyTreasures/Resources/DailyTreasureArt/source-manifest.json').read_text())
          for asset in manifest['assets']:
              name=asset['file']
              assert name in declared, f'Missing source art: {name}'
              assert declared[name][0]==asset['sha256'], f'Hash mismatch: {name}'
              assert len(declared[name][1])==32, f'Invalid import GUID: {name}'
          assert len(declared)==2
          assert len({v[1] for v in declared.values()})==2
          print('PASS authored asset importer, two immutable PNG hashes and independent GUIDs')
          PY

      - name: Verify the actual original chest PNGs committed to the PR
        run: python tools/daily-treasures/verify_imported_art.py

      - name: Parse native Windows Unity YAML and fail closed on unsafe checkout or missing art proof
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python tools/daily-treasures/validate_native_workflow.py
      - name: Confirm native screenshot quality reviewer parses and distinguishes source frames
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/daily-treasures/audit_native_art.py --selftest
          python tools/daily-treasures/audit_city_art.py --selftest
          python tools/daily-treasures/check_clean_icon_quality.py
      - name: Render source-only 32-48-64px art contact and verify legibility
        run: python tools/daily-treasures/mobile_visual_preflight.py
      - name: Preserve independently inspectable source visual contact
        uses: actions/upload-artifact@v4
        with:
          name: valoria-mobile-source-art-${{ github.sha }}
          path: tools/daily-treasures/mobile-source-art-contact.jpg
          retention-days: 14
          if-no-files-found: error

  # SOURCE candidate only: Linux downloads a single independently painted
  # illustration, not a mock UI or an official character/world identity.
  # This does NOT require or claim the exclusive Windows Unity resource.
  preunity-art-intake:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/eldoria-daily-treasures-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/daily-treasures/
            /Unity/Assets/Eldoria/DailyTreasures/Resources/DailyTreasureArt/valoria_frame_main_512.png
      - name: Validate isolated art candidate without touching gameplay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 tools/daily-treasures/ingest_art_candidate.py --selftest
          count=0
          for request in tools/daily-treasures/art-source-intake-*.json; do
            if [ ! -f "$request" ]; then continue; fi
            python3 tools/daily-treasures/ingest_art_candidate.py --request "$request"
            count=$((count+1))
          done
          echo "Processed $count independent non-approved art-source requests"
          python3 tools/daily-treasures/assemble_authored_ceremonies.py
      - name: Preserve one unapproved source art candidate on the same PR only
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(tools/daily-treasures/art-candidates/*_stage.png
                  tools/daily-treasures/art-candidates/*_stage.provenance.json
                  tools/daily-treasures/art-candidates/shared_ornament.png
                  tools/daily-treasures/art-candidates/ceremony-art-production.json)
          if (( ${#assets[@]} == 0 )); then
            echo "No verified candidates; no commit"
            exit 0
          fi
          git add -- "${assets[@]}"
          if git diff --cached --quiet; then
            echo "Candidate already present with immutable hash"
            exit 0
          fi
          current=$(git ls-remote origin refs/heads/feature/eldoria-daily-treasures-20261108 | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::PR HEAD changed; refuse concurrent overwrite"
            exit 1
          fi
          git -c user.name='Eldoria Art Intake' \
              -c user.email='eldoria-art-intake@users.noreply.github.com' \
              commit -m 'Daily treasures: stage single original Exploradores candidate (PRE-UNITY, NOT APPROVED)'
          # Never force-push, rebase, or overwrite another agent's HEAD.
          git push origin HEAD:refs/heads/feature/eldoria-daily-treasures-20261108

  # PRE-UNITY aesthetic comparison with actual original Lyra hall,
  # Scouts/Vigilants painterly scenes and a SHA-verified true Unity city.
  # Never labels a synthetic contact image as gameplay evidence.
  preunity-authored-visual-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/eldoria-daily-treasures-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/daily-treasures/
            /Unity/Assets/Eldoria/Resources/EldoriaV41/heroes-hall-illustrated-v2.jpg
            /Unity/Assets/Eldoria/Resources/EldoriaV41/heroes-hall-illustrated-v2.jpg.meta
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-painterly-v2.png
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-painterly-v2.png.meta
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-painterly-v2.png
            /Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-painterly-v2.png.meta
      - name: Check actual four source illustrations are staged
        id: present
        shell: bash
        run: |
          if [ -f tools/daily-treasures/art-candidates/ceremony-art-production.json ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "No four real isolated sources yet; skip study without faking artwork"
          fi
      - name: Retrieve authentic read-only Unity city baseline from past certified capture
        if: steps.present.outputs.ready == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.request,zipfile
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          uri=f'https://api.github.com/repos/{repo}/actions/artifacts/13805842501/zip'
          req=urllib.request.Request(uri,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'User-Agent':'Eldoria-Read-Only-Actual-City-Baseline'})
          with urllib.request.urlopen(req,timeout=90) as response:
              data=response.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              proof=json.loads(z.read('city/city-art-report.json'))
              assert proof['source']=='9b86b7626b8d544f974c5395ad41f5f443d13f6b'
              assert proof['camera']=='PlayerCamera' and proof['cityRenderers']>=95
              path='city/real-city-daily-actual-city-baseline-1600x900.png'
              frame=z.read(path)
              expected=next(x['sha256'] for x in proof['shots']
                            if x['file']==path.split('/')[-1])
              assert hashlib.sha256(frame).hexdigest()==expected
              Path('tools/daily-treasures/real-city-source-verified.png').write_bytes(frame)
              print('SHA-256 verified true Unity city baseline; NOT a full game run')
          PY
      - name: Compose four real-identity studies at four resolutions BEFORE Unity
        if: steps.present.outputs.ready == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 tools/daily-treasures/preview_ceremony_art.py \
            --manifest tools/daily-treasures/art-candidates/ceremony-art-production.json \
            --out tools/daily-treasures/preunity-studies \
            --identity lyra=Unity/Assets/Eldoria/Resources/EldoriaV41/heroes-hall-illustrated-v2.jpg \
            --identity explorers=Unity/Assets/Eldoria/Resources/EldoriaRetention/scouts-painterly-v2.png \
            --identity vigilants=Unity/Assets/Eldoria/Resources/EldoriaRetention/vigilants-painterly-v2.png \
            --identity bastion=tools/daily-treasures/real-city-source-verified.png
      - name: Export 16 clearly labeled source-only studies for actual art comparison
        if: steps.present.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-preunity-ceremonies-${{ github.sha }}
          path: tools/daily-treasures/preunity-studies/
          retention-days: 14
          if-no-files-found: error
