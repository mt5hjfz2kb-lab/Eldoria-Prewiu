name: Ciudad2D - prueba autentica Unity con reserva exclusiva

on:
  push:
    branches:
      - art/ciudad-2d-hitos-1-5-20261116
    paths:
      - .github/workflows/ciudad2d-native-proof.yml
      - tools/ciudad2d-native/request.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ciudad2d-native-exclusive
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.lease.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-native/request.json
            /.github/workflows/ciudad2d-native-proof.yml
      - name: Validate live registry, SHA and exclusive native ownership without Windows
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          REPO = 'mt5hjfz2kb-lab/Eldoria-Prewiu'
          request = json.loads(Path('tools/ciudad2d-native/request.json').read_text())
          assert request['schema'] == 1
          assert request['branch'] == 'art/ciudad-2d-hitos-1-5-20261116'
          assert request['workstream_id'] == 'eldoria-city2d-illustrated-proof-20261116'
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF_NAME'] == request['branch']
          token = os.environ['GH_TOKEN']
          def github(url):
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/'+url, headers={
                  'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
              })
              with urllib.request.urlopen(req,timeout=30) as resp:return json.load(resp)
          # GitHub Content API may omit content for >1 MB registry.
          entry=github('contents/pipeline/active-workstreams.json?ref=main')
          encoded=entry.get('content')
          if not encoded:
              blob=github('git/blobs/'+entry['sha'])
              assert blob['sha']==entry['sha'] and blob['encoding']=='base64'
              encoded=blob['content']
          registry=json.loads(base64.b64decode(encoded))
          holders=[x for x in registry['active'] if 'windows-runner-heavy' in x.get('resources',[])]
          owned=[x for x in holders if x['id']==request['workstream_id']]
          rotation=registry.get('resource_rotation') or {}
          approved=(request.get('allow_native') is True
              and len(holders)==1 and len(owned)==1
              and owned[0].get('ownership_state')=='claimed'
              and rotation.get('current_workstream')==request['workstream_id']
              and owned[0].get('branch')==request['branch']
              and request.get('owner')==owned[0].get('owner')
              and request.get('ownership_revision')==owned[0].get('ownership_revision'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+str(approved).lower()+'\n')
          if approved:
              print('CITY2D_NATIVE_LEASE_EXCLUSIVE_AUTHORIZED')
          else:
              print('CITY2D_NATIVE_SAFE_SKIP: exclusive Windows rotation is not ours.')
              print('Browser / offline proof remains valid, Unity and iPhone are NOT certified.')
          PY

  unity-native:
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Verify reservation and native process absence again on Windows
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{ Authorization='Bearer '+$env:GH_TOKEN; Accept='application/vnd.github+json' }
          $api='https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/'
          $info=Invoke-RestMethod -Uri ($api+'contents/pipeline/active-workstreams.json?ref=main') -Headers $h
          $encoded=$info.content
          if(-not $encoded){
            $blob=Invoke-RestMethod -Uri ($api+'git/blobs/'+$info.sha) -Headers $h
            if($blob.sha -ne $info.sha -or $blob.encoding -ne 'base64'){throw 'Registry blob mismatched'}
            $encoded=$blob.content
          }
          $registry=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($encoded -replace '\\s',''))) | ConvertFrom-Json
          $lease=@($registry.active | Where-Object { @($_.resources) -contains 'windows-runner-heavy' })
          if($lease.Count -ne 1 -or $lease[0].id -ne 'eldoria-city2d-illustrated-proof-20261116' -or
             $registry.resource_rotation.current_workstream -ne 'eldoria-city2d-illustrated-proof-20261116'){
             throw 'Windows native lease no longer granted to City2D'
          }
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){
             throw 'Native PC busy. Do not interrupt any other project.'
          }
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path -LiteralPath $env:UNITY_EDITOR_PATH -PathType Leaf)){
             throw 'Unity 6000.3.23f1 editor path unavailable'
          }
          Write-Host 'CITY2D_EXCLUSIVE_NATIVE_PREFLIGHT_PASS'

      - name: Restore installed Git to PATH without installing software
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $d="$env:LOCALAPPDATA/GitHubDesktop"
            $possible=Get-ChildItem $d -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
            if(-not $possible){ throw 'No Git installation available. Do not download entire repository.' }
            $dir=Split-Path $possible
            $env:PATH="$dir;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          git --version

      - name: Create isolated shallow sparse candidate, never touch main checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$'){throw 'Invalid pinned source SHA'}
          $dest=Join-Path $env:RUNNER_TEMP ('city2d-native-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $dest){throw 'Scratch folder already exists; refuse overwrite'}
          & git init -q $dest
          if($LASTEXITCODE){throw 'Git init failed'}
          & git -C $dest remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if($LASTEXITCODE){throw 'Git origin failed'}
          $patterns=@(
            '/Unity/Assets/Experimentos/Ciudad2D/'
            '/tools/ciudad2d-native/'
            '/Unity/Assets/Eldoria/Scripts/Domain/'
            '/Unity/Assets/Eldoria/Scripts/Application/'
            '/Unity/Packages/'
            '/Unity/ProjectSettings/'
          )
          & git -C $dest sparse-checkout set --no-cone @patterns
          if($LASTEXITCODE){throw 'Sparse checkout setup failed'}
          & git -C $dest fetch --no-tags --depth=1 --filter=blob:none origin $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Filtered shallow Git fetch failed'}
          & git -C $dest checkout -q --detach $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Pinned sparse Git checkout failed'}
          $got=(& git -C $dest rev-parse HEAD).Trim()
          if($got -ne $env:GITHUB_SHA){throw "Source mismatch $got"}
          if(-not(Test-Path -LiteralPath (Join-Path $dest 'Unity/Assets/Experimentos/Ciudad2D/Sprites/Bastion_Nivel05.png'))){
            throw 'Bastion sprite missing from exact SHA'
          }
          "CITY2D_SOURCE_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ('CITY2D_PINNED_SOURCE '+$got)

      - name: Stage SHA-pinned Blender Cuartel and Aserradero 3D render pair
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/stage_blender_pair.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Render authentic Unity Editor frames and validate tier snapshots
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:CITY2D_SOURCE_ROOT 'Unity'
          $log=Join-Path $env:RUNNER_TEMP ('city2d-native-'+$env:GITHUB_RUN_ID+'.log')
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',$project,
            '-executeMethod','Eldoria.Experimentos.Ciudad2D.Editor.City2DNativeEvidence.Capture',
            '-logFile',$log)
          $proc=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $proc.WaitForExit(1600000)){
            & taskkill.exe /PID $proc.Id /T /F | Out-Null
            throw 'Unity scratch editor timed out'
          }
          if($proc.ExitCode -ne 0){
            if(Test-Path -LiteralPath $log){Get-Content -LiteralPath $log -Tail 230}
            throw ('Unity native proof failed code '+$proc.ExitCode)
          }
          $evidence=Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Ciudad2DNativeEvidence/evidence.json'
          if(-not(Test-Path -LiteralPath $evidence)){throw 'Unity did not generate evidence.json'}
          $data=Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if(@($data.captures).Count -ne 15 -or -not $data.domain_snapshot_read_only_pass -or
             -not $data.visibility_policy_pass -or
             -not $data.quality_import_uncompressed_pass -or
             -not $data.quality_crisp_bake_pass -or
             -not $data.candidate_cuartel_comparison_only -or
             -not $data.grounding_art_comparison_only -or
             -not $data.retina_terrain_rendered_pass -or
             -not $data.quality_import_no_mipmap_pass -or
             $data.art_approved -or $data.device_qa -ne 'PENDING'){
            throw 'Genuine native evidence incomplete or falsely claims artistic approval'
          }
          foreach($entry in $data.captures){
            $file=Join-Path (Split-Path $evidence) $entry.file
            if(-not(Test-Path -LiteralPath $file) -or (Get-Item $file).Length -lt 8000){
              throw ('Missing authentic Unity screenshot '+$entry.file)
            }
            if((Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant() -ne $entry.sha256){
              throw ('Screenshot digest mismatch '+$entry.file)
            }
          }
          Get-Content $evidence

      - name: Execute true Editor PlayMode, pointer dispatch and native HUD proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:CITY2D_SOURCE_ROOT 'Unity'
          $log=Join-Path $env:RUNNER_TEMP ('city2d-playmode-'+$env:GITHUB_RUN_ID+'.log')
          $xml=Join-Path $env:RUNNER_TEMP ('city2d-playmode-'+$env:GITHUB_RUN_ID+'.xml')
          $filter='Eldoria.Experimentos.Ciudad2D.PlayModeProof.RealSceneInteractions.GenuineSavedScene_EnteredPlayMode_HudPointerAndCameraContract'
          $args=@('-batchmode','-force-d3d11','-projectPath',$project,
            '-runTests','-testPlatform','EditMode','-testFilter',$filter,
            '-testResults',$xml,'-logFile',$log)
          $proc=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $proc.WaitForExit(1050000)){
            & taskkill.exe /PID $proc.Id /T /F | Out-Null
            throw 'Unity PlayMode scratch test timed out'
          }
          if(-not(Test-Path -LiteralPath $xml)){
            if(Test-Path $log){Get-Content $log -Tail 160}
            throw ('Unity test framework did not emit XML, exit '+$proc.ExitCode)
          }
          [xml]$data=Get-Content -LiteralPath $xml -Raw
          $tests=[int]$data.DocumentElement.GetAttribute('total')
          $passed=[int]$data.DocumentElement.GetAttribute('passed')
          $failed=[int]$data.DocumentElement.GetAttribute('failed')
          if($tests -lt 1 -or $passed -lt 1 -or $failed -ne 0 -or $proc.ExitCode -ne 0){
            if(Test-Path $log){Get-Content $log -Tail 180}
            throw ("Genuine PlayMode test failed: total=$tests passed=$passed failed=$failed exit="+$proc.ExitCode)
          }
          $dir=Join-Path $project 'Ciudad2DPlayModeEvidence'
          foreach($name in @('city2d-playmode-iPhone-1170x2532.png','city2d-playmode-horizontal-844x390.png')){
            $image=Join-Path $dir $name
            if(-not(Test-Path -LiteralPath $image) -or (Get-Item $image).Length -lt 8000){
              throw ('True PlayMode screenshot missing: '+$name)
            }
            Write-Host ("PLAYMODE_SCREENSHOT "+$name+" SHA256="+(Get-FileHash -Algorithm SHA256 -LiteralPath $image).Hash)
          }
          Write-Host ("REAL_PLAYMODE_TEST_PASS "+$passed+" of "+$tests)

      - name: Capture true Unity Editor I-III-V living city snapshots at two times
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_ambient_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Render locked-camera Unity A/B using source-traced Blender pair
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_blender_ab.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Capture authentic Unity 3-building A/B plus closeups (art remains unapproved)
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_ai_gallery.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Capture isolated premium Forja V3 against same real Unity baseline
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_forja_v3_gallery.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Authentic Unity A/B/C for mobile scene density and premium Cuartel
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_quality_v2_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Four-mode premium Cuartel and Aserradero real Unity snapshots
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_quality_v3_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Five-mode Granero V1 and Aserradero V2 premium scene native A-E (45 renders)
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_quality_v4_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Six-mode native A-F art comparison incl independent Quarry (60 renders)
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_quality_v5_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Six-mode quarry post-built preview in genuine Unity, source-pinned A-F
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_quality_v6_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      - name: Build separate Premium V2 scene with four buildings and genuine PlayMode
        shell: powershell
        run: |
          & (Join-Path $env:CITY2D_SOURCE_ROOT 'Unity/Assets/Experimentos/Ciudad2D/QA/run_premium_preview_v2_native.ps1') -SourceRoot $env:CITY2D_SOURCE_ROOT

      # Each Unity run may generate hundreds of full-resolution comparison frames.
      # Their SHA-256s remain in evidence.json; selected native screenshots are
      # versioned separately under QA/NativeV6 and review montages in GitHub.
      # Never re-upload every historical V2-V6 PNG in a single artifact.
      - name: Preserve compact, verifiable Unity evidence (not all historical PNGs)
        id: compact_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-curated-unity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/city2d-native-${{ github.run_id }}.log
            ${{ runner.temp }}/city2d-playmode-${{ github.run_id }}.log
            ${{ runner.temp }}/city2d-playmode-${{ github.run_id }}.xml
            ${{ runner.temp }}/city2d-quality-v6-${{ github.run_id }}.log
            ${{ runner.temp }}/city2d-premium-v2-scene-${{ github.run_id }}.log
            ${{ runner.temp }}/city2d-premium-v2-playmode-${{ github.run_id }}.log
            ${{ runner.temp }}/city2d-premium-v2-playmode-${{ github.run_id }}.xml
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DNativeEvidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DPlayModeEvidence/*.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DAmbientEvidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DBlenderPilotEvidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DAIPilotEvidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DForjaV3Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV2Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV3Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV4Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV5Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DPremiumPlayableV2Evidence/evidence.json
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/A_32_original_bastion5_390x844_standard.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion1_390x844_standard.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion3_390x844_standard.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_390x844_standard.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_1170x2532_standard.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_844x390_standard.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_1170x2532_cuartel_close.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_1170x2532_aserradero_close.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_1170x2532_granero_close.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DQualityV6Evidence/F_23_all_four_premium_bastion5_1170x2532_cantera_close.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DPremiumPlayableV2Evidence/premium_bastion5_390x844.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Ciudad2DPremiumPlayableV2Evidence/premium_bastion5_1170x2532.png
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Assets/Experimentos/Ciudad2D/QA/Experimento_Ciudad2D_PremiumV2.unity
            ${{ env.CITY2D_SOURCE_ROOT }}/Unity/Assets/Experimentos/Ciudad2D/QA/Experimento_Ciudad2D_PremiumV2.unity.meta
          if-no-files-found: warn
          retention-days: 7

      # Only the uniquely named scratch clone of this exact Actions run may
      # be cleaned. Never touch the live checkout, Unity installation or
      # another workflow's reservation. Keep scratch on upload failure.
      - name: Safely remove only this run's temporary Unity clone after upload
        if: always() && steps.compact_upload.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expected=[IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ('city2d-native-'+$env:GITHUB_RUN_ID)))
          if(-not $env:CITY2D_SOURCE_ROOT){ throw 'Refuse scratch cleanup: source root unset' }
          $actual=[IO.Path]::GetFullPath($env:CITY2D_SOURCE_ROOT)
          if(-not [string]::Equals($actual,$expected,[StringComparison]::OrdinalIgnoreCase)){
            throw 'Refuse scratch cleanup: not this run isolated clone'
          }
          if($actual -notmatch ('city2d-native-'+[regex]::Escape($env:GITHUB_RUN_ID)+'$')){
            throw 'Refuse scratch cleanup: unexpected final path'
          }
          if(-not (Test-Path -LiteralPath $actual -PathType Container)){
            Write-Host 'CITY2D_SCRATCH_ALREADY_GONE'; exit 0
          }
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){
            Write-Warning 'Unity or Blender still running; skip scratch deletion'
            exit 0
          }
          $before=(Get-ChildItem -LiteralPath $actual -File -Recurse -ErrorAction SilentlyContinue |
            Measure-Object -Property Length -Sum).Sum
          Remove-Item -LiteralPath $actual -Recurse -Force -ErrorAction Stop
          Write-Host ("CITY2D_ISOLATED_SCRATCH_REMOVED_BYTES="+$before)
