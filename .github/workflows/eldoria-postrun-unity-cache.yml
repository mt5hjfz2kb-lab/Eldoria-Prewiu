          t=[]
          for line in rows[j:]:
            if line and not line.startswith('          '):break
            t.append(line[10:] if line.startswith('          ') else '')
          code='\n'.join(t)+'\n'
          assert 'Remove-Item' not in code
          assert 'gitBackup' in code and 'Get-FileHash' in code
          assert 'Copy-Item -LiteralPath $gitSource' in code
          assert 'SHA256' in code
          Path('verify-git-preservation.ps1').write_text(code)
          PY
          pwsh -NoProfile -NonInteractive -Command '
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile("verify-git-preservation.ps1",[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors | Out-String | Write-Error; exit 1}
            Write-Host "GIT_METADATA_ARCHIVE_SCRIPT_PARSE_PASS"
          '
  archive-original-git-metadata-failed-819:
    if: github.event_name == 'push'
    needs: verify-git-metadata-archiver-failed-819
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
