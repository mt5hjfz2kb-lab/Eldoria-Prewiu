name: Eldoria post-run bounded Unity Library cleanup
on:
  push:
    branches: [maintenance/eldoria-runner-disk-audit-20261114]
    paths: [.github/workflows/eldoria-postrun-unity-cache.yml]
  workflow_run:
    workflows:
      - Vigilia de la Brecha genuine Unity first screen
      - Integrated beta — exclusive Vigilia, treasures and saved rewards
      - Issue 186 Unity native art evidence (exclusive Windows)
      - Eldoria compact terrain native parity and WebGL
      - Forja Oscura Unity native A-B evidence
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  test-guards:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github/workflows/eldoria-postrun-unity-cache.yml
          sparse-checkout-cone-mode: false
      - name: Reject unsafe cleanup policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/eldoria-postrun-unity-cache.yml').read_text()
          required=['workflow_run:','types: [completed]','SOURCE_RUN_ID','SOURCE_RUN_SHA',
            'Get-Process Unity,blender','Unity\\Library','sourceSha','head_sha',
            'actions/runs/','/artifacts?per_page=100','robocopy.exe $empty $lib /MIR /XJ',
            'Remove-Item -LiteralPath $lib','Remove-Item -LiteralPath $empty',
            'REFUSE:','Get-ChildItem -LiteralPath $lib -Recurse']
          for term in required:
            assert term in t, 'Missing safety gate: '+term
          assert t.count('\n          Remove-Item -LiteralPath $lib -Force')==1
          assert t.count('\n          Remove-Item -LiteralPath $empty -Force')==1
          print('ELDORIA_POSTRUN_STATIC_SOURCE_POLICY_PASS')
          PY
      - name: Parse actual cleanup PowerShell without executing it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows=Path('.github/workflows/eldoria-postrun-unity-cache.yml').read_text().splitlines()
          pos=next(i for i,r in enumerate(rows) if r.strip()=='- name: Reclaim exact completed run generated Library only')
          start=next(i for i in range(pos,len(rows)) if rows[i].strip()=='run: |')+1
          script=[]
          for line in rows[start:]:
            if line and not line.startswith('          '):break
            script.append(line[10:] if line.startswith('          ') else '')
          Path('eldoria-postrun-body.ps1').write_text('\n'.join(script)+'\n')
          assert len(script)>80
          PY
          if ! command -v pwsh >/dev/null; then
            echo 'PowerShell parser unavailable; cannot certify script' >&2
            exit 1
          fi
          pwsh -NoProfile -NonInteractive -Command '
            $tok=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile("eldoria-postrun-body.ps1",[ref]$tok,[ref]$errors)
            if($errors -and $errors.Count){$errors | Out-String | Write-Error; exit 1}
            Write-Host "ELDORIA_POSTRUN_POWERSHELL_PARSE_PASS"
          '
  reclaim:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - name: Reclaim exact completed run generated Library only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            Write-Host 'POSTRUN_SKIP_EDITOR_BUSY';exit 0
          }
          $runId=[string]$env:SOURCE_RUN_ID
          $sourceSha=[string]$env:SOURCE_RUN_SHA
          if($runId -notmatch '^[0-9]{9,15}$' -or $sourceSha -notmatch '^[a-f0-9]{40}$'){
            throw 'REFUSE: malformed exact source'
          }
          $map=@{
            'Vigilia de la Brecha genuine Unity first screen'='breachwatch-isolated-'
            'Integrated beta — exclusive Vigilia, treasures and saved rewards'='breachwatch-native-source-'
            'Issue 186 Unity native art evidence (exclusive Windows)'='issue186-fresh-source-'
            'Eldoria compact terrain native parity and WebGL'='beta-structural-source-'
            'Forja Oscura Unity native A-B evidence'='forja-thin-native-source-'
          }
          if(-not $map.ContainsKey($env:SOURCE_RUN_NAME)){exit 0}
          $suffix=if($env:SOURCE_RUN_NAME -match '^(Issue 186|Forja Oscura)'){''}else{'-1'}
          $name=$map[$env:SOURCE_RUN_NAME]+$runId+$suffix
          $parent='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $source=Join-Path $parent $name
          $lib=Join-Path $source 'Unity\Library'
          if(-not(Test-Path -LiteralPath $lib -PathType Container)){
            Write-Host "POSTRUN_SKIP_MISSING_CACHE $runId";exit 0
          }
          foreach($path in @($parent,$source,(Join-Path $source 'Unity'),$lib)){
            $d=Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if(-not $d.PSIsContainer -or ($d.Attributes -band [IO.FileAttributes]::ReparsePoint)){
              throw 'REFUSE: linked source ancestry'
            }
          }
          if(-not(Test-Path -LiteralPath (Join-Path $source '.git')) -or
             -not(Test-Path -LiteralPath (Join-Path $source 'Unity\Assets')) -or
             -not(Test-Path -LiteralPath (Join-Path $source 'Unity\ProjectSettings'))){
            throw 'REFUSE: original source not verifiable'
          }
          $headers=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json';'User-Agent'='eldoria-safe-postrun'}
          $run=Invoke-RestMethod -Uri ("https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/"+$runId) -Headers $headers -ErrorAction Stop
          if($run.status -ne 'completed' -or $run.head_sha -ne $sourceSha -or
             $run.name -ne $env:SOURCE_RUN_NAME -or
             $run.head_repository.full_name -ne 'mt5hjfz2kb-lab/Eldoria-Prewiu'){
            throw 'REFUSE: GitHub completed run identity mismatch'
          }
          $evidence=Invoke-RestMethod -Uri ("https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/$runId/artifacts?per_page=100") -Headers $headers -ErrorAction Stop
          if(@($evidence.artifacts | Where-Object {-not $_.expired -and $_.size_in_bytes -gt 10000}).Count -eq 0){
            Write-Host "POSTRUN_SKIP_UNARCHIVED $runId";exit 0
          }
          $git=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $git){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          }
          if(-not $git){throw 'REFUSE: installed Git unavailable'}
          $head=(& $git -C $source rev-parse HEAD).Trim()
          $remote=(& $git -C $source remote get-url origin).Trim()
          if($LASTEXITCODE -ne 0 -or $head -ne $sourceSha -or
             $remote -notin @('https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu',
               'https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git')){
            Write-Host "POSTRUN_SKIP_DIFFERENT_WORKTREE $runId";exit 0
          }
          $tracked=@(& $git -C $source ls-files -- Unity/Library)
          if($LASTEXITCODE -ne 0 -or $tracked.Count -ne 0){
            throw 'REFUSE: Library contains tracked sources'
          }
          $links=Get-ChildItem -LiteralPath $lib -Recurse -Force -ErrorAction Stop |
            Where-Object {$_.Attributes -band [IO.FileAttributes]::ReparsePoint} |
            Select-Object -First 1
          if($links){throw 'REFUSE: cache contains linked path'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){exit 0}
          $empty=Join-Path $env:RUNNER_TEMP ('eldoria-postrun-empty-'+$runId)
          if(Test-Path -LiteralPath $empty){throw 'REFUSE: unexpected mirror path'}
          New-Item -Path $empty -ItemType Directory -ErrorAction Stop | Out-Null
          $volume=[IO.DriveInfo]::new('C')
          [long]$before=$volume.AvailableFreeSpace
          & robocopy.exe $empty $lib /MIR /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP | Out-Null
          if($LASTEXITCODE -gt 7){throw 'REFUSE: robocopy returned failure'}
          if(@(Get-ChildItem -LiteralPath $lib -Force -ErrorAction Stop | Select-Object -First 1).Count){
            throw 'REFUSE: mirrored cache still nonempty'
          }
          Remove-Item -LiteralPath $lib -Force -ErrorAction Stop
          Remove-Item -LiteralPath $empty -Force -ErrorAction Stop
          [double]$gib=1024*1024*1024
          Write-Host ("POSTRUN_CACHE_RECLAIMED run={0} GiB={1:N3} assetsDeleted=false" -f
            $runId,(($volume.AvailableFreeSpace-$before)/$gib))
          exit 0

  audit-remaining-isolated-worktrees:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[storage-probe]')
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 13
    steps:
      - name: Measure remaining historical sources and Git dependency safety without modifying files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            Write-Host 'STORAGE_PROBE_SKIP_ACTIVE_EDITOR';exit 0
          }
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          [double]$gib=1024*1024*1024
          $drive=[IO.DriveInfo]::new('C')
          Write-Host ("STORAGE_PROBE_BEFORE freeGiB={0:N3} usedGiB={1:N3}" -f ($drive.AvailableFreeSpace/$gib),(($drive.TotalSize-$drive.AvailableFreeSpace)/$gib))
          $names=@(
            'valoria-layered-source',
            'beta-structural-source-42505611257-1',
            'timer-source',
            'forja-thin-native-source-42408083695',
            'breachwatch-native-source-43469529824-1',
            'breachwatch-native-source-43489752868-1',
            'delight-source',
            'beta-structural-source-42427811334-1',
            'forja-source',
            'daily-source',
            'forja-thin-native-source-42404744384',
            'issue186-source',
            'beta-structural-source-42428875558-1',
            'beta-structural-source-42503628688-1',
            'breachwatch-isolated-43590398106-1',
            'breachwatch-isolated-43532823031-1',
            'issue186-fresh-source-43583823285',
            'issue186-fresh-source-43520031645',
            'issue186-fresh-source-43511148168',
            'issue186-fresh-source-43503266427'
          )
          $git=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $git){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path -LiteralPath $_} |
              Select-Object -First 1
          }
          if(-not $git){throw 'Git is not available for read-only checkout identity'}
          $all=@(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)
          $deadline=[datetime]::UtcNow.AddMinutes(10)
          function Sum-Tree([string]$p){
            [long]$bytes=0
            [long]$files=0
            [int]$links=0
            [int]$scanErrors=0
            $stack=New-Object 'System.Collections.Generic.Stack[string]'
            $stack.Push($p)
            while($stack.Count -gt 0){
              if([datetime]::UtcNow -ge $deadline){return @{size=$bytes;files=$files;links=$links;complete=$false}}
              $next=$stack.Pop()
              try{
                foreach($f in ([IO.DirectoryInfo]::new($next)).EnumerateFileSystemInfos()){
                  try{
                    if($f.Attributes -band [IO.FileAttributes]::ReparsePoint){$links++;continue}
                    if($f -is [IO.DirectoryInfo]){$stack.Push($f.FullName)}
                    else{$bytes+=[long]$f.Length;$files++}
                  }catch{$scanErrors++}
                }
              }catch{$scanErrors++}
            }
            return @{size=$bytes;files=$files;links=$links;scanErrors=$scanErrors;complete=($scanErrors -eq 0)}
          }
          foreach($name in $names){
            if([datetime]::UtcNow -ge $deadline){Write-Host 'STORAGE_PROBE_PARTIAL_TIMEOUT';break}
            $path=Join-Path $root $name
            if(-not(Test-Path -LiteralPath $path -PathType Container)){
              Write-Host ("STORAGE_PROBE_ABSENT name={0}" -f $name);continue
            }
            $siz=Sum-Tree $path
            $lib=Join-Path $path 'Unity\Library'
            $libPresent=Test-Path -LiteralPath $lib -PathType Container
            $gitDir=Join-Path $path '.git'
            $gitPresent=Test-Path -LiteralPath $gitDir
            $head=''
            $dirty=0
            $untracked=0
            if($gitPresent){
              try{
                $head=((& $git -C $path rev-parse HEAD 2>$null) | Select-Object -First 1)
                if($LASTEXITCODE -ne 0 -or $head -notmatch '^[a-f0-9]{40}$'){$head='invalid-head'}
              }catch{$head='invalid-head'}
              if($head -match '^[a-f0-9]{40}$'){
                try{$dirty=@(& $git -C $path status --porcelain=v1 --untracked-files=no 2>$null).Count}catch{$dirty=-1}
                try{$untracked=@(& $git -C $path ls-files --others --exclude-standard 2>$null).Count}catch{$untracked=-1}
              }
            }
            $dependent=@()
            foreach($neighbor in $all){
              if($neighbor.Name -eq $name){continue}
              $alt=Join-Path $neighbor.FullName '.git\objects\info\alternates'
              if(Test-Path -LiteralPath $alt -PathType Leaf){
                if(([IO.File]::ReadAllText($alt)).IndexOf($name,[StringComparison]::OrdinalIgnoreCase) -ge 0){
                  $dependent+=1
                }
              }
            }
            Write-Host ("STORAGE_PROBE_SOURCE name={0} GiB={1:N3} files={2} complete={3} links={4} scanErrors={11} libraryPresent={5} gitPresent={6} dirtyTracked={7} untracked={8} dependentCount={9} head={10}" -f
              $name,($siz.size/$gib),$siz.files,$siz.complete,$siz.links,$libPresent,$gitPresent,$dirty,$untracked,$dependent.Count,$head,$siz.scanErrors)
          }
          Write-Host ("STORAGE_PROBE_END freeGiB={0:N3} changedFiles=false deleted=false" -f ($drive.AvailableFreeSpace/$gib))

  validate-source-delta-archiver-f047:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[archive-f047]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github/workflows/eldoria-postrun-unity-cache.yml
          sparse-checkout-cone-mode: false
      - name: Inspect actual archival PowerShell syntax and non-destructive scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows=Path('.github/workflows/eldoria-postrun-unity-cache.yml').read_text().splitlines()
          i=next(i for i,r in enumerate(rows) if r.strip()=='- name: Archive exact unique source changes without deleting originals')
          j=next(i for i in range(i,len(rows)) if rows[i].strip()=='run: |')+1
          out=[]
          for r in rows[j:]:
            if r and not r.startswith('          '):break
            out.append(r[10:] if r.startswith('          ') else '')
          t='\n'.join(out)+'\n'
          assert 'Remove-Item' not in t
          assert 'Move-Item -LiteralPath $temporaryZip' in t
          assert 'ZipArchive' in t
          assert 'Get-FileHash' in t
          assert '4d838a69f7db40232c9c9516e9a0ec109f009e2f' in t
          Path('archive-one-source.ps1').write_text(t)
          print('ELDORIA_SOURCE_DELTA_ARCHIVE_NO_DELETE_STATIC_PASS')
          PY
          pwsh -NoProfile -NonInteractive -Command '
            $tokens=$null; $errs=$null
            $null=[Management.Automation.Language.Parser]::ParseFile("archive-one-source.ps1",[ref]$tokens,[ref]$errs)
            if($errs.Count){$errs | Out-String | Write-Error;exit 1}
            Write-Host "ELDORIA_SOURCE_DELTA_ARCHIVE_POWERSHELL_PARSE_PASS"
          '
  create-reversible-delta-archive-f047:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[archive-f047]')
    needs: validate-source-delta-archiver-f047
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Archive exact unique source changes without deleting originals
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            Write-Host 'DELTA_ARCHIVE_SKIPPED_EDITOR_BUSY';exit 0
          }
          $git=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $git){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          }
          if(-not $git){throw 'No Git for recovery provenance'}
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $label='forja-thin-native-source-42404744384'
          $source=Join-Path $root $label
          $head=(& $git -C $source rev-parse HEAD).Trim()
          $remote=(& $git -C $source remote get-url origin).Trim()
          if($LASTEXITCODE -ne 0 -or
             $head -ne '4d838a69f7db40232c9c9516e9a0ec109f009e2f' -or
             $remote -notin @('https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu',
               'https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git')){
            throw 'REFUSE: original branch source changed'
          }
          if(Test-Path -LiteralPath (Join-Path $source 'Unity\Library')){
            throw 'REFUSE: generated Unity Library unexpectedly returned'
          }
          function Get-GitNul([string]$arguments){
            $p=New-Object Diagnostics.ProcessStartInfo
            $p.FileName=$git
            $p.Arguments='-C "'+$source+'" '+$arguments
            $p.UseShellExecute=$false
            $p.RedirectStandardOutput=$true
            $p.RedirectStandardError=$true
            $p.CreateNoWindow=$true
            $p.StandardOutputEncoding=[Text.Encoding]::UTF8
            $proc=[Diagnostics.Process]::Start($p)
            $content=$proc.StandardOutput.ReadToEnd()
            $errorOutput=$proc.StandardError.ReadToEnd()
            $proc.WaitForExit()
            if($proc.ExitCode -ne 0){throw 'Git source inventory failed'}
            return @($content.Split([char]0) | Where-Object {$_.Length})
          }
          $changed=@(Get-GitNul 'ls-files -m -z')
          $untracked=@(Get-GitNul 'ls-files -o --exclude-standard -z')
          $ignored=@(Get-GitNul 'ls-files -o -i --exclude-standard -z')
          $deleted=@(Get-GitNul 'ls-files -d -z')
          if($changed.Count -gt 5000 -or $untracked.Count -gt 10000 -or
             $ignored.Count -gt 1500 -or $deleted.Count -ne 0){
            throw 'REFUSE: unexpected source delta size or tracked deletions'
          }
          $files=[Collections.Generic.Dictionary[string,string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach($group in @(
            @{tag='modified';paths=$changed},
            @{tag='untracked';paths=$untracked},
            @{tag='ignored';paths=$ignored}
          )){
            foreach($relative in $group.paths){
              if($relative.StartsWith('/') -or $relative.Contains('\') -or
                 $relative.Contains(':') -or $relative.Split('/') -contains '..' -or
                 $relative.StartsWith('.git/')){
                throw 'REFUSE: unsafe relative archive source path'
              }
              if($files.ContainsKey($relative)){throw 'REFUSE: duplicate archive relative path'}
              $files.Add($relative,$group.tag)
            }
          }
          $expected=$changed.Count+$untracked.Count+$ignored.Count
          if($files.Count -ne $expected){throw 'REFUSE: duplicate file entries'}
          [long]$rawUniqueBytes=0
          foreach($relative in @($files.Keys)){
            $candidate=Join-Path $source ($relative.Replace('/','\'))
            $item=Get-Item -LiteralPath $candidate -Force -ErrorAction Stop
            if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)){
              throw 'REFUSE: unique file not safe to archive'
            }
            $rawUniqueBytes += [long]$item.Length
          }
          if($rawUniqueBytes -gt 1600MB){throw 'REFUSE: unique data exceeds off-machine artifact limit'}
          Write-Host ("SOURCE_DELTA_PREFLIGHT uniqueFiles={0} uncompressedMiB={1:N2}" -f $files.Count,($rawUniqueBytes/1MB))
          $archiveRoot='C:\actions-runner-eldoria\_preserved_snapshots'
          if(-not(Test-Path -LiteralPath $archiveRoot)){
            New-Item -ItemType Directory -Path $archiveRoot -ErrorAction Stop | Out-Null
          }
          if((Get-Item -LiteralPath $archiveRoot).Attributes -band [IO.FileAttributes]::ReparsePoint){
            throw 'REFUSE: archive root links outside runner'
          }
          $finalZip=Join-Path $archiveRoot ($label+'-unique-20261114.zip')
          $temporaryZip=$finalZip+'.staging-'+$env:GITHUB_RUN_ID
          if(Test-Path -LiteralPath $finalZip){throw 'REFUSE: immutable unique source archive already exists'}
          if(Test-Path -LiteralPath $temporaryZip){throw 'REFUSE: staging archive already exists'}
          $disk=[IO.DriveInfo]::new('C')
          [double]$gib=1024*1024*1024
          if($disk.AvailableFreeSpace -lt 20*$gib){throw 'REFUSE: low free disk for archive'}
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $shaObj=[Security.Cryptography.SHA256]::Create()
          $items=New-Object System.Collections.ArrayList
          $fileStream=[IO.File]::Open($temporaryZip,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write)
          $zip=[IO.Compression.ZipArchive]::new($fileStream,[IO.Compression.ZipArchiveMode]::Create,$false)
          try {
            foreach($relative in @($files.Keys | Sort-Object)){
              $full=[IO.Path]::GetFullPath((Join-Path $source $relative.Replace('/','\')))
              if(-not $full.StartsWith($source+'\',[StringComparison]::OrdinalIgnoreCase)){
                throw 'REFUSE: file escaped source root'
              }
              $item=Get-Item -LiteralPath $full -Force -ErrorAction Stop
              if($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)){
                throw 'REFUSE: linked directory or non-file in source delta'
              }
              $parent=[IO.Path]::GetDirectoryName($full)
              while(-not $parent.Equals($source,[StringComparison]::OrdinalIgnoreCase)){
                $d=Get-Item -LiteralPath $parent -Force -ErrorAction Stop
                if($d.Attributes -band [IO.FileAttributes]::ReparsePoint){
                  throw 'REFUSE: source directory redirects outside workspace'
                }
                $parent=[IO.Path]::GetDirectoryName($parent)
                if(-not $parent.StartsWith($source,[StringComparison]::OrdinalIgnoreCase)){
                  throw 'REFUSE: ancestor path escaped checkout'
                }
              }
              $data=[IO.File]::OpenRead($full)
              try{$hash=[BitConverter]::ToString($shaObj.ComputeHash($data)).Replace('-','').ToLowerInvariant()}
              finally{$data.Dispose()}
              $archivePath='overlays/'+$relative
              $null=[IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip,$full,$archivePath,[IO.Compression.CompressionLevel]::Optimal)
              $null=$items.Add([pscustomobject]@{
                path=$relative;archivePath=$archivePath;kind=$files[$relative];
                bytes=[long]$item.Length;sha256=$hash;lastWrittenUtc=$item.LastWriteTimeUtc.ToString('o')
              })
            }
            $manifest=[pscustomobject]@{
              schema='eldoria-reversible-source-overlay-1'
              source=$label
              sourceSha=$head
              origin=$remote
              capturedUtc=[datetime]::UtcNow.ToString('o')
              sourceHasNotBeenDeleted=$true
              ignoredFilesIncluded=$true
              modifiedCount=$changed.Count
              untrackedCount=$untracked.Count
              ignoredCount=$ignored.Count
              deletedTrackedPaths=@()
              files=@($items)
            }
            $json=$manifest | ConvertTo-Json -Depth 8
            $manifestEntry=$zip.CreateEntry('manifest.json',[IO.Compression.CompressionLevel]::Optimal)
            $writer=New-Object IO.StreamWriter($manifestEntry.Open(),[Text.UTF8Encoding]::new($false))
            try{$writer.Write($json)}finally{$writer.Dispose()}
          } finally {
            $zip.Dispose()
            $fileStream.Dispose()
          }
          $reader=[IO.Compression.ZipFile]::OpenRead($temporaryZip)
          try {
            if($reader.Entries.Count -ne $items.Count+1){
              throw 'REFUSE: archive entry count does not match manifest'
            }
            foreach($file in $items){
              $entry=$reader.GetEntry($file.archivePath)
              if($null -eq $entry -or $entry.Length -ne $file.bytes){
                throw 'REFUSE: archived file missing or length changed'
              }
              $stream=$entry.Open()
              try{$hash=[BitConverter]::ToString($shaObj.ComputeHash($stream)).Replace('-','').ToLowerInvariant()}
              finally{$stream.Dispose()}
              if($hash -ne $file.sha256){
                throw 'REFUSE: archived content hash does not match original'
              }
            }
            if($null -eq $reader.GetEntry('manifest.json')){
              throw 'REFUSE: archival restoration manifest missing'
            }
          } finally {
            $reader.Dispose()
            $shaObj.Dispose()
          }
          Move-Item -LiteralPath $temporaryZip -Destination $finalZip -ErrorAction Stop
          $archiveHash=(Get-FileHash -LiteralPath $finalZip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ("SOURCE_DELTA_ARCHIVE_VERIFIED name={0} files={1} sizeMiB={2:N2} sha256={3}" -f
            $label,$items.Count,((Get-Item -LiteralPath $finalZip).Length/1MB),$archiveHash)
          Write-Host ("SOURCE_DELTA_ORIGINAL_PRESERVED sha={0} retainedOnSamePC=true removed=false" -f $head)
          exit 0

