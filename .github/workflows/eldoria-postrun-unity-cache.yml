name: Eldoria post-run bounded Unity Library cleanup
on:
  push:
    branches: [maintenance/eldoria-runner-disk-audit-20261114]
    paths: [.github/workflows/eldoria-postrun-unity-cache.yml]
  workflow_run:
    workflows:
      - Vigilia de la Brecha genuine Unity first screen
      - Integrated beta — exclusive Vigilia, treasures and saved rewards
      - Issue 186 Unity native art evidence (exclusive Windows)
      - Eldoria compact terrain native parity and WebGL
      - Forja Oscura Unity native A-B evidence
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  test-guards:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github/workflows/eldoria-postrun-unity-cache.yml
          sparse-checkout-cone-mode: false
      - name: Reject unsafe cleanup policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/eldoria-postrun-unity-cache.yml').read_text()
          required=['workflow_run:','types: [completed]','SOURCE_RUN_ID','SOURCE_RUN_SHA',
            'Get-Process Unity,blender','Unity\\Library','sourceSha','head_sha',
            'actions/runs/','/artifacts?per_page=100','robocopy.exe $empty $lib /MIR /XJ',
            'Remove-Item -LiteralPath $lib','Remove-Item -LiteralPath $empty',
            'REFUSE:','Get-ChildItem -LiteralPath $lib -Recurse']
          for term in required:
            assert term in t, 'Missing safety gate: '+term
          assert t.count('\n          Remove-Item -LiteralPath $lib -Force')==1
          assert t.count('\n          Remove-Item -LiteralPath $empty -Force')==2
          print('ELDORIA_POSTRUN_STATIC_SOURCE_POLICY_PASS')
          PY
      - name: Parse actual cleanup PowerShell without executing it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows=Path('.github/workflows/eldoria-postrun-unity-cache.yml').read_text().splitlines()
          pos=next(i for i,r in enumerate(rows) if r.strip()=='- name: Reclaim exact completed run generated Library only')
          start=next(i for i in range(pos,len(rows)) if rows[i].strip()=='run: |')+1
          script=[]
          for line in rows[start:]:
            if line and not line.startswith('          '):break
            script.append(line[10:] if line.startswith('          ') else '')
          Path('eldoria-postrun-body.ps1').write_text('\n'.join(script)+'\n')
          assert len(script)>80
          PY
          if ! command -v pwsh >/dev/null; then
            echo 'PowerShell parser unavailable; cannot certify script' >&2
            exit 1
          fi
          pwsh -NoProfile -NonInteractive -Command '
            $tok=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile("eldoria-postrun-body.ps1",[ref]$tok,[ref]$errors)
            if($errors -and $errors.Count){$errors | Out-String | Write-Error; exit 1}
            Write-Host "ELDORIA_POSTRUN_POWERSHELL_PARSE_PASS"
          '
  reclaim:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_NAME: ${{ github.event.workflow_run.name }}
    steps:
      - name: Reclaim exact completed run generated Library only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            Write-Host 'POSTRUN_SKIP_EDITOR_BUSY';exit 0
          }
          $runId=[string]$env:SOURCE_RUN_ID
          $sourceSha=[string]$env:SOURCE_RUN_SHA
          if($runId -notmatch '^[0-9]{9,15}$' -or $sourceSha -notmatch '^[a-f0-9]{40}$'){
            throw 'REFUSE: malformed exact source'
          }
          $map=@{
            'Vigilia de la Brecha genuine Unity first screen'='breachwatch-isolated-'
            'Integrated beta — exclusive Vigilia, treasures and saved rewards'='breachwatch-native-source-'
            'Issue 186 Unity native art evidence (exclusive Windows)'='issue186-fresh-source-'
            'Eldoria compact terrain native parity and WebGL'='beta-structural-source-'
            'Forja Oscura Unity native A-B evidence'='forja-thin-native-source-'
          }
          if(-not $map.ContainsKey($env:SOURCE_RUN_NAME)){exit 0}
          $suffix=if($env:SOURCE_RUN_NAME -match '^(Issue 186|Forja Oscura)'){''}else{'-1'}
          $name=$map[$env:SOURCE_RUN_NAME]+$runId+$suffix
          $parent='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $source=Join-Path $parent $name
          $lib=Join-Path $source 'Unity\Library'
          if(-not(Test-Path -LiteralPath $lib -PathType Container)){
            Write-Host "POSTRUN_SKIP_MISSING_CACHE $runId";exit 0
          }
          foreach($path in @($parent,$source,(Join-Path $source 'Unity'),$lib)){
            $d=Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if(-not $d.PSIsContainer -or ($d.Attributes -band [IO.FileAttributes]::ReparsePoint)){
              throw 'REFUSE: linked source ancestry'
            }
          }
          if(-not(Test-Path -LiteralPath (Join-Path $source '.git')) -or
             -not(Test-Path -LiteralPath (Join-Path $source 'Unity\Assets')) -or
             -not(Test-Path -LiteralPath (Join-Path $source 'Unity\ProjectSettings'))){
            throw 'REFUSE: original source not verifiable'
          }
          $headers=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json';'User-Agent'='eldoria-safe-postrun'}
          $run=Invoke-RestMethod -Uri ("https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/"+$runId) -Headers $headers -ErrorAction Stop
          if($run.status -ne 'completed' -or $run.head_sha -ne $sourceSha -or
             $run.name -ne $env:SOURCE_RUN_NAME -or
             $run.head_repository.full_name -ne 'mt5hjfz2kb-lab/Eldoria-Prewiu'){
            throw 'REFUSE: GitHub completed run identity mismatch'
          }
          $evidence=Invoke-RestMethod -Uri ("https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/$runId/artifacts?per_page=100") -Headers $headers -ErrorAction Stop
          if(@($evidence.artifacts | Where-Object {-not $_.expired -and $_.size_in_bytes -gt 10000}).Count -eq 0){
            Write-Host "POSTRUN_SKIP_UNARCHIVED $runId";exit 0
          }
          $git=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $git){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          }
          if(-not $git){throw 'REFUSE: installed Git unavailable'}
          $head=(& $git -C $source rev-parse HEAD).Trim()
          $remote=(& $git -C $source remote get-url origin).Trim()
          if($LASTEXITCODE -ne 0 -or $head -ne $sourceSha -or
             $remote -notin @('https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu',
               'https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git')){
            Write-Host "POSTRUN_SKIP_DIFFERENT_WORKTREE $runId";exit 0
          }
          $tracked=@(& $git -C $source ls-files -- Unity/Library)
          if($LASTEXITCODE -ne 0 -or $tracked.Count -ne 0){
            throw 'REFUSE: Library contains tracked sources'
          }
          $links=Get-ChildItem -LiteralPath $lib -Recurse -Force -ErrorAction Stop |
            Where-Object {$_.Attributes -band [IO.FileAttributes]::ReparsePoint} |
            Select-Object -First 1
          if($links){throw 'REFUSE: cache contains linked path'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){exit 0}
          $empty=Join-Path $env:RUNNER_TEMP ('eldoria-postrun-empty-'+$runId)
          if(Test-Path -LiteralPath $empty){throw 'REFUSE: unexpected mirror path'}
          New-Item -Path $empty -ItemType Directory -ErrorAction Stop | Out-Null
          $volume=[IO.DriveInfo]::new('C')
          [long]$before=$volume.AvailableFreeSpace
          & robocopy.exe $empty $lib /MIR /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP | Out-Null
          if($LASTEXITCODE -gt 7){throw 'REFUSE: robocopy returned failure'}
          if(@(Get-ChildItem -LiteralPath $lib -Force -ErrorAction Stop | Select-Object -First 1).Count){
            throw 'REFUSE: mirrored cache still nonempty'
          }
          Remove-Item -LiteralPath $lib -Force -ErrorAction Stop
          Remove-Item -LiteralPath $empty -Force -ErrorAction Stop
          [double]$gib=1024*1024*1024
          Write-Host ("POSTRUN_CACHE_RECLAIMED run={0} GiB={1:N3} assetsDeleted=false" -f
            $runId,(($volume.AvailableFreeSpace-$before)/$gib))
          exit 0


  guard-retire-one-historical-worktree:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: .github/workflows/eldoria-postrun-unity-cache.yml
          sparse-checkout-cone-mode: false
      - name: Verify exact run checkout retirement script syntax and backup prerequisite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('.github/workflows/eldoria-postrun-unity-cache.yml').read_text().splitlines()
          i=next(i for i,s in enumerate(r) if s.strip()=='- name: Retire original redundant failed worktree only after complete backup verification')
          j=next(i for i in range(i,len(r)) if r[i].strip()=='run: |')+1
          body=[]
          for line in r[j:]:
            if line and not line.startswith('          '):break
            body.append(line[10:] if line.startswith('          ') else '')
          code='\n'.join(body)+'\n'
          assert code.count('robocopy.exe $empty $source /MIR /XJ')==1
          assert code.count('Remove-Item -LiteralPath $source -Force')==1
          assert '7eed9e4549a1a72b97ded1ab32f23eba489c04c4a5b2ef92094585364b8e9bf6' in code
          assert 'd0da7f2a3130b81c2bf347c7e5c3f0c2e7bf062dd2bfcd0b2d26e7a0372b5277' in code
          assert 'Get-Process Unity,blender,git' in code
          assert 'objects' in code and 'alternates' in code
          assert 'manifest.files' in code
          Path('retire-exact-checkout.ps1').write_text(code)
          print('WORKTREE_RETIRE_NO_UNBACKED_SOURCE_GUARD_PASS')
          PY
          pwsh -NoProfile -NonInteractive -Command '
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile("retire-exact-checkout.ps1",[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors | Out-String | Write-Error;exit 1}
            Write-Host "WORKTREE_RETIRE_POWERSHELL_PARSE_PASS"
          '
  retire-archived-worktree:
    if: github.event_name == 'push'
    needs: guard-retire-one-historical-worktree
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Retire original redundant failed worktree only after complete backup verification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          [double]$gib=1024*1024*1024
          $drive=[IO.DriveInfo]::new('C')
          [double]$before=$drive.AvailableFreeSpace
          Write-Host ("HISTORICAL_RETIRE_BEGIN freeGiB={0:N3}" -f ($before/$gib))
          if(@(Get-Process Unity,blender,git -ErrorAction SilentlyContinue).Count){
            Write-Host 'HISTORICAL_RETIRE_SKIP_TOOLS_ACTIVE';exit 0
          }
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $label='breachwatch-native-source-43465479546-1'
          $source=Join-Path $root $label
          $gitOriginal=Join-Path $source '.git'
          $backups='C:\actions-runner-eldoria\_preserved_snapshots'
          $overlay=Join-Path $backups ($label+'-unique-20261114.zip')
          $gitBackup=Join-Path $backups ($label+'-git-objects')
          $gitManifest=Join-Path $backups ($label+'-git-manifest.json')
          if(-not(Test-Path -LiteralPath $source -PathType Container)){
            Write-Host 'HISTORICAL_RETIRE_ALREADY_ABSENT';exit 0
          }
          foreach($required in @($root,$source,$gitOriginal,$backups,$gitBackup)){
            $info=Get-Item -LiteralPath $required -Force -ErrorAction Stop
            if(-not $info.PSIsContainer -or ($info.Attributes -band [IO.FileAttributes]::ReparsePoint)){
              throw 'REFUSE: reparse point or invalid original/backup parent'
            }
          }
          foreach($required in @($overlay,$gitManifest,(Join-Path $source 'Unity\Assets'),
            (Join-Path $source 'Unity\ProjectSettings'),(Join-Path $gitBackup 'HEAD'))){
            if(-not(Test-Path -LiteralPath $required)){
              throw 'REFUSE: restore prerequisites missing'
            }
          }
          if((Get-FileHash -LiteralPath $overlay -Algorithm SHA256).Hash.ToLowerInvariant() -ne
             '7eed9e4549a1a72b97ded1ab32f23eba489c04c4a5b2ef92094585364b8e9bf6'){
            throw 'REFUSE: local unique overlay checksum mismatched'
          }
          if((Get-FileHash -LiteralPath $gitManifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne
             'd0da7f2a3130b81c2bf347c7e5c3f0c2e7bf062dd2bfcd0b2d26e7a0372b5277'){
            throw 'REFUSE: local original Git backup manifest checksum mismatched'
          }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $reader=[IO.Compression.ZipFile]::OpenRead($overlay)
          try {
            $manifestEntry=$reader.GetEntry('manifest.json')
            if($null -eq $manifestEntry){throw 'REFUSE: source overlay manifest not found'}
            $stream=[IO.StreamReader]::new($manifestEntry.Open())
            try{$manifest=$stream.ReadToEnd() | ConvertFrom-Json}finally{$stream.Dispose()}
            if($manifest.source -ne $label -or
               $manifest.sourceSha -ne 'bf2cc865722aee8b8ec08c01507361570f1227cd' -or
               @($manifest.files).Count -ne 354 -or
               $manifest.modifiedCount -ne 149 -or
               $manifest.untrackedCount -ne 202 -or
               $manifest.ignoredCount -ne 3 -or
               @($manifest.deletedTrackedPaths).Count -ne 0){
              throw 'REFUSE: source overlay manifest identity changed'
            }
            foreach($file in @($manifest.files)){
              $path=[string]$file.path
              if($path.Contains(':') -or $path.StartsWith('/') -or $path.Split('/') -contains '..'){
                throw 'REFUSE: unsafe relative overlay entry'
              }
              $original=Join-Path $source ($path.Replace('/','\'))
              $entry=$reader.GetEntry([string]$file.archivePath)
              if($null -eq $entry -or $entry.Length -ne $file.bytes -or
                 -not(Test-Path -LiteralPath $original -PathType Leaf)){
                throw 'REFUSE: overlay entry or live source missing'
              }
              $liveHash=(Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant()
              if($liveHash -ne [string]$file.sha256){
                throw 'REFUSE: original source changed after archive verification'
              }
            }
          } finally {$reader.Dispose()}
          $gitFiles=@(Get-ChildItem -LiteralPath $gitOriginal -Recurse -File -Force -ErrorAction Stop)
          $gitRecord=(Get-Content -LiteralPath $gitManifest -Raw -ErrorAction Stop | ConvertFrom-Json)
          if($gitRecord.source -ne $label -or $gitRecord.count -ne 39 -or
             $gitFiles.Count -ne @($gitRecord.files).Count){
            throw 'REFUSE: original Git inventory differs from archived source'
          }
          foreach($item in @($gitRecord.files)){
            $src=Join-Path $gitOriginal ([string]$item.path)
            $backup=Join-Path $gitBackup ([string]$item.path)
            if(-not(Test-Path -LiteralPath $src -PathType Leaf) -or
               -not(Test-Path -LiteralPath $backup -PathType Leaf)){
              throw 'REFUSE: original or archived Git object missing'
            }
            $srcHash=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLowerInvariant()
            $bakHash=(Get-FileHash -LiteralPath $backup -Algorithm SHA256).Hash.ToLowerInvariant()
            if($srcHash -ne $item.sha256 -or $bakHash -ne $item.sha256){
              throw 'REFUSE: Git metadata backup no longer equals original'
            }
          }
          $git=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $git){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          }
          if(-not $git){throw 'REFUSE: installed Git unavailable'}
          $sha=(& $git -C $source rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $sha -ne 'bf2cc865722aee8b8ec08c01507361570f1227cd'){
            throw 'REFUSE: original Git HEAD moved after archive'
          }
          $status=@(& $git -C $source status --porcelain=v1 --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or
             @($status | Where-Object {$_ -notmatch '^\?\?'}).Count -ne 149 -or
             @($status | Where-Object {$_ -match '^\?\?'}).Count -ne 202){
            throw 'REFUSE: local modified/untracked source count moved'
          }
          foreach($neighbor in @(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)){
            if($neighbor.Name -eq $label){continue}
            $alternate=Join-Path $neighbor.FullName '.git\objects\info\alternates'
            if(Test-Path -LiteralPath $alternate -PathType Leaf){
              $contents=[IO.File]::ReadAllText($alternate)
              if($contents.IndexOf($label,[StringComparison]::OrdinalIgnoreCase) -ge 0){
                throw 'REFUSE: another repository depends on these Git objects'
              }
            }
          }
          $links=Get-ChildItem -LiteralPath $source -Recurse -Force -ErrorAction Stop |
            Where-Object {$_.Attributes -band [IO.FileAttributes]::ReparsePoint} |
            Select-Object -First 1
          if($links){throw 'REFUSE: source worktree has linked data'}
          if(@(Get-Process Unity,blender,git -ErrorAction SilentlyContinue).Count){
            throw 'REFUSE: tools started while checking backup'
          }
          $empty=Join-Path $env:RUNNER_TEMP ('eldoria-archive-retirement-empty-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $empty){throw 'REFUSE: unexpected mirror directory exists'}
          New-Item -ItemType Directory -Path $empty -ErrorAction Stop | Out-Null
          Write-Host ("HISTORICAL_RETIRE_VERIFIED label={0} archiveFiles=354 gitBackupFiles=39 originalSha={1}" -f
            $label,$sha)
          & robocopy.exe $empty $source /MIR /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP | Out-Null
          $exitCode=$LASTEXITCODE
          if($exitCode -gt 7){throw ("REFUSE: whole-worktree mirror failed code "+$exitCode)}
          if(@(Get-ChildItem -LiteralPath $source -Force -ErrorAction Stop | Select-Object -First 1).Count){
            throw 'REFUSE: original folder not empty after verified retirement'
          }
          Remove-Item -LiteralPath $source -Force -ErrorAction Stop
          Remove-Item -LiteralPath $empty -Force -ErrorAction Stop
          if(-not(Test-Path -LiteralPath $overlay -PathType Leaf) -or
             -not(Test-Path -LiteralPath (Join-Path $gitBackup 'HEAD') -PathType Leaf)){
            throw 'REFUSE: original verified backups disappeared'
          }
          Write-Host ("HISTORICAL_RETIRE_COMPLETE label={0} freedGiB={1:N3} freeGiB={2:N3} backupRetained=true remoteCommitAvailable=true" -f
            $label,(($drive.AvailableFreeSpace-$before)/$gib),($drive.AvailableFreeSpace/$gib))
          exit 0
