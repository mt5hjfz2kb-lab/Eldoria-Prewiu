            Write-Host 'GIT_METADATA_ARCHIVE_SKIP_TOOL_BUSY';exit 0
          }
          $label='breachwatch-native-source-43481923633-1'
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $source=Join-Path $root $label
          $gitSource=Join-Path $source '.git'
          $archiveRoot='C:\actions-runner-eldoria\_preserved_snapshots'
          $overlayZip=Join-Path $archiveRoot ($label+'-unique-20261114.zip')
          $gitBackup=Join-Path $archiveRoot ($label+'-git-objects')
          $manifestPath=Join-Path $archiveRoot ($label+'-git-manifest.json')
          if(-not(Test-Path -LiteralPath $overlayZip -PathType Leaf) -or
             -not(Test-Path -LiteralPath (Join-Path $gitSource 'HEAD') -PathType Leaf)){
            throw 'REFUSE: reversible overlay or original Git missing'
          }
          if((Get-FileHash -LiteralPath $overlayZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne
             '7309a8072e66eda5e0a1c5951ef7f8b28b149d33e7e8d02bd0649369d5333dc0'){
            throw 'REFUSE: verified overlay checksum has changed'
          }
          if(Test-Path -LiteralPath $gitBackup){throw 'REFUSE: Git backup destination already exists'}
          if(Test-Path -LiteralPath $manifestPath){throw 'REFUSE: Git backup manifest already exists'}
          $attrs=(Get-Item -LiteralPath $gitSource -Force).Attributes
          if($attrs -band [IO.FileAttributes]::ReparsePoint){throw 'REFUSE: original Git is a junction'}
          $srcFiles=@(Get-ChildItem -LiteralPath $gitSource -Recurse -File -Force -ErrorAction Stop)
          $linked=Get-ChildItem -LiteralPath $gitSource -Recurse -Force -ErrorAction Stop |
            Where-Object {$_.Attributes -band [IO.FileAttributes]::ReparsePoint} | Select-Object -First 1
          if($linked){throw 'REFUSE: original Git references a linked file'}
          if($srcFiles.Count -lt 20 -or $srcFiles.Count -gt 500){
            throw 'REFUSE: unexpected Git source inventory count'
          }
          [double]$gib=1024*1024*1024
          $drive=[IO.DriveInfo]::new('C')
          [long]$start=$drive.AvailableFreeSpace
          if($start -lt 15*$gib){throw 'REFUSE: not enough disk space to retain Git backup'}
          Copy-Item -LiteralPath $gitSource -Destination $gitBackup -Recurse -Force -ErrorAction Stop
          if(-not(Test-Path -LiteralPath (Join-Path $gitBackup 'HEAD'))){
            throw 'REFUSE: exact backup did not contain HEAD'
          }
          $backFiles=@(Get-ChildItem -LiteralPath $gitBackup -Recurse -File -Force -ErrorAction Stop)
          if($backFiles.Count -ne $srcFiles.Count){
            throw 'REFUSE: backup file count differs'
          }
          $manifest=New-Object System.Collections.ArrayList
          [long]$bytes=0
          foreach($original in $srcFiles){
            $relative=$original.FullName.Substring($gitSource.Length).TrimStart('\')
            $copy=Join-Path $gitBackup $relative
            if(-not(Test-Path -LiteralPath $copy -PathType Leaf)){
              throw 'REFUSE: Git backup missing source entry'
            }
            $originalHash=(Get-FileHash -LiteralPath $original.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $copyHash=(Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLowerInvariant()
            if($originalHash -ne $copyHash -or $original.Length -ne (Get-Item -LiteralPath $copy).Length){
              throw 'REFUSE: Git backup content differs from original'
            }
            $bytes += [long]$original.Length
            $null=$manifest.Add([pscustomobject]@{
              path=$relative;bytes=[long]$original.Length;sha256=$originalHash
            })
          }
          [pscustomobject]@{
            schema='eldoria-original-local-git-preservation-1'
            source=$label
            sourceSha='008498e6dfc34c67f9f6d52defcf5f7c60634811'
            createdUtc=[datetime]::UtcNow.ToString('o')
            originalWorktreeStillPresent=$true
            count=$srcFiles.Count
            totalBytes=$bytes
            files=@($manifest)
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath $manifestPath -Encoding UTF8 -ErrorAction Stop
          $manifestHash=(Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ("GIT_METADATA_ARCHIVE_VERIFIED label={0} files={1} backedGiB={2:N3} manifestSha256={3}" -f
            $label,$srcFiles.Count,($bytes/$gib),$manifestHash)
          Write-Host ("GIT_METADATA_ORIGINAL_PRESERVED freeGiB={0:N3} originalDeleted=false" -f ($drive.AvailableFreeSpace/$gib))
          exit 0

