name: "[EXPERIMENT] Valoria Authored Secondary Shared Atlas"

on:
  push:
    branches: [visual-proof/valoria-authored-secondary-art-family-v1]
    paths:
      - "tools/valoria-authored-secondary-art-family/build_shared_atlas.py"
      - ".github/workflows/valoria-authored-secondary-shared-atlas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valoria-authored-secondary-shared-atlas
  cancel-in-progress: true

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install image authoring dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil
      - name: Build shared material atlas
        shell: bash
        env:
          ELDORIA_ASF_MATERIAL_OUT: ${{ github.workspace }}/pipeline/candidates/valoria-authored-secondary-art-family-v1/materials
        run: |
          python3 tools/valoria-authored-secondary-art-family/build_shared_atlas.py
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/ASF_Stone_diff.png
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/ASF_Stone_normal.png
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/ASF_Timber_diff.png
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/ASF_Timber_normal.png
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/ASF_Roof_diff.png
          test -s pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/ASF_Roof_normal.png
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: valoria-authored-secondary-shared-atlas-${{ github.run_id }}
          path: pipeline/candidates/valoria-authored-secondary-art-family-v1/materials/*
          if-no-files-found: error
      - name: Persist shared atlas
        shell: bash
        run: |
          git config user.name "eldoria-ci"
          git config user.email "actions@github.com"
          git add pipeline/candidates/valoria-authored-secondary-art-family-v1/materials
          if ! git diff --cached --quiet; then
            git commit -m "Persist authored secondary shared atlas"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
