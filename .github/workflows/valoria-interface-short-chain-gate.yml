name: Valoria Gate Street Terrace physical control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-interface-short-chain-gate.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ImageTo3D/Editor/ValoriaInterfaceShortChainReview.cs'
  workflow_dispatch:

jobs:
  short-chain:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $candidate = Get-ChildItem "${env:LOCALAPPDATA}\GitHubDesktop" -Directory -Filter 'app-*' |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
      - name: Retrieve certified GateStreetRiseRock MV1
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-gate-street-3230d85d94949d4084941c234d59d73b2cdaa553
          run-id: 36346961014
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-gate
      - name: Retrieve certified StreetLandingTransition
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module-street-landing-transition-v1-final-da75ec34bdfe5f3e4d8bf08a909f1ac3dd3d1cae
          run-id: 36355160385
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-street
      - name: Retrieve certified TerraceStairRock
        uses: actions/download-artifact@v4
        with:
          name: eldoria-tripo-module3-500a031407bc1a554dbeb3f9fd561e865ccdc973
          run-id: 36334704739
          github-token: ${{ github.token }}
          repository: mt5hjfz2kb-lab/Eldoria-Prewiu
          path: ${{ runner.temp }}/certified-terrace
      - name: Stage exact original GLBs without overwriting them
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $target = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source"
          New-Item -ItemType Directory -Force $target | Out-Null
          $inputs = @(
            @('gate','Eldoria_Module_GateStreetRiseRock_50K.glb','9d1a97ea385d557b77779eef7a7b65f8027bfc79a56b26081abc6b62f25a8302','Eldoria_Module_GateStreetRiseRock_50K.glb'),
            @('street','Eldoria_Module_UnderReview_50K.glb','ef367d9f0f671cd29e1b02e2d36a2dfdea3acd6e789087e4da5fb5e087e81b01','Eldoria_Module_StreetLandingTransition_50K.glb'),
            @('terrace','Eldoria_Module_TerraceStairRock_50K.glb','83fce93daeb5bb455ab89bb195c39f617b3ea69ff9bf29f938ae4744caff3e5e','Eldoria_Module_TerraceStairRock_50K.glb')
          )
          foreach ($item in $inputs) {
            $matches = @(Get-ChildItem "$env:RUNNER_TEMP\certified-$($item[0])" -Recurse -File -Filter $item[1])
            if ($matches.Count -ne 1) { throw "Expected one certified $($item[0]) input, got $($matches.Count)" }
            $sha = (Get-FileHash $matches[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -ne $item[2]) { throw "Source identity changed: $($item[0]) / $sha" }
            Copy-Item $matches[0].FullName (Join-Path $target $item[3])
            Write-Host "$($item[0]) SHA256=$sha"
          }
      - name: Capture physical short chain in isolated Unity scene
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $log = "$env:RUNNER_TEMP\ValoriaInterfaceShortChain.log"
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH missing.' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Editor: $version" }
          $args = @('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaInterfaceShortChainReview.Capture','-logFile',$log)
          $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(600000)) {
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 150 }
            throw 'Unity short chain timed out.'
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Unity short chain failed: $($p.ExitCode)"
          }
          $folder = "$env:GITHUB_WORKSPACE\Unity\ValoriaInterfaceShortChainCaptures"
          foreach ($file in @('strategic.png','city.png','detail.png','oblique.png','metrics.json')) {
            if (-not (Test-Path (Join-Path $folder $file))) { throw "Missing output: $file" }
          }
          Get-Content (Join-Path $folder 'metrics.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-interface-short-chain-${{ github.sha }}
          path: |
            Unity/ValoriaInterfaceShortChainCaptures/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/ValoriaInterfaceShortChainReview.unity
            ${{ runner.temp }}/ValoriaInterfaceShortChain.log
          if-no-files-found: warn
