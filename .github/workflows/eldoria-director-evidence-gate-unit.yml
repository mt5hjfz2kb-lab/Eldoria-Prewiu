name: Eldoria director evidence gate - zero-cost safety tests
on:
  push:
    branches: [diagnostic/valoria-ai-eyes-brain-20261015]
    paths:
      - 'tools/art-direction/director-control/**'
      - '.github/workflows/eldoria-director-evidence-gate-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-evidence-gate:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 10
    steps:
      - name: Ensure locally installed Git is available
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Local Git missing'}
            $folder=Split-Path $git
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/director-control
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict evidence gate: reject edits and false proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest discover -s tools/art-direction/director-control -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'Spatial evidence and protected-geometry safety gate failed'}
          Write-Host 'ELDORIA_INDEPENDENT_DIRECTOR_EVIDENCE_GATE_TECHNICAL_PASS_NOT_ART_APPROVED'
