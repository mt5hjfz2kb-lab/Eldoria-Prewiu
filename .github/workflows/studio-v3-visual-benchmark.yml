name: Studio V3 visual benchmark calibration
on:
  push:
    branches: [pilot/eldoria-studio-v3-autonomous-execution-20261126]
    paths:
      - 'tools/studio-v3/visual-benchmark/**'
      - '.github/workflows/studio-v3-visual-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: studio-v3-visual-benchmark-targeted
  cancel-in-progress: false
jobs:
  actual-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/studio-v3/visual-benchmark
            tools/openai-development-studio
          fetch-depth: 1
      - name: Validate restricted design grammar
        run: node --test tools/studio-v3/visual-benchmark/design.test.mjs tools/studio-v3/visual-benchmark/role-contract.test.mjs
      - name: Materialize only immutable actual source and shared art references
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/studio-v3-visual-source"
          python3 tools/studio-v3/visual-benchmark/materialize.py "$root"
          echo "V3_VISUAL_WEBROOT=$root" >> "$GITHUB_ENV"
          echo "V3_VISUAL_OUT=$RUNNER_TEMP/studio-v3-visual-evidence" >> "$GITHUB_ENV"
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/studio-v3-visual-node"
          npm install --no-save --prefix "$RUNNER_TEMP/studio-v3-visual-node" playwright@1.55.0
          "$RUNNER_TEMP/studio-v3-visual-node/node_modules/.bin/playwright" install chromium
      - name: Actual paired screenshots and matched state verification
        env:
          NODE_PATH: ${{ runner.temp }}/studio-v3-visual-node/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8773 --bind 127.0.0.1 --directory "$V3_VISUAL_WEBROOT" > /tmp/studio-v3-visual-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node tools/studio-v3/visual-benchmark/browser.mjs
      - name: Prepare verified screenshot sheets and separate blinded role packets
        env:
          NODE_PATH: ${{ runner.temp }}/studio-v3-visual-node/node_modules
        run: node tools/studio-v3/visual-benchmark/role-inputs.mjs
      - name: Verify actual V2 visual client unchanged and prepare real multimodal payloads offline
        run: |
          git fetch --no-tags --depth=1 origin 1657b2caa6b1a955319538ce3a8b2906398599b3
          git diff --exit-code 1657b2caa6b1a955319538ce3a8b2906398599b3 HEAD -- tools/openai-development-studio
          PYTHONDONTWRITEBYTECODE=1 python3 tools/studio-v3/visual-benchmark/v2-visual-payload.py "$V3_VISUAL_OUT"
      - name: Retain blinded genuine screenshots and reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v3-visual-blind-review
          path: ${{ runner.temp }}/studio-v3-visual-evidence/blind-review
          if-no-files-found: warn
          retention-days: 14
      - name: Retain private mapping, source assets and technical evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v3-visual-receipts
          path: |
            ${{ runner.temp }}/studio-v3-visual-evidence/private-receipts
            ${{ runner.temp }}/studio-v3-visual-evidence/report.json
            ${{ runner.temp }}/studio-v3-visual-evidence/role-inputs
          if-no-files-found: warn
          retention-days: 14
      - name: Verify tracked source unchanged
        if: always()
        run: git diff --exit-code
