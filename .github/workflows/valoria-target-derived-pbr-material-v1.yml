name: "[R&D] Valoria Target-Derived PBR Material v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-target-derived-pbr-material-v1.json"
      - ".github/workflows/valoria-target-derived-pbr-material-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install clients and Blender
        run: |
          python -m pip install --quiet "gradio_client>=1.4" pillow
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Generate target-derived PBR maps
        env:
          OUT_DIR: /tmp/stablematerials-proof
        run: python tools/valoria-target-derived-pbr-proof.py
      - name: Render PBR material on controlled geometry
        run: |
          cat > /tmp/stablematerials-proof/render.py <<'PY'
          import bpy,os,math,glob
          from mathutils import Vector
          root="/tmp/stablematerials-proof"
          def find(stem):
              xs=glob.glob(os.path.join(root,stem+".*"))
              return xs[0] if xs else None
          base=find("basecolor"); normal=find("normal"); height=find("height"); rough=find("roughness"); metal=find("metallic")
          if not all([base,normal,height,rough,metal]): raise RuntimeError("missing maps")
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.mesh.primitive_grid_add(x_subdivisions=161,y_subdivisions=161,size=2,location=(0,0,0))
          o=bpy.context.object; o.name="TargetDerivedMasonry"; o.scale=(2.5,1.6,1); bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
          mat=bpy.data.materials.new("TargetDerivedPBR"); mat.use_nodes=True; n=mat.node_tree.nodes; l=mat.node_tree.links; bs=n.get("Principled BSDF")
          tex=n.new("ShaderNodeTexImage"); tex.image=bpy.data.images.load(base); l.new(tex.outputs["Color"],bs.inputs["Base Color"])
          rt=n.new("ShaderNodeTexImage"); rt.image=bpy.data.images.load(rough); rt.image.colorspace_settings.name="Non-Color"; l.new(rt.outputs["Color"],bs.inputs["Roughness"])
          mt=n.new("ShaderNodeTexImage"); mt.image=bpy.data.images.load(metal); mt.image.colorspace_settings.name="Non-Color"; l.new(mt.outputs["Color"],bs.inputs["Metallic"])
          nt=n.new("ShaderNodeTexImage"); nt.image=bpy.data.images.load(normal); nt.image.colorspace_settings.name="Non-Color"; nm=n.new("ShaderNodeNormalMap"); l.new(nt.outputs["Color"],nm.inputs["Color"]); l.new(nm.outputs["Normal"],bs.inputs["Normal"])
          o.data.materials.append(mat)
          disp=o.modifiers.new("TargetHeight","DISPLACE"); dt=bpy.data.textures.new("TargetHeightTex","IMAGE"); dt.image=bpy.data.images.load(height); disp.texture=dt; disp.texture_coords="UV"; disp.strength=.16; disp.mid_level=.5
          bev=o.modifiers.new("SoftStone","BEVEL"); bev.width=.02; bev.segments=2
          sc=bpy.context.scene; sc.render.engine="BLENDER_EEVEE"; sc.render.resolution_x=1100; sc.render.resolution_y=825; sc.render.resolution_percentage=100
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(.035,.04,.05)
          bpy.ops.object.light_add(type="AREA",location=(-3,-4,5)); bpy.context.object.data.energy=900; bpy.context.object.data.size=5
          bpy.ops.object.light_add(type="AREA",location=(4,1,2)); bpy.context.object.data.energy=350; bpy.context.object.data.size=4
          bpy.ops.object.camera_add(location=(4,-5,3)); cam=bpy.context.object; sc.camera=cam; cam.data.lens=60; cam.rotation_euler=(Vector((0,0,0))-cam.location).to_track_quat("-Z","Y").to_euler()
          sc.render.filepath=os.path.join(root,"pbr-three-quarter.png"); bpy.ops.render.render(write_still=True)
          cam.location=(0,-5.3,0.4); cam.rotation_euler=(Vector((0,0,0))-cam.location).to_track_quat("-Z","Y").to_euler(); sc.render.filepath=os.path.join(root,"pbr-front.png"); bpy.ops.render.render(write_still=True)
          PY
          blender -b --python /tmp/stablematerials-proof/render.py
          test -s /tmp/stablematerials-proof/pbr-front.png
          test -s /tmp/stablematerials-proof/pbr-three-quarter.png
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-target-derived-pbr-material-v1
          path: /tmp/stablematerials-proof
          if-no-files-found: error
          retention-days: 30
