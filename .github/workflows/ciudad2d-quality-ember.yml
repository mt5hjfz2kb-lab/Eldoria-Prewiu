name: Ciudad2D — brasa V2 pequeña y verificable
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-quality/pending_ember_v2.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-ember-v2-ubuntu
  cancel-in-progress: false
jobs:
  original-ember:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-quality/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/
            /Unity/Assets/Experimentos/Ciudad2D/QA/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Generate exact 48x72 translucent amber source and check pixels
        run: python tools/ciudad2d-quality/build_ember_v2.py
      - name: Archive even if branch moved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-amber-ember-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Chispa_Valoria_V2.png
            Unity/Assets/Experimentos/Ciudad2D/QA/ambient_ember_v2_manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit new candidate without replacing original halo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-quality/pending_ember_v2.json
          git add --sparse -- \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Chispa_Valoria_V2.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Chispa_Valoria_V2.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/QA/ambient_ember_v2_manifest.json
          git diff --cached --quiet && { echo 'Missing source'; exit 1; }
          git commit -m 'art(city2d): archive new small legible ember sprite for living city'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
