name: "[ART WOOD FLOOR6 V5] Three warm true-photo medieval oak pieces"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-three-oak-chestnut-v5.yml'
      - 'tools/valoria-modular-fortress/aged_oak_natural_chestnut_v5.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-three-chestnut-wood-v5
  cancel-in-progress: false
jobs:
  same-three-oak-asset-comparisons:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Locate installed Windows Blender
        id: native
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-three-aged-cracked-oak-38881134717
          run-id: 38881134717
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/old_scan_dark_oak
      - name: Real photographed medium brown wood tone on exact original 3 meshes
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'old_scan_dark_oak\eldoria-three-aged-wood-v4\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-three-natural-chestnut-v5'
          if(-not(Test-Path (Join-Path $src 'timber_brace_X.glb'))){throw 'Original true PBR scan wood missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/aged_oak_natural_chestnut_v5.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned source missing'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-three-chestnut.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-wood-chestnut-v5.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-wood-chestnut-v5.err'
          $process=Start-Process -FilePath "${{ steps.native.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 95 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0){throw "Three real photo wood tones failed $($process.ExitCode)"}
          foreach($folder in @('glb','before','after','atlas')){
            $n=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($n -ne 3){throw "Expected three independent photo $folder results, got $n"}
          }
      - name: Preserve original wooden geometries and all before/after photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-three-balanced-oak-photo-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-three-natural-chestnut-v5/**
            ${{ runner.temp }}/eldoria-wood-chestnut-v5.log
            ${{ runner.temp }}/eldoria-wood-chestnut-v5.err
          if-no-files-found: warn
          retention-days: 30
