name: Bastion I frozen genuine Qwen 8B with verified Unity frustum
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths: ['.github/workflows/valoria-bastion1-qwen-replay-visibility.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: bastion1-qwen-original-4b-replay
  cancel-in-progress: false
jobs:
  verify-exact-authored-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ART: /tmp/bastion1-qwen-verbatim
      ORIGINAL_RUN: 38399110675
      CORE_SHA: 02751ed4a68fc3e5238558601b8143daa117d310
      TARGET: 'Valoria natural playable hilltop and rock scarps'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/art-direction/ai-authoring/render_artist_ab.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: bastion1-genuine-qwen-artist-38399110675
          run-id: 38399110675
          github-token: ${{ github.token }}
          path: /tmp/bastion1-qwen-verbatim
      - name: Retrieve current signed artist execution and visual validation sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/art-direction/ai-authoring
          git fetch --no-tags --depth=1 origin "$CORE_SHA"
          for f in execute_artist_plan.py verify-artist-cycle.mjs artist_plan_validation.py visibility_metrics.py unity_pixel_diff.mjs; do
            git show "$CORE_SHA:tools/art-direction/ai-authoring/$f" > "tools/art-direction/ai-authoring/$f"
          done
          python3 -m py_compile tools/art-direction/ai-authoring/execute_artist_plan.py tools/art-direction/ai-authoring/render_artist_ab.py
      - name: Authenticate ORIGINAL frozen Blender source, Qwen response and structured operation
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          r=pathlib.Path(os.environ['ART'])
          raw=(r/'model/artist-response-raw.txt').read_bytes()
          p=(r/'model/artist-plan.json').read_bytes()
          model=json.loads((r/'model/artist-inference.json').read_bytes())
          ops=json.loads(p)
          assert (r/'terrain-source.blend').read_bytes()[:7]==b'BLENDER'
          assert model['model']=='qwen3-vl:8b-instruct' and model['system_role']=='system'
          assert len(ops)==1 and ops[0]['type']=='sculpt_path'
          assert model['direction']['planned_actions']==ops
          assert len(model['rejected_visual_cycle_evidence'])==2
          assert all(x['camera_gate']=='REJECT_NOT_VISIBLE' for x in model['rejected_visual_cycle_evidence'])
          assert model['attempt_history'][-1]['raw_response_sha256']==hashlib.sha256(raw).hexdigest()
          assert json.loads(raw)['planned_actions']==ops
          assert ops[0]['target']==os.environ['TARGET']
          assert len(ops[0]['parameters']['knots'])==5
          proof={'source_run':int(os.environ['ORIGINAL_RUN']), 'core_sha':os.environ['CORE_SHA'],
            'source_blend_sha256':hashlib.sha256((r/'terrain-source.blend').read_bytes()).hexdigest(),
            'raw_qwen_response_sha256':hashlib.sha256(raw).hexdigest(),
            'plan_sha256':hashlib.sha256(p).hexdigest(),
            'verbatim_qwen_geometry':True, 'unity_integrated':False, 'art_approved':False}
          (r/'replay-provenance.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('BASTION1_QWEN4B_SCULPT_PATH_VERBATIM',json.dumps(proof))
          PY
          node tools/art-direction/ai-authoring/verify-artist-cycle.mjs --preflight-plan "$ART/model/artist-plan.json" "$TARGET" existing
      - name: Recover already-executed genuine Qwen sculpture without reauthoring
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy python3-pil
          python3 - <<'PYVERIFY'
          import json,hashlib,os,pathlib
          r=pathlib.Path(os.environ['ART'])
          plan_hash=hashlib.sha256((r/'model/artist-plan.json').read_bytes()).hexdigest()
          proof=json.loads((r/'result/artist-execution.json').read_bytes())
          assert proof['plan_sha256']==plan_hash
          assert proof['source_mesh_sha256']!=proof['result_mesh_sha256']
          assert proof['result_blend_sha256']==hashlib.sha256((r/'result/artist-output.blend').read_bytes()).hexdigest()
          assert proof['executed_actions'][0]['changed_vertices']==1758
          print('QWEN8B_ORIGINAL_SCULPTURE_REUSED',proof['executed_actions'][0])
          PYVERIFY
      - name: Source-locked PLAYER CAMERA Blender A/B (strict visibility gate)
        shell: bash
        run: |
          blender -b --python-exit-code 1 --python tools/art-direction/ai-authoring/render_artist_ab.py -- \
            --before "$ART/terrain-source.blend" --after "$ART/result/artist-output.blend" \
            --target "$TARGET" --player-camera --out "$ART/ab"
          python3 - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['ART'])
          metric=json.loads((r/'ab/comparison.json').read_text())['camera_visibility']
          assert metric['changed_fraction']>=0.001
          print('BLENDER_CAMERA_VISIBLE_REVIEW_REQUIRED_NOT_ART_APPROVED',metric)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-original-qwen8b-verified-frustum-${{ github.run_id }}
          path: |
            /tmp/bastion1-qwen-verbatim/replay-provenance.json
            /tmp/bastion1-qwen-verbatim/model/artist-plan.json
            /tmp/bastion1-qwen-verbatim/model/artist-inference.json
            /tmp/bastion1-qwen-verbatim/model/artist-response-raw.txt
            /tmp/bastion1-qwen-verbatim/terrain-source.blend
            /tmp/bastion1-qwen-verbatim/result/*
            /tmp/bastion1-qwen-verbatim/ab/*
          retention-days: 14
          if-no-files-found: warn
