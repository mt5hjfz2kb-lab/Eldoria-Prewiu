name: Valoria Modular 2.5D — isolated static contracts

on:
  push:
    branches:
      - experiment/valoria-modular-25d-bastion1-from-zero-20261118
    paths:
      - 'Unity/Assets/Experimentos/ValoriaModular25D/**'
      - 'docs/valoria-modular-25d/**'
      - 'tools/valoria-modular25d/**'
      - '.github/workflows/valoria-modular25d-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated candidate and main for scope guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            Unity/Assets/Experimentos/ValoriaModular25D
            tools/valoria-modular25d
          sparse-checkout-cone-mode: true
      - name: Run non-Unity reproducible source contracts
        run: |
          node --check tools/valoria-modular25d/browser_camera_smoke.mjs
          python3 -m py_compile tools/valoria-modular25d/verify_source.py
          python3 tools/valoria-modular25d/verify_source.py
          python3 tools/valoria-modular25d/geometry_gate.py
      - name: Parse source with .NET SDK Roslyn (syntax only)
        run: |
          dotnet --list-sdks
          dotnet run --project tools/valoria-modular25d/roslyn/RoslynSyntaxGate.csproj --configuration Release -- Unity/Assets/Experimentos/ValoriaModular25D
      - name: Parse real PowerShell and JavaScript source before shared native execution
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/valoria-modular25d/browser_smoke.mjs
          command -v pwsh
          pwsh -NoProfile -NonInteractive -Command '
            $paths=@(
              "tools/valoria-modular25d/scope_isolated_webgl_guard.ps1",
              "tools/valoria-modular25d/isolate_webgl_resources.ps1"
            )
            foreach($path in $paths){
              $tokens=$null; $errors=$null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $path,[ref]$tokens,[ref]$errors)|Out-Null
              if($errors.Count){
                foreach($error in $errors){Write-Error ("SCRIPT_PARSE_ERROR "+$path+" "+$error)}
                exit 2
              }
              Write-Host ("STATIC_POWERSHELL_PARSE_PASS "+$path)
            }
          '
      - name: State the limits of this job
        if: always()
        run: |
          echo "This job does NOT run Unity, does NOT use windows-runner-heavy, and does NOT certify PlayMode, WebGL, iPhone, screenshots, memory or art."

      - name: Preserve original sawmill alpha for reproducible visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-mod25d-original-sawmill-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/sawmill_i.png
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/sawmill_i.png.meta
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/sprite_manifest.json
          retention-days: 7
          if-no-files-found: error
