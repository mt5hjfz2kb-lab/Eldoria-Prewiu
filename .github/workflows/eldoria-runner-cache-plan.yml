name: Eldoria Windows cache cleanup candidates (read-only)
on:
  push:
    branches: [maintenance/eldoria-runner-disk-audit-20261114]
    paths: [.github/workflows/eldoria-runner-cache-plan.yml]
permissions:
  contents: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  plan:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Determine exact generated Unity Library directories in completed isolated runs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            Write-Host 'CACHE_PLAN_REFUSED_ACTIVE_EDITOR'; exit 0
          }
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $gib=[double](1024*1024*1024)
          $drive=[IO.DriveInfo]::new('C')
          Write-Host ("CACHE_PLAN_BEGIN freeGiB={0:N2}" -f ($drive.AvailableFreeSpace/$gib))
          $deadline=[datetime]::UtcNow.AddMinutes(8)
          [long]$eligibleBytes=0
          [long]$protectedBytes=0
          [int]$eligibleCount=0
          [int]$protectedCount=0
          [int]$errors=0
          foreach($dir in @(Get-ChildItem -LiteralPath $root -Directory -Force -ErrorAction Stop)){
            if([datetime]::UtcNow -ge $deadline){Write-Host 'CACHE_PLAN_PARTIAL_TIMEOUT';break}
            if($dir.Attributes -band [IO.FileAttributes]::ReparsePoint){continue}
            $lib=Join-Path $dir.FullName 'Unity\Library'
            if(-not (Test-Path -LiteralPath $lib -PathType Container)){continue}
            $libInfo=Get-Item -LiteralPath $lib -Force
            if($libInfo.Attributes -band [IO.FileAttributes]::ReparsePoint){continue}
            $runName=$dir.Name
            $eligible=$runName -match '^(breachwatch-native-source|beta-structural-source|forja-thin-native-source|issue186-fresh-source|breachwatch-isolated|pr179-lazy-full-webgl|beta10-minimal-webgl)-[0-9]{10,12}(-[0-9]+)?$'
            $stack=New-Object 'System.Collections.Generic.Stack[string]'
            $stack.Push($lib)
            [long]$bytes=0
            [int]$fileCount=0
            [int]$links=0
            while($stack.Count -gt 0){
              if([datetime]::UtcNow -ge $deadline){Write-Host 'CACHE_PLAN_PARTIAL_TIMEOUT';break}
              $next=$stack.Pop()
              try{
                foreach($e in ([IO.DirectoryInfo]::new($next)).EnumerateFileSystemInfos()){
                  try{
                    if($e.Attributes -band [IO.FileAttributes]::ReparsePoint){$links++;continue}
                    if($e -is [IO.DirectoryInfo]){$stack.Push($e.FullName)}
                    else{$bytes += [long]$e.Length;$fileCount++}
                  }catch{$errors++}
                }
              }catch{$errors++}
            }
            if($eligible){$eligibleBytes+=$bytes;$eligibleCount++}
            else{$protectedBytes+=$bytes;$protectedCount++}
            # Names are only known Eldoria workspace run labels; no private files emitted.
            Write-Host ("CACHE_PLAN_DIRECTORY name={0} kind={1} GiB={2:N3} files={3} links={4} git={5}" -f $runName,($(if($eligible){'isolated'}else{'protected'})),($bytes/$gib),$fileCount,$links,(Test-Path -LiteralPath (Join-Path $dir.FullName '.git')))
          }
          Write-Host ("CACHE_PLAN_TOTAL isolatedGiB={0:N3} isolatedDirs={1} protectedGiB={2:N3} protectedDirs={3} errors={4}" -f ($eligibleBytes/$gib),$eligibleCount,($protectedBytes/$gib),$protectedCount,$errors)
          Write-Host ("CACHE_PLAN_END freeGiB={0:N2} deletion=none" -f ($drive.AvailableFreeSpace/$gib))
