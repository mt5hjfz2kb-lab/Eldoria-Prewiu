name: "[ART WATER V9] Stochastic real ripples, no sinusoidal water bands"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-stochastic-water-v9.yml'
      - 'tools/valoria-modular-fortress/stochastic_water_tile_v9.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-single-stochastic-water-v9
  cancel-in-progress: false
jobs:
  single-water-quality-correction:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    steps:
      - name: Locate installed Git and Blender on PC
        shell: powershell
        id: deps
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Native Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-one-real-river-water-v8-38896874472
          run-id: 38896874472
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/rejected_river_v8
      - name: Replace real V8 ripples using 2D stochastic rather than repeating stripes
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'rejected_river_v8\valoria-one-river-natural-v8\glb'
          $out=Join-Path $env:RUNNER_TEMP 'valoria-river-water-v9'
          if(-not(Test-Path (Join-Path $src 'river_water_tile.glb'))){throw 'Precursor V8 source GLB missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/stochastic_water_tile_v9.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned authoring code missing'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-water-v9-stochastic.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'valoria-water-v9.stdout'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-water-v9.stderr'
          $proc=Start-Process -FilePath "${{ steps.deps.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 95 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 65 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Water V9 failed $($proc.ExitCode)"}
          foreach($file in @('before\river_water_tile.png','after\river_water_tile.png','glb\river_water_tile.glb','reports\one_stochastic_water_v9.json')){
            if(-not(Test-Path (Join-Path $out $file))){throw "Missing $file"}
          }
      - name: Archive true A-B render, GLB and proof, no Unity scene
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-one-natural-water-v9-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-river-water-v9/**
            ${{ runner.temp }}/valoria-water-v9.stdout
            ${{ runner.temp }}/valoria-water-v9.stderr
          if-no-files-found: warn
          retention-days: 30
