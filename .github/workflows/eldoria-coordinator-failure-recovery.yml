name: Eldoria coordinator recovery supervisor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eldoria-coordinator-failure-recovery.yml'
      - 'pipeline/active-workstreams.json'
  workflow_run:
    workflows: ["Eldoria local agent isolated pilot v1", "[PRODUCTION] Valoria First Playable City Slice v1"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: eldoria-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  classify-and-escalate:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical coordinator module
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/m04
      - name: Read exact jobs and publish an idempotent coordinator handoff
        uses: actions/github-script@v7
        env:
          WORKER_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const {findingFromWorkflowFailure,ingest,executiveReport,retryDecision} = await import(process.env.GITHUB_WORKSPACE+'/tools/m04/incidents.mjs');
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const failed = jobs.filter(j => j.conclusion === 'failure');
            if (!failed.length) return;
            const maintenance = failed.some(j => j.name === 'maintenance-worker' || j.name === 'maintenance-review');
            const target = maintenance ? 25 : 23;
            const marker = '<!-- eldoria-coordinator-failure-' + run.id + ' -->';
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: target, per_page: 100
            });
            if (existing.some(c => (c.body || '').includes(marker))) return;
            const details = failed.map(j => '- ' + j.name + ': ' + j.conclusion).join('\n');
            let incidents = {schema_version:1,incidents:[]};
            for (const job of failed) {
              const finding = findingFromWorkflowFailure(run,job,{
                observed_at:run.updated_at || run.created_at || new Date().toISOString()
              });
              incidents = ingest(incidents,finding);
            }
            const report = executiveReport(incidents);
            // Not an execution authorization. Never rerun a deterministic failed SHA.
            const retry = retryDecision({authorized:false,attempts:0,transient:false});
            const body = [
              '**M04:** ' + report.total + ' classified incident(s); ' + report.critical + ' critical; action ' + retry.reason,
              marker,
              '### Coordinador — fallo recibido; recuperación pendiente',
              '**Workstream:** ' + (maintenance ? 'eldoria-local-agent-first-maintenance-v1' : 'piloto local'),
              '**Ejecución:** ' + run.html_url,
              '**SHA exacto:** `' + run.head_sha + '`',
              '**Jobs fallidos:**\n' + details,
              '**Estado:** BLOQUEADO / NO PASS. No se ha validado ninguna reparación.',
              '',
              'La ejecución ha fallado. El coordinador conserva el caso abierto y solicita ',
              'diagnóstico, corrección sobre rama y nuevo run en el SHA reparado. ',
              'No se repite automáticamente un SHA conocido como defectuoso. ',
              'No se hace merge, no se libera el claim y no se inicia Unity ni otra misión.',
              '',
              '**Escalado a Dirección General:** la incidencia precisa una vía autorizada',
              'de ejecución del SHA corregido y verificación independiente antes de cerrar.',
              'Un comentario de GitHub no equivale a una notificación al propietario fuera de GitHub.'
            ].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number: target, body});

  round1-dependency-review:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      verdict: ${{ steps.coordinator.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/eldoria-coordinator-v1.cjs
            pipeline/active-workstreams.json
      - name: Evaluate actual authorized R1 M07→QA dependency without usurping owner
        id: coordinator
        shell: bash
        run: |
          set -euo pipefail
          node tools/eldoria-coordinator-v1.cjs > round1-dependency-report.json
          jq -e '.schema_version == 1 and (.verdict == "BLOCKED_NO_HANDOFF" or .verdict == "READY_FOR_QA_HANDOFF_REVIEW")' round1-dependency-report.json
          echo "verdict=$(jq -r .verdict round1-dependency-report.json)" >> "$GITHUB_OUTPUT"
      - name: Emit deduplicated canonical handoff assessment to DG
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=JSON.parse(fs.readFileSync('round1-dependency-report.json','utf8'));
            const {owner,repo}=context.repo;
            const passed=(report.checks||[]).filter(x=>x.passed).length;
            const marker='<!-- eldoria-r1-dependency-'+report.verdict+'-'+passed+' -->';
            const all=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:23,per_page:100});
            if(all.some(x=>(x.body||'').includes(marker)))return;
            const body=[
              marker,
              '### Coordinador — dependencia real de la Ronda 1',
              '**Estado:** '+report.verdict,
              '**Comprobaciones:** '+passed+'/'+(report.checks||[]).length,
              '**Fuente:** '+context.sha,
              '**Trabajo:** m07-r1-sawmill-construction-visual-correction',
              '**Consecuencia:** '+(report.verdict==='READY_FOR_QA_HANDOFF_REVIEW'?
                'Solo elegible para revisión de traspaso por el propietario y QA existente. NO se ejecuta QA sin los permisos y la entrega correspondientes.':
                'Sin distribución a M11/QA; el propietario M07 y su dependencia permanecen protegidos.'),
              'No se ha ejecutado Unity, no se han consumido créditos y no se ha abierto otra ronda.'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});

  round1-independent-qa:
    needs: round1-dependency-review
    if: >-
      github.event_name == 'push' &&
      needs.round1-dependency-review.outputs.verdict == 'READY_FOR_QA_HANDOFF_REVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently recheck real M07 acceptance evidence before QA
        shell: bash
        run: |
          set -euo pipefail
          node tools/eldoria-coordinator-v1.cjs > qa-dependency-proof.json
          jq -e '.verdict == "READY_FOR_QA_HANDOFF_REVIEW" and ([.checks[].passed] | all)' qa-dependency-proof.json
      - name: Execute existing independent certification and coordinator suites
        run: |
          node --test tests/m03/certify.test.mjs tests/m16a/evaluate.test.mjs
      - name: Record technical gate only; never claim visual or published QA
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const marker='<!-- eldoria-r1-qa-tech-'+context.runId+' -->';
            const body=[marker,'### QA técnico independiente Ronda 1','**Estado:** M03/M16 contract gate PASS; M07 evidence rechecked.','**Run:** '+context.runId,'**SHA:** '+context.sha,'**Alcance:** técnico de certificación; NO equivale a QA visual, gameplay o WebGL publicado. No se libera M07 ni se cierra Ronda 1.'].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});

  r2b-production-independent-review:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == '[PRODUCTION] Valoria First Playable City Slice v1' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'push' &&
      github.event.head_commit.message == 'ops(m16): verify real Unity R2-B intake via existing recovery receiver')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: QA independent M03 existing certification tests
        run: node --test tests/m03/certify.test.mjs
      - name: Correlate exact Unity source, artifact and QA then report Directorate
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const run=context.payload.workflow_run || (await github.rest.actions.getWorkflowRun({owner,repo,run_id:37838898425})).data;
            const candidate='6e0e12396a98b04333b595fff704afa3e849c30a';
            if(run.head_sha!==candidate)return;
            const marker='<!-- eldoria-r2b-unity-evidence-'+run.id+' -->';
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:23,per_page:100});
            if(comments.some(c=>(c.body||'').includes(marker)))return;
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
            const artifact=artifacts.find(a=>a.name==='valoria-first-playable-city-slice-v1'&&!a.expired);
            const listing=await github.rest.actions.listWorkflowRunsForRepo({owner,repo,head_sha:run.head_sha,per_page:100});
            const test=listing.data.workflow_runs.find(x=>x.name==='UI Progression Certification (fast)'&&x.conclusion==='success');
            const verified=run.conclusion==='success'&&!!artifact&&!!test;
            const verdict=verified?'PASS_UNITY_CANDIDATE_EVIDENCE_NOT_WEBGL':'BLOCKED_UNITY_EVIDENCE_OR_QA';
            const body=[marker,'### M16→Unity producción→M03 QA→DG: R2-B evidencia real',
              '**Veredicto:** '+verdict,'**Run real:** '+run.html_url,'**SHA:** '+run.head_sha,
              '**Artefacto Unity:** '+(artifact?artifact.id:'ausente'),
              '**QA UI mismo SHA:** '+(test?test.html_url:'ausente'),
              '**Suite M03 independiente:** ejecutada en este workflow',
              '**No se cierra R2-B:** faltan candidato WebGL independiente, ambas alternativas táctiles, recompensas, recarga y revisión visual.',
              '**Defectos de jugador:** EXP-CAM-01 y EXP-BLD-02 siguen abiertos.',
              '**M04:** ante fallo, mantener owner y clasificar; no repetir un SHA determinísticamente fallido.'].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});
            if(!verified)core.setFailed(verdict);
