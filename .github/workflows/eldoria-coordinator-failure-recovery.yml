name: Eldoria coordinator recovery supervisor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eldoria-coordinator-failure-recovery.yml'
      - 'pipeline/active-workstreams.json'
  workflow_run:
    workflows: ["Eldoria local agent isolated pilot v1"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: eldoria-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  classify-and-escalate:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical coordinator module
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/m04
      - name: Read exact jobs and publish an idempotent coordinator handoff
        uses: actions/github-script@v7
        env:
          WORKER_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const {findingFromWorkflowFailure,ingest,executiveReport,retryDecision} = await import(process.env.GITHUB_WORKSPACE+'/tools/m04/incidents.mjs');
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, per_page: 100
            });
            const failed = jobs.filter(j => j.conclusion === 'failure');
            if (!failed.length) return;
            const maintenance = failed.some(j => j.name === 'maintenance-worker' || j.name === 'maintenance-review');
            const target = maintenance ? 25 : 23;
            const marker = '<!-- eldoria-coordinator-failure-' + run.id + ' -->';
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: target, per_page: 100
            });
            if (existing.some(c => (c.body || '').includes(marker))) return;
            const details = failed.map(j => '- ' + j.name + ': ' + j.conclusion).join('\n');
            let incidents = {schema_version:1,incidents:[]};
            for (const job of failed) {
              const finding = findingFromWorkflowFailure(run,job,{
                observed_at:run.updated_at || run.created_at || new Date().toISOString()
              });
              incidents = ingest(incidents,finding);
            }
            const report = executiveReport(incidents);
            // Not an execution authorization. Never rerun a deterministic failed SHA.
            const retry = retryDecision({authorized:false,attempts:0,transient:false});
            const body = [
              '**M04:** ' + report.total + ' classified incident(s); ' + report.critical + ' critical; action ' + retry.reason,
              marker,
              '### Coordinador — fallo recibido; recuperación pendiente',
              '**Workstream:** ' + (maintenance ? 'eldoria-local-agent-first-maintenance-v1' : 'piloto local'),
              '**Ejecución:** ' + run.html_url,
              '**SHA exacto:** `' + run.head_sha + '`',
              '**Jobs fallidos:**\n' + details,
              '**Estado:** BLOQUEADO / NO PASS. No se ha validado ninguna reparación.',
              '',
              'La ejecución ha fallado. El coordinador conserva el caso abierto y solicita ',
              'diagnóstico, corrección sobre rama y nuevo run en el SHA reparado. ',
              'No se repite automáticamente un SHA conocido como defectuoso. ',
              'No se hace merge, no se libera el claim y no se inicia Unity ni otra misión.',
              '',
              '**Escalado a Dirección General:** la incidencia precisa una vía autorizada',
              'de ejecución del SHA corregido y verificación independiente antes de cerrar.',
              'Un comentario de GitHub no equivale a una notificación al propietario fuera de GitHub.'
            ].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number: target, body});

  round1-dependency-review:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/eldoria-coordinator-v1.cjs
            pipeline/active-workstreams.json
      - name: Evaluate actual authorized R1 M07→QA dependency without usurping owner
        shell: bash
        run: |
          set -euo pipefail
          node tools/eldoria-coordinator-v1.cjs > round1-dependency-report.json
          jq -e '.schema_version == 1 and (.verdict == "BLOCKED_NO_HANDOFF" or .verdict == "READY_FOR_QA_HANDOFF_REVIEW")' round1-dependency-report.json
      - name: Emit deduplicated canonical handoff assessment to DG
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=JSON.parse(fs.readFileSync('round1-dependency-report.json','utf8'));
            const {owner,repo}=context.repo;
            const passed=(report.checks||[]).filter(x=>x.passed).length;
            const marker='<!-- eldoria-r1-dependency-'+report.verdict+'-'+passed+' -->';
            const all=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:23,per_page:100});
            if(all.some(x=>(x.body||'').includes(marker)))return;
            const body=[
              marker,
              '### Coordinador — dependencia real de la Ronda 1',
              '**Estado:** '+report.verdict,
              '**Comprobaciones:** '+passed+'/'+(report.checks||[]).length,
              '**Fuente:** '+context.sha,
              '**Trabajo:** m07-r1-sawmill-construction-visual-correction',
              '**Consecuencia:** '+(report.verdict==='READY_FOR_QA_HANDOFF_REVIEW'?
                'Solo elegible para revisión de traspaso por el propietario y QA existente. NO se ejecuta QA sin los permisos y la entrega correspondientes.':
                'Sin distribución a M11/QA; el propietario M07 y su dependencia permanecen protegidos.'),
              'No se ha ejecutado Unity, no se han consumido créditos y no se ha abierto otra ronda.'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:23,body});
