name: Eldoria Windows remaining storage inventory and two source identities
on:
  push:
    branches: [maintenance/eldoria-runner-disk-audit-20261114]
    paths: [.github/workflows/eldoria-runner-other-storage-audit.yml]
permissions:
  contents: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Measure nonrunner C directories without changing any file
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
            Write-Host 'OTHER_AUDIT_REFUSED_ACTIVE_EDITOR';exit 0
          }
          $gib=[double](1024*1024*1024)
          $drive=[IO.DriveInfo]::new('C')
          Write-Host ("OTHER_AUDIT_BEGIN freeGiB={0:N2} usedGiB={1:N2}" -f ($drive.AvailableFreeSpace/$gib),(($drive.TotalSize-$drive.AvailableFreeSpace)/$gib))
          $deadline=[datetime]::UtcNow.AddMinutes(8)
          $count=0L
          $errors=0L
          $skipped=0L
          $partial=$false
          function Measure-Nonrunner([string]$path,[string]$group){
            [long]$bytes=0; [long]$files=0
            $stack=New-Object 'System.Collections.Generic.Stack[string]'
            $stack.Push($path)
            while($stack.Count -gt 0){
              if([datetime]::UtcNow -ge $deadline -or $count -gt 1250000){
                $script:partial=$true;break
              }
              $next=$stack.Pop()
              try{
                foreach($item in ([IO.DirectoryInfo]::new($next)).EnumerateFileSystemInfos()){
                  try{
                    if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){$script:skipped++;continue}
                    if($item -is [IO.DirectoryInfo]){$stack.Push($item.FullName)}
                    else{$bytes+=[long]$item.Length;$files++;$script:count++}
                  }catch{$script:errors++}
                }
              }catch{$script:errors++}
            }
            Write-Host ("OTHER_AUDIT_DIRECTORY category={0} observedGiB={1:N3} files={2} complete={3}" -f $group,($bytes/$gib),$files,(-not $script:partial))
          }
          # Baseline scan already measured runner _work=424.38GiB and Users=98.30GiB.
          # Only safe category labels are sent to the PUBLIC GitHub Actions log.
          [long]$rootFiles=0
          try{
            Get-ChildItem -LiteralPath 'C:\' -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $rootFiles += [long]$_.Length
            }
          }catch{$errors++}
          Write-Host ("OTHER_AUDIT_ROOT_FILES GiB={0:N3}" -f ($rootFiles/$gib))
          $standard=@{
            'Windows'='windows-system';'Program Files'='program-files';
            'Program Files (x86)'='program-files-x86';'ProgramData'='programdata';
            'Recovery'='recovery';'PerfLogs'='performance-logs';
            'Windows.old'='old-windows';'ESD'='windows-installer-cache';
            'System Volume Information'='system-restore';
            '$Recycle.Bin'='recycle-bin'
          }
          $i=0
          foreach($d in @(Get-ChildItem -LiteralPath 'C:\' -Directory -Force -ErrorAction SilentlyContinue | Sort-Object Name)){
            if($partial){break}
            if($d.Name -in @('Users','actions-runner-eldoria')){continue}
            if($d.Attributes -band [IO.FileAttributes]::ReparsePoint){$skipped++;continue}
            $i++
            $group=$standard[$d.Name]
            if(-not $group){$group='other-root-category-'+$i}
            Measure-Nonrunner $d.FullName $group
          }
          Write-Host ("OTHER_AUDIT_END freeGiB={0:N2} scannedFiles={1} errors={2} skippedLinks={3} partial={4}" -f ($drive.AvailableFreeSpace/$gib),$count,$errors,$skipped,$partial)
      - name: Check exact source identity of the two untouched isolated caches
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $git=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $git){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $git){throw 'Git not available for source fingerprint'}
          foreach($name in @('beta-structural-source-42505611257-1','forja-thin-native-source-42408083695')){
            $d=Join-Path $root $name
            $head=(& $git -C $d rev-parse HEAD).Trim()
            $remote=(& $git -C $d remote get-url origin).Trim()
            $tracked=@(& $git -C $d ls-files -- Unity/Library)
            $sourceChanges=@(& $git -C $d status --porcelain --untracked-files=no)
            Write-Host ("OTHER_AUDIT_SOURCE_ID name={0} head={1} remoteExpected={2} trackedLibraryCount={3} dirtyTrackedCount={4}" -f $name,$head,($remote -in @('https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu','https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git')),$tracked.Count,$sourceChanges.Count)
          }
