name: Eldoria local AI install and isolated proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eldoria-local-ai-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    steps:
      - name: Obtain only the authorized scripts without Git or repository checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
          $target=Join-Path $env:RUNNER_TEMP "eldoria-local-ai-source-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $files=@{
            'local-ai-install-v1.ps1'='e2223764b5d4fb17c4f5f6a1f7ad77bd2dd1a668d613dab3843704d25fd1f9dd'
            'local-ai-proof-v1.ps1'='c9eb99403ab6a039deb0758bb5aa1c1d7013830045ea70fcdd32fc8a181f673c'
          }
          foreach($name in $files.Keys) {
            $dest=Join-Path $target $name
            Invoke-WebRequest -UseBasicParsing -Uri "$base/tools/$name" -OutFile $dest -TimeoutSec 120
            if ((Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $files[$name]) { throw "Script checksum mismatch: $name" }
          }
          "ELDORIA_LOCAL_AI_SOURCE=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify authorized ownership and runner availability
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $registry=Invoke-RestMethod -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/pipeline/active-workstreams.json" -TimeoutSec 60
          $claim=@($registry.active | Where-Object {$_.id -eq 'eldoria-local-ai-install-v1' -and $_.owner -eq 'chat-local-ai-install-20261008' -and $_.status -in @('active','blocked')})
          if ($claim.Count -ne 1) { throw 'Installation ownership absent.' }
          $conflicts=@($registry.active | Where-Object {$_.id -ne 'eldoria-local-ai-install-v1' -and $_.status -eq 'active' -and ($_.resources -match 'windows|runner-heavy')})
          if ($conflicts.Count) { throw 'BLOCKED: another owner holds Windows heavy resources.' }
      - name: Official portable install and real local programming test
        shell: powershell
        run: |
          & "$env:ELDORIA_LOCAL_AI_SOURCE/local-ai-install-v1.ps1" -EvidenceDir "$env:RUNNER_TEMP/eldoria-local-ai-$env:GITHUB_RUN_ID"
      - name: Preserve proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-local-ai-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/eldoria-local-ai-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
