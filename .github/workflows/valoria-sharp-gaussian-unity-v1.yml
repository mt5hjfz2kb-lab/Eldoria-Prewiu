name: "[R&D] Valoria SHARP Gaussian Unity Proof v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-sharp-gaussian-unity-v1.json"
      - ".github/workflows/valoria-sharp-gaussian-unity-v1.yml"
      - "Unity/Assets/Eldoria/Scripts/Editor/ValoriaSharpGaussianUnityProofV1.cs"
      - "Unity/Packages/manifest.json"
  workflow_dispatch:
concurrency:
  group: valoria-sharp-gaussian-unity-v1
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate; Add-Content -Path $env:GITHUB_PATH -Value $dir; $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Download SHARP Gaussian source artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dst="$env:GITHUB_WORKSPACE\Unity\SharpGaussianSource"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst | Out-Null
          $zip=Join-Path $env:RUNNER_TEMP "sharp-gaussian.zip"
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28" }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/11404383856/zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          if(-not (Test-Path (Join-Path $dst "sharp-1.ply"))){throw "SHARP PLY missing after artifact download"}
          Get-Item (Join-Path $dst "sharp-1.ply") | Format-List Name,Length,FullName
      - name: Sanitize non-finite SHARP splats
        shell: powershell
        run: |
          $py=@'
          import math, re, struct, pathlib
          p=pathlib.Path(r"Unity/SharpGaussianSource/sharp-1.ply")
          data=bytearray(p.read_bytes())
          end=data.index(b"end_header\n")+len(b"end_header\n")
          header=data[:end].decode("ascii")
          n=int(re.search(r"element vertex (\d+)",header).group(1))
          stride=14*4
          bad=0
          for i in range(n):
              off=end+i*stride
              vals=list(struct.unpack_from("<14f",data,off))
              if all(math.isfinite(v) for v in vals):
                  continue
              bad+=1
              for k,v in enumerate(vals):
                  if not math.isfinite(v):
                      vals[k]=0.0
              # hide invalid splat while preserving record count/order
              vals[6]=-20.0
              struct.pack_into("<14f",data,off,*vals)
          p.write_bytes(data)
          print(f"SANITIZED_NONFINITE_SPLATS={bad} TOTAL={n}")
          '@
          $py | python -
      - name: Capture SHARP Gaussian Unity proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaSharpGaussianUnityProofV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaSharpGaussianUnityProofV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d12','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaSharpGaussianUnityProofV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(42)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 3;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'SHARP Unity proof timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 500};throw "SHARP Unity proof failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-sharp-gaussian-unity-v1
          path: Unity/ValoriaSharpGaussianUnityProofV1Captures/*
          if-no-files-found: warn
          retention-days: 30
