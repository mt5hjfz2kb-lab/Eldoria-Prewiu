name: Valoria Modular 2.5D — Umbral II original material kit build
on:
  push:
    branches: [experiment/valoria-modular25d-ui-umbral-20261120]
    paths: ['tools/valoria-modular25d/umbral-materials-request.json']
permissions:
  contents: write
concurrency:
  group: valoria-umbral2-original-art-material-pipeline
  cancel-in-progress: false
jobs:
  authored-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/
            /tools/valoria-modular25d/
            /docs/valoria-modular-25d/
      - name: Verify exclusive owner without competing for Windows
        env:
          GH_TOKEN: ${{github.token}}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert os.environ['GITHUB_REF_NAME']=='experiment/valoria-modular25d-ui-umbral-20261120'
          def gh(url):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+url,
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=35) as r:return json.load(r)
          meta=gh('contents/pipeline/active-workstreams.json?ref=main')
          blob=gh('git/blobs/'+meta['sha'])
          assert blob['sha']==meta['sha'] and blob['encoding']=='base64'
          reg=json.loads(base64.b64decode(blob['content']))
          x=[z for z in reg['active'] if z.get('id')=='eldoria-valoria-modular25d-bastion1-20261119']
          assert len(x)==1 and x[0]['ownership_revision']==7 and x[0]['ownership_state']=='claimed'
          assert x[0]['branch']==os.environ['GITHUB_REF_NAME']
          assert x[0]['owner']=='chatgpt-valoria-umbral-commercial-ui-and-continuation-20261120'
          print('UMBRAL_ART_OWNER_REV7_PASS')
          PY
      - name: Create authored PNG and Unity .meta without touching existing Vigilia files
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow==11.3.0
          python3 -m py_compile tools/valoria-modular25d/generate_umbral_art_kit.py
          python3 tools/valoria-modular25d/generate_umbral_art_kit.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,hashlib
          d=json.loads(Path('docs/valoria-modular-25d/UMBRAL_II_MATERIALS_SOURCE.json').read_text())
          assert len(d['sprites'])==5
          base=Path('Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/UmbralII')
          for x in d['sprites']:
            p=base/(x['name']+'.png')
            with Image.open(p) as im:
              im.load()
              assert im.mode=='RGBA' and list(im.size)==x['size']
            data=p.read_bytes()
            assert hashlib.sha256(data).hexdigest()==x['sha256']
            m=(base/(x['name']+'.png.meta')).read_text()
            assert 'guid: '+x['guid'] in m and 'spriteBorder: {x: '+str(x['border']) in m
          print('ORIGINAL_UMBRAL2_PNG_SLICED_SHA_AND_GUID_PASS')
          PY
      - name: Commit generated texture assets only to unchanged branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=experiment/valoria-modular25d-ui-umbral-20261120
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'SOURCE_BRANCH_MOVED_NO_WRITE'; exit 1
          fi
          git config user.name 'Eldoria art source QA'
          git config user.email 'eldoria-art-qa@users.noreply.github.com'
          git add --             'Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/UmbralII/'             'docs/valoria-modular-25d/UMBRAL_II_MATERIALS_SOURCE.json'
          git diff --cached --check
          git diff --cached --quiet && { echo 'MATERIAL_KIT_ALREADY_PRESENT'; exit 0; }
          git commit -m 'art(umbral2): publish five original scalable medieval UI material textures'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo 'ORIGINAL_UMBRAL2_MATERIAL_KIT_COMMITTED'
