name: Forja Oscura - publish deterministic premium sprites to draft branch
on:
  push:
    branches: [feature/forja-oscura-native-proof-20261107]
    paths: [tools/forja-oscura/art-transfer-request.txt]
permissions:
  contents: write
concurrency:
  group: eldoria-forja-first-party-art-commit
  cancel-in-progress: false
jobs:
  commit-nine-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact Forja feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/forja-oscura-native-proof-20261107
          sparse-checkout: |
            tools/forja-oscura
            Unity/Assets/Eldoria/VisualKit
          persist-credentials: true
      - name: Read canonical MAIN workstream lease
        uses: actions/checkout@v4
        with:
          ref: main
          path: canonical-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Refuse binary art commit without the live Forja write claim
        run: |
          node <<'JS'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('canonical-main/pipeline/active-workstreams.json'));
          const w=r.active.find(x=>x.id==='eldoria-forja-oscura-visual-proof-20261107');
          if(!w||w.owner!=='chatgpt-forja-oscura-visual-proof-20261107'||
             w.ownership_state!=='claimed'||w.write_scope_released===true||
             w.branch!=='feature/forja-oscura-native-proof-20261107')
            throw new Error('Forja write scope not exclusively claimed; no binary changes made.');
          console.log('FORJA_WRITE_CLAIM_PASS');
          JS
      - name: Render original premium metal panels and tab/button states
        run: |
          node tools/forja-oscura/build-premium-sprites.js /tmp/forja-premium
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          manifest=json.loads(Path('/tmp/forja-premium/manifest.json').read_text())
          assert len(manifest['pieces'])==9, 'Nine independent production PNGs required'
          target=Path('Unity/Assets/Eldoria/VisualKit/Resources/ForjaOscura/Surfaces')
          for a in manifest['pieces']:
              src=Path('/tmp/forja-premium')/a['filename']
              dst=target/a['filename']
              assert src.is_file() and dst.is_file() and Path(str(dst)+'.meta').is_file(), dst
              assert hashlib.sha256(src.read_bytes()).hexdigest()==a['sha256']
              dst.write_bytes(src.read_bytes())
          print('FORJA_PRODUCTION_PREMIUM_PNGS_UPDATED_AND_METADATA_RETAINED')
          PY
          python3 tools/forja-oscura/verify-production.py
      - name: Commit only the nine owned PNG sprites, never gameplay or main
        shell: bash
        run: |
          set -euo pipefail
          dest="Unity/Assets/Eldoria/VisualKit/Resources/ForjaOscura/Surfaces"
          for f in panel_dark panel_quest resource_chip nav_tile_normal nav_tile_selected button_primary_normal button_primary_hover button_primary_pressed button_primary_disabled; do
            git add "$dest/$f.png"
          done
          if git diff --cached --quiet; then echo 'FORJA_ART_ALREADY_CURRENT'; exit 0; fi
          git -c user.name='eldoria-forja-ci' -c user.email='eldoria-forja-ci@users.noreply.github.com' \
            commit -m 'art(forja): replace provisional panels with reproducible premium nine-slice sprites'
          git push origin HEAD:refs/heads/feature/forja-oscura-native-proof-20261107
          echo 'FORJA_PREMIUM_SPRITES_COMMITTED_TO_DRAFT_BRANCH; native visual approval pending.'
