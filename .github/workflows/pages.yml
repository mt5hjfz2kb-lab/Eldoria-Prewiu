name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eldoria-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Use canonical v0.22.0 desire-loop base
        run: |
          test -s v0220/index.html
          mkdir -p playtest
          cp v0220/index.html playtest/index.html

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('playtest/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,code in enumerate(scripts):
              pathlib.Path(f'/tmp/eldoria-script-{i}.js').write_text(code)
          print(f'Checking {len(scripts)} inline scripts')
          PY
          for f in /tmp/eldoria-script-*.js; do node --check "$f"; done

      - name: Core-loop structural and regression checks
        run: |
          test -s playtest/index.html
          grep -q '<meta name="eldoria-version" content="0.22.0"' playtest/index.html
          grep -q "const KEY='eldoria-v022'" playtest/index.html
          grep -q "function kingdom()" playtest/index.html
          grep -q "function world()" playtest/index.html
          grep -q "function heroes()" playtest/index.html
          grep -q "function realmPower" playtest/index.html || grep -q "const realmPower" playtest/index.html
          grep -q "const armyPower" playtest/index.html
          grep -q "const heroPower" playtest/index.html
          grep -q "const equipmentPower" playtest/index.html
          grep -q "const relicPower" playtest/index.html
          grep -q "const marchPower" playtest/index.html
          grep -q "function buildingUpgrade" playtest/index.html
          grep -q "data-worldpan" playtest/index.html
          grep -q "wp.scrollWidth-host.clientWidth" playtest/index.html
          grep -q 'data-node="aetherbeast"' playtest/index.html
          grep -q "DEVORADOR DE VELARIA" playtest/index.html
          grep -q "ASCUA DE ÉTER" playtest/index.html
          grep -q "function huntAetherBeast()" playtest/index.html
          grep -q "function forgePoi()" playtest/index.html
          grep -q "function forgeItem()" playtest/index.html
          grep -q "heroEquipment" playtest/index.html
          grep -q "function discoverMaelis()" playtest/index.html
          grep -q "function finalAssault()" playtest/index.html
          grep -q 'data-testid=\x27final-combat\x27' playtest/index.html
          grep -q "VERTICAL SLICE · ARCO I COMPLETADO" playtest/index.html
          grep -q "function qaMode()" playtest/index.html
          grep -q 'data-testid="qa-reset"' playtest/index.html
          grep -q "maelisUnlock:'bastion8'" playtest/index.html
          ! grep -q "function discoverKael()" playtest/index.html
          ! grep -q "let duel = null;" playtest/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v0220
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
