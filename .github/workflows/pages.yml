name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eldoria-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Use canonical v0.22.0 desire-loop base
        run: |
          test -s v0220/index.html
          mkdir -p playtest
          cp v0220/index.html playtest/index.html

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('playtest/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,code in enumerate(scripts):
              pathlib.Path(f'/tmp/eldoria-script-{i}.js').write_text(code)
          print(f'Checking {len(scripts)} inline scripts')
          PY
          for f in /tmp/eldoria-script-*.js; do node --check "$f"; done

      - name: Core-loop structural and regression checks
        run: |
          test -s v0220/index.html
          grep -q '<meta name="eldoria-version" content="0.22.0"' v0220/index.html
          grep -q "const KEY='eldoria-v022'" v0220/index.html
          grep -q "function kingdom()" v0220/index.html
          grep -q "function world()" v0220/index.html
          grep -q "function heroes()" v0220/index.html
          grep -q "function buildingUpgrade" v0220/index.html
          grep -q 'data-node="valoria"' v0220/index.html
          grep -q "function startMarchTrial()" v0220/index.html
          grep -q "function finalAssault()" v0220/index.html
          grep -q "VERTICAL SLICE · ARCO I COMPLETADO" v0220/index.html
          grep -q "window.ELDORIA_V022" v0220/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: v0220
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published v0.22
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            HTML="$(curl -fsSL "$URL" || true)"
            if printf '%s' "$HTML" | grep -q 'eldoria-version" content="0.22.0' && printf '%s' "$HTML" | grep -q "const KEY='eldoria-v022'"; then
              echo "Published v0.22 verified at $URL"
              exit 0
            fi
            sleep 5
          done
          echo "Published page did not expose current v0.22"
          exit 1
