name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Use canonical v0.23 clean vertical-slice base
        run: |
          test -s v0220/index.html
          mkdir -p playtest
          cp v0220/index.html playtest/index.html

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('playtest/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,code in enumerate(scripts):
              pathlib.Path(f'/tmp/eldoria-script-{i}.js').write_text(code)
          print(f'Checking {len(scripts)} inline scripts')
          PY
          for f in /tmp/eldoria-script-*.js; do node --check "$f"; done

      - name: Recovery regression checks
        run: |
          test -s playtest/index.html
          test -s assets/orin-portrait.jpg
          grep -q 'v022-core-loop' playtest/index.html
          grep -q 'ELDORIA_V023' playtest/index.html
          grep -Eq "version:'0\.23\.[0-9]+'" playtest/index.html
          grep -q 'data-object-action' playtest/index.html
          grep -q 'buildingTimer' playtest/index.html
          grep -q 'data-equip' playtest/index.html
          grep -q 'passiveRates' playtest/index.html
          grep -q 'function qaAssertions' playtest/index.html
          grep -q 'function qaState' playtest/index.html
          grep -q 'data-testid="building-sawmill"' playtest/index.html
          grep -q 'data-testid="building-keep"' playtest/index.html
          grep -q 'data-testid="world-action-' playtest/index.html
          ! grep -q "id=\"v020-chapter1-intro\"" playtest/index.html
          ! grep -q "eldoria-aldric-story-r7-v3';let seen" playtest/index.html
          grep -q 'v022-premium-visual-pass' playtest/index.html
          grep -q 'Bastión de Valoria' playtest/index.html
          grep -q 'function recoverAether()' playtest/index.html
          grep -q 'function rescueNareth()' playtest/index.html
          grep -q 'function marchTrial()' playtest/index.html
          grep -q 'function finalAssault()' playtest/index.html
          grep -q 'function openHeroHall()' playtest/index.html
          grep -q "visualRecoveryBase:'f139968c'" playtest/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
