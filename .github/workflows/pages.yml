name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Eldoria v0.20.1
        run: |
          node tools/build-r7.mjs
          node tools/postprocess-v020.mjs
      - name: Structural publication checks
        run: |
          test -s playtest/index.html
          ! grep -q '../v0195-r6/index.html' playtest/index.html
          grep -q '0.20.1-onboarding' playtest/index.html
          grep -q 'v0201-ux-script' playtest/index.html
          grep -q 'onboardingDone' playtest/index.html
          grep -q 'Duelo de Reliquias' playtest/index.html
          grep -q 'MAR DE CRISTAL' playtest/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
