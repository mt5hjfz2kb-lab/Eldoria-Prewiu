name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build consolidated v0.20.0
        run: |
          node tools/build-r7.mjs
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime
          p=Path('playtest/index.html')
          s=p.read_text()
          portrait='data:image/jpeg;base64,'
          s=s.replace('0.19.5-r7-storypass','0.20.0-narrative-flow').replace("version:'0.19.5-r7'","version:'0.20.0'").replace("BUILD_SCHEMA='0195-r7'","BUILD_SCHEMA='0200'")
          s=s.replace('<div class="aldric-portrait">⚔</div>',f'<div class="aldric-portrait"><img src="{portrait}" alt="Sir Aldric"></div>')
          s=s.replace('.aldric-portrait{width:58px;', '.aldric-portrait{overflow:hidden;width:58px;').replace('.aldric-name{font-size:', '.aldric-portrait img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.aldric-name{font-size:')
          intro="""<script id='v020-chapter1-intro'>(()=>{const K='eldoria-v020-ch1-intro';function markOld(){try{const k='eldoria-aldric-story-r7-v3',o=JSON.parse(localStorage.getItem(k)||'{}');o['chapter1-start']=1;localStorage.setItem(k,JSON.stringify(o))}catch{}}function start(){if(localStorage.getItem(K)||document.querySelector('.aldric-cinematic'))return;markOld();localStorage.setItem(K,'1');const full='Mi señor, Valoria sobrevivió… pero apenas.\\n\\nNuestros almacenes están vacíos, los talleres destruidos y los soldados dispersos. Antes de buscar respuestas sobre la Brecha, debemos conseguir que el reino vuelva a sostenerse.\\n\\nEmpecemos por el Granero. Sin alimento, Valoria no puede levantarse.';const o=document.createElement('div');o.className='aldric-cinematic';o.dataset.scene='chapter1-intro-v020';o.innerHTML=`<div class=\"aldric-dialogue\"><div class=\"aldric-head\"><div class=\"aldric-portrait\"><img src=\"${PORTRAIT}\" alt=\"Sir Aldric\"></div><div><div class=\"aldric-name\">SIR ALDRIC</div><div class=\"aldric-role\">Guardián de Valoria</div></div></div><div class=\"aldric-copy\"><div class=\"aldric-ghost\"></div><div class=\"aldric-typed\"></div></div><div class=\"aldric-wait\">ESCUCHA…</div><button class=\"aldric-continue primary\" type=\"button\">Continuar</button></div>`;document.body.appendChild(o);document.documentElement.style.overflow='hidden';const b=o.querySelector('.aldric-dialogue'),g=o.querySelector('.aldric-ghost'),t=o.querySelector('.aldric-typed'),btn=o.querySelector('button');g.textContent=full;let i=0;function type(){if(i<full.length){const ch=full[i++];t.textContent=full.slice(0,i);setTimeout(type,ch==='.'?130:ch===','?65:22)}else{b.classList.add('done');btn.focus()}}type();btn.onclick=()=>{if(!b.classList.contains('done'))return;o.remove();document.documentElement.style.overflow=''}}setTimeout(start,350)})();</script>""".replace('${PORTRAIT}',portrait)
          s=s.replace('</body>',intro+'</body>')
          p.write_text(s)
          h=hashlib.sha256(s.encode()).hexdigest()
          Path('playtest/build.json').write_text(json.dumps({'version':'0.20.0','revision':'narrative-flow','sha256':h,'builtAt':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2))
          PY
      - name: Structural publication checks
        run: |
          test -s playtest/index.html
          ! grep -q '../v0195-r6/index.html' playtest/index.html
          grep -q '0.20.0-narrative-flow' playtest/index.html
          grep -q 'chapter1-intro-v020' playtest/index.html
          grep -q 'Sir Aldric' playtest/index.html
          grep -q 'onboardingDone' playtest/index.html
          grep -q 'Duelo de Reliquias' playtest/index.html
          grep -q 'MAR DE CRISTAL' playtest/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
