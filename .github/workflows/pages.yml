name: Publish Eldoria Preview
# Runner-throughput maintenance trigger: workflow-only changes stay off the Windows Unity lane.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v0220/**'
      - 'qa/**'
      - 'tools/build-preview.mjs'
      - 'tools/check-preview.mjs'
      - 'tools/validate-local.mjs'
      - 'tools/run-qa-mode.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playtest/**'
      - 'tester-v0265/**'
      - 'pipeline/unity-publish-request.json'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: eldoria-pages-main
  # Each coherent green push certifies and publishes the exact candidate.
  # Only the newest main candidate matters during an active development block.
  # Superseded runs are cancelled so stale candidates cannot block final certification.
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    outputs:
      heavy_required: ${{ steps.impact.outputs.heavy_required }}
      deploy_approved: ${{ steps.impact.outputs.deploy_approved }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
      reuse_source_sha: ${{ steps.reuse.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve QA-approved exact WebGL artifact for promotion
        id: reuse
        uses: actions/github-script@v7
        with:
          script: |
            const cfg = require('./pipeline/unity-publish-request.json');
            if (cfg.enabled !== true || cfg.release_approved !== true || !cfg.reuse_webgl_build_run_id) return;
            const run = (await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: cfg.reuse_webgl_build_run_id
            })).data;
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_branch !== 'main' || run.head_sha !== cfg.reuse_webgl_source_sha)
              throw new Error('Approved build identity/status mismatch');
            const qa = (await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: cfg.candidate_qa_run_id
            })).data;
            if (qa.status !== 'completed' || qa.conclusion !== 'success' ||
                qa.path !== '.github/workflows/unity-webgl-startup.yml')
              throw new Error('Candidate QA has not passed');
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${run.head_sha}...${context.sha}`
            })).data;
            if (comparison.files.some(f => /^(Unity\/|references\/)/.test(f.filename)))
              throw new Error('Unity/reference source changed after approved build; rebuild required');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100
            });
            if (!artifacts.some(a => !a.expired && a.name === `eldoria-unity-webgl-${run.head_sha}`))
              throw new Error('Approved WebGL artifact is missing or expired');
            core.setOutput('run_id', String(run.id));
            core.setOutput('source_sha', run.head_sha);
            core.setOutput('qa_run_id', String(qa.id));
      - name: Download candidate QA evidence for exact artifact promotion
        if: steps.reuse.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.reuse.outputs.qa_run_id }}
          name: eldoria-webgl-startup-evidence
          path: approved-candidate-qa
      - name: Require matching clean full candidate QA before promotion
        if: steps.reuse.outputs.run_id != ''
        env:
          APPROVED_BUILD_RUN: ${{ steps.reuse.outputs.run_id }}
          APPROVED_BUILD_SHA: ${{ steps.reuse.outputs.source_sha }}
        run: |
          node <<'JS'
          const r = require('./approved-candidate-qa/report.json');
          const assert = require('node:assert/strict');
          assert.equal(r.delivery.kind, 'candidate');
          assert.equal(r.delivery.sourceSha, process.env.APPROVED_BUILD_SHA);
          assert.equal(String(r.delivery.buildRunId), process.env.APPROVED_BUILD_RUN);
          assert.equal(r.failure, null);
          assert.equal(r.runtimeErrors.length, 0);
          assert.equal(r.checks.navigationGatherPersistencePass, true);
          assert.equal(r.coverage.fullBastionIToIIPass, true);
          for (const orientation of ['landscape', 'portrait']) {
            const flow = r.fullFlows.find(f => f.orientation === orientation);
            assert.ok(flow && flow.pass && flow.persistencePass && flow.resetPass);
          }
          console.log('EXACT_CANDIDATE_PROMOTION_QA=PASS');
          JS
      - name: Decide whether Unity WebGL build is required
        id: impact
        shell: bash
        run: |
          # Release to stable requires explicit separate approval; default is build-only.
          if node -e 'const c=require("./pipeline/unity-publish-request.json"); process.exit(c.release_approved === true ? 0 : 1)'; then
            echo "deploy_approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_approved=false" >> "$GITHUB_OUTPUT"
          fi
          # Explicit release switch: never build or deploy when publication is paused.
          if ! node -e 'const c=require("./pipeline/unity-publish-request.json"); process.exit(c.enabled === true ? 0 : 1)'; then
            echo "Publication disabled: no Windows build and no Pages deploy."
            echo "deploy_approved=false" >> "$GITHUB_OUTPUT"
            echo "heavy_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${{ steps.reuse.outputs.run_id }}" ]]; then
            echo "Promote exact QA-approved artifact; no redundant Windows rebuild."
            echo "heavy_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "heavy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "heavy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "$files"
          heavy=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              pipeline/unity-publish-request.json|Unity/Assets/Eldoria/Scripts/Editor/SceneSetup.cs)
                heavy=true
                break
                ;;
              .github/workflows/pages.yml)
                # Workflow maintenance must not consume the Windows Unity runner.
                continue
                ;;
              Unity/Assets/Eldoria/ArtTests/*|Unity/Assets/Eldoria/Scripts/Editor/*)
                continue
                ;;
              Unity/*)
                # Unity source is certified by its dedicated gates. WebGL publication is
                # requested explicitly through pipeline/unity-publish-request.json.
                continue
                ;;
            esac
          done <<< "$files"
          echo "heavy_required=$heavy" >> "$GITHUB_OUTPUT"

  unity-webgl:
    needs: source-preflight
    if: needs.source-preflight.outputs.heavy_required == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 45
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $candidates = @(
              "${env:ProgramFiles}\Git\cmd\git.exe",
              "${env:ProgramFiles}\Git\bin\git.exe",
              "${env:LOCALAPPDATA}\Programs\Git\cmd\git.exe"
            )
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            if (Test-Path $desktop) {
              $candidates += Get-ChildItem $desktop -Directory -Filter 'app-*' |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' }
            }
            $gitPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $gitPath) { throw 'Git not found on Windows runner.' }
            $gitDirectory = Split-Path $gitPath
            Add-Content -Path $env:GITHUB_PATH -Value $gitDirectory
            $env:PATH = "$gitDirectory;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
      - name: Ensure WebGL Build Support
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw "UNITY_EDITOR_PATH not found" }
          $editorDir = Split-Path $env:UNITY_EDITOR_PATH
          $webgl = Join-Path $editorDir 'Data\PlaybackEngines\WebGLSupport'
          if (Test-Path $webgl) { Write-Host 'WebGL Build Support already installed.'; exit 0 }
          $unityCli = Get-Command unity.exe -ErrorAction SilentlyContinue
          if (-not $unityCli) {
            $candidates = @(
              "${env:LOCALAPPDATA}\Programs\Unity\bin\unity.exe",
              "${env:LOCALAPPDATA}\Unity\bin\unity.exe",
              "${env:USERPROFILE}\.unity\bin\unity.exe"
            )
            $unityCliPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($unityCliPath) { $unityCli = Get-Item $unityCliPath }
          }
          if (-not $unityCli) { throw 'Unity CLI is not installed or not discoverable on the runner.' }
          Write-Host "Installing WebGL Build Support with Unity CLI: $($unityCli.Source)"
          & $unityCli.Source install-modules -e 6000.3.23f1 -m webgl --format human
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "Unity CLI WebGL module install failed with exit code $code." }
          if (-not (Test-Path $webgl)) { throw 'Unity CLI completed but WebGL Build Support path is still missing.' }
          Write-Host 'WebGL Build Support installed successfully.'
      - name: Stage current certified Valoria production scene when requested
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cfg = Get-Content "$env:GITHUB_WORKSPACE\pipeline\unity-publish-request.json" -Raw | ConvertFrom-Json
          if ($cfg.mode -ne "current-valoria-production") {
            Write-Host "Legacy Unity publication mode."
            exit 0
          }
          if (-not $cfg.production_artifact_id) { throw "Current Valoria publication requires production_artifact_id." }
          if (-not $cfg.parcel_source_artifact_id) { throw "Current Valoria publication requires parcel_source_artifact_id." }
          $zip = Join-Path $env:RUNNER_TEMP "valoria-current-production.zip"
          $extract = Join-Path $env:RUNNER_TEMP "valoria-current-production"
          $splatsZip = Join-Path $env:RUNNER_TEMP "valoria-webgl-splats.zip"
          $splats = Join-Path $env:GITHUB_WORKSPACE "webgl-external-splats"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $splats -Recurse -Force -ErrorAction SilentlyContinue
          $headers = @{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28" }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/$($cfg.production_artifact_id)/zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $src = Join-Path $extract "Assets\Eldoria\ProductionSlice"
          $dst = Join-Path $env:GITHUB_WORKSPACE "Unity\Assets\Eldoria\ProductionSlice"
          if (-not (Test-Path (Join-Path $src "Runtime\Valoria.unity"))) { throw "Certified production Valoria scene missing from artifact." }
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          Copy-Item $src $dst -Recurse -Force

          $captures = Join-Path $extract "ValoriaFirstPlayableCitySliceV1Captures"
          $backgrounds = Join-Path $env:GITHUB_WORKSPACE "webgl-certified-backgrounds"
          Remove-Item $backgrounds -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $backgrounds -Force | Out-Null
          $backgroundMap = @{
            "runtime-home-initial.png" = "valoria-state-0.png"
            "runtime-left-built.png" = "valoria-state-1.png"
            "runtime-home-initial.png#state2" = "valoria-state-2.png"
            "runtime-both-built.png" = "valoria-state-3.png"
          }
          Copy-Item (Join-Path $captures "runtime-home-initial.png") (Join-Path $backgrounds "valoria-state-0.png") -Force
          Copy-Item (Join-Path $captures "runtime-left-built.png") (Join-Path $backgrounds "valoria-state-1.png") -Force
          Copy-Item (Join-Path $captures "runtime-home-initial.png") (Join-Path $backgrounds "valoria-state-2.png") -Force
          Copy-Item (Join-Path $captures "runtime-both-built.png") (Join-Path $backgrounds "valoria-state-3.png") -Force
          if (-not (Test-Path (Join-Path $captures "runtime-bastion-ii.png"))) { throw "Certified Bastion II capture missing." }
          Copy-Item (Join-Path $captures "runtime-bastion-ii.png") (Join-Path $backgrounds "valoria-bastion-ii.png") -Force
          foreach ($state in @(0,3)) {
            foreach ($pan in @("-0.5","0","0.5")) {
              foreach ($zoom in @("0.9","1","1.1")) {
                $name = "runtime-state$state-pan$pan-zoom$zoom.png"
                $srcCapture = Join-Path $captures $name
                if (-not (Test-Path $srcCapture)) { throw "Certified pan/zoom capture missing: $name" }
                Copy-Item $srcCapture (Join-Path $backgrounds ("valoria-state$state-pan$pan-zoom$zoom.png")) -Force
              }
            }
          }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/$($cfg.parcel_source_artifact_id)/zip" -OutFile $splatsZip
          Expand-Archive -Path $splatsZip -DestinationPath $splats -Force
          foreach ($i in 0..3) {
            $ply = Join-Path $splats "state-$i.ply"
            if (-not (Test-Path $ply)) { throw "Certified SHARP WebGL state missing: $ply" }
          }
          Write-Host "Staged certified current Valoria scene and exact external SHARP states."

      - name: Stage minimal Eldoria Resources for owner WebGL transport
        shell: powershell
        run: |
          $cfg = Get-Content "$env:GITHUB_WORKSPACE\pipeline\unity-publish-request.json" -Raw | ConvertFrom-Json
          if ($cfg.mode -ne "current-valoria-production") {
            Write-Host "Legacy Unity publication mode; Resources staging unchanged."
            exit 0
          }

          $resources = Join-Path $env:GITHUB_WORKSPACE "Unity\Assets\Eldoria\Resources"
          $stash = Join-Path $env:RUNNER_TEMP "eldoria-full-resources"
          Remove-Item $stash -Recurse -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $resources)) { throw "Eldoria Resources folder missing before WebGL staging." }

          Move-Item $resources $stash -Force
          New-Item -ItemType Directory -Path $resources -Force | Out-Null

          $keepDirs = @("WorldPlayerCity","WorldInventory","UI")
          foreach ($name in $keepDirs) {
            $src = Join-Path $stash $name
            $dst = Join-Path $resources $name
            if (-not (Test-Path $src)) { throw "$name resource missing from full Resources stash." }
            Copy-Item $src $dst -Recurse -Force
          }

          $valoriaDst = Join-Path $resources "Valoria"
          New-Item -ItemType Directory -Path $valoriaDst -Force | Out-Null
          foreach ($name in @("ExternalAssetLibrary.asset","ExternalAssetLibrary.asset.meta")) {
            $src = Join-Path (Join-Path $stash "Valoria") $name
            if (-not (Test-Path $src)) { throw "Required Valoria resource missing: $name" }
            Copy-Item $src (Join-Path $valoriaDst $name) -Force
          }

          $urbanSrc = Join-Path (Join-Path $stash "Valoria") "UrbanProps"
          $urbanDst = Join-Path $valoriaDst "UrbanProps"
          New-Item -ItemType Directory -Path $urbanDst -Force | Out-Null
          foreach ($name in @("Crate.prefab","Crate.prefab.meta")) {
            $src = Join-Path $urbanSrc $name
            if (-not (Test-Path $src)) { throw "Required world prop missing: $name" }
            Copy-Item $src (Join-Path $urbanDst $name) -Force
          }

          Write-Host "WEBGL_MINIMAL_RESOURCES_PASS kept=WorldPlayerCity,WorldInventory,ExternalAssetLibrary,Crate excluded=historical-valoria-resources"

      - name: Build Unity WebGL current requested slice
        shell: powershell
        run: |
          Remove-Item "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL" -Recurse -Force -ErrorAction SilentlyContinue
          $cfg = Get-Content "$env:GITHUB_WORKSPACE\pipeline\unity-publish-request.json" -Raw | ConvertFrom-Json
          $method = if ($cfg.mode -eq "current-valoria-production") { "Eldoria.EditorTools.ValoriaCurrentWebGLBuildV1.Build" } else { "Eldoria.EditorTools.SceneSetup.BuildWebGL" }
          Write-Host "Unity WebGL build method: $method"
          $log = "$env:RUNNER_TEMP/Eldoria-WebGL.log"
          $args = @("-batchmode","-nographics","-quit","-projectPath","$env:GITHUB_WORKSPACE/Unity","-executeMethod",$method,"-logFile",$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(1200000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Unity WebGL build timed out."
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 300 }
            throw "Unity WebGL build failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL/index.html")) { throw "Unity WebGL index.html was not produced." }
          if ($cfg.mode -eq "current-valoria-production") {
            foreach ($i in 0..3) {
              Copy-Item "$env:GITHUB_WORKSPACE/webgl-external-splats/state-$i.ply" "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL/splat-state-$i.ply" -Force
            }
            Copy-Item "$env:GITHUB_WORKSPACE/webgl-external-splats/parcel-source.json" "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL/parcel-source.json" -Force
            foreach ($i in 0..3) {
              Copy-Item "$env:GITHUB_WORKSPACE/webgl-certified-backgrounds/valoria-state-$i.png" "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL/valoria-state-$i.png" -Force
            }
            Copy-Item "$env:GITHUB_WORKSPACE/webgl-certified-backgrounds/valoria-bastion-ii.png" "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL/valoria-bastion-ii.png" -Force
            foreach ($state in @(0,3)) {
              foreach ($pan in @("-0.5","0","0.5")) {
                foreach ($zoom in @("0.9","1","1.1")) {
                  $name = "valoria-state$state-pan$pan-zoom$zoom.png"
                  Copy-Item "$env:GITHUB_WORKSPACE/webgl-certified-backgrounds/$name" "$env:GITHUB_WORKSPACE/Unity/Builds/WebGL/$name" -Force
                }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: eldoria-unity-webgl-${{ github.sha }}
          path: Unity/Builds/WebGL/
          retention-days: 7

  deploy:
    needs: [source-preflight, unity-webgl]
    if: always() && needs.source-preflight.result == 'success' && needs.source-preflight.outputs.deploy_approved == 'true' && (needs.unity-webgl.result == 'success' || needs.source-preflight.outputs.reuse_run_id != '')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Decide whether legacy web certification is required
        id: web-impact
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "$files"
          required=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              v0220/*|qa/*|tools/build-preview.mjs|tools/check-preview.mjs|tools/validate-local.mjs|tools/run-qa-mode.mjs|package.json|package-lock.json|playtest/*|tester-v0265/*)
                required=true
                break
                ;;
            esac
          done <<< "$files"
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - name: Download Unity WebGL build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.source-preflight.outputs.reuse_run_id || github.run_id }}
          name: eldoria-unity-webgl-${{ needs.source-preflight.outputs.reuse_source_sha || github.sha }}
          path: unity-owner

      - name: Install Playwright QA browser
        if: steps.web-impact.outputs.required == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full local-equivalent certification gate
        if: steps.web-impact.outputs.required == 'true'
        run: npm run validate:local

      - name: Guard frozen tester snapshot
        run: |
          git diff --exit-code df618e86be9da399bb827d5e6cebc3f13e55ff97 -- tester-v0265/

      - name: Upload local QA source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-local-qa-source
          path: |
            v0220/
            qa/
          retention-days: 1

      - name: Upload player-experience report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-${{ github.run_number }}
          path: |
            qa-player-experience.json
            qa-player-experience.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Arc I diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arc1-sweep-diagnostics-${{ github.run_number }}
          path: |
            qa-failure-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published build with Chromium
        if: steps.web-impact.outputs.required == 'true'
        run: |
          sleep 30
          URL='${{ steps.deployment.outputs.page_url }}playtest/?qa=1&published=${{ github.sha }}&cb=${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            echo "Published verification attempt $attempt"
            curl -fsSL -H "Cache-Control: no-cache" "$URL" | grep -q "eldoria-version" || { sleep 10; continue; }
            if ELDORIA_URL="$URL" E2E_PHASE=complete node qa/e2e-smoke.js && \
               ELDORIA_URL="$URL" node qa/e2e-behavior-regression.js; then
              exit 0
            fi
            [ "$attempt" -lt 4 ] && sleep 30
          done
          exit 1
      - name: Verify frozen tester URL remains available
        run: |
          TESTER_URL='${{ steps.deployment.outputs.page_url }}tester-v0265/?cb=${{ github.run_id }}'
          curl -fsSL -H "Cache-Control: no-cache" "$TESTER_URL" | grep -q "Eldoria — Closed Playtest T1"

      - name: Verify Unity OWNER WebGL URL
        run: |
          UNITY_URL='${{ steps.deployment.outputs.page_url }}unity-owner/?cb=${{ github.run_id }}'
          curl -fsSL -H "Cache-Control: no-cache" "$UNITY_URL" | grep -qi "<canvas\\|unity"

