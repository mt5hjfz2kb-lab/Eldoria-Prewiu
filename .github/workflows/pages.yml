name: Publish Eldoria Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A certification run must finish once started. Cancelling it on every small
  # follow-up commit was leaving Eldoria permanently between certifications.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install Playwright QA browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Full local-equivalent certification gate
        run: npm run validate:local

      - name: Upload local QA source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-local-qa-source
          path: |
            v0220/
            qa/
          retention-days: 1

      - name: Upload player-experience report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-${{ github.run_number }}
          path: |
            qa-player-experience.json
            qa-player-experience.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Arc I diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arc1-sweep-diagnostics-${{ github.run_number }}
          path: |
            qa-failure-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published build with Chromium
        run: |
          sleep 30
          URL='${{ steps.deployment.outputs.page_url }}playtest/?qa=1&published=${{ github.sha }}&cb=${{ github.run_id }}'
          for attempt in 1 2 3 4; do
            echo "Published verification attempt $attempt"
            curl -fsSL -H "Cache-Control: no-cache" "$URL" | grep -q "eldoria-version" || { sleep 10; continue; }
            if ELDORIA_URL="$URL" E2E_PHASE=complete node qa/e2e-smoke.js && \
               ELDORIA_URL="$URL" node qa/e2e-behavior-regression.js; then
              exit 0
            fi
            [ "$attempt" -lt 4 ] && sleep 30
          done
          exit 1
