name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A certification run must finish once started. Cancelling it on every small
  # follow-up commit was leaving Eldoria permanently between certifications.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Use canonical v0.24 clean vertical-slice base
        run: |
          test -s v0220/index.html
          test -s v0220/runtime-hotfix.js
          mkdir -p playtest
          cp v0220/index.html playtest/index.html
          rm -rf playtest/js
          cp -R v0220/js playtest/js
          sed -i 's#</body>#<script src="../v0220/runtime-hotfix.js"></script></body>#' playtest/index.html

      - name: Upload local QA source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-local-qa-source
          path: |
            v0220/
            qa/
          retention-days: 1

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('playtest/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,code in enumerate(scripts):
              pathlib.Path(f'/tmp/eldoria-script-{i}.js').write_text(code)
          print(f'Checking {len(scripts)} inline scripts')
          PY
          for f in /tmp/eldoria-script-*.js; do node --check "$f"; done
          node --check v0220/runtime-hotfix.js

      - name: Install Playwright QA browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local QA build
        run: |
          python3 -m http.server 4173 >/tmp/eldoria-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:4173/playtest/ >/dev/null
      - name: E2E boot canonical game
        id: qa_boot
        continue-on-error: true
        run: E2E_PHASE=boot node qa/e2e-smoke.js
      - name: E2E sawmill contextual action
        id: qa_context
        continue-on-error: true
        run: E2E_PHASE=context node qa/e2e-smoke.js
      - name: E2E sawmill construction starts
        id: qa_start
        continue-on-error: true
        run: E2E_PHASE=start node qa/e2e-smoke.js
      - name: E2E sawmill construction completes
        id: qa_complete
        continue-on-error: true
        run: E2E_PHASE=complete node qa/e2e-smoke.js

      - name: E2E behavior regression
        id: qa_behavior
        continue-on-error: true
        run: node qa/e2e-behavior-regression.js
      - name: E2E core progression regression
        id: qa_core
        continue-on-error: true
        run: node qa/e2e-core-flow.js
      - name: E2E every building interaction
        id: qa_buildings
        continue-on-error: true
        run: node qa/e2e-all-buildings.js
      - name: E2E every world-node interaction
        id: qa_nodes
        continue-on-error: true
        run: node qa/e2e-all-nodes.js
      - name: E2E real early progression
        id: qa_early
        continue-on-error: true
        run: node qa/e2e-real-progression.js
      - name: E2E real late Arc I progression
        id: qa_late
        continue-on-error: true
        run: node qa/e2e-late-progression.js
      - name: E2E mandatory fresh-save Arc I
        id: arc1_sweep
        continue-on-error: true
        run: node qa/e2e-full-arc1.js
      - name: Certification gate — fail after complete diagnostic sweep
        run: |
          node - <<'NODE'
          const r=${{ toJSON(steps) }};
          const ids=['qa_boot','qa_context','qa_start','qa_complete','qa_behavior','qa_core','qa_buildings','qa_nodes','qa_early','qa_late','arc1_sweep'];
          const failed=ids.filter(id=>r[id]&&r[id].conclusion!=='success');
          if(failed.length){console.error('QA failures collected:',failed.join(', '));process.exit(1)}
          console.log('COMPLETE QA SWEEP PASS');
          NODE
      - name: Upload player-experience report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-${{ github.run_number }}
          path: |
            qa-player-experience.json
            qa-player-experience.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Arc I diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arc1-sweep-diagnostics-${{ github.run_number }}
          path: |
            qa-failure-*.png
          if-no-files-found: ignore
      - name: Recovery regression checks
        run: |
          test -s playtest/index.html
          test -s assets/orin-portrait.jpg
          grep -q 'v022-core-loop' playtest/index.html
          grep -q 'ELDORIA_V023' playtest/index.html
          grep -q "version:'0.24.0'" playtest/index.html
          grep -q 'data-object-action' playtest/index.html
          grep -q 'buildingTimer' playtest/index.html
          grep -q 'data-equip' playtest/index.html
          grep -q 'passiveRates' playtest/index.html
          grep -q 'function qaAssertions' playtest/index.html
          grep -q 'function qaState' playtest/index.html
          grep -q 'data-testid="building-sawmill"' playtest/index.html
          grep -q 'data-testid="building-keep"' playtest/index.html
          grep -q 'data-testid="world-action-' playtest/index.html
          ! grep -q "id=\"v020-chapter1-intro\"" playtest/index.html
          ! grep -q "eldoria-aldric-story-r7-v3';let seen" playtest/index.html
          grep -q 'v022-premium-visual-pass' playtest/index.html
          grep -q 'Bastión de Valoria' playtest/index.html
          grep -q 'function recoverAether()' playtest/index.html
          grep -q 'function rescueNareth()' playtest/index.html
          grep -q 'function marchTrial()' playtest/index.html
          grep -q 'function finalAssault()' playtest/index.html
          grep -q 'function openHeroHall()' playtest/index.html
          grep -q "visualRecoveryBase:'f139968c'" playtest/index.html
          grep -q 'runtime-hotfix.js' playtest/index.html
          grep -q 'js/state-economy.js' playtest/index.html
          grep -q 'js/tasks-offline.js' playtest/index.html
          grep -q 'js/dialogue-tutorial.js' playtest/index.html
          grep -q 'js/ui.js' playtest/index.html
          grep -q 'js/gameplay.js' playtest/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published build with Chromium
        run: |
          sleep 30
          ELDORIA_URL='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/playtest/?qa=1&published=${{ github.sha }}' E2E_PHASE=complete node qa/e2e-smoke.js
          ELDORIA_URL='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/playtest/?qa=1&published=${{ github.sha }}' node qa/e2e-all-nodes.js
          ELDORIA_URL='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/playtest/?qa=1&published=${{ github.sha }}' node qa/e2e-real-progression.js
          ELDORIA_URL='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/playtest/?qa=1&published=${{ github.sha }}' node qa/e2e-full-arc1.js
