name: Publish Eldoria Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Use canonical v0.22.0 desire-loop base
        run: |
          test -s v0220/index.html
          mkdir -p playtest
          cp v0220/index.html playtest/index.html

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('playtest/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,code in enumerate(scripts):
              pathlib.Path(f'/tmp/eldoria-script-{i}.js').write_text(code)
          print(f'Checking {len(scripts)} inline scripts')
          PY
          for f in /tmp/eldoria-script-*.js; do node --check "$f"; done

      - name: Core-loop structural and regression checks
        run: |
          test -s playtest/index.html
          test -s assets/orin-portrait.jpg
          grep -q '<meta name="eldoria-version" content="0.22.0"' playtest/index.html
          grep -q 'desire-loop-v1' playtest/index.html
          grep -q 'v022-core-loop' playtest/index.html
          grep -q 'RECONSTRUYE · EXPLORA · CONQUISTA' playtest/index.html
          grep -q 'Bastión de Valoria' playtest/index.html
          grep -q 'El mundo alimenta tu reino' playtest/index.html
          grep -q 'Bosque de Ceniza' playtest/index.html
          grep -q 'Cantera del Vigía' playtest/index.html
          grep -q 'Corruptos de la Brecha' playtest/index.html
          grep -q 'Los Guardias resolvieron el choque sobre el mapa' playtest/index.html
          grep -q 'UN JURAMENTO REGRESA' playtest/index.html
          grep -q 'Lyra, Arquera de Ceniza' playtest/index.html
          grep -q 'FISURA SOMETIDA' playtest/index.html
          grep -q 'NODO AGOTADO' playtest/index.html
          grep -q 'El enemigo deja botín, pero no crea Poder' playtest/index.html
          grep -q 'Poder de marcha' playtest/index.html
          grep -q 'Bosque II · 12k' playtest/index.html
          grep -q 'Fortaleza ???' playtest/index.html
          grep -q 'PERFIL DEL JUGADOR' playtest/index.html
          grep -q 'REINICIAR PARTIDA' playtest/index.html
          grep -q '¿REINICIAR VALORIA?' playtest/index.html
          grep -q 'BASTIÓN III' playtest/index.html
          grep -q 'MAR DE CRISTAL' playtest/index.html
          grep -q 'Sir Aldric' playtest/index.html
          grep -q 'Duelo de Reliquias' playtest/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
