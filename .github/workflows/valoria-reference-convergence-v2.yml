name: "[EXPERIMENT] Valoria Reference Convergence v2"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-reference-convergence-v2.yml'
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaReferenceConvergencePassV2.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaReferenceConvergenceGateV2.cs'

permissions:
  contents: read
  actions: write

concurrency:
  group: valoria-reference-convergence-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Release older convergence runs and stale unowned historical runner jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workflow_id=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} --jq '.workflow_id')
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$workflow_id/runs?per_page=30"             --jq '.workflow_runs[] | select((.status=="in_progress" or .status=="queued" or .status=="pending") and (.id != '${GITHUB_RUN_ID}')) | .id' |
          while read -r run; do
            [ -z "$run" ] && continue
            gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/$run/cancel || true
            echo "cancel requested for older convergence run $run"
          done

          for run in 36994997684 36995060877 36997913002 36997913113; do
            state=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/$run --jq '.status' 2>/dev/null || echo missing)
            if [ "$state" = "in_progress" ] || [ "$state" = "queued" ]; then
              gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/$run/cancel || true
            fi
          done

  capture:
    needs: preflight
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Verify tracked Unity source is clean
        shell: powershell
        run: |
          git reset --hard HEAD
          $dirty = git status --porcelain --untracked-files=all -- Unity/Assets Unity/Packages Unity/ProjectSettings
          if($dirty){
            Write-Host $dirty
            throw 'Tracked Unity source workspace is contaminated; refusing warm-cache gate.'
          }
          Write-Host 'Unity source clean; preserving ignored Unity/Library cache only.'
      - name: Capture matched reference convergence proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaReferenceConvergenceV2Captures"
          $log="$env:RUNNER_TEMP\ValoriaReferenceConvergenceV2.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaReferenceConvergenceGateV2.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(20)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 260};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
          Get-Content (Join-Path $folder 'before-metrics.json')
          Get-Content (Join-Path $folder 'after-metrics.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-reference-convergence-v2-${{ github.run_id }}
          path: |
            Unity/ValoriaReferenceConvergenceV2Captures/*
            ${{ runner.temp }}/ValoriaReferenceConvergenceV2.log
          if-no-files-found: warn
          retention-days: 30
