name: Repository architecture guard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eldoria-repository-architecture-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enforce repository architecture invariants
        run: node tools/check-repository-architecture.mjs
      - name: Validate documentation catalogue and local links
        run: node tools/check-documentation-governance.mjs
      - name: Test documentation governance (positive and negative cases)
        run: node --test tools/check-documentation-governance.test.mjs
      - name: Enforce persistent art learning evidence and regression tests
        run: |
          node tools/art-direction/learning-evidence/learning.mjs audit
          node --test tools/art-direction/learning-evidence/learning.test.mjs
