name: Repository architecture guard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eldoria-repository-architecture-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    # Keep all structural/documentary checks; download only their source inputs.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Structural checks inspect all paths in the exact committed Git tree.
          # Keep source/docs dependencies; omit Unity binary bodies that no check reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /SESSION_HANDOFF.md
            /PROJECT_STATE.md
            /README.md
            /references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
            /docs/documentation-catalog.json
            /docs/DOCUMENTATION_INDEX.md
            /docs/DOCUMENTATION_POLICY.md
            /docs/WORKFLOW_INDEX.md
            /docs/ELDORIA_ART_PIPELINE_INDEX.md
            /pipeline/repository-architecture-invariants.json
            /pipeline/active-workstreams.json
            /tools/check-repository-architecture*
            /tools/check-documentation-governance*
            /tools/check-owner-ai-contract*
            /tools/ELDORIA_AGENT_SESSION_BOOTSTRAP.md
            /docs/ELDORIA_PARALLEL_WORKSTREAM_PROTOCOL.md
            /tools/closeout/
            /tools/workflow-recovery/
            /tools/work-status/
            /tools/workstream-lease/
            /.github/workflows/valoria-reference-clean.yml
            /.github/workflows/valoria-windows-chromium-qa.yml
            /tools/art-direction/learning-evidence/
            /tools/art-direction/ai-authoring/unity_pixel_diff.mjs
            /tools/art-knowledge/
            /tools/mission-continuity/core.mjs
            /tools/mission-continuity/core.test.mjs
            /pipeline/art-knowledge/catalog-v1.json
            /pipeline/art-knowledge/reviewed-lessons-v1.json
      - name: Enforce repository architecture invariants
        run: |
          node tools/check-repository-architecture.mjs --tracked-tree
          node --test tools/check-repository-architecture.test.mjs
      - name: Preserve founding owner–AI roles across chat handoffs
        run: |
          node tools/check-owner-ai-contract.mjs
          node --test tools/check-owner-ai-contract.test.mjs
      - name: Test transferable ownership and stale queued-run rejection
        run: node --test tools/workstream-lease/*.test.mjs
      - name: Validate documentation catalogue and local links
        run: node tools/check-documentation-governance.mjs --tracked-tree
      - name: Test documentation governance (positive and negative cases)
        run: ELDORIA_CI_TRACKED_TREE=1 node --test tools/check-documentation-governance.test.mjs
      - name: Test read-only closeout diagnostics (no Windows, no game build)
        run: node --test tools/closeout/closeout.test.mjs
      - name: Test recoverable native outputs and bounded read-only status
        run: node --test tools/workflow-recovery/*.test.mjs tools/work-status/*.test.mjs
      - name: Enforce persistent art learning evidence and regression tests
        run: |
          node tools/art-direction/learning-evidence/learning.mjs audit
          node --test tools/art-direction/learning-evidence/learning.test.mjs
      - name: Protect priority of rejected art lessons and paused/stale mission classification
        run: node --test tools/art-knowledge/select.test.mjs tools/mission-continuity/core.test.mjs
