name: Repository architecture guard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eldoria-repository-architecture-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Keep every recursively counted tree and every documentation/learning
          # dependency. Unrelated Unity vendor packs and source art are not read
          # by these guards; fetching their binaries exhausted this job's budget.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/workflows/
            /docs/
            /pipeline/
            /tools/
            /Unity/Assets/Eldoria/
            /Unity/ProjectSettings/ProjectVersion.txt
            /references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
      - name: Enforce repository architecture invariants
        run: node tools/check-repository-architecture.mjs
      - name: Validate documentation catalogue and local links
        run: node tools/check-documentation-governance.mjs
      - name: Test documentation governance (positive and negative cases)
        run: node --test tools/check-documentation-governance.test.mjs
      - name: Enforce persistent art learning evidence and regression tests
        run: |
          node tools/art-direction/learning-evidence/learning.mjs audit
          node --test tools/art-direction/learning-evidence/learning.test.mjs
