name: Repository architecture guard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eldoria-repository-architecture-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    # The complete guarded trees still need >177 s to materialize after the
    # sparse metadata fetch. Preserve all checks and allow their checkout to finish.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Structural checks inspect all paths in the exact committed Git tree.
          # Keep source/docs dependencies; omit Unity binary bodies that no check reads.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/workflows/
            /docs/
            /pipeline/
            /tools/
            /Unity/Assets/Eldoria/
            /Unity/ProjectSettings/ProjectVersion.txt
            /references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
            !/Unity/Assets/Eldoria/**/*.png
            !/Unity/Assets/Eldoria/**/*.jpg
            !/Unity/Assets/Eldoria/**/*.jpeg
            !/Unity/Assets/Eldoria/**/*.glb
            !/Unity/Assets/Eldoria/**/*.fbx
            !/Unity/Assets/Eldoria/**/*.blend
            !/Unity/Assets/Eldoria/**/*.wav
            !/Unity/Assets/Eldoria/**/*.mp3
            !/Unity/Assets/Eldoria/**/*.tga
            !/Unity/Assets/Eldoria/**/*.exr
      - name: Enforce repository architecture invariants
        run: |
          node tools/check-repository-architecture.mjs --tracked-tree
          node --test tools/check-repository-architecture.test.mjs
      - name: Validate documentation catalogue and local links
        run: node tools/check-documentation-governance.mjs
      - name: Test documentation governance (positive and negative cases)
        run: node --test tools/check-documentation-governance.test.mjs
      - name: Test read-only closeout diagnostics (no Windows, no game build)
        run: node --test tools/closeout/closeout.test.mjs
      - name: Enforce persistent art learning evidence and regression tests
        run: |
          node tools/art-direction/learning-evidence/learning.mjs audit
          node --test tools/art-direction/learning-evidence/learning.test.mjs
