name: "[CERT] Asset Library Reprocessing Pass v1 final"

on:
  push:
    branches: [visual-proof/asset-library-reprocessing-pass-v1]
    paths:
      - 'pipeline/validation/asset-library-reprocessing-final-cert.txt'

permissions:
  contents: read

concurrency:
  group: eldoria-asset-library-reprocessing-v1-final-cert
  cancel-in-progress: true

jobs:
  final-cert:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){ throw 'Git not found.' }
            $dir=Split-Path $candidate; Add-Content -Path $env:GITHUB_PATH -Value $dir; $env:PATH="$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Verify persisted certified Hero Bastion
        shell: powershell
        run: |
          $path="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\HeroBastionGenerated\Valoria_HeroBastion_v1.glb"
          $expected='afb6cee6ae572b0879650f18285b32798e263c17359a158ffe2bdd03fb62ad5c'
          $expectedBytes=13257704
          if(-not(Test-Path $path)){throw 'Persisted Hero Bastion is missing.'}
          $actual=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item $path).Length
          if($actual -ne $expected){throw "Persisted Hero Bastion SHA mismatch: $actual"}
          if($bytes -ne $expectedBytes){throw "Persisted Hero Bastion size mismatch: $bytes"}
          Write-Host "PERSISTED_HERO_BASTION_CERTIFIED sha256=$actual bytes=$bytes"
      - name: Verify Unity
        shell: powershell
        run: |
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH not found'}
          $version=& $env:UNITY_EDITOR_PATH -version
          if($version -notmatch '6000\.3\.23f1'){throw "Wrong Unity version: $version"}
      - name: Capture final real Valoria proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\AssetLibraryReprocessingCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-AssetLibraryReprocessing-Final.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.AssetLibraryReprocessingPassV1Gate.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(15)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;if(Test-Path $log){Get-Content $log -Tail 260};throw 'Final capture timed out.'}
          $p.Refresh()
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 320};throw "Final gate failed: $($p.ExitCode)"}
          $expected=@('before-19.png','before-12.png','before-9.png','before-mobile-390x844.png','after-19.png','after-12.png','after-9.png','after-mobile-390x844.png','evidence.json')
          foreach($name in $expected){$path=Join-Path $folder $name;if(-not(Test-Path $path)){throw "Missing final evidence: $name"}}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-library-reprocessing-final-${{ github.run_id }}
          path: |
            Unity/AssetLibraryReprocessingCaptures/*
            ${{ runner.temp }}/Eldoria-AssetLibraryReprocessing-Final.log
          if-no-files-found: warn
          retention-days: 30
