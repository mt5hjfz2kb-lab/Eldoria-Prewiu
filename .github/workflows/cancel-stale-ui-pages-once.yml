name: Cancel stale UI Pages once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-ui-pages-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages build only
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,per_page:100});
            const stale = runs.filter(r =>
              r.path === '.github/workflows/pages.yml' &&
              r.status === 'in_progress' &&
              r.head_sha !== context.sha
            );
            for (const run of stale) await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
