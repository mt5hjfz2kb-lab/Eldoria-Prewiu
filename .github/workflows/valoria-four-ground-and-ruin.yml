name: "[ART QUALITY GROUND] Four under-six independent grass dirt river ruin assets"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-four-ground-and-ruin.yml'
      - 'tools/valoria-modular-fortress/uplift_four_ground_ruin.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-four-ground-and-ruin
  cancel-in-progress: false
jobs:
  uplift-four:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 90
    steps:
      - name: Locate native Git Blender on PC
        id: native
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git unavailable'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender unavailable'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/four-weak-baselines
      - uses: actions/download-artifact@v4
        with:
          name: valoria-4m-wall-artisan-capstone-v6-38865543613
          run-id: 38865543613
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/four-best-stone-donor
      - name: Render four true individual modular ground/ruined-wall A-B pairs
        shell: powershell
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'four-weak-baselines\eldoria-upgrade63\glb'
          $wall=Join-Path $env:RUNNER_TEMP 'four-best-stone-donor\eldoria-4m-wall-architectural-v6\glb\wall_panel_regular_4m_warm_limestone_bright.glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-four-ground-ruin'
          if(-not(Test-Path (Join-Path $source 'wall_panel_ruined_4m.glb'))){throw 'Missing source ruined wall'}
          if(-not(Test-Path $wall)){throw 'Missing best V7 authentic stone donor'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/uplift_four_ground_ruin.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Missing pinned script'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-four-ground-ruin.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-four-ground.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-four-ground.err'
          $process=Start-Process -FilePath "${{ steps.native.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$source,$wall,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 110 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 45 -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0){throw "Four under-6 modules Blender error $($process.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            $c=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($c -ne 4){throw "Expected 4 $folder files got $c"}
          }
      - name: Archive one A-B per asset, all subject to real visual gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-four-ground-ruin-a-b-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-four-ground-ruin/**
            ${{ runner.temp }}/eldoria-four-ground.log
            ${{ runner.temp }}/eldoria-four-ground.err
          if-no-files-found: warn
          retention-days: 30
