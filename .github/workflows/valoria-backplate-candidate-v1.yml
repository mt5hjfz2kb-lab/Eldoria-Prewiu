name: "[EXPERIMENT] Valoria Mountain Backplate Sweep v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Presentation/ValoriaBackplateCandidateV1.cs'
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaBackplateCandidateGateV1.cs'
      - 'pipeline/valoria-backplate-candidate-v1-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-backplate-candidate-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage CC0 mountain backplates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\BackplateCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          function Stage-Asset([string]$asset,[string]$prefix,[int]$count) {
            Write-Host "Resolving Poly Haven asset $asset"
            $payload=Invoke-RestMethod -Uri ("https://api.polyhaven.com/files/"+$asset) -Headers @{'User-Agent'='Eldoria-Valoria-Convergence/1.0'}
            $json=$payload | ConvertTo-Json -Depth 100 -Compress
            $all=[regex]::Matches($json,'https://[^"]+?\.jpg(?:\?[^"]*)?') | ForEach-Object { $_.Value.Replace('\u0026','&').Replace('\/','/') } | Select-Object -Unique
            $urls=$all | Where-Object { $_ -match 'backplate|backplates' -and $_ -match 'pretty|jpg_pretty|JPG' }
            if(($urls|Measure-Object).Count -lt $count) {
              $urls=$all | Where-Object { $_ -notmatch 'Tonemapped|thumbnail|thumb|preview|colorchart' }
            }
            $urls=@($urls | Select-Object -Unique)
            Write-Host "Resolved $($urls.Count) candidate JPGs for $asset"
            if($urls.Count -lt $count){throw "Not enough backplate JPG URLs for $asset"}
            for($i=0;$i -lt $count;$i++){
              $dst=Join-Path $dir ($prefix+"_"+$i+".jpg")
              Write-Host "download $asset candidate $i -> $dst"
              Invoke-WebRequest -Uri $urls[$i] -OutFile $dst -UseBasicParsing
              $bytes=(Get-Item $dst).Length
              if($bytes -lt 150000){throw "Backplate $asset/$i unexpectedly small: $bytes"}
            }
          }

          Stage-Asset 'kiara_1_dawn' 'kiara1' 3
          Stage-Asset 'kiara_3_morning' 'kiara3' 3
          Stage-Asset 'kiara_7_late-afternoon' 'kiara7' 2
      - name: Capture backplate sweep
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaBackplateCandidateV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaBackplateCandidateV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaBackplateCandidateGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(25)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-backplate-candidate-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaBackplateCandidateV1Captures/*
            ${{ runner.temp }}/ValoriaBackplateCandidateV1.log
          if-no-files-found: warn
          retention-days: 30
