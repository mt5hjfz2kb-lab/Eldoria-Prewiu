name: Abrir el enlace público de Valoria en WebKit
on:
  push:
    branches: [experiment/valoria-ciudad-region-unificada-20261121]
    paths: ['.github/workflows/valoria-verificar-enlace-m2.yml']
permissions:
  statuses: write
  contents: read
  actions: read
jobs:
  safari:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Vincular esta prueba al enlace y localizar el paquete de evidencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state=pending -f context=valoria/revision-publica -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=39a79f8c44563b574ecfbafd990cb9aacc89f60d" --jq '.workflow_runs[] | [.id,.name,.status]'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install webkit
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json, statistics, time
          from PIL import Image
          from io import BytesIO
          results=[]
          with sync_playwright() as pw, pw.webkit.launch() as browser:
            for revision in ["f10f426","dba348c"]:
              ctx=browser.new_context(**pw.devices["iPhone 13"])
              page=ctx.new_page()
              errors=[]
              page.on("pageerror",lambda e: errors.append(str(e)))
              page.on("response",lambda r: errors.append(str(r.status)+" "+r.url) if r.status>=400 else None)
              start=time.monotonic()
              page.goto('https://valoria-revision-53489c4.kbkvc5c45n.chatgpt.site/?arte='+revision,wait_until='commit',timeout=90000)
              page.locator('#barra').wait_for(state='attached',timeout=60000)
              page.wait_for_function("getComputedStyle(document.getElementById('carga')).display==='none'",timeout=350000)
              # Unity reports startup before the first scene camera draws.
              # Wait for the actual name panel instead of timing a flat canvas.
              deadline=time.monotonic()+120
              while True:
                pixels=Image.open(BytesIO(page.screenshot())).convert('RGB').resize((100,180))
                if len(pixels.getcolors(18000))>350: break
                assert time.monotonic()<deadline,'Public player has not drawn its first scene'
                page.wait_for_timeout(650)
              load_seconds=time.monotonic()-start
              page.screenshot(path='inicio-'+revision+'.png')
              samples=page.evaluate("""() => new Promise(resolve => {
                const deltas=[]; let first, previous;
                function frame(now) {
                  if (first===undefined) first=now;
                  if (previous!==undefined) deltas.push(now-previous);
                  previous=now;
                  if (now-first<7000) requestAnimationFrame(frame); else resolve(deltas);
                }
                requestAnimationFrame(frame);
              })""")
              results.append(dict(revision=revision,load_seconds=load_seconds,frames=len(samples),
                median_ms=statistics.median(samples),p95_ms=sorted(samples)[int(.95*(len(samples)-1))],
                long_frames_over_50ms=sum(t>50 for t in samples),errors=errors))
              assert not errors,errors
              ctx.close()
          open('tiempos-webkit.json','w').write(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apertura-publica-dba348c-webkit
          path: |
            inicio-*.png
            tiempos-webkit.json
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA -f state="$state" -f context=valoria/revision-publica -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Leer las láminas de la entrega y los resultados de memoria
        run: |
          set -eu
          for i in $(seq 1 110); do
            if gh release view valoria-review-dba348c-m2 --json assets --jq '.assets[].name' | grep -Fxq 'Valoria-dba348c.zip'; then break; fi
            sleep 35
          done
          gh release download valoria-review-dba348c-m2 -p 'Valoria-dba348c.zip' -p '*.jpg'
          unzip -p Valoria-dba348c.zip verificacion.txt
          unzip -p Valoria-dba348c.zip retina/memoria.json > retina.json
          python - <<'PY'
          import json
          for m in json.load(open('retina.json')):
              if m.get('bastion')==5: print(m)
          PY
          for name in Region Ciudad Corona; do
            hash=$(base64 -w0 "$name.jpg" | jq -Rs '{encoding:"utf-8",content:.}' | gh api -X POST repos/$GH_REPO/git/blobs --input - --jq .sha)
            echo "VALORIA_GALLERY $name $hash"
          done
