name: Eldoria isolated mobile texture candidate
# Candidate3: bounded-error material ASTC compression, sustained runtime and visual comparison.
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-mobile-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-mobile-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 42420500174
          name: mobile-candidate-site
          github-token: ${{ github.token }}
          path: site/original
      - name: Install pinned asset codecs
        run: python -m pip install UnityPy==1.25.4 astc-encoder-py==0.1.12 numpy==2.3.5 Pillow==13.0.0 lz4==4.4.5 Brotli==1.2.1
      - name: Prepare exact baseline and extract verified bundle
        run: |
          python - <<'PY'
          import importlib.util,pathlib,json,gzip,hashlib,struct,shutil
          spec=importlib.util.spec_from_file_location('prep','tools/eldoria-private-beta/prepare-pages.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert pathlib.Path('site/original/release-identity.json').exists()
          b=json.loads(pathlib.Path('site/original/build-manifest.json').read_text())
          with open('original-data.bin','wb') as out:
            for part in b['decoded_parts'][b['data']]:
              raw=gzip.decompress((pathlib.Path('site/original')/part['url']).read_bytes())
              assert hashlib.sha256(raw).hexdigest()==part['decoded_sha256']
              out.write(raw)
          with open('original-data.bin','rb') as f,open('original.unity3d','wb') as out:
            assert f.read(16)==b'UnityWebData1.0\0'
            end=struct.unpack('<I',f.read(4))[0];header=f.read(end-20);off,size,n=struct.unpack_from('<III',header)
            assert header[12:12+n]==b'data.unity3d'
            f.seek(off);left=size
            while left:
              data=f.read(min(left,1048576));assert data;out.write(data);left-=len(data)
          PY
      - name: Compress bounded-error material textures and verify every object
        run: |
          python tools/eldoria-private-beta/compress_materials.py original.unity3d candidate
          python tools/eldoria-private-beta/mobile_site.py site/original original-data.bin candidate/data.unity3d site/mobile native325-mobile-material3
          node tools/delivery/test-exact-decoded-transport.mjs site/mobile
      - name: Install real browser for independent runtime test
        run: npm install --no-save playwright@1.55.0 pngjs@7.0.0 && npx playwright install --with-deps chromium
      - name: Start both exact candidate and baseline locally
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/beta-server.log 2>&1 &
          for n in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/mobile/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compare baseline and candidate actual Unity startup
        run: node tools/eldoria-private-beta/qa_mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-candidate-evidence
          path: |
            candidate/integrity.json
            candidate/texture-report.json
            qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-candidate-site
          path: site/mobile/
          compression-level: 0
          retention-days: 14
