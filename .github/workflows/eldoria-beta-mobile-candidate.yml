name: Eldoria structural candidate browser verification
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths: ['.github/workflows/eldoria-beta-mobile-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-mobile-candidate
  cancel-in-progress: true
env:
  NATIVE_RUN: '42473140363'
  NATIVE_EXPORT_SOURCE: d32508f9ce380eb8ea9bc10fecd4fb2dfc44a2f2
  NATIVE_ORIGIN_RUN: '42435095850'
  NATIVE_SOURCE: 91734045e8d32cc90cc4843b4b7e08e57b1a0458
  CANDIDATE_REVISION: native325-staged4
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for exact native run and require every native gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYWAIT'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['NATIVE_RUN']
          for _ in range(240):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as r:run=json.load(r)
            assert run['head_sha']==os.environ['NATIVE_EXPORT_SOURCE'],'Native source mismatch'
            if run['status']=='completed':
              assert run['conclusion']=='success','Native verification failed; no candidate packaging authorized'
              break
            time.sleep(10)
          else:raise RuntimeError('Native run still incomplete; no candidate certification')
          PYWAIT
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.NATIVE_RUN }}
          name: beta-structural-webgl-unverified
          github-token: ${{ github.token }}
          path: fresh-build
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.NATIVE_RUN }}
          name: beta-structural-native-evidence
          github-token: ${{ github.token }}
          path: native-evidence
      - uses: actions/download-artifact@v4
        with:
          run-id: 42397405907
          name: eldoria-pr163-web-preview-42397405907
          github-token: ${{ github.token }}
          path: frozen-artifact
      - uses: actions/download-artifact@v4
        with:
          run-id: 42421746562
          name: mobile-candidate-site
          github-token: ${{ github.token }}
          path: previous-candidate
      - name: Install pinned serialization dependencies
        run: python -m pip install UnityPy==1.25.4 lz4==4.4.5 Brotli==1.2.1
      - name: Verify native provenance and extract reference texture bundles
        run: |
          python - <<'PY'
          import pathlib,json,importlib.util,gzip,hashlib,struct,os
          root=pathlib.Path('.')
          export=json.load(open('native-evidence/preserved-web-inventory.json'))
          assert export['origin_source']==os.environ['NATIVE_SOURCE']
          assert export['origin_run']==os.environ['NATIVE_ORIGIN_RUN']
          assert export['export_run']==os.environ['NATIVE_RUN']
          assert export['export_source']==os.environ['NATIVE_EXPORT_SOURCE']
          assert export['status']=='RECOVERED_UNVERIFIED_SOURCE_NOT_MODIFIED'
          for f in export['files']:
            fp=pathlib.Path('fresh-build')/f['path']
            assert fp.stat().st_size==f['bytes']
            assert hashlib.sha256(fp.read_bytes()).hexdigest()==f['sha256'].lower()
          journey=json.load(open('native-evidence/native-journey/integration-result.json',encoding='utf-8-sig'))
          assert journey['source']==os.environ['NATIVE_SOURCE']
          assert journey['status']=='INTEGRATION_PASS_ART_REVIEW_REQUIRED'
          assert len(journey['checks'])==225
          inspection=json.load(open('native-evidence/recovery-inspection.json'))
          assert inspection['source_modified_by_recovery'] is False
          spec=importlib.util.spec_from_file_location('prep','tools/eldoria-private-beta/prepare-pages.py')
          prep=importlib.util.module_from_spec(spec);spec.loader.exec_module(prep)
          z=list(root.glob('frozen-artifact/**/Eldoria-native325-itch.zip'));assert len(z)==1
          prep.prepare(z[0],'original-site')
          for site,name in [(root/'original-site/beta-native325','original'),(root/'previous-candidate','verified')]:
            m=json.loads((site/'build-manifest.json').read_text());raw=bytearray()
            for part in m['decoded_parts'][m['data']]:
              b=gzip.decompress((site/part['url']).read_bytes())
              assert hashlib.sha256(b).hexdigest()==part['decoded_sha256'];raw.extend(b)
            assert raw[:16]==b'UnityWebData1.0\0'
            end=struct.unpack_from('<I',raw,16)[0];pos=20;found=[]
            while pos<end:
              offset,size,n=struct.unpack_from('<III',raw,pos);pos+=12
              path=raw[pos:pos+n];pos+=n
              if path==b'data.unity3d':found.append(raw[offset:offset+size])
            assert len(found)==1;(root/(name+'.unity3d')).write_bytes(found[0])
          PY
      - name: Reuse only byte-matched verified texture transformations in the fresh build
        run: |
          python tools/eldoria-private-beta/prepare_structural_site.py extract --build fresh-build --output extracted
          HASH=$(python -c "import json;print(json.load(open('extracted/extraction.json'))['bundle_sha256'])")
          python tools/eldoria-private-beta/reuse_verified_texture_transforms.py --original original.unity3d --verified verified.unity3d --fresh extracted/data.unity3d --expected-fresh-sha256 "$HASH" --destination transformed
          python tools/eldoria-private-beta/prepare_structural_site.py package --build fresh-build --wrapper previous-candidate --output site/mobile --data extracted/data.bin --bundle transformed/data.unity3d --texture-proof transformed/integrity.json --native-proof native-evidence/comparison.json --web-proof native-evidence/web-build.json --overlay-commit "$NATIVE_SOURCE" --revision "$CANDIDATE_REVISION" --native-run "$NATIVE_ORIGIN_RUN"
          node tools/delivery/test-exact-decoded-transport.mjs site/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-packaging-evidence
          path: |
            transformed/integrity.json
            extracted/extraction.json
            native-evidence/
            site/mobile/release-identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-candidate-site
          path: site/mobile/
          compression-level: 0
          retention-days: 14
  browser:
    needs: package
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Recover installed Git
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: beta-structural-browser-tools
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: beta-structural-browser-live
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-candidate-site
          path: beta-structural-browser-${{ github.run_id }}/site/mobile
      - name: Run actual browser with hardware renderer and verify entry persistence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content beta-structural-browser-live/pipeline/active-workstreams.json -Raw|ConvertFrom-Json
          $holders=@($r.active|Where-Object {$_.resources -contains 'windows-runner-heavy'})
          if($holders.Count -ne 1 -or $holders[0].id -ne 'eldoria-private-beta-i-v-20261107' -or $holders[0].ownership_revision -ne 8){throw 'Native/browser lease changed'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native tools busy'}
          $browser=@((Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'),(Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft/Edge/Application/msedge.exe'),(Join-Path $env:LOCALAPPDATA 'Google/Chrome/Application/chrome.exe'))|Where-Object {Test-Path $_}|Select-Object -First 1
          if(-not $browser){throw 'Installed hardware browser unavailable'}
          $env:VALORIA_CHROMIUM_EXECUTABLE=$browser
          $dependencies=Join-Path $env:RUNNER_TEMP "beta-browser-deps-$env:GITHUB_RUN_ID"
          npm install --prefix $dependencies --no-save playwright@1.55.0 pngjs@7.0.0
          if($LASTEXITCODE -ne 0){throw 'Browser dependencies failed'}
          $env:NODE_PATH=Join-Path $dependencies 'node_modules'
          $work=Join-Path $env:GITHUB_WORKSPACE "beta-structural-browser-$env:GITHUB_RUN_ID"
          if(Get-NetTCPConnection -LocalPort 18765 -State Listen -ErrorAction SilentlyContinue){throw 'Chosen local server port already in use'}
          $python=(Get-Command python.exe).Source
          $server=Start-Process $python -ArgumentList @('-m','http.server','18765','--bind','127.0.0.1','--directory',('"'+(Join-Path $work 'site')+'"')) -PassThru -RedirectStandardOutput (Join-Path $work 'http.log') -RedirectStandardError (Join-Path $work 'http-error.log')
          try {
            $env:QA_URL='http://127.0.0.1:18765/mobile/?eldoria_diag=1'
            $env:QA_REVISION=$env:CANDIDATE_REVISION
            $env:QA_OUT=Join-Path $work 'qa-structural'
            $ok=$false
            for($i=0;$i -lt 20;$i++){
              try {$null=Invoke-WebRequest $env:QA_URL -UseBasicParsing;$ok=$true;break}catch{Start-Sleep 1}
            }
            if(-not $ok){throw 'Local candidate server failed'}
            Push-Location $work
            try {
              node "$env:GITHUB_WORKSPACE/beta-structural-browser-tools/tools/eldoria-private-beta/qa_structural.cjs"
              if($LASTEXITCODE -ne 0){throw 'Sustained structural browser verification failed'}
              node "$env:GITHUB_WORKSPACE/beta-structural-browser-tools/tools/eldoria-private-beta/qa_entry.cjs"
              if($LASTEXITCODE -ne 0){throw 'Real entry/reload verification failed'}
            } finally {Pop-Location}
          } finally {if(-not $server.HasExited){Stop-Process -Id $server.Id}}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-candidate-evidence
          path: |
            beta-structural-browser-${{ github.run_id }}/qa-structural/
            beta-structural-browser-${{ github.run_id }}/qa-entry/
            beta-structural-browser-${{ github.run_id }}/http*.log
          retention-days: 14
  visible-save:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mobile-candidate-evidence
          path: evidence
      - name: Verify player name survives actual reload on rendered game
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m pip install Pillow==13.0.0
          python tools/eldoria-private-beta/verify_entry_name.py evidence/qa-entry/03-reloaded.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-name-verification
          path: evidence/qa-entry/

# Supersedes only the observed Linux package wait; native run 42435095850 continues independently.
