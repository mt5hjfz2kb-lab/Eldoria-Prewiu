name: "[CONVERGENCE] Valoria SHARP Lower Gate Geometry Gate v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-sharp-lower-gate-geometry-gate-v1.json"
      - ".github/workflows/valoria-sharp-lower-gate-geometry-gate-v1.yml"
      - "Unity/Assets/Eldoria/Scripts/Editor/ValoriaSharpLowerGateGeometryGateV1.cs"
  workflow_dispatch:
concurrency:
  group: valoria-sharp-lower-gate-geometry-gate-v1
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\\app\\git\\cmd\\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage approved Lower Gate GLB
        shell: powershell
        run: |
          $dst="$env:GITHUB_WORKSPACE\\Unity\\Assets\\Eldoria\\Convergence"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          $src="$env:GITHUB_WORKSPACE\\art-source\\valoria\\production\\lower-gate-family-v1\\LowerGateFamilyV1.glb"
          if(-not (Test-Path $src)){throw "Approved LowerGateFamilyV1.glb missing"}
          Copy-Item $src (Join-Path $dst "LowerGateFamilyV1.glb") -Force
      - name: Download clean SHARP source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dst="$env:GITHUB_WORKSPACE\\Unity\\SharpGaussianSource"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst | Out-Null
          $zip=Join-Path $env:RUNNER_TEMP "sharp-clean.zip"
          $headers=@{ Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"; "X-GitHub-Api-Version"="2022-11-28" }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/11408853949/zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          if(-not (Test-Path (Join-Path $dst "sharp-1.ply"))){throw "Clean SHARP PLY missing"}
      - name: Capture Gate 4 approved Lower Gate geometry proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\\Unity\\ValoriaSharpLowerGateGeometryGateV1Captures"
          $log="$env:RUNNER_TEMP\\ValoriaSharpLowerGateGeometryGateV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaSharpLowerGateGeometryGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(47)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 3;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate 4 timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 600};throw "Gate 4 failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'gate4-evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-sharp-lower-gate-geometry-gate-v1
          path: Unity/ValoriaSharpLowerGateGeometryGateV1Captures/*
          if-no-files-found: warn
          retention-days: 30
