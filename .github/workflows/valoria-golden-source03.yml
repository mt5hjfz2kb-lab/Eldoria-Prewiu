name: "[PRODUCTION] Golden Primary Forms Source03"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/golden-local-shell-v1-request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: valoria-golden-primary-forms-source03
  cancel-in-progress: true

jobs:
  source03:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Install Blender headless stack
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx-mesa0 xvfb
          blender --version
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1' || true

      - name: Author source03
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b --python-exit-code 1 --python tools/author-golden-primary-forms-source03.py
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03/source-report.json
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03/source03-clay-silhouette.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03/source03-lit-three-quarter.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03/source03-official-proxy.png

      - name: Record run metadata
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03/run.json')
          p.write_text(json.dumps({
            "run_id":os.environ["RUN_ID"],
            "run_attempt":os.environ["RUN_ATTEMPT"],
            "head_sha":os.environ["HEAD_SHA"],
            "status":"AUTHORING_COMPLETED"
          },indent=2)+"\n")
          PY

      - name: Persist source03 evidence
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03
          if ! git diff --cached --quiet; then
            git commit -m "Persist Golden primary forms source03 evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-primary-forms-v1-source03-review
          path: |
            art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/source03/*
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source03/*
          if-no-files-found: error
          retention-days: 30
