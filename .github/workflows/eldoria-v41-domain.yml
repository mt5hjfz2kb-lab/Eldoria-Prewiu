name: Eldoria V4.1 isolated domain contract
on:
  pull_request:
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Domain/EldoriaV41Contracts.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/EldoriaV41*.cs'
      - 'Unity/Assets/Eldoria/Scripts/Domain/GameState.cs'
      - 'Unity/Assets/Eldoria/Scripts/Application/LocalGateway.cs'
      - 'tools/eldoria-v41/**'
      - '.github/workflows/eldoria-v41-domain.yml'
      - '.github/workflows/ui-progression-cert.yml'
  workflow_dispatch:
jobs:
  release-superseded-own-wait:
    # One-time recovery of this task's obsolete READ-ONLY wait, never an editor/test job.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 134 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/eldoria-v41-contracts-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id=42033882013, oldHead='1c3fd55c845a1aab09f31954edab0322368eb081';
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id})).data;
            if(run.status!=='in_progress')return;
            if(run.head_sha!==oldHead || run.head_branch!=='feature/eldoria-v41-contracts-20261030' || run.path!=='.github/workflows/ui-progression-cert.yml')throw Error('Not the known obsolete own wait');
            if(context.payload.pull_request.head.sha===oldHead)throw Error('Candidate is not newer');
            const raw=(await github.rest.repos.getContent({...context.repo,path:'pipeline/active-workstreams.json',ref:'main'})).data;
            const active=JSON.parse(Buffer.from(raw.content,'base64').toString('utf8')).active;
            const owners=active.filter(x=>x.resources?.includes('windows-runner-heavy'));
            if(owners.length!==1 || owners[0].id!=='eldoria-v41-combate-buzon-ui-20261030' || owners[0].owner!=='codex-eldoria-pr136-consolidation-20261104')throw Error('Native ownership changed');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id,filter:'latest'})).data.jobs;
            const native=jobs.find(x=>x.name==='certify');
            const waiting=native?.steps?.find(x=>x.name==='Check live native-editor lease before downloading the Unity project');
            if(native?.status!=='in_progress' || waiting?.name!=='Check live native-editor lease before downloading the Unity project' || waiting.status!=='in_progress' || native.steps.some(x=>x.number>waiting.number && x.started_at)) {
              core.info('Preserve run: checkout/editor/test may have started');return;
            }
            // Only this identified superseded read-only wait; the job's always() retains normal cancellation.
            await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
            await new Promise(resolve=>setTimeout(resolve,2000));
            const fresh=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id,filter:'latest'})).data.jobs.find(x=>x.name==='certify');
            const hold=fresh?.steps?.find(x=>x.name===waiting.name);
            if(fresh?.status!=='in_progress' || hold?.status!=='in_progress' || fresh.steps.some(x=>x.number>hold.number && x.started_at))return;
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{...context.repo,run_id});
            core.info('Cancelled only known superseded read-only waiting run42033882013; no editor or foreign job targeted');
  v41-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-v41
            .github/workflows
            tools/bastion-iii
            tools/bastion-iv-v
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/Core
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/Bindings
            Unity/Assets/Eldoria/Scripts/Domain
            Unity/Assets/Eldoria/Scripts/Application
          sparse-checkout-cone-mode: true
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile source used by Unity and test without Unity or Windows lease
        run: dotnet run --configuration Release --project tools/eldoria-v41/EldoriaV41.Contracts.Tests.csproj
      - name: Test real gateway commands, persistent mailbox and legacy campaign
        run: dotnet run --configuration Release --project tools/eldoria-v41/GatewaySmoke.csproj
      - name: Preserve Bastion III narrative and economy after V4.1 integration
        run: dotnet run --configuration Release --project tools/bastion-iii/DomainProbe.csproj
      - name: Preserve Bastion IV V costs, rewards, upgrades and save parity
        run: dotnet run --configuration Release --project tools/bastion-iv-v/DomainProbe.csproj
      - name: Traverse Bastions I V continuously from a fresh save without seeded progression
        run: dotnet run --configuration Release --project tools/eldoria-v41/ContinuousJourney.csproj
      - name: Traverse the same continuous campaign with the production candidate resolver
        env:
          ELDORIA_V41_CAMPAIGN_PROBE: '1'
        run: dotnet run --configuration Release --project tools/eldoria-v41/ContinuousJourney.csproj
      - name: Reject incomplete or mismatched exact native certificates
        run: node tools/eldoria-v41/exact-native-certificate.test.mjs
