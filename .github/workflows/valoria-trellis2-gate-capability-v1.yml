name: "[R&D] Valoria TRELLIS2 Gate Capability v1"
on:
  workflow_dispatch:

# Quarantined R&D/capability workflow: manual-only. Production use requires canonical planner/fallback routing plus explicit owner dispatch.
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --quiet "gradio_client>=1.4" pillow
      - name: Generate Gate with TRELLIS.2 ZeroGPU
        env:
          OUT_DIR: /tmp/trellis-proof
        run: python tools/valoria-trellis2-space-proof.py
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-trellis2-gate-capability-v1
          path: /tmp/trellis-proof
          if-no-files-found: error
          retention-days: 30
