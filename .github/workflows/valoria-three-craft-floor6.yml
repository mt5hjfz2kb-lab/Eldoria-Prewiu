name: "[ART CRAFT FLOOR6] Three weaker mortar, river foam and limestone step"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-three-craft-floor6.yml'
      - 'tools/valoria-modular-fortress/true_foam_mortar_stone_step_v6.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-single-mortar-foam-step-art
  cancel-in-progress: false
jobs:
  three-standalone-meshes:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 80
    steps:
      - name: Local installed Windows Blender & Git
        shell: powershell
        id: bins
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing Git'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Missing Blender'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/true-craft-original
      - uses: actions/download-artifact@v4
        with:
          name: valoria-cc0-real-stone-materials-38823501643
          run-id: 38823501643
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/true-craft-stone-cc0
      - name: Native Blender create 3 detailed and physically independent modules
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'true-craft-original\eldoria-upgrade63\glb'
          $maps=Join-Path $env:RUNNER_TEMP 'true-craft-stone-cc0'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-three-craft-floor6'
          foreach($p in @((Join-Path $src 'stair_step.glb'),(Join-Path $maps 'rock_3_diffuse.jpg'),(Join-Path $maps 'quarry_wall_diffuse.jpg'))){
            if(-not(Test-Path $p)){throw "Required asset/source absent: $p"}
          }
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/true_foam_mortar_stone_step_v6.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned source missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-three-weakest-pinned.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-three-weakest.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-three-weakest.err'
          $proc=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$maps,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 115 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Blender three craft assets failed: $($proc.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 3){throw "Three assets required in $folder, got $count"}
          }
      - name: Store actual GLBs, renders and failures with no art approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-three-foam-mortar-stair-craft-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-three-craft-floor6/**
            ${{ runner.temp }}/eldoria-three-weakest.log
            ${{ runner.temp }}/eldoria-three-weakest.err
          if-no-files-found: warn
          retention-days: 30
