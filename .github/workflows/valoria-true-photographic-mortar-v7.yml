name: "[ART MORTAR FLOOR6] Real 3-channel CC0 historic lime mortar joint"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-true-photographic-mortar-v7.yml'
      - 'tools/valoria-modular-fortress/real_photographic_mortar_strip_v7.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-only-one-real-mortar-photo-v7
  cancel-in-progress: false
jobs:
  one-medieval-mortar-asset:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Native local Blender and Git
        shell: powershell
        id: binaries
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Installed Blender not available'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/fixed-original-63
      - uses: actions/download-artifact@v4
        with:
          name: valoria-mortar-true-polyhaven-PBR-38889560366
          run-id: 38889560366
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/CC0-true-grout
      - name: Actually rebuild one professional lime mortar recess using 3 CC0 PBR maps
        shell: powershell
        run: |
          $source=Join-Path $env:RUNNER_TEMP 'fixed-original-63\eldoria-upgrade63\glb\mortar_joint_recess.glb'
          $photos=Join-Path $env:RUNNER_TEMP 'CC0-true-grout'
          $dst=Join-Path $env:RUNNER_TEMP 'eldoria-one-real-aged-mortar'
          foreach($p in @($source,(Join-Path $photos 'plaster_stone_wall_02_diffuse.jpg'),(Join-Path $photos 'plaster_stone_wall_02_rough.jpg'))){
            if(-not(Test-Path $p)){throw "Required licensed source missing $p"}
          }
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/real_photographic_mortar_strip_v7.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned code not found'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-mortar-real-photo.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-real-mortar.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-real-mortar.err'
          $p=Start-Process -FilePath "${{ steps.binaries.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$source,$photos,$dst) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 90 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Native Blender medieval joint failed $($p.ExitCode)"}
          foreach($x in @('glb\mortar_joint_recess.glb','before\mortar_joint_recess.png','after\mortar_joint_recess.png','reports\single_real_mortar_CC0_pbr.json')){
            if(-not(Test-Path (Join-Path $dst $x))){throw "Missing real output $x"}
          }
      - name: Preserve actual independent CC0 mortar GLB and evidence A/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-one-real-photographic-mortar-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-one-real-aged-mortar/**
            ${{ runner.temp }}/eldoria-real-mortar.log
            ${{ runner.temp }}/eldoria-real-mortar.err
          if-no-files-found: warn
          retention-days: 30
