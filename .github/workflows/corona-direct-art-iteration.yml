name: Corona - direct artistic agent iteration
on:
  push:
    branches: [candidate/corona-auxiliary-modals-20261126]
    paths: ['.github/workflows/corona-direct-art-iteration.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: corona-direct-art-single-allocation
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == 'd26bcf0646c35815efca6c6c723b26545dfea4f5' && github.event.head_commit.message == 'Corona: direct bounded agent artistic iteration and proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/corona-art-iteration
      - uses: actions/checkout@v4
        with:
          ref: 1657b2caa6b1a955319538ce3a8b2906398599b3
          path: studio-source
          sparse-checkout: tools/openai-development-studio
          persist-credentials: false
      - name: Run deterministic edit safety tests before any API call
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 tools/corona-art-iteration/test_iteration.py
      - name: Obtain exact original candidate mobile evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 320); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45802472999")
            test "$(jq -r .head_sha <<< "$run")" = "91b8de9874aed87219d733efa6e8e0aa56207f1e"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/valoria-ciudad-region-unificada-20261121" --jq .object.sha)" = "91b8de9874aed87219d733efa6e8e0aa56207f1e"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/45802472999/jobs" --jq '.jobs[] | select(.name=="mobile-journey (1, ciudad-region-recorrido)" and .conclusion=="success") | .id' | grep -q .; then
              gh run download 45802472999 --repo "$GITHUB_REPOSITORY" --name ciudad-region-recorrido --dir before
              gh run download 45802472999 --repo "$GITHUB_REPOSITORY" --name corona-before-after-dpr1 --dir paired
              python3 - <<'PY'
          import json,hashlib,pathlib
          m=json.load(open('paired/manifest.json'))
          assert m['candidate_sha']=='91b8de9874aed87219d733efa6e8e0aa56207f1e' and not m['missing'] and len(m['pairs'])==13 and m['dpr']==1
          for p in m['pairs']:
              names={'hud-b1':'bastion-1','hud-b5':'bastion-5-completo','tutorial':'guia-iniciar-obra','construction':'temporizador-en-parcela','name':'nombre-inicial'}
              file=pathlib.Path('before')/(names.get(p['role'],'sistema-'+p['role'])+'.png')
              assert hashlib.sha256(file.read_bytes()).hexdigest()==p['candidate_sha256']
          PY
              exit 0
            fi
            if test "$(jq -r .status <<< "$run")" = completed; then exit 1; fi
            sleep 30
          done
          exit 1
      - name: Real director compares references and chooses bounded edits
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/corona-art-iteration/iterate.py plan --studio studio-source/tools/openai-development-studio --source before --out plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-agent-art-plan
          path: plan/
          if-no-files-found: warn
  implement:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            tools/corona-art-iteration
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV2/Runtime
            Unity/Assets/Eldoria/Issue186Art/Runtime
            Unity/Assets/Eldoria/DailyTreasures/Runtime
            Unity/Assets/Experimentos/ValoriaModular25D/Scripts
      - uses: actions/download-artifact@v4
        with:
          name: corona-agent-art-plan
          path: plan
      - name: Apply agent choices to exact real Unity source, no executable model output
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 tools/corona-art-iteration/iterate.py apply --root . --plan plan/plan.json --out applied.json
          git diff --check
          git diff --stat
          git diff > agent-implementation.patch
      - name: Commit only enumerated presentation files on the isolated branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "candidate/corona-auxiliary-modals-20261126"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)" = "$GITHUB_SHA"
          git config user.name "Eldoria Corona art agent"
          git config user.email "eldoria-corona-art-agent@users.noreply.github.com"
          python3 - <<'PY'
          import json,subprocess
          allowed={v['file'] for v in json.load(open('tools/corona-art-iteration/contract.json'))['knobs'].values()}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual<=allowed
          if actual:subprocess.run(['git','add','--',*sorted(actual)],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Corona artistic agent: bounded evidence-selected visual edits"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: corona-agent-implementation
          path: |
            applied.json
            agent-implementation.patch
