name: Unity WebGL published startup probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-webgl-startup.yml'
  workflow_run:
    workflows: ['Publish Eldoria Preview']
    types: [completed]

permissions:
  contents: read
jobs:
  startup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.55.0 pngjs@7.0.0 pixelmatch@5.3.0 && npx playwright install --with-deps chromium
      - name: Probe actual published Unity startup
        run: |
          mkdir -p webgl-startup-evidence
          cat > /tmp/eldoria-startup.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const { PNG } = require(process.cwd() + '/node_modules/pngjs');
          const pixelmatch = require(process.cwd() + '/node_modules/pixelmatch');
          const fs = require('fs');

          const target='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/unity-owner/';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const report={failure:null,logs:[],requests:[],checks:{},states:[],scope:'Published mobile PLAYABLE probe: real touch pan/home, real UI progression, Valoria↔World, Region 1 gather/reward, return, reload persistence, landscape+portrait screenshots. Chromium mobile emulation; physical iPhone owner test remains higher authority.'};

          function parseState(text){
            const m=text.match(/ELDORIA_PLAYABLE_STATE tag=([^ ]+) scene=([^ ]+) revision=(\d+) wood=(\d+) stone=(\d+) gatheredWood=(\d+) gatheredStone=(\d+) march=([^ ]+) sawmill=(\d+) bastion=(\d+)/);
            return m?{tag:m[1],scene:m[2],revision:+m[3],wood:+m[4],stone:+m[5],gatheredWood:+m[6],gatheredStone:+m[7],march:m[8],sawmill:+m[9],bastion:+m[10]}:null;
          }
          function parseUi(logs,id){
            for(let i=logs.length-1;i>=0;i--){
              const t=logs[i].text||'';
              const m=t.match(new RegExp('ELDORIA_PLAYABLE_UI id='+id+' x=([0-9.]+) y=([0-9.]+)'));
              if(m)return {x:+m[1],unityY:+m[2]};
            }
            return null;
          }
          function parseHotspot(logs,id){
            for(let i=logs.length-1;i>=0;i--){
              const t=logs[i].text||'';
              const m=t.match(new RegExp('ELDORIA_PLAYABLE_HOTSPOT id='+id+' x=([0-9.]+) y=([0-9.]+)'));
              if(m)return {x:+m[1],y:+m[2]};
            }
            return null;
          }
          async function waitLog(logs,predicate,timeout=60000,label='log',startIndex=0){
            const started=Date.now();
            while(Date.now()-started<timeout){
              for(let i=logs.length-1;i>=startIndex;i--) if(predicate(logs[i].text||'')) return logs[i].text;
              await sleep(250);
            }
            throw new Error('Timed out waiting for '+label);
          }
          async function waitState(logs,predicate,timeout=60000,label='state',startIndex=0){
            const started=Date.now();
            while(Date.now()-started<timeout){
              for(let i=logs.length-1;i>=startIndex;i--){
                const state=parseState(logs[i].text||'');
                if(state&&predicate(state)){report.states.push(state);return state;}
              }
              await sleep(250);
            }
            throw new Error('Timed out waiting for '+label);
          }
          function screenPoint(ui,box,canvasInfo){
            // Runtime logs use RectTransformUtility.WorldToScreenPoint, i.e. physical Unity
            // screen pixels with bottom-left origin. Map them directly into the CSS canvas box.
            return {
              x:box.x+(ui.x/canvasInfo.width)*box.width,
              y:box.y+((canvasInfo.height-ui.unityY)/canvasInfo.height)*box.height
            };
          }
          function hotspotPoint(hotspot,box,canvasInfo){
            return {
              x:box.x+(hotspot.x/canvasInfo.width)*box.width,
              y:box.y+(hotspot.y/canvasInfo.height)*box.height
            };
          }
          async function touchTap(cdp,x,y){
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y,radiusX:5,radiusY:5,force:1,id:1}]});
            await sleep(80);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
          }
          async function touchDrag(cdp,x1,y1,x2,y2){
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:x1,y:y1,radiusX:5,radiusY:5,force:1,id:1}]});
            for(let i=1;i<=8;i++){
              const t=i/8;
              await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:x1+(x2-x1)*t,y:y1+(y2-y1)*t,radiusX:5,radiusY:5,force:1,id:1}]});
              await sleep(35);
            }
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
          }
          async function tapVisibleBottomControl(page,box,logs,predicate,label,startIndex){
            // Chromium mobile emulation and Unity ScreenSpaceOverlay do not expose the same
            // coordinate space for RectTransform centres in landscape. Probe the actual
            // visible bottom navigation band with real touch taps instead of warping the game
            // or trusting a synthetic coordinate transform. Stop immediately on the expected
            // runtime navigation event.
            const fractions=[.05,.15,.25,.35,.45,.55,.65,.75,.85,.95];
            const y=box.y+box.height*.91;
            const attempts=[];
            for(const fx of fractions){
              const x=box.x+box.width*fx;
              attempts.push({fx,x,y});
              await page.touchscreen.tap(x,y);
              const started=Date.now();
              while(Date.now()-started<2500){
                for(let i=logs.length-1;i>=startIndex;i--){
                  if(predicate(logs[i].text||''))return {x,y,fx,attempts};
                }
                await sleep(100);
              }
            }
            throw new Error('Timed out waiting for '+label+' after visible bottom-control touch sweep');
          }
          function imageStats(path){
            const png=PNG.sync.read(fs.readFileSync(path));
            let n=0, sum=0, sum2=0, white=0;
            const x0=Math.floor(png.width*.18), x1=Math.floor(png.width*.82);
            const y0=Math.floor(png.height*.12), y1=Math.floor(png.height*.88);
            for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
              const i=(y*png.width+x)*4;
              const r=png.data[i],g=png.data[i+1],b=png.data[i+2];
              const v=(r+g+b)/3; n++; sum+=v; sum2+=v*v;
              if(r>245&&g>245&&b>245)white++;
            }
            const mean=sum/n, variance=sum2/n-mean*mean;
            return {width:png.width,height:png.height,mean,stdev:Math.sqrt(Math.max(0,variance)),whiteRatio:white/n};
          }
          function diffRatio(aPath,bPath){
            const a=PNG.sync.read(fs.readFileSync(aPath)), b=PNG.sync.read(fs.readFileSync(bPath));
            if(a.width!==b.width||a.height!==b.height)throw new Error('Screenshot dimensions differ');
            const out=new PNG({width:a.width,height:a.height});
            const changed=pixelmatch(a.data,b.data,out.data,a.width,a.height,{threshold:.12});
            return changed/(a.width*a.height);
          }

          (async()=>{
            let compressed=false;
            for(let attempt=0;attempt<20;attempt++){
              const response=await fetch(target+'?compression-check='+Date.now());
              const html=await response.text();
              if(html.includes('.unityweb')){compressed=true;break;}
              await sleep(30000);
            }
            if(!compressed)throw new Error('Compressed publication was not observed');

            const browser=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const context=await browser.newContext({
              viewport:{width:844,height:390},isMobile:true,hasTouch:true,deviceScaleFactor:1,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page=await context.newPage();
            const cdp=await context.newCDPSession(page);
            const logs=report.logs, requests=report.requests;
            page.on('console',m=>logs.push({type:m.type(),text:m.text()}));
            page.on('pageerror',e=>logs.push({type:'pageerror',text:String(e)}));
            page.on('response',r=>{if(r.url().includes('/unity-owner/'))requests.push({url:r.url(),status:r.status()});});
            page.on('requestfailed',r=>requests.push({url:r.url(),failure:r.failure()}));
            page.on('dialog',async d=>{logs.push({type:'dialog',text:d.message()});await d.dismiss();});
            await page.route(/^https:\/\/mt5hjfz2kb-lab\.github\.io\/Eldoria-Prewiu\/unity-owner\/(?:\?.*)?$/,async route=>{
              const response=await route.fetch();
              const html=await response.text();
              const token='.then((unityInstance) => {';
              if(!html.includes(token))throw new Error('Published Unity loader callback changed');
              await route.fulfill({response,body:html.replace(token,token+" document.body.dataset.eldoriaEngineReady='true';")});
            });

            try{
              await page.goto(target+'?playable-probe='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.body.dataset.eldoriaEngineReady==='true',{},{timeout:300000});
              await waitState(logs,s=>s.scene==='Valoria'||s.scene==='ValoriaWebGL',90000,'initial Valoria state');
              await waitLog(logs,t=>t.includes('VALORIA_WEBGL_HUD_BACKGROUND_READY'),60000,'Valoria certified background');
              await sleep(2500);

              await page.screenshot({path:'webgl-startup-evidence/home-landscape.png'});
              const homeStats=imageStats('webgl-startup-evidence/home-landscape.png');
              report.checks.homeVisual=homeStats;
              if(homeStats.stdev<28||homeStats.whiteRatio>.28)throw new Error('HOME lacks sufficient Valoria visual content');

              const canvasLocator=page.locator('canvas');
              const box=await canvasLocator.boundingBox();
              if(!box)throw new Error('Unity canvas missing');
              const canvasInfo=await canvasLocator.evaluate(c=>({width:c.width,height:c.height,clientWidth:c.clientWidth,clientHeight:c.clientHeight}));
              report.checks.canvas=canvasInfo;
              if(!canvasInfo.width||!canvasInfo.height)throw new Error('Unity canvas has invalid internal dimensions');
              const cx=box.x+box.width*.56, cy=box.y+box.height*.48;
              const beforePanRightLogs=logs.length;
              await touchDrag(cdp,cx+100,cy,cx-120,cy);
              await waitLog(logs,t=>{
                const m=t.match(/ELDORIA_PLAYABLE_VIEW panX=([-0-9.]+)/);
                return !!m&&(+m[1])>=.35;
              },15000,'real touch pan right',beforePanRightLogs);
              await sleep(800);
              await page.screenshot({path:'webgl-startup-evidence/pan-right-landscape.png'});
              const panRightDiff=diffRatio('webgl-startup-evidence/home-landscape.png','webgl-startup-evidence/pan-right-landscape.png');
              report.checks.panRightDiffRatio=panRightDiff;
              if(panRightDiff<.008)throw new Error('Right touch pan changed camera log but published view did not visibly change');

              const homeUi=parseUi(logs,'home');
              if(!homeUi)throw new Error('HOME touch target was not published by runtime');
              const hp=screenPoint(homeUi,box,canvasInfo);
              await page.touchscreen.tap(hp.x,hp.y);
              await waitLog(logs,t=>t.includes('ELDORIA_PLAYABLE_HOME'),10000,'HOME action after right pan');
              await waitLog(logs,t=>/ELDORIA_PLAYABLE_VIEW panX=-?0\.000/.test(t),10000,'HOME camera reset after right pan');
              await sleep(500);

              const beforePanLeftLogs=logs.length;
              await touchDrag(cdp,cx-100,cy,cx+120,cy);
              await waitLog(logs,t=>{
                const m=t.match(/ELDORIA_PLAYABLE_VIEW panX=([-0-9.]+)/);
                return !!m&&(+m[1])<=-.35;
              },15000,'real touch pan left',beforePanLeftLogs);
              await sleep(800);
              await page.screenshot({path:'webgl-startup-evidence/pan-left-landscape.png'});
              const panLeftDiff=diffRatio('webgl-startup-evidence/home-landscape.png','webgl-startup-evidence/pan-left-landscape.png');
              const panSidesDiff=diffRatio('webgl-startup-evidence/pan-right-landscape.png','webgl-startup-evidence/pan-left-landscape.png');
              report.checks.panLeftDiffRatio=panLeftDiff;
              report.checks.panSidesDiffRatio=panSidesDiff;
              if(panLeftDiff<.008||panSidesDiff<.008)throw new Error('Left/right touch pan views are not visually distinct');

              await page.touchscreen.tap(hp.x,hp.y);
              await waitLog(logs,t=>t.includes('ELDORIA_PLAYABLE_HOME'),10000,'HOME action after left pan');
              await waitLog(logs,t=>/ELDORIA_PLAYABLE_VIEW panX=-?0\.000/.test(t),10000,'HOME camera reset after left pan');
              await sleep(500);

              const beforePanVerticalLogs=logs.length;
              await touchDrag(cdp,cx,cy+70,cx,cy-70);
              await waitLog(logs,t=>{
                const m=t.match(/ELDORIA_PLAYABLE_VIEW panX=([-0-9.]+) panY=([-0-9.]+)/);
                return !!m&&Math.abs(+m[2])>=.10;
              },15000,'real touch vertical pan',beforePanVerticalLogs);
              await sleep(800);
              await page.screenshot({path:'webgl-startup-evidence/pan-vertical-landscape.png'});
              const panVerticalDiff=diffRatio('webgl-startup-evidence/home-landscape.png','webgl-startup-evidence/pan-vertical-landscape.png');
              report.checks.panVerticalDiffRatio=panVerticalDiff;
              if(panVerticalDiff<.002)throw new Error('Vertical touch pan changed camera log but published view did not visibly change');
              await page.touchscreen.tap(hp.x,hp.y);
              await waitLog(logs,t=>t.includes('ELDORIA_PLAYABLE_HOME'),10000,'HOME action after vertical pan');
              await waitLog(logs,t=>/ELDORIA_PLAYABLE_VIEW panX=-?0\.000 panY=-?0\.000/.test(t),10000,'HOME camera reset after vertical pan');
              await sleep(500);

              const worldStart=logs.length;
              const worldTap=await tapVisibleBottomControl(page,box,logs,
                t=>t.includes('ELDORIA_PLAYABLE_NAV target=Frontier city=True'),
                'MUNDO button activation',worldStart);
              report.checks.worldTapCss=worldTap;
              await waitState(logs,s=>s.scene==='Frontier',15000,'Valoria to World transition',worldStart);
              await waitLog(logs,t=>t.includes('ELDORIA_PLAYABLE_HOTSPOT id=forest-valoria'),10000,'forest hotspot geometry',worldStart);
              await sleep(1500);
              await page.screenshot({path:'webgl-startup-evidence/world-before-action.png'});

              const forest=parseHotspot(logs,'forest-valoria');
              if(!forest)throw new Error('Forest hotspot screen coordinate missing');
              const forestTapStart=logs.length;
              const fp=hotspotPoint(forest,box,canvasInfo);
              await page.touchscreen.tap(fp.x,fp.y);
              await waitLog(logs,t=>t.includes('ELDORIA_PLAYABLE_UI id=buildingAction'),10000,'forest action target',forestTapStart);
              const worldAction=parseUi(logs,'buildingAction');
              if(!worldAction)throw new Error('Forest action button missing');
              const wa=screenPoint(worldAction,box,canvasInfo);
              const gatherStart=logs.length;
              await page.touchscreen.tap(wa.x,wa.y);
              await waitLog(logs,t=>t.includes('ELDORIA_PLAYABLE_COMMAND kind=Gather target=forest-valoria ok=True'),10000,'Region 1 gather command',gatherStart);
              const rewardState=await waitState(logs,s=>s.scene==='Frontier'&&s.march==='idle'&&s.gatheredWood>=360,20000,'Region 1 return/reward');
              report.checks.rewardState=rewardState;
              await page.screenshot({path:'webgl-startup-evidence/world-after-reward.png'});

              const cityReturnStart=logs.length;
              const cityTap=await tapVisibleBottomControl(page,box,logs,
                t=>t.includes('ELDORIA_PLAYABLE_NAV target=Valoria city=False'),
                'REINO/CIUDAD button activation',cityReturnStart);
              report.checks.cityTapCss=cityTap;
              const returned=await waitState(logs,s=>(s.scene==='Valoria'||s.scene==='ValoriaWebGL')&&s.gatheredWood>=rewardState.gatheredWood,15000,'World to Reino/Valoria return',cityReturnStart);
              await page.screenshot({path:'webgl-startup-evidence/return-valoria.png'});

              const persisted={revision:returned.revision,wood:returned.wood,stone:returned.stone,gatheredWood:returned.gatheredWood,gatheredStone:returned.gatheredStone,sawmill:returned.sawmill};
              report.checks.beforeReload=persisted;
              const preReloadCount=logs.length;
              await page.reload({waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>document.body.dataset.eldoriaEngineReady==='true',{},{timeout:300000});
              const reloaded=await waitState(logs,s=>s.scene==='Valoria'||s.scene==='ValoriaWebGL',90000,'Valoria after reload',preReloadCount);
              report.checks.afterReload=reloaded;
              if(reloaded.gatheredWood<persisted.gatheredWood||reloaded.sawmill<persisted.sawmill||reloaded.wood!==persisted.wood)
                throw new Error('Persistence mismatch after reload');

              await page.setViewportSize({width:390,height:844});
              await sleep(2500);
              await page.screenshot({path:'webgl-startup-evidence/portrait.png'});
              const portraitStats=imageStats('webgl-startup-evidence/portrait.png');
              report.checks.portraitVisual=portraitStats;
              if(portraitStats.stdev<24||portraitStats.whiteRatio>.32)throw new Error('Portrait lacks sufficient Valoria visual content');

              if(logs.some(x=>x.type==='pageerror'||x.type==='dialog'))throw new Error('Runtime raised JavaScript error or dialog');
              report.checks.playablePass=true;
            }catch(e){
              report.failure=String(e);
              await page.screenshot({path:'webgl-startup-evidence/failure.png'}).catch(()=>{});
            }
            fs.writeFileSync('webgl-startup-evidence/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(report.failure)throw new Error(report.failure);
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node /tmp/eldoria-startup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-webgl-startup-evidence
          path: webgl-startup-evidence/
          retention-days: 7
