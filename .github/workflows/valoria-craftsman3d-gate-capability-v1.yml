name: "[R&D] Valoria CraftsMan3D Gate Capability v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-craftsman3d-gate-capability-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install client and Blender
        run: |
          python -m pip install --quiet "gradio_client>=1.4" pillow
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libglx-mesa0
      - name: Generate Gate with CraftsMan3D ZeroGPU
        env:
          OUT_DIR: /tmp/craftsman-proof
        run: python tools/valoria-craftsman3d-space-proof.py
      - name: Render generated GLB evidence
        run: |
          cat > /tmp/craftsman-proof/render.py <<'PY'
          import bpy, os
          from mathutils import Vector
          root="/tmp/craftsman-proof"; glb=os.path.join(root,"craftsman-gate.glb")
          if not os.path.exists(glb): raise RuntimeError("Missing craftsman-gate.glb")
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=glb)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("No meshes")
          pts=[o.matrix_world@Vector(c) for o in meshes for c in o.bound_box]
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene; sc.render.engine="BLENDER_EEVEE"; sc.render.resolution_x=900; sc.render.resolution_y=900; sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(0.04,0.04,0.04)
          bpy.ops.object.light_add(type="AREA",location=(center.x-span,center.y-span,center.z+span*1.4)); bpy.context.object.data.energy=1600; bpy.context.object.data.size=span*1.2
          bpy.ops.object.light_add(type="AREA",location=(center.x+span,center.y,center.z+span*.5)); bpy.context.object.data.energy=500; bpy.context.object.data.size=span
          bpy.ops.object.camera_add(); cam=bpy.context.object; sc.camera=cam; cam.data.lens=55
          for name,v in [("front",(0,-1.65,.4)),("three-quarter",(1.15,-1.25,.72)),("side",(1.65,0,.45))]:
              cam.location=center+Vector(v)*span
              cam.rotation_euler=(center-cam.location).to_track_quat("-Z","Y").to_euler()
              sc.render.filepath=os.path.join(root,name+".png"); bpy.ops.render.render(write_still=True)
          tris=sum(sum(max(0,len(p.vertices)-2) for p in o.data.polygons) for o in meshes)
          open(os.path.join(root,"render-report.txt"),"w").write(f"meshes={len(meshes)}\ntriangles_approx={tris}\nbounds={tuple(dims)}\n")
          PY
          blender -b --python /tmp/craftsman-proof/render.py
          test -s /tmp/craftsman-proof/front.png
          test -s /tmp/craftsman-proof/three-quarter.png
          test -s /tmp/craftsman-proof/side.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-craftsman3d-gate-capability-v1
          path: /tmp/craftsman-proof
          if-no-files-found: error
          retention-days: 30
