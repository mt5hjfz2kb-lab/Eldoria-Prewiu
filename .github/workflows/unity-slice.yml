name: Unity slice source and editor gate

on:
  push:
    branches: [main]
    paths:
      - 'Unity/**'
      - 'scripts/check_unity_slice.py'
      - '.github/workflows/unity-slice.yml'
  workflow_dispatch:

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tracked Unity source
        run: python3 scripts/check_unity_slice.py

  editor-tests-and-player:
    needs: source-preflight
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed Editor
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw "UNITY_EDITOR_PATH not found" }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch "6000\.3\.23f1") { throw "Wrong Unity version: $version" }
      - name: EditMode
        shell: powershell
        run: |
          & $env:UNITY_EDITOR_PATH -batchmode -nographics -quit -projectPath "$env:GITHUB_WORKSPACE/Unity" -runTests -testPlatform EditMode -testResults "$env:RUNNER_TEMP/Eldoria-EditMode.xml" -logFile "$env:RUNNER_TEMP/Eldoria-EditMode.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PlayMode
        shell: powershell
        run: |
          & $env:UNITY_EDITOR_PATH -batchmode -nographics -quit -projectPath "$env:GITHUB_WORKSPACE/Unity" -runTests -testPlatform PlayMode -testResults "$env:RUNNER_TEMP/Eldoria-PlayMode.xml" -logFile "$env:RUNNER_TEMP/Eldoria-PlayMode.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows desktop build
        shell: powershell
        run: |
          & $env:UNITY_EDITOR_PATH -batchmode -nographics -quit -projectPath "$env:GITHUB_WORKSPACE/Unity" -executeMethod Eldoria.EditorTools.SceneSetup.BuildWindows -logFile "$env:RUNNER_TEMP/Eldoria-Build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-unity-checks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Eldoria-*.xml
            ${{ runner.temp }}/Eldoria-*.log
            Unity/Builds/Windows/
          if-no-files-found: warn
