name: Unity slice source and editor gate
# runner-session validation checkpoint · progression/UI certification 2026-09-29
# canonical certification checkpoint after Bastion II and asset-bible updates · Bastion II

on:
  push:
    branches: [main]
    paths:
      - 'Unity/**'
      - '!Unity/Assets/Eldoria/Scripts/Editor/ValoriaLookDevCapture.cs'
      - '!Unity/Assets/Eldoria/Scripts/Editor/ValoriaVisualFormulaGate.cs'
      - 'scripts/check_unity_slice.py'
  workflow_dispatch:

concurrency:
  group: eldoria-unity-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    outputs:
      heavy_required: ${{ steps.impact.outputs.heavy_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide whether Windows Unity gate is required
        id: impact
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "heavy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "heavy_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "$files"
          heavy=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              Unity/Assets/Eldoria/ArtTests/*|Unity/Assets/Eldoria/Scripts/Editor/*|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaProductionArtResetV1.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaProductionDensityLifeV1.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaReferenceConvergencePassV2.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaWorldFrameMountainTerrainV1.cs|Unity/Assets/Eldoria/Scripts/Presentation/ProductionVisualIntegration.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaFullFrame*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaCameraBackdrop*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaOpenValley*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaPanoramicSkyCandidate*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaDistantWorldComposite*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaGroundMaterialHarmonization*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ValoriaBenchmarkComposite*.cs|Unity/Assets/Eldoria/Scripts/Presentation/ReferenceUiArtPass.cs|Unity/Assets/Eldoria/Scripts/Presentation/SliceBoot.cs|Unity/Assets/Eldoria/Scripts/Presentation/SlicePresenter.cs|Unity/Assets/Eldoria/Tests/PlayMode/ReferenceUiArtPassTests.cs|Unity/Assets/Eldoria/Tests/PlayMode/SliceSceneSmokeTests.cs|Unity/Assets/Eldoria/Tests/EditMode/CameraGestureTests.cs|Unity/Assets/Eldoria/Tests/EditMode/CameraGestureTests.cs.meta)
                # Dedicated visual/progression gates own these editor/reset-only changes; avoid duplicating the heavy Windows job.
                # Dedicated UI Progression Certification owns these UI-only changes.
                continue
                ;;
              Unity/*)
                heavy=true
                break
                ;;
            esac
          done <<< "$files"
          echo "heavy_required=$heavy" >> "$GITHUB_OUTPUT"
      - name: Verify tracked Unity source
        run: python3 scripts/check_unity_slice.py

  editor-tests-and-player:
    needs: source-preflight
    if: vars.UNITY_RUNNER_READY == 'true' && needs.source-preflight.outputs.heavy_required == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $candidates = @(
              "${env:ProgramFiles}\Git\cmd\git.exe",
              "${env:ProgramFiles}\Git\bin\git.exe",
              "${env:LOCALAPPDATA}\Programs\Git\cmd\git.exe"
            )
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            if (Test-Path $desktop) {
              $candidates += Get-ChildItem $desktop -Directory -Filter 'app-*' |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' }
            }
            $gitPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $gitPath) { throw 'Git not found. Install Git for Windows or GitHub Desktop for the runner user.' }
            $gitDirectory = Split-Path $gitPath
            Add-Content -Path $env:GITHUB_PATH -Value $gitDirectory
            $env:PATH = "$gitDirectory;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
        with:
          # The default clean -ffdx also deletes the native workflow's nested checkouts.
          # Keep their own checkout lifecycle and Unity's validated import cache intact.
          clean: false
      - name: Restore exact source while preserving isolated Unity caches
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $expectedCommit = $env:GITHUB_SHA
          if ($expectedCommit -notmatch '^[0-9a-fA-F]{40}$') { throw 'Expected workflow commit is not a full Git SHA.' }
          & git reset --hard $expectedCommit
          if ($LASTEXITCODE -ne 0) { throw 'Could not restore tracked source to the workflow commit.' }
          & git clean -ffdx -e '/Unity/Library/' -e '/valoria-layered-source/' -e '/valoria-clean-live-main/'
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove stale untracked source and build output.' }
          # A Windows CI run (39266054859) proved Unity/Assets can be absent here despite
          # checkout/reset claiming success. Repair only exact tracked project files, never
          # regenerate art or overwrite the independent native-checkout/Unity Library.
          $gitRoot = (& git rev-parse --show-toplevel).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the actual Git checkout root.' }
          $gitRootCanonical = [System.IO.Path]::GetFullPath($gitRoot)
          $workspaceCanonical = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($gitRootCanonical -ine $workspaceCanonical) {
            throw "UNITY_CHECKOUT_ROOT_MISMATCH: actual=$gitRootCanonical expected=$workspaceCanonical"
          }
          $paths = @('Unity/Assets','Unity/Packages/manifest.json','Unity/ProjectSettings/ProjectVersion.txt')
          $missing = @($paths | Where-Object { -not (Test-Path -LiteralPath (Join-Path $workspaceCanonical $_)) })
          if ($missing.Count) {
            Write-Warning "UNITY_TRACKED_SOURCE_MISSING: $($missing -join ', '); recovering exact HEAD paths without touching Library or native checkouts."
            $indexed = @(& git -C $workspaceCanonical ls-tree -r --full-tree --name-only $expectedCommit -- Unity/Assets Unity/Packages Unity/ProjectSettings)
            # Consume all native output: Select-Object -First can close the pipe and
            # make Git exit nonzero even though the exact source exists.
            Write-Host "UNITY_TRACKED_SOURCE_COUNT=$($indexed.Count) gitExit=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0 -or -not $indexed.Count) { throw 'Git commit has no Unity source to restore; refuse fabricated project.' }
            & git checkout --ignore-skip-worktree-bits $expectedCommit -- Unity/Assets Unity/Packages Unity/ProjectSettings
            if ($LASTEXITCODE -ne 0) { throw 'Tracked Unity source recovery from exact HEAD failed.' }
            foreach ($required in $paths) {
              if (-not (Test-Path -LiteralPath (Join-Path $workspaceCanonical $required))) {
                throw "UNITY_TRACKED_SOURCE_STILL_MISSING_AFTER_RESTORE: $required"
              }
            }
            Write-Host 'UNITY_EXACT_TRACKED_SOURCE_RECOVERED'
          }
          $actualCommit = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the restored Git HEAD.' }
          if ($actualCommit.Trim() -ne $expectedCommit) { throw "Checkout SHA mismatch: $actualCommit" }
          & git diff --quiet HEAD -- .
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs from the expected workflow commit after cleanup.' }
          Write-Host "Source restored to $expectedCommit; only Unity/Library and the two separately managed native checkouts are excluded from cleanup."
      - name: Stage owner-supplied optimized Bastion from runner Downloads if present
        if: github.event_name == 'workflow_dispatch'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $target = "$env:GITHUB_WORKSPACE/Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/Bastion_Optimized_v1.glb"
          $expected = '1ba4ef4daa352265116e672dfb84d5bbe26a0bd22262a2955d94cd4682862521'
          if (Test-Path $target) {
            if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Committed Bastion GLB SHA-256 mismatch." }
            Write-Host 'Optimized Bastion is in the checkout.'
          } else {
            $downloads = Join-Path $env:USERPROFILE 'Downloads'
            $names = @('Bastion_Unity_Import_Package(1).zip','Bastion_Unity_Import_Package.zip')
            foreach ($name in $names) {
              $candidate = Join-Path $downloads $name
              if (-not (Test-Path $candidate)) { continue }
              $temp = Join-Path $env:RUNNER_TEMP 'Eldoria-BastionOptimized'
              Expand-Archive -LiteralPath $candidate -DestinationPath $temp -Force
              $inside = Join-Path $temp 'Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/Bastion_Optimized_v1.glb'
              if (-not (Test-Path $inside)) { throw "Supplied ZIP has no optimized GLB at the documented path." }
              if ((Get-FileHash $inside -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Supplied optimized GLB SHA-256 mismatch." }
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $inside $target
              Write-Host 'Verified optimized Bastion staged from Downloads; source GLB was not used.'
              break
            }
          }
          if (Test-Path $target) { 'BASTION_GLB_PRESENT=true' | Out-File -FilePath $env:GITHUB_ENV -Append }
          else { Write-Host 'Optimized GLB not present on runner; Unity image-to-3D review will be skipped.' }
      - name: Stage owner-supplied Tripo small module from runner Downloads if present
        if: github.event_name == 'workflow_dispatch'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $target = "$env:GITHUB_WORKSPACE/Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/Eldoria_Module_TowerWallRock_50K.glb"
          $expected = '18785f7ba607cef1e7dcee45684d65c3166dc47b0f73b4bc4fb3d295c6f53a6a'
          if (-not (Test-Path $target)) {
            $downloads = Join-Path $env:USERPROFILE 'Downloads'
            foreach ($name in @('Eldoria_Module_TowerWallRock_50K.glb')) {
              $candidate = Join-Path $downloads $name
              if (-not (Test-Path $candidate)) { continue }
              if ((Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { continue }
              New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
              Copy-Item $candidate $target
              Write-Host "Verified Tripo module staged from Downloads: $name"
              break
            }
          }
          if (Test-Path $target) {
            if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Tripo module SHA-256 mismatch.' }
            'TRIPO_MODULE_PRESENT=true' | Out-File -FilePath $env:GITHUB_ENV -Append
          } else { Write-Host 'Tripo module not present on runner; isolated small-module review will be skipped.' }
      - name: Fetch official CC0 asset gate models
        if: github.event_name == 'workflow_dispatch'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/fetch-valoria-art-gate.ps1"
      - name: Verify installed Editor
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw "UNITY_EDITOR_PATH not found" }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch "6000\.3\.23f1") { throw "Wrong Unity version: $version" }
      - name: Audit mobile build prerequisites
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $editor = $env:UNITY_EDITOR_PATH
          $editorDir = Split-Path $editor
          $dataDir = Join-Path $editorDir 'Data'
          $androidRoot = Join-Path $dataDir 'PlaybackEngines\AndroidPlayer'
          $sdk = Join-Path $androidRoot 'SDK'
          $ndk = Join-Path $androidRoot 'NDK'
          $jdk = Join-Path $androidRoot 'OpenJDK'
          $adbBundled = Join-Path $sdk 'platform-tools\adb.exe'
          $adbCommand = Get-Command adb.exe -ErrorAction SilentlyContinue
          if (Test-Path $adbBundled) { $adb = $adbBundled }
          elseif ($adbCommand) { $adb = $adbCommand.Source }
          else { $adb = $null }

          $devices = @()
          $connected = $null
          $adbProbeStatus = 'NOT_AVAILABLE'
          $adbExitCode = $null
          $adbStdout = ''
          $adbStderr = ''
          if ($adb) {
            $adbStdoutPath = Join-Path $env:RUNNER_TEMP 'Eldoria-MobilePrerequisites-adb.stdout.log'
            $adbStderrPath = Join-Path $env:RUNNER_TEMP 'Eldoria-MobilePrerequisites-adb.stderr.log'
            # This is an availability audit, not the physical-device certification gate.
            # Start-Process keeps the probe's exit code out of Actions' LASTEXITCODE epilogue.
            # Launch, timeout and evidence-writing failures still fail this step explicitly.
            $adbProcess = Start-Process -FilePath $adb -ArgumentList 'devices', '-l' -NoNewWindow -PassThru -RedirectStandardOutput $adbStdoutPath -RedirectStandardError $adbStderrPath -ErrorAction Stop
            # Retain the process handle before waiting: Windows PowerShell can otherwise
            # lose ExitCode with redirected Start-Process (PowerShell/PowerShell#5421).
            $adbProcessHandle = $adbProcess.Handle
            if (-not $adbProcess.WaitForExit(15000)) {
              Stop-Process -Id $adbProcess.Id -Force -ErrorAction Stop
              throw 'ADB availability probe timed out after 15 seconds; physical-device state is unknown.'
            }
            $adbExitCode = $adbProcess.ExitCode
            $adbStdout = [string](Get-Content -LiteralPath $adbStdoutPath -Raw -ErrorAction Stop)
            $adbStderr = [string](Get-Content -LiteralPath $adbStderrPath -Raw -ErrorAction Stop)
            if ($adbExitCode -eq 0) {
              $adbProbeStatus = 'SUCCESS'
              $devices = @($adbStdout -split '\r?\n' |
                Where-Object { $_ -match '^\S+\s+(device|offline|unauthorized)\b' } |
                ForEach-Object { $_.Trim() })
              $connected = @($devices | Where-Object {
                $_ -match '^\S+\s+device(?:\s|$)' -and $_ -notmatch '^emulator-\d+\s'
              }).Count -gt 0
            } else {
              $adbProbeStatus = 'ERROR'
            }
          }
          $audit = [ordered]@{
            unity_editor = $editor
            android_build_support = (Test-Path $androidRoot)
            android_player_path = $androidRoot
            sdk_present = (Test-Path $sdk)
            ndk_present = (Test-Path $ndk)
            jdk_present = (Test-Path $jdk)
            adb_path = $adb
            adb_probe_status = $adbProbeStatus
            adb_exit_code = $adbExitCode
            adb_stdout = $adbStdout
            adb_stderr = $adbStderr
            adb_devices = @($devices)
            physical_device_connected = $connected
            physical_device_tested = $false
          }
          $json = $audit | ConvertTo-Json -Depth 4
          $json
          $json | Set-Content "$env:RUNNER_TEMP/Eldoria-MobilePrerequisites.json" -Encoding UTF8
          if (-not $audit.android_build_support) {
            Write-Warning 'Unity Android Build Support is not installed on this runner; physical-phone profiling cannot start from CI yet.'
          } elseif (-not ($audit.sdk_present -and $audit.ndk_present -and $audit.jdk_present)) {
            Write-Warning 'Unity Android SDK, NDK or JDK is missing; mobile build prerequisites are incomplete.'
          } elseif ($audit.adb_probe_status -ne 'SUCCESS') {
            Write-Warning "ADB availability probe $($audit.adb_probe_status) (exit code: $($audit.adb_exit_code)); device state is unknown. See the mobile prerequisites audit for stdout/stderr. Physical-device testing remains unverified."
          } elseif (-not $audit.physical_device_connected) {
            Write-Warning 'Android Build Support is present, but no authorized physical ADB device is connected.'
          } else {
            Write-Host 'MOBILE_PROFILE_READY=true'
          }

      - name: Audit original-art tools on Windows runner
        if: github.event_name == 'workflow_dispatch'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          foreach ($name in @('blender.exe','python.exe','openscad.exe')) {
            $found = Get-Command $name -ErrorAction SilentlyContinue
            if ($found) { Write-Host "ART_TOOL $name $($found.Source)" }
            else { Write-Host "ART_TOOL $name NOT_IN_PATH" }
          }
          $root = Join-Path ${env:ProgramFiles} 'Blender Foundation'
          if (Test-Path $root) {
            Get-ChildItem $root -Filter blender.exe -Recurse -File -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName | ForEach-Object { Write-Host "ART_TOOL blender_installed $_" }
          }
      - name: EditMode
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          # Diagnose the actual Windows checkout/project identity before Unity starts.
          # Previous runs rejected both the absolute and cwd-relative project path.
          $project = Join-Path $env:GITHUB_WORKSPACE 'Unity'
          $project = [System.IO.Path]::GetFullPath($project)
          foreach ($required in @('Assets','Packages/manifest.json','ProjectSettings/ProjectVersion.txt')) {
            $requiredPath = Join-Path $project $required
            if (-not (Test-Path -LiteralPath $requiredPath)) { throw "UNITY_PROJECT_SOURCE_MISSING: $requiredPath" }
          }
          $tempFolder = Join-Path $project 'Temp'
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null
          $probePath = Join-Path $tempFolder 'eldoria-ci-write-probe.txt'
          try { 'project-writable' | Set-Content -LiteralPath $probePath -Encoding ASCII }
          finally { Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue }
          $unityProcesses = @(Get-Process Unity -ErrorAction SilentlyContinue)
          if ($unityProcesses.Count) { throw "SHARED_UNITY_BUSY: $($unityProcesses.Count) other editor process(es) detected; do not interfere" }
          Write-Host "UNITY_PROJECT_PREFLIGHT_OK project=$project projectVersion=$((Get-Content (Join-Path $project 'ProjectSettings/ProjectVersion.txt') -TotalCount 1))"
          $xml = "$env:RUNNER_TEMP/Eldoria-EditMode.xml"
          $log = "$env:RUNNER_TEMP/Eldoria-EditMode.log"
          Remove-Item $xml,$log -Force -ErrorAction SilentlyContinue
          $args = @("-batchmode","-nographics","-projectPath",('"' + (Join-Path $env:GITHUB_WORKSPACE 'Unity') + '"'),"-runTests","-testPlatform","EditMode","-testResults",$xml,"-logFile",$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
          if (-not $process.WaitForExit(600000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw "Unity EditMode timed out after 10 minutes."
          }
          if ($process.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log -Tail 160 }; throw "Unity EditMode process failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path $xml)) { if (Test-Path $log) { Get-Content $log -Tail 160 }; throw "EditMode results were not produced." }
          [xml]$results = Get-Content $xml
          # A successful XML from Unity's last-opened project is not this checkout.
          $expectedAssemblyRoot = ([IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'Unity/Library/ScriptAssemblies'))).Replace([char]92, [char]47).TrimEnd('/') + '/'
          $assemblies = @($results.SelectNodes("//test-suite[@type='Assembly']"))
          if (-not $assemblies.Count) { throw 'No test assemblies in result; cannot verify project identity.' }
          foreach ($assembly in $assemblies) {
            $actualAssembly = ([string]$assembly.fullname).Replace([char]92, [char]47)
            if (-not $actualAssembly.StartsWith($expectedAssemblyRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "UNITY_TEST_WRONG_PROJECT: $actualAssembly expected beneath $expectedAssemblyRoot"
            }
          }

          if ($results.'test-run'.result -ne "Passed") { throw "EditMode tests did not pass: $($results.'test-run'.result)" }
      - name: PlayMode
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $xml = "$env:RUNNER_TEMP/Eldoria-PlayMode.xml"
          $log = "$env:RUNNER_TEMP/Eldoria-PlayMode.log"
          Remove-Item $xml,$log -Force -ErrorAction SilentlyContinue
          $args = @("-batchmode","-nographics","-projectPath",('"' + (Join-Path $env:GITHUB_WORKSPACE 'Unity') + '"'),"-runTests","-testPlatform","PlayMode","-testResults",$xml,"-logFile",$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
          if (-not $process.WaitForExit(600000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw "Unity PlayMode timed out after 10 minutes."
          }
          if ($process.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log -Tail 160 }; throw "Unity PlayMode process failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path $xml)) { if (Test-Path $log) { Get-Content $log -Tail 160 }; throw "PlayMode results were not produced." }
          [xml]$results = Get-Content $xml
          # A successful XML from Unity's last-opened project is not this checkout.
          $expectedAssemblyRoot = ([IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'Unity/Library/ScriptAssemblies'))).Replace([char]92, [char]47).TrimEnd('/') + '/'
          $assemblies = @($results.SelectNodes("//test-suite[@type='Assembly']"))
          if (-not $assemblies.Count) { throw 'No test assemblies in result; cannot verify project identity.' }
          foreach ($assembly in $assemblies) {
            $actualAssembly = ([string]$assembly.fullname).Replace([char]92, [char]47)
            if (-not $actualAssembly.StartsWith($expectedAssemblyRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "UNITY_TEST_WRONG_PROJECT: $actualAssembly expected beneath $expectedAssemblyRoot"
            }
          }

          if ($results.'test-run'.result -ne "Passed") { throw "PlayMode tests did not pass: $($results.'test-run'.result)" }
      - name: Windows desktop build
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $log = "$env:RUNNER_TEMP/Eldoria-Build.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:GITHUB_WORKSPACE/Unity/Builds/Windows" -Recurse -Force -ErrorAction SilentlyContinue
          $args = @("-batchmode","-nographics","-quit","-projectPath",('"' + (Join-Path $env:GITHUB_WORKSPACE 'Unity') + '"'),"-executeMethod","Eldoria.EditorTools.SceneSetup.BuildWindows","-logFile",$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
          if (-not $process.WaitForExit(600000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw "Unity Windows desktop build timed out after 10 minutes."
          }
          if ($process.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log -Tail 200 }; throw "Unity Windows build process failed with exit code $($process.ExitCode)." }
          $player = "$env:GITHUB_WORKSPACE/Unity/Builds/Windows/Eldoria.exe"
          if (-not (Test-Path $player)) { if (Test-Path $log) { Get-Content $log -Tail 200 }; throw "Windows player was not produced." }
          $playerDll = "$env:GITHUB_WORKSPACE/Unity/Builds/Windows/UnityPlayer.dll"
          $dataDir = "$env:GITHUB_WORKSPACE/Unity/Builds/Windows/Eldoria_Data"
          if (-not (Test-Path $playerDll)) { throw "UnityPlayer.dll was not produced." }
          if (-not (Test-Path $dataDir)) { throw "Eldoria_Data was not produced." }
          # Keep QA_FAST as the default executable. OWNER_I_II is an explicit opt-in launch
          # using the same binary and its own profile-scoped save.
          $ownerLauncher = "$env:GITHUB_WORKSPACE/Unity/Builds/Windows/PLAY_OWNER_I_II_CANDIDATE.bat"
          $ownerLauncherText = "@echo off`r`ncd /d `"%~dp0`"`r`nEldoria.exe --eldoria-profile=OWNER_I_II`r`n"
          Set-Content -Path $ownerLauncher -Value $ownerLauncherText -Encoding ASCII
          if (-not (Test-Path $ownerLauncher)) { throw "Owner I-II launcher was not produced." }
      - name: Render Valoria art benchmark
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $folder = "$env:GITHUB_WORKSPACE/Unity/BenchmarkCaptures"
          $log = "$env:RUNNER_TEMP/Eldoria-BenchmarkCapture.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $log -Force -ErrorAction SilentlyContinue
