name: Eldoria reclaim verified regenerated Unity caches only
on:
  push:
    branches: [maintenance/eldoria-runner-disk-audit-20261114]
    paths: [.github/workflows/eldoria-runner-cache-cleanup.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-breachwatch-native-first-screen
  cancel-in-progress: false
jobs:
  clean:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 15
    steps:
      - name: Delete ONLY verified completed-run Unity Library import caches
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $root='C:\actions-runner-eldoria\_work\Eldoria-Prewiu\Eldoria-Prewiu'
          $gib=[double](1024*1024*1024)
          $drive=[IO.DriveInfo]::new('C')
          Write-Host ("ELDORIA_SAFE_CACHE_CLEAN_BEGIN freeGiB={0:N3}" -f ($drive.AvailableFreeSpace/$gib))
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'REFUSE: Unity or Blender still running'}
          $gitExe=(Get-Command git.exe -ErrorAction SilentlyContinue).Source
          if(-not $gitExe){
            $gitExe=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources/app/git/cmd/git.exe' } |
              Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if(-not $gitExe){throw 'REFUSE: Git unavailable'}
          # Source, .meta, ProjectSettings, Git objects, outputs and capture files stay untouched.
          # ONLY Unity/Library (regenerable import cache) of these completed runs may be removed.
          $targets=@(
            @{name='beta-structural-source-42505611257-1';run=42505611257;sha='38ba780d3311315914f9e39500c7e1f68ac81703'}
            @{name='breachwatch-native-source-43465479546-1';run=43465479546;sha='bf2cc865722aee8b8ec08c01507361570f1227cd'}
            @{name='breachwatch-native-source-43469529824-1';run=43469529824;sha='ec4d664e8765a4ee3d97f71f075820b10f04f449'}
            @{name='breachwatch-native-source-43481923633-1';run=43481923633;sha='008498e6dfc34c67f9f6d52defcf5f7c60634811'}
            @{name='breachwatch-native-source-43483165131-1';run=43483165131;sha='4718c12295b66da54ead69fc71a6fa392d3cc83e'}
            @{name='breachwatch-native-source-43489752868-1';run=43489752868;sha='90465a9a910b89a8a8b74e4b33a9bbc88578e00e'}
            @{name='forja-thin-native-source-42404744384';run=42404744384;sha='4d838a69f7db40232c9c9516e9a0ec109f009e2f'}
            @{name='forja-thin-native-source-42408083695';run=42408083695;sha='ef61b5082ddcc24e8dff4b3b35a21522ca7d78da'}
          )
          $headers=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json';'User-Agent'='Eldoria-safe-cache-recovery'}
          $eligible=@()
          foreach($t in $targets){
            if($t.name -notmatch '^(breachwatch-native-source|beta-structural-source|forja-thin-native-source)-[0-9]{11}(-[0-9]+)?$'){
              throw 'REFUSE: unrecognized isolated source name'
            }
            $d=Join-Path $root $t.name
            $lib=Join-Path $d 'Unity\Library'
            if(-not(Test-Path -LiteralPath $lib -PathType Container)){
              Write-Host ("ELDORIA_CACHE_ALREADY_ABSENT run={0}" -f $t.run)
              continue
            }
            foreach($p in @($root,$d,(Join-Path $d 'Unity'),$lib)){
              $info=Get-Item -LiteralPath $p -Force -ErrorAction Stop
              if(-not $info.PSIsContainer -or ($info.Attributes -band [IO.FileAttributes]::ReparsePoint)){
                throw 'REFUSE: unexpected directory or redirection'
              }
            }
            if(-not(Test-Path -LiteralPath (Join-Path $d '.git')) -or
               -not(Test-Path -LiteralPath (Join-Path $d 'Unity\Assets')) -or
               -not(Test-Path -LiteralPath (Join-Path $d 'Unity\ProjectSettings'))){
              Write-Host ("ELDORIA_CACHE_SKIP_NO_SOURCE run={0}" -f $t.run)
              continue
            }
            $remote=(& $gitExe -C $d remote get-url origin).Trim()
            $head=(& $gitExe -C $d rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $head -ne $t.sha -or
               $remote -notin @('https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu','https://github.com/mt5hjfz2kb-lab/Eldoria-Prewiu.git')){
              Write-Host ("ELDORIA_CACHE_SKIP_GIT_ID_MISMATCH run={0}" -f $t.run)
              continue
            }
            $tracked=@(& $gitExe -C $d ls-files -- 'Unity/Library')
            if($LASTEXITCODE -ne 0 -or $tracked.Count -gt 0){
              Write-Host ("ELDORIA_CACHE_SKIP_TRACKED_DATA run={0}" -f $t.run)
              continue
            }
            $run=Invoke-RestMethod -Uri ("https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/runs/"+$t.run) -Headers $headers -ErrorAction Stop
            if($run.status -ne 'completed' -or $run.head_sha -ne $t.sha){
              Write-Host ("ELDORIA_CACHE_SKIP_UNVERIFIED_RUN run={0}" -f $t.run)
              continue
            }
            $redirect=Get-ChildItem -LiteralPath $lib -Recurse -Force -ErrorAction Stop |
              Where-Object {$_.Attributes -band [IO.FileAttributes]::ReparsePoint} |
              Select-Object -First 1
            if($redirect){
              Write-Host ("ELDORIA_CACHE_SKIP_LINKED_CACHE run={0}" -f $t.run)
              continue
            }
            $eligible+=@{run=$t.run;lib=$lib}
            Write-Host ("ELDORIA_CACHE_PROVENANCE_VERIFIED run={0}" -f $t.run)
          }
          Write-Host ("ELDORIA_CACHE_VERIFIED_TARGETS count={0}" -f @($eligible).Count)
          $empty=Join-Path $env:RUNNER_TEMP ('eldoria-cache-empty-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $empty){throw 'REFUSE: mirror directory already exists'}
          New-Item -ItemType Directory -Path $empty -ErrorAction Stop | Out-Null
          [double]$startFree=$drive.AvailableFreeSpace
          foreach($item in $eligible){
            if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){
              throw 'REFUSE: Unity or Blender started during cleanup'
            }
            [double]$before=$drive.AvailableFreeSpace
            & robocopy.exe $empty $item.lib /MIR /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP | Out-Null
            $rc=$LASTEXITCODE
            if($rc -gt 7){throw ("REFUSE: robocopy failed run={0} rc={1}" -f $item.run,$rc)}
            if(@(Get-ChildItem -LiteralPath $item.lib -Force -ErrorAction Stop | Select-Object -First 1).Count -gt 0){
              throw ("REFUSE: unexpected remaining data run={0}" -f $item.run)
            }
            Remove-Item -LiteralPath $item.lib -Force -ErrorAction Stop
            Write-Host ("ELDORIA_CACHE_CLEANED run={0} freedGiB={1:N3} sourceUnchanged=true" -f $item.run,(($drive.AvailableFreeSpace-$before)/$gib))
          }
          Remove-Item -LiteralPath $empty -Force -ErrorAction Stop
          Write-Host ("ELDORIA_SAFE_CACHE_CLEAN_END beforeGiB={0:N3} afterGiB={1:N3} freedGiB={2:N3} assetsDeleted=false" -f ($startFree/$gib),($drive.AvailableFreeSpace/$gib),(($drive.AvailableFreeSpace-$startFree)/$gib))
          exit 0
