name: "[PROOF] Valoria Camera-First Reset Target Unity Shell v1"

on:
  workflow_dispatch:

# Historical R&D: manual-only after Semantic 2.5D final rejection (2026-10-06).
concurrency:
  group: valoria-camera-first-reset-target-unity-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }

      - uses: actions/checkout@v4
        with:
          ref: main
          clean: false
          fetch-depth: 2

      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings

      - name: Verify exact canonical layer inputs
        shell: powershell
        run: |
          $base="art-source\valoria\lookdev\golden-slice-v1\camera-first-reset-target-v1"
          0..3 | ForEach-Object {
            $p=Join-Path $base ("layer-"+$_+".png")
            if(-not (Test-Path $p)){throw "Missing $p"}
          }

      - name: Capture isolated reset-target Unity shell proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaCameraFirstResetTargetShellGateV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaCameraFirstResetTargetShellGateV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaCameraFirstResetTargetShellGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(32)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Reset-target Unity shell proof timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "Reset-target Unity shell proof failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-camera-first-reset-target-unity-shell-v1
          path: Unity/ValoriaCameraFirstResetTargetShellGateV1Captures/*
          if-no-files-found: warn
          retention-days: 30
