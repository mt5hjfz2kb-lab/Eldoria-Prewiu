name: Ciudad2D visual masters — immutable SHA and pilot honesty
on:
  push:
    branches:
      - art/ciudad-2d-hitos-1-5-20261116
    paths:
      - 'Unity/Assets/Experimentos/Ciudad2D/ArtBible/**'
      - '.github/workflows/ciudad2d-visual-bible.yml'
      - 'Unity/Assets/Experimentos/Ciudad2D/QA/validate_ambient_life.py'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DStateBridge.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DTorchPulse.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/Editor/City2DAmbientNativeEvidence.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/QA/ambient_life_v1.json'
      - 'Unity/Assets/Experimentos/Ciudad2D/QA/ambient_art_manifest_v1.json'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/City2DAmbientMotion.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/Scripts/Editor/City2DAmbientSceneFactory.cs'
      - 'Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_*.png'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            Unity/Assets/Experimentos/Ciudad2D/ArtBible
            Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props
            Unity/Assets/Experimentos/Ciudad2D/Scripts
            Unity/Assets/Experimentos/Ciudad2D/QA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Check six approved visual references and incomplete three-candidate gate
        run: python Unity/Assets/Experimentos/Ciudad2D/ArtBible/QA/validate_art_bible.py
      - name: Smoke-test real RGBA normalization without mutating approved masters
        run: |
          python Unity/Assets/Experimentos/Ciudad2D/ArtBible/QA/preprocess_candidate.py \
            --source Unity/Assets/Experimentos/Ciudad2D/ArtBible/Masters/Bastion_V_MASTER.png \
            --asset-id immutable-master-smoke \
            --out-dir /tmp/valoria-normalize-smoke \
            --task-id QA_SOURCE_NOT_NEW_ART
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('Unity/Assets/Experimentos/Ciudad2D/ArtBible/Masters')
          data=json.loads((pathlib.Path('/tmp/valoria-normalize-smoke')/'immutable-master-smoke_MANIFEST.json').read_text())
          assert data['status']=='QUARANTINED_NOT_APPROVED'
          assert data['source_sha256']==hashlib.sha256((root/'Bastion_V_MASTER.png').read_bytes()).hexdigest()
          assert (pathlib.Path('/tmp/valoria-normalize-smoke')/'immutable-master-smoke_RGBA.png').is_file()
          print('ALPHA_FOOT_PIPELINE_TECH_SMOKE_PASS_NOT_NEW_ART')
          PY
      - name: Check actual three candidate originals, RGBA and SHA without claiming art acceptance
        run: python Unity/Assets/Experimentos/Ciudad2D/ArtBible/QA/validate_three_candidates.py
      - name: Verify frozen Forge V3 and independent contact shadow bytes
        run: python Unity/Assets/Experimentos/Ciudad2D/ArtBible/QA/validate_forja_v3.py
      - name: 'Ensure true Bastion I-V art status — five native milestones, only two unique masters'
        run: python Unity/Assets/Experimentos/Ciudad2D/ArtBible/QA/validate_bastion_stages.py
      - name: Validate living city stage policy, archived smoke sources and 10 visual-only effects
        run: python Unity/Assets/Experimentos/Ciudad2D/QA/validate_ambient_life.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-visual-bible-manifest-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/ArtBible/master_manifest_v1.json
            Unity/Assets/Experimentos/Ciudad2D/ArtBible/pilot_three_buildings.json
          if-no-files-found: error
          retention-days: 14
