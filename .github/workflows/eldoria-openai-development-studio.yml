name: Eldoria OpenAI Development Studio - isolated pilot
on:
  push:
    branches: [pilot/eldoria-openai-development-studio-20261125]
    paths:
      - 'tools/openai-development-studio/**'
      - '.github/workflows/eldoria-openai-development-studio.yml'
  workflow_dispatch:
    inputs:
      live_smoke:
        description: 'Authorize exactly one low-cost OpenAI API request'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: eldoria-openai-development-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - run: python3 tools/openai-development-studio/studio.py --self-test
      - run: python3 tools/openai-development-studio/generate_candidate.py --self-test
      - run: python3 tools/openai-development-studio/mission.py --self-test
      - run: python3 tools/openai-development-studio/budget_guard.py --self-test
      - run: python3 tools/openai-development-studio/mission_packet.py --self-test
      - run: python3 tools/openai-development-studio/shader_candidate.py --self-test
      - run: python3 tools/openai-development-studio/request_gate.py --self-test
      - run: python3 tools/openai-development-studio/native_request_gate.py --self-test
      - run: python3 tools/openai-development-studio/test_economics_v2.py
      - name: Rebuild durable economic and productivity dashboard
        run: python3 tools/openai-development-studio/productivity.py dashboard --root tools/openai-development-studio --decisions tools/openai-development-studio/quality-decisions.json --out /tmp/studio-dashboard.json
      - uses: actions/upload-artifact@v4
        with:
          name: studio-economic-dashboard
          path: /tmp/studio-dashboard.json
          retention-days: 90
          if-no-files-found: error
      - run: python3 -m py_compile tools/openai-development-studio/prepare_evidence.py tools/openai-development-studio/validate_sprite.py tools/openai-development-studio/blender_candidate.py
      - run: python3 tools/openai-development-studio/studio.py smoke --out /tmp/eldoria-api-dry.json
  smoke:
    # Connectivity proved. No further paid calls through this legacy smoke job.
    if: ${{ false }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Single opt-in API request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/openai-development-studio/studio.py smoke --live --out /tmp/eldoria-api-proof.json
      - name: Safe connectivity proof only
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-openai-smoke-${{ github.run_id }}
          path: /tmp/eldoria-api-proof.json
          retention-days: 7
          if-no-files-found: error
