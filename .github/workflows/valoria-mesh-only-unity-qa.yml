name: Valoria mesh-only Unity visual QA (isolated diagnostic)
on:
  workflow_dispatch:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths: [pipeline/valoria-mesh-only-unity-qa-request.json]
permissions:
  contents: read
jobs:
  unity-mesh-only-qa:
    # Owner-authorized isolated diagnostic only; the runner lease is checked before Unity.
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell
        run: |
          $git = Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop/app-*/resources/app/git/cmd/git.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($git) { Split-Path $git.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - uses: actions/checkout@v4
      - name: Verify explicit diagnostic request and global runner lease
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $request = Get-Content "$env:GITHUB_WORKSPACE/pipeline/valoria-mesh-only-unity-qa-request.json" -Raw | ConvertFrom-Json
          if (-not $request.enabled -or -not $request.diagnostic_only) { throw "Explicit isolated diagnostic request missing" }
          if ($env:GITHUB_REF -ne "refs/heads/prototype/valoria-bastion1-no-sharp-20261010") { throw "Isolated branch required" }
          $hash = & git rev-parse "HEAD:Unity/Assets/Eldoria/ProductionSlice/Experimental/ValoriaMeshOnlyWorld.glb"
          if ($LASTEXITCODE -ne 0 -or $hash.Trim() -ne $request.source_glb_blob_sha) { throw "GLB differs from inspected source" }
          $headers = @{ Authorization="Bearer $env:GITHUB_TOKEN"; Accept="application/vnd.github+json" }
          $response = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/contents/pipeline/active-workstreams.json?ref=main"
          $global = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($response.content)) | ConvertFrom-Json
          $holders = @($global.active | Where-Object { $_.resources -contains "windows-self-hosted-unity-6000-3-23f1" })
          if ($holders.Count -ne 1 -or $holders[0].id -ne $request.workstream -or $holders[0].owner -ne $request.owner) { throw "Global runner lease changed" }
          Write-Host "EXPLICIT_ISOLATED_DIAGNOSTIC_PASS source=$hash no-promotion=true"
      - name: Verify Unity 6000.3.23f1
        shell: powershell
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw "UNITY_EDITOR_PATH not found" }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch "6000\.3\.23f1") { throw "Wrong Unity version $version" }
      - name: Import worldspace GLB and render isolated production-camera proof
        shell: powershell
        run: |
          $log="$env:RUNNER_TEMP/mesh-only-unity.log"
          $argv=@("-batchmode","-quit","-projectPath","$env:GITHUB_WORKSPACE/Unity","-executeMethod","Eldoria.EditorTools.ValoriaMeshOnlyBastionOneProof.Create","-logFile",$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $argv -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Tail 130 }
          if ($p.ExitCode -ne 0) { throw "Unity failed exit $($p.ExitCode)" }
          $png="$env:GITHUB_WORKSPACE/Unity/ValoriaMeshOnlyProof/mesh-only-bastion-i-unity.png"
          $scene="$env:GITHUB_WORKSPACE/Unity/Assets/Eldoria/ProductionSlice/Experimental/ValoriaMeshOnlyBastionOne.unity"
          if (-not (Test-Path $png)) { throw "Missing actual Unity render" }
          if (-not (Test-Path $scene)) { throw "Missing actual Unity scene" }
          if ((Get-Item $png).Length -lt 15000) { throw "Unity render unexpectedly small" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-mesh-only-unity-evidence
          path: |
            Unity/ValoriaMeshOnlyProof/mesh-only-bastion-i-unity.png
            Unity/Assets/Eldoria/ProductionSlice/Experimental/ValoriaMeshOnlyBastionOne.unity
            ${{ runner.temp }}/mesh-only-unity.log
          retention-days: 14
