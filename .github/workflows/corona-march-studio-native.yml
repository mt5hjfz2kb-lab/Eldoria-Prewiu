name: Studio March targeted native A-B
on:
  push:
    branches: [candidate/corona-march-high-impact-studio-20261126]
    paths: ['.github/workflows/corona-march-studio-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  import-material:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == '19123a71e21e579dc0ad0425acdba713ed4aebd4' && github.event.head_commit.message == 'Studio: pin artist import and targeted native matched-state March evidence' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 12
    outputs:
      candidate_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/corona-march-high-impact-studio-20261126
          fetch-depth: 1
          sparse-checkout: |
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/CoronaBrecha
            docs/valoria-modular-25d
      - name: Import only exact independently reviewed studio asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45866050061" --jq .conclusion)" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45866050061/artifacts" --jq '.artifacts[] | select(.id==15140472209 and .expired==false) | .id' | grep -x 15140472209
          gh run download 45866050061 --repo "$GITHUB_REPOSITORY" --name corona-march-original-studio-art --dir /tmp/march-studio-art
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          p=pathlib.Path('/tmp/march-studio-art')
          data=json.loads((p/'artist.json').read_text());review=json.loads((p/'review.json').read_text())
          raw=(p/'command_table.png').read_bytes()
          assert data['image_sha256']==hashlib.sha256(raw).hexdigest()=='a42b20c2ca7bd57a8b09d95a7442ccc81bb33c9f23f2e1869112b10e4071cab7'
          assert review['verdict']=='accept'
          dest=pathlib.Path('Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/CoronaBrecha/march_command_table.png')
          assert not dest.exists() and dest.with_suffix('.png.meta').exists()
          dest.write_bytes(raw)
          PY
          git add 'Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/CoronaBrecha/march_command_table.png'
          test "$(git diff --cached --name-only)" = 'Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/UI/CoronaBrecha/march_command_table.png'
          git -c user.name='Eldoria Studio evidence' -c user.email='studio-evidence@users.noreply.github.com' commit -m 'Art: import verified original studio command-table material'
          git push origin HEAD:refs/heads/candidate/corona-march-high-impact-studio-20261126
      - id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native-march:
    needs: import-material
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    concurrency:
      group: eldoria-modular25d-exclusive-unity-native
      cancel-in-progress: false
    timeout-minutes: 65
    env:
      MARCH_STUDIO_SOURCE_SHA: ${{ needs.import-material.outputs.candidate_sha }}
    steps:
      - name: Recheck owner, Windows process safety and installed Unity
        shell: powershell
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          $ErrorActionPreference='Stop'
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/"
          $h=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json'}
          $meta=Invoke-RestMethod -Uri ($api+'contents/pipeline/active-workstreams.json?ref=main') -Headers $h
          $blob=Invoke-RestMethod -Uri ($api+'git/blobs/'+$meta.sha) -Headers $h
          if($blob.sha -ne $meta.sha){throw 'Registry changed unexpectedly'}
          $reg=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($blob.content -replace '\s',''))) | ConvertFrom-Json
          $held=@($reg.active|Where-Object{@($_.resources) -contains 'windows-runner-heavy'})
          $id='eldoria-valoria-modular25d-bastion1-20261119'
          if($held.Count -ne 1 -or $held[0].id -ne $id -or $held[0].ownership_revision -ne 16 -or
             $held[0].owner -ne 'chatgpt-corona-brecha-commercial-20261126' -or
             $reg.resource_rotation.current_workstream -ne $id){throw 'Lease not ours'}
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){
            throw 'Existing Windows native process: refuse interference'}
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){
            throw 'Unity editor executable unavailable'}
          # Do not clean another run's project, Unity cache or Library.
          if((Get-Item $env:RUNNER_TEMP).PSDrive.Free -lt 7GB){throw 'Insufficient scratch disk'}
          Write-Host 'SAFE_NATIVE_PC_AND_OWNER_PASS'
      - name: Restore GitHub Desktop Git to PATH for Unity Package Manager
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $paths=@(Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object{Test-Path $_})
            if(-not $paths.Count){throw 'No installed Git; do not download software'}
            $dir=Split-Path $paths[0]
            $env:PATH="$dir;$env:PATH"
          } else {$dir=Split-Path $git.Source}
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          git --version
      - name: Materialize source-pinned isolated Unity project without modifying main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('eldoria-march-studio-'+$env:GITHUB_RUN_ID)
          if(Test-Path $root){throw 'Refuse to overwrite existing scratch'}
          git init -q $root
          git -C $root remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $includes=@('/docs/evidence/valoria-layered-construction-20261016/playable-entry-v3/complete-playerstate-before-reset.json','/tools/valoria-modular25d/','/tools/bastion-iii/author-frontier.py',
           '/Unity/Assets/Experimentos/ValoriaModular25D/',
           '/Unity/Assets/Experimentos/ValoriaModular25D.meta','/Unity/Assets/Experimentos.meta',
           '/Unity/Assets/Eldoria/','/Unity/Assets/Eldoria.meta',
           '/Unity/Assets/EmaceArt/Slavic World Free/Meshes/','/Unity/Assets/EmaceArt/Slavic World Free/Materials/',
           '/Unity/Assets/EmaceArt/Slavic World Free/Texture/','/Unity/Assets/EmaceArt/Slavic World Free/URP_Support/','/Unity/Assets/EmaceArt/Slavic World Free/Prefabs/Village/Building/Shed/',
           '/Unity/Assets/Holotna/','/Unity/Assets/Holotna.meta','/Unity/Assets/StreamingAssets/','/Unity/Assets/StreamingAssets.meta',
           '/Unity/Assets/Plugins/','/Unity/Assets/Plugins.meta',
           '/Unity/Assets/DefaultVolumeProfile.asset',
           '/Unity/Assets/UniversalRenderPipelineGlobalSettings.asset',
           '/Unity/Packages/','/Unity/ProjectSettings/')
          git -C $root sparse-checkout set --no-cone @includes
          if($LASTEXITCODE){throw 'Sparse checkout setup failed'}
          git -C $root fetch --no-tags --depth=1 --filter=blob:none origin $env:MARCH_STUDIO_SOURCE_SHA
          if($LASTEXITCODE){throw 'Git fetch failed'}
          # Windows schannel can drop a promisor-blob response near the end
          # of an otherwise correct sparse checkout (run 44545156060).
          # Retry only this RUN's own scratch checkout. Never reuse, delete
          # or touch another workstream's Git/Unity folders.
          git -C $root config http.version HTTP/1.1
          $checkoutOk=$false
          for($attempt=1;$attempt -le 3;$attempt++){
            git -C $root checkout -q --detach $env:MARCH_STUDIO_SOURCE_SHA
            if($LASTEXITCODE -eq 0){$checkoutOk=$true;break}
            Write-Warning ('Transient promisor-blob checkout failure; same SHA retry '+$attempt)
            Start-Sleep -Seconds (4*$attempt)
          }
          if(-not $checkoutOk -or (git -C $root rev-parse HEAD).Trim() -ne $env:MARCH_STUDIO_SOURCE_SHA){
            throw 'SHA-pinned checkout unresolved after bounded retries'}
          foreach($p in @('Unity/Packages/manifest.json','Unity/ProjectSettings/ProjectVersion.txt',
           'Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/bastion_i.png',
           'Unity/Assets/Experimentos/ValoriaModular25D/Scenes/BastionI_Modular25D.unity',
           'Unity/Assets/Experimentos/ValoriaModular25D/Editor/Modular25DNativeCapture.cs')){
             if(-not(Test-Path (Join-Path $root $p))){throw "Missing SHA-pinned Unity input $p"}
          }
          "MOD25D_SOURCE=$root"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MOD25D_CHECKOUT_PINNED $env:MARCH_STUDIO_SOURCE_SHA"
      - name: Run actual target room native A-B (no full world or WebGL rebuild)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:MOD25D_SOURCE 'Unity'
          $env:MARCH_STUDIO_NATIVE_OUT=Join-Path $env:RUNNER_TEMP ('march-studio-proof-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $env:MARCH_STUDIO_NATIVE_OUT|Out-Null
          "MARCH_STUDIO_NATIVE_OUT=$env:MARCH_STUDIO_NATIVE_OUT"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $log=Join-Path $env:MARCH_STUDIO_NATIVE_OUT 'native.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',$project,'-executeMethod','Eldoria.Experimentos.ValoriaModular25D.Editor.MarchStudioNativeEvidence.Capture','-logFile',$log)
          $proc=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $proc.WaitForExit(1800000)){$proc.Kill();throw 'Targeted native proof timed out'}
          if($proc.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 160};throw 'Actual native proof failed'}
          $e=Get-Content (Join-Path $env:MARCH_STUDIO_NATIVE_OUT 'evidence.json') -Raw|ConvertFrom-Json
          if($e.sourceSha -ne $env:MARCH_STUDIO_SOURCE_SHA -or $e.engineVersion -ne '6000.3.23f1' -or -not $e.actualPrefab -or -not $e.actualGateway -or $e.frames.Count -ne 6){throw 'Incomplete actual source evidence'}
          foreach($f in $e.frames){
            $p=Join-Path $env:MARCH_STUDIO_NATIVE_OUT $f.file
            if(-not $f.actualCamera -or -not $f.playMode -or (Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() -ne $f.sha256){throw 'Invalid actual camera frame'}
          }
          Write-Host "MARCH_NATIVE_SOURCE_PROOF $env:MARCH_STUDIO_SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: march-studio-native-evidence
          path: ${{ env.MARCH_STUDIO_NATIVE_OUT }}/
          if-no-files-found: warn
