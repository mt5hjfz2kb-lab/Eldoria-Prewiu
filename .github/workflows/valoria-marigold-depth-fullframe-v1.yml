name: "[R&D] Valoria Marigold Depth Fullframe v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-marigold-depth-fullframe-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --quiet "gradio_client>=1.4" pillow
      - name: Infer canonical depth
        env:
          OUT_DIR: /tmp/marigold-proof
        run: python tools/valoria-marigold-depth-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-marigold-depth-fullframe-v1
          path: /tmp/marigold-proof
          if-no-files-found: error
          retention-days: 30
