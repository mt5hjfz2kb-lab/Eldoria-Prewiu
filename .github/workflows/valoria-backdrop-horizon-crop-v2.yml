name: "[EXPERIMENT] Valoria Backdrop Horizon Crop v2"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Unity/Assets/Eldoria/Scripts/Editor/ValoriaBackdropHorizonCropGateV2.cs'
      - 'pipeline/valoria-backdrop-horizon-crop-v2-request.json'
permissions: { contents: read }
concurrency:
  group: valoria-backdrop-horizon-crop-v2
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate;Add-Content -Path $env:GITHUB_PATH -Value $dir;$env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage Alps Field CC0 panorama
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\SkyCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dst=Join-Path $dir 'alps_field.jpg'
          Invoke-WebRequest -Uri 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/alps_field.jpg' -OutFile $dst -UseBasicParsing
          if((Get-Item $dst).Length -lt 1000000){throw 'Alps Field panorama unexpectedly small.'}
      - name: Capture crop sweep
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaBackdropHorizonCropV2Captures"
          $log="$env:RUNNER_TEMP\ValoriaBackdropHorizonCropV2.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaBackdropHorizonCropGateV2.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(20)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Crop sweep timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 250};throw "Crop sweep failed $($p.ExitCode)"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-backdrop-horizon-crop-v2-${{ github.run_id }}
          path: |
            Unity/ValoriaBackdropHorizonCropV2Captures/*
            ${{ runner.temp }}/ValoriaBackdropHorizonCropV2.log
          if-no-files-found: warn
          retention-days: 14
