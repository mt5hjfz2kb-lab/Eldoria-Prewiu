name: Eldoria Visual QA - independent read-only review
on:
  workflow_run:
    workflows: ['UI Progression Certification (fast)']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'tools/visual-qa/**'
      - '.github/workflows/eldoria-visual-qa-auto.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed Unity certification run ID to compare with its previous run'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-visual-qa-${{ github.event.workflow_run.id || github.event.inputs.run_id }}
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - run: python -m unittest discover -s tools/visual-qa -p 'test_*.py' -v
  compare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/visual-qa
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small read-only image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Compare certified Unity screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
        run: python tools/visual-qa/compare.py --run-id "$RUN_ID" --output visual-report
      - name: Attach visual report (never art approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-visual-qa-${{ github.run_id }}
          path: visual-report/
          if-no-files-found: warn
          retention-days: 14
