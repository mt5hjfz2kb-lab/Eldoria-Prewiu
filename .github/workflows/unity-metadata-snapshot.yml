name: Unity metadata - read-only recovery snapshot

on:
  push:
    branches: ['fix/unity-metadata-integrity-20261104']
    paths:
      - 'tools/unity-metadata/recovery-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-metadata-read-only-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 10
    steps:
      # No checkout: preserve all existing projects and their generated metadata.
      # Reads existing files only; no Unity, git clean, process control or reboot.
      - name: Read existing metadata from bounded runner project directories
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('eldoria-meta-snapshot-' + $env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $root){ throw 'Refuse to overwrite an existing snapshot' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          foreach($name in @('snapshot.py','recovery-request.json')){
            $url='https://api.github.com/repos/${{ github.repository }}/contents/tools/unity-metadata/' + $name + '?ref=${{ github.sha }}'
            $file=Invoke-RestMethod -Uri $url -Headers $headers
            $bytes=[Convert]::FromBase64String(($file.content -replace '\s',''))
            [IO.File]::WriteAllBytes((Join-Path $root $name),$bytes)
          }
          $args=@((Join-Path $root 'snapshot.py'),'--request',(Join-Path $root 'recovery-request.json'),'--output',(Join-Path $root 'output'),'--search-root',$env:RUNNER_WORKSPACE,'--search-root',$env:RUNNER_TEMP)
          & python @args
          if($LASTEXITCODE -ne 0){ throw 'Read-only metadata snapshot failed' }
      - name: Preserve original metadata and source match evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-metadata-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/eldoria-meta-snapshot-${{ github.run_id }}/output/
          if-no-files-found: error
          retention-days: 30
