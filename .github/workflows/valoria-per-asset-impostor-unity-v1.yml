name: "[R&D] Valoria Per-Asset Impostor Unity Proof v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-per-asset-impostor-unity-v1.json"
      - ".github/workflows/valoria-per-asset-impostor-unity-v1.yml"
  workflow_dispatch:
concurrency:
  group: valoria-per-asset-impostor-unity-v1
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 35
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate; Add-Content -Path $env:GITHUB_PATH -Value $dir; $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { ref: main, clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Capture per-asset impostor proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaPerAssetImpostorUnityProofV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaPerAssetImpostorUnityProofV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaPerAssetImpostorUnityProofV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(28)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Impostor proof timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 300};throw "Impostor proof failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-per-asset-impostor-unity-v1
          path: Unity/ValoriaPerAssetImpostorUnityProofV1Captures/*
          if-no-files-found: error
          retention-days: 30
