name: Studio March R5 exact independent proof
on:
  push:
    branches: [candidate/corona-march-r5-independent-proof-20261127]
    paths: ['.github/workflows/corona-march-r5-independent-proof.yml']
permissions:
  contents: read
  actions: read
jobs:
  independent-r5-audit:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == 'f4cba2d776f012c4e108e938c1f37e130a502d3a' && github.event.head_commit.message == 'Chain receipt-bounded independent R5 art review without rebuilding or increasing owner cap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/corona-art-iteration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1657b2caa6b1a955319538ce3a8b2906398599b3
          path: studio-source
          sparse-checkout: tools/openai-development-studio
          persist-credentials: false
      - name: Wait for exact R5 native proof, then retrieve actual evidence only
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45957940610" --jq .head_sha)" = "f4cba2d776f012c4e108e938c1f37e130a502d3a"
          for attempt in $(seq 1 100); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45957940610" --jq .status)"
            if [ "$status" = completed ]; then break; fi
            sleep 30
          done
          mkdir -p decision
          if [ "$status" != completed ]; then echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "R5 not terminal; no paid call" > decision/reason.txt; exit 0; fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45957940610" --jq .conclusion)" != success ]; then echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "R5 native/comparison failed; no paid call" > decision/reason.txt; exit 0; fi
          gh run download 45957940610 --repo "$GITHUB_REPOSITORY" --name march-studio-native-evidence --dir native
          gh run download 45957940610 --repo "$GITHUB_REPOSITORY" --name march-r5-exact-comparison --dir comparison
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('comparison/report.json').read_text())
          allowed=r['after_source']=='f4cba2d776f012c4e108e938c1f37e130a502d3a' and not r['native_defects'] and r['landscape_identical']
          pathlib.Path('decision/proof.json').write_text(json.dumps({'allowed':allowed,'source':r['after_source'],'native_defects':r['native_defects'],'landscape_identical':r['landscape_identical']},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('allowed='+str(allowed).lower()+'\n')
          PY
      - name: Download immutable receipt groups and reference inputs
        if: steps.proof.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          gh run download 45866050061 --repo "$GITHUB_REPOSITORY" --name corona-march-original-studio-art --dir receipts/artist
          gh run download 45882958150 --repo "$GITHUB_REPOSITORY" --name march-r3-studio-direction --dir receipts/direction
          gh run download 45900917700 --repo "$GITHUB_REPOSITORY" --name march-r3-independent-art-scorecard --dir receipts/r3
          gh run download 45907960440 --repo "$GITHUB_REPOSITORY" --name march-r4-studio-production --dir receipts/r4-production
          gh run download 45956670942 --repo "$GITHUB_REPOSITORY" --name march-r4-independent-art-scorecard --dir receipts/r4-review
          gh run download 45900917700 --repo "$GITHUB_REPOSITORY" --name march-studio-native-evidence --dir r3
          gh run download 45812100129 --repo "$GITHUB_REPOSITORY" --name corona-agent-art-plan --dir refs
          python3 -m py_compile tools/corona-art-iteration/verify_march_r5_budget.py tools/corona-art-iteration/march_r5_audit.py
      - name: Two independent original-weight reviewers within reconciled owner cap
        if: steps.proof.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/corona-art-iteration/march_r5_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: march-r5-independent-art-scorecard
          path: |
            decision/
            march-r5-audit/
          if-no-files-found: warn
