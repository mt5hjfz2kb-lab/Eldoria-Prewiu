name: "[R&D] Valoria Human-Mesh Projection Bake v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-human-mesh-projection-bake-v1.json"
      - ".github/workflows/valoria-human-mesh-projection-bake-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          python -m pip install --quiet pillow numpy
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri libglx-mesa0
      - name: Build human-mesh projection proof
        run: blender -b --python tools/valoria-human-mesh-projection-bake-v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-human-mesh-projection-bake-v1
          path: /tmp/valoria-human-projection
          if-no-files-found: error
          retention-days: 30
