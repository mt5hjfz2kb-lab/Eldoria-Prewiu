name: Ciudad2D V6 - verificar WebGL real en navegador sin publicar
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-webperf/browser_request.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: ciudad2d-webperf-browser-ubuntu
  cancel-in-progress: false
jobs:
  local-webgl-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-webperf/
      - name: Verify a completed exact Unity build and download its unpublished artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          j=json.loads(Path('tools/ciudad2d-webperf/browser_request.json').read_text())
          assert j['schema']==1 and j['no_public_deploy']
          repo=os.environ['GITHUB_REPOSITORY']
          request=urllib.request.Request(
            f'https://api.github.com/repos/{repo}/actions/runs/'+str(j['source_run']),
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                     'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as f:r=json.load(f)
          assert r['conclusion']=='success' and r['head_sha']==j['source_sha']
          assert r['head_branch']=='art/ciudad-2d-hitos-1-5-20261116'
          print('UNITY_REAL_SUCCESSFUL_BUILD_ARTIFACT_SOURCE_MATCH')
          PY
          ID=$(python3 -c "import json;print(json.load(open('tools/ciudad2d-webperf/browser_request.json'))['artifact_id'])")
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/actions/artifacts/$ID/zip" \
            -o /tmp/ciudad2d-v6-webperf-source.zip
          test "$(wc -c </tmp/ciudad2d-v6-webperf-source.zip)" -gt 300000
      - name: Extract only compiled Unity web payload and inspect build integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,json,shutil
          from pathlib import Path
          target=Path('/tmp/city2d-webperf-v6-site')
          target.mkdir(parents=True,exist_ok=False)
          directory=Path('/tmp/city2d-webperf-source')
          with zipfile.ZipFile('/tmp/ciudad2d-v6-webperf-source.zip') as z:
              z.extractall(directory)
          results=[p for p in directory.rglob('index.html')
                   if (p.parent/'trial_manifest.json').is_file()]
          assert len(results)==1,results
          source=results[0].parent
          assert (source/'serve.py').is_file() and (source/'README_PRUEBA_IPHONE.md').is_file()
          assert any((source/'Build').glob('*.wasm'))
          assert any((source/'Build').glob('*.data'))
          assert any((source/'Build').glob('*.loader.js'))
          proof=json.loads((source/'trial_manifest.json').read_text())
          assert proof['target']=='WebGL' and proof['playable_city_trial_only']
          assert proof['no_main_or_gameplay_changes'] if 'no_main_or_gameplay_changes' in proof else (
              proof['main_modified'] is False and proof['gameplay_modified'] is False)
          assert proof['target_hardware_iphone_test']=='PENDING'
          for entry in source.iterdir():
              if entry.is_dir():shutil.copytree(entry,target/entry.name)
              else:shutil.copy2(entry,target/entry.name)
          print('CIUDAD2D_REAL_WEBGL_PAYLOAD_FILES_PRESENT',source)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser without touching Unity or Windows
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve local V6 Unity only, never publish beta
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/city2d-webperf-v6-site/serve.py --host 127.0.0.1 --port 8765 > /tmp/city2d-webperf-local.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null 2>&1; then
              echo 'LOCAL_UNITY_WEBGL_HTTP_SERVE_READY'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/city2d-webperf-local.log
          exit 1
      - name: Verify actual LOCAL WebGL startup, canvas, FPS samples and mobile viewport
        id: local
        continue-on-error: true
        env:
          CIUDAD2D_WEBPERF_URL: http://127.0.0.1:8765/
        shell: bash
        run: |
          node tools/ciudad2d-webperf/check_browser.cjs
      - name: Keep local result before visiting CDN
        if: always()
        shell: bash
        run: |
          mkdir -p ciudad2d-webperf-local-proof
          if test -d ciudad2d-webperf-browser-proof; then
            cp -r ciudad2d-webperf-browser-proof/. ciudad2d-webperf-local-proof/
            rm -rf ciudad2d-webperf-browser-proof
          fi
      - name: Diagnose exact deployed CDN page and Unity runtime without publishing
        if: always()
        continue-on-error: true
        env:
          CIUDAD2D_WEBPERF_URL: https://rawcdn.githack.com/mt5hjfz2kb-lab/Eldoria-Prewiu/79de29f69f4894039be453b47874c7e98039b5fd/webperf-live/valoria-v6/index.html
        shell: bash
        run: node tools/ciudad2d-webperf/check_browser.cjs
      - name: Retain browser logs, screenshot and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-v6-webperf-browser-smoke-${{ github.run_id }}
          path: |
            ciudad2d-webperf-browser-proof/
            ciudad2d-webperf-local-proof/
            /tmp/city2d-webperf-local.log
          if-no-files-found: warn
          retention-days: 14
