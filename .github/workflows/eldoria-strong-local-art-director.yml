name: Eldoria larger local brain - Qwen3 14B text director experiment
on:
  push:
    branches: [diagnostic/valoria-ai-eyes-brain-20261015]
    paths:
      - '.github/workflows/eldoria-strong-local-art-director.yml'
      - 'tools/art-direction/director-control/strong_local_director.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-exclusive-native-windows-free-text-director
  cancel-in-progress: false
jobs:
  evaluate-14b-grounded-director:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 48
    steps:
      - name: Locate preinstalled Git via GitHub Desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Previously installed Git missing'}
            $folder=Split-Path $git
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/director-control
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse original tower source and previous Qwen eyes and grounded director evidence
        uses: actions/download-artifact@v4
        with:
          name: valoria-eyes-brain-4b-8b-original-unchanged
          run-id: 38699407600
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-prior-vision-evidence
      - uses: actions/download-artifact@v4
        with:
          name: valoria-spatial-grounded-art-director-4b-8b
          run-id: 38701710879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-prior-grounding
      - name: Confirm paused production, installed Qwen and read-only director code
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $policy=(Invoke-WebRequest 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/main/AGENTS.md' -UseBasicParsing -TimeoutSec 30).Content
          if($policy -notmatch 'PAUSA DE LA LINEA DE CORRECCION ARTISTICA PARA DIAGNOSTICO VISUAL'){throw 'Owner diagnosis permission changed'}
          foreach($filename in @('spatial-grounding.json','grounded-director-8b.json')){
            if(-not (Test-Path (Join-Path $env:RUNNER_TEMP "eldoria-prior-grounding/$filename"))){throw "MISSING_ORIGINAL_GROUNDED_EVIDENCE:$filename"}
          }
          if(-not (Test-Path (Join-Path $env:RUNNER_TEMP 'eldoria-prior-vision-evidence/diagnosis-8b.json'))){throw 'MISSING_REAL_VISION_EVIDENCE'}
          python -m py_compile tools/art-direction/director-control/strong_local_director.py tools/art-direction/director-control/selective_memory.py
          if($LASTEXITCODE -ne 0){throw 'DIRECTOR_SELECTIVE_MODULE_SYNTAX_FAILED'}
          $exe=Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'
          if(-not (Test-Path $exe)){
            $exe=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {Join-Path $_.FullName 'AppData\Local\Programs\Ollama\ollama.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $exe){throw 'EXISTING_OLLAMA_NOT_FOUND'}
          "ELDORIA_OLLAMA_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $models=Join-Path $env:USERPROFILE '.ollama\models'
          if(-not (Test-Path $models)){
            $models=Get-ChildItem C:/Users -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {Join-Path $_.FullName '.ollama\models'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if($models){"ELDORIA_OLLAMA_MODELS=$models" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Compare genuine freeform director judgments with and without selective recall
        shell: powershell
        timeout-minutes: 32
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $env:OLLAMA_NUM_PARALLEL='1'
          $env:OLLAMA_MAX_LOADED_MODELS='1'
          if($env:ELDORIA_OLLAMA_MODELS){$env:OLLAMA_MODELS=$env:ELDORIA_OLLAMA_MODELS}
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-14b-director-candidate'
          $server=$null
          try {
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process -FilePath $env:ELDORIA_OLLAMA_EXE -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'ollama-benchmark-stdout.log') -RedirectStandardError (Join-Path $out 'ollama-benchmark-stderr.log')
              for($i=0;$i -lt 35;$i++){
                try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}
              }
            }
            if(-not $ready){throw 'Local Ollama not responding'}
            $tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 20
            if('qwen3:14b' -notin @($tags.models | ForEach-Object {$_.name})){throw 'EXISTING_QWEN14B_NOT_INSTALLED_NO_DOWNLOAD'}
            python tools/art-direction/director-control/strong_local_director.py --grounding (Join-Path $env:RUNNER_TEMP 'eldoria-prior-grounding/spatial-grounding.json') --prior-vision (Join-Path $env:RUNNER_TEMP 'eldoria-prior-vision-evidence/diagnosis-8b.json') --prior-director (Join-Path $env:RUNNER_TEMP 'eldoria-prior-grounding/grounded-director-8b.json') --out $out --model qwen3:14b --selective-freeform-diagnostic
            if($LASTEXITCODE -ne 0){throw 'Local Qwen 14B director diagnosis failed; preserve evidence'}
          } finally {
            if($server){try{Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}catch{}}
          }
      - name: Preserve grounded director plans and execution truth, never model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-14b-selective-freeform-director-validation
          path: ${{ runner.temp }}/eldoria-14b-director-candidate/
          if-no-files-found: warn
          retention-days: 30
