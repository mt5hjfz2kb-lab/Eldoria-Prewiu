name: Eldoria larger local brain - Qwen3 14B text director experiment
on:
  push:
    branches: [diagnostic/valoria-ai-eyes-brain-20261015]
    paths:
      - '.github/workflows/eldoria-strong-local-art-director.yml'
      - 'tools/art-direction/director-control/strong_local_director.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-exclusive-native-windows-free-text-director
  cancel-in-progress: false
jobs:
  evaluate-14b-grounded-director:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 48
    steps:
      - name: Locate preinstalled Git via GitHub Desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Previously installed Git missing'}
            $folder=Split-Path $git
            $env:PATH="$folder;$env:PATH"
            Add-Content $env:GITHUB_PATH $folder
          }
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            tools/art-direction/director-control
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse original tower source and previous Qwen eyes and grounded director evidence
        uses: actions/download-artifact@v4
        with:
          name: valoria-eyes-brain-4b-8b-original-unchanged
          run-id: 38699407600
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-prior-vision-evidence
      - uses: actions/download-artifact@v4
        with:
          name: valoria-spatial-grounded-art-director-4b-8b
          run-id: 38701710879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/eldoria-prior-grounding
      - name: Validate latest owner diagnosis authorization, candidate disk capacity and code
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $policy=(Invoke-WebRequest 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/main/AGENTS.md' -UseBasicParsing -TimeoutSec 30).Content
          if($policy -notmatch 'PAUSA DE LA LINEA DE CORRECCION ARTISTICA PARA DIAGNOSTICO VISUAL'){throw 'Owner latest authorization changed'}
          if(-not (Test-Path (Join-Path $env:RUNNER_TEMP 'eldoria-prior-grounding/spatial-grounding.json'))){throw 'Verified prior spatial evidence missing'}
          if(-not (Test-Path (Join-Path $env:RUNNER_TEMP 'eldoria-prior-vision-evidence/diagnosis-8b.json'))){throw 'Prior 8B visual observation evidence missing'}
          python -m py_compile tools/art-direction/director-control/strong_local_director.py
          if($LASTEXITCODE -ne 0){throw 'Stronger local director script syntax failed'}
          $drive=$env:SystemDrive.TrimEnd(':')
          $free=(Get-PSDrive -Name $drive).Free
          if($free -lt 20GB){throw ('INSUFFICIENT_FREE_DISK_SPACE_FOR_9GB_MODEL: '+[math]::Round($free/1GB,2)+' GB')}
          $o=Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'
          if(-not (Test-Path $o)){
            $o=Get-ChildItem (Join-Path $env:SystemDrive 'Users') -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {Join-Path $_.FullName 'AppData\Local\Programs\Ollama\ollama.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if(-not $o){throw 'Existing Ollama unavailable'}
          "ELDORIA_OLLAMA_EXE=$o" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $dir=Join-Path $env:USERPROFILE '.ollama\models'
          if(-not (Test-Path $dir)){
            $dir=Get-ChildItem (Join-Path $env:SystemDrive 'Users') -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {Join-Path $_.FullName '.ollama\models'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
          }
          if($dir -and (Test-Path $dir)){"ELDORIA_OLLAMA_MODELS=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8}
          Write-Host ('PRECHECK_FREE_DISK_GB='+[math]::Round($free/1GB,1))
      - name: Download only free Apache 2 licensed Qwen3 14B Q4 model from official Ollama registry
        shell: powershell
        timeout-minutes: 32
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $env:OLLAMA_NUM_PARALLEL='1'
          $env:OLLAMA_MAX_LOADED_MODELS='1'
          if($env:ELDORIA_OLLAMA_MODELS){$env:OLLAMA_MODELS=$env:ELDORIA_OLLAMA_MODELS}
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-14b-director-candidate'
          New-Item -Path $out -ItemType Directory -Force | Out-Null
          $server=$null
          try {
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process -FilePath $env:ELDORIA_OLLAMA_EXE -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'ollama-stdout.log') -RedirectStandardError (Join-Path $out 'ollama-stderr.log')
              for($i=0;$i -lt 30;$i++){
                try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}
              }
            }
            if(-not $ready){throw 'Previously installed Ollama not responding'}
            $tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 15
            if('qwen3:14b' -notin @($tags.models | ForEach-Object {$_.name})){
              Write-Host 'FETCHING_FREE_LOCAL_QWEN3_14B_9_3GB_NO_PAID_SERVICES'
              & $env:ELDORIA_OLLAMA_EXE pull qwen3:14b
              if($LASTEXITCODE -ne 0){throw 'Free model download failed; prior models untouched'}
            }else{Write-Host 'REUSING_EXISTING_QWEN3_14B'}
            $tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 15
            $found=@($tags.models | Where-Object {$_.name -eq 'qwen3:14b'})
            if($found.Count -ne 1){throw 'Expected Qwen3 14B model did not appear after pull'}
            @{schema_version=1;name='qwen3:14b';size_bytes=$found[0].size;source='Ollama official Qwen3:14b';cost_eur=0;trained_weights=$false} |
              ConvertTo-Json -Depth 5 | Out-File (Join-Path $out 'strong-model-presence.json') -Encoding utf8
            Write-Host 'LOCAL_FREE_QWEN3_14B_CACHED_AVAILABLE'
          } finally {
            if($server){try{Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}catch{}}
          }
      - name: Compare grounded 14B reasoning against real prior 8B visual diagnoses
        shell: powershell
        timeout-minutes: 13
        run: |
          $ErrorActionPreference='Stop'
          $env:OLLAMA_HOST='127.0.0.1:11434'
          $env:OLLAMA_NUM_PARALLEL='1'
          $env:OLLAMA_MAX_LOADED_MODELS='1'
          if($env:ELDORIA_OLLAMA_MODELS){$env:OLLAMA_MODELS=$env:ELDORIA_OLLAMA_MODELS}
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-14b-director-candidate'
          $server=$null
          try {
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process -FilePath $env:ELDORIA_OLLAMA_EXE -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $out 'ollama-benchmark-stdout.log') -RedirectStandardError (Join-Path $out 'ollama-benchmark-stderr.log')
              for($i=0;$i -lt 35;$i++){
                try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}
              }
            }
            if(-not $ready){throw 'Local Ollama not responding'}
            python tools/art-direction/director-control/strong_local_director.py --grounding (Join-Path $env:RUNNER_TEMP 'eldoria-prior-grounding/spatial-grounding.json') --prior-vision (Join-Path $env:RUNNER_TEMP 'eldoria-prior-vision-evidence/diagnosis-8b.json') --prior-director (Join-Path $env:RUNNER_TEMP 'eldoria-prior-grounding/grounded-director-8b.json') --out $out --model qwen3:14b
            if($LASTEXITCODE -ne 0){throw 'Local Qwen 14B director diagnosis failed; preserve evidence'}
          } finally {
            if($server){try{Stop-Process -Id $server.Id -ErrorAction SilentlyContinue}catch{}}
          }
      - name: Preserve grounded director plans and execution truth, never model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-stronger-14b-local-director-verification
          path: ${{ runner.temp }}/eldoria-14b-director-candidate/
          if-no-files-found: warn
          retention-days: 30
