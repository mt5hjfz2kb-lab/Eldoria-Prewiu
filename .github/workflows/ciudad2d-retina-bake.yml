name: Ciudad2D - horneado Retina reproducible y versionado aislado

on:
  push:
    branches:
      - art/ciudad-2d-hitos-1-5-20261116
    paths:
      - Unity/Assets/Experimentos/Ciudad2D/QA/bake_retina_assets.py
      - Unity/Assets/Experimentos/Ciudad2D/QA/validate_retina.py
      - .github/workflows/ciudad2d-retina-bake.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ciudad2d-retina-bake-isolated
  cancel-in-progress: false

jobs:
  bake:
    if: github.repository == 'mt5hjfz2kb-lab/Eldoria-Prewiu'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/
            /Unity/Assets/Experimentos/Ciudad2D/Scripts/Editor/
            /Unity/Assets/Experimentos/Ciudad2D/QA/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bake and validate exact derived source
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python Unity/Assets/Experimentos/Ciudad2D/QA/bake_retina_assets.py
          python Unity/Assets/Experimentos/Ciudad2D/QA/validate_retina.py
      - name: Commit only derived sandbox assets, never main or game scenes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Retina/Terreno_Organico.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Retina/Terreno_Organico.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/QA/retina_manifest.json
          if git diff --cached --quiet; then
            echo "CITY2D_RETINA_IDENTICAL_NO_COMMIT"
          else
            git commit -m "art(city2d): commit reproducible 1.5x Retina terrain with SHA manifest"
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
