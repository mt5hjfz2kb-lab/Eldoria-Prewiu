name: "[ART MORTAR V8] Real CC0 lime grout, not photographed brick seams"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-real-lime-mortar-v8.yml'
      - 'tools/valoria-modular-fortress/mortar_real_lime_nonbrick_v8.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-mortar-physical-aggregate-grey-v8
  cancel-in-progress: false
jobs:
  isolate-actual-mortar-grout:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Locate local Git and Blender
        id: deps
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'No local Git'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $bin=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $bin){throw 'No local Blender'}
          "blender=$bin" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-one-real-photographic-mortar-38889901400
          run-id: 38889901400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lime_photos_and_grains
      - name: Bake natural dark lime mortar without fake masonry brick joints
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'lime_photos_and_grains\eldoria-one-real-aged-mortar\glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-mortar-lime-v8'
          if(-not(Test-Path (Join-Path $src 'mortar_joint_recess.glb'))){throw 'Prior mortar GLB absent'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/mortar_real_lime_nonbrick_v8.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned mortar artist script missing'}
          $script=Join-Path $env:RUNNER_TEMP 'eldoria-real-mortar-v8.py'
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-real-mortar-v8.stdout'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-real-mortar-v8.stderr'
          $proc=Start-Process -FilePath "${{ steps.deps.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$src,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 65 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Actual mortar V8 failed $($proc.ExitCode)"}
          foreach($file in @('glb\mortar_joint_recess.glb','before\mortar_joint_recess.png','after\mortar_joint_recess.png','reports\limemortar_correction.json')){
            if(-not(Test-Path (Join-Path $out $file))){throw "Missing actual source/output: $file"}
          }
      - name: Keep before-after evidence, do not mark art approved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-real-dark-lime-mortar-cc0-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-mortar-lime-v8/**
            ${{ runner.temp }}/eldoria-real-mortar-v8.stdout
            ${{ runner.temp }}/eldoria-real-mortar-v8.stderr
          retention-days: 30
          if-no-files-found: warn
