name: "[R&D] Valoria Unique3D Gate Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-unique3d-gate-capability-v1.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png
          sparse-checkout-cone-mode: false

      - name: Install client tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" pillow requests

      - name: Prepare canonical gate crop
        run: |
          mkdir -p /tmp/unique3d/input /tmp/unique3d/output /tmp/unique3d/evidence
          python - <<'PY'
          from PIL import Image
          src="art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/canonical-golden-crop.png"
          im=Image.open(src).convert("RGBA")
          box=(189,54,574,324)
          crop=im.crop(box)
          w,h=crop.size
          side=max(w,h)
          canvas=Image.new("RGBA",(side,side),(255,255,255,0))
          canvas.alpha_composite(crop,((side-w)//2,(side-h)//2))
          canvas=canvas.resize((768,768),Image.Resampling.LANCZOS)
          out="/tmp/unique3d/input/eldoria-gate-crop.png"
          canvas.save(out)
          open("/tmp/unique3d/evidence/input-spec.txt","w").write(
              f"source={src}\nsource_size={im.size}\ncrop_box={box}\nprepared={canvas.size}\ncredits=0\nunity_touched=false\n"
          )
          PY
          sha256sum /tmp/unique3d/input/eldoria-gate-crop.png | tee /tmp/unique3d/evidence/input.sha256

      - name: Probe Unique3D public API
        id: unique3d
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/unique3d/evidence/unique3d.log
          from gradio_client import Client
          client=Client("Wuvin/Unique3D", verbose=True)
          api=client.view_api(return_format="dict")
          print("API",api)
          print("ENDPOINTS",list((api or {}).get("named_endpoints",{})))
          PY

      - name: Record probe
        run: |
          {
            echo "zero_spend=true"
            echo "unity_touched=false"
            echo "unique3d_probe_outcome=${{ steps.unique3d.outcome }}"
          } | tee /tmp/unique3d/evidence/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-unique3d-gate-capability-probe
          path: /tmp/unique3d/evidence
          retention-days: 14
