name: Senda Brecha isolated 3D WebGL visual QA
'on':
  push:
    branches:
      - feature/senda-brecha-lane-event-20261115
    paths:
      - tools/senda-brecha/visual-3d/**
      - tools/senda-brecha/tests/visual_3d_browser.cjs
      - .github/workflows/senda-brecha-web-visual-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: senda-brecha-web-visual-${{ github.ref }}
  cancel-in-progress: true # only obsolete Senda WebGL proofs on this same ref; never cancel Windows
jobs:
  inspect-canonical-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect exact original approved rig for reusable guard authoring
        run: |
          set -eu
          mkdir -p /tmp/canonical-source
          curl -fsSL 'https://raw.githubusercontent.com/mt5hjfz2kb-lab/Eldoria-Prewiu/5ef2aee67cf8fde57ba2fc4b3d929b517ee67944/Unity/Assets/StreamingAssets/Eldoria/Aldric/SirAldric_Approved_RiggedAnimated_v1.glb' -o /tmp/canonical-source/aldric.glb
          echo 'c28a65b6040225256ae047d8fd773849771895ac378041e0882f279517e78c8b  /tmp/canonical-source/aldric.glb' | sha256sum -c
          python3 - <<'PY'
          import json,struct,pathlib
          p=pathlib.Path('/tmp/canonical-source/aldric.glb').read_bytes(); n=struct.unpack_from('<I',p,12)[0];d=json.loads(p[20:20+n]);
          pathlib.Path('/tmp/canonical-source/metadata.json').write_text(json.dumps(d,indent=2));print(json.dumps({'nodes':[(i,x.get('name'),x.get('mesh'),x.get('skin')) for i,x in enumerate(d['nodes'])],'meshes':[(i,x.get('name'),[(y.get('material'),d['accessors'][y['indices']]['count']//3 if 'indices' in y else None) for y in x['primitives']]) for i,x in enumerate(d['meshes'])],'materials':[x.get('name') for x in d['materials']]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: senda-canonical-model-inspection
          path: /tmp/canonical-source/
          retention-days: 7
  real-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            tools/senda-brecha/visual-3d
            tools/senda-brecha/tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium (no Unity/Windows reservation)
        run: |
          mkdir -p "$RUNNER_TEMP/senda-node"
          npm install --no-save --prefix "$RUNNER_TEMP/senda-node" playwright@1.55.0
          "$RUNNER_TEMP/senda-node/node_modules/.bin/playwright" install chromium
      - name: Run real rendered graphics and touch interactions in four viewports
        env:
          NODE_PATH: ${{ runner.temp }}/senda-node/node_modules
          SENDA_SCREENSHOTS: senda-3d-evidence
        run: |
          set -euo pipefail
          python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/senda-web.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node tools/senda-brecha/tests/visual_3d_browser.cjs
      - name: Retain actual Chromium screenshots and non-approval proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senda-brecha-web3d-${{ github.sha }}
          path: senda-3d-evidence/
          if-no-files-found: warn
          retention-days: 14
