name: Valoria first asset family V1
on:
  push:
    branches: [art/valoria-first-asset-family-v1-20261011]
    paths: ['tools/art-rd/valoria_first_family_v1.py', '.github/workflows/valoria-first-asset-family-v1.yml', 'tools/art-rd/valoria_family_mcp_cliff.py', 'tools/art-rd/valoria_family_mcp_secondary.py', 'tools/art-rd/valoria_family_cc0_scanned_cliff.py', 'tools/art-rd/valoria_family_qwen_decisions.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install free Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy python3-pil libarchive13t64
      - name: Recover previously verified free CC0 geological donor and material maps
        run: |
          git fetch --no-tags origin refs/heads/art/studio-reuse-handoff-20261011:refs/remotes/origin/art/studio-reuse-handoff-20261011
          git show origin/art/studio-reuse-handoff-20261011:tools/art-studio-recovery/extract_cc0.py > "$RUNNER_TEMP/extract_cc0.py"
          curl -fL --retry 2 -A 'EldoriaResearch/1.0' 'https://opengameart.org/sites/default/files/Free%20-%20Photogrammetric%20Rock.7z' -o "$RUNNER_TEMP/eldoria-rock.7z"
          echo "f33dbb5b2a2315a2fba5e5db09fabf799094fe8b5c437486ba52546e4486138d  $RUNNER_TEMP/eldoria-rock.7z" | sha256sum -c -
          python3 "$RUNNER_TEMP/extract_cc0.py" "$RUNNER_TEMP/eldoria-rock.7z" /tmp/eldoria-rock-source
          test -s "$(find /tmp/eldoria-rock-source -name Rock_LOD4-2k.obj | head -1)"
      - name: Render seven V3-derived models in close and strategic cameras
        env:
          ELDORIA_FAMILY_PHASE: before
        run: blender -b -t 4 --python tools/art-rd/valoria_first_family_v1.py
      - name: Activate existing free local art brain
        run: |
          git fetch --no-tags origin refs/heads/ops/valoria-art-brain-runtime-recovery-20261011:refs/remotes/origin/ops/valoria-art-brain-runtime-recovery-20261011
          git show origin/ops/valoria-art-brain-runtime-recovery-20261011:tools/valoria-art-brain/start_local_qwen_ci.sh > "$RUNNER_TEMP/start-qwen.sh"
          sed -i '/^trap /d' "$RUNNER_TEMP/start-qwen.sh"
          bash "$RUNNER_TEMP/start-qwen.sh"
      - name: Qwen art direction, structured visual comparisons against V3
        run: python3 tools/art-rd/valoria_family_qwen_decisions.py
      - name: Export editable sources GLB and paired second renders
        env:
          ELDORIA_FAMILY_PHASE: after
        run: blender -b -t 4 --python tools/art-rd/valoria_first_family_v1.py
      - name: Use existing SHA-pinned free BlenderMCP addon
        run: |
          curl -fL --retry 2 https://raw.githubusercontent.com/ahujasid/blender-mcp/7a0373ec9199183cb460068c4f96aed9c579fb4f/addon.py -o /tmp/eldoria-blender-mcp.py
          echo 'eb0facf69781a30e69792532087d8d41c6a14fcd323353250abe7988ee297fa5  /tmp/eldoria-blender-mcp.py' | sha256sum -c -
      - name: Qwen-guided real BlenderMCP geological sculpt and matched renders
        run: |
          blender -b --python-exit-code 1 -t 4 --python tools/art-rd/valoria_family_mcp_cliff.py
          test -s art-source/valoria/production/first-asset-family-v1/cliff_rocks/mcp-authoring-evidence.json
          test -s art-source/valoria/production/first-asset-family-v1/cliff_rocks/mcp-after-hero.png
      - name: Qwen-directed BlenderMCP sculpt of tower walls paving and props
        run: |
          blender -b --python-exit-code 1 -t 4 --python tools/art-rd/valoria_family_mcp_secondary.py
          test -s art-source/valoria/production/first-asset-family-v1/mcp-family-authoring-index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-first-asset-family-v1-production
          path: art-source/valoria/production/first-asset-family-v1/
          retention-days: 30
