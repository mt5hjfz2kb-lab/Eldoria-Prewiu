name: "[ART WALL V8] Physical chipped-stone contacts on 4m module"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-handworn-wall-v8.yml'
      - 'tools/valoria-modular-fortress/wall_worn_handstone_v8.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-single-wall-physical-chips
  cancel-in-progress: false
jobs:
  verify-actual-chipped-masonry:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Only native Git and Blender
        shell: powershell
        id: binary
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing Git'}
            $dir=Split-Path $git;Add-Content $env:GITHUB_PATH $dir;$env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-4m-wall-artisan-capstone-v6-38865543613
          run-id: 38865543613
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/original_handstone_v7
      - name: 12 independent angular stone chips, same camera before and after
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'original_handstone_v7\eldoria-4m-wall-architectural-v6\glb\wall_panel_regular_4m_warm_limestone_bright.glb'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-real-stone-joins-v8'
          if(-not(Test-Path $base)){throw 'Source selected limestone gate 4m module missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/wall_worn_handstone_v8.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned sculpt source missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-real-stone-wear.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-stone-wear.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-stone-wear.err'
          $proc=Start-Process -FilePath "${{ steps.binary.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$base,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 50 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Chipped ashlar Blender failed $($proc.ExitCode)"}
          foreach($file in @('glb\wall_panel_regular_4m.glb','before\wall_panel_regular_4m.png','after\wall_panel_regular_4m.png','reports\artisan_contact_chips_v8.json')){
            if(-not(Test-Path (Join-Path $out $file))){throw "No real result $file"}
          }
      - name: Preserve independent before/after visual evidence, no claims 8/10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-wall4m-twelve-real-chips-v8-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-real-stone-joins-v8/**
            ${{ runner.temp }}/eldoria-stone-wear.log
            ${{ runner.temp }}/eldoria-stone-wear.err
          if-no-files-found: warn
          retention-days: 30
