name: "[PRODUCTION] Valoria Production Art Starter v2"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/valoria-production-art-starter-v2-request.json'

permissions:
  contents: write

concurrency:
  group: valoria-production-art-starter-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        run: |
          python3 - <<'PY'
          import json,os
          d=json.load(open('pipeline/valoria-production-art-starter-v2-request.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('enabled='+('true' if d.get('enabled') else 'false')+'\n')
          PY
      - name: Install Blender
        if: steps.req.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Build v2 family
        if: steps.req.outputs.enabled == 'true'
        run: |
          blender -b --python tools/valoria-production-art-starter/build_starter_family_v2.py
          test -s art-source/valoria/production/starter-family-v2/Valoria_StarterFamily_v2.blend
          for f in Valoria_MainGate_v2 Valoria_WallSegment_v2 Valoria_Tower_v2 Valoria_CivicHouse_v2 Valoria_Workshop_v2; do
            test -s "Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/StarterFamilyV2/${f}.glb"
          done
      - name: Persist v2 source
        if: steps.req.outputs.enabled == 'true'
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add art-source/valoria/production/starter-family-v2 Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/StarterFamilyV2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist Valoria production art starter family v2"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: steps.req.outputs.enabled == 'true'
        with:
          name: valoria-production-art-starter-v2
          path: |
            art-source/valoria/production/starter-family-v2/*
            Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/StarterFamilyV2/*.glb
          retention-days: 30
          if-no-files-found: error
