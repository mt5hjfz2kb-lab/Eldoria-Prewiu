name: Eldoria full-artist general Blender toolbox technical acceptance
on:
  push:
    branches:
      - art/eldoria-full-blender-artist-studio-20261014
      - fix/eldoria-artist-eave-contact-visual-learning-20261015
    paths:
      - 'tools/art-direction/full-studio/**'
      - '.github/workflows/eldoria-full-artist-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-blender-toolbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install free native Blender workshop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy python3-pil
      - name: Test strict authoring contracts and syntax
        run: |
          python3 -m unittest discover -s tools/art-direction/full-studio/tests -p 'test_*.py' -v
          python3 -m py_compile tools/art-direction/full-studio/contract.py tools/art-direction/full-studio/artist_loop.py tools/art-direction/full-studio/extended_ops.py tools/art-direction/full-studio/inspect_source.py tools/art-direction/full-studio/learning_context.py tools/art-direction/full-studio/screen_impact.py tools/art-direction/full-studio/glb_mobile_preflight.py tools/art-direction/full-studio/consumer_handoff.py
          blender --version | head -2
      - name: Verify physically correct WORLD Z sculpt on rotated imported asset in real Blender
        run: |
          blender -b --factory-startup --python-exit-code 1 --python tools/art-direction/full-studio/tests/prove_world_sculpt_anchor_blender.py
      - name: Execute twenty-six real independent Blender modelling operations
        run: |
          blender -b --python-exit-code 1 --python tools/art-direction/full-studio/blender_toolbox.py -- \
             --plan tools/art-direction/full-studio/tests/smoke_plan.json \
             --out /tmp/eldoria-full-artist-smoke --texture-root .
      - name: Inspect real existing BLEND source without modifying the source
        run: |
          blender -b --python-exit-code 1 --python tools/art-direction/full-studio/inspect_source.py -- \
            --source /tmp/eldoria-full-artist-smoke/artist-asset.blend \
            --out /tmp/eldoria-full-artist-smoke/source-inspection
          python3 - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('/tmp/eldoria-full-artist-smoke')
          source=p/'artist-asset.blend'
          audit=json.loads((p/'source-inspection/source-inspection.json').read_text())
          assert audit['source_unchanged']
          assert audit['source_sha256']==hashlib.sha256(source.read_bytes()).hexdigest()
          assert audit['asset_count']>=6
          assert not audit['art_approved']
          assert (p/'source-inspection/source-preview-blender.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          print('ELDORIA_REAL_SOURCE_INSPECTED',audit['asset_count'])
          PY
      - name: Verify real editable mesh and GLB plus matched-camera screenshots
        run: |
          python3 - <<'PY'
          import json,pathlib,struct
          p=pathlib.Path('/tmp/eldoria-full-artist-smoke')
          proof=json.loads((p/'execution-proof.json').read_text())
          assert proof['blender_execution']
          assert proof['action_count']==26,proof['action_count']
          assert 30<proof['evaluated_triangles']<220000
          assert proof['matched_review_camera'], 'A/B camera must remain identical'
          catalog=json.loads((p/'reusable-asset-catalog.json').read_text())
          assert catalog['component_count']>=6
          assert len(catalog['new_components'])>=6
          assert catalog['asset_id']=='technical-test-medieval-watchtower'
          assert all(entry['geometry_sha256'] for entry in catalog['components'])
          assert catalog['license_status']=='SELF_AUTHORED_GEOMETRY'
          assert not proof['art_approved'] and not proof['unity_tested']
          assert all(x['reason'] for x in proof['execution'])
          assert any(x['geometry_changed'] for x in proof['execution'] if x['op'] in ('primitive','mesh','sculpt','extrude','inset'))
          assert (p/'artist-asset.blend').read_bytes().startswith(b'BLENDER')
          data=(p/'artist-asset.glb').read_bytes()
          assert data[:4]==b'glTF' and struct.unpack('<I',data[4:8])[0]==2
          assert len(data)==struct.unpack('<I',data[8:12])[0]
          gltf=json.loads(data[20:20+struct.unpack_from('<I',data,12)[0]])
          assert gltf.get('meshes'), 'Production GLB contains no actual 3D models'
          assert not any(n.get('name','').startswith('_EldoriaReview') for n in gltf.get('nodes',[])), 'Preview geometry leaked into reusable GLB'
          for name in ('before-blender.png','after-blender.png'):
              data=(p/name).read_bytes();assert data.startswith(b'\x89PNG\r\n\x1a\n')
          from PIL import Image,ImageChops
          before=Image.open(p/'before-blender.png').convert('RGB')
          after=Image.open(p/'after-blender.png').convert('RGB')
          assert before.size==after.size
          assert ImageChops.difference(before,after).getbbox(), 'Geometry not visible in real camera'
          print('ELDORIA_FULL_ARTIST_BLENDER_TECHNICALLY_PROVEN',proof['action_count'],proof['evaluated_triangles'])
          PY
      - name: Validate real licensed original asset reuse inside independent Blender
        run: |
          python3 tools/art-direction/full-studio/tests/generate_reuse_smoke.py \
            --source /tmp/eldoria-full-artist-smoke/artist-asset.glb \
            --out /tmp/eldoria-full-artist-smoke/reuse-fixture
          blender -b --python-exit-code 1 --python tools/art-direction/full-studio/blender_toolbox.py -- \
            --plan /tmp/eldoria-full-artist-smoke/reuse-fixture/import-plan.json \
            --out /tmp/eldoria-full-artist-smoke/reused-output \
            --texture-root /tmp/eldoria-full-artist-smoke \
            --asset-catalog /tmp/eldoria-full-artist-smoke/reuse-fixture/approved-library.json
          python3 - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('/tmp/eldoria-full-artist-smoke')
          original=p/'artist-asset.glb'
          assert hashlib.sha256(original.read_bytes()).hexdigest()==(p/'reuse-fixture/source-sha256.txt').read_text().strip()
          result=json.loads((p/'reused-output/execution-proof.json').read_text())
          catalog=json.loads((p/'reused-output/reusable-asset-catalog.json').read_text())
          assert result['blender_execution'] and result['action_count']==1
          assert 1<result['reusable_components']<80
          assert catalog['license_status']=='VERIFIED_LOCAL_LIBRARY_IMPORT'
          assert all(c['import_source_license']=='OWNED' for c in catalog['components'])
          assert all(c['import_source_sha256']==hashlib.sha256(original.read_bytes()).hexdigest() for c in catalog['components'])
          assert result['matched_review_camera'] and not result['art_approved']
          print('ELDORIA_REAL_APPROVED_ASSET_REUSE', result['reusable_components'])
          PY
      - name: Inspect actual exported GLB geometry and material provenance
        run: |
          python3 tools/art-direction/full-studio/glb_mobile_preflight.py \
            /tmp/eldoria-full-artist-smoke/artist-asset.glb \
            --out /tmp/eldoria-full-artist-smoke/glb-source-preflight.json \
            --require-materials
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/eldoria-full-artist-smoke/glb-source-preflight.json')
          r=json.loads(p.read_text())
          assert r['mesh_count']>=1 and r['under_triangle_budget']
          assert r['missing_materials']==0
          assert not r['unity_import_verified'] and not r['artistically_approved']
          print('ELDORIA_NATIVE_GLB_BINARY_SOURCE_PASS',r['triangle_count'])
          PY
      - name: Upload genuine models and renders, never claim artistic certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-full-artist-technical
          path: /tmp/eldoria-full-artist-smoke/
          if-no-files-found: warn
          retention-days: 21

  real-qwen-authored-asset:
    if: contains(github.event.head_commit.message, 'AUTHOR_QWEN')
    needs: real-blender-toolbox
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install independent free Blender + vision workshop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-pil python3-numpy
          docker run --rm -d --name eldoria-studio-qwen -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version
          docker exec eldoria-studio-qwen ollama pull qwen3-vl:2b-instruct
      - name: Actual Qwen designs an original new asset then Blender physically constructs it
        run: |
          python3 tools/art-direction/full-studio/artist_loop.py \
            --brief 'CREATE an original reuse-ready fortified medieval stone lookout with a complete multi-part silhouette, battlements, timber detail, stone PBR and real modelled geometry. Choose your own components and sizes. No preset tower template.' \
            --reference references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg \
            --out /tmp/eldoria-full-studio-qwen \
            --max-cycles 1 --max-actions 4 --max-tokens 1250 \
            --model qwen3-vl:2b-instruct
      - name: Verify model really authored operations that Blender executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('/tmp/eldoria-full-studio-qwen')
          report=json.loads((p/'full-studio-result.json').read_text())
          assert report['model']=='qwen3-vl:2b-instruct'
          assert report['ai_authored_action_plans']>=1
          assert report['blender_real_execution'] and not report['art_approved']
          proof_memory=json.loads((p/'journal-context-proof.json').read_text())
          assert len(proof_memory['journal_sha256'])==64
          casebook=json.loads((p/'learning-casebook-proof.json').read_text())
          assert casebook['model_weight_training'] is False
          assert len(casebook['casebook_sha256'])==64
          impact=json.loads((p/'cycle-1/camera-screen-impact.json').read_text())
          assert impact['visually_present'] and not impact['art_approved']
          cycle=p/'cycle-1'
          plan=json.loads((cycle/'artist-plan.json').read_text())
          assert 2<=len(plan['actions'])<=4
          assert plan['asset_decision']=='NEW'
          assert all(a['op']=='primitive' for a in plan['actions'])
          assert len({a['target'] for a in plan['actions']})==len(plan['actions'])
          assert hashlib.sha256((cycle/'artist-plan.json').read_bytes()).hexdigest()==report['cycles'][0]['plan_sha256']
          proof=json.loads((cycle/'output/execution-proof.json').read_text())
          assert proof['blender_execution'] and proof['evaluated_triangles']>0
          assert proof['action_count']==len(plan['actions'])
          assert proof['reusable_components']>=2
          assert (cycle/'output/reusable-asset-catalog.json').is_file()
          assert any(step['geometry_changed'] for step in proof['execution'])
          assert (cycle/'qwen-raw.json').stat().st_size>100
          assert (cycle/'output/artist-asset.blend').read_bytes().startswith(b'BLENDER')
          print('ACTUAL_QWEN_DIRECTED_BLENDER_ASSET', len(plan['actions']), proof['evaluated_triangles'])
          PY
      - name: Preserve raw Qwen, actual Blender models and renders even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-full-artist-genuine-qwen
          path: /tmp/eldoria-full-studio-qwen/
          if-no-files-found: warn
          retention-days: 21

  real-qwen-refine-verified-source:
    if: contains(github.event.head_commit.message, 'REFINE_QWEN')
    needs: real-blender-toolbox
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify original Eldoria production asset before any Qwen edits
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,struct
          p=pathlib.Path('Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF' and struct.unpack_from('<I',data,4)[0]==2
          assert struct.unpack_from('<I',data,8)[0]==len(data)
          print('IMMUTABLE_ELDORIA_TOWER_INPUT',len(data),hashlib.sha256(data).hexdigest())
          PY
      - name: Prepare independent free Blender and local Qwen art workstation
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-pil python3-numpy
          docker run --rm -d --name eldoria-studio-refine -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          docker exec eldoria-studio-refine ollama pull qwen3-vl:2b-instruct
      - name: Qwen sculpts actual inherited Valoria tower vertices in genuine Blender
        run: |
          python3 tools/art-direction/full-studio/artist_loop.py \
            --brief 'Modify existing Valoria Tower production geometry. Inspect actual local mesh bounds and preview. Choose and apply your OWN sculpt brush to visibly change inherited stone edges, top profile, defensive crenellations or roof shape; preserve tower identity and do not generate a replacement. This is not a fixed tower template. Art approval is independent.' \
            --source Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb \
            --review tools/art-direction/full-studio/tests/valoria_tower_hero_review.json \
            --reference references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg \
            --out /tmp/eldoria-qwen-real-source-refinement \
            --max-cycles 1 --max-actions 2 --max-tokens 950 \
            --asset-category architecture --phase mesh_edit \
            --model qwen3-vl:2b-instruct
      - name: Inspect source edit integrity and Qwen original actions
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('/tmp/eldoria-qwen-real-source-refinement')
          manifest=json.loads((root/'full-studio-result.json').read_text())
          assert manifest['blender_real_execution'] and not manifest['art_approved']
          qwen=json.loads((root/'cycle-1/artist-plan.json').read_text())
          assert qwen['asset_decision'] in ('MODIFY','REUSE')
          assert all(a['op']!='execute_python' for a in qwen['actions'])
          proof=json.loads((root/'cycle-1/output/execution-proof.json').read_text())
          assert proof['source_sha256']==manifest['frozen_source_sha256']
          assert proof['matched_review_camera'] and proof['action_count']==len(qwen['actions'])
          assert proof['inherited_mesh_data_changed'], 'No inherited mesh vertex/topology data changed'
          assert any(s['op']=='sculpt_anchor' and s['geometry_changed'] and s['originals_changed']
                     for s in proof['execution']), 'No actual Qwen sculpt reached inherited mesh vertices'
          assert all(s['op']=='sculpt_anchor' for s in proof['execution']), 'Unexpected non-mesh edit operation'
          assert all(c['derived_from_source_object'] for c in json.loads(
              (root/'cycle-1/output/reusable-asset-catalog.json').read_text())['components'])
          assert pathlib.Path('Unity/Assets/Eldoria/Resources/Valoria/ProductionArt/CoherentFamilyV1/Valoria_Tower_CohV1.glb').is_file()
          assert not proof['art_approved']
          print('GENUINE_QWEN_REAUTHOR_EXISTING_BLENDER',len(qwen['actions']),proof['evaluated_triangles'])
          PY
      - name: Preserve full source revision proof including genuine Blender A/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-full-artist-actual-refinement
          path: /tmp/eldoria-qwen-real-source-refinement/
          if-no-files-found: warn
          retention-days: 21
