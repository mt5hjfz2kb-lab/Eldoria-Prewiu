name: Medir el uso gráfico en el primer viaje de WebKit
on:
  push:
    branches: [experiment/valoria-ciudad-region-unificada-20261121]
    paths: ['.github/workflows/valoria-primer-viaje-webkit.yml']
permissions:
  contents: read
  actions: read
env:
  BUILD_RUN: '45056463151'
  SOURCE: 27c1fa5793c8b53e11bee2b994ae12982a8accdd
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/valoria-modular25d
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="valoria-review-${SOURCE:0:7}-m2"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json body --jq .body)" = "Unity source $SOURCE · Actions $BUILD_RUN"
            exit 0
          fi
          repo="repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN"
          test "$(gh api "$repo" --jq .head_sha)" = "$SOURCE"
          for i in $(seq 1 90); do
            if gh api "$repo/artifacts" --jq '.artifacts[].name' | grep -Fxq valoria-region1-webgl; then break; fi
            test "$(gh api "$repo" --jq .status)" != completed || exit 1
            sleep 45
          done
          gh run download "$BUILD_RUN" -n valoria-region1-webgl -D player
          src=tools/valoria-modular25d
          python3 -m pip install --quiet UnityPy==1.25.4
          python3 "$src/pack-embedded-region-mips.py" player/Build/RegionModular.data.unityweb
          python3 "$src/bound-webgl-uploads.py" player/Build/RegionModular.framework.js.unityweb
          python3 "$src/package-mobile-review.py" player mobile "$src/review-mobile-template.html" "$SOURCE" 27c1fa5-m2
          mapfile -d '' -t assets < <(find mobile/r -type f -print0)
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "Valoria · Mundo y obras · ${SOURCE:0:7}" --notes "Unity source $SOURCE · Actions $BUILD_RUN" "${assets[@]}" mobile/assets.json mobile/index.html
  webkit:
    needs: package
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/valoria-modular25d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download valoria-review-27c1fa5-m2 -D flat
          python3 - <<'PY'
          import json, pathlib, shutil
          src=pathlib.Path('flat')
          dest=pathlib.Path('mobile')
          for rel,length in json.loads((src/'assets.json').read_text()).items():
              f=src/pathlib.Path(rel).name
              assert f.stat().st_size==length
              p=dest/'r/27c1fa5-m2'/rel
              p.parent.mkdir(parents=True,exist_ok=True)
              f.rename(p)
          shutil.copyfile(src/'index.html',dest/'index.html')
          PY
          python -m pip install -q playwright
          python -m playwright install webkit
          python -u tools/valoria-modular25d/first-travel-webkit.py
      - if: failure()
        run: |
          /usr/bin/log show --last 6m --style compact --predicate '(process CONTAINS[c] "WebKit.GPU" OR process == "kernel") AND (eventMessage CONTAINS[c] "GPU" OR eventMessage CONTAINS[c] "memory" OR eventMessage CONTAINS[c] "fault" OR eventMessage CONTAINS[c] "terminate")' | tail -65 || true
          ls -t ~/Library/Logs/DiagnosticReports | head -15 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primer-viaje-webkit
          path: evidence-webkit/
