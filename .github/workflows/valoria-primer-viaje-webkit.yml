name: Validar el primer viaje táctil en WebKit
on:
  push:
    branches: [experiment/valoria-ciudad-region-unificada-20261121]
    paths: ['.github/workflows/valoria-primer-viaje-webkit.yml']
permissions:
  contents: read
  actions: read
env:
  BUILD_RUN: '45040961859'
  SOURCE: 90e04b8f44740b894aacd79e8635b8502f8efd7f
jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/valoria-modular25d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download valoria-review-90e04b8 -D flat
          python3 - <<'PY'
          import json, pathlib, shutil
          src=pathlib.Path('flat')
          dest=pathlib.Path('mobile')
          for rel,length in json.loads((src/'assets.json').read_text()).items():
              f=src/pathlib.Path(rel).name
              assert f.stat().st_size==length
              p=dest/'r/90e04b8'/rel
              p.parent.mkdir(parents=True,exist_ok=True)
              f.rename(p)
          shutil.copyfile(src/'index.html',dest/'index.html')
          PY
          python -m pip install -q playwright
          python -m playwright install webkit
          python - <<'PY' &
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          import os
          os.chdir('mobile')
          class Serve(SimpleHTTPRequestHandler):
              def end_headers(self):
                  if self.path.endswith(('.unityweb','.gz')): self.send_header('Content-Encoding','gzip')
                  super().end_headers()
              def guess_type(self,p):
                  if '.wasm.' in p: return 'application/wasm'
                  if '.js.' in p: return 'application/javascript'
                  return super().guess_type(p)
          ThreadingHTTPServer(('127.0.0.1',8824),Serve).serve_forever()
          PY
          curl --retry 5 --retry-connrefused --noproxy "*" -fsS http://127.0.0.1:8824/index.html -o /dev/null
          python -u tools/valoria-modular25d/first-travel-webkit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primer-viaje-webkit
          path: evidence-webkit/
