name: "Bastion I | Existing mountain surface normals and source rock PBR Unity A/B"
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths:
      - '.github/workflows/valoria-bastion1-unity-horizon-reuse-ab.yml'
      - 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/Bastion1UnityHorizonReview.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-bastion1-existing-mountain-surface-unity-exclusive
  cancel-in-progress: false
jobs:
  static-source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure original source topology/gameplay/camera preservation
        shell: bash
        run: |
          set -eu
          p=Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/Bastion1UnityHorizonReview.cs
          grep -F 'triangles!=3300||vertices!=9896' "$p"
          grep -F 'SmoothSharedPositionNormals(altered)' "$p"
          grep -F 'EditorSceneManager.SaveScene(scene,Candidate,true)' "$p"
          grep -F 'new_models' "$p"
          ! grep -F 'new Mesh(' "$p"
          echo 'HORIZON_EXISTING_MODEL_ONLY_STATIC_PASS'
  unity-native-horizon:
    needs: static-source-guard
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Make installed GitHub Desktop Git available before checkout
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $found=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue|
              Sort-Object Name -Descending|
              ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $found){throw 'GitHub Desktop Git not installed'}
            $dir=Split-Path $found; $env:PATH="$dir;$env:PATH";Add-Content $env:GITHUB_PATH $dir
          }
          git --version
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: No overlap with Blender/Qwen or previous Unity runner
        shell: powershell
        run: |
          if(@(Get-Process blender -ErrorAction SilentlyContinue).Count -gt 0 -or
             @(Get-Process Unity -ErrorAction SilentlyContinue).Count -gt 0){
             throw 'Native artist/editor busy: refuse concurrent heavy PC work'
          }
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Existing Unity Editor missing'}
      - name: Recover unchanged originally playable Unity scene assets
        uses: actions/download-artifact@v4
        with:
          run-id: 38419031491
          name: bastion1-player-integration-38419031491
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/old_game_scene
      - name: Recover exact successful previous Unity-only finishlook candidate
        uses: actions/download-artifact@v4
        with:
          run-id: 38904014713
          name: bastion1-unity-only-finish-look-38904014713
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior_unity_finish
      - name: Stage historical game + exact finishlook visual baseline, never rebuild
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $original=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'old_game_scene') -Recurse -Filter 'Valoria.unity' -File |
            Where-Object {$_.FullName.Replace('\','/') -match '/ProductionSlice/Runtime/Valoria\.unity$'})
          if($original.Count -ne 1){throw 'Historical player scene not unique'}
          $unityRoot=$original[0].FullName -replace '[\\/]Assets[\\/]Eldoria[\\/]ProductionSlice[\\/]Runtime[\\/]Valoria\.unity$',''
          $source=Join-Path $unityRoot 'Assets/Eldoria'
          $target=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria'
          foreach($relative in @('ArtTests/Bastion1Assembly/Generated','ArtTests/Bastion1Assembly/GeneratedNormals',
                                 'ArtTests/Bastion1Assembly/Bastion1ReferenceAssembly.unity',
                                 'ProductionSlice/Runtime/Valoria.unity')){
            $src=Join-Path $source $relative;$dst=Join-Path $target $relative
            if(-not(Test-Path $src)){throw "Historical Unity resource missing: $relative"}
            New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
            if(Test-Path $dst){Remove-Item -LiteralPath $dst -Recurse -Force}
            Copy-Item -LiteralPath $src -Destination $dst -Recurse -Force
            if(Test-Path ($src+'.meta')){Copy-Item -LiteralPath ($src+'.meta') -Destination ($dst+'.meta') -Force}
          }
          $prior=Join-Path $env:RUNNER_TEMP 'prior_unity_finish'
          $candidate=@(Get-ChildItem $prior -Recurse -Filter 'Bastion1UnityFinishLookCandidate.unity' -File)
          if($candidate.Count -ne 1){throw "Exact prior Unity lookdev candidate missing: $($candidate.Count)"}
          $dest=Join-Path $target 'ArtTests/Bastion1Assembly'
          Copy-Item $candidate[0].FullName (Join-Path $dest $candidate[0].Name) -Force
          if(Test-Path ($candidate[0].FullName+'.meta')){Copy-Item ($candidate[0].FullName+'.meta') (Join-Path $dest ($candidate[0].Name+'.meta')) -Force}
          $variants=@(Get-ChildItem $prior -Recurse -Filter 'finishlook_*.mat' -File)
          if($variants.Count -ne 18){throw "Expected 18 proven Unity material variants; found $($variants.Count)"}
          $matDir=Join-Path $dest 'GeneratedFinishLook';New-Item -ItemType Directory -Force $matDir | Out-Null
          foreach($file in $variants){
            Copy-Item $file.FullName (Join-Path $matDir $file.Name) -Force
            if(Test-Path ($file.FullName+'.meta')){Copy-Item ($file.FullName+'.meta') (Join-Path $matDir ($file.Name+'.meta')) -Force}
          }
          Write-Host 'UNITY_HORIZON_RECOVERED_SOURCE run38419031491 lookdev_run38904014713 variants18 existing_only'
      - name: Capture native before/after of existing mountain normal/material adjustment
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'Bastion1UnityHorizon.log'
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',"$env:GITHUB_WORKSPACE/Unity",
            '-executeMethod','Eldoria.EditorTools.Bastion1UnityHorizonReview.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -Wait -PassThru
          Get-Content $log -Tail 120 -ErrorAction SilentlyContinue
          $out=Join-Path $env:GITHUB_WORKSPACE 'Bastion1UnityHorizonAB'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item $log (Join-Path $out 'Unity.log') -Force
          $actual=Join-Path $env:GITHUB_WORKSPACE 'Unity/Bastion1UnityHorizonAB'
          if(Test-Path $actual){Copy-Item "$actual/*" $out -Force}
          if($p.ExitCode -ne 0){throw "Unity existing mountain horizon review failed exit=$($p.ExitCode)"}
          foreach($item in @('before-landscape.png','after-landscape.png','before-mobile.png','after-mobile.png',
               'before-portrait.png','after-portrait.png','horizon-result.json')){
             if(-not(Test-Path (Join-Path $out $item))){throw "No native horizon evidence $item"}
          }
          Write-Host 'EXISTING_MOUNTAIN_NATIVE_AB_COMPLETE art_review_required=true'
      - name: Preserve candidate only, do not merge or publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bastion1-existing-mountain-surface-unity-${{ github.run_id }}
          path: |
            Bastion1UnityHorizonAB/**
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Bastion1UnityHorizonCandidate.unity*
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedHorizonLook/**
          if-no-files-found: warn
          retention-days: 30
