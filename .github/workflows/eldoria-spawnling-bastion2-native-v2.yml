name: Eldoria Spawnling B2 final native gate
# Source-refreshed job supersedes pre-consolidation queued run; keep current branch safe.
on:
  push:
    branches: ['art/spawnling-bastion2-finish-20261021']
    paths:
      - 'tools/spawnling-bastion2/native-request.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: spawnling-b2-windows-scene-owner
  cancel-in-progress: false
jobs:
  integrate-native:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            AGENTS.md
            pipeline
            Unity
            ArtSource/World4X/Spawnling_v1
            docs/evidence/spawnling-bastion2
      - name: Verify signed-off source and exclusive runner availability
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF_NAME -ne 'art/spawnling-bastion2-finish-20261021'){throw 'Wrong work branch'}
          $active=(Get-Content 'pipeline/active-workstreams.json' -Raw|ConvertFrom-Json).active
          if(@($active|Where-Object {$_.id -eq 'eldoria-spawnling-bastion2-finish-20261021' -and $_.status -eq 'active'}).Count -ne 1){throw 'Spawnling workstream claim missing'}
          if(@($active|Where-Object {$_.id -ne 'eldoria-spawnling-bastion2-finish-20261021' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 0){throw 'Another workstream owns Windows runner'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count -gt 0){throw 'Windows native process busy; do not interfere'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed canonical Unity editor missing'}
          $source='ArtSource/World4X/Spawnling_v1/Optimized_Source.glb'
          $digest=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if($digest -ne '2701e6f6a37920cbe6b434b903aa7b14283514f8276399d14bfffaece0edcc4a'){throw 'Tripo source hash changed'}
          $art=(Get-Content 'ArtSource/World4X/Spawnling_v1/Finished/author-evidence.json' -Raw|ConvertFrom-Json)
          $near=(Get-FileHash 'ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Near.glb' -Algorithm SHA256).Hash.ToLowerInvariant()
          $far=(Get-FileHash 'ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Far.glb' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($near -ne $art.near_sha256 -or $far -ne $art.far_sha256){throw 'Finished GLB changed after Blender evidence'}
          if($art.art_approved -or $art.tripo_credits_added -ne 0 -or $art.triangles_near_body -gt 12500 -or $art.triangles_far_body -gt 3200){throw 'Art preflight failed'}
          New-Item -ItemType Directory -Force docs/evidence/spawnling-bastion2|Out-Null
          Write-Host 'SPAWNLING_B2_ZERO_CREDIT_PREFLIGHT_PASS'
      - name: Import real PBR+LOD scene without changing game rules or hotspots
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'spawnling-unity-import.log'
          $unityProject=Join-Path $env:GITHUB_WORKSPACE 'Unity'
          $args=@('-batchmode','-force-d3d11','-buildTarget','Win64','-projectPath',$unityProject,
            '-executeMethod','Eldoria.SpawnlingBastion2.Editor.SpawnlingBastion2Integration.Integrate',
            '-logFile',$log)
          $proc=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $proc.WaitForExit(2400000)){
            & taskkill.exe /PID $proc.Id /T /F|Out-Null
            throw 'Own Unity import exceeded 40 minutes'
          }
          Copy-Item $log 'docs/evidence/spawnling-bastion2/native-import.log'
          if($proc.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'SPAWNLING_B2_SCENE_INTEGRATED' -Quiet)){
            Get-Content $log -Tail 130
            throw "Actual Unity scene import failed with exit $($proc.ExitCode)"
          }
          $p='docs/evidence/spawnling-bastion2/native-integration.json'
          if(-not(Test-Path $p)){throw 'Native import report missing'}
          $data=(Get-Content $p -Raw|ConvertFrom-Json)
          if($data.status -ne 'SCENE_INTEGRATED_NATIVE_GAMEPLAY_PROBE_REQUIRED' -or
            -not $data.hotspot_preserved -or -not $data.gameplay_unchanged -or
            $data.visual_colliders -ne 0 -or
            $data.near_triangles -gt 13000 -or $data.far_triangles -gt 3300){
              throw 'Native visual-only contract failed'
          }
          foreach($name in @($data.captures)){if(-not(Test-Path "docs/evidence/spawnling-bastion2/$name")){throw "Missing real Unity image $name"}}
          Write-Host 'SPAWNLING_B2_SAVED_SCENE_AND_REAL_UNITY_CAPTURES_PASS'
      - name: Replay exact canonical Bastion I-II buttons combat rewards and save
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'spawnling-unity-probe.log'
          $unityProject=Join-Path $env:GITHUB_WORKSPACE 'Unity'
          $args=@('-batchmode','-force-d3d11','-buildTarget','Win64','-projectPath',$unityProject,
            '-executeMethod','Eldoria.ReferenceClean.Editor.ValoriaIntegrationBuild.ValidateCurrent',
            '-logFile',$log)
          $proc=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $proc.WaitForExit(2400000)){
            & taskkill.exe /PID $proc.Id /T /F|Out-Null
            throw 'Own canonical I-II gameplay probe exceeded 40 minutes'
          }
          Copy-Item $log 'docs/evidence/spawnling-bastion2/native-play.log'
          $p='docs/evidence/valoria-reference-clean/integration-result.json'
          if(-not(Test-Path $p)){throw 'Actual Valoria integration probe missing'}
          $e=(Get-Content $p -Raw|ConvertFrom-Json)
          if($proc.ExitCode -ne 0 -or $e.status -ne 'INTEGRATION_PASS_ART_REVIEW_REQUIRED'){
            Get-Content $log -Tail 100
            throw "Canonical I-II real raycast/save probe failed $($e.error)"
          }
          if(@($e.checks).Count -lt 30){throw 'Canonical I-II gameplay coverage incomplete'}
          $e|ConvertTo-Json -Depth 16|Set-Content 'docs/evidence/spawnling-bastion2/native-full-i-ii-result.json'
          Write-Host "SPAWNLING_B2_FULL_I_II_PLAY_SAVE_PASS checks=$(@($e.checks).Count)"
      - name: Commit only isolated asset and saved game scene after green native QA
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Unity/Assets/Eldoria/SpawnlingBastion2
          git add Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity
          git add docs/evidence/spawnling-bastion2
          if(git diff --cached --quiet){throw 'No actual integrated scene and assets changed'}
          git commit -m 'feat(spawnling): actual Bastion II enemy visual integrated with I-II QA'
          git fetch origin art/spawnling-bastion2-finish-20261021
          if($LASTEXITCODE){throw 'Could not refresh current feature-branch head'}
          git rebase 'origin/art/spawnling-bastion2-finish-20261021'
          if($LASTEXITCODE){throw 'Concurrent source edit conflict; do not force-push or overwrite work'}
          git push origin 'HEAD:refs/heads/art/spawnling-bastion2-finish-20261021'
          Write-Host 'SPAWNLING_B2_GREEN_NATIVE_BRANCH_COMMITTED'
      - name: Preserve exact authentic Unity screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spawnling-b2-unity-proof
          path: |
            docs/evidence/spawnling-bastion2/
          if-no-files-found: warn
          retention-days: 14
