name: Studio high-impact March design pilot
on:
  push:
    branches: [candidate/corona-march-high-impact-studio-20261126]
    paths: ['.github/workflows/corona-march-high-impact-studio.yml']
permissions:
  contents: read
  actions: read
jobs:
  studio-director-and-challenger:
    if: >-
      ${{ github.run_attempt == 1 && github.event.before == '41c124f4b9ef10cd9b4a9d87562a7d2727b730b6' && github.event.head_commit.message == 'Studio: commission one high-impact March redesign with exact evidence and one-cent remaining cap' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/corona-art-iteration
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1657b2caa6b1a955319538ce3a8b2906398599b3
          path: studio-source
          sparse-checkout: tools/openai-development-studio
          persist-credentials: false
      - name: Retrieve exact source-pinned real march and reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          gh run download 45851071206 --repo "$GITHUB_REPOSITORY" --name recovery-ciudad-region-recorrido --dir actual
          gh run download 45851071206 --repo "$GITHUB_REPOSITORY" --name corona-final-exact-revision-calibrated-scorecard --dir scores
          gh run download 45812100129 --repo "$GITHUB_REPOSITORY" --name corona-agent-art-plan --dir refs
          python3 -m py_compile tools/corona-art-iteration/march_high_impact_studio.py
      - name: One real studio director and technical challenge within remaining reservation
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/corona-art-iteration/march_high_impact_studio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corona-march-high-impact-studio-plan
          path: studio-march/
          if-no-files-found: warn
