name: "[R&D] Valoria Hunyuan3D Gate Capability v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-hunyuan3d-gate-capability-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install clients and Blender
        run: |
          python -m pip install --quiet "gradio_client>=1.4" pillow
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Generate Gate with Hunyuan3D 2.1 ZeroGPU
        env:
          OUT_DIR: /tmp/hunyuan-proof
        run: python tools/valoria-hunyuan3d-space-proof.py
      - name: Render generated model evidence
        run: |
          cat > /tmp/hunyuan-proof/render.py <<'PY'
          import bpy, os, math, glob
          from mathutils import Vector
          root="/tmp/hunyuan-proof"
          models=[]
          for ext in ("*.glb","*.gltf","*.obj","*.ply","*.stl"): models += glob.glob(os.path.join(root,ext))
          if not models: raise RuntimeError("No generated model")
          p=models[0]
          bpy.ops.wm.read_factory_settings(use_empty=True)
          if p.endswith((".glb",".gltf")): bpy.ops.import_scene.gltf(filepath=p)
          elif p.endswith(".obj"): bpy.ops.wm.obj_import(filepath=p)
          elif p.endswith(".ply"): bpy.ops.wm.ply_import(filepath=p)
          elif p.endswith(".stl"): bpy.ops.wm.stl_import(filepath=p)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
          if not meshes: raise RuntimeError("No meshes")
          pts=[o.matrix_world@Vector(c) for o in meshes for c in o.bound_box]
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene; sc.render.engine="BLENDER_EEVEE"; sc.render.resolution_x=900; sc.render.resolution_y=900; sc.render.resolution_percentage=100
          sc.world.color=(.04,.04,.04)
          bpy.ops.object.light_add(type="AREA",location=(center.x-span,center.y-span,center.z+span*1.5)); bpy.context.object.data.energy=1200; bpy.context.object.data.size=span
          bpy.ops.object.camera_add(); cam=bpy.context.object; sc.camera=cam; cam.data.lens=55
          for name,v in [("front",(0,-1.6,.45)),("three-quarter",(1.15,-1.25,.7)),("side",(1.6,0,.45))]:
              cam.location=center+Vector(v)*span; cam.rotation_euler=(center-cam.location).to_track_quat("-Z","Y").to_euler()
              sc.render.filepath=os.path.join(root,name+".png"); bpy.ops.render.render(write_still=True)
          open(os.path.join(root,"render-report.txt"),"w").write(f"meshes={len(meshes)}\nbounds={tuple(dims)}\n")
          PY
          blender -b --python /tmp/hunyuan-proof/render.py
          test -s /tmp/hunyuan-proof/front.png
          test -s /tmp/hunyuan-proof/three-quarter.png
          test -s /tmp/hunyuan-proof/side.png
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-hunyuan3d-gate-capability-v1
          path: /tmp/hunyuan-proof
          if-no-files-found: error
          retention-days: 30
