name: "[R&D] Valoria Hunyuan3D Gate Capability v1"

on:
  workflow_dispatch:

# Quarantined R&D/capability workflow: manual-only. Production use requires canonical planner/fallback routing plus explicit owner dispatch.
permissions:
  contents: read

jobs:
  hunyuan-gate-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-gate.png
          sparse-checkout-cone-mode: false

      - name: Install clients and render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx0 libx11-6
          python -m pip install --upgrade pip
          python -m pip install "gradio_client>=1.10,<2" pillow requests

      - name: Prepare isolated semantic gate input
        run: |
          mkdir -p /tmp/hunyuan/input /tmp/hunyuan/output /tmp/hunyuan/evidence
          python - <<'PY'
          from PIL import Image, ImageChops
          src="art-source/valoria/lookdev/golden-slice-v1/camera-first-reset-target-v1/semantic-gate.png"
          im=Image.open(src).convert("RGBA")
          alpha=im.getchannel("A")
          bbox=alpha.getbbox()
          if bbox is None or bbox==(0,0,*im.size):
              bg=Image.new("RGBA",im.size,im.getpixel((0,0)))
              bbox=ImageChops.difference(im,bg).convert("L").getbbox()
          if bbox is None:
              raise SystemExit("No isolatable semantic gate")
          l,t,r,b=bbox
          pad=max(12,int(max(r-l,b-t)*0.06))
          bbox=(max(0,l-pad),max(0,t-pad),min(im.width,r+pad),min(im.height,b+pad))
          crop=im.crop(bbox)
          w,h=crop.size; side=max(w,h)
          canvas=Image.new("RGBA",(side,side),(255,255,255,0))
          canvas.alpha_composite(crop,((side-w)//2,(side-h)//2))
          canvas=canvas.resize((768,768),Image.Resampling.LANCZOS)
          out="/tmp/hunyuan/input/eldoria-semantic-gate.png"
          canvas.save(out)
          open("/tmp/hunyuan/evidence/input-spec.txt","w").write(
              f"source={src}\nsource_size={im.size}\nisolation_bbox={bbox}\nprepared={canvas.size}\ncredits=0\nunity_touched=false\n"
          )
          PY
          sha256sum /tmp/hunyuan/input/eldoria-semantic-gate.png | tee /tmp/hunyuan/evidence/input.sha256

      - name: Probe and generate with official Hunyuan3D-2.1 Space
        id: hunyuan
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/hunyuan/evidence/hunyuan.log
          import os, shutil, json
          from gradio_client import Client, handle_file

          client=Client("tencent/Hunyuan3D-2.1", verbose=True)
          api=client.view_api(return_format="dict")
          print("API",api)
          endpoints=(api or {}).get("named_endpoints",{})
          print("ENDPOINTS",list(endpoints))

          candidates=[]
          for ep,spec in endpoints.items():
              ps=spec.get("parameters",[])
              names=[p.get("parameter_name") for p in ps]
              returns=spec.get("returns",[])
              text=(ep+" "+str(names)+" "+str(returns)).lower()
              if "image" in names and ("shape" in ep.lower() or "generate" in ep.lower() or "glb" in text or "model" in text):
                  candidates.append((ep,spec))
          print("CANDIDATES",[x[0] for x in candidates])
          if not candidates:
              raise SystemExit("No usable Hunyuan generation endpoint advertised")

          image="/tmp/hunyuan/input/eldoria-semantic-gate.png"
          last_error=None
          result=None
          used_ep=None
          for ep,spec in candidates:
              params=spec.get("parameters",[])
              kwargs={}
              for p in params:
                  n=p.get("parameter_name"); d=p.get("parameter_default")
                  if n=="caption":
                      kwargs[n]=None
                  elif n in ("image","input_image"):
                      kwargs[n]=handle_file(image)
                  elif n in ("mv_image_front","mv_image_back","mv_image_left","mv_image_right"):
                      kwargs[n]=None
                  elif n in ("steps","num_steps","num_inference_steps"):
                      kwargs[n]=5
                  elif n in ("guidance_scale","cfg_scale"):
                      kwargs[n]=5.0
                  elif n=="seed":
                      kwargs[n]=42
                  elif n=="octree_resolution":
                      kwargs[n]=256
                  elif n in ("check_box_rembg","remove_background"):
                      kwargs[n]=True
                  elif n=="num_chunks":
                      kwargs[n]=8000
                  elif n=="randomize_seed":
                      kwargs[n]=False
                  elif n and d is not None:
                      kwargs[n]=d
              try:
                  print("TRY",ep,kwargs)
                  result=client.predict(api_name=ep,**kwargs)
                  print("RESULT",ep,repr(result))
                  used_ep=ep
                  break
              except Exception as e:
                  last_error=repr(e)
                  print("ERROR",ep,last_error)
          if result is None:
              raise SystemExit("All Hunyuan generation endpoints failed: "+str(last_error))

          vals=[]
          def walk(x):
              if isinstance(x,str): vals.append(x)
              elif isinstance(x,(list,tuple)):
                  for v in x: walk(v)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
          walk(result)

          copied=[]
          for p in vals:
              if os.path.isfile(p):
                  ext=os.path.splitext(p)[1].lower()
                  if ext in (".glb",".gltf",".obj",".ply"):
                      dst="/tmp/hunyuan/output/hunyuan"+ext
                      if not os.path.exists(dst):
                          shutil.copy2(p,dst); copied.append(dst)
          print("COPIED",copied)
          open("/tmp/hunyuan/evidence/result.txt","w").write(
              f"endpoint={used_ep}\ncredits=0\nfiles={copied}\n"
          )
          if not copied:
              raise SystemExit("Hunyuan returned no local mesh file")
          PY

      - name: Render generated mesh evidence
        if: steps.hunyuan.outcome == 'success'
        run: |
          cat > /tmp/hunyuan/render.py <<'PY'
          import bpy, os, math
          from mathutils import Vector
          root="/tmp/hunyuan/output"; ev="/tmp/hunyuan/evidence"
          files=[os.path.join(root,f) for f in os.listdir(root) if f.lower().endswith((".glb",".gltf",".obj"))]
          if not files: raise RuntimeError("No mesh file")
          p=files[0]
          bpy.ops.wm.read_factory_settings(use_empty=True)
          if p.lower().endswith((".glb",".gltf")): bpy.ops.import_scene.gltf(filepath=p)
          else: bpy.ops.wm.obj_import(filepath=p)
          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH" and not o.hide_render]
          if not meshes: raise RuntimeError("No mesh imported")
          pts=[]
          for o in meshes:
              for c in o.bound_box: pts.append(o.matrix_world @ Vector(c))
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene; sc.render.engine="BLENDER_EEVEE"
          sc.render.resolution_x=1000; sc.render.resolution_y=1000; sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(0.045,0.045,0.045)
          bpy.ops.mesh.primitive_plane_add(size=span*3,location=(center.x,center.y,mn.z-span*.015))
          gm=bpy.data.materials.new("Ground"); gm.diffuse_color=(.14,.14,.14,1); bpy.context.object.data.materials.append(gm)
          bpy.ops.object.light_add(type="SUN",location=center+Vector((span,-span,span)))
          sun=bpy.context.object; sun.data.energy=2.2; sun.rotation_euler=(math.radians(35),0,math.radians(135))
          bpy.ops.object.light_add(type="AREA",location=center+Vector((-span*.7,-span*.9,span*.8)))
          area=bpy.context.object; area.data.energy=650; area.data.size=span
          def track(o,t): o.rotation_euler=(t-o.location).to_track_quat("-Z","Y").to_euler()
          bpy.ops.object.camera_add(); cam=bpy.context.object; cam.data.lens=58; sc.camera=cam
          for name,v in [("front",Vector((0,-1.8,.18))),("three-quarter",Vector((1.2,-1.45,.35))),("back",Vector((0,1.8,.18))),("side",Vector((1.8,0,.18)))]:
              cam.location=center+v*span; track(cam,center+Vector((0,0,dims.z*.05)))
              sc.render.filepath=os.path.join(ev,f"mesh-{name}.png"); bpy.ops.render.render(write_still=True)
          tris=sum(sum(max(0,len(poly.vertices)-2) for poly in o.data.polygons) for o in meshes)
          with open(os.path.join(ev,"mesh-report.txt"),"w") as f:
              f.write(f"meshes={len(meshes)}\ntriangles_approx={tris}\nbounds={tuple(dims)}\nsource=tencent/Hunyuan3D-2.1\ncredits=0\n")
          PY
          blender -b --python /tmp/hunyuan/render.py
          test -s /tmp/hunyuan/evidence/mesh-front.png
          test -s /tmp/hunyuan/evidence/mesh-three-quarter.png

      - name: Require real evidence
        run: |
          test "${{ steps.hunyuan.outcome }}" = "success"
          test -s /tmp/hunyuan/evidence/mesh-front.png
          test -s /tmp/hunyuan/evidence/mesh-three-quarter.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-hunyuan3d-gate-capability-v1
          path: |
            /tmp/hunyuan/evidence
            /tmp/hunyuan/output
            /tmp/hunyuan/input/eldoria-semantic-gate.png
          retention-days: 14
