name: "[PROOF] Valoria Camera-First Orthographic Plane v1"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/camera-first-orthographic-plane-v1-request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          sparse-checkout: |
            references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
            pipeline/valoria-production-art-reset-run-request.json
            pipeline/camera-first-orthographic-plane-v1-request.json
            tools/prove-camera-first-orthographic-plane-v1.py
            docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-orthographic-plane-v1
          sparse-checkout-cone-mode: false
      - run: pip install "numpy<2" pillow
      - name: Generate official-view orthographic proof
        run: |
          python tools/prove-camera-first-orthographic-plane-v1.py
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-orthographic-plane-v1/UNITY-golden-close.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-orthographic-plane-v1/orthographic-plane-report.json
      - name: Persist orthographic proof
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-orthographic-plane-v1
          if ! git diff --cached --quiet; then
            git commit -m "Persist camera-first orthographic reference-plane proof"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-camera-first-orthographic-plane-v1
          path: docs/evidence/valoria-golden-lookdev-slice-v1/camera-first-orthographic-plane-v1/*
          if-no-files-found: error
          retention-days: 30
