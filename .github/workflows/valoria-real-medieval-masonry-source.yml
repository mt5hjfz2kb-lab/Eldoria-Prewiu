name: "[ART STONE CC0] Real medieval limestone masonry PBR photographs"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-real-medieval-masonry-source.yml'
      - 'tools/valoria-modular-fortress/download_cc0_medieval_stone.py'
permissions:
  contents: read
jobs:
  verify-real-castle-masonry-photography:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download only 1K licensed professional real medieval masonry and paving PBR maps
        run: python3 tools/valoria-modular-fortress/download_cc0_medieval_stone.py "$RUNNER_TEMP/eldoria-medieval-stone-maps"
      - name: Confirm no missing source or paid texture
        run: |
          python3 - <<'PY'
          import pathlib,json,os
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'eldoria-medieval-stone-maps'
          m=json.loads((path/'source_manifest.json').read_text())
          assert m['license']=='CC0 1.0' and m['cost_eur']==0
          for key in ['medieval_blocks_02','medieval_blocks_03','medieval_blocks_05']:
            assert 'Diffuse' in m['maps'][key]['maps'],key
          print('THREE_REAL_PBR_MEDIEVAL_WALL_SOURCES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-3-real-medieval-wall-pbr-${{ github.run_id }}
          path: ${{ runner.temp }}/eldoria-medieval-stone-maps/**
          retention-days: 30
          if-no-files-found: error
