name: Tripo art brain source preflight (zero credits)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/tripo-art-brain/**"
      - "pipeline/tripo-art-brain/**"
      - ".github/workflows/tripo-art-brain-preflight.yml"

permissions:
  contents: read

concurrency:
  group: tripo-art-brain-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-saved-art:
    name: Verify saved sources and existing artist handoff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUT: /tmp/eldoria-tripo-art-brain
    steps:
      - name: Sparse checkout only existing source assets and zero-credit tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/tripo-art-brain/
            tools/plan-art-production.mjs
            tools/art-direction/ai-authoring/
            tools/art-direction/VALORIA_LOCAL_ARTIST_SYSTEM_PROMPT.md
            pipeline/tripo-art-brain/
            ArtSource/World4X/
            docs/evidence/spawnling-bastion2/native-integration.json
            Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Valoria_City_World_UI.unity

      - name: Test fail-closed zero-credit protection (no API credentials)
        shell: bash
        run: node --test tools/tripo-art-brain/*.test.mjs

      - name: Audit immutable GLB originals, optimizations and genuine Unity QA
        shell: bash
        run: |
          mkdir -p "$OUT"
          node tools/tripo-art-brain/preflight.mjs audit all > "$OUT/source-audit.json"
          for id in spawnling boar focus; do
            node tools/tripo-art-brain/preflight.mjs prepare "$id" --out "$OUT/$id"
            node tools/plan-art-production.mjs "$OUT/$id/art-production-request.json" "$OUT/$id/canonical-planner.json" > "$OUT/$id/planner-console.txt"
          done
          for id in spawnling boar; do
            node tools/tripo-art-brain/rig-check-v3.mjs "$id" --dry-run > "$OUT/$id/free-rig-check-dry-run.json"
          done

      - name: Inspect the ACTUAL finished Engendro Blender mesh (no authoring, no Windows)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          mkdir -p "$OUT/spawnling/blender-context"
          blender --background --disable-autoexec -t 2 --python-exit-code 1 \
            --python tools/art-direction/ai-authoring/execute_artist_plan.py -- \
            --source ArtSource/World4X/Spawnling_v1/Finished/Spawnling_B2_Finished.blend \
            --inspect --inspect-target-object Spawnling_Near_Authored \
            --out "$OUT/spawnling/blender-context" \
            > "$OUT/spawnling/blender-context/blender-inspection.log" 2>&1
          node tools/tripo-art-brain/verify-mesh-context.mjs \
            "$OUT/spawnling/blender-context/mesh-context.json" \
            "$OUT/spawnling/blender-context/verified-source-context.json" \
            > "$OUT/spawnling/blender-context/context-verification.log"
          # Test real source metadata entering existing Qwen author_brief.py. A
          # local MOCK Ollama response is used; no Qwen inference is implied.
          TRIPO_SOURCE_MESH_CONTEXT="$OUT/spawnling/blender-context/mesh-context.json" \
            node --test tools/tripo-art-brain/artist-context.test.mjs \
            > "$OUT/spawnling/blender-context/qwen-mesh-interface-MOCK-test.log"
          echo "REAL_BLENDER_SOURCE_CONTEXT_AND_MOCK_QWEN_INPUT_PASS"

      - name: Verify current Qwen artist accepts this context without model inference
        shell: bash
        run: |
          python3 tools/art-direction/ai-authoring/author_brief.py --help > "$OUT/qwen-interface-help.txt"
          grep -F -- '--inventory' "$OUT/qwen-interface-help.txt"
          grep -F -- '--reference' "$OUT/qwen-interface-help.txt"
          grep -F -- '--unity-before' "$OUT/qwen-interface-help.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const id of ['spawnling', 'boar', 'focus']) {
            const txt = fs.readFileSync(path.join(process.env.OUT,id,'qwen-inventory.txt'),'utf8');
            if (txt.length > 4000) throw new Error(id+': generated Qwen context would be truncated by artist --inventory');
            if (!txt.includes('SHA256') || !txt.includes('Art approval=false') ||
                !txt.includes('External Tripo API is NOT authorized')) {
              throw new Error(id+': incomplete source-locked artistic context');
            }
          }
          console.log('EXISTING_QWEN_INTERFACE_COMPATIBLE_ZERO_INFERENCE');
          NODE

      - name: Verify the art director remains independent and Tripo spending is blocked
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const out = process.env.OUT;
          const audit = JSON.parse(fs.readFileSync(path.join(out, 'source-audit.json')));
          if (audit.status !== 'ZERO_CREDIT_SOURCE_AUDIT_PASS' || audit.results.length !== 3) {
            throw new Error('Incomplete audit result');
          }
          for (const id of ['spawnling', 'boar', 'focus']) {
            const p = path.join(out, id);
            const report = JSON.parse(fs.readFileSync(path.join(p, 'preflight-report.json')));
            const req = JSON.parse(fs.readFileSync(path.join(p, 'art-production-request.json')));
            const planner = JSON.parse(fs.readFileSync(path.join(p, 'canonical-planner.json')));
            if (req.enabled || req.allow_tripo || req.credit_authorization.approved ||
                req.credit_authorization.authorized_credit_cost !== 0 ||
                report.art_approved || report.mobile_profile_pass ||
                report.follow_up_advanced_tripo.ready_for_paid_call ||
                report.qwen_inference_run !== 'NOT_EXECUTED' ||
                (!planner.stop_before_credit_spend && req.profile === 'animated_asset') ||
                planner.tripo_allowed || planner.credit_authorized) {
              throw new Error(id + ': paid or visual gate in unsafe state');
            }
          }
          console.log('THREE_SOURCES_VERIFIED: ZERO_CREDITS, NO_FALSE_ART_APPROVAL, NO_RUNTIME_CHANGES');
          NODE

      - name: Preserve zero-credit evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripo-art-brain-zero-credit-${{ github.run_id }}
          path: ${{ env.OUT }}/
          retention-days: 14
          if-no-files-found: error
