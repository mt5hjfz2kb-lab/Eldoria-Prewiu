name: Eldoria isolated Aldric Lyra mastery regression (Ubuntu)
on:
  push:
    branches:
      - fix/vigilants-hero-mastery-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mastery-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/eldoria-v41
            tools/early-retention
            tools/bastion-iii
            tools/bastion-iv-v
            Unity/Assets/Eldoria/Scripts/Domain
            Unity/Assets/Eldoria/Scripts/Application
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/Core
            Unity/Assets/Eldoria/UI/ValoriaRoyalHUDV1/Bindings
            Unity/Assets/Eldoria/Resources/EldoriaRetention
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile real domain and compare 434 historical Python-Csharp fixtures
        run: dotnet run --configuration Release --project tools/eldoria-v41/EldoriaV41.Contracts.Tests.csproj
      - name: Execute real LocalGateway plus Guardian 25 Aldric Lyra reward regression
        run: dotnet run --configuration Release --project tools/eldoria-v41/GatewaySmoke.csproj
      - name: Verify early retention economy and hero experience
        run: dotnet run --configuration Release --project tools/early-retention/Smoke.csproj
      - name: Test real continuous Bastion I-V with established gateway
        run: dotnet run --configuration Release --project tools/eldoria-v41/ContinuousJourney.csproj
      - name: Test full I-V with V4.1 campaign resolver
        env:
          ELDORIA_V41_CAMPAIGN_PROBE: '1'
        run: dotnet run --configuration Release --project tools/eldoria-v41/ContinuousJourney.csproj
