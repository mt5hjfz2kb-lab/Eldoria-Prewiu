name: "[DIAGNOSTIC] Golden Self-Hosted Ping"

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/golden-selfhosted-ping.json'

permissions:
  contents: read

jobs:
  ping:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 5
    steps:
      - name: Runner alive
        shell: powershell
        run: |
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "os=$env:RUNNER_OS"
          Get-Date
