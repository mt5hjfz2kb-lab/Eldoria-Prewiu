name: "[R&D] Valoria Qwen Multi-Angle Gate v1"
on:
  push:
    branches: [main]
    paths:
      - "pipeline/valoria-qwen-multi-angle-gate-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --quiet "gradio_client>=1.4" pillow
      - name: Generate controlled Gate views
        env:
          OUT_DIR: /tmp/qwen-angles-proof
        run: python tools/valoria-qwen-multi-angle-proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-qwen-multi-angle-gate-v1
          path: /tmp/qwen-angles-proof
          if-no-files-found: error
          retention-days: 30
