name: Forja Oscura Windows project source diagnosis
on:
  push:
    branches: [feature/forja-oscura-native-proof-20261107]
    paths: [tools/forja-oscura/diagnostic-request.txt]
permissions:
  contents: read
jobs:
  native-workspace-diagnostic:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 8
    steps:
      - name: Inspect ONLY Eldoria workspace project candidates, no user files or Unity launch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $roots=@($env:GITHUB_WORKSPACE, $env:RUNNER_WORKSPACE)
          $known='valoria-layered-source','forja-source','forja-kit-source','Unity','Eldoria-Prewiu'
          $entries=@()
          foreach($root in $roots){
            if(-not(Test-Path $root)){continue}
            $candidates=@($root)
            foreach($name in $known){
              $candidates+=Join-Path $root $name
            }
            foreach($base in ($candidates | Sort-Object -Unique)){
              if(-not(Test-Path $base)){continue}
              $proj=Join-Path $base 'Unity'
              if(Test-Path (Join-Path $base 'ProjectSettings/ProjectVersion.txt')){$proj=$base}
              $pv=Join-Path $proj 'ProjectSettings/ProjectVersion.txt'
              $scene=Join-Path $proj 'Assets/Eldoria/ArtTests/ValoriaReferenceClean/ArtVariants/SawmillCompleted/Valoria_SawmillCompleted.unity'
              $source=Join-Path $proj 'Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/Editor/ValoriaIntegrationBuild.cs'
              $sdk=Join-Path $proj 'Packages/manifest.json'
              $git=Join-Path $base '.git'
              $hash=''
              if(Test-Path $source) {$hash=((& git hash-object $source) -join '').Trim()}
              $entries+=@{candidate=$base;git=(Test-Path $git);projectVersion=(Test-Path $pv);
                version=if(Test-Path $pv){(Get-Content $pv -First 1)}else{''};
                scene=(Test-Path $scene);builder=(Test-Path $source);builderGitBlob=$hash;
                packageManifest=(Test-Path $sdk)}
            }
          }
          $result=@{runner=$env:RUNNER_NAME;workspace=$env:GITHUB_WORKSPACE;
            candidates=$entries;unityEditorConfigured=[bool]$env:UNITY_EDITOR_PATH;
            unityEditorExists=[bool]($env:UNITY_EDITOR_PATH -and (Test-Path $env:UNITY_EDITOR_PATH));
            currentOwnedUnityProcesses=@(Get-Process Unity -ErrorAction SilentlyContinue).Count}
          $path=Join-Path $env:RUNNER_TEMP 'forja-source-diagnostic.json'
          $result|ConvertTo-Json -Depth 10|Set-Content -Path $path -Encoding UTF8
          $result|ConvertTo-Json -Depth 10|Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: forja-source-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/forja-source-diagnostic.json
          retention-days: 7
          if-no-files-found: error
