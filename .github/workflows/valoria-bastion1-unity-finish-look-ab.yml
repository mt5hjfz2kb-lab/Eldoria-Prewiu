name: "Bastion I | Unity native existing-scene lookdev A/B (no new models)"
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths:
      - '.github/workflows/valoria-bastion1-unity-finish-look-ab.yml'
      - 'Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/Bastion1UnityFinishLookReview.cs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-bastion1-unity-only-lookdev-exclusive
  cancel-in-progress: false
jobs:
  validate-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate only material and lighting of the original playable scene
        shell: bash
        run: |
          set -eu
          f=Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Editor/Bastion1UnityFinishLookReview.cs
          grep -F 'EditorSceneManager.OpenScene(Original' "$f"
          grep -F 'EditorSceneManager.SaveScene(scene,Candidate,true)' "$f"
          grep -F 'new_meshes' "$f"
          grep -F 'RetintOriginalMaterials' "$f"
          grep -F 'ART_REVIEW_REQUIRED' "$f"
          echo 'LOOKDEV_STATIC_CONTRACT_PASS no new meshes no native publication'
  native-finish-look:
    needs: validate-scope
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    steps:
      - name: Resolve already installed Git from GitHub Desktop
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $root=Join-Path $env:LOCALAPPDATA 'GitHubDesktop'
            $found=Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $found){throw 'Installed GitHub Desktop Git missing'}
            $dir=Split-Path $found
            $env:PATH="$dir;$env:PATH"
            Add-Content $env:GITHUB_PATH $dir
          }
          git --version
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Exclusive Windows visual reviewer, never overlap native Blender
        shell: powershell
        run: |
          $blender=@(Get-Process blender -ErrorAction SilentlyContinue)
          $unity=@(Get-Process Unity -ErrorAction SilentlyContinue)
          if($blender.Count -gt 0 -or $unity.Count -gt 0){
            throw "RUNNER_BUSY blender=$($blender.Count) unity=$($unity.Count)"
          }
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){
            throw 'Existing Unity executable unavailable'
          }
      - name: Recover exact previously playable native scene and original resources
        uses: actions/download-artifact@v4
        with:
          run-id: 38419031491
          name: bastion1-player-integration-38419031491
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bastion_original
      - name: Stage original Unity scene; never generate geometry nor touch native source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'bastion_original') -Recurse -Filter 'Valoria.unity' -File |
            Where-Object {$_.FullName.Replace('\','/') -match '/ProductionSlice/Runtime/Valoria\.unity$'})
          if($files.Count -ne 1){throw "Exact historical scene missing or ambiguous $($files.Count)"}
          $unityRoot=$files[0].FullName -replace '[\\/]Assets[\\/]Eldoria[\\/]ProductionSlice[\\/]Runtime[\\/]Valoria\.unity$',''
          $source=Join-Path $unityRoot 'Assets/Eldoria'
          $target=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria'
          foreach($relative in @(
            'ArtTests/Bastion1Assembly/Generated',
            'ArtTests/Bastion1Assembly/GeneratedNormals',
            'ArtTests/Bastion1Assembly/Bastion1ReferenceAssembly.unity',
            'ProductionSlice/Runtime/Valoria.unity'
          )){
            $src=Join-Path $source $relative
            $dst=Join-Path $target $relative
            if(-not(Test-Path $src)){throw "Unmodified original source missing: $relative"}
            New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
            if(Test-Path $dst){Remove-Item -LiteralPath $dst -Recurse -Force}
            Copy-Item -LiteralPath $src -Destination $dst -Recurse -Force
            if(Test-Path ($src+'.meta')){Copy-Item -LiteralPath ($src+'.meta') -Destination ($dst+'.meta') -Force}
          }
          Write-Host 'PLAYABLE_SOURCE_RESTORED 38419031491; no artist Blender execution'
      - name: Capture BEFORE/AFTER in actual Unity 6000.3.23f1
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'Bastion1NativeFinishLook.log'
          $args=@('-batchmode','-force-d3d11','-quit','-projectPath',"$env:GITHUB_WORKSPACE/Unity",
            '-executeMethod','Eldoria.EditorTools.Bastion1UnityFinishLookReview.Capture','-logFile',$log)
          $proc=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          Get-Content $log -Tail 105 -ErrorAction SilentlyContinue
          $review=Join-Path $env:GITHUB_WORKSPACE 'Bastion1UnityFinishLookReview'
          New-Item -ItemType Directory -Force $review | Out-Null
          Copy-Item $log (Join-Path $review 'Unity.log') -Force
          $dir=Join-Path $env:GITHUB_WORKSPACE 'Unity/Bastion1UnityFinishLookReview'
          if(Test-Path $dir){Copy-Item "$dir/*" $review -Force}
          if($proc.ExitCode -ne 0){throw "Native Unity finish look failed $($proc.ExitCode)"}
          foreach($item in @('before-landscape.png','after-landscape.png','before-mobile.png','after-mobile.png',
              'before-portrait.png','after-portrait.png','finishlook-result.json')){
            if(-not(Test-Path (Join-Path $review $item))){throw "Missing native evidence $item"}
          }
          Write-Host 'UNITY_FINISH_LOOK_NATIVE_AB_COMPLETE evidence_only=true'
      - name: Validate A/B camera and meaningful image change, never art-approve automatically
        shell: powershell
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'Bastion1UnityFinishLookReview'
          foreach($frame in @('landscape','mobile','portrait')){
            $b=(Get-Content (Join-Path $root "before-$frame.png.camera.json") -Raw|ConvertFrom-Json)
            $a=(Get-Content (Join-Path $root "after-$frame.png.camera.json") -Raw|ConvertFrom-Json)
            foreach($key in @('position','rotation','orthographicSize','width','height','colorSpace')){
              if(($b.$key | ConvertTo-Json -Compress) -ne ($a.$key | ConvertTo-Json -Compress)){
                throw "Uncontrolled camera discrepancy $frame $key"
              }
            }
            if((Get-FileHash (Join-Path $root "before-$frame.png")).Hash -eq
               (Get-FileHash (Join-Path $root "after-$frame.png")).Hash){
              throw "No visible rendering effect on original Unity camera $frame"
            }
          }
          Write-Host 'A_B_TECHNICALLY_CONTROLLED native_pictures=true human_art_evaluation_required=true no_publish=true'
      - name: Preserve editable separate candidate and all comparisons; no production deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bastion1-unity-only-finish-look-${{ github.run_id }}
          path: |
            Bastion1UnityFinishLookReview/**
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/Bastion1UnityFinishLookCandidate.unity*
            Unity/Assets/Eldoria/ArtTests/Bastion1Assembly/GeneratedFinishLook/**
          if-no-files-found: warn
          retention-days: 30
