name: Promote selected Stone Architecture pieces

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/stone-architecture-selected-promotion.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eldoria-stone-architecture-selected-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Read request and verify source
        id: request
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $r = Get-Content "$env:GITHUB_WORKSPACE\pipeline\stone-architecture-selected-promotion.json" -Raw | ConvertFrom-Json
          "enabled=$(([bool]$r.enabled).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not [bool]$r.enabled) { Write-Host 'PROMOTION_REQUEST_DISABLED'; exit 0 }
          $src = Join-Path $env:USERPROFILE ("Downloads\" + [string]$r.source.exact_name)
          if (-not (Test-Path $src)) { throw "Exact source GLB missing: $src" }
          $sha = (Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $src).Length
          if ($sha -ne ([string]$r.source.exact_sha256).ToLowerInvariant() -or $bytes -ne [int64]$r.source.bytes) { throw "Source identity mismatch. actual=$sha/$bytes" }
          "source=$src" >> $env:GITHUB_OUTPUT
          Write-Host "SOURCE_OK: $src | $bytes bytes | sha256 $sha"

      - name: Locate Blender
        if: steps.request.outputs.enabled == 'true'
        id: blender
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $candidate = (Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if (-not $candidate) {
            foreach ($root in @('C:\Program Files\Blender Foundation',"$env:LOCALAPPDATA\Programs\Blender Foundation")) {
              if ($candidate) { break }
              if (Test-Path $root) {
                $candidate = Get-ChildItem $root -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if (-not $candidate) { throw 'Blender executable not found.' }
          "path=$candidate" >> $env:GITHUB_OUTPUT

      - name: Reproduce deterministic 8-piece split
        if: steps.request.outputs.enabled == 'true'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $r = Get-Content "$env:GITHUB_WORKSPACE\pipeline\stone-architecture-selected-promotion.json" -Raw | ConvertFrom-Json
          $work = Join-Path $env:RUNNER_TEMP 'stone-architecture-selected'
          $split = Join-Path $work 'pieces'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $split | Out-Null
          $out = Join-Path $work 'combined-50k.glb'
          $report = Join-Path $work 'report.json'
          $refine = Join-Path $work 'refine.json'
          '{"enabled":false}' | Set-Content $refine
          $args = @(
            '--background','--python',"$env:GITHUB_WORKSPACE\tools\tripo_module_blender.py",'--',
            '--input','${{ steps.request.outputs.source }}',
            '--output',$out,'--report',$report,'--refine-config',$refine,
            '--target-tris',[string]$r.optimization.target_triangles,
            '--min-tris',[string]$r.optimization.min_triangles,
            '--max-tris',[string]$r.optimization.max_triangles,
            '--split-components-dir',$split,
            '--split-min-triangles',[string]$r.split.min_component_triangles,
            '--split-cluster-count',[string]$r.split.expected_piece_count
          )
          $p = Start-Process -FilePath '${{ steps.blender.outputs.path }}' -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Blender split failed: $($p.ExitCode)" }
          $j = Get-Content $report -Raw | ConvertFrom-Json
          if ([int]$j.multipiece.useful_piece_count -ne 8) { throw "Expected 8 split pieces, got $($j.multipiece.useful_piece_count)" }
          Write-Host "SPLIT_OK: $($j.multipiece.useful_piece_count) pieces / $($j.optimized.triangles) combined tris"

      - name: Promote only visually approved pieces
        if: steps.request.outputs.enabled == 'true'
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $r = Get-Content "$env:GITHUB_WORKSPACE\pipeline\stone-architecture-selected-promotion.json" -Raw | ConvertFrom-Json
          $split = Join-Path $env:RUNNER_TEMP 'stone-architecture-selected\pieces'
          foreach ($p in @($r.approved)) {
            $src = Join-Path $split ([string]$p.piece_file)
            if (-not (Test-Path $src)) { throw "Approved piece missing: $src" }
            $sha = (Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
            $bytes = (Get-Item $src).Length
            if ($sha -ne ([string]$p.expected_sha256).ToLowerInvariant() -or $bytes -ne [int64]$p.expected_bytes) { throw "Approved piece identity mismatch for $($p.semantic_name): actual=$sha/$bytes" }
            $rel = ([string]$p.destination).Replace('/','\')
            if (-not $rel.StartsWith('Unity\Assets\Eldoria\Resources\Valoria\StoneArchitectureKit_v1\')) { throw "Unsafe destination: $rel" }
            $dest = Join-Path $env:GITHUB_WORKSPACE $rel
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item $src $dest -Force
            Write-Host "APPROVED_PROMOTION: $($p.semantic_name) -> $rel | $bytes bytes | sha256 $sha"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Unity/Assets/Eldoria/Resources/Valoria/StoneArchitectureKit_v1'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Selected promotion produced no tracked changes.' }
          git commit -m 'art: promote approved Stone Architecture v1 modules'
          $pushed = $false
          for ($attempt=1; $attempt -le 4; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Promotion rebase failed.' }
          }
          if (-not $pushed) { throw 'Promotion push failed after retries.' }

      - name: Evidence
        if: always()
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $r = Get-Content "$env:GITHUB_WORKSPACE\pipeline\stone-architecture-selected-promotion.json" -Raw | ConvertFrom-Json
          $e = [ordered]@{
            request_id = $r.request_id
            enabled = [bool]$r.enabled
            approved = $r.approved
            rejected = $r.rejected
            credit_spend_total = $r.credit_spend_total
            no_valoria_scene_changes = $r.no_valoria_scene_changes
            no_gameplay_changes = $r.no_gameplay_changes
          }
          $e | ConvertTo-Json -Depth 10 | Set-Content "$env:RUNNER_TEMP\stone-architecture-selected-promotion.json"
          Get-Content "$env:RUNNER_TEMP\stone-architecture-selected-promotion.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-architecture-selected-promotion-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stone-architecture-selected-promotion.json
          if-no-files-found: warn
