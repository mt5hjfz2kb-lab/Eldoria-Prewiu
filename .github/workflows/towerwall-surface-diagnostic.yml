name: "[LEGACY] TowerWallRock surface diagnostic"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $candidate=Get-ChildItem "${env:LOCALAPPDATA}\GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate; Add-Content $env:GITHUB_PATH $dir; $env:PATH="$dir;$env:PATH"
          }
          git --version
      - uses: actions/checkout@v4
      - name: Locate exact certified TowerWallRock
        shell: powershell
        run: |
          $expected='18785f7ba607cef1e7dcee45684d65c3166dc47b0f73b4bc4fb3d295c6f53a6a'
          $matches=@()
          foreach($f in Get-ChildItem (Join-Path $env:USERPROFILE 'Downloads') -File -Filter '*.glb'){
            $sha=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -eq $expected){$matches += $f}
          }
          if($matches.Count -ne 1){throw "Expected one certified TowerWallRock, found $($matches.Count)"}
          "TOWER_INPUT=$($matches[0].FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Locate Blender
        id: blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $candidate){$candidate=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          if(-not $candidate){throw 'Blender not found'}
          "path=$candidate" >> $env:GITHUB_OUTPUT
      - name: Diagnose without mutation
        shell: powershell
        run: |
          $report="$env:RUNNER_TEMP\towerwall-surface-diagnostic.json"
          $stdout="$env:RUNNER_TEMP\towerwall-surface-diagnostic.log"
          $stderr="$env:RUNNER_TEMP\towerwall-surface-diagnostic-error.log"
          $args=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\tripo_module_blender.py",'--','--input',$env:TOWER_INPUT,'--output',"$env:RUNNER_TEMP\unused.glb",'--report',$report,'--diagnostic-only')
          $p=Start-Process -FilePath '${{ steps.blender.outputs.path }}' -ArgumentList $args -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if($p.ExitCode -ne 0){if(Test-Path $stdout){Get-Content $stdout -Tail 160};if(Test-Path $stderr){Get-Content $stderr -Tail 160};throw "Tower diagnostic failed: $($p.ExitCode)"}
          Get-Content $report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: towerwall-surface-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/towerwall-surface-diagnostic.json
            ${{ runner.temp }}/towerwall-surface-diagnostic.log
            ${{ runner.temp }}/towerwall-surface-diagnostic-error.log
          if-no-files-found: warn
          retention-days: 14
