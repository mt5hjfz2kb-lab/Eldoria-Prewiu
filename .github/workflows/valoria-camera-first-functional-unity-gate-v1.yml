name: "[PRODUCTION] Valoria Camera-First Functional Unity Gate v1"
on:
  workflow_dispatch:
concurrency:
  group: valoria-camera-first-functional-unity-gate-v1
  cancel-in-progress: true
jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $desktop="$env:LOCALAPPDATA\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { ref: main, clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Capture camera-first Unity gate
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaCameraFirstFunctionalUnityGateV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaCameraFirstFunctionalUnityGateV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaCameraFirstFunctionalUnityGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(32)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'CFS Unity gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 350};throw "CFS Unity gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - name: Focused gameplay tests
        shell: powershell
        run: |
          $xml="$env:RUNNER_TEMP\CameraFirstFunctional-PlayMode.xml"
          $log="$env:RUNNER_TEMP\CameraFirstFunctional-PlayMode.log"
          $filter='Eldoria.Tests.ReferenceUiArtPassTests;OwnerHudMatchesReferenceMobileBudgets;ValoriaProgressionContractGatesCuartelVisualAndInteraction'
          $args=@('-batchmode','-nographics','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-runTests','-testPlatform','PlayMode','-testFilter',$filter,'-testResults',$xml,'-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(600000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'CFS tests timed out'}
          if($p.ExitCode -ne 0){Get-Content $log -Tail 180;throw "CFS tests failed $($p.ExitCode)"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-camera-first-functional-unity-gate-v1
          path: |
            Unity/ValoriaCameraFirstFunctionalUnityGateV1Captures/*
          if-no-files-found: warn
          retention-days: 30
