name: '[VALORIA] Recover exact native157 world screenshots without rebuilding'
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-native156-evidence-recovery.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-art-evidence-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows/
            docs/evidence/valoria-reference-clean/native157-recovery/
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          name: valoria-review-small-39318416130
          run-id: 39318416130
          github-token: ${{ github.token }}
          path: incoming
      - name: Recover only authentic world before-after captures and checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,hashlib,shutil
          src=Path('incoming')
          target=Path('docs/evidence/valoria-reference-clean/native157-recovery')
          target.mkdir(parents=True,exist_ok=True)
          def one(name):
              entries=list(src.rglob(name))
              if len(entries)!=1:raise RuntimeError(f'Expected one {name}, found {len(entries)}')
              return entries[0]
          sha='1aa508cdbb7403e1939aed5fd62e33f5ff7db738'
          report=json.loads(one('environment-world-identity-v10.json').read_text(encoding='utf-8-sig'))
          if report.get('source_sha')!=sha:raise RuntimeError('Wrong source Unity world: '+str(report.get('source_sha')))
          mandatory=['same_camera_light','terrain_preserved','mesh_preserved','parcels_preserved','hotspots_preserved']
          for field in mandatory:
              if report.get(field) is not True:raise RuntimeError('Protected game/scene criterion failed: '+field)
          total=sum(report.get(x,0) for x in ['forest_pixels','quarry_pixels','breach_pixels'])
          if min(report.get(x,0) for x in ['forest_pixels','quarry_pixels','breach_pixels'])<450:
              raise RuntimeError('Art did not reach all named original world zones')
          manifest={'run':39318416130,'artifact':12219407350,'source_sha':sha,'status':'ART_REVIEW_REQUIRED','protected_checks':{f:report[f] for f in mandatory},'painted_pixels':total,'previews':{}}
          for view in ['world-forest-valoria','world-quarry-valoria','world-corrupt-scout','world-engendro-valoria','world-wide','city-wide']:
              for phase in ['before','after']:
                  stem='environment-'+view+'-destinations-'+phase
                  preview=one(stem+'.preview.b64')
                  data=base64.b64decode(preview.read_text().strip(),validate=True)
                  if data[:3]!=b'\xff\xd8\xff':raise RuntimeError('Unexpected image format '+stem)
                  (target/(stem+'.jpg')).write_bytes(data)
                  manifest['previews'][stem]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          shutil.copyfile(one('environment-world-identity-v10.json'),target/'native157-world-identity.json')
          shutil.copyfile(one('integration-result.json'),target/'native157-i-ii-proof.json')
          (target/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('WORLD_CAPTURE_RECOVERY_PASS',manifest['painted_pixels'],list(manifest['previews']))
          PY
      - name: Commit screenshot evidence only; no Unity scene publishing
        shell: bash
        run: |
          git config user.name 'Eldoria world proof salvage'
          git config user.email 'valoria-proof@users.noreply.github.com'
          git add -- docs/evidence/valoria-reference-clean/native157-recovery/
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(world): real native157 forest quarry and Breach A-B for art review'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Unrelated concurrent update $attempt; retry fast-forward only"
          done
          echo "RECOVERY_NOT_PUBLISHED_EVIDENCE_RETAINED" >&2
          exit 1
