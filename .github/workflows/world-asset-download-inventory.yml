name: World Asset Download Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-asset-download-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 10
    steps:
      - name: Inventory candidate downloads
        shell: powershell
        run: |
          $downloads=Join-Path $env:USERPROFILE 'Downloads'
          $out=Join-Path $env:RUNNER_TEMP 'world-asset-download-inventory.txt'
          "RECENT FILES" | Set-Content $out
          Get-ChildItem $downloads -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 80 |
            ForEach-Object {
              $sha=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$($_.FullName)|$($_.Length)|$($_.LastWriteTime.ToString('o'))|$sha"
            } | Add-Content $out
          "RECENT DIRECTORIES" | Add-Content $out
          Get-ChildItem $downloads -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 40 |
            ForEach-Object { "$($_.FullName)|DIR|$($_.LastWriteTime.ToString('o'))" } |
            Add-Content $out
          Get-Content $out
      - uses: actions/upload-artifact@v4
        with:
          name: world-asset-download-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/world-asset-download-inventory.txt
          if-no-files-found: error
          retention-days: 7
