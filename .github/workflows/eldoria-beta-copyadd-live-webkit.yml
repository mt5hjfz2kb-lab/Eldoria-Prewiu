name: Eldoria P0 — native WebKit memory diagnosis, NOT release approval
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths:
      - '.github/workflows/eldoria-beta-copyadd-live-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-lowmem-mac-webkit-ab
  cancel-in-progress: false
jobs:
  mac-webkit-memory-ab:
    name: Isolate compiled clock build from browser reconstruction on same Mac WebKit
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout exact audited, source-only Mac WebKit probe
        uses: actions/checkout@v4
        with:
          ref: 450d7e9ad4603c51d4491fb6749dab544b78d5e0
          sparse-checkout: |
            tools/eldoria-private-beta/qa_webkit_residency.cjs
            tools/eldoria-private-beta/qa_static_server.cjs
            tools/eldoria-private-beta/iphone_ab/control-beta10-entry.html
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download exact previous source QA pass artifact, no Unity compilation
        uses: actions/download-artifact@v4
        with:
          run-id: 42787786118
          name: beta10-clock-copyadd-owner-only-site
          github-token: ${{ github.token }}
          path: site
      - name: Download original native-certified direct clock files without reconstruction
        uses: actions/download-artifact@v4
        with:
          run-id: 42716414385
          name: beta10-minimal-clock-candidate-site
          github-token: ${{ github.token }}
          path: site/beta-direct-clock
      - name: Check exact direct build and protected stable control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib
          root=pathlib.Path('site')
          old=json.loads((root/'beta-native325/release-identity.json').read_text())
          new=json.loads((root/'beta-direct-clock/release-identity.json').read_text())
          proof=json.loads((root/'beta-iphone-clock-ab-proof.json').read_text())
          script=(root/'beta-iphone-clock-ab/copy-transport.js').read_text()
          assert old['source_sha']=='be49d62e3daf490f41dba0bf8123a8e2eee64480'
          assert new['source_sha']=='004d3ef9c26e9070762e9e38ce84d69d525efd4f'
          assert new['release_for_external_testers'] is False
          assert proof['external_testers_enabled'] is False and proof['stable_game_sha256_unchanged'] is True
          assert proof['parts_verified']==31 and proof['patch_literal_bytes']==8000096
          assert 'MAX_OUTPUT=65536' in script and 'stable_cache_parts:0' in script
          import hashlib
          assert proof['transport_sha256']==hashlib.sha256(script.encode()).hexdigest()
          assert proof['transport_file'] in (root/'beta-iphone-clock-ab/index.html').read_text()
          assert '.arrayBuffer(' not in script
          assert 'localStorage' not in script and 'indexedDB' not in script
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/42787786118',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Eldoria-owner-webkit'})
          with urllib.request.urlopen(request,timeout=25) as response:
            job=json.load(response)
          assert job['conclusion']=='success' and job['head_sha']=='de7095ec2b4b4553d9662a3cce67eb44822cc64e'
          direct=(root/'beta-direct-clock/play.js').read_text()
          assert 'installEldoriaCopyTransport' not in direct, 'Direct arm must not run any COPY/ADD reconstruction'
          manifest=json.loads((root/'beta-direct-clock/build-manifest.json').read_text())
          assert 'clock_copy_delta' not in manifest
          for part in manifest['decoded_parts'][manifest['data']]:
            assert (root/'beta-direct-clock'/part['url']).is_file()
          control=pathlib.Path('tools/eldoria-private-beta/iphone_ab/control-beta10-entry.html').read_bytes()
          assert hashlib.sha256(control).hexdigest()=='f964ee3a8086d6a18005a34ca21ff7f2f95a3bfc5266558ef1e942dbb717045b'
          assert b'http-equiv="refresh"' not in control and b'play-16f4527815248e48.js' in control
          assert (root/'beta-native325/play-16f4527815248e48.js').is_file()
          (root/'beta-native325/index.html').write_bytes(control)
          print('SAME_ORIGIN_CONTROL_ENTRY_RESTORED_LOCALLY_ONLY_NO_LIVE_MUTATION')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Profile genuine WebKit WebContent memory and entry/reload for both builds
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_SKIP_PREFLIGHT: '1'
          QA_EXPECT_ORIGIN: 'http://127.0.0.1:18975'
          QA_NATIVE_PROFILE: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/compact-webkit" --no-save playwright@1.55.0
          "$RUNNER_TEMP/compact-webkit/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/compact-webkit/node_modules"
          node tools/eldoria-private-beta/qa_static_server.cjs site 18975 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          failed=0
          QA_URL='http://127.0.0.1:18975/beta-direct-clock/?eldoria_diag=1&eldoria_profile=1' QA_REVISION=native325-mobile12-minimal-world-clock-qa QA_OUT=evidence/direct node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/direct/report.json').read_text())
          print('NATIVE_MEMORY_DIAGNOSTIC_ONLY_NOT_RELEASE_APPROVAL',json.dumps({'passed':r['passed'],'profiles':r.get('nativeProfiles',[])}))
          assert r['passed'] and r.get('nativeProfiles'), 'Need actual peak stack captures'
          PY
          if [ "$failed" != 0 ]; then exit 1; fi
      - name: Archive real Mac WebKit evidence, NEVER claim physical iPhone certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-native-webkit-memory-diagnosis-not-release
          path: |
            evidence/
            server.log
          retention-days: 14
