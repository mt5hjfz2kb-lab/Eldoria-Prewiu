name: Eldoria P0 — macOS WebKit low-memory compact clock real-browser A/B
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths:
      - '.github/workflows/eldoria-beta-copyadd-live-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-lowmem-mac-webkit-ab
  cancel-in-progress: false
jobs:
  mac-webkit-memory-ab:
    name: Compare owner-playable beta10 vs exact 256KiB candidate on same Mac WebKit
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout exact audited, source-only Mac WebKit probe
        uses: actions/checkout@v4
        with:
          ref: 836fce54e33e0c3c5cc87ea4ca480da5eb44835a
          sparse-checkout: |
            tools/eldoria-private-beta/qa_webkit_residency.cjs
            tools/eldoria-private-beta/qa_static_server.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download exact previous source QA pass artifact, no Unity compilation
        uses: actions/download-artifact@v4
        with:
          run-id: 42785047968
          name: beta10-clock-copyadd-owner-only-site
          github-token: ${{ github.token }}
          path: site
      - name: Check tested artifact, identity, consent boundary and capped frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib
          root=pathlib.Path('site')
          old=json.loads((root/'beta-native325/release-identity.json').read_text())
          new=json.loads((root/'beta-iphone-clock-ab/release-identity.json').read_text())
          proof=json.loads((root/'beta-iphone-clock-ab-proof.json').read_text())
          script=(root/'beta-iphone-clock-ab/copy-transport.js').read_text()
          assert old['source_sha']=='be49d62e3daf490f41dba0bf8123a8e2eee64480'
          assert new['source_sha']=='004d3ef9c26e9070762e9e38ce84d69d525efd4f'
          assert new['release_for_external_testers'] is False
          assert proof['external_testers_enabled'] is False and proof['stable_game_sha256_unchanged'] is True
          assert proof['parts_verified']==31 and proof['patch_literal_bytes']==8000096
          assert 'MAX_OUTPUT=262144' in script and 'stable_cache_parts:1' in script
          assert 'localStorage' not in script and 'indexedDB' not in script
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/42785047968',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Eldoria-owner-webkit'})
          with urllib.request.urlopen(request,timeout=25) as response:
            job=json.load(response)
          assert job['conclusion']=='success' and job['head_sha']=='836fce54e33e0c3c5cc87ea4ca480da5eb44835a'
          print('LOWMEM_256K_WEBKIT_QA_PINNED_31_SHA_VALIDATED')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Profile genuine WebKit WebContent memory and entry/reload for both builds
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_SKIP_PREFLIGHT: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/compact-webkit" --no-save playwright@1.55.0
          "$RUNNER_TEMP/compact-webkit/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/compact-webkit/node_modules"
          node tools/eldoria-private-beta/qa_static_server.cjs site 18975 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          failed=0
          QA_URL='http://127.0.0.1:18975/beta-native325/?eldoria_diag=1&eldoria_profile=1' QA_REVISION=native325-mobile10-pretest-ux QA_OUT=evidence/control node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
          QA_URL='http://127.0.0.1:18975/beta-iphone-clock-ab/?eldoria_diag=1&eldoria_profile=1' QA_REVISION=native325-mobile12-minimal-world-clock-qa QA_OUT=evidence/candidate node tools/eldoria-private-beta/qa_webkit_residency.cjs || failed=1
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows={}
          for kind,expected in (('control','native325-mobile10-pretest-ux'),('candidate','native325-mobile12-minimal-world-clock-qa')):
            report=json.loads(Path('evidence',kind,'report.json').read_text())
            samples=report.get('samples',[])+report.get('entrySamples',[])
            rss=max((p.get('rssKiB',0) for s in samples for p in s.get('processes',[]) if 'WebContent' in p.get('name','')),default=0)
            gpu=max((p.get('rssKiB',0) for s in samples for p in s.get('processes',[]) if 'GPU' in p.get('name','')),default=0)
            wasm=max(((s.get('metrics') or {}).get('usedWASMHeapSize') or 0 for s in samples),default=0)
            rows[kind]={'passed':report.get('passed'),'revision':(report.get('identity') or {}).get('revision'),'webcontent_peak_kib':rss,'gpu_peak_kib':gpu,'wasm_used_peak_bytes':wasm,'errors':report.get('errors'),'samples':len(samples)}
            assert rows[kind]['revision']==expected,'Wrong QA artifact identity'
          with Path('evidence/owner-ab-memory.json').open('w') as out:
            json.dump({'physical_iphone_tested':False,'scope':'same-host macOS WebKit ONLY','data':rows},out,indent=2)
          print('OWNER_AB_REAL_WEBKIT_MEMORY_EVIDENCE',json.dumps(rows))
          assert rows['control']['passed'] and rows['candidate']['passed'],'Actual WebKit entry or reload failed'
          assert rows['control']['webcontent_peak_kib']>0 and rows['candidate']['webcontent_peak_kib']>0
          assert rows['candidate']['webcontent_peak_kib']<=rows['control']['webcontent_peak_kib']*1.05,\
              'Low-memory transport still requires >5% extra WebContent memory vs playable beta10'
          PY
          if [ "$failed" != 0 ]; then exit 1; fi
      - name: Archive real Mac WebKit evidence, NEVER claim physical iPhone certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-lowmem-clock-real-macos-webkit-not-iphone
          path: |
            evidence/
            server.log
          retention-days: 14
