name: Eldoria P0 — immediate entry and keyboard resize candidate
on:
  push:
    branches: [feature/eldoria-private-beta-i-v-20261107]
    paths:
      - '.github/workflows/eldoria-beta-copyadd-live-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-beta-lowmem-mac-webkit-ab
  cancel-in-progress: false
jobs:
  mac-webkit-memory-ab:
    name: Isolate compiled clock build from browser reconstruction on same Mac WebKit
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout exact audited, source-only Mac WebKit probe
        uses: actions/checkout@v4
        with:
          ref: 2bc2ac169bc6d675d1b2d831c1d40c834052bda4
          sparse-checkout: |
            tools/eldoria-private-beta/qa_webkit_residency.cjs
            tools/eldoria-private-beta/qa_static_server.cjs
            tools/eldoria-private-beta/iphone_ab/control-beta10-entry.html
            tools/eldoria-private-beta/iphone_ab/stable_canvas.js
            tools/eldoria-private-beta/iphone_ab/stable_canvas.test.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download exact previous source QA pass artifact, no Unity compilation
        uses: actions/download-artifact@v4
        with:
          run-id: 42781066472
          name: beta10-clock-copyadd-owner-only-site
          github-token: ${{ github.token }}
          path: site
      - name: Check exact direct build and protected stable control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib
          root=pathlib.Path('site')
          old=json.loads((root/'beta-native325/release-identity.json').read_text())
          new=json.loads((root/'beta-iphone-clock-ab/release-identity.json').read_text())
          proof=json.loads((root/'beta-iphone-clock-ab-proof.json').read_text())
          script=(root/'beta-iphone-clock-ab/copy-transport.js').read_text()
          assert old['source_sha']=='be49d62e3daf490f41dba0bf8123a8e2eee64480'
          assert new['source_sha']=='004d3ef9c26e9070762e9e38ce84d69d525efd4f'
          assert new['release_for_external_testers'] is False
          assert proof['external_testers_enabled'] is False and proof['stable_game_sha256_unchanged'] is True
          assert proof['parts_verified']==31 and proof['patch_literal_bytes']==8000096
          import hashlib
          assert hashlib.sha256(script.encode()).hexdigest()=='7b0717a4e4b655861084cf33f9c3df07e1e3c70660d2b8a6600d0c6a2ca98725', 'Must match actual published transport'
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/42781066472',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Eldoria-owner-webkit'})
          with urllib.request.urlopen(request,timeout=25) as response:
            job=json.load(response)
          assert job['conclusion']=='success' and job['head_sha']=='495eac8e47640ee3bb992506b7162cfed31de283'
          control=pathlib.Path('tools/eldoria-private-beta/iphone_ab/control-beta10-entry.html').read_bytes()
          assert hashlib.sha256(control).hexdigest()=='f964ee3a8086d6a18005a34ca21ff7f2f95a3bfc5266558ef1e942dbb717045b'
          assert b'http-equiv="refresh"' not in control and b'play-16f4527815248e48.js' in control
          assert (root/'beta-native325/play-16f4527815248e48.js').is_file()
          (root/'beta-native325/index.html').write_bytes(control)
          print('SAME_ORIGIN_CONTROL_ENTRY_RESTORED_LOCALLY_ONLY_NO_LIVE_MUTATION')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Profile genuine WebKit WebContent memory and entry/reload for both builds
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_SKIP_PREFLIGHT: '1'
          QA_EXPECT_ORIGIN: 'http://127.0.0.1:18975'
          QA_NATIVE_PROFILE: '1'
          QA_EARLY_ENTRY: '1'
          QA_RESIZE_STRESS: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/compact-webkit" --no-save playwright@1.55.0
          "$RUNNER_TEMP/compact-webkit/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/compact-webkit/node_modules"
          node tools/eldoria-private-beta/qa_static_server.cjs site 18975 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --test tools/eldoria-private-beta/iphone_ab/stable_canvas.test.mjs
          failed=0
          QA_URL='http://127.0.0.1:18975/beta-iphone-clock-ab/?eldoria_diag=1' QA_REVISION=native325-mobile12-minimal-world-clock-qa QA_OUT=evidence/control node tools/eldoria-private-beta/qa_webkit_residency.cjs >control.log 2>&1 || failed=1
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('site/beta-iphone-clock-ab')
          module=pathlib.Path('tools/eldoria-private-beta/iphone_ab/stable_canvas.js').read_text()
          proof={'source':'2bc2ac169bc6d675d1b2d831c1d40c834052bda4','engine_modified':False,'shell_changes':[],'physical_iphone_tested':False}
          for p in root.glob('play*.js'):
            before=p.read_text()
            assert before.count('matchWebGLToCanvasSize:true')==1
            assert before.count('const instance=await createUnityInstance(canvas,{')==1
            after=module+'\n'+before.replace('matchWebGLToCanvasSize:true','matchWebGLToCanvasSize:false').replace('const instance=await createUnityInstance(canvas,{','window.__eldoriaStableCanvas=installEldoriaStableCanvas(canvas);\n  const instance=await createUnityInstance(canvas,{')
            p.write_text(after)
            proof['shell_changes'].append({'file':p.name,'before':hashlib.sha256(before.encode()).hexdigest(),'after':hashlib.sha256(after.encode()).hexdigest()})
          pathlib.Path('evidence/canvas-shell-proof.json').write_text(json.dumps(proof,indent=2))
          PY
          QA_VARIANT=stable-canvas QA_URL='http://127.0.0.1:18975/beta-iphone-clock-ab/?eldoria_diag=1' QA_REVISION=native325-mobile12-minimal-world-clock-qa QA_OUT=evidence/candidate node tools/eldoria-private-beta/qa_webkit_residency.cjs >candidate.log 2>&1 || failed=1
          python3 - <<'PY'
          import json,pathlib
          rows={}
          for name in ('control','candidate'):
            r=json.loads(pathlib.Path('evidence',name,'report.json').read_text())
            seq=r.get('resizeSequence',[])
            rows[name]={'passed':r['passed'],'early':r.get('earlyEntry'),'resize':seq,'peak_rss_kib':max(p.get('rssKiB',0) for v in r['samples']+r.get('entrySamples',[]) for p in v.get('processes',[]) if 'WebContent' in p.get('name',''))}
          pathlib.Path('evidence/immediate-resize-ab.json').write_text(json.dumps(rows,indent=2))
          print('IMMEDIATE_ENTRY_RESIZE_DESKTOP_ONLY',rows)
          assert all(r['passed'] and r['early']['attempted'] for r in rows.values())
          seq=rows['candidate']['resize']
          assert len(seq)==4 and len({(x['canvas']['width'],x['canvas']['height']) for x in seq})==1,'Candidate render target must remain unchanged during keyboard-height resize'
          PY
          if [ "$failed" != 0 ]; then exit 1; fi
      - name: Archive real Mac WebKit evidence, NEVER claim physical iPhone certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldoria-immediate-entry-canvas-ab-not-iphone
          path: |
            evidence/
            server.log
            control.log
            candidate.log
          retention-days: 14
