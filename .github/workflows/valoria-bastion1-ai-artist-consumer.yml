name: Bastion I AI artistic authoring (consume PR 36 core)
on:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths: ['.github/workflows/valoria-bastion1-ai-artist-consumer.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion1-art-artist-consumer
  cancel-in-progress: false
jobs:
  qwen-directed-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      ART_CORE_SHA: 3deec3b03c3aa23ed6b091fb3a9eddc7518fe745
      SOURCE_RUN: '38356683511'
      SOURCE_SHA: '245a963f7c7eb9ee30e4de9e9cffd13f632eb82d'
      TARGET_MESH: 'Valoria natural playable hilltop and rock scarps'
      ART: /tmp/bastion1-author
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact existing PR 36 scripts without editing its branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/art-direction/ai-authoring
          git fetch --no-tags --depth=1 origin "$ART_CORE_SHA"
          for n in author_brief.py artist_plan_validation.py artistic_learning_feedback.py execute_artist_plan.py verify-artist-cycle.mjs unity_pixel_diff.mjs visibility_metrics.py; do
            git show "$ART_CORE_SHA:tools/art-direction/ai-authoring/$n" > "tools/art-direction/ai-authoring/$n"
          done
          # PR #36 moved the canonical system prompt out of the old local
          # ARTIST_SYSTEM.md; load its precise pinned canonical location.
          git show "$ART_CORE_SHA:tools/art-direction/VALORIA_LOCAL_ARTIST_SYSTEM_PROMPT.md" > tools/art-direction/VALORIA_LOCAL_ARTIST_SYSTEM_PROMPT.md
          test -s tools/art-direction/VALORIA_LOCAL_ARTIST_SYSTEM_PROMPT.md
          # Keep this branch's source-camera-locked renderer, already validated by authentic replay #38367414911.
          python3 -m py_compile tools/art-direction/ai-authoring/author_brief.py tools/art-direction/ai-authoring/execute_artist_plan.py tools/art-direction/ai-authoring/render_artist_ab.py
          echo "PR36_PROVEN_CORE_READONLY $ART_CORE_SHA"
      - name: Recover immutable scene assembly and real Unity player frame
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ART/inputs"
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" --name "bastion1-player-integration-$SOURCE_RUN" --dir "$ART/inputs"
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          root=pathlib.Path(os.environ['ART'])
          src=list((root/'inputs').rglob('Bastion1ReferenceAssembly.glb'))
          image=list((root/'inputs').rglob('bastion1-player-initial.png'))
          assert len(src)==len(image)==1,(src,image)
          ref=pathlib.Path('references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg')
          assert ref.is_file()
          (root/'source.glb').write_bytes(src[0].read_bytes())
          (root/'unity-before.png').write_bytes(image[0].read_bytes())
          proof={'source_run':int(os.environ['SOURCE_RUN']),'source_sha':os.environ['SOURCE_SHA'],'artist_core_sha':os.environ['ART_CORE_SHA']}
          for k,p in [('glb',root/'source.glb'),('unity',root/'unity-before.png'),('reference',ref)]:
            proof[k+'_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'input-provenance.json').write_text(json.dumps(proof,indent=2))
          print('BASTION1_VERIFIED_SOURCE_AND_REAL_UNITY_FRAME',json.dumps(proof))
          PY
      - name: Install open-source Blender locally (no Windows runner)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy python3-pil
          blender --version | head -2
      - name: Import real frozen GLB, isolate owned mesh, preserve editable Blender source
        shell: bash
        run: |
          cat > "$ART/extract.py" <<'PY'
          import os,pathlib,bpy,hashlib
          root=pathlib.Path(os.environ['ART'])
          bpy.ops.object.select_all(action='SELECT');bpy.ops.object.delete(use_global=False)
          bpy.ops.import_scene.gltf(filepath=str(root/'source.glb'))
          obj=bpy.data.objects.get(os.environ['TARGET_MESH'])
          if not obj or obj.type!='MESH':
            raise RuntimeError('Authored terrain not found: '+str([x.name for x in bpy.data.objects if 'terrain' in x.name.lower()]))
          if not 100<len(obj.data.vertices)<50000:raise ValueError('Unexpected terrain mesh complexity')
          print('BASTION1_AUTHORED_MESH',obj.name,'vertices',len(obj.data.vertices),'faces',len(obj.data.polygons))
          world=obj.matrix_world.copy()
          obj.parent=None;obj.matrix_world=world
          for other in list(bpy.data.objects):
            if other!=obj:bpy.data.objects.remove(other,do_unlink=True)
          out=root/'terrain-source.blend'
          bpy.ops.wm.save_as_mainfile(filepath=str(out))
          print('FROZEN_DERIVED_BLEND_SHA',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          blender -b --python-exit-code 1 --python "$ART/extract.py"
          blender -b --python-exit-code 1 --python tools/art-direction/ai-authoring/execute_artist_plan.py -- --source "$ART/terrain-source.blend" --inspect --inspect-target-object "$TARGET_MESH" --out "$ART/inspect"
      - name: Start free local Ollama Qwen vision model
        timeout-minutes: 12
        run: |
          docker run -d --rm --name bastion1-qwen-vision -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for n in $(seq 1 60); do if curl -fsS http://127.0.0.1:11434/api/version > "$ART/ollama-version.json"; then break; fi; sleep 2; done
          test -s "$ART/ollama-version.json"
          docker exec bastion1-qwen-vision ollama pull qwen3-vl:4b-instruct
      - name: Derive bounded image copies from REAL Unity/reference, retaining hashes
        run: |
          /usr/bin/python3 - <<'PY'
          import os,pathlib,hashlib,json
          from PIL import Image
          root=pathlib.Path(os.environ['ART']);out={}
          for k,p in [('reference',pathlib.Path('references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg')),('unity_before',root/'unity-before.png')]:
            im=Image.open(p).convert('RGB');original_size=im.size
            # Focus the REAL author-approved and REAL Unity pictures on the
            # foreground gate, cliff and terrain-to-architecture junction.
            # Both originals and their SHA256 remain unchanged and preserved.
            top=int(im.height*(.27 if k=='reference' else .30))
            crop_box=(0,top,im.width,im.height)
            im=im.crop(crop_box)
            im.thumbnail((512,512),Image.Resampling.LANCZOS)
            dst=root/(k+'.jpg');im.save(dst,'JPEG',quality=85)
            out[k]={'original_sha':hashlib.sha256(p.read_bytes()).hexdigest(),'derived_sha':hashlib.sha256(dst.read_bytes()).hexdigest(),'original_pixels':original_size,'crop_box':crop_box,'derived_pixels':im.size}
          (root/'image-derivatives.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Recover exact preceding Qwen CAMERA-LOCKED visual rejection
        shell: bash
        run: |
          mkdir -p "$ART/prior"
          gh run download 38358105789 --repo "${{ github.repository }}" \
            --name bastion1-genuine-qwen-artist-38358105789 --dir "$ART/prior"
          python3 - <<'PY'
          import json,pathlib,os,shutil
          root=pathlib.Path(os.environ['ART'])
          previous=json.loads((root/'prior/ab/comparison.json').read_text())
          provenance=json.loads((root/'prior/input-provenance.json').read_text())
          assert provenance['source_run']==int(os.environ['SOURCE_RUN'])
          assert previous['target']==os.environ['TARGET_MESH']
          assert 'Blender clay A/B' in previous['scope']
          assert previous['camera_visibility']['camera_visibility_gate']=='REJECT_NOT_VISIBLE'
          assert previous['camera_visibility']['changed_pixels']==0
          shutil.copyfile(root/'prior/ab/comparison.json',root/'prior-clay-review.json')
          print('AUTHENTIC_QWEN_PREVIOUS_RENDER_REJECTED',previous['camera_visibility'])
          PY
      - name: Recover second independent genuine Qwen4B camera-space VISUAL REJECTION
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ART/second-reject"
          gh run download 38367414911 --repo "${{ github.repository }}" \
            --name bastion1-verified-qwen4b-original-38360450981 --dir "$ART/second-reject"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path(os.environ['ART'])
          for folder in ('prior','second-reject'):
            base=root/folder
            plan=base/'model/artist-plan.json'
            comparison=base/'ab/comparison.json'
            assert plan.is_file() and comparison.is_file(),folder
            actions=json.loads(plan.read_text())
            review=json.loads(comparison.read_text())
            assert review['target']==os.environ['TARGET_MESH']
            assert review['camera_visibility']['camera_visibility_gate']=='REJECT_NOT_VISIBLE'
            assert len(actions)==1 and actions[0]['type']=='sculpt_region',folder
            for phase in ('before','after'):
              png=base/'ab'/f'{phase}-blender-clay.png'
              assert png.is_file() and hashlib.sha256(png.read_bytes()).hexdigest()==review[f'{phase}_image_sha256'],png
            print('REJECTED_QWEN_ORIGINAL_ART_BEFORE_NEXT_INFERENCE',folder,
                  review['camera_visibility']['changed_pixels'])
          PY
      - name: Preserve latest genuine Qwen sculpt_path failure as visual feedback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ART/third-reject"
          gh run download 38372771028 --repo "${{ github.repository }}" \
            --name bastion1-original-qwen4b-path-38370740511 --dir "$ART/third-reject"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['ART'])
          original=root/'third-reject'
          plan=json.loads((original/'model/artist-plan.json').read_text())
          inference=json.loads((original/'model/artist-inference.json').read_text())
          review=json.loads((original/'ab/comparison.json').read_text())
          provenance=json.loads((original/'replay-provenance.json').read_text())
          assert review['target']==os.environ['TARGET_MESH']
          assert review['camera_visibility']['camera_visibility_gate']=='REJECT_NOT_VISIBLE'
          assert review['camera_visibility']['changed_pixels']==100
          assert len(plan)==1 and plan[0]['type']=='sculpt_path'
          assert inference['direction']['planned_actions']==plan
          assert provenance['source_run']==38370740511
          for key in ('before','after'):
            png=original/'ab'/f'{key}-blender-clay.png'
            assert hashlib.sha256(png.read_bytes()).hexdigest()==review[f'{key}_image_sha256']
          shutil.copyfile(original/'ab/comparison.json',root/'prior-clay-review.json')
          print('LATEST_REAL_QWEN_CAMERA_REJECTION_FED_BACK',review['camera_visibility'])
          PY
      - name: Build VERIFIED south-cliff mesh anchors and real prior Unity failure context
        shell: bash
        run: |
          mkdir -p "$ART/model"
          cat > "$ART/visible-anchors.py" <<'PY'
          import bpy,json,os,pathlib,math
          root=pathlib.Path(os.environ['ART'])
          bpy.ops.wm.open_mainfile(filepath=str(root/'terrain-source.blend'))
          mesh=bpy.data.objects[os.environ['TARGET_MESH']].data
          points=[(-22,-25,-12),(-11,-25,-13),(0,-25,-13),(11,-25,-13),(22,-25,-12),
                  (-20,-30,-18),(-8,-30,-18),(8,-30,-18),(20,-30,-18)]
          verts=list(mesh.vertices)
          assert len(verts)>10000
          samples=[];used=set()
          for i,(x,y,z) in enumerate(points):
            v=min((v for v in verts if v.index not in used),key=lambda v:(v.co.x-x)**2+(v.co.y-y)**2+(v.co.z-z)**2)
            distance=math.dist([x,y,z],list(v.co))
            assert distance<24,(i,distance,list(v.co))
            assert v.co.y<0 and abs(v.co.x)<45,('wrong camera face',i,list(v.co))
            used.add(v.index)
            samples.append({'role':f'negative_y_cliff_{i}','index':v.index,'position':[round(float(t),4) for t in v.co]})
          f=root/'inspect/mesh-context.json'
          manifest=json.loads(f.read_text())
          assert manifest['target']==os.environ['TARGET_MESH']
          manifest['sample_vertices']=samples+manifest['sample_vertices'][:3]
          f.write_text(json.dumps(manifest,indent=2))
          (root/'inventory.txt').write_text(
            'PREVIOUS ACTUAL BLENDER ARTIST CAMERA A/B VISIBILITY FAIL: Qwen chose '
            'radius 1.0 m and delta 0.2 m; 0/307200 pixels changed materially. '
            'Previous Unity scene sculpt (828 vertices) changed only 125/1440000 '
            'pixels at >10 RGB (0.00868%). Both are ART_REJECTED. An environment '
            'cliff requires an ENVIRONMENT-SCALE sculpt: select an authored '
            'radius between 12.0 and 35.0 meters with displacement length '
            'between 1.0 and 5.0 meters. Smaller sculpt choices fail the '
            'already-verified visual gate; the MODEL must choose actual exact '
            'values within these bounds, scripts must not enlarge its output. '
            'Previous Qwen4B also chose radius 1.5 m and delta [0.3,0.2,0], '
            'rejected BEFORE Blender. Prioritize broad SOUTH front visible cliffs, '
            'front-facing slope. Owner priority: organic cliff/terrace transition, '
            'not a tiny local bump, not a new tower or modified parcel. '
            'Choose your own center, radius and displacement grounded in the real '
            'geometry and image. SOUTH front cliff verified source vertices: '+
            json.dumps(samples,separators=(',',':'))+
            '. Previous Qwen-authored operation displaced 828 vertices, but genuine Unity '
            'camera comparison changed only 125 of 1440000 pixels (>10 RGB), 0.00868%. '
            'That is a demonstrated ART REJECTION: correcting a far-left or bottom corner '
            'again is ineffective. Design a conspicuous curved FRONT slope/cliff profile '
            'and contact with the buildable terrace, preserving all build parcels, roads, '
            'architecture, existing Hero Gate V3 and PBR face slots. '
            'Select spatial operation and displacement YOURSELF based on real images '
            'and verified foreground coordinates; no fabricated preset or fake approval.')
          print('AUTHENTIC_FOREGROUND_MESH_ANCHORS',json.dumps(samples))
          PY
          blender -b --python-exit-code 1 --python "$ART/visible-anchors.py"
      - name: NEW local Qwen visual decision for visible player-camera cliff
        timeout-minutes: 27
        shell: bash
        run: |
          python3 tools/art-direction/ai-authoring/author_brief.py \
            --reference "$ART/reference.jpg" --unity-before "$ART/unity_before.jpg" \
            --inventory "$ART/inventory.txt" \
            --mesh-context "$ART/inspect/mesh-context.json" \
            --prior-visual-review "$ART/prior-clay-review.json" \
            --failed-plan "$ART/prior/model/artist-plan.json" --failed-review "$ART/prior/ab/comparison.json" \
            --failed-plan "$ART/second-reject/model/artist-plan.json" --failed-review "$ART/second-reject/ab/comparison.json" \
            --target-object "$TARGET_MESH" --target-mode existing \
            --model qwen3-vl:4b-instruct --num-ctx 8192 --num-predict 1000 --max-actions 2 \
            --camera-min-radius 12 --camera-min-displacement 1.5 \
            --cpu-compact --repair-attempts 0 --request-timeout 540 --out "$ART/model"
          node tools/art-direction/ai-authoring/verify-artist-cycle.mjs --preflight-plan "$ART/model/artist-plan.json" "$TARGET_MESH" existing
          python3 - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['ART'])
          inference=json.loads((r/'model/artist-inference.json').read_text())
          ops=json.loads((r/'model/artist-plan.json').read_text())
          assert inference['model']=='qwen3-vl:4b-instruct' and inference['system_role']=='system'
          assert inference['direction']['planned_actions']==ops
          assert len(inference.get('rejected_visual_cycle_evidence',[]))==2, 'must use two real rejected cycles'
          assert any(op['type']!='sculpt_region' for op in ops), 'do not repeat two invisible sculpt_region strategies'
          anchors=json.loads((r/'inspect/mesh-context.json').read_text())['sample_vertices']
          assert len(anchors)>=9 and all(a['role'].startswith('negative_y_cliff_') for a in anchors[:9])
          # Fail closed when Qwen AGAIN designs an invisible far-away edit.
          focus=[]
          for op in ops:
            p=op['parameters']
            if op['type']=='sculpt_region':focus.append(p['center'])
            elif op['type']=='sculpt_path':focus.extend(k['center'] for k in p['knots'])
          if focus:
            assert any(-36<=v[0]<=36 and -45<=v[1]<=-7 for v in focus),('Qwen edit outside genuine player-facing cliff',focus)
          assert all(op['target']==os.environ['TARGET_MESH'] for op in ops)
          # A technically valid centimetre-scale edit is not a visible 3D
          # environment intervention. Qwen must make this decision itself.
          import math
          for op in ops:
            p=op['parameters']
            if op['type']=='sculpt_region':
              assert p['radius']>=10 and math.dist(p['delta'],[0,0,0])>=1.0,('Too-local Qwen sculpt for an actual cliff',op)
            if op['type']=='sculpt_path':
              assert any(k['radius']>=10 and math.dist(k['delta'],[0,0,0])>=1.0 for k in p['knots']),('Too-local Qwen path',op)
          print('NEW_QWEN_ARTISTIC_DECISION_UNMODIFIED',json.dumps(ops))
          PY
      - name: Actual typed Blender sculpt on Qwen-selected target
        timeout-minutes: 8
        run: |
          SHA=$(sha256sum "$ART/terrain-source.blend" | cut -d' ' -f1)
          blender -b --python-exit-code 1 --python tools/art-direction/ai-authoring/execute_artist_plan.py -- --source "$ART/terrain-source.blend" --plan "$ART/model/artist-plan.json" --out "$ART/result" --transport direct --expected-source-sha256 "$SHA"
          python3 - <<'PY'
          import os,pathlib,json,hashlib
          root=pathlib.Path(os.environ['ART'])
          plan=json.loads((root/'model/artist-plan.json').read_text())
          inference=json.loads((root/'model/artist-inference.json').read_text())
          proof=json.loads((root/'result/artist-execution.json').read_text())
          assert inference['model']=='qwen3-vl:4b-instruct' and inference['system_role']=='system'
          assert inference['direction']['planned_actions']==plan
          assert len(plan)==len(proof['executed_actions'])
          assert proof['source_mesh_sha256']!=proof['result_mesh_sha256']
          print('BASTION1_GENUINE_MODEL_CHOSEN_GEOMETRY_EDIT',[(a['type'],a['changed_vertices'],a['changed_faces']) for a in proof['executed_actions']])
          PY
      - name: Generate authentic Blender before and after clay proof
        timeout-minutes: 5
        run: |
          blender -b --python-exit-code 1 --python tools/art-direction/ai-authoring/render_artist_ab.py -- --before "$ART/terrain-source.blend" --after "$ART/result/artist-output.blend" --target "$TARGET_MESH" --player-camera --out "$ART/ab"
      - name: Independently measure CAMERA-LOCKED artistic impact (still not ART APPROVED)
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import os,pathlib,numpy as np
          from PIL import Image
          root=pathlib.Path(os.environ['ART'])/'ab'
          before=np.asarray(Image.open(root/'before-blender-clay.png').convert('RGB')).astype(np.int16)
          after=np.asarray(Image.open(root/'after-blender-clay.png').convert('RGB')).astype(np.int16)
          assert before.shape==after.shape
          pixels=(np.max(np.abs(before-after),axis=2)>=8)
          fraction=float(pixels.mean())
          print('REAL_QWEN_CAMERA_MATCHED_VISIBLE_PIXEL_FRACTION',fraction)
          (root/'visual-impact.txt').write_text(f'changed_pixel_fraction={fraction:.9f}\nthreshold_for_study=0.0005\nnot_unity_or_visual_approval=true\n')
          if fraction<.001:raise ValueError('Qwen sculpt changes under 0.1% of matched camera pixels; ART REJECTED, must redesign')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-genuine-qwen-artist-${{ github.run_id }}
          path: |
            /tmp/bastion1-author/input-provenance.json
            /tmp/bastion1-author/image-derivatives.json
            /tmp/bastion1-author/ollama-version.json
            /tmp/bastion1-author/inspect/mesh-context.json
            /tmp/bastion1-author/model/**
            /tmp/bastion1-author/terrain-source.blend
            /tmp/bastion1-author/result/**
            /tmp/bastion1-author/ab/**
          retention-days: 14
          if-no-files-found: warn
