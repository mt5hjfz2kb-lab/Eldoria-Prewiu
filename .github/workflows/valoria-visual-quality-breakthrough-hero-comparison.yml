name: "[EXPERIMENT] Valoria VQB Hero Segmentation Comparison"

on:
  push:
    branches: [visual-proof/valoria-visual-quality-breakthrough-v1]
    paths:
      - "Unity/Assets/Eldoria/Scripts/Editor/ValoriaHeroSegmentationComparisonGateV1.cs"
      - ".github/workflows/valoria-visual-quality-breakthrough-hero-comparison.yml"
      - "pipeline/candidates/valoria-vqb-hero-segmentation/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valoria-vqb-hero-segmentation-comparison
  cancel-in-progress: true

jobs:
  compare:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 40
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with: { clean: false }
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage segmented Hero candidates as temporary Unity resources
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\VQBCandidates"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\pipeline\candidates\valoria-vqb-hero-segmentation\*.glb" $dest -Force
          if((Get-ChildItem $dest -Filter '*.glb').Count -ne 3){throw 'Expected three segmented Hero candidates'}
      - name: Stage shared CC0 PBR surface maps
        shell: powershell
        run: |
          $dest="$env:GITHUB_WORKSPACE\Unity\Assets\Resources\Valoria\SurfaceCellExternal"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $headers=@{'User-Agent'='Eldoria-HeroSegmentation/1.0'}
          foreach($asset in @(@{id='dirt';prefix='dirt'},@{id='cobblestone_floor_001';prefix='cobble'},@{id='stone_block_wall';prefix='stone'},@{id='rock_boulder_dry';prefix='rock'})){
            $payload=Invoke-RestMethod -Headers $headers -Uri ("https://api.polyhaven.com/files/"+$asset.id)
            $json=$payload | ConvertTo-Json -Depth 50
            $urls=[regex]::Matches($json,'https://[^"]+') | ForEach-Object { $_.Value.Replace('\u0026','&') } | Select-Object -Unique
            foreach($map in @(@{key='diff';rx='_diff_1k[.](jpg|png)([?]|$)'},@{key='normal';rx='_nor_gl_1k[.](jpg|png)([?]|$)'})){
              $url=$urls | Where-Object { $_ -match $map.rx } | Select-Object -First 1
              if(-not $url){if($map.key -eq "normal" -and $asset.prefix -eq "dirt"){continue};throw "Missing map $($asset.id) $($map.key)"}
              $ext=[IO.Path]::GetExtension(([uri]$url).AbsolutePath)
              $out=Join-Path $dest ($asset.prefix+'_'+$map.key+$ext)
              Invoke-WebRequest -Headers $headers -Uri $url -OutFile $out
              if((Get-Item $out).Length -lt 10000){throw "PBR map too small: $out"}
            }
          }
      - name: Capture matched Hero segmentation comparison
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaHeroSegmentationComparisonV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaHeroSegmentationComparisonV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaHeroSegmentationComparisonGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(33)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Comparison gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "Comparison gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'comparison-evidence.json')
      - id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-vqb-hero-comparison-${{ github.run_id }}
          path: |
            Unity/ValoriaHeroSegmentationComparisonV1Captures/*
            ${{ runner.temp }}/ValoriaHeroSegmentationComparisonV1.log
          if-no-files-found: warn
          retention-days: 30
      - name: Persist comparison receipt
        if: always()
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\pipeline\evidence"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $receipt=@{
            run_id="${{ github.run_id }}"
            artifact_id="${{ steps.upload.outputs.artifact-id }}"
            source_sha="${{ github.sha }}"
            job_status="${{ job.status }}"
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $dir "valoria-vqb-hero-comparison-run.json") -Value $receipt -Encoding utf8
          git config user.name "eldoria-ci"
          git config user.email "actions@github.com"
          git add pipeline/evidence/valoria-vqb-hero-comparison-run.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "chore: record Hero segmentation comparison ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          }
