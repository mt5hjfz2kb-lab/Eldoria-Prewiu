name: "[PRODUCTION] Golden Primary Forms Source02 Issue Trigger"

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  source02:
    if: github.event_name == 'schedule' || (github.event_name == 'issues' && github.event.issue.title == '[CI TRIGGER] Golden Primary Forms Source02')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Author source02
        run: |
          blender -b --python-exit-code 1 --python tools/author-golden-primary-forms-source02.py
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source-report.json
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source02-clay-silhouette.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source02-lit-three-quarter.png
          test -s docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/source02-official-proxy.png

      - name: Record run metadata
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/issue-trigger-run.json')
          p.write_text(json.dumps({
            "run_id":os.environ["RUN_ID"],
            "run_attempt":os.environ["RUN_ATTEMPT"],
            "head_sha":os.environ["HEAD_SHA"],
            "trigger_issue":os.environ["TRIGGER_ISSUE"],
            "status":"AUTHORING_COMPLETED"
          },indent=2)+"\n")
          PY

      - name: Persist source02 evidence
        run: |
          git config user.name "Eldoria Art Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02
          if ! git diff --cached --quiet; then
            git commit -m "Persist Golden primary forms source02 evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-golden-primary-forms-v1-source02-review
          path: |
            art-source/valoria/lookdev/golden-slice-v1/primary-forms-v1/source02/*
            docs/evidence/valoria-golden-lookdev-slice-v1/primary-forms-v1/source02/*
          if-no-files-found: error
          retention-days: 30
