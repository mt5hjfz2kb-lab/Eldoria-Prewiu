name: Eldoria local AI-guided real city lookdev
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths: ['tools/art-rd/eldoria_blender_vision_loop.py','.github/workflows/valoria-local-vision-lookdev.yml']
permissions:
  contents: read
concurrency:
  group: eldoria-art-windows-agent
  cancel-in-progress: false
jobs:
  bounded-agent:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 45
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop/app-*/resources/app/git/cmd/git.exe" -ErrorAction SilentlyContinue|Sort-Object FullName -Descending|Select-Object -First 1
          if($git){Split-Path $git.FullName|Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Render actual GLB, ask free local vision model, render correction
        shell: powershell
        run: |
          $env:ELDORIA_VISION_OUTPUT="$env:RUNNER_TEMP/eldoria-vision-lookdev"
          $ollama="$env:LOCALAPPDATA/Programs/Ollama/ollama.exe"
          if(-not (Test-Path $ollama)){throw "Local Ollama executable missing"}
          try { $null=Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 2 }
          catch { Start-Process -FilePath $ollama -ArgumentList 'serve' -WindowStyle Hidden; Start-Sleep -Seconds 5 }
          $tags=Invoke-RestMethod "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
          if(-not (@($tags.models.name) -contains "hf.co/Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M")) { throw "Local free vision model not installed" }
          $blender="C:\Program Files\Blender Foundation\Blender 5.2\blender.exe"
          $stdout="$env:RUNNER_TEMP/eldoria-vision-stdout.log"
          $stderr="$env:RUNNER_TEMP/eldoria-vision-stderr.log"
          $p=Start-Process -FilePath $blender -ArgumentList @("-b","--python","tools/art-rd/eldoria_blender_vision_loop.py") -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          (Get-Content $stdout -Raw)+(Get-Content $stderr -Raw) | Set-Content "$env:RUNNER_TEMP/eldoria-vision-lookdev.log" -Encoding UTF8
          Get-Content "$env:RUNNER_TEMP/eldoria-vision-lookdev.log" -Tail 90
          if($p.ExitCode -ne 0){throw "Local vision lookdev iteration failed exit=$($p.ExitCode)"}
          if(-not (Test-Path "$env:ELDORIA_VISION_OUTPUT/after.png")){throw "Missing real after render"}
          if(-not (Select-String -Path "$env:RUNNER_TEMP/eldoria-vision-lookdev.log" -Pattern "ELDORIA_LOCAL_VISION_ITERATION_PASS" -Quiet)){throw "Missing actual model-guided command proof"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-local-vision-lookdev
          path: |
            ${{ runner.temp }}/eldoria-vision-lookdev/
            ${{ runner.temp }}/eldoria-vision-lookdev.log
          retention-days: 14
