name: "[ART V4 REVIEW] Local Qwen VL independent Blender A-B 12 assets"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-12-independent-qwen-ab.yml'
      - 'tools/valoria-modular-fortress/review_cc0_v4_ab.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-12-independent-qwen-ab
  cancel-in-progress: false
jobs:
  review-twelve-assets:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 100
    steps:
      - name: Locate existing git, Blender and Ollama
        shell: powershell
        id: exes
        run: |
          if (-not (Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $dir=Split-Path $git
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
          $blender=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $blender){throw 'Blender missing'}
          "blender=$blender" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $o=(Get-Command ollama.exe -ErrorAction SilentlyContinue).Source
          if(-not $o) {$p=Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe';if(Test-Path $p){$o=$p}}
          if(-not $o){throw 'Installed Ollama missing'}
          "ollama=$o" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-12-independent-blender-v4-38819524063
          run-id: 38819524063
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/v4-ab-real
      - name: Start only existing offline Qwen3 VL model
        shell: powershell
        run: |
          $ready=$false
          try {$tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 5;$ready=$true}catch{}
          if(-not $ready) {
            Start-Process -FilePath "${{ steps.exes.outputs.ollama }}" -ArgumentList 'serve' -WindowStyle Hidden | Out-Null
            for($i=0;$i -lt 30;$i++){Start-Sleep 2;try{$tags=Invoke-RestMethod 'http://127.0.0.1:11434/api/tags' -TimeoutSec 3;$ready=$true;break}catch{}}
          }
          if(-not $ready){throw 'No existing Ollama service'}
          $names=@($tags.models|ForEach-Object {$_.name})
          if('qwen3-vl:8b-instruct-q4_K_M' -notin $names){throw "Expected already installed Qwen3 VL 8B: $names"}
      - name: Produce 12 independent A-B verdicts with raw evidence
        shell: powershell
        run: |
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/review_cc0_v4_ab.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned independent reviewer missing'}
          $script=Join-Path $env:RUNNER_TEMP 'eldoria-review-ab-v4-pinned.py'
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $input=Join-Path $env:RUNNER_TEMP 'v4-ab-real\eldoria-individual-cc0-v4'
          $output=Join-Path $env:RUNNER_TEMP 'v4-independent-scores'
          $log=Join-Path $env:RUNNER_TEMP 'v4-qwen.stdout.log'
          $err=Join-Path $env:RUNNER_TEMP 'v4-qwen.stderr.log'
          if(-not(Test-Path (Join-Path $input 'after\shrub_1.png'))){throw "Authentic A-B PNG missing: $input"}
          $proc=Start-Process -FilePath "${{ steps.exes.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$input,$output,'qwen3-vl:8b-instruct-q4_K_M') -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 25 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Independent Qwen review exit $($proc.ExitCode)"}
          $json=Get-Content (Join-Path $output 'independent_ab12.json') -Raw|ConvertFrom-Json
          if($json.results.Count -ne 12){throw "Expected 12 independent responses, got $($json.results.Count)"}
      - name: Archive full independent evaluation, without claiming ART approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-v4-qwen-independent-ab12-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v4-independent-scores/**
            ${{ runner.temp }}/v4-qwen.stdout.log
            ${{ runner.temp }}/v4-qwen.stderr.log
          if-no-files-found: warn
          retention-days: 30
