name: Eldoria compact experimental WebGL
on:
  push:
    branches: [integration/valoria-v3-unity-lookdev-20261012]
    paths:
      - .github/workflows/valoria-compact-experimental-webgl.yml
      - Unity/Assets/Eldoria/Scripts/Editor/ValoriaFirstZoneCandidateWebGL.cs
      - Unity/Assets/Eldoria/Scripts/Experimental/ValoriaFirstZonePreviewControls.cs
      - Unity/Assets/Eldoria/Scripts/Editor/ValoriaFirstZoneWebGLBudget.cs
      - Unity/Assets/Eldoria/Scripts/Experimental/ValoriaFirstZoneAnchor.cs.meta
      - Unity/Assets/Eldoria/Scripts/Experimental/ValoriaFirstZonePreviewControls.cs.meta
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-compact-experimental-webgl
  cancel-in-progress: false
jobs:
  candidate:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 65
    steps:
      - name: Expose Git before checkout
        shell: powershell
        run: |
          if(-not (Get-Command git.exe -ErrorAction SilentlyContinue)){
            $candidate=Get-ChildItem "$env:LOCALAPPDATA\GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'GIT_NOT_FOUND'}
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $candidate)
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 38261014419
          name: valoria-first-zone-v5-38261014419
          github-token: ${{ github.token }}
          path: scene-evidence
      - name: Restore editable zone and generated meshes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $scenes=@(Get-ChildItem scene-evidence -Recurse -File -Filter 'ValoriaFortification.unity')
          if($scenes.Count -ne 1){throw "EXPECTED_ONE_EDITABLE_SCENE; found $($scenes.Count)"}
          $from=$scenes[0].Directory.FullName
          $to=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets/Eldoria/Experimental/ValoriaFinishV1'
          New-Item -ItemType Directory -Path $to -Force | Out-Null
          Copy-Item (Join-Path $from '*') $to -Recurse -Force
          $deps=@(Get-ChildItem (Join-Path $to 'Generated') -Filter '*.asset' -File)
          if($deps.Count -lt 8){throw 'MISSING_GENERATED_DEPENDENCIES'}
          if((Get-Item (Join-Path $to 'ValoriaFortification.unity')).Length -lt 2000){throw 'EMPTY_FIRST_ZONE_SCENE'}
          Write-Host "FIRST_ZONE_SOURCE_STAGED deps=$($deps.Count)"
      - name: Isolate only scene-essential content for browser preview
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $assets=Join-Path $env:GITHUB_WORKSPACE 'Unity/Assets'
          $stash=Join-Path $env:RUNNER_TEMP 'valoria-browser-excluded'
          New-Item -ItemType Directory -Path $stash -Force | Out-Null
          $targets=@(
            'Eldoria/Resources',
            'StreamingAssets',
            'Mega Fantasy Props Pack/Textures',
            'NatureStarterKit2/Textures',
            'EmaceArt/Slavic World Free/Scene',
            'NatureStarterKit2/Scene'
          )
          $original=0L
          foreach($rel in $targets){
            $source=Join-Path $assets ($rel -replace '/','\')
            if(-not (Test-Path $source)){continue}
            $size=(Get-ChildItem $source -File -Recurse | Measure-Object Length -Sum).Sum
            $original+=[long]$size
            $dest=Join-Path $stash ($rel -replace '/','\')
            New-Item -ItemType Directory -Path (Split-Path $dest) -Force | Out-Null
            Move-Item $source $dest -Force
            Write-Host "ISOLATED_FROM_WEBGL $rel $size"
          }
          # Unity's persisted sector contains generated meshes and materials.
          $scene=Join-Path $assets 'Eldoria/Experimental/ValoriaFinishV1/ValoriaFortification.unity'
          $generated=Join-Path $assets 'Eldoria/Experimental/ValoriaFinishV1/Generated'
          if(-not (Test-Path $scene) -or
             @(Get-ChildItem $generated -Filter '*.asset' -File).Count -lt 8){
            throw 'ESSENTIAL_EDITABLE_FIRST_ZONE_SCENE_MISSING_AFTER_PRUNE'
          }
          Write-Host "FIRST_ZONE_RESOURCE_ISOLATION_PASS bytes_excluded=$original"
      - name: Build nonshipping WebGL viewer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_NOT_FOUND'}
          $log=Join-Path $env:RUNNER_TEMP 'ValoriaFirstZoneWebGL.log'
          $project=Join-Path $env:GITHUB_WORKSPACE 'Unity'
          $args=@('-batchmode','-quit','-projectPath',$project,'-executeMethod','Eldoria.EditorTools.ValoriaFirstZoneCandidateWebGL.Build','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(55)
          $success=$false
          while((Get-Date)-lt $deadline){
            if((Test-Path $log) -and (Select-String -Path $log -Pattern 'ELDORIA_VALORIA_FIRST_ZONE_WEBGL_CANDIDATE_PASS' -Quiet)){$success=$true;break}
            if($p.HasExited){break}
            Start-Sleep -Seconds 5
            $p.Refresh()
          }
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null}
          if(-not $success){
            if(Test-Path $log){Get-Content $log -Tail 140}
            throw 'FIRST_ZONE_WEBGL_BUILD_NOT_VERIFIED'
          }
          $output=Join-Path $env:GITHUB_WORKSPACE 'Unity/Builds/ValoriaFirstZoneWebGL'
          if(-not (Test-Path (Join-Path $output 'index.html'))){throw 'FIRST_ZONE_WEBGL_INDEX_MISSING'}
          Write-Host 'ELDORIA_FIRST_ZONE_WEBGL_BUILD_VALIDATED'
          # taskkill may return nonzero for exited Unity child processes even after successful build.
          # Do not let PowerShell propagate stale external-tool exit code after all validation passes.
          $global:LASTEXITCODE=0
          exit 0
      - name: Require browser-sized playable output
        shell: powershell
        run: |
          $folder=Join-Path $env:GITHUB_WORKSPACE 'Unity/Builds/ValoriaFirstZoneWebGL'
          $files=@(Get-ChildItem $folder -Recurse -File)
          $total=($files|Measure-Object Length -Sum).Sum
          $data=@($files|Where-Object {$_.Name -like '*.data.unityweb'})
          if($data.Count -ne 1){throw 'MISSING_REAL_WEBGL_DATA'}
          if($total -gt 650000000){throw "UNPUBLISHABLE_OVERSIZED_WEBGL_PAYLOAD bytes=$total"}
          if(-not (Test-Path (Join-Path $folder 'index.html'))){throw 'MISSING_WEBGL_INDEX'}
          Write-Host "ELDORIA_EXPERIMENTAL_WEBGL_COMPACT_PASS bytes=$total"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-compact-experimental-webgl-${{ github.run_id }}
          path: Unity/Builds/ValoriaFirstZoneWebGL/**
          if-no-files-found: warn
          retention-days: 7

  browser-qa:
    needs: candidate
    if: ${{ needs.candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eldoria-compact-experimental-webgl-${{ github.run_id }}
          github-token: ${{ github.token }}
          path: preview
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect camera behavior and screenshot before publishing
        shell: bash
        run: |
          python3 -m http.server 8765 --directory preview &
          cat > test.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:1280,height:720},deviceScaleFactor:1,hasTouch:true,isMobile:false});
              const messages=[],errors=[];
              page.on('console',x=>messages.push(x.text()));
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://localhost:8765/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(40000);
              const c=page.locator('canvas').first(),b=await c.boundingBox();
              if(!b||b.width<100||b.height<100)throw new Error('Unity canvas missing');
              await page.mouse.move(b.x+b.width*.4,b.y+b.height*.5);
              await page.mouse.down();
              for(let i=0;i<16;i++)await page.mouse.move(b.x+b.width*(.4+i*.012),b.y+b.height*.5,{steps:2});
              await page.mouse.up();
              await page.mouse.wheel(0,-400);
              await page.waitForTimeout(3000);
              const pans=messages.filter(x=>x.includes('VALORIA_CAMERA_PAN_VERIFIED'));
              const zooms=messages.filter(x=>x.includes('VALORIA_CAMERA_ZOOM_VERIFIED'));
              console.log('PAN_LOGS',JSON.stringify(pans),'ZOOM_LOGS',JSON.stringify(zooms),'JS_ERRORS',JSON.stringify(errors));
              if(!pans.length)throw new Error('Camera drag not proven');
              if(!zooms.length)throw new Error('Zoom not proven');
              if(errors.length)throw new Error('Browser runtime error');
              // Execute real Chrome touch dispatch, not DOM synthetic touch events.
              const client=await page.context().newCDPSession(page);
              const panBefore=messages.filter(x=>x.includes('VALORIA_CAMERA_PAN_VERIFIED')).length;
              const cx=Math.floor(b.x+b.width*.45), cy=Math.floor(b.y+b.height*.5);
              await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:cx,y:cy,id:1}]});
              for(let i=1;i<=12;i++){
                await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:cx+i*9,y:cy+i*2,id:1}]});
                await page.waitForTimeout(80);
              }
              await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
              await page.waitForTimeout(900);
              const touchPan=messages.filter(x=>x.includes('VALORIA_CAMERA_PAN_VERIFIED')).length>panBefore;
              if(!touchPan)throw new Error('TOUCH_DRAG_NOT_VERIFIED');
              const zoomBefore=messages.filter(x=>x.includes('VALORIA_CAMERA_ZOOM_VERIFIED')).length;
              await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:cx-40,y:cy,id:1},{x:cx+40,y:cy,id:2}]});
              for(let i=1;i<=9;i++){
                await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:cx-40-i*7,y:cy,id:1},{x:cx+40+i*7,y:cy,id:2}]});
                await page.waitForTimeout(80);
              }
              await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
              await page.waitForTimeout(900);
              if(messages.filter(x=>x.includes('VALORIA_CAMERA_ZOOM_VERIFIED')).length<=zoomBefore)
                throw new Error('TOUCH_PINCH_ZOOM_NOT_VERIFIED');
              console.log('VALORIA_MOUSE_AND_TOUCH_GESTURES_PASS');
              await page.screenshot({path:'valoria-prepublish.png',timeout:20000,animations:'disabled'});
              console.log('VALORIA_BROWSER_CAMERA_SCREENSHOT_QA_PASS');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-camera-qa-${{ github.run_id }}
          path: valoria-prepublish.png
          if-no-files-found: warn
          retention-days: 7
  publish-validated:
    needs: [candidate, browser-qa]
    if: ${{ needs.candidate.result == 'success' && needs.browser-qa.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: valoria-experimental
      url: ${{ steps.deploy.outputs.page_url }}valoria-experimental/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publication
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: eldoria-compact-experimental-webgl-${{ github.run_id }}
          github-token: ${{ github.token }}
          path: publication/valoria-experimental
      - name: Keep stable site unchanged and inspect preview assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          r=Path('publication'); e=r/'valoria-experimental'
          assert (r/'index.html').is_file() and (r/'tester-v0265'/'index.html').is_file()
          assert (e/'index.html').is_file()
          assert len(list(e.rglob('*.wasm.unityweb')))==1
          assert len(list(e.rglob('*.data.unityweb')))==1
          modified=subprocess.check_output(['git','-C',str(r),'diff','--name-only','--','index.html','tester-v0265/','v0220/','tools/']).decode()
          assert not modified,modified
          print('UNCHANGED_STABLE_SITE_VERIFIED')
          PY
          rm -rf publication/.git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publication
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Confirm published target and stable paths
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,urllib.request
          base=os.environ['URL'].rstrip('/')+'/'
          for suffix in ('valoria-experimental/index.html','index.html','tester-v0265/index.html'):
            with urllib.request.urlopen(base+suffix,timeout=25) as r:
              assert r.status==200
              print('LIVE_VERIFIED',base+suffix)
          PY
