name: Eldoria owner diagnostic mobile candidate Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}beta-native325/mobile-v4.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76d84734e0434a3cc756e0745e4fd36601d08489
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Require independently successful exact candidate QA
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:42482412101})).data;
            if(r.conclusion!=='success'||r.head_sha!=='76d84734e0434a3cc756e0745e4fd36601d08489')throw Error('Exact candidate browser and persistence checks not passed');
            const a=(await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:42481377084})).data.artifacts.find(a=>a.name==='mobile-candidate-site');
            if(a.id!==13618096453||a.digest!=='sha256:44c18cfae54e77d702f0f9439c6345252ea8502c982b970e8be9f17e64aa8090')throw Error('Candidate artifact identity mismatch');
      - uses: actions/download-artifact@v4
        with:
          run-id: 42481377084
          name: mobile-candidate-site
          github-token: ${{ github.token }}
          path: site/beta-native325
      - uses: actions/download-artifact@v4
        with:
          run-id: 42482412101
          name: mobile-candidate-evidence
          github-token: ${{ github.token }}
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          run-id: 42482412101
          name: structural-name-verification
          github-token: ${{ github.token }}
          path: entry-evidence
      - name: Validate candidate and preserve existing owner site
        run: |
          python -m pip install Brotli==1.2.1
          python - <<'PY'
          import importlib.util,pathlib,json,hashlib,subprocess
          p=pathlib.Path('site/beta-native325')
          report=json.loads(pathlib.Path('evidence/qa-structural/report.json').read_text())
          entry=json.loads(pathlib.Path('evidence/qa-entry/report.json').read_text())
          name=json.loads(pathlib.Path('entry-evidence/name-result.json').read_text())
          assert report['passed'] and not report['errors'] and not report['runtimeErrors']
          assert entry['passed'] and not entry['errors']
          assert name['matched']
          renderer=report['graphics']['renderer']
          assert renderer and 'swiftshader' not in renderer.lower() and renderer.lower()!='unknown'
          identity=json.loads((p/'release-identity.json').read_text())
          assert identity['revision']=='native325-staged4'
          assert identity['candidate_bundle_sha256']=='e5299e7293f4e2ed5a5bed30c9c87d3141a7594401d3cdb965761cba9a834faa'
          assert identity['native_parity_verified'] and identity['native_journey_verified']
          assert identity['exact_texture_aliasing_verified']
          assert identity['physical_mobile_tested'] is False
          manifest=json.loads((p/'build-manifest.json').read_text())
          renamed={}
          for key in ('loader','framework','code'):
            old=manifest[key];oldpath=old.split('?')[0];src=p/oldpath
            digest=hashlib.sha256(src.read_bytes()).hexdigest()
            newpath='Build/'+digest[:20]+'-'+src.name
            src.rename(p/newpath)
            assert hashlib.sha256((p/newpath).read_bytes()).hexdigest()==digest
            renamed[oldpath]=newpath;manifest[key]=newpath
            for field in ('decoded_sizes','decoded_parts'):
              if old in manifest.get(field,{}):manifest[field][newpath]=manifest[field].pop(old)
          for parts in manifest['decoded_parts'].values():
            for part in parts:
              if part['url'] in renamed:part['url']=renamed[part['url']]
          for item in identity['decoded_files']:
            for field in ('url','path'):
              if item.get(field) in renamed:item[field]=renamed[item[field]]
          (p/'build-manifest.json').write_text(json.dumps(manifest,indent=2))
          identity['engine_cache_addressed']=True
          subprocess.run(['node','tools/delivery/test-exact-decoded-transport.mjs',str(p)],check=True)
          external_base='https://eldoria-valoria-beta-20261108.kbkvc5c45n.chatgpt.site/'
          external={
            'payload-decoded/native325-staged4-14.gz':'0a589a79b5c5ecdced8b4cc617a4c0936e76789d5cf7e6fc5fa4b3aa118b3507',
            'payload-decoded/native325-staged4-26.gz':'c55ec17a784f001c4f61298f1e26b3961b7a8e80b9a671a1ae53c1a5a5eff159'
          }
          for path,digest in external.items():
            assert hashlib.sha256((p/path).read_bytes()).hexdigest()==digest
            (p/path).unlink()
          for parts in manifest['decoded_parts'].values():
            for part in parts:
              if part['url'] in external:part['url']=external_base+part['url']
          for item in identity['decoded_files']:
            if item.get('url') in external:item['url']=external_base+item['url']
          (p/'build-manifest.json').write_text(json.dumps(manifest,indent=2))
          identity['game_entry_url']=external_base+'?eldoria_diag=1'
          identity['external_parts_sha256']=external
          identity.update(runtime_verified=True,runtime_qa_run=42482412101,entry_qa_passed=True,graceful_reopen_verified=True,raw_reload_verified=False,release_for_external_testers=False,release_purpose='owner physical iPhone verification; external tester release blocked',runtime_environment=report['environment'],actual_renderer=renderer,peak_wasm_capacity_bytes=report['peakWasmCapacityBytes'])
          (p/'release-identity.json').write_text(json.dumps(identity,indent=2))
          entry_url=external_base+'?eldoria_diag=1'
          redirect='<!doctype html><html lang="es"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url='+entry_url+'"><title>Eldoria</title><a href="'+entry_url+'">Entrar en Valoria</a></html>'
          for alias in ('index.html','mobile-v4.html','mobile-v3.html','mobile-v1.html'):
            (p/alias).write_text(redirect)
          spec=importlib.util.spec_from_file_location('prep','tools/eldoria-private-beta/prepare-pages.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          previous=m.mirror_previous('site')
          pathlib.Path('site/.nojekyll').touch()
          size=sum(f.stat().st_size for f in pathlib.Path('site').rglob('*') if f.is_file())
          assert size<1073741824,size
          print('CANDIDATE_PAGES_READY',size,'legacy_files',len(previous))
          PY
          node --check site/beta-native325/play.js
          node tools/eldoria-private-beta/test-startup.mjs site/beta-native325
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish owner diagnostic candidate - external tester release blocked
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live exact candidate
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,time
          base=os.environ['SITE_URL'].rstrip('/')+'/beta-native325/'
          for n in range(12):
            try:
              identity=json.load(urllib.request.urlopen(base+'release-identity.json?staged4='+str(n),timeout=20))
              assert identity['revision']=='native325-staged4'
              assert identity['candidate_bundle_sha256']=='e5299e7293f4e2ed5a5bed30c9c87d3141a7594401d3cdb965761cba9a834faa'
              assert identity['runtime_verified'] is True and identity['physical_mobile_tested'] is False
              html=urllib.request.urlopen(base+'mobile-v4.html?check='+str(n),timeout=20).read()
              assert b'Entrar en Valoria' in html
              print('LIVE_MOBILE_CANDIDATE_IDENTITY_PASS',base+'mobile-v4.html');break
            except Exception:
              if n==11:raise
              time.sleep(5)
          PY
