name: Eldoria verified pretester UX owner candidate Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-main
  cancel-in-progress: false
env:
  PACKAGE_RUN: '42596176998'
  PACKAGE_SOURCE: 54bc70c80716770e4c2dc0c1f7ff5849bf6103c9
  QA_RUN: '42596176998'
  QA_SOURCE: 54bc70c80716770e4c2dc0c1f7ff5849bf6103c9
  NATIVE_RUN: '42595057735'
  NATIVE_SOURCE: be49d62e3daf490f41dba0bf8123a8e2eee64480
  CANDIDATE_REVISION: native325-mobile10-pretest-ux
jobs:
  publish:
    # P0 owner playability lock: this historical one-route deployment would
    # replace the restored playable beta10 and discard its legacy routes.
    # Never use a legacy workflow for a new A/B, even via manual dispatch.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}beta-native325/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54bc70c80716770e4c2dc0c1f7ff5849bf6103c9
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - name: Require exact successful package and real Apple GPU comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['PACKAGE_RUN']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req,timeout=30))
          assert r['head_sha']==os.environ['PACKAGE_SOURCE'] and r['status']=='completed' and r['conclusion']=='success'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['QA_RUN']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req,timeout=30))
          assert r['head_sha']==os.environ['QA_SOURCE'] and r['status']=='completed' and r['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.PACKAGE_RUN }}
          name: mobile10-candidate-site
          github-token: ${{ github.token }}
          path: site/beta-native325
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.QA_RUN }}
          name: mobile10-desktop-apple-gpu-not-iphone-certification
          github-token: ${{ github.token }}
          path: qa-evidence
      - name: Preserve native UX and verify stable-beta memory bounds
        run: |
          python -m pip install Brotli==1.2.1
          cp -r qa-evidence/evidence evidence
          python tools/eldoria-private-beta/prepare_pretest_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile10-owner-site-shell
          path: owner-shell/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish owner verification assets
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live identity
        run: |
          python - <<'PY'
          import json,os,urllib.request,time
          for n in range(12):
            try:
              url='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-native325/release-identity.json?verify='+str(n)
              r=json.load(urllib.request.urlopen(url,timeout=20))
              assert r['revision']==os.environ['CANDIDATE_REVISION'] and r['source_sha']==os.environ['NATIVE_SOURCE']
              assert r['terrain_query_runtime_cooking'] is False and not r['physical_iphone_verified']
              print('LIVE_TERRAIN_TAPE_OWNER_CANDIDATE_PASS');break
            except Exception:
              if n==11:raise
              time.sleep(5)
          PY
  publish-mobile11-world-anchored:
    # P0 owner iPhone restart: never replace restored beta10 just because
    # a workflow file changes. Future newer builds require an explicit,
    # reviewed [publish-mobile11] commit and fresh physical-device gates.
    # P0: mobile11 is physically owner-reported to restart Safari. Its
    # previously verified desktop CI cannot override the recovered beta10.
    # Future iPhone candidates must use a distinct immutable A/B route with
    # physical-device QA, not this legacy single-route publisher.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 115
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}beta-native325/
    env:
      PACKAGE_RUN: '42645753309'
      PACKAGE_SOURCE: '52b22519323b212cb17e32a73b724b603ba04812'
      NATIVE_RUN: '42645633286'
      NATIVE_SOURCE: '8dc875430241a49b4d417782dfeab2d4c7a4f315'
      CANDIDATE_REVISION: 'native325-mobile11-building-anchor'
    steps:
      - name: Checkout exact beta packaging verification tools
        uses: actions/checkout@v4
        with:
          ref: 52b22519323b212cb17e32a73b724b603ba04812
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - name: Require completed exact native engine, Bastion I-V, Apple GPU and candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          def run(run_id):
            req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as response:
              return json.load(response)
          # Publishing must be impossible until the exact native and package
          # runs succeed; an Ubuntu source-only success can never satisfy this.
          for _ in range(660):
            n=run(os.environ['NATIVE_RUN'])
            p=run(os.environ['PACKAGE_RUN'])
            assert n['head_sha']==os.environ['NATIVE_SOURCE'], 'Native SHA changed'
            assert p['head_sha']==os.environ['PACKAGE_SOURCE'], 'Packaging SHA changed'
            for value in (n,p):
              if value['status']=='completed':
                assert value['conclusion']=='success', 'Unity/QA failed; publication refused'
            if n['status']=='completed' and p['status']=='completed':
              break
            time.sleep(10)
          else: raise RuntimeError('No native and Apple GPU PASS in time; publication refused')
          print('NATIVE_UNITY_BASTION_I_V_APPLE_GPU_EXACT_SHA_GATE_PASS')
          PY
      - name: Download immutable native-certified mobile11 candidate
        uses: actions/download-artifact@v4
        with:
          run-id: 42645753309
          name: mobile11-candidate-site
          github-token: ${{ github.token }}
          path: candidate-site
      - name: Download real desktop Apple GPU WebKit regression evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 42645753309
          name: mobile11-desktop-apple-gpu-not-iphone-certification
          github-token: ${{ github.token }}
          path: apple-evidence
      - name: Checkout audited, frozen opt-in Pages pilot scripts
        uses: actions/checkout@v4
        with:
          ref: a3ef98d3a3685c509576479f4da2aab2331dd94d
          sparse-checkout: |
            tools/eldoria-private-beta/pages
            tools/eldoria-private-beta/native/ux/ValoriaIntegratedWorld.cs.txt
          sparse-checkout-cone-mode: false
          path: pilot-source
          persist-credentials: false
      - name: Restore prior approved Pages routes from immutable owner artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 42600463889
          name: github-pages
          github-token: ${{ github.token }}
          path: prior-site-archive
      - name: Verify playable files, identity and Safari/WebKit baseline comparison
        run: |
          python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          site=Path('candidate-site')
          identity=json.loads((site/'release-identity.json').read_text())
          assert identity['revision']=='native325-mobile11-building-anchor' and identity['source_sha']=='8dc875430241a49b4d417782dfeab2d4c7a4f315'
          assert str(identity['native_run'])=='42645633286'
          assert identity['pretest_ux_native_verified'] and identity['native_journey_verified']
          assert identity['native_parity_verified'] and not identity['terrain_query_runtime_cooking']
          assert identity['terrain_query_cache_sha256']
          assert not identity['release_for_external_testers']
          assert not identity['physical_mobile_tested']
          for name in ('index.html','play.js','build-manifest.json'):
            assert (site/name).is_file(), f'Missing playable entry {name}'
          report=json.loads(Path('apple-evidence/evidence/candidate/report.json').read_text())
          control=json.loads(Path('apple-evidence/evidence/control/report.json').read_text())
          assert report['passed'] and control['passed'], 'Desktop WebKit A/B failed'
          assert report['identity']['source_sha']=='8dc875430241a49b4d417782dfeab2d4c7a4f315', 'WebKit source mismatch'
          assert report['identity']['revision']=='native325-mobile11-building-anchor', 'WebKit revision mismatch'
          # A Pages deployment REPLACES every file, not only beta-native325.
          # Recover non-beta public routes from the exact earlier approved
          # github-pages artifact, so that this release cannot erase the
          # already-live unity-owner game or home entry.
          import tarfile
          from pathlib import PurePosixPath
          output_root=Path('site')
          old=Path('prior-site-archive/artifact.tar')
          assert old.is_file() and old.stat().st_size>100_000_000, 'Missing exact prior Pages restore artifact'
          recovered=[]
          with tarfile.open(old,'r:*') as archive:
            for member in archive:
              path=PurePosixPath(member.name)
              parts=path.parts
              if path.is_absolute() or '..' in parts or '\\' in member.name:
                raise RuntimeError('Unsafe prior Pages archive path: '+member.name)
              if not parts or parts[0]=='beta-native325':continue
              if member.isdir():continue
              if not member.isfile():raise RuntimeError('Prior Pages archive has non-regular file')
              destination=output_root.joinpath(*parts)
              destination.parent.mkdir(parents=True,exist_ok=True)
              with archive.extractfile(member) as original, destination.open('wb') as restored:
                shutil.copyfileobj(original,restored,length=1024*1024)
              recovered.append(str(path))
          assert (output_root/'unity-owner/index.html').is_file(), 'Live legacy Unity route not preserved'
          assert (output_root/'unity-owner/release-identity.json').is_file(), 'Previous owner identity missing'
          assert (output_root/'index.html').is_file(), 'Existing root route missing'
          output=output_root/'beta-native325'
          shutil.copytree(site,output)
          (output_root/'.nojekyll').touch()
          size=sum(p.stat().st_size for p in output_root.rglob('*') if p.is_file())
          assert size<1_073_741_824, 'Combined certified Pages exceeds official 1GiB; refuse destructive release'
          print('PAGES_MOBILE11_VERIFIED_STAGE',len(list(output.rglob('*'))),size,'preserved_previous_files',len(recovered))
          PY
          # Separate opt-in QA entry; exact certified game index remains untouched.
          # No invitations, QA events only, and no Unity progress claim until
          # an exact native build of the source-defined signal emitter passes.
          # Freeze the tested opt-in preview scripts. Never substitute a
          # moving branch or unreviewed beta source during a Pages release.
          # P0 iPhone restart breadcrumbs are opt-in/local to pilot only;
          # no change to shipped Unity, no claim of physical mobile fix.
          test "$(git -C pilot-source rev-parse HEAD)" = a3ef98d3a3685c509576479f4da2aab2331dd94d
          node --test pilot-source/tools/eldoria-private-beta/pages/*.test.mjs
          node pilot-source/tools/eldoria-private-beta/pages/pilot-stage.mjs site/beta-native325 pilot-source/tools/eldoria-private-beta/pages
          node --check site/beta-native325/play.js
          node tools/delivery/test-exact-decoded-transport.mjs site/beta-native325
      - name: Configure existing GitHub Pages route
        uses: actions/configure-pages@v5
      - name: Upload exact verified playable mobile11 bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish authorized beta owner Pages route (old ChatGPT Sites left intact)
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Confirm public release identity after deployment
        run: |
          python - <<'PY'
          import json,urllib.request,time
          url='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-native325/'
          for attempt in range(18):
            try:
              with urllib.request.urlopen(url+'release-identity.json?verify='+str(attempt),timeout=20) as response:
                identity=json.load(response)
              assert identity['revision']=='native325-mobile11-building-anchor' and identity['source_sha']=='8dc875430241a49b4d417782dfeab2d4c7a4f315'
              assert identity['pretest_ux_native_verified'] and identity['native_parity_verified']
              with urllib.request.urlopen(url+'index.html?verify='+str(attempt),timeout=20) as response:
                html=response.read()
              assert b'play.js' in html or b'unity' in html.lower(), 'Not a playable WebGL page'
              with urllib.request.urlopen(url+'pilot-preview-manifest.json?verify='+str(attempt),timeout=20) as response:
                pilot=json.load(response)
              assert pilot['source_sha']==identity['source_sha'] and pilot['external_testers_enabled'] is False
              assert pilot['telemetry_backend']=='supabase_edge_qa_only'
              with urllib.request.urlopen(url+'pilot.html?verify='+str(attempt),timeout=20) as response:
                preview=response.read()
              assert b'pilot-bootstrap.mjs' in preview and b'ELDORIA_PILOT_QA' in preview
              assert b'pilot-bootstrap.mjs' not in html, 'Default certified game must not be instrumented'
              # The first public deployment must preserve previously live
              # routes. Do not claim a successful release if it erased the
              # existing owner game while introducing the QA-only pilot.
              legacy_url='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/unity-owner/index.html?verify='+str(attempt)
              with urllib.request.urlopen(legacy_url,timeout=20) as response:
                legacy=response.read()
              assert b'<html' in legacy.lower(), 'Legacy owner route missing after deployment'
              print('LIVE_OWNER_BETA11_TIMER_ATTACHED_RELEASE_PASS',url)
              print('LIVE_OPTIONAL_GITHUB_PAGES_QA_PILOT_PRESENT_NOT_TESTER_RELEASE')
              break
            except Exception:
              if attempt==17:raise
              time.sleep(6)
          PY
  mobile11-live-webkit:
    if: github.event_name == 'push'
    needs: publish-mobile11-world-anchored
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52b22519323b212cb17e32a73b724b603ba04812
          sparse-checkout: tools/eldoria-private-beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reopen public GitHub Pages beta on actual desktop WebKit
        env:
          QA_ENGINE: webkit
          QA_VARIANT: unchanged
          QA_ENTRY: '1'
          QA_EARLY_ENTRY: '1'
          QA_SKIP_PREFLIGHT: '1'
          QA_URL: 'https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-native325/?eldoria_diag=1&eldoria_profile=1&build=native325-mobile11-building-anchor'
          QA_REVISION: 'native325-mobile11-building-anchor'
          QA_OUT: evidence/live-mobile11
        run: |
          npm install --prefix "$RUNNER_TEMP/live-beta11" --no-save playwright@1.55.0
          "$RUNNER_TEMP/live-beta11/node_modules/.bin/playwright" install webkit
          export NODE_PATH="$RUNNER_TEMP/live-beta11/node_modules"
          node tools/eldoria-private-beta/qa_webkit_residency.cjs
          python - <<'PY'
          import json,pathlib
          base=pathlib.Path('evidence/live-mobile11')
          result=json.loads((base/'report.json').read_text())
          assert result['passed'], 'Public WebKit load/reopen did not pass'
          identity=result['identity']
          assert identity['revision']=='native325-mobile11-building-anchor' and identity['source_sha']=='8dc875430241a49b4d417782dfeab2d4c7a4f315'
          assert identity['pretest_ux_native_verified'] and not identity['physical_mobile_tested']
          print('PUBLIC_MOBILE11_WEBKIT_RELOAD_PASS_NOT_PHYSICAL_IPHONE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile11-public-pages-webkit-reopen-${{ github.run_id }}
          path: evidence/
          retention-days: 14

