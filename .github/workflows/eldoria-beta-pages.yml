name: Eldoria owner verified cubemap compatibility Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}beta-native325/mobile-v6.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9207630779de31c242de69dafcb22ee65e1d5c2c
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Require exact completed Apple GPU candidate checks
        uses: actions/github-script@v7
        with:
          script: |
            const r=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:42493894120})).data;
            if(r.conclusion!=='success'||r.head_sha!=='5842448fe1ec024eff1d368d003d5da3fd70adc6')throw Error('Exact candidate QA not passed');
            const a=(await github.rest.actions.getArtifact({...context.repo,artifact_id:13623230011})).data;
            if(a.digest!=='sha256:417f15c01f3c65f81a61e7fd88b3bd52a91b7c07eba5bed37b7b9192294047ee'||a.workflow_run.id!==r.id)throw Error('Candidate artifact changed');
      - uses: actions/download-artifact@v4
        with:
          run-id: 42493894120
          name: mobile6-candidate-site
          github-token: ${{ github.token }}
          path: site/beta-native325
      - uses: actions/download-artifact@v4
        with:
          run-id: 42493894120
          name: mobile6-webkit-1.55.0
          github-token: ${{ github.token }}
          path: evidence-1.55.0
      - uses: actions/download-artifact@v4
        with:
          run-id: 42493894120
          name: mobile6-webkit-1.65.0
          github-token: ${{ github.token }}
          path: evidence-1.65.0
      - name: Validate exact candidate and preserve existing owner site
        run: |
          python -m pip install Brotli==1.2.1
          python tools/eldoria-private-beta/prepare_cubemap_pages.py
          node --check site/beta-native325/play.js
          node tools/eldoria-private-beta/test-startup.mjs site/beta-native325
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish owner candidate; physical iPhone still pending
        id: deploy
        uses: actions/deploy-pages@v4
