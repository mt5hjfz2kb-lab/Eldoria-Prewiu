name: Eldoria verified pretester UX owner candidate Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: eldoria-pages-main
  cancel-in-progress: false
env:
  PACKAGE_RUN: '42596176998'
  PACKAGE_SOURCE: 54bc70c80716770e4c2dc0c1f7ff5849bf6103c9
  QA_RUN: '42596176998'
  QA_SOURCE: 54bc70c80716770e4c2dc0c1f7ff5849bf6103c9
  NATIVE_RUN: '42595057735'
  NATIVE_SOURCE: be49d62e3daf490f41dba0bf8123a8e2eee64480
  CANDIDATE_REVISION: native325-mobile10-pretest-ux
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}beta-native325/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54bc70c80716770e4c2dc0c1f7ff5849bf6103c9
          sparse-checkout: |
            tools/eldoria-private-beta
            tools/delivery
          persist-credentials: false
      - name: Require exact successful package and real Apple GPU comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['PACKAGE_RUN']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req,timeout=30))
          assert r['head_sha']==os.environ['PACKAGE_SOURCE'] and r['status']=='completed' and r['conclusion']=='success'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['QA_RUN']
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          r=json.load(urllib.request.urlopen(req,timeout=30))
          assert r['head_sha']==os.environ['QA_SOURCE'] and r['status']=='completed' and r['conclusion']=='success'
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.PACKAGE_RUN }}
          name: mobile10-candidate-site
          github-token: ${{ github.token }}
          path: site/beta-native325
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.QA_RUN }}
          name: mobile10-desktop-apple-gpu-not-iphone-certification
          github-token: ${{ github.token }}
          path: qa-evidence
      - name: Preserve native UX and verify stable-beta memory bounds
        run: |
          python -m pip install Brotli==1.2.1
          cp -r qa-evidence/evidence evidence
          python tools/eldoria-private-beta/prepare_pretest_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile10-owner-site-shell
          path: owner-shell/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish owner verification assets
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify live identity
        run: |
          python - <<'PY'
          import json,os,urllib.request,time
          for n in range(12):
            try:
              url='https://mt5hjfz2kb-lab.github.io/Eldoria-Prewiu/beta-native325/release-identity.json?verify='+str(n)
              r=json.load(urllib.request.urlopen(url,timeout=20))
              assert r['revision']==os.environ['CANDIDATE_REVISION'] and r['source_sha']==os.environ['NATIVE_SOURCE']
              assert r['terrain_query_runtime_cooking'] is False and not r['physical_iphone_verified']
              print('LIVE_TERRAIN_TAPE_OWNER_CANDIDATE_PASS');break
            except Exception:
              if n==11:raise
              time.sleep(5)
          PY

