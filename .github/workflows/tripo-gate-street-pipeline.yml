name: Tripo GateStreetRiseRock module pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tripo-gate-street-pipeline.yml'
      - 'tools/tripo_gate_street_blender.py'
      - 'Unity/Assets/Eldoria/ArtTests/ImageTo3D/Editor/TripoGateStreetModuleReview.cs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eldoria-tripo-gate-street
  cancel-in-progress: true

jobs:
  gate-street:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 18
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4

      - name: Identify and stage GateStreetRiseRock V2 source from Downloads
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          $oldSha = '345e483c961a35738eb34fdeeca217cb79ffc7324d8989e05015322cfac8e458'
          $cutoff = (Get-Date).AddHours(-12)
          $recent = @(Get-ChildItem $downloads -File -Filter '*.glb' |
            Where-Object { $_.LastWriteTime -ge $cutoff } |
            Sort-Object LastWriteTime -Descending)
          if ($recent.Count -eq 0) { throw 'No recent GLB candidates found in Downloads.' }

          $inventory = @()
          foreach ($file in $recent) {
            $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $inventory += [pscustomobject]@{
              File = $file
              Sha = $sha
              Bytes = $file.Length
              NamedGate = ($file.Name -match 'GateStreetRiseRock')
              ExcludedFamily = ($file.Name -match 'TowerWallRock|TerraceStairRock|Bastion|Castle')
              OldGate = ($sha -eq $oldSha)
            }
            Write-Host ("candidate {0} | {1} bytes | {2:o} | sha256 {3}" -f $file.Name, $file.Length, $file.LastWriteTime, $sha)
          }

          $named = @($inventory | Where-Object { $_.NamedGate -and -not $_.ExcludedFamily -and -not $_.OldGate })
          if ($named.Count -gt 0) {
            $selected = $named | Sort-Object { $_.File.LastWriteTime } -Descending | Select-Object -First 1
          } else {
            $fallback = @($inventory | Where-Object { -not $_.ExcludedFamily -and -not $_.OldGate })
            if ($fallback.Count -ne 1) {
              throw "Cannot identify V2 safely: no named GateStreetRiseRock candidate and $($fallback.Count) non-excluded fallback candidates."
            }
            $selected = $fallback[0]
          }

          $download = $selected.File.FullName
          $sourceDir = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source"
          New-Item -ItemType Directory -Force $sourceDir | Out-Null
          $staged = Join-Path $sourceDir 'Eldoria_Module_GateStreetRiseRock_HQ.glb'
          Copy-Item $download $staged -Force
          @(
            "source_name=$($selected.File.Name)",
            "source_path=$download",
            "source_sha256=$($selected.Sha)",
            "source_bytes=$($selected.Bytes)",
            "source_last_write=$($selected.File.LastWriteTime.ToString('o'))"
          ) | Set-Content "$env:RUNNER_TEMP\gate-street-source.txt"
          Write-Host "SELECTED_V2: $($selected.File.Name) | $($selected.Bytes) bytes | sha256 $($selected.Sha)"
      - name: Locate Blender
        id: blender
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $candidate = (Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if (-not $candidate) {
            $roots = @(
              'C:\Program Files\Blender Foundation',
              "$env:LOCALAPPDATA\Programs\Blender Foundation",
              "$env:LOCALAPPDATA\Microsoft\WindowsApps"
            )
            foreach ($root in $roots) {
              if ($candidate) { break }
              if (Test-Path $root) {
                $candidate = Get-ChildItem $root -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if (-not $candidate -or -not (Test-Path $candidate)) { throw 'Blender executable not found on Unity runner.' }
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2

      - name: Blender automatic reduction and UV preparation
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $input = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\Eldoria_Module_GateStreetRiseRock_HQ.glb"
          $output = "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\Eldoria_Module_GateStreetRiseRock_50K.glb"
          $report = "$env:RUNNER_TEMP\gate-street-blender-report.json"
          $log = "$env:RUNNER_TEMP\gate-street-blender.log"
          & "${{ steps.blender.outputs.path }}" --background --python "$env:GITHUB_WORKSPACE\tools\tripo_gate_street_blender.py" -- --input $input --output $output --report $report *> $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 240
            throw "Blender GateStreetRiseRock pipeline failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $output)) { throw 'Optimized GateStreetRiseRock GLB missing after Blender.' }
          Get-Content $report

      - name: Verify Unity 6.3.23f1
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          if (-not (Test-Path $env:UNITY_EDITOR_PATH)) { throw 'UNITY_EDITOR_PATH not found' }
          $version = & $env:UNITY_EDITOR_PATH -version
          if ($version -notmatch '6000\.3\.23f1') { throw "Wrong Unity version: $version" }

      - name: Execute isolated GateStreetRiseRock Unity gate
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $folder = "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures"
          $log = "$env:RUNNER_TEMP\Eldoria-TripoModule3.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $args = @("-batchmode","-quit","-projectPath","$env:GITHUB_WORKSPACE\Unity","-executeMethod","Eldoria.EditorTools.TripoGateStreetModuleReview.Capture","-logFile",$log)
          $process = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(540000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            if (Test-Path $log) { Get-Content $log -Tail 240 }
            throw 'GateStreetRiseRock Unity gate timed out.'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 260 }
            throw "GateStreetRiseRock Unity gate failed: $($process.ExitCode)"
          }
          foreach ($name in @('strategic.png','city.png','detail.png','oblique.png','front-diagnostic.png')) {
            $file = Join-Path $folder $name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 10000) { throw "Missing/empty GateStreetRiseRock image evidence: $name" }
          }
          $metrics = Join-Path $folder 'metrics.json'
          if (-not (Test-Path $metrics) -or (Get-Item $metrics).Length -lt 100) { throw 'Missing/empty GateStreetRiseRock metrics.json' }
          Get-Content $metrics

      - name: Persist V2 validation evidence in repo
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $dest = "$env:GITHUB_WORKSPACE\docs\validation\GateStreetRiseRockV2"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\strategic.png" "$dest\19.png" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\city.png" "$dest\12.png" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\detail.png" "$dest\9.png" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\oblique.png" "$dest\oblique.png" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\front-diagnostic.png" "$dest\front-diagnostic.png" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\metrics.json" "$dest\unity-metrics.json" -Force
          Copy-Item "$env:RUNNER_TEMP\gate-street-blender-report.json" "$dest\blender-report.json" -Force
          Copy-Item "$env:RUNNER_TEMP\gate-street-source.txt" "$dest\source.txt" -Force
          $source = Get-Content "$env:RUNNER_TEMP\gate-street-source.txt"
          $blender = Get-Content "$env:RUNNER_TEMP\gate-street-blender-report.json" -Raw
          $unity = Get-Content "$env:GITHUB_WORKSPACE\Unity\TripoGateStreetModuleReviewCaptures\metrics.json" -Raw
          @(
            '# GateStreetRiseRock V2 machine validation',
            '',
            'This report is generated by the isolated V2 gate. Visual acceptance is intentionally not automated.',
            '',
            '## Source',
            $source,
            '',
            '## Blender JSON',
            $blender,
            '',
            '## Unity JSON',
            $unity
          ) | Set-Content -Encoding UTF8 "$dest\REPORT.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation/GateStreetRiseRockV2
          if (-not (git diff --cached --quiet)) {
            git commit -m "test: record GateStreetRiseRock V2 isolated gate evidence"
            git push origin HEAD:main
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-tripo-gate-street-${{ github.sha }}
          path: |
            Unity/TripoGateStreetModuleReviewCaptures/*
            Unity/Assets/Eldoria/ArtTests/ImageTo3D/Source/Eldoria_Module_GateStreetRiseRock_50K.glb
            ${{ runner.temp }}/gate-street-source.txt
            ${{ runner.temp }}/gate-street-blender-report.json
            ${{ runner.temp }}/gate-street-blender.log
            ${{ runner.temp }}/Eldoria-TripoModule3.log
          if-no-files-found: warn
