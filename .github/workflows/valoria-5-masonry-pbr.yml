name: "[ART MASONRY] Five individual CC0 limestone PBR + authentic arch wedge A-B"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-5-masonry-pbr.yml'
      - 'tools/valoria-modular-fortress/pbr_five_masonry_pilot.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-five-real-masonry-ab
  cancel-in-progress: false
jobs:
  real-artisan-stone-test:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 60
    steps:
      - name: Locate Git and installed native Blender
        shell: powershell
        id: tools
        run: |
          if (-not(Get-Command git.exe -ErrorAction SilentlyContinue)) {
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $dir=Split-Path $git
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          & $b --version | Select-Object -First 2
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/five-masonry-v3
      - uses: actions/download-artifact@v4
        with:
          name: valoria-cc0-real-stone-materials-38822341704
          run-id: 38822341704
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/five-masonry-cc0-materials
      - name: Native Blender 5 individual material/geometry interventions with matched camera
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'five-masonry-v3\eldoria-upgrade63\glb'
          $tex=Join-Path $env:RUNNER_TEMP 'five-masonry-cc0-materials'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-five-masonry-ab'
          if(-not (Test-Path (Join-Path $src 'arch_keystone_major.glb'))){throw 'Missing base arch source'}
          if(-not (Test-Path (Join-Path $tex 'rock_3_diffuse.jpg'))){throw 'Missing CC0 official PBR source'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/pbr_five_masonry_pilot.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned script unavailable'}
          $script=Join-Path $env:RUNNER_TEMP 'eldoria-five-masonry-pinned.py'
          [System.IO.File]::WriteAllLines($script,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-five-masonry.stdout.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-five-masonry.stderr.log'
          $proc=Start-Process -FilePath "${{ steps.tools.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$script,'--',$src,$tex,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 45 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Blender returned $($proc.ExitCode)"}
          $glbs=(Get-ChildItem (Join-Path $out 'glb') -Filter '*.glb').Count
          $before=(Get-ChildItem (Join-Path $out 'before') -Filter '*.png').Count
          $after=(Get-ChildItem (Join-Path $out 'after') -Filter '*.png').Count
          if($glbs -ne 5 -or $before -ne 5 -or $after -ne 5){throw "Expected 5+5+5, got $glbs+$before+$after"}
      - name: Archive individual CC0 PBR A-B candidates, no claim of visual 8/10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-five-masonry-pbr-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-five-masonry-ab/**
            ${{ runner.temp }}/eldoria-five-masonry.stdout.log
            ${{ runner.temp }}/eldoria-five-masonry.stderr.log
          if-no-files-found: warn
          retention-days: 30
