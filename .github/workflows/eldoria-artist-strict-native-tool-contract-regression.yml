name: Eldoria strict creative Blender tool routing tests
on:
  push:
    branches:
      - validation/eldoria-artist-blender-professional-tool-contracts-20261014
    paths:
      - '.github/workflows/eldoria-artist-strict-native-tool-contract-regression.yml'
      - 'tools/art-direction/full-studio/artist_loop.py'
      - 'tools/art-direction/full-studio/tests/test_professional_cycle.py'
permissions:
  contents: read
concurrency:
  group: eldoria-professional-tool-signature-contract-unit
  cancel-in-progress: true
jobs:
  genuine-ai-choices-typed-no-geometry-invention:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tools/art-direction/full-studio
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install light offline test prerequisite
        run: python -m pip install --disable-pip-version-check pillow
      - name: Execute artist syntax and exact verified Blender tool schemas
        run: |
          python -m py_compile tools/art-direction/full-studio/artist_loop.py
          python -m unittest discover -s tools/art-direction/full-studio/tests -p 'test_professional_cycle.py' -v
      - name: Fail closed on art certification or paid services
        run: |
          echo 'OFFLINE_CONTRACT_TEST_ONLY no Qwen process or Blender process launched'
