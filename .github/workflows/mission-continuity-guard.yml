name: Eldoria Mission Continuity Guard

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mission-continuity-guard.yml'
      - 'tools/mission-continuity/**'
      - 'pipeline/mission-continuity-policy-v1.json'
      - 'pipeline/night-recovery-policy-v1.json'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mission-continuity-guard.yml'
      - 'tools/mission-continuity/**'
      - 'pipeline/mission-continuity-policy-v1.json'
      - 'pipeline/night-recovery-policy-v1.json'
      - 'docs/ELDORIA_MISSION_CONTINUITY_GUARD_V1.md'

concurrency:
  group: eldoria-mission-continuity-guard
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mission continuity decisions
        run: node --test tools/mission-continuity/core.test.mjs tools/mission-continuity/nightly-core.test.mjs
      - name: Validate existing workflow governance
        run: node tools/check-workflow-governance.mjs
      - name: Dry-run live GitHub observation without writing issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSION_GUARD_WRITE_ISSUES: 'false'
          MISSION_GUARD_OUTPUT: mission-continuity-report.json
        run: node tools/mission-continuity/watch.mjs
      - name: Dry-run bounded nightly recovery without dispatching jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_RECOVERY_DRY_RUN: 'true'
          NIGHTLY_RECOVERY_OUTPUT: night-recovery-report.json
        run: node tools/mission-continuity/nightly-recovery.mjs
      - name: Verify read-only monitor report
        run: node -e "const x=require('./mission-continuity-report.json'); if(x.errors.length || x.reports.length!==3 || x.reports.some(r=>r.state==='MONITOR_ERROR'))process.exit(1)"

  observe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline/active-workstreams.json
            pipeline/mission-continuity-policy-v1.json
            pipeline/night-recovery-policy-v1.json
            tools/mission-continuity
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test decisions before live issue updates
        run: node --test tools/mission-continuity/core.test.mjs tools/mission-continuity/nightly-core.test.mjs
      - name: Inspect existing owners and recoverable runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSION_GUARD_WRITE_ISSUES: 'true'
          MISSION_GUARD_OUTPUT: mission-continuity-report.json
        run: node tools/mission-continuity/watch.mjs
      - name: Recover eligible GitHub infrastructure interruptions overnight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_RECOVERY_OUTPUT: night-recovery-report.json
        run: node tools/mission-continuity/nightly-recovery.mjs
      - name: Preserve verifiable watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-continuity-report-${{ github.run_id }}
          path: |
            mission-continuity-report.json
            night-recovery-report.json
          retention-days: 30
          if-no-files-found: warn
