name: Valoria hero surface prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-hero-surface-prototype.yml'
      - 'tools/valoria_hero_surface_prototype.py'
      - 'Unity/Assets/Eldoria/ArtTests/ImageTo3D/Editor/TripoGenericModuleReview.cs'

permissions:
  contents: read

concurrency:
  group: eldoria-valoria-hero-surface
  cancel-in-progress: true

jobs:
  hero-surface:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Expose Git installed with GitHub Desktop
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
        run: |
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $desktop = "${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate = Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $candidate) { throw 'Git not found for checkout.' }
            $dir = Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          git --version

      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Recover certified GateStreetRiseRock MV1
        shell: powershell
        run: |
          $artifactId=10941357361
          $expected='9d1a97ea385d557b77779eef7a7b65f8027bfc79a56b26081abc6b62f25a8302'
          $root="$env:RUNNER_TEMP\eldoria-hero-gate-source"
          $zip="$root.zip"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId/zip" -Headers $headers -OutFile $zip -MaximumRedirection 10
          New-Item -ItemType Directory -Force $root | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $matches=@()
          foreach($file in Get-ChildItem $root -Recurse -File -Filter '*.glb'){
            $sha=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if($sha -eq $expected){$matches += $file}
          }
          if($matches.Count -ne 1){throw "Expected exactly one certified Gate MV1 GLB, found $($matches.Count)"}
          $target="$env:RUNNER_TEMP\GateStreetRiseRock_MV1_certified.glb"
          Copy-Item $matches[0].FullName $target -Force
          Write-Host "HERO_SOURCE $($matches[0].Name) | sha256 $expected"

      - name: Locate Blender
        id: blender
        shell: powershell
        run: |
          $candidate=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $candidate){
            $root='C:\Program Files\Blender Foundation'
            if(Test-Path $root){
              $candidate=Get-ChildItem $root -Recurse -Filter blender.exe -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if(-not $candidate){throw 'Blender not found'}
          "path=$candidate" >> $env:GITHUB_OUTPUT
          & $candidate --version | Select-Object -First 2

      - name: Author isolated Stone Rock prototype
        shell: powershell
        run: |
          $input="$env:RUNNER_TEMP\GateStreetRiseRock_MV1_certified.glb"
          $output="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ArtTests\ImageTo3D\Source\Eldoria_Module_UnderReview_50K.glb"
          $report="$env:RUNNER_TEMP\valoria-hero-surface-report.json"
          $stdout="$env:RUNNER_TEMP\valoria-hero-surface.log"
          $stderr="$env:RUNNER_TEMP\valoria-hero-surface-error.log"
          $args=@('--background','--python',"$env:GITHUB_WORKSPACE\tools\valoria_hero_surface_prototype.py",'--','--input',$input,'--output',$output,'--report',$report)
          $p=Start-Process -FilePath "${{ steps.blender.outputs.path }}" -ArgumentList $args -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if($p.ExitCode -ne 0){
            if(Test-Path $stdout){Get-Content $stdout -Tail 180}
            if(Test-Path $stderr){Get-Content $stderr -Tail 180}
            throw "Hero surface Blender prototype failed: $($p.ExitCode)"
          }
          if(-not (Test-Path $output)){throw 'Hero surface output GLB missing'}
          Get-Content $report
          @{module_label='GateStreetRiseRock MV1 · Hero Surface Prototype';unity_yaw_degrees=180;lookdev_profile='valoria-neutral-overcast-v1';visual_acceptance='Surface/identity test only. Preserve monumental entrance silhouette and architecture-rock separation under the canonical Valoria neutral-overcast LookDev. Do not claim route/interface certification.'} | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE\Unity\TripoModuleReviewConfig.json"

      - name: Verify Unity
        shell: powershell
        run: |
          if(-not (Test-Path $env:UNITY_EDITOR_PATH)){throw 'UNITY_EDITOR_PATH not found'}
          $version=& $env:UNITY_EDITOR_PATH -version
          if($version -notmatch '6000\.3\.23f1'){throw "Wrong Unity version: $version"}

      - name: Capture isolated textured hero prototype
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\TripoGenericModuleReviewCaptures"
          $log="$env:RUNNER_TEMP\Eldoria-HeroSurfaceReview.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.TripoGenericModuleReview.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(15)
          while(-not $p.HasExited -and (Get-Date) -lt $deadline){
            Start-Sleep -Seconds 2
            $p.Refresh()
          }
          if(-not $p.HasExited){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            if(Test-Path $log){Get-Content $log -Tail 220}
            throw 'Hero surface Unity review timed out after 15 minutes.'
          }
          $p.Refresh()
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 240};throw "Hero surface Unity review failed: $($p.ExitCode)"}
          $textured=@('strategic-textured.png','city-textured.png','detail-textured.png')
          foreach($name in $textured){$p2=Join-Path $folder $name;if(-not(Test-Path $p2) -or (Get-Item $p2).Length -lt 10000){throw "Missing textured evidence: $name"}}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-hero-surface-prototype-${{ github.run_id }}
          path: |
            Unity/TripoGenericModuleReviewCaptures/*
            ${{ runner.temp }}/valoria-hero-surface-report.json
            ${{ runner.temp }}/valoria-hero-surface.log
            ${{ runner.temp }}/valoria-hero-surface-error.log
            ${{ runner.temp }}/Eldoria-HeroSurfaceReview.log
          if-no-files-found: warn
          retention-days: 14
