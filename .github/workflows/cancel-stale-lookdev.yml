name: Dispatch Eldoria Cuartel certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-lookdev.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-certification:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current-main Unity slice certification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/unity-slice.yml/dispatches"             -d '{"ref":"main"}'
