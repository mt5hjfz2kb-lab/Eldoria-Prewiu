name: Asset Deep Uplift Blender

on:
  workflow_dispatch:
  push:
    branches:
      - visual-proof/asset-deep-uplift-v1-r3
    paths:
      - pipeline/asset-deep-uplift-run-request.json
      - .github/workflows/asset-deep-uplift-blender.yml

permissions:
  contents: read

jobs:
  blender-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        id: req
        shell: bash
        run: |
          echo "enabled=$(jq -r '.enabled' pipeline/asset-deep-uplift-run-request.json)" >> "$GITHUB_OUTPUT"
          echo "asset=$(jq -r '.asset' pipeline/asset-deep-uplift-run-request.json)" >> "$GITHUB_OUTPUT"
          echo "input=$(jq -r '.input' pipeline/asset-deep-uplift-run-request.json)" >> "$GITHUB_OUTPUT"
          echo "mode=$(jq -r '.mode' pipeline/asset-deep-uplift-run-request.json)" >> "$GITHUB_OUTPUT"
      - name: Guard request
        shell: bash
        run: |
          test "${{ steps.req.outputs.enabled }}" = "true"
          test "${{ steps.req.outputs.mode }}" = "diagnostic"
          test -f "${{ steps.req.outputs.input }}"
      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Diagnose canonical GLB
        shell: bash
        run: |
          mkdir -p deep-uplift-evidence
          blender --background --python tools/tripo_module_blender.py -- \
            --input "${{ steps.req.outputs.input }}" \
            --output deep-uplift-evidence/unused.glb \
            --report deep-uplift-evidence/SteppedRockTerrace-diagnostic.json \
            --diagnostic-only
          test -s deep-uplift-evidence/SteppedRockTerrace-diagnostic.json
          sha256sum "${{ steps.req.outputs.input }}" | tee deep-uplift-evidence/SteppedRockTerrace-source.sha256
          stat -c '%s' "${{ steps.req.outputs.input }}" | tee deep-uplift-evidence/SteppedRockTerrace-source.bytes
      - uses: actions/upload-artifact@v4
        with:
          name: asset-deep-uplift-stepped-rock-terrace-diagnostic
          path: deep-uplift-evidence/
          if-no-files-found: error
