name: Asset Deep Uplift Blender

on:
  workflow_dispatch:
  push:
    branches:
      - visual-proof/asset-deep-uplift-v1-r3
    paths:
      - pipeline/asset-deep-uplift-run-request.json
      - .github/workflows/asset-deep-uplift-blender.yml

permissions:
  contents: read

jobs:
  blender-uplift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Guard request
        shell: bash
        run: |
          test "$(jq -r '.enabled' pipeline/asset-deep-uplift-run-request.json)" = "true"
          test "$(jq -r '.mode' pipeline/asset-deep-uplift-run-request.json)" = "surface_rescue"
          test "$(jq -r '.tripo_credits' pipeline/asset-deep-uplift-run-request.json)" = "0"
      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Build PBR rescue candidate
        shell: bash
        run: |
          asset="$(jq -r '.asset' pipeline/asset-deep-uplift-run-request.json)"
          input="$(jq -r '.input' pipeline/asset-deep-uplift-run-request.json)"
          profile="$(jq -r '.surface_profile' pipeline/asset-deep-uplift-run-request.json)"
          target="$(jq -r '.target_triangles' pipeline/asset-deep-uplift-run-request.json)"
          mintri="$(jq -r '.min_triangles' pipeline/asset-deep-uplift-run-request.json)"
          maxtri="$(jq -r '.max_triangles' pipeline/asset-deep-uplift-run-request.json)"
          mkdir -p deep-uplift-evidence
          test -f "$input"
          blender --background --python tools/tripo_module_blender.py -- \
            --input "$input" \
            --output "deep-uplift-evidence/${asset}-PBRRescue.glb" \
            --report "deep-uplift-evidence/${asset}-PBRRescue-report.json" \
            --surface-rescue-profile "$profile" \
            --target-tris "$target" \
            --min-tris "$mintri" \
            --max-tris "$maxtri"
          test -s "deep-uplift-evidence/${asset}-PBRRescue.glb"
          test -s "deep-uplift-evidence/${asset}-PBRRescue-report.json"
          sha256sum "$input" > "deep-uplift-evidence/${asset}-source.sha256"
          sha256sum "deep-uplift-evidence/${asset}-PBRRescue.glb" > "deep-uplift-evidence/${asset}-candidate.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-deep-uplift-street-landing-transition-pbr-rescue
          path: deep-uplift-evidence/
          if-no-files-found: error
