name: Asset Deep Uplift Blender

on:
  workflow_dispatch:
  push:
    branches:
      - visual-proof/asset-deep-uplift-v1-r3
    paths:
      - pipeline/asset-deep-uplift-run-request.json
      - .github/workflows/asset-deep-uplift-blender.yml

permissions:
  contents: read

jobs:
  blender-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Guard request
        shell: bash
        run: |
          test "$(jq -r '.enabled' pipeline/asset-deep-uplift-run-request.json)" = "true"
          test "$(jq -r '.mode' pipeline/asset-deep-uplift-run-request.json)" = "diagnostic_batch"
          test "$(jq '.assets | length' pipeline/asset-deep-uplift-run-request.json)" -gt 0
      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Diagnose candidate GLBs
        shell: bash
        run: |
          mkdir -p deep-uplift-evidence
          jq -c '.assets[]' pipeline/asset-deep-uplift-run-request.json | while read -r row; do
            asset="$(echo "$row" | jq -r '.asset')"
            input="$(echo "$row" | jq -r '.input')"
            test -f "$input"
            blender --background --python tools/tripo_module_blender.py -- \
              --input "$input" \
              --output "deep-uplift-evidence/${asset}-unused.glb" \
              --report "deep-uplift-evidence/${asset}-diagnostic.json" \
              --diagnostic-only
            test -s "deep-uplift-evidence/${asset}-diagnostic.json"
            sha256sum "$input" > "deep-uplift-evidence/${asset}-source.sha256"
            stat -c '%s' "$input" > "deep-uplift-evidence/${asset}-source.bytes"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: asset-deep-uplift-geometry-diagnostics
          path: deep-uplift-evidence/
          if-no-files-found: error
