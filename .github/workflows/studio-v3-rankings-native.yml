name: Studio V3 PR198 native tool production
on:
  push:
    branches: [pilot/eldoria-studio-v3-autonomous-execution-20261126]
    paths:
      - 'tools/studio-v3/rankings-premium/native/**'
      - '.github/workflows/studio-v3-rankings-native.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: studio-v3-pr198-native
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/studio-v3/rankings-premium
            tools/openai-development-studio
          fetch-depth: 2
      - name: Materialize exact PR and validate trusted tool scripts
        run: |
          set -euo pipefail
          t=tools/studio-v3/rankings-premium
          python3 "$t/materialize.py" "$RUNNER_TEMP/pr198-source"
          python3 -m pip install --quiet pillow
          python3 -m py_compile "$t/native/prepare.py" "$t/native/blender_author.py" "$t/native/unity_mcp_probe.py"
      - name: No-spend native input rehearsal
        if: github.event.head_commit.message != 'Launch PR198 isolated real native tool mission'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/studio-v3/rankings-premium/native/prepare.py --fixture "$RUNNER_TEMP/pr198-source" "$RUNNER_TEMP/pr198-native-input"
      - name: Verify one-time grant before any API use
        if: github.event.head_commit.message == 'Launch PR198 isolated real native tool mission'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/studio-v3/rankings-premium/native/prepare.py --gate
      - name: Real new art and native technical artist role
        if: github.event.head_commit.message == 'Launch PR198 isolated real native tool mission'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/studio-v3/rankings-premium/native/prepare.py --live "$RUNNER_TEMP/pr198-source" "$RUNNER_TEMP/pr198-native-input"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr198-native-input-internal
          path: ${{ runner.temp }}/pr198-native-input
          if-no-files-found: warn
          retention-days: 3
  native:
    needs: prepare
    if: github.event.head_commit.message == 'Launch PR198 isolated real native tool mission' && github.run_attempt == 1
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 25
    steps:
      - name: Verify live exclusive native lease and no existing processes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $meta=Invoke-RestMethod -Uri 'https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/contents/pipeline/active-workstreams.json?ref=main' -Headers $h
          $blob=Invoke-RestMethod -Uri ('https://api.github.com/repos/mt5hjfz2kb-lab/Eldoria-Prewiu/git/blobs/'+$meta.sha) -Headers $h
          $reg=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($blob.content -replace '\s','')))|ConvertFrom-Json
          $holder=@($reg.active|Where-Object {@($_.resources) -contains 'windows-runner-heavy'})
          if($holder.Count -ne 1 -or $holder[0].id -ne 'eldoria-studio-v3-autonomous-execution-20261126' -or $holder[0].owner -ne 'chatgpt-studio-v3-rankings-premium-20261127' -or $holder[0].ownership_revision -ne 12){throw 'Native lease moved'}
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager,UnityCrashHandler64 -ErrorAction SilentlyContinue).Count){throw 'Existing native processes; no interruption'}
          Write-Host 'PR198_NATIVE_EXCLUSIVE_LEASE_PASS'
      - uses: actions/download-artifact@v4
        with:
          name: pr198-native-input-internal
          path: ${{ runner.temp }}/pr198-native-input-${{ github.run_id }}
      - name: Actual installed Blender MCP and Unity Editor Pipeline authoring
        shell: powershell
        run: |
          $p=Join-Path $env:RUNNER_TEMP ("pr198-native-input-"+$env:GITHUB_RUN_ID)
          $o=Join-Path $env:RUNNER_TEMP ("pr198-native-result-"+$env:GITHUB_RUN_ID)
          & (Join-Path $p 'native.ps1') -InputRoot $p -OutRoot $o
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr198-native-result
          path: ${{ runner.temp }}/pr198-native-result-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
