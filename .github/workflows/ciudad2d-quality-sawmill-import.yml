name: Ciudad2D — Aserradero premium con fuente, alfa y sombra auditados
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-quality/pending_sawmill_premium.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-premium-sawmill-archive-ubuntu
  cancel-in-progress: false
jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-quality/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Cuartel.png.meta
            /Unity/Assets/Experimentos/Ciudad2D/QA/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Source-identity, SHA256, alpha, separate-shadow, dimensions and style review
        run: python tools/ciudad2d-quality/import_sawmill_premium_v1.py
      - name: Preserve exact original and review even on later Git collision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-sawmill-premium-original-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_*.png
            Unity/Assets/Experimentos/Ciudad2D/QA/AserraderoPremiumV1_*
          if-no-files-found: warn
          retention-days: 21
      - name: Commit only new sandbox assets and delete temporary signed URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-quality/pending_sawmill_premium.json
          git add --sparse -- \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_SourceV1.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_SourceV1.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_V1.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_V1.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_ShadowV1.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_ShadowV1.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/QA/AserraderoPremiumV1_green_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/AserraderoPremiumV1_grey_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/AserraderoPremiumV1_Manifest.json
          git diff --cached --quiet && { echo 'No new source-checked asset'; exit 1; }
          git commit -m 'art(city2d): archive non-destructive premium sawmill, source and separate shadow'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
