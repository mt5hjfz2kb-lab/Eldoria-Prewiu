name: Eldoria Coordinator to Directorate handoff
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: eldoria-coordinator-dg-handoff-${{ github.event.comment.id }}
  cancel-in-progress: false
jobs:
  handoff:
    if: >-
      github.event.issue.number == 25 &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      (contains(github.event.comment.body, 'LOCAL_PILOT_EVIDENCE_VERIFIED_BY_COORDINATOR') ||\n      contains(github.event.comment.body, 'LOCAL_MAINTENANCE_EVIDENCE_VERIFIED_BY_COORDINATOR') ||\n      contains(github.event.comment.body, 'ELDORIA_MAINTENANCE_INTAKE_RUN_'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate actual coordinator evidence before Directorate delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMENT: ${{ github.event.comment.id }}
          SOURCE_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          # Only verified coordinator outcomes may flow forward. Reject any failure,
          # skipped run, unrecognized status, or user-authored statement.
          if [[ "$SOURCE_BODY" != *"LOCAL_PILOT_EVIDENCE_VERIFIED_BY_COORDINATOR"* && "$SOURCE_BODY" != *"ELDORIA_MAINTENANCE_INTAKE_RUN_"* ]]; then exit 0; fi
          if [[ "$SOURCE_BODY" == *"BLOCKED / NO AUTONOMOUS PILOT PASS"* ]]; then exit 0; fi
          marker="ELDORIA_COORDINATOR_HANDOFF_SOURCE_COMMENT_$SOURCE_COMMENT"
          # Idempotent on retries. Never dispatch work or close a workstream.
          if gh api "repos/$GH_REPO/issues/23/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then
            echo 'DIRECTORATE_HANDOFF_ALREADY_RECORDED'
            exit 0
          fi
          body=$(printf '### Dirección General — entrega verificable del Coordinador\n\n%s\n\nEl Coordinador ha publicado en el Issue #25 un resultado verificado o bloqueo real del mantenimiento/piloto local. La Dirección General debe revisar el resultado y decidir aceptación, corrección o cierre; este workflow no autoriza nuevas tareas, no modifica el juego, no fusiona PR ni notifica directamente al propietario.\n\nOrigen: https://github.com/%s/issues/25#issuecomment-%s\n\n%s\n' "$marker" "$GH_REPO" "$SOURCE_COMMENT" 'Control: decisiones y gasto reservados a Dirección General y propietario.')
          gh api "repos/$GH_REPO/issues/23/comments" -f body="$body" >/dev/null
          echo 'DIRECTORATE_HANDOFF_RECORDED'
