name: "[ART WOOD FLOOR6] Three real old cracked oak CC0 photo grain models"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-three-aged-wood-cc0-v4.yml'
      - 'tools/valoria-modular-fortress/real_aged_oak_three_v4.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-three-true-cracked-oak-assets-v4
  cancel-in-progress: false
jobs:
  three-wood-photo-scans:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 90
    steps:
      - name: Find native Git and Blender on authorized PC
        id: pc
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-three-dressed-oak-joinery-38877453205
          run-id: 38877453205
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/actual_joined_wood
      - uses: actions/download-artifact@v4
        with:
          name: valoria-CC0-photographed-aged-oak-38880324077
          run-id: 38880324077
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/licensed_photo_plank
      - name: Preserve 3 real joint meshes, add separate photographed cracks and grain
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'actual_joined_wood\eldoria-three-oak-joinery\glb'
          $photo=Join-Path $env:RUNNER_TEMP 'licensed_photo_plank'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-three-aged-wood-v4'
          foreach($p in @((Join-Path $src 'timber_beam_1.glb'),(Join-Path $photo 'old_planks_02_diffuse.jpg'))){if(-not(Test-Path $p)){throw "Required PBR source missing: $p"}}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/real_aged_oak_three_v4.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Version pinned Blender script unavailable'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-three-aged-wood.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-three-aged-wood.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-three-aged-wood.err'
          $process=Start-Process -FilePath "${{ steps.pc.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$photo,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 95 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 65 -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0){throw "Native photoreal wood grain failed $($process.ExitCode)"}
          foreach($folder in @('before','after','glb')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 3){throw "Expected three true independent $folder files got $count"}
          }
      - name: Preserve licensed GLB and visual proof, no Unity art approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-three-aged-cracked-oak-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-three-aged-wood-v4/**
            ${{ runner.temp }}/eldoria-three-aged-wood.log
            ${{ runner.temp }}/eldoria-three-aged-wood.err
          if-no-files-found: warn
          retention-days: 30
