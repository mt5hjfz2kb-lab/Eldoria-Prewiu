name: Bastion I two real Qwen global composition decisions
on:
  workflow_dispatch:
  push:
    branches: [integration/valoria-bastion1-player-scene-20261012]
    paths:
      - '.github/workflows/valoria-bastion1-global-two-ai-compositions.yml'
      - 'docs/BASTION_I_GLOBAL_ART_DIRECTION_20261014.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: bastion1-global-ai-two-compositions
  cancel-in-progress: false
jobs:
  authentic-qwen-art-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Recover genuine same-camera Unity baseline and A9, never a Blender render
        uses: actions/download-artifact@v4
        with:
          name: bastion1-unity-review-frames-38569262127
          run-id: 38569262127
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/Bastion1RealVisuals
      - name: Prepare two genuine Unity camera images for Qwen visual observation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pil
          python3 - <<'PY'
          import json,hashlib,os,pathlib
          from PIL import Image
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'Bastion1RealVisuals'
          evidence=pathlib.Path('evidence');evidence.mkdir(exist_ok=True)
          scenes={}
          for folder,key in [('before','baseline'),('global-A','candidate_A13')]:
            files=[p for p in root.rglob('bastion1-player-initial.png') if p.parent.name==folder]
            if len(files)!=1:raise RuntimeError(f'Expected exactly one real Unity {folder} camera frame: got {len(files)}')
            scenes[key]=files[0]
          cam0=json.loads(pathlib.Path(str(scenes['baseline'])+'.camera.json').read_text())
          cam1=json.loads(pathlib.Path(str(scenes['candidate_A13'])+'.camera.json').read_text())
          if cam0!=cam1 or (cam0.get('width'),cam0.get('height'))!=(1440,1000):
            raise RuntimeError('Baseline and A9 are not the exact same native Unity strategic camera')
          provenance={'producer_run':38569262127,'source':'native Unity 6000.3.23f1','camera':cam0,'images':{}}
          for name,source in scenes.items():
            out=evidence/f'native-unity-{name}.jpg'
            with Image.open(source) as im:
              if im.size!=(1440,1000):raise RuntimeError('Wrong Unity screenshot dimensions')
              im.convert('RGB').resize((576,400),Image.Resampling.LANCZOS).save(out,quality=88)
            provenance['images'][name]={'original_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'qwen_image_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'resized_for_cpu_only':True}
          (evidence/'native-camera-image-provenance.json').write_text(json.dumps(provenance,indent=2))
          print('BASTION1_REAL_UNITY_A13_VISUAL_INPUT_READY camera_identical=true source_run=38569262127')
          PY
      - name: Start existing local zero-cost Qwen artist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker run -d --rm --name bastion1-global-qwen -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for n in $(seq 1 60); do if curl -fsS http://127.0.0.1:11434/api/version > evidence/ollama-version.json; then break; fi; sleep 2; done
          test -s evidence/ollama-version.json
          docker exec bastion1-global-qwen ollama pull qwen3-vl:4b-instruct
      - name: Ask Qwen for TWO genuinely different global compositions in separate bounded inference calls
        shell: bash
        timeout-minutes: 24
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,urllib.request,urllib.error,time,hashlib,base64
          e=pathlib.Path('evidence');e.mkdir(exist_ok=True)
          visual_images=[base64.b64encode((e/'native-unity-baseline.jpg').read_bytes()).decode(),base64.b64encode((e/'native-unity-candidate_A13.jpg').read_bytes()).decode()]
          visual_provenance=json.loads((e/'native-camera-image-provenance.json').read_text())
          memory=pathlib.Path('docs/evidence/valoria-bastion1-camera-scale-recovery-20261013.md').read_text()[-1300:]
          direction=pathlib.Path('docs/BASTION_I_GLOBAL_ART_DIRECTION_20261014.md').read_text(encoding='utf-8')
          shared=("Eldoria Bastion I, Unity native 3/4 strategy camera: gate lower (0,-17), upper fort (0,24), stair (0,9), protected road x[-7,7]. "
          "Occupied future lots: barracks (-16,3), sawmill (16,3), preserve safety >=5m from those plot centers. "
          "Existing west guard house at (-20.4,-11.3) and detached left wall (-21,-8), right remnant (23,1). "
          "Only reuse genuine walls, modular wall_connections, stone_path_platform, cliff_rocks, timber props, pines and original selected bushes. "
          "DO NOT rebuild gate, stair or main road. No central monumental building or resource nodes. "
          "Owner wants global visual composition, depth, coherent medieval culture and empty courtyard solved. "
          "Previous tiny hut/trees and sticker-like pavements failed. Describe no implementation or Unity pass. "
          "Visual priority: reduce vacant middle courtyard with coherent medieval built rhythm and natural worn routes; no micro-props, no fake sticker roads, no monument in centre. Proposal must be materially different from existing A9. ")
          prompts=[
            "DESIGN A: Compare BEFORE and A13 images. Now a real SIX-ARCH arcade connects the upper stone terrace, while the entire LOWER courtyard remains empty. Propose ONE large, cohesive medieval architectural treatment on existing outer west/east curtain walls and gate forecourt; no central building, no reserved lots at +/-16,y=3, no more detached shelters. Give actionable anchor world xy, dimensions, genuine architecture materials and camera composition. Short.",
            "DESIGN B: Compare BEFORE and A13 images. Propose ONE different large terrain/material/circulation hierarchy improving the empty LOWER yard without any added huts, scattered props or physically occupied future building lots. Must use the preserved detailed original meadow/stone texture and graded worn approach to preserved stone road. Specify 2-3 macro spatial interventions at grounded world xy, with visibility, navigation risk and color/scale limits. Short."
          ]
          for i,p in enumerate(prompts):
            payload={'model':'qwen3-vl:4b-instruct','stream':False,'options':{'num_ctx':4096,'num_predict':350,'temperature':0.45,'repeat_penalty':1.3},
             'messages':[{'role':'system','content':'You are the existing Eldoria AI artist. Answer the owner in MAXIMUM 500 characters, in FOUR brief numbered lines. Be specific; NO disclaimers, no repeated phrases.'},
                         {'role':'user','content':'Attached TWO REAL native Unity screenshots from exactly the same 3/4 player camera. First BEFORE, second A13 AFTER. The second has six genuine arched stone galleries. Distinguish their visual effects and pick a next material intervention. Never pretend the A13 image shows absent buildings or roads. Inspect this image for visual deficiencies before proposing spatial interventions. Never call Blender render Unity. Describe the empty courtyard and disconnected wall masses that remain evident on screen. '+shared+p+'\nNew owner art brief:\n'+direction[-1600:]+'\nPast real lessons: '+memory[-200:],'images':visual_images}] }
            (e/f'artist-{i+1}-request.json').write_text(json.dumps(payload,indent=2))
            started=time.time()
            try:
              req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=260) as rsp: result=json.load(rsp)
              raw=result.get('message',{}).get('content','')
              (e/f'artist-{i+1}-raw.txt').write_text(raw)
              proof={'model':result.get('model'),'done':result.get('done'),'elapsed_s':round(time.time()-started,2),
               'raw_sha256':hashlib.sha256(raw.encode()).hexdigest(),'raw_length':len(raw),
               'visual_image_source_run':visual_provenance['producer_run'],'two_actual_unity_before_after_images_consumed':True,
               'real_ai_response':bool(raw.strip()),'finished_four_lines':len([x for x in raw.splitlines() if x.strip()])>=3,
               'composition':('defensive_ward' if i==0 else 'terraced_old_town'),
               'art_authorship':'Qwen prompt response ONLY; no Blender vertex or Unity frame'}
              (e/f'artist-{i+1}-proof.json').write_text(json.dumps(proof,indent=2))
              print('BASTION1_GLOBAL_REAL_QWEN_RESPONSE',json.dumps(proof))
            except urllib.error.HTTPError as ex:
              body=ex.read().decode('utf-8','replace')[:3000]
              (e/f'artist-{i+1}-error.txt').write_text(repr(ex)+' SERVER_BODY='+body)
              print('BASTION1_QWEN_HTTP_REJECTION',i+1,ex.code,body)
            except Exception as ex:
              (e/f'artist-{i+1}-error.txt').write_text(repr(ex))
              print('BASTION1_QWEN_RECOVERABLE_INFERENCE_FAILURE',i+1,repr(ex))
          # Fail closed if BOTH responses are empty/truncated. The runner's
          # technical success is not a design/Unity/art approval.
          proofs=[json.loads(f.read_text()) for f in e.glob('artist-*-proof.json')]
          if not proofs or not any(p.get('real_ai_response') and p.get('finished_four_lines') for p in proofs):
            raise RuntimeError('No usable original Qwen composition decision; artistic cycle not begun')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bastion1-qwen-two-global-compositions-${{ github.run_id }}
          path: evidence/**
          retention-days: 14
