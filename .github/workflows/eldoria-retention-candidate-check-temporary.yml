name: "[TEMP] Eldoria retention branch-only verification"
on:
  push:
    branches:
      - cost/artifact-retention-references-20261104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/eldoria-retention-candidate-check-temporary.yml
            /.github/workflows/art-production-plan.yml
            /.github/workflows/eldoria-visual-qa-auto.yml
            /.github/workflows/eldoria-work-status.yml
            /docs/ELDORIA_PARALLEL_WORKSTREAM_PROTOCOL.md
            /docs/ELDORIA_REFERENCIAS_Y_RETENCION_EVIDENCIAS_20261104.md
            /pipeline/visual-authority-routing-v1.json
            /references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg
      - name: Install YAML parser (non-production test)
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Verify exact retention, image preservation and upload paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, yaml
          jobs={
            '.github/workflows/art-production-plan.yml':('plan',3,'art-production-plans/'),
            '.github/workflows/eldoria-visual-qa-auto.yml':('compare',2,'visual-report/report.json'),
            '.github/workflows/eldoria-work-status.yml':('report',1,'work-status/'),
          }
          for filename,(job,retention,path) in jobs.items():
              src=Path(filename).read_text()
              d=yaml.safe_load(src)
              steps=d['jobs'][job]['steps']
              uploads=[s for s in steps if str(s.get('uses','')).startswith('actions/upload-artifact@')]
              assert len(uploads)==1,(filename,len(uploads))
              config=uploads[0]['with']
              assert int(config['retention-days'])==retention,(filename,config)
              assert path in config['path'],(filename,config['path'])
              if job=='compare':
                  assert config['path'].strip()=='visual-report/report.json'
                  assert 'Compare certified Unity screenshots' in src
              print('RETENTION_PASS',filename,'days=',retention,'path=',path)
          route=json.loads(Path('pipeline/visual-authority-routing-v1.json').read_text())
          ref=route['canonical_visual_authority']
          name=ref['reference']
          actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          assert actual==ref['reference_sha256'],(actual,ref['reference_sha256'])
          print('APPROVED_REFERENCE_UNCHANGED',name,actual)
          protocol=Path('docs/ELDORIA_PARALLEL_WORKSTREAM_PROTOCOL.md').read_text()
          assert 'no archivarlas indefinidamente' in protocol
          policy=Path('docs/ELDORIA_REFERENCIAS_Y_RETENCION_EVIDENCIAS_20261104.md').read_text()
          assert 'No se modifica' in policy and 'dry-run' in policy
          print('RETENTION_POLICY_PASS')
          PY
