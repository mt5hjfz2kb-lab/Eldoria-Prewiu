name: "[VALORIA] Artist-authored bridge variant Blender to isolated Unity"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-layered-bridge-variant.yml'
      - 'docs/evidence/valoria-layered-construction-20261016/author-BridgeLevelAccessV1.py'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Variants/BridgeLevelAccessV1/Editor/**'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-layered-bridge-v1-original-authority
  cancel-in-progress: false
jobs:
  blender-art-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender zero spend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1-mesa-dri
      - name: Derive genuine editable bridge mesh from locked original
        run: |
          mkdir -p docs/evidence/valoria-layered-construction-20261016/bridge-v1
          blender -b -t 2 --python docs/evidence/valoria-layered-construction-20261016/author-BridgeLevelAccessV1.py -- \
            art-source/valoria/production/bridge-family-v1/BridgeFamilyV1.blend \
            docs/evidence/valoria-layered-construction-20261016/bridge-v1
          python3 - <<'PY'
          import json,os
          p="docs/evidence/valoria-layered-construction-20261016/bridge-v1"
          j=json.load(open(p+"/BridgeLevelAccessV1-manifest.json"))
          assert j["source_original_unchanged"] and j["pavers"]==52
          assert j["bridge_z_limits"]==[-19.65,-9.35]
          assert 1000<j["authored_triangles"]<30000
          assert os.path.getsize(p+"/BridgeLevelAccessV1.blend")>100000
          assert os.path.getsize(p+"/BridgeLevelAccessV1.glb")>30000
          print("VALORIA_AUTHOR_EDITABLE_VARIANT_GEOMETRY_PASS",j["generated_glb_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-bridge-v1-source-${{ github.run_id }}
          path: docs/evidence/valoria-layered-construction-20261016/bridge-v1/
          if-no-files-found: error
          retention-days: 30
  unity-integration:
    needs: blender-art-source
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    defaults:
      run:
        working-directory: valoria-bridge-v1
    steps:
      - name: Resolve existing GitHub Desktop git.exe
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git executable unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-bridge-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-bridge-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify exclusive ownership, machine free, unchanged reference
        shell: powershell
        run: |
          $registry=Get-Content "$env:GITHUB_WORKSPACE/valoria-bridge-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $own=@($registry.active|Where-Object {$_.id -eq "valoria-master-plan-layered-construction-20261016"})
          $others=@($registry.active|Where-Object {$_.id -ne "valoria-master-plan-layered-construction-20261016" -and $_.resources -contains "windows-runner-heavy"})
          if($own.Count -ne 1 -or $others.Count){throw 'Runner claim conflict'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native Unity/Blender busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity editor missing'}
          $ref=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower()
          if($ref -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Reference mismatch'}
      - uses: actions/download-artifact@v4
        with:
          name: valoria-bridge-v1-source-${{ github.run_id }}
          path: ${{ github.workspace }}/valoria-bridge-v1/docs/evidence/valoria-layered-construction-20261016/bridge-v1
      - name: Stage derived real 3D mesh only
        shell: powershell
        run: |
          $src='docs/evidence/valoria-layered-construction-20261016/bridge-v1/BridgeLevelAccessV1.glb'
          $dst='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Sources'
          if(-not(Test-Path $src)){throw 'Missing generated real authored bridge mesh'}
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item $src "$dst/BridgeLevelAccessV1.glb"
      - name: Native Unity render candidate from preserved ABCD
        shell: powershell
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'valoria-blender-bridge-v1.log'
          $args=@("-batchmode","-force-d3d11","-projectPath","$env:GITHUB_WORKSPACE/valoria-bridge-v1/Unity",
            "-executeMethod","Eldoria.ValoriaLayered.Editor.ValoriaBridgeLevelAccessV1.Build","-logFile",$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2700000)){
            & taskkill.exe /PID $p.Id /T /F | Out-Null
            throw 'Unity Blender bridge integration timeout'
          }
          Get-Content $log -Tail 125
          Copy-Item $log docs/evidence/valoria-layered-construction-20261016/bridge-v1/Unity-build.log
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_REAL_BLENDER_BRIDGE_V1_NATIVE_COMPLETE' -Quiet)){
            throw "Bridge real native test failed exit=$($p.ExitCode)"
          }
      - name: Gate native scene prefab and comparable camera frames
        shell: powershell
        run: |
          $root="Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction"
          $ev="docs/evidence/valoria-layered-construction-20261016/bridge-v1"
          foreach($f in @("$root/Valoria_MasterPlan_Layers_ABCD_BridgeV1.unity",
            "$root/GeneratedBridgeV1/BridgeLevelAccessV1.prefab","$ev/bridge-v1-unity.json",
            "$ev/bridge-v1-zoom12.png","$ev/bridge-v1-zoom19.png",
            "$ev/bridge-v1-zoom9.png","$ev/bridge-v1-portrait.png")){
             if(-not(Test-Path $f)){throw "Missing real source/Unity output $f"}
          }
          $result=Get-Content "$ev/bridge-v1-unity.json" -Raw | ConvertFrom-Json
          if(-not $result.source_hash_verified -or -not $result.deck_collision_original_preserved -or
              -not $result.unity_scale_one){throw 'Unvalidated native variant geometry'}
          Write-Host "VALORIA_EDITED_BLENDER_BRIDGE_UNITY_TECH_PASS; awaiting independent full scene A/B"
      - name: Preserve all editable sources and native captures in separate branch only
        shell: powershell
        run: |
          git config user.name "Valoria isolated Blender+Unity bridge"
          git config user.email "bridge-variant@users.noreply.github.com"
          git add -f -- docs/evidence/valoria-layered-construction-20261016/bridge-v1/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedBridgeV1/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABCD_BridgeV1.unity
          if(-not(git diff --cached --quiet)){
            git commit -m "evidence(valoria): editable Blender variant and real Unity bridge A/B candidate"
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch changed: preserve artifact, never force push'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-bridge-v1-native-${{ github.run_id }}
          path: |
            valoria-bridge-v1/docs/evidence/valoria-layered-construction-20261016/bridge-v1/**
            valoria-bridge-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedBridgeV1/**
            valoria-bridge-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_MasterPlan_Layers_ABCD_BridgeV1.unity
          if-no-files-found: warn
