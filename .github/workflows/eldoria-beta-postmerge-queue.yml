name: Eldoria integrated beta — retire obsolete pre-editor queue only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/eldoria-beta-postmerge-queue.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: eldoria-integrated-postmerge-queue-recovery
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel only the unresponsive obsolete wait before Unity
        uses: actions/github-script@v7
        with:
          script: |
            const id=43337524782;
            const run=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:id})).data;
            if(run.status==='completed'){core.info('Obsolete run already terminal');return;}
            if(run.head_sha!=='f1c8dd673ee74072d4bcf646da1413cd551ebaf6'||
               run.path!=='.github/workflows/ui-progression-cert.yml')throw Error('Unexpected target');
            const prior=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:43338146206,per_page:100})).data.jobs;
            const request=prior.find(j=>j.name==='stage')?.steps?.find(s=>s.name==='Replace only the obsolete pre-editor lease wait with the postmerge gate');
            if(request?.conclusion!=='success'||Date.now()-Date.parse(request.completed_at)<300000)
              throw Error('Normal cancellation must have completed at least five minutes earlier');
            const file=(await github.rest.repos.getContent({...context.repo,path:'pipeline/active-workstreams.json',ref:'main'})).data;
            const blob=(await github.rest.git.getBlob({...context.repo,file_sha:file.sha})).data;
            const registry=JSON.parse(Buffer.from(blob.content,'base64').toString('utf8'));
            const claims=registry.active.filter(x=>(x.resources||[]).includes('windows-runner-heavy'));
            if(claims.length!==1||claims[0].id!=='eldoria-private-beta-i-v-20261107'||
               claims[0].owner!=='chatgpt-work-recovery-4b742ab71c8e-20261112'||claims[0].ownership_revision<65||
               claims[0].branch!=='main'||claims[0].phase!=='INTEGRATED_BETA_POSTMERGE_RELEASE')
              throw Error('Live postmerge ownership changed');
            const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:id,per_page:100})).data.jobs;
            const native=jobs.find(j=>j.name==='certify');
            if(!native)throw Error('Expected obsolete job missing');
            if(native.status!=='queued'){
              const steps=native.steps||[];
              const lease=steps.find(s=>s.name==='Check live native-editor lease before downloading the Unity project');
              if(lease?.status!=='in_progress'||steps.some(s=>s.number>lease.number&&!['queued','pending'].includes(s.status)))
                throw Error('No cancellation is allowed after the editor lease wait');
            }
            await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{
              ...context.repo,run_id:id});
            core.info('Only obsolete queued/pre-editor run retired. Replacement 43338146170 and all live Unity work preserved.');
