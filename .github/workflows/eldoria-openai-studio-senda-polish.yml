name: Studio - Senda material and composition polish
on:
  push:
    branches: [pilot/eldoria-openai-development-studio-20261125]
    paths:
      - 'tools/openai-development-studio/senda-polish-closeout.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-senda-polish-v3
  cancel-in-progress: false
jobs:
  benchmark:
    if: ${{ false }} # paid mission completed; no automatic repetitions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Verify real evidence and bounded plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd tools/openai-development-studio
          python3 test_economics_v2.py
          gh run download 45704914735 --repo "$GITHUB_REPOSITORY" --name senda-brecha-web3d-6668a00adef5c27a27c0775f0fd237e1729e1afb --dir /tmp/senda-polish-baseline
          python3 prepare_senda_polish.py /tmp/senda-polish-baseline /tmp/senda-packet
          python3 mission_packet.py --packet /tmp/senda-packet/packet.json
      - name: Five agents with exact 1.45 USD reservation
        id: live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELDORIA_AUTH_EVENT: senda-concept-polish-v3
        run: |
          set -eu
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/senda-start
          cd tools/openai-development-studio
          cp senda-benchmark-budget.json budget-cycle.json
          python3 - <<'PY'
          import studio,mission_packet,generate_candidate as art
          studio.MAX_OUTPUT=2200
          # Only this explicitly authorized material study requests opaque output.
          original=art.generate
          def opaque(payload,key):
              payload=dict(payload,background="opaque")
              return original(payload,key)
          art.generate=opaque
          mission_packet.execute("/tmp/senda-packet/packet.json","/tmp/senda-result",True,"senda-concept-polish-v3")
          PY
      - name: Record usage even on partial failure
        if: always() && steps.live.outcome != 'skipped'
        env:
          LIVE_STATUS: ${{ steps.live.outcome }}
        run: |
          mkdir -p /tmp/senda-economics
          python3 tools/openai-development-studio/intervention_report.py collect --root /tmp/senda-result --run "$GITHUB_RUN_ID" --request senda-concept-polish-v3 --started "$(cat /tmp/senda-start)" --finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --source-run 45704914735 --status "$LIVE_STATUS" --out "/tmp/senda-economics/run-$GITHUB_RUN_ID.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-polish-result-${{ github.run_id }}
          path: /tmp/senda-result/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senda-polish-economics-${{ github.run_id }}
          path: /tmp/senda-economics/
          retention-days: 30
          if-no-files-found: warn

  archive:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/openai-development-studio
      - name: Archive actual sanitized economics receipt without OpenAI access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/senda-receipts
          gh run download 45707395248 --repo "$GITHUB_REPOSITORY" --name senda-polish-economics-45707395248 --dir /tmp/senda-receipts
          python3 - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          r=json.loads(Path('/tmp/senda-receipts/run-45707395248.json').read_text())
          assert r['calls_recorded']==5 and r['estimate_complete'] and r['billed_usd'] is None
          assert Decimal(r['estimated_known_usd'])==Decimal('.08371050')
          PY
          python3 tools/openai-development-studio/publish_receipts.py /tmp/senda-receipts
