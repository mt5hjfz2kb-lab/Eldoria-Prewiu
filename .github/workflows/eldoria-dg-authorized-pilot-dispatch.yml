name: Eldoria DG authorized pilot dispatcher
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: eldoria-dg-authorized-pilot-dispatch
  cancel-in-progress: false
jobs:
  proof:
    if: >-
      github.event.issue.number == 23 &&
      github.event.comment.user.login == 'mt5hjfz2kb-lab' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'ELDORIA_DG_DISPATCH_M16_ACCEPTANCE_E2E_20261008'
    uses: ./.github/workflows/m16-pilot-two-jobs.yml
    permissions:
      contents: read
  report:
    needs: proof
    if: >-
      always() &&
      github.event.issue.number == 23 &&
      github.event.comment.user.login == 'mt5hjfz2kb-lab' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'ELDORIA_DG_DISPATCH_M16_ACCEPTANCE_E2E_20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Independently verify exact source handoff and report to Directorate
        uses: actions/download-artifact@v4
        if: needs.proof.result == 'success'
        with:
          name: m16-pilot-handoff
          path: evidence
      - name: Emit verified result to canonical Issue 23
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROOF_RESULT: ${{ needs.proof.result }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          marker="ELDORIA_DG_E2E_ACCEPTANCE_RUN_$RUN_ID"
          if gh api "repos/$GH_REPO/issues/23/comments?per_page=100" --paginate --jq '.[].body' | grep -Fq "$marker"; then echo 'ALREADY_RECORDED'; exit 0; fi
          verdict=BLOCKED
          details='Reusable A/B pipeline failed; no independent acceptance.'
          if [[ "$PROOF_RESULT" == success ]] && [[ -f evidence/source-sha.txt && -f evidence/run-id.txt && -f evidence/source-sha.sha256 ]]; then
            if (cd evidence && sha256sum -c source-sha.sha256) && [[ "$(cat evidence/source-sha.txt)" == "$SOURCE_SHA" ]] && [[ "$(cat evidence/run-id.txt)" == "$RUN_ID" ]]; then
              verdict=E2E_COORDINATOR_CHAIN_PASS
              details='Owner authorized through Issue #23; M16-A tests and handoff, downstream independent M03 QA, run/SHA/hash verified in the SAME reusable workflow chain. Zero paid API, no human intermediate click.'
            fi
          fi
          body=$(printf '### DG — resultado automático autorizado\n\n%s\n\n**Veredicto:** %s\n**Run:** https://github.com/%s/actions/runs/%s\n**SHA:** %s\n\n%s\n\nEste resultado no demuestra 15 agentes locales ni notificación instantánea a ChatGPT.' "$marker" "$verdict" "$GH_REPO" "$RUN_ID" "$SOURCE_SHA" "$details")
          gh api "repos/$GH_REPO/issues/23/comments" -f body="$body" >/dev/null
          test "$verdict" = E2E_COORDINATOR_CHAIN_PASS
