name: "[ART OAK FLOOR6] Three real hand-dressed mortised wooden modules"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-oak-three-true-joinery.yml'
      - 'tools/valoria-modular-fortress/real_oak_joinery_three_v2.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-three-oak-joinery-alone
  cancel-in-progress: false
jobs:
  real-three-timbers:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 60
    steps:
      - name: Installed native Blender and Git
        id: pc
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Missing Git'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Missing Blender'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-eight-oak-iron-38823915374
          run-id: 38823915374
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/timber_brown_old
      - uses: actions/download-artifact@v4
        with:
          name: valoria-cc0-real-stone-materials-38823501643
          run-id: 38823501643
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/wood_photo_cc0
      - name: Model photo oak grains and true joined timbers individually in Blender
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'timber_brown_old\eldoria-oak-iron-eight\glb'
          $textures=Join-Path $env:RUNNER_TEMP 'wood_photo_cc0'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-three-oak-joinery'
          if(-not(Test-Path (Join-Path $src 'timber_brace_X.glb'))){throw 'Braced original missing'}
          if(-not(Test-Path (Join-Path $textures 'oak_veneer_05_diffuse.jpg'))){throw 'CC0 veneer missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/real_oak_joinery_three_v2.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned wood code missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-real-joinery-oak.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-joinery-oak.log'
          $err=Join-Path $env:RUNNER_TEMP 'eldoria-joinery-oak.err'
          $process=Start-Process -FilePath "${{ steps.pc.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$textures,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 90 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0){throw "Three true wooden modules failed: $($process.ExitCode)"}
          foreach($folder in @('glb','before','after')){
            $count=(Get-ChildItem (Join-Path $out $folder) -File).Count
            if($count -ne 3){throw "Expected 3 $folder, got $count"}
          }
      - name: Preserve only independent models and A-B for director and owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-three-dressed-oak-joinery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-three-oak-joinery/**
            ${{ runner.temp }}/eldoria-joinery-oak.log
            ${{ runner.temp }}/eldoria-joinery-oak.err
          if-no-files-found: warn
          retention-days: 30
