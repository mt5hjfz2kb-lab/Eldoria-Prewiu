name: "[ART WATER FLOOR6] Organic transparent alpine river tile"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-organic-river-water-v8.yml'
      - 'tools/valoria-modular-fortress/organic_river_water_tile_v8.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-one-standalone-river-water-study
  cancel-in-progress: false
jobs:
  single-natural-river-tile:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    steps:
      - name: Discover installed Windows Git and Blender
        shell: powershell
        id: local
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} |
              Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Native Blender missing'}
          "blender=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-individual-quality-63-38813966671
          run-id: 38813966671
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/valoria-legacy-water
      - name: Sculpt one organic glTF alpine river asset, same camera before after
        shell: powershell
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'valoria-legacy-water\eldoria-upgrade63\glb'
          $dst=Join-Path $env:RUNNER_TEMP 'valoria-one-river-natural-v8'
          if(-not(Test-Path (Join-Path $src 'river_water_tile.glb'))){throw 'Original river water GLB missing'}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/organic_river_water_tile_v8.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Version pinned code unavailable'}
          $py=Join-Path $env:RUNNER_TEMP 'valoria-river-pinned.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'valoria-river-water.log'
          $err=Join-Path $env:RUNNER_TEMP 'valoria-river-water.err'
          $p=Start-Process -FilePath "${{ steps.local.outputs.blender }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$src,$dst) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 90 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 55 -ErrorAction SilentlyContinue
          if($p.ExitCode -ne 0){throw "Blender organic river failed $($p.ExitCode)"}
          foreach($file in @('glb\river_water_tile.glb','before\river_water_tile.png','after\river_water_tile.png','reports\one_real_river_water_tile.json')){
            if(-not(Test-Path (Join-Path $dst $file))){throw "No candidate $file"}
          }
      - name: Archive independent GLB and true camera A/B, no Unity scene changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valoria-one-real-river-water-v8-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/valoria-one-river-natural-v8/**
            ${{ runner.temp }}/valoria-river-water.log
            ${{ runner.temp }}/valoria-river-water.err
          retention-days: 30
          if-no-files-found: warn
