name: Cancel stale Eldoria visual run

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded LookDev run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cancelling superseded visual/inventory runs if still active"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36496074137/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36496417213/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36496132939/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36496152426/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36496561486/cancel" || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/36497039155/cancel" || true
