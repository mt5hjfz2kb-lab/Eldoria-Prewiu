name: Eldoria Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v0220/index.html'
      - '.github/workflows/browser-qa.yml'

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser QA
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run v0.22 in real Chromium
        run: |
          cat > /tmp/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server=spawn('python3',['-m','http.server','4173','--directory','v0220'],{stdio:'ignore'});
          await new Promise(r=>setTimeout(r,1000));
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          await page.waitForTimeout(1200);
          console.log('TITLE',await page.title());
          console.log('BODYCLASS',await page.locator('body').getAttribute('class'));
          console.log('E22HUD',await page.locator('.e22Hud').count());
          console.log('SCENE',await page.locator('body.v022-core-active.e22 > .scene').count());
          console.log('NAV',await page.locator('.e22Nav').count());
          console.log('VISIBLE_TEXT',(await page.locator('body').innerText()).slice(0,1800));
          console.log('ERRORS',JSON.stringify(errors));
          await page.screenshot({path:'qa-start.png',fullPage:true});
          if(errors.length) throw new Error(errors.join('\n'));
          if(await page.locator('.e22Hud').count()!==1) throw new Error('v0.22 HUD did not start');
          if(await page.locator('body.v022-core-active.e22 > .scene').count()!==1) throw new Error('v0.22 scene did not render');
          // Close intro overlays until kingdom is interactable.
          for(let n=0;n<12;n++){
            const btn=page.locator('.e22Overlay button:visible').last();
            if(await btn.count()) { await btn.click(); await page.waitForTimeout(120); } else break;
          }
          console.log('POSTINTRO',(await page.locator('body').innerText()).slice(0,1200));
          if(await page.locator('[data-poi="sawmill"]').count()!==1) throw new Error('Sawmill unavailable after intro');
          // First-player interaction must be explicit and contextual.
          await page.locator('[data-poi="sawmill"]').click();
          await page.waitForTimeout(100);
          if(await page.locator('[data-context-action]').count()!==1) throw new Error('Sawmill did not open contextual action');
          console.log('CONTEXT',await page.locator('[data-context-action]').innerText());
          await page.screenshot({path:'qa-first-action.png',fullPage:true});
          await browser.close();server.kill();
          JS
          node /tmp/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-browser-qa
          path: qa-*.png
