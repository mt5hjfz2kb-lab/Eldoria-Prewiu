name: "[ART IRON] Two genuine arched forged portcullis modular gates"
on:
  push:
    branches: [art/valoria-63-individual-quality-uplift-20261015]
    paths:
      - '.github/workflows/valoria-two-forged-portcullis.yml'
      - 'tools/valoria-modular-fortress/forged_arch_portcullis_two.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: valoria-two-authentic-arched-portcullises
  cancel-in-progress: false
jobs:
  fabricate-two-iron-grilles:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    steps:
      - name: Existing PC Git and Blender executables
        id: bins
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'GitHubDesktop') -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources\app\git\cmd\git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            $d=Split-Path $git;Add-Content $env:GITHUB_PATH $d;$env:PATH="$d;$env:PATH"
          }
          $b=Get-ChildItem 'C:\Program Files\Blender Foundation' -Filter blender.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if(-not $b){throw 'Blender missing'}
          "exe=$b" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: valoria-eight-oak-iron-38823915374
          run-id: 38823915374
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/forge-gate-base
      - uses: actions/download-artifact@v4
        with:
          name: valoria-cc0-real-stone-materials-38823501643
          run-id: 38823501643
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/forge-gate-maps
      - name: Rebuild two single iron gate modules and render A/B at fixed lens
        shell: powershell
        run: |
          $base=Join-Path $env:RUNNER_TEMP 'forge-gate-base\eldoria-oak-iron-eight\glb'
          $cc0=Join-Path $env:RUNNER_TEMP 'forge-gate-maps'
          $out=Join-Path $env:RUNNER_TEMP 'eldoria-forged-arched-portcullis'
          foreach($f in @((Join-Path $base 'portcullis_large.glb'),(Join-Path $cc0 'rusty_metal_05_diffuse.jpg'))){if(-not(Test-Path $f)){throw "Source missing $f"}}
          $spec="$env:GITHUB_SHA"+':tools/valoria-modular-fortress/forged_arch_portcullis_two.py'
          $lines=& git show $spec
          if($LASTEXITCODE -ne 0 -or -not $lines){throw 'Pinned builder source missing'}
          $py=Join-Path $env:RUNNER_TEMP 'eldoria-forged-iron-pinned.py'
          [System.IO.File]::WriteAllLines($py,[string[]]$lines,[System.Text.UTF8Encoding]::new($false))
          $log=Join-Path $env:RUNNER_TEMP 'eldoria-iron-gates.log';$err=Join-Path $env:RUNNER_TEMP 'eldoria-iron-gates.err'
          $proc=Start-Process -FilePath "${{ steps.bins.outputs.exe }}" -ArgumentList @('--background','--python-exit-code','1','--python',$py,'--',$base,$cc0,$out) -PassThru -Wait -RedirectStandardOutput $log -RedirectStandardError $err
          Get-Content $log -Tail 100 -ErrorAction SilentlyContinue
          Get-Content $err -Tail 60 -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "Iron gate Blender $($proc.ExitCode)"}
          foreach($name in @('portcullis_large','portcullis_small')){
            foreach($path in @("glb\$name.glb","before\$name.png","after\$name.png")){
              if(-not(Test-Path (Join-Path $out $path))){throw "Missing gate result $path"}
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-two-handforged-gates-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eldoria-forged-arched-portcullis/**
            ${{ runner.temp }}/eldoria-iron-gates.log
            ${{ runner.temp }}/eldoria-iron-gates.err
          if-no-files-found: warn
          retention-days: 30
