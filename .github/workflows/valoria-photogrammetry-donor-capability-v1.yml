name: "[R&D] Valoria Photogrammetry Donor Capability v1"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/valoria-photogrammetry-donor-capability-v1.yml"
      - "tools/valoria-photogrammetry-donor-capability-v1/**"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender p7zip-full libegl1 libgl1-mesa-dri libglx-mesa0 curl
          blender --version
          7z | head -4

      - name: Fetch top CC0 stone masonry candidates
        run: |
          mkdir -p /tmp/photo-proof/wall /tmp/photo-proof/evidence
          echo "Rock donor already validated in run 37445549161 / artifact 11403535192" > /tmp/photo-proof/rock-files.txt

          python - <<'PY'
          import json, os, urllib.parse, urllib.request, zipfile
          UA={"User-Agent":"EldoriaResearch/1.0"}

          def get_json(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.load(r)

          assets=[]
          used=[]
          for q in ["stone wall","masonry stone","stone rock wall","stone"]:
              url="https://ambientcg.com/api/v3/assets?"+urllib.parse.urlencode({"q":q,"limit":150})
              try:
                  data=get_json(url)
                  items=data.get("assets",data.get("data",data.get("results",[]))) if isinstance(data,dict) else data
                  print("V3_QUERY",q,"RESULTS",len(items or []))
                  if items:
                      assets.extend(items)
                      used.append(url)
              except Exception as e:
                  print("V3_QUERY_FAIL",q,repr(e))

          uniq={}
          for a in assets:
              aid=a.get("id") or a.get("assetId") or a.get("asset_id")
              if aid: uniq[aid]=a
          assets=list(uniq.values())
          if not assets:
              raise SystemExit("ambientCG v3 returned no assets")

          def score(a):
              txt=json.dumps(a,ensure_ascii=False).lower()
              s=0
              for t,v in [
                  ("stone",70),("wall",55),("masonry",65),("rock",18),
                  ("rough",8),("weathered",24),("old",12),("medieval",30),
                  ("limestone",35),("sandstone",28),("granite",22),
                  ("blocks",20),("block",10)
              ]:
                  if t in txt: s+=v
              for t,v in [
                  ("brick",-180),("red brick",-220),("tile",-90),("roof",-100),
                  ("paving",-80),("floor",-75),("cobblestone",-45),("asphalt",-150),
                  ("concrete",-90),("wood",-120),("metal",-120)
              ]:
                  if t in txt: s+=v
              return s

          ranked=sorted(assets,key=score,reverse=True)
          manifest=[]
          for a in ranked:
              aid=a.get("id") or a.get("assetId") or a.get("asset_id")
              txt=json.dumps(a,ensure_ascii=False).lower()
              if "brick" in txt or "roof" in txt or "wood" in txt or "metal" in txt:
                  continue
              if not any(t in txt for t in ["stone","masonry","rock","limestone","sandstone","granite"]):
                  continue
              manifest.append({
                  "id":aid,
                  "name":a.get("name"),
                  "score":score(a),
                  "raw":a
              })
              if len(manifest)>=3: break
          if not manifest:
              raise SystemExit("No non-brick stone candidates after ranking")

          os.makedirs("/tmp/photo-proof/wall",exist_ok=True)
          for idx,item in enumerate(manifest,1):
              aid=item["id"]
              dl=f"https://ambientcg.com/get?file={aid}_2K-JPG.zip"
              item["url"]=dl
              out=f"/tmp/photo-proof/wall/candidate-{idx}.zip"
              req=urllib.request.Request(dl,headers=UA)
              with urllib.request.urlopen(req,timeout=180) as r, open(out,"wb") as fh:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      fh.write(b)
              dest=f"/tmp/photo-proof/wall/candidate-{idx}"
              os.makedirs(dest,exist_ok=True)
              with zipfile.ZipFile(out) as z:
                  z.extractall(dest)
              print("CANDIDATE",idx,aid,"score",item["score"],"bytes",os.path.getsize(out))

          open("/tmp/photo-proof/wall-source.txt","w").write(json.dumps({
              "license":"CC0",
              "api_queries":used,
              "candidates":manifest
          },indent=2,ensure_ascii=False))
          PY

          find /tmp/photo-proof/wall -type f | sort > /tmp/photo-proof/wall-files.txt
          cat /tmp/photo-proof/wall-source.txt | head -160
          head -120 /tmp/photo-proof/wall-files.txt

      - name: Render photogrammetry rock donor
        run: |
          cat > /tmp/photo-proof/render_rock.py <<'PY'
          import bpy, os, math, re
          from mathutils import Vector

          root="/tmp/photo-proof/rock/unpacked"
          ev="/tmp/photo-proof/evidence"
          files=[]
          for dp,ds,fs in os.walk(root):
              for fn in fs:
                  p=os.path.join(dp,fn)
                  if fn.lower().endswith((".blend",".fbx",".obj",".glb",".gltf")):
                      files.append(p)
          if not files:
              raise RuntimeError("No 3D source found in rock archive")
          def score(p):
              s=0; low=p.lower()
              if low.endswith(".blend"): s+=100
              elif low.endswith(".fbx"): s+=80
              elif low.endswith(".obj"): s+=70
              elif low.endswith((".glb",".gltf")): s+=60
              for token,val in [("4k",45),("4000",45),("2k",35),("2000",35),("1k",25),("1000",25),("lod0",40),("high",30)]:
                  if token in low: s+=val
              if any(t in low for t in ["50tris","100tris","200tris"]): s-=100
              return s
          files=sorted(files,key=score,reverse=True)
          src=files[0]
          print("CHOSEN_ROCK",src,"score",score(src))
          bpy.ops.wm.read_factory_settings(use_empty=True)
          low=src.lower()
          if low.endswith(".blend"):
              bpy.ops.wm.open_mainfile(filepath=src)
          elif low.endswith(".fbx"):
              bpy.ops.import_scene.fbx(filepath=src)
          elif low.endswith(".obj"):
              if hasattr(bpy.ops.wm,"obj_import"):
                  bpy.ops.wm.obj_import(filepath=src)
              else:
                  bpy.ops.import_scene.obj(filepath=src)
          elif low.endswith((".glb",".gltf")):
              bpy.ops.import_scene.gltf(filepath=src)

          meshes=[o for o in bpy.context.scene.objects if o.type=="MESH" and not o.hide_render]
          if not meshes: raise RuntimeError("No renderable rock meshes")

          # Explicitly rebuild the scanned PBR-ish material because OBJ import may not
          # bind the companion TGA maps in headless Blender.
          src_dir=os.path.dirname(src)
          base=os.path.basename(src).split("-")[0]
          diffuse=os.path.join(src_dir,base+"_diffuse.tga")
          normal=os.path.join(src_dir,base+"_normals.tga")
          occ=os.path.join(src_dir,base+"_occlusion.tga")
          if os.path.exists(diffuse):
              mat=bpy.data.materials.new("PhotogrammetryRock")
              mat.use_nodes=True
              nodes=mat.node_tree.nodes
              links=mat.node_tree.links
              bsdf=nodes.get("Principled BSDF")
              tex=nodes.new("ShaderNodeTexImage"); tex.image=bpy.data.images.load(diffuse)
              links.new(tex.outputs["Color"],bsdf.inputs["Base Color"])
              bsdf.inputs["Roughness"].default_value=0.72
              if os.path.exists(normal):
                  n=nodes.new("ShaderNodeTexImage"); n.image=bpy.data.images.load(normal); n.image.colorspace_settings.name='Non-Color'
                  nm=nodes.new("ShaderNodeNormalMap"); nm.inputs["Strength"].default_value=0.85
                  links.new(n.outputs["Color"],nm.inputs["Color"]); links.new(nm.outputs["Normal"],bsdf.inputs["Normal"])
              for o in meshes:
                  o.data.materials.clear()
                  o.data.materials.append(mat)
          pts=[o.matrix_world@Vector(c) for o in meshes for c in o.bound_box]
          mn=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts)))
          mx=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
          center=(mn+mx)*0.5; dims=mx-mn; span=max(dims)
          sc=bpy.context.scene
          sc.render.engine="BLENDER_EEVEE"
          sc.render.resolution_x=1100; sc.render.resolution_y=825; sc.render.resolution_percentage=100
          sc.render.image_settings.file_format="PNG"
          if sc.world is None: sc.world=bpy.data.worlds.new("World")
          sc.world.color=(0.035,0.035,0.035)
          bpy.ops.mesh.primitive_plane_add(size=span*4,location=(center.x,center.y,mn.z-span*0.015))
          gm=bpy.data.materials.new("ground"); gm.diffuse_color=(0.08,0.08,0.08,1); bpy.context.object.data.materials.append(gm)
          bpy.ops.object.light_add(type='SUN',location=(0,0,span*3)); sun=bpy.context.object; sun.rotation_euler=(math.radians(40),0,math.radians(135)); sun.data.energy=2.5
          bpy.ops.object.light_add(type='AREA',location=(center.x-span,center.y-span,center.z+span)); area=bpy.context.object; area.data.energy=700; area.data.size=span*1.2
          bpy.ops.object.camera_add(); cam=bpy.context.object; sc.camera=cam; cam.data.lens=60
          def track(o,target): o.rotation_euler=(target-o.location).to_track_quat('-Z','Y').to_euler()
          for name,v in [("rock-3q",Vector((1.2,-1.4,0.9))),("rock-close",Vector((0.75,-0.95,0.5)))]:
              cam.location=center+v*span; track(cam,center); sc.render.filepath=os.path.join(ev,name+".png"); bpy.ops.render.render(write_still=True)
          tris=sum(sum(max(0,len(p.vertices)-2) for p in o.data.polygons) for o in meshes)
          with open(os.path.join(ev,"rock-report.txt"),"w") as f:
              f.write(f"source=OpenGameArt Free Photogrammetric Rock\nlicense=CC0\nchosen={src}\nmeshes={len(meshes)}\ntriangles_approx={tris}\nbounds={tuple(dims)}\ndiffuse={diffuse}\nnormal={normal}\nocclusion={occ}\n")
          PY
          if [ -d /tmp/photo-proof/rock/unpacked ]; then
            blender -b --python /tmp/photo-proof/render_rock.py
            test -s /tmp/photo-proof/evidence/rock-3q.png
            test -s /tmp/photo-proof/evidence/rock-close.png
          else
            printf '%s\n' "Photogrammetry rock donor already validated: run 37445549161 / artifact 11403535192" > /tmp/photo-proof/evidence/rock-report.txt
          fi

      - name: Render stone masonry candidate bakeoff
        run: |
          cat > /tmp/photo-proof/render_wall_candidates.py <<'PY'
          import bpy, os, math, json
          from mathutils import Vector

          root="/tmp/photo-proof/wall"
          ev="/tmp/photo-proof/evidence"
          os.makedirs(ev,exist_ok=True)
          manifest=json.load(open("/tmp/photo-proof/wall-source.txt"))
          reports=[]

          def pick(imgs,tokens,reject=()):
              for p in imgs:
                  low=os.path.basename(p).lower()
                  if any(r in low for r in reject): continue
                  if any(t in low for t in tokens): return p
              return None

          for idx,item in enumerate(manifest["candidates"],1):
              cdir=os.path.join(root,f"candidate-{idx}")
              imgs=[]
              for dp,ds,fs in os.walk(cdir):
                  for fn in fs:
                      p=os.path.join(dp,fn)
                      if fn.lower().endswith((".jpg",".jpeg",".png",".tif",".tiff",".exr")):
                          imgs.append(p)
              albedo=pick(imgs,["color","albedo","basecolor","base_color","diffuse"],["normal","rough","disp","height","ao"])
              rough=pick(imgs,["rough"])
              normal=pick(imgs,["normalgl","normal_gl","nor_gl","normal"],["dx"])
              height=pick(imgs,["displacement","height","disp"])
              if not albedo:
                  print("SKIP_NO_ALBEDO",idx,item["id"])
                  continue

              bpy.ops.wm.read_factory_settings(use_empty=True)
              bpy.ops.mesh.primitive_grid_add(x_subdivisions=201,y_subdivisions=121,size=2.0,location=(0,0,0))
              wall=bpy.context.object
              wall.name=f"StoneCandidate{idx}"
              wall.rotation_euler=(math.radians(90),0,0)
              wall.scale=(2.7,1.6,1)
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)

              mat=bpy.data.materials.new(f"Stone_{item['id']}")
              mat.use_nodes=True
              nodes=mat.node_tree.nodes; links=mat.node_tree.links
              bsdf=nodes.get("Principled BSDF")
              tex=nodes.new("ShaderNodeTexImage"); tex.image=bpy.data.images.load(albedo)
              links.new(tex.outputs["Color"],bsdf.inputs["Base Color"])
              bsdf.inputs["Roughness"].default_value=0.72
              if rough:
                  r=nodes.new("ShaderNodeTexImage"); r.image=bpy.data.images.load(rough); r.image.colorspace_settings.name='Non-Color'
                  links.new(r.outputs["Color"],bsdf.inputs["Roughness"])
              if normal:
                  n=nodes.new("ShaderNodeTexImage"); n.image=bpy.data.images.load(normal); n.image.colorspace_settings.name='Non-Color'
                  nm=nodes.new("ShaderNodeNormalMap"); nm.inputs["Strength"].default_value=0.9
                  links.new(n.outputs["Color"],nm.inputs["Color"]); links.new(nm.outputs["Normal"],bsdf.inputs["Normal"])
              if height:
                  ht=bpy.data.textures.new(f"height_{idx}",type="IMAGE"); ht.image=bpy.data.images.load(height)
                  disp=wall.modifiers.new("ScannedHeight","DISPLACE")
                  disp.texture=ht; disp.texture_coords='UV'; disp.strength=0.13

              wall.data.materials.append(mat)
              sc=bpy.context.scene
              sc.render.engine="BLENDER_EEVEE"
              sc.render.resolution_x=1100; sc.render.resolution_y=825; sc.render.resolution_percentage=100
              sc.render.image_settings.file_format="PNG"
              if sc.world is None: sc.world=bpy.data.worlds.new("World")
              sc.world.color=(0.035,0.035,0.035)

              bpy.ops.object.light_add(type='SUN',location=(0,-4,5))
              sun=bpy.context.object; sun.rotation_euler=(math.radians(50),0,math.radians(145)); sun.data.energy=2.1
              bpy.ops.object.light_add(type='AREA',location=(-2.5,-3.5,3))
              area=bpy.context.object; area.data.energy=650; area.data.size=3.5
              bpy.ops.object.camera_add(location=(4.2,-6.5,2.25))
              cam=bpy.context.object; sc.camera=cam; cam.data.lens=66
              cam.rotation_euler=(Vector((0,0,0.45))-cam.location).to_track_quat('-Z','Y').to_euler()

              out=os.path.join(ev,f"wall-candidate-{idx}-{item['id']}.png")
              sc.render.filepath=out
              bpy.ops.render.render(write_still=True)
              reports.append({
                  "index":idx,"id":item["id"],"name":item.get("name"),"score":item["score"],
                  "albedo":albedo,"roughness":rough,"normal":normal,"height":height,"render":out
              })
              print("RENDERED",out)

          open(os.path.join(ev,"wall-candidate-report.json"),"w").write(json.dumps(reports,indent=2))
          if not reports:
              raise RuntimeError("No masonry candidate rendered")
          PY

          blender -b --python /tmp/photo-proof/render_wall_candidates.py
          test -s /tmp/photo-proof/evidence/wall-candidate-report.json
          find /tmp/photo-proof/evidence -name 'wall-candidate-*.png' -size +10k | head -1 | grep .

      - name: Package evidence
        run: |
          cp /tmp/photo-proof/rock-files.txt /tmp/photo-proof/evidence/
          cp /tmp/photo-proof/wall-files.txt /tmp/photo-proof/evidence/
          cp /tmp/photo-proof/wall-source.txt /tmp/photo-proof/evidence/
          ls -lh /tmp/photo-proof/evidence

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-photogrammetry-donor-capability-v1
          path: /tmp/photo-proof/evidence
          retention-days: 30
