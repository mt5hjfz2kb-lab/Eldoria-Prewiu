name: Valoria Modular 2.5D — ground-only sprite production

on:
  push:
    branches: [experiment/valoria-modular-25d-bastion1-from-zero-20261118]
    paths:
      - 'tools/valoria-modular25d/terrain/**'
      - '.github/workflows/valoria-modular25d-ground.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valoria-modular25d-ground-only
  cancel-in-progress: false

jobs:
  author-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    if: github.ref == 'refs/heads/experiment/valoria-modular-25d-bastion1-from-zero-20261118'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout: |
            tools/valoria-modular25d/terrain
            Unity/Assets/Experimentos/ValoriaModular25D/Resources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate true-alpha diamond terrain with no 3D geometry
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/valoria-modular25d/terrain/ground_bake.py
      - name: Assert all modular source textures and common border color
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path("Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D")
          items=list(p.glob("ground_*.png"))
          assert len(items)==16,len(items)
          edge=[]
          for f in items:
              im=Image.open(f).convert("RGBA")
              assert im.size==(132,68)
              assert im.getpixel((0,0))[3]==0
              assert im.getpixel((66,34))[3]==255
              edge.append(im.getpixel((66,1)))
              assert Path(str(f)+".meta").exists()
          assert len(set(edge))==1,"Ground boundary differs across variants"
          print("ELDORIA_GROUND_16_RGBA_SPRITES_SOURCE_GATE_PASS; NOT UNITY PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-ground-16
          path: Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/ground_*
          retention-days: 21
      - name: Record isolated ground assets without touching main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name "eldoria-art-ci"
          git config user.email "eldoria-art-ci@users.noreply.github.com"
          git add Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/ground_*
          if ! git diff --cached --quiet; then
            git commit -m "art(modular25d): add 16 reusable grassy and earthy 2:1 terrain sprites [candidate]"
            git push origin HEAD:refs/heads/experiment/valoria-modular-25d-bastion1-from-zero-20261118
          fi
          echo "Only isolated experimental sprites were modified; Unity visual QA still required."
