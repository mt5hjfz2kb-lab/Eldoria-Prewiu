name: Ciudad2D — importar Aserradero y Granero como candidatos RGBA
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-quality/pending_two_art.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-sawmill-granary-source-ubuntu
  cancel-in-progress: false
jobs:
  archive-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-quality/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Cuartel.png.meta
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/
            /Unity/Assets/Experimentos/Ciudad2D/QA/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Reproduce two original painting cutouts and half-resolution contact shadows
        run: python tools/ciudad2d-quality/import_sawmill_granary.py
      - name: Preserve exact-source artifacts separately from visual approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-sawmill-granary-unapproved-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_V2*
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Granero_Premium_V1*
            Unity/Assets/Experimentos/Ciudad2D/QA/Aserradero_Premium_V2_GREEN_OFFLINE_NOT_UNITY.jpg
            Unity/Assets/Experimentos/Ciudad2D/QA/Granero_Premium_V1_GREEN_OFFLINE_NOT_UNITY.jpg
            Unity/Assets/Experimentos/Ciudad2D/QA/SawmillGranaryPremium_Manifest.json
          if-no-files-found: warn
          retention-days: 21
      - name: Commit candidates, no original replacement, delete signed input
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-quality/pending_two_art.json
          git add --sparse -- \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Aserradero_Premium_V2* \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Candidates/Granero_Premium_V1* \
            Unity/Assets/Experimentos/Ciudad2D/QA/Aserradero_Premium_V2_GREEN_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/Granero_Premium_V1_GREEN_OFFLINE_NOT_UNITY.jpg \
            Unity/Assets/Experimentos/Ciudad2D/QA/SawmillGranaryPremium_Manifest.json
          git diff --cached --quiet && { echo 'No verified new source'; exit 1; }
          git commit -m 'art(city2d): archive isolated Aserradero V2 Granero V1 exact sources RGBA and shadows'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
