name: Valoria Region 1 modular art and navigation parity
on:
  push:
    branches: [experiment/corona-retina-building-pass-20261121]
    paths:
      - '.github/workflows/valoria-region-modular-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# GitHub concurrency preserves one running + one pending; a new candidate
# replaces a pending baseline. Always prioritize the latest baseline proof,
# then queue isolated A/B after baseline completion.
concurrency:
  group: eldoria-modular25d-exclusive-unity-native
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      allowed: ${{steps.check.outputs.allowed}}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{github.token}}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          ident="eldoria-valoria-modular25d-bastion1-20261119"
          def gh(endpoint):
            req=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+endpoint,
                headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
            with urllib.request.urlopen(req,timeout=35) as f:return json.load(f)
          meta=gh("contents/pipeline/active-workstreams.json?ref=main")
          blob=gh("git/blobs/"+meta["sha"])
          assert blob["sha"]==meta["sha"] and blob["encoding"]=="base64"
          state=json.loads(base64.b64decode(blob["content"]))
          leases=[x for x in state["active"] if "windows-runner-heavy" in x.get("resources",[])]
          branch=gh("git/ref/heads/"+os.environ["GITHUB_REF_NAME"])
          ok=(len(leases)==1 and leases[0]["id"]==ident and
             leases[0].get("ownership_revision")==7 and leases[0].get("ownership_state")=="claimed" and
             leases[0].get("owner")=="chatgpt-valoria-umbral-commercial-ui-and-continuation-20261120" and
             state.get("resource_rotation",{}).get("current_workstream")==ident and
             branch["object"]["sha"]==os.environ["GITHUB_SHA"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("allowed="+str(ok).lower()+"\n")
          if not ok:
            raise SystemExit("MOD25D_NATIVE_NOT_CERTIFIED: live owner/revision/branch/Windows lease mismatch")
          print("MOD25D_NATIVE_LEASE_PASS")
          PY
  unity:
    needs: preflight
    if: needs.preflight.outputs.allowed == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 150
    steps:
      - name: Recheck owner, Windows process safety and installed Unity
        shell: powershell
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          $ErrorActionPreference='Stop'
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/"
          $h=@{Authorization='Bearer '+$env:GH_TOKEN;Accept='application/vnd.github+json'}
          $meta=Invoke-RestMethod -Uri ($api+'contents/pipeline/active-workstreams.json?ref=main') -Headers $h
          $blob=Invoke-RestMethod -Uri ($api+'git/blobs/'+$meta.sha) -Headers $h
          if($blob.sha -ne $meta.sha){throw 'Registry changed unexpectedly'}
          $reg=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($blob.content -replace '\s',''))) | ConvertFrom-Json
          $held=@($reg.active|Where-Object{@($_.resources) -contains 'windows-runner-heavy'})
          $id='eldoria-valoria-modular25d-bastion1-20261119'
          if($held.Count -ne 1 -or $held[0].id -ne $id -or $held[0].ownership_revision -ne 7 -or
             $held[0].owner -ne 'chatgpt-valoria-umbral-commercial-ui-and-continuation-20261120' -or
             $reg.resource_rotation.current_workstream -ne $id){throw 'Lease not ours'}
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){
            throw 'Existing Windows native process: refuse interference'}
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){
            throw 'Unity editor executable unavailable'}
          # Do not clean another run's project, Unity cache or Library.
          if((Get-Item $env:RUNNER_TEMP).PSDrive.Free -lt 7GB){throw 'Insufficient scratch disk'}
          Write-Host 'SAFE_NATIVE_PC_AND_OWNER_PASS'
      - name: Restore GitHub Desktop Git to PATH for Unity Package Manager
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $paths=@(Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} |
              Where-Object{Test-Path $_})
            if(-not $paths.Count){throw 'No installed Git; do not download software'}
            $dir=Split-Path $paths[0]
            $env:PATH="$dir;$env:PATH"
          } else {$dir=Split-Path $git.Source}
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          git --version
      - name: Materialize source-pinned isolated Unity project without modifying main
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('eldoria-region-modular-'+$env:GITHUB_RUN_ID)
          if(Test-Path $root){throw 'Refuse to overwrite existing scratch'}
          git init -q $root
          git -C $root remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          $includes=@('/tools/valoria-modular25d/','/tools/bastion-iii/author-frontier.py',
           '/Unity/Assets/Experimentos/ValoriaModular25D/',
           '/Unity/Assets/Experimentos/ValoriaModular25D.meta','/Unity/Assets/Experimentos.meta',
           '/Unity/Assets/Eldoria/','/Unity/Assets/Eldoria.meta',
           '/Unity/Assets/StreamingAssets/','/Unity/Assets/StreamingAssets.meta',
           '/Unity/Assets/Plugins/','/Unity/Assets/Plugins.meta',
           '/Unity/Assets/DefaultVolumeProfile.asset',
           '/Unity/Assets/UniversalRenderPipelineGlobalSettings.asset',
           '/Unity/Packages/','/Unity/ProjectSettings/')
          git -C $root sparse-checkout set --no-cone @includes
          if($LASTEXITCODE){throw 'Sparse checkout setup failed'}
          git -C $root fetch --no-tags --depth=1 --filter=blob:none origin $env:GITHUB_SHA
          if($LASTEXITCODE){throw 'Git fetch failed'}
          # Windows schannel can drop a promisor-blob response near the end
          # of an otherwise correct sparse checkout (run 44545156060).
          # Retry only this RUN's own scratch checkout. Never reuse, delete
          # or touch another workstream's Git/Unity folders.
          git -C $root config http.version HTTP/1.1
          $checkoutOk=$false
          for($attempt=1;$attempt -le 3;$attempt++){
            git -C $root checkout -q --detach $env:GITHUB_SHA
            if($LASTEXITCODE -eq 0){$checkoutOk=$true;break}
            Write-Warning ('Transient promisor-blob checkout failure; same SHA retry '+$attempt)
            Start-Sleep -Seconds (4*$attempt)
          }
          if(-not $checkoutOk -or (git -C $root rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){
            throw 'SHA-pinned checkout unresolved after bounded retries'}
          foreach($p in @('Unity/Packages/manifest.json','Unity/ProjectSettings/ProjectVersion.txt',
           'Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D/bastion_i.png',
           'Unity/Assets/Experimentos/ValoriaModular25D/Scenes/BastionI_Modular25D.unity',
           'Unity/Assets/Experimentos/ValoriaModular25D/Editor/Modular25DNativeCapture.cs')){
             if(-not(Test-Path (Join-Path $root $p))){throw "Missing SHA-pinned Unity input $p"}
          }
          "MOD25D_SOURCE=$root"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MOD25D_CHECKOUT_PINNED $env:GITHUB_SHA"
      - name: Native integrated scene, identical routes and fixed-camera art A/B
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:MOD25D_SOURCE 'Unity'
          $out=Join-Path $project 'Artifacts/RegionModular'
          New-Item -ItemType Directory -Force $out|Out-Null
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(!$blender){$blender=Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
          & $blender --background --python-exit-code 1 --python (Join-Path $env:MOD25D_SOURCE 'tools/bastion-iii/author-frontier.py')
          if($LASTEXITCODE){throw 'Canonical private fissure authoring failed'}
          $bakeLog=Join-Path $out 'canonical-bake.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',$project,'-executeMethod','Eldoria.ReferenceClean.Editor.BastionIIIArtBake.Build','-logFile',$bakeLog)
          $bake=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          if($bake.ExitCode){Get-Content $bakeLog -Tail 160;throw 'Canonical chapter III prefab bake failed'}
          $env:VALORIA_CONTENT_PROBE='1'
          $env:VALORIA_GAMEPLAY_PROBE='1'
          foreach($phase in @('before','after')){
            $env:ELDORIA_REGION1_CAPTURE_OUT=Join-Path $out $phase
            New-Item -ItemType Directory -Force $env:ELDORIA_REGION1_CAPTURE_OUT|Out-Null
            $env:ELDORIA_WORLD_ART_BASELINE=if($phase -eq 'before'){'1'}else{'0'}
            $env:ELDORIA_BAKE_TERRAIN_QUERIES=if($phase -eq 'before'){'1'}else{'0'}
            $env:ELDORIA_VALIDATE_TERRAIN_RAYCAST=if($phase -eq 'after'){'1'}else{'0'}
            $log=Join-Path $out ($phase+'.log')
            $xml=Join-Path $out ($phase+'.xml')
            $args=@('-batchmode','-force-d3d11','-projectPath',$project,'-runTests','-testPlatform','PlayMode','-testFilter','Eldoria.Tests.RegionOneCanonIntegratedAcceptanceTests.CoronaRegionRendersAndRetainsGeographicRoutes','-testResults',$xml,'-logFile',$log)
            $proc=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
            if($proc.ExitCode -or !(Test-Path $xml)){Get-Content $log -Tail 150;throw "Unity $phase failed"}
            [xml]$result=Get-Content $xml
            if($result.'test-run'.passed -ne '1'){Get-Content $xml -Tail 90;throw "Native $phase failed"}
            if($phase -eq 'before'){Copy-Item (Join-Path $env:ELDORIA_REGION1_CAPTURE_OUT 'terrain.bytes') (Join-Path $project 'Assets/Eldoria/World4XCanon/Resources/World4X/Blender/RuntimeTerrainQueries.bytes')}
          }
          if((Get-FileHash "$out/before/routes.txt").Hash -ne (Get-FileHash "$out/after/routes.txt").Hash){throw 'Canonical route or cells changed'}
          if((Get-FileHash "$out/before/grid.bin").Hash -ne (Get-FileHash "$out/after/grid.bin").Hash){throw 'Navigable X/Z lattice differs'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region1-cameras-and-routes
          path: |
            ${{env.MOD25D_SOURCE}}/Unity/Artifacts/RegionModular/
            !${{env.MOD25D_SOURCE}}/Unity/Artifacts/RegionModular/before/terrain.bytes
      - name: Build actual integrated WebGL player
        shell: powershell
        run: |
          $project=Join-Path $env:MOD25D_SOURCE 'Unity'
          $env:ELDORIA_WORLD_PLAYER_OUT=Join-Path $project 'Builds/RegionModular'
          $log=Join-Path $project 'Artifacts/RegionModular/webgl.log'
          $args=@('-batchmode','-quit','-projectPath',$project,'-executeMethod','Eldoria.World4XCanon.Editor.RegionOneCanonicalCapture.BuildModularWorld','-logFile',$log)
          $proc=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru -Wait
          if($proc.ExitCode -or !(Test-Path "$env:ELDORIA_WORLD_PLAYER_OUT/index.html")){Get-Content $log -Tail 150;throw 'Integrated WebGL build failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: valoria-region1-webgl
          path: ${{env.MOD25D_SOURCE}}/Unity/Builds/RegionModular/
