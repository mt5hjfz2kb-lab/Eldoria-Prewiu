name: Ciudad2D — preparar humo ilustrado reproducible sin IA
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-ambient/source_request_v1.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-ambient-source-ubuntu-only
  cancel-in-progress: false
jobs:
  build-illustrated-wisps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-ambient/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/
            /Unity/Assets/Experimentos/Ciudad2D/QA/ambient_life_v1.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Render only two source-hashed semi-transparent wisps
        run: python tools/ciudad2d-ambient/build_ambient_sprites.py
      - name: Verify source hashes and alpha without changing artwork
        run: |
          python - <<'PY'
          from PIL import Image
          import hashlib,json,pathlib
          base=pathlib.Path('Unity/Assets/Experimentos/Ciudad2D')
          m=json.loads((base/'QA/ambient_art_manifest_v1.json').read_text())
          assert len(m['assets'])==2 and m['all_original_city_sprites_unchanged']
          for e in m['assets']:
              p=base/'Sprites/Props'/e['name']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256']
              with Image.open(p) as im:
                  assert im.mode=='RGBA' and im.size==(160,240)
                  assert im.getchannel('A').getextrema()[0]==0
              print('SMOKE_SOURCE_SHA_PASS',e['name'],e['sha256'])
          PY
      - name: Preserve generated sources for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-ambient-wisp-sources-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_A.png
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_B.png
            Unity/Assets/Experimentos/Ciudad2D/QA/ambient_art_manifest_v1.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit original wisps, never touch Bastion or gameplay, remove request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-ambient/source_request_v1.json
          git add --sparse -- \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_A.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_A.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_B.png \
            Unity/Assets/Experimentos/Ciudad2D/Sprites/Props/Humo_Valoria_B.png.meta \
            Unity/Assets/Experimentos/Ciudad2D/QA/ambient_art_manifest_v1.json
          git diff --cached --quiet && { echo 'No ambient output; refuse empty commit'; exit 1; }
          git commit -m 'art(city2d): archive two deterministic subtle smoke sprites for isolated city'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
