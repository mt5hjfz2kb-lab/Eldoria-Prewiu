name: '[VALORIA] Clean reference reconstruction / native Unity'
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths: ['tools/valoria-reference-clean/request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-reference-clean-native
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: valoria-layered-source
    steps:
      - name: Recover installed Git
        working-directory: .
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-layered-source
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-clean-live-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check live exclusive lease and actual native tools
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE/valoria-clean-live-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'codex-work-valoria-reference-clean-20261017' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Current clean-scene claim missing'}
          if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Runner reserved by another workstream'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Shared native tools busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity unavailable'}
          New-Item -ItemType Directory -Force docs/evidence/valoria-reference-clean|Out-Null
      - name: Read existing Android update certificate identity without changing keys
        continue-on-error: true
        shell: powershell
        run: |
          $keytool=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/AndroidPlayer/OpenJDK/bin/keytool.exe'
          $report=@{expected_sha256='f479ca92ccfa256a991936b23d0153ffad247b352a8a5ed569457db8274443d8';package='com.eldoria.valoria.v5test';old_version_code=1;old_apk_run=38279800977;keys=@();matching_key_found=$false;private_key_exported=$false}
          if(Test-Path $keytool){
            $paths=@()
            foreach($user in @(Get-ChildItem "$env:SystemDrive/Users" -Directory -ErrorAction SilentlyContinue)){$p=Join-Path $user.FullName '.android/debug.keystore';if(Test-Path $p){$paths+=$p}}
            $p=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/AndroidPlayer/Tools/debug.keystore';if(Test-Path $p){$paths+=$p}
            foreach($p in @($paths|Select-Object -Unique)){
              $savedPreference=$ErrorActionPreference
              try{$ErrorActionPreference='Continue';$raw=(& $keytool '-J-Duser.language=en' -list -v -keystore $p -storepass android 2>&1|Out-String)}finally{$ErrorActionPreference=$savedPreference}
              $match=[regex]::Match($raw,'SHA256:\s*([0-9A-Fa-f:]+)')
              $sha=$match.Groups[1].Value.Replace(':','').ToLowerInvariant()
              $report.keys+=@{path=$p;certificate_sha256=$sha;matches_original=($sha -eq $report.expected_sha256)}
              if($sha -eq $report.expected_sha256){$report.matching_key_found=$true}
            }
          }
          $report|ConvertTo-Json -Depth 5|Set-Content docs/evidence/valoria-reference-clean/android-existing-key-check.json -Encoding utf8
          Write-Host "Original Android signing key certificate match: $($report.matching_key_found)"
      - name: Execute requested stage in native Unity
        id: native_stage
        shell: powershell
        run: |
          $req=Get-Content tools/valoria-reference-clean/request.json -Raw|ConvertFrom-Json
          "stage=$($req.stage)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBuilder.Build'
          if($req.stage -eq 'play'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanPlayProbe.Build'}
          if($req.stage -eq 'android'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanAndroidBuild.Build'}
          if($req.stage -eq 'bastion_ground_finish'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionGroundFinish.Build'}
          if($req.stage -eq 'ground_diagnose'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionEnsemble.DiagnoseGround'}
          if($req.stage -eq 'contact_trial'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanContactTrial.Build'}
          if($req.stage -eq 'ground_trial'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanGroundTrial.BuildLocalized'}
          if($req.stage -eq 'package'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanFinalize.ExportExisting'}
          if($req.stage -eq 'bank_integrate'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanNatureTrial.IntegrateBankPatch'}
          if($req.stage -eq 'finalize'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanFinalize.Build'}
          if($req.stage -eq 'river_lighting'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanRiverLighting.Build'}
          if($req.stage -eq 'lighting'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanLightingPass.Build'}
          if($req.stage -eq 'integration'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanArtBuilder.Build'}
          $env:VALORIA_SHORE_PROFILE=$req.shore_treatment
          if($req.stage -eq 'art'){
            if($req.nature_treatment -eq 'bank_zone' -or $req.tree_treatment -eq 'canopy_ao_zone' -or $req.shore_treatment -in @('zone_profile','all_profile')){
              $env:VALORIA_NATURE_BASELINE_GLB=Join-Path $env:RUNNER_TEMP 'ValoriaReferenceBeforeNature.glb'
              Copy-Item 'Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Sources/Valoria_Reference_Clean.glb' $env:VALORIA_NATURE_BASELINE_GLB -Force
              $env:VALORIA_NATURE_BASELINE_HASH=(Get-Content 'docs/evidence/valoria-reference-clean/source-art.json' -Raw|ConvertFrom-Json).glb_sha256
              $env:VALORIA_NATURE_BASELINE_SOURCE=$req.validated_runtime_source
              $env:VALORIA_NATURE_TARGET='River_bank_rocks';$env:VALORIA_NATURE_PREFIX='nature-zone'
              if($req.tree_treatment -eq 'canopy_ao_zone'){$env:VALORIA_NATURE_TARGET='Fir_tree_group';$env:VALORIA_NATURE_PREFIX='canopy-zone'}
            }
            if($req.shore_treatment -in @('zone_profile','all_profile')){$env:VALORIA_NATURE_TARGET='Shore_profile';$env:VALORIA_NATURE_PREFIX='shore-zone'}
            if($req.waterline_finish -in @('zone_talus','all_talus')){$env:VALORIA_NATURE_TARGET='River_shingle_pockets';$env:VALORIA_NATURE_PREFIX='waterline-zone'}
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_scene.py
            if($LASTEXITCODE){throw 'Blender authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanArtBuilder.Build'
          }
          if($req.stage -eq 'bank_patch'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/patch_river_bank.py
            if($LASTEXITCODE){throw 'Bounded Qwen bank patch failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanNatureTrial.BuildBankPatch'
          }
          if($req.stage -eq 'shrub_trial'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/patch_shrub_crowns.py
            if($LASTEXITCODE){throw 'Bounded Qwen shrub crown patch failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanShrubTrial.Build'
          }
          if($req.stage -eq 'bastion_ensemble'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_bastion_ensemble.py
            if($LASTEXITCODE){throw 'Bastion ensemble authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionEnsemble.Build'
          }
          if($req.stage -eq 'bastion_environment'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_bastion_environment.py
            if($LASTEXITCODE){throw 'Bastion ensemble authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionEnvironment.Build'
          }
          $log=Join-Path $env:RUNNER_TEMP 'valoria-reference-clean.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",'-executeMethod',$method,'-logFile',$log)
          $settingsPath=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source/Unity/ProjectSettings/ProjectSettings.asset'
          $settingsBefore=@{}
          foreach($name in @('ProjectSettings.asset','GraphicsSettings.asset','QualitySettings.asset')){$q=Join-Path (Split-Path $settingsPath) $name;$settingsBefore[$q]=[IO.File]::ReadAllBytes($q)}
          if($req.stage -in @('lighting','river_lighting','finalize','package','ground_trial','bank_patch','bank_integrate','contact_trial','shrub_trial','bastion_ensemble','ground_diagnose','bastion_environment','bastion_ground_finish')){$args+=@('-buildTarget','Win64')}
          if($req.stage -eq 'android'){$args+=@('-buildTarget','Android')}
          try{
            $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
            if(-not $p.WaitForExit(2400000)){& taskkill.exe /PID $p.Id /T /F|Out-Null;throw 'Own Unity process timed out'}
          }finally{if($req.stage -eq 'android'){foreach($q in $settingsBefore.Keys){[IO.File]::WriteAllBytes($q,$settingsBefore[$q])}}}
          $nativeLog='native-unity.log';if($req.stage -eq 'android'){$nativeLog='android-native.log'}
          Copy-Item $log (Join-Path 'docs/evidence/valoria-reference-clean' $nativeLog)
          Select-String $log -Pattern "Exception:|error CS|Shader error|^Error|TERRAIN_ROUTE_DIAGNOSTIC|TerrainCollider component deleted" -Context 1,2
          Get-Content $log -Tail 100
          if($p.ExitCode -ne 0){throw "Native Unity failed $($p.ExitCode)"}
          if(-not(Select-String $log -Pattern 'VALORIA_REFERENCE_CLEAN_.*_COMPLETE' -Quiet)){throw 'Completion marker missing'}
          if($req.validate_play){
            $playLog=Join-Path $env:RUNNER_TEMP 'valoria-reference-clean-play.log'
            $playArgs=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",'-executeMethod','Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanPlayProbe.Build','-logFile',$playLog)
            $play=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $playArgs -PassThru
            if(-not $play.WaitForExit(600000)){& taskkill.exe /PID $play.Id /T /F|Out-Null;throw 'Own PlayMode validation timed out'}
            Copy-Item $playLog docs/evidence/valoria-reference-clean/playmode-native.log
            Select-String $playLog -Pattern "Exception:|error CS|Shader error|^Error|TERRAIN_ROUTE_DIAGNOSTIC|TerrainCollider component deleted" -Context 1,2
            Get-Content $playLog -Tail 80
            if($play.ExitCode -ne 0 -or -not(Select-String $playLog -Pattern 'VALORIA_REFERENCE_CLEAN_PLAY_COMPLETE' -Quiet)){throw 'Actual PlayMode validation failed'}
          }
      - name: Review real capture with previously installed local vision model
        continue-on-error: true
        shell: powershell
        run: |
          $req=Get-Content tools/valoria-reference-clean/request.json -Raw|ConvertFrom-Json
          if(-not $req.auxiliary_review){return}
          $server=$null
          try {
            $o=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'
            if(-not(Test-Path $o)){$o=Get-ChildItem (Join-Path $env:SystemDrive 'Users') -Directory -ErrorAction SilentlyContinue|ForEach-Object {Join-Path $_.FullName 'AppData/Local/Programs/Ollama/ollama.exe'}|Where-Object {Test-Path $_}|Select-Object -First 1}
            if(-not $o){throw 'Previously installed Ollama not found'}
            $env:OLLAMA_HOST='127.0.0.1:11434'
            $modelsRoot=Join-Path $env:USERPROFILE '.ollama/models'
            if(-not(Test-Path $modelsRoot)){$modelsRoot=Get-ChildItem (Join-Path $env:SystemDrive 'Users') -Directory -ErrorAction SilentlyContinue|ForEach-Object {Join-Path $_.FullName '.ollama/models'}|Where-Object {Test-Path $_}|Select-Object -First 1}
            if($modelsRoot){$env:OLLAMA_MODELS=$modelsRoot}
            $ready=$false
            try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true}catch{}
            if(-not $ready){
              $server=Start-Process $o -ArgumentList 'serve' -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'valoria-ollama-out.log') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'valoria-ollama-err.log')
              for($i=0;$i -lt 30;$i++){try{$null=Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2;$ready=$true;break}catch{Start-Sleep -Seconds 1}}
            }
            if(-not $ready){throw 'Local Ollama did not become ready'}
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Verified Blender unavailable for review adapter'}
            & $blender -b -t 2 --python-exit-code 1 --python tools/valoria-reference-clean/review_capture.py
          } catch {
            @{status='AUXILIARY_UNAVAILABLE_NOT_AN_ART_PASS';error=$_.Exception.Message;art_approved=$false;new_model_downloads=0}|ConvertTo-Json|Set-Content docs/evidence/valoria-reference-clean/qwen-review.json -Encoding utf8
          } finally {
            if($server){& taskkill.exe /PID $server.Id /T /F|Out-Null}
          }
      - name: Record physical mobile test availability for gameplay validation
        shell: powershell
        run: |
          $req=Get-Content tools/valoria-reference-clean/request.json -Raw|ConvertFrom-Json
          if($req.stage -eq 'play' -or $req.stage -eq 'android' -or $req.validate_play){
            $editorDir=Split-Path $env:UNITY_EDITOR_PATH
            $adb=Join-Path $editorDir 'Data/PlaybackEngines/AndroidPlayer/SDK/platform-tools/adb.exe'
            if(-not(Test-Path $adb) -and $env:ANDROID_HOME){$adb=Join-Path $env:ANDROID_HOME 'platform-tools/adb.exe'}
            $available=Test-Path $adb
            $count=0
            if($available){$priorPreference=$ErrorActionPreference;$ErrorActionPreference='Continue';$listing=@(& $adb devices 2>&1);$ErrorActionPreference=$priorPreference;$count=@($listing|Where-Object {$_.ToString() -match '\sdevice$'}).Count}
            @{windows_host=$true;android_adb_available=$available;authorized_android_devices=$count;physical_android_profile_performed=$false;physical_ios_profile_performed=$false}|ConvertTo-Json|Set-Content docs/evidence/valoria-reference-clean/mobile-availability.json -Encoding utf8
          }
      - name: Persist independent scene, models, prefabs and actual captures on construction branch
        shell: powershell
        run: |
          git config user.name 'Valoria reference clean builder'
          git config user.email 'valoria-clean@users.noreply.github.com'
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/ docs/evidence/valoria-reference-clean/
          git add -- Unity/Packages/packages-lock.json
          if(-not(git diff --cached --quiet)){
            git commit -m 'art(valoria): native independent reference scene and genuine Unity evidence'
            if($LASTEXITCODE){throw 'Commit failed'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch change; preserve artifacts without force push'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-reference-clean-${{ github.run_id }}
          path: |
            valoria-layered-source/docs/evidence/valoria-reference-clean/**
            valoria-layered-source/Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/**
            ${{ runner.temp }}/valoria-reference-clean.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success() && steps.native_stage.outputs.stage == 'android'
        with:
          name: valoria-reference-clean-apk-${{ github.run_id }}
          path: valoria-layered-source/Unity/Builds/ValoriaReferenceClean/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && (steps.native_stage.outputs.stage == 'package' || steps.native_stage.outputs.stage == 'finalize' || steps.native_stage.outputs.stage == 'bank_integrate')
        with:
          name: valoria-reference-clean-package-${{ github.run_id }}
          path: valoria-layered-source/Unity/Builds/ValoriaReferenceClean/*.unitypackage
          if-no-files-found: error
