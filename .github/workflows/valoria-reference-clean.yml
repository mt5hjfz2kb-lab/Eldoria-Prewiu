        run: |
          $sdk=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/AndroidPlayer/SDK'
          $java=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/AndroidPlayer/OpenJDK/bin/java.exe'
          if(-not(Test-Path $java)){throw 'Installed Unity Java missing'}
          $buildTools=Get-ChildItem (Join-Path $sdk 'build-tools') -Directory|Sort-Object Name -Descending|Where-Object {(Test-Path (Join-Path $_.FullName 'apksigner.bat')) -and (Test-Path (Join-Path $_.FullName 'aapt.exe'))}|Select-Object -First 1
          if(-not $buildTools){throw 'Existing Android verification tools missing'}
          $apk=(Resolve-Path 'Unity/Builds/ValoriaReferenceClean/Valoria-Reference-Clean.apk').Path
          $priorPreference=$ErrorActionPreference
          try{
            $ErrorActionPreference='Continue'
            $signed=(& $java -jar (Join-Path $buildTools.FullName 'lib/apksigner.jar') verify --verbose --print-certs $apk 2>&1|Out-String);$signedExit=$LASTEXITCODE
            $badging=(& (Join-Path $buildTools.FullName 'aapt.exe') dump badging $apk 2>&1|Out-String);$badgingExit=$LASTEXITCODE
          }finally{$ErrorActionPreference=$priorPreference}
          if($signedExit){Write-Host $signed;throw 'APK cryptographic signature verification failed'}
          if($badgingExit){Write-Host $badging;throw 'APK manifest verification failed'}
          [IO.File]::WriteAllText((Join-Path (Resolve-Path 'docs/evidence/valoria-reference-clean') 'android-update-apksigner.txt'),$signed)
          [IO.File]::WriteAllText((Join-Path (Resolve-Path 'docs/evidence/valoria-reference-clean') 'android-update-badging.txt'),$badging)
          $expected='f479ca92ccfa256a991936b23d0153ffad247b352a8a5ed569457db8274443d8'
          if(-not $signed.ToLowerInvariant().Contains($expected)){throw 'APK signing certificate differs from installed-version candidate'}
          $request=Get-Content tools/valoria-reference-clean/request.json -Raw|ConvertFrom-Json
          $code=5;if($request.android_version_code){$code=[int]$request.android_version_code}
          if($badging -notmatch "package: name='com.eldoria.valoria.v5test' versionCode='$code'"){throw 'APK update package/version mismatch'}
          if($badging -notmatch "native-code: 'arm64-v8a'"){throw 'APK ARM64 missing'}
          @{source_sha=$env:GITHUB_SHA;package='com.eldoria.valoria.v5test';version_code=$code;prior_version_code=5;certificate_sha256=$expected;cryptographic_signature_verified=$true;sha256=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant();bytes=(Get-Item $apk).Length;owner_phone_update_tested=$false;user_data_reset=$false}|ConvertTo-Json|Set-Content docs/evidence/valoria-reference-clean/android-update-verification.json -Encoding utf8
