name: '[VALORIA] Clean reference reconstruction / native Unity'
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/valoria-reference-clean/request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-reference-clean-native
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[valoria-native]'))
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 75
    outputs:
      stage: ${{ steps.native_stage.outputs.stage }}
      revision: ${{ steps.native_stage.outputs.revision }}
    defaults:
      run:
        working-directory: valoria-layered-source
    steps:
      - name: Recover installed Git
        working-directory: .
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Installed Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-layered-source
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-clean-live-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check live exclusive lease and actual native tools
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE/valoria-clean-live-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'codex-work-valoria-integration-continuation-20261018' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Current clean-scene claim missing'}
          if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Runner reserved by another workstream'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Shared native tools busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity unavailable'}
          New-Item -ItemType Directory -Force docs/evidence/valoria-reference-clean|Out-Null
      - name: Recover only the proven Unity Editor Search-index corruption in CI
        shell: powershell
        run: |
          # Native134 ended inside UnityEditor.Search.SearchDatabase.IndexationOnStartup,
          # not in Eldoria gameplay. Search is an Editor-only convenience service,
          # never a QA or game-source authority. Preserve original preferences.
          $project=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source/Unity'
          $settings=Join-Path $project 'UserSettings/Search.index'
          $backup=Join-Path $env:RUNNER_TEMP "eldoria-search-preferences-$env:GITHUB_RUN_ID.json"
          $created=Join-Path $env:RUNNER_TEMP "eldoria-search-created-$env:GITHUB_RUN_ID.flag"
          if(Test-Path $settings){
            Copy-Item $settings $backup -Force
            $saved=Get-Content $settings -Raw -Encoding UTF8
            try {$config=$saved | ConvertFrom-Json -ErrorAction Stop}
            catch {throw 'Existing Search.index is malformed; original preserved. Refuse silent replacement.'}
            if($config.PSObject.Properties['roots']){
              $config.roots=@()
              $config | ConvertTo-Json -Depth 32 | Set-Content $settings -Encoding UTF8
              Write-Host 'ELDORIA_CI_SEARCH_INDEX_ROOTS_DISABLED_TEMPORARILY; old preferences backed up'
            } else {
              Write-Host 'ELDORIA_CI_SEARCH_INDEX_NO_ROOTS_PROPERTY; original preferences backed up'
            }
          } else {
            # CI worktrees can lack UserSettings/Search.index: the previous workaround then did nothing.
            # Unity Search maintainer workaround for the 6.3 Editor startup indexer is roots: [].
            # Create only a temporary Editor preference, not an asset or a game setting.
            New-Item -ItemType Directory -Force (Split-Path $settings) | Out-Null
            $config=[ordered]@{
              name='Assets'; type='asset'; roots=@(); includes=@();
              excludes=@('Assets/Temp/','Assets/External/','Temp/')
              options=@{disabled=$false;types=$true;properties=$true;extended=$true;dependencies=$true}
              baseScore=999
            }
            $config | ConvertTo-Json -Depth 16 | Set-Content $settings -Encoding UTF8
            'TEMPORARY_SEARCH_INDEX_CREATED' | Set-Content $created -Encoding ASCII
            Write-Host 'ELDORIA_CI_SEARCH_INDEX_CREATED_WITH_EMPTY_ROOTS; will remove after CI'
          }
          $actual=Get-Content $settings -Raw -Encoding UTF8|ConvertFrom-Json
          if($actual.PSObject.Properties['roots'] -and @($actual.roots).Count -ne 0){throw 'Editor-only Search index roots must be empty for this CI run'}
          Write-Host "ELDORIA_CI_SEARCH_INDEX_ROOTS_COUNT $(@($actual.roots).Count)"
          $cache=Join-Path $project 'Library/Search'
          if(Test-Path $cache){
            $moved=Join-Path $env:RUNNER_TEMP "eldoria-corrupt-search-cache-$env:GITHUB_RUN_ID"
            if(Test-Path $moved){throw 'Refuse to overwrite earlier Search cache backup'}
            Move-Item -LiteralPath $cache -Destination $moved -ErrorAction Stop
            Write-Host "ELDORIA_CI_SEARCH_INDEX_CACHE_ISOLATED $moved"
          }
      - name: Read existing Android update certificate identity without changing keys
        continue-on-error: true
        shell: powershell
        run: |
          $keytool=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/AndroidPlayer/OpenJDK/bin/keytool.exe'
          $report=@{expected_sha256='f479ca92ccfa256a991936b23d0153ffad247b352a8a5ed569457db8274443d8';package='com.eldoria.valoria.v5test';old_version_code=1;old_apk_run=38279800977;keys=@();matching_key_found=$false;private_key_exported=$false}
          if(Test-Path $keytool){
            $paths=@()
            foreach($user in @(Get-ChildItem "$env:SystemDrive/Users" -Directory -ErrorAction SilentlyContinue)){$p=Join-Path $user.FullName '.android/debug.keystore';if(Test-Path $p){$paths+=$p}}
            $p=Join-Path (Split-Path $env:UNITY_EDITOR_PATH) 'Data/PlaybackEngines/AndroidPlayer/Tools/debug.keystore';if(Test-Path $p){$paths+=$p}
            foreach($p in @($paths|Select-Object -Unique)){
              $savedPreference=$ErrorActionPreference
              try{$ErrorActionPreference='Continue';$raw=(& $keytool '-J-Duser.language=en' -list -v -keystore $p -storepass android 2>&1|Out-String)}finally{$ErrorActionPreference=$savedPreference}
              $match=[regex]::Match($raw,'SHA256:\s*([0-9A-Fa-f:]+)')
              $sha=$match.Groups[1].Value.Replace(':','').ToLowerInvariant()
              $report.keys+=@{path=$p;certificate_sha256=$sha;matches_original=($sha -eq $report.expected_sha256)}
              if($sha -eq $report.expected_sha256){$report.matching_key_found=$true}
            }
          }
          $report|ConvertTo-Json -Depth 5|Set-Content docs/evidence/valoria-reference-clean/android-existing-key-check.json -Encoding utf8
          Write-Host "Original Android signing key certificate match: $($report.matching_key_found)"
      - name: Execute requested stage in native Unity
        id: native_stage
        shell: powershell
        run: |
          $req=Get-Content tools/valoria-reference-clean/request.json -Raw|ConvertFrom-Json
          function Test-ValoriaContentLoaderCases {
            foreach($case in @('download','cached_offline','corrupt','incompatible')){
              $env:VALORIA_CONTENT_CASE=$case
              $caseLog=Join-Path $env:RUNNER_TEMP "valoria-content-$case.log"
              $caseArgs=@('-batchmode','-force-d3d11','-buildTarget','Win64','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",'-executeMethod','Eldoria.ReferenceClean.Editor.ValoriaContentBuild.ValidateLoader','-logFile',$caseLog)
              $caseProcess=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $caseArgs -PassThru
              if(-not $caseProcess.WaitForExit(240000)){& taskkill.exe /PID $caseProcess.Id /T /F|Out-Null;throw "Own content loader probe timeout $case"}
              Copy-Item $caseLog "docs/evidence/valoria-reference-clean/content-loader-$case.log"
              if($caseProcess.ExitCode -ne 0 -or -not(Select-String $caseLog -Pattern 'VALORIA_REFERENCE_CLEAN_CONTENT_LOADER_COMPLETE' -Quiet)){Get-Content $caseLog -Tail 100;throw "Content loader probe failed $case"}
            }
          }
          if(Test-Path 'tools/valoria-reference-clean/publish_content.ps1'){
            $tokens=$null;$parseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/valoria-reference-clean/publish_content.ps1'),[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count){throw ($parseErrors|Out-String)}
          }
          "stage=$($req.stage)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "revision=$($req.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBuilder.Build'
          if($req.stage -eq 'environment_author'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            if($req.repair_environment){& $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_environment_finish.py -- --repair-last-plan}
            else{& $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_environment_finish.py}
            if($LASTEXITCODE){throw 'Existing local artist environment authoring failed'}
            $result='docs/evidence/valoria-reference-clean/environment-finish-result.json'
            if(-not(Test-Path $result)){throw 'Environment authoring evidence missing'}
            if(-not((Get-Content $result -Raw|ConvertFrom-Json).sources_preserved)){throw 'Environment source preservation failed'}
            return
          }
          if($req.stage -eq 'web_playtest'){$method='Eldoria.ReferenceClean.Editor.ValoriaIntegratedWebBuild.Build'}
          if($req.stage -eq 'experience_finish'){$method='Eldoria.ReferenceClean.Editor.ValoriaIntegrationBuild.Improve';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'experience_validate'){$method='Eldoria.ReferenceClean.Editor.ValoriaIntegrationBuild.ValidateCurrent';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'city_world_ui'){$method='Eldoria.ReferenceClean.Editor.ValoriaIntegrationBuild.Build';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'gameplay'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanGameplayBuild.Build';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'gameplay_validate'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanGameplayBuild.PlayProbe';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'play'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanPlayProbe.Build'}
          if($req.stage -eq 'content_validate'){$method='Eldoria.ReferenceClean.Editor.ValoriaContentBuild.Validate'}
          if($req.stage -eq 'sawmill_trial'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanSawmillTrial.Build'}
          if($req.stage -eq 'android'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanAndroidBuild.Build'}
          if($req.stage -eq 'bastion_two_integrate'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionTwo.Integrate';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'bastion_integrate'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionIntegrate.Build'}
          if($req.stage -eq 'bastion_ground_finish'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionGroundFinish.Build'}
          if($req.stage -eq 'ground_diagnose'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionEnsemble.DiagnoseGround'}
          if($req.stage -eq 'contact_trial'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanContactTrial.Build'}
          if($req.stage -eq 'ground_trial'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanGroundTrial.BuildLocalized'}
          if($req.stage -eq 'package'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanFinalize.ExportExisting'}
          if($req.stage -eq 'bank_integrate'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanNatureTrial.IntegrateBankPatch'}
          if($req.stage -eq 'finalize'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanFinalize.Build'}
          if($req.stage -eq 'river_lighting'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanRiverLighting.Build'}
          if($req.stage -eq 'lighting'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanLightingPass.Build'}
          if($req.stage -eq 'integration'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanArtBuilder.Build'}
          $env:VALORIA_SHORE_PROFILE=$req.shore_treatment
          if($req.stage -eq 'art'){
            if($req.nature_treatment -eq 'bank_zone' -or $req.tree_treatment -eq 'canopy_ao_zone' -or $req.shore_treatment -in @('zone_profile','all_profile')){
              $env:VALORIA_NATURE_BASELINE_GLB=Join-Path $env:RUNNER_TEMP 'ValoriaReferenceBeforeNature.glb'
              Copy-Item 'Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Sources/Valoria_Reference_Clean.glb' $env:VALORIA_NATURE_BASELINE_GLB -Force
              $env:VALORIA_NATURE_BASELINE_HASH=(Get-Content 'docs/evidence/valoria-reference-clean/source-art.json' -Raw|ConvertFrom-Json).glb_sha256
              $env:VALORIA_NATURE_BASELINE_SOURCE=$req.validated_runtime_source
              $env:VALORIA_NATURE_TARGET='River_bank_rocks';$env:VALORIA_NATURE_PREFIX='nature-zone'
              if($req.tree_treatment -eq 'canopy_ao_zone'){$env:VALORIA_NATURE_TARGET='Fir_tree_group';$env:VALORIA_NATURE_PREFIX='canopy-zone'}
            }
            if($req.shore_treatment -in @('zone_profile','all_profile')){$env:VALORIA_NATURE_TARGET='Shore_profile';$env:VALORIA_NATURE_PREFIX='shore-zone'}
            if($req.waterline_finish -in @('zone_talus','all_talus')){$env:VALORIA_NATURE_TARGET='River_shingle_pockets';$env:VALORIA_NATURE_PREFIX='waterline-zone'}
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_scene.py
            if($LASTEXITCODE){throw 'Blender authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanArtBuilder.Build'
          }
          if($req.stage -eq 'bank_patch'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/patch_river_bank.py
            if($LASTEXITCODE){throw 'Bounded Qwen bank patch failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanNatureTrial.BuildBankPatch'
          }
          if($req.stage -eq 'shrub_trial'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/patch_shrub_crowns.py
            if($LASTEXITCODE){throw 'Bounded Qwen shrub crown patch failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanShrubTrial.Build'
          }
          if($req.stage -eq 'bastion_ensemble'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_bastion_ensemble.py
            if($LASTEXITCODE){throw 'Bastion ensemble authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionEnsemble.Build'
          }
          if($req.stage -eq 'bastion_environment'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_bastion_environment.py
            if($LASTEXITCODE){throw 'Bastion ensemble authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionEnvironment.Build'
          }
          if($req.stage -eq 'pine_volume'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_pine_volume.py
            if($LASTEXITCODE){throw 'Bastion ensemble authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanPineVolume.Build'
          }
          if($req.stage -eq 'bastion_two'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_bastion_two.py
            if($LASTEXITCODE){throw 'Bastion ensemble authoring failed'}
            $method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanBastionTwo.Build'
          }
          if($req.stage -eq 'camp_trial'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanCampTrial.Build'}
          if($req.stage -eq 'camp_integrate'){$method='Eldoria.ReferenceClean.Editor.ValoriaReferenceCleanCampTrial.Integrate';$env:VALORIA_GAMEPLAY_PROBE='1'}
          if($req.stage -eq 'camp_author'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            if($req.repair_camp){$env:VALORIA_CAMP_REPAIR='1'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_camp87.py
            if($LASTEXITCODE){throw 'Camp cloth authoring failed'}
            if(-not(Test-Path 'docs/evidence/valoria-reference-clean/camp87-result.json')){throw 'Camp authoring report missing'}
            return
          }
          if($req.stage -eq 'sawmill_author'){
            $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
            if(-not $blender){foreach($base in @('C:/Program Files/Blender Foundation',"$env:LOCALAPPDATA/Programs/Blender Foundation")){if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File|Sort-Object FullName -Descending|Select-Object -First 1 -ExpandProperty FullName};if($blender){break}}}
            if(-not $blender){throw 'Existing Blender unavailable'}
            if($req.repair_sawmill){$env:VALORIA_SAWMILL_REPAIR='1'}
            & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-reference-clean/author_sawmill_refined.py
            if($LASTEXITCODE){throw 'Camp cloth authoring failed'}
            if(-not(Test-Path 'docs/evidence/valoria-reference-clean/sawmill-refined-result.json')){throw 'Camp authoring report missing'}
            return
          }
          if($req.stage -eq 'web_playtest'){
            $integrationLog=Join-Path $env:RUNNER_TEMP 'valoria-web-integration-preflight.log'
            # Validate the committed integrated scene; never rebuild the historical assembly before WebGL.
            $integrationArgs=@('-batchmode','-force-d3d11','-buildTarget','Win64','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",'-executeMethod','Eldoria.ReferenceClean.Editor.ValoriaIntegrationBuild.ValidateCurrent','-logFile',$integrationLog)
            $integrationProcess=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $integrationArgs -PassThru
            # After switching the cached Unity project from Android to Win64,
            # this source-validated preflight can import thousands of assets.
            # Never infer a game PASS from elapsed time or skip the native check.
            # Preserve the full editor log on BOTH failure and timeout.
            $preflightPassed=$integrationProcess.WaitForExit(1200000)
            if(Test-Path $integrationLog){
              Copy-Item $integrationLog docs/evidence/valoria-reference-clean/web-integration-preflight.log -Force
              Write-Host 'ELDORIA_WEB_PREFLIGHT_LOG_CAPTURED_BEFORE_RESULT'
            }
            if(-not $preflightPassed){
              Write-Warning 'Native I-II scene verification exceeded 20 minutes: source cannot advance to WebGL'
              if(Test-Path $integrationLog){Get-Content $integrationLog -Tail 120}
              & taskkill.exe /PID $integrationProcess.Id /T /F|Out-Null
              throw 'Own integrated web preflight timed out; full editor log retained in web-integration-preflight.log'
            }
            Copy-Item $integrationLog docs/evidence/valoria-reference-clean/web-integration-preflight.log
            if($integrationProcess.ExitCode -ne 0 -or -not(Select-String $integrationLog -Pattern 'VALORIA_REFERENCE_CLEAN_INTEGRATION_COMPLETE' -Quiet)){Get-Content $integrationLog -Tail 100;throw 'Integrated I-II preflight failed; no browser build'}
          }
          $loaderCasesDone=$false
          if($req.validate_content_before_android){
            $preLog=Join-Path $env:RUNNER_TEMP 'valoria-content-before-android.log'
            $preArgs=@('-batchmode','-force-d3d11','-buildTarget','Win64','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",'-executeMethod','Eldoria.ReferenceClean.Editor.ValoriaContentBuild.Validate','-logFile',$preLog)
            $pre=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $preArgs -PassThru
            if(-not $pre.WaitForExit(1200000)){& taskkill.exe /PID $pre.Id /T /F|Out-Null;throw 'Own content preflight timed out'}
            Copy-Item $preLog docs/evidence/valoria-reference-clean/content-pre-android.log
            if($pre.ExitCode -ne 0 -or -not(Select-String $preLog -Pattern 'VALORIA_REFERENCE_CLEAN_GAMEPLAY_PROBE_COMPLETE EXISTING_UI_RULES_SAVE_I_II_PASS' -Quiet)){Get-Content $preLog -Tail 100;throw 'Exact content/runtime preflight failed'}
            if($req.validate_loader_cases){Test-ValoriaContentLoaderCases;$loaderCasesDone=$true}
          }
          $log=Join-Path $env:RUNNER_TEMP 'valoria-reference-clean.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-layered-source/Unity",'-executeMethod',$method,'-logFile',$log)
          $settingsPath=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source/Unity/ProjectSettings/ProjectSettings.asset'
          $settingsBefore=@{}
          foreach($name in @('ProjectSettings.asset','GraphicsSettings.asset','QualitySettings.asset')){$q=Join-Path (Split-Path $settingsPath) $name;$settingsBefore[$q]=[IO.File]::ReadAllBytes($q)}
          if($req.stage -in @('lighting','river_lighting','finalize','package','ground_trial','bank_patch','bank_integrate','contact_trial','shrub_trial','bastion_ensemble','ground_diagnose','bastion_environment','bastion_ground_finish','bastion_integrate','pine_volume','gameplay','gameplay_validate','bastion_two','bastion_two_integrate','camp_trial','camp_integrate','content_validate','sawmill_trial','city_world_ui','experience_finish','experience_validate')){$args+=@('-buildTarget','Win64')}
          if($req.stage -eq 'android'){$args+=@('-buildTarget','Android')}
          if($req.stage -eq 'web_playtest'){$args+=@('-buildTarget','WebGL')}

          $resourceRoot=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source/Unity/Assets/Eldoria/Resources/Valoria'
          $resourceStash=Join-Path $env:RUNNER_TEMP "ValoriaResourceGLBs-update-$env:GITHUB_RUN_ID"
          $streamSource=Join-Path $env:GITHUB_WORKSPACE 'valoria-layered-source/Unity/Assets/StreamingAssets/ValoriaFamilyV3'
          $streamStash=Join-Path $env:RUNNER_TEMP "ValoriaFamilyV3-update-$env:GITHUB_RUN_ID"
          $movedBytes=0;$movedFiles=0
          if($req.stage -in @('android','web_playtest') -and ((Test-Path $resourceStash) -or (Test-Path $streamStash))){throw 'Existing update stash requires recovery; refuse overwrite'}
          try{

            if($req.stage -in @('android','web_playtest')){
              # Recovered optimized V5 packaging: exclude only legacy source GLBs and the source-only V3 streaming family.
              if(Test-Path $resourceRoot){foreach($glb in @(Get-ChildItem $resourceRoot -Recurse -File -Filter '*.glb')){
                $relative=$glb.FullName.Substring($resourceRoot.Length).TrimStart([char]92);$target=Join-Path $resourceStash $relative
                New-Item (Split-Path $target) -ItemType Directory -Force|Out-Null
                $movedBytes+=$glb.Length;$movedFiles++;Move-Item $glb.FullName $target
                if(Test-Path ($glb.FullName+'.meta')){Move-Item ($glb.FullName+'.meta') ($target+'.meta')}
              }}
              if(Test-Path $streamSource){$movedBytes+=(Get-ChildItem $streamSource -Recurse -File|Measure-Object Length -Sum).Sum;Move-Item $streamSource $streamStash}
              @{original_procedure_run=38279800977;source_glbs_excluded=$movedFiles;source_bytes_excluded=$movedBytes;single_scene='Valoria_Reference_Clean.unity';user_data_touched=$false}|ConvertTo-Json|Set-Content (Join-Path 'docs/evidence/valoria-reference-clean' ($req.stage+'-optimized-payload.json')) -Encoding utf8
            }
            $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
            $nativeTimeoutMs=if($req.stage -eq 'experience_validate'){720000}else{2400000}
          if(-not $p.WaitForExit($nativeTimeoutMs)){
            if(Test-Path $log){Get-Content $log -Tail 90}
            & taskkill.exe /PID $p.Id /T /F|Out-Null
            throw "Own Unity process timed out after $nativeTimeoutMs ms; inspect exact log and Search indexing evidence"
          }
          }finally{

            if($req.stage -in @('android','web_playtest')){
              foreach($q in $settingsBefore.Keys){[IO.File]::WriteAllBytes($q,$settingsBefore[$q])}
              if(Test-Path $resourceStash){
                foreach($item in @(Get-ChildItem $resourceStash -Recurse -File)){
                  $relative=$item.FullName.Substring($resourceStash.Length).TrimStart([char]92);$target=Join-Path $resourceRoot $relative
                  New-Item (Split-Path $target) -ItemType Directory -Force|Out-Null
                  if(Test-Path $target){throw "RESTORE_REFUSED_FILE_EXISTS $relative"};Move-Item $item.FullName $target
                }
                Remove-Item $resourceStash -Force -Recurse
              }
              if(Test-Path $streamStash){if(Test-Path $streamSource){throw 'RESTORE_REFUSED_SOURCE_EXISTS'};Move-Item $streamStash $streamSource}
            }
          }
          $nativeLog='native-unity.log';if($req.stage -eq 'android'){$nativeLog='android-native.log'}
          Copy-Item $log (Join-Path 'docs/evidence/valoria-reference-clean' $nativeLog)
          Select-String $log -Pattern "Exception:|error CS|Shader error|^Error|TERRAIN_ROUTE_DIAGNOSTIC|TerrainCollider component deleted" -Context 1,2
          Get-Content $log -Tail 100
          if($p.ExitCode -ne 0){throw "Native Unity failed $($p.ExitCode)"}
