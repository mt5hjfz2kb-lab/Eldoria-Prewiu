name: World4X artistic process evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: World4X branch/commit to verify
        required: false
        type: string
        default: feature/world4x-region1-canon-20261022

permissions:
  contents: read

concurrency:
  group: world4x-artistic-process-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-artistic-process:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 100
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read canonical verifier from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: policy
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/world4x-artistic-process/verify.mjs
            tools/world4x-artistic-process/README.md
      - name: Read exact PR candidate and Git history (no Unity or Blender lease)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_ref }}
          path: candidate
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/evidence/world4x-canon-20261022
      - name: Verify evidence validator source
        run: node --check policy/tools/world4x-artistic-process/verify.mjs
      - name: Fail closed on missing artistic process and matched Unity A/B evidence
        run: node policy/tools/world4x-artistic-process/verify.mjs candidate
