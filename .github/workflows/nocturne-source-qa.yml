name: NOCTURNE Unity scripts — isolated Roslyn source QA (not native certification)
on:
  push:
    branches: [experiment/nocturne-rebuild-bastion-i-v-20261115]
    paths:
      - Unity/Assets/Eldoria/Experiments/NocturneRebuild/Runtime/**
      - Unity/Assets/Eldoria/Experiments/NocturneRebuild/Editor/**
      - Unity/Assets/Eldoria/Scripts/Presentation/SliceBoot.cs
      - tools/nocturne-rebuild/SourceSyntaxQa/**
      - .github/workflows/nocturne-source-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nocturne-syntax-qa
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools/nocturne-rebuild/SourceSyntaxQa
            Unity/Assets/Eldoria/Experiments/NocturneRebuild/Runtime
            Unity/Assets/Eldoria/Experiments/NocturneRebuild/Editor
            Unity/Assets/Eldoria/Scripts/Presentation/SliceBoot.cs
      - name: Parse both new assemblies and isolated scene bootstrap with Roslyn
        run: |
          dotnet --version
          dotnet run --project tools/nocturne-rebuild/SourceSyntaxQa/SourceSyntaxQa.csproj -- \
            Unity/Assets/Eldoria/Experiments/NocturneRebuild/Runtime/NocturneRuntime.cs \
            Unity/Assets/Eldoria/Experiments/NocturneRebuild/Editor/NocturneSceneBuilder.cs \
            Unity/Assets/Eldoria/Scripts/Presentation/SliceBoot.cs
      - name: Enforce real gameplay backend and separate persisted save
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Unity/Assets/Eldoria/Experiments/NocturneRebuild/Runtime/NocturneRuntime.cs').read_text()
          b=Path('Unity/Assets/Eldoria/Experiments/NocturneRebuild/Editor/NocturneSceneBuilder.cs').read_text()
          boot=Path('Unity/Assets/Eldoria/Scripts/Presentation/SliceBoot.cs').read_text()
          for token in ['new LocalGateway(new SystemClock(), new FileStateStore(saveFile))',
                'eldoria-nocturne-experiment-i-v.json','gateway.Execute(',
                'AdvanceBastion','Build','UpgradeBuilding','Gather','Fight',
                'Recruit','ConfigureMarch','ChooseDevelopment','BastionModels']:
              assert token in p,('Authentic mechanic connection missing',token)
          for token in ['Nocturne_Experiment.unity','PrefabUtility.InstantiatePrefab',
                'CityGround','WorldGround','NocturnePanel','NocturnePrimary',
                'NocturneSecondary','NocturneDock','NocturneResponsiveLayout']:
              assert token in b,('Physical scene authoring missing',token)
          assert 'Nocturne_Experiment' in boot, 'Legacy presenter may override isolated scene'
          assert 'Valoria_HeroBastion_v1' not in p+b, 'Banned legacy Bastion asset'
          assert 'PrimitiveType' not in p+b, 'Runtime geometry placeholder prohibited'
          print('NOCTURNE_AUTHENTICITY_STATIC_GUARD_PASS')
          PY
