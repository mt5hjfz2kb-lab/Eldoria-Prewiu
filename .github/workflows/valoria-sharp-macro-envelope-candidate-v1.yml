name: "[VALORIA] Isolated native V10 roads, river, true Unity A/B, independent visual review"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'tools/valoria-layered-construction/author-entry-zone-v10.blender.py'
      - 'tools/valoria-layered-construction/qwen-entry-independent-review-v10.py'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaEntryZoneV10Integration.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  actual-sharp-native:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Resolve existing GitHub Desktop git
        working-directory: .
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git is unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Exclusive live owner, idle renderer and frozen V7 source gate
        shell: powershell
        run: |
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $b=Get-Content "pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $id='valoria-master-plan-layered-construction-20261016'
          $owner='chatgpt-normal-valoria-construction-20261017'
          foreach($r in @($a,$b)){
            if(@($r.active|Where-Object {$_.id -eq $id -and $_.owner -eq $owner -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Exclusive ownership lease not confirmed'}
            if(@($r.active|Where-Object {$_.id -ne $id -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Incompatible Windows owner'}
          }
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native Unity/Blender processes busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity editor unavailable'}
          if((Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower() -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Reference mismatch'}
          $old='docs/evidence/valoria-layered-construction-20261016/entry-zone-v7/ValoriaEntryZoneV7.blend'
          if(-not(Test-Path $old) -or (Get-FileHash $old -Algorithm SHA256).Hash.ToLower() -ne '24e27862ae759e30c36b151cef4fd9baacb45d1103d25f132bbe054d65896381'){throw 'Saved V7 BLEND identity mismatch'}
          if(-not(Test-Path 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV7_CANDIDATE.unity')){throw 'Genuine V7 Unity scene absent'}
      - name: Native Blender V10 edits on protected V7 copy, source hash and stone count
        shell: powershell
        run: |
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $blender){
            foreach($base in @('C:\Program Files\Blender Foundation',"$env:LOCALAPPDATA\Programs\Blender Foundation")){
              if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
              if($blender){break}
            }
          }
          if(-not $blender){throw 'Native Blender missing; no paid or new downloads allowed'}
          "VALORIA_ENTRY_BLENDER=$blender" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $dir='docs/evidence/valoria-layered-construction-20261016/entry-zone-v10'
          New-Item -ItemType Directory -Force $dir|Out-Null
          & $blender --version | Out-File "$dir/blender-version.txt" -Encoding utf8
          & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-layered-construction/author-entry-zone-v10.blender.py
          if($LASTEXITCODE){throw 'Native V10 Blender source authoring failed'}
          $x=Get-Content "$dir/entry-source.json" -Raw|ConvertFrom-Json
          if($x.source_v7_blend_sha256 -ne '24e27862ae759e30c36b151cef4fd9baacb45d1103d25f132bbe054d65896381' -or $x.native_route_painted_pixels -lt 5000 -or $x.result_glb_sha256 -ne (Get-FileHash "$dir/ValoriaEntryZoneV10.glb" -Algorithm SHA256).Hash.ToLower()){throw 'V10 native output identity failed'}
      - name: Genuine Unity fixed-camera V7-before V10-after, route and proportion gates
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/entry-zone-v10'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-entry-v10-native-unity.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaEntryZoneV10Integration.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){& taskkill.exe /PID $p.Id /T /F|Out-Null;throw 'Unity V10 timeout'}
          Get-Content $log -Tail 90
          Copy-Item $log "$dir/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_ENTRY_ZONE_V10_NATIVE_COMPLETE' -Quiet)){throw "Native Unity V10 failed exit=$($p.ExitCode)"}
          $x=Get-Content "$dir/entry-native.json" -Raw|ConvertFrom-Json
          if($x.canonical_modified -or $x.original_sources_modified -or $x.physical_stairs -ne 12 -or $x.source_target_matches -ne 7 -or $x.route_passes -ne 28 -or -not $x.pedestrian_clear -or -not $x.gate_macro_proportions_pass){throw 'V10 protected technical gate failed'}
          if([math]::Abs($x.home_fov-44.4228096) -gt .0001){throw 'Camera lens changed'}
          foreach($img in @('entry-BEFORE-home.png','entry-AFTER-home.png','light-AFTER-home.png','light-AFTER-portrait.png')){
            if(-not(Test-Path "$dir/$img")){throw "Missing true Unity $img"}
          }
          Write-Host 'NATIVE_V10_TECH_PASS_NOT_ART_APPROVAL'
      - name: Independent local Qwen critical review with approved reference; no art self-approval
        if: success()
        shell: powershell
        run: |
          $started=$null
          try{
            try{Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 5|Out-Null}catch{
              $ollama=(Get-Command ollama.exe -ErrorAction SilentlyContinue).Source
              if(-not $ollama){$ollama=Join-Path $env:LOCALAPPDATA 'Programs/Ollama/ollama.exe'}
              if(Test-Path $ollama){$started=Start-Process $ollama -ArgumentList 'serve' -PassThru -WindowStyle Hidden;Start-Sleep -Seconds 4}
            }
            & $env:VALORIA_ENTRY_BLENDER -b -t 2 --python-exit-code 1 --python tools/valoria-layered-construction/qwen-entry-independent-review-v10.py
          }finally{if($started -and -not $started.HasExited){Stop-Process -Id $started.Id -ErrorAction SilentlyContinue}}
      - name: Preserve only isolated V10 evidence and scene; normal fetch/rebase/push
        if: success()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $base='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          git add -f -- docs/evidence/valoria-layered-construction-20261016/entry-zone-v10/
          git add -f -- "$base/Valoria_SHARP_EntryZoneV10_CANDIDATE.unity" "$base/GeneratedEntryV10/"
          foreach($meta in @('Editor/ValoriaEntryZoneV10Integration.cs.meta','GeneratedEntryV10.meta','Valoria_SHARP_EntryZoneV10_CANDIDATE.unity.meta')){
            $p="$base/$meta"
            if(Test-Path $p){git add -f -- $p}
          }
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): actual Blender/Unity V10 candidate with independent visual review'
            git reset --hard HEAD
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch latest owner branch'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch conflict; preserve artifact, never force'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent push failed; preserve artifact, never force'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-entry-zone-v10-native-evidence
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v10/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV10_CANDIDATE.unity
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV10/**
          if-no-files-found: warn
