name: "[VALORIA] Restore approved Source08 Bastion nine materials | native Blender and Unity V13/V17 A/B"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'tools/valoria-layered-construction/restore-source08-bastion-v17.blender.py'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaEntryZoneV17Integration.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  real-source08-bastion-recovery:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Expose existing Windows GitHub Desktop git
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Real exclusive owner, original source SHA and visible SHARP player camera preflight
        shell: powershell
        run: |
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $b=Get-Content "pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          foreach($r in @($a,$b)){
            if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Original owner lease mismatch'}
            if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Other Windows owner'}
          }
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unity or Blender already in use'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity 6000 not reachable'}
          if((Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower() -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Approved reference changed'}
          $original='art-source/valoria/production/bastion-family-v1/BastionFamilyV1.blend'
          if((Get-FileHash $original -Algorithm SHA256).Hash.ToLower() -ne '5c7b7e0918ac2e7dc78984515991c3f3546dffc3927bd0fa23bcaf4e9b148893'){throw 'Original approved Source08 family changed'}
          $input='docs/evidence/valoria-layered-construction-20261016/entry-zone-v13/ValoriaEntryZoneV13.blend'
          if((Get-FileHash $input -Algorithm SHA256).Hash.ToLower() -ne '1023443ef9eb3137a5157188b16194ff6245b08003f4c388377610d15811a1cf'){throw 'V13 copied professional geometry changed'}
          $visibility='docs/evidence/valoria-layered-construction-20261016/bastion-source08-visibility/visibility-result.json'
          if(-not(Test-Path $visibility)){throw 'Prior genuinely rendered player visibility proof missing'}
          $v=Get-Content $visibility -Raw|ConvertFrom-Json
          if($v.bastion_renderers -ne 9 -or $v.changed_pixels_upper_band -lt 150 -or -not $v.same_presenter_camera -or $v.art_approved){throw 'Prior SHARP camera visible/actual player proof failed'}
          Write-Host "ELDORIA_SOURCE08_REAL_PLAYER_RENDERER_VISIBILITY_CONFIRMED=$($v.changed_pixels) pixels. Not an art pass."
      - name: Native Blender source restore exact nine semantic materials and genuine two studio renders
        shell: powershell
        run: |
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $blender){
            foreach($base in @('C:\Program Files\Blender Foundation',"$env:LOCALAPPDATA\Programs\Blender Foundation")){
              if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
              if($blender){break}
            }
          }
          if(-not $blender){throw 'Native Blender unavailable; no external paid tools allowed'}
          $dir='docs/evidence/valoria-layered-construction-20261016/entry-zone-v17'
          New-Item -ItemType Directory -Force $dir|Out-Null
          & $blender --version | Out-File "$dir/blender-version.txt" -Encoding utf8
          & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-layered-construction/restore-source08-bastion-v17.blender.py
          if($LASTEXITCODE){throw 'Actual native Blender V17 material recovery failed'}
          $s=Get-Content "$dir/entry-source.json" -Raw|ConvertFrom-Json
          if($s.bastion_module_count -ne 9 -or $s.triangles -ne 374064 -or -not $s.input_v13_geometry_unchanged -or $s.art_approved -or $s.result_glb_sha256 -ne (Get-FileHash "$dir/ValoriaEntryZoneV17.glb" -Algorithm SHA256).Hash.ToLower()){throw 'Restored professional source identities or geometry not verified'}
          foreach($file in @('source-clay-threequarter.png','source-source08-material-threequarter.png')){
            if(-not(Test-Path "$dir/$file") -or (Get-Item "$dir/$file").Length -lt 20000){throw "True Blender source render missing: $file"}
          }
          Write-Host "SOURCE08_RESTORED_REAL_EDITABLE_SOURCE_AND_ORIGINAL_HIERARCHY_NOT_YET_ART_APPROVED"
      - name: Real Unity V13-before V17-after same-camera visual and original interactions
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/entry-zone-v17'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-bastion-source08-v17-unity.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaEntryZoneV17Integration.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'V17 Unity import timeout'}
          Get-Content $log -Tail 90
          Copy-Item $log "$dir/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_ENTRY_ZONE_V17_NATIVE_COMPLETE' -Quiet)){throw "V17 Unity import/visual gate failed exit=$($p.ExitCode)"}
          $n=Get-Content "$dir/entry-native.json" -Raw|ConvertFrom-Json
          if($n.canonical_modified -or $n.original_sources_modified -or $n.source_triangles -ne 374064 -or $n.physical_stairs -ne 12 -or $n.route_passes -ne 28 -or $n.route_probes -ne 28 -or $n.source_target_matches -ne 7 -or -not $n.gate_macro_proportions_pass -or -not $n.pedestrian_clear){throw 'Original Unity interactions or topology regressed'}
          if([math]::Abs($n.home_fov-44.4228096) -gt .0001){throw 'Camera changed in V17; real comparison invalid'}
          foreach($img in @('entry-BEFORE-home.png','entry-AFTER-home.png','light-AFTER-home.png','entry-AFTER-portrait.png')){
            if(-not(Test-Path "$dir/$img") -or (Get-Item "$dir/$img").Length -lt 20000){throw "Genuine V17 Unity screenshot missing: $img"}
          }
          Write-Host 'V17_NATIVE_BLENDER_UNITY_TECH_PASS_NOT_ART_APPROVED'
      - name: Persist isolated authentic evidence and candidate without modifying main
        if: always()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $e='docs/evidence/valoria-layered-construction-20261016/entry-zone-v17'
          $base='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          if(Test-Path $e){git add -f -- "$e/"}
          foreach($path in @("$base/Valoria_SHARP_EntryZoneV17_CANDIDATE.unity","$base/Valoria_SHARP_EntryZoneV17_CANDIDATE.unity.meta","$base/GeneratedEntryV17.meta","$base/Editor/ValoriaEntryZoneV17Integration.cs.meta")){
            if(Test-Path $path){git add -f -- "$path"}
          }
          if(Test-Path "$base/GeneratedEntryV17"){git add -f -- "$base/GeneratedEntryV17/"}
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): authentic Source08 material-restored Blender and Unity V17 A/B'
            if($LASTEXITCODE){throw 'Cannot commit real Source08 evidence'}
            git reset --hard HEAD
            if($LASTEXITCODE){throw 'Cannot clean Unity-generated working files'}
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot inspect concurrent branch changes'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch changes conflict, preserve output and do not force push'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Evidence-only push failed, preserve artifact'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-source08-bastion-restored-v17-real-blender-unity
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v17/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV17_CANDIDATE.unity
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV17/**
          if-no-files-found: warn
