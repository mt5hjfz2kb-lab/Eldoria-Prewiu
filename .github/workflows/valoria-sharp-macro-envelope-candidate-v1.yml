name: "[VALORIA] V8 isolated entrance finish, native bridge contact and original camera tests"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaEntryFinishV8.cs'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV7_CANDIDATE.unity'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  actual-sharp-native:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Resolve existing GitHub Desktop git
        working-directory: .
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git is unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check exclusive workstream, free Unity editor and owner-approved reference
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $owner='valoria-master-plan-layered-construction-20261016'
          if(@($r.active|Where-Object {$_.id -eq $owner -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017'}).Count -ne 1){throw 'Lease missing or owner mismatch'}
          if(@($r.active|Where-Object {$_.id -ne $owner -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Runner claimed by incompatible owner'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unity/Blender busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity editor unavailable'}
          $h=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower()
          if($h -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Art reference mismatch'}
          if(-not(Test-Path 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV7_CANDIDATE.unity')){throw '7-contact source scene missing'}
      - name: Improve only the isolated V7 gate-area scene, record genuine native Unity A/B and contacts
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/entry-zone-v8'
          New-Item -ItemType Directory -Force -Path $dir|Out-Null
          $log=Join-Path $env:RUNNER_TEMP 'valoria-entry-v8-unity.log'
          $args=@('-batchmode','-force-d3d11','-screen-width','1536','-screen-height','1024','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaEntryFinishV8.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){
            & taskkill.exe /PID $p.Id /T /F|Out-Null
            throw 'Native Unity entry V8 timeout'
          }
          Get-Content $log -Tail 130
          Copy-Item $log "$dir/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_ENTRY_FINISH_V8_NATIVE_COMPLETE' -Quiet)){
            throw "Native Unity V8 failed exit=$($p.ExitCode)"
          }
      - name: Prove non-destructive V8 source contacts and camera, no automatic art approval
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/entry-zone-v8'
          $x=Get-Content "$dir/entry-native.json" -Raw|ConvertFrom-Json
          if(-not $x.gate_lens_preserved -or -not $x.water_adjusted -or $x.disabled_beige_renderers -lt 2 -or
             $x.certified_steps -ne 12 -or $x.source_targets -ne 7 -or $x.route_probes -ne 28 -or $x.route_passes -ne 28 -or
             -not $x.pedestrian_clear -or $x.source_colliders_before -ne $x.source_colliders_after -or
             $x.canonical_modified -or $x.bridge_footings_changed -or $x.footings_samples -lt 1){throw 'V8 native local integrity gate failed'}
          Write-Host 'V8_LOCAL_TECH_PASS; FULL_FRAME_ART_NOT_APPROVED'
      - name: Commit isolated V8 evidence and scene without overwriting V7 or any real gameplay
        shell: powershell
        run: |
          git config user.name 'Valoria native macro'
          git config user.email 'valoria-macro@users.noreply.github.com'
          git add -f -- docs/evidence/valoria-layered-construction-20261016/entry-zone-v8/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV8_CANDIDATE.unity
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV8/
          foreach($meta in @('Editor/ValoriaEntryFinishV8.cs.meta','GeneratedEntryV8.meta','Valoria_SHARP_EntryZoneV8_CANDIDATE.unity.meta')){
            $mp="Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/$meta"
            if(Test-Path $mp){git add -f -- $mp}
          }
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): isolated V8 original-camera entrance finish and measured bridge contacts'
            git reset --hard HEAD
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch latest owner HEAD'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent owner branch conflict; preserve artifact, never force'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent push, preserve artifact, never force'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-entry-zone-v8-${{ github.run_id }}
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v8/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV8_CANDIDATE.unity
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV8/**
          if-no-files-found: warn
