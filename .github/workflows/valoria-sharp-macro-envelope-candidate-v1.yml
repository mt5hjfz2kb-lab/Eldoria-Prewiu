name: "[VALORIA] Native V13 visual ownership inventory and safe duplicate cleanup"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaSceneVisualOwnershipGate.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  native-visual-ownership:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Resolve installed GitHub Desktop git
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Exclusive owner and native rendering preflight
        shell: powershell
        run: |
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $b=Get-Content "pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          foreach($r in @($a,$b)){
            if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Existing workstream ownership not certified'}
            if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Another workstream owns Windows runner'}
          }
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unity or Blender is already in use'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity 6000.3.23f1 unavailable'}
          if((Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower() -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Reference changed'}
          $root='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          foreach($n in @('Valoria_SHARP_EntryZoneV13_CANDIDATE.unity','Valoria_SHARP_Entry_PlayableV3.unity')){
            if(-not(Test-Path "$root/$n")){throw "Missing protected scene $n"}
          }
          Write-Host 'WORKSTREAM_EXCLUSIVE_SOURCE_SCENES_FROZEN_NATIVE_CLEANUP_PERMITTED'
      - name: Execute true camera V13 source-wide renderer census and reversible duplicate proof
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/visual-ownership-cleanup'
          New-Item -ItemType Directory -Force $dir|Out-Null
          $log=Join-Path $env:RUNNER_TEMP 'valoria-visual-ownership-native.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaSceneVisualOwnershipGate.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2100000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Unity V13 census timeout'}
          Get-Content $log -Tail 100
          Copy-Item $log "$dir/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_VISUAL_OWNERSHIP_CLEANUP_NATIVE_COMPLETE' -Quiet)){throw "Real Unity visual ownership audit failed, exit $($p.ExitCode)"}
          $r=Get-Content "$dir/visual-ownership-native.json" -Raw|ConvertFrom-Json
          if($r.original_interaction_hits -ne 7 -or $r.clean_interaction_hits -ne 7 -or $r.original_route_passes -ne 28 -or $r.clean_route_passes -ne 28 -or $r.original_stair_colliders -ne 12 -or $r.source_bastion_renderers -ne 9 -or $r.same_image_changed_pixels -gt 8 -or $r.source_scene_modified -or $r.canonical_modified -or -not $r.camera_preserved){throw 'Visual cleanup baseline quality/gameplay gate failed'}
          Write-Host "REAL_NATIVE_VISUAL_OWNERSHIP_PASS: $($r.verdict); original visible=$($r.active_visible); exact duplicates removed=$($r.visually_identical_duplicates); non-automatic review hints=$($r.unresolved_overlap_hints)"
      - name: Preserve evidence and candidate only when actual fix occurs
        if: always()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $dir='docs/evidence/valoria-layered-construction-20261016/visual-ownership-cleanup'
          $scene='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV13_VISUAL_CLEAN_CANDIDATE.unity'
          if(Test-Path $dir){git add -f -- "$dir/"}
          if(Test-Path $scene){git add -f -- "$scene"; if(Test-Path "$scene.meta"){git add -f -- "$scene.meta"}}
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): full native V13 renderer ownership and safe visual cleanup'
            if($LASTEXITCODE){throw 'Cannot save actual native evidence'}
            git reset --hard HEAD
            if($LASTEXITCODE){throw 'Failed to clear Unity-generated checkout changes'}
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch owner branch'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent owner change prevents safe rebase; no force push'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot save evidence to owner branch; retained as artifact'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-v13-visible-ownership-real-unity
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/visual-ownership-cleanup/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV13_VISUAL_CLEAN_CANDIDATE.unity
          if-no-files-found: warn
