name: "[VALORIA] Source08 Bastion SHARP player-visibility gate"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaBastionVisibilityGate.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  native-bastion-visibility:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Resolve GitHub Desktop git on installed Windows host
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify same live owner, locked game, and free native runner
        shell: powershell
        run: |
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw | ConvertFrom-Json
          $b=Get-Content "pipeline/active-workstreams.json" -Raw | ConvertFrom-Json
          foreach($r in @($a,$b)){
            $matching=@($r.active | Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017' -and $_.resources -contains 'windows-runner-heavy'})
            if($matching.Count -ne 1){throw 'Original workstream exclusive owner mismatch'}
            if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Another Windows owner'}
          }
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native renderer busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity 6000 editor not available'}
          if((Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower() -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Approved target identity changed'}
          foreach($p in @('Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV13/EntryZoneV1.prefab','Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_Entry_PlayableV3.unity')){
            if(-not(Test-Path $p)){throw "Missing existing original source: $p"}
          }
      - name: Actual same-camera ON/OFF nine-mesh proof on untouched playable V3 copy
        shell: powershell
        run: |
          $e='docs/evidence/valoria-layered-construction-20261016/bastion-source08-visibility'
          New-Item -ItemType Directory -Force $e|Out-Null
          $log=Join-Path $env:RUNNER_TEMP 'valoria-bastion-source08-visibility.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaBastionVisibilityGate.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Unity renderer gate timeout'}
          Get-Content $log -Tail 70
          Copy-Item $log "$e/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_BASTION_SOURCE08_VISIBILITY_NATIVE_COMPLETE' -Quiet)){throw "Bastion visibility not proven; no art approval; Unity exit=$($p.ExitCode)"}
          $j=Get-Content "$e/visibility-result.json" -Raw|ConvertFrom-Json
          if($j.bastion_renderers -ne 9 -or $j.changed_pixels_upper_band -lt 150 -or -not $j.same_presenter_camera -or $j.art_approved){throw 'Real SHARP visibility gate failed'}
          Write-Host "SOURCE08_REAL_RENDER_VISIBILITY_CONFIRMED_PIXELS=$($j.changed_pixels) TOP=$($j.changed_pixels_upper_band); NOT ART APPROVAL"
      - name: Preserve real evidence and isolated player candidate, never main
        if: always()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $e='docs/evidence/valoria-layered-construction-20261016/bastion-source08-visibility'
          $c='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_Entry_BastionVisibility_CANDIDATE.unity'
          if(Test-Path $e){git add -f -- "$e/"}
          if(Test-Path $c){git add -f -- "$c"; if(Test-Path "$c.meta"){git add -f -- "$c.meta"}}
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): native SHARP Source08 nine-renderer player-frame visibility proof'
            if($LASTEXITCODE){throw 'Evidence commit failed'}
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch owner branch'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch change; never force push'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Evidence push blocked; archive retained'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-bastion-source08-visible-player-frame
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/bastion-source08-visibility/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_Entry_BastionVisibility_CANDIDATE.unity
          if-no-files-found: warn
