name: "[VALORIA] Native Source08 facade orientation vs actual SHARP player-camera"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaBastionFacingProbe.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  real-player-facing:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Locate Git installed with GitHub Desktop
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue|Sort-Object Name -Descending|ForEach-Object{Join-Path $_.FullName 'resources/app/git/cmd/git.exe'}|Where-Object{Test-Path $_}|Select-Object -First 1
            if(-not $git){throw 'Git unavailable'};Add-Content $env:GITHUB_PATH (Split-Path $git)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Same-owner runner preflight and interrupted worktree recovery
        shell: powershell
        run: |
          if((Test-Path '.git/rebase-merge') -or (Test-Path '.git/rebase-apply')){
            git rebase --abort
            if($LASTEXITCODE){throw 'Interrupted local rebase cannot be recovered'}
            git reset --hard $env:GITHUB_SHA
            if($LASTEXITCODE){throw 'Failed to recover exact triggered commit'}
          }
          if((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA){throw 'Unexpected source HEAD after worktree recovery'}
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $b=Get-Content 'pipeline/active-workstreams.json' -Raw|ConvertFrom-Json
          foreach($r in @($a,$b)){
            if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Same workstream exclusive claim no longer valid'}
            if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Incompatible runner claim'}
          }
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native editor/modeler in use'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity unavailable'}
          $s='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV18_CANDIDATE.unity'
          if(-not(Test-Path $s)){throw 'Actual native V18 SHARP art candidate unavailable'}
          $e='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18/entry-native.json'
          $report=Get-Content $e -Raw|ConvertFrom-Json
          if($report.canonical_modified -or $report.route_passes -ne 28 -or $report.source_target_matches -ne 7){throw 'V18 source baseline is not safe'}
      - name: Real exact renderable triangle normals and material alignment to SHARP camera
        shell: powershell
        run: |
          $ev='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-facing-real-player-camera.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaBastionFacingProbe.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2100000)){& taskkill.exe /PID $p.Id /T /F|Out-Null;throw 'Actual SHARP facing diagnostics timeout'}
          Get-Content $log -Tail 75
          Copy-Item $log "$ev/actual-player-bastion-facing-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_V18_REAL_FACADE_FACING_DIAGNOSTIC_COMPLETE' -Quiet)){throw 'Real player-camera diagnosis not verified'}
          $s=Get-Content "$ev/actual-player-bastion-facing.json" -Raw|ConvertFrom-Json
          if(-not $s.same_picking_camera -or $s.canonical_modified -or $s.source_geometry_modified){throw 'Read-only diagnostic changed camera or art'}
          Write-Host "ACTUAL_NATIVE_FACADE_ORIENTATION=$($s.verdict) bannerFront=$($s.heraldry_front) bannerBack=$($s.heraldry_back) frustum=$($s.heraldry_in_frustum)"
      - name: Save ONLY read-only camera evidence on same branch
        if: always()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $e='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          foreach($p in @("$e/actual-player-bastion-facing.json","$e/actual-player-bastion-facing-unity.log")){if(Test-Path $p){git add -f -- "$p"}}
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): actual SHARP player-facing Source08 facade normals and banner submeshes'
            if($LASTEXITCODE){throw 'Cannot save native camera evidence'}
            git reset --hard HEAD
            if($LASTEXITCODE){throw 'Runner checkout cannot be cleaned'}
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch owner branch'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent version, evidence preserved in artifact'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Could not persist isolated proof'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-actual-SHARP-facade-normals-diagnostic
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v18/actual-player-bastion-facing.json
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v18/actual-player-bastion-facing-unity.log
          if-no-files-found: warn
