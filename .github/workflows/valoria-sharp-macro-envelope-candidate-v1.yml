name: "[VALORIA] V18 genuine sculpted Bastion into clean SHARP Unity scene | controlled V13/V18 comparison"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaEntryZoneV18Integration.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  native-sculpted-bastion:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Resolve existing installed Windows git
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue|Sort-Object Name -Descending|ForEach-Object{Join-Path $_.FullName 'resources/app/git/cmd/git.exe'}|Where-Object{Test-Path $_}|Select-Object -First 1
            if(-not $g){throw 'Git unavailable'};Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Safely recover stale rebase left by prior same-workstream attempt (isolated checkout only)
        shell: powershell
        run: |
          if((Test-Path '.git/rebase-merge') -or (Test-Path '.git/rebase-apply')){
            Write-Host 'Existing cached checkout has interrupted rebase from prior V18 same-owner workflow'
            git rebase --abort
            if($LASTEXITCODE){throw 'Cannot safely abort interrupted local rebase'}
            git reset --hard $env:GITHUB_SHA
            if($LASTEXITCODE){throw 'Cannot reset isolated runner checkout to exact triggering SHA'}
          }
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:GITHUB_SHA){throw "Runner checkout is not triggering commit HEAD=$head expected=$env:GITHUB_SHA"}
          $art='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          foreach($p in @("$art/GeneratedEntryV18","$art/Valoria_SHARP_EntryZoneV18_CANDIDATE.unity","$art/Valoria_SHARP_EntryZoneV18_CANDIDATE.unity.meta")){
            if(Test-Path $p){Remove-Item $p -Recurse -Force}
          }
          Write-Host 'RECOVERED_ONLY_ISOLATED_STALE_UNITY_V18_OUTPUTS_AND_OWN_REBASE'
      - name: Existing exclusive owner, certified source, cleaned V13 gameplay substrate
        shell: powershell
        run: |
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $b=Get-Content 'pipeline/active-workstreams.json' -Raw|ConvertFrom-Json
          foreach($r in @($a,$b)){
            if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Existing original workstream lease not held'}
            if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Other owner controls Windows runner'}
          }
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Native Unity/Blender process busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity not reachable'}
          if((Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower() -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Approved visual reference mismatch'}
          $clean='docs/evidence/valoria-layered-construction-20261016/visual-ownership-cleanup/visual-ownership-native.json'
          $c=Get-Content $clean -Raw|ConvertFrom-Json
          if(-not $c.provisional_greybox_renderer_disabled -or -not $c.provisional_greybox_collider_preserved -or $c.clean_route_passes -ne 28 -or $c.clean_interaction_hits -ne 7 -or $c.provisional_greybox_changed_outside_bastion_roi -gt 4){throw 'Visual cleanup not validated'}
          $scene='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV13_VISUAL_CLEAN_CANDIDATE.unity'
          if(-not(Test-Path $scene)){throw 'Isolated cleaned V13 scene unavailable'}
          $e='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          $source=Get-Content "$e/entry-source.json" -Raw|ConvertFrom-Json
          if($source.geometry_edits.Count -ne 3 -or $source.original_unchanged_modules.Count -ne 7 -or -not $source.all_module_envelopes_preserved -or -not $source.v13_licensed_stone_masonry_preserved -or $source.triangles -ne 374118){throw 'True edited-mesh source evidence not present'}
          if($source.result_blend_sha256 -ne '20b15b7d0c944666c6d9885e4b7366c76d826136a0c1742d6c7768db3b527aa1' -or $source.result_glb_sha256 -ne 'b380cca59614599e472072fb1babb21139f8543b124630115d6b2d0dbb88181e'){throw 'V18 changed since source art review'}
          if((Get-FileHash "$e/ValoriaEntryZoneV18.blend" -Algorithm SHA256).Hash.ToLower() -ne $source.result_blend_sha256 -or (Get-FileHash "$e/ValoriaEntryZoneV18.glb" -Algorithm SHA256).Hash.ToLower() -ne $source.result_glb_sha256){throw 'V18 GLB/Blender source not identical'}
          Write-Host 'SOURCE_V18_REAL_EDITED_BASTION_ORIGINAL_AND_CLEANED_V13_BASELINE_CERTIFIED'
      - name: Native Unity import, matched player HOME and zoom and independent physical target tests
        shell: powershell
        run: |
          $ev='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-entry-v18-native-unity.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaEntryZoneV18Integration.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){& taskkill.exe /PID $p.Id /T /F|Out-Null;throw 'Unity native V18 timeout'}
          Get-Content $log -Tail 90
          Copy-Item $log "$ev/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_ENTRY_ZONE_V18_NATIVE_COMPLETE' -Quiet)){throw "Native Unity V18 failed exit=$($p.ExitCode)"}
          $m=Get-Content "$ev/entry-native.json" -Raw|ConvertFrom-Json
          if($m.source_triangles -ne 374118 -or $m.canonical_modified -or $m.original_sources_modified -or $m.route_probes -ne 28 -or $m.route_passes -ne 28 -or $m.source_target_matches -ne 7 -or $m.physical_stairs -ne 12 -or -not $m.gate_macro_proportions_pass -or -not $m.pedestrian_clear){throw 'V18 generated art breaks protected circulation or original game source'}
          if([math]::Abs($m.home_fov-44.4228096) -gt .0001){throw 'Player SHARP camera was moved'}
          foreach($name in @('entry-BEFORE-home.png','entry-AFTER-home.png','entry-AFTER-zoom-in.png','entry-AFTER-portrait.png','entry-BEFORE-home.jpg','entry-AFTER-home.jpg')){
            if(-not(Test-Path "$ev/$name") -or (Get-Item "$ev/$name").Length -lt 15000){throw "Missing native direct Unity image $name"}
          }
          Write-Host 'V18_NATIVE_UNITY_TECH_PASS_NOT_VISUAL_ART_APPROVAL'
      - name: Preserve original source identity and ONLY isolated V18 scene/evidence
        if: always()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $e='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          $base='Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction'
          if(Test-Path $e){git add -f -- "$e/"}
          foreach($p in @("$base/Valoria_SHARP_EntryZoneV18_CANDIDATE.unity","$base/Valoria_SHARP_EntryZoneV18_CANDIDATE.unity.meta","$base/GeneratedEntryV18.meta","$base/Editor/ValoriaEntryZoneV18Integration.cs.meta")){
            if(Test-Path $p){git add -f -- "$p"}
          }
          if(Test-Path "$base/GeneratedEntryV18"){git add -f -- "$base/GeneratedEntryV18/"}
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): native Unity V18 authentic same-camera art candidate and 28/7 regression'
            if($LASTEXITCODE){throw 'Cannot commit V18 authentic evidence'}
            git reset --hard HEAD
            if($LASTEXITCODE){throw 'Uncommitted Unity checkout changes'}
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch exclusive owner branch'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent exclusive branch conflict; no force'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot persist art candidate to exclusive branch'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-v18-actual-sculpted-Bastion-native-Unity-player-camera
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v18/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV18_CANDIDATE.unity
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedEntryV18/**
          if-no-files-found: warn
