name: "[VALORIA] Real Blender V18 Bastion mesh sculpture | source stage, no Unity promotion"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'tools/valoria-layered-construction/sculpt-original-bastion-v18.blender.py'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  native-sculpt:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 55
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Recover installed GitHub Desktop Git
        shell: powershell
        working-directory: .
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $git=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd/git.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $git){throw 'Git missing'}
            Add-Content $env:GITHUB_PATH (Split-Path $git)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Single workstream, clean V13 technical baseline and immutable Source08
        shell: powershell
        run: |
          $a=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $b=Get-Content 'pipeline/active-workstreams.json' -Raw|ConvertFrom-Json
          foreach($r in @($a,$b)){
            if(@($r.active|Where-Object {$_.id -eq 'valoria-master-plan-layered-construction-20261016' -and $_.owner -eq 'chatgpt-normal-valoria-construction-20261017' -and $_.resources -contains 'windows-runner-heavy'}).Count -ne 1){throw 'Exclusive original owner not verified'}
            if(@($r.active|Where-Object {$_.id -ne 'valoria-master-plan-layered-construction-20261016' -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Other heavy workstream active'}
          }
          if(@(Get-Process blender,Unity -ErrorAction SilentlyContinue).Count){throw 'Existing artist rendering process busy'}
          $source='docs/evidence/valoria-layered-construction-20261016/entry-zone-v13/ValoriaEntryZoneV13.blend'
          if((Get-FileHash $source -Algorithm SHA256).Hash.ToLower() -ne '1023443ef9eb3137a5157188b16194ff6245b08003f4c388377610d15811a1cf'){throw 'Frozen V13 source identity mismatch'}
          $donor='art-source/valoria/production/bastion-family-v1/BastionFamilyV1.blend'
          if((Get-FileHash $donor -Algorithm SHA256).Hash.ToLower() -ne '5c7b7e0918ac2e7dc78984515991c3f3546dffc3927bd0fa23bcaf4e9b148893'){throw 'Protected original family changed'}
          $clean=Get-Content 'docs/evidence/valoria-layered-construction-20261016/visual-ownership-cleanup/visual-ownership-native.json' -Raw|ConvertFrom-Json
          if(-not $clean.provisional_greybox_renderer_disabled -or -not $clean.provisional_greybox_collider_preserved -or $clean.provisional_greybox_changed_outside_bastion_roi -gt 4 -or $clean.clean_route_passes -ne 28 -or $clean.clean_interaction_hits -ne 7){throw 'Cleaned isolated V13 preflight failed'}
          if(-not(Test-Path 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV13_VISUAL_CLEAN_CANDIDATE.unity')){throw 'Clean candidate scene unavailable'}
          Write-Host 'CLEARED_EXISTING_V13_ART_SOURCE_AND_CLEANED_NATIVE_GAMEPLAY_COPY'
      - name: Apply physical arched opening booleans on existing BastionKeep, recover blue heraldry only and render true source
        shell: powershell
        run: |
          $blender=(Get-Command blender.exe -ErrorAction SilentlyContinue).Source
          if(-not $blender){
            foreach($base in @('C:\Program Files\Blender Foundation',"$env:LOCALAPPDATA\Programs\Blender Foundation")){
              if(Test-Path $base){$blender=Get-ChildItem $base -Recurse -Filter blender.exe -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName}
              if($blender){break}
            }
          }
          if(-not $blender){throw 'Installed Blender unavailable'}
          $ev='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          New-Item -ItemType Directory -Force $ev|Out-Null
          & $blender --version | Out-File "$ev/blender-version.txt" -Encoding utf8
          & $blender -b -t 4 --python-exit-code 1 --python tools/valoria-layered-construction/sculpt-original-bastion-v18.blender.py
          if($LASTEXITCODE){throw 'Native genuine mesh editing failed'}
          $m=Get-Content "$ev/entry-source.json" -Raw|ConvertFrom-Json
          if($m.geometry_edits.Count -ne 3 -or $m.original_unchanged_modules.Count -ne 7 -or -not $m.all_module_envelopes_preserved -or -not $m.v13_licensed_stone_masonry_preserved -or $m.triangles -eq 374064 -or $m.triangles -gt 410000 -or $m.result_glb_sha256 -ne (Get-FileHash "$ev/ValoriaEntryZoneV18.glb" -Algorithm SHA256).Hash.ToLower() -or $m.result_blend_sha256 -ne (Get-FileHash "$ev/ValoriaEntryZoneV18.blend" -Algorithm SHA256).Hash.ToLower()){throw 'Real architectural source gates not met'}
          foreach($name in @('SOURCE-front-original-V13-masonry-plus-edited-V18-keep.png','SOURCE-keep-architectural-closeup-V18.png')){
            if(-not(Test-Path "$ev/$name") -or (Get-Item "$ev/$name").Length -lt 15000){throw "Genuine Blender render not produced: $name"}
          }
          Write-Host "BLENDER_REAL_MESH_EDIT_TECH_PASS_NOT_SOURCE_ART_APPROVAL: arcs=$($m.geometry_edits.Count) new tris=$($m.triangles)"
      - name: Commit ONLY isolated edit sources and art review inputs; source itself not promoted
        if: always()
        shell: powershell
        run: |
          git config user.name 'Valoria native builder'
          git config user.email 'valoria-builder@users.noreply.github.com'
          $ev='docs/evidence/valoria-layered-construction-20261016/entry-zone-v18'
          if(Test-Path $ev){git add -f -- "$ev/"}
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): authentic Blender architectural keep sculpt and source previews V18'
            if($LASTEXITCODE){throw 'Cannot commit Blender original source evidence'}
            git reset --hard HEAD
            if($LASTEXITCODE){throw 'Cannot clean source runner checkout'}
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot inspect current exclusive branch'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Refuse concurrent rebase conflict'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Refuse concurrent source push; artifact preserved'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-bastion-v18-true-editable-source-and-studio-previews
          path: valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/entry-zone-v18/**
          if-no-files-found: warn
