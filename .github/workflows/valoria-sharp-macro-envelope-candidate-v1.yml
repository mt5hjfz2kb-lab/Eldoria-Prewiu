name: "[VALORIA] Integrate existing gameplay in isolated Valoria entry and verify existing I-II UI, gate return and isolated reset"
on:
  push:
    branches: [construction/valoria-master-plan-layers-20261016]
    paths:
      - '.github/workflows/valoria-sharp-macro-envelope-candidate-v1.yml'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Editor/ValoriaEntryPlayableV2.cs'
      - 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/ValoriaEntryExperimentalRuntimeV2.cs'
permissions:
  contents: write
  actions: read
concurrency:
  group: valoria-macro-envelope-one-native-run
  cancel-in-progress: false
jobs:
  actual-sharp-native:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    defaults:
      run:
        working-directory: valoria-macro-envelope-v1
    steps:
      - name: Resolve existing GitHub Desktop git
        working-directory: .
        shell: powershell
        run: |
          if(-not(Get-Command git.exe -ErrorAction SilentlyContinue)){
            $g=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter "app-*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName "resources/app/git/cmd/git.exe"} | Where-Object {Test-Path $_} | Select-Object -First 1
            if(-not $g){throw 'Git is unavailable'}
            Add-Content $env:GITHUB_PATH (Split-Path $g)
          }
      - uses: actions/checkout@v4
        with:
          path: valoria-macro-envelope-v1
          clean: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: valoria-macro-envelope-main
          sparse-checkout: pipeline/active-workstreams.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check exclusive workstream, free Unity editor and owner-approved reference
        shell: powershell
        run: |
          $r=Get-Content "$env:GITHUB_WORKSPACE/valoria-macro-envelope-main/pipeline/active-workstreams.json" -Raw|ConvertFrom-Json
          $owner='valoria-master-plan-layered-construction-20261016'
          if(@($r.active|Where-Object {$_.id -eq $owner}).Count -ne 1){throw 'Lease missing'}
          if(@($r.active|Where-Object {$_.id -ne $owner -and $_.resources -contains 'windows-runner-heavy'}).Count){throw 'Runner claimed by incompatible owner'}
          if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){throw 'Unity/Blender busy'}
          if(-not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Unity editor unavailable'}
          $h=(Get-FileHash references/VALORIA_APPROVED_VISUAL_REFERENCE.jpg -Algorithm SHA256).Hash.ToLower()
          if($h -ne '8ae6fb0e6949dd4f7d37b38767282e5f1fb6089e117a29f362945c1edfa66689'){throw 'Art reference mismatch'}
          if(-not(Test-Path 'Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_EntryZoneV7_CANDIDATE.unity')){throw '7-contact source scene missing'}
      - name: Import actual Blender entry zone and capture comparable player-camera A/B
        shell: powershell
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/playable-entry-v2'
          New-Item -ItemType Directory -Force -Path $dir|Out-Null
          $log=Join-Path $env:RUNNER_TEMP 'valoria-spatial-v1.log'
          $args=@('-batchmode','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaEntryPlayableV2.Build','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(2400000)){
            & taskkill.exe /PID $p.Id /T /F|Out-Null
            throw 'Macro screen-space validation timeout'
          }
          Get-Content $log -Tail 90
          Copy-Item $log "$dir/native-unity.log"
          if($p.ExitCode -ne 0 -or -not(Select-String $log -Pattern 'VALORIA_ENTRY_PLAYABLE_SCENE_COMPLETE' -Quiet)){
            throw "Native 3D SHARP macro diagnostic failed exit=$($p.ExitCode)"
          }
      - name: Play actual scene with existing UI, LocalGateway, I-II rules and temporary save
        shell: powershell
        env:
          VALORIA_ENTRY_PROBE: '1'
        run: |
          $dir='docs/evidence/valoria-layered-construction-20261016/playable-entry-v2'
          $log=Join-Path $env:RUNNER_TEMP 'valoria-entry-gameplay.log'
          $args=@('-batchmode','-force-d3d11','-screen-width','1536','-screen-height','1024','-projectPath',"$env:GITHUB_WORKSPACE/valoria-macro-envelope-v1/Unity",'-executeMethod','Eldoria.ValoriaLayered.Editor.ValoriaEntryPlayableV2.PlayProbe','-logFile',$log)
          $p=Start-Process $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(900000)){& taskkill.exe /PID $p.Id /T /F|Out-Null;throw 'Playmode timeout'}
          Get-Content $log -Tail 100
          Copy-Item $log "$dir/playmode-unity.log"
          if($p.ExitCode -ne 0){throw 'Existing-system gameplay probe failed'}
          $x=Get-Content "$dir/gameplay-playmode.json" -Raw|ConvertFrom-Json
          if($x.status -eq 'FAIL' -or -not $x.persistence -or -not $x.ui_build_sawmill -or -not $x.ui_build_barracks -or -not $x.bastion_i_ii -or -not $x.recruit_ui -or -not $x.march_ui -or -not $x.chapter_ii_complete -or -not $x.world_navigation -or -not $x.return_to_entry -or -not $x.isolated_reset -or $x.canonical_save_touched){throw 'Progression and isolated persistence gate failed'}
      - name: Save only isolated results, no forced push or superseding original scenes
        shell: powershell
        run: |
          git config user.name 'Valoria native macro'
          git config user.email 'valoria-macro@users.noreply.github.com'
          git add -f -- docs/evidence/valoria-layered-construction-20261016/playable-entry-v2/
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_Entry_PlayableV2.unity
          git add -f -- Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedPlayableEntryV2/
          foreach($meta in @('Editor/ValoriaEntryPlayableV2.cs.meta','ValoriaEntryExperimentalRuntimeV2.cs.meta','GeneratedPlayableEntryV2.meta','Valoria_SHARP_Entry_PlayableV2.unity.meta')){
            $mp="Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/$meta"
            if(Test-Path $mp){git add -f -- $mp}
          }
          if(-not(git diff --cached --quiet)){
            git commit -m 'evidence(valoria): isolated playable scene and real UI I-II progression evidence'
            git reset --hard HEAD
            git fetch --no-tags origin construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Cannot fetch latest owner HEAD'}
            git rebase origin/construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent branch conflict; preserve artifact, never force'}
            git push origin HEAD:construction/valoria-master-plan-layers-20261016
            if($LASTEXITCODE){throw 'Concurrent push, preserve artifact, never force'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-playable-entry-v2-${{ github.run_id }}
          path: |
            valoria-macro-envelope-v1/docs/evidence/valoria-layered-construction-20261016/playable-entry-v2/**
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/Valoria_SHARP_Entry_PlayableV2.unity
            valoria-macro-envelope-v1/Unity/Assets/Eldoria/ArtTests/ValoriaLayeredConstruction/GeneratedPlayableEntryV2/**
          if-no-files-found: warn
