name: Valoria Modular 2.5D — reproducible art bake and sandbox import

on:
  push:
    branches:
      - experiment/valoria-modular-25d-bastion1-from-zero-20261118
    paths:
      - 'tools/valoria-modular25d/blender/bake_valoria.py'
      - 'tools/valoria-modular25d/blender/postprocess_sprites.py'
      - '.github/workflows/valoria-modular25d-bpy-bake.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valoria-modular25d-bpy-bake
  cancel-in-progress: false

jobs:
  original-bake:
    if: github.ref == 'refs/heads/experiment/valoria-modular-25d-bastion1-from-zero-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            tools/valoria-modular25d
            Unity/Assets/Experimentos/ValoriaModular25D
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender Python module and image crop (no credits or paid APIs)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: bpy==5.0.1 Pillow==11.3.0
          python -c 'import bpy; print("Bpy",bpy.app.version_string)'
      - name: Render modular asset family from reproducible original source
        run: |
          python -m py_compile tools/valoria-modular25d/blender/bake_valoria.py tools/valoria-modular25d/blender/postprocess_sprites.py
          mkdir -p "$RUNNER_TEMP/eldoria-art-candidates"
          python tools/valoria-modular25d/blender/bake_valoria.py -- "$RUNNER_TEMP/eldoria-art-candidates"
          python tools/valoria-modular25d/blender/postprocess_sprites.py "$RUNNER_TEMP/eldoria-art-candidates"
      - name: Verify independent RGBA sprites, transparent background, unique stable pivots
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          d=Path("Unity/Assets/Experimentos/ValoriaModular25D/Resources/ValoriaModular25D")
          obj=json.loads((d/"sprite_manifest.json").read_text())
          assert len(obj["sprites"])==13, f"Expected all 13 isolated sprites, got {len(obj['sprites'])}"
          names={x["name"] for x in obj["sprites"]}
          for expected in ["bastion_i","sawmill_i","sawmill_available","sawmill_under_construction","pine_0","pine_1","pine_2","villager_walk_0","villager_walk_1","bush_0","bush_1","bush_2","stone"]:
              assert expected in names, expected
          for item in obj["sprites"]:
              p=d/(item["name"]+".png")
              assert p.exists() and Path(str(p)+".meta").exists()
              im=Image.open(p)
              assert im.mode=="RGBA",p
              alpha=im.getchannel("A")
              assert alpha.getextrema()[0]==0 and alpha.getextrema()[1]>200, p
              assert all(0<=v<=1 for v in item["foot_pivot"]),p
              print("SPRITE_CANDIDATE",item["name"],im.size,item["foot_pivot"])
          print("ALL_13_ART_RESOURCE_INTEGRITY_PASS — not Unity playtest or art approval")
          PY
      - name: Preserve source-sprites and contact sheet for human review
        uses: actions/upload-artifact@v4
        with:
          name: valoria-modular25d-bpy-baked-candidates
          path: |
            Unity/Assets/Experimentos/ValoriaModular25D/Resources/
            tools/valoria-modular25d/blender/QA/
          if-no-files-found: error
          retention-days: 28
      - name: Version original sprite resources on the isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          test "$current" = "$GITHUB_SHA"
          test "$(git symbolic-ref --short HEAD)" = "experiment/valoria-modular-25d-bastion1-from-zero-20261118"
          git config user.name "eldoria-art-ci"
          git config user.email "eldoria-art-ci@users.noreply.github.com"
          git add Unity/Assets/Experimentos/ValoriaModular25D/Resources.meta \
                  Unity/Assets/Experimentos/ValoriaModular25D/Resources/
          if git diff --cached --quiet; then
            echo "Exact baked resources unchanged"
          else
            git commit -m "art(modular25d): import 13 original Blender-baked RGBA game sprites [NOT APPROVED]"
            git push origin HEAD:refs/heads/experiment/valoria-modular-25d-bastion1-from-zero-20261118
          fi
          echo "Baked art is an unapproved candidate. Source images are NOT Unity gameplay screenshots."
