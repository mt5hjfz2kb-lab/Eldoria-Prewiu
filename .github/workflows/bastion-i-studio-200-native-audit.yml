name: Bastion I issue200 - independent audit of genuine Unity proof
on:
  push:
    branches: [research/bastion-i-25d-studio-200]
    paths: ['.github/workflows/bastion-i-studio-200-native-audit.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: issue200-native-audit-one-shot
  cancel-in-progress: false
jobs:
  audit:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Authorize one native issue200 audit only after genuine proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for existing native evidence, no API calls or PC use while waiting
        run: |
          set -euo pipefail
          for i in $(seq 1 170); do
            jobs="$(gh api "repos/$REPO/actions/runs/46032921829/jobs?per_page=100")"
            if [ "$(jq -r '.jobs[]|select(.name=="native-proof")|.conclusion // ""' <<<"$jobs")" = success ] &&
               [ "$(jq -r '.jobs[]|select(.name=="evidence")|.conclusion // ""' <<<"$jobs")" = success ]; then
              echo REAL_NATIVE_EVIDENCE_READY
              exit 0
            fi
            if [ "$(gh api "repos/$REPO/actions/runs/46032921829" --jq .status)" = completed ]; then
              echo 'Native proof not completed successfully; no audit spend.'
              exit 1
            fi
            sleep 30
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: issue200-native-comparison-delivery
          run-id: 46032921829
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@v4
        with:
          name: issue200-artist-delivery
          run-id: 46028941144
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/concepts
      - uses: actions/download-artifact@v4
        with:
          name: issue200-reference-refined-assets
          run-id: 46032398265
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/refined
      - name: Load immutable studio and audit script
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio"
          cd "$RUNNER_TEMP/studio"
          for f in studio.py economics.py rates-20261125.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/openai-development-studio/$f?ref=9fbdb203269b951a252de58d7a0357d71a841480" > "$f"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/audit-native-proof.py?ref=3a62d21394ec62536c4150e4b27527fc70f3e7db" > audit.py
          python3 -m pip install --quiet pillow
          python3 -m py_compile audit.py
      - name: Independent visual audit on native matched frames
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          python3 -u audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-native-independent-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: warn
          retention-days: 14
