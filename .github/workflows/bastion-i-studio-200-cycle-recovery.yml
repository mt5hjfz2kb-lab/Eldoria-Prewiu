name: Issue200 Studio I-V recover exact sources and native A/B
on:
  push:
    branches: [research/bastion-i-25d-studio-200]
    paths: ['.github/workflows/bastion-i-studio-200-cycle-recovery.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: issue200-cycle-recovery
  cancel-in-progress: false
env:
  REPO: ${{ github.repository }}
  BASE_SHA: f27f4774e32efc5ad046478a07747eead4256c3e
jobs:
  produce:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Recover Issue200 I-V exact source without new production spend'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify previous failed transport and immutable paid work
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/46075215962" --jq .conclusion)" = failure
          test "$(gh api "repos/$REPO/actions/artifacts/15233439725" --jq .digest)" = sha256:2f6a8b0280656cb86d10def972995e8a375b9e9c71c2ce3876dafc59521c0c74
          test "$(gh api "repos/$REPO/git/ref/heads/experiment/valoria-ciudad-region-unificada-20261121" --jq .object.sha)" = "$BASE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: issue200-cycle-production-source
          run-id: 46075215962
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cycle-production
      - name: Export exact replacement file bytes from canonical Git index
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cycle-source"
          git init -q "$root"
          git -C "$root" remote add origin "https://github.com/$REPO.git"
          git -C "$root" config core.autocrlf false
          prefix=/Unity/Assets/Experimentos/ValoriaModular25D
          git -C "$root" sparse-checkout set --no-cone "$prefix/Resources/ValoriaModular25D/DistrictGround.shader" "$prefix/Resources/ValoriaModular25D/UrbanRoad.shader" "$prefix/Resources/ValoriaModular25D/ArchitecturalShadow.shader" "$prefix/Scripts/Modular25DGround.cs" "$prefix/Scripts/Modular25DWorld.cs"
          git -C "$root" fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"
          git -C "$root" checkout -q --detach "$BASE_SHA"
          cd "$RUNNER_TEMP/cycle-production"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"cycle-source"
          base=os.environ["BASE_SHA"]
          patch=Path("cycle-production.patch")
          assert hashlib.sha256(patch.read_bytes()).hexdigest()==Path("patch.sha256").read_text().split()[0]
          def git(*args):
              return subprocess.check_output(["git","-C",str(root),*args])
          assert git("rev-parse","HEAD").decode().strip()==base
          git("apply","--cached","--check",str(patch.resolve()))
          git("apply","--cached",str(patch.resolve()))
          files=git("diff","--cached","--name-only").decode().splitlines()
          prefix="Unity/Assets/Experimentos/ValoriaModular25D/"
          expected={prefix+"Resources/ValoriaModular25D/"+n+".shader" for n in ("DistrictGround","UrbanRoad","ArchitecturalShadow")}|{prefix+"Scripts/"+n+".cs" for n in ("Modular25DGround","Modular25DWorld")}
          assert set(files)==expected
          rows=[]
          for i,name in enumerate(sorted(files)):
              before=git("rev-parse","HEAD:"+name).decode().strip()
              after=git("rev-parse",":"+name).decode().strip()
              content=git("cat-file","blob",after)
              assert hashlib.sha1(b"blob "+str(len(content)).encode()+b"\\0"+content).hexdigest()==after
              dest="replacement-"+str(i)+".bin"
              Path(dest).write_bytes(content)
              rows.append(dict(path=name,file=dest,old_blob=before,new_blob=after,sha256=hashlib.sha256(content).hexdigest()))
          Path("exact-source-manifest.json").write_text(json.dumps(dict(base=base,patch_sha256=hashlib.sha256(patch.read_bytes()).hexdigest(),files=rows),indent=2))
          print("EXACT_SOURCE_REPLACEMENTS",len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue200-cycle-production-source
          path: ${{ runner.temp }}/cycle-production
          if-no-files-found: error
          retention-days: 30
  reserve:
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Narrow resource-only reservation under the existing Studio holder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/coordinate-cycle-recovery.py?ref=dc17c0767b385237197678005aaa5fdc461a0c76" > "$RUNNER_TEMP/coordinate.py"
          python3 "$RUNNER_TEMP/coordinate.py" reserve
  native-proof:
    needs: reserve
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 70
    concurrency:
      group: eldoria-modular25d-exclusive-unity-native
      cancel-in-progress: false
    steps:
      - name: Check live resource ownership, installed Unity and actual idle processes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'}
          $api="https://api.github.com/repos/$env:REPO/"
          $m=Invoke-RestMethod -Headers $h -Uri ($api+'contents/pipeline/active-workstreams.json?ref=main')
          $b=Invoke-RestMethod -Headers $h -Uri ($api+'git/blobs/'+$m.sha)
          if($b.sha -ne $m.sha){throw 'Registry mismatch'}
          $reg=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($b.content -replace '\s',''))) | ConvertFrom-Json
          $held=@($reg.active|Where-Object{@($_.resources) -contains 'windows-runner-heavy'})
          if($held.Count -ne 1 -or $held[0].id -ne 'eldoria-valoria-modular25d-bastion1-20261119' -or $held[0].owner -ne 'chatgpt-corona-brecha-commercial-20261126' -or $held[0].ownership_revision -ne 27 -or $held[0].issue200_cycle_recovery.run_id -ne [long]$env:GITHUB_RUN_ID -or $reg.resource_rotation.current_run_id -ne [long]$env:GITHUB_RUN_ID -or $reg.resource_rotation.status -ne 'issue200_cycle_recovery'){throw 'Native reservation not ours'}
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){throw 'Existing native process; no interruption allowed'}
          if(-not $env:UNITY_EDITOR_PATH -or -not(Test-Path $env:UNITY_EDITOR_PATH)){throw 'Installed Unity missing'}
          if((Get-Item $env:RUNNER_TEMP).PSDrive.Free -lt 12GB){throw 'Insufficient scratch disk; no other cache cleanup'}
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $dir=Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop" -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {Join-Path $_.FullName 'resources/app/git/cmd'} | Where-Object {Test-Path (Join-Path $_ 'git.exe')} | Select-Object -First 1
            if(-not $dir){throw 'Installed Git missing'}
            $env:PATH="$dir;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          Write-Host 'ISSUE200_EXCLUSIVE_PC_IDLE_PASS'
      - uses: actions/download-artifact@v4
        with:
          name: issue200-cycle-production-source
          path: ${{ runner.temp }}/issue200-cycle-source-${{ github.run_id }}
      - name: Materialize exact game sources only in unique scratch project
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ("issue200-native-"+$env:GITHUB_RUN_ID)
          if(Test-Path $root){throw 'Scratch already exists'}
          git init -q $root
          git -C $root remote add origin "https://github.com/$env:REPO.git"
          $paths=@('/Unity/Assets/Experimentos/ValoriaModular25D/','/Unity/Assets/Experimentos/ValoriaModular25D.meta','/Unity/Assets/Experimentos.meta','/Unity/Assets/Eldoria/','/Unity/Assets/Eldoria.meta','/Unity/Assets/EmaceArt/Slavic World Free/Meshes/','/Unity/Assets/EmaceArt/Slavic World Free/Materials/','/Unity/Assets/EmaceArt/Slavic World Free/Texture/','/Unity/Assets/EmaceArt/Slavic World Free/URP_Support/','/Unity/Assets/EmaceArt/Slavic World Free/Prefabs/Village/Building/Shed/','/Unity/Assets/Holotna/','/Unity/Assets/Holotna.meta','/Unity/Assets/StreamingAssets/','/Unity/Assets/StreamingAssets.meta','/Unity/Assets/Plugins/','/Unity/Assets/Plugins.meta','/Unity/Assets/DefaultVolumeProfile.asset','/Unity/Assets/UniversalRenderPipelineGlobalSettings.asset','/Unity/Packages/','/Unity/ProjectSettings/')
          git -C $root sparse-checkout set --no-cone @paths
          if($LASTEXITCODE){throw 'Sparse checkout setup failed'}
          git -C $root config http.version HTTP/1.1
          git -C $root config core.autocrlf false
          git -C $root fetch --no-tags --depth=1 --filter=blob:none origin $env:BASE_SHA
          if($LASTEXITCODE){throw 'Source fetch failed'}
          $ok=$false
          for($i=1;$i -le 3;$i++){git -C $root checkout -q --detach $env:BASE_SHA; if($LASTEXITCODE -eq 0){$ok=$true;break}; Start-Sleep -Seconds (4*$i)}
          if(-not $ok -or (git -C $root rev-parse HEAD).Trim() -ne $env:BASE_SHA){throw 'Exact source checkout failed'}
          $project=Join-Path $root 'Unity'
          $inputDir=Join-Path $env:RUNNER_TEMP ("issue200-cycle-source-"+$env:GITHUB_RUN_ID)
          $patch=Join-Path $inputDir 'cycle-production.patch'
          $expected=(Get-Content (Join-Path $inputDir 'patch.sha256') -Raw).Split(' ')[0]
          if((Get-FileHash -Algorithm SHA256 $patch).Hash.ToLowerInvariant() -ne $expected){throw 'Patch hash mismatch'}
          $manifest=Get-Content (Join-Path $inputDir 'exact-source-manifest.json') -Raw | ConvertFrom-Json
          if($manifest.base -ne $env:BASE_SHA -or $manifest.patch_sha256 -ne $expected -or @($manifest.files).Count -ne 5){throw 'Exact-source manifest invalid'}
          $allowed=@('Resources/ValoriaModular25D/ArchitecturalShadow.shader','Resources/ValoriaModular25D/DistrictGround.shader','Resources/ValoriaModular25D/UrbanRoad.shader','Scripts/Modular25DGround.cs','Scripts/Modular25DWorld.cs') | ForEach-Object {'Unity/Assets/Experimentos/ValoriaModular25D/'+$_}
          foreach($f in $manifest.files){
            if($f.path -notin $allowed){throw 'Unexpected replacement path'}
            if((git -C $root rev-parse ("HEAD:"+$f.path)).Trim() -ne $f.old_blob){throw 'Base blob mismatch'}
            $src=Join-Path $inputDir $f.file
            if((Get-FileHash -Algorithm SHA256 $src).Hash.ToLowerInvariant() -ne $f.sha256){throw 'Replacement byte mismatch'}
            $dst=Join-Path $root $f.path
            [IO.File]::WriteAllBytes($dst,[IO.File]::ReadAllBytes($src))
            if((git -C $root hash-object --no-filters $dst).Trim() -ne $f.new_blob){throw 'Candidate Git blob mismatch'}
          }
          $changed=@(git -C $root diff --name-only)
          if($changed.Count -ne 5 -or @($changed | Where-Object {$_ -notin $allowed}).Count -ne 0){throw 'Unexpected scope'}
          Write-Host 'EXACT_CANONICAL_SOURCE_BYTES_VERIFIED'
          $target=Join-Path $project 'Assets/Experimentos/ValoriaModular25D/Editor/Issue200CycleProductionProof.cs'
          if(Test-Path $target){throw 'Scratch editor path already present'}
          Copy-Item (Join-Path $inputDir 'Issue200CycleProductionProof.cs') $target
          "ISSUE200_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE200_PROOF_OUT=$(Join-Path $env:RUNNER_TEMP ('issue200-proof-'+$env:GITHUB_RUN_ID))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE200_PROOF_ASSETS=$inputDir"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ISSUE200_BASE_SHA=$env:BASE_SHA"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Render matched real Unity baseline and candidate with moving actors and camera
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process Unity,blender,UnityShaderCompiler,UnityPackageManager -ErrorAction SilentlyContinue).Count){throw 'Native process appeared; no interruption'}
          New-Item -ItemType Directory -Force $env:ISSUE200_PROOF_OUT|Out-Null
          Copy-Item (Join-Path $env:ISSUE200_PROOF_ASSETS 'parameters.json') $env:ISSUE200_PROOF_OUT
          Copy-Item (Join-Path $env:ISSUE200_PROOF_ASSETS 'cycle-production.patch') $env:ISSUE200_PROOF_OUT
          Copy-Item (Join-Path $env:ISSUE200_PROOF_ASSETS 'exact-source-manifest.json') $env:ISSUE200_PROOF_OUT
          $log=Join-Path $env:ISSUE200_PROOF_OUT 'unity.log'
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',$env:ISSUE200_PROJECT,'-executeMethod','Eldoria.Experimentos.ValoriaModular25D.Editor.Issue200CycleProductionProof.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          if(-not $p.WaitForExit(3000000)){Stop-Process -Id $p.Id -Force;throw 'Own Unity scratch capture timed out'}
          if($p.ExitCode){Get-Content $log -Tail 120;throw ('Unity capture failed '+$p.ExitCode)}
          foreach($v in @('baseline','candidate')){
            $manifest=Join-Path $env:ISSUE200_PROOF_OUT "$v/evidence.json"
            if(-not(Test-Path $manifest)){throw 'Missing genuine capture manifest'}
            $e=Get-Content $manifest -Raw|ConvertFrom-Json
            if($e.engine -ne 'Unity' -or $e.engineVersion -ne '6000.3.23f1' -or $e.sourceSha -ne $env:BASE_SHA -or $e.sourceFrames -lt 100 -or $e.progressionStagesCaptured -ne 5 -or -not $e.gatewayBuild -or -not $e.savedAndReloaded){throw 'Native proof incomplete'}
            foreach($f in $e.frames){
              $p=Join-Path $env:ISSUE200_PROOF_OUT "$v/$($f.file)"
              if(-not(Test-Path $p) -or (Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() -ne $f.sha256){throw 'Native frame hash mismatch'}
            }
          }
          Write-Host 'ISSUE200_REAL_MATCHED_CAMERA_RENDER_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-cycle-native
          path: ${{ runner.temp }}/issue200-proof-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
  return-resource:
    needs: [reserve,native-proof]
    if: always() && needs.reserve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Return only own completed temporary native resource to canonical Bastion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/coordinate-cycle-recovery.py?ref=dc17c0767b385237197678005aaa5fdc461a0c76" > "$RUNNER_TEMP/coordinate.py"
          python3 "$RUNNER_TEMP/coordinate.py" return
  evidence:
    needs: native-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: issue200-cycle-native
          path: ${{ runner.temp }}/native
      - uses: actions/download-artifact@v4
        with:
          name: issue200-cycle-production-source
          path: ${{ runner.temp }}/production
      - name: Verify native frames and prepare matched comparisons
        env:
          ISSUE200_AUDIT_MODE: prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio"
          cd "$RUNNER_TEMP/studio"
          for f in studio.py economics.py rates-20261125.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/openai-development-studio/$f?ref=9fbdb203269b951a252de58d7a0357d71a841480" > "$f"
          done
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/tools/bastion-i-studio-200/evaluate-cycle-production.py?ref=81e750b917119320ce63eab0732bed7b71b66dee" > evaluate.py
          python3 -m pip install --quiet pillow imageio-ffmpeg
          python3 -u evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: issue200-cycle-native-comparisons
          path: ${{ runner.temp }}/cycle-delivery
          retention-days: 30
      - name: Five independent blind evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/studio"
          python3 -u evaluate.py
      - name: Actual postigo passage video
        if: always()
        run: |
          set -euo pipefail
          ffmpeg_bin=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$ffmpeg_bin" -loglevel error -framerate 12 -i "$RUNNER_TEMP/native/baseline/postigo-motion-%03d.png" -framerate 12 -i "$RUNNER_TEMP/native/candidate/postigo-motion-%03d.png" -filter_complex hstack=inputs=2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/cycle-delivery/postigo-comparison.mp4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-cycle-final-audit
          path: ${{ runner.temp }}/cycle-delivery
          if-no-files-found: warn
          retention-days: 30
