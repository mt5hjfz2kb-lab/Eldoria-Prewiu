name: "[TEMP] Cancel stale Valoria formula gate"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-reference-convergence-cancel-stale.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded convergence-triggered formula run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/37000228189/force-cancel || true
          echo "force-cancel requested for superseded convergence v2 run 37000228189"
