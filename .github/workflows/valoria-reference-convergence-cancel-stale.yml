name: "[TEMP] Cancel stale Unity slice for convergence v2"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/valoria-reference-convergence-cancel-stale.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Unity slice from superseded convergence commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/37008528578/force-cancel || true
          echo "force-cancel requested for stale Unity slice 37008528578"
