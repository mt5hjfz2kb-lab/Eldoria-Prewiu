name: Ciudad2D — sombra de contacto separada Forja V3
on:
  push:
    branches: [art/ciudad-2d-hitos-1-5-20261116]
    paths: ['tools/ciudad2d-ai/shadow_v3_request.json']
permissions:
  contents: write
concurrency:
  group: ciudad2d-shadow-v3-ubuntu-only
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ciudad2d-ai/
            /Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/
            /Unity/Assets/Experimentos/Ciudad2D/Sprites/Cuartel.png.meta
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Independently author reversible foot-contact shadow from frozen V3 alpha
        run: python tools/ciudad2d-ai/make_forja_v3_shadow.py
      - name: Evidence only, not Unity proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciudad2d-forja-v3-shadow-${{ github.run_id }}
          path: |
            Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/shadow_preview_OFFLINE_NOT_UNITY.jpg
            Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/shadow_manifest.json
            Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/Forja_Guardia_ContactShadow_v3.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish independent candidate layer, remove one-shot request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --quiet -- tools/ciudad2d-ai/shadow_v3_request.json
          git add --sparse -- Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/shadow_preview_OFFLINE_NOT_UNITY.jpg Unity/Assets/Experimentos/Ciudad2D/ArtBible/Pilots/forja_guardia/v3/shadow_manifest.json Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/Forja_Guardia_ContactShadow_v3.png Unity/Assets/Experimentos/Ciudad2D/Sprites/AIPilot/Versions/Forja_Guardia_ContactShadow_v3.png.meta
          git diff --cached --quiet && { echo 'Expected shadow layer not generated'; exit 1; }
          git commit -m 'art(city2d): keep independent V3 ground shadow with source-derived mask'
          if ! git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116; then
            git fetch --no-tags origin art/ciudad-2d-hitos-1-5-20261116
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/art/ciudad-2d-hitos-1-5-20261116
          fi
