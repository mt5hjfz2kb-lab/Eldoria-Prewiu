name: "[EXPERIMENT] Valoria External Cliff Proof v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/valoria-external-cliff-proof-v1-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-external-cliff-proof-v1
  cancel-in-progress: true

jobs:
  prepare-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Poly Haven Rock Face 02 CC0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-cliff
          cat > /tmp/fetch-rock-face.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';

          const out=path.resolve('external-cliff');
          const api='https://api.polyhaven.com/files/rock_face_02';
          const headers={'User-Agent':'Eldoria-Visual-Proof/1.0'};
          const response=await fetch(api,{headers});
          if(!response.ok) throw new Error('Poly Haven API '+response.status);
          const tree=await response.json();

          const candidates=[];
          function walk(v,p=[]){
            if(!v||typeof v!=='object') return;
            if(typeof v.url==='string'){
              const joined=p.join('/').toLowerCase();
              const url=v.url;
              if(joined.includes('gltf') || /gltf/i.test(url))
                candidates.push({url,path:p.join('/'),node:v});
            }
            if(Array.isArray(v)){v.forEach((x,i)=>walk(x,p.concat(String(i))));return;}
            for(const [k,x] of Object.entries(v)) if(k!=='url') walk(x,p.concat(k));
          }
          walk(tree);
          if(!candidates.length){
            const urls=[];
            function all(v,p=[]){
              if(!v||typeof v!=='object') return;
              if(typeof v.url==='string') urls.push({path:p.join('/'),url:v.url});
              if(Array.isArray(v)){v.forEach((x,i)=>all(x,p.concat(String(i))));return;}
              for(const [k,x] of Object.entries(v)) if(k!=='url') all(x,p.concat(k));
            }
            all(tree);
            console.log(JSON.stringify({sample_urls:urls.slice(0,80)},null,2));
            throw new Error('No glTF-labelled candidate in Poly Haven files tree');
          }

          const score=x=>{
            const p=x.path.toLowerCase();
            let s=p.includes('2k')?0:p.includes('1k')?10:p.includes('4k')?20:30;
            if(p.includes('gltf')) s-=5;
            if(/\.gltf(?:\?|$)/i.test(x.url)) s-=3;
            if(/\.zip(?:\?|$)/i.test(x.url)) s+=1;
            return s;
          };
          candidates.sort((a,b)=>score(a)-score(b));
          const chosen=candidates[0];
          console.log(JSON.stringify({chosen:{path:chosen.path,url:chosen.url},candidate_count:candidates.length},null,2));

          fs.mkdirSync(out,{recursive:true});
          const chosenUrl=new URL(chosen.url);
          let fileName=decodeURIComponent(path.basename(chosenUrl.pathname)) || 'rock_face_02_download';
          const downloadPath=path.join(out,fileName);
          const dl=await fetch(chosen.url,{headers});
          if(!dl.ok) throw new Error('asset download '+dl.status);
          fs.writeFileSync(downloadPath,Buffer.from(await dl.arrayBuffer()));

          if(/\.zip$/i.test(fileName)){
            execFileSync('unzip',['-q','-o',downloadPath,'-d',out],{stdio:'inherit'});
            fs.unlinkSync(downloadPath);
          }

          let gltfs=[];
          function scan(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) scan(p);
              else if(ent.name.toLowerCase().endsWith('.gltf')) gltfs.push(p);
            }
          }
          scan(out);

          if(!gltfs.length && /\.gltf$/i.test(fileName)) gltfs=[downloadPath];
          if(!gltfs.length) throw new Error('No glTF found after downloading selected Poly Haven candidate');

          const gltfPath=gltfs[0];
          const gltfUrl=/\.gltf(?:\?|$)/i.test(chosen.url)?new URL(chosen.url):null;
          if(gltfUrl){
            const gltf=JSON.parse(fs.readFileSync(gltfPath,'utf8'));
            const uris=[
              ...(gltf.buffers||[]).map(x=>x.uri),
              ...(gltf.images||[]).map(x=>x.uri)
            ].filter(x=>x && !x.startsWith('data:'));

            for(const uri of [...new Set(uris)]){
              const target=path.resolve(path.dirname(gltfPath),decodeURIComponent(uri));
              if(!target.startsWith(out)) throw new Error('dependency escapes output: '+uri);
              if(fs.existsSync(target)) continue;
              fs.mkdirSync(path.dirname(target),{recursive:true});
              const remote=new URL(uri,gltfUrl).href;
              const r=await fetch(remote,{headers});
              if(!r.ok) throw new Error('dependency '+uri+' '+r.status);
              fs.writeFileSync(target,Buffer.from(await r.arrayBuffer()));
            }
          }

          console.log(JSON.stringify({files:fs.readdirSync(out),gltf:path.relative(out,gltfPath)},null,2));
          NODE
          node /tmp/fetch-rock-face.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: valoria-rock-face-02-cc0
          path: external-cliff/**
          if-no-files-found: error
          retention-days: 1

  capture:
    needs: prepare-asset
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage Kiara 3 CC0 backplate
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\BackplateCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dst=Join-Path $dir 'kiara3_1.jpg'
          Invoke-WebRequest -Uri 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Backplates/kiara_3_morning/jpg_pretty/20160824-DSC01604.jpg' -OutFile $dst -UseBasicParsing
          if((Get-Item $dst).Length -lt 500000){throw 'Backplate unexpectedly small.'}
      - uses: actions/download-artifact@v4
        with:
          name: valoria-rock-face-02-cc0
          path: Unity/Assets/Eldoria/ExternalProof/RockFace02
      - name: Verify staged cliff
        shell: powershell
        run: |
          $files=Get-ChildItem "$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ExternalProof\RockFace02" -Recurse
          $files | Select-Object FullName,Length
          if(-not ($files | Where-Object {$_.Extension -eq '.gltf'})){throw 'No staged glTF found.'}
      - name: Capture external cliff proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaExternalCliffProofV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaExternalCliffProofV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaExternalCliffProofGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(24)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-external-cliff-proof-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaExternalCliffProofV1Captures/*
            ${{ runner.temp }}/ValoriaExternalCliffProofV1.log
          if-no-files-found: warn
          retention-days: 30
