name: "[EXPERIMENT] Valoria External Cliff Proof v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/valoria-external-cliff-proof-v1-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-external-cliff-proof-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage Kiara 3 CC0 backplate
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\BackplateCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dst=Join-Path $dir 'kiara3_1.jpg'
          Invoke-WebRequest -Uri 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Backplates/kiara_3_morning/jpg_pretty/20160824-DSC01604.jpg' -OutFile $dst -UseBasicParsing
          if((Get-Item $dst).Length -lt 500000){throw 'Backplate unexpectedly small.'}
      - name: Stage Poly Haven Rock Face 02 CC0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ExternalProof\RockFace02"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          $headers=@{'User-Agent'='Eldoria-Visual-Proof/1.0'}
          $tree=Invoke-RestMethod -Uri 'https://api.polyhaven.com/files/rock_face_02' -Headers $headers

          $candidates=New-Object System.Collections.Generic.List[object]
          function Walk-Node($value,[string]$path){
            if($null -eq $value){ return }
            if($value -is [string]){ return }

            $urlProp=$value.PSObject.Properties['url']
            if($null -ne $urlProp -and $urlProp.Value -is [string] -and $urlProp.Value -match '\\.gltf(?:\\?|$)'){
              $candidates.Add([pscustomobject]@{Url=$urlProp.Value;Path=$path})
            }

            if($value -is [System.Collections.IEnumerable] -and -not ($value -is [pscustomobject])){
              $i=0
              foreach($item in $value){ Walk-Node $item ($path+'/'+$i); $i++ }
              return
            }

            foreach($prop in $value.PSObject.Properties){
              if($prop.Name -eq 'url'){ continue }
              Walk-Node $prop.Value ($path+'/'+$prop.Name)
            }
          }
          Walk-Node $tree ''

          if($candidates.Count -eq 0){ throw 'No glTF candidate in Poly Haven files tree.' }
          $chosen=$candidates | Sort-Object @{
            Expression={
              $p=$_.Path.ToLowerInvariant()
              $score=30
              if($p.Contains('2k')){$score=0}
              elseif($p.Contains('1k')){$score=10}
              elseif($p.Contains('4k')){$score=20}
              if(-not $p.Contains('gltf')){$score+=100}
              $score
            }
          } | Select-Object -First 1

          $gltfPath=Join-Path $dst 'rock_face_02.gltf'
          Invoke-WebRequest -Uri $chosen.Url -Headers $headers -OutFile $gltfPath -UseBasicParsing
          if((Get-Item $gltfPath).Length -lt 1000){ throw 'Downloaded glTF is unexpectedly small.' }

          $gltf=Get-Content $gltfPath -Raw | ConvertFrom-Json
          $uris=@()
          if($null -ne $gltf.buffers){ foreach($b in $gltf.buffers){ if($b.uri -and -not $b.uri.StartsWith('data:')){$uris+=$b.uri} } }
          if($null -ne $gltf.images){ foreach($i in $gltf.images){ if($i.uri -and -not $i.uri.StartsWith('data:')){$uris+=$i.uri} } }

          $base=[Uri]$chosen.Url
          $dstFull=[IO.Path]::GetFullPath($dst)
          foreach($uri in ($uris | Select-Object -Unique)){
            $remote=[Uri]::new($base,$uri).AbsoluteUri
            $rel=[Uri]::UnescapeDataString($uri).Replace('/','\')
            $target=[IO.Path]::GetFullPath((Join-Path $dst $rel))
            if(-not $target.StartsWith($dstFull,[StringComparison]::OrdinalIgnoreCase)){ throw "Dependency escapes staging folder: $uri" }
            New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
            Invoke-WebRequest -Uri $remote -Headers $headers -OutFile $target -UseBasicParsing
          }

          Write-Host "Selected Poly Haven glTF: $($chosen.Path)"
          Get-ChildItem $dst -Recurse | Select-Object FullName,Length

      - name: Capture external cliff proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaExternalCliffProofV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaExternalCliffProofV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaExternalCliffProofGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(24)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-external-cliff-proof-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaExternalCliffProofV1Captures/*
            ${{ runner.temp }}/ValoriaExternalCliffProofV1.log
          if-no-files-found: warn
          retention-days: 30
