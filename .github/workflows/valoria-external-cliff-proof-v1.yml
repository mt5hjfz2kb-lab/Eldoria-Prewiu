name: "[EXPERIMENT] Valoria External Cliff Proof v1"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/valoria-external-cliff-proof-v1-request.json'

permissions:
  contents: read

concurrency:
  group: valoria-external-cliff-proof-v1
  cancel-in-progress: true

jobs:
  capture:
    if: vars.UNITY_RUNNER_READY == 'true'
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 30
    steps:
      - name: Expose Git
        shell: powershell
        run: |
          $git=Get-Command git.exe -ErrorAction SilentlyContinue
          if(-not $git){
            $desktop="${env:LOCALAPPDATA}\GitHubDesktop"
            $candidate=Get-ChildItem $desktop -Directory -Filter 'app-*' -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'resources\app\git\cmd\git.exe' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if(-not $candidate){throw 'Git not found'}
            $dir=Split-Path $candidate
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH="$dir;$env:PATH"
          }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Restore canonical Unity source
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -fdx -- Unity/Assets Unity/Packages Unity/ProjectSettings
      - name: Stage Kiara 3 CC0 backplate
        shell: powershell
        run: |
          $dir="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\Resources\Valoria\BackplateCandidates"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dst=Join-Path $dir 'kiara3_1.jpg'
          Invoke-WebRequest -Uri 'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Backplates/kiara_3_morning/jpg_pretty/20160824-DSC01604.jpg' -OutFile $dst -UseBasicParsing
          if((Get-Item $dst).Length -lt 500000){throw 'Backplate unexpectedly small.'}
      - name: Stage Poly Haven Rock Face 02 CC0
        shell: powershell
        run: |
          $dst="$env:GITHUB_WORKSPACE\Unity\Assets\Eldoria\ExternalProof\RockFace02"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $script=Join-Path $env:RUNNER_TEMP 'fetch-polyhaven-rock-face-02.mjs'
          @'
          import fs from 'node:fs';
          import path from 'node:path';

          const out=process.argv[2];
          const api='https://api.polyhaven.com/files/rock_face_02';
          const response=await fetch(api,{headers:{'User-Agent':'Eldoria-Visual-Proof/1.0'}});
          if(!response.ok) throw new Error('Poly Haven API '+response.status);
          const tree=await response.json();

          const candidates=[];
          function walk(v,p=[]){
            if(!v||typeof v!=='object') return;
            if(typeof v.url==='string' && /\.gltf(?:\?|$)/i.test(v.url))
              candidates.push({node:v,path:p.join('/')});
            if(Array.isArray(v)){v.forEach((x,i)=>walk(x,p.concat(String(i))));return;}
            for(const [k,x] of Object.entries(v)) walk(x,p.concat(k));
          }
          walk(tree);
          if(!candidates.length) throw new Error('No glTF candidate in Poly Haven files tree');
          candidates.sort((a,b)=>{
            const score=x=>{
              const p=x.path.toLowerCase();
              return (p.includes('2k')?0:p.includes('1k')?1:p.includes('4k')?2:3) +
                     (p.includes('gltf')?0:10);
            };
            return score(a)-score(b);
          });
          const chosen=candidates[0];
          const records=new Map();
          function collect(v){
            if(!v||typeof v!=='object') return;
            if(typeof v.url==='string' && /^https:\/\//.test(v.url)){
              const u=new URL(v.url);
              const name=decodeURIComponent(path.basename(u.pathname));
              if(name) records.set(name,v.url);
            }
            if(Array.isArray(v)){v.forEach(collect);return;}
            for(const x of Object.values(v)) collect(x);
          }
          collect(chosen.node);
          if(chosen.node.include) collect(chosen.node.include);

          // Some include trees are siblings/ancestors, so collect files sharing the chosen
          // resolution + glTF branch when the selected record alone is sparse.
          const branch=chosen.path.split('/').slice(0,-1);
          let cur=tree;
          for(const k of branch){
            if(cur && typeof cur==='object' && k in cur) cur=cur[k];
            else break;
          }
          collect(cur);

          if(![...records.keys()].some(x=>x.toLowerCase().endsWith('.gltf')))
            records.set(decodeURIComponent(path.basename(new URL(chosen.node.url).pathname)),chosen.node.url);

          fs.mkdirSync(out,{recursive:true});
          for(const [name,url] of records){
            if(!/\.(gltf|bin|png|jpg|jpeg|webp)$/i.test(name)) continue;
            const r=await fetch(url,{headers:{'User-Agent':'Eldoria-Visual-Proof/1.0'}});
            if(!r.ok) throw new Error('download '+name+' '+r.status);
            fs.writeFileSync(path.join(out,name),Buffer.from(await r.arrayBuffer()));
          }
          const gltfs=fs.readdirSync(out).filter(x=>x.toLowerCase().endsWith('.gltf'));
          if(!gltfs.length) throw new Error('glTF not materialized');
          console.log(JSON.stringify({selected:chosen.path,files:fs.readdirSync(out)},null,2));
          '@ | Set-Content -Encoding UTF8 $script
          node $script $dst
      - name: Capture external cliff proof
        shell: powershell
        run: |
          $folder="$env:GITHUB_WORKSPACE\Unity\ValoriaExternalCliffProofV1Captures"
          $log="$env:RUNNER_TEMP\ValoriaExternalCliffProofV1.log"
          Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
          $args=@('-batchmode','-quit','-force-d3d11','-projectPath',"$env:GITHUB_WORKSPACE\Unity",'-executeMethod','Eldoria.EditorTools.ValoriaExternalCliffProofGateV1.Capture','-logFile',$log)
          $p=Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $args -PassThru
          $deadline=(Get-Date).AddMinutes(24)
          while(-not $p.HasExited -and (Get-Date)-lt $deadline){Start-Sleep 2;$p.Refresh()}
          if(-not $p.HasExited){& taskkill.exe /PID $p.Id /T /F | Out-Null;throw 'Gate timed out'}
          if($p.ExitCode -ne 0){if(Test-Path $log){Get-Content $log -Tail 400};throw "Gate failed $($p.ExitCode)"}
          Get-Content (Join-Path $folder 'evidence.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valoria-external-cliff-proof-v1-${{ github.run_id }}
          path: |
            Unity/ValoriaExternalCliffProofV1Captures/*
            ${{ runner.temp }}/ValoriaExternalCliffProofV1.log
          if-no-files-found: warn
          retention-days: 30
