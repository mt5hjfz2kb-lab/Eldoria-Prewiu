name: Eldoria local AI inference readiness
on:
  push:
    branches: [prototype/valoria-bastion1-no-sharp-20261010]
    paths: ['.github/workflows/valoria-local-ai-readiness.yml']
permissions:
  contents: read
jobs:
  local-inference:
    runs-on: [self-hosted, windows, unity-6000-3-23f1]
    timeout-minutes: 12
    steps:
      - name: Expose Git from GitHub Desktop
        shell: powershell
        run: |
          $git = Get-ChildItem "$env:LOCALAPPDATA/GitHubDesktop/app-*/resources/app/git/cmd/git.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($git) { Split-Path $git.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Check FREE local visual agent inference without changing system or installing models
        shell: powershell
        run: |
          $p=[ordered]@{ollama_cli=$false;ollama_api=$false;models=@();nvidia_gpu=$false;gpu_summary=@();paid_credentials_requested=$false}
          $ollama=Get-Command ollama.exe -ErrorAction SilentlyContinue
          $p.ollama_cli=[bool]$ollama
          try {
            $data=Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 3
            $p.ollama_api=$true
            $p.models=@($data.models|ForEach-Object {$_.name})
          } catch {}
          $nvidia=Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if (-not $nvidia) { $path="$env:ProgramFiles/NVIDIA Corporation/NVSMI/nvidia-smi.exe";if (Test-Path $path) {$nvidia=@{Source=$path}} }
          if ($nvidia) {
            $p.nvidia_gpu=$true
            $p.gpu_summary=@(& $nvidia.Source --query-gpu=name,memory.total --format=csv,noheader 2>$null)
          }
          $path="$env:RUNNER_TEMP/eldoria-local-ai-readiness.json"
          $p|ConvertTo-Json -Depth 4|Set-Content -Path $path -Encoding UTF8
          Get-Content $path
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eldoria-local-ai-readiness
          path: ${{ runner.temp }}/eldoria-local-ai-readiness.json
