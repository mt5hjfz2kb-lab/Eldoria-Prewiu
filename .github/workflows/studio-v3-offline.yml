name: Studio V3 offline execution proof
on:
  push:
    branches: [pilot/eldoria-studio-v3-autonomous-execution-20261126]
    paths:
      - 'tools/studio-v3/**'
      - '.github/workflows/studio-v3-offline.yml'
permissions:
  contents: read
concurrency:
  group: studio-v3-offline
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/studio-v3
            tools/openai-development-studio
          fetch-depth: 1
      - name: Fetch pinned Senda rules
        run: git fetch --no-tags --depth=1 origin e1d3b9892e1a75a9e7bfbafd0db225de7aacba74
      - name: Test exact candidate core with SHA-256
        run: node --test tools/studio-v3/core.test.mjs tools/studio-v3/role-bridge.test.mjs tools/studio-v3/v2-role-adapter.test.mjs tools/studio-v3/senda-pilot.test.mjs
      - name: Fetch pinned public V2 commit
        run: git fetch --no-tags --depth=1 origin 1657b2caa6b1a955319538ce3a8b2906398599b3
      - name: Test isolated V3 budget and call guard with fixture transport only
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/studio-v3/live-role-guard.test.py
      - name: Verify visual trial production, correction and blinded judge orchestration offline
        run: node --test tools/studio-v3/visual-live/orchestrator.test.mjs
      - name: Verify proposed separate visual role reservations and deny unapproved spend
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/studio-v3/visual-live/session.test.py
      - name: Verify V2 client unchanged from pinned source
        run: git diff --exit-code 1657b2caa6b1a955319538ce3a8b2906398599b3 HEAD -- tools/openai-development-studio
      - name: Replay rejection, pivot, independent checks and scratch persistence
        run: node tools/studio-v3/replay.mjs
      - name: Freeze paired mission and verify real baseline defect
        run: node tools/studio-v3/senda-pilot.mjs --plan
      - name: Exercise complete two-arm dispatch and accounting with fixture only
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: node tools/studio-v3/senda-pilot.mjs --fixture "$RUNNER_TEMP/studio-v3-senda-fixture"
      - name: Verify tracked files unchanged
        run: git diff --exit-code
