name: Eldoria P0 published-baseline native and WebGL certification
'on':
  push:
    branches:
    - fix/eldoria-world-first-entry-p0-20261114
    paths:
    - tools/eldoria-private-beta/world-p0-build-request.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: eldoria-world-p0-exclusive-unity
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |-
          tools/eldoria-private-beta
          .github/workflows
          tools/check-repository-architecture.mjs
          tools/check-workflow-governance.mjs
          pipeline/repository-architecture-invariants.json
          pipeline/active-workstreams.json
          Unity/Assets/Eldoria/World4XCanon/*.cs
          Unity/Assets/Eldoria/ArtTests/ValoriaReferenceClean/Integration/ValoriaIntegratedWorld.cs
          Unity/Assets/Eldoria/BetaMemoryProbe/Tests/PlayMode
        fetch-depth: 20
        sparse-checkout-cone-mode: false
    - name: Parse native build script before acquiring Windows
      shell: pwsh
      run: |
        $tokens=$null;$errors=$null
        $null=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tools/eldoria-private-beta/run_world_p0_build.ps1'),[ref]$tokens,[ref]$errors)
        if($errors.Count){$errors|Format-List;throw 'Native build script does not parse'}
    - name: Preserve published UI bytes and run focused source and structural guards
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin 90465a9a910b89a8a8b74e4b33a9bbc88578e00e 05e1846f0213c6320850505bc054110c53934f55
        git diff --exit-code 90465a9a910b89a8a8b74e4b33a9bbc88578e00e 05e1846f0213c6320850505bc054110c53934f55 -- Unity/Assets/Eldoria/BreachWatch/
        node --test tools/eldoria-private-beta/lazy-world-*.test.mjs
        node tools/check-repository-architecture.mjs --tracked-tree
        node tools/check-workflow-governance.mjs
    - name: Verify exclusive live CAS before touching Windows
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        python3 - <<'PY'
        import base64,json,os,urllib.request
        repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA']
        h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
        def get(path):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers=h)
            return json.load(urllib.request.urlopen(req,timeout=30))
        assert open('tools/eldoria-private-beta/world-p0-build-request.txt').read().strip().splitlines()==['build_source=05e1846f0213c6320850505bc054110c53934f55','attempt=11-explicit-recovery-artifact-run']
        assert get('git/ref/heads/fix/eldoria-world-first-entry-p0-20261114')['object']['sha']==sha
        item=get('contents/pipeline/active-workstreams.json?ref=main')
        b=item.get('content')
        if item.get('encoding')!='base64' or not b:
            blob=get('git/blobs/'+item['sha'])
            assert blob.get('sha')==item['sha'] and blob.get('encoding')=='base64'
            b=blob['content']
        j=json.loads(base64.b64decode(b))
        w=next(x for x in j['active'] if x['id']=='eldoria-private-beta-i-v-20261107')
        holders=[x for x in j['active'] if 'windows-runner-heavy' in x.get('resources',[])]
        assert len(holders)==1 and holders[0]['id']==w['id']
        assert w['owner']=='chatgpt-world-p0-continuation-9df36d17'
        assert w['branch']=='fix/eldoria-world-first-entry-p0-20261114'
        assert w['ownership_revision']==85 and w['ownership_state']=='claimed'
        print('P0_EXACT_CURRENT_SOURCE_LIVE_LEASE_VERIFIED',sha)
        PY
  build:
    needs: preflight
    runs-on:
    - self-hosted
    - windows
    - unity-6000-3-23f1
    timeout-minutes: 180
    steps:
    - name: Fetch only exact build script without archive fallback
      shell: powershell
      timeout-minutes: 3
      run: |
        $ErrorActionPreference='Stop'
        $dir=Join-Path $env:GITHUB_WORKSPACE ('world-p0-build-control-'+$env:GITHUB_RUN_ID)
        if(Test-Path $dir){throw 'Preserve existing control directory'}
        New-Item -ItemType Directory -Path $dir|Out-Null
        $script=Join-Path $dir 'run_world_p0_build.ps1'
        $url='https://raw.githubusercontent.com/'+$env:GITHUB_REPOSITORY+'/'+$env:GITHUB_SHA+'/tools/eldoria-private-beta/run_world_p0_build.ps1'
        Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $script -TimeoutSec 90
        $tokens=$null;$errors=$null
        $null=[System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
        if($errors.Count){throw 'Downloaded exact script failed parser'}
        Add-Content $env:GITHUB_ENV ('WORLD_P0_BUILD_SCRIPT='+$script)
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: '14121008070'
        run-id: 43613603217
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        merge-multiple: true
        path: world-p0-original-art-recovery
    - uses: actions/download-artifact@v4
      with:
        run-id: 43489752868
        name: integrated-build-proof-90465a9a910b89a8a8b74e4b33a9bbc88578e00e
        github-token: ${{ github.token }}
        path: world-p0-verified-prior-proof
    - name: Certify reconciled world, published UI, campaign and exact WebGL
      shell: powershell
      run: '& $env:WORLD_P0_BUILD_SCRIPT -SourceSha ''05e1846f0213c6320850505bc054110c53934f55'''
    - name: Retain exact WebGL and all native evidence
      if: always() && env.WORLD_P0_BUILD_OUT != ''
      uses: actions/upload-artifact@v4
      with:
        name: world-p0-build-and-proof
        path: ${{ env.WORLD_P0_BUILD_OUT }}/
        if-no-files-found: warn
        compression-level: 0
        retention-days: 21
    - name: Retain original reviewable native evidence separately
      if: always() && env.WORLD_P0_BUILD_OUT != ''
      uses: actions/upload-artifact@v4
      with:
        name: world-p0-reconciled-native-proof
        path: |-
          ${{ env.WORLD_P0_BUILD_OUT }}/*.json
          ${{ env.WORLD_P0_BUILD_OUT }}/*.xml
          ${{ env.WORLD_P0_BUILD_OUT }}/*.log
          ${{ env.WORLD_P0_BUILD_OUT }}/world-unity-views
          ${{ env.WORLD_P0_BUILD_OUT }}/native-ui
          ${{ env.WORLD_P0_BUILD_OUT }}/integrated-build-proof/*.json
        retention-days: 30
    - name: Reclaim only generated cache after retaining evidence
      if: always() && env.WORLD_P0_BUILD_PROJECT != ''
      shell: powershell
      run: |-
        $ErrorActionPreference='Stop'
        if(@(Get-Process Unity,blender -ErrorAction SilentlyContinue).Count){Write-Host 'EDITOR_BUSY_PRESERVE';exit 0}
        $project=$env:WORLD_P0_BUILD_PROJECT
        $allowed=@((Join-Path $env:GITHUB_WORKSPACE 'world-p0-build-source-05e1846f0213/Unity'))
        if($allowed -notcontains $project){throw 'Unexpected cache owner'}
        $cache=Join-Path $project 'Library'
        if(-not(Test-Path $cache)){exit 0}
        if((Get-Item $cache).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Refuse reparse cache'}
        $empty=Join-Path $env:WORLD_P0_BUILD_OUT 'empty-cache-cleanup'
        if(Test-Path $empty){throw 'Preserve existing cleanup marker'}
        New-Item -ItemType Directory -Path $empty|Out-Null
        & robocopy.exe $empty $cache /MIR /XJ /R:1 /W:1|Out-Null
        if($LASTEXITCODE -ge 8){throw 'Cache reclaim failed'}
        Remove-Item $cache -Recurse -Force
        Remove-Item $empty -Force
        Write-Host ('WORLD_P0_BUILD_CACHE_RECLAIMED_FREE_GIB='+[Math]::Round((Get-PSDrive C).Free/1GB,2))
        exit 0
  package-owner:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: tools/eldoria-private-beta
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: world-p0-build-and-proof
        path: build-output
    - uses: actions/download-artifact@v4
      with:
        run-id: 43257126363
        name: mobile18-full-lazy-owner-only-site-not-iphone-pass
        github-token: ${{ github.token }}
        path: stable-shell
    - uses: actions/download-artifact@v4
      with:
        run-id: 42481331350
        name: deduplicated-bundle-unverified
        github-token: ${{ github.token }}
        path: reference-parent
    - uses: actions/download-artifact@v4
      with:
        run-id: 42493894120
        name: mobile6-candidate-site
        github-token: ${{ github.token }}
        path: reference-profile
    - name: Reuse the exact stable texture profile with the new native engine
      shell: bash
      run: |
        python -m pip install UnityPy==1.25.4 lz4==4.4.5 Brotli==1.2.1
        python - <<'PY'
        import json,os,pathlib,sys
        from types import SimpleNamespace
        sys.path.insert(0,'tools/eldoria-private-beta')
        from prepare_integrated_owner_site import package
        from prepare_lazy_owner_site import sole_dir
        sha='05e1846f0213c6320850505bc054110c53934f55'
        ui=[p.parent for p in pathlib.Path('build-output/native-ui').rglob('BreachWatchDestinationEvidence.json')
            if json.loads(p.read_text(encoding='utf-8-sig')).get('source')==sha]
        assert len(ui)==1,'Ambiguous current native destination proof'
        proof=pathlib.Path('build-output/integrated-build-proof')
        assert (proof/'integration-result.json').is_file(),'Exact unpublished build proof absent'
        parent=sole_dir('reference-parent','data.unity3d')/'data.unity3d'
        package(SimpleNamespace(source_head=sha,revision='integrated-mobile21-owner-qa',
            build_proof=proof,ui_proof=ui[0],stable_shell='stable-shell',
            stable_identity_sha256='c87066f246d7c7e53352ed6af2d7f2ffd7774b35328e9f17e7ad5183a8227904',
            webgl_artifact='build-output/compiled-webgl',native_run=os.environ['GITHUB_RUN_ID'],
            output='candidate-site',work='candidate-work',reference_parent=parent,
            reference_site='reference-profile'))
        PY
    - name: Retain unpublished integrated owner candidate
      uses: actions/upload-artifact@v4
      with:
        name: world-p0-mobile21-owner-site
        path: candidate-site
        compression-level: 0
        if-no-files-found: error
        retention-days: 21
    - name: Preserve exact packaging and serialized-object integrity evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: world-p0-mobile21-package-proof
        path: |
          candidate-work/exact-build-selection.json
          candidate-work/original/extraction.json
          candidate-work/deduplicated/integrity.json
          candidate-work/profile/integrity.json
          candidate-site/release-identity.json
        retention-days: 21
