/* v0.2: orientación inequívoca en la transición reino → mundo */
.gate.objective{box-shadow:0 0 0 0 #d6b66f88,0 0 24px #d6b66f66;animation:objectivePulse 1.6s infinite}
.gate.objective em{position:absolute;bottom:100%;margin-bottom:8px;background:#d6b66f;color:#17140d;padding:5px 9px;font:bold 9px Arial;font-style:normal;letter-spacing:.12em;white-space:nowrap}
.gate.objective i{position:absolute;right:-19px;font-size:34px;color:var(--gold);animation:nudge 1s infinite}
.scene-enter{animation:sceneEnter .7s}
.location-title{position:absolute;z-index:8;top:25px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}
.location-title small{display:block;font:9px Arial;letter-spacing:.24em;color:var(--gold)}
.location-title strong{font-size:23px;font-weight:normal}
.path i{position:absolute;left:48%;width:8px;height:8px;border-radius:50%;background:#e0c879;box-shadow:0 0 10px #efdc95}
.path i:nth-child(1){bottom:34%}.path i:nth-child(2){bottom:48%;transform:scale(.8)}.path i:nth-child(3){bottom:60%;transform:scale(.6)}
.enemy .objective-arrow{font:9px Arial;color:#17140d;text-shadow:none;background:#d6b66f;padding:5px 8px;margin:0 auto 5px;animation:arrowBounce 1s infinite}
@keyframes sceneEnter{from{opacity:.2;filter:brightness(.2);transform:scale(1.04)}}
@keyframes objectivePulse{50%{box-shadow:0 0 0 12px #d6b66f00,0 0 38px #d6b66f99}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes arrowBounce{50%{transform:translateY(-4px)}}

/* v0.3: combate táctico y consecuencia de La Brecha */
.enemy-intent{margin:18px auto 8px;padding:7px 10px;width:max-content;max-width:100%;background:#27251e;border:1px solid #d6b66f55;font:bold 10px Arial;letter-spacing:.08em;color:#d7caa5}
.enemy-intent.heavy{background:#401d22;border-color:#d86060;color:#ffaaaa;animation:warningPulse .7s infinite}
.combat-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.combat-actions .action{min-height:66px;border:1px solid #ffffff24;background:#1b2227;cursor:pointer;padding:8px}
.combat-actions .action b,.combat-actions .action small{display:block}.combat-actions .action small{margin-top:5px;font:9px Arial;color:#aaa}
.combat-actions .attack-action{border-color:#b65d54}.combat-actions .guard-action{border-color:#6e91a8}.combat-actions .rift-action{border-color:#a64fd0;background:#28182f}.combat-actions .action:disabled{opacity:.35}
.enemy-intent b,.enemy-intent span{display:block}.enemy-intent span{margin-top:5px;font:9px Arial;letter-spacing:.12em}
.combat-actions .guard-action.recommended{background:#244b52;border:2px solid #8fd4d0;box-shadow:0 0 0 0 #8fd4d088,0 0 22px #67bdc477;animation:defendNow 1s infinite}
.combat-actions .guard-action.recommended small{color:#bffffa}.combat-actions .attack-action.risky{opacity:.62;background:#31191b}.combat-actions .attack-action.risky small{color:#ff9c9c}
.rift-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.rift-choices .choice{min-height:115px;padding:15px;border:1px solid;background:#171d21;cursor:pointer}.rift-choices b,.rift-choices small{display:block}.rift-choices b{font-size:17px}.rift-choices small{margin-top:10px;font:11px/1.4 Arial;color:#bbb}.rift-choices .contain{border-color:#72af9b}.rift-choices .exploit{border-color:#b94ce9;background:#27172d}
.rift-choices .choice>span{display:block;font-size:45px;margin-bottom:10px}.rift-choices .contain>span{color:#91dbc3;text-shadow:0 0 18px #50c9a4}.rift-choices .exploit>span{color:#dc87ff;text-shadow:0 0 18px #c13ef6}.rift-choices .choice:hover{transform:translateY(-3px);filter:brightness(1.18)}
.contained-card{border-color:#6fb39c;background:radial-gradient(circle at 50% 30%,#285f58,#142523 67%)}.contained-card span{color:#9de1c7;text-shadow:0 0 25px #58d1ad}
.kingdom-scene.rift-exploit:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 62% 75%,#9f2fff32,transparent 32%);box-shadow:inset 0 0 70px #8e24b82e}
.kingdom-scene.rift-contain:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 72% 72%,#65c49b24,transparent 32%)}
@keyframes warningPulse{50%{filter:brightness(1.5)}}
@keyframes defendNow{50%{box-shadow:0 0 0 7px #8fd4d000,0 0 30px #67bdc499;transform:translateY(-2px)}}
@media(max-width:560px){.combat-actions{grid-template-columns:1fr}.combat-actions .action{min-height:48px}.rift-choices{grid-template-columns:1fr}.rift-choices .choice{min-height:80px}}

/* v0.6: informe local de playtest */
.privacy-note{font-size:11px!important;color:#8eb7a6!important;text-align:center}.playtest-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}.playtest-stats div{background:#0d1215;border:1px solid #ffffff16;padding:12px 6px;text-align:center}.playtest-stats b,.playtest-stats small{display:block}.playtest-stats b{font-size:18px;color:var(--gold)}.playtest-stats small{margin-top:5px;font:9px Arial;color:#aaa}#report-text{width:100%;min-height:145px;resize:none;background:#090d10;color:#bfc5bf;border:1px solid #ffffff20;padding:12px;font:11px/1.5 monospace}@media(max-width:520px){.playtest-stats{grid-template-columns:1fr 1fr}}

/* v0.6.1: controles resistentes a resoluciones y zoom diferentes */
.topbar,.resources,.resource,.bottom-nav button,.modal,.combat-actions>*{min-width:0}
.resource span{overflow:hidden;text-overflow:ellipsis}.bottom-nav button{overflow:hidden}
.modal button{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.combat-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.rift-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.realm-title{max-width:150px;overflow:hidden}.realm-title strong,.realm-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gate{right:3%;bottom:5%}.quest-panel{max-width:58vw}.modal h2{font-size:20px}.costs{flex-wrap:wrap}}
@media(max-width:560px){.combat-actions,.rift-choices{grid-template-columns:1fr}.combat-actions .action,.rift-choices .choice{height:auto;min-height:56px}.modal{max-height:92vh}}
@media(max-height:680px){.modal{max-height:94vh;padding:18px}.modal h2{margin-bottom:12px}.combatant span{font-size:42px}.combat-actions .action{min-height:48px}.enemy-intent{margin:10px auto 5px}.bottom-nav{height:64px}.scene{bottom:64px}}

/* v0.7: premisa clara y guía contextual paso a paso */
.intro-mark{width:74px;height:74px;margin:0 auto 18px;display:grid;place-items:center;clip-path:polygon(50% 0,92% 20%,84% 83%,50% 100%,16% 83%,8% 20%);background:linear-gradient(135deg,#6b5730,#211b11);color:var(--gold);font-size:48px}.intro-lead{text-align:center;font-size:16px!important;line-height:1.55!important}.intro-dialogue{margin-top:20px;padding-top:18px;border-top:1px solid #ffffff18}.intro-dialogue p{font-size:14px}.building.objective{z-index:14;animation:buildingGuide 1.4s infinite}.building.objective em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;background:var(--gold);color:#17140d;padding:5px 8px;font:bold 9px Arial;font-style:normal;white-space:nowrap}.bottom-nav button.objective{color:#f4dc9a;background:#6a522f;box-shadow:inset 0 0 20px #d6b66f55;animation:navGuide 1.3s infinite}.effectline{display:grid;gap:6px;margin-top:10px;padding:10px;background:#0d1216;border:1px solid #ffffff13;font:11px/1.35 Arial}.effectline span{color:#aaa}.effectline strong{color:#a7d4ad}@keyframes buildingGuide{50%{filter:drop-shadow(0 0 18px #f1cf73);transform:translate(-50%,-55%) scale(1.06)}}@keyframes navGuide{50%{box-shadow:inset 0 0 28px #d6b66f99;filter:brightness(1.2)}}

.war-budget{margin:0 0 14px;padding:12px;border:1px solid #e0bd65;background:#17140c;text-align:center}.war-budget b{display:block;color:#ffe19a;font:700 20px Georgia,serif}.war-budget small{color:#ddd;font:11px Arial}

.moon{background:radial-gradient(circle at 35% 35%,#fff5d7,#b9b8ac 55%,#626a70);box-shadow:0 0 70px #d9e1cf50;filter:drop-shadow(0 0 8px #fff8)}
.corruption{background:radial-gradient(circle at 72% 30%,#9f2bc47d,transparent 24%),linear-gradient(150deg,#1d2924,#101317);filter:drop-shadow(0 -10px 22px #000)}
.path{filter:drop-shadow(0 0 12px #000)}.path i{animation:pathSpark 1.8s ease-in-out infinite}.path i:nth-child(2){animation-delay:.3s}.path i:nth-child(3){animation-delay:.6s}
.enemy{filter:drop-shadow(0 12px 10px #000)}.enemy>span:not(.objective-arrow){animation:enemyIdle 2.4s ease-in-out infinite}.enemy b,.enemy em{background:linear-gradient(90deg,#08060bdd,#1d0e25f2,#08060bdd);border-left:1px solid #b650dd55;border-right:1px solid #b650dd55}

.overlay{background:radial-gradient(circle at 50% 35%,#25303c99,#030507e8 58%);backdrop-filter:blur(8px) saturate(.8)}

.enemy-intent{box-shadow:0 5px 15px #0007}.combat-actions .action{position:relative;overflow:hidden;transition:.15s transform,.15s filter,.15s box-shadow}.combat-actions .action:hover{filter:brightness(1.14);transform:translateY(-2px)}.combat-actions .action:active{transform:translateY(2px) scale(.97)}.combat-actions .rift-action:not(:disabled){box-shadow:0 0 22px #c454e060;animation:skillReady 1.25s infinite}

/* Movimiento */
@keyframes resourceSheen{0%,75%{transform:translateX(-130%)}90%,100%{transform:translateX(140%)}}
@keyframes mistDrift{to{transform:translateX(5%) scaleY(1.15)}}
@keyframes emberRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(25px,-250px);opacity:0}}
@keyframes buildingRise{0%{transform:translate(-50%,-35%) scale(.75);opacity:.4}55%{transform:translate(-50%,-58%) scale(1.16)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes aldricAura{50%{transform:translateX(-50%) scale(1.25);opacity:.55}}
@keyframes questGlow{50%{filter:brightness(1.8);box-shadow:0 0 12px #ffd66b}}
@keyframes riftCore{to{filter:brightness(1.35);transform:rotate(4deg) scaleX(.5) scaleY(1.04)}}
@keyframes riftHalo{50%{opacity:.25;transform:rotate(12deg) scaleX(.63) scaleY(1.08)}}
@keyframes riftHalo{50%{opacity:.25;transform:rotate(12deg) scaleX(.63) scaleY(1.08)}}
@keyframes worldMist{to{transform:translateX(12%) scaleY(1.25)}}
@keyframes pathSpark{50%{filter:brightness(1.8);box-shadow:0 0 18px #ffe69a}}
@keyframes enemyIdle{50%{transform:translateY(-6px);filter:brightness(1.25)}}
@keyframes modalRise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes buttonSheen{0%,72%{transform:translateX(-140%)}88%,100%{transform:translateX(140%)}}
@keyframes rewardRays{to{transform:rotate(360deg)}}
@keyframes rewardCardEnter{0%{opacity:0;transform:translateY(32px) scale(.72)}65%{transform:translateY(-5px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes cardGlint{0%,45%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@keyframes resourcePop{0%{opacity:0;transform:translateX(35px) scale(.9)}15%{opacity:1;transform:none}75%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-28px)}}
@keyframes takeHit{20%{transform:translateX(-8px);filter:brightness(2)}45%{transform:translateX(7px)}70%{transform:translateX(-3px)}}
@keyframes skillHit{15%{transform:scale(1.12);filter:brightness(2.4)}45%{transform:translateX(12px) rotate(2deg)}70%{transform:translateX(-8px) rotate(-1deg)}}
@keyframes damageFloat{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-45px) scale(.9)}}
@keyframes skillFlash{from{opacity:0;transform:translateX(-50%)}40%{opacity:1}to{opacity:0;transform:translateX(50%)}}
@keyframes skillReady{50%{filter:brightness(1.25);box-shadow:0 0 35px #d05fff99}}

  function openModal(title,body){ closeModal(); const rewardLike=/Núcleo de Ceniza|Eco del Primer Rey|Carta|Reliquia equipada|recompensa/i.test(title); const locked=/Capítulo|Tutorial|Nuevo héroe|Elige a tu compañero|Recluta una compañía|Fragmentos del Núcleo|Consejo de guerra|Duelo|Informe de la prueba|¿Seguirías jugando|Mundo global|Primera carta|Reliquias recuperadas|Núcleo de Ceniza|Eco del Primer Rey/i.test(title); modal=el('div',`overlay ${rewardLike?'reward-overlay':''}`,`<section class="modal ${rewardLike?'reward-modal':''}">${locked?'':'<button class="close" aria-label="Cerrar">×</button>'}<h2>${title}</h2>${body}</section>`); $('#modal-root').append(modal); modal.querySelector('.close')?.addEventListener('click',closeModal); }
  function closeModal(){ if(autoTimer){clearInterval(autoTimer);autoTimer=null;} if(modal){modal.remove();modal=null;} }
  function navActive(target){ document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===target)); }
  function screenFeedback(copy,type='info'){
    const root=el('div',`screen-feedback ${type}`,copy);document.querySelector('.game-shell').append(root);setTimeout(()=>root.remove(),1500);
  }
  function resourceFeedback(changes,sign=1){
    const entries=Object.entries(changes||{}).filter(([,v])=>v);
    if(!entries.length)return;
    const root=el('div','resource-feedback',entries.map(([r,v])=>`<span class="${sign>0?'gain':'spend'}"><i>${D.resources[r]?.icon||'◆'}</i>${sign>0?'+':'−'}${Math.abs(v)} ${D.resources[r]?.label||r}</span>`).join(''));
    document.querySelector('.game-shell').append(root);setTimeout(()=>root.remove(),1700);
  }
  function buildingImpact(id){
    setTimeout(()=>{const n=$('.building-'+id);if(n){n.classList.add('level-up');setTimeout(()=>n.classList.remove('level-up'),900);}},30);
  }
  function combatFeedback(type,dmg,incoming){
    const hero=$('.combatant.hero')||$('.auto-side.allied'),foe=$('.combatant.foe')||$('.auto-side.enemy-side');
    const clash=$('.auto-clash');
    if(hero&&dmg>0){hero.classList.remove('striking');void hero.offsetWidth;hero.classList.add('striking');setTimeout(()=>hero.classList.remove('striking'),430);}
    if(clash&&dmg>0){clash.classList.remove('bursting');void clash.offsetWidth;clash.classList.add('bursting');}
    if(foe&&dmg>0){foe.classList.remove('hit');void foe.offsetWidth;foe.classList.add(type==='skill'||type==='technique'?'skill-hit':'hit');const p=el('b','damage-number enemy-damage',`−${dmg}`);foe.append(p);setTimeout(()=>p.remove(),850);}
    if(hero&&incoming>0){hero.classList.remove('hit');void hero.offsetWidth;hero.classList.add('hit');const p=el('b','damage-number hero-damage',`−${incoming}`);hero.append(p);setTimeout(()=>p.remove(),850);}
    const scene=$('.modal');if(scene&&(type==='skill'||type==='technique')){scene.classList.remove('skill-flash');void scene.offsetWidth;scene.classList.add('skill-flash');}
  }
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2600); }
  function burst(){ const p=$('#particles'); if(!p)return; p.innerHTML=Array.from({length:16},(_,i)=>`<i style="--a:${i*22.5}deg;--d:${50+Math.random()*90}px"></i>`).join(''); setTimeout(()=>p.innerHTML='',900); }
  function soundToggle(){ $('#sound-toggle').classList.toggle('muted'); toast($('#sound-toggle').classList.contains('muted')?'Sonido desactivado':'Sonido activado'); }
  function elapsed(){ return Math.max(0,Math.round((Date.now()-state.metrics.startedAt)/1000)); }
  function duration(seconds){ if(seconds===null||seconds===undefined)return '—'; const m=Math.floor(seconds/60),s=seconds%60; return `${m}m ${s}s`; }
  function powerReportLines(){const p=powerBreakdown();return `Poder Total: ${p.total} (Reino ${p.realm} + Ejército ${p.army} + Héroes ${p.heroes} + Colección ${p.collection})\nPico de Poder: ${state.metrics.powerPeak||p.total}\nPoder ganado neto registrado: ${state.metrics.powerGained||0}\nPoder de Expedición final: ${expeditionPower()}\n`;}
  function reportText(){ const m=state.metrics,a=state.playtestAnswers||{}; return `ELDORIA PLAYTEST v0.21.0 | Partida ${m.runId}\nReconstrucción de Valoria: ${duration(m.firstUpgradeSeconds)}\nEntrada al mundo: ${duration(m.worldSeconds)}\nTurnos de combate: ${m.combatTurns}\nUsos de Defender: ${m.guardUses}\nGolpes brutales defendidos: ${m.heavyGuards}\nDecisión: ${m.riftChoice==='contain'?'Forjar el Gran Sello':m.riftChoice==='exploit'?'Desatar la Brecha':'—'}\nPreparación: ${state.loop2Choice==='forge'?'Forja · ataque':state.loop2Choice==='quarry'?'Cantera · defensa':'—'}\nSegunda expedición: ${state.secondVictory?'Completada':'—'}\nCompañero: ${state.companion==='lyra'?'Lyra · daño':state.companion==='maelis'?'Maelis · curación':'—'}\nNivel de Aldric: ${heroLevel('aldric')} · XP total: ${state.heroXp.aldric||0}\nNivel de compañero: ${state.companion?heroLevel(state.companion):'—'}\nHabilidad de compañero usada: ${m.companionUses||0}\nCompañía: ${state.troopType==='infantry'?'Guardias de Valoria':state.troopType==='archers'?'Arqueros de Ceniza':'—'} · ${state.troopCount||0} supervivientes\nModo de combate final: ${state.combatMode==='auto'?'Batalla semiautomática':state.combatMode==='tactical'?'Mando táctico':'—'}\nHabilidades automáticas activadas: ${m.autoSkillUses||0}\nBajas de tropas: ${m.troopLosses||0}\n¿El combate encaja?: ${state.combatVerdict==='yes'?'Sí':state.combatVerdict==='maybe'?'Dudas':state.combatVerdict==='no'?'No':'—'}\nInversión de campaña: ${state.warPlan==='ballista'?'Balista rompeasedios':state.warPlan==='ward'?'Égida rúnica':state.warPlan==='hospital'?'Hospital de campaña':'—'}\nFragmentos restantes: ${state.ashFragments||0}\nTécnicas usadas: ${m.techniqueUses||0}\nArmaduras rotas: ${m.armorBreaks||0}\nDaño absorbido por Égida: ${m.shieldAbsorbed||0}\nCuración del Hospital: ${m.fieldHealing||0}\nGancho del Capítulo III visto: ${state.hookSeen?'Sí · '+duration(m.hookSeenSeconds):'No'}\nCartas descubiertas: ${(state.cardsDiscovered||[]).length} / 5\nCartas conservadas: ${(state.cardsOwned||[]).length}\nCartas consumidas: ${(state.cardsConsumed||[]).length}\nCartas obtenidas durante el recorrido: ${m.cardDrops||0}\nUsos de cartas: ${m.cardsUsed||0}\nDecisiones de conservación: ${m.cardsKept||0}\nIndestructibles obtenidas: ${m.indestructibleFound||0}\nAviso de Duelo visto: ${m.duelPromptSeen?'Sí':'No'}\nDuelos jugados: ${state.duelStats.games||0} · Victorias: ${state.duelStats.wins||0}\nReliquia equipada: ${state.relicEquipped?'Eco del Primer Rey':'—'}\nTercera expedición: ${state.thirdVictory?'Completada':'—'}\n¿Jugaría 10 minutos más?: ${state.continueIntent==='yes'?'Sí':state.continueIntent==='maybe'?'Quizá':state.continueIntent==='no'?'No':'—'}\nEntendió sin ayuda: ${a.understood||'—'}\nRitmo percibido: ${a.pacing||'—'}\nAldric/Orin ayudaron: ${a.guides||'—'}\nComprensión de héroes: ${a.heroes||'—'}\nComprensión de colección/cartas: ${a.cards||'—'}\nComprensión del Duelo: ${a.duel||'—'}\nInterés por mundo global/PvP: ${a.world||'—'}\nParte favorita: ${a.best||'—'}\nMomento confuso: ${a.confusing||'—'}\nPrimera mejora propuesta: ${a.change||'—'}\nBug o problema visual: ${a.bug||'—'}\nMotivo para continuar/dejarlo: ${a.why||'—'}\nMundo 4X: ${state.world4x?.complete?'Completado':'No completado'} · Corrupción ${state.world4x?.corruption??34}% · Tendencia ${state.world4x?.trend||'Equilibrio'}\nMapa: motivo para mejorar=${state.world4x?.answers?.motive||'—'} · explorar más=${state.world4x?.answers?.explore||'—'} · PvP recursos=${state.world4x?.answers?.pvp||'—'}\nMapa · interés: ${state.world4x?.answers?.best||'—'}\nTiempo total: ${duration(m.completedSeconds)}`; }
  function showPlaytestSummary(){
    const m=state.metrics, defense=m.heavyGuards>0?'Comprendió la defensa contextual':'No defendió ningún golpe brutal';
    openModal('Informe de la expedición',`<p class="privacy-note">Estos datos permanecen en este dispositivo. No se envía información por Internet.</p><div class="playtest-stats"><div><b>${duration(m.completedSeconds)}</b><small>Tiempo total</small></div><div><b>${fmt(powerBreakdown().total)}</b><small>Poder Total</small></div><div><b>${m.combatTurns}</b><small>Turnos</small></div><div><b>${m.heavyGuards}</b><small>Defensas oportunas</small></div></div><p><strong>${defense}</strong><br>Elección: ${m.riftChoice==='contain'?'Forjar el Gran Sello':'Desatar la Brecha'}</p><textarea id="report-text" readonly>${powerReportLines()}${reportText()}</textarea><p class="privacy-note"><strong>Para el tester:</strong> pulsa Copiar informe y envíaselo a la persona que te facilitó esta prueba.</p><button id="copy-report" class="primary">Copiar informe para enviar</button>`);
    $('#copy-report').onclick=copyReport;
  }
  function copyReport(){ const field=$('#report-text'),done=()=>toast('Resumen copiado.'); if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(field.value).then(done).catch(()=>{field.select();document.execCommand('copy');done();}); else{field.select();document.execCommand('copy');done();} }
  function showMenu(){
    openModal('Eldoria',`<div class="menu-profile"><div class="profile-avatar">${state.profile.avatar}</div><div><small>GUARDIÁN DE VALORIA</small><h3>${safeText(state.profile.name)}</h3><p>v0.21.0 · Poder ${fmt(powerBreakdown().total)}</p></div></div><div class="menu-grid"><button id="open-profile" class="secondary">Perfil</button><button id="open-rankings" class="secondary">Clasificaciones</button><button id="open-archive" class="secondary">Códice de Reliquias · ${(state.cardsDiscovered||[]).length}/5</button><button id="open-menu-duel" class="secondary">${state.duelUnlocked?'Duelo de Reliquias':'Duelo bloqueado'}</button><button id="open-world-map" class="secondary">Mapa global · prueba 4X</button><button id="menu-language" class="secondary">Idioma · ${state.language==='en'?'English':'Español'}</button></div>${state.complete?'<button id="view-report" class="primary">Ver informe de prueba</button>':''}<button id="restart" class="text-button">Reiniciar partida</button>`);
    $('#open-profile').onclick=showProfile;$('#open-rankings').onclick=()=>showRankings();if($('#open-world-map'))$('#open-world-map').onclick=()=>{closeModal();showWorldMap();};if($('#menu-language'))$('#menu-language').onclick=toggleLanguage;$('#open-archive').onclick=cardsModal;$('#open-menu-duel').onclick=()=>state.duelUnlocked?openDuel():toast(`Recupera 5 reliquias para abrir el Duelo (${state.cardsDiscovered.length}/5).`);
    if($('#view-report'))$('#view-report').onclick=showPlaytestSummary;
    $('#restart').onclick=()=>{['eldoria-save-v0195','eldoria-v020-ch1-intro','eldoria-aldric-story-r7-v3','eldoria-v0201-ux'].forEach(k=>localStorage.removeItem(k));location.reload();};
  }
  const languageObserver=new MutationObserver(mutations=>{if(state.language!=='en')return;for(const m of mutations)for(const n of m.addedNodes){if(n.nodeType===1)translateTree(n);else if(n.nodeType===3)n.nodeValue=translateText(n.nodeValue);}});languageObserver.observe(document.body,{subtree:true,childList:true});
  init();
})();

function resolve(id,a){a.remove();let t,r,c;if(id==='forest'){let load=Math.min(360,s.forestRemain);s.forest++;s.forestRemain-=load;s.wood+=load;t='CARGAMENTO DE MADERA';r='+'+load+' madera · quedan '+s.forestRemain;c='Los carros regresan a Valoria. El nodo permanece mientras conserve reservas.'}else if(id==='quarry'){let load=Math.min(700,s.quarryRemain);s.quarry++;s.quarryRemain-=load;s.stone+=load;t='CARGAMENTO DE PIEDRA';r='+'+load+' piedra · quedan '+s.quarryRemain;c='La cantera permanece disponible mientras conserve reservas.'}else if(id==='wolf'){s.wolves++;s.food+=140;t='CAZA COMPLETADA';r='+140 comida';c='Los lobos han sido abatidos. La carne vuelve a Valoria; la victoria no genera Poder.'}else if(id==='boar'){s.boars++;s.food+=190;t='CAZA COMPLETADA';r='+190 comida';c='El jabalí ha caído. La expedición obtiene alimento, no Poder.'}else if(id==='camp'){s.camp=1;s.wood+=90;s.stone+=55;s.lyraXp+=0;t='VICTORIA';r='+90 madera · +55 piedra';c='Los Guardias resolvieron el choque sobre el mapa. El enemigo deja botín, pero no crea Poder.<br><br><i>«Fuera de estas murallas está todo lo que Valoria perdió. Y también aquello que la destruyó.» — Aldric</i>'}else{s.boss=1;s.stone+=300;s.lyraXp+=80;t='FISURA SOMETIDA';r='+300 piedra · +80 XP Lyra';c='La Fisura cae, pero la corrupción no se disipa: retrocede, como si hubiera sentido la derrota.<br><br><i>«Eso no era una bestia defendiendo su guarida. La Brecha está reaccionando a nosotros.» — Aldric</i>'}save();render();popup(t,c+'<br><br><b>'+r+'</b>','CONTINUAR',()=>{if(id==='camp'){s.view='kingdom';save();render()}if(id==='boss'){s.view='kingdom';save();render()}})}
function upgrade(n){if(n===4&&(s.wood<850||s.stone<700||s.food<300))return popup('AÚN NO','Bastión IV exige 850 madera, 700 piedra y 300 comida.');if(n===5&&(s.wood<1100||s.stone<900||s.food<500))return popup('AÚN NO','Bastión V exige 1.100 madera, 900 piedra y 500 comida.');if(n===2&&!need2())return popup('AÚN NO','Necesitas 450 madera, 300 piedra y haber despejado a los Corruptos.');if(n===3&&!need3())return popup('AÚN NO','Bastión III exige 650 madera, 500 piedra, Lyra y haber sometido la Fisura III. El Poder no es un requisito.');if(n===4)return timedAction('ELEVANDO BASTIÓN IV',16,()=>{s.wood-=850;s.stone-=700;s.food-=300;s.power+=1150;s.bastionLevel=4;save();cinema('🏯','BASTIÓN IV','Valoria amplía murallas, almacenes y capacidad. Este nivel no abre un sistema nuevo todavía.','SIGUIENTE META · Bastión V','CONTINUAR',()=>{s.view='kingdom';save();render()})},'La ampliación continúa sin detener el resto del reino.','build-bastion4','keep');if(n===5)return timedAction('ELEVANDO BASTIÓN V',18,()=>{s.wood-=1100;s.stone-=900;s.food-=500;s.power+=1500;s.bastionLevel=5;save();cinema('🏯','BASTIÓN V','Valoria alcanza una nueva escala de producción.','NUEVO DESBLOQUEO · Cantera de Valoria','VOLVER A VALORIA',()=>{s.view='kingdom';save();render()})},'Valoria prepara su quinto nivel de fortificación.','build-bastion5','keep');if(n===2){return timedAction('RECONSTRUYENDO BASTIÓN II',10,()=>{s.wood-=450;s.stone-=300;s.power+=520;s.bastion=2;s.bastionLevel=2;save();cinema('🏰','BASTIÓN II','Las murallas vuelven a levantarse. Por primera vez desde la caída, vuelven a encenderse fuegos sobre las torres.<br><br><i>«Anoche protegíamos ruinas. Hoy volvemos a tener algo que defender.» — Aldric</i>','NUEVO DESBLOQUEO · Cuartel disponible para construir','VOLVER A VALORIA',()=>{s.view='kingdom';save();render()})},'Canteros y guardias trabajan para devolver el corazón de Valoria a la vida.','build-bastion2','keep')}else{return timedAction('ELEVANDO BASTIÓN III',14,()=>{s.wood-=650;s.stone-=500;s.power+=900;s.bastion3=true;s.bastionLevel=3;s.chapter=3;save();cinema('🏯','BASTIÓN III','Valoria ya no es una ruina que sobrevive. Los caminos vuelven a llenarse y las murallas empiezan a parecer las de un reino.<br><br><i>«Reconstruir no basta. Si queremos que esto perdure, Valoria tendrá que volver a sostener a su gente.» — Aldric</i>','NUEVO DESBLOQUEO · Granero<br>La frontera puede explorarse más allá: arrastra el mismo mapa para descubrir caza y comida.','VOLVER A VALORIA',()=>{s.view='kingdom';save();render();popup('NUEVA ECONOMÍA','Bastión III ha desbloqueado el Granero y una frontera más amplia dentro del mismo mapa. Construye el Granero y desplaza el mundo para encontrar animales y nodos de carne.')})},'La nueva fortaleza exige más tiempo, piedra y manos. En el slice el tiempo está comprimido.','build-bastion3','keep')}}
function discoverLyra(){if(document.querySelector('.e22-cinema'))return;cinema('🏹','LYRA · ARQUERA DE CENIZA','Entre la ceniza, Aldric encuentra a una arquera observando la Fisura.<br><br><b>Lyra:</b> «Si pensabas entrar ahí solo, llegarías hasta donde llegaron los demás.»<br><br><b>Aldric:</b> «Entonces dime qué has visto.»<br><br><b>Lyra:</b> «No se abre al azar. Respira. Y cuando exhala, puede sangrar.»<br><br>Aldric comprende que la Brecha no es solo una herida: <b>algo al otro lado parece responder.</b>','NUEVO HÉROE · especialista contra la Brecha','RECLUTAR A LYRA',()=>{s.lyra=true;s.power+=430;save();s.view='heroes';render();cinema('🏹','LYRA SE UNE A VALORIA','<b>Aldric:</b> «Valoria necesita gente que sepa mirar donde nosotros solo vemos oscuridad.»<br><br><b>Lyra:</b> «Entonces deja de mirar la Brecha como una puerta. Empieza a mirarla como a un enemigo.»','La Fisura III ya puede ser enfrentada','VOLVER A LA FISURA',()=>{s.view='world';save();render()})})}
function cinema(icon,title,copy,next,button,cb){let m=document.createElement('div');m.className='e22-overlay e22-cinema';m.innerHTML='<div class="e22-dialog"><div class="big">'+icon+'</div><h1>'+title+'</h1><p>'+copy+'</p><div class="next">'+next+'</div><button class="btn">'+button+'</button></div>';document.body.appendChild(m);m.querySelector('button').onclick=()=>{m.remove();render();if(cb)cb()}}
function qaAssertions(){let issues=[];const req=(ok,msg)=>{if(!ok)issues.push(msg)};req(typeof buildingAction==='function','buildingAction missing');req(typeof gather==='function','gather missing');req(typeof march==='function','march missing');req(typeof opening==='function'&&typeof aldricIntro==='function','opening sequence missing');req(!document.getElementById('v020-chapter1-intro'),'legacy intro present');let keep=s.selectedAction;s.selectedAction='sawmill';req(/data-building-action="sawmill"/.test(buildingAction('sawmill')),'sawmill action not rendered');s.selectedAction=keep;req(typeof selectNode==='function'&&typeof actionPanel==='function','world contextual actions missing');req(Array.isArray(s.codex)&&Array.isArray(s.inventory),'collections invalid');req(typeof configureMarch==='function'&&typeof marchTrial==='function'&&typeof finalAssault==='function','late progression actions missing');return {ok:issues.length===0,issues}}function qaState(name){const base=fresh(),states={start:base,sawmill:{...base,sawmill:true,wood:700,stone:500},world:{...base,sawmill:true,forest:1,quarry:1,view:'world'},lyra:{...base,bastionLevel:2,bastion:2,sawmill:true,forest:1,quarry:1,camp:1,lyra:true,boss:true},forge:{...base,bastionLevel:6,bastion:2,sawmill:true,barracks:true,granary:true,graniteQuarry:true,lyra:true,boss:true,forge:true},endgame:{...base,bastionLevel:10,bastion:2,sawmill:true,barracks:true,granary:true,graniteQuarry:true,lyra:true,boss:true,forge:true,devourerDefeated:true,maelis:true,narethRescued:true,marchConfigured:true,marchSlots:['aldric','maelis'],trialWon:true}};if(!states[name])throw new Error('Unknown QA state: '+name);s={...states[name],lastPassiveAt:Date.now(),tasks:[]};save();render();return JSON.parse(JSON.stringify(s))}
let liveResourceSave=0;setInterval(()=>{accruePassive();let bars=root.querySelectorAll('.res>span b');if(bars[0])bars[0].textContent=fmt(s.wood);if(bars[1])bars[1].textContent=fmt(s.stone);if(s.bastion3&&bars[2])bars[2].textContent=fmt(s.food);if(Date.now()-liveResourceSave>5000){liveResourceSave=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}},500);
if(new URLSearchParams(location.search).get('qa')==='1'){s.introSeen=true;document.querySelectorAll('.aldric-cinematic,.e22-overlay').forEach(x=>x.remove())}window.ELDORIA_V023={version:'0.23.26',assert:qaAssertions,loadState:qaState,qa:()=>({need2:need2(),need3:need3(),powerSources:'buildings+troops+heroes+collection',foodUnlock:'bastion3-granary+hunting',worldExpansion:'single-pannable-map',bastion4Unlock:'none',bastion5Unlock:'stoneworks-passive',stonePerSecond:passiveStoneRate(),rankingUnlock:'bastion5-stoneworks',progressiveUI:true,visualTier:'bastion-driven',barracksUnlock:'bastion2-build-required',bastion2PowerGate:false,bastion3PowerGate:false,overlaySystem:'e22-overlay-v3',bastion:s.bastionLevel,forge:s.forge,aether:s.aetherEmber,maelis:s.maelis,marchConfigured:s.marchConfigured,trialWon:s.trialWon,finalWon:s.finalWon,visualRecoveryBase:'f139968c',unityMigrationReady:true}),advanceEconomy:(seconds=0)=>{const n=Math.max(0,Math.min(3600,Number(seconds)||0));s.lastPassiveAt-=n*1000;accruePassive();save();render();return JSON.parse(JSON.stringify(s))},reset:()=>{localStorage.removeItem(KEY);localStorage.removeItem('eldoria-v020-ch1-intro');localStorage.removeItem('eldoria-aldric-story-r7-v3');sessionStorage.setItem('eldoria-v022-reset','1');location.reload()},state:()=>{recoverFinishedTasks();return JSON.parse(JSON.stringify(s))},setQA:(patch={})=>{Object.assign(s,patch);save();render();return JSON.parse(JSON.stringify(s))}};window.ELDORIA_V022=window.ELDORIA_V023;render();if(!s.introSeen)setTimeout(opening,250);
})();
