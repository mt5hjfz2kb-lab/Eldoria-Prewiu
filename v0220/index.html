/* v0.2: orientación inequívoca en la transición reino → mundo */
.gate.objective{box-shadow:0 0 0 0 #d6b66f88,0 0 24px #d6b66f66;animation:objectivePulse 1.6s infinite}
.gate.objective em{position:absolute;bottom:100%;margin-bottom:8px;background:#d6b66f;color:#17140d;padding:5px 9px;font:bold 9px Arial;font-style:normal;letter-spacing:.12em;white-space:nowrap}
.gate.objective i{position:absolute;right:-19px;font-size:34px;color:var(--gold);animation:nudge 1s infinite}
.scene-enter{animation:sceneEnter .7s}
.location-title{position:absolute;z-index:8;top:25px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}
.location-title small{display:block;font:9px Arial;letter-spacing:.24em;color:var(--gold)}
.location-title strong{font-size:23px;font-weight:normal}
.path i{position:absolute;left:48%;width:8px;height:8px;border-radius:50%;background:#e0c879;box-shadow:0 0 10px #efdc95}
.path i:nth-child(1){bottom:34%}.path i:nth-child(2){bottom:48%;transform:scale(.8)}.path i:nth-child(3){bottom:60%;transform:scale(.6)}
.enemy .objective-arrow{font:9px Arial;color:#17140d;text-shadow:none;background:#d6b66f;padding:5px 8px;margin:0 auto 5px;animation:arrowBounce 1s infinite}
@keyframes sceneEnter{from{opacity:.2;filter:brightness(.2);transform:scale(1.04)}}
@keyframes objectivePulse{50%{box-shadow:0 0 0 12px #d6b66f00,0 0 38px #d6b66f99}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes arrowBounce{50%{transform:translateY(-4px)}}

/* v0.3: combate táctico y consecuencia de La Brecha */
.enemy-intent{margin:18px auto 8px;padding:7px 10px;width:max-content;max-width:100%;background:#27251e;border:1px solid #d6b66f55;font:bold 10px Arial;letter-spacing:.08em;color:#d7caa5}
.enemy-intent.heavy{background:#401d22;border-color:#d86060;color:#ffaaaa;animation:warningPulse .7s infinite}
.combat-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.combat-actions .action{min-height:66px;border:1px solid #ffffff24;background:#1b2227;cursor:pointer;padding:8px}
.combat-actions .action b,.combat-actions .action small{display:block}.combat-actions .action small{margin-top:5px;font:9px Arial;color:#aaa}
.combat-actions .attack-action{border-color:#b65d54}.combat-actions .guard-action{border-color:#6e91a8}.combat-actions .rift-action{border-color:#a64fd0;background:#28182f}.combat-actions .action:disabled{opacity:.35}
.enemy-intent b,.enemy-intent span{display:block}.enemy-intent span{margin-top:5px;font:9px Arial;letter-spacing:.12em}
.combat-actions .guard-action.recommended{background:#244b52;border:2px solid #8fd4d0;box-shadow:0 0 0 0 #8fd4d088,0 0 22px #67bdc477;animation:defendNow 1s infinite}
.combat-actions .guard-action.recommended small{color:#bffffa}.combat-actions .attack-action.risky{opacity:.62;background:#31191b}.combat-actions .attack-action.risky small{color:#ff9c9c}
.rift-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.rift-choices .choice{min-height:115px;padding:15px;border:1px solid;background:#171d21;cursor:pointer}.rift-choices b,.rift-choices small{display:block}.rift-choices b{font-size:17px}.rift-choices small{margin-top:10px;font:11px/1.4 Arial;color:#bbb}.rift-choices .contain{border-color:#72af9b}.rift-choices .exploit{border-color:#b94ce9;background:#27172d}
.rift-choices .choice>span{display:block;font-size:45px;margin-bottom:10px}.rift-choices .contain>span{color:#91dbc3;text-shadow:0 0 18px #50c9a4}.rift-choices .exploit>span{color:#dc87ff;text-shadow:0 0 18px #c13ef6}.rift-choices .choice:hover{transform:translateY(-3px);filter:brightness(1.18)}
.contained-card{border-color:#6fb39c;background:radial-gradient(circle at 50% 30%,#285f58,#142523 67%)}.contained-card span{color:#9de1c7;text-shadow:0 0 25px #58d1ad}
.kingdom-scene.rift-exploit:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 62% 75%,#9f2fff32,transparent 32%);box-shadow:inset 0 0 70px #8e24b82e}
.kingdom-scene.rift-contain:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 72% 72%,#65c49b24,transparent 32%)}
@keyframes warningPulse{50%{filter:brightness(1.5)}}
@keyframes defendNow{50%{box-shadow:0 0 0 7px #8fd4d000,0 0 30px #67bdc499;transform:translateY(-2px)}}
@media(max-width:560px){.combat-actions{grid-template-columns:1fr}.combat-actions .action{min-height:48px}.rift-choices{grid-template-columns:1fr}.rift-choices .choice{min-height:80px}}

/* v0.6: informe local de playtest */
.privacy-note{font-size:11px!important;color:#8eb7a6!important;text-align:center}.playtest-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}.playtest-stats div{background:#0d1215;border:1px solid #ffffff16;padding:12px 6px;text-align:center}.playtest-stats b,.playtest-stats small{display:block}.playtest-stats b{font-size:18px;color:var(--gold)}.playtest-stats small{margin-top:5px;font:9px Arial;color:#aaa}#report-text{width:100%;min-height:145px;resize:none;background:#090d10;color:#bfc5bf;border:1px solid #ffffff20;padding:12px;font:11px/1.5 monospace}@media(max-width:520px){.playtest-stats{grid-template-columns:1fr 1fr}}

/* v0.6.1: controles resistentes a resoluciones y zoom diferentes */
.topbar,.resources,.resource,.bottom-nav button,.modal,.combat-actions>*{min-width:0}
.resource span{overflow:hidden;text-overflow:ellipsis}.bottom-nav button{overflow:hidden}
.modal button{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.combat-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.rift-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.realm-title{max-width:150px;overflow:hidden}.realm-title strong,.realm-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gate{right:3%;bottom:5%}.quest-panel{max-width:58vw}.modal h2{font-size:20px}.costs{flex-wrap:wrap}}
@media(max-width:560px){.combat-actions,.rift-choices{grid-template-columns:1fr}.combat-actions .action,.rift-choices .choice{height:auto;min-height:56px}.modal{max-height:92vh}}
@media(max-height:680px){.modal{max-height:94vh;padding:18px}.modal h2{margin-bottom:12px}.combatant span{font-size:42px}.combat-actions .action{min-height:48px}.enemy-intent{margin:10px auto 5px}.bottom-nav{height:64px}.scene{bottom:64px}}

/* v0.7: premisa clara y guía contextual paso a paso */
.intro-mark{width:74px;height:74px;margin:0 auto 18px;display:grid;place-items:center;clip-path:polygon(50% 0,92% 20%,84% 83%,50% 100%,16% 83%,8% 20%);background:linear-gradient(135deg,#6b5730,#211b11);color:var(--gold);font-size:48px}.intro-lead{text-align:center;font-size:16px!important;line-height:1.55!important}.intro-dialogue{margin-top:20px;padding-top:18px;border-top:1px solid #ffffff18}.intro-dialogue p{font-size:14px}.building.objective{z-index:14;animation:buildingGuide 1.4s infinite}.building.objective em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;background:var(--gold);color:#17140d;padding:5px 8px;font:bold 9px Arial;font-style:normal;white-space:nowrap}.bottom-nav button.objective{color:#f4dc9a;background:#6a522f;box-shadow:inset 0 0 20px #d6b66f55;animation:navGuide 1.3s infinite}.effectline{display:grid;gap:6px;margin-top:10px;padding:10px;background:#0d1216;border:1px solid #ffffff13;font:11px/1.35 Arial}.effectline span{color:#aaa}.effectline strong{color:#a7d4ad}@keyframes buildingGuide{50%{filter:drop-shadow(0 0 18px #f1cf73);transform:translate(-50%,-55%) scale(1.06)}}@keyframes navGuide{50%{box-shadow:inset 0 0 28px #d6b66f99;filter:brightness(1.2)}}

.world-mist{position:absolute;z-index:4;inset:0;pointer-events:none;overflow:hidden}.world-mist i{position:absolute;left:-20%;width:140%;height:18%;border-radius:50%;background:#aeb9be12;filter:blur(18px);animation:worldMist 12s ease-in-out infinite alternate}.world-mist i:nth-child(1){bottom:8%}.world-mist i:nth-child(2){bottom:30%;animation-delay:-5s}.world-mist i:nth-child(3){top:31%;opacity:.5;animation-delay:-8s}
.moon{background:radial-gradient(circle at 35% 35%,#fff5d7,#b9b8ac 55%,#626a70);box-shadow:0 0 70px #d9e1cf50;filter:drop-shadow(0 0 8px #fff8)}
.corruption{background:radial-gradient(circle at 72% 30%,#9f2bc47d,transparent 24%),linear-gradient(150deg,#1d2924,#101317);filter:drop-shadow(0 -10px 22px #000)}
.path{filter:drop-shadow(0 0 12px #000)}.path i{animation:pathSpark 1.8s ease-in-out infinite}.path i:nth-child(2){animation-delay:.3s}.path i:nth-child(3){animation-delay:.6s}
.enemy{filter:drop-shadow(0 12px 10px #000)}.enemy>span:not(.objective-arrow){animation:enemyIdle 2.4s ease-in-out infinite}.enemy b,.enemy em{background:linear-gradient(90deg,#08060bdd,#1d0e25f2,#08060bdd);border-left:1px solid #b650dd55;border-right:1px solid #b650dd55}

/* Pantallas menos planas */
.overlay{background:radial-gradient(circle at 50% 35%,#25303c99,#030507e8 58%);backdrop-filter:blur(8px) saturate(.8)}

/* Movimiento */
@keyframes resourceSheen{0%,75%{transform:translateX(-130%)}90%,100%{transform:translateX(140%)}}
@keyframes mistDrift{to{transform:translateX(5%) scaleY(1.15)}}
@keyframes emberRise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(25px,-250px);opacity:0}}
@keyframes buildingRise{0%{transform:translate(-50%,-35%) scale(.75);opacity:.4}55%{transform:translate(-50%,-58%) scale(1.16)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes aldricAura{50%{transform:translateX(-50%) scale(1.25);opacity:.55}}
@keyframes questGlow{50%{filter:brightness(1.8);box-shadow:0 0 12px #ffd66b}}
@keyframes riftCore{to{filter:brightness(1.35);transform:rotate(4deg) scaleX(.5) scaleY(1.04)}}
@keyframes riftHalo{50%{opacity:.25;transform:rotate(12deg) scaleX(.63) scaleY(1.08)}}
@keyframes riftHalo{50%{opacity:.25;transform:rotate(12deg) scaleX(.63) scaleY(1.08)}}
@keyframes worldMist{to{transform:translateX(12%) scaleY(1.25)}}
@keyframes pathSpark{50%{filter:brightness(1.8);box-shadow:0 0 18px #ffe69a}}
@keyframes enemyIdle{50%{transform:translateY(-6px);filter:brightness(1.25)}}
@keyframes modalRise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes buttonSheen{0%,72%{transform:translateX(-140%)}88%,100%{transform:translateX(140%)}}
@keyframes rewardRays{to{transform:rotate(360deg)}}
@keyframes rewardCardEnter{0%{opacity:0;transform:translateY(32px) scale(.72)}65%{transform:translateY(-5px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes cardGlint{0%,45%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@keyframes resourcePop{0%{opacity:0;transform:translateX(35px) scale(.9)}15%{opacity:1;transform:none}75%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-28px)}}
@keyframes takeHit{20%{transform:translateX(-8px);filter:brightness(2)}45%{transform:translateX(7px)}70%{transform:translateX(-3px)}}
@keyframes skillHit{15%{transform:scale(1.12);filter:brightness(2.4)}45%{transform:translateX(12px) rotate(2deg)}70%{transform:translateX(-8px) rotate(-1deg)}}
@keyframes damageFloat{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-45px) scale(.9)}}
@keyframes skillFlash{from{opacity:0;transform:translateX(-50%)}40%{opacity:1}to{opacity:0;transform:translateX(50%)}}
@keyframes skillReady{50%{filter:brightness(1.25);box-shadow:0 0 35px #d05fff99}}
@media(max-width:720px){.kingdom-silhouette{height:64%}.character{left:58%;bottom:13%}.character-label{min-width:130px}.resource-feedback{top:118px;right:8px}.resource-feedback span{min-width:140px}.quest-panel{backdrop-filter:blur(4px)}}

.auto-side.striking{animation:heroLunge .42s cubic-bezier(.2,.8,.3,1)}
.auto-clash{z-index:4;font-size:42px;color:#ffe09b}.auto-clash.bursting{animation:clashBurst .42s}
.auto-skill:not(:disabled){background:linear-gradient(180deg,#7c368e,#3a174a);border-color:#ed98ff;box-shadow:0 0 24px #c63be988,inset 0 1px #fff3;animation:skillSummon 1s infinite alternate}
.charge-track{height:11px;border-color:#66d8ef;box-shadow:inset 0 2px 6px #000}.charge-track i{box-shadow:0 0 13px #56e9ff}
.damage-number{font-size:30px;-webkit-text-stroke:1px #360506}
.reward-modal{border-width:2px}
.reward-card,.second-reward{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:

.reward-card .rarity{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:5px 18px;letter-spacing:.22em;background:#b37a30;color:#fff5d5;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%)}
.second-reward:before{content:"RECOMPENSA DE EXPEDICIÓN";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:max-content;color:#f1d58a;font:700 9px Arial;letter-spacing:.22em}
.victory-impact-overlay{background:
 radial-gradient(circle at 50% 47%,#9b5d274f 0,transparent 26%),
 radial-gradient(circle,#30210e 0,#0c0a08 48%,#020405 78%)}
.victory-impact-overlay.victory-second{background:radial-gradient(circle at 50% 42%,#a540a45c,#160b1b 43%,#020405 78%)}
.victory-impact-overlay.victory-third{background:radial-gradient(circle at 50% 42%,#26759e66,#08131b 43%,#020405 78%)}
.victory-impact:before{content:"";position:absolute;left:50%;top:42%;width:210px;height:210px;border:1px solid #f1cb6b77;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 60px #eebc4860,inset 0 0 45px #eebc4833;animation:victorySeal 2.8s infinite}
.victory-impact strong{position:relative;font-size:38px;letter-spacing:.05em}.victory-impact b{position:relative;border:1px solid #d9b75b;padding:8px 18px}
.primary{position:relative;overflow:hidden;letter-spacing:.08em}.primary:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff4 48%,transparent 66%);transform:translateX(-130%);animation:buttonSheen 4s infinite}
@keyframes windowFlicker{50%{opacity:.48;filter:brightness(.7)}}
@keyframes veinPulse{to{opacity:.25;filter:blur(1px);transform:translateX(-7px) scaleY(1.04)}}
@keyframes structureAscend{0%{transform:translateY(16px) scale(.72);opacity:.3}60%{transform:translateY(-8px) scale(1.12)}100%{transform:none}}
@keyframes sceneCinematic{0%{opacity:0;filter:brightness(.25) blur(4px);transform:scale(1.045)}100%{opacity:1;filter:none;transform:none}}
@keyframes battleSweep{0%,25%{transform:translateX(-65%)}80%,100%{transform:translateX(65%)}}
@keyframes shieldBreathe{to{transform:scale(1.05);opacity:.68}}
@keyframes heroLunge{35%{transform:translateX(34px) scale(1.12);filter:brightness(1.8)}70%{transform:translateX(-4px)}}
@keyframes clashBurst{35%{transform:scale(1.9) rotate(12deg);filter:brightness(2.5)}100%{transform:none}}
@keyframes skillSummon{to{filter:brightness(1.25);box-shadow:0 0 38px #d45fff}}
@keyframes relicHover{50%{transform:translateY(-8px) scale(1.04);filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 42px #d35aff)}}
@keyframes victorySeal{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.58}}
@media(max-width:720px){
  .version-badge{position:absolute;top:70px;right:9px}
  .kingdom-silhouette{height:70%}.citadel-lights{left:31%;top:24%;width:38%}

  .building strong{margin-top:-4px;padding:4px 9px}
  .auto-battle{min-height:230px}.auto-side>span{font-size:62px}
  .rift-near{transform:scale(1.16)}
}

/* Códice, Duelo de Reliquias y feedback sistémico */

.rift:before{background:radial-gradient(ellipse,#fff 0 1%,#f6b2ff 3%,#d748ff 11%,#7b1caf 28%,#21042c 49%,#020205 68%);animation:riftCore 1.35s ease-in-out infinite alternate}

.recommended-mode{border-color:#d28df1!important;background:radial-gradient(circle at 50% 0,#71368d,#24122d 70%)!important;box-shadow:0 0 24px #b746d65c}.recommended-mode:before{content:"DIRECCIÓN PRINCIPAL";display:block;margin:-4px auto 5px;color:#f3c7ff;font:700 8px Arial;letter-spacing:.16em}
.card-collection{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}
.card-tile,.duel-hand-card{padding:0;border:0;background:transparent;color:inherit;cursor:pointer;min-width:0}.card-tile:hover .relic-card,.duel-hand-card:hover .relic-card{transform:translateY(-5px);filter:brightness(1.12)}
.relic-card{--rarity:var(--common);position:relative;width:160px;height:224px;padding:27px 14px 13px;overflow:hidden;border:2px solid var(--rarity);background:linear-gradient(155deg,#20272b,#080b0e 72%);box-shadow:0 13px 28px #000b,inset 0 0 28px #000;color:#f6f2e7;text-align:center;transition:.2s transform,.2s filter}
.relic-card:before{content:"";position:absolute;inset:5px;border:1px solid color-mix(in srgb,var(--rarity) 48%,transparent);clip-path:polygon(0 8%,8% 0,92% 0,100% 8%,100% 92%,92% 100%,8% 100%,0 92%)}
.relic-card:after{content:"";position:absolute;inset:-30%;background:linear-gradient(112deg,transparent 37%,#fff3 48%,transparent 59%);transform:translateX(-80%);animation:cardSurface 5s infinite}
.relic-card.uncommon{--rarity:var(--uncommon);background:linear-gradient(155deg,#193127,#070c0a 72%)}.relic-card.rare{--rarity:var(--rare);background:linear-gradient(155deg,#172d45,#070a0e 72%)}.relic-card.epic{--rarity:var(--epic);background:linear-gradient(155deg,#321942,#09060d 72%)}.relic-card.legendary{--rarity:var(--legendary);background:radial-gradient(circle at 50% 35%,#67451e,#120c07 67%)}.relic-card.echo{--rarity:#555;background:repeating-linear-gradient(135deg,#151719,#151719 8px,#0d0f10 8px,#0d0f10 16px);filter:saturate(0)}
.card-rarity{position:absolute;z-index:2;top:7px;left:50%;transform:translateX(-50%);color:var(--rarity);font:700 8px Arial;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}.relic-card h3{position:relative;z-index:2;margin:6px 0 4px;color:#fff;font:700 13px/1.15 Georgia,serif}.relic-card>small{position:relative;z-index:2;display:block;color:#d7d4ca;font:8px/1.3 Arial}

.art-rift strong{color:#f3bdff}.art-crown strong{color:#ffe09a}.art-banner strong{color:#e7c26e}.art-echo strong{color:#777}
.side{position:absolute;z-index:4;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--rarity);border-radius:50%;background:#06090c;color:#fff;font:700 11px Arial;box-shadow:0 0 9px #000}.side.north{top:25px;left:50%;transform:translateX(-50%)}.side.south{bottom:38px;left:50%;transform:translateX(-50%)}.side.east{right:5px;top:50%;transform:translateY(-50%)}.side.west{left:5px;top:50%;transform:translateY(-50%)}
.relic-card.compact{width:112px;height:158px;padding:21px 9px 8px}.relic-card.compact .card-illustration{width:62px;height:75px}.relic-card.compact .card-illustration strong{font-size:38px}.relic-card.compact h3{font-size:10px}.relic-card.compact>small{font-size:7px}.relic-card.compact .side{width:18px;height:18px;font-size:9px}.relic-card.compact .side.north{top:19px}.relic-card.compact .side.south{bottom:28px}
.relic-card.indestructible{--rarity:#fff0a5;border-color:#fff3b2;box-shadow:0 0 12px #fff,0 0 35px #eac45b,0 14px 30px #000}.relic-card.indestructible:after{background:conic-gradient(from 30deg,transparent,#fff7,transparent 12%,transparent 40%,#f6d87066,transparent 53%);animation:indestructibleHalo 3s linear infinite}.indestructible-mark{position:absolute;z-index:5;top:0;left:0;right:0;padding:3px;background:linear-gradient(90deg,#704d0c,#fff0a4,#704d0c);color:#1b1204;font:900 6px Arial;letter-spacing:.12em}
.collection-head{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.collection-head>div{padding:9px;border:1px solid #ffffff18;background:#080c10;text-align:center}.collection-head b,.collection-head small{display:block}.collection-head b{color:#f1d17b;font-size:18px}.collection-head small{font:8px Arial;color:#aaa}
.card-decision{display:grid;grid-template-columns:1fr auto;gap:13px;align-items:center;margin:14px 0;padding:14px;border:1px solid #bd6add;background:radial-gradient(circle at 80% 50%,#67257455,#11141a 68%);box-shadow:inset 0 0 32px #8d32a533}.card-decision h3{margin:3px 0;color:#fff}.card-decision p{font-size:11px}.card-decision-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card-detail{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}.card-lore>b{color:#d9b970;font:700 10px Arial;letter-spacing:.08em}.card-lore p{line-height:1.55}.text-button{width:100%;margin-top:10px;padding:9px;border:0;background:transparent;color:#bcb6a8;cursor:pointer;text-decoration:underline}
.duel-entry{margin:4px 0 14px}.duel-callout{display:grid;grid-template-columns:42px 1fr;text-align:left;align-items:center;box-shadow:0 0 26px #a943d555}.duel-callout>span{grid-row:1/3;font-size:30px;text-align:center}.duel-callout>b,.duel-callout>small{display:block}.duel-callout>small{color:#e4baf0;font-size:8px}.duel-note{color:#999!important;text-align:center;font-size:10px!important}.duel-unlock{text-align:center;padding:12px;border:1px solid #b45cce;background:radial-gradient(circle,#592065,#0b0e13 70%);box-shadow:0 0 35px #a93fc855}.duel-unlock>span{display:block;font-size:68px;color:#f0c8ff;text-shadow:0 0 24px #d14aff}.duel-unlock>small{color:#d795e9;letter-spacing:.16em}.duel-unlock h3{color:#fff}
.reward-reveal-stage{position:relative;padding:18px;text-align:center;background:radial-gradient(circle at 50% 42%,#78348955,transparent 43%);border:1px solid #a65dc1}.reward-reveal-stage>small{display:block;margin-bottom:10px;color:#edd493;font:700 9px Arial;letter-spacing:.2em}.reward-reveal-stage .relic-card{margin:auto;animation:cardReveal 1s cubic-bezier(.14,.84,.2,1.15)}.reward-reveal-stage>p{max-width:460px;margin:14px auto 0}

.card-use-impact,.conserve-impact{text-align:center}.card-use-impact .relic-card,.conserve-impact .relic-card{margin:auto}.card-use-impact>small{display:block;margin-top:12px;color:#e0c477;font:700 9px Arial;letter-spacing:.2em}.card-use-impact h3,.conserve-impact h3{color:#fff}.indestructible-use{padding:14px;border:1px solid #ffe596;background:#5b471622}.cooldown-orbit{margin:10px auto;padding:8px;border:1px solid #f1d578;color:#fce6a8;font:700 9px Arial;letter-spacing:.14em}

.duel-header{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:12px;margin-bottom:12px;text-align:center}.duel-header>div{padding:9px;border:1px solid #ffffff20;background:#080c10}.duel-header small,.duel-header b{display:block}.duel-header b{color:#f2d37f;font-size:24px}.duel-header p{margin:0!important;font-size:11px!important}.duel-header strong{color:#e8bdf7;letter-spacing:.08em}

.duel-cell .relic-card{width:100%;height:100%;padding:17% 6% 5%;box-shadow:none}.duel-cell .card-illustration{width:62%;height:58%;margin:0 auto}.duel-cell .card-illustration strong{font-size:34px}.duel-cell .relic-card h3{font-size:8px}.duel-cell .relic-card>small{display:none}.duel-cell .side{width:17px;height:17px;font-size:8px}.duel-cell .side.north{top:14%}.duel-cell .side.south{bottom:16%}

@keyframes systemFeedback{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-35px)}}
@keyframes riftLightning{to{filter:brightness(1.8);transform:rotate(3deg) scaleY(1.07)}}

function clearOverlays(){document.querySelectorAll('.e22-overlay,.aldric-cinematic').forEach(x=>x.remove());document.documentElement.style.overflow=''}
function openPower(){clearOverlays();let m=document.createElement('div');m.className='e22-overlay';m.innerHTML='<div class="e22-dialog powerCard"><small>RESUMEN DE DESARROLLO</small><h1>⚔ '+fmt(totalPower())+' PODER</h1><p><b>El Poder resume cuánto ha crecido Valoria; no decide por sí solo un combate.</b> La composición, las estadísticas de héroe, las tropas, el equipo y el tipo de objetivo siguen importando.</p><p><b>El Poder Total es la medida central del crecimiento de tu reino.</b> Sube al construir y mejorar Valoria, ampliar el ejército, desarrollar héroes, equiparlos y completar la colección. Te permite comparar el desarrollo global de tu cuenta con otros reinos y seguirá creciendo durante toda la partida.</p><p>El <b>Poder de Marcha</b> es diferente: mide únicamente la fuerza de la expedición que envías al mundo. Un reino puede tener mucho Poder Total y necesitar preparar mejor una marcha concreta.</p><div class="powerSplit"><span>🏰 Reino<b>'+fmt(Math.max(0,s.power-s.troops*18-(s.lyra?430:0)))+'</b></span><span>⚔ Ejército<b>'+fmt(s.troops*18)+'</b></span><span>⚜ Héroes<b>'+(s.lyra?'430':'0')+'</b></span></div>'+(s.rankUnlocked?'<button class="btn" data-rank-open>VER RANKING DE PODER</button>':'<p class="lockedHint">Sigue elevando el Bastión para descubrir quién más está reconstruyendo Eldoria.</p>')+'</div>';document.body.appendChild(m);let r=m.querySelector('[data-rank-open]');if(r)r.onclick=()=>{m.remove();openRanking()};m.onclick=e=>{if(e.target===m)m.remove()}}
function openRanking(){s.rankingSeen=true;save();clearOverlays();let me=totalPower(),rivals=[['Casa Varyn',Math.max(6200,me+1850)],['Orden del Alba',Math.max(5400,me+720)],['VALORIA · TÚ',me],['Bastión Nareth',Math.max(3100,me-640)],['Lobos de Khar',Math.max(2400,me-1320)]].sort((a,b)=>b[1]-a[1]);let rows=rivals.map((r,i)=>'<div class="rankRow '+(r[0].includes('TÚ')?'me':'')+'"><strong>#'+(i+1)+'</strong><span>'+r[0]+'</span><b>⚔ '+fmt(r[1])+'</b></div>').join('');let m=document.createElement('div');m.className='e22-overlay';m.innerHTML='<div class="e22-dialog rankingCard"><small>PRECURSOR DEL MUNDO COMPARTIDO</small><h1>RANKING DE PODER</h1><p>Este ranking anticipa uno de los ejes del 4X: comparar el crecimiento acumulado de Valoria con otros reinos del mundo compartido. <b>No mide quién ganaría un combate</b>; refleja desarrollo global — reino, ejército, héroes, equipo y colección. En el juego online los puestos pertenecerán a jugadores reales.</p><div class="rankingList">'+rows+'</div><button class="btn">VOLVER</button></div>';document.body.appendChild(m);m.querySelector('button').onclick=()=>m.remove()}
function openMenu(){clearOverlays();let m=document.createElement('div');m.className='e22-overlay';m.innerHTML='<div class="e22-dialog menuCard"><div class="menuHead"><div class="menuAvatar">♙</div><div><small>PERFIL DEL JUGADOR</small><h2 style="margin:3px 0">Señor de Valoria</h2><p style="margin:0">Bastión '+s.bastionLevel+' · Poder '+fmt(totalPower())+'</p></div></div><div class="menuActions"><button class="btn alt" data-close>VOLVER AL JUEGO</button>'+(s.finalWon?'<button class="btn" data-testid="open-playtest-summary">VER CIERRE Y ENCUESTA</button>':'')+'<button class="btn danger" data-reset>REINICIAR PARTIDA</button></div><p style="margin-top:12px">El progreso se guarda únicamente en este navegador. Reiniciar borra por completo esta sesión local.</p></div>';document.body.appendChild(m);m.querySelector('[data-close]').onclick=()=>m.remove();let end=m.querySelector('[data-testid="open-playtest-summary"]');if(end)end.onclick=openPlaytestComplete;m.querySelector('[data-reset]').onclick=()=>{clearOverlays();confirmReset()}}
function confirmReset(){clearOverlays();let m=document.createElement('div');m.className='e22-overlay';m.innerHTML='<div class="e22-dialog"><h1>¿REINICIAR VALORIA?</h1><p>Se borrará todo el progreso local de esta partida y volverás al comienzo del vertical slice.</p><button class="btn danger" data-yes>SÍ, REINICIAR</button><button class="btn alt" style="margin-top:8px" data-no>CANCELAR</button></div>';document.body.appendChild(m);m.querySelector('[data-no]').onclick=()=>m.remove();m.querySelector('[data-yes]').onclick=()=>{localStorage.removeItem(KEY);localStorage.removeItem('eldoria-v020-ch1-intro');localStorage.removeItem('eldoria-aldric-story-r7-v3');sessionStorage.setItem('eldoria-v022-reset','1');location.reload()}}
function guideDialogue(who,copy){if(document.querySelector('.e22-overlay,.aldric-cinematic'))return;if(who==='Sir Aldric'){dialogue('Sir Aldric',copy,()=>requestAnimationFrame(applyTutorialFocus));let d=document.querySelector('.aldric-cinematic[data-scene="aldric-state-dialogue"]');if(d)d.classList.add('tutorialAldric');return;}let full=String(copy||'').replace(/<[^>]+>/g,' '),m=document.createElement('div');m.className='aldric-cinematic tutorialDialogue';m.dataset.tutorial='1';m.innerHTML='<div class="aldric-dialogue narrator-dialogue"><div class="aldric-head"><div class="narrator-mark">✦</div><div><div class="aldric-name">LAS CENIZAS DE VALORIA</div><div class="aldric-role">Crónica de Eldoria</div></div></div><div class="aldric-copy"><div class="aldric-ghost"></div><div class="aldric-typed"></div></div><div class="aldric-wait">ESCUCHA…</div><button class="aldric-continue primary" type="button">Continuar</button></div>';document.body.appendChild(m);let box=m.querySelector('.aldric-dialogue'),ghost=m.querySelector('.aldric-ghost'),typed=m.querySelector('.aldric-typed'),btn=m.querySelector('.aldric-continue'),i=0;ghost.textContent=full;function finish(){i=full.length;typed.textContent=full;box.classList.add('done');btn.focus()}function type(){if(i>=full.length){finish();return}typed.textContent=full.slice(0,++i);setTimeout(type,full[i-1]==='.'?110:full[i-1]===','?55:20)}m.onclick=e=>{if(e.target===m&&!box.classList.contains('done'))finish()};btn.onclick=()=>{if(!box.classList.contains('done')){finish();return}m.remove();requestAnimationFrame(applyTutorialFocus)};type()}
function popup(title,copy,button='CONTINUAR',cb){let m=document.createElement('div');m.className='e22-overlay';m.innerHTML='<div class="e22-dialog"><h1>'+title+'</h1><p>'+copy+'</p><button class="btn">'+button+'</button></div>';document.body.appendChild(m);m.querySelector('button').onclick=()=>{m.remove();if(cb)cb()}}
function openChest(){clearOverlays();let m=document.createElement('div');m.className='e22-overlay';let items=s.inventory||[];m.innerHTML='<div class="e22-dialog inventoryCard"><button class="modalX" data-close aria-label="Cerrar">×</button><small>OBJETOS DE VALORIA</small><h1>🧰 ARCÓN</h1><p>El Arcón guarda <b>materiales, componentes y equipo</b>. Las cartas y reliquias pertenecen siempre al Códice.</p>'+(items.length?'<div class="inventoryGrid">'+items.map(x=>'<article class="itemCard" data-item="'+x.id+'"><div class="itemIcon">'+(x.type==='material'?'◆':x.slot?'⚔':'📦')+'</div><div><small>'+(x.type==='material'?'MATERIAL':x.slot?'EQUIPO':'OBJETO')+'</small><b>'+x.name+'</b><p>'+(x.copy||x.use||'Objeto recuperado jugando en Eldoria.')+'</p></div></article>').join('')+'</div>':'<p>El Arcón está vacío. Explora, caza y derrota amenazas para recuperar objetos.</p>')+'</div>';document.body.appendChild(m);m.querySelector('[data-close]').onclick=()=>m.remove()}
function openHeroHall(){clearOverlays();let hs=['aldric'].concat(s.lyra?['lyra']:[],s.maelis?['maelis']:[]),id=hs.includes(s.heroSelected)?s.heroSelected:'aldric',names={aldric:'Sir Aldric',lyra:'Lyra',maelis:'Maelis'},roles={aldric:'Guardián',lyra:'Ruptura',maelis:'Soporte'},gear=(s.equipped[id]||{}),items=s.inventory.filter(x=>x&&x.slot);let m=document.createElement('div');m.className='e22-overlay';m.innerHTML='<div class="e22-dialog heroHallCard"><button class="modalX" data-close aria-label="Cerrar">×</button><h1>SALÓN DE HÉROES</h1><p><b>'+names[id]+'</b> · '+roles[id]+'<br>Nivel '+(id==='lyra'?s.lyraLvl:id==='maelis'?s.maelisLvl:1)+'</p><p>Arma: <b>'+(gear.weapon?.name||'Vacía')+'</b><br>Armadura: <b>'+(gear.armor?.name||'Vacía')+'</b></p>'+(items.length?items.map((g,i)=>'<button class="btn" data-equip="'+i+'">EQUIPAR '+g.name+'</button>').join(''):'<p>El Arcón no contiene equipo utilizable.</p>')+'</div>';document.body.appendChild(m);m.querySelector('[data-close]').onclick=()=>m.remove();m.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let g=items[+b.dataset.equip],previous=s.equipped[id][g.slot];s.equipped[id][g.slot]=g;s.inventory=s.inventory.filter(x=>x!==g);if(previous)s.inventory.push(previous);save();m.remove();render();openHeroHall()})}
function unlockCodexMystery(){if(s.codexUnlocked)return;s.codexUnlocked=true;s.duelUnlocked=true;s.orusMet=true;if(!s.codex.some(x=>x&&x.id==='ash-sigil'))s.codex.push({id:'ash-sigil',name:'Sello de Ceniza',rarity:'Rara',quality:'Indestructible',values:{N:3,S:1,E:4,O:2},copy:'Una lámina oscura marcada con cuatro direcciones. Reacciona a la Brecha y conserva memoria de antiguos enfrentamientos.'});save();render();storySequence([['NARRADOR','Entre los restos recuperados de la frontera aparece una lámina que no pertenece al Arcón. Sus cuatro marcas cambian de brillo al acercarse al manuscrito.'],['Orus','No la guardéis con hierro y provisiones. Eso es una Reliquia. Las Reliquias recuerdan. Y algunas recuerdan cosas que este reino ha olvidado.'],['Sir Aldric','¿Quién eres?'],['Orus','Orus. Custodio de un juego mucho más antiguo que Valoria. Lo llamábamos Duelo de Reliquias. No abre la Brecha ni la explica... pero puede enseñarnos a leer lo que dejó atrás.']],()=>cinema('✦','PRIMERA CARTA — SELLO DE CENIZA','Rara · INDESTRUCTIBLE','Indestructible es una cualidad, no una rareza. La carta queda registrada en el Códice; nunca ocupa espacio del Arcón.','CÓDICE · DUelo de Reliquias','ABRIR CÓDICE',()=>{s.view='codex';save();render()}))}
function configureMarch(){if(!s.lyra&&!s.maelis)return popup('EXPEDICIÓN','Aldric aún no tiene especialistas disponibles.');clearOverlays();let m=document.createElement('div');m.className='e22-overlay';let a=heroStats('aldric');m.innerHTML='<div class="e22-dialog expeditionCard"><h1>CONFIGURAR EXPEDICIÓN</h1><p>Elige por <b>rol y estadísticas</b>, no solo por Poder. Aldric lidera con ATQ '+a.attack+' · DEF '+a.defense+' · APO '+a.support+'.</p>'+(s.lyra?'<button class="btn" data-partner="lyra">🏹 LYRA · daño/ruptura · ATQ '+heroStats('lyra').attack+'</button>':'')+(s.maelis?'<button class="btn" data-partner="maelis">✨ MAELIS · soporte/supervivencia · APO '+heroStats('maelis').support+'</button>':'')+'<div class="combatLegend"><span>🦌 Caza: alimento y materiales</span><span>☠ Amenaza: riesgo y botín especial</span><span>⚔ PvP: arquitectura reservada, aún no activa</span></div><button class="btn alt" data-close>CANCELAR</button></div>';document.body.appendChild(m);m.querySelector('[data-close]').onclick=()=>m.remove();m.querySelectorAll('[data-partner]').forEach(b=>b.onclick=()=>{let partner=b.dataset.partner;s.marchSlots=['aldric',partner];s.marchConfigured=true;save();m.remove();render();popup('EXPEDICIÓN PREPARADA','Aldric marchará con <b>'+(partner==='maelis'?'Maelis':'Lyra')+'</b> y '+s.troops+' tropas.<br>Fuerza estimada: <b>'+fmt(marchPower())+'</b>. La afinidad de roles puede importar más que una diferencia pequeña de Poder.')})}

function bastionNarrative(n){

      ['Sir Aldric','Los Corruptos no saquean, no ocupan y no huyen con botín. Aparecen donde la tierra está marcada. Eso significa que no vinieron a conquistar Valoria.'],
      ['NARRADOR','La primera amenaza deja una anomalía tras de sí. La caída empieza a parecer menos una invasión y más la consecuencia de algo que sigue activo.']

    3:[
      ['NARRADOR','Bastión III abre el mundo: Granero, comida, caza y una frontera más densa. Valoria puede alimentar expediciones más largas.'],
      ['Sir Aldric','Las bestias son parte de estas tierras. La Fisura no. Aprende a distinguir lo que pertenece al mundo de lo que la Brecha está cambiando.'],
      ['NARRADOR','Cerca de la Fisura aparecen huellas humanas. Allí espera Lyra, buscando a su hermano desaparecido y una respuesta que Valoria también necesita.']
    ],
    4:[
      ['NARRADOR','Bastión IV no trae una nueva estructura. Trae algo más importante: autonomía. Los edificios existentes pueden crecer al ritmo del Bastión y sostener una ciudad que ya no depende de una sola expedición.'],
      ['Sir Aldric','Una fortaleza grande con una economía débil solo tarda más en caer. Haz fuerte lo que ya hemos levantado antes de mirar más lejos.'],
      ['NARRADOR','El manuscrito de la Fisura permanece cerrado en el Arcón. Sus signos se repiten en las marcas encontradas desde la caída, pero todavía nadie puede leerlos.']
    ],
    5:[
      ['NARRADOR','La Cantera de Valoria convierte la piedra en producción estable. En las vetas más profundas, sin embargo, aparecen fragmentos que no reflejan la luz como ninguna roca conocida.'],
      ['Sir Aldric','La Brecha no solo corrompe criaturas. Está cambiando la materia. Guardad cualquier fragmento extraño; quizá la próxima guerra no pueda librarse con hierro ordinario.'],
      ['NARRADOR','Por primera vez, la reconstrucción y el misterio se unen: crecer permite llegar a materiales que antes no existían.']
    ],
    6:[
      ['NARRADOR','Bastión VI devuelve el fuego a la Forja. Al mismo tiempo, un Devorador de Éter aparece en la frontera custodiando un material imposible.'],
      ['Sir Aldric','Ahí está la prueba. La corrupción puede destruir, pero también deja algo detrás. Si conseguimos trabajarlo sin que nos consuma, podremos usar contra la Brecha una parte de su propia fuerza.'],
      ['NARRADOR','La Ascua de Éter abre el primer ciclo de equipo. El Arcón guarda el material; la Forja lo transforma; el héroe convierte ese objeto en Poder real.']
    ],
    7:[
      ['NARRADOR','Con Bastión VII aparece una reliquia marcada con cuatro direcciones. No es equipo, no pertenece al Arcón y sus símbolos reaccionan cuando la Brecha pulsa.'],
      ['Sir Aldric','He visto inscripciones parecidas en cámaras selladas bajo Valoria. Eran antiguas antes de que yo naciera. No sé quién las dejó, pero alguien conocía la Brecha antes que nosotros.'],
      ['NARRADOR','Se abre el Códice. Las cartas y reliquias serán memoria recuperada, no simple botín. Conservarlas puede revelar qué sabía el mundo antes de la caída.']

      ['Sir Aldric','Entonces no vienes como refugiada. Vienes como testigo. Quédate y ayúdanos a comparar lo que ocurrió en ambos reinos.'],
      ['NARRADOR','Maelis se une por una razón propia: descubrir por qué Nareth y Valoria fueron alcanzadas por el mismo fenómeno. La Brecha deja de ser un problema local.']

    9:[

      ['Sir Aldric','Hasta aquí te he dicho dónde mirar. A partir de ahora, una mala expedición será responsabilidad nuestra, no del destino. Elige quién marcha, qué lleva y qué dejamos defendiendo Valoria.'],
      ['NARRADOR','La Prueba de Marcha convierte todos los sistemas aprendidos en una sola decisión estratégica. Superarla significa que Valoria ya puede actuar como un reino.']

      ['Lyra','Las marcas del manuscrito están reaccionando. Mi hermano siguió este mismo patrón. Si cruzó una de estas rutas, la respuesta está más allá de lo que vemos.'],
      ['Maelis','En Nareth ocurrió igual. La herida retrocedió cuando resistimos, pero nunca desapareció. Hay más de una.'],
      ['Sir Aldric','Entonces ésta no es la guerra por Valoria. Es solo el lugar donde hemos aprendido a librarla.'],
      ['NARRADOR','El peligro inmediato puede caer, pero el misterio se expande: otras Fisuras, otros reinos y una red antigua conectada a La Brecha esperan más allá del prólogo.']
    ]
  };
  const lines=beats[n];if(lines)storySequence(lines,()=>{save();render()});
}
