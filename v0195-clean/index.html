<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eldoria v0.19.5</title><style>html,body{margin:0;height:100%;background:#090c0f;color:#eee;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px;max-width:420px}.spinner{width:34px;height:34px;border:3px solid #333;border-top-color:#d6b66f;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#detail{color:#aaa;font-size:12px;margin-top:8px}</style></head><body><div class="box"><div class="spinner" id="spin"></div><div id="status">Cargando Eldoria v0.19.5…</div><div id="detail"></div></div><script>(async()=>{const status=document.getElementById('status'),detail=document.getElementById('detail');try{const parts=['d0.txt','r1.txt','r2.txt','r3.txt','r4.txt','r5a.txt','r5b.txt','r6a.txt','r6b.txt'];let b64='';for(const file of parts){status.textContent='Cargando Eldoria…';detail.textContent='Datos '+file;const r=await fetch('../v0195/'+file,{cache:'no-store'});if(!r.ok)throw new Error('Falta '+file+' ('+r.status+')');b64+=(await r.text()).trim();}const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no soporta la descompresión necesaria.');const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();for(const pfile of ['r2.json','r3.json','r4.json','r5.json','r6.json']){detail.textContent='Integrando '+pfile;const r=await fetch(pfile,{cache:'no-store'});if(!r.ok)throw new Error('Falta '+pfile+' ('+r.status+')');const patches=await r.json();for(const [a,b] of patches){if(!html.includes(a))throw new Error('Integración incompatible en '+pfile);html=html.replace(a,b);}}const required=["BUILD_SCHEMA='0195-r6'",'onboardingDone','showGlobalWorldIntro','Duelo de Reliquias','CAPÍTULO III','MAR DE CRISTAL'];for(const marker of required)if(!html.includes(marker))throw new Error('Validación incompleta: '+marker);const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html));const hex=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');if(hex!=='03002b840f9a6e11212cb1825f014304f36c3531c3b59f656b39a7be795f03ba')throw new Error('La build no coincide con la versión validada ('+hex.slice(0,12)+')');document.open();document.write(html);document.close();}catch(e){document.getElementById('spin').style.display='none';status.textContent='Eldoria no pudo iniciar.';detail.textContent=e.message;console.error(e);}})();</script></body></html>
