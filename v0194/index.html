<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eldoria v0.19.4</title>
<style>
:root{--bg:#090c0f;--panel:#11181e;--gold:#d6b66f;--text:#eee8d9;--muted:#a7aca8;--ok:#9fc08e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}
.hidden{display:none!important}button{font:inherit}
#chapter1,#chapter2host{position:fixed;inset:0}.world{position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,#25362f 0,#17241f 28%,#0c1215 65%,#080b0d 100%);overflow:hidden}
.sky{position:absolute;inset:0 0 42%;background:linear-gradient(#0d1419,#121c1f 60%,transparent)}.ridge{position:absolute;left:-5%;right:-5%;bottom:34%;height:28%;background:#17271f;clip-path:polygon(0 65%,14% 35%,28% 58%,43% 22%,58% 56%,76% 18%,100% 55%,100% 100%,0 100%)}
.topbar{position:absolute;z-index:10;top:0;left:0;right:0;padding:max(8px,env(safe-area-inset-top)) 10px 8px;display:flex;gap:8px;align-items:center;background:linear-gradient(#080b0dee,transparent)}.brand{font-family:Georgia,serif;color:var(--gold);font-size:17px;flex:1}.resources{display:flex;gap:5px}.res{background:#0d1216dd;border:1px solid #ffffff16;border-radius:999px;padding:5px 7px;font-size:9px;white-space:nowrap}.menu{width:34px;height:34px;border:1px solid #ffffff25;background:#0f1519dd;color:#ddd;border-radius:8px;cursor:pointer}
.kingdom{position:absolute;left:50%;top:49%;width:min(780px,96vw);height:min(500px,60vh);transform:translate(-50%,-50%)}.keep{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:78px;filter:grayscale(.5) brightness(.7);opacity:.9}.building{position:absolute;width:132px;min-height:92px;transform:translate(-50%,-50%);border:1px solid #ffffff22;background:linear-gradient(#192128ee,#0d1216ee);color:#e8e2d4;border-radius:12px;padding:10px 8px;text-align:center;box-shadow:0 9px 20px #0008;transition:.22s;cursor:default}.building .ico{display:block;font-size:30px;margin-bottom:4px}.building strong{display:block;font:16px Georgia,serif}.building small{display:block;margin-top:5px;color:#8f9798;font-size:9px;line-height:1.2}.building.ruin{opacity:.43;filter:grayscale(.9)}.building.done{opacity:1;border-color:#7c9b7055}.building.done small{color:var(--ok)}.building.current{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px #d6b66f28,0 0 28px #d6b66f66,0 12px 24px #000a;cursor:pointer;animation:pulse 1.5s ease-in-out infinite}.building.current small{color:#f0d891}.building.current:before{content:'RECONSTRUYE';position:absolute;left:50%;top:-18px;transform:translateX(-50%);font:bold 8px Arial;letter-spacing:.12em;color:#f3d57e;background:#17130b;border:1px solid #d6b66f66;padding:4px 7px;border-radius:999px;white-space:nowrap}.building[data-id=farm]{left:25%;top:62%}.building[data-id=lumber]{left:42%;top:72%}.building[data-id=quarry]{left:60%;top:70%}.building[data-id=forge]{left:76%;top:58%}.building[data-id=barracks]{left:59%;top:43%}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.025)}}
.objective{position:absolute;z-index:12;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100vw - 18px));background:#0d1419f4;border:1px solid #d6b66f55;border-radius:12px;box-shadow:0 12px 36px #000b;padding:10px 12px}.objtop{display:flex;align-items:center;gap:10px}.objtop div{flex:1;min-width:0}.kicker{font:bold 8px Arial;letter-spacing:.14em;color:var(--gold)}#objTitle{display:block;margin-top:2px;font:16px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{font:bold 10px Arial;color:#d9d2c2}.why{font-size:10px;line-height:1.35;color:#bcc0bd;margin:7px 0 0}.hint{margin-top:7px;color:#f0d891;font:bold 9px Arial;letter-spacing:.04em}
.overlay{position:fixed;inset:0;z-index:100;background:#020405d9;backdrop-filter:blur(5px);display:grid;place-items:center;padding:12px}.card{width:min(500px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(150deg,#182129,#0b1014);border:1px solid #b99a59;color:var(--text);box-shadow:0 30px 90px #000;padding:20px;border-radius:12px}.card small.k{display:block;text-align:center;color:var(--gold);font:bold 9px Arial;letter-spacing:.18em}.card h2{font:28px Georgia,serif;color:#efd486;text-align:center;margin:8px 0 10px}.card p{font-size:13px;line-height:1.5;color:#cbc8bd}.art{height:160px;border:1px solid #ffffff18;background:linear-gradient(#111820,#091015);display:grid;place-items:center;margin:10px 0 12px;position:relative;overflow:hidden}.art span{font-size:70px;color:#8d968a;position:relative}.art:before{content:'';position:absolute;inset:50% -10% -20%;background:#1b2e25;clip-path:polygon(0 48%,15% 26%,28% 50%,44% 14%,61% 44%,78% 8%,100% 39%,100% 100%,0 100%)}.primary{width:100%;margin-top:12px;padding:13px;border:1px solid #e0c781;border-radius:7px;background:linear-gradient(#ad8b49,#654b20);color:#fff;font:bold 11px Arial;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}.reward{margin:12px 0;padding:10px;border:1px solid #d6b66f55;background:#17130b;border-radius:8px;text-align:center;font-size:11px;line-height:1.45}.buildbox{text-align:center}.hammer{font-size:48px;animation:hammer .45s ease-in-out infinite alternate}.bar{height:9px;background:#252c31;border-radius:99px;overflow:hidden;margin:13px 0 5px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#866826,#e5ca77)}.timer{font:bold 12px Arial}.chest{font-size:70px;text-align:center;transition:.35s}.chest.open{transform:scale(1.08);filter:drop-shadow(0 0 24px #e5c96c)}@keyframes hammer{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
.menuPanel{position:fixed;z-index:90;top:52px;right:10px;width:230px;background:#0d1419f8;border:1px solid #ffffff22;border-radius:10px;box-shadow:0 15px 40px #000c;padding:10px}.menuPanel h3{font:16px Georgia;margin:2px 0 10px;color:#efd486}.menuPanel button{width:100%;padding:10px;border:1px solid #ffffff22;background:#151d22;color:#ddd;border-radius:7px;text-align:left;cursor:pointer}.menuPanel button+button{margin-top:7px}.danger{border-color:#8f4e4e88!important;color:#f0b5b5!important}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#090c0f}
@media(max-width:600px){
.resources{gap:3px}.resources .res:nth-child(n+4){display:none}.res{padding:4px 6px;font-size:8px}.brand{font-size:15px}.topbar{padding-left:7px;padding-right:7px}
.kingdom{top:43%;height:46vh;width:100vw}.keep{top:17%;font-size:56px}
.building{width:88px;min-height:68px;padding:6px 4px;border-radius:10px}.building strong{font-size:11px;line-height:1.05}.building .ico{font-size:21px;margin-bottom:2px}.building small{font-size:7.5px;margin-top:3px}.building.current:before{top:-15px;font-size:6.5px;padding:3px 5px}
.building.ruin{width:54px;min-height:54px;padding:8px;border-radius:50%;opacity:.34}.building.ruin strong,.building.ruin small{display:none}.building.ruin .ico{font-size:20px;margin:0}
.building[data-id=farm]{left:14%;top:58%}.building[data-id=lumber]{left:36%;top:77%}.building[data-id=quarry]{left:64%;top:77%}.building[data-id=forge]{left:86%;top:56%}.building[data-id=barracks]{left:66%;top:31%}
.objective{bottom:6px;width:calc(100vw - 12px);padding:8px 9px;border-radius:10px}.kicker{font-size:6.5px}.objtop{gap:6px}#objTitle{font-size:13px}.progress{font-size:9px}.why{font-size:9px;line-height:1.25;margin-top:5px}.hint{font-size:8px;margin-top:5px}
.card{padding:16px}.card h2{font-size:22px}.art{height:135px}
}
@media(max-width:390px){.building{width:82px}.building.ruin{width:50px;min-height:50px}.building[data-id=farm]{left:13%}.building[data-id=forge]{left:87%}.objective{padding:7px 8px}.why{font-size:8.5px}}
</style></head><body>
<section id="chapter1"><div class="world"><div class="sky"></div><div class="ridge"></div><div class="topbar"><div class="brand">ELDORIA</div><div class="resources"><span class="res">🍖 <b id="rFood">80</b></span><span class="res">🪵 <b id="rWood">110</b></span><span class="res">🪨 <b id="rStone">75</b></span><span class="res">⚙ <b id="rIron">25</b></span></div><button id="menuBtn" class="menu" aria-label="Menú">☰</button></div><div class="kingdom" id="kingdom"><div class="keep">♜</div>
<button class="building" data-id="farm"><span class="ico">🌾</span><strong>Ruinas del Granero</strong><small>Pendiente</small></button>
<button class="building" data-id="lumber"><span class="ico">🪵</span><strong>Ruinas del Aserradero</strong><small>Pendiente</small></button>
<button class="building" data-id="quarry"><span class="ico">🪨</span><strong>Ruinas de la Cantera</strong><small>Pendiente</small></button>
<button class="building" data-id="forge"><span class="ico">⚒</span><strong>Ruinas de la Forja</strong><small>Pendiente</small></button>
<button class="building" data-id="barracks"><span class="ico">🛡</span><strong>Ruinas del Cuartel</strong><small>Pendiente</small></button>
</div><div id="objective" class="objective hidden"><div class="objtop"><div><span class="kicker">CAPÍTULO I · LAS CENIZAS DE VALORIA</span><strong id="objTitle"></strong></div><span id="objProgress" class="progress"></span></div><p id="objWhy" class="why"></p><div id="objHint" class="hint"></div></div></div></section>
<section id="chapter2host" class="hidden"><iframe id="game"></iframe></section>
<div id="menuPanel" class="menuPanel hidden"><h3>Menú</h3><button id="closeMenu">Volver al reino</button><button id="resetGame" class="danger">Reiniciar partida desde cero</button></div>
<script>
(()=>{
const BUILD='0194-r6',MIG='eldoria-v0194-build',KEY='eldoria-v0194-flow2',OLD='eldoria-save-v0192',BUILD_MS=1500;
const steps=[
{id:'farm',name:'Granero',title:'Devuelve alimento a Valoria',why:'Los supervivientes necesitan comida antes que cualquier otra cosa. Reconstruye el Granero.'},
{id:'lumber',name:'Aserradero',title:'Recupera la madera',why:'Ya hay alimento. Ahora hacen falta vigas, puertas y andamios. Recupera el Aserradero.'},
{id:'quarry',name:'Cantera',title:'Levanta los cimientos',why:'La madera no basta para devolver firmeza al reino. La Cantera aportará piedra para reconstruir.'},
{id:'forge',name:'Forja',title:'Enciende las fraguas',why:'Valoria vuelve a producir, pero necesita herramientas y hierro trabajado. Enciende la Forja.'},
{id:'barracks',name:'Cuartel',title:'Devuelve la defensa',why:'El reino puede sostenerse. Falta poder defenderlo antes de abrir las puertas al mundo.'}
];
const defaults={phase:'intro',introStep:0,step:0,building:null,rewardClaimed:false,chapter2Started:false};
let s={...defaults};
if(localStorage.getItem(MIG)!==BUILD){localStorage.removeItem(KEY);localStorage.removeItem(OLD);localStorage.removeItem('eldoria-v0194-flow');localStorage.setItem(MIG,BUILD);}else{try{s={...s,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}}
const $=q=>document.querySelector(q), save=()=>localStorage.setItem(KEY,JSON.stringify(s));
function reset(){for(const k of Object.keys(localStorage))if(k.startsWith('eldoria-'))localStorage.removeItem(k);location.replace(location.pathname+'?fresh='+Date.now())}
function modal(k,title,html,label,cb){document.querySelector('.overlay')?.remove();const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card"><small class="k">${k}</small><h2>${title}</h2>${html}<button class="primary">${label}</button></div>`;document.body.append(o);o.querySelector('.primary').onclick=()=>{o.remove();cb&&cb()};return o}
function resumePrompt(){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="card"><small class="k">PARTIDA EN CURSO</small><h2>Valoria te espera</h2><p>Hay progreso guardado en esta prueba. Puedes continuar exactamente donde estabas o empezar otra vez desde el prólogo.</p><button id="resumeSaved" class="primary">Continuar partida</button><button id="restartPrologue" class="primary" style="margin-top:8px;background:#151d22;border-color:#ffffff22">Reiniciar desde el prólogo</button></div>`;document.body.append(o);o.querySelector('#resumeSaved').onclick=()=>{o.remove();startFromState()};o.querySelector('#restartPrologue').onclick=()=>reset()}
function startFromState(){if(s.phase==='intro')intro();else if(s.phase==='chapter1')render();else if(s.phase==='reward')chapterComplete();else if(s.phase==='chapter2'){if(s.chapter2Started)startChapter2();else chapter2Intro()}}
function intro(){const scenes=[['♜','Valoria ha caído.','La corona ha desaparecido y los edificios que mantenían vivo el reino han quedado inutilizados.'],['✦','El reino no puede salir al mundo.','Sin alimento, materiales, herramientas y defensa, cualquier expedición terminaría antes de empezar.'],['⚒','Primero: reconstruir.','Tu primera tarea será devolver a Valoria sus cinco funciones esenciales. Empieza por el Granero.']];const i=Math.min(s.introStep,2),x=scenes[i];modal('PRÓLOGO · LAS CENIZAS DE VALORIA',x[1],`<div class="art"><span>${x[0]}</span></div><p>${x[2]}</p>`,i===2?'Entrar en Valoria':'Continuar',()=>{if(i<2){s.introStep=i+1;save();intro()}else{chapterStart()}})}
function chapterStart(){s.phase='chapter1';save();modal('COMIENZA EL CAPÍTULO','Las Cenizas de Valoria','<p>Valoria no necesita mejoras: necesita volver a funcionar. Reconstruye sus pilares uno a uno. El propio reino te indicará dónde actuar.</p><div class="reward">Completa los cinco edificios para recibir el Cofre de Reconstrucción.</div>','Comenzar',()=>render())}
function render(){if(s.phase!=='chapter1')return;$('#chapter1').classList.remove('hidden');$('#objective').classList.remove('hidden');const cur=steps[s.step];$('#objProgress').textContent=`${Math.min(s.step,5)}/5`;$('#objTitle').textContent=cur?cur.title:'Valoria reconstruida';$('#objWhy').textContent=cur?cur.why:'';$('#objHint').textContent=s.building?`Reconstruyendo ${cur?.name||''}…`:cur?`Toca ${cur.name} en el reino`:'Reconstrucción completada';document.querySelectorAll('.building').forEach((b,i)=>{const done=i<s.step,current=i===s.step&&!s.building;b.classList.toggle('done',done);b.classList.toggle('current',current);b.classList.toggle('ruin',!done&&!current);b.disabled=!current;const def=steps[i];b.querySelector('strong').textContent=done?def.name:`Ruinas del ${def.name}`;b.querySelector('small').textContent=done?'Reconstruido':current?'Toca para reconstruir':s.building&&i===s.step?'Construyendo…':'Pendiente'});if(s.building)resumeBuild()}
let ticking=false;function startBuild(){if(s.phase!=='chapter1'||s.building||s.step>=steps.length)return;const cur=steps[s.step];s.building={id:cur.id,endsAt:Date.now()+BUILD_MS};save();showBuild(cur)}
function resumeBuild(){if(!s.building||ticking)return;const cur=steps.find(x=>x.id===s.building.id)||steps[s.step];if(Date.now()>=s.building.endsAt)finishBuild();else showBuild(cur)}
function showBuild(cur){if(ticking)return;ticking=true;document.querySelectorAll('.building').forEach(b=>b.disabled=true);const o=modal('CONSTRUCCIÓN EN CURSO',cur.name,`<div class="buildbox"><div class="hammer">⚒</div><p>${cur.why}</p><div class="bar"><i></i></div><div class="timer">1.5 s</div></div>`,'Construyendo…',()=>{});const btn=o.querySelector('.primary');btn.disabled=true;const fill=o.querySelector('.bar i'),tm=o.querySelector('.timer');const tick=()=>{if(!s.building){ticking=false;o.remove();return}const left=Math.max(0,s.building.endsAt-Date.now());fill.style.width=`${Math.min(100,100-left/BUILD_MS*100)}%`;tm.textContent=(left/1000).toFixed(1)+' s';if(left<=0){ticking=false;o.remove();finishBuild();return}requestAnimationFrame(tick)};tick()}
function finishBuild(){if(!s.building)return;const completed=steps[s.step];s.building=null;s.step=Math.min(steps.length,s.step+1);save();render();if(s.step>=steps.length){setTimeout(chapterComplete,120);return}const next=steps[s.step];modal('VALORIA SE RECUPERA',completed.name+' reconstruido',`<p>${completed.name} vuelve a funcionar.</p><p><b>Siguiente:</b> ${next.why}</p>`,'Volver al reino',()=>render())}
function chapterComplete(){s.phase='reward';save();const o=modal('CAPÍTULO COMPLETADO','Las Cenizas de Valoria','<div class="chest">▣</div><p>Valoria vuelve a producir, construir, forjar y defenderse. Ahora sí puede mirar más allá de sus murallas.</p><div class="reward">+180 comida · +180 madera · +120 piedra · +30 hierro<br>+1 Esencia Heroica</div>','Abrir cofre',()=>{});const b=o.querySelector('.primary'),c=o.querySelector('.chest');let opened=false;b.onclick=()=>{if(!opened){opened=true;c.classList.add('open');b.textContent='Recoger recompensa';return}claimReward();o.remove();chapter2Intro()}}
function prepareBase(){let b={};try{b=JSON.parse(localStorage.getItem(OLD)||'{}')}catch{}b.introSeen=true;b.talked=true;b.firstUpgrade=true;b.chapterStartedSeen=true;if(!('chapterRewardClaimed' in b))b.chapterRewardClaimed=false;b.stage=Math.max(2,Number(b.stage)||0);b.resources=b.resources||{food:80,wood:110,stone:75,iron:25};localStorage.setItem(OLD,JSON.stringify(b))}
function claimReward(){if(s.rewardClaimed)return;let b={};try{b=JSON.parse(localStorage.getItem(OLD)||'{}')}catch{}b.resources=b.resources||{food:80,wood:110,stone:75,iron:25};b.resources.food=(b.resources.food||0)+180;b.resources.wood=(b.resources.wood||0)+180;b.resources.stone=(b.resources.stone||0)+120;b.resources.iron=(b.resources.iron||0)+30;b.heroEssence=(b.heroEssence||0)+1;localStorage.setItem(OLD,JSON.stringify(b));s.rewardClaimed=true;save();prepareBase()}
function chapter2Intro(){s.phase='chapter2';save();$('#chapter1').classList.add('hidden');modal('COMIENZA EL CAPÍTULO','Capítulo II · Ecos de la Brecha','<p>Valoria puede sostener una expedición. Ahora toca cruzar sus puertas y descubrir qué está ocurriendo fuera.</p>','Salir al mundo',()=>startChapter2())}
function startChapter2(){prepareBase();/* Do not skip hero/card/duel tutorial state here: v0.19.2 owns that progression. */s.chapter2Started=true;save();$('#chapter1').classList.add('hidden');$('#chapter2host').classList.remove('hidden');const f=$('#game');f.src='../v0192/?chapter2='+Date.now();f.addEventListener('load',patchBase,{once:true})}
function patchBase(){const f=$('#game');let d;try{d=f.contentDocument}catch{return}if(!d)return;setTimeout(()=>{try{d.title='Eldoria v0.19.4';const exact=new Map([['CAPÍTULO I · LAS CENIZAS DE VALORIA','CAPÍTULO II · ECOS DE LA BRECHA'],['Capítulo I · Las Cenizas de Valoria','Capítulo II · Ecos de la Brecha']]);const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);while(w.nextNode()){const n=w.currentNode;const raw=(n.nodeValue||'').trim();if(exact.has(raw))n.nodeValue=n.nodeValue.replace(raw,exact.get(raw))}}catch{}},250)}
$('#menuBtn').onclick=()=>$('#menuPanel').classList.remove('hidden');$('#closeMenu').onclick=()=>$('#menuPanel').classList.add('hidden');$('#resetGame').onclick=reset;document.querySelectorAll('.building').forEach(b=>b.onclick=()=>{if(b.dataset.id===steps[s.step]?.id)startBuild()});
const params=new URLSearchParams(location.search);if(params.has('fresh')){s={...defaults};save();history.replaceState(null,'',location.pathname)}
const hasProgress=s.phase!=='intro'||s.introStep>0||s.step>0||s.rewardClaimed||s.chapter2Started;
if(hasProgress&&!params.has('fresh'))resumePrompt();else startFromState();
})();
</script></body></html>
