html,body{margin:0;height:100%;background:#090c0f;overflow:hidden}#game{position:fixed;inset:0;width:100%;height:100%;border:0}.shade{position:fixed;inset:0;background:#020405cc;backdrop-filter:blur(5px);display:grid;place-items:center;padding:14px;z-index:1000}.card{box-sizing:border-box;width:min(480px,100%);max-height:min(84dvh,680px);overflow:auto;background:linear-gradient(145deg,#21272d,#101419);border:1px solid #d6b66f66;color:#ebe5d3;box-shadow:0 24px 80px #000;padding:20px;border-radius:10px;font-family:Georgia,'Times New Roman',serif}.card small{display:block;text-align:center;color:#d6b66f;font:700 9px Arial;letter-spacing:.18em}.card h2{text-align:center;color:#d6b66f;font-weight:normal;margin:8px 0 12px;font-size:24px}.card p{font:13px/1.5 Arial;color:#cbc8bd;margin:0}.reward{margin:14px 0 0;padding:11px;border:1px solid #d6b66f55;background:#17130b;text-align:center;border-radius:8px}.reward b{display:block;color:#d6b66f;font:700 10px Arial;letter-spacing:.12em}.reward span{display:block;margin-top:5px;font:10px/1.45 Arial;color:#d7d1c3}.btn{width:100%;margin-top:15px;padding:13px;border:1px solid #e0c781;border-radius:7px;background:linear-gradient(#b1904e,#6c5225);color:#fff;font:bold 12px Arial;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.hud{position:fixed;z-index:900;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:center;pointer-events:none}.chip{max-width:calc(100vw - 30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#10161bee;border:1px solid #d6b66f55;color:#eee;padding:7px 10px;box-shadow:0 6px 18px #0008;border-radius:999px;font:9px Arial;letter-spacing:.05em}.chip b{color:#d6b66f}.hidden{display:none!important}.buildbox{text-align:center;padding:6px}.hammer{font-size:46px;animation:hammer .46s ease-in-out infinite alternate;transform-origin:70% 70%}.buildname{color:#d6b66f;font:20px Georgia;margin:8px 0 4px}.timer{font:700 12px Arial;color:#eee;margin-top:8px}.bar{height:8px;border-radius:99px;background:#2a2f34;overflow:hidden;margin:12px 0 4px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#866826,#d6b66f);transition:width .08s linear}.buildhint{font:10px/1.4 Arial;color:#9fa5aa}.chest-stage{text-align:center;padding:8px 0}.chest{position:relative;width:118px;height:86px;margin:10px auto 16px;filter:drop-shadow(0 10px 22px #000);transform:scale(.92)}.chest .base{position:absolute;left:8px;right:8px;bottom:0;height:50px;border:3px solid #d6b66f;background:linear-gradient(#6b4321,#2f1b10);border-radius:8px}.chest .lid{position:absolute;left:5px;right:5px;top:8px;height:40px;border:3px solid #d6b66f;background:linear-gradient(#8a5729,#3a2111);border-radius:28px 28px 7px 7px;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}.chest .lock{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:18px;height:24px;border:2px solid #f0d990;background:#73551c;z-index:3;border-radius:4px}.chest.open .lid{transform:rotateX(72deg) translateY(-8px)}.glow{opacity:0;position:absolute;left:50%;top:15px;width:150px;height:110px;transform:translateX(-50%);background:radial-gradient(circle,#ffeaa777 0,#d6b66f22 42%,transparent 70%);transition:opacity .4s}.chest-stage.open .glow{opacity:1}.loot{opacity:0;transform:translateY(12px);transition:.45s ease .35s}.chest-stage.open .loot{opacity:1;transform:none}.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#f6dda1;opacity:0}.chest-stage.open .spark{animation:spark .9s ease-out forwards}.s1{left:36%;top:32%}.s2{left:58%;top:27%;animation-delay:.12s!important}.s3{left:48%;top:18%;animation-delay:.2s!important}@keyframes spark{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-42px) scale(1.4)}}@keyframes hammer{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
.chapter-dock{position:fixed;z-index:960;left:10px;right:10px;bottom:82px;display:flex;justify-content:center;pointer-events:none;font-family:Arial,sans-serif}.chapter-shell{width:min(440px,100%);pointer-events:auto;background:#10161bf2;border:1px solid #d6b66f66;border-radius:10px;box-shadow:0 10px 30px #000a;overflow:hidden}.chapter-head{width:100%;border:0;background:transparent;color:#f1ead8;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;padding:9px 11px;cursor:pointer}.chapter-head b{display:block;color:#d6b66f;font-size:9px;letter-spacing:.08em}.chapter-head span{display:block;margin-top:2px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chapter-arrow{font-size:13px;color:#d6b66f}.chapter-body{border-top:1px solid #d6b66f33;padding:10px;max-height:34dvh;overflow:auto}.chapter-body[hidden]{display:none!important}.chapter-copy{font-size:11px;line-height:1.45;color:#cbc8bd;margin:0 0 9px}.chapter-steps{display:grid;gap:4px;margin:0 0 9px}.chapter-step{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;background:#171c20;color:#8f979c;font-size:10px}.chapter-step.current{color:#fff;border:1px solid #d6b66f55;background:#211c12}.chapter-step.done{color:#b8c7b2}.chapter-step i{font-style:normal;width:16px;text-align:center}.chapter-action{width:100%;padding:10px;border:1px solid #d6b66f;background:#755927;color:white;border-radius:6px;font:bold 10px Arial;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}.chapter-action:disabled{opacity:.55;cursor:default}.chapter-dock.hidden{display:none!important}

</style></head><body><div id="hud" class="hud hidden"><div class="chip"><b>CAPÍTULO I · LAS CENIZAS DE VALORIA</b> · <span id="prog">0/5</span></div></div><div id="chapterDock" class="chapter-dock hidden"><div class="chapter-shell"><button id="chapterDockHead" class="chapter-head"><div><b id="chapterDockTitle">CAPÍTULO I · 0/5</b><span id="chapterDockObjective">Reconstruye Valoria</span></div><div id="chapterDockArrow" class="chapter-arrow">▴</div></button><div id="chapterDockBody" class="chapter-body"><p id="chapterDockCopy" class="chapter-copy"></p><div id="chapterDockSteps" class="chapter-steps"></div><button id="chapterDockAction" class="chapter-action">Reconstruir</button></div></div></div><div id="host"></div><script>
(()=>{
const SAVE='eldoria-save-v0192',PKEY='eldoria-v0194-prologue',BUILD_MS=1500;
const order=[
{id:'farm',name:'Granero',title:'Devuelve alimento a Valoria',copy:'Reconstruye el Granero y devuelve una producción básica de comida.'},
{id:'lumber',name:'Aserradero',title:'Recupera la madera',copy:'Reconstruye el Aserradero para que Valoria pueda volver a crecer.'},
{id:'quarry',name:'Cantera',title:'Levanta los cimientos',copy:'Devuelve la Cantera al servicio del Bastión.'},
{id:'forge',name:'Forja',title:'Enciende las fraguas',copy:'Reconstruye la Forja para preparar herramientas, armas y futuras expediciones.'},
{id:'barracks',name:'Cuartel',title:'Valoria vuelve a defenderse',copy:'Reconstruye el Cuartel y devuelve una estructura militar a Valoria.'}
];
let p={step:0,intro:false,chapter1Complete:false,rewardClaimed:false,chapter2Shown:false,building:null};try{p={...p,...JSON.parse(localStorage.getItem(PKEY)||'{}')}}catch{}
if(!p.intro&&!p.rewardClaimed){const old=localStorage.getItem(SAVE);if(old&&!localStorage.getItem(SAVE+'-backup-v0194'))localStorage.setItem(SAVE+'-backup-v0194',old);localStorage.removeItem(SAVE);}
const f=document.createElement('iframe');f.id='game';f.src='../v0192/?v0194='+Date.now();document.getElementById('host').append(f);
const $=s=>document.querySelector(s);function store(){localStorage.setItem(PKEY,JSON.stringify(p));}function gameDoc(){try{return f.contentDocument}catch{return null}}function state(){try{return JSON.parse(localStorage.getItem(SAVE)||'null')}catch{return null}}function saveState(s){localStorage.setItem(SAVE,JSON.stringify(s));}function setDockOpen(open){const body=$('#chapterDockBody'),arrow=$('#chapterDockArrow');if(!body)return;body.hidden=!open;if(arrow)arrow.textContent=open?'▾':'▴';}
function chapterUiAllowed(){const d=gameDoc();if(!d)return false;const active=d.querySelector('#nav button.active[data-view]');if(active&&active.dataset.view!=='kingdom')return false;const visible=d.querySelector('[data-screen="kingdom"].active,.kingdom-screen.active,#kingdom.active');if(active)return active.dataset.view==='kingdom';return !!visible||!d.querySelector('#nav button.active[data-view]');}function updateDock(){const dock=$('#chapterDock');if(!dock)return;if(!p.intro||p.rewardClaimed||p.chapter1Complete||!chapterUiAllowed()){dock.classList.add('hidden');setDockOpen(false);return;}dock.classList.remove('hidden');const b=order[p.step];$('#chapterDockTitle').textContent=`CAPÍTULO I · ${Math.min(p.step,5)}/5`;$('#chapterDockObjective').textContent=b?b.title:'Reconstrucción completada';$('#chapterDockCopy').textContent=b?b.copy:'';const steps=$('#chapterDockSteps');steps.innerHTML=order.map((x,i)=>`<div class="chapter-step ${i<p.step?'done':i===p.step?'current':''}"><i>${i<p.step?'✓':i===p.step?'◆':'·'}</i><span>${x.name}</span></div>`).join('');const action=$('#chapterDockAction');if(b){action.textContent=p.building?`Construyendo ${b.name}…`:`Reconstruir ${b.name}`;action.disabled=!!p.building;}else{action.textContent='Completado';action.disabled=true;}}
function initDock(){const head=$('#chapterDockHead'),action=$('#chapterDockAction');if(head&&!head.dataset.bound){head.dataset.bound='1';head.onclick=()=>setDockOpen($('#chapterDockBody').hidden);}if(action&&!action.dataset.bound){action.dataset.bound='1';action.onclick=()=>{if(!p.building&&!p.chapter1Complete)beginBuild();};}setDockOpen(false);updateDock();}
function modal(k,title,copy,button,cb,reward=''){document.querySelector('.shade')?.remove();const sh=document.createElement('div');sh.className='shade';sh.innerHTML=`<div class="card"><small>${k}</small><h2>${title}</h2><p>${copy}</p>${reward?`<div class="reward"><b>RECOMPENSA</b><span>${reward}</span></div>`:''}<button class="btn">${button}</button></div>`;document.body.append(sh);sh.querySelector('button').onclick=()=>{sh.remove();cb&&cb();};return sh;}
function buildingIdFromNode(n){if(!n)return null;const test=n.dataset?.testid||'';const m=test.match(/^building-(farm|lumber|quarry|forge|barracks)$/);if(m)return m[1];for(const b of order)if(n.classList?.contains('building-'+b.id))return b.id;return null;}
function getBuilding(d,id){return d.querySelector(`.building-${id},[data-testid="building-${id}"]`);}
function startChapter(){if(p.intro||p.rewardClaimed)return;p.intro=true;store();$('#hud').classList.add('hidden');initDock();updateDock();modal('COMIENZA EL CAPÍTULO','Capítulo I · Las Cenizas de Valoria','Valoria no necesita que mejores una ciudad terminada: necesita volver a existir. Reconstruye sus edificios esenciales uno a uno.','Comenzar',()=>apply(),'Cofre de Reconstrucción · recursos + 1 Esencia Heroica');}
function apply(){if(p.rewardClaimed)return;$('#hud').classList.add('hidden');updateDock();const d=gameDoc();if(!d||!chapterUiAllowed())return;for(const q of d.querySelectorAll('.quest-panel,#chapter-toggle,.chapter-list'))q.style.display='none';const gate=d.querySelector('#gate');if(gate){gate.style.opacity='.25';gate.style.pointerEvents='none';}['world','map'].forEach(v=>{const n=d.querySelector(`[data-view="${v}"]`);if(n){n.style.opacity='.25';n.style.pointerEvents='none';}});order.forEach((b,i)=>{const n=getBuilding(d,b.id);if(!n)return;const built=i<p.step,current=i===p.step&&!p.chapter1Complete;n.style.opacity=built?'1':current?'1':'.42';n.style.filter=built?'':current?'drop-shadow(0 0 18px #d6b66f)':'grayscale(.85)';const strong=n.querySelector('strong');if(strong)strong.textContent=built?b.name:'Ruinas de '+b.name;const small=n.querySelector('small');if(small)small.textContent=built?'Reconstruido':current?(p.building?'Construyendo…':'Toca para reconstruir'):'Pendiente';const lvl=n.querySelector('.level');if(lvl)lvl.style.display=built?'':'none';let em=n.querySelector('em[data-v0194="1"]');if(current){if(!em){em=d.createElement('em');em.dataset.v0194='1';n.prepend(em);}em.textContent=p.building?'CONSTRUYENDO…':'RECONSTRUYE';em.style.display='block';}else if(em)em.style.display='none';});}
function beginBuild(){if(p.building||p.chapter1Complete)return;const b=order[p.step];if(!b)return;p.building={index:p.step,endsAt:Date.now()+BUILD_MS};store();updateDock();apply();showBuildProgress(b);}
function showBuildProgress(b){document.querySelector('.shade')?.remove();const sh=document.createElement('div');sh.className='shade';sh.innerHTML=`<div class="card"><div class="buildbox"><small>CONSTRUCCIÓN EN CURSO</small><div class="hammer">⚒</div><div class="buildname">${b.name}</div><div class="bar"><i></i></div><div class="timer">1.5 s</div><div class="buildhint">Toda construcción requiere tiempo. Más adelante podrás acelerar, planificar y encadenar mejoras.</div></div></div>`;document.body.append(sh);const bar=sh.querySelector('.bar i'),tm=sh.querySelector('.timer');const tick=()=>{if(!p.building){sh.remove();return;}const left=Math.max(0,p.building.endsAt-Date.now());bar.style.width=Math.min(100,Math.max(0,100-left/BUILD_MS*100))+'%';tm.textContent=(left/1000).toFixed(1)+' s';if(left<=0){sh.remove();finishBuild();return;}requestAnimationFrame(tick);};tick();}
function finishBuild(){if(!p.building)return;const idx=p.building.index;if(idx!==p.step){p.building=null;store();apply();return;}const b=order[p.step];p.building=null;p.step++;if(p.step>=order.length)p.chapter1Complete=true;store();updateDock();apply();if(p.chapter1Complete){setTimeout(showChapterReward,180);return;}const nx=order[p.step];setTimeout(()=>modal('NUEVA MISIÓN',nx.title,`Has recuperado ${b.name}. ${nx.copy}`,'Continuar',()=>apply()),180);}
function showChapterReward(){if(p.rewardClaimed)return showChapter2();document.querySelector('.shade')?.remove();const sh=document.createElement('div');sh.className='shade';sh.innerHTML=`<div class="card"><small>CAPÍTULO COMPLETADO</small><h2>Las Cenizas de Valoria</h2><div class="chest-stage"><div class="glow"></div><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><div class="chest"><div class="lid"></div><div class="base"></div><div class="lock"></div></div><div class="loot"><p>Valoria vuelve a respirar. Has reconstruido sus pilares esenciales.</p><div class="reward"><b>COFRE DE RECONSTRUCCIÓN</b><span>+180 comida · +180 madera · +120 piedra · +30 hierro · +1 Esencia Heroica</span></div></div></div><button class="btn" id="open-chest">Abrir cofre</button></div>`;document.body.append(sh);const stage=sh.querySelector('.chest-stage'),chest=sh.querySelector('.chest'),btn=sh.querySelector('#open-chest');let opened=false;btn.onclick=()=>{if(!opened){opened=true;stage.classList.add('open');chest.classList.add('open');btn.textContent='Recoger recompensa';return;}claimReward();sh.remove();showChapter2();};}
function claimReward(){if(p.rewardClaimed)return;let s=state()||{};s.firstUpgrade=true;s.talked=true;s.stage=2;s.chapterStartedSeen=true;s.introSeen=true;s.resources=s.resources||{food:80,wood:110,stone:75,iron:25};s.resources.food=(s.resources.food||0)+180;s.resources.wood=(s.resources.wood||0)+180;s.resources.stone=(s.resources.stone||0)+120;s.resources.iron=(s.resources.iron||0)+30;s.heroEssence=(s.heroEssence||0)+1;saveState(s);p.rewardClaimed=true;store();$('#hud').classList.add('hidden');$('#chapterDock').classList.add('hidden');}
function showChapter2(){if(!p.rewardClaimed)return;if(p.chapter2Shown){relabelBase();return;}p.chapter2Shown=true;store();modal('COMIENZA EL CAPÍTULO','Capítulo II · Ecos de la Brecha','Valoria vuelve a sostenerse. Ahora debes cruzar sus puertas y descubrir qué está ocurriendo fuera.','Salir al mundo',()=>{f.src='../v0192/?v0194done='+Date.now();},'Explora · combate · recupera reliquias · reúne aliados');}
function relabelBase(){const d=gameDoc();if(!d)return;try{d.title='Eldoria v0.19.4';const walk=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);for(const n of nodes){let t=n.nodeValue||'';if(!t)continue;t=t.replace(/v0\.19\.2/g,'v0.19.4').replace(/V0\.19\.2/g,'V0.19.4');if(p.rewardClaimed)t=t.replace(/CAPÍTULO I · LAS CENIZAS DE VALORIA/g,'CAPÍTULO II · ECOS DE LA BRECHA').replace(/Capítulo I · Las Cenizas de Valoria/g,'Capítulo II · Ecos de la Brecha').replace(/Capítulo I completado/g,'Capítulo II completado').replace(/Capítulo I: /g,'Capítulo II: ');if(t!==n.nodeValue)n.nodeValue=t;}if(p.rewardClaimed){const k=d.querySelector('.quest-kicker');if(k)k.textContent='CAPÍTULO II · ECOS DE LA BRECHA';const tog=d.querySelector('#chapter-toggle');if(tog)tog.innerHTML=tog.innerHTML.replace('Capítulo I','Capítulo II');}}catch(e){}}
function onInnerClick(e){if(!p.intro||p.rewardClaimed||p.chapter1Complete)return;const btn=e.target?.closest?.('.building,[data-testid^="building-"]');if(!btn)return;const id=buildingIdFromNode(btn);if(!id)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const current=order[p.step]?.id;if(id===current){beginBuild();return;}const expected=order[p.step]?.name||'el edificio marcado';modal('AÚN NO',`Primero reconstruye ${expected}`,`Este capítulo introduce los edificios uno a uno. El siguiente objetivo está marcado en el reino.`,'Entendido',()=>apply());}
function bindInner(){const d=gameDoc();if(!d||d.__v0194Bound)return;d.__v0194Bound=true;d.addEventListener('click',onInnerClick,true);d.addEventListener('click',e=>{const nav=e.target?.closest?.('#nav button[data-view]');if(!nav)return;if(nav.dataset.view!=='kingdom'){const dock=$('#chapterDock');if(dock)dock.classList.add('hidden');setDockOpen(false);}else setTimeout(updateDock,0);},true);}
f.addEventListener('load',()=>{let tries=0;const t=setInterval(()=>{const d=gameDoc();if(!d||!d.querySelector('.game-shell')){if(++tries>100)clearInterval(t);return;}clearInterval(t);bindInner();relabelBase();initDock();if(p.rewardClaimed){relabelBase();return;}const st=state();if(st?.introSeen&&!p.intro){setTimeout(startChapter,120);return;}if(p.intro){apply();if(p.building){const b=order[p.building.index]||order[p.step];if(Date.now()>=p.building.endsAt)finishBuild();else showBuildProgress(b);}else if(p.chapter1Complete)showChapterReward();}},150);});
setInterval(()=>{bindInner();relabelBase();updateDock();if(p.intro&&!p.rewardClaimed&&!p.chapter1Complete)apply();},250);
})();
</script></body></html>
