<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eldoria v0.19.4</title><style>
html,body{margin:0;height:100%;background:#090c0f;overflow:hidden}*{box-sizing:border-box}#game{position:fixed;inset:0;width:100%;height:100%;border:0}.hidden{display:none!important}.shade{position:fixed;inset:0;z-index:1200;background:#020405d9;backdrop-filter:blur(6px);display:grid;place-items:center;padding:14px}.card{width:min(500px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(150deg,#172028,#090d11);border:1px solid #b99a59;color:#ebe5d3;box-shadow:0 28px 90px #000;padding:22px;border-radius:12px;font-family:Georgia,serif}.card small{display:block;color:#d6b66f;font:700 9px Arial;letter-spacing:.18em;text-align:center}.card h2{margin:8px 0 12px;text-align:center;color:#efd486;font-weight:normal;font-size:25px}.card p{font:13px/1.55 Arial;color:#cbc8bd;margin:8px 0}.btn{width:100%;padding:13px 12px;margin-top:14px;border:1px solid #e0c781;border-radius:7px;background:linear-gradient(#aa8948,#61481f);color:#fff;font:bold 11px Arial;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.intro-art{height:170px;margin:8px 0 14px;border:1px solid #ffffff18;background:linear-gradient(#111820,#091015);display:grid;place-items:center;position:relative;overflow:hidden}.intro-art:before{content:"";position:absolute;inset:45% -10% -20%;background:#182b23;clip-path:polygon(0 48%,15% 26%,28% 50%,44% 14%,61% 44%,78% 8%,100% 39%,100% 100%,0 100%)}.intro-symbol{position:relative;font-size:72px;color:#8d968a;text-shadow:0 10px 20px #000}.dots{text-align:center}.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#636b69;margin:0 3px}.dots i.on{background:#e2bf6e;box-shadow:0 0 10px #e2bf6e}.chapter-dock{position:fixed;z-index:1000;left:10px;right:10px;bottom:82px;display:flex;justify-content:center;pointer-events:none;font-family:Arial}.chapter-shell{width:min(460px,100%);pointer-events:auto;background:#0d1419f5;border:1px solid #b99a5966;border-radius:10px;box-shadow:0 10px 35px #000b;overflow:hidden}.chapter-head{width:100%;border:0;background:transparent;color:#eee;padding:9px 11px;display:grid;grid-template-columns:1fr auto;text-align:left;cursor:pointer}.chapter-head b{color:#d6b66f;font-size:9px;letter-spacing:.08em}.chapter-head span{display:block;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:#d6b66f}.chapter-body{border-top:1px solid #ffffff12;padding:10px;max-height:32dvh;overflow:auto}.chapter-body[hidden]{display:none}.why{font:11px/1.45 Arial;color:#c9c6bb;margin:0 0 9px}.steps{display:grid;gap:4px;margin-bottom:8px}.step{padding:5px 7px;border-radius:6px;background:#151b1f;color:#899197;font:10px Arial;display:flex;gap:7px}.step.current{color:#fff;border:1px solid #d6b66f55;background:#211b10}.step.done{color:#b8c8b4}.action{width:100%;padding:10px;border:1px solid #d6b66f;background:#735724;color:#fff;border-radius:6px;font:bold 10px Arial;text-transform:uppercase;cursor:pointer}.action:disabled{opacity:.55}.buildbox{text-align:center}.hammer{font-size:48px;animation:hammer .45s ease-in-out infinite alternate}.bar{height:9px;background:#252c31;border-radius:99px;overflow:hidden;margin:13px 0 5px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#866826,#e5ca77)}.timer{text-align:center;color:#eee;font:bold 12px Arial}.reward{margin:12px 0;padding:10px;text-align:center;border:1px solid #d6b66f55;background:#17130b;border-radius:8px;font:11px/1.5 Arial;color:#ddd5c3}.chest{font-size:72px;text-align:center;filter:drop-shadow(0 10px 20px #000);transition:.4s}.chest.open{transform:translateY(-4px) scale(1.08);filter:drop-shadow(0 0 25px #e6c96c)}@keyframes hammer{from{transform:rotate(-12deg)}to{transform:rotate(18deg)}}
@media(max-width:560px){.shade{align-items:end;padding:8px}.card{width:100%;padding:17px;max-height:82dvh}.card h2{font-size:21px}.intro-art{height:145px}.chapter-dock{left:8px;right:8px;bottom:74px}.chapter-shell{width:100%}.chapter-body{max-height:30dvh}}
</style></head><body><div id="chapterDock" class="chapter-dock hidden"><div class="chapter-shell"><button id="dockHead" class="chapter-head"><div><b id="dockTitle">CAPÍTULO I · 0/5</b><span id="dockObjective">Reconstruye Valoria</span></div><div id="dockArrow" class="arrow">▴</div></button><div id="dockBody" class="chapter-body" hidden><p id="dockWhy" class="why"></p><div id="dockSteps" class="steps"></div><button id="dockAction" class="action">Reconstruir</button></div></div></div><div id="host"></div><script>
(()=>{
const OLD='eldoria-save-v0192',KEY='eldoria-v0194-flow',BUILD_MS=1500;
const order=[
{id:'farm',name:'Granero',title:'Devuelve alimento a Valoria',why:'Sin alimento no hay reino que reconstruir. El Granero devuelve comida a los supervivientes.'},
{id:'lumber',name:'Aserradero',title:'Recupera la madera',why:'La madera permite reparar techos, puertas y andamios. El Aserradero devuelve capacidad de construcción.'},
{id:'quarry',name:'Cantera',title:'Levanta los cimientos',why:'Las murallas y edificios necesitan piedra. La Cantera devuelve materiales resistentes.'},
{id:'forge',name:'Forja',title:'Enciende las fraguas',why:'Valoria necesita herramientas antes de pensar en la guerra. La Forja devuelve hierro trabajado y equipo.'},
{id:'barracks',name:'Cuartel',title:'Valoria vuelve a defenderse',why:'Un reino sin defensa volverá a caer. El Cuartel devuelve una estructura militar a Valoria.'}
];
let p={intro:false,chapterStarted:false,step:0,building:null,complete:false,rewardClaimed:false,chapter2Seen:false};try{p={...p,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
const $=s=>document.querySelector(s);const store=()=>localStorage.setItem(KEY,JSON.stringify(p));
function oldState(){try{return JSON.parse(localStorage.getItem(OLD)||'{}')}catch{return {}}}function saveOld(s){localStorage.setItem(OLD,JSON.stringify(s));}
function prepUnderlying(){if(p.rewardClaimed)return;const s=oldState();s.introSeen=true;s.talked=true;s.stage=1;s.chapterStartedSeen=true;saveOld(s);}
prepUnderlying();const f=document.createElement('iframe');f.id='game';f.src='../v0192/?v0194clean='+Date.now();$('#host').append(f);
function modal(k,title,html,button,cb){document.querySelector('.shade')?.remove();const sh=document.createElement('div');sh.className='shade';sh.innerHTML=`<div class="card"><small>${k}</small><h2>${title}</h2>${html}<button class="btn">${button}</button></div>`;document.body.append(sh);sh.querySelector('.btn').onclick=()=>{sh.remove();cb&&cb()};return sh}
function showIntro(n=0){const scenes=[
{sym:'♜',title:'Valoria ha caído.',copy:'La corona desapareció. Las murallas resisten, pero los edificios que mantenían vivo el reino han quedado inutilizados.'},
{sym:'✦',title:'No puedes salir todavía.',copy:'Antes de perseguir a La Brecha necesitas devolver a Valoria alimento, materiales, herramientas y defensa.'},
{sym:'⚒',title:'Tu primera misión: reconstruir.',copy:'Levantarás cinco edificios esenciales. Cada uno recupera una función concreta del reino. Empieza por el Granero.'}
],s=scenes[n],last=n===scenes.length-1;modal('PRÓLOGO · LAS CENIZAS DE VALORIA',s.title,`<div class="intro-art"><span class="intro-symbol">${s.sym}</span></div><p>${s.copy}</p><div class="dots">${scenes.map((_,i)=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>`,last?'Entrar en Valoria':'Continuar',()=>last?finishIntro():showIntro(n+1))}
function finishIntro(){p.intro=true;store();showChapterStart()}
function showChapterStart(){p.chapterStarted=true;store();modal('COMIENZA EL CAPÍTULO','Capítulo I · Las Cenizas de Valoria','<p>Valoria no necesita mejoras: necesita volver a funcionar. Reconstruye sus pilares en orden y entiende qué devuelve cada uno al reino.</p><div class="reward">RECOMPENSA · Cofre de Reconstrucción<br>Recursos + 1 Esencia Heroica</div>','Comenzar',()=>{updateDock();setDock(true)})}
function setDock(open){const b=$('#dockBody');if(!b)return;b.hidden=!open;$('#dockArrow').textContent=open?'▾':'▴'}
function current(){return order[p.step]||null}
function updateDock(){const dock=$('#chapterDock');if(!dock)return;if(!p.intro||p.complete||p.rewardClaimed||!uiAllowed()){dock.classList.add('hidden');setDock(false);return}dock.classList.remove('hidden');const b=current();$('#dockTitle').textContent=`CAPÍTULO I · ${p.step}/5`;$('#dockObjective').textContent=b?b.title:'Reconstrucción completada';$('#dockWhy').textContent=b?b.why:'';$('#dockSteps').innerHTML=order.map((x,i)=>`<div class="step ${i<p.step?'done':i===p.step?'current':''}"><span>${i<p.step?'✓':i===p.step?'◆':'·'}</span><b>${x.name}</b></div>`).join('');const a=$('#dockAction');a.textContent=p.building?`Construyendo ${b?.name||''}…`:b?`Reconstruir ${b.name}`:'Completado';a.disabled=!!p.building||!b;markBuildings()}
function gameDoc(){try{return f.contentDocument}catch{return null}}
function uiAllowed(){const d=gameDoc();if(!d)return false;if(d.querySelector('.overlay'))return false;const active=d.querySelector('#nav button.active[data-view]');if(active)return active.dataset.view==='kingdom';return true}
function findBuilding(id){const d=gameDoc();if(!d)return null;return d.querySelector(`.building-${id},[data-testid="building-${id}"]`)}
function markBuildings(){const d=gameDoc();if(!d||p.rewardClaimed)return;d.querySelectorAll('.quest-panel,#chapter-toggle,.chapter-list').forEach(n=>n.style.display='none');order.forEach((b,i)=>{const n=findBuilding(b.id);if(!n)return;const built=i<p.step,cur=i===p.step;n.style.opacity=built?'1':cur?'1':'.4';n.style.filter=built?'':cur?'drop-shadow(0 0 18px #d6b66f)':'grayscale(.85)';n.style.pointerEvents='none';const strong=n.querySelector('strong');if(strong)strong.textContent=built?b.name:'Ruinas de '+b.name;const small=n.querySelector('small');if(small)small.textContent=built?'Reconstruido':cur?'Objetivo actual':'Pendiente'});const gate=d.querySelector('#gate');if(gate){gate.style.opacity='.28';gate.style.pointerEvents='none'};d.querySelectorAll('#nav [data-view="world"],#nav [data-view="map"]').forEach(n=>{n.style.opacity='.35';n.style.pointerEvents='none'})}
function build(){if(p.building||p.complete)return;const b=current();if(!b)return;p.building={id:b.id,endsAt:Date.now()+BUILD_MS};store();updateDock();showBuild(b)}
function showBuild(b){const sh=modal('CONSTRUCCIÓN EN CURSO',b.name,`<div class="buildbox"><div class="hammer">⚒</div><p>${b.why}</p><div class="bar"><i></i></div><div class="timer">1.5 s</div></div>`,'Construyendo…',()=>{});const btn=sh.querySelector('.btn');btn.disabled=true;const fill=sh.querySelector('.bar i'),tm=sh.querySelector('.timer');const tick=()=>{if(!p.building)return;const left=Math.max(0,p.building.endsAt-Date.now());fill.style.width=Math.min(100,100-left/BUILD_MS*100)+'%';tm.textContent=(left/1000).toFixed(1)+' s';if(left<=0){sh.remove();finishBuild();return}requestAnimationFrame(tick)};tick()}
function finishBuild(){if(!p.building)return;p.building=null;p.step=Math.min(5,p.step+1);if(p.step>=5)p.complete=true;store();markBuildings();if(p.complete)return setTimeout(showReward,200);updateDock();setDock(false);const b=current();modal('NUEVA MISIÓN',b.title,`<p>${b.why}</p>`,'Continuar',()=>{updateDock();setDock(true)})}
function showReward(){const sh=modal('CAPÍTULO COMPLETADO','Las Cenizas de Valoria','<div class="chest">▣</div><p>Has devuelto a Valoria alimento, materiales, herramientas y defensa. Ahora el reino puede sostener una expedición.</p><div class="reward">+180 comida · +180 madera · +120 piedra · +30 hierro<br>+1 Esencia Heroica</div>','Abrir cofre',()=>{});const btn=sh.querySelector('.btn'),ch=sh.querySelector('.chest');let opened=false;btn.onclick=()=>{if(!opened){opened=true;ch.classList.add('open');btn.textContent='Recoger recompensa';return}claimReward();sh.remove();showChapter2()}}
function claimReward(){if(p.rewardClaimed)return;const s=oldState();s.introSeen=true;s.talked=true;s.firstUpgrade=true;s.stage=2;s.chapterStartedSeen=true;s.resources=s.resources||{food:80,wood:110,stone:75,iron:25};s.resources.food=(s.resources.food||0)+180;s.resources.wood=(s.resources.wood||0)+180;s.resources.stone=(s.resources.stone||0)+120;s.resources.iron=(s.resources.iron||0)+30;s.heroEssence=(s.heroEssence||0)+1;saveOld(s);p.rewardClaimed=true;store();$('#chapterDock').classList.add('hidden')}
function showChapter2(){p.chapter2Seen=true;store();modal('COMIENZA EL CAPÍTULO','Capítulo II · Ecos de la Brecha','<p>Valoria vuelve a sostenerse. A partir de aquí continúa el recorrido que ya conocíamos: salir al mundo, combatir, recuperar la primera reliquia y avanzar hacia héroes, cartas y La Brecha.</p>','Salir al mundo',()=>{f.src='../v0192/?chapter2='+Date.now()})}
function relabel(){const d=gameDoc();if(!d)return;try{d.title='Eldoria v0.19.4';const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){let t=n.nodeValue||'';t=t.replace(/v0\.19\.2/gi,'v0.19.4');if(p.rewardClaimed)t=t.replace(/CAPÍTULO I · LAS CENIZAS DE VALORIA/g,'CAPÍTULO II · ECOS DE LA BRECHA').replace(/Capítulo I · Las Cenizas de Valoria/g,'Capítulo II · Ecos de la Brecha').replace(/Capítulo I/g,'Capítulo II');if(t!==n.nodeValue)n.nodeValue=t}}catch{}}
function bind(){const d=gameDoc();if(!d||d.__v0194clean)return;d.__v0194clean=true;d.addEventListener('click',e=>{const restart=e.target?.closest?.('#restart');if(restart){e.preventDefault();e.stopImmediatePropagation();localStorage.removeItem(KEY);localStorage.removeItem(OLD);location.reload();return}const nav=e.target?.closest?.('#nav button[data-view]');if(nav&&nav.dataset.view!=='kingdom'){setTimeout(updateDock,0)}},true)}
$('#dockHead').onclick=()=>setDock($('#dockBody').hidden);$('#dockAction').onclick=build;
f.addEventListener('load',()=>{setTimeout(()=>{bind();relabel();if(!p.rewardClaimed)markBuildings();updateDock()},250)});
setInterval(()=>{bind();relabel();updateDock();if(!p.rewardClaimed)markBuildings()},300);
if(p.building){if(Date.now()>=p.building.endsAt)finishBuild();else setTimeout(()=>showBuild(order.find(x=>x.id===p.building.id)||current()),400)}
else if(!p.intro)setTimeout(()=>showIntro(),450);else if(!p.chapterStarted)setTimeout(showChapterStart,450);else if(p.complete&&!p.rewardClaimed)setTimeout(showReward,450);else updateDock();
})();
</script></body></html>
