<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11151b" />
  <title>Eldoria v0.19.5 — Las Cenizas de Valoria</title>
  <meta name="eldoria-version" content="0.19.5" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2311151b' stroke='%23d6b66f' stroke-width='4' d='M32 3 57 15 52 50 32 61 12 50 7 15Z'/%3E%3Cpath fill='%23d6b66f' d='M20 17h25v7H28v6h14v7H28v7h18v7H20Z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game" class="game-shell" aria-live="polite">
    <button id="qa-chip" class="qa-chip" data-testid="qa-state">QA STATE</button>
    <header class="topbar">
      <button id="brand" class="brand" data-testid="menu" aria-label="Eldoria">E</button>
      <div class="realm-title"><strong data-i18n="realmName"></strong><span id="realm-level"></span></div><span class="version-badge">v0.19.5</span>
      <button id="power-indicator" class="power-indicator" data-testid="power-indicator" aria-label="Ver desglose de Poder"><span>⚔ PODER</span><b id="power-value">0</b></button>
      <div id="resources" class="resources"></div>
      <button id="language-toggle" class="language-toggle" aria-label="Cambiar idioma" data-testid="language-toggle">ES</button>
      <button id="sound-toggle" data-testid="sound-toggle" class="icon-button" aria-label="Activar o desactivar sonido">◉</button>
    </header>
    <section id="scene" class="scene kingdom-scene">
      <div class="kingdom-atmosphere"><i></i><i></i><i></i></div>
      <svg class="kingdom-silhouette" viewBox="0 0 1200 520" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="citadel-start" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#354047"/><stop offset="1" stop-color="#101619"/></linearGradient></defs><path fill="#0b1014" opacity=".78" d="M0 245 95 182 180 226 270 118 330 202 455 136 530 224 650 92 735 210 842 142 930 225 1040 128 1200 226V520H0Z"/><path fill="url(#citadel-start)" stroke="#9d8756" stroke-opacity=".25" d="M430 330V190h34v-44h20v44h45v-78h22v-33h22v33h25v78h54v-55h22v55h32v140H430Z"/><path fill="#080c0f" d="M0 390Q160 335 310 386T610 372t310 8 280-5v145H0Z"/></svg>
      <div class="sky-glow"></div><div class="citadel-lights"><i></i><i></i><i></i><i></i><i></i></div><div class="rift-corruption"><i></i><i></i><i></i></div><div class="rift rift-distant" aria-label="La Brecha"><i></i><i></i><i></i></div><div class="terrain terrain-back"></div><div class="terrain terrain-front"></div>
      <div id="buildings" class="buildings"></div>
      <button id="aldric" class="character aldric" data-testid="aldric" aria-label="Sir Aldric"><span class="character-glow"></span><span class="helmet">♜</span><span class="character-label"><b>Sir Aldric</b><small>Último guardián de Valoria</small></span></button>
      <button id="gate" class="gate locked" data-testid="world-gate" aria-label="Puerta exterior"><span>⚔</span><b data-i18n="explore"></b></button>
      <div id="particles" class="particles"></div>
    </section>
    <aside id="quest" class="quest-panel"><div class="quest-kicker" data-i18n="firstQuest"></div><strong id="quest-title"></strong><p id="quest-copy"></p><div class="quest-progress"><span id="quest-bar"></span></div><button id="chapter-toggle" data-testid="chapter-toggle" class="chapter-toggle" type="button">Capítulo I · Misiones <span>⌄</span></button><div id="chapter-list" class="chapter-list" hidden></div></aside>
    <nav id="nav" class="bottom-nav"><button class="active" data-view="kingdom" data-testid="nav-kingdom"><span>♜</span><b data-i18n="kingdom"></b></button><button data-view="heroes" data-testid="nav-heroes"><span>♞</span><b data-i18n="heroes"></b></button><button data-view="cards" data-testid="nav-cards"><span>✦</span><b data-i18n="cards"></b><em id="card-badge" hidden>1</em></button><button data-view="world" data-testid="nav-world"><span>⌖</span><b data-i18n="world"></b></button><button data-view="map" data-testid="nav-world-map"><span>◈</span><b data-i18n="map"></b></button><button data-view="profile" data-testid="nav-profile"><span>☰</span><b data-i18n="profile"></b></button></nav>
  </main>
  <div id="modal-root"></div><div id="toast" class="toast" role="status"></div>
  <!-- v0.19.5 consolidated: source separated into stable HTML/CSS/JS. -->
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
