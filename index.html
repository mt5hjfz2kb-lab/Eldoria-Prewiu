ound:transparent;font-size:28px;color:#8f928f;cursor:pointer}.primary,.secondary{display:block;width:100%;margin-top:20px;padding:13px;border:1px solid #e0c781;background:linear-gradient(#b1904e,#6c5225);font:bold 12px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.secondary{background:#171d21}.primary:disabled{opacity:.5}.dialogue,.hero-sheet{display:flex;gap:18px;align-items:center}.portrait{min-width:90px;height:105px;display:grid;place-items:center;font-size:64px;color:#ddd3bb;background:radial-gradient(circle,#7c6c4c,#252a28 70%);border:1px solid #a58a4e}.modal-icon{text-align:center;font-size:68px;color:var(--gold)}.statline{display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;font:13px Arial}.costs{display:flex;justify-content:center;gap:12px;margin-top:18px}.cost{border:1px solid var(--line);padding:7px 10px;font:bold 12px Arial}.cost.ok{color:#9bc491}.cost.bad{color:#d87979}.maxed{text-align:center;color:var(--gold)!important}.combat{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;text-align:center}.combatant span{font-size:60px;display:block}.combatant.foe span{color:#ba58e4}.combatant b{font-size:12px}.versus{color:var(--gold)}.hp{height:8px;background:#080a0c;margin-top:10px;border:1px solid #fff2}.hp i{display:block;height:100%;width:100%;background:#8cb66e;transition:.3s}.foe .hp i{background:#a342af}.danger{background:linear-gradient(#a74e47,#5d2727)}.impact{animation:impact .25s}.reward-card{width:250px;min-height:335px;margin:0 auto;padding:22px;text-align:center;border:2px solid #b95be5;background:radial-gradient(circle at 50% 30%,#672b82,#211326 67%);box-shadow:0 0 25px #aa42d555,inset 0 0 30px #000;border-radius:8px}.reward-card span{display:block;font-size:78px;color:#e1a8fa;text-shadow:0 0 25px #cb50ff;margin:32px 0}.reward-card strong{display:block;font-size:20px;color:#eed7f5}.reward-card small,.reward-card p{font:11px Arial;color:#c /* v0.2: orientación inequívoca en la transición reino → mundo */
.gate.objective{box-shadow:0 0 0 0 #d6b66f88,0 0 24px #d6b66f66;animation:objectivePulse 1.6s infinite}
.gate.objective em{position:absolute;bottom:100%;margin-bottom:8px;background:#d6b66f;color:#17140d;padding:5px 9px;font:bold 9px Arial;font-style:normal;letter-spacing:.12em;white-space:nowrap}
.gate.objective i{position:absolute;right:-19px;font-size:34px;color:var(--gold);animation:nudge 1s infinite}
.scene-enter{animation:sceneEnter .7s}
.location-title{position:absolute;z-index:8;top:25px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}
.location-title small{display:block;font:9px Arial;letter-spacing:.24em;color:var(--gold)}
.location-title strong{font-size:23px;font-weight:normal}
.path i{position:absolute;left:48%;width:8px;height:8px;border-radius:50%;background:#e0c879;box-shadow:0 0 10px #efdc95}
.path i:nth-child(1){bottom:34%}.path i:nth-child(2){bottom:48%;transform:scale(.8)}.path i:nth-child(3){bottom:60%;transform:scale(.6)}
.enemy .objective-arrow{font:9px Arial;color:#17140d;text-shadow:none;background:#d6b66f;padding:5px 8px;margin:0 auto 5px;animation:arrowBounce 1s infinite}
@keyframes sceneEnter{from{opacity:.2;filter:brightness(.2);transform:scale(1.04)}}
@keyframes objectivePulse{50%{box-shadow:0 0 0 12px #d6b66f00,0 0 38px #d6b66f99}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes arrowBounce{50%{transform:translateY(-4px)}}

/* v0.3: combate táctico y consecuencia de La Brecha */
.enemy-intent{margin:18px auto 8px;padding:7px 10px;width:max-content;max-width:100%;background:#27251e;border:1px solid #d6b66f55;font:bold 10px Arial;letter-spacing:.08em;color:#d7caa5}
.enemy-intent.heavy{background:#401d22;border-color:#d86060;color:#ffaaaa;animation:warningPulse .7s infinite}
.combat-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.combat-actions .action{min-height:66px;border:1px solid #ffffff24;background:#1b2227;cursor:pointer;padding:8px}
.combat-actions .action b,.combat-actions .action small{display:block}.combat-actions .action small{margin-top:5px;font:9px Arial;color:#aaa}
.combat-actions .attack-action{border-color:#b65d54}.combat-actions .guard-action{border-color:#6e91a8}.combat-actions .rift-action{border-color:#a64fd0;background:#28182f}.combat-actions .action:disabled{opacity:.35}
.enemy-intent b,.enemy-intent span{display:block}.enemy-intent span{margin-top:5px;font:9px Arial;letter-spacing:.12em}
.combat-actions .guard-action.recommended{background:#244b52;border:2px solid #8fd4d0;box-shadow:0 0 0 0 #8fd4d088,0 0 22px #67bdc477;animation:defendNow 1s infinite}
.combat-actions .guard-action.recommended small{color:#bffffa}.combat-actions .attack-action.risky{opacity:.62;background:#31191b}.combat-actions .attack-action.risky small{color:#ff9c9c}
.rift-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.rift-choices .choice{min-height:115px;padding:15px;border:1px solid;background:#171d21;cursor:pointer}.rift-choices b,.rift-choices small{display:block}.rift-choices b{font-size:17px}.rift-choices small{margin-top:10px;font:11px/1.4 Arial;color:#bbb}.rift-choices .contain{border-color:#72af9b}.rift-choices .exploit{border-color:#b94ce9;background:#27172d}
.rift-choices .choice>span{display:block;font-size:45px;margin-bottom:10px}.rift-choices .contain>span{color:#91dbc3;text-shadow:0 0 18px #50c9a4}.rift-choices .exploit>span{color:#dc87ff;text-shadow:0 0 18px #c13ef6}.rift-choices .choice:hover{transform:translateY(-3px);filter:brightness(1.18)}
.contained-card{border-color:#6fb39c;background:radial-gradient(circle at 50% 30%,#285f58,#142523 67%)}.contained-card span{color:#9de1c7;text-shadow:0 0 25px #58d1ad}
.kingdom-scene.rift-exploit:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 62% 75%,#9f2fff32,transparent 32%);box-shadow:inset 0 0 70px #8e24b82e}
.kingdom-scene.rift-contain:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 72% 72%,#65c49b24,transparent 32%)}
@keyframes warningPulse{50%{filter:brightness(1.5)}}
@keyframes defendNow{50%{box-shadow:0 0 0 7px #8fd4d000,0 0 30px #67bdc499;transform:translateY(-2px)}}
@media(max-width:560px){.combat-actions{grid-template-columns:1fr}.combat-actions .action{min-height:48px}.rift-choices{grid-template-columns:1fr}.rift-choices .choice{min-height:80px}}

/* v0.6: informe local de playtest */
.privacy-note{font-size:11px!important;color:#8eb7a6!important;text-align:center}.playtest-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}.playtest-stats div{background:#0d1215;border:1px solid #ffffff16;padding:12px 6px;text-align:center}.playtest-stats b,.playtest-stats small{display:block}.playtest-stats b{font-size:18px;color:var(--gold)}.playtest-stats small{margin-top:5px;font:9px Arial;color:#aaa}#report-text{width:100%;min-height:145px;resize:none;background:#090d10;color:#bfc5bf;border:1px solid #ffffff20;padding:12px;font:11px/1.5 monospace}@media(max-width:520px){.playtest-stats{grid-template-columns:1fr 1fr}}

/* v0.6.1: controles resistentes a resoluciones y zoom diferentes */
.topbar,.resources,.resource,.bottom-nav button,.modal,.combat-actions>*{min-width:0}
.resource span{overflow:hidden;text-overflow:ellipsis}.bottom-nav button{overflow:hidden}
.modal button{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.combat-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.rift-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.realm-title{max-width:150px;overflow:hidden}.realm-title strong,.realm-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gate{right:3%;bottom:5%}.quest-panel{max-width:58vw}.modal h2{font-size:20px}.costs{flex-wrap:wrap}}
@media(max-width:560px){.combat-actions,.rift-choices{grid-template-columns:1fr}.combat-actions .action,.rift-choices .choice{height:auto;min-height:56px}.modal{max-height:92vh}}
@media(max-height:680px){.modal{max-height:94vh;padding:18px}.modal h2{margin-bottom:12px}.combatant span{font-size:42px}.combat-actions .action{min-height:48px}.enemy-intent{margin:10px auto 5px}.bottom-nav{height:64px}.scene{bottom:64px}}

/* v0.7: premisa clara y guía contextual paso a paso */
.intro-mark{width:74px;height:74px;margin:0 auto 18px;display:grid;place-items:center;clip-path:polygon(50% 0,92% 20%,84% 83%,50% 100%,16% 83%,8% 20%);background:linear-gradient(135deg,#6b5730,#211b11);color:var(--gold);font-size:48px}.intro-lead{text-align:center;font-size:16px!important;line-height:1.55!important}.intro-dialogue{margin-top:20px;padding-top:18px;border-top:1px solid #ffffff18}.intro-dialogue p{font-size:14px}.building.objective{z-index:14;animation:buildingGuide 1.4s infinite}.building.objective em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;background:var(--gold);color:#17140d;padding:5px 8px;font:bold 9px Arial;font-style:normal;white-space:nowrap}.bottom-nav button.objective{color:#f4dc9a;background:#6a522f;box-shadow:inset 0 0 20px #d6b66f55;animation:navGuide 1.3s infinite}.effectline{display:grid;gap:6px;margin-top:10px;padding:10px;background:#0d1216;border:1px solid #ffffff13;font:11px/1.35 Arial}.effectline span{color:#aaa}.effectline strong{color:#a7d4ad}@keyframes buildingGuide{50%{filter:drop-shadow(0 0 18px #f1cf73);transform:translate(-50%,-55%) scale(1.06)}}@keyframes navGuide{50%{box-shadow:inset 0 0 28px #d6b66f99;filter:brightness(1.2)}}


/* v0.10: decisión económica, combate y gancho */
.war-budget{margin:0 0 14px;padding:12px;border:1px solid #e0bd65;background:#17140c;text-align:center}.war-budget b{display:block;color:#ffe19a;font:700 20px Georgia,serif}.war-budget small{color:#ddd;font:11px Arial}
.war-options{display:grid;gap:10px}.war-option{width:100%;padding:13px;border:2px solid #8e7541;background:#171a1d;color:#fff;text-align:left;cursor:pointer}.war-option b,.war-option small,.war-option em{display:block}.war-option b{font:700 15px Arial}.war-option small{margin-top:5px;color:#e6e2d8;font:11px/1.4 Arial}.war-option em{margin-top:8px;color:#ffda7b;font:700 10px Arial;font-style:normal}.war-option.ballista{border-color:#d68b4b;background:#352014}.war-option.ward{border-color:#6db9dd;background:#142b38}.war-option.hospital{border-color:#79bb8b;background:#173020}

  <script>
(() => {
  'use strict';
  const D = window.ELDORIA_DATA;
  const initialState = () => ({
    resources: { food: 80, wood: 110, stone: 75, iron: 25 },
    buildings: { keep: 1, farm: 1, lumber: 1, quarry: 1, forge: 1 },
    stage: 0, introSeen: false, talked: false, firstUpgrade: false, enemyHp: 100, playerHp: 100,
    hasCard: false, cardUsed: false, complete: false, worldSeen: false, riftChoice: null,
    loop2Unlocked: false, loop2Choice: null, secondCombat: false, secondVictory: false, secondRewardClaimed: false, companion: null, thirdCombat: false, thirdVictory: false, thirdRewardClaimed: false, relicOwned: false, relicEquipped: false, firstXpAwarded: false, ashFragments: 0, warPlan: null, hookSeen: false, heroXp: { aldric: 0, lyra: 0, maelis: 0 }, continueIntent: null, lastTick: Date.now(),
    metrics: { runId: Math.random().toString(36).slice(2,8).toUpperCase(), startedAt: Date.now(), firstUpgradeSeconds: null, worldSeconds: null, combatTurns: 0, guardUses: 0, heavyGuards: 0, companionUses: 0, techniqueUses: 0, armorBreaks: 0, shieldAbsorbed: 0, fieldHealing: 0, warPlan: null, hookSeenSeconds: null, riftChoice: null, completedSeconds: null }
  });
  let state = load();
  let view = 'kingdom';
  let modal = null;
  let combatTurn = 0;
  let riftAvailable = true;
  let companionAvailable = true;
  let combatEnergy = 0;
  let enemyArmor = 0;
  let campaignShield = 0;
  let enemyMaxHp = 100;

  const $ = s => document.querySelector(s);
  const el = (tag, cls, html='') => { const n=document.createElement(tag); n.className=cls; n.innerHTML=html; return n; };
  const fmt = n => Math.floor(n).toLocaleString('es-ES');
  const heroLevel = id => Math.min(20,1+Math.floor((state.heroXp[id]||0)/100));
  const heroProgress = id => (state.heroXp[id]||0)%100;
  function awardXp(id,amount){ state.heroXp[id]=(state.heroXp[id]||0)+amount; }

  function load(){ try { const base=initialState(), stored=JSON.parse(localStorage.getItem('eldoria-save-v010')||'{}'); return { ...base, ...stored, heroXp:{...base.heroXp,...(stored.heroXp||{})}, metrics:{...base.metrics,...(stored.metrics||{})} }; } catch { return initialState(); } }
  function save(){ state.lastTick=Date.now(); localStorage.setItem('eldoria-save-v010', JSON.stringify(state)); }

  function init(){
    document.querySelectorAll('[data-i18n]').forEach(n => n.textContent=D.i18n[n.dataset.i18n]);
    $('#aldric').onclick = talkAldric; $('#gate').onclick = () => { if(state.firstUpgrade) showWorld(); else toast('Sir Aldric necesita hablar contigo.'); };

    document.querySelectorAll('#nav button').forEach(b => b.onclick=()=>navigate(b.dataset.view));
    applyOfflineProduction(); render(); setInterval(tick, 1000);
    if(state.stage===0&&!state.introSeen) setTimeout(showIntro,350);
  }
  function applyOfflineProduction(){
    const seconds=Math.min(120, Math.max(0,(Date.now()-(state.lastTick||Date.now()))/1000));
    if(seconds>3){ Object.entries(production()).forEach(([k,v])=>state.resources[k]+=v*seconds); toast(`Producción acumulada durante ${Math.floor(seconds)} s.`); }
  }
  function production(){

  }
  function victoryImpact(data,done){
    const impact=el('div',`choice-impact-overlay victory-impact-overlay ${data.cls}`,`<div class="choice-impact victory-impact"><small>${data.eyebrow}</small><span>${data.icon}</span><strong>${data.title}</strong><b>${data.reward}</b><p>${data.result}</p><button class="choice-impact-continue victory-continue">${data.action}</button></div>`);
    document.body.append(impact);
    $('.victory-continue',impact).onclick=()=>{impact.remove();done();};
  }
  function resolveVictory(){
    if(state.thirdCombat){
      if(!state.thirdVictory){awardXp('aldric',80);awardXp(state.companion,80);}
      state.thirdVictory=true;state.stage=8;save();renderQuest();showThirdReward();return;
    }
    if(state.secondCombat){
      if(!state.secondVictory)awardXp('aldric',60);
      state.secondVictory=true; state.stage=7; save(); renderQuest(); showSecondReward(); return;
    }
    if(!state.firstXpAwarded){awardXp('aldric',40);state.firstXpAwarded=true;save();}
    openModal('El poder exige una decisión',`<p>El fragmento puede convertirse en un motor de crecimiento o romperse para liberar todo su poder ahora. Ninguna opción es gratuita.</p><div class="rift-choices"><button id="contain" class="choice contain"><span>⛨</span><b>Forjar el Gran Sello</b><small><strong>CRECIMIENTO:</strong> +50% de producción permanente en esta partida.<br>Botín inmediato moderado.</small></button><button id="exploit" class="choice exploit"><span>✦</span><b>Desatar la Brecha</b><small><strong>PODER:</strong> enorme botín inmediato.<br>La corrupción marcará Valoria.</small></button></div>`);
    $('#contain').onclick=()=>claimReward('contain'); $('#exploit').onclick=()=>claimReward('exploit');
  }
  function showSecondReward(){
    openModal('Núcleo de Ceniza',`<p class="intro-lead">El Guardián cae, pero su corazón continúa latiendo.</p><div class="second-reward"><span>◆</span><strong>NÚCLEO DE CENIZA</strong><b>+120 piedra · +80 hierro · +3 fragmentos</b><small>Dos voces responden desde el norte. Sus fragmentos solo bastarán para una inversión de campaña.</small></div><button id="claim-second" class="primary">Recoger y regresar a Valoria</button>`);
    $('#claim-second').onclick=()=>{
      if(!state.secondRewardClaimed){state.resources.stone+=120;state.resources.iron+=80;state.ashFragments=3;state.secondRewardClaimed=true;save();}
      closeModal();showKingdom();burst();toast('El Núcleo de Ceniza ha llegado a Valoria.');
      setTimeout(showCompanionChoice,650);
    };
  }
  function showFutureStep(){
    if(!state.secondRewardClaimed)return showSecondReward();
    if(!state.companion)return showCompanionChoice();
    if(!state.warPlan&&!state.thirdVictory)return showWarCouncil();
    if(!state.thirdVictory)return showWorld();
    if(!state.thirdRewardClaimed)return showThirdReward();
    return state.relicEquipped?showContinuationHook():heroesModal();
  }
  function showCompanionChoice(){
    openModal('Elige a tu compañero',`<p class="intro-lead">El Núcleo ha despertado a dos supervivientes. Esta elección cambia la habilidad disponible en la tercera expedición.</p><div class="continuation-choices"><button id="choose-lyra" class="choice companion-choice"><span>➶</span><b>Lyra, Exploradora del Velo</b><small><strong>LLUVIA DE FLECHAS:</strong> 55 de daño una vez por combate.</small></button><button id="choose-maelis" class="choice companion-choice alt"><span>✧</span><b>Maelis, Guardiana del Alba</b><small><strong>LUZ RESTAURADORA:</strong> cura 35 y causa 22 de daño una vez.</small></button></div>`);
    $('#choose-lyra').onclick=()=>chooseCompanion('lyra');
    $('#choose-maelis').onclick=()=>chooseCompanion('maelis');
  }
  function chooseCompanion(id){
    state.companion=id;save();closeModal();
    const lyra=id==='lyra';
    const impact=el('div','choice-impact-overlay companion-impact',`<div class="choice-impact"><small>NUEVO HÉROE</small><span>${lyra?'➶':'✧'}</span><strong>${lyra?'LYRA':'MAELIS'}</strong><b>${lyra?'LLUVIA DE FLECHAS · 55 DAÑO':'LUZ RESTAURADORA · CURA 35'}</b><p>Se ha unido a la expedición de Aldric.</p><button class="choice-impact-continue">CONTINUAR</button></div>`);
    document.body.append(impact);
    $('.choice-impact-continue',impact).onclick=()=>{impact.remove();showKingdom();toast('Objetivo: decide cómo gastar los fragmentos del Núcleo.');setTimeout(showWarCouncil,500);};
  }
  function showWarCouncil(){
    const left=state.ashFragments||0;
    openModal('Consejo de guerra',`<div class="war-budget"><b>◆ ${left} FRAGMENTOS DEL NÚCLEO</b><small>Cada proyecto cuesta 2. Después de elegir solo quedará 1: no podrás construir los demás.</small></div><div class="war-options"><button id="plan-ballista" class="war-option ballista"><b>⚒ Balista rompeasedios</b><small>Reduce la armadura inicial del Avatar. Facilita romper sus defensas.</small><em>COSTE · 2 FRAGMENTOS</em></button><button id="plan-ward" class="war-option ward"><b>◇ Égida rúnica</b><small>Absorbe los primeros 24 puntos de daño de la expedición.</small><em>COSTE · 2 FRAGMENTOS</em></button><button id="plan-hospital" class="war-option hospital"><b>✚ Hospital de campaña</b><small>Defender restaura 8 puntos de vida adicionales.</small><em>COSTE · 2 FRAGMENTOS</em></button></div><p class="privacy-note">Elección irreversible durante esta partida.</p>`);
    $('#plan-ballista').onclick=()=>selectWarPlan('ballista');
    $('#plan-ward').onclick=()=>selectWarPlan('ward');
    $('#plan-hospital').onclick=()=>selectWarPlan('hospital');
  }
  function selectWarPlan(plan){
    if(state.warPlan)return;
    if((state.ashFragments||0)<2)return toast('No tienes fragmentos suficientes.');
    state.ashFragments-=2;state.warPlan=plan;state.metrics.warPlan=plan;save();closeModal();
    const data=plan==='ballista'?{icon:'⚒',name:'BALISTA ROMPEASEDIOS',effect:'ARMADURA INICIAL REDUCIDA'}:plan==='ward'?{icon:'◇',name:'ÉGIDA RÚNICA',effect:'ESCUDO INICIAL · 24'}:{icon:'✚',name:'HOSPITAL DE CAMPAÑA',effect:'DEFENDER · CURACIÓN +8'};
    const impact=el('div','choice-impact-overlay companion-impact',`<div class="choice-impact"><small>INVERSIÓN REALIZADA · QUEDA 1 FRAGMENTO</small><span>${data.icon}</span><strong>${data.name}</strong><b>${data.effect}</b><p>Los otros dos proyectos ya no pueden financiarse.</p><button class="choice-impact-continue">CONTINUAR</button></div>`);
    document.body.append(impact);$('.choice-impact-continue',impact).onclick=()=>{impact.remove();showKingdom();toast('La tercera expedición está preparada.');};
  }
  function showThirdReward(){
    openModal('Eco del Primer Rey',`<p class="intro-lead">El Avatar se deshace. Bajo su trono aparece una memoria que pronuncia el nombre de Aldric.</p><div class="second-reward"><span>♛</span><strong>ECO DEL PRIMER REY</strong><b>RELIQUIA LEGENDARIA · +150 hierro</b><small>La reconstrucción de Valoria solo era el comienzo.</small></div><button id="claim-third" class="primary">Reclamar reliquia y regresar</button>`);
    $('#claim-third').onclick=()=>{
      if(!state.thirdRewardClaimed){state.resources.iron+=150;state.thirdRewardClaimed=true;state.relicOwned=true;save();}
      closeModal();showKingdom();burst();toast('Nueva reliquia: abre Héroes para equiparla.');
    };
  }
  function showContinuationHook(){
    if(!state.hookSeen){state.hookSeen=true;state.metrics.hookSeenSeconds=elapsed();save();}
    openModal('Capítulo II · Bloqueado',`<p class="intro-lead">El Eco del Primer Rey abre una ruta que no estaba en ningún mapa.</p><div class="locked-chapter"><div class="locked-region"><small>NUEVA REGIÓN</small><span>◈</span><strong>MAR DE CRISTAL</strong><em>BLOQUEADA EN ESTA PRUEBA</em></div><div class="locked-reveals"><article><span>?</span><b>Heredera del Velo</b><small>Héroe desconocido</small></article><article><span>♆</span><b>Leviatán de Vidrio</b><small>Criatura de región</small></article></div><p>La Brecha no era una invasión. Era una llamada.</p></div><button id="hook-continue" class="primary">Quiero saber qué ocurre</button>`);
    $('#hook-continue').onclick=()=>{closeModal();showIntentChoice();};
  }
  function showIntentChoice(){
    openModal('¿Seguirías jugando?',`<p class="intro-lead">Has reconstruido Valoria, elegido dos mejoras, reclutado un héroe y superado tres combates.</p><p>Si hubiera más contenido disponible ahora mismo, ¿jugarías diez minutos más?</p><div class="intent-choices"><button id="intent-yes"><b>Sí, continuaría ahora</b><small>Quiero descubrir qué ocurre después.</small></button><button id="intent-maybe" class="maybe"><b>Quizá</b><small>Dependería del contenido o de las recompensas.</small></button><button id="intent-no" class="no"><b>No, pararía aquí</b><small>El recorrido no me genera suficiente interés.</small></button></div>`);
    $('#intent-yes').onclick=()=>finishSlice('yes');
    $('#intent-maybe').onclick=()=>finishSlice('maybe');
    $('#intent-no').onclick=()=>finishSlice('no');
  }
  function finishSlice(choice){
    state.continueIntent=choice;state.complete=true;state.metrics.completedSeconds=elapsed();save();renderQuest();
    const label=choice==='yes'?'Sí, continuaría ahora':choice==='maybe'?'Quizá continuaría':'No continuaría';
    openModal('Vertical slice completado',`<div class="intro-mark">✓</div><p class="intro-lead">Has completado las tres expediciones disponibles.</p><p>Tu respuesta: <strong>${label}</strong>.</p><p><strong>Nivel máximo de esta prueba: 3.</strong><br>No necesitas seguir mejorando.</p><button id="finish-report" class="primary">Ver y copiar resumen</button>`);
    $('#finish-report').onclick=showPlaytestSummary;
  }
  function claimReward(choice){
    state.riftChoice=choice; state.metrics.riftChoice=choice; state.hasCard=true; state.stage=3; save();
    const exploit=choice==='exploit', name=exploit?'Pulso de Abundancia':'Gran Sello de la Vigilia';
    openModal(exploit?'La Brecha ha sido explotada':'La Brecha ha sido contenida',`<div class="reward-card ${exploit?'':'contained-card'}"><div class="rarity">RARA</div><span>${exploit?'✦':'⛨'}</span><strong>${name}</strong><p>${exploit?'Gran descarga de recursos inmediatos.':'Recursos equilibrados obtenidos al estabilizar el fragmento.'}</p><small>${exploit?'El poder deja una cicatriz violeta en Valoria.':'El bosque respira, pero el fragmento pierde parte de su fuerza.'}</small></div><button id="claim" class="primary">Guardar carta y regresar</button>`);
    $('#claim').onclick=()=>{closeModal();showKingdom();toast('Tu decisión ha cambiado el reino.');render();};
  }
  function showKingdom(){
    view='kingdom'; navActive('kingdom'); $('#scene').className=`scene kingdom-scene ${state.riftChoice?`rift-${state.riftChoice}`:''} ${state.loop2Choice?`route-${state.loop2Choice}`:''} ${state.warPlan?`plan-${state.warPlan}`:''}`;
    const needsCouncil=state.companion&&!state.warPlan&&!state.thirdVictory;
    const gateObjective=(state.firstUpgrade&&!state.hasCard)||(state.companion&&!state.thirdVictory)?' objective':'';
    const future=!state.complete&&state.secondVictory;
    const futureLabel=state.thirdVictory?(state.thirdRewardClaimed?(state.relicEquipped?'CAPÍTULO II':'SALÓN DE HÉROES'):'RELIQUIA LEGENDARIA'):needsCouncil?'CONSEJO DE GUERRA':state.companion?'FORTALEZA SEPULTADA':state.secondRewardClaimed?'ELIGE COMPAÑERO':'NÚCLEO DE CENIZA';
    const futureSmall=state.thirdVictory?(state.thirdRewardClaimed?(state.relicEquipped?'DESCUBRE QUÉ AGUARDA':'EQUIPA EL ECO DEL REY'):'RECOGE LA RECOMPENSA'):needsCouncil?'INVIERTE 2 DE 3 FRAGMENTOS':state.companion?'TERCERA EXPEDICIÓN':state.secondRewardClaimed?'DOS HÉROES RESPONDEN':'RECOGE LA RECOMPENSA';
    const gateName=needsCouncil?'Preparar expedición':state.companion&&!state.thirdVictory?'Fortaleza sepultada':'Salir al mundo';
    $('#scene').innerHTML=`<div class="sky-glow"></div><div class="rift rift-distant"><i></i><i></i><i></i></div><div class="terrain terrain-back"></div><div class="terrain terrain-front"></div>${future?`<button id="future-signal" class="future-signal"><span>◆</span>${futureLabel}<small>${futureSmall}</small></button>`:''}<div id="buildings" class="buildings"></div><button id="aldric" class="character aldric"><span class="character-glow"></span><span class="helmet">♜</span><span class="character-label">Sir Aldric</span></button><button id="gate" class="gate${gateObjective}">${gateObjective?'<em>SIGUIENTE PASO</em><i>›</i>':''}<span>⚔</span><b>${gateName}</b></button><div id="particles" class="particles"></div>`;
    $('#aldric').onclick=talkAldric; $('#gate').onclick=needsCouncil?showWarCouncil:showWorld; if($('#future-signal'))$('#future-signal').onclick=showFutureStep; render();
  }
  function heroCard(id){
    const isAldric=id==='aldric', lyra=id==='lyra';
    const name=isAldric?'Sir Aldric':lyra?'Lyra':'Maelis';
    const role=isAldric?'Caballero · Guardián':lyra?'Exploradora · Tiradora':'Guardiana · Sanadora';
    const icon=isAldric?'♜':lyra?'➶':'✧';
    const skill=isAldric?'Guardia férrea · reduce el daño':lyra?'Lluvia de flechas · 55 daño':'Luz restauradora · cura 35';
    const level=heroLevel(id), progress=heroProgress(id), base=isAldric?820:lyra?610:625;
    const power=base+(level-1)*25+(isAldric&&state.relicEquipped?120:0);
    return `<article class="hero-progress-card ${isAldric?'':'companion'}"><div class="hero-avatar">${icon}</div><div class="hero-main"><h3>${name}</h3><small>${role}</small><div class="hero-level"><span>NIVEL ${level}</span><span>${progress} / 100 XP</span></div><div class="xp-track"><i style="width:${progress}%"></i></div><div class="hero-skill"><b>HABILIDAD</b><br>${skill}</div><div class="hero-power">PODER ${power.toLocaleString('es-ES')}</div></div></article>`;
  }
  function heroesModal(){
    const roster=heroCard('aldric')+(state.companion?heroCard(state.companion):'');
    const relic=state.relicOwned?`<div class="gear-slot legendary"><span>RELIQUIA</span><b>♛ Eco del Primer Rey ${state.relicEquipped?'· EQUIPADO':'· +120 poder'}</b></div>`:`<div class="gear-slot"><span>RELIQUIA</span><b>Vacío</b></div>`;
    openModal('Salón de Héroes',`<div class="hero-roster-head"><b>HÉROES ${state.companion?'2':'1'} / 12</b><span>Poder y progresión</span></div><div class="hero-roster">${roster}</div><section class="equipment-panel"><h3>Equipo de Sir Aldric</h3><div class="gear-slots"><div class="gear-slot"><span>ARMA</span><b>Espada de Valoria</b></div><div class="gear-slot"><span>ARMADURA</span><b>Malla del Guardián</b></div>${relic}</div>${state.relicOwned&&!state.relicEquipped?'<button id="equip-relic" class="primary">Equipar reliquia</button>':''}</section><p class="heroes-note">Cada 100 XP aumenta el nivel. En el juego final, nivel, habilidades y equipo tendrán progresión independiente.</p>`);
    if($('#equip-relic'))$('#equip-relic').onclick=equipRelic;
  }
  function equipRelic(){
    state.relicEquipped=true;save();renderQuest();renderNavigationGuides();
    openModal('Reliquia equipada',`<div class="intro-mark">♛</div><p class="intro-lead"><strong>Eco del Primer Rey</strong> aumenta el poder de Sir Aldric en 120.</p><div class="effect-status permanent">SIR ALDRIC · PODER +120</div><button id="equipment-continue" class="primary">Continuar</button>`);
    $('#equipment-continue').onclick=()=>{closeModal();showKingdom();setTimeout(showContinuationHook,500);};
  }
  function navigate(target){
    if(target==='kingdom') return showKingdom(); if(target==='world') return state.firstUpgrade?showWorld():toast('Completa la primera mejora para abrir el mundo.');
    navActive(target);
    if(target==='heroes')heroesModal();
    if(target==='cards') cardsModal();
  }
  function cardsModal(){
    const exploit=state.riftChoice==='exploit'; const name=exploit?'Pulso de Abundancia':'Gran Sello de la Vigilia'; const amounts=exploit?'+220 comida · +180 madera · +110 piedra · +70 hierro':'+90 comida · +90 madera · +90 piedra · +40 hierro · después +50% producción';
    const status=exploit
      ?`<div class="effect-status instant">${state.cardUsed?'CONSUMIDA · RECURSOS ENTREGADOS UNA VEZ':'EFECTO INSTANTÁNEO · SE CONSUME AL USARLA'}</div>`
      :`<div class="effect-status permanent">${state.cardUsed?'ACTIVA · HASTA REINICIAR LA PARTIDA':'DURACIÓN: TODA ESTA PARTIDA'}</div>`;
    const card=state.hasCard?`<div class="reward-card small ${exploit?'':'contained-card'} ${state.cardUsed?'spent':''}"><div class="rarity">RARA</div><span>${exploit?'✦':'⛨'}</span><strong>${name}</strong><p>${amounts}</p></div>${status}`:`<div class="empty"><span>◇</span><p>Tu primera carta aguarda más allá de la Brecha.</p></div>`;
    openModal('Cartas',`${card}${state.hasCard&&!state.cardUsed?'<button id="use-card" class="primary">Usar carta</button>':''}`); if($('#use-card')) $('#use-card').onclick=useCard;
  }
  function useCard(){
    const exploit=state.riftChoice==='exploit', reward=exploit?{food:220,wood:180,stone:110,iron:70}:{food:90,wood:90,stone:90,iron:40};
    Object.entries(reward).forEach(([r,v])=>state.resources[r]+=v); state.cardUsed=true; state.stage=4; save();
    openModal(exploit?'Carta consumida':'Bonificación activada',`<div class="intro-mark">${exploit?'✦':'⛨'}</div><p class="intro-lead">${exploit?'Los recursos se han añadido una sola vez. Esta carta no tiene duración: su efecto es instantáneo.':'Producción +50% durante toda esta partida, sin límite de tiempo. Solo termina al reiniciar.'}</p><div class="effect-status ${exploit?'instant':'permanent'}">${exploit?'EFECTO FINALIZADO · RECURSOS ENTREGADOS':'ACTIVA · PERMANENTE EN ESTA PARTIDA'}</div><button id="card-result-continue" class="primary">Continuar a Valoria</button>`);
    $('#card-result-continue').onclick=()=>{closeModal();showKingdom();burst();toast(exploit?'Recursos añadidos.':'Gran Sello activo permanentemente.');render();};
  }
  function dialogue(name,copy,done){ openModal(name,`<div class="dialogue"><div class="portrait">♜</div><p>${copy}</p></div><button id="continue" class="primary">Continuar</button>`); $('#continue').onclick=()=>{closeModal(); if(done)done();}; }
  function openModal(title,body){ closeModal(); modal=el('div','overlay',`<section class="modal"><button class="close" aria-label="Cerrar">×</button><h2>${title}</h2>${body}</section>`); $('#modal-root').append(modal); modal.querySelector('.close').onclick=closeModal; }
  function closeModal(){ if(modal){modal.remove();modal=null;} }
  function navActive(target){ document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===target)); }
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),2600); }
  function burst(){ const p=$('#particles'); if(!p)return; p.innerHTML=Array.from({length:16},(_,i)=>`<i style="--a:${i*22.5}deg;--d:${50+Math.random()*90}px"></i>`).join(''); setTimeout(()=>p.innerHTML='',900); }
  function soundToggle(){ $('#sound-toggle').classList.toggle('muted'); toast($('#sound-toggle').classList.contains('muted')?'Sonido desactivado':'Sonido activado'); }
  function elapsed(){ return Math.max(0,Math.round((Date.now()-state.metrics.startedAt)/1000)); }
  function duration(seconds){ if(seconds===null||seconds===undefined)return '—'; const m=Math.floor(seconds/60),s=seconds%60; return `${m}m ${s}s`; }
  function reportText(){ const m=state.metrics; return `ELDORIA PLAYTEST v0.10-dev | Partida ${m.runId}\nPrimera mejora: ${duration(m.firstUpgradeSeconds)}\nEntrada al mundo: ${duration(m.worldSeconds)}\nTurnos de combate: ${m.combatTurns}\nUsos de Defender: ${m.guardUses}\nGolpes brutales defendidos: ${m.heavyGuards}\nDecisión: ${m.riftChoice==='contain'?'Forjar el Gran Sello':m.riftChoice==='exploit'?'Desatar la Brecha':'—'}\nPreparación: ${state.loop2Choice==='forge'?'Forja · ataque':state.loop2Choice==='quarry'?'Cantera · defensa':'—'}\nSegunda expedición: ${state.secondVictory?'Completada':'—'}\nCompañero: ${state.companion==='lyra'?'Lyra · daño':state.companion==='maelis'?'Maelis · curación':'—'}\nNivel de Aldric: ${heroLevel('aldric')} · XP total: ${state.heroXp.aldric||0}\nNivel de compañero: ${state.companion?heroLevel(state.companion):'—'}\nHabilidad de compañero usada: ${m.companionUses||0}\nInversión de campaña: ${state.warPlan==='ballista'?'Balista rompeasedios':state.warPlan==='ward'?'Égida rúnica':state.warPlan==='hospital'?'Hospital de campaña':'—'}\nFragmentos restantes: ${state.ashFragments||0}\nTécnicas usadas: ${m.techniqueUses||0}\nArmaduras rotas: ${m.armorBreaks||0}\nDaño absorbido por Égida: ${m.shieldAbsorbed||0}\nCuración del Hospital: ${m.fieldHealing||0}\nGancho del Capítulo II visto: ${state.hookSeen?'Sí · '+duration(m.hookSeenSeconds):'No'}\nReliquia equipada: ${state.relicEquipped?'Eco del Primer Rey':'—'}\nTercera expedición: ${state.thirdVictory?'Completada':'—'}\n¿Jugaría 10 minutos más?: ${state.continueIntent==='yes'?'Sí':state.continueIntent==='maybe'?'Quizá':state.continueIntent==='no'?'No':'—'}\nTiempo total: ${duration(m.completedSeconds)}`; }
  function showPlaytestSummary(){
    const m=state.metrics, defense=m.heavyGuards>0?'Comprendió la defensa contextual':'No defendió ningún golpe brutal';
    openModal('Informe de la expedición',`<p class="privacy-note">Estos datos permanecen en este dispositivo. No se envía información por Internet.</p><div class="playtest-stats"><div><b>${duration(m.completedSeconds)}</b><small>Tiempo total</small></div><div><b>${m.combatTurns}</b><small>Turnos</small></div><div><b>${m.guardUses}</b><small>Defensas</small></div><div><b>${m.heavyGuards}</b><small>Defensas oportunas</small></div></div><p><strong>${defense}</strong><br>Elección: ${m.riftChoice==='contain'?'Forjar el Gran Sello':'Desatar la Brecha'}</p><textarea id="report-text" readonly>${reportText()}</textarea><button id="copy-report" class="primary">Copiar resumen</button>`);
    $('#copy-report').onclick=copyReport;
  }
  function copyReport(){ const field=$('#report-text'),done=()=>toast('Resumen copiado.'); if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(field.value).then(done).catch(()=>{field.select();document.execCommand('copy');done();}); else{field.select();document.execCommand('copy');done();} }
  function showMenu(){ openModal('Eldoria',`<p>Vertical slice · El despertar de la Brecha</p>${state.complete?'<button id="view-report" class="primary">Ver informe de prueba</button>':''}<button id="restart" class="secondary">Reiniciar partida</button>`); if($('#view-report'))$('#view-report').onclick=showPlaytestSummary; $('#restart').onclick=()=>{localStorage.removeItem('eldoria-save-v010');location.reload();}; }
  init();
})();

</script>
</body>
</html>
