ound:transparent;font-size:28px;color:#8f928f;cursor:pointer}.primary,.secondary{display:block;width:100%;margin-top:20px;padding:13px;border:1px solid #e0c781;background:linear-gradient(#b1904e,#6c5225);font:bold 12px Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.secondary{background:#171d21}.primary:disabled{opacity:.5}.dialogue,.hero-sheet{display:flex;gap:18px;align-items:center}.portrait{min-width:90px;height:105px;display:grid;place-items:center;font-size:64px;color:#ddd3bb;background:radial-gradient(circle,#7c6c4c,#252a28 70%);border:1px solid #a58a4e}.modal-icon{text-align:center;font-size:68px;color:var(--gold)}.statline{display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;font:13px Arial}.costs{display:flex;justify-content:center;gap:12px;margin-top:18px}.cost{border:1px solid var(--line);padding:7px 10px;font:bold 12px Arial}.cost.ok{color:#9bc491}.cost.bad{color:#d87979}.maxed{text-align:center;color:var(--gold)!important}.combat{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;text-align:center}.combatant span{font-size:60px;display:block}.combatant.foe span{color:#ba58e4}.combatant b{font-size:12px}.versus{color:var(--gold)}.hp{height:8px;background:#080a0c;margin-top:10px;border:1px solid #fff2}.hp i{display:block;height:100%;width:100%;background:#8cb66e;transition:.3s}.foe .hp i{background:#a342af}.danger{background:linear-gradient(#a74e47,#5d2727)}.impact{animation:impact .25s}.reward-card{width:250px;min-height:335px;margin:0 auto;padding:22px;text-align:center;border:2px solid #b95be5;background:radial-gradient(circle at 50% 30%,#672b82,#211326 67%);box-shadow:0 0 25px #aa42d555,inset 0 0 30px #000;border-radius:8px}.reward-card span{display:block;font-size:78px;color:#e1a8fa;text-shadow:0 0 25px #cb50ff;margin:32px 0}.reward-card strong{display:block;font-size:20px;color:#eed7f5}.reward-card small,.reward-card p{font:11px Arial;color:#c /* v0.2: orientación inequívoca en la transición reino → mundo */
.gate.objective{box-shadow:0 0 0 0 #d6b66f88,0 0 24px #d6b66f66;animation:objectivePulse 1.6s infinite}
.gate.objective em{position:absolute;bottom:100%;margin-bottom:8px;background:#d6b66f;color:#17140d;padding:5px 9px;font:bold 9px Arial;font-style:normal;letter-spacing:.12em;white-space:nowrap}
.gate.objective i{position:absolute;right:-19px;font-size:34px;color:var(--gold);animation:nudge 1s infinite}
.scene-enter{animation:sceneEnter .7s}
.location-title{position:absolute;z-index:8;top:25px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #000}
.location-title small{display:block;font:9px Arial;letter-spacing:.24em;color:var(--gold)}
.location-title strong{font-size:23px;font-weight:normal}
.path i{position:absolute;left:48%;width:8px;height:8px;border-radius:50%;background:#e0c879;box-shadow:0 0 10px #efdc95}
.path i:nth-child(1){bottom:34%}.path i:nth-child(2){bottom:48%;transform:scale(.8)}.path i:nth-child(3){bottom:60%;transform:scale(.6)}
.enemy .objective-arrow{font:9px Arial;color:#17140d;text-shadow:none;background:#d6b66f;padding:5px 8px;margin:0 auto 5px;animation:arrowBounce 1s infinite}
@keyframes sceneEnter{from{opacity:.2;filter:brightness(.2);transform:scale(1.04)}}
@keyframes objectivePulse{50%{box-shadow:0 0 0 12px #d6b66f00,0 0 38px #d6b66f99}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes arrowBounce{50%{transform:translateY(-4px)}}

/* v0.3: combate táctico y consecuencia de La Brecha */
.enemy-intent{margin:18px auto 8px;padding:7px 10px;width:max-content;max-width:100%;background:#27251e;border:1px solid #d6b66f55;font:bold 10px Arial;letter-spacing:.08em;color:#d7caa5}
.enemy-intent.heavy{background:#401d22;border-color:#d86060;color:#ffaaaa;animation:warningPulse .7s infinite}
.combat-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.combat-actions .action{min-height:66px;border:1px solid #ffffff24;background:#1b2227;cursor:pointer;padding:8px}
.combat-actions .action b,.combat-actions .action small{display:block}.combat-actions .action small{margin-top:5px;font:9px Arial;color:#aaa}
.combat-actions .attack-action{border-color:#b65d54}.combat-actions .guard-action{border-color:#6e91a8}.combat-actions .rift-action{border-color:#a64fd0;background:#28182f}.combat-actions .action:disabled{opacity:.35}
.enemy-intent b,.enemy-intent span{display:block}.enemy-intent span{margin-top:5px;font:9px Arial;letter-spacing:.12em}
.combat-actions .guard-action.recommended{background:#244b52;border:2px solid #8fd4d0;box-shadow:0 0 0 0 #8fd4d088,0 0 22px #67bdc477;animation:defendNow 1s infinite}
.combat-actions .guard-action.recommended small{color:#bffffa}.combat-actions .attack-action.risky{opacity:.62;background:#31191b}.combat-actions .attack-action.risky small{color:#ff9c9c}
.rift-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.rift-choices .choice{min-height:115px;padding:15px;border:1px solid;background:#171d21;cursor:pointer}.rift-choices b,.rift-choices small{display:block}.rift-choices b{font-size:17px}.rift-choices small{margin-top:10px;font:11px/1.4 Arial;color:#bbb}.rift-choices .contain{border-color:#72af9b}.rift-choices .exploit{border-color:#b94ce9;background:#27172d}
.rift-choices .choice>span{display:block;font-size:45px;margin-bottom:10px}.rift-choices .contain>span{color:#91dbc3;text-shadow:0 0 18px #50c9a4}.rift-choices .exploit>span{color:#dc87ff;text-shadow:0 0 18px #c13ef6}.rift-choices .choice:hover{transform:translateY(-3px);filter:brightness(1.18)}
.contained-card{border-color:#6fb39c;background:radial-gradient(circle at 50% 30%,#285f58,#142523 67%)}.contained-card span{color:#9de1c7;text-shadow:0 0 25px #58d1ad}
.kingdom-scene.rift-exploit:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 62% 75%,#9f2fff32,transparent 32%);box-shadow:inset 0 0 70px #8e24b82e}
.kingdom-scene.rift-contain:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 72% 72%,#65c49b24,transparent 32%)}
@keyframes warningPulse{50%{filter:brightness(1.5)}}
@keyframes defendNow{50%{box-shadow:0 0 0 7px #8fd4d000,0 0 30px #67bdc499;transform:translateY(-2px)}}
@media(max-width:560px){.combat-actions{grid-template-columns:1fr}.combat-actions .action{min-height:48px}.rift-choices{grid-template-columns:1fr}.rift-choices .choice{min-height:80px}}

/* v0.6: informe local de playtest */
.privacy-note{font-size:11px!important;color:#8eb7a6!important;text-align:center}.playtest-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0}.playtest-stats div{background:#0d1215;border:1px solid #ffffff16;padding:12px 6px;text-align:center}.playtest-stats b,.playtest-stats small{display:block}.playtest-stats b{font-size:18px;color:var(--gold)}.playtest-stats small{margin-top:5px;font:9px Arial;color:#aaa}#report-text{width:100%;min-height:145px;resize:none;background:#090d10;color:#bfc5bf;border:1px solid #ffffff20;padding:12px;font:11px/1.5 monospace}@media(max-width:520px){.playtest-stats{grid-template-columns:1fr 1fr}}

/* v0.6.1: controles resistentes a resoluciones y zoom diferentes */
.topbar,.resources,.resource,.bottom-nav button,.modal,.combat-actions>*{min-width:0}
.resource span{overflow:hidden;text-overflow:ellipsis}.bottom-nav button{overflow:hidden}
.modal button{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.combat-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.rift-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:720px){.realm-title{max-width:150px;overflow:hidden}.realm-title strong,.realm-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gate{right:3%;bottom:5%}.quest-panel{max-width:58vw}.modal h2{font-size:20px}.costs{flex-wrap:wrap}}
@media(max-width:560px){.combat-actions,.rift-choices{grid-template-columns:1fr}.combat-actions .action,.rift-choices .choice{height:auto;min-height:56px}.modal{max-height:92vh}}
@media(max-height:680px){.modal{max-height:94vh;padding:18px}.modal h2{margin-bottom:12px}.combatant span{font-size:42px}.combat-actions .action{min-height:48px}.enemy-intent{margin:10px auto 5px}.bottom-nav{height:64px}.scene{bottom:64px}}

/* v0.7: premisa clara y guía contextual paso a paso */
.intro-mark{width:74px;height:74px;margin:0 auto 18px;display:grid;place-items:center;clip-path:polygon(50% 0,92% 20%,84% 83%,50% 100%,16% 83%,8% 20%);background:linear-gradient(135deg,#6b5730,#211b11);color:var(--gold);font-size:48px}.intro-lead{text-align:center;font-size:16px!important;line-height:1.55!important}.intro-dialogue{margin-top:20px;padding-top:18px;border-top:1px solid #ffffff18}.intro-dialogue p{font-size:14px}.building.objective{z-index:14;animation:buildingGuide 1.4s infinite}.building.objective em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;background:var(--gold);color:#17140d;padding:5px 8px;font:bold 9px Arial;font-style:normal;white-space:nowrap}.bottom-nav button.objective{color:#f4dc9a;background:#6a522f;box-shadow:inset 0 0 20px #d6b66f55;animation:navGuide 1.3s infinite}.effectline{display:grid;gap:6px;margin-top:10px;padding:10px;background:#0d1216;border:1px solid #ffffff13;font:11px/1.35 Arial}.effectline span{color:#aaa}.effectline strong{color:#a7d4ad}@keyframes buildingGuide{50%{filter:drop-shadow(0 0 18px #f1cf73);transform:translate(-50%,-55%) scale(1.06)}}@keyframes navGuide{50%{box-shadow:inset 0 0 28px #d6b66f99;filter:brightness(1.2)}}


/* v0.9: compañero y tercera expedición */
.world-scene.third-world{background:linear-gradient(#090d19 0 38%,#17253a 69%,#080a0f);box-shadow:inset 0 0 120px #2686aa44}
.world-scene.third-world .moon{left:67%;right:auto;top:8%;width:78px;height:78px;background:#9edbe7;box-shadow:0 0 55px #49b9db88}
.world-scene.third-world .rift-near{right:auto;left:13%;top:20%;transform:scale(1.1)}
.world-scene.third-world .enemy{right:12%;bottom:29%}.world-scene.third-world .enemy .avatar-symbol{font-size:92px;color:#7fe6ff;text-shadow:0 0 14px #2ad1ff,0 0 34px #7746e8}
.world-scene.third-world .player-token{left:31%;bottom:9%}.world-scene.third-world .path{transform:rotate(17deg) scaleX(1.18)}
.companion-impact{background:radial-gradient(circle,#173d4d 0,#080b0e 68%)}.companion-impact .choice-impact>span{filter:drop-shadow(0 0 25px #65dfff)}
.companion-impact .choice-impact-continue{border-color:#72d7ee;background:linear-gradient(#32758b,#173f4d);box-shadow:0 0 24px #5bdcff44}
.companion-banner{margin:-4px 0 13px;padding:9px 11px;border:1px solid #63bfd5;background:linear-gradient(90deg,#102f3b,#101820);display:flex;justify-content:space-between;align-items:center;gap:10px;font:11px Arial}
.companion-banner b{color:#bcefff}.companion-banner span{color:#fff;text-align:right}
.companion-action{border-color:#62c9df!important;background:linear-gradient(#1e5262,#142f39)!important}.companion-action small{color:#bcefff!important}

.effect-status.permanent{border-color:#72c7a8;color:#caffe9}.effect-status.instant{border-color:#d48bf0;color:#f2d1ff}

/* v0.8: cierre de la segunda vuelta */
.future-signal{position:absolute;z-index:16;left:50%;top:15%;transform:translateX(-50%);width:min(78%,310px);padding:9px 14px;border:1px solid #a78bdb;background:linear-gradient(90deg,#20152fdd,#44205ddd,#20152fdd);color:#f4eaff;box-shadow:0 0 24px #a45cff66;font:700 10px Arial;letter-spacing:1px;animation:futureSignal 1.5s ease-in-out infinite}
.future-signal span{display:block;font-size:18px;margin-bottom:3px}.future-signal small{display:block;margin-top:3px;color:#d2c2e8;font:9px Arial;letter-spacing:0}
.second-reward{margin:12px auto;padding:18px;border:1px solid #bc91e8;background:radial-gradient(circle at 50% 20%,#58277a,#17101f 68%);text-align:center;box-shadow:inset 0 0 28px #a052d844}
.second-reward>span{display:block;font-size:58px;filter:drop-shadow(0 0 18px #bd72ff)}.second-reward strong{display:block;margin:6px 0;color:#f3dcff;font:700 20px Georgia,serif}.second-reward b{display:block;color:#efd28b;font:700 12px Arial}.second-reward small{display:block;margin-top:10px;color:#cfc5d5;font:11px/1.4 Arial}
.continuation-choices{display:grid;gap:10px;margin-top:14px}.continuation-choices .choice{display:block;width:100%;padding:14px;text-align:left;color:#fff;background:#10151a;border:2px solid #d6b66f;box-shadow:inset 0 0 18px #d6b66f12;cursor:pointer}.continuation-choices .choice span{display:inline-block;margin-right:8px;font-size:24px;color:#f5d77f;vertical-align:middle}.continuation-choices .choice b{color:#fff;font:700 16px/1.2 Arial}.continuation-choices .choice small{display:block;margin:7px 0 0 34px;color:#e7e4dc;font:12px/1.4 Arial}.continuation-choices #next-world{border-color:#e3a34c;background:#352311}.continuation-choices #next-city{border-color:#69b9d0;background:#142c35}.continuation-choices .choice.stop{border-color:#9da3aa;background:#25292d;opacity:1}.continuation-choices .choice.stop span{color:#d6d9dd}
@keyframes futureSignal{50%{filter:brightness(1.25);box-shadow:0 0 34px #b76cff99}}

/* v0.8: impacto de elecciones */
.choice-impact-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,#2b2112 0,#080b0e 68%);animation:impactReveal .35s ease-out}
.choice-impact-overlay.quarry-impact{background:radial-gradient(circle,#253947 0,#080b0e 68%)}
.choice-impact-overlay:before{content:"";position:absolute;width:150vmax;height:150vmax;border:2px solid #e7bd5f55;border-radius:50%;animation:impactRing 1.2s ease-out}
.choice-impact{position:relative;text-align:center;padding:28px;color:#fff;text-shadow:0 3px 18px #000}
.choice-impact>span{display:block;font-size:88px;filter:drop-shadow(0 0 25px #e7bd5f);animation:impactIcon .7s cubic-bezier(.2,.9,.2,1.3)}
.quarry-impact .choice-impact>span{filter:drop-shadow(0 0 25px #7ed5ff)}
.choice-impact small{display:block;margin-bottom:8px;font:700 10px/1 Arial;letter-spacing:3px;color:#d6b66f}
.choice-impact strong{display:block;font:700 30px/1.05 Georgia,serif;letter-spacing:1px}
.choice-impact b{display:inline-block;margin-top:18px;padding:9px 14px;border:1px solid #d6b66f;background:#0008;color:#ffe4a1;font:700 14px Arial}
.choice-impact p{margin:12px auto 0;max-width:290px;color:#ddd;font:13px/1.45 Arial}.choice-impact-continue{margin-top:22px;min-width:170px;padding:12px 20px;border:1px solid #e7bd5f;background:linear-gradient(#8b6327,#553710);color:#fff7df;font:700 12px Arial;letter-spacing:2px;box-shadow:0 0 24px #e7bd5f44}.quarry-impact .choice-impact-continue{border-color:#8fdcff;background:linear-gradient(#376a83,#1d3d4e);box-shadow:0 0 24px #78d4ff44}
.route-banner{margin:-2px 0 14px;padding:10px 12px;border:1px solid #c89b4a;background:linear-gradient(90deg,#4a2b10,#17110b);display:flex;justify-content:space-between;gap:12px;align-items:center;font:11px/1.25 Arial}
.route-banner.quarry-route{border-color:#6ca4c4;background:linear-gradient(90deg,#183444,#10171c)}
.route-banner b{color:#fff}.route-banner span{color:#d8c99f;text-align:right}
.kingdom-scene.route-forge .building-forge{filter:drop-shadow(0 0 18px #ff923c)}
.kingdom-scene.route-quarry .building-quarry{filter:drop-shadow(0 0 18px #73cfff)}
@keyframes impactIcon{0%{transform:scale(.2) rotate(-18deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes impactRing{0%{transform:scale(.05);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes impactReveal{from{opacity:0}to{opacity:1}}

<body>
  <main id="game" class="game-shell" aria-live="polite">
    <header class="topbar">
      <button id="brand" class="brand" aria-label="Eldoria">E</button>
      <div class="realm-title"><strong data-i18n="realmName"></strong><span id="realm-level"></span></div>
      <div id="resources" class="resources"></div>
      <button id="sound-toggle" class="icon-button" aria-label="Activar o desactivar sonido">◉</button>
    </header>

    <section id="scene" class="scene kingdom-scene">
      <div class="sky-glow"></div>
      <div class="rift rift-distant" aria-label="La Brecha"><i></i><i></i><i></i></div>
      <div class="terrain terrain-back"></div>
      <div class="terrain terrain-front"></div>
      <div id="buildings" class="buildings"></div>
      <button id="aldric" class="character aldric" aria-label="Sir Aldric">
        <span class="character-glow"></span><span class="helmet">♜</span><span class="character-label">Sir Aldric</span>
      </button>
      <button id="gate" class="gate locked" aria-label="Puerta exterior"><span>⚔</span><b data-i18n="explore"></b></button>
      <div id="particles" class="particles"></div>
    </section>

    <aside id="quest" class="quest-panel">
      <div class="quest-kicker" data-i18n="firstQuest"></div>
      <strong id="quest-title"></strong>
      <p id="quest-copy"></p>
      <div class="quest-progress"><span id="quest-bar"></span></div>
    </aside>

    <nav id="nav" class="bottom-nav">
      <button class="active" data-view="kingdom"><span>♜</span><b data-i18n="kingdom"></b></button>
      <button data-view="heroes"><span>♞</span><b data-i18n="heroes"></b></button>
      <button data-view="cards"><span>✦</span><b data-i18n="cards"></b><em id="card-badge" hidden>1</em></button>
      <button data-view="world"><span>⌖</span><b data-i18n="world"></b></button>
    </nav>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script>
window.ELDORIA_DATA = {
  resources: {
    food: { icon: '●', label: 'Comida' }, wood: { icon: '▰', label: 'Madera' },
    stone: { icon: '◆', label: 'Piedra' }, iron: { icon: '⬟', label: 'Hierro' }
  },
  buildings: {
    keep: { name: 'Fortaleza', icon: '♜', x: 48, y: 43, max: 2,
      levels: [{ cost: {}, production: {} }, { cost: { wood: 60, stone: 50 }, production: {} }] },
    farm: { name: 'Granero', icon: '♨', x: 23, y: 62, max: 2,
      levels: [{ cost: {}, production: { food: 4 } }, { cost: { wood: 35, stone: 15 }, production: { food: 9 } }] },
    lumber: { name: 'Aserradero', icon: '♠', x: 70, y: 64, max: 2,
      levels: [{ cost: {}, production: { wood: 3 } }, { cost: { food: 30, stone: 20 }, production: { wood: 7 } }] },
    quarry: { name: 'Cantera', icon: '▲', x: 82, y: 44, max: 2,
      levels: [{ cost: {}, production: { stone: 2 } }, { cost: { food: 35, wood: 30 }, production: { stone: 5 } }] },
    forge: { name: 'Forja', icon: '⚒', x: 34, y: 43, max: 2,
      levels: [{ cost: {}, production: { iron: 1 } }, { cost: { wood: 40, stone: 35 }, production: { iron: 3 } }] }
  },
  i18n: { realmName: 'Bastión de Valoria', explore: 'Explorar', firstQuest: 'MISIÓN PRINCIPAL', kingdom: 'Reino', heroes: 'Héroes', cards: 'Cartas', world: 'Mundo' }
};

</script>
  <script>
(() => {
  'use strict';
  const D = window.ELDORIA_DATA;
  const initialState = () => ({
    resources: { food: 80, wood: 110, stone: 75, iron: 25 },
    buildings: { keep: 1, farm: 1, lumber: 1, quarry: 1, forge: 1 },
    stage: 0, introSeen: false, talked: false, firstUpgrade: false, enemyHp: 100, playerHp: 100,
    hasCard: false, cardUsed: false, complete: false, worldSeen: false, riftChoice: null,
    loop2Unlocked: false, loop2Choice: null, secondCombat: false, secondVictory: false, secondRewardClaimed: false, companion: null, thirdCombat: false, thirdVictory: false, thirdRewardClaimed: false, continueIntent: null, lastTick: Date.now(),
    metrics: { runId: Math.random().toString(36).slice(2,8).toUpperCase(), startedAt: Date.now(), firstUpgradeSeconds: null, worldSeconds: null, combatTurns: 0, guardUses: 0, heavyGuards: 0, companionUses: 0, riftChoice: null, completedSeconds: null }
  });
  let state = load();
  let view = 'kingdom';
  let modal = null;
  let combatTurn = 0;
  let riftAvailable = true;
  let companionAvailable = true;

  const $ = s => document.querySelector(s);
  const el = (tag, cls, html='') => { const n=document.createElement(tag); n.className=cls; n.innerHTML=html; return n; };
  const fmt = n => Math.floor(n).toLocaleString('es-ES');
  function load(){ try { const base=initialState(), stored=JSON.parse(localStorage.getItem('eldoria-save')||'{}'); return { ...base, ...stored, metrics:{...base.metrics,...(stored.metrics||{})} }; } catch { return initialState(); } }
  function save(){ state.lastTick=Date.now(); localStorage.setItem('eldoria-save', JSON.stringify(state)); }

  function init(){
    document.querySelectorAll('[data-i18n]').forEach(n => n.textContent=D.i18n[n.dataset.i18n]);
    $('#aldric').onclick = talkAldric; $('#gate').onclick = () => { if(state.firstUpgrade) showWorld(); else toast('Sir Aldric necesita hablar contigo.'); };
    $('#brand').onclick = showMenu; $('#sound-toggle').onclick = soundToggle;
    document.querySelectorAll('#nav button').forEach(b => b.onclick=()=>navigate(b.dataset.view));
    applyOfflineProduction(); render(); setInterval(tick, 1000);
    if(state.stage===0&&!state.introSeen) setTimeout(showIntro,350);
  }
  function applyOfflineProduction(){
    const seconds=Math.min(120, Math.max(0,(Date.now()-(state.lastTick||Date.now()))/1000));
    if(seconds>3){ Object.entries(production()).forEach(([k,v])=>state.resources[k]+=v*seconds); toast(`Producción acumulada durante ${Math.floor(seconds)} s.`); }
  }
  function production(){
    const out={food:0,wood:0,stone:0,iron:0};
    Object.entries(state.buildings).forEach(([id,lvl])=>Object.entries(D.buildings[id].levels[lvl-1].production).forEach(([r,v])=>out[r]+=v));
    if(state.riftChoice==='contain'&&state.cardUsed) Object.keys(out).forEach(r=>out[r]*=1.5);
    return out;
  }
  function tick(){ if(view==='kingdom'){ const p=production(); Object.entries(p).forEach(([k,v])=>state.resources[k]+=v); renderResources(p); save(); } }
  function render(){ renderResources(production()); renderBuildings(); renderQuest(); const status=state.riftChoice==='contain'&&state.cardUsed?' · Sello activo +50% producción':state.riftChoice==='exploit'?' · Poder corrupto':' '; $('#realm-level').textContent=`Nivel ${state.buildings.keep}${status}`; renderGate(); renderNavigationGuides(); $('#card-badge').hidden=!state.hasCard||state.cardUsed; save(); }
  function renderNavigationGuides(){ document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('objective')); if(state.hasCard&&!state.cardUsed)document.querySelector('[data-view="cards"]').classList.add('objective'); }
  function renderGate(){
    const gate=$('#gate'); if(!gate)return;
    const thirdObjective=state.companion&&!state.thirdVictory;
    const objective=(state.firstUpgrade&&!state.hasCard)||(state.loop2Choice&&!state.secondVictory)||thirdObjective;
    gate.classList.toggle('locked',!state.firstUpgrade); gate.classList.toggle('objective',objective);
    gate.innerHTML=`${objective?'<em>SIGUIENTE PASO</em><i>›</i>':''}<span>⚔</span><b>${thirdObjective?'Tercera expedición':objective?(state.loop2Choice?'Segunda expedición':'Salir al mundo'):'Explorar'}</b>`;
  }
  function renderResources(prod={}){
    $('#resources').innerHTML=Object.entries(D.resources).map(([k,r])=>`<div class="resource r-${k}" title="${r.label}"><i>${r.icon}</i><span>${fmt(state.resources[k])}</span><small>+${prod[k]||0}/s</small></div>`).join('');
  }
  function renderBuildings(){
    $('#buildings').innerHTML='';
    Object.entries(D.buildings).forEach(([id,b])=>{
      const guided=(state.talked&&!state.firstUpgrade&&id==='farm')||
        (state.cardUsed&&!state.loop2Unlocked&&id==='keep')||
        (state.loop2Unlocked&&!state.loop2Choice&&(id==='forge'||id==='quarry'));
      const n=el('button',`building building-${id}${guided?' objective':''}`,`${guided?`<em>${id==='farm'?'TOCA Y MEJORA':id==='keep'?'REFUERZA EL BASTIÓN':'ELIGE UNA RUTA'}</em>`:''}<span class="building-art">${b.icon}</span><span class="level">Nv. ${state.buildings[id]}</span><strong>${b.name}</strong><small>${productionLabel(id)}</small>`);
      n.style.left=`${b.x}%`; n.style.top=`${b.y}%`; n.onclick=()=>buildingModal(id); $('#buildings').append(n);
    });
  }
  function productionLabel(id){ const p=D.buildings[id].levels[state.buildings[id]-1].production; return Object.entries(p).map(([r,v])=>`+${v} ${D.resources[r].label}/s`).join(' · ')||'Centro del reino'; }
  function renderQuest(){
    const qs = state.complete ? ['Prueba completada','Has terminado todo el contenido disponible. Copia tu resumen.'] :
      state.thirdVictory ? ['La llamada continúa','Recoge la reliquia y decide si seguirías jugando.'] :
      state.companion ? ['La fortaleza sepultada','Sal al mundo con tu nuevo compañero y derrota al Avatar de la Brecha.'] :
      state.secondVictory ? ['Un aliado responde',state.secondRewardClaimed?'Elige al compañero que llevará el Núcleo de Ceniza.':'Recoge el Núcleo de Ceniza y regresa a Valoria.'] :
      !state.talked ? ['Las cenizas de Valoria','Conoce a Sir Aldric y descubre por qué debes reconstruir.'] :
      !state.firstUpgrade ? ['Alimenta a Valoria','Toca el Granero marcado y mejóralo para producir más comida.'] :
      !state.hasCard ? ['Ecos en el bosque','Pulsa “Salir al mundo”, sigue el sendero y derrota al Acechador.'] :
      !state.cardUsed ? ['Convierte la victoria en progreso','Abre Cartas —el botón iluminado— y usa la recompensa.'] :
      !state.loop2Unlocked ? ['El bastión renace','Toca la Fortaleza marcada y utiliza los recursos obtenidos para mejorarla.'] :
      !state.loop2Choice ? ['Prepara la segunda expedición','Elige: Forja para atacar más fuerte o Cantera para defender mejor.'] :
      ['La Brecha responde','Sal de nuevo al mundo. Tu elección cambiará el siguiente combate.'];
    $('#quest-title').textContent=qs[0]; $('#quest-copy').textContent=qs[1];
    const progress=state.complete?100:state.thirdVictory?99:state.companion?96:state.secondVictory?92:[0,12,24,40,52,64,75,84][Math.min(state.stage,7)]||0; $('#quest-bar').style.width=`${progress}%`;
  }
    function showIntro(){
    openModal('Eldoria',`<div class="intro-mark">E</div><p class="intro-lead">Valoria está en ruinas. Una anomalía llamada <strong>La Brecha</strong> corrompe el mundo y cada decisión sobre su poder tendrá consecuencias.</p><div class="dialogue intro-dialogue"><div class="portrait">♜</div><p><strong>Sir Aldric</strong><br>“Reconstruye el reino, cruza las murallas y descubre si la Brecha debe ser contenida… o utilizada.”</p></div><button id="begin" class="primary">Comenzar la reconstrucción</button>`);
    modal.querySelector('.close').remove(); $('#begin').onclick=()=>{state.introSeen=true;state.talked=true;state.stage=1;closeModal();render();toast('Objetivo: mejora el Granero marcado.');};
  }
  function talkAldric(){ dialogue('Sir Aldric',state.firstUpgrade?'La puerta está abierta. La Brecha nos espera más allá de las murallas.':'Sin más alimento, Valoria no sobrevivirá. Mejora el Granero marcado para asegurar nuestras reservas.'); }
  function buildingModal(id){
    const b=D.buildings[id], lvl=state.buildings[id], next=b.levels[lvl];
    let body=`<div class="modal-icon">${b.icon}</div><p>${buildingCopy(id)}</p><div class="statline"><span>Nivel actual</span><b>${lvl} / ${b.max}</b></div>${buildingEffect(id,lvl)}`;
    if(state.talked&&!state.firstUpgrade&&id!=='farm'){ body+=`<p class="maxed">Objetivo actual: mejora primero el Granero marcado para alimentar a Valoria.</p>`; }
    else if(id==='keep'&&!state.cardUsed){ body+=`<p class="maxed">La Fortaleza requiere energía estabilizada de la Brecha.</p>`; }
    else if(next){ const costs=Object.entries(next.cost).map(([r,v])=>`<span class="cost ${state.resources[r]>=v?'ok':'bad'}">${D.resources[r].icon} ${v}</span>`).join(''); body+=`<div class="costs">${costs}</div><button id="upgrade" class="primary">Mejorar ahora</button>`; }
    else body+=`<p class="maxed">Nivel máximo del prototipo</p>`;
    openModal(b.name,body); if(next&&$('#upgrade')) $('#upgrade').onclick=()=>upgrade(id,next.cost);
  }
  function buildingEffect(id,lvl){ const current=productionLabel(id),next=D.buildings[id].levels[lvl]?.production; const after=next&&Object.entries(next).length?Object.entries(next).map(([r,v])=>`+${v} ${D.resources[r].label}/s`).join(' · '):id==='keep'&&lvl<2?'Desbloquea la defensa del bastión':'Nivel máximo'; return `<div class="effectline"><span>Ahora: ${current}</span><strong>Después: ${after}</strong></div>`; }
  function buildingCopy(id){ return ({keep:'El corazón político y defensivo de Valoria.',farm:'Alimenta a quienes aún resisten.',lumber:'Convierte el bosque intacto en futuro.',quarry:'Extrae piedra para levantar defensas.',forge:'Da forma al hierro y prepara la guerra.'})[id]; }
  function upgrade(id,cost){
    if(!Object.entries(cost).every(([r,v])=>state.resources[r]>=v)){ toast('Faltan recursos para esta mejora.'); return; }
    Object.entries(cost).forEach(([r,v])=>state.resources[r]-=v); state.buildings[id]++; burst();
    if(id!=='keep'&&!state.firstUpgrade){ state.firstUpgrade=true; state.stage=2; state.metrics.firstUpgradeSeconds=elapsed(); closeModal(); render(); dialogue('Sir Aldric','Eso bastará por ahora. La puerta está abierta. Ven conmigo: debes ver lo que está devorando nuestras tierras.'); }
    else if(id==='keep'&&state.cardUsed&&!state.loop2Unlocked){
      state.loop2Unlocked=true; state.stage=5; closeModal(); render();
      dialogue('Sir Aldric','La Fortaleza resiste, pero la Brecha ha respondido. Elige cómo preparar a Valoria: mejora la Forja para causar más daño o la Cantera para resistir mejor.');
    }
    else if(state.loop2Unlocked&&!state.loop2Choice&&(id==='forge'||id==='quarry')){
      state.loop2Choice=id; state.stage=6; closeModal(); render();
      $('#scene')?.classList.add('route-'+id);
      choiceImpact(id,()=>dialogue(id==='forge'?'Juramento de Acero':'Bastión de Piedra',id==='forge'
        ?'<strong>ATAQUE +10 por golpe.</strong><br>La Forja convierte recursos en daño inmediato. La segunda expedición ya está disponible.'
        :'<strong>Daño recibido al Defender reducido a la mitad.</strong><br>La Cantera convierte recursos en supervivencia. La segunda expedición ya está disponible.'));
    }
    else { closeModal(); toast(`${D.buildings[id].name} mejorado a nivel ${state.buildings[id]}.`); render(); }
  }
  function choiceImpact(id,done){
    const forge=id==='forge';
    const impact=el('div','choice-impact-overlay '+(forge?'forge-impact':'quarry-impact'),`<div class="choice-impact"><small>DECISIÓN TOMADA</small><span>${forge?'⚒':'▲'}</span><strong>${forge?'JURAMENTO DE ACERO':'BASTIÓN DE PIEDRA'}</strong><b>${forge?'ATAQUE +10':'DAÑO AL DEFENDER ÷2'}</b><p>Tu reino y el próximo combate han cambiado.</p><button class="choice-impact-continue">CONTINUAR</button></div>`);
    document.body.append(impact);
    $('.choice-impact-continue',impact).onclick=()=>{impact.remove();if(done)done();};
  }
  function showWorld(){ view='world'; navActive('world');
    const third=!!(state.companion&&!state.thirdVictory);
    const second=!third&&!!(state.loop2Choice&&!state.secondVictory);
    $('#scene').className=`scene world-scene scene-enter ${third?'third-world':second?'second-world':''}`;
    $('#scene').innerHTML=third

      :`<div class="location-title"><small>TIERRAS EXTERIORES</small><strong>Bosque de Ceniza</strong></div><div class="moon"></div><div class="rift rift-near"><i></i><i></i><i></i><b>LA BRECHA</b></div><div class="corruption"></div><div class="path"><i></i><i></i><i></i></div><div id="player-token" class="player-token">♜</div><button id="enemy" class="enemy objective"><span class="objective-arrow">PRIMER OBJETIVO ▼</span><span>♝</span><b>Acechador corrupto</b><em>Toca para combatir</em></button><button id="return" class="return">‹ Reino</button>`;

    if(!state.worldSeen){ state.worldSeen=true; state.metrics.worldSeconds=elapsed(); save(); setTimeout(()=>dialogue('Sir Aldric','Más allá de estas puertas comienza el Bosque de Ceniza. Sigue el sendero: esa herida violeta es La Brecha, y el Acechador bloquea nuestro paso.'),350); }
  }
  function startCombat(){
    state.thirdCombat=!!(state.companion&&!state.thirdVictory);

      :state.secondCombat?'La Brecha ha enviado un Guardián de Ceniza. La mejora elegida afectará a este combate.':'El Acechador anuncia sus golpes. Ataca para dañarlo, defiende ante un golpe brutal o canaliza una vez el poder de la Brecha… pagando su precio.';
    dialogue('Sir Aldric',copy,()=>combatModal());
  }
  function combatModal(){
    const advanced=state.secondCombat||state.thirdCombat;
    const companion=state.companion==='lyra'?{name:'Lyra',skill:'Lluvia de flechas',help:'55 de daño · un uso',icon:'➶'}:{name:'Maelis',skill:'Luz restauradora',help:'Cura 35 · causa 22',icon:'✧'};
    openModal(state.thirdCombat?'Asalto a la fortaleza':state.secondCombat?'Segunda expedición':'Combate en la Brecha',`${advanced?`<div class="route-banner ${state.loop2Choice==='quarry'?'quarry-route':''}"><b>${state.loop2Choice==='forge'?'⚒ FORJA ACTIVA':'▲ CANTERA ACTIVA'}</b><span>${state.loop2Choice==='forge'?'+10 daño en cada ataque':'Defender recibe la mitad de daño'}</span></div>`:''}${state.thirdCombat?`<div class="companion-banner"><b>${companion.icon} ${companion.name.toUpperCase()}</b><span>${companion.skill} · un uso</span></div>`:''}<div class="combat"><div class="combatant hero"><span>♜</span><b>Sir Aldric</b><div class="hp"><i id="player-hp"></i></div></div><div class="versus">VS</div><div class="combatant foe"><span>${state.thirdCombat?'♚':'♝'}</span><b>${state.thirdCombat?'Avatar de la Brecha':state.secondCombat?'Guardián de Ceniza':'Acechador'}</b><div class="hp"><i id="enemy-hp"></i></div></div></div><div id="enemy-intent" class="enemy-intent"></div><p id="combat-log">Mira la intención del enemigo antes de elegir.</p><div class="combat-actions"><button id="attack" class="action attack-action"><b>⚔ Atacar</b><small id="attack-help">Daño estable</small></button><button id="guard" class="action guard-action"><b>⛉ Defender</b><small id="guard-help">Reduce el próximo golpe</small></button><button id="rift-strike" class="action rift-action"><b>✦ Canalizar</b><small>Gran daño · coste vital</small></button>${state.thirdCombat?`<button id="companion-skill" class="action companion-action"><b>${companion.icon} ${companion.skill}</b><small>${companion.help}</small></button>`:''}</div>`);
    state.enemyHp=state.thirdCombat?180:state.secondCombat?135:100; state.playerHp=100; combatTurn=0; riftAvailable=true; companionAvailable=true;
    $('#attack').onclick=()=>combatAction('attack'); $('#guard').onclick=()=>combatAction('guard'); $('#rift-strike').onclick=()=>combatAction('rift'); if($('#companion-skill'))$('#companion-skill').onclick=()=>combatAction('companion'); updateHp(); updateIntent();
  }
  function updateIntent(){
    const heavy=combatTurn%3===2, guard=$('#guard'), attack=$('#attack'), advanced=state.secondCombat||state.thirdCombat;
    $('#enemy-intent').className=`enemy-intent ${heavy?'heavy':''}`;
    $('#enemy-intent').innerHTML=heavy?'<b>⚠ GOLPE BRUTAL ENTRANTE · 28 daño</b><span>DEFENDER ES LA RESPUESTA SEGURA</span>':'<b>ATAQUE NORMAL · 14 daño</b><span>PUEDES ATACAR O USAR UNA HABILIDAD</span>';
    guard.classList.toggle('recommended',heavy); attack.classList.toggle('risky',heavy);
    $('#guard-help').textContent=heavy?(advanced&&state.loop2Choice==='quarry'?'CANTERA · reduce a 4':'RECOMENDADO · reduce a 8'):(advanced&&state.loop2Choice==='quarry'?'CANTERA · defensa reforzada':'Reduce el próximo golpe');
    $('#attack-help').textContent=heavy?'RIESGO · recibirás 28':(advanced&&state.loop2Choice==='forge'?'FORJA · +10 daño':'Daño estable');
  }
  function combatAction(type){
    const heavy=combatTurn%3===2, advanced=state.secondCombat||state.thirdCombat; let incoming=heavy?28:14; let dmg=0; let copy='';
    state.metrics.combatTurns++;
    if(type==='attack'){ dmg=22+Math.floor(Math.random()*9)+(advanced&&state.loop2Choice==='forge'?10:0); copy=`Aldric golpea y causa ${dmg}.${advanced&&state.loop2Choice==='forge'?' Forja: +10 de daño.':''}`; }
    if(type==='guard'){ state.metrics.guardUses++; if(heavy)state.metrics.heavyGuards++; dmg=7; incoming=Math.floor(incoming*(advanced&&state.loop2Choice==='quarry'?.15:.3)); state.playerHp=Math.min(100,state.playerHp+5); copy=advanced&&state.loop2Choice==='quarry'?'La Cantera absorbe el impacto. Aldric recupera 5 y contraataca.':'Aldric alza el escudo, recupera 5 y contraataca.'; }
    if(type==='rift'){ if(!riftAvailable)return; dmg=48; incoming+=12; riftAvailable=false; $('#rift-strike').disabled=true; copy='La Brecha atraviesa al enemigo, pero quema a Aldric.'; }
    if(type==='companion'){
      if(!companionAvailable)return; companionAvailable=false; state.metrics.companionUses++; $('#companion-skill').disabled=true;
      if(state.companion==='lyra'){dmg=55;copy='Lyra cubre el cielo con flechas y causa 55 de daño.';}
      else{dmg=22;state.playerHp=Math.min(100,state.playerHp+35);copy='Maelis restaura 35 de vida y su luz causa 22 de daño.';}
    }
    state.enemyHp=Math.max(0,state.enemyHp-dmg); state.playerHp=Math.max(0,state.playerHp-incoming); updateHp();
    $('#combat-log').textContent=`${copy} Recibe ${incoming} de daño.`;
    if(state.enemyHp<=0){ disableCombat(); return setTimeout(victory,550); }
    if(state.playerHp<=0){ disableCombat(); $('#combat-log').textContent='Aldric cae. La Brecha no perdona una decisión precipitada.'; return setTimeout(combatDefeat,500); }
    combatTurn++; updateIntent();
  }
  function disableCombat(){ document.querySelectorAll('.combat-actions button').forEach(b=>b.disabled=true); }
  function combatDefeat(){ openModal('La expedición fracasa',`<p>Has aprendido a leer los ataques del Acechador. Defiende cuando prepare su golpe brutal.</p><button id="retry" class="primary">Reintentar combate</button>`); $('#retry').onclick=combatModal; }
  function updateHp(){ $('#enemy-hp').style.width=`${state.enemyHp}%`; $('#player-hp').style.width=`${state.playerHp}%`; }
  function victory(){
    if(state.thirdCombat){
      state.thirdVictory=true;state.stage=8;save();renderQuest();showThirdReward();return;
    }
    if(state.secondCombat){
      state.secondVictory=true; state.stage=7; save(); renderQuest(); showSecondReward(); return;
    }
    openModal('El poder exige una decisión',`<p>El fragmento puede convertirse en un motor de crecimiento o romperse para liberar todo su poder ahora. Ninguna opción es gratuita.</p><div class="rift-choices"><button id="contain" class="choice contain"><span>⛨</span><b>Forjar el Gran Sello</b><small><strong>CRECIMIENTO:</strong> +50% de producción permanente en esta partida.<br>Botín inmediato moderado.</small></button><button id="exploit" class="choice exploit"><span>✦</span><b>Desatar la Brecha</b><small><strong>PODER:</strong> enorme botín inmediato.<br>La corrupción marcará Valoria.</small></button></div>`);

  }
  function showSecondReward(){

    $('#claim-second').onclick=()=>{
      if(!state.secondRewardClaimed){state.resources.stone+=120;state.resources.iron+=80;state.secondRewardClaimed=true;save();}
      closeModal();showKingdom();burst();toast('El Núcleo de Ceniza ha llegado a Valoria.');
      setTimeout(showCompanionChoice,650);
    };
  }
  function showFutureStep(){
    if(!state.secondRewardClaimed)return showSecondReward();
    if(!state.companion)return showCompanionChoice();
    if(!state.thirdVictory)return showWorld();
    return state.thirdRewardClaimed?showIntentChoice():showThirdReward();
  }
  function showCompanionChoice(){
    openModal('Elige a tu compañero',`<p class="intro-lead">El Núcleo ha despertado a dos supervivientes. Esta elección cambia la habilidad disponible en la tercera expedición.</p><div class="continuation-choices"><button id="choose-lyra" class="choice companion-choice"><span>➶</span><b>Lyra, Exploradora del Velo</b><small><strong>LLUVIA DE FLECHAS:</strong> 55 de daño una vez por combate.</small></button><button id="choose-maelis" class="choice companion-choice alt"><span>✧</span><b>Maelis, Guardiana del Alba</b><small><strong>LUZ RESTAURADORA:</strong> cura 35 y causa 22 de daño una vez.</small></button></div>`);
    $('#choose-lyra').onclick=()=>chooseCompanion('lyra');
    $('#choose-maelis').onclick=()=>chooseCompanion('maelis');

  function showThirdReward(){
    openModal('Eco del Primer Rey',`<p class="intro-lead">El Avatar se deshace. Bajo su trono aparece una memoria que pronuncia el nombre de Aldric.</p><div class="second-reward"><span>♛</span><strong>ECO DEL PRIMER REY</strong><b>RELIQUIA LEGENDARIA · +150 hierro</b><small>La reconstrucción de Valoria solo era el comienzo.</small></div><button id="claim-third" class="primary">Reclamar reliquia y regresar</button>`);
    $('#claim-third').onclick=()=>{
      if(!state.thirdRewardClaimed){state.resources.iron+=150;state.thirdRewardClaimed=true;save();}
      closeModal();showKingdom();burst();setTimeout(showIntentChoice,650);
    };
  }
  function showIntentChoice(){
    openModal('¿Seguirías jugando?',`<p class="intro-lead">Has reconstruido Valoria, elegido dos mejoras, reclutado un héroe y superado tres combates.</p><p>Si hubiera más contenido disponible ahora mismo, ¿jugarías diez minutos más?</p><div class="intent-choices"><button id="intent-yes"><b>Sí, continuaría ahora</b><small>Quiero descubrir qué ocurre después.</small></button><button id="intent-maybe" class="maybe"><b>Quizá</b><small>Dependería del contenido o de las recompensas.</small></button><button id="intent-no" class="no"><b>No, pararía aquí</b><small>El recorrido no me genera suficiente interés.</small></button></div>`);

    $('#intent-maybe').onclick=()=>finishSlice('maybe');
    $('#intent-no').onclick=()=>finishSlice('no');

  function finishSlice(choice){
    state.continueIntent=choice;state.complete=true;state.metrics.completedSeconds=elapsed();save();renderQuest();

    openModal('Vertical slice completado',`<div class="intro-mark">✓</div><p class="intro-lead">Has completado las tres expediciones disponibles.</p><p>Tu respuesta: <strong>${label}</strong>.</p><p><strong>Nivel máximo de esta prueba: 3.</strong><br>No necesitas seguir mejorando.</p><button id="finish-report" class="primary">Ver y copiar resumen</button>`);

  function claimReward(choice){
    state.riftChoice=choice; state.metrics.riftChoice=choice; state.hasCard=true; state.stage=3; save();

        :`<div class="hero-sheet companion-sheet"><div class="portrait">✧</div><div><span class="tag">ALBA · RARA</span><h3>Maelis</h3><p>Guardiana · Sanadora</p><div class="stats"><b>35 <small>Curación</small></b><b>22 <small>Daño</small></b></div></div></div>`):'';

  function cardsModal(){

      :`<div class="effect-status permanent">${state.cardUsed?'ACTIVA · HASTA REINICIAR LA PARTIDA':'DURACIÓN: TODA ESTA PARTIDA'}</div>`;

  function dialogue(name,copy,done){ openModal(name,`<div class="dialogue"><div class="portrait">♜</div><p>${copy}</p></div><button id="continue" class="primary">Continuar</button>`); $('#continue').onclick=()=>{closeModal(); if(done)done();}; }

  function showPlaytestSummary(){
    const m=state.metrics, defense=m.heavyGuards>0?'Comprendió la defensa contextual':'No defendió ningún golpe brutal';
    openModal('Informe de la expedición',`<p class="privacy-note">Estos datos permanecen en este dispositivo. No se envía información por Internet.</p><div class="playtest-stats"><div><b>${duration(m.completedSeconds)}</b><small>Tiempo total</small></div><div><b>${m.combatTurns}</b><small>Turnos</small></div><div><b>${m.guardUses}</b><small>Defensas</small></div><div><b>${m.heavyGuards}</b><small>Defensas oportunas</small></div></div><p><strong>${defense}</strong><br>Elección: ${m.riftChoice==='contain'?'Forjar el Gran Sello':'Desatar la Brecha'}</p><textarea id="report-text" readonly>${reportText()}</textarea><button id="copy-report" class="primary">Copiar resumen</button>`);
    $('#copy-report').onclick=copyReport;
  }
  function copyReport(){ const field=$('#report-text'),done=()=>toast('Resumen copiado.'); if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(field.value).then(done).catch(()=>{field.select();document.execCommand('copy');done();}); else{field.select();document.execCommand('copy');done();} }
  function showMenu(){ openModal('Eldoria',`<p>Vertical slice · El despertar de la Brecha</p>${state.complete?'<button id="view-report" class="primary">Ver informe de prueba</button>':''}<button id="restart" class="secondary">Reiniciar partida</button>`); if($('#view-report'))$('#view-report').onclick=showPlaytestSummary; $('#restart').onclick=()=>{localStorage.removeItem('eldoria-save');location.reload();}; }
  init();
})();

</script>
</body>
</html>
