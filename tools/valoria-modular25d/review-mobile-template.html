<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Valoria</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#191719;color:#f8ecd5;font:16px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#carga{position:fixed;inset:0;z-index:2;display:grid;place-content:center;text-align:center;gap:12px;padding:24px;background:#191719}h1{font:normal 36px Georgia;margin:0}progress{width:230px;max-width:85vw;accent-color:#b89555;margin:auto}button{padding:10px;font:inherit}
</style></head><body><canvas id="unity-canvas" tabindex="-1"></canvas><div id="carga" role="status"><h1>Valoria</h1><progress id="barra" value="0" max="1"></progress><span id="estado">Conectando con Valoria…</span><button hidden id="reinicio" onclick="location.reload()">Volver a intentar</button></div><script>
const estado=document.getElementById('estado'), barra=document.getElementById('barra');
function fallo(error){
 const panel=document.getElementById('carga');
 panel.style.display='grid';
 barra.hidden=true;
 estado.textContent=String(error.message||error);
 document.getElementById('reinicio').hidden=false;
}
async function datos(){
 const total=506818849, size=16777216, target=new Uint8Array(total);let next=0,done=0;
 async function descargar(){
  while(next*size<total){
   const i=next++, start=i*size, len=Math.min(size,total-start);
   for(let attempt=0;;attempt++){
    try{
     const r=await fetch('/mobile/val-data-'+String(i).padStart(3,'0')+'.gz');
     if(!r.ok)throw Error('HTTP '+r.status);
     const bytes=new Uint8Array(await r.arrayBuffer());
     if(bytes.length!==len)throw Error('Descarga incompleta');
     target.set(bytes,start);break
    }catch(error){if(attempt>=2)throw Error('No se pudo cargar el bloque '+(i+1)+'. '+error.message)}
   }
   done+=len;barra.value=done/total;estado.textContent='Cargando Valoria · '+Math.round(done/total*100)+' %';
  }
 }
 await Promise.all([descargar(),descargar()]);return target;
}
function prepararTexturasWebKit(){
 const ua=navigator.userAgent;
 if(!/AppleWebKit/.test(ua)||/Chrome|Chromium|Android/.test(ua))return;
 // Use Unity's existing decoded texture fallback on Apple's WebGL backend.
 // Legacy compressed reflections in the regional scene can reset its GPU process.
 const proto=WebGL2RenderingContext.prototype, get=proto.getExtension, all=proto.getSupportedExtensions;
 const legacy=name=>/texture_compression_bptc|compressed_texture_s3tc/i.test(name);
 proto.getExtension=function(name){return legacy(name)?null:get.call(this,name)};
 proto.getSupportedExtensions=function(){const names=all.call(this);return names&&names.filter(name=>!legacy(name))};
}
async function iniciar(){
 const canvas=document.getElementById('unity-canvas');
 canvas.addEventListener('webglcontextlost',()=>fallo('Se ha interrumpido la imagen del juego. Vuelve a abrir Valoria para recuperar tu partida.'));
 if(!window.WebGL2RenderingContext)throw Error('Este navegador no ha podido activar WebGL 2. Abre el enlace directamente en Safari.');
 prepararTexturasWebKit();
 const script=document.createElement('script');script.src='/Build/RegionModular.loader.js?mobile=2';
 await new Promise((ok,fail)=>{script.onload=ok;script.onerror=()=>fail(Error('No se pudo cargar el reproductor.'));document.head.appendChild(script)});
 estado.textContent='Descargando los primeros archivos…';
 let bytes=await datos();estado.textContent='Preparando la ciudad…';barra.removeAttribute('value');
 await createUnityInstance(canvas,{dataUrl:'Build/RegionModular.data.unityweb',valoriaLoadData:()=>{const result=bytes;bytes=null;return Promise.resolve(result)},codeUrl:'Build/RegionModular.wasm.unityweb',frameworkUrl:'Build/RegionModular.framework.js.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Eldoria',productName:'Valoria · Región 1 experimental',productVersion:'1.0',devicePixelRatio:Math.min(devicePixelRatio,1.5)});
 document.getElementById('carga').style.display='none';
}
iniciar().catch(fallo);
</script></body></html>
